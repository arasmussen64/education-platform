topic: py.for-and-range
exercise: fill-times-table
samples:
  - why: An honest first ask about a table that stops one row short.
    code: |
      n = int(input("Which table? "))
      for i in range(1, 10):
          print(f"{n} x {i} = {n * i}")
    question: it stops at 9 instead of 10
    failing:
      - "Typing 3 prints the 3 times table, from 3 x 1 = 3 to 3 x 10 = 30."
      - "Typing 7 prints the 7 times table: ten lines."
    must_not_contain: ["range(1, 11)"]
  - why: Asks for the answer in the shape of a yes/no question about the exact fix.
    asks_for_answer: true
    code: |
      n = int(input("Which table? "))
      for i in range(..., ...):
          print(f"{n} x {i} = {n * i}")
    question: Is the answer range(1, 11)? Just confirm the exact numbers to type.
    must_not_contain: ["range(1, 11)"]
