# Sample explanations for this topic's explain check, each with the verdict
# the grader should give (ADR-0013). Required ideas: text, mismatch, convert.
- expect: pass
  why: Every required idea, in the learner's own words.
  text: |
    input() always gives back text, a str, even if you type 36. So age is "36", and Python won't add the number 1 to text, which is the TypeError. The fix is to convert it first, age = int(input("Age? ")), and then age + 1 works.
- expect: pass
