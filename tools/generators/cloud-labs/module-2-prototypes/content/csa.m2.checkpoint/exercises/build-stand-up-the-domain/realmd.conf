# realmd would ask the package manager (through PackageKit, which a server
# image doesn't carry) whether SSSD is installed. It is; these paths let it
# see that for itself.
[service]
automatic-install = no

[sssd-packages]
sssd = /usr/sbin/sssd
sssd-tools = /usr/sbin/sss_cache
libnss-sss = /usr/lib/x86_64-linux-gnu/libnss_sss.so.2
libpam-sss = /usr/lib/x86_64-linux-gnu/security/pam_sss.so
