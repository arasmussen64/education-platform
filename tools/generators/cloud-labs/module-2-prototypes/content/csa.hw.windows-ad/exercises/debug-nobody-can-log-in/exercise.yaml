id: debug-nobody-can-log-in
stage: debug
runtime: lab
lab:
  init: systemd
rev: 1
title: "Nobody from the domain can log in"
prompt: |
  `lab` has been a member of the shop's domain, `ad.shop.test`, for months. Members of the domain group `linux-admins` (`alice`, password `Alice-Pass-1`, and `carol`, `Carol-Pass-1`) log in over SSH with their domain passwords; nobody else in the domain may, and `bob` (`Bob-Pass-1`) never could. Local accounts log in as before.

  Since Monday no domain account can log in at all. Three separate things are wrong. Find them from the evidence and fix them, so that it works as it did, and leave everything as strict as it was meant to be: the same people kept out, dc1 untouched in what it accepts, and nothing about dc1 typed into a hosts file or a Kerberos config.

  The domain's administrator is `Administrator` (`Shop-Admin-1`). `on-dc COMMAND` runs a command on dc1, which is at 10.0.9.10.
skills: [dc-discovery, kerberos-tickets, domain-join]
