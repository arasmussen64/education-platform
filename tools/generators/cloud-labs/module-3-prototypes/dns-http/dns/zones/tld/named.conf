// tld: authoritative only. Its own directory, its own address.
include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
options {
    directory "/var/lib/lab/dns/tld";
    pid-file "/var/lib/lab/dns/tld/named.pid";
    session-keyfile "/var/lib/lab/dns/tld/session.key";
    listen-on { 10.0.9.12; 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
    allow-transfer { none; };
};
zone "test" { type primary; file "db.test"; dnssec-policy default; inline-signing yes; key-directory "keys"; };
