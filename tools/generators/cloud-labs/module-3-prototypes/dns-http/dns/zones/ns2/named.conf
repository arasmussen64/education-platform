// ns2: authoritative only. Its own directory, its own address.
include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
options {
    directory "/var/lib/lab/dns/ns2";
    pid-file "/var/lib/lab/dns/ns2/named.pid";
    session-keyfile "/var/lib/lab/dns/ns2/session.key";
    listen-on { 10.0.9.14; 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
    allow-transfer { none; };
};
zone "shop.test" { type secondary; primaries { 10.0.9.13; }; file "db.shop.test.from-ns1"; };
