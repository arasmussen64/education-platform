server:
  interface: 10.0.9.20
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 allow
  username: ""
  chroot: ""
  pidfile: ""
  root-hints: /etc/lab/dns/root.hints
  trust-anchor-file: /var/lib/lab/dns/root.ds
  val-log-level: 2
  ede: yes
  verbosity: 1
  use-syslog: no
  logfile: ""
remote-control:
  control-enable: yes
  control-use-cert: no
  control-interface: 10.0.9.20
