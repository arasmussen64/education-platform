global
  log stdout format raw local0
  stats socket /run/haproxy/admin.sock mode 660 level admin
defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 10s
  timeout server 5s
frontend api
  bind :80
  default_backend apis
backend apis
  source 10.20.0.79
  balance roundrobin
  option httpchk GET /health
  server api1 10.20.0.11:80 check inter 2s
  server api2 10.20.0.12:80 check inter 2s
  server api3 10.20.0.13:80 check inter 2s
