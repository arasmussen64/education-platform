// ns1: the shop's primary name server for shop.test. Authoritative only.
options {
  directory "/var/cache/bind";
  recursion no;
  allow-query { any; };
  listen-on { any; };
  listen-on-v6 { none; };
  dnssec-validation no;
  pid-file "/run/named/named.pid";
  notify yes;
};
logging {
  channel default { stderr; severity info; print-time no; print-category yes; };
  category default { default; };
  category xfer-out { default; };
  category notify { default; };
  category security { default; };
};
include "/etc/bind/zone.conf";
