frr version 8.4.4
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip route 10.30.0.0/25 10.0.99.2
!
router bgp 65010
 bgp router-id 10.0.12.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 10.0.12.2 remote-as 65020
 neighbor 10.0.12.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.10.0.0/24
  neighbor 10.0.12.2 route-map FROM-DC in
  neighbor 10.0.12.2 route-map TO-DC out
 exit-address-family
exit
!
ip prefix-list OFFICE seq 5 permit 10.10.0.0/24
ip prefix-list SHOP seq 5 permit 10.20.0.0/24
ip prefix-list SHOP seq 10 permit 10.30.0.0/24
!
route-map FROM-DC permit 10
 match ip address prefix-list SHOP
exit
!
route-map TO-DC permit 10
 match ip address prefix-list OFFICE
exit
!
line vty
!
