// ns2: the shop's secondary name server for shop.test, in the cloud since
// October. It copies the zone from ns1 and answers for it.
options {
  directory "/var/cache/bind";
  recursion no;
  allow-query { any; };
  allow-transfer { none; };
  listen-on { any; };
  listen-on-v6 { none; };
  dnssec-validation no;
  pid-file "/run/named/named.pid";
};
logging {
  channel default { stderr; severity info; print-time no; print-category yes; };
  category default { default; };
  category xfer-in { default; };
  category notify { default; };
};
include "/etc/bind/zone.conf";
