// An authoritative-only name server: it answers for its own zone and
// never looks anything up for anyone.
options {
  directory "/var/cache/bind";
  recursion no;
  allow-query { any; };
  listen-on { any; };
  listen-on-v6 { any; };
  dnssec-validation no;
  pid-file "/run/named/named.pid";
};
include "/etc/bind/zone.conf";
