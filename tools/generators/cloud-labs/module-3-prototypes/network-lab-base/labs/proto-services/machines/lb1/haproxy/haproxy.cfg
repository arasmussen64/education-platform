global
  log stdout format raw local0
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 10s
  timeout server 10s

frontend www
  bind :::80 v4v6
  default_backend web

backend web
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server web1 10.20.0.11:80 check inter 1s fall 2 rise 2
  server web2 10.20.0.12:80 check inter 1s fall 2 rise 2
