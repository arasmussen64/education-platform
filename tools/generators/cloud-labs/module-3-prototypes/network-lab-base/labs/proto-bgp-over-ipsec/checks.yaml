# Prototype checks for the network-lab base. Every check reads the network's
# real state: the kernel's IPsec SAs, FRR's own answers, a probe from a host,
# a capture on the internet's router. None reads a file the learner wrote,
# except "saved", which compares FRR's file with FRR's running state.
checks:
  - id: tunnel-up
    description: "vpn-a and vpn-b have an IPsec tunnel between their public addresses, in both directions."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      sas() { on vpn-a ip xfrm state | grep -c '^src \(198.51.100.2 dst 203.0.113.2\|203.0.113.2 dst 198.51.100.2\)$'; }
      wait_for 15 test "$(sas)" -ge 2
      [ "$(sas)" -ge 2 ] || { echo "vpn-a has no IPsec SAs to and from 203.0.113.2"; exit 0; }
      echo "tunnel up"
    expect:
      equals: "tunnel up"
  - id: bgp-up
    description: "vpn-a has a BGP session with the cloud's gateway, 169.254.10.2 in AS 64512, inside the tunnel."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      state() { frr vpn-a 'show bgp neighbors 169.254.10.2 json' | json "d['169.254.10.2']['bgpState']"; }
      wait_for 30 test "$(state)" = Established
      echo "$(state) $(frr vpn-a 'show bgp neighbors 169.254.10.2 json' | json "d['169.254.10.2']['remoteAs']")"
    timeout: 45
    expect:
      equals: "Established 64512"
  - id: learned-by-bgp
    description: "vpn-a reaches the cloud's network, 10.2.0.0/24, by a route it learned over BGP through the tunnel."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      wait_for 5 sh -c "on vpn-a vtysh -c 'show ip route 10.2.0.0/24 json' | grep -q '\"bgp\"'"
      frr vpn-a 'show ip route 10.2.0.0/24 json' | json "[(r['protocol'], [n.get('interfaceName') for n in r['nexthops']]) for r in d['10.2.0.0/24'] if r.get('selected')]"
    expect:
      equals: '[["bgp", ["gre1"]]]'
  - id: hosts-reach
    description: "host-a, in the shop, reaches host-b, in the cloud."
    command: on host-a ping -c 2 -W 1 10.2.0.10 > /dev/null && echo reached
    expect:
      equals: reached
  - id: encrypted
    description: "Between the shop and the cloud, the internet carries only encrypted traffic: a ping from host-a to host-b crosses it as ESP."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      seen=$(capture isp eth1 'host 198.51.100.2 and not port 500 and not port 4500' 4 -- on host-a ping -c 3 -W 1 10.2.0.10)
      esp=$(echo "$seen" | grep -c ' ESP(')
      plain=$(echo "$seen" | grep -c -E 'ICMP|GRE')
      [ "$plain" -eq 0 ] || { echo "the internet saw $plain packets in the clear"; exit 0; }
      [ "$esp" -ge 3 ] || { echo "the internet saw no ESP for the ping"; exit 0; }
      echo encrypted
    timeout: 20
    expect:
      equals: encrypted
  - id: saved
    description: "vpn-a's running FRR configuration is saved, so a restart brings the same routing back."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      frr_saved vpn-a && echo saved
    expect:
      equals: saved
  - id: cloud-side-untouched
    description: "The cloud's gateway and the network are as they were: only vpn-a was changed."
    command: /usr/local/lib/netlab/netlab intact
    expect:
      equals: intact
