#!/usr/sbin/nft -f
# edge: the office's NAT. IPv4 from the office leaves with edge's public
# address; TCP and UDP from a deliberately small range of ports (a port
# range needs a transport protocol to apply to). IPv6 is routed as is.
flush ruleset
table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ip saddr 10.10.0.0/24 oifname "eth0" meta l4proto { tcp, udp } snat to 198.51.100.1:40000-40099
    ip saddr 10.10.0.0/24 oifname "eth0" snat to 198.51.100.1
  }
}
