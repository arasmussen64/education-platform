frr defaults traditional
hostname cloud
log syslog informational
!
router bgp 65100
 bgp router-id 203.0.113.1
 timers bgp 3 9
 neighbor 192.0.2.9 remote-as 65010
 neighbor 192.0.2.9 timers connect 5
 neighbor 192.0.2.13 remote-as 65020
 neighbor 192.0.2.13 timers connect 5
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.9 route-map ALLOW in
  neighbor 192.0.2.9 route-map ALLOW out
  neighbor 192.0.2.13 route-map ALLOW in
  neighbor 192.0.2.13 route-map ALLOW out
 exit-address-family
exit
!
route-map ALLOW permit 10
exit
!
