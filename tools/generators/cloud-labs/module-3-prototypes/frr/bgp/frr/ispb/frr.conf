frr defaults traditional
hostname ispb
log syslog informational
!
router bgp 65020
 bgp router-id 192.0.2.6
 timers bgp 3 9
 neighbor 192.0.2.5 remote-as 65001
 neighbor 192.0.2.5 timers connect 5
 neighbor 192.0.2.14 remote-as 65100
 neighbor 192.0.2.14 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 192.0.2.5 route-map ALLOW in
  neighbor 192.0.2.5 route-map ALLOW out
  neighbor 192.0.2.14 route-map ALLOW in
  neighbor 192.0.2.14 route-map ALLOW out
 exit-address-family
exit
!
route-map ALLOW permit 10
exit
!
