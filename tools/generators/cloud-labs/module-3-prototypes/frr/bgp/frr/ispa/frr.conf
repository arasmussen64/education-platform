frr defaults traditional
hostname ispa
log syslog informational
!
router bgp 65010
 bgp router-id 192.0.2.2
 timers bgp 3 9
 neighbor 192.0.2.1 remote-as 65001
 neighbor 192.0.2.1 timers connect 5
 neighbor 192.0.2.10 remote-as 65100
 neighbor 192.0.2.10 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 192.0.2.1 route-map ALLOW in
  neighbor 192.0.2.1 route-map ALLOW out
  neighbor 192.0.2.10 route-map ALLOW in
  neighbor 192.0.2.10 route-map ALLOW out
 exit-address-family
exit
!
route-map ALLOW permit 10
exit
!
