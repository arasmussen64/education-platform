# Each router runs in the lab's namespace of its name (watchfrr --netns, set in
# its daemons file) and with a hostname of its own (its own UTS namespace), so
# its prompt, its config and what its BGP peers call it are its own name.
[Unit]
After=lab-network.service
Requires=lab-network.service
[Service]
ExecStart=
ExecStart=/usr/bin/unshare --uts /bin/sh -c 'hostname %I && domainname "(none)" && exec /usr/lib/frr/frrinit.sh start %I'
