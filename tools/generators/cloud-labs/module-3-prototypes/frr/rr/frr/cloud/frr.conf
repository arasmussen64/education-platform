frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
router bgp 64512
 bgp router-id 10.100.0.1
 timers bgp 3 9
 neighbor 169.254.10.1 remote-as 65001
 neighbor 169.254.10.1 timers connect 5
 address-family ipv4 unicast
  network 10.100.0.0/16
  neighbor 169.254.10.1 route-map ALL in
  neighbor 169.254.10.1 route-map ALL out
 exit-address-family
exit
route-map ALL permit 10
exit
