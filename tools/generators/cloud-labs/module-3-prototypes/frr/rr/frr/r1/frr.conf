frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip route 10.0.23.0/30 10.0.12.2
ip route 10.1.30.0/24 10.0.12.2
router bgp 65001
 bgp router-id 10.0.12.1
 timers bgp 3 9
 neighbor 169.254.10.2 remote-as 64512
 neighbor 169.254.10.2 timers connect 5
 neighbor 10.0.12.2 remote-as 65001
 neighbor 10.0.12.2 timers connect 5
 address-family ipv4 unicast
  network 10.1.30.0/24
  neighbor 169.254.10.2 route-map ALL in
  neighbor 169.254.10.2 route-map ALL out
  neighbor 10.0.12.2 next-hop-self
 exit-address-family
exit
route-map ALL permit 10
exit
