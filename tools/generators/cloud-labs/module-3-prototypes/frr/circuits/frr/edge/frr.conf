frr defaults traditional
hostname edge
log syslog informational
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 10.1.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.10.2 remote-as 64512
 neighbor 169.254.10.2 timers connect 5
 neighbor 169.254.20.2 remote-as 64512
 neighbor 169.254.20.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  neighbor 169.254.10.2 route-map DX-IN in
  neighbor 169.254.10.2 route-map DX-OUT out
  neighbor 169.254.20.2 route-map DX-IN in
  neighbor 169.254.20.2 route-map DX-OUT out
 exit-address-family
exit
!
ip prefix-list OURS seq 5 permit 10.1.0.0/24
!
route-map DX-IN permit 10
exit
!
route-map DX-OUT permit 10
 match ip address prefix-list OURS
exit
!
