frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
router bgp 64512
 bgp router-id 10.100.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.10.1 remote-as 65001
 neighbor 169.254.10.1 timers connect 5
 neighbor 169.254.20.1 remote-as 65001
 neighbor 169.254.20.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.100.0.0/16
  neighbor 169.254.10.1 route-map FROM-CUSTOMER in
  neighbor 169.254.10.1 route-map TO-CUSTOMER out
  neighbor 169.254.20.1 route-map FROM-CUSTOMER in
  neighbor 169.254.20.1 route-map TO-CUSTOMER out
 exit-address-family
exit
!
bgp community-list standard PREF-LOW seq 5 permit 64512:7100
bgp community-list standard PREF-HIGH seq 5 permit 64512:7300
!
route-map FROM-CUSTOMER permit 10
 match community PREF-HIGH
 set local-preference 300
exit
!
route-map FROM-CUSTOMER permit 20
 match community PREF-LOW
 set local-preference 100
exit
!
route-map FROM-CUSTOMER permit 30
 set local-preference 200
exit
!
route-map TO-CUSTOMER permit 10
exit
!
