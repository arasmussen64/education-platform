frr defaults traditional
hostname cloud-gw
!
ip prefix-list VPC seq 5 permit 10.20.0.0/16
ip prefix-list BRANCH seq 5 permit 192.168.0.0/16 le 24
route-map TO-BRANCH permit 10
 match ip address prefix-list VPC
route-map FROM-BRANCH permit 10
 match ip address prefix-list BRANCH
!
router bgp 64512
 bgp router-id 203.0.113.10
 neighbor 169.254.21.2 remote-as 65010
 neighbor 169.254.21.2 timers 10 30
 address-family ipv4 unicast
  network 10.20.0.0/16
  neighbor 169.254.21.2 route-map TO-BRANCH out
  neighbor 169.254.21.2 route-map FROM-BRANCH in
 exit-address-family
!
