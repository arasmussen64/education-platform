global
	log /dev/log	local0
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon
defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
	timeout connect 5s
	timeout client  50s
	timeout server  50s
frontend shop
	bind 10.0.9.1:80
	default_backend web
backend web
	balance roundrobin
	option httpchk GET /health
	http-check expect status 200
	default-server inter 2s fall 3 rise 2
	server web1 10.0.1.11:8080 check
	server web2 10.0.1.12:8080 check
	server web3 10.0.1.13:8080 check
