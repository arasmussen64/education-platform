# The cloud's side of the VPN (scenery). It answers the shop's gateway and
# never starts the tunnel itself (its firewall refuses unencrypted GRE). It
# protects the GRE tunnel between
# the two gateways' public addresses, so every route over gre1 is encrypted.
connections {
  shop {
    version = 2
    local_addrs = 203.0.113.2
    remote_addrs = 198.51.100.2
    proposals = aes256-sha256-modp2048
    dpd_delay = 10s
    local {
      auth = psk
      id = 203.0.113.2
    }
    remote {
      auth = psk
      id = 198.51.100.2
    }
    children {
      shop-vti {
        local_ts = 0.0.0.0/0
        remote_ts = 0.0.0.0/0
        mode = tunnel
        mark_in = 7
        mark_out = 7
        esp_proposals = aes256gcm16-modp2048
        start_action = none
        dpd_action = clear
      }
    }
  }
}
secrets {
  ike-shop {
    id-1 = 203.0.113.2
    id-2 = 198.51.100.2
    secret = "lab-shared-secret-42"
  }
}
