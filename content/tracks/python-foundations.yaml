id: python-foundations
title: Python Foundations
summary: From your first line of code to small, real programs you can build from a blank file.
order: 1
modules:
  - id: py.m1
    title: First programs
    topics: [py.programs-and-print, py.values-and-types, py.variables, py.arithmetic, py.strings-and-input]
    checkpoint: py.m1.checkpoint
  - id: py.m2
    title: Decisions and debugging
    topics: [py.booleans-and-comparisons, py.if-elif-else, py.logical-operators, py.tracing-code, py.reading-errors]
    checkpoint: py.m2.checkpoint
  - id: py.m3
    title: Loops
    topics: [py.while-loops, py.for-and-range, py.accumulator-patterns, py.strings-as-sequences, py.nested-loops]
    checkpoint: py.m3.checkpoint
  - id: py.m4
    title: Functions
    topics: [py.defining-functions, py.return-values, py.scope-and-call-stack, py.decomposition, py.testing-with-assert]
    checkpoint: py.m4.checkpoint
  - id: py.m5
    title: Collections
    topics: [py.lists, py.list-algorithms, py.references-and-mutation, py.dictionaries, py.nested-data]
    checkpoint: py.m5.checkpoint
  - id: py.m6
    title: Real programs
    topics: [py.exceptions, py.files, py.csv-data, py.modules-and-libraries, py.spec-to-program]
    checkpoint: py.m6.checkpoint
