# /etc/postgresql/16/main/conf.d/lab.conf: the one setting the lab changes.
# A lab machine is never shut down cleanly (Docker stops it with a kill), so
# PostgreSQL recovers at every boot, and by default it first syncs every
# file of its data folder one by one: 3 s at one restart on Docker Desktop
# (2026-11-22; the designer's prototype saw 20 s). syncfs asks the kernel
# to sync the whole filesystem once instead: under 0.1 s.
recovery_init_sync_method = syncfs
