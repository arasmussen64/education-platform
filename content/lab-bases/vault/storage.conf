# /etc/containers/storage.conf: where podman keeps images on the lab machine.
# The lab machine is itself a container whose disk is an overlay
# filesystem, and podman's usual driver, overlay, can't stack on one
# ("'overlay' is not supported over overlayfs"). vfs keeps every layer as a
# plain folder: slower and bigger, which doesn't matter for the labs' small
# images, and it needs nothing from the kernel.
[storage]
driver = "vfs"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"
