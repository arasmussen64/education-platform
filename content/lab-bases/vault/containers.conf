# /etc/containers/containers.conf: how podman runs a container, and a build
# step, on the lab machine.
[containers]
# They share the lab machine's network instead of getting one of their own,
# so a build step reaches a server on this machine at 127.0.0.1, and podman
# needs no bridge, virtual cable or firewall rule from the kernel. (Docker
# and podman on a real server give each container its own network.)
netns = "host"
# No AppArmor profile. The lab machine has no AppArmor tools to load one
# with, and Docker Desktop's kernel has no AppArmor at all; a CI runner's
# kernel has it, so podman is told plainly not to look for a profile.
apparmor_profile = "unconfined"
