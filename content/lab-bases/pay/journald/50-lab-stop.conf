# Part of the lab (content/lab-bases/pay). Every journal namespace's
# journald stops the way a crash does, with a kill. On systemd
# 255.4-1ubuntu8 a sealed journal file that journald closed cleanly and
# opens again fails verification ("Epoch sequence not continuous"); after a
# kill it starts a new file, and every seal verifies. A real server has no
# need of this file.
[Service]
KillSignal=SIGKILL
