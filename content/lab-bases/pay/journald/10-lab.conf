# Part of the lab (content/lab-bases/pay). A privileged container reads the
# kernel log of the whole machine Docker runs on, so without ReadKMsg=no
# this journal fills with other labs' kernel messages. And the default
# journal is never sealed here: a sealed journal that journald closes
# cleanly no longer verifies on this systemd (the README says more), so
# sealing is kept to a journal namespace, which the lab stops with a kill.
[Journal]
ReadKMsg=no
Seal=no
