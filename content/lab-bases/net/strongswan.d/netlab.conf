# The network labs' settings for strongSwan's charon, copied to every machine
# that runs strongSwan (its /etc/strongswan.d/netlab.conf). A lab's own
# strongswan.d files sit beside this one.
charon {
    # Routes come from FRR or the machine's network file, never from charon:
    # with a route-based tunnel (VTI) and 0.0.0.0/0 selectors, charon's own
    # routes would send everything into the tunnel (strongSwan's
    # route-based VPN page asks for this).
    install_routes = no
    plugins {
        # The forecast plugin makes a VTI drop every packet that arrives
        # (XfrmInTmplMismatch, found by the Module 3 critic, 2026-11-11).
        # strongswan-pki brings it (libcharon-extra-plugins), and its own
        # charon/forecast.conf says load = yes; this file is read after
        # that one, so this wins.
        forecast {
            load = no
        }
    }
}
