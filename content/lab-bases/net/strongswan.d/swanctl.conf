# The plugins swanctl loads. Without this list, every swanctl command on
# Ubuntu 24.04 first prints about a dozen "plugin ... failed to load" lines,
# for plugins of packages the base doesn't install (from the IPsec
# designer's prototype, Module 3).
swanctl {
    load = pem pkcs1 pkcs8 x509 revocation constraints pubkey openssl random
}
