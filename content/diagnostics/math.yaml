# The math diagnostic (ADR-0021): a ladder of levels from arithmetic to the
# first ideas of calculus, the math the machine-learning track leans on. The
# placement test walks it the way it walks a track: a few questions at a
# level, and the answers rule out half of what's left. Each level says where
# to refresh it: `topic` is the Module 1 topic of the Machine Learning
# Foundations track that teaches it, which the results page links once the
# learner can open it, and `refresh` is an outside page for when they can't
# yet.
#
# Every item is original. The page shows the choices in a shuffled order
# (web/src/components/scramble.ts), so an explanation never names a choice by
# its position.
id: math
title: Math for machine learning
summary: >-
  Where your math is solid and where to refresh it before the machine-learning
  track: arithmetic, algebra, functions, exponents and logarithms, probability
  and statistics, vectors and matrices, and the first ideas of calculus.
levels:
  - id: arithmetic
    topic: ml.math.arithmetic
    title: Arithmetic, fractions and percentages
    summary: Fractions, decimals, percentages, negative numbers and the order of operations.
    refresh:
      title: "Khan Academy: Arithmetic"
      url: https://www.khanacademy.org/math/arithmetic
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: arithmetic-fractions
        type: mcq
        rev: 1
        prompt: What is 3/4 + 1/8?
        choices: ["4/12", "7/8", "5/8", "1/2"]
        answer: 1
        explanation: >-
          Fractions add once they share a denominator: 3/4 is 6/8, and 6/8 + 1/8
          is 7/8. Adding the tops and the bottoms separately (4/12) is the
          classic slip.
      - id: arithmetic-percent
        type: mcq
        rev: 1
        prompt: A jacket costs $80 and is 25% off. What do you pay?
        choices: ["$20", "$75", "$60", "$55"]
        answer: 2
        explanation: >-
          25% of 80 is 20, so you pay 80 − 20 = 60. The same thing in one step:
          paying 75% of the price is 80 × 0.75 = 60.
      - id: arithmetic-order
        type: mcq
        rev: 1
        prompt: What is 2 + 3 × 4?
        choices: ["14", "20", "24", "9"]
        answer: 0
        explanation: >-
          Multiplication comes before addition, so 3 × 4 = 12 first, then
          2 + 12 = 14. Reading left to right gives 20, which is the common
          mistake.

  - id: algebra
    topic: ml.math.algebra
    title: Algebra
    summary: Solving linear equations, simplifying expressions and the rules of exponents.
    refresh:
      title: "Khan Academy: Algebra 1"
      url: https://www.khanacademy.org/math/algebra
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: algebra-solve
        type: mcq
        rev: 1
        prompt: "Solve for x: 3x − 7 = 11"
        choices: ["x = 4/3", "x = 18", "x = −6", "x = 6"]
        answer: 3
        explanation: >-
          Undo what was done to x, in reverse order: add 7 to both sides
          (3x = 18), then divide both sides by 3 (x = 6).
      - id: algebra-simplify
        type: mcq
        rev: 1
        prompt: "Simplify: 2(x + 3) − x"
        choices: ["x + 6", "x + 3", "2x + 6", "x + 5"]
        answer: 0
        explanation: >-
          Multiply out first: 2(x + 3) is 2x + 6. Taking away x leaves x + 6.
      - id: algebra-exponents
        type: mcq
        rev: 1
        prompt: Which is equal to x² · x³?
        choices: ["x⁶", "2x⁵", "x⁵", "x⁹"]
        answer: 2
        explanation: >-
          x² · x³ is (x · x) · (x · x · x), five x's multiplied together, so
          x⁵. Multiplying powers of the same base adds the exponents; it
          doesn't multiply them.

  - id: functions
    topic: ml.math.functions
    title: Functions and graphs
    summary: Reading a function, a line's slope and intercept, and putting one function inside another.
    refresh:
      title: "Khan Academy: College Algebra"
      url: https://www.khanacademy.org/math/college-algebra
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: functions-evaluate
        type: mcq
        rev: 1
        prompt: If f(x) = 2x + 1, what is f(3)?
        choices: ["5", "6", "9", "7"]
        answer: 3
        explanation: >-
          Put 3 wherever x appears: 2 × 3 + 1 = 7.
      - id: functions-line
        type: mcq
        rev: 1
        prompt: "The line y = 3x − 2: how steep is it, and where does it cross the y-axis?"
        choices:
          - "Slope 3; it crosses at y = −2"
          - "Slope −2; it crosses at y = 3"
          - "Slope 3; it crosses at y = 2"
          - "Slope 1/3; it crosses at y = −2"
        answer: 0
        explanation: >-
          In y = mx + b, m is the slope (how much y rises for each step in x)
          and b is where the line crosses the y-axis, at x = 0. Here m = 3 and
          b = −2.
      - id: functions-compose
        type: mcq
        rev: 1
        prompt: If f(x) = x² and g(x) = x + 1, what is f(g(2))?
        choices: ["5", "9", "4", "3"]
        answer: 1
        explanation: >-
          Work from the inside out: g(2) = 3, then f(3) = 9. The other order,
          g(f(2)), would give 4 + 1 = 5.

  - id: exponents-and-logs
    topic: ml.math.exponents-and-logs
    title: Exponents and logarithms
    summary: Negative and fractional exponents, what a logarithm is, and the rule for the log of a product.
    refresh:
      title: "Khan Academy: Algebra 2"
      url: https://www.khanacademy.org/math/algebra2
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: logs-evaluate
        type: mcq
        rev: 1
        prompt: What is log₂ 32?
        choices: ["16", "4", "5", "64"]
        answer: 2
        explanation: >-
          log₂ 32 asks "2 to what power is 32?" Since 2⁵ = 32, the answer is 5.
      - id: logs-product
        type: mcq
        rev: 1
        prompt: Which is equal to log(a · b)?
        choices: ["log a · log b", "log a + log b", "log a − log b", "log a / log b"]
        answer: 1
        explanation: >-
          A logarithm turns multiplication into addition: log(a · b) =
          log a + log b. That's why machine learning adds log-probabilities
          instead of multiplying tiny probabilities.
      - id: exponents-negative
        type: mcq
        rev: 1
        prompt: What is 10⁻²?
        choices: ["−100", "0.1", "−20", "0.01"]
        answer: 3
        explanation: >-
          A negative exponent means "one over": 10⁻² = 1 / 10² = 1/100 = 0.01.
          It's small, not negative.

  - id: probability-and-statistics
    topic: ml.math.probability-and-statistics
    title: Probability and statistics
    summary: Mean and median, the probability of two things both happening, and why base rates matter.
    refresh:
      title: "Khan Academy: Statistics and probability"
      url: https://www.khanacademy.org/math/statistics-probability
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: stats-mean-median
        type: mcq
        rev: 1
        prompt: "For the numbers 2, 4, 4, 10: what are the mean and the median?"
        choices:
          - "Mean 4, median 5"
          - "Mean 5, median 4"
          - "Mean 5, median 7"
          - "Mean 4, median 4"
        answer: 1
        explanation: >-
          The mean is the total divided by the count: 20 / 4 = 5. The median is
          the middle value once sorted; with four numbers it's the average of
          the middle two, (4 + 4) / 2 = 4. The 10 pulls the mean up but not
          the median.
      - id: probability-two-dice
        type: mcq
        rev: 1
        prompt: You roll two fair dice. What is the probability that both show a 6?
        choices: ["1/6", "2/6", "1/12", "1/36"]
        answer: 3
        explanation: >-
          The dice don't affect each other, so the probabilities multiply:
          1/6 × 1/6 = 1/36. Adding them (2/6) would be the chance of... nothing
          meaningful here; adding is for "either, not both" of events that
          can't both happen.
      - id: probability-base-rate
        type: mcq
        rev: 1
        prompt: >-
          1 in 100 people has a condition. A test catches it 90% of the time
          when someone has it, and wrongly says "positive" 10% of the time when
          they don't. Among the people who test positive, are more of them
          healthy or ill?
        choices:
          - "More are ill: the test is right 90% of the time"
          - "Exactly half and half"
          - "More are healthy: 10% of the 99 healthy people outnumber 90% of the 1 ill person"
          - "It can't be worked out from this"
        answer: 2
        explanation: >-
          Picture 1,000 people: 10 are ill and about 9 of them test positive;
          990 are healthy and about 99 of them test positive too. So 99 of the
          108 positives are healthy. The rarer the condition, the more a
          positive result is a false alarm. This is the base-rate effect, and
          it's the heart of Bayes' rule.

  - id: vectors-and-matrices
    topic: ml.math.vectors-and-matrices
    title: Vectors and matrices
    summary: Adding and scaling vectors, the dot product, and which matrices can be multiplied.
    refresh:
      title: "Khan Academy: Linear algebra"
      url: https://www.khanacademy.org/math/linear-algebra
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: vectors-dot
        type: mcq
        rev: 1
        prompt: What is the dot product of (1, 2, 3) and (4, 5, 6)?
        choices: ["(4, 10, 18)", "32", "21", "90"]
        answer: 1
        explanation: >-
          Multiply matching entries and add them up: 1×4 + 2×5 + 3×6 =
          4 + 10 + 18 = 32. The dot product is a single number, not a vector.
      - id: matrices-shape
        type: mcq
        rev: 1
        prompt: A is a 2×3 matrix and B is a 3×4 matrix. What is the shape of the product AB?
        choices: ["3×3", "They can't be multiplied", "4×2", "2×4"]
        answer: 3
        explanation: >-
          Two matrices multiply when the inner sizes match (3 and 3 here), and
          the result takes the outer sizes: 2×4. Every layer of a neural
          network is a multiplication like this, which is why shapes matter so
          much in ML code.
      - id: vectors-combine
        type: mcq
        rev: 1
        prompt: What is (2, −1) + 3 · (1, 4)?
        choices: ["(5, 11)", "(3, 3)", "(5, 3)", "(9, 9)"]
        answer: 0
        explanation: >-
          Scaling multiplies each entry, so 3 · (1, 4) = (3, 12). Adding goes
          entry by entry: (2 + 3, −1 + 12) = (5, 11).

  - id: calculus
    topic: ml.math.calculus
    title: The first ideas of calculus
    summary: The derivative as a rate of change, what its sign says, and the chain rule.
    refresh:
      title: "Khan Academy: Differential calculus"
      url: https://www.khanacademy.org/math/differential-calculus
      type: interactive
      use: link
      license: CC BY-NC-SA 3.0 US (linked, not copied)
    items:
      - id: calculus-power
        type: mcq
        rev: 1
        prompt: What is the derivative of x³?
        choices: ["x²", "3x", "3x²", "x⁴ / 4"]
        answer: 2
        explanation: >-
          The power rule: bring the exponent down as a multiplier and lower it
          by one, so x³ becomes 3x². (x⁴ / 4 is the integral, the reverse
          operation.)
      - id: calculus-sign
        type: mcq
        rev: 1
        prompt: If the derivative f′(x) is negative everywhere on an interval, what is f doing there?
        choices: ["Decreasing", "Increasing", "Staying constant", "Crossing zero"]
        answer: 0
        explanation: >-
          The derivative is the slope. A negative slope means f goes down as x
          goes right. Training a model is walking downhill on its loss: follow
          the negative of the derivative.
      - id: calculus-chain
        type: mcq
        rev: 1
        prompt: What is the derivative of (3x + 1)²?
        choices: ["2(3x + 1)", "6(3x + 1)", "3(3x + 1)²", "6x + 2"]
        answer: 1
        explanation: >-
          The chain rule: differentiate the outside, 2(3x + 1), then multiply
          by the derivative of the inside, 3, giving 6(3x + 1). Forgetting the
          inside's derivative gives 2(3x + 1). Backpropagation is the chain
          rule applied layer by layer.
