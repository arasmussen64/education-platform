id: mcq-rsa-2048-strength
type: mcq
rev: 1
prompt: |
  A certificate's key is RSA with 2,048 bits. How strong is that, by NIST's measure, and for how long is it acceptable?
choices:
  - "112 bits: acceptable today, and deprecated after 2030"
  - "2,048 bits: far stronger than AES-256 can ever be"
  - "128 bits: the same as AES-128 and the curve P-256"
  - "256 bits: twice the security strength of AES-128"
answer: 0
explanation: |
  Security strength counts the work to break a key, not the key's length: n bits means about 2^n tries. Breaking RSA means factoring a number, which is far easier than trying every key, so RSA needs long keys for little strength: 2,048 bits give 112 (NIST SP 800-57 Part 1, Table 2), and it takes RSA-3072 to match AES-128's 128. 112 bits is the least that is acceptable today, and NIST's transition plan (IR 8547, October 2026) deprecates RSA and elliptic-curve keys after 2030 and disallows them after 2035, whatever their size.

  A key's length in bits and its strength in bits are only the same number for a symmetric cipher such as AES.
skills: [key-strength]
