id: mcq-harvest-now
type: mcq
rev: 1
prompt: |
  No quantum computer that can break today's key exchange exists yet. Why are browsers and clouds changing key exchange to post-quantum algorithms now, ahead of signatures?
choices:
  - "Traffic recorded today can be decrypted once such a computer exists"
  - "Signatures already rest on quantum-safe hashes, so they are finished"
  - "Key exchange is the slower of the two, so it needs the head start"
  - "Browsers can't check a post-quantum signature until the year 2035"
answer: 0
explanation: |
  "Harvest now, decrypt later": someone can record encrypted traffic today and keep it. If the key exchange that protected it is broken in ten years, every recording opens then. Data that must stay secret that long is at risk already, so key exchange moves first, often as a hybrid of X25519 and ML-KEM in one handshake, which holds if either of the two does.

  A signature is checked at the moment it's used: a forged one is only possible once the quantum computer exists, so signatures can move later (but must, before then). Signatures aren't safe because they hash first: the private-key step is the part a quantum computer breaks. Speed and browser support aren't the reason.
skills: [key-strength]
