id: mcq-password-storage
type: mcq
rev: 1
prompt: |
  A new service will let customers sign in with a password. How should it store the passwords?
choices:
  - "As Argon2id hashes, each with a random salt of its own"
  - "As SHA-256 hashes, all with one site-wide salt added"
  - "Encrypted with AES-256-GCM under a key kept in a KMS"
  - "As HMAC-SHA256 values under one key kept in a KMS"
answer: 0
explanation: |
  People choose guessable passwords and use them again elsewhere, so a stolen table will be attacked by guessing. Argon2id is slow and needs a lot of memory on purpose (OWASP's minimum is 19 MiB and 2 passes), which turns billions of guesses a second into a handful. A salt, random and different for each password and stored beside the hash, makes the attacker start again for every account.

  SHA-256 is built to be fast, and one salt for the whole site lets one guess be tested against every account at once. Encrypting is the wrong tool: whoever gets the key gets every password back, and the service never needs them back, only to check a guess. An HMAC under a KMS key is fast too, and holds only as long as that one key does.
skills: [hash-mac-signature]
