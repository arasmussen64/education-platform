id: mcq-base64-secret
type: mcq
rev: 1
prompt: |
  A colleague wants to commit this Kubernetes Secret to the team's repository, "since the password in it isn't readable":

  ```
  apiVersion: v1
  kind: Secret
  metadata:
    name: db
  data:
    password: aHVudGVyMg==
  ```

  What is true of that value?
choices:
  - "Anyone who can read the file has the password: base64 is only an encoding"
  - "It is encrypted with the cluster's own key, so the file is safe to commit"
  - "It is a hash, so the password can't be worked back out from this value"
  - "It is safe unless the reader also holds the cluster's CA certificate"
answer: 0
explanation: |
  `echo aHVudGVyMg== | base64 -d` prints `hunter2`. base64 turns bytes into letters and digits so that binary values fit in a text file, and anyone can turn them back: there is no key. Kubernetes stores Secrets unencrypted in its data store by default (its own documentation says so, read 2026-11-22), and the base64 is only there because YAML can't hold raw bytes.

  Encryption needs a key and a hash can't be reversed at all; base64 has no key and reverses with one command. The cluster's CA certificate signs certificates and has nothing to do with this value. The trailing `=` signs are the giveaway that a value is base64.
skills: [choose-the-primitive]
