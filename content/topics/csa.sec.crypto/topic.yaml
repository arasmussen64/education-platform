prove:
  build: build-sealed-orders
  debug: debug-orders-wont-open
  explain:
    prompt: |
      A teammate says: "Our database disk is encrypted, so the card data is safe. For lookups we'll store a SHA-256 of each card number, and we'll encrypt the exports with one AES key that we keep in the config file." Explain, in your own words: what disk encryption does and doesn't protect against; what's wrong with hashing card numbers, and what to use instead; how you'd design the exports' encryption with a key management service, including who may read what, what happens when the key is rotated, and what an auditor can see; what authenticated encryption and a nonce are and why each matters; and how the three clouds' key services differ in how you'd do this.
    rubric:
      - id: layers
        required: true
        description: "Disk encryption protects a stolen disk or snapshot, and nothing else: anyone who can query the running database or the app reads the data as before. Encryption is worth what the control over its key is worth, and a key in a config file beside the data is no control."
      - id: hash-vs-mac
        required: true
        description: "A hash has no key, and a card number has few possible values, so hashing every candidate reverses the whole table quickly: a plain hash of guessable data is the data. Use a MAC (HMAC) under a key kept in a key service, so the values can't be computed without the key. (Passwords: a slow, salted hash such as Argon2id.)"
      - id: envelope
        required: true
        description: "Envelope encryption: a fresh data key for each export, used where the data is, with AES-GCM; the data key wrapped by a key that never leaves the KMS, and the wrapped key stored beside the export. The policy is the control: the program that writes exports may make data keys and not unwrap, the reader may unwrap, and every unwrap is in the KMS's log."
      - id: rotation
        required: true
        description: "Rotation adds a key version and changes no data and no data keys; old wrapped keys still open. To finish: rewrap the stored wrapped keys inside the KMS, and only then retire the old versions. Retiring first, or deleting the key, makes what it wrapped unreadable."
      - id: aead-nonce
        required: true
        description: "Encryption without authentication can be changed without the key (a flipped ciphertext bit flips the plaintext bit); authenticated encryption (AES-GCM) adds a tag and refuses a changed ciphertext. A nonce is the per-encryption starting value, never reused under one key; with random 96-bit nonces, at most 2^32 encryptions a key, which a key per object avoids."
      - id: clouds
        required: false
        description: "AWS KMS: GenerateDataKey returns the key both ways, ReEncrypt rewraps, rotation yearly once enabled. Azure Key Vault: you make the data key, wrapKey and unwrapKey, rotation policies, keep both versions enabled until services have rewrapped. Google Cloud KMS: generate the data key locally, Encrypt wraps up to 64 KiB, old versions stay until destroyed. All bill by the request."
    model_answer: |
      Disk encryption protects one thing: the disk itself, if it's stolen, thrown away or copied as a snapshot. The running database decrypts every block for anyone who can query it, so an attacker who gets in through the app, or a curious admin, reads the card data exactly as before. Encryption is only as good as the control over who can use the key.

      Storing a SHA-256 of each card number hides nothing. A hash has no key, and a card number is guessable: once the digits that name the bank are known, few enough candidates are left that a laptop hashes them all in seconds. After that the table of hashes is a lookup table. For lookups I'd store an HMAC of the number under a key that lives in a key management service, which nobody can compute without the key.

      For the exports, one AES key in a config file means everyone who can read the file can read every export, and the key can never be changed. I'd use envelope encryption. Each export gets a fresh random data key; the export is encrypted with it on the spot, with AES-256-GCM; the KMS wraps the data key with a key that never leaves the KMS; and the wrapped key is stored beside the export. To read one, a program hands the wrapped key to the KMS, which checks its policy, unwraps it and logs the request. The job that writes exports gets a policy that lets it make data keys and nothing else, and the job that reads them gets unwrap and nothing else, so breaking into the writer doesn't open the archive. The auditor reads the KMS's log: every unwrap, by whom and when.

      Rotating the KMS key adds a new version. Nothing breaks, because old wrapped keys still open with their own version, but nothing old is protected by the new version either. So after rotating I'd have the KMS rewrap every stored data key, which happens inside it without the keys coming out, and only then retire the old versions. Doing it in the other order locks us out of whatever wasn't rewrapped.

      It must be authenticated encryption. Plain encryption hides data but lets someone flip bits in the ciphertext and change what it decrypts to, without the key; AES-GCM adds a tag and refuses anything that was changed. GCM also needs a nonce, a starting value that must never repeat under the same key; with random nonces that's at most 2^32 encryptions per key, and a data key per export never comes near it.

      On AWS, KMS's GenerateDataKey returns the data key both plain and wrapped, ReEncrypt rewraps, and rotation is yearly once switched on. On Azure, I'd make the data key myself and call Key Vault's wrapKey and unwrapKey, set a rotation policy, and keep both versions enabled until everything is rewrapped. On Google Cloud I'd also generate the key locally and have Cloud KMS's Encrypt wrap it; old versions stay until I destroy them. All three charge per request.
