id: csa.sec.crypto
kind: topic
status: ready
title: Applied cryptography
summary: "Using cryptography yourself, outside TLS: which tool for which job (symmetric, public-key, and the two together); what a hash, a MAC and a signature each prove, and how passwords are stored; why encryption needs authentication, and what a nonce is; envelope encryption with a key service, from data keys and policies to rotating, rewrapping and retiring a key, with the three clouds' key services side by side; and how strong a key is, and what quantum computers change."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections
# 2, 3, 4.2 and 5) and its designer's brief (csa.sec.crypto.md), with the
# vault base as it was built (content/lab-bases/vault/README.md).
# The plan's prerequisite is csa.sec.authn-authz, for policy, least
# privilege and separation of duties, which the key service half of this
# topic applies to a key. Through it and Checkpoint 3 the topic builds on
# csa.net.http-tls (symmetric and public-key encryption, key exchange,
# forward secrecy, cipher suite), csa.net.dns (a signature and a hash, one
# sentence each), csa.net.certificates (key pairs, the private key that
# never leaves), csa.net.ipsec (which names HMAC in its proposals),
# csa.net.layers (hex and bytes) and Module 1 (scripts, awk, sed, find,
# systemctl, journalctl, sudo).
# This topic defines, for the module (the plan's 3.5): plaintext,
# ciphertext, hash, MAC and HMAC, signature in full, salt, AEAD, nonce,
# hybrid and envelope encryption, data key, key encryption key, KMS, HSM,
# key version, rewrap, OpenBao and its transit engine, security strength
# and post-quantum cryptography. It is the first topic to use OpenBao, so
# its first lab carries the onboarding that Secrets and Checkpoint 4 point
# back to.
prerequisites: [csa.sec.authn-authz]
# Worked out: the lesson about 33 minutes (4,300 words with its tables, at
# 130 a minute), 20 practice quick questions at 1.5 each 30, then the
# worked example 35, the fill-in 25, the write 35, the build 50, the debug
# 40 and the explain 20: about 270, and the puzzle and the story about 5
# more. The plan's 305 counted 52 minutes of assigned reading, which is
# optional now (ADR-0031, step 3) and so left out.
estimated_minutes: 275
rev: 1
objectives:
  - "Choose the right tool for a job: a symmetric key for data, public-key cryptography for wrapping keys, signing and agreeing keys, and the two together almost always; say why nobody encrypts a file with RSA, and why an encoding such as base64 protects nothing."
  - "Tell a hash, a MAC and a signature apart by what each proves and who can make one, and pick the right one for a download, a webhook, a release, a stored password and a log that must not give away card numbers."
  - "Use authenticated encryption, show why encryption without it can be edited without the key, keep a nonce unique under a key, and work out when a key has done its 2^32 encryptions."
  - "Design and run envelope encryption with a key service: a data key for each object, wrapped by a key that never leaves the service; a policy that splits who seals from who opens; rotating, rewrapping and retiring key versions in that order; and how AWS KMS, Azure Key Vault and Google Cloud KMS differ and bill."
  - "Read a key's security strength in bits, do the brute-force arithmetic, and say what the post-quantum transition changes and what it leaves alone."
# Facts the lesson and the items rely on, each read on 2026-11-22 unless a
# line says otherwise:
# - AWS KMS Encrypt "Encrypts plaintext of up to 4,096 bytes"; RSA_2048
#   with RSAES_OAEP_SHA_256 190 bytes (SHA_1 214; RSA_3072 318, RSA_4096
#   446); GenerateDataKey returns "a plaintext data key and an encrypted
#   copy"; an encryption context is "additional authenticated data", needs
#   "an exact case-sensitive match" to decrypt, is "strongly recommended"
#   and "may be displayed in plaintext in CloudTrail logs":
#   docs.aws.amazon.com/kms/latest/APIReference/API_Encrypt.html
# - AWS KMS keys "never leave the AWS KMS FIPS 140-3 Security Level 3
#   validated hardware security modules unencrypted"; symmetric operations
#   are AES-GCM with 256-bit keys; envelope encryption defined; ML-DSA
#   (44, 65, 87) and ML-KEM (512, 768, 1024) key specs:
#   docs.aws.amazon.com/kms/latest/developerguide/kms-cryptography.html
# - AWS KMS rotation: optional for customer managed keys, every 365 days
#   by default once enabled, or on demand; the KMS key "is the same logical
#   resource"; all key material is retained; "Key rotation has no effect on
#   the data that the KMS key protects. It does not rotate the data keys
#   ... or re-encrypt any data"; ReEncrypt is a cryptographic operation:
#   docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html. (The
#   designer's "90 to 2,560 days" is on another page, not opened today, so
#   the lesson doesn't give it.)
# - AWS KMS prices: "$1/month (prorated hourly)" a key; "the first and
