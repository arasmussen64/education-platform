#   requests at $0.03 per 10,000 after "a free tier of 20,000
#   requests/month": aws.amazon.com/kms/pricing/
# - Google Cloud: "Generate DEKs locally", "256-bit Advanced Encryption
#   Standard (AES) in Galois Counter Mode (GCM)", "Store the encrypted data
#   and the wrapped DEK", Encrypt and Decrypt take at most 64 KiB:
#   docs.cloud.google.com/kms/docs/envelope-encryption. Rotation "creates
#   new active key versions"; "data encrypted with previous key versions
#   isn't automatically re-encrypted"; "Previous key versions remain active
#   and incur costs until they are destroyed"; "such as every 90 days":
#   docs.cloud.google.com/kms/docs/key-rotation
# - Azure Key Vault: a rotation policy creates a new key version; rotation
