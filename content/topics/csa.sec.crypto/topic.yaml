skills:
  - id: choose-the-primitive
    description: "Symmetric against public-key against the two together for a given job, and what each key can do; why RSA doesn't encrypt files (190 bytes at a time, and the speed); hybrid encryption as `age` does it, one file key wrapped once per reader; an encoding such as base64 is not encryption"
  - id: hash-mac-signature
    description: "What a hash, a MAC and a signature each prove, and who can make each; reading `sha256sum`, `openssl dgst -hmac` and signature output; webhooks; why a plain hash of guessable data (a card number) hides nothing, and a MAC under a kept key does; storing passwords with Argon2id and a salt"
  - id: authenticated-encryption
    description: "Hiding data against protecting it from change; CTR's bit flip; an AEAD, its tag and its associated data (the encryption context); the nonce, what reusing one gives away, and the 2^32 budget of random nonces, with its arithmetic"
  - id: envelope-encryption
    description: "A data key per object and the key that wraps it; the key service's calls (make a data key, unwrap); the wrapped key stored beside the data; the policy that splits sealing from opening, and the audit log; rotating, rewrapping and retiring key versions in order; the three clouds' key services side by side, and what the requests cost"
  - id: key-strength
    description: "Security strength in bits and the brute-force arithmetic; RSA-2048's 112 bits as the floor; what a quantum computer would break and what it leaves; NIST IR 8547's 2030 and 2035; why key exchange moves first"
