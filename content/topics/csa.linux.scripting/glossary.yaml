- term: strict mode
  definition: "The line `set -euo pipefail` at the top of a bash script: stop at a failed command, treat an unset variable as an error, and fail a pipeline if any stage fails."
- term: idempotency
  definition: "Being safe to repeat: running something once or ten times leaves the same result, so a script that failed halfway can simply be run again."
- term: symbolic link
  aliases: [symlink]
  definition: "A name that points at another path, like a shortcut, such as `current` pointing at `releases/1.4`. `ln -s` makes one."
- term: ShellCheck
  definition: "A tool that reads a shell script and points out quoting, error-handling and portability mistakes, each with a numbered explanation."
