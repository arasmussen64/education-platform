id: write-backup-logs
stage: write
runtime: lab
rev: 1
title: "Write backup-logs"
prompt: |
  Write a script, `~/bin/backup-logs`, that archives a directory of logs into a single tarball and is safe to run over and over, the way a nightly backup is. It takes an optional directory to back up and defaults to `/var/log/shop`; it writes `~/backups/shop-logs.tgz` (always that one name, so a second run replaces the archive rather than piling up new ones); it builds the archive in a temporary directory that it removes however it ends; and if the directory it's asked to back up doesn't exist, it writes a message to standard error and exits with status 2.

  Try `~/bin/backup-logs`, then `tar -tzf ~/backups/shop-logs.tgz` to see what's inside (the logs include one whose name has a space, which must be in there). Run it again and check `ls ~/backups` still shows one file. Try `~/bin/backup-logs /no/such/dir; echo $?` and watch it exit 2. Run `shellcheck ~/bin/backup-logs` (it should say nothing). Make the script executable, and run the checks.
hints:
  - "Strict mode and the argument: `set -euo pipefail`, then `src=\"${1:-/var/log/shop}\"` takes the first argument or the default. Guard it: `[[ -d \"$src\" ]] || { echo \"no directory at $src\" >&2; exit 2; }`."
  - "Build in a temp dir and clean it up: `tmp=$(mktemp -d); trap 'rm -rf \"$tmp\"' EXIT`. Copy the whole directory with the variable quoted, so the spaced name survives: `cp -r \"$src\" \"$tmp/logs\"` (no `$(ls)`, no unquoted names)."
  - "Make the output folder and the archive: `mkdir -p \"$HOME/backups\"`, then `tar -czf \"$HOME/backups/shop-logs.tgz\" -C \"$tmp\" logs`. The fixed name is what makes a second run replace, not duplicate."
skills: [strict-mode, traps-cleanup, idempotent, quoting-vars]
