# The checks for "Build a safe deploy script". After the two that read the
# script (an honest exit 2 with no version, and ShellCheck), the checks run
# it as the learner in a home folder of their own, /tmp/labcheck-deploy/
# "a home" (with a space in its path, so an unquoted variable breaks), with
# TMPDIR pointing at an empty folder beside it. The versions and the app's
# files are made when the checks run, so nothing can be arranged by hand:
# wrong/typed-in-state.sh proves it. The checks build on each other in
# order: the first makes the folder, the last removes it.
checks:
  - id: no-version-exits-2
    description: "Run with no version, it writes to stderr and exits 2."
    command: |
      out=$(runuser -u learner -- /home/learner/bin/deploy 2>&1 >/dev/null); code=$?
      test "$code" = 2 && test -n "$out" && echo "exit 2 with a message"
    expect:
      contains: "exit 2"
  - id: shellcheck-clean
    description: "ShellCheck finds nothing to complain about, with none of its warnings switched off."
    # A "# shellcheck disable=..." line, or a .shellcheckrc beside the
    # script, quiets ShellCheck without fixing what it warned about. The
    # first is refused here and --norc ignores the second;
    # wrong/shellcheck-silenced.sh proves it is caught.
    command: |
      if grep -Eqi '#[[:space:]]*shellcheck[[:space:]].*disable' /home/learner/bin/deploy; then
        echo "a shellcheck disable line switches warnings off"
      else
        shellcheck --norc /home/learner/bin/deploy && echo "clean"
      fi
    expect:
      contains: clean
  - id: deploys-a-release
    description: "deploy VERSION, run for an app of the checks' own, copies its src into releases/VERSION and points the symlink current at it."
    command: |
      top=/tmp/labcheck-deploy; home="$top/a home"; app="$home/app"
      rm -rf "$top"; mkdir -p "$app/src/static" "$top/tmp"
      base=$(( $(date +%s) % 89 + 10 )); echo "$base" > "$top/base"
      echo "shop app, build $base.1" > "$app/src/app.txt"
      echo "SHOP_ENV=check" > "$app/src/config.env"
      echo "body { color: teal; }" > "$app/src/static/style.css"
      ls -A /tmp | grep -vx labcheck-deploy > "$top/tmp-before"
      chown -R learner:learner "$home" "$top/tmp"
      cd "$home" && runuser -u learner -- env HOME="$home" TMPDIR="$top/tmp" /home/learner/bin/deploy "$base.1" > /dev/null 2>&1 \
        || { echo "deploy $base.1 failed"; exit 0; }
      if ! diff -r "$app/src" "$app/releases/$base.1" > /dev/null 2>&1; then
        echo "releases/$base.1 isn't a copy of src"
      elif ! [ -L "$app/current" ] || [ "$(readlink -f "$app/current")" != "$app/releases/$base.1" ]; then
        echo "current isn't a symlink to releases/$base.1"
      else
        echo "deployed"
      fi
    expect:
      equals: "deployed"
  - id: swaps-current
    description: "A second version deployed after it gets a release of its own, current moves to it, and the first release is left as it was."
    command: |
      top=/tmp/labcheck-deploy; home="$top/a home"; app="$home/app"
      base=$(cat "$top/base" 2>/dev/null) || { echo "the first deploy didn't run"; exit 0; }
      echo "shop app, build $base.2" > "$app/src/app.txt"
      cd "$home" && runuser -u learner -- env HOME="$home" TMPDIR="$top/tmp" /home/learner/bin/deploy "$base.2" > /dev/null 2>&1 \
        || { echo "deploy $base.2 failed"; exit 0; }
      if ! diff -r "$app/src" "$app/releases/$base.2" > /dev/null 2>&1; then
        echo "releases/$base.2 isn't a copy of src"
      elif [ "$(readlink -f "$app/current")" != "$app/releases/$base.2" ]; then
        echo "current doesn't point at releases/$base.2"
      elif ! [ -d "$app/releases/$base.1" ]; then
        echo "releases/$base.1 is gone"
      elif [ "$(cat "$app/releases/$base.1/app.txt" 2>/dev/null)" != "shop app, build $base.1" ]; then
        echo "releases/$base.1 changed"
      else
        echo "swapped"
      fi
    expect:
      equals: "swapped"
  - id: repeat-is-safe
    description: "Deploying the same version again works, and leaves its release and current as they were."
    command: |
      top=/tmp/labcheck-deploy; home="$top/a home"; app="$home/app"
      base=$(cat "$top/base" 2>/dev/null) || { echo "the first deploy didn't run"; exit 0; }
      cd "$home" && runuser -u learner -- env HOME="$home" TMPDIR="$top/tmp" /home/learner/bin/deploy "$base.2" > /dev/null 2>&1 \
        || { echo "deploying $base.2 a second time failed"; exit 0; }
      if ! diff -r "$app/src" "$app/releases/$base.2" > /dev/null 2>&1; then
        echo "after a second deploy, releases/$base.2 isn't a copy of src"
      elif [ "$(readlink -f "$app/current")" != "$app/releases/$base.2" ]; then
        echo "after a second deploy, current doesn't point at releases/$base.2"
      else
        echo "safe to repeat"
      fi
    expect:
      equals: "safe to repeat"
  - id: keeps-three
    description: "After more deploys only the three newest releases are left, and a deploy after that, with the old ones already gone, works too."
    command: |
      top=/tmp/labcheck-deploy; home="$top/a home"; app="$home/app"
      base=$(cat "$top/base" 2>/dev/null) || { echo "the first deploy didn't run"; exit 0; }
      left() { find "$app/releases" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | paste -sd' '; }
      cd "$home"
      for n in 3 4 5 6; do
        echo "shop app, build $base.$n" > "$app/src/app.txt"
        runuser -u learner -- env HOME="$home" TMPDIR="$top/tmp" /home/learner/bin/deploy "$base.$n" > /dev/null 2>&1 \
          || { echo "deploy $base.$n failed"; exit 0; }
        if [ "$n" = 5 ] && [ "$(left)" != "$base.3 $base.4 $base.5" ]; then
          echo "after deploying $base.5, releases holds: $(left)"
          exit 0
        fi
      done
      if [ "$(left)" != "$base.4 $base.5 $base.6" ]; then
        echo "after deploying $base.6, releases holds: $(left)"
      elif [ "$(readlink -f "$app/current")" != "$app/releases/$base.6" ]; then
        echo "current doesn't point at releases/$base.6"
      else
        echo "three kept"
      fi
    expect:
      equals: "three kept"
  - id: cleans-up
    description: "Every run, even one that fails part way, leaves no temp directory behind."
    # The failing run: a file in src that the learner can't read, so the
    # copy fails after the temp directory is made. Then the checks' folder
    # is removed.
    command: |
      top=/tmp/labcheck-deploy; home="$top/a home"; app="$home/app"
      base=$(cat "$top/base" 2>/dev/null) || { echo "the first deploy didn't run"; exit 0; }
      leftovers() {
        { ls -A "$top/tmp"; ls -A "$home" | grep -vx app; ls -A /tmp | grep -vx labcheck-deploy | grep -vxF -f "$top/tmp-before"; } 2>/dev/null | head -n 3 | paste -sd' '
      }
      found=$(leftovers)
      if ! [ -L "$app/current" ]; then
        result="no deploy has worked yet, so there is nothing to judge"
      elif [ -z "$found" ]; then
        echo "locked" > "$app/src/secret.key"; chmod 000 "$app/src/secret.key"; chown root:root "$app/src/secret.key"
        cd "$home" && runuser -u learner -- env HOME="$home" TMPDIR="$top/tmp" /home/learner/bin/deploy "$base.7" > /dev/null 2>&1
        code=$?
        found=$(leftovers)
        if [ "$code" = 0 ]; then
          result="a deploy whose copy failed still exited 0"
        elif [ -n "$found" ]; then
          result="a deploy that failed left behind: $found"
        else
          result="cleaned up"
        fi
      else
        result="left behind after the deploys: $found"
      fi
      cd / && rm -rf "$top"
      echo "$result"
    expect:
      equals: "cleaned up"
