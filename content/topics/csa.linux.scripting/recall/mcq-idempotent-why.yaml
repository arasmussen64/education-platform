id: mcq-idempotent-why
type: mcq
rev: 1
prompt: |
  Why do people insist that a server setup script be *idempotent*, safe to run twice with the same result?
choices:
  - "Because bash can't run a script more than once otherwise"
  - "Because a script that fails halfway will be run again (by you, by cloud-init on a new instance, by a retry), and the steps that already succeeded must not break the second run: `mkdir` fails on an existing directory, `ln -s` on an existing link, and a plain `>>` duplicates lines"
  - "Because idempotent scripts run faster"
  - "Because the kernel requires it for scripts in `/usr/local/bin`"
answer: 1
explanation: |
  Partial failure is the normal case over a fleet's lifetime, and "I'll just rerun it" only works if every step checks before it acts. The standard tools have idempotent forms (`mkdir -p`, `ln -sfn`, `install -d`), and for the rest you write the check: `grep -q … || echo … >>`, `id user || useradd`. Configuration-management tools like Ansible are built entirely on this idea, which is why learning it in bash first pays off.
skills: [idempotent]
