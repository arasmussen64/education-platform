id: mcq-strict-mode-line
type: mcq
rev: 1
prompt: |
  A script begins with `set -euo pipefail`. What have its three parts switched on?
choices:
  - "Echo every command (`-e`), run as the user `-u`, and fail on pipes"
  - "Exit on the first failing command (`-e`), treat an unset variable as an error (`-u`), and make a pipeline fail if any stage fails rather than only the last (`-o pipefail`)"
  - "Exit on errors, unbuffer output, and open pipes in fail-safe mode"
  - "Nothing until `set` is run again at the end"
answer: 1
explanation: |
  These three turn bash's default "carry on whatever happens" into "stop when something is wrong", which is what a script needs and a prompt doesn't. `-x` is the one that echoes commands (useful while debugging). Remember the one exception: `-e` ignores commands whose result is being tested, in an `if`, or to the left of `||` and `&&`.
skills: [strict-mode]
