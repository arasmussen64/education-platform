id: mcq-strict-mode-line
type: mcq
rev: 2
prompt: |
  A script begins with `set -euo pipefail`. What have its three parts switched on?
choices:
  - "Echo every command, error on an unset variable, and judge a pipeline by its last stage only"
  - "Exit when a command fails, treat an unset variable as empty, and judge a pipeline by its last stage only"
  - "Echo every command, treat an unset variable as empty, and fail a pipeline if any stage fails"
  - "Exit when a command fails, error on an unset variable, and fail a pipeline if any stage fails"
answer: 3
explanation: |
  `-e` exits on the first failing command, `-u` makes reading an unset variable an error, and `-o pipefail` makes a pipeline fail if any stage fails. Together they turn bash's default "carry on whatever happens" into "stop when something is wrong", which is what a script needs and a prompt doesn't. Echoing each command is `-x`, useful while debugging, not `-e`. Treating an unset variable as empty, and judging a pipeline by its last stage only, are what bash does *without* these settings: they are the two defaults that `-u` and `pipefail` switch off. Remember the one exception: `-e` ignores a command whose result is being tested, in an `if`, or to the left of `||` and `&&`.
skills: [strict-mode]
