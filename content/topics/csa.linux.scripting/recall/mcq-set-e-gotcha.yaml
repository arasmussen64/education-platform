id: mcq-set-e-gotcha
type: mcq
rev: 2
prompt: |
  A script starts with `set -e`, yet this line doesn't stop it when `build_assets` fails:
  ```
  local output=$(build_assets)
  ```
  Why not, and what's the fix?
choices:
  - "`local` itself succeeds and hides the failure; declare, then assign: `local output; output=$(build_assets)`"
  - "`set -e` never looks inside `$(…)`; test the result yourself: `local output=$(build_assets) || exit 1`"
  - "`set -e` is switched off inside functions; switch it on there: `set -e; local output=$(build_assets)`"
  - "`local` runs the command where `set -e` can't reach it; use `export output=$(build_assets)` instead"
answer: 0
explanation: |
  `set -e` looks at the status of the whole command, and here that command is `local`, which returns 0 whatever the substitution did. Splitting the declaration from the assignment makes the line's status the substitution's, so `-e` sees the failure. `set -e` does look inside `$(…)`: a plain `output=$(build_assets)` stops the script. Adding `|| exit 1` to the original line changes nothing, because it tests `local`, which succeeded. `set -e` stays on inside functions, so switching it on again does nothing. And `export output=$(…)` masks the failure in just the same way as `local`. ShellCheck flags this (SC2155), which is one good reason to run it.
skills: [strict-mode]
