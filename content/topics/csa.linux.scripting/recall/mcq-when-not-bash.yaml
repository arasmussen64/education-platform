id: mcq-when-not-bash
type: mcq
rev: 2
prompt: |
  A bash script has grown to 400 lines, keeps records about servers in parallel arrays, and parses JSON with `grep` and `cut`. What does a sensible style guide say?
choices:
  - "Rewrite it in a real language such as Python: shell suits short glue scripts, not data handling"
  - "Rewrite it for plain `sh` instead of bash: the simpler shell keeps a script small and portable"
  - "Keep it in bash but split it into files of under a hundred lines, each called from a main script"
  - "Keep it in bash and add `set -euo pipefail`: strict mode makes arrays and text parsing dependable"
answer: 0
explanation: |
  Google's guide puts it plainly: shell for small utilities and simple wrappers, something else when a script is mostly data manipulation or has grown past about a hundred lines. Bash has no real data structures (parallel arrays are the workaround), and parsing JSON with text tools breaks on the first unexpected layout; `jq` or a Python script handles it properly. Plain `sh` would make it worse, not better: it has fewer features than bash, and no arrays at all. Splitting the file changes nothing: it's the same 400 lines of the same kind of code, in more places. And strict mode makes a script stop on errors; it doesn't give bash records or a JSON parser. The Python Foundations track exists for exactly this moment.
skills: [tooling]
