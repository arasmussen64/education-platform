id: mcq-when-not-bash
type: mcq
rev: 1
prompt: |
  A bash script has grown to 400 lines, keeps records about servers in parallel arrays, and parses JSON with `grep` and `cut`. What does a sensible style guide say?
choices:
  - "Keep going; bash can do anything Python can"
  - "Rewrite it in a real programming language such as Python: shell is right for gluing commands together and small utilities, and wrong once a script needs data structures, complex parsing or passes about a hundred lines"
  - "Split it into 400 one-line scripts"
  - "Convert it to a Makefile"
answer: 1
explanation: |
  Google's guide puts it plainly: shell for small utilities and simple wrappers, something else when the script is mostly data manipulation or has grown large. Bash has no real data structures, its error handling is the strict-mode set of workarounds, and parsing JSON with text tools breaks on the first unexpected layout (`jq` or a Python script handles it properly). The Python Foundations track exists for exactly this moment.
skills: [tooling]
