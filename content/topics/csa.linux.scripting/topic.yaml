id: csa.linux.scripting
kind: topic
status: draft
title: "Shell scripting"
summary: "Turn commands into scripts you can trust: strict mode (set -euo pipefail) and its one trap, quoting that survives spaces, functions and \"$@\", a trap for cleanup, honest exit codes, and steps that are safe to run twice."
prerequisites: [csa.linux.shell, csa.linux.processes]
estimated_minutes: 90
rev: 1
objectives:
  - "Explain what `set -e`, `set -u` and `set -o pipefail` each catch, show the difference with and without them, and name the case where `set -e` doesn't fire."
  - "Quote variables so that spaces and empty values can't break a script, use `\"$@\"` in functions, and read `$(...)`, `[[ ]]` and `||`/`&&`."
  - "Use `trap ... EXIT` for cleanup that always runs, and exit with a meaningful status when something is missing."
  - "Make a script idempotent: safe to run twice, with `mkdir -p`, `ln -sfn`, check-before-append and similar steps, and say why cloud scripts must be."
  - "Use ShellCheck and a style guide, start scripts with `#!/usr/bin/env bash`, and know when a script has outgrown bash."
