# Lessons and recall first (ADR-0017). Every shell item here runs in real
# bash, because bash itself is the subject; writing and running whole scripts
# comes in the labs.
practice:
  - mcq-strict-mode-line
  - scr-set-e
  - scr-set-u
  - scr-pipefail
  - mcq-set-e-gotcha
  - scr-quoting
  - scr-dollar-at
  - scr-command-subst
  - scr-exit-codes
  - mcq-exit-code-convention
  - scr-trap-exit
