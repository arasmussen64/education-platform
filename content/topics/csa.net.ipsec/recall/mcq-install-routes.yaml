id: mcq-install-routes
type: mcq
rev: 1
prompt: |
  Every machine in the labs that runs strongSwan has `install_routes = no` in charon's settings. Why, with a route-based tunnel on a VTI?
choices:
  - "With 0.0.0.0/0 selectors, charon would add its own route for everything; with a VTI, routing decides"
  - "Charon can't add routes inside a network namespace, and it would log an error for every new CHILD_SA it makes"
  - "Routes that charon adds are removed at every rekey, and the tunnel would lose its traffic each hour"
  - "BGP refuses to run over a tunnel whose routes charon added, and it would leave the session in Active"
answer: 0
explanation: |
  By default charon adds a route for each CHILD_SA's remote selectors, which suits a policy-based tunnel. With 0.0.0.0/0 that route covers every address, so the office's internet traffic, and BGP's view of the world, would be overridden by charon's own table. strongSwan's route-based VPN page says route installation by the IKE daemon "must be disabled" for a VTI; the routes come from FRR (or a network file) instead, and charon only negotiates the SAs. Charon can add routes in a namespace, rekeys don't remove routes, and BGP doesn't care who installed a route.
skills: [route-based-tunnel]
