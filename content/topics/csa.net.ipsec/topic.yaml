#   default clear; Phase2LifetimeSeconds default 3600:
#   https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_VpnTunnelOptionsSpecification.html
# - Azure: Static Routing = PolicyBased, Dynamic Routing = RouteBased;
#   route-based default phase 1: IKEv1 and IKEv2, DH group 2 (1024 bit),
#   AES256/SHA1 first, 28,800 s; phase 2 27,000 s; quick mode offers as
#   initiator all with PFS None; "MSS clamping is done bidirectionally on the
#   Azure VPN Gateway", 1360 bytes over the internet (IPv4); recommended IKE
