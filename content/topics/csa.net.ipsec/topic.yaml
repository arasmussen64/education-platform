#   applies only on rekey or CREATE_CHILD_SA, "A proposal mismatch might
#   therefore not immediately be noticed":
#   https://docs.strongswan.org/docs/5.9/swanctl/swanctlConf.html
# - RFC 7296 (IKEv2, STD 79, October 2014): the four exchanges; UDP 500 and
#   4500: https://www.rfc-editor.org/rfc/rfc7296.html
# - RFC 4555 (MOBIKE, June 2006), section 3.3: implementations supporting
#   both "MUST change to port 4500 if the correspondent also supports both,
#   even if no NAT was detected between them":
#   https://www.rfc-editor.org/rfc/rfc4555.html
# - AWS: two tunnels per connection, "It is important to configure both
#   tunnels for redundancy"; each in a different Availability Zone; endpoints
#   "evaluate proposals from your customer gateway starting with the lowest
#   configured value from the list below, regardless of the proposal order
#   from the customer gateway", restrict with modify-vpn-connection-options:
#   https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNTunnels.html
# - AWS: by default the customer gateway device brings the tunnels up;
#   startup action start, IKEv2 only, AWS "will continuously try to
#   establish a connection until one is made"; DPD timeout action default:
#   the IKE session stops, the tunnel goes down, the routes are removed:
#   https://docs.aws.amazon.com/vpn/latest/s2svpn/initiate-vpn-tunnels.html
# - AWS: during tunnel endpoint updates "we set a lower outbound
#   multi-exit discriminator (MED) value on the other tunnel"; use "the same
#   Weight and Local Preference values for both tunnels":
#   https://docs.aws.amazon.com/vpn/latest/s2svpn/routing-vpn-tunnel-updates.html
# - AWS: MTU 1446 and MSS 1406 at most; by algorithm, AES-GCM-16 1446/1406
#   without NAT-T and 1438/1398 with, AES-CBC with SHA1 or SHA2-256 1438/1398
#   without and 1422/1382 with; use IKEv2; fragment before encryption:
