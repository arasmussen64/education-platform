prove:
  build: build-tunnel-to-the-cloud
  debug: debug-tunnel-down
  explain:
    prompt: |
      A company is connecting its office to a cloud network with a site-to-site IPsec VPN, BGP over it, and a colleague asks you to explain it before the change. Explain, in your own words: what IKE and ESP each do, and what phase 1 and phase 2 agree; why a route-based tunnel with BGP is the usual choice with the clouds, and one way a policy-based habit breaks it; how you would tell from the logs of both ends a proposal mismatch in phase 1, a wrong pre-shared key or identity, and a phase 2 failure; why big downloads can hang over a tunnel when small pages work, and the fix, with the arithmetic; what makes the tunnel come back after a reboot and after the provider's maintenance; and two ways AWS, Azure or Google Cloud's VPNs differ.
    rubric:
      - id: ike-esp
        required: true
        description: "IKE (UDP 500, then 4500) proves who each end is and agrees keys and algorithms; ESP (IP protocol 50) encrypts and carries the traffic, in tunnel mode inside a new header between the gateways; phase 1 builds the IKE_SA (proposal, Diffie-Hellman, authentication), phase 2 the CHILD_SA (ESP proposal, traffic selectors, an optional DH group for perfect forward secrecy); a firewall must allow UDP 500, UDP 4500 and ESP."
      - id: route-based
        required: true
        description: "Route-based: 0.0.0.0/0 selectors and a tunnel interface (a VTI, whose key matches the SA's marks), so routing, which BGP fills, decides what is encrypted; new networks need no new negotiation, and BGP moves traffic between tunnels. Narrow, policy-based selectors leave out the BGP peers' inside addresses (or a new network), so the tunnel is up and BGP isn't."
      - id: reading-logs
        required: true
        description: "NO_PROPOSAL_CHOSEN in IKE_SA_INIT is phase 1; after \"IKE_SA established\", in IKE_AUTH or CREATE_CHILD_SA, it is phase 2; AUTHENTICATION_FAILED is the key or the identity, which only the responder's log tells apart (a MAC mismatch against no matching peer configuration); TS_UNACCEPTABLE is the selectors; retransmits with no answer are the path; a failure about an hour in is a rekey, usually the PFS group."
      - id: mtu
        required: true
        description: "ESP adds about 54 bytes with AES-GCM (more with NAT traversal or CBC), so full-size packets no longer fit; with DF set they are dropped where a link is smaller, and if the ICMP that would say so is blocked, big transfers hang while small ones work. Clamp the MSS on the tunnel interface in both directions to link MTU minus overhead minus 40 (1,306 on a 1,400-byte line), or use the provider's MSS table."
      - id: lasting
        required: true
        description: "The tunnel interface made at boot (a network file or a unit), the services enabled and BGP saved; start_action = start at boot, close_action = start for the provider's maintenance (it deletes the tunnel as it stops), dead peer detection with dpd_action = restart, and keyingtries = 0; two tunnels where the cloud offers them."
      - id: clouds
        required: true
        description: "Any two correct differences, for example: AWS has two tunnels per connection, maintains one at a time and lowers the MED on the other, so local preference must be equal, and picks from your proposals by its own order; Azure's route-based defaults start with DH group 2, its BGP timers are 60 and 180 seconds and fixed, it takes up to 4,000 prefixes, and it clamps the MSS to 1,360 on its side; Google's HA VPN has a 99.99% SLA only with two tunnels, routes only by BGP and has a gateway MTU of 1,460."
      - id: vti-or-xfrm
        required: false
        description: "The lab used a VTI with marks; XFRM interfaces do the same job better on kernels from 4.19, where the kernel has them."
    model_answer: |
      A site-to-site VPN joins the office's network to the cloud's across the internet, encrypted, and IPsec does it with two protocols. IKE, on UDP port 500 and then 4500, is the conversation in which the two gateways prove who they are and agree keys and algorithms. ESP, IP protocol 50, carries the traffic: in tunnel mode each of the office's packets is encrypted whole and wrapped in a new header between the two gateways' outside addresses. Phase 1 builds the IKE_SA, which protects IKE itself: the two ends agree a proposal, do a Diffie-Hellman exchange and authenticate each other, with a pre-shared key or a certificate. Phase 2 builds a CHILD_SA for the traffic: an ESP proposal, the traffic selectors that say which addresses it carries, and, if the proposal names a DH group, fresh keys of its own at every rekey, perfect forward secrecy. A firewall in front of the gateway has to allow UDP 500, UDP 4500 and ESP.

      With the clouds, the tunnel is usually route-based: the selectors are 0.0.0.0/0 both ways and a tunnel interface, on Linux a VTI whose key matches the CHILD_SA's marks, decides what is encrypted: whatever is routed into it. BGP runs between the two inside addresses, a link-local /30, and fills in the routes, so when the cloud adds a network the office learns it without anyone renegotiating anything, and with two tunnels BGP moves the traffic when one fails. A policy-based habit breaks it: if someone writes the two networks into the selectors, the provider narrows to them, the tunnel shows as up, and BGP's own packets, between the inside addresses, are in neither selector, so the session never comes up and nothing is routed.

      The logs tell the failures apart. If the office's log says NO_PROPOSAL_CHOSEN in the IKE_SA_INIT response, the IKE proposal, phase 1, was refused. AUTHENTICATION_FAILED in IKE_AUTH means a wrong key or a wrong identity, and from our side the two look identical; the provider's log says which: a MAC mismatch for the key, no matching peer configuration for the identity. If the IKE_SA is established and then NO_PROPOSAL_CHOSEN or TS_UNACCEPTABLE comes back with no CHILD_SA built, phase 2 failed, on the ESP proposal or the selectors. Retransmits with no answer mean something on the path drops the packets, often UDP 4500. And a tunnel that works for about an hour after every restart and then stops is a rekey failing, typically because the two ends disagree about the PFS group, which the first CHILD_SA never compares.

      Big downloads hang while small pages work because ESP makes packets bigger: with AES-GCM it adds 54 bytes, so a full-size 1,500-byte packet no longer fits a 1,500-byte path, and a smaller link on the way drops it, since TCP sets DF. If the "fragmentation needed" message is blocked, the sender never learns and keeps resending. The fix on our side is to clamp TCP's MSS on the tunnel interface, in both directions, because each end announces in its own SYN what it will accept: on a 1,400-byte line, 1,400 − 54 − 40 = 1,306 at most.

      For it to come back by itself, the tunnel interface must be made at boot, the IPsec service enabled and BGP saved. In the connection, start_action = start brings it up at boot, close_action = start brings it back when the provider closes it for maintenance, dead peer detection with dpd_action = restart catches a provider that stops answering, and keyingtries = 0 keeps trying however long it takes.

      The clouds differ. AWS gives every connection two tunnels and maintains them one at a time, lowering the MED on the other first, so the office must keep local preference equal on both or it ignores the hint. Azure's gateway keeps its BGP timers fixed at 60 and 180 seconds, drops the session above 4,000 prefixes, starts its default proposals with DH group 2, and clamps the MSS to 1,360 itself. Google's HA VPN gives its 99.99% SLA only with two tunnels, and routes only by BGP.
