skills:
  - id: ipsec-building-blocks
    description: "IKE and ESP and what each carries; phase 1 (the IKE_SA) and phase 2 (the CHILD_SA); SAs and SPIs; proposals, DH groups and PFS, and why the first CHILD_SA doesn't negotiate its group; PSK and identities; lifetimes and rekeying; UDP 500, UDP 4500 and protocol 50; NAT traversal and MOBIKE; reading `swanctl --list-sas`"
  - id: route-based-tunnel
    description: "Policy-based against route-based; the VTI, its key and the CHILD_SA's marks (XFRM interfaces by name); 0.0.0.0/0 selectors and `install_routes = no`; the inside /30 of link-local addresses; building it with swanctl and making it last a reboot and a provider's restart (`start_action`, `close_action`, DPD, `keyingtries`)"
  - id: bgp-over-tunnel
    description: "BGP between the inside addresses; what to send and what to accept (prefix filters in and out, never a default route); learning routes rather than typing them; two tunnels, MED and local preference during a provider's maintenance; each cloud's ASN, timers and prefix limits"
  - id: read-ike-logs
    description: "Phase 1 and phase 2 failures from strongSwan's log on each end: proposal mismatches, a wrong key against a wrong identity, traffic selectors (unacceptable or narrowed), no answer, a rekey that fails; which end's log can tell you what"
  - id: tunnel-mtu
    description: "ESP's overhead and the inner MTU; MSS from MTU; what NAT traversal and AES-CBC add; the black hole when ICMP is blocked; MSS clamping in both directions on the tunnel interface; each cloud's MTU and MSS numbers"
