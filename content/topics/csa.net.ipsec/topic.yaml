id: csa.net.ipsec
kind: topic
status: ready
title: VPNs and IPsec
summary: "Connect an office to a cloud network with a route-based IPsec VPN: what IKE and ESP each do and what the two phases agree, building the tunnel from a provider's configuration sheet with a VTI, strong proposals and perfect forward secrecy, BGP over it, making it last a reboot and the provider's maintenance, reading both ends' logs to tell phase 1 from phase 2 failures, and the tunnel MTU problem behind big downloads that hang."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 37) and its designer's brief (csa.net.ipsec.md). Through
# csa.net.bgp it builds on csa.net.routing, csa.net.cidr and csa.net.layers
# (the network labs' machines, on, netlab, services as name@machine, a
# machine's /etc/network/up; tunnels, MTU, MSS, MSS clamping and the path
# MTU black hole), and on csa.m1.checkpoint; through csa.net.http-tls on
# csa.net.dns, csa.net.congestion, csa.net.transport (the SYN's MSS) and
# csa.net.nat (why a NAT can't carry a protocol without ports). For the
# writer: csa.net.http-tls defines symmetric and public-key encryption, key
# exchange (ECDHE), forward secrecy, cipher suite and handshake; csa.net.bgp
# defines AS, eBGP, prefix list, route map, MED, local preference, weight
# and the decision order. This topic defines VPN, IPsec, IKE, ESP, AH, SA,
# SPI, IKE_SA and CHILD_SA, the four exchanges, proposal, AEAD, DH groups,
# PFS, PSK and identity, traffic selectors, tunnel and transport mode,
# policy-based and route-based, VTI and mark, XFRM interface, rekey,
# lifetime, DPD, NAT traversal and MOBIKE, and the inside addresses.
prerequisites: [csa.net.bgp, csa.net.http-tls]
# Worked out: the lesson about 29 minutes (3,800 words with its tables, at
# 130 a minute), reading 38 (strongSwan's IPsec introduction 10, four
# sections of its strongSwan introduction 14, its route-based VPN page 6,
# AWS's three pages 8), 23 quick items at 1.5 each 35, then the worked
# example 35 (nine steps), the fill-in 20, the write 30, the build 55, the
# debug 45 and the explain 20: 307. The plan gives 310.
estimated_minutes: 310
rev: 1
objectives:
  - "Say what IKE and ESP each do and what crosses the wire (UDP 500, UDP 4500, ESP as IP protocol 50), what phase 1 (the IKE_SA) and phase 2 (the CHILD_SA) agree, and read both in `swanctl --list-sas`."
  - "Build a route-based IPsec tunnel with strongSwan from a provider's configuration sheet: a VTI whose key matches the CHILD_SA's marks, 0.0.0.0/0 selectors, the sheet's proposals with perfect forward secrecy and nothing weaker, and the pre-shared key kept private."
  - "Run BGP over the tunnel between the inside addresses, sending only the office's prefix and accepting only the cloud's, and make tunnel and routing come back by themselves after a reboot and after the provider restarts its end."
  - "Tell from the logs of both ends a phase 1 proposal mismatch, a wrong pre-shared key from a wrong identity, a phase 2 proposal or selector failure, a peer that never answers and a rekey that fails an hour in."
  - "Work out a tunnel's MTU and MSS from ESP's overhead, recognise the black hole behind \"small pages load, big downloads hang\", and fix it with MSS clamping in both directions; say how AWS, Azure and Google Cloud's VPNs differ in tunnels, proposals, BGP limits and MTU."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - strongSwan 5.9: "IPsec Protocol" (ESP in transport and tunnel mode, the
#   IKEv2 exchanges, NAT traversal on UDP 4500; it leaves AH out): footer
#   "The content is provided under a CC BY 4.0 license":
#   https://docs.strongswan.org/docs/5.9/howtos/ipsecProtocol.html
# - strongSwan 5.9, route-based VPN: XFRM interfaces "since version 5.8.0",
#   kernel "since 4.19", "XFRM interfaces provide a better solution than VTI
#   devices"; for a VTI "the route installation by the IKE daemon must be
#   disabled" (charon.install_routes = 0); disable_policy recommended "To
#   avoid duplicate policy lookups"; the mark "has to match the mark
#   configured for the connection"; 0.0.0.0/0 selectors on both ends:
#   https://docs.strongswan.org/docs/5.9/features/routeBasedVpn.html
# - strongSwan 5.9, swanctl.conf: keyingtries default 1, "A value of 0
#   initiates a new sequence until the connection establishes or fails with
#   a permanent error"; start_action none|trap|start, "start initiates the
#   connection actively"; close_action none|trap|start, "does not provide
#   any guarantee that the CHILD_SA is kept alive"; dpd_action
#   clear|trap|restart, restart "immediately tries to re-negotiate the
#   CHILD_SA under a fresh IKE_SA"; dpd_delay default 0s; dpd_timeout "has
