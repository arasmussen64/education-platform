#   https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html
# - AWS API: TunnelInsideCidr "A size /30 CIDR block from the
#   169.254.0.0/16 range", with 169.254.0.0/30 to 169.254.5.0/30 and
