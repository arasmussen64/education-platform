frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 203.0.113.1
!
router bgp 64512
 bgp router-id 203.0.113.10
 timers bgp 3 9
 neighbor 169.254.21.2 remote-as 65010
 neighbor 169.254.21.2 timers connect 5
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 10.20.0.0/16
  neighbor 169.254.21.2 route-map FROM-OFFICE in
  neighbor 169.254.21.2 route-map TO-OFFICE out
 exit-address-family
exit
!
ip prefix-list CLOUD seq 5 permit 0.0.0.0/0
ip prefix-list CLOUD seq 10 permit 10.20.0.0/16
!
route-map FROM-OFFICE permit 10
exit
!
route-map TO-OFFICE permit 10
 match ip address prefix-list CLOUD
exit
!
