# The provider's side of the office's VPN (scenery, modelled on a cloud's
# VPN gateway). It answers the office's gateway and never starts the tunnel
# itself, as AWS's doesn't by default. Its CHILD_SA carries everything
# (0.0.0.0/0 both ways) with the mark 7, which ties it to cloud's vti0, so
# whatever is routed into vti0 is encrypted. It accepts the two proposals
# on its configuration sheet's list, strongest first, and nothing weaker.
connections {
  office {
    version = 2
    local_addrs = 203.0.113.10
    remote_addrs = 198.51.100.10
    proposals = aes256-sha256-modp2048,aes128-sha256-modp2048
    dpd_delay = 10s
    local {
      auth = psk
      id = 203.0.113.10
    }
    remote {
      auth = psk
      id = 198.51.100.10
    }
    children {
      office-vti {
        local_ts = 0.0.0.0/0
        remote_ts = 0.0.0.0/0
        mode = tunnel
        mark_in = 7
        mark_out = 7
        esp_proposals = aes256gcm16-modp2048,aes128gcm16-modp2048
        start_action = none
        dpd_action = clear
      }
    }
  }
}
secrets {
  ike-office {
    id-1 = 203.0.113.10
    id-2 = 198.51.100.10
    secret = "rT7qV2mX9pL4wZ8kN3bF6hJ1"
  }
}
