# The provider's side of the office's VPN (scenery, modelled on a cloud's
# VPN gateway). It answers the office's gateway and never starts the tunnel
# itself. Its CHILD_SA carries everything (0.0.0.0/0 both ways) with the
# mark 9, which ties it to cloud's vti0. Like many providers' gateways, it
# accepts the strong proposals on its sheet and, for old devices, a weak
# pair as well (AES-128 with SHA-1 and DH group 2). Modelled on AWS's
# documented behaviour ("Site-to-Site VPN tunnel endpoints evaluate
# proposals from your customer gateway starting with the lowest configured
# value from the list below, regardless of the proposal order from the
# customer gateway"): the weak pair comes first in its own lists, and
# strongSwan as a responder prefers its own order, so a gateway that
# offers the weak pair at all, even after the strong one, gets it.
connections {
  office {
    version = 2
    local_addrs = 203.0.113.10
    remote_addrs = 198.51.100.10
    proposals = aes128-sha1-modp1024,aes256-sha384-ecp384
    dpd_delay = 10s
    local {
      auth = psk
      id = 203.0.113.10
    }
    remote {
      auth = psk
      id = 198.51.100.10
    }
    children {
      office-vti {
        local_ts = 0.0.0.0/0
        remote_ts = 0.0.0.0/0
        mode = tunnel
        mark_in = 9
        mark_out = 9
        esp_proposals = aes128-sha1-modp1024,aes256gcm16-ecp384
        start_action = none
        dpd_action = clear
      }
    }
  }
}
secrets {
  ike-office {
    id-1 = 203.0.113.10
    id-2 = 198.51.100.10
    secret = "Hn4wB8vK2mQ9sX6tR3pL7zD5"
  }
}
