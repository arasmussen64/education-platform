frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 203.0.113.1
!
router bgp 64600
 bgp router-id 203.0.113.10
 timers bgp 3 9
 neighbor 169.254.44.2 remote-as 65010
 neighbor 169.254.44.2 timers connect 5
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 10.30.0.0/16
  redistribute kernel route-map OFFER
  neighbor 169.254.44.2 route-map FROM-OFFICE in
  neighbor 169.254.44.2 route-map TO-OFFICE out
 exit-address-family
exit
!
ip prefix-list CLOUD seq 5 permit 0.0.0.0/0
ip prefix-list CLOUD seq 10 permit 10.30.0.0/16
ip prefix-list OFFERS seq 5 permit 10.0.0.0/8 ge 24 le 25
ip prefix-list OFFERS seq 10 permit 172.16.0.0/12 ge 24 le 24
!
route-map FROM-OFFICE permit 10
exit
!
route-map OFFER permit 10
 match ip address prefix-list OFFERS
exit
!
route-map TO-OFFICE permit 10
 match ip address prefix-list CLOUD
exit
!
route-map TO-OFFICE permit 20
 match ip address prefix-list OFFERS
exit
!
