#!/usr/sbin/nft -f
# The office's internet provider's router (scenery): it forwards everything,
# and sends no ICMP "destination unreachable" of its own, "fragmentation
# needed" among them, as some providers' routers are set up to do.
flush ruleset
table inet filter {
    chain output {
        type filter hook output priority filter; policy accept;
        icmp type destination-unreachable drop
    }
}
