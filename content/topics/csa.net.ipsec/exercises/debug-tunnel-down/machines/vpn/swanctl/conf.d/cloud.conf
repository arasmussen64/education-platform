# The office's VPN connection to the provider: a route-based tunnel, one
# CHILD_SA for everything, marked 42 like vti0, that starts at boot and
# comes back by itself.
connections {
  cloud {
    version = 2
    local_addrs = 198.51.100.10
    remote_addrs = 203.0.113.10
    proposals = aes256-sha256-modp2048
    keyingtries = 0
    dpd_delay = 10s
    local {
      auth = psk
      id = branch.shop.test
    }
    remote {
      auth = psk
      id = 203.0.113.10
    }
    children {
      cloud-vti {
        local_ts = 0.0.0.0/0
        remote_ts = 0.0.0.0/0
        mark_in = 42
        mark_out = 42
        esp_proposals = aes256-sha1
        start_action = start
        close_action = start
        dpd_action = restart
      }
    }
  }
}
