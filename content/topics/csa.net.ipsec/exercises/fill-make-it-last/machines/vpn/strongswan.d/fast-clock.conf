# The lab's fast clock for vpn's strongSwan (its /etc/strongswan.d/fast-clock.conf).
# How long charon waits for the answer to a message it sent before it
# gives the other end up: here it asks again every 2 seconds, three more
# times, and gives up 8 seconds after the first try. strongSwan's own
# defaults (retransmit_timeout 4, retransmit_base 1.8, retransmit_tries 5)
# wait longer each time and give up after about 165 seconds, which is the
# figure to expect on a real gateway.
charon {
    retransmit_timeout = 2
    retransmit_base = 1
    retransmit_tries = 3
}
