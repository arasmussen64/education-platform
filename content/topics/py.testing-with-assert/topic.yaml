id: py.testing-with-assert
kind: topic
status: ready
title: "Testing with assert"
summary: "Check your own functions with assert, choose the cases that catch bugs, and keep tests in test functions that run only when you ask."
prerequisites: [py.return-values]
estimated_minutes: 45
rev: 1
objectives:
  - "Use `assert` to state what a function should return, and know what happens when the statement is true and when it isn't."
  - "Choose test cases that catch bugs: a typical value, the boundaries, zero, a negative number, an empty text."
  - "Put asserts in a `test_` function, run it under `if __name__ == \"__main__\":`, and know why that line matters."
