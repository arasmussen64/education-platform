id: debug-tests
stage: debug
rev: 2
title: "Tests that don't test"
prompt: |
  This file holds `average`, which is correct, and `test_average`, the tests that are meant to check it. Run directly, the file should run those tests and print:

  ```
  average: all checks passed
  ```

  Instead it stops with a `SyntaxError` before anything runs. It has three bugs, and fixing one shows the next. You're done when it prints the line above and every check passes.
hints:
  - "Read the error: which line does it name? An `assert` needs something that is either true or false."
  - "`=` stores a value and `==` compares two. An `assert` needs the comparison."
  - "If it now runs and prints nothing, nothing ever called `test_average`. Naming a function isn't calling it: a call needs `()`. Put the call under `if __name__ == \"__main__\":`, as every program does from now on."
  - "When the tests do run, the `AssertionError` names the line that failed. Work out `average(1, 2)` by hand: `average` is correct, so what should that line expect?"
skills: [assert-basics, test-functions]
