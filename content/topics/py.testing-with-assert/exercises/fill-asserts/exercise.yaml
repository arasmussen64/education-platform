id: fill-asserts
stage: fill_in
rev: 1
title: "Fill in the expected values"
prompt: |
  `to_fahrenheit` is finished; its tests aren't. Replace each `...` with the value the function should return: 0°C, 100°C and −40°C in Fahrenheit (water freezes at 32°F and boils at 212°F; −40 is the one temperature that's the same on both scales). Running the program should print:

  ```
  to_fahrenheit: all checks passed
  ```
hints:
  - "0°C is 32°F, and 100°C is 212°F."
  - "−40°C is −40°F: the two scales cross there."
  - "Each assert compares the function's answer with the value you expect. If you're unsure, work it out from the formula: `celsius * 9 / 5 + 32`."
skills: [assert-basics, choose-cases]
