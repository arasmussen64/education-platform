title: "Absolute, with tests"
prompt: |
  Write `absolute(n)`, which returns `n` without its sign (no `abs()`), and `test_absolute()` with at least three asserts covering a negative number, a positive number and zero. End the test function with `print("absolute: all checks passed")` and run it under `if __name__ == "__main__":`.
skills: [test-functions, choose-cases]
