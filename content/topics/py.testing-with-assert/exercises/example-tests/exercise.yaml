id: example-tests
stage: worked_example
rev: 1
title: "A function and its tests"
prompt: |
  A function, a test function with four asserts, and the line that runs the tests only when the file is run directly. Press **Run**. Then change `n * n` to `n + n` and run again: read which assert fails, and work out why the ones for 2 and 0 would still pass.
steps:
  - label: "The function under test"
    lines: "1-3"
    note: "Nothing special here: a small function that returns a value, which is exactly what makes it testable."
  - label: "One assert per case"
    lines: "6-11"
    note: "A typical value (2, 3), a negative number, and zero. Each `assert` is silent when true. The print at the end is how you know the tests ran and all passed."
  - label: "Run the tests only when asked"
    lines: "14-15"
    note: "`__name__` is `\"__main__\"` only when this file is run directly. When the Check button (or another file) loads the file to use `square`, this part is skipped, so the tests don't get in the way."
