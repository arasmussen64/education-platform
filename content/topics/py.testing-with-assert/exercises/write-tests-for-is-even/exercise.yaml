id: write-tests-for-is-even
stage: write
rev: 1
title: "Write the tests"
prompt: |
  `is_even` is written. Write `test_is_even()` with at least three asserts: an even number, an odd number, and zero. End it with `print("is_even: all checks passed")`. The last lines already run it when the file is run directly. Running the program should print:

  ```
  is_even: all checks passed
  ```
hints:
  - "`is_even(4)` should be `True`, so `assert is_even(4)` on its own is a complete check. For an odd number, `assert not is_even(7)`."
  - "Zero is even: `assert is_even(0)`."
  - "A test that compares the function with itself, like `assert is_even(4) == is_even(4)`, is always true and catches nothing. Compare with what you know the answer is."
skills: [test-functions, choose-cases]
