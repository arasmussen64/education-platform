id: build-leap-year
stage: build
rev: 1
title: "Leap years, tested"
prompt: |
  Starting from a blank editor, write `is_leap(year)`, with a docstring, that returns `True` for a leap year and `False` otherwise. A year is a leap year if it's divisible by 4, except that years divisible by 100 are not, unless they're also divisible by 400. So 2024 and 2000 are leap years; 2023 and 1900 are not.

  Then write `test_is_leap()` with at least four asserts: an ordinary leap year, an ordinary year, a century that isn't a leap year, and a century that is. End it with `print("is_leap: all checks passed")`, and run it under `if __name__ == "__main__":`. Running the program should print that line.
skills: [test-functions, choose-cases, assert-basics]
