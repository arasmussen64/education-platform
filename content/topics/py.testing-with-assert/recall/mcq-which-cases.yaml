id: mcq-which-cases
type: mcq
rev: 1
prompt: |
  You've written `absolute(n)`, which should return a number without its sign. Which set of test values is most likely to catch a bug?
choices:
  - '`absolute(5)` only'
  - '`absolute(5)` and `absolute(7)`'
  - '`absolute(5)`, `absolute(-5)` and `absolute(0)`'
  - '`absolute(5)` twice, to be sure'
answer: 2
explanation: |
  The function's whole job is what it does to negative numbers, so a test without a negative value can't catch the most likely bug (returning `n` unchanged). Zero is the boundary between the two cases. Two positive values, or the same value twice, test the same thing over again.
skills: [choose-cases]
