id: review-predict-test-function
type: predict_output
rev: 1
prompt: |
  What does this program print when it's run directly? One line. Leap years are divisible by 4, except years divisible by 100, unless they're also divisible by 400.
code: |
  def is_leap(year):
      return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)


  def test_is_leap():
      assert is_leap(2024)
      assert not is_leap(2023)
      assert not is_leap(1900)
      assert is_leap(2000)
      print("is_leap: 4 checks passed")


  if __name__ == "__main__":
      test_is_leap()
expected_output: |
  is_leap: 4 checks passed
explanation: |
  Run directly, `__name__` is `"__main__"`, so `test_is_leap()` is called. All four statements are true (2024 is a leap year, 2023 isn't, 1900 isn't because it's divisible by 100 but not 400, 2000 is), so the asserts are silent and the message prints. Loaded by another file, nothing would run.
skills: [test-functions, choose-cases]
