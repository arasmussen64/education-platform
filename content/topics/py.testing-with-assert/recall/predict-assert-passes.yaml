id: predict-assert-passes
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines. Each `assert` is checked before the line after it runs.
code: |
  def half(n):
      return n / 2


  assert half(4) == 2
  print("4 ok")
  assert half(5) == 2.5
  print("5 ok")
  assert half(0) == 0
  print("all good")
expected_output: |
  4 ok
  5 ok
  all good
explanation: |
  Every statement is true: `half(4)` is `2.0`, which equals `2`; `half(5)` is `2.5`; `half(0)` is `0.0`. A true `assert` does nothing, so the program runs straight through and prints all three lines. Had one been false, the program would have stopped there.
skills: [assert-basics]
