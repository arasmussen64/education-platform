id: mcq-assert-outcome
type: mcq
rev: 1
prompt: |
  `square(3)` returns `6` because of a bug. What happens at this line?

  ```python
  assert square(3) == 9
  ```
choices:
  - 'It prints `False`'
  - 'The program stops with an `AssertionError` pointing at this line'
  - 'It prints a warning and carries on'
  - 'It returns `False` to the caller'
answer: 1
explanation: |
  `assert` checks that its statement is true. `6 == 9` is `False`, so Python stops the program with `AssertionError` and shows the line. Had the statement been true, nothing at all would have happened, which is why a passing test file is silent.
skills: [assert-basics]
