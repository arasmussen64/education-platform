id: review-mcq-silent
type: mcq
rev: 1
prompt: |
  You run a file with a test function holding five asserts, and the only output is `all checks passed`. What does that tell you?
choices:
  - 'The asserts never ran'
  - 'Every assert was true, so the function is right for those five cases'
  - 'The function has no bugs'
  - '`assert` is switched off'
answer: 1
explanation: |
  A true `assert` is silent, so five silent asserts followed by the message means all five statements were true. That's evidence the function is right for those five cases, not proof that it's right for every input: a bug can hide in a case you didn't try.
skills: [assert-basics, choose-cases]
