id: mcq-ou-or-group
type: mcq
rev: 1
prompt: |
  The shop's sales team has twelve laptops that need one set of settings, and twelve people who need a shared folder only they can open. How should the directory hold them?
choices:
  - "An OU for the laptops, which carries the settings, and a group for the people, given the folder"
  - "A group for the laptops and the people together, given both the settings and the shared folder"
  - "An OU for the laptops and the people together, which carries both the settings and the folder"
  - "A domain of their own for the sales team, so its settings and its folder stay apart from the rest"
answer: 0
explanation: |
  Settings follow folders and permissions follow groups. An organisational unit is where settings are attached (in Active Directory, by linking Group Policy to it, the next topic), so the laptops go in a Sales OU. A permission, like the right to open a folder, is given to a group, and a group can hold people from any folder, so the people go in a Sales group.

  Giving settings to a group doesn't work, because settings are attached to OUs, not groups. Putting the people in the OU too gives them the laptops' settings and still leaves the folder's permission needing a group. A domain of its own is far heavier than either: a new set of domain controllers and accounts, for what one OU and one group do.
skills: [directory-structure]
