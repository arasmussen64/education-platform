id: mcq-trust-direction
type: mcq
rev: 1
prompt: |
  People with accounts in the CORP domain must open files on servers in the PARTNER domain, which is in another forest. Nobody in PARTNER needs anything in CORP. Which trust does that?
choices:
  - "PARTNER trusts CORP, one way: the domain with the files trusts the domain with the people"
  - "CORP trusts PARTNER, one way: the domain with the people trusts the domain with the files"
  - "A two-way trust between them, because a one-way trust can't carry logins from one to the other"
  - "No trust at all: each CORP person gets a second account in PARTNER with the same password"
answer: 0
explanation: |
  The domain that holds the resources trusts the domain that holds the accounts: PARTNER, with the files, accepts what CORP's domain controllers say about who someone is. Access flows the opposite way to the trust, from CORP's people into PARTNER's servers, and a one-way trust is enough because nothing is needed the other way.

  CORP trusting PARTNER would let PARTNER's people into CORP, the opposite of what's asked. A two-way trust would work, but it opens CORP to PARTNER's people too, which nobody needs. Second accounts with the same password are what a directory exists to avoid: twice the accounts to keep in step, and to remember to remove.
skills: [directory-structure]
