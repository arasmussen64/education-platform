id: dir-password-settings
type: predict_shell
rev: 1
prompt: |
  `passwords.txt` is what `samba-tool domain passwordsettings show` printed on dc1 straight after the domain was created (captured on 2026-11-11). The command picks out three of the rules, in the order the file has them. What is printed?
files:
  passwords.txt: |
    Password information for domain 'DC=ad,DC=shop,DC=test'

    Password complexity: on
    Store plaintext passwords: off
    Password history length: 24
    Minimum password length: 7
    Minimum password age (days): 1
    Maximum password age (days): 42
    Account lockout duration (mins): 30
    Account lockout threshold (attempts): 0
    Reset account lockout after (mins): 30
command: |
  awk -F': ' '/^Minimum password length/ {print "shortest:", $2} /^Maximum password age/ {print "change every:", $2, "days"} /^Account lockout threshold/ {print "locks after:", $2}' passwords.txt
expected_output: |
  shortest: 7
  change every: 42 days
  locks after: 0
explanation: |
  `-F': '` splits each line at the colon and space, so `$2` is the value. A new domain asks for 7 characters at least, makes everyone choose a new password every 42 days, and has a lockout threshold of 0, which means an account never locks however many wrong passwords are tried: anyone can keep guessing. These are the domain's own rules, one set for every account in it, and the first thing to set when a domain is stood up: `samba-tool domain passwordsettings set --min-pwd-length=... --account-lockout-threshold=...` (Samba accepts a minimum length of at most 14).
skills: [directory-structure]
