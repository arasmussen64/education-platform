id: mcq-domain-or-forest
type: mcq
rev: 1
prompt: |
  A company buys a subsidiary whose systems must never be run by the parent company's administrators. Where should the subsidiary's accounts live?
choices:
  - "In a forest of its own, since a forest, not a domain, is the security boundary"
  - "In a child domain of the parent's forest, since every domain has its own administrators"
  - "In an OU of its own in the parent's domain, with the right to manage it given to its staff"
  - "In a site of its own in the parent's domain, so its machines use domain controllers of their own"
answer: 0
explanation: |
  Every domain in a forest trusts every other one automatically, and the forest root's administrators (the Enterprise Admins group) can manage the whole forest. So a domain inside the parent's forest isn't a wall: only a separate forest is. If the two companies later need to share something, a trust between the forests can allow exactly that.

  A child domain does get its own Domain Admins, but it sits inside the parent's forest, where the parent's top administrators still reach it. An OU with delegated rights lets the subsidiary's staff manage their own accounts, and leaves the parent's domain administrators in charge of everything. A site is about where machines are on the network, so that members use nearby domain controllers; it doesn't separate who is in charge at all.
skills: [directory-structure]
