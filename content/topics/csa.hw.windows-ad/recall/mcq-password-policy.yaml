id: mcq-password-policy
type: mcq
rev: 1
prompt: |
  A new rule says the domain's passwords must be at least 14 characters. An administrator runs `samba-tool domain passwordsettings set --min-pwd-length=14` on dc1. What changes for the people already in the domain?
choices:
  - "Their current passwords keep working; a new one they set must be at least 14 characters"
  - "They're all locked out at once, until each of them chooses a password of 14 characters"
  - "Nothing changes for them: the rule only reaches accounts that are created from now on"
  - "Their passwords are checked at the next sign-in, and any shorter than 14 is refused there"
answer: 0
explanation: |
  The rule is checked when a password is set, by the domain controller that sets it, for every account in the domain. Creating a user with a 7-character password after the change fails at once (captured in the lab): `check_password_restrictions: the password is too short. It should be equal or longer than 14 characters!`. Existing passwords can't be measured: a domain controller doesn't keep anyone's password, only keys worked out from it. So they go on working until each person next changes theirs, which the domain's maximum password age (42 days out of the box) makes everyone do in time.

  Nobody is locked out by the change, and sign-ins don't check the length either: a Kerberos sign-in proves the key, never shows the password. And the rule isn't only for new accounts: it reaches every existing account the next time its password is set.
skills: [directory-structure]
