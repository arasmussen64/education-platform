id: dir-dn-parts
type: predict_shell
rev: 1
prompt: |
  `users.ldif` holds the `dn:` lines of five accounts from an LDAP search of the labs' domain (captured on 2026-11-11). The first command counts the accounts anywhere under the `Staff` unit; the second counts the ones directly in it. What is printed?
files:
  users.ldif: |
    dn: CN=Carol Diaz,CN=Users,DC=ad,DC=shop,DC=test
    dn: CN=Erin Moss,OU=Engineering,OU=Staff,DC=ad,DC=shop,DC=test
    dn: CN=Dave Okafor,OU=Staff,DC=ad,DC=shop,DC=test
    dn: CN=Bob Ito,CN=Users,DC=ad,DC=shop,DC=test
    dn: CN=Alice Ng,OU=Engineering,OU=Staff,DC=ad,DC=shop,DC=test
command: |
  grep -c 'OU=Staff,DC=ad,DC=shop,DC=test$' users.ldif; grep -c '^dn: CN=[^,]*,OU=Staff,' users.ldif
expected_output: |
  3
  1
explanation: |
  Read a DN from the right: `DC=test`, `DC=shop`, `DC=ad` is the domain `ad.shop.test`, and each part to the left is one folder deeper. Erin's `OU=Engineering,OU=Staff` puts her in Engineering, which is inside Staff, so she, Alice and Dave are all under Staff: three lines end in `OU=Staff,DC=ad,DC=shop,DC=test`. Only Dave's name is followed straight away by `OU=Staff`, so only he is directly in it. Carol and Bob are in `CN=Users`, the default container new accounts land in, which isn't an OU at all.
skills: [directory-structure]
