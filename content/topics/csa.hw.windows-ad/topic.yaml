id: csa.hw.windows-ad
kind: topic
status: draft
title: "Active Directory: domains, names and tickets"
summary: "What an Active Directory domain holds and how it's arranged, how a member finds a domain controller through DNS, how Kerberos proves who someone is with tickets instead of passwords, and when two domains need a trust; then standing up a domain controller of your own."
# Every Module 2 topic depends on Checkpoint 1 (the v1 spec's F10; the
# Module 2 plan, section 2). What it builds on in Module 1, for the writer:
# shell (grep, awk, cut, sort), permissions (users and groups, sudo),
# services (systemctl, journalctl), net-tools (dig, the "office" namespace
# pattern dc1 is made of) and hardening (a fix never weakens the server).
prerequisites: [csa.m1.checkpoint]
estimated_minutes: 290
rev: 1
objectives:
  - "Say what an Active Directory domain holds (users, groups, computers, organisational units, domain-wide settings such as the password rules) and how domains, forests and domain controllers fit together, and read a distinguished name right to left."
  - "Explain how a member finds a domain controller through the domain's DNS SRV records, and fix a machine whose resolver has never heard of the domain with a conditional forwarder for the domain's zone and its reverse zone."
  - "Explain how Kerberos proves identity with a ticket-granting ticket and service tickets, read `klist`, and name what each common `kinit` and Kerberos failure means, including the five-minute clock rule."
  - "Say when two domains need a trust, which way it points, and whether it passes along to a third."
  - "Stand up a domain controller: create the domain, forward what it can't answer, give its address a name, set the password rules, and start it at every boot."
# Facts the lesson and the items rely on, each read on 2026-11-11:
# - Kerberos tolerates 5 minutes of clock difference, and a user's first
#   ticket lasts 10 hours, by default in a domain (Default Domain Policy):
#   learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/maximum-tolerance-for-computer-clock-synchronization
#   and .../maximum-lifetime-for-user-ticket. The lab's KDC (Samba 4.19) gave
#   10-hour tickets too (klist, captured 2026-11-11).
# - MIT Kerberos: clockskew 300 seconds; kdc_timesync on by default; rdns on
#   by default: web.mit.edu/kerberos/krb5-latest/doc/admin/conf_files/krb5_conf.html
#   (release 1.22.3). Tried in the lab: +6 minutes works with kdc_timesync
#   on, fails with it off.
# - Members find DCs with SRV records named _ldap._tcp.<domain>; the DC
#   tells the client its site from its IP subnet: learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/dc-locator (dated 2025-07-10).
# - The KDC runs on every DC and uses the directory as its account database;
#   a TGT at sign-in, then a service ticket per service: learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-authentication-overview (dated 2026-09-14).
# - The forest is a security boundary; domains in a forest trust each other
#   two-way and transitively; an external trust is nontransitive; OUs carry
#   Group Policy links and delegation, containers such as CN=Users don't:
#   the Learn module's units 2 to 5 (each dated 2025-01-01, updated 2026-10-28).
# - In a one-way trust, members of the trusted domain reach resources in the
#   trusting one: learn.microsoft.com/en-us/entra/identity/domain-services/concepts-forest-trust (dated 2025-06-30).
# - Samba: don't use .local; the realm can't be renamed after provisioning;
#   Kerberos needs synchronised time on every member: the Samba wiki's
#   "Setting up Samba as an Active Directory Domain Controller" (edited
#   2026-06-01). Samba refuses a minimum password length over 14 ("must be
#   in the range of 0 to 14", captured in the lab).
# - .test never resolves on the internet: rfc-editor.org/rfc/rfc6761.html, 6.2.
# - AWS Simple AD "is powered by a Samba 4 Active Directory Compatible
#   Server" and "is no longer open to new customers":
#   docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_simple_ad.html
# - Azure: a virtual network's custom DNS servers; renew each VM's DHCP lease
#   after changing them; a DC in Azure forwards other names to 168.63.129.16:
#   learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances (dated 2025-07-24).
# Every command output in the lesson, the labs and the recall items marked
# "captured" is real output of the lab (Samba 4.19.5 on Ubuntu 24.04, MIT
# Kerberos 1.20.1), captured on 2026-11-11; times will differ in a new run.
#
