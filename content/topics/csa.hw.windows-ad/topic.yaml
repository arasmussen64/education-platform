prove:
  build: build-stand-up-dc
  explain:
    prompt: |
      A company runs Active Directory on two servers in its office and is moving its forty application servers to VMs in the cloud. A colleague says: "The domain is just a list of usernames and passwords; any server can check a password against it." Explain, in your own words: what an Active Directory domain holds and how it's arranged, including the settings that apply to the whole domain; how a server in the cloud network finds a domain controller, and how a person's identity is proved to that server without their password crossing the network; the two things outside the directory that all of this depends on, and what goes wrong when each fails; and when two domains need a trust, and which way it points. If you can, add one thing a lab built on Samba couldn't show you about a Windows domain.
    rubric:
      - id: what-the-domain-does
        required: true
        description: "One directory of user, group and computer accounts with a DNS name, held by domain controllers that each keep a copy; arranged in organisational units, folders that carry settings and delegated rights (read right to left in a distinguished name), while groups carry permissions; settings such as the password rules apply to every account in the domain; a forest of one or more domains is the security boundary."
      - id: finding-and-proving
        required: true
        description: "A member asks DNS for the domain's SRV records (_ldap._tcp, _kerberos._tcp under the domain's name), so it must use a resolver that knows the domain: the domain controllers' own DNS, or a conditional forwarder for the domain's zone and its reverse zone; identity is proved with Kerberos: once, with a key derived from the password, the KDC on a domain controller issues a ticket-granting ticket, then a service ticket for each service's name, which the service checks without calling the controller, and the password never crosses the network. DNS and time are the dependencies: no SRV answer means no KDC can be found, a missing reverse record means tickets are asked for the wrong name, and clocks more than five minutes apart are refused."
      - id: trust
        required: true
        description: "Two domains in different forests need a trust before one accepts the other's logins: the domain that holds the resources trusts the domain that holds the accounts, so access flows the opposite way to the trust; it can be one-way or two-way, and an external trust doesn't pass along to a third domain, while domains inside one forest trust each other automatically."
      - id: samba-limit
        required: false
        description: "The lab's domain controller was Samba: the protocols (DNS, Kerberos, LDAP) are the same, but Windows's own tools and a Windows member's sign-in and settings were never seen."
    model_answer: |
      A domain is much more than a list of passwords. It's a directory: one database of user, group and computer accounts, with a DNS name like ad.shop.test, and every domain controller holds a full copy of it. Accounts sit in organisational units, folders you read right to left in a distinguished name: CN=Alice Ng,OU=Engineering,OU=Staff,DC=ad,DC=shop,DC=test is Alice in Engineering, inside Staff, in ad.shop.test. Folders carry settings and who may manage them; groups carry permissions. Some settings, like the password rules, belong to the whole domain. One or more domains that share a schema make a forest, and the forest, not the domain, is the security boundary.

      A cloud server finds a domain controller through DNS. It asks for the SRV record _ldap._tcp.ad.shop.test, which names a host and port, so it must ask a resolver that knows the domain: the network's DNS setting pointed at the controllers, or a conditional forwarder for the domain's zone and its reverse zone. Then Kerberos proves who someone is. They show their password once, as a key derived from it, to the KDC on a domain controller and get a ticket-granting ticket for about ten hours. For each service they trade it for a service ticket for that service's name, like ldap/dc1.ad.shop.test, and the service checks it by itself. The password never crosses the network.

      The two outside dependencies are DNS and time. If the resolver can't answer the SRV records, nothing finds a KDC; if dc1's address has no reverse record, the client asks for a ticket for a name that doesn't exist. If clocks differ by more than five minutes, Kerberos refuses the request.

      Two forests need a trust before one accepts the other's logins. The domain with the resources trusts the domain with the accounts, so access flows the opposite way to the trust, and an external trust doesn't pass along to a third domain.

      Samba speaks the same protocols, but I never saw Windows's own tools or a Windows machine signing in.
