# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# DNS's own words (resolver, zone, SRV record) belong to the networking
# module's DNS topic, so they aren't here.
- term: LDAP
  aliases: [Lightweight Directory Access Protocol]
  definition: The language programs use to ask a directory questions, such as who an account is and which groups it's in.
- term: Active Directory
  aliases: [AD DS, Active Directory Domain Services]
  definition: 'Microsoft''s directory: one database of accounts, groups and computers that every member server asks, instead of keeping its own lists.'
- term: domain controller
  definition: A server that holds a full copy of a domain's directory and answers for it, running its KDC and usually its DNS. A domain has two or more, so one can fail.
- term: organisational unit
  aliases: [OU, organizational unit]
  definition: A folder in a domain's directory that can hold accounts, computers and other OUs, and carry settings. Settings follow OUs; permissions follow groups.
- term: forest
  definition: One or more Active Directory domains that share a design and trust each other automatically. The forest, not the domain, is the security boundary.
- term: Kerberos
  definition: 'How a domain proves who someone is, with tickets: prove yourself once to the KDC, then show a ticket for each service, so no password crosses the network.'
- term: ticket-granting ticket
  aliases: [TGT]
  definition: Kerberos's day pass, got once from the KDC with your password and traded for a service ticket for each service you use. Good for ten hours by default.
- term: keytab
  definition: A file holding an account's Kerberos keys, so a program or a machine can sign in without anyone typing a password. Whoever can read it can be that account.
