# The checks for "Stand up the shop's domain controller". Checks that ask
# dc1's own tools run inside its namespaces, the way on-dc does; the rest ask
# from lab, as any member would.
# A check that finds something wrong prints what it found, which fails the
# comparison: it exits 0 so the checker shows that sentence, not an exit status.
checks:
  - id: domain-answers
    description: "dc1 is running as the domain controller for ad.shop.test, short name SHOP, answers for the domain in DNS, and its service starts at boot."
    # dc1's name server answers a second or so after its service says it's
    # ready, so a check straight after a boot waits for it.
    command: |
      dc() { ip netns exec dc unshare --uts --mount --propagation private /usr/local/lib/lab/dc-enter "$@"; }
      systemctl is-active dc1 > /dev/null || { echo "dc1.service isn't running"; exit 0; }
      test "$(systemctl is-enabled dc1 2>/dev/null)" = enabled || { echo "dc1.service won't start at boot"; exit 0; }
      dc samba-tool domain info 10.0.9.10 2>/dev/null | grep -q '^Netbios domain *: SHOP$' || { echo "the domain's short name isn't SHOP"; exit 0; }
      for _ in $(seq 1 10); do
        srv=$(dig +short +time=2 +tries=1 @10.0.9.10 _kerberos._tcp.ad.shop.test SRV)
        [ -n "$srv" ] && break
        sleep 1
      done
      echo "$srv"
    expect:
      equals: "0 100 88 dc1.ad.shop.test."
  - id: dc-forwards
    description: "dc1 forwards the names it doesn't hold to the site's resolver."
    command: dig +short +time=2 +tries=1 @10.0.9.10 intranet.shop.internal
    expect:
      equals: "10.0.9.1"
  - id: people
    description: "gita and hugo are users in the Warehouse unit, and stock-team, a group in that unit too, has gita in it and not hugo."
    command: |
      dc() { ip netns exec dc unshare --uts --mount --propagation private /usr/local/lib/lab/dc-enter "$@"; }
      for user in gita hugo; do
        dc samba-tool user show "$user" 2>/dev/null | grep -qi '^dn: CN=[^,]*,OU=Warehouse,DC=ad,DC=shop,DC=test$' || { echo "$user isn't a user in OU=Warehouse"; exit 0; }
      done
      dc samba-tool group show stock-team 2>/dev/null | grep -qi '^dn: CN=stock-team,OU=Warehouse,DC=ad,DC=shop,DC=test$' || { echo "stock-team isn't a group in OU=Warehouse"; exit 0; }
      dc samba-tool group listmembers stock-team 2>/dev/null | sort | tr '\n' ' '
    expect:
      equals: "gita"
  - id: password-rules
    description: "The domain demands passwords of at least 14 characters and locks an account after 8 wrong ones."
    command: |
      dc() { ip netns exec dc unshare --uts --mount --propagation private /usr/local/lib/lab/dc-enter "$@"; }
      dc samba-tool domain passwordsettings show 2>/dev/null | awk -F': ' '/Minimum password length/ {len=$2} /Account lockout threshold/ {lock=$2} END {print "length " len ", lockout " lock}'
    expect:
      equals: "length 14, lockout 8"
  - id: finds-the-dc
    description: "Asked through lab's own resolver, the domain's SRV record names dc1, and the site's own names still resolve."
    command: |
      test "$(dig +short +time=2 +tries=1 intranet.shop.internal)" = 10.0.9.1 || { echo "the site's names no longer resolve"; exit 0; }
      dig +short +time=2 +tries=1 _ldap._tcp.ad.shop.test SRV
    expect:
      equals: "0 100 389 dc1.ad.shop.test."
  - id: resolves-backwards
    description: "Asked through lab's own resolver, 10.0.9.10 has the name dc1.ad.shop.test."
    command: dig +short +time=2 +tries=1 -x 10.0.9.10
    expect:
      equals: "dc1.ad.shop.test."
  - id: found-through-dns
    description: "lab finds dc1 through DNS alone: its hosts file names only lab, and its Kerberos settings name no server."
    command: |
      if grep -Eq '(^|[[:space:]])(10\.0\.9\.10|dc1(\.ad\.shop\.test)?)([[:space:]]|$)' /etc/hosts; then echo "lab's hosts file names dc1"; exit 0; fi
      if grep -Eqi '^[[:space:]]*(kdc|admin_server|kpasswd_server)[[:space:]]*=' /etc/krb5.conf; then echo "lab's Kerberos settings name a server"; exit 0; fi
      echo "through DNS"
    expect:
      equals: "through DNS"
  - id: kerberos-search
    description: "From lab, hugo, signed in with Kerberos, can search the directory at dc1.ad.shop.test by name with no password, and finds gita."
    command: |
      export KRB5CCNAME=FILE:/tmp/check-hugo-cc
      echo 'Hugo-Pass-123456' | kinit hugo@AD.SHOP.TEST > /dev/null 2>&1 || { echo "hugo can't get a ticket"; exit 0; }
      found=$(ldapsearch -Q -LLL -o nettimeout=5 -Y GSSAPI -H ldap://dc1.ad.shop.test -b 'DC=ad,DC=shop,DC=test' '(sAMAccountName=gita)' dn 2>&1 | grep '^dn:')
      kdestroy -q
      echo "$found"
    expect:
      matches: "^dn: CN=[^,]+,OU=Warehouse,DC=ad,DC=shop,DC=test$"
  - id: dc-still-strict
    description: "dc1 still refuses a password sent over an unencrypted LDAP connection."
    command: ldapsearch -x -o nettimeout=5 -H ldap://10.0.9.10 -D 'gita@ad.shop.test' -w 'Gita-Pass-123456' -b 'DC=ad,DC=shop,DC=test' -s base dn 2>&1 | head -n 2
    expect:
      contains: "Strong(er) authentication required"
