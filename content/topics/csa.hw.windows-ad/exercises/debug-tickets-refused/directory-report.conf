# Settings for the nightly directory report (/usr/local/bin/directory-report).
# DOMAIN is the domain's DNS name; REALM its Kerberos realm; ACCOUNT the
# service account the report signs in as; KEYTAB the file with its keys.
DOMAIN=ad.shop.test
REALM=AD.SHOP.TEST
ACCOUNT=svc-report
KEYTAB=/etc/svc-report.keytab
