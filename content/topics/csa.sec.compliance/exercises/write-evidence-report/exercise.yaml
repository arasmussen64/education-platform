id: write-evidence-report
stage: write
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "An evidence report for any control"
prompt: |
  The assessor will name a control and ask, "is it met, and how do you know?" Write the script that answers for any control the benchmark can test: `~/bin/evidence`.

  ```
  evidence FRAMEWORK CONTROL [CROSSWALK]
  ```

  - It finds the rules that the crosswalk maps to **exactly** that framework and control. The crosswalk is the file given as the third argument, or `/usr/share/lab-pay/refs.tsv` when there is none. Its lines are `rule`, `framework`, `control`, separated by tabs.
  - It runs those rules (`sudo oscap-rules RULE...` prints `rule result` for each) and prints each rule with its result, one to a line, in any order.
  - Then it prints one last line:
    - `not met` when any of the rules fails;
    - `met` when none fails and at least one passes;
    - `no automated evidence` when no rule is mapped to the control, or when none of its rules passes or fails here (every one is `notapplicable`).

  On this server, for example, where the minimum length is set and the other two password rules are not:

  ```
  $ ~/bin/evidence pci-dss-4.0 8.3.6
  accounts_password_pam_dcredit fail
  accounts_password_pam_lcredit fail
  accounts_password_pam_minlen pass
  not met
  ```

  What you need: `awk -F'\t' -v c="$2" '($3 "") == (c "")'` compares a whole column with a shell value, as text. The `""` on each side matters, and is new: when both sides look like numbers, `awk` compares them as numbers, so `$3 == c` would call 4.2 and 4.20 the same control. Joining each side to an empty string makes `awk` compare the characters. The rest you have met: `${3:-/some/default}` is the third argument, or the default when there is none; `$(...)` keeps a command's output; `grep ' fail$'` finds a line that ends in ` fail`. Create the file with `nano ~/bin/evidence`, start it with `#!/bin/bash`, and make it executable with `chmod +x ~/bin/evidence`.

  The checks run your script on a crosswalk they make up as they run, with a framework and control numbers you haven't seen (some differ by one character), then on the lab's own. The shell, `awk` and `oscap-rules` are the tools: a script that hands the work to another program fails.
hints:
  - "Three parts: find the rules (`rules=$(awk ... \"$refs\")`), stop early with `no automated evidence` when there are none (`[ -z \"$rules\" ]`), then run them once and keep what they print (`results=$(sudo oscap-rules $rules)`, with `$rules` unquoted so each name is its own argument)."
  - "Match both columns, as text: `awk -F'\\t' -v f=\"$1\" -v c=\"$2\" '$2 == f && ($3 \"\") == (c \"\") { print $1 }'`. A control number alone isn't enough: two frameworks can both have a 4.2. And without the empty strings, `awk` reads 4.2 and 4.20 as the same number."
  - "The last line: test for a failing line first (`echo \"$results\" | grep ' fail$' > /dev/null`), then for a passing one, and what is left is `no automated evidence`."
skills: [control-to-evidence, crosswalks, gaps-and-exceptions]
