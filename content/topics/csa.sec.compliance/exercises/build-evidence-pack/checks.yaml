# The checks of "The payments server's evidence pack". Each collects its own
# evidence from the machine: the benchmark's rules are run again
# (oscap-rules, the base's helper, never a whole profile), a real login as
# root is tried, the password library is read the way the sign-in programs
# read it, a line is logged and looked for on disk, and settings are read
# from the files that outlast a reboot (comply.sh). The pack is compared
# with the base's sealed crosswalk and this lab's own reference
# (pack-check), and every saved result with a fresh run: no file times.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: lab-intact
    description: "The benchmark, the crosswalk, the scanners, the scope and the collectors' list are as the lab shipped them."
    command: |
      . /usr/local/lib/lab-comp/comply.sh
      lab_intact
    expect:
      equals: intact
  - id: earlier-work-stands
    description: "The earlier work stands: the audit policy is untouched and its writer running, the audit trail is still on disk, sealed (with the auditors' key where it was left) and kept 365 to 400 days, and a fresh scan of the server finds no vulnerability."
    command: |
      . /usr/local/lib/lab-comp/comply.sh
      earlier_work_stands
    expect:
      equals: stands
  - id: sync-kept
    description: "The bank's settlement sync is as it was: rsync installed, the shop's unit enabled and answering on port 873, its settings untouched."
    command: |
      . /usr/local/lib/lab-comp/comply.sh
      sync_kept
    expect:
      equals: kept
  - id: root-login-off
    description: "A real login as root with an authorised key is turned away, and it would be after a reboot too."
    command: |
      . /usr/local/lib/lab-comp/comply.sh
      root_login_off behaviour
    expect:
      equals: "off"
  - id: passwords-met
    description: "The password library, read the way the sign-in programs read it, asks for at least 14 characters with a digit and a lower-case letter, and refuses a password that falls short."
    command: |
      . /usr/local/lib/lab-comp/comply.sh
      passwords_met behaviour
    expect:
      equals: met
  - id: journal-on-disk
    description: "The journal's settings that outlast a reboot keep it on disk, and a line logged a moment ago can be read from the journal's files on disk."
    command: |
      . /usr/local/lib/lab-comp/comply.sh
      journal_on_disk behaviour
    expect:
      equals: "on disk"
  - id: met-or-excepted
    description: "Every rule of every control in scope passes now, except the one rule the business can't pass, which has an exception. The check runs each of those rules again."
    command: /usr/local/lib/lab-comp/pack-check met
    expect:
      equals: right
  - id: one-exception
    description: "~/evidence/exception.txt is an exception for the one rule that can't pass: its control, why, a compensating control that names a limit the service's own settings put on it, the team that owns the server, and an expiry within a year."
    command: /usr/local/lib/lab-comp/pack-check exception
    expect:
      equals: right
  - id: pack-maps-right
    description: "~/evidence/pack.tsv gives every control in scope exactly its evidence: every rule the crosswalk maps to it and no other, or, where no rule maps, the collector or two that show what the assessor checks."
    command: /usr/local/lib/lab-comp/pack-check map
    expect:
      equals: right
  - id: evidence-current
    description: "Every result in ~/evidence/rules.txt and every collector's saved output is what the same rule or collector gives now."
    command: /usr/local/lib/lab-comp/pack-check current
    expect:
      equals: right
