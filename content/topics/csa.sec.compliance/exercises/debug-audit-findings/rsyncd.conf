# The settlement share: the bank's server fetches each night's settlement
# file from this rsync daemon (shop-sync.service). The bank's server is
# 198.51.100.7, and it may only read.
port = 873
use chroot = no
[settle]
    path = /srv/settle
    comment = nightly settlement files
    read only = yes
    hosts allow = 198.51.100.7
