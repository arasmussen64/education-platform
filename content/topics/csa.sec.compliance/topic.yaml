prove:
  build: build-evidence-pack
  debug: debug-audit-findings
  explain:
    prompt: |
      Your company takes card payments, is preparing for its first PCI DSS assessment, and wants a SOC 2 report next year. A director asks: "Can't we just pass the CIS benchmark and be done?" Explain, in your own words: what PCI DSS, SOC 2, ISO/IEC 27001 and NIST's CSF and SP 800-53 each are, who checks them and how they relate; how you'd decide which of your systems the card rules reach; how you'd read one control and turn it into a setting; how you'd show an assessor that a control is met, including one that no scanner rule tests; why one setting can count for several frameworks and what to watch for in a mapping; and what you'd do with a rule you can't pass. Then answer the director's question.
    rubric:
      - id: landscape
        required: true
        description: "PCI DSS: for anyone handling card data, binding by contract, checked by a qualified assessor or a self-assessment. SOC 2: an independent CPA firm's report on a service company's controls. ISO/IEC 27001: a certifiable management system. NIST's CSF: outcomes in six functions; SP 800-53: the free control catalogue that others build on and map to."
      - id: scope
        required: true
        description: "In scope: systems that store, process or transmit card data, systems with unrestricted connectivity to them (a flat network puts everything in), and systems that could affect their security (an admin jump host, the server that serves or redirects to the payment page). Out of scope only if separated so that taking it over couldn't affect card data. A provider's form shrinks what applies and doesn't remove responsibility for the page around it."
      - id: read-and-set
        required: true
        description: "A control is its statement with the parameters filled in by the organisation's policy; the discussion is guidance. The value becomes a setting in the setting's own units (30 minutes is 1800 seconds)."
      - id: evidence
        required: true
        description: "A benchmark rule run now where one exists; a reading of the configuration or another tool's report where none does; all of it the tool's own output, current, dated and something the assessor can run again. A screenshot or a stale file isn't enough, and a rule reads files, so behaviour is checked as well."
      - id: crosswalk
        required: true
        description: "The benchmark's references map one rule to controls in several frameworks, and one control to several rules that must all pass; identifiers are matched exactly; mappings belong to a version (SP 800-53 revision 4, ISO 27001:2013) and say a rule supports a control, not that the control is met."
      - id: exceptions
        required: true
        description: "A rule that can't pass gets a written exception: the reason, a compensating control that really exists, an owner and an expiry. It is never tailored out of the benchmark or hidden."
      - id: director
        required: true
        description: "No. A benchmark covers the configuration of one kind of system. It doesn't cover scope, retention, patching on time, access reviews, people and process, and compliant isn't the same as secure: the threat model decides what is needed beyond the floor."
    model_answer: |
      No, though passing the benchmark is a good part of it. Here is why.

      The documents are different kinds of thing. PCI DSS is the card brands' standard for anyone who stores, processes or transmits card data; we accepted it in our contract with the bank, and a qualified assessor (or, for a small merchant, a self-assessment) checks it. SOC 2 is a report: an independent CPA firm examines our controls against the AICPA's criteria and gives its opinion, which we show customers. ISO/IEC 27001 is a certification of how we manage security as a whole. NIST's CSF is a free framework of outcomes in six functions, and NIST's SP 800-53 is the free catalogue of controls that the others are built on or mapped to. The CIS benchmark is a list of settings for one operating system.

      First I'd settle scope. The card rules reach every system that card data is stored on or passes through, every system on a network with those and nothing filtering between, and every system that could affect them: the jump host admins use, the web server that sends shoppers to the payment page. A system is out only if it is separated so that taking it over couldn't touch card data. Using a provider's card form shrinks the list; it doesn't empty it.

      Then, control by control. A control is a statement with blanks, its parameters, which our policy fills in: lock an account after so many failures for so long. I turn each value into a setting in the setting's own units, 30 minutes into 1800 seconds. To show it is met I use evidence the assessor can run again: the benchmark rule that tests it, run today, saved as the tool printed it with the date. Where no rule exists, as for how long the audit trail is kept, the evidence is a reading of the configuration, or another tool's report such as this week's vulnerability scan. A rule reads files, so for anything that matters I also check what the running system does.

      One setting counts several times: the benchmark's own references map "no root login over SSH" to CIS, PCI DSS, HIPAA and NIST. That saves work, with three cautions. Match a control's number exactly. Check the versions, since our mappings are to SP 800-53 revision 4 and ISO's 2013 numbering. And a mapped rule supports a control; a control with three rules is met when all three pass.

      A rule we can't pass, such as "no rsync" on a server whose bank feed is rsync, gets a written exception: why, what limits the risk in its place, who owns it and when it ends. We never switch the rule off to make the report clean.

      So the benchmark gives us part of the evidence for part of the controls on some of the systems. Scope, retention, patching in time, who has access, and what we do when something goes wrong are all outside it. And passing everything is a floor: what this system needs beyond that comes from its threat model.
