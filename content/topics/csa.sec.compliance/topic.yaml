id: csa.sec.compliance
kind: topic
status: ready
title: Compliance basics
summary: "What the common security frameworks are and who checks each (SOC 2, ISO/IEC 27001, PCI DSS, HIPAA, FedRAMP, CMMC, GDPR, the CIS Benchmarks, NIST's CSF 2.0 and SP 800-53); how to read one control and turn it into a setting; which systems the card rules reach (PCI DSS scope); how to show an assessor that a control is met with evidence they can run again, including a control no scanner tests; why one setting counts for several frameworks; and what to do with a rule you can't pass."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 2,
# 3 and 5), its designer's brief (csa.sec.compliance.md) and the build notes
# (BUILD-NOTES.md), with the pay base as it was built
# (content/lab-bases/pay/README.md). Where they differ, in that order of
# weight: the build notes and the base win on how the base behaves, the
# plan on everything else.
#
# What the build notes changed:
# - Labs run named rules only, through the base's oscap-rules (a short name
#   for it, `oscap-rules`, is on the learner's PATH in every lab here). One
#   whole-profile run hung again while these labs were written (60 s, 218 of
#   408 results), so no lab or check runs the profile.
# - partition_for_tmp is "notapplicable" on the base, so the one accepted
#   exception is another rule: package_rsync_removed (CIS 2.1.13). It fails
#   honestly, and the server can't pass it, because the shop's settlement
#   sync (Vulnerability management's shop-sync.service) is an rsync daemon
#   the bank fetches from. A real organisation accepts that with a written
#   reason and a compensating control, which here is real: the share is
#   read-only and answers one address.
# - Tried on the base before the lesson, 2026-11-22: the three password
#   rules (accounts_password_pam_minlen, _dcredit, _lcredit) pass with
#   "minlen = 14", "dcredit = -1" and "lcredit = -1" in
#   /etc/security/pwquality.conf, fail with minlen = 12, and fail when the
#   settings are in a pwquality.conf.d folder (which the library itself
#   reads); journald_storage passes with Storage=persistent in a drop-in
#   under /etc and fails under /run, with a misspelt value, and with a later
#   drop-in that says volatile, and it passes when the main file says
#   persistent and a drop-in says volatile (so the checks also read the
#   settings in force); sshd_disable_root_login fails when any file says
#   yes, and passes on the files while a server that wasn't reloaded, or
#   was started with "-o PermitRootLogin=yes", still lets root in (so the
#   checks also try a real login with the base's root-login);
#   a tailoring file that unselects a rule leaves the rule out of a
#   tailored whole-profile report, and has no effect on a rule named with
#   --rule.
# - Found while the labs were built, and now part of them: a journal that
#   started in memory (Storage=volatile) goes on writing under /run after
#   its settings say persistent and journald is restarted, until
#   `journalctl --flush` or the next boot (the debug's prompt gives the
#   command); and awk compares `$3 == c` as numbers when both sides look
#   like numbers, so 4.2 equals 4.20 (the write lab's check makes such a
#   pair, and its prompt gives the comparison as text).
#
# This topic builds on csa.sec.audit (the audit journal namespace, its
# settings and `systemd-analyze cat-config`, retention, PCI DSS's 12
# months) and csa.sec.vulnerabilities (the offline scan, the register, due
# dates, exception and compensating control, which that topic's glossary
# owns), and through them on csa.sec.threat-modeling (risk, security
# control), csa.sec.authn-authz and csa.sec.crypto. From Module 1:
# csa.linux.hardening (what a CIS Benchmark is, Level 1 and 2, that OpenSCAP
# prints Title, Rule and Result, SSH drop-ins where the first value read
# wins, reload after an edit), csa.linux.shell and csa.linux.scripting (awk
# -F'\t' with -v, grep, sort, a script with chmod +x), csa.linux.services
# (systemctl cat, drop-ins, daemon-reload). From Module 3: subnets and
# firewalls.
#
# It defines, for the module (the plan's 3.5): framework, control objective,
# parameter, evidence, attestation, crosswalk, cardholder data environment
# and PCI DSS scope; and with them assessor, sample, stale evidence,
# segmentation and tailoring. It gives OSCAL, inherited controls and
# continuous compliance one sentence each (Module 20 owns them).
prerequisites: [csa.sec.audit, csa.sec.vulnerabilities]
# Worked out: the lesson about 37 minutes (4,792 words with its tables at
# 130 a minute), the copied reading 6 (NIST's news release, 832
# words), 26 practice quick items at 1.5 each 39, the worked example 30, the
# fill-in 30, the write 40, the build 60, the debug 45, the explain 20 and
# the puzzle about 3: 310. The plan's figure is 300.
estimated_minutes: 310
rev: 1
objectives:
  - "Say what each of the common frameworks is, whom it binds, who checks it and whether its text is free: SOC 2, ISO/IEC 27001, PCI DSS, the HIPAA Security Rule, FedRAMP, CMMC, GDPR, the CIS Benchmarks, and NIST's CSF 2.0 and SP 800-53; tell a law from a contract, a certification and a catalogue."
  - "Read a control: its identifier, its statement, the parameters the organisation fills in, its enhancements and its discussion; tell a requirement from guidance; turn a parameter into a setting in the setting's own units."
  - "Say which systems are in PCI DSS scope: the cardholder data environment, the systems connected to it or able to affect it, and what is out; what segmentation does, and what handing the card form to a provider changes and doesn't."
  - "Map a control to technical evidence: the benchmark rules that test it, a reading of the configuration or another tool's report where no rule exists, saved as the tool printed it, current, and something an assessor can run again."
  - "Use a crosswalk: one setting supports controls in several frameworks, one control needs several rules, a mapping belongs to one version of each side, and a mapped rule supports a control without proving it."
  - "Handle gaps and exceptions: a control nothing tests automatically, a rule that passes while the control isn't met, a benchmark stricter than the framework, a rule the business can't pass (a written exception with a compensating control, an owner and an expiry), and evidence that went stale."
# Facts the lesson, the items and the labs rely on, each read on 2026-11-22
# unless a line says otherwise.
# - NIST CSF 2.0: released 26 February 2024; six functions, Identify,
#   Protect, Detect, Respond, Recover and the new Govern; "all organizations
#   in any sector", where version 1 aimed at critical infrastructure:
#   nist.gov/news-events/news/2024/02/nist-releases-version-20-landmark-cybersecurity-framework
#   The framework's page links the document, the quick-start guides, the
#   informative references (mappings) and the CSF 2.0 tool:
#   nist.gov/cyberframework
# - NIST SP 800-53 Rev. 5: 20 control families; the newest release is
#   5.2.0 of 27 August 2025 (it adds SA-15(13), SA-24 and SI-02(07)):
#   csrc.nist.gov/pubs/sp/800/53/r5/upd1/final. The control texts quoted in
#   the lesson, the items and the labs (AC-6(2), AC-7, AU-11) are the pay
#   base's copies, made from NIST's OSCAL catalogue (public domain; the
#   base's data/SOURCES.md).
# - NIST on its own pages: except where marked as copyrighted, "information
#   presented on NIST sites are considered public information" and may be
#   shared or copied; credit is requested: nist.gov/oism/copyrights
# - PCI DSS v4.0.1: published June 2024, "a limited revision" with no
#   requirement added or removed; v4.0 retired on 31 December 2024; in
#   requirement 6 the wording went back to v3.2.1's, so that the 30-day
#   patching rule applies only to critical vulnerabilities (the PCI SSC's
#   announcement of 11 June 2024):
#   blog.pcisecuritystandards.org/just-published-pci-dss-v4-0-1
#   The standard itself: the PCI SSC's document library lists v4.0.1 and
#   refused the download to the tool used (HTTP 403), so its text was read
#   in a copy a college hosts
#   (middlebury.edu/sites/default/files/2025-01/PCI-DSS-v4_0_1.pdf, "v4.0.1
#   June 2024", "©2006 - 2024 PCI Security Standards Council, LLC. All
#   Rights Reserved"). Nothing of it is copied here; it is described, with
#   requirement numbers. Read there: section 4 (the requirements apply to
#   the cardholder data environment, which is the system components, people
#   and processes that store, process or transmit cardholder data or
#   sensitive authentication data, and the system components with
#   unrestricted connectivity to those; and to system components, people and
#   processes that could impact the security of that data; without adequate
#   segmentation, "a flat network", the entire network is in scope; to be
#   out of scope a component must be segmented so that it could not impact
#   the security of the data even if it were compromised; segmentation is
#   recommended, not required; scope is confirmed at least every 12 months,
#   requirement 12.5.2); 6.3.3 (critical vulnerabilities patched within one
#   month of release, the rest within a time the entity's own risk ranking
#   sets); 6.4.3 and 11.6.1 (payment-page scripts authorised, their
#   integrity assured and inventoried; a change- and tamper-detection
#   mechanism for payment pages); 8.3.4 (lock out after not more than 10
#   attempts, for at least 30 minutes or until identity is confirmed); 8.3.6
#   (at least 12 characters, numeric and alphabetic); 10.5.1 (audit log
#   history kept at least 12 months, the latest three immediately
#   available); 8.3.9 (where a password is the only factor, changed at
#   least once every 90 days, or the account's security posture analysed
#   dynamically); 3.3.1 (sensitive authentication data not stored after
#   authorization).
# - The PCI SSC's glossary: the CDE; cardholder data is at least the full
#   PAN; sensitive authentication data includes card verification codes,
#   full track data and PINs; a payment page may be an inline frame within a
#   non-payment page; QSA companies are qualified by the PCI SSC to validate
#   adherence; "Copyright © 2006 - 2026 PCI Security Standards Council, LLC.
#   All rights reserved": pcisecuritystandards.org/glossary/
# - The PCI SSC's scoping guidance: the information supplement "Guidance
#   for PCI DSS Scoping and Network Segmentation" (December 2016, revised
#   May 2017) sorts systems into CDE systems, connected-to and
#   security-impacting systems, and out-of-scope systems, which is where
