skills:
  - id: framework-landscape
    description: "The ten frameworks: what each is, whom it binds, who checks it and whether its text is free; laws (HIPAA, GDPR) against contracts (PCI DSS), certifications and reports you choose (ISO/IEC 27001, SOC 2), programmes for selling to the US government (FedRAMP, CMMC) and catalogues everything maps to (NIST's CSF and SP 800-53, the CIS Benchmarks); which are built on which"
  - id: read-a-control
    description: "The anatomy of a control: identifier, statement, parameters the organisation fills in, enhancements, discussion; requirement against guidance; PCI DSS's numbered requirements as identifiers; turning a parameter into a setting in the setting's units; reading a rule report"
  - id: control-to-evidence
    description: "Finding the rules that test a control and running them by name; evidence kinds (a rule's result, a configuration reading, another tool's report, a document); what makes evidence good (from the system, the tool's own output, current, dated, reproducible); a rule reads files and a server may behave otherwise; stale evidence"
  - id: crosswalks
    description: "One setting, many controls and one control, many rules, from the benchmark's own references; matching an identifier exactly; mappings carry versions (SP 800-53 revision 4 against 5, ISO 27001:2013 against 2022); supports against satisfies; compliant against secure"
  - id: gaps-and-exceptions
    description: "A control with no automated evidence; a failing rule the business can't pass and its written exception (reason, compensating control, owner, expiry); benchmark parameters against framework parameters; tailoring and what it hides; not-applicable results; coverage arithmetic"
  - id: pci-scope
    description: "What card data is; the cardholder data environment; in scope by storing, processing or transmitting, by unrestricted connectivity and by being able to affect security; what is out and why; segmentation and the flat network; what a provider's hosted page or framed form changes and doesn't (the page around it, PCI DSS 6.4.3 and 11.6.1)"
