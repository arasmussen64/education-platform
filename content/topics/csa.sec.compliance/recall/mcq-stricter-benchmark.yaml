id: mcq-stricter-benchmark
type: mcq
rev: 1
prompt: |
  The CIS benchmark's rule asks for passwords of at least 14 characters. PCI DSS (v4.0.1, requirement 8.3.6) asks for at least 12. A shop that must meet PCI DSS sets 12. What is true?
choices:
  - "Both are met: 12 is the minimum, and the benchmark's 14 is only advice"
  - "PCI DSS is met and the CIS rule fails: the shop records which it follows"
  - "Both fail: PCI DSS takes its password length from the CIS benchmark"
  - "PCI DSS fails: a requirement is met only when every rule mapped to it passes"
answer: 1
explanation: |
  The two documents set the same parameter differently. With 12 the shop meets PCI DSS's requirement, and the benchmark's rule, which tests for 14, fails. Both statements are true at once, and the pack has to say so: either set 14 and pass both, or keep 12 and record that the shop follows PCI DSS's value there, as an exception to the benchmark.

  The mapped rule is evidence *for* the requirement, not the requirement itself. When a rule is stricter than the control, a failing rule doesn't prove the control unmet; when it is looser, a passing rule doesn't prove it met. Read the parameter on both sides.
skills: [gaps-and-exceptions]
