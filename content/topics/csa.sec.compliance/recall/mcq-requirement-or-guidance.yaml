id: mcq-requirement-or-guidance
type: mcq
rev: 1
prompt: |
  A control in NIST SP 800-53 has a statement under "Control:", a "Discussion", and a list of related controls. An assessor is deciding whether the control is met. Which part must be true?
choices:
  - "The discussion, read as a list of things the system must do"
  - "The related controls, each of which must be met as well"
  - "Every example that the discussion gives of how others have met it"
  - "The control statement, with its parameters filled in by policy"
answer: 3
explanation: |
  The **statement** is the requirement, and it is only complete once the organisation has filled in its parameters: "retain audit records for [a time you define]" becomes "for 400 days". The assessor tests that sentence.

  The discussion is guidance: it explains the intent and gives examples, and none of its examples is mandatory. Related controls are pointers to neighbours, assessed on their own if they are in scope. Treating guidance as a requirement makes work nobody asked for; treating a requirement as guidance fails the assessment.
skills: [read-a-control]
