id: mcq-good-evidence
type: mcq
rev: 1
prompt: |
  An assessor asks for evidence that root can't log in to the payments server over SSH. Which is the strongest?
choices:
  - "A screenshot of the SSH settings file, taken last quarter"
  - "The hardening runbook, with the step for root's login ticked"
  - "A statement signed by the engineer who made the change"
  - "Today's result of the benchmark's rule, which they can rerun"
answer: 3
explanation: |
  Good evidence comes from the system itself, is current, and can be reproduced: the assessor runs the same rule and gets the same result. Today's rule result is all three.

  The screenshot was true last quarter, and nothing in a picture changes when the server does. The runbook shows what someone meant to do. The signed statement shows what someone believes. All three are evidence of a kind, and for a control about people (a policy exists, staff were trained) documents are the right kind. For a setting on a server, ask the server.
skills: [control-to-evidence]
