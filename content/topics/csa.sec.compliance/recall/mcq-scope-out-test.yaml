id: mcq-scope-out-test
type: mcq
rev: 1
prompt: |
  A team wants its reporting server declared out of PCI DSS scope. Which fact, if true, is the one that makes it so?
choices:
  - "It has never been sent a card number, in any report or any export"
  - "It is owned by another team, which has no part in taking payments"
  - "Even if it were taken over, it could not affect the security of card data"
  - "It runs a hardened image on which every rule of the CIS benchmark passes today"
answer: 2
explanation: |
  The standard's test for "out of scope" is about consequences: the system must be separated from the cardholder data environment so that it couldn't affect the security of card data **even if it were compromised**. That is a claim about the network and about access (no path to the card systems, nothing administered from it), and the assessor verifies it.

  "No card data reaches it" is necessary and not enough: the print server on the payments subnet has no card data either. Who owns a system doesn't move it in or out. And hardening is what you do to systems that are in scope; it isn't a way out.
skills: [pci-scope]
