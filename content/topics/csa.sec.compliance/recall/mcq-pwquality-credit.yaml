id: mcq-pwquality-credit
type: mcq
rev: 1
prompt: |
  The shop's policy says a new password needs at least one digit. Which line in `/etc/security/pwquality.conf` says that?
choices:
  - "`dcredit = 1`: the number is how many digits a password needs"
  - "`dcredit = -1`: a negative credit is a minimum number of digits"
  - "`dcredit = 0`: zero is what switches the rule for digits on"
  - "`minlen = 1`: the length rule is what counts digits as well"
answer: 1
explanation: |
  In `pwquality.conf` a **negative** credit is a minimum count: `dcredit = -1` means at least one digit, and `lcredit = -1` at least one lower-case letter. A positive credit is a bonus towards the minimum length for using that kind of character, and it demands nothing, so `dcredit = 1` looks like the policy and lets a password with no digit through. Zero, the default, asks for nothing either. `minlen` is only the length.

  This is the second half of turning a parameter into a setting. The first is the unit (minutes into seconds). The second is what the setting's number means, which only its manual page tells you.
skills: [read-a-control]
