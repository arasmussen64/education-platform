id: mcq-soc2-who
type: mcq
rev: 1
prompt: |
  A customer asks your software company for "your SOC 2". Who produces that report?
choices:
  - "The AICPA itself, which inspects each company that applies"
  - "An ISO certification body, accredited in the company's country"
  - "The cloud provider whose services the company is built on"
  - "An independent CPA firm, which the company hires to examine it"
answer: 3
explanation: |
  A SOC 2 report is an **attestation**: an independent firm of certified public accountants examines the company's controls against the AICPA's Trust Services Criteria (security, availability, processing integrity, confidentiality and privacy) and writes its opinion. A Type 1 report says the controls were suitably designed, as of one date; a Type 2 report adds that they operated effectively throughout a period.

  The AICPA writes the criteria and the professional standards and examines nobody. A certification body issues ISO certificates, a different thing. Your cloud provider has its own SOC 2 for the parts it runs, which you can download; it says nothing about how you run yours.
skills: [framework-landscape]
