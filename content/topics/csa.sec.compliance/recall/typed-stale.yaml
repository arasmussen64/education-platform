id: typed-stale
type: typed
rev: 1
prompt: |
  In March a rule's result was saved as evidence: it passed. In June someone changed the server and the rule now fails. The saved file still says the March result. What one word does this topic use for evidence that no longer matches the system?
kind: text
answers:
  - "stale"
  - "stale evidence"
mistakes:
  - id: old
    answers: ["old", "outdated", "out of date", "expired"]
    why: "That is the idea. The word this topic uses is stale: evidence that was true when it was collected and isn't any more."
  - id: falsified
    answers: ["false", "fake", "forged", "wrong"]
    why: "Nobody falsified it: it was true in March. Evidence that was true and no longer matches the system is stale."
explanation: |
  **Stale.** Nothing in a saved file changes when the server does, so every piece of evidence starts going stale the moment it is collected. That is why evidence carries a date, why an assessor asks for a fresh run, and why a pack is collected again before it is handed over.
skills: [control-to-evidence]
