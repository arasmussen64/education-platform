id: mcq-which-applies
type: mcq
rev: 1
prompt: |
  A small online shop in Germany takes card payments on its own site and keeps its customers' names and addresses. Which rules apply to it because of those two facts?
choices:
  - "HIPAA for the customer records, and SOC 2 for taking the card payments"
  - "FedRAMP for the site's hosting, and CMMC for the customer records"
  - "PCI DSS for the card data, and GDPR for the customers' personal data"
  - "ISO/IEC 27001 alone, since its certificate covers both kinds of data"
answer: 2
explanation: |
  Sort each rule by what triggers it. **PCI DSS** applies to anyone who stores, processes or transmits payment card data: the shop agreed to it in its contract with the bank that lets it take cards. **GDPR** is EU law for the personal data of people in the EU: names and addresses are personal data, and no contract is needed for a law to apply.

  HIPAA is US law for health data, and SOC 2 is a report a service company chooses to commission for its customers. FedRAMP and CMMC bind companies that sell to the US government. ISO/IEC 27001 is a certification a company chooses to earn; holding one doesn't replace a contract or a law.
skills: [framework-landscape]
