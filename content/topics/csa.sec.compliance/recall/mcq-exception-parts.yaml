id: mcq-exception-parts
type: mcq
rev: 1
prompt: |
  The benchmark has a rule that rsync must not be installed. The payments server fails it and always will: the bank's server fetches settlement files from its rsync daemon every night. What do you do with the failing rule?
choices:
  - "Remove the rule from the profile, so that the report shows no failure"
  - "Uninstall rsync before each scan and install it again afterwards"
  - "Write an exception: the reason, a compensating control, an owner, an expiry"
  - "Leave it failing in the report and explain it if an assessor ever asks"
answer: 2
explanation: |
  A rule that can't pass for a business reason becomes a written **exception**: which control and rule, why, what limits the risk in its place (the share is read-only and answers only the bank's address), who owns the decision, and when it ends and must be looked at again. The rule keeps failing in every report, and the exception answers it.

  Removing the rule hides the gap: nobody owns it and nobody reviews it. Uninstalling for the scan makes the evidence false. Leaving it unexplained means the first person to decide whether it is acceptable is the assessor.
skills: [gaps-and-exceptions]
