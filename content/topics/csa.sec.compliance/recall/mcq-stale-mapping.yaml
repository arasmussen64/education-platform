id: mcq-stale-mapping
type: mcq
rev: 1
prompt: |
  Your crosswalk maps a rule to "ISO 27001 A.9.4.2". Your company is being certified against ISO/IEC 27001:2022. What should you do with that mapping?
choices:
  - "Use it as it is: Annex A's numbers are the same in every edition"
  - "Translate it first: A.9.4.2 is the 2013 edition's numbering, not 2022's"
  - "Drop the rule from the scan: it no longer applies to any ISO control"
  - "Use it as it is: an auditor accepts whichever edition the tool uses"
answer: 1
explanation: |
  A.9.4.2 is a control number from the **2013** edition, which had 114 controls in 14 groups. The 2022 edition has 93 controls in four themes, numbered differently, so an auditor working from 2022 has no A.9.4.2 to look up. The rule still tests something real; the mapping needs translating to the 2022 control it now supports.

  Every mapping is between one version of a benchmark and one version of a framework, and both keep moving. The labs' crosswalk also maps to NIST SP 800-53 revision 4 while revision 5 is current. Check the version before you hand a mapping to someone who works from another.
skills: [crosswalks]
