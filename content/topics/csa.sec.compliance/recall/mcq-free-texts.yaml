id: mcq-free-texts
type: mcq
rev: 1
prompt: |
  You want to read two of the documents in full tonight, for free, without buying anything or accepting any agreement. Which pair can you?
choices:
  - "ISO/IEC 27001 and its companion ISO/IEC 27002"
  - "PCI DSS and the text of ISO/IEC 27001's Annex A"
  - "NIST's CSF 2.0 and NIST's SP 800-53 catalogue"
  - "A competitor's SOC 2 report and the CIS Benchmarks"
answer: 2
explanation: |
  NIST's publications are works of the US government: the **CSF 2.0** and **SP 800-53** are free to download, copy and quote. That is why everything else gets mapped to them, and why this topic's labs can carry NIST's control text.

  ISO's standards are sold. PCI DSS is free to read, but from the PCI council's library under its own terms, and it may not be copied. The CIS Benchmarks are downloaded from CIS's own site, and CIS holds their copyright. And a SOC 2 report belongs to the company it describes, which shares it under a confidentiality agreement.
skills: [framework-landscape]
