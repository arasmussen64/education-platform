id: mcq-scope-provider-frame
type: mcq
rev: 1
prompt: |
  A shop's checkout page used to have its own card form. Now the page shows the payment provider's form inside a frame, so card numbers go straight from the shopper's browser to the provider. What has the change done to the shop's web server?
choices:
  - "It is out of scope: no card data reaches it, so no rule applies to it"
  - "It left the card-handling group, and can still affect the page around the form"
  - "Nothing has changed: a server that shows a card form handles card data"
  - "It is out of scope, and the provider is now responsible for the whole site"
answer: 1
explanation: |
  The web server no longer stores, processes or transmits card data, so far fewer requirements apply to it. It is still in scope as a system that **could impact** the security of card data: it serves the page the frame sits in, and whoever controls that page can swap the frame for a form of their own.

  That is why PCI DSS v4.0.1 has requirements about the scripts on a payment page (6.4.3) and about detecting changes to it (11.6.1), and why a shop that embeds a provider's form must confirm its page can't be attacked through scripts. Using a compliant provider reduces what you must do. It doesn't hand over your responsibility for your own page.
skills: [pci-scope]
