id: mcq-tailoring
type: mcq
rev: 1
prompt: |
  The week before an audit, a colleague "tailors" the benchmark: a tailoring file switches off the nine rules that fail, and the report now shows no failures. What has happened?
choices:
  - "Nothing wrong: tailoring is how a team is meant to reach a clean report"
  - "The nine gaps are still there and the report no longer shows them"
  - "The server is now more secure, since nine weak rules are out of the way"
  - "The audit is void, because no framework allows a benchmark to be tailored"
answer: 1
explanation: |
  Tailoring changes what is measured, not what is true. The nine settings are as they were; the report has simply stopped looking. Gaps that nobody can see are gaps that nobody owns, and an assessor who runs the untailored profile finds all nine in a minute.

  Tailoring has an honest use: leaving out rules that don't apply to this kind of system, or setting a parameter to the organisation's own value, each recorded with its reason. A rule that applies and fails is fixed or gets a written exception. It is never switched off.
skills: [gaps-and-exceptions]
