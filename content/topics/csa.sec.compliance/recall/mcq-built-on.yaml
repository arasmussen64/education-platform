id: mcq-built-on
type: mcq
rev: 1
prompt: |
  A defence contractor is told it needs "CMMC Level 2". Where do Level 2's security requirements come from?
choices:
  - "ISO/IEC 27001's Annex A, as it stood in the 2022 edition"
  - "NIST SP 800-171: Level 2's requirements are identical to it"
  - "The CIS Benchmarks for each operating system the firm runs"
  - "The AICPA's Trust Services Criteria, as a SOC 2 report uses"
answer: 1
explanation: |
  The CMMC rule (32 CFR 170.14) says Level 2's requirements are identical to those in **NIST SP 800-171** Revision 2, NIST's requirements for protecting controlled unclassified information outside the government. Level 1 is a short list from the federal acquisition rules, and Level 3 adds requirements chosen from SP 800-172.

  The pattern is general: many programmes don't write controls of their own. They point at a NIST document and add who must be assessed, by whom and how often. FedRAMP's baselines are selections from SP 800-53 in the same way.
skills: [framework-landscape]
