id: est-gdpr-hours-left
type: estimate
rev: 1
prompt: |
  A company became aware of a breach of personal data on Tuesday at 14:00. It is now Thursday at 10:00, 44 hours later. GDPR gives it 72 hours from becoming aware to notify the supervisory authority. How many hours are left? Exactly.
unit: hours
answer: 28
tolerance: { absolute: 0 }
given: { limit: 72, gone: 44 }
working: limit - gone
mistakes:
  - id: hours-gone
    value: 44
    working: gone
    why: That is the time already used. The question is what remains of the 72.
  - id: three-working-days
    value: 52
    working: limit - (gone - 24)
    why: That leaves a day out of the count. The 72 hours are clock hours from the moment of becoming aware; nights and weekends count.
explanation: |
  72 - 44 = **28** hours: the notice is due by Friday at 14:00. The period is counted in hours on the clock from the moment the company became aware, with no pause for nights or weekends.

  A deadline like this is a parameter too, one the law filled in for you. Turned into a design requirement it reads: within three days of an alarm we must be able to say what was taken, from which systems and about how many people.
skills: [read-a-control]
