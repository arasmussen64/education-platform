id: mcq-compliant-secure
type: mcq
rev: 1
prompt: |
  Every rule of the CIS Level 1 benchmark passes on a server. What does that tell you?
choices:
  - "The server meets that baseline; whether that is enough depends on its threats"
  - "The server is secure against every attack that is known about today"
  - "The server now also meets PCI DSS, since the benchmark's rules are mapped to it"
  - "The server needs no further scans until the benchmark's next version"
answer: 0
explanation: |
  A passing benchmark says the server matches a published baseline of settings. That is worth having and worth proving. It doesn't say the server is secure enough: a baseline is written for the average server and knows nothing about what this one holds or who wants it. The threat model decides what this system needs beyond the floor.

  It doesn't make the server PCI DSS compliant either. The crosswalk says a rule *supports* a requirement. PCI DSS also asks for things no configuration rule tests: retention, patching on time, scope, who has access and how incidents are handled.
skills: [crosswalks]
