id: typed-scope-word
type: typed
rev: 1
prompt: |
  This topic's labs give every system one of three scope words. One word is for a system that card data never reaches, but that could change what happens to card data if it were taken over: a jump host that admins reach the payments server through, or a web server that sends shoppers to the page where they pay. Which word?
kind: text
answers:
  - "impacting"
  - "security-impacting"
  - "security impacting"
mistakes:
  - id: cde
    answers: ["cde", "in the cde", "cardholder data environment"]
    why: "That word is for systems that card data is stored on or passes through, and for systems on an unfiltered network with them. A jump host on its own subnet, behind a firewall, is in scope for another reason."
  - id: out
    answers: ["out", "out of scope"]
    why: "It isn't out: taking it over is a way in to the card systems, so the requirements reach it."
  - id: connected
    answers: ["connected", "connected-to", "connected to"]
    why: "That is the idea, and the PCI council's guidance uses the phrase. The labs' word for it is the one about what the system could do to card data."
explanation: |
  **`impacting`.** The three words are `cde` (card data is stored on it or passes through it, or it shares an unfiltered network with such a system), `impacting` (no card data, but it could affect the security of card data: it administers, signs people in to, or steers shoppers towards a card system) and `out` (neither, and separated). The first two are both in scope.
skills: [pci-scope]
