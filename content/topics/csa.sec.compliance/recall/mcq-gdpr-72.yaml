id: mcq-gdpr-72
type: mcq
rev: 1
prompt: |
  Under GDPR, a company learns that customers' personal data was taken in a breach that puts those people at risk. When must it tell the supervisory authority?
choices:
  - "Without undue delay, and where feasible within 72 hours of becoming aware"
  - "Within 72 hours of the moment the breach itself began, whether or not it is known yet"
  - "Within 30 days of becoming aware, once the facts are established"
  - "Only once its own investigation has closed and the cause is known"
answer: 0
explanation: |
  Article 33 says: without undue delay and, where feasible, not later than 72 hours **after having become aware** of the breach. The clock starts when the company knows, not when the attacker got in, which may have been months earlier. If the notice is later than 72 hours it must come with reasons, and details that aren't known yet can follow in stages.

  That is why an architect cares: you can only report in three days what your audit trail lets you find out in three days.
skills: [framework-landscape]
