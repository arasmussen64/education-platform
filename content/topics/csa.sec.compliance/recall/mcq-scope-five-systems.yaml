id: mcq-scope-five-systems
type: mcq
rev: 1
prompt: |
  A bike shop has five systems. (1) A till that reads cards. (2) A stock server on the till's subnet, with no filtering between them. (3) A laptop the owner administers the till from. (4) A database of card numbers kept for repeat customers. (5) A guest Wi-Fi player, behind a firewall that blocks all traffic to and from the rest. Which are in PCI DSS scope?
choices:
  - "1 and 4 only: the two systems that card numbers actually reach"
  - "1, 2 and 4: the card systems and their subnet, but not the laptop"
  - "All five: one business, one scope, whatever the network looks like"
  - "1, 2, 3 and 4: everything but the walled-off Wi-Fi player"
answer: 3
explanation: |
  The till (1) and the database (4) handle card data. The stock server (2) never does, and is in the cardholder data environment anyway, because nothing separates it from the till. The laptop (3) holds no card data and is in scope because the till is administered from it: take over the laptop and you can change the till.

  Only the Wi-Fi player (5) is out: no card data, no way to administer a card system, and a firewall that stops it reaching one. In scope means "stores, processes or transmits card data, is connected to something that does, or could affect its security". Out of scope has to be earned by separation.
skills: [pci-scope]
