id: mcq-law-or-contract
type: mcq
rev: 1
prompt: |
  A hospital group's lawyer asks which of four documents on the security team's list is **law**: something the group must obey whether or not it ever signed or chose anything. Which one?
choices:
  - "PCI DSS, which the card brands publish through a council"
  - "The HIPAA Security Rule, part of the US federal regulations"
  - "ISO/IEC 27001, which a standards body publishes and sells"
  - "The CIS Benchmarks, which a non-profit's volunteers agree on"
answer: 1
explanation: |
  The **HIPAA Security Rule** is regulation, in 45 CFR Part 164, binding on US health-care organisations and the companies that handle health data for them. Nobody opts in.

  PCI DSS binds through a contract: you accept it when you sign up to take cards. ISO/IEC 27001 is a standard you choose to be certified against. The CIS Benchmarks are configuration guides nobody has to follow unless a contract or their own policy says so. The difference matters when they conflict: a law wins.
skills: [framework-landscape]
