id: mcq-no-rule
type: mcq
rev: 1
prompt: |
  The card rules ask that the audit trail is kept for at least 12 months. You look the control up in the benchmark's crosswalk, and no rule is mapped to it. What goes in the evidence pack?
choices:
  - "The result of the journal-storage rule, since it passes and is also about logs"
  - "A reading of the audit journal's retention settings, as the tool prints them"
  - "Nothing: a control that no rule can test is marked not applicable"
  - "A rule of your own that always passes, added by tailoring the benchmark"
answer: 1
explanation: |
  No rule doesn't mean no evidence. It means evidence of another kind: a **reading of the configuration**, here the audit journal's settings in force with its retention line, printed by the system's own tool and saved as printed.

  The journal-storage rule tests something else (that the server's own journal is on disk), so it passing says nothing about how long the audit trail is kept. "Not applicable" is for a control that doesn't apply to the system, and this one plainly does. And a rule written to pass tests nothing.
skills: [control-to-evidence]
