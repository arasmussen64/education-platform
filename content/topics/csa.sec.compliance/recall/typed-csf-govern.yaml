id: typed-csf-govern
type: typed
rev: 1
prompt: |
  Version 1.1 of NIST's Cybersecurity Framework had five functions: Identify, Protect, Detect, Respond and Recover. Version 2.0, of February 2024, added a sixth, about how the organisation sets and oversees its cybersecurity strategy and policy. Name the function. One word.
kind: text
answers:
  - "Govern"
  - "Governance"
mistakes:
  - id: manage
    answers: ["Manage", "Management"]
    why: "Close in meaning, but the function's name is Govern."
  - id: comply
    answers: ["Comply", "Compliance"]
    why: "The CSF has no Comply function. The sixth function is Govern: who decides, who is accountable and what the policy is."
explanation: |
  **Govern.** The six functions are Govern, Identify, Protect, Detect, Respond and Recover. Govern sits over the other five: it covers who is accountable, what the strategy and policy are, and how suppliers are managed. Version 2.0 also widened the framework's audience from critical infrastructure to organisations of every size and sector.
skills: [framework-landscape]
