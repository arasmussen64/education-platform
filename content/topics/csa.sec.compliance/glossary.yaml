# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# "Exception" and "compensating control" are Vulnerability management's,
# "security control" is Threat modeling's and "CIS Benchmark" is
# Hardening's: this lesson uses them and doesn't define them again.
- term: framework
  aliases: [control framework]
  definition: A published set of security controls or outcomes that an organisation agrees, or is made, to meet, such as PCI DSS, ISO/IEC 27001 or NIST's CSF. It says what must be true, not how.
- term: control objective
  definition: What a control is for, stated as an outcome ("only authorised people can change payment settings"). The control is the measure that achieves it, and the evidence shows the measure works.
- term: parameter
  definition: "A blank in a control's statement that the organisation fills in with its own value, such as a number of attempts. NIST writes one as an Assignment in square brackets. The control is complete only once it is filled."
- term: evidence
  definition: What shows an assessor that a control is met on a real system, such as a scanner rule's result, a reading of the configuration, a tool's report or a document. Good evidence is current and can be collected again.
- term: stale evidence
  definition: Evidence that was true when it was collected and no longer matches the system, because the system changed afterwards and a saved file doesn't.
- term: assessor
  aliases: [auditor]
  definition: The independent person or firm that examines an organisation against a framework, by testing a sample of its controls and evidence. For PCI DSS it is a qualified security assessor, a QSA.
- term: attestation
  definition: An independent examiner's written opinion about an organisation's controls, such as a SOC 2 report. A certification goes further, with a certificate issued against a standard, as for ISO/IEC 27001.
- term: crosswalk
  aliases: [control mapping]
  definition: A table that maps the controls of one framework, or the rules of a benchmark, to the controls of others, so one piece of work or evidence can count for several. Each mapping belongs to one version of each side.
- term: cardholder data environment
  aliases: [CDE]
  definition: The systems, people and processes that store, process or transmit payment card data, together with every system that has unrestricted connectivity to them.
- term: PCI DSS scope
  definition: Everything PCI DSS's requirements apply to. It covers the cardholder data environment and any system that could affect the security of card data, such as one that administers a card system or serves its payment page.
- term: segmentation
  definition: Separating the systems that handle card data from the rest of the network, with firewalls or other filtering, so that the rest is out of PCI DSS scope. Without it, a flat network, everything is in scope.
- term: tailoring
  definition: Changing a benchmark profile for your own use by switching rules off or changing their values. Honest for rules that don't apply and recorded with reasons. Used to hide failing rules, it hides gaps.
