# The payments-server base's probe: a sealed audit trail that a check tampers
# with, OpenSCAP against the pinned benchmark, and OSV-Scanner offline
# against its frozen records. The helpers are the base's
# (/usr/local/lib/lab-pay; content/lab-bases/pay/README.md lists them).
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: sealed-for-auditors
    description: "The audit trail is sealed, and the key in /srv/auditors/verify-key vouches for a sign-in made a moment ago."
    # The one wait of a check run: a seal is written every 10 seconds, so
    # the key can vouch for a new sign-in within about 20.
    timeout: 60
    command: |
      key=$(cat /srv/auditors/verify-key 2> /dev/null)
      [ -n "$key" ] || { echo "there is no verification key in /srv/auditors/verify-key"; exit 0; }
      journal=/var/log/journal/$(cat /etc/machine-id).audit/system.journal
      journalctl --file="$journal" --header 2> /dev/null | grep -q 'Compatible flags:.*SEALED' \
        || { echo "the audit journal's newest file is not a sealed one"; exit 0; }
      marker=chk-$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')
      when=$(date -u +%FT%TZ)
      shop-cli login.ok user="$marker" > /dev/null 2>&1 || { echo "the shop isn't answering (systemctl status shop-audit)"; exit 0; }
      for try in $(seq 1 15); do
        said=$(/usr/local/lib/lab-pay/seal-range audit "$key")
        read -r state from to <<< "$said"
        if [ "$state" = sealed ] && [[ ! $to < $when ]] \
          && journalctl --namespace=audit -t shop-audit -o cat | grep -q "user=$marker "; then
          echo "sealed"; exit 0
        fi
        sleep 2
      done
      echo "the auditors' key doesn't vouch for a sign-in made half a minute ago: $said"
    expect:
      equals: "sealed"
  - id: tamper-shows
    description: "A copy of the trail with a few bytes changed fails the auditors' verification, and a copy rewritten entry by entry has no sealed time range, while the trail itself has one."
    timeout: 60
    command: |
      lib=/usr/local/lib/lab-pay
      key=$(cat /srv/auditors/verify-key 2> /dev/null)
      [ -n "$key" ] || { echo "there is no verification key in /srv/auditors/verify-key"; exit 0; }
      journal=/var/log/journal/$(cat /etc/machine-id).audit/system.journal
      marker=chk-$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')
      shop-cli login.ok user="$marker" > /dev/null 2>&1 || { echo "the shop isn't answering (systemctl status shop-audit)"; exit 0; }
      for try in $(seq 1 10); do
        journalctl --namespace=audit -t shop-audit -o cat | grep -q "user=$marker " && break
        sleep 0.5
      done
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      # The file is being written while it is copied; a copy caught halfway
      # is taken again.
      for try in 1 2 3; do
        cp "$journal" "$work/copy.journal" 2> /dev/null || { echo "the audit trail has no file on disk"; exit 0; }
        real=$($lib/seal-range --file "$work/copy.journal" "$key")
        case $real in sealed*) break ;; esac
        sleep 1
      done
      case $real in sealed*) ;; *) echo "the trail itself has no sealed time range for the auditors' key: $real"; exit 0 ;; esac
      # The careless attacker: bytes changed in place.
      cp "$work/copy.journal" "$work/flipped.journal"
      lab-flip "$work/flipped.journal" "user=$marker" "user=${marker/chk-/xxx-}" > /dev/null 2>&1 \
        || { echo "the check's own sign-in isn't in the trail's file"; exit 0; }
      flipped=$($lib/seal-range --file "$work/flipped.journal" "$key")
      case $flipped in failed*) ;; *) echo "a copy with changed bytes went unnoticed: $flipped"; exit 0 ;; esac
      # The careful attacker: every entry written again, one of them changed.
      lab-forge-journal "$work/copy.journal" "$work/forged.journal" "user=$marker" "user=somebody-else" > /dev/null 2>&1
      journalctl --file="$work/forged.journal" -t shop-audit -o cat 2> /dev/null | grep -q "user=somebody-else " \
        || { echo "the check couldn't rewrite a copy of the trail"; exit 0; }
      forged=$($lib/seal-range --file "$work/forged.journal" "$key")
      [ "$forged" = unsealed ] || { echo "a rewritten copy wasn't told from the real trail: $forged"; exit 0; }
      echo "both changes show"
    expect:
      equals: "both changes show"
  - id: root-login-off
    description: "The benchmark's rule sshd_disable_root_login passes, and the running SSH server turns away a login as root."
    command: |
      lib=/usr/local/lib/lab-pay
      rule=$($lib/oscap-rules sshd_disable_root_login 2>&1)
      [ "$rule" = "sshd_disable_root_login pass" ] || { echo "the benchmark says: $rule"; exit 0; }
      login=$($lib/root-login)
      [ "$login" = refused ] || { echo "a login as root over SSH: $login"; exit 0; }
      echo "root is turned away"
    expect:
      equals: "root is turned away"
  - id: benchmark-steady
    description: "The benchmark answers the same for four named rules three times in a row, and the three rules this lab leaves alone say what they said in the image."
    timeout: 60
    command: |
      lib=/usr/local/lib/lab-pay
      rules="sshd_disable_root_login accounts_password_pam_minlen journald_storage partition_for_tmp"
      first=$($lib/oscap-rules $rules 2>&1) || { echo "OpenSCAP gave no result for a rule: $(echo "$first" | tr '\n' ';')"; exit 0; }
      for run in 2 3; do
        again=$($lib/oscap-rules $rules 2>&1)
        [ "$again" = "$first" ] || { echo "run $run differs from run 1: $(echo "$again" | tr '\n' ';')"; exit 0; }
      done
      rest=$(echo "$first" | tail -n 3 | tr '\n' ';')
      [ "$rest" = "accounts_password_pam_minlen fail;journald_storage fail;partition_for_tmp notapplicable;" ] \
        || { echo "the rules this lab leaves alone say: $rest"; exit 0; }
      echo "steady"
    expect:
      equals: "steady"
  - id: sudo-patched
    description: "sudo is at a fixed version and still works, and a fresh scan lists the image's seven findings without sudo's two."
    command: |
      lib=/usr/local/lib/lab-pay
      original=$($lib/scan-tsv dpkg-status:/usr/share/lab-pay/original-dpkg-status 2> /dev/null)
      [ "$(echo "$original" | grep -c .)" -eq 7 ] || { echo "a scan of the image's package list finds $(echo "$original" | grep -c .) findings, not seven"; exit 0; }
      now=$($lib/scan-tsv 2> /dev/null) || { echo "the scanner didn't run"; exit 0; }
      want=$(echo "$original" | awk -F'\t' '$2 != "sudo"')
      [ "$now" = "$want" ] || { echo "a fresh scan lists: $(echo "$now" | cut -f1,2 | tr '\t\n' ' ;')"; exit 0; }
      fixed=$(echo "$original" | awk -F'\t' '$2 == "sudo" {print $4}' | sort -V | tail -n 1)
      have=$(dpkg-query -W -f '${Version}' sudo 2> /dev/null)
      dpkg --compare-versions "$have" ge "$fixed" || { echo "sudo is at $have"; exit 0; }
      su learner -c 'sudo -n true' > /dev/null 2>&1 || { echo "sudo no longer works for the learner"; exit 0; }
      echo "patched"
    expect:
      equals: "patched"
  - id: scanner-untouched
    description: "The scanners, the advisory records, the benchmark and the lab's data are as the image shipped them."
    command: /usr/local/lib/lab-pay/base-intact 2>&1 | head -n 3
    expect:
      equals: "intact"
