# The shop's staff site: the orders pages sign people in with OpenID Connect,
# the HR system's pages with SAML. Both ask the same identity provider.
<VirtualHost *:443>
  ServerName app.shop.test
  SSLEngine on
  SSLCertificateFile /etc/tls/app.shop.test.crt
  SSLCertificateKeyFile /etc/tls/app.shop.test.key
  LogLevel warn auth_openidc:info

  # --- The orders pages: OpenID Connect (mod_auth_openidc), client shop-web.
  OIDCProviderMetadataURL https://login.shop.test/realms/shop/.well-known/openid-configuration
  OIDCClientID shop-web
  # The client secret and the session passphrase, in a file only root reads.
  Include /etc/apache2/oidc-secret.conf
  OIDCRedirectURI https://app.shop.test/oidc/callback
  OIDCScope "openid"
  OIDCPKCEMethod S256
  OIDCRemoteUserClaim preferred_username

  ScriptAlias /orders/ /usr/local/lib/shop/orders/
  <Location /oidc/callback>
    AuthType openid-connect
    Require valid-user
  </Location>
  <Location /orders/>
    AuthType openid-connect
    Require claim groups:staff
  </Location>

  # --- The HR system's pages: SAML (mod_auth_mellon).
  # Its name at the identity provider (its entityID) is its own address.
  ScriptAlias /hr/me /usr/local/lib/shop/hr/me
  <Location /hr/>
    AuthType Mellon
    MellonEnable auth
    Require valid-user
    MellonEndpointPath /hr/mellon
    MellonSPentityId https://app.shop.test/hr
    MellonSPPrivateKeyFile /etc/apache2/saml/sp.key
    MellonSPCertFile /etc/apache2/saml/sp.crt
    # The identity provider's SAML metadata: its name, its sign-on address
    # and the certificate its assertions are signed with.
    MellonIdPMetadataFile /etc/apache2/saml/idp-metadata.xml
    MellonUser NAME_ID
  </Location>
</VirtualHost>
