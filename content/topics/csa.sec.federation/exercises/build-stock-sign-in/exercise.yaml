id: build-stock-sign-in
stage: build
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "The stock site signs in"
prompt: |
  The warehouse is getting a stock site of its own, an API behind it, and a nightly job that calls the API. None of the three is in single sign-on yet. Build it.

  **What is there.** Five machines on one network.

  - `idp` (10.0.5.10): the identity provider at `https://login.shop.test`. The realm `shop` is `/etc/keycloak/realms/shop.json`: two people, `ana` (group `staff`) and `ben` (group `warehouse`), and no clients yet. Two secrets are waiting in `/etc/keycloak/secrets.env`, `STOCK_WEB_SECRET` and `REORDER_JOB_SECRET`; a realm file names a secret as `${NAME}`. A second realm, `partners`, is the suppliers' (`/etc/keycloak/realms/partners.json`, there to read, not to change); it signs with the same keys as `shop`.
  - `stock` (10.0.5.22): Apache for `https://stock.shop.test/`. Its file, `/etc/apache2/sites-available/stock.conf`, has the certificate and one page, `/stock/me`, which prints who the site thinks is asking. The sign-in module (mod_auth_openidc) is switched on and not yet used.
  - `api` (10.0.5.30): Apache for `https://api.shop.test/`. Its file, `/etc/apache2/sites-available/api.conf`, has the certificate and one action, `/stock/reorder`. The token-checking module (mod_oauth2) is switched on and not yet used: at the moment the API serves anyone.
  - `jobs` (10.0.5.60): the nightly job, `on jobs reorder`. It reads a client's name and secret from `/etc/reorder/client` (two lines, `client_id=...` and `client_secret=...`; the file isn't there yet), signs in as that client by itself, and calls `/stock/reorder`.
  - `office` (10.0.5.2): a staff laptop, for `on office signin https://stock.shop.test/stock/me ben -v`.

  **What to build.**

  1. **Two clients, in the realm file, applied.** `stock-web`, for the site: the right flow for a web app on a server whose users have browsers, and no other way of getting tokens; confidential, with `${STOCK_WEB_SECRET}`; PKCE with S256 required; one exact redirect address on the site; and the `groups` claim in its tokens. The site never calls the API, so a token issued to the site must not be one the API accepts. `reorder-job`, for the job: the right flow for a program with no person behind it, and no other; confidential, with `${REORDER_JOB_SECRET}`; its access tokens carry the audience `https://api.shop.test`.
  2. **The site.** Everything under `/stock/` asks for a sign-in through `stock-web`, and lets in only people in the `warehouse` group. The site's copy of its secret is in a file only root can read.
  3. **The API.** Everything under `/stock/` needs an access token that the identity provider signed, with the provider's keys fetched from the address where it publishes them; issued by the `shop` realm; for the audience `https://api.shop.test`. Anything else gets `401`.
  4. **The job's file,** `/etc/reorder/client`, with `reorder-job` and its secret, readable only by root.

  Restart an Apache after changing its file (`sudo systemctl restart apache2@stock`, `apache2@api`). `on jobs reorder` should print `reorder: placed as reorder-job`, Ben should reach `/stock/me` and Ana should be refused, and `realm-saved shop` should say `saved`.

  The lesson's reference section has the realm file's client block with its two mappers, the site's `OIDC` lines and the API's `OAuth2TokenVerify` and `Require oauth2_claim` lines. Every fix must last a restart. Then run the checks.
skills: [trace-oidc, choose-flow, validate-token]
