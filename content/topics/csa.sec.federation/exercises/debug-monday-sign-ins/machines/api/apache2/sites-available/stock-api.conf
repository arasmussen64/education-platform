# The stock API. Every request to /stock/ must carry an access token.
<VirtualHost *:443>
  ServerName api.shop.test
  SSLEngine on
  SSLCertificateFile /etc/tls/api.shop.test.crt
  SSLCertificateKeyFile /etc/tls/api.shop.test.key
  LogLevel warn oauth2:info

  ScriptAlias /stock/ /usr/local/lib/shop/stock/
  <Location /stock/>
    AuthType oauth2
    # How the API checks a token's signature.
    OAuth2TokenVerify jwk @PINNED_JWK@
    # Who must have issued the token, and whom it must be for.
    <RequireAll>
      Require oauth2_claim iss:https://login.shop.test/realms/shop
      Require oauth2_claim aud:https://api.shop.test
    </RequireAll>
  </Location>
</VirtualHost>
