# The new orders site: staff sign in through the shop's identity provider.
# Four settings are still to fill in: each "..." below.
<VirtualHost *:443>
  ServerName orders.shop.test
  SSLEngine on
  SSLCertificateFile /etc/tls/orders.shop.test.crt
  SSLCertificateKeyFile /etc/tls/orders.shop.test.key
  LogLevel warn auth_openidc:info

  # The address of the identity provider's discovery document, where this
  # site finds everything else about the provider.
  OIDCProviderMetadataURL ...
  OIDCClientID orders-web
  # The client secret and the session passphrase, in a file only root reads.
  Include /etc/apache2/oidc-secret.conf
  # Where the provider sends the browser back to after a sign-in: this
  # site's own address, then /oidc/callback.
  OIDCRedirectURI ...
  OIDCScope "openid"
  # How this site protects the code it is sent: the method's name.
  OIDCPKCEMethod ...
  OIDCRemoteUserClaim preferred_username

  ScriptAlias /orders/ /usr/local/lib/shop/orders/
  <Location /oidc/callback>
    AuthType openid-connect
    Require valid-user
  </Location>
  <Location /orders/>
    AuthType openid-connect
    # Who may open the orders pages: only people whose token says so.
    Require ...
  </Location>
</VirtualHost>
