id: mcq-flow-scanner
type: mcq
rev: 1
prompt: |
  Warehouse staff carry handheld scanners with a two-line screen, a few buttons and no browser. Each person signs in at the start of a shift, so that the stock system knows who scanned what. Which flow fits?
choices:
  - "The device grant: the scanner shows a code, approved on a phone"
  - "The password grant: staff key their password in on the scanner"
  - "Client credentials: all the scanners share one client and secret"
  - "The implicit flow: the token comes straight back to the scanner"
answer: 0
explanation: |
  There is a person, and their device has no browser: that is the device grant. The scanner asks the provider for a code, shows it with a short address, and keeps asking the token endpoint while the person opens that address on their phone, signs in there with whatever the provider requires (MFA included) and approves. The password never touches the scanner.

  The password grant puts each person's password through a device that has no business seeing it, and leaves no room for a second factor. One shared client makes every scan anonymous, which is the opposite of what the shop wants. And the implicit flow needs a browser to carry a redirect, which the scanner hasn't got.
skills: [choose-flow]
