id: mcq-who-is-scim-server
type: mcq
rev: 1
prompt: |
  Two set-ups. In the first, Microsoft Entra ID provisions accounts into a SaaS app. In the second, a company's own identity provider provisions accounts into AWS IAM Identity Center. In each, which side is the SCIM server: the one that receives the requests?
choices:
  - "Entra ID in the first; the company's identity provider in the second"
  - "Entra ID in the first; IAM Identity Center in the second"
  - "The SaaS app in the first; the company's identity provider in the second"
  - "The SaaS app in the first; IAM Identity Center in the second"
answer: 3
explanation: |
  The SCIM server is wherever the accounts are being created: it offers `/Users` and `/Groups` and answers requests. The SCIM client is the source of truth, which sends them. So in both set-ups the receiving side is the server: the SaaS app, and IAM Identity Center. Entra ID is a SCIM client (it sends the filter, the `POST`, the `PATCH`), and so is the company's identity provider when it pushes people into AWS, using a bearer token that Identity Center made for it.

  The name "service provider" causes the mix-up: in SCIM it means the server that holds the accounts, and an identity provider is usually on the other end, as the client.
skills: [scim-provisioning]
