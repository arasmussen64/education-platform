id: mcq-saml-or-oidc
type: mcq
rev: 1
prompt: |
  The shop is adding four apps to single sign-on: a new phone app that calls the stock API; an old HR system from a vendor, which offers "SAML 2.0 SSO" and nothing else; a command-line tool for developers; and a partner portal built this year on a current web framework. Which of them should use SAML?
choices:
  - "The HR system and the partner portal; OpenID Connect for the other two"
  - "The HR system only; OpenID Connect and OAuth for the other three"
  - "The phone app and the command-line tool; OpenID Connect for the rest"
  - "All four, so that the shop has one protocol to run and to audit"
answer: 1
explanation: |
  SAML where it is the only thing the app speaks, and OpenID Connect everywhere else. SAML signs a person in to a web app through a browser and stops there: it has no access tokens for calling an API, no flow for an app that isn't a web page, and nothing for a device without a browser. The phone app needs an access token for the stock API; the command-line tool needs the code flow with a loopback redirect, or the device grant; a web app written this year has OpenID Connect built in.

  Both protocols can come from one identity provider, as in the worked example, so "one protocol" isn't a reason to put SAML where it doesn't fit.
skills: [trace-saml]
