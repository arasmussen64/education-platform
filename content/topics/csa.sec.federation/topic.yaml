skills:
  - id: trace-oidc
    description: "OAuth's roles and the OpenID Connect code flow, message by message: the authorization request's parameters, the sign-in at the provider, the redirect back with the code, state and issuer, the back-channel token request with the verifier, the token response, the discovery document; front channel against back channel; where an error arrives (in the redirect, or as the token endpoint's JSON); reading the browser's last answer and the two sides' logs to say which step failed"
  - id: trace-saml
    description: "SAML's sign-on through the browser: the request in a redirect, the signed response posted back in a form; the assertion's issuer, NameID, audience, recipient, InResponseTo and time windows; signatures checked against the provider's metadata; IdP-initiated sign-on and its risk; single sign-on across the two protocols; SAML or OpenID Connect for a given app; the name an assertion carries against the name provisioning wrote"
  - id: choose-flow
    description: "The grants and when: the code flow with PKCE (S256) for anyone with a browser, client credentials for a program with no person, the device grant for a device with no browser (and its polling rules and phishing risk); never the implicit or password grant; public and confidential clients; exact redirect addresses; registering a client with only the grant it needs; the sums of polling and PKCE lengths"
  - id: validate-token
    description: "A JWT's three pieces and base64url; the checks in order and what each stops (the expected algorithm, the key by kid from the published key set, the signature, the issuer exactly, the audience, the times with a leeway, the nonce); which token is whose; key rotation, fetching keys by address and never keeping a copy; token times against the reader's clock, a wrong clock's signs, and time sync as the fix; doing it by hand with jq and openssl; the sums of lifetimes, leeway, key overlap and clock skew"
  - id: scim-provisioning
    description: "Joiners, movers and leavers from one source of truth; SCIM's requests (a filter, POST, PATCH, deactivating with active false, DELETE, group membership), its status codes and paging; deactivate before delete; a sync that writes only the differences; the connector as a client with its own narrow token; each cloud's place (Entra ID a SCIM client, IAM Identity Center a SCIM server with a one-year token, Workforce Identity Federation needing none); the sums of pages and requests"
