id: csa.sec.federation
kind: topic
status: ready
title: SAML, OAuth 2.0 and OIDC
summary: "How an app signs you in without ever seeing your password. Federation and single sign-on; the authorization code flow message by message, with PKCE, state and nonce; ID, access and refresh tokens, and a JWT taken apart and checked by hand; the checks a token must pass, and what a wrong clock does to them; which flow fits a web app, a job and a device with no browser; SAML as the same promise in XML; and SCIM, which creates accounts and switches them off."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 2,
# 3, 4.1 and 5) and its designer's brief (csa.sec.federation.md), with what
# building the identity lab base found (BUILD-NOTES.md and
# content/lab-bases/id/README.md). It builds on csa.sec.authn-authz
# (authentication, authorization, credential, MFA, sign-in session, token,
# claim in one sentence, 401 against 403) and csa.sec.crypto (hash, HMAC,
# signature), and through them on Module 1 (curl, cut, tr, grep -o, sed,
# awk, jq in csa.linux.shell/write-jq-answers, scripts, ShellCheck) and
# Module 3 (HTTP, cookies, base64, TLS, certificates, the network labs).
# Not prerequisites: csa.sec.pki (which owns "relying party") and
# csa.sec.strong-auth, which comes after this topic.
#
# This topic defines, for the module (the plan's 3.5): federation, identity
# provider, single sign-on, front and back channel, redirect URI, OAuth's
# roles, the grants, access, refresh and ID token, bearer token, PKCE,
# state, JWT, JWKS, kid, leeway, SAML's words, SCIM's words, realm, client,
# and where a machine's time comes from (NTP, a time server, time sync).
# "Drift" was to be this topic's too; csa.linux.packages already defines
# "configuration drift", so the lesson uses that. It also owns the
# identity-lab onboarding, the "Before your first identity lab" note in
# example-trace-a-sign-in's prompt.
prerequisites: [csa.sec.authn-authz, csa.sec.crypto]
# Worked out: the lesson about 40 minutes (5,200 words with its tables and
# reference blocks), the puzzle and the story 3, 26 practice recall items
# at 1.5 each 39, then the worked example 35, the first fill-in 20, the
# write 35, the second fill-in 20, the build 60, the debug 45 and the
# explain 15: about 312. The plan's 320 is kept. No reading is assigned:
# every resource is an optional link.
estimated_minutes: 320
rev: 1
objectives:
  - "Trace an OpenID Connect sign-in message by message: what the browser carries (the front channel) and what it never sees (the back channel), what the redirect address, the state, the nonce and PKCE each protect, and which message failed, from the browser's last answer and the two sides' logs."
  - "Choose the right flow for an app and register it with only that flow: the authorization code flow with PKCE for anyone with a browser, client credentials for a program with no person, the device grant for a device with no browser, and never the implicit or password grant."
  - "Validate a token: decode a JWT by hand, find the signing key by its `kid` in the provider's published key set, check the signature, the issuer, the audience, the times with a small leeway and the nonce; say who validates which token and why a copy of a key is a fault waiting; and recognise and mend a wrong clock, so that the machines agree about the time."
  - "Read a SAML sign-on: the request, the signed response posted through the browser, and the assertion's issuer, name, audience, recipient, `InResponseTo` and time window; and say when SAML is the right choice."
  - "Provision accounts with SCIM: find, create, change, deactivate a leaver without deleting, change group membership, page through a list, and make a sync that changes nothing on its second run; and say how Entra ID, IAM Identity Center and Google's Workforce Identity Federation each expect people to arrive."
# Facts the lesson and the items rely on, each read on 2026-11-22.
# - RFC 9700, "Best Current Practice for OAuth 2.0 Security", January 2025,
#   BCP 240: authorization servers "utilize exact string matching" of
#   redirect URIs (2.1); "Public clients MUST use PKCE", RECOMMENDED for
#   confidential clients (2.1.1); clients "SHOULD NOT use the implicit
#   grant" (2.1.2); the password grant "MUST NOT be used" (2.4); public
#   clients' refresh tokens "MUST be sender-constrained or use refresh
#   token rotation" (2.2.2): rfc-editor.org/rfc/rfc9700.html.
# - RFC 7636 (PKCE, September 2015): the verifier is 43 to 128 characters;
#   S256 is BASE64URL-ENCODE(SHA256(ASCII(code_verifier))); 32 octets
#   recommended, 43 characters; "plain" "SHOULD NOT be used in new
#   implementations": rfc-editor.org/rfc/rfc7636.html.
# - RFC 8628 (device grant, August 2019): interval defaults to 5; on
#   slow_down the interval "MUST be increased by 5 seconds for this and all
#   subsequent requests"; section 5.4 on remote phishing:
#   rfc-editor.org/rfc/rfc8628.html.
# - RFC 8725 (JWT best practices, February 2020, BCP 225): "Libraries MUST
#   enable the caller to specify a supported set of algorithms"; RS256 to
#   HS256 confusion and "none" (2.1): rfc-editor.org/rfc/rfc8725.html.
# - OpenID Connect Core 1.0 incorporating errata set 2 (15 December 2023),
#   3.1.3.7: the issuer "MUST exactly match"; aud "contains its client_id
#   value"; "The current time MUST be before the time represented by the
#   exp Claim"; the nonce checked when sent:
#   openid.net/specs/openid-connect-core-1_0.html.
# - RFC 7643 and 7644 (SCIM, September 2015): userName "is REQUIRED and is
#   case insensitive"; active: "The definitive meaning of this attribute is
#   determined by the service provider"; a User's groups are read-only;
#   application/scim+json; 201 on create, 409 with scimType uniqueness, 204
#   on delete, 400 invalidFilter; startIndex is 1-based; PatchOp's add,
#   remove, replace: rfc-editor.org/rfc/rfc7643.html and rfc7644.html.
# - Microsoft, "Access tokens in the Microsoft identity platform" (ms.date
#   2025-05-14): a lifetime "ranging between 60-90 minutes (75 minutes on
#   average)", which "improves service resilience by spreading access token
#   demand over a time"; clients "should treat them as opaque strings";
#   APIs "must only accept tokens containing one of their AppId URIs as the
#   aud claim"; "A reasonable frequency to check for updates to the public
#   keys ... is every 24 hours":
#   learn.microsoft.com/en-us/entra/identity-platform/access-tokens.
# - Microsoft, "Understand how Application Provisioning in Microsoft Entra
#   ID" (ms.date 2026-11-03): a disable is "a request to set the active
#   property to false"; "users are hard-deleted 30 days after they're
#   soft-deleted", and the DELETE is sent then:
#   learn.microsoft.com/en-us/entra/identity/app-provisioning/how-provisioning-works.
#   The first-cycle formula, "Minimum minutes = 0.01 x", "Maximum minutes =
#   0.08 x [Number of assigned users, groups, and group members]" (ms.date
#   2025-03-04): .../application-provisioning-when-will-provisioning-finish-specific-user.
# - AWS IAM Identity Center: "The SAML protocol does not provide a way to
#   query the IdP to learn about users and groups":
#   docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html.
#   "SCIM access tokens are generated with a validity of one year";
#   reminders from 90 days; when it expires "the synchronization ... stops";
#   the SAML NameID must be the attribute mapped to Username: "If they
#   differ, sign-in fails": .../provision-automatically.html.
#   AWS CLI: "Proof Key for Code Exchange (PKCE) authorization is used by
#   default for the AWS CLI starting with version 2.22.0", with
#   --use-device-code for device authorization:
#   docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html.
# - Google Cloud, Workforce Identity Federation: "you don't need to use
#   tools to synchronize user identities from your IdP"; OIDC or SAML 2.0;
#   attributes mapped with CEL: docs.cloud.google.com/iam/docs/workforce-identity-federation.
# - The story: Microsoft, "Results of Major Technical Investigations for
#   Storm-0558 Key Acquisition" (6 September 2023, with an addendum of 12
#   March 2024 saying no crash dump with the key was found), for the shared
#   key address, the missing check and the fix; and the Cyber Safety Review
#   Board's "Review of the Summer 2023 Microsoft Exchange Online Intrusion"
#   (20 March 2024; read 2026-11-23) for who found it and what is known
#   about the key: the State Department "detected anomalies" on 15 June
#   2023 and "contacted Microsoft" on 16 June; "22 organizations and over
#   500 individuals"; "Microsoft does not know how or when Storm-0558
#   obtained the signing key". Microsoft's post alone says neither who
#   found the intrusion nor how many were affected.
# - Not confirmed, so not in the lesson: Entra's client-secret and SAML
#   certificate lifetimes, its device-code and password-grant pages, and
#   Google's session lengths (the designer's facts E6 to E9 and G2): those
#   pages weren't opened today.
# Tried in this topic's labs on the identity base (Keycloak 26.8.2,
# mod_auth_openidc 2.4.15.1, mod_auth_mellon 0.19.0, mod_oauth2 3.3.1),
# 2026-11-22: every message, token, log line and refusal the lesson, the
# items and the labs show, among them SAML with the provider's metadata
# written at image build and the user name as NameID, SCIM with a service
# client's token (the realm attribute scimApiEnabled, an audience of the
# SCIM address, the roles manage-users and view-realm), the device grant,
# a POST without "active" stored as inactive, and mod_oauth2 serving a
# token it had accepted after its expiry.
