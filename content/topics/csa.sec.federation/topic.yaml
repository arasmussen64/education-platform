prove:
  build: build-stock-sign-in
  debug: debug-monday-sign-ins
  explain:
    prompt: |
      The shop is moving four apps to single sign-on: the orders site (a web app on a server), a new phone app that calls the stock API, the warehouse scanners (no browser), and an old HR system that speaks only SAML. A colleague who has only ever used passwords asks you to explain it. In your own words: what happens, message by message, when someone signs in to the orders site, and which messages the browser carries and which it never sees; which flow each of the four apps should use and why, and which two flows nobody should use; what the stock API must check about every token before trusting it, why it must not keep its own copy of the identity provider's key, and what a wrong clock on the API's server would look like; how the HR system's SAML sign-in differs; and how accounts get created in each app and switched off the day someone leaves. Say one way the three clouds differ.
    rubric:
      - id: code-flow
        required: true
        description: "The browser is redirected to the identity provider with the client, the redirect address, a state, a nonce and a PKCE challenge; the person signs in at the provider only; a one-time code comes back through the browser; the app swaps the code and the verifier for tokens directly with the provider, which the browser never sees (the back channel); the app checks the state and the nonce."
      - id: flow-choice
        required: true
        description: "Orders site: the code flow with PKCE, as a confidential client. Phone app: the code flow with PKCE, as a public client with no secret. Scanners: the device grant, approved on another device (and only a code you started yourself). HR system: SAML. Never the implicit grant (tokens in addresses) or the password grant (the app holds the password, and no second factor can take part)."
      - id: token-checks
        required: true
        description: "The API checks the signature with the key the token's `kid` names, from the provider's published key set; the issuer, exactly; that the audience is the API itself; and that the token hasn't expired, with a small leeway. Keys rotate, so they are fetched by address: a copy works until the next rotation and then refuses everyone."
      - id: clocks
        required: true
        description: "A token's times are read against the reader's clock: on a server whose clock is wrong, fresh tokens look expired (or issued in the future) and every caller is refused there alone. The fix is the server's time sync and its time server, not longer tokens or a wide leeway."
      - id: saml
        required: true
        description: "A signed XML assertion posted through the browser in a form, with no back-channel exchange; the app checks the signature, the issuer, the audience, the recipient, that it answers the app's own request, and the time window. SAML has no access tokens for APIs and nothing for devices."
      - id: provisioning
        required: true
        description: "Accounts are created and changed by provisioning from one source of truth, with SCIM (or created at first sign-in, which never removes them); a leaver is deactivated at once (`active` false) and deleted only later; the sync writes only what differs, so running it twice changes nothing."
      - id: clouds-differ
        required: false
        description: "Any correct difference: Entra ID is an identity provider and a SCIM client; IAM Identity Center takes SAML in and needs people provisioned first, with a token that lasts a year; Workforce Identity Federation needs no copies of people; Entra's access tokens last 60 to 90 minutes."
    model_answer: |
      With single sign-on the orders site never sees a password. When Ana opens it, the site sends her browser to the shop's identity provider with a note: which app is asking, where to send her back, two random values called state and nonce, and the hash of a secret the site just made up (that last part is PKCE). She signs in at the provider, and only there. The provider sends her browser back to the site with a one-time code. Those are the messages her browser carries. Then the site calls the provider directly, shows the code and the secret behind the hash, and gets tokens. Her browser never sees that call. The site checks that the state and nonce are its own, checks the ID token, and starts its session.

      The orders site and the phone app both use that code flow with PKCE; the site also has a client secret, and the phone app can't keep one, so PKCE is its protection. The scanners have no browser, so they use the device grant: the scanner shows a code, and the person approves it on their phone. Only ever approve a code you started yourself. The HR system gets SAML, because that is all it speaks. Nobody uses the implicit grant, which puts tokens in web addresses, or the password grant, where the app handles the password and MFA can't happen.

      The stock API trusts a token only if its signature verifies with the key the token names, taken from the keys the provider publishes; the issuer is exactly our provider; the audience is the stock API itself; and it hasn't expired, give or take a minute. It fetches the keys by address, because the provider changes its key from time to time: an API with its own copy works until that day and then refuses everybody. Expiry is judged by the API server's own clock, so if that clock is minutes out, brand-new tokens look expired and every caller is refused there and nowhere else. You fix the server's time sync, not the tokens.

      SAML is the same promise in XML: the provider posts a signed assertion to the HR system through the browser, and the HR system checks the signature, who issued it, that it is for the HR system and was sent to the right address, that it answers its own request, and its one-minute window. SAML can't give an app a token for an API.

      Accounts come from provisioning. The HR file is the source of truth, and a connector uses SCIM to create an account when someone joins, change their groups when they move, and switch the account off the day they leave. Off, not deleted: the history stays and a mistake can be undone. It only sends what changed, so running it twice is harmless.

      The clouds differ in how they want people delivered: Entra ID pushes accounts into apps with SCIM, AWS's IAM Identity Center needs people pushed into it before SAML sign-in works, and Google's Workforce Identity Federation needs no copies at all.
