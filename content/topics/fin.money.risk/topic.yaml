prove:
  build: build-max-drawdown
  debug: debug-risk-report
  explain:
    prompt: |
      A fund's factsheet says its volatility is 16% a year. Over the last five years it also fell 50% from a high, and took four years to get back. In your own words: what does the 16% measure, and what does it leave out? What does the 50% fall measure that the 16% doesn't, and what gain did the fund need to get back to its high? Why does "volatility" understate what it feels like to own something that falls 50%?
    rubric:
      - id: volatility
        required: true
        description: "Volatility is the standard deviation of returns: how much each period's return typically differs from the average, with ups and downs counted alike."
      - id: leaves-out
        required: true
        description: "It leaves out the order of the returns: whether the falls came one after another, how deep the money went below a high, and how long it stayed there."
      - id: drawdown
        required: true
        description: "The maximum drawdown is the fall from a running peak to the lowest point after it; a 50% drawdown needs a 100% gain to recover (1 / 0.5 − 1)."
      - id: feeling
        required: true
        description: "An owner lives through the path, not the statistic: a deep, long fall is when people sell at the bottom or can't wait for the recovery, which drawdown shows and volatility doesn't."
      - id: annualizing
        required: false
        description: "Notes that the 16% is annualized from shorter periods by a square root, and says nothing about the worst stretch."
    model_answer: |
      The 16% is the fund's volatility: the standard deviation of its returns, annualized. It says how far a typical period's return lands from the average, up or down. What it leaves out is the order of those returns. A dozen bad months spread across five years and a dozen bad months in a row give the same volatility, but the second is a steep, long fall. The 50% fall is the maximum drawdown: the drop from the fund's highest point to its lowest point after that. It measures what someone who bought at the high actually lived through. And it's worse than it sounds: after falling 50% the fund holds half its value, so it needs a 100% gain, 1 ÷ 0.5 − 1, to get back to the high, which here took four years. That's why volatility understates the experience. An owner doesn't feel a standard deviation; they feel watching half the money go and waiting years for it to return, and that's when people give up and sell at the bottom, locking the loss in. Drawdown puts a number on the path: how deep and, with the dates, how long. Volatility and drawdown together say much more than either alone.
