id: contrast-volatility-or-drawdown
type: mcq
rev: 1
prompt: |
  Funds A and B had exactly the same monthly returns over ten years, but in a different order: A's bad months were spread out, while B's twelve worst months came one after another. Which measure tells the two funds apart?
choices:
  - 'Volatility: the order of the bad months changes how widely returns spread'
  - 'Maximum drawdown: B fell much further from a peak before it recovered'
  - 'The annualized return: the funds ended with different amounts of money'
  - 'Neither: identical returns mean identical risk, whatever their order'
answer: 1
explanation: |
  The same returns in any order have the same mean and the same standard deviation, so their volatility is identical, and multiplying the same growth factors in any order gives the same end, so the annualized return is identical too. What differs is the path: B's twelve worst months in a row took it much further below its peak. Maximum drawdown sees that; volatility can't, because it ignores order. That's why the two measures go together.
skills: [drawdown, volatility]
