id: mcq-dominated
type: mcq
rev: 1
prompt: |
  Over the same years, fund X averaged 6% a year with a volatility of 15%, and fund Y averaged 8% a year with a volatility of 12%. Which statement is right?
choices:
  - 'X is the better choice: higher volatility means higher returns to come'
  - 'Y did better on both: a higher average return with smaller swings'
  - 'They are equally good: each one wins on one of the two measures'
  - 'Neither can be judged without knowing their maximum drawdowns too'
answer: 1
explanation: |
  Read the pair together. Y earned more on average and swung less, so on these two numbers X is worse on both counts: there's no trade-off to make. More volatility is a reason to *expect* a higher return, not a promise of one, and X didn't deliver it. Drawdown would add to the picture, but it can't turn a fund that lost on both measures into a better one on these.
skills: [risk-return]
