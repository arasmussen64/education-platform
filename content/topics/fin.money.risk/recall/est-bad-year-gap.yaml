id: est-bad-year-gap
type: estimate
rev: 1
prompt: |
  Fund A averages 5% a year with a volatility of 8%; fund B averages 10% with a volatility of 25%. For each, take the bad year one volatility below its average. How many percentage points worse is B's bad year than A's? Exactly.
unit: percentage points
answer: 12
tolerance: { absolute: 0 }
given: { average_a: 5, volatility_a: 8, average_b: 10, volatility_b: 25 }
working: (average_a - volatility_a) - (average_b - volatility_b)
mistakes:
  - id: volatility-gap
    value: 17
    working: volatility_b - volatility_a
    why: "That's the gap in volatility alone. B's higher average makes up 5 points of it: A's bad year is −3%, B's −15%."
  - id: average-gap
    value: 5
    working: average_b - average_a
    why: "That's how much more B earns on average. The bad years are −3% for A and −15% for B, 12 points apart."
explanation: |
  A's bad year is 5% − 8% = −3%; B's is 10% − 25% = −15%. B's is 12 points worse, in exchange for 5 points more on average. Whether that trade is worth it depends on whether you could sit through B's bad years, which is exactly what this pair of numbers lets you ask.
skills: [risk-return]
