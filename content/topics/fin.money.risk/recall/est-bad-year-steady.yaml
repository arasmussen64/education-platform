id: est-bad-year-steady
type: estimate
rev: 1
prompt: |
  A short-term bond fund's yearly returns average 4% with a volatility of 6%, roughly bell-shaped. What return marks a year one volatility below its average, the kind of year that comes about one year in six, as a percentage? Exactly.
unit: "%"
answer: -2
tolerance: { absolute: 0 }
given: { average: 4, volatility: 6 }
working: average - volatility
mistakes:
  - id: volatility-only
    value: -6
    working: 0 - volatility
    why: "The spread is around the average, 4%, not around zero: 4 − 6."
  - id: added
    value: 10
    working: average + volatility
    why: "That's a good year, one volatility above the average. The bad year is below it."
explanation: |
  4% − 6% = −2%. Compare a stock fund averaging 9% with a volatility of 18%, whose one-in-six bad year is −9%: the steadier fund offers less on average and a much milder bad year. That's the trade-off a risk and return pair describes.
skills: [risk-return]
