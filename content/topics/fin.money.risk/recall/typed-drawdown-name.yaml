id: typed-drawdown-name
type: typed
rev: 1
prompt: |
  Track the highest price so far, measure how far each price sits below it, and take the deepest of those falls. What is that deepest fall called? Type the term.
kind: text
answers:
  - "maximum drawdown"
  - "max drawdown"
  - "MDD"
mistakes:
  - id: volatility
    answers: ["volatility", "standard deviation"]
    why: "Volatility measures how widely returns spread, ignoring their order. The deepest fall from a running peak is the maximum drawdown."
  - id: total-return
    answers: ["total return", "loss"]
    why: "A total return compares the first and last prices only. The deepest fall from a running peak is the maximum drawdown."
explanation: |
  The **maximum drawdown**: the largest fall from a running peak to a later low, usually reported as a positive share. It measures the worst stretch an owner who bought at the top would have lived through.
skills: [drawdown]
