id: predict-stdev
type: predict_output
rev: 1
prompt: |
  Four monthly returns, their mean, and two standard deviations. What does the program print?
code: |
  import statistics

  returns = [0.10, -0.05, 0.04, 0.03]
  print(round(statistics.mean(returns), 4))
  print(round(statistics.stdev(returns), 4))
  print(round(statistics.pstdev(returns), 4))
expected_output: |
  0.03
  0.0616
  0.0534
explanation: |
  The mean is 0.12 ÷ 4 = 0.03. The squared distances from it are 0.0049, 0.0064, 0.0001 and 0.0000, summing to 0.0114. `stdev` divides by n − 1 = 3 and takes the square root: 0.0616, the sample standard deviation this module uses for volatility. `pstdev` divides by 4: 0.0534, a little smaller. With few returns the difference matters; with hundreds it hardly does.
skills: [volatility]
