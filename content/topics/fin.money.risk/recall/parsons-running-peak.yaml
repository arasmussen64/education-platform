id: parsons-running-peak
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints each price's drawdown from the running peak, one a line: `0%`, `0%`, `-25%`, `0%`. One line is a decoy that doesn't belong.
lines:
  - 'peak = 0'
  - 'for price in [100, 120, 90, 130]:'
  - '    peak = max(peak, price)'
  - '    print(f"{price / peak - 1:.0%}")'
distractors:
  - '    peak = min(peak, price)'
explanation: |
  The running peak must be updated before the drawdown is worked out, so a new high shows as 0% rather than as a rise above the old peak. 100 and 120 are new highs, 0%; 90 is 25% below 120; 130 is a new high again. The decoy keeps the lowest price instead, which stays at 0 and would divide by zero.
skills: [drawdown]
