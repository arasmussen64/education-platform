id: est-bad-year
type: estimate
rev: 1
prompt: |
  A stock fund's yearly returns average 9% with a volatility of 18%, and are roughly bell-shaped. About one year in six falls more than one volatility below the average. What return marks that one-in-six bad year, as a percentage? Exactly.
unit: "%"
answer: -9
tolerance: { absolute: 0 }
given: { average: 9, volatility: 18 }
working: average - volatility
mistakes:
  - id: volatility-only
    value: -18
    working: 0 - volatility
    why: "Volatility measures the spread around the average, not around zero: count down from 9%."
  - id: two-vols
    value: -27
    working: average - 2 * volatility
    why: "That's two volatilities below the average, a much rarer year, roughly one in 44 (about 2%). One in six is one volatility below."
explanation: |
  One volatility below the average is 9% − 18% = −9%. So a fund that averages 9% should be expected to lose 9% or more in roughly one year in six, if its returns are close to bell-shaped. Real returns have more very bad years than the bell curve suggests, so years this bad, and worse, can come more often than that.
skills: [risk-return]
