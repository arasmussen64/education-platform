id: typed-stdev-function
type: typed
rev: 1
prompt: |
  Python's `statistics` module has two standard-deviation functions. Type the call, with its module name, that gives the sample standard deviation (dividing by n − 1) of a list called `returns`.
kind: command
answers:
  - "statistics.stdev(returns)"
mistakes:
  - id: population
    answers: ["statistics.pstdev(returns)"]
    why: "`pstdev` is the population standard deviation, which divides by n. The sample one, which divides by n − 1, is `stdev`."
  - id: no-module
    answers: ["stdev(returns)"]
    why: "That works only after `from statistics import stdev`. With `import statistics`, the call is `statistics.stdev(returns)`."
explanation: |
  `statistics.stdev(returns)` is the sample standard deviation, the one this module uses for volatility. `statistics.pstdev` divides by the count instead and comes out a little smaller.
skills: [volatility]
