id: mcq-drawdown-meaning
type: mcq
rev: 1
prompt: |
  A fund's prices at the end of each year were $100, $140, $112, $126 and $98. What is its maximum drawdown over the five years?
choices:
  - '2%, from the first price to the last'
  - '20%, from $140 down to $112'
  - '30%, from $140 down to $98'
  - '22%, from $126 down to $98'
answer: 2
explanation: |
  The running peak reaches $140 in the second year and never goes higher, so every later price is measured from it: $112 is 20% below, $126 is 10% below, and $98 is 30% below. The deepest of those is 30%. The fall from $126 to $98 is 22%, but $126 wasn't a peak, and the 2% from first to last is the total return, which skips the path entirely.
skills: [drawdown]
