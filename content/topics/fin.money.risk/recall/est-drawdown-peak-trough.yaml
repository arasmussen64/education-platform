id: est-drawdown-peak-trough
type: estimate
rev: 1
prompt: |
  A share peaked at $150, then fell to a low of $90 before it recovered. What was the drawdown from the peak to that low, as a positive percentage? Exactly.
unit: "%"
answer: 40
tolerance: { absolute: 0 }
given: { peak: 150, low: 90 }
working: (1 - low / peak) * 100
mistakes:
  - id: wrong-base
    value: 66.67
    working: (peak / low - 1) * 100
    why: "That's the rise from $90 back to $150, measured from the low. A drawdown is measured from the peak: 60 ÷ 150."
  - id: dollars
    value: 60
    working: peak - low
    why: "That's the fall in dollars. As a share of the $150 peak it's 40%."
amounts: made-up
explanation: |
  90 ÷ 150 = 0.60, so the low was 40% below the peak: a drawdown of 40%. Getting back needs 150 ÷ 90 − 1 = 66.7%, the number in the first mistake: falls and recoveries are measured from different places.
skills: [drawdown]
