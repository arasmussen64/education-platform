id: fill-annual-volatility
stage: fill_in
rev: 1
title: "Monthly and annual volatility"
prompt: |
  Six monthly returns of a made-up fund. The function `volatility(returns)` should return the sample standard deviation of a list of returns. Replace each `...` with an operator so the program prints the monthly volatility and the annual volatility:

  ```
  Monthly volatility: 2.61%
  Annual volatility: 9.03%
  ```

  Every `...` stands for an operator, so until each one is replaced, Python can't run the program at all and shows a syntax error.
hints:
  - "Each distance from the mean is squared: raised to the power 2."
  - "The sample standard deviation divides by one less than the count."
  - "A year's volatility is the month's scaled by the square root of 12."
skills: [volatility]
