id: debug-risk-report
stage: debug
rev: 1
title: "A risk report"
prompt: |
  This report reads a fund's month-end prices for a year (made up) and prints its monthly volatility (the sample standard deviation of its monthly returns), its annual volatility, and its maximum drawdown over the year:

  ```
  Monthly volatility: 6.80%
  Annual volatility: 23.56%
  Maximum drawdown: 22.32%
  ```

  Instead, the annual volatility it prints is more than three times too big, and the maximum drawdown is smaller than the fall you can see in the prices, from 112 down to 87. It has two bugs. Run it, fix what you find, and run it again.
skills: [volatility, drawdown]
