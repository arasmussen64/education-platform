id: write-drawdown-series
stage: write
rev: 1
title: "Drawdown, month by month"
prompt: |
  The starter holds a fund's month-end prices (made up). Write a function `drawdowns(prices)` that returns a list with one drawdown for each price: how far it sits below the running peak, `price / peak - 1`, as a decimal (0 at a new high, negative below it). Then print each month's price and drawdown:

  ```
  Month 0: $20.00, drawdown 0.0%
  Month 1: $22.00, drawdown 0.0%
  Month 2: $19.80, drawdown -10.0%
  Month 3: $23.00, drawdown 0.0%
  Month 4: $18.40, drawdown -20.0%
  Month 5: $20.70, drawdown -10.0%
  Month 6: $24.00, drawdown 0.0%
  ```

  Keep the `prices` list as it is: the checks call your function with other prices too.
hints:
  - "Start the running peak at the first price. For each price, update the peak with `max(peak, price)` first, then append `price / peak - 1`."
  - "To print, loop over `range(len(prices))`, so `i` reads both `prices[i]` and the matching drawdown."
  - "The drawdown prints with `{falls[i]:.1%}` if `falls` holds the list your function returned."
skills: [drawdown]
