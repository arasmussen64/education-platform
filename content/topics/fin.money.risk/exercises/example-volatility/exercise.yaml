id: example-volatility
stage: worked_example
rev: 1
title: "Volatility, by hand and by statistics"
prompt: |
  Six monthly returns of a made-up fund. This program works out their volatility by hand, checks it against Python's `statistics` module, and annualizes it. Press **Run**, then read how each part works.
steps:
  - label: "The mean"
    lines: "4-5"
    note: "The returns are decimals: 0.03 is 3%. Their mean, the sum over the count, is 0.0083, 0.83% a month."
  - label: "Squared distances from the mean"
    lines: "6-8"
    note: "Each return's distance from the mean is squared, so ups and downs both count as spread, and summed."
  - label: "Divide by n − 1, then take the root"
    lines: "9"
    note: "The sample standard deviation divides the sum by one less than the count, here 5, because six months are a sample of what the fund could do. The square root brings it back to a return: 3.31% a month."
  - label: "Checks and the other version"
    lines: "10-13"
    note: "`statistics.stdev` is the same sample standard deviation. `statistics.pstdev` divides by n, 6, and gives a smaller 3.02%. This module uses the sample one."
  - label: "Annualizing"
    lines: "14"
    note: "A year's variance is twelve months' worth, so a year's volatility is the month's times `math.sqrt(12)`, about 3.46: 11.47%, not 3.31% × 12."
