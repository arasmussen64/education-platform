id: build-max-drawdown
stage: build
rev: 1
title: "The maximum drawdown and where it happened"
prompt: |
  Starting from a blank editor, write a function `max_drawdown(prices)` that returns three things, as a tuple:

  - the maximum drawdown as a positive decimal (a fall from 70 to 52 is `0.2571...`), or `0.0` if the price never falls below an earlier high;
  - the position (list index, counting from 0) of the peak that fall started from;
  - the position of the low it reached.

  If the price never falls, return `(0.0, 0, 0)`. Then, for a fund's made-up prices `[50, 58, 64, 55, 48, 60, 70, 63, 52, 66]`, print:

  ```
  Maximum drawdown: 25.71%, from position 6 to position 8
  ```

  The function returns the fall unrounded. The checks call it with other prices too, where the highest price of all isn't always where the worst fall starts.
skills: [drawdown]
