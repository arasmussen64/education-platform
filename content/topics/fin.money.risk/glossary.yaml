- term: volatility
  definition: "How much an investment's returns swing: the sample standard deviation of its returns, usually quoted for a year by multiplying by the square root of the periods in a year."
- term: sample standard deviation
  definition: "A standard deviation that divides the summed squared distances by one less than the count, n − 1, used when the data is a sample. Python's `statistics.stdev`."
- term: drawdown
  definition: "How far a price sits below the highest price before it: `price / peak - 1`. Zero at a new high."
- term: running peak
  definition: "The highest price so far, updated as you go through a price list; drawdowns are measured from it."
- term: maximum drawdown
  aliases: [max drawdown]
  definition: "The deepest drawdown in a period: the largest fall from a running peak to a later low, usually reported as a positive share, such as 25%."
