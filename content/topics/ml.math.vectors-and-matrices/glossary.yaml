- term: vector
  definition: A list of numbers in a fixed order, such as a point's coordinates. With two entries it can be drawn as an arrow. In Python, a list.
- term: dot product
  aliases: [weighted sum]
  definition: One number made from two vectors of the same size, by multiplying the matching entries and adding the products. It is 0 when the two vectors are perpendicular.
- term: matrix
  aliases: [matrices]
  definition: A grid of numbers in rows and columns, held in Python as a list of rows. Its shape is rows × columns, so a 2×3 matrix has 2 rows and 3 columns.
