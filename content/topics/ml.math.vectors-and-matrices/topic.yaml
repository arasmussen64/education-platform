prove:
  build: build-matrix-multiply
  debug: debug-centre-of-points
  explain:
    prompt: |
      A is a 2×3 matrix and B is a 3×4 matrix. In your own words: what is each entry of the product AB made from, and why does that force the 3 in A's shape to match the 3 in B's? What shape is AB? And why does a layer of a neural network multiply a matrix by a vector: what does one entry of the result mean?
    rubric:
      - id: entry
        required: true
        description: "Each entry of AB is the dot product of a row of A and a column of B: multiply the pairs and add."
      - id: inner-match
        required: true
        description: "A row of A has 3 entries and a column of B has 3, so the pairs line up; the inner numbers must match or there's nothing to pair."
      - id: outer-shape
        required: true
        description: "AB has as many rows as A and as many columns as B: 2×4."
      - id: layer
        required: true
        description: "A layer's weights are a matrix and its input a vector; each entry of the result is a weighted sum of the inputs, one per neuron in the next layer."
      - id: loops
        required: false
        description: "Relates it to the code: three loops, over rows of A, columns of B, and the shared inner index."
    model_answer: |
      Each entry of AB comes from one row of A and one column of B: multiply them pair by pair and add the products, which is a dot product. A row of A has 3 entries and a column of B has 3 entries, so the pairs line up. If A had 3 columns and B had 4 rows there would be a product with nothing to pair with, which is why the inner numbers must match. The result takes the outer numbers: one entry for each row of A and each column of B, so AB is 2×4. In code that's three loops: over A's rows, over B's columns, and the shared inner index that runs the dot product. A neural-network layer is the same picture: its weights are a matrix, its input is a vector, and each entry of the result is a weighted sum of all the inputs, one entry per neuron in the next layer. The shapes must match for the same reason, which is why shape errors are the most common bug in ML code.
review_pool:
