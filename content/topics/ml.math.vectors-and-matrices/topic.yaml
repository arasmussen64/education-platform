id: ml.math.vectors-and-matrices
kind: topic
status: planned
title: Vectors and matrices
summary: "Vectors as lists and matrices as lists of lists: adding, scaling, the dot product, shapes and multiplication."
prerequisites:
- ml.math.arithmetic
- py.nested-data
estimated_minutes: 50
rev: 1
objectives:
- Add and scale vectors held as lists.
- "Compute a dot product and a vector's length."
- Hold a matrix as a list of lists, and read its shape.
- Multiply a matrix by a vector and by a matrix with loops, checking the shapes.
