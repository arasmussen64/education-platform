id: example-vectors-as-lists
stage: worked_example
rev: 1
title: "Vectors as lists"
prompt: |
  This program adds two vectors, scales one, takes their dot product and measures a length, all with plain lists. Press **Run**, then read how each part works.
steps:
  - label: "Add, entry by entry"
    lines: "1-6"
    note: "The loop visits each position and adds the two entries there: `[5, 7, 9]`. Python's own `a + b` would glue the lists together, so a vector sum needs the loop."
  - label: "Scale every entry"
    lines: "8-11"
    note: "Multiplying a vector by 3 multiplies each entry: `[3, 6, 9]`."
  - label: "The dot product"
    lines: "13-16"
    note: "Multiply matching entries and add them up: 1×4 + 2×5 + 3×6 is `32`. One number, not a vector."
  - label: "Length"
    lines: "18-20"
    note: "A vector's length is the square root of the dot product with itself: `[3, 4]` gives the square root of 9 + 16, `5.0`."
