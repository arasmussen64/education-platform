id: write-vector-length
stage: write
rev: 1
title: "How long is a vector?"
prompt: |
  Write a function `length(v)` that returns the length of a vector held as a list: the square root of the sum of the squares of its entries. Then print the lengths of `[3, 4]`, `[1, 2, 2]` and `[6, 8]`, one per line:

  ```
  5.0
  3.0
  10.0
  ```
hints:
  - "Loop over the entries, adding `value * value` to a running total."
  - "A square root is `** 0.5`."
  - "The function must work for a list of any length, not just two entries."
skills: [dot]
