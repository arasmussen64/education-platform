id: fill-matrix-times-vector
stage: fill_in
rev: 1
title: "Matrix times vector"
prompt: |
  Each entry of a matrix times a vector is the dot product of one row with the vector. Replace each `...` so the program multiplies `[[1, 2], [3, 4]]` by `[5, 6]` and prints:

  ```
  [17, 39]
  ```

  Until the `...` on line 7 is replaced, Python can't run the program at all, and shows a syntax error. The one on line 6 is different: left as it is, the program runs and then stops with a `TypeError` that mentions `ellipsis`, which is Python's name for `...`.
hints:
  - "The inner loop walks along one row, so it runs over the row's positions: `range(len(row))`."
  - "A dot product multiplies matching entries: `row[j]` with `v[j]`."
skills: [matmul]
