id: debug-centre-of-points
stage: debug
rev: 2
title: "The centre of some points"
prompt: |
  The centre of a set of points is the mean of their coordinates, taken one coordinate at a time: a vector whose first entry is the mean of all the first entries, and so on. For the points `[[1, 2], [3, 4], [5, 0]]` this program should print:

  ```
  [3.0, 2.0]
  ```

  Instead it stops with `IndexError: list index out of range`. It has two bugs, and the second shows only once the first is fixed. Run it, fix what you find, and run it again.
hints:
  - "Read the error's last line and the line it points to: which index is too big for a point, and where does that index come from?"
  - "`j` picks a coordinate. Each point has `len(points[0])` coordinates, here 2, but there are 3 points. Which of those should the outer loop count?"
  - "Once it runs it prints `[4.5, 3.0]`, each entry one and a half times too big. A mean divides the total by how many values went into it: how many points were added up?"
skills: [vector-ops, matrix-shape]
