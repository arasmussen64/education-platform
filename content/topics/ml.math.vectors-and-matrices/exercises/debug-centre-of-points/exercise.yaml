id: debug-centre-of-points
stage: debug
rev: 1
title: "The centre of some points"
prompt: |
  The centre of a set of points is the mean of their coordinates, taken one coordinate at a time: a vector whose first entry is the mean of all the first entries, and so on. For the points `[[1, 2], [3, 4], [5, 0]]` this program should print:

  ```
  [3.0, 2.0]
  ```

  It has two bugs. Run it, fix what you find, and run it again. Ask of each loop: how many times should it run, and over what?
skills: [vector-ops, matrix-shape]
