id: build-matrix-multiply
stage: build
rev: 1
title: "Matrix multiplication"
prompt: |
  Starting from a blank editor, write a function `multiply(a, b)` that returns the product of two matrices held as lists of rows, assuming their shapes match. Entry `[i][j]` of the result is the dot product of row `i` of `a` and column `j` of `b`: three loops. Then print the product of `[[1, 2], [3, 4]]` and `[[5, 6], [7, 8]]`, one row per line:

  ```
  [19, 22]
  [43, 50]
  ```

  The checks call your function with other shapes too, including a 1×3 times a 3×1 and a 2×3 times a 3×2.
skills: [matmul, matrix-shape]
