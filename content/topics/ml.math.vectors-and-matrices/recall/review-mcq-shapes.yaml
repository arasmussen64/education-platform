id: review-mcq-shapes
type: mcq
rev: 1
prompt: |
  Which of these products can be formed, and what shape is it?
choices:
  - 'A 3 × 2 times a 2 × 2: it gives a 3 × 2'
  - 'A 3 × 2 times a 3 × 2: it gives a 3 × 2'
  - 'A 2 × 3 times a 2 × 3: it gives a 2 × 3'
  - 'A 3 × 2 times a 3 × 3: it gives a 2 × 3'
answer: 0
explanation: |
  Two matrices multiply when the inner numbers match: the columns of the first and the rows of the second. `3 × 2` times `2 × 2` pairs 2 with 2 and keeps the outer numbers, 3 × 2. In the other three, the inner numbers differ (2 and 3, 3 and 2, 2 and 3), so there's nothing to pair.
skills: [matrix-shape]
