id: mcq-perpendicular
type: mcq
rev: 1
prompt: |
  What is the dot product of `[1, 0]` and `[0, 1]`, two arrows at right angles?
choices:
  - '`[0, 0]`'
  - '`1`'
  - '`2`'
  - '`0`'
answer: 3
explanation: |
  Multiply matching entries and add: `1 * 0 + 0 * 1` is `0`. A dot product is a single number, never a vector, and it's zero exactly when the two vectors are perpendicular: neither has any part pointing along the other.
skills: [dot]
