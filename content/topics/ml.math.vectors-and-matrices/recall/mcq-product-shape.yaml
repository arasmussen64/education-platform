id: mcq-product-shape
type: mcq
rev: 1
prompt: |
  `A` has 2 rows and 3 columns; `B` has 3 rows and 4 columns. What shape is the product `AB`, and why can it be formed at all?
choices:
  - "3 × 3: the two 3s combine"
  - "2 × 4: A's 3 columns pair with B's 3 rows, and the result keeps the outer numbers"
  - "4 × 2: the product is always the shapes reversed"
  - "It can't be formed: the shapes are different"
answer: 1
explanation: |
  Each entry of the product is a dot product of a row of A (3 entries) with a column of B (3 entries), so the inner numbers must match, and they do. The result has one entry for each row of A and each column of B: 2 × 4.
skills: [matrix-shape]
