id: predict-scale-and-add
type: predict_output
rev: 1
prompt: |
  A vector plus three times another, entry by entry. What does the program print?
code: |
  v = [2, -1]
  w = [1, 4]
  result = []
  for i in range(len(v)):
      result.append(v[i] + 3 * w[i])
  print(result)
expected_output: |
  [5, 11]
explanation: |
  Scaling multiplies each entry: `3 * [1, 4]` is `[3, 12]`. Adding goes entry by entry: `[2 + 3, -1 + 12]`, so `[5, 11]`. (Python's own `v + 3 * w` would glue the lists into `[2, -1, 1, 4, 1, 4, 1, 4]`, which is why the loop is there.)
skills: [vector-ops]
