id: parsons-dot-product
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints the dot product of `[1, 2, 3]` and `[4, 5, 6]`, which is `32`. One line is a decoy that doesn't belong.
lines:
  - 'a = [1, 2, 3]'
  - 'b = [4, 5, 6]'
  - 'total = 0'
  - 'for i in range(len(a)):'
  - '    total = total + a[i] * b[i]'
  - 'print(total)'
distractors:
  - '    total = total + a[i] + b[i]'
explanation: |
  The dot product multiplies matching entries and adds the products: 1×4 + 2×5 + 3×6 is 4 + 10 + 18, `32`. The loop walks the positions, and the running total starts at 0. The decoy adds the entries instead of multiplying them, which would give 21.
skills: [dot]
