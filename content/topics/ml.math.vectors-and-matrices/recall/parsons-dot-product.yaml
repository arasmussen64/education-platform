id: parsons-dot-product
type: parsons
rev: 2
prompt: |
  Put the lines in order so the program prints the dot product of `[1, 2, 3]` and `[4, 5, 6]`, which is `32`. One line is a decoy that doesn't belong.
lines:
  - 'a, b, total = [1, 2, 3], [4, 5, 6], 0'
  - 'for i in range(len(a)):'
  - '    total = total + a[i] * b[i]'
  - 'print(total)'
distractors:
  - '    total = total + a[i] + b[i]'
explanation: |
  The first line gives three names their starting values at once, in the order written: the two vectors, and a running total of 0. The dot product multiplies matching entries and adds the products: 1×4 + 2×5 + 3×6 is 4 + 10 + 18, `32`. The loop walks the positions. The decoy adds the entries instead of multiplying them, which would give 21.
skills: [dot]
