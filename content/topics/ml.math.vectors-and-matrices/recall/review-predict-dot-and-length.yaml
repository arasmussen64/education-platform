id: review-predict-dot-and-length
type: predict_output
rev: 1
prompt: |
  A dot product, then a length. What does the program print?
code: |
  a = [2, 3]
  b = [4, 5]
  print(a[0] * b[0] + a[1] * b[1])

  c = [5, 12]
  print((c[0] * c[0] + c[1] * c[1]) ** 0.5)
expected_output: |
  23
  13.0
explanation: |
  The dot product is `2 * 4 + 3 * 5`, which is `23`. The length of `[5, 12]` is the square root of `25 + 144`, which is `13.0` (a float, because of the `** 0.5`).
skills: [dot]
