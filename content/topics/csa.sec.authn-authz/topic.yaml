prove:
  build: build-clinic-records
  debug: debug-hr-portal
  explain:
    prompt: |
      A colleague says: "We've got single sign-on with MFA now, so the app doesn't need access rules of its own. And giving the support team admin is simpler for now." Explain, in your own words: the difference between authenticating someone and authorizing what they do, and where each happens; why every request still needs a decision; how you'd set up the support team's access with least privilege, as a process and not a one-off, and what the clouds' tools add and miss; what separation of duties would forbid here and how you'd enforce it; and how AWS, Azure and Google Cloud each decide when two rules disagree.
    rubric:
      - id: authn-vs-authz
        required: true
        description: "Authentication proves who someone is (factors: something you know, have or are; MFA is two different kinds) and happens at sign-in, at an identity service; authorization decides whether that person may do this action to this resource, in the app or a policy engine. A session or token is the result of the first and only an input to the second. `401` against `403` named or implied."
      - id: every-request
        required: true
        description: "Access is decided on every request, starting from default deny: MFA at sign-in says nothing about what a signed-in person may do, and doesn't stop them doing what they shouldn't."
      - id: least-privilege-loop
        required: true
        description: "Start from what the job needs, observe real use over a window long enough for rare tasks, cut to a narrow role at the narrowest scope, watch for denials, repeat. Analyzers (AWS IAM Access Analyzer, Google's role recommendations) observe, but only inside their window, and can't know what the job is for: a task rarer than the window looks unused, and something used isn't thereby needed."
      - id: separation-of-duties
        required: true
        description: "A concrete pair of duties that mustn't meet in one person (such as issuing a refund and approving it, or changing a system and reviewing its log), enforced by roles that never go together or by a rule on each request (the approver isn't the requester), and why a deny or forbid holds against later broad grants."
      - id: clouds-differ
        required: true
        description: "AWS: an explicit deny wins; allows from identity and resource policies add up, inside the limits of SCPs and boundaries, which grant nothing. Azure: role assignments add up down the scopes, and a deny assignment is checked first. Google Cloud: allow policies add up down the hierarchy, and deny policies are checked before them."
      - id: models
        required: false
        description: "Roles against attributes (role explosion; one rule that compares attributes), and policy as code: rules in files that are versioned, reviewed and tested."
    model_answer: |
      Single sign-on with MFA answers one question: who is this? That's authentication. The person proves who they are with two different kinds of proof, say a password and a code from their phone, at the sign-in service, and the app gets a session that says "this is Dina, and she used MFA". It says nothing about what Dina may do. That's authorization, a second question the app has to ask itself on every single request: may this person do this action to this thing, now? Without rules of its own, every signed-in person can do everything. The two failures even look different: `401` means "I don't know who you are", `403` means "I do, and no".

      So every request is decided, and the starting answer is no: default deny. Rules then allow what's needed.

      Giving support admin "for now" is the opposite, and "for now" tends to stay. I'd start from what the support job needs, a narrow role, and treat it as a loop: watch what they really use, for long enough to see the rare tasks, cut what isn't needed, watch for denials, and go round again. The clouds' analyzers help with the watching: AWS's Access Analyzer and Google's role recommendations report what was granted and never used. But they only see their window, 90 days at most, so a quarterly task looks unused, and they can't tell what was used from what should have been.

      Separation of duties means nobody completes a sensitive task alone. Here: whoever handles a sale shouldn't refund it, and whoever issues a refund shouldn't approve it. Either the two roles never go to one person, or a rule on each request says the approver isn't the requester. I'd write it as a deny, because a deny holds whatever broad allow someone adds later.

      On the clouds: in AWS, allows add up and one explicit deny beats them all, while SCPs and boundaries only limit. In Azure, role assignments add up down the scopes, and a deny assignment is checked first. In Google Cloud, allow policies add up down the hierarchy, and deny policies are checked before any of them.
