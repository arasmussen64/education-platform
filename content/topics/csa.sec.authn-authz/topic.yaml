skills:
  - id: authn-or-authz
    description: "Which step proves who (authentication, its factors, what counts as MFA) and which decides what they may do (authorization, on every request); where each happens; `401` against `403`; a session or token as the result of the first and an input to the second; an authentication fact such as MFA used in an authorization rule"
  - id: access-models
    description: "Roles (RBAC), attributes (ABAC), relationships, and policy as code: what each is good and bad at, role explosion, reading and writing Cedar (`permit`, `forbid`, scope, `when`, `unless`, roles with `in`), default deny, a forbid that wins, a schema catching a typo; working out what a small set of policies decides"
  - id: least-privilege
    description: "The minimum access at the narrowest scope, as a loop: observe, cut, watch, repeat; managed against custom roles; what the clouds' analyzers observe, their windows and prices; reading a usage log against a grant; the sums (the share unused, how long a window must be, what the analysis costs)"
  - id: separation-of-duties
    description: "Duties that must not meet in one person; static (roles that never go together) against dynamic (a rule on each request); writing it as a forbid, and why a temporary exception is a hole"
  - id: cloud-policy-models
    description: "How AWS combines identity and resource policies (a union), boundaries, SCPs and RCPs (limits that grant nothing) and explicit deny; Azure's role assignments (principal, role, scope; additive; deny assignments first); Google Cloud's allow policies (inherited, a union) and deny policies (checked first); just-in-time access on each"
