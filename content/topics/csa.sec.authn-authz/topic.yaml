id: csa.sec.authn-authz
kind: topic
status: ready
title: Authentication and authorization
summary: "Two questions every system asks: who is this, and may they do that? Authentication and its factors, the session it leaves behind, and `401` against `403`; authorization as a decision on every request, with default deny and a deny that always wins; roles, attributes and policy as code, written and tested in Cedar; least privilege as a loop of observe, cut and watch, with what the clouds' analyzers see and miss; separation of duties; and how AWS, Azure and Google Cloud each combine their policies."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 2,
# 3 and 5) and its designer's brief (csa.sec.authn-authz.md), with what
# building the policy lab base found (BUILD-NOTES.md and
# content/lab-bases/policy/README.md). Its one prerequisite is Checkpoint
# 3: it builds on Module 1 (users, groups, modes, sudo and sudoers, SSH key
# pairs, least privilege for services, awk, sort, uniq -c, sed) and Module 3
# (an HTTP request, its status codes, cookies, a signature in one sentence,
# mutual TLS). Module 2 is not a prerequisite.
#
# This topic defines, for the module (the plan's 3.5): authentication,
# authorization, identity, principal (in the glossary as "security
# principal": the finance track's glossary has "principal" already),
# credential, authentication factor, MFA, session ("sign-in session"),
# token, claim (one sentence, no glossary entry: "claim" as a glossary term
# would mark the everyday verb in other lessons, and csa.sec.federation
# opens claims up), policy ("access policy"), default deny, explicit deny,
# least privilege, privilege creep, separation of duties, RBAC, ABAC, role
# explosion, policy as code, policy decision point and policy enforcement
# point, workload identity, just-in-time access, and `401` against `403`.
prerequisites: [csa.m3.checkpoint]
# Worked out: the lesson about 31 minutes (4,000 words with its tables),
# the copied reading 20 (OWASP's introduction and first five
# recommendations, 2,663 words by the importer's count), the puzzle and
# the story 3, 16 practice recall items at 1.5 each 24, then the worked
# example 30, the fill-in 25, the write 40, the build 50, the debug 40 and
# the explain 20: about 283. The plan's 290 is kept (MODULE-4-BRIEF.md,
# section 2).
estimated_minutes: 290
rev: 1
objectives:
  - "Tell authentication from authorization in any system: which step proves who someone is, and with which factors; which step decides what they may do, on every request; where each happens; and what each failure looks like (`401` against `403`)."
  - "Write access rules as code in Cedar: a rule for a role, a rule that compares attributes, and a `forbid` that no `permit` can override, validated against a schema and tried against requests; and say what default deny and policy as code give you."
  - "Take access down to least privilege as a loop (observe real use, cut, watch for denials, repeat), read an access analyzer's report beside what the job is for, and do the sums: the share unused, how long a window must be, what the analysis costs."
  - "Name duties that must not meet in one person and enforce their separation, by roles or by a rule decided on each request."
  - "Compare how AWS, Azure and Google Cloud combine their policies when rules disagree, and name each cloud's tools for least privilege."
# Facts the lesson and the items rely on, each read on 2026-11-22:
# - RFC 9110 (HTTP Semantics, June 2022), section 15.5.2: 401 "indicates
#   that the request has not been applied because it lacks valid
#   authentication credentials for the target resource", and the server
#   "MUST send a WWW-Authenticate header field"; 15.5.4: 403 "indicates
#   that the server understood the request but refuses to fulfill it", "If
#   authentication credentials were provided in the request, the server
#   considers them insufficient to grant access", and a server that wishes
#   to hide a forbidden resource "MAY instead respond with a status code of
#   404 (Not Found)": rfc-editor.org/rfc/rfc9110.html.
# - Microsoft's "Authentication vs. authorization" (ms.date 2025-03-21):
#   authentication "is the process of proving that you are who you say you
#   are"; authorization "is the act of granting an authenticated party
#   permission to do something":
#   learn.microsoft.com/en-us/entra/identity-platform/authentication-vs-authorization.
# - NIST's glossary: least privilege, each entity "is granted the minimum
#   system resources and authorizations that the entity needs to perform its
#   function" (SP 800-53 Rev. 5): csrc.nist.gov/glossary/term/least_privilege.
#   Separation of duty, "no user should be given enough privileges to misuse
#   the system on their own", enforced "statically (by defining conflicting
#   roles ...) or dynamically (by enforcing the control at access time)"
#   (SP 800-192): csrc.nist.gov/glossary/term/separation_of_duty.
# - Cedar's "Authorization" page: "no request is authorized (decision
#   Allow) unless there is a specific permit policy that grants it"; "even
#   if a permit policy is satisfied, any satisfied forbid policy overrides
#   it"; "if a policy's evaluation returns error ... it is skipped":
#   docs.cedarpolicy.com/auth/authorization.html.
# - AWS, "Policy evaluation logic": identity-based and resource-based
#   policies in one account, "the union of the permissions of the two
#   types", "An explicit deny in either of these policies overrides the
#   allow"; with a permissions boundary "the intersection"; with SCPs or
#   RCPs "an action must be allowed by all three policy types":
#   docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html.
#   "Security best practices in IAM": managed policies "might not grant
#   least-privilege permissions for your specific use cases because they
#   are available for use by all AWS customers"; "No permissions are
#   granted by SCPs and RCPs": .../best-practices.html.
#   IAM Access Analyzer: unused access findings cover unused roles, access
#   keys, passwords, services and actions; "Service-linked roles aren't
#   analyzed for unused access activity": .../what-is-access-analyzer.html.
#   Its tracking period is set when the analyzer is made: "You can enter a
#   value between 1 and 365 days" (.../access-analyzer-create-unused.html,
#   read by the reviewer on 2026-11-22).
#   Its prices: $0.20 per IAM role or user analyzed per month (unused
#   access), $9.00 per monitored resource per Region per month (internal
#   access), $0.0020 per API call (custom policy checks); external access
#   analysis, policy validation and policy generation at no additional
#   charge: aws.amazon.com/iam/access-analyzer/pricing/.
#   Policy generation: "a time period of up to 90 days"; no action-level
#   activity for data events; iam:PassRole not tracked:
#   .../access-analyzer-policy-generation.html. Last accessed information:
#   "The tracking period for service information is at least 400 days";
#   it "includes all attempts to access an AWS API, not just the successful
#   attempts": .../access_policies_last-accessed.html.
# - Azure, "What is Azure RBAC?" (ms.date 2024-03-12, updated 2025-10-15):
#   "A role assignment consists of three elements: security principal, role
#   definition, and scope"; four scope levels (management group,
#   subscription, resource group, resource); "an additive model, so your
#   effective permissions are the sum of your role assignments"; "If a deny
#   assignment applies, access is blocked"; free with the subscription:
#   learn.microsoft.com/en-us/azure/role-based-access-control/overview.
#   Privileged Identity Management (ms.date 2026-11-17): just-in-time,
#   time-bound, approval, MFA on activation; eligible against active
#   assignments; "Using Privileged Identity Management requires licenses":
#   learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure.
# - Google Cloud, "IAM overview": an allow policy "contains a list of role
#   bindings"; basic roles "shouldn't be used in production environments";
#   "The union of all of these policies is called the effective allow
#   policy"; deny policies; principal access boundary policies:
#   docs.cloud.google.com/iam/docs/overview. "IAM always checks relevant
#   deny policies before checking relevant allow policies", and deny
#   policies are inherited: .../iam/docs/deny-overview. Role
#   recommendations: "The maximum observation period for role
#   recommendations is 90 days" (30 or 60 for a project, by choice); "a role
#   recommendation never suggests a change that increases a principal's
#   level of access"; recommendations for basic roles "are available at no
#   charge", others need Security Command Center Premium or Enterprise:
#   docs.cloud.google.com/policy-intelligence/docs/role-recommendations-overview.
#   Privileged Access Manager, just-in-time temporary elevation with
#   entitlements and grants: docs.cloud.google.com/iam/docs/pam-overview.
# - The story: United States v. Thompson, No. 22-30179 (9th Cir., 17 March
#   2025), the opinion's statement of facts (the court's PDF, read as
#   text); the OCC's news release 2020-101 (6 August 2020); Capital One's
#   own page on the incident (capitalone.com/digital/facts2019/). The
#   Justice Department's releases returned no text and aren't used, so the
#   story says nothing about a firewall.
# - Not confirmed, so not in the lesson: the dates on which Microsoft Entra
#   Permissions Management stopped being sold and supported (the designer's
#   fact F23; its two posts weren't opened).
# Tried in this topic's labs (the Cedar command-line tool 4.14.1 in the
# policy lab base), 2026-11-22: every policy, every `ask` answer and every
# `cedar validate` message the lesson and the labs show; the three "how
