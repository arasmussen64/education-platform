# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# "principal" alone is the finance track's word (the sum a loan starts
# from), so this topic's is "security principal". "policy", "session" and
# "claim" are everyday words in other lessons (a restart policy, a TLS
# session, "the page claims"), so they are defined here as the phrases
# "access policy" and "sign-in session", and "claim" has no entry.
- term: authentication
  aliases: [authn]
  definition: Proving who is asking, a person or a machine, by a password, a key, a certificate or another proof. It answers "who is this?" and nothing more.
- term: authorization
  aliases: [authz]
  definition: Deciding whether someone already authenticated may do this action to this resource. It is asked again on every request.
- term: identity
  definition: The record a system keeps of one person or one workload, such as an account, which a sign-in proves someone is.
- term: security principal
  definition: Whoever is asking to do something, a person or a workload (a service, a job, a virtual machine), as an access rule sees them.
- term: credential
  definition: What someone presents to prove who they are, such as a password, a private key, a certificate or a one-time code.
- term: authentication factor
  definition: One kind of proof of who you are. There are three kinds, something you know (a password), something you have (a phone, a key) and something you are (a fingerprint).
- term: MFA
  aliases: [multi-factor authentication]
  definition: Multi-factor authentication. A sign-in that takes two different kinds of proof, such as a password and a code from a phone. Two proofs of one kind, such as two passwords, don't count.
- term: sign-in session
  definition: What a sign-in leaves behind, so the person needn't prove who they are on every request. It records who signed in, how and until when.
- term: token
  definition: A piece of data handed out as proof and shown again later. After a sign-in it is the signed statement of who signed in and how, which an app reads on each request.
- term: workload identity
  definition: An identity for a program instead of a person, such as a service, a job or a virtual machine, so that it can be authenticated and given its own narrow access.
- term: access policy
  definition: A rule, or a set of rules, that says which security principals may do which actions to which resources, and under what conditions.
- term: default deny
  definition: The starting answer of an access system. A request is refused unless some rule allows it, so anything nobody wrote a rule for is denied.
- term: explicit deny
  definition: A written rule that refuses, and that beats every rule that allows. Cedar's `forbid`, a `Deny` statement on AWS, Azure's deny assignment and Google Cloud's deny policy are all this.
- term: least privilege
  definition: Giving each person and each program only the access its job needs, at the narrowest scope, and cutting again as real use shows what isn't needed.
- term: privilege creep
  definition: Access piling up over time, as people change jobs and "temporary" grants stay, until an account can do far more than its work needs.
- term: separation of duties
  definition: Arranging access so that no one person can complete a sensitive task alone, such as requesting a payment and approving it.
- term: RBAC
  aliases: [role-based access control]
  definition: Role-based access control. Permissions are given to roles, and people are put into roles. Easy to read and audit, but each new dimension multiplies the roles.
- term: ABAC
  aliases: [attribute-based access control]
  definition: Attribute-based access control. A rule compares facts about the person, the resource and the request, such as "their store is the order's store", so one rule covers every store.
- term: role explosion
  definition: The number of roles multiplying as each new dimension (department, country, level) needs a role for every combination.
- term: policy as code
  definition: Keeping access rules in text files that are versioned, reviewed and tested like program code, instead of settings clicked into a console.
- term: policy decision point
  aliases: [PDP]
  definition: The part of a system that decides whether a request is allowed, by reading the access rules. It answers allow or deny and does nothing else.
- term: policy enforcement point
  aliases: [PEP]
  definition: The part of a system that stands in front of a resource, asks for a decision on each request and obeys the answer.
- term: just-in-time access
  definition: Powerful access that a person doesn't hold all the time. They activate it when needed, often with approval, and it ends by itself after a set time.
