id: mcq-azure-additive
type: mcq
rev: 1
prompt: |
  In Azure, Priya is assigned the Contributor role on a whole subscription, and the Reader role on one resource group inside it. No deny assignment applies. What can she do in that resource group?
choices:
  - "Everything Contributor allows: Azure adds her role assignments together"
  - "Only read: the assignment at the narrower scope replaces the wider one"
  - "Only read: where two roles overlap, Azure applies the less powerful of them"
  - "Nothing: two different roles on one scope conflict, and neither applies"
answer: 0
explanation: |
  Azure RBAC is additive: "your effective permissions are the sum of your role assignments". The subscription's assignment is inherited by every resource group in it, so in that group Priya has Contributor plus Reader, which is Contributor. Microsoft's own page uses this example and says the Reader assignment "has no impact".

  A narrower assignment never takes anything away. To make her read-only in one group you would remove the wide assignment and grant narrower ones, or use a deny assignment, which Azure checks before any role assignment.
skills: [cloud-policy-models]
