id: mcq-forbid-wins
type: mcq
rev: 1
prompt: |
  An expenses system has an old Cedar `forbid`: nobody approves an expense they submitted. This week someone adds a new `permit`: managers may approve any expense. A manager submits an expense and then tries to approve it. What happens?
choices:
  - "Denied: a forbid that applies overrides every permit"
  - "Allowed: the newer of two rules that disagree is the one that counts"
  - "Allowed: a permit and a forbid cancel out, leaving the manager's role to decide"
  - "Denied, but only if the forbid comes before the permit in the policy file"
answer: 0
explanation: |
  Cedar's rule has no order and no age in it: a request is allowed only if at least one `permit` applies and no `forbid` does. Both rules apply to this request, so the forbid wins. The order of rules in the file and the date they were written don't matter, and nothing "cancels out".

  That is why separation of duties is written as a forbid. Permits pile up over the years, each one reasonable; a forbid holds against all of them.
skills: [access-models, separation-of-duties]
