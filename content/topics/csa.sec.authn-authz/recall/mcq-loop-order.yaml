id: mcq-loop-order
type: mcq
rev: 1
prompt: |
  A service account has had broad access for a year. Which order of steps takes it to least privilege without breaking its job?
choices:
  - "Observe what it uses over a long enough window, cut the rest, watch for denials, repeat"
  - "Cut everything that looks unnecessary first, then observe which of its jobs start to fail"
  - "Copy the access of a similar service that works, then observe both of them for a quarter"
  - "Remove all of its access, then grant back each permission as someone asks for it, and repeat"
answer: 0
explanation: |
  Least privilege is a loop: **observe** real use (over a window long enough to include the rare jobs, and with the job's description beside the log), **cut** what isn't needed, **watch** for denials that show a cut went too far, and go round again, because jobs change.

  Cutting first finds out what was needed by breaking it. Copying another service's access copies its excess too. Removing everything and waiting for complaints is the same breakage with more of it, and the permissions granted back in a hurry are rarely narrow.
skills: [least-privilege]
