id: mcq-azure-deny-assignment
type: mcq
rev: 1
prompt: |
  In Azure RBAC, which of these stops a person doing something that one of their role assignments allows?
choices:
  - "A deny assignment that applies to them at that scope"
  - "A Reader role assignment for them at a narrower scope"
  - "A second role assignment that leaves the action out"
  - "A custom role for them with the action in `NotActions`"
answer: 0
explanation: |
  When a request arrives, Azure collects the role assignments and deny assignments that apply, and "if a deny assignment applies, access is blocked" before any role is looked at. It's Azure's explicit deny.

  The other three are all role assignments, and role assignments only add up. A narrower Reader assignment, or a second role without the action, takes nothing away from the first role that has it. `NotActions` only subtracts inside the one role definition it's written in: another assignment that allows the action still allows it.
skills: [cloud-policy-models]
