id: mcq-rbac-or-abac
type: mcq
rev: 1
prompt: |
  A company has 14 sales regions. The rule it wants: each regional manager sees the sales of their own region and no other. Which way of writing it needs one rule, and still only one when a 15th region opens?
choices:
  - "Attribute-based: compare the manager's region with the sale's region"
  - "Role-based: one `regional-manager` role, permitted to see sales"
  - "Role-based: a role for each region, each permitted that region's sales"
  - "Relationship-based: make each manager the owner of every sale in the region"
answer: 0
explanation: |
  One rule that compares two attributes (`principal.region == resource.region`) is true for every region there is and every region to come. That's attribute-based access control.

  A single `regional-manager` role can't say "their own": it would show every manager every region's sales. A role for each region works, but it's 14 rules and 14 roles today and one more of each for every new region, which is how role explosion starts. Relationships could do it, but someone would have to record an owner on every sale as it's made, where the region is already there.
skills: [access-models]
