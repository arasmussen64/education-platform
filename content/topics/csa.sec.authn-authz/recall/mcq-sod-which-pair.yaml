id: mcq-sod-which-pair
type: mcq
rev: 1
prompt: |
  Which of these pairs of duties most needs to be kept in different people?
choices:
  - "Changing the payroll system, and reviewing the log of changes made to it"
  - "Reading the shop's orders, and reading the invoices that belong to them"
  - "Deploying a new version of the website, and reading the website's error logs"
  - "Opening a support ticket, and adding comments to tickets that others opened"
answer: 0
explanation: |
  Separation of duties is for pairs where the second duty is the check on the first. The log review exists to catch a wrong or dishonest change to payroll; if the person who makes the changes also reviews them, nobody is checking, and one person can pay themselves and sign it off.

  The other pairs have no check in them. Reading orders and reading invoices are two reads. Reading error logs is how the person who deployed finds out what broke. Tickets and comments move no money and hide nothing.
skills: [separation-of-duties]
