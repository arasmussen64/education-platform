id: mcq-two-factors
type: mcq
rev: 1
prompt: |
  Which of these sign-ins is multi-factor authentication?
choices:
  - "A password, then a six-digit code from an authenticator app on the person's phone"
  - "A password, then the answer to a security question the person chose last year"
  - "A password, then a four-digit PIN that the person types on the following screen"
  - "A password for the laptop, then a second, longer password for the application"
answer: 0
explanation: |
  Multi-factor means two different **kinds** of proof: something you know, something you have, something you are. A password is something you know; a code from an authenticator app shows you have the phone. That's two kinds.

  A security question, a PIN and a second password are all more things you know. Whoever can steal one thing you know (by watching, guessing or phishing) can steal two the same way, so they count as one factor however many there are.
skills: [authn-or-authz]
