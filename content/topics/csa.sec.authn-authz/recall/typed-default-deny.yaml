id: typed-default-deny
type: typed
rev: 1
prompt: |
  A new action is added to the order system, and nobody has written an access rule that mentions it. Every request for it is refused. What is this principle called, in two words?
kind: text
answers:
  - default deny
  - deny by default
  - default-deny
  - implicit deny
mistakes:
  - id: explicit-deny
    answers: [explicit deny, forbid]
    why: "An explicit deny is a rule someone wrote that refuses. Here nobody wrote anything: the refusal is what happens when no rule allows."
  - id: least-privilege
    answers: [least privilege]
    why: "Least privilege is about how much to grant: only what the job needs. What refuses a request that no rule covers has its own name."
explanation: |
  **Default deny**: nothing is allowed until a rule allows it. It's why a new action, a new kind of record or a new person starts with no access, and why forgetting to write a rule fails safe. Cedar, AWS, Azure and Google Cloud all start from it. An **explicit deny** (Cedar's `forbid`) is a different thing: a written rule that refuses, and that beats every rule that allows.
skills: [access-models]
