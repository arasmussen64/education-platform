prompt: |
  In Microsoft Entra Privileged Identity Management, an administrator's role assignment can be **eligible** instead of **active**. What does eligible mean?
choices:
  - "They don't hold the role until they activate it, for a limited time, when they need it"
  - "They hold the role all the time, and each use of it waits for an approver"
  - "They may ask to join a group that holds the role, and membership is permanent"
  - "They can see what the role would allow, and it starts working after an access review"
answer: 0
explanation: |
  An **active** assignment is standing access: the role's power is there every minute, for the person and for anyone who steals their session. An **eligible** assignment grants nothing until the person activates it, which can require MFA, a reason and an approver, and the role then lasts a set time and goes away by itself. That is **just-in-time access**: least privilege applied to time as well as to scope.

  It isn't approval of each action: once activated, the role works normally until it expires. Google Cloud's Privileged Access Manager does the same job with entitlements and time-limited grants.
skills: [cloud-policy-models, least-privilege]
