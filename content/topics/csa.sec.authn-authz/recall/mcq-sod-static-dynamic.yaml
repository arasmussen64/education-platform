id: mcq-sod-static-dynamic
type: mcq
rev: 1
prompt: |
  In a payments system every member of the finance team may both request payments and approve them. One rule stands over that: nobody approves a payment they requested. What kind of separation of duties is this?
choices:
  - "Dynamic: decided for each request, by comparing the approver with the requester"
  - "Static: decided once, by never giving one person the two roles together"
  - "Static: it's written in a policy file, which doesn't change from request to request"
  - "Neither: it's least privilege, because it takes a permission away from the team"
answer: 0
explanation: |
  **Static** separation keeps the two duties in different people for good: nobody holds both the requester role and the approver role. Here everybody holds both, so it isn't that. **Dynamic** separation lets one person hold both and stops them using both on the same thing: the rule looks at this payment, sees who requested it, and refuses that one person. In Cedar it's a `forbid` whose condition compares the payment's requester with the principal.

  Where the rule is written has nothing to do with it. And least privilege is about how much each person is granted; this rule is about two duties never meeting in one person.
skills: [separation-of-duties]
