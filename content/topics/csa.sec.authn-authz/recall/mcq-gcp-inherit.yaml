id: mcq-gcp-inherit
type: mcq
rev: 1
prompt: |
  In Google Cloud, Chen is granted the Viewer role on a folder, and the Editor role on one project inside that folder. No deny policy applies. What is Chen on that project?
choices:
  - "An editor: the project's allow policy and the folder's are added together"
  - "A viewer: a grant on the folder overrides the grants on the projects inside it"
  - "An editor, but only if the folder's policy has inheritance switched on"
  - "A viewer: of two grants to one person, the less powerful is the one applied"
answer: 0
explanation: |
  A Google Cloud resource inherits the allow policies of everything above it: project, folder, organization. Google calls the result the **effective allow policy**, "the union of all of these policies". On that project Chen has Viewer from the folder and Editor from the project, so Chen can do what either allows.

  Nothing higher up overrides a grant lower down, and inheritance isn't a switch: it always happens. So a broad role granted high in the hierarchy can't be narrowed by anything granted below it. Only a deny policy takes access away.
skills: [cloud-policy-models]
