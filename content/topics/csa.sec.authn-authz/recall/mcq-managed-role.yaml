id: mcq-managed-role
type: mcq
rev: 1
prompt: |
  AWS offers ready-made "AWS managed policies" for common jobs, and recommends starting with them and then moving on. Why isn't a managed policy least privilege for your service?
choices:
  - "It's written for every customer's version of the job, so it grants more than yours needs"
  - "AWS changes managed policies without telling anyone, so their contents can't be relied on"
  - "A managed policy applies to the whole account, and can't be attached to one role"
  - "Managed policies can only allow, so they can't hold the denies that least privilege needs"
answer: 0
explanation: |
  A managed policy has to work for every AWS customer who does that kind of job, so it covers every bucket, every queue, every variant. AWS says so itself: managed policies "might not grant least-privilege permissions for your specific use cases because they are available for use by all AWS customers". The advice is to start there, watch what your service really uses, and replace it with a policy of your own that names your actions and your resources.

  The other three aren't true: a managed policy is attached to a role or user like any policy, and least privilege is about granting less, not about adding denies.
skills: [least-privilege]
