id: mcq-analyzer-by-cloud
type: mcq
rev: 1
prompt: |
  As the clouds' pages stood in November 2026, which of these costs nothing extra?
choices:
  - "Google Cloud's role recommendations for the basic roles (Owner, Editor, Viewer)"
  - "AWS IAM Access Analyzer's unused access findings for the roles in an account"
  - "Google Cloud's role recommendations for predefined and custom roles"
  - "AWS IAM Access Analyzer's custom policy checks, made through its API"
answer: 0
explanation: |
  Google's role recommendations for **basic** roles are "available at no charge" at project, folder and organization level; recommendations for other roles need a paid tier of Security Command Center. On AWS, the **unused access** analyzer costs $0.20 for each role or user analyzed each month, and custom policy checks $0.0020 a call. What AWS gives free is policy **generation** from CloudTrail, policy validation and the external access analyzer.

  So "which analyzer is free" has no one answer: it depends on the cloud and on which part of the tool. Prices change; read the pricing page before you plan on one.
skills: [cloud-policy-models, least-privilege]
