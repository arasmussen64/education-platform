id: est-decide-eight
type: estimate
rev: 1
# The decisions were checked against the Cedar tool pinned in the policy
# lab base (4.14.1) on 2026-11-22: requests 1, 3 and 6 are allowed.
prompt: |
  The shop's order system has these four Cedar policies and no others:

  ```
  permit (principal in Role::"support", action == Action::"view", resource)
  when { principal.store == resource.store };

  permit (principal in Role::"support", action == Action::"refund", resource)
  when { principal.store == resource.store && resource.amount <= 100 };

  permit (principal in Role::"finance", action == Action::"export", resource);

  forbid (principal, action == Action::"refund", resource)
  when { resource.handled_by == principal };
  ```

  Ana is support staff at the north store, Kim is in finance, and Wes works in the north warehouse. Here are 8 requests:

  | Request | Who | Action | The order |
  | --- | --- | --- | --- |
  | A | Ana | view | north store, handled by Raj |
  | B | Ana | view | south store, handled by Raj |
  | C | Ana | refund | north store, amount at the refund limit, handled by Raj |
  | D | Ana | refund | north store, amount just over the limit, handled by Raj |
  | E | Ana | refund | north store, a small amount, handled by Ana |
  | F | Kim | export | south store, handled by Raj |
  | G | Wes | view | north store, handled by Raj |
  | H | Kim | refund | north store, a small amount, handled by Raj |

  How many of the 8 are allowed? Exactly.
unit: requests
answer: 3
tolerance: { absolute: 0 }
given: { requests: 8 }
# B and D fail a permit's condition; G and H have no permit at all; E is
# permitted and then forbidden.
working: requests - 2 - 2 - 1
mistakes:
  - id: forbid-ignored
    value: 4
    working: requests - 2 - 2
    why: That counts request E. The refund permit does apply to it, but Ana handled that order, so the forbid applies too, and a forbid that applies always wins.
  - id: default-deny-forgotten
    value: 5
    working: requests - 2 - 1
    why: That counts G and H, which nothing forbids. Nothing permits them either (no permit covers warehouse staff, or finance refunding), and what no permit allows is denied.
explanation: |
  Go request by request, asking two questions: does some permit apply, and does any forbid?

  - A: support, own store: permitted, nothing forbids. **Allowed.**
  - B: another store, so the permit's condition fails. Denied.
  - C: own store and an amount of exactly the limit (`<=` includes it); Raj handled it. **Allowed.**
  - D: over the limit. Denied.
  - E: permitted, but Ana handled the order, so the forbid applies. Denied.
  - F: finance may export any order. **Allowed.**
  - G: no permit mentions the warehouse role. Denied by default.
  - H: finance has no refund permit. Denied by default.

  Three: A, C and F.
skills: [access-models]
