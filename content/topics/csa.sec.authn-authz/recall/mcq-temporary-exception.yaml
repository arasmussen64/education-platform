id: mcq-temporary-exception
type: mcq
rev: 1
prompt: |
  In a busy week a finance manager is given both "request payments" and "approve payments", temporarily, so that nothing waits. What is the risk worth naming before anyone agrees?
choices:
  - "One person can now move money alone, and temporary grants tend to stay"
  - "Payments will be approved more slowly, since one person is doing two jobs"
  - "The manager's MFA stops applying to approvals made under a temporary grant"
  - "The audit log can no longer record which person approved each payment"
answer: 0
explanation: |
  The two duties were in two people so that no one person could complete a payment alone. The exception removes exactly that, for the busiest week, when nobody has time to look. And "temporary" is a plan, not a control: unless the grant ends by itself on a date, it's still there next quarter.

  If it must happen, give it an end date that enforces itself, keep the rule that nobody approves a payment they requested, and have someone review that week's payments afterwards. The other three don't follow: MFA and the audit log work as before, and approvals get faster, which is the problem.
skills: [separation-of-duties]
