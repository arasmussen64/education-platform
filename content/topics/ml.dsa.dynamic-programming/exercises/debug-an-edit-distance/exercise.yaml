id: debug-an-edit-distance
stage: debug
rev: 1
title: "An edit distance that is too cheap"
prompt: |
  `edit_distance(a, b)` should print the distance for four pairs:

  ```
  'kitten' -> 'sitting' 3
  '' -> 'abc' 3
  'flaw' -> 'lawn' 2
  'same' -> 'same' 0
  ```

  It has two bugs. Run it: the empty string to `abc` costs 0 and kitten to sitting only 6, because the table's first row and column are never filled in: turning the first `i` characters into nothing costs `i` deletes, and nothing into the first `j` characters costs `j` inserts. Fix that, and `same` to `same` costs 4 and kitten to sitting 7: the diagonal step charges a substitution even when the two characters already match, and a match should cost nothing.
skills: [edit-distance]
