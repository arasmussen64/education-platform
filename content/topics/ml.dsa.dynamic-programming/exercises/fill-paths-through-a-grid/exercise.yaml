id: fill-paths-through-a-grid
stage: fill_in
rev: 1
title: "Paths through a grid"
prompt: |
  `paths(rows, cols)` counts the ways to walk along the lines of a grid `rows` squares tall and `cols` squares wide, from the top-left corner to the bottom-right, moving only right or down (a 2 by 2 grid has 6): the ways from a corner are the ways from the corner below it plus the ways from the corner to its right, and a corner on the bottom or right edge has one. Plain recursion repeats the same cells millions of times; replace each `...` so the answers are remembered in `memo`, and the program prints:

  ```
  6 184756 601080390
  ```

  The program fails until every `...` is replaced.
hints:
  - "The key for a cell is the pair `(rows, cols)`; check whether it is already in `memo` before computing."
  - "Return the stored answer, `memo[(rows, cols)]`, whether it was just computed or found."
skills: [memo]
