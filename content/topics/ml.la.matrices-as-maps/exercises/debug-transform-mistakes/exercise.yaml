id: debug-transform-mistakes
stage: debug
rev: 2
title: "The square that went wrong"
prompt: |
  `corners_after(M, corners)` should print each corner of the unit square after a 90-degree anticlockwise rotation:

  ```
  [0. 0.]
  [0. 1.]
  [-1.  1.]
  [-1.  0.]
  ```

  Instead each corner comes out as a 2-by-2 block of numbers. It has two bugs, and the second shows only once the first is fixed. Run it, fix what you find, and run it again.
hints:
  - "A matrix applied to a point gives a point: two numbers. Which operator does that, and which one multiplies entry by entry?"
  - "`M * corner` multiplies each row of `M` by `corner` entry by entry, which keeps `M`'s 2-by-2 shape. Applying a matrix to a point is `M @ corner`."
  - "Next the corners come out as `[ 0. -1.]`, `[ 1. -1.]` and so on. Sketch `[1, 0]` turned a quarter turn anticlockwise: where should it land, and where did it go?"
  - "The anticlockwise rotation matrix is `[[cos θ, -sin θ], [sin θ, cos θ]]`. Compare it with `rotation`, sign by sign."
skills: [apply, build]
