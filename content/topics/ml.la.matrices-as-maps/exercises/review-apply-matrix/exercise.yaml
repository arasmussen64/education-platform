title: "Apply the swap"
prompt: |
  `M` swaps the two coordinates of any vector. Write `apply(M, v)` that returns `M @ v`, and print it for `[3, 4]`:

  ```
  [4. 3.]
  ```

  Keep the starter's `M`: the checks use other vectors and another matrix.
skills: [apply]
