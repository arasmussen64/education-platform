id: parsons-center-the-columns
type: parsons
rev: 1
prompt: |
  Put the lines in order to subtract each column's mean from a `(4, 3)` matrix and print the column sums, `[0. 0. 0.]`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'X = np.arange(12, dtype=np.float64).reshape(4, 3)'
  - 'centered = X - X.mean(axis=0)'
  - 'print(centered.sum(axis=0))'
distractors:
  - 'centered = X - X.mean()'
explanation: |
  `X.mean(axis=0)` is a `(3,)` vector of column means, which broadcasting stretches down every row, so each column ends up summing to 0. The decoy subtracts the single grand mean from everything, which centres the matrix as a whole but leaves the columns off by their differences from it.
skills: [broadcasting]
