id: predict-stub-fails
type: predict_output
rev: 1
prompt: |
  The test is written; the function is still a stub. What does this program print? Two lines.
code: |
  def percent(correct, total):
      """Return correct out of total as a percentage."""
      return 0  # stub: not written yet


  def test_percent():
      assert percent(7, 10) == 70.0, "percent(7, 10) should be 70.0"
      print("percent: all checks passed")


  print("testing a stub")
  try:
      test_percent()
  except AssertionError as error:
      print("not yet:", error)
expected_output: |
  testing a stub
  not yet: percent(7, 10) should be 70.0
explanation: |
  The stub returns 0, so the assert fails and raises an `AssertionError` carrying its message; the `print` inside `test_percent` never runs. The `except` catches the error and prints the message. That failure is the point: it proves the test can fail, so a pass later means something.
skills: [test-first]
