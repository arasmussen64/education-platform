id: parsons-percent
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `70.0` and then `0.0`, following this spec: *`percent(correct, total)` returns `correct` out of `total` as a percentage, and 0.0 when `total` is 0.* Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'def percent(correct, total):'
  - '    if total == 0:'
  - '        return 0.0'
  - '    return 100 * correct / total'
  - 'print(percent(7, 10))'
  - 'print(percent(0, 0))'
distractors:
  - '    return correct / total'
explanation: |
  The spec names an edge case, a total of 0, so the function checks for it first and returns early; dividing by 0 would be an error. The general case comes after. `correct / total` alone would give 0.7, not a percentage. The prints follow the order of the output.
skills: [read-spec, decompose-plan]
