id: mcq-decompose
type: mcq
rev: 1
prompt: |
  A spec: *Read the scores from a file, drop the lowest one, average the rest, and print the letter grade.* Which plan follows the method?
choices:
  - 'One `main()` that does all four things, top to bottom'
  - '`read_scores(path)`, `drop_lowest(scores)`, `average(scores)` and `letter_grade(average)`, each returning a value, and a `main()` that calls them in turn and prints'
  - '`step1()`, `step2()`, `step3()` and `step4()`, each printing its result'
  - 'One function for each line the program prints'
answer: 1
explanation: |
  Split by job, not by step number or by line of output: each function is named for what it returns, takes what it needs and gives one result back, so it can be checked with an assert on its own. `main` composes them and does the printing. One big `main` works until something's wrong, and then there's nowhere to put an assert.
skills: [decompose-plan]
