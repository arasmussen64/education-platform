id: review-mcq-small-steps
type: mcq
rev: 1
prompt: |
  You've planned five functions for a spec, written them as stubs, and written the tests. What's the next move?
choices:
  - 'Write all five function bodies, then run the tests once at the end'
  - 'Write the first function''s body, run the tests, fix it until its asserts pass, then write the second'
  - 'Delete the tests until the program works, then put them back'
  - 'Write `main` first, so there''s something to run'
answer: 1
explanation: |
  Small steps: one function, run, fix, next. When a test fails after a few new lines, the bug is in those lines. After fifty new lines it could be anywhere. The stubs are what make this possible: the file runs from the start, and the tests for functions you haven't reached yet simply fail for now.
skills: [decompose-plan, test-first]
