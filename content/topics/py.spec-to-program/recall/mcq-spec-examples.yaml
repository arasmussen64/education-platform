id: mcq-spec-examples
type: mcq
rev: 1
prompt: |
  A spec says: *`clean_name(text)` returns the name with the spaces trimmed from both ends and the first letter of each word in capitals; an empty string stays empty.* Which example does the spec **not** settle, so you'd have to decide and write the decision down before coding?
choices:
  - '`clean_name("  ada lovelace ")` gives `"Ada Lovelace"`'
  - '`clean_name("")` gives `""`'
  - '`clean_name("BOB")`: is it `"Bob"` or `"BOB"`?'
  - '`clean_name("ada")` gives `"Ada"`'
answer: 2
explanation: |
  The spec says the first letter of each word is capitalized. It says nothing about the other letters, so `"BOB"` could stay `"BOB"` (only the first letter touched) or become `"Bob"` (the rest lowered). Both readings fit the words. That's a gap: pick one, write it as an example, and check with whoever wrote the spec. The other three follow directly from what the spec says.
skills: [read-spec]
