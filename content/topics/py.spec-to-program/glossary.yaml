- term: spec
  aliases: [specification]
  definition: A written description of what a program should do, usually from someone who won't write the code. The contract the code is checked against.
- term: stub
  definition: A function with its real name, parameters and docstring, whose body only returns a placeholder such as `0`. It lets the file run, and the tests fail, before the real body is written.
- term: scaffolding
  definition: Temporary code, such as a `print` inside a half-built function, that shows a value while you build. It comes out once the tests pass.
