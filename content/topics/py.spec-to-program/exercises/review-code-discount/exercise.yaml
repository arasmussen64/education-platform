id: review-code-discount
stage: review_code
rev: 1
title: "A discount, from its spec"
prompt: |
  Build this spec into a function: *`amount_to_pay(total)` applies a discount: 10% off a total of 100 or more, 5% off a total of 50 or more, nothing otherwise. The result is rounded to 2 decimal places.* From the spec, `amount_to_pay(120)` is `108.0`, `amount_to_pay(50)` is `47.5`, and `amount_to_pay(20)` is `20`. Read the boundaries off the words.
skills: [read-spec]
