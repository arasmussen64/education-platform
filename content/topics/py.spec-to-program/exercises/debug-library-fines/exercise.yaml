id: debug-library-fines
stage: debug
rev: 1
title: "Fines that don't match the spec"
prompt: |
  The spec is at the top of the file. Following it, the program should print:

  ```
  Days late: 1, fine: 0.00
  Days late: 10, fine: 1.75
  Days late: 40, fine: 5.00
  Days late: -1, fine: 0.00
  ```

  The code disagrees with the spec in three places: how many late days are free, what happens when the fine would go over the maximum, and what a book returned early or within the free days should cost. Work from the spec: for each sentence, find the line that implements it, and check them against each other.
skills: [read-spec, decompose-plan]
