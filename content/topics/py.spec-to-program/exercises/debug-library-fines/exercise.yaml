id: debug-library-fines
stage: debug
rev: 2
title: "Fines that don't match the spec"
prompt: |
  The spec is at the top of the file. Following it, the program should print:

  ```
  Days late: 1, fine: 0.00
  Days late: 10, fine: 1.75
  Days late: 40, fine: 5.00
  Days late: -1, fine: 0.00
  ```

  Instead all four fines come out wrong. The code disagrees with the spec in three places. Work from the spec: for each sentence, find the line that implements it, and check them against each other.
hints:
  - "Work out the fine for 10 days by hand from the spec: how many of those days are charged? Compare that with what `chargeable` becomes."
  - "The first three late days are free, so a book 10 days late is charged for 7 of them."
  - "For 40 days the spec gives 5.00, the maximum. What does the code do when the fine would go over it?"
  - "A book 1 day late, or returned early, has fewer late days than free ones, so `chargeable` goes below zero and so does the fine. When `chargeable` is negative, it should be 0."
skills: [read-spec, decompose-plan]
