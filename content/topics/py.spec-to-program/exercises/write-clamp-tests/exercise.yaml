id: write-clamp-tests
stage: write
rev: 1
title: "Tests first, then clamp"
prompt: |
  A spec: *`clamp(n, low, high)` returns `n`, except that a value below `low` becomes `low` and a value above `high` becomes `high`.*

  Write the test first: `test_clamp()` with at least four asserts covering a value inside the range, one below, one above, and one exactly on a boundary, ending with `print("clamp: all checks passed")`. Then write `clamp` itself. From the spec: `clamp(5, 0, 10)` is `5`, `clamp(-3, 0, 10)` is `0`, `clamp(42, 0, 10)` is `10`, and `clamp(10, 0, 10)` is `10`.
hints:
  - "Write `clamp` as a stub (`return n`) first and run `test_clamp()`: it should fail on the below and above cases. Then fix the body."
  - "`if n < low: return low`, `if n > high: return high`, otherwise `return n`."
skills: [test-first, read-spec]
