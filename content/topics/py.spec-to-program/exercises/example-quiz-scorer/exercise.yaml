id: example-quiz-scorer
stage: worked_example
rev: 1
title: "A spec, walked through"
prompt: |
  A quiz-scoring program, built the way the lesson describes, with its spec and examples kept at the top of the file. Press **Run**, then read it in the order it was written: spec, examples, plan, tests, bodies, `main`.
steps:
  - label: "The spec, then its examples"
    lines: "1-11"
    note: "Three sentences of spec become six concrete cases, including the two the sentences only hint at (missing answers, extra answers), the boundary at 60%, and one gap the spec left open, with the decision written down."
  - label: "The plan: small functions that return"
    lines: "14-35"
    note: "Three functions, each named for what it returns and each doing one job: a count, a percentage, a word. They were stubs first (`return 0`, `return \"\"`) so the file ran before any real body existed."
  - label: "Compose them"
    lines: "38-42"
    note: "`summary` calls the three in turn and returns the report lines. Returning them, rather than printing, is what lets the last assert below check a whole report."
  - label: "Tests from the examples"
    lines: "45-55"
    note: "One assert per example from the top of the file, including the gap decision and the boundary. Against the stubs, these all failed, which proved they could."
  - label: "main, last"
    lines: "58-66"
    note: "Only `main` prints. The tests run first under the guard, so a broken function shows up before any report does."
