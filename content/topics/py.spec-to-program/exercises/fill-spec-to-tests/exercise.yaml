id: fill-spec-to-tests
stage: fill_in
rev: 1
title: "Spec to tests to code"
prompt: |
  Here's a spec, and a program built from it with four gaps: two in the code and two in the tests.

  > Shipping costs 5.00 for a parcel up to and including 1 kg. Every kilogram, or part of a kilogram, over that costs 2.00 more.

  Work the examples out from the spec, not from the code. Replace each `...`: the boundary and the per-kilogram charge in `shipping`, and the two expected values in `test_shipping`. Running the program should print:

  ```
  shipping: all checks passed
  2.5 kg: 9.00
  ```
hints:
  - "\"Up to and including 1 kg\" is `weight <= 1`, and each started kilogram over that adds `2.0`."
  - "1.2 kg is one part-kilogram over 1, so it costs 5.00 + 2.00 = `7.0`; 3 kg is two whole kilograms over, so `9.0`."
skills: [read-spec, test-first]
