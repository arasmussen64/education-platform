id: build-parking-fees
stage: build
rev: 1
title: "Car park fees"
prompt: |
  Starting from a blank editor, build this spec into a program the way the lesson says: examples first, then a plan, then tests, then the code in small steps.

  > **Car park fees.** The first hour, or any part of it, costs 2.00. Each further hour, or part of one, costs 1.50 more, but a day's parking never costs more than 12.00. A stay of 0 minutes costs nothing. Given a list of stays in minutes, print one line per stay like `90 min: 3.50`, then `Total: 21.00`, always with two decimal places.

  Use these names, so the checks can find them, each with a docstring:

  - `hours_started(minutes)` returns how many hours have been started: 0 for 0 minutes, 1 for 1 to 60, 2 for 61 to 120, and so on. `math.ceil` helps.
  - `fee(minutes)` returns the cost as a number, following the spec.
  - `report_lines(stays)` returns the lines for a list of stays, the total last, and leaves the list unchanged.
  - `test_parking()` has at least four asserts covering the boundaries you found in the spec (think about 60 and 61 minutes, 0 minutes, and the daily maximum), and ends with `print("parking: all checks passed")`.
  - `main()` prints each line of `report_lines(STAYS)`, with `STAYS = [30, 90, 61, 600, 0]` at the top of the file.

  Finish with `if __name__ == "__main__":`, calling `test_parking()` and then `main()`. Running the program should print:

  ```
  parking: all checks passed
  30 min: 2.00
  90 min: 3.50
  61 min: 3.50
  600 min: 12.00
  0 min: 0.00
  Total: 21.00
  ```
skills: [read-spec, decompose-plan, test-first]
