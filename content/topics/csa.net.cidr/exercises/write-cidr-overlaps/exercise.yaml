id: write-cidr-overlaps
stage: write
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Write cidr-overlaps"
prompt: |
  Before anyone builds a network, someone checks the address plan for overlaps. Write that check: a script, `~/bin/cidr-overlaps PLAN`, from a blank file.

  PLAN has one network a line, a name and then its block (`hq 10.0.0.0/16`); blank lines and lines that start with `#` are skipped. A block may be written with host bits set, as engineers often do: `10.4.3.9/22` means the /22 that address is in. The script prints every pair of blocks that overlap, one pair a line, as `NAME1 NAME2` with the name listed first in the plan first, and the pairs in order: by their first name's line in the plan, then by their second's. Nothing else.

  The rule from the lesson: two blocks overlap exactly when they agree on the first k bits, where k is the shorter of their two prefix lengths. In bash, with each address as a number from `ip2int`, that is `(( x >> (32 - k) == y >> (32 - k) ))`.

  Three pieces of bash are new here. A bash **array** holds a list: `names=()` makes an empty one, `names+=("$name")` adds to its end, `${names[i]}` reads the one at position `i` (counting from 0), and `${#names[@]}` is how many it holds; inside `(( ))` and `$(( ))` you can write `lens[i]` with no `$`. `for (( i = 0; i < n; i++ )); do ... done` counts `i` from 0 up to `n - 1`, and a second loop inside it, `for (( j = i + 1; j < n; j++ ))`, visits every later block once. And `$(( a < b ? a : b ))` is the smaller of `a` and `b`. Read the plan with `while read -r name block; do ... done < "$1"`, as in Module 1's scripting topic; then `${block%/*}` is the part of the block before the `/` and `${block#*/}` the part after, as in the fill-in's script.

  Create the file with `nano ~/bin/cidr-overlaps`: start it with `#!/bin/bash`, copy in `ip2int` from the worked example, and make it executable with `chmod +x ~/bin/cidr-overlaps`. A sample plan is in `~/plans/sites.txt`: `~/bin/cidr-overlaps ~/plans/sites.txt` should print three pairs. Run `shellcheck ~/bin/cidr-overlaps` (it should say nothing). Then run the checks: they run your script on plans they make themselves, with every kind of pair the rule must get right, and on a plan of 60 blocks, which it must answer within 10 seconds.
hints:
  - "Read the plan into three arrays, one entry per line: the names, each address as a number (`addrs+=(\"$(ip2int \"${block%/*}\")\")`), and each prefix length (`lens+=(\"${block#*/}\")`). `${block%/*}` is the part before the `/`, `${block#*/}` the part after. `case $name in '' | \\#*) continue ;; esac` skips blank lines and comments."
  - "For each pair, `k=$(( lens[i] < lens[j] ? lens[i] : lens[j] ))` is the shorter prefix. Shifting right by `32 - k` throws away the host bits of both, whatever was written there, so writing a block with host bits doesn't matter."
  - "`j` starts at `i + 1`, so each pair is visited once, with the earlier name first, and the pairs come out in the order the prompt asks for. Two blocks side by side (one ends at .127, the next starts at .128) differ in the bit just before their host bits, so the test says no, as it should."
skills: [overlaps, binary-and-masks]
