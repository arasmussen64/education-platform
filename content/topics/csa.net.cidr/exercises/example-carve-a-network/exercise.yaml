id: example-carve-a-network
stage: worked_example
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Carve a network"
prompt: |
  If this is your first network lab, read the note at the top of Layers and packets' worked example, `example-follow-a-request`, first: it shows how a lab's machines, `on` and `netlab show` work.

  This lab has three machines. r1 is a router with three networks, each a switch of its own: `lana` (r1 is 10.20.1.1/24, the host h1 is 10.20.1.10), `lanb` (r1 is 10.20.2.1/24, the host h2 is 10.20.2.10) and `lanc`, which has no address yet. The walkthrough does the topic's arithmetic twice: first in bash, on the lab machine, where you build two small functions you'll use again; then live, on r1 and h1, where you watch the kernel act on a wrong prefix and on a block that doesn't start where a block must. Type each line yourself and read what it prints before you type the next. Nothing you change on the machines lasts: the last steps put everything back.
steps:
  - label: "Binary, read by bash"
    lines: "1"
    note: "`$(( ))` is bash arithmetic, which you met with `umask` in Module 1. `2#11110000` means \"these digits are base 2\": the place values 128, 64, 32 and 16 are on, so it prints 240. `printf '%d\\n' 0xF0` reads the same eight bits written in hex (F is 1111, 0 is 0000) and prints 240 again. 240 is the third number of a /20's mask, 255.255.240.0: eight 1 bits, eight more, four more, then twelve 0 bits."
  - label: "Two functions to keep"
    lines: "2-10"
    note: "`cat > FILE << 'EOF'` writes the lines up to `EOF` into the file; in your own work, `nano ~/bin/cidr-lib.sh` does the same. `ip2int` splits an address at its dots (`IFS=.` makes the dot the separator for `read`) and puts each octet in its place: `<< 24` shifts the first octet 24 bits left, which multiplies it by 16,777,216, and `|` (OR) lays the four side by side in one 32-bit number. `int2ip` does the reverse: `>> 24` shifts right, `& 255` keeps the lowest eight bits. The `.` on the last line loads the file into this shell, so both functions exist from now on (a new shell needs it again)."
  - label: "An address's block, by number"
    lines: "11-15"
    note: "10.20.30.77 is the number 169090637. The mask of a /27 is 27 ones followed by 5 zeros: `0xFFFFFFFF` is 32 ones, `<< (32 - 27)` pushes 5 zeros in at the right, and `& 0xFFFFFFFF` cuts it back to 32 bits (bash's numbers are 64 bits wide). Printed as an address it is 255.255.255.224. AND with the mask clears the host bits, which gives the block's first address, 10.20.30.64. OR with the flipped mask (the wildcard) sets them all, which gives its last, 10.20.30.95. `ipcalc -b` (`-b`: no binary columns) agrees: Network 10.20.30.64/27, Broadcast 10.20.30.95, and 30 hosts, the classic count of 32 minus 2. Ignore its \"Class A\": classes are history."
  - label: "A plan by loop"
    lines: "16-17"
    note: "Three zones of a /20 each. A /20 holds 4,096 addresses, which is 16 /24s, so each zone's third number goes up by 16: 0, 16, 32. Every one starts on a multiple of 16, so each is the start of a real /20 (aligned). `tee` prints what it writes and saves it to `~/example/plan.txt`. The second loop carves zone 0's first four /24s: 10.20.0.0 to 10.20.3.0, which together are one /22, a quarter of the zone."
  - label: "A wrong prefix, live"
    lines: "18-23"
    note: "First h1 reaches h2 through r1 (`ttl=63`: one router on the way). Then h1 is given 10.20.1.10/16 and its /24 is taken away. `ip route` now says `10.20.0.0/16 dev eth0`: to h1, every 10.20.x.x address is on its own switch. So h1 no longer sends to h2 through r1; it asks ARP for 10.20.2.10 on lana, where nobody has that address, and the ping gets nothing. `ip neigh` shows the evidence, saved to `~/example/neigh.txt`: `10.20.2.10 ... INCOMPLETE` (still asking; a few seconds later it says FAILED). A prefix that's too short never shows an error. It shows as machines on other networks going silent."
  - label: "Put it back"
    lines: "24-26"
    note: "`sudo netlab restart` builds the network again from its files, as a reboot would, so h1 is back on its /24 and the change typed by hand is gone. The ping works, and `ip neigh` now lists only the router, 10.20.1.1: h1 sends to h2 through its gateway again, as a host should for another network."
  - label: "A block that doesn't start where a block must"
    lines: "27-30"
    note: "A /23 holds 512 addresses, two /24s, so a /23 must start on an even third number. 10.20.3.1/23 doesn't, and Linux says nothing: it quietly works out the block the address is in, 10.20.2.0/23, which takes in lanb's 10.20.2.0/24 too. r1 now has two routes covering 10.20.2.x, on two different switches, saved to `~/example/moved.txt`. `ipcalc -b` shows the same Network, 10.20.2.0/23. The last line takes the address away again. Check every block's start before you type it: `ipcalc -b` shows its real Network."
