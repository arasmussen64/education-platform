# The checks for "Finish cidr-info": the script is still a script, and it
# answers twelve inputs that cidr-truth (/usr/local/lib/lab-checks) makes
# at check time, with random numbers, and works out with Python's
# ipaddress module.
checks:
  - id: still-a-script
    description: "~/bin/cidr-info still starts with its #!/bin/bash line and is executable."
    command: |
      f=/home/learner/bin/cidr-info
      [ -x "$f" ] || { echo "~/bin/cidr-info isn't executable"; exit 0; }
      [ "$(head -n 1 "$f")" = "#!/bin/bash" ] || { echo "the first line isn't #!/bin/bash"; exit 0; }
      echo script
    expect:
      equals: script
  - id: answers
    description: "For twelve addresses the check picks, with no cloud and with each cloud, at sizes from /16 to /29, cidr-info prints the right five lines."
    command: /usr/local/lib/lab-checks/cidr-truth
    expect:
      equals: right
