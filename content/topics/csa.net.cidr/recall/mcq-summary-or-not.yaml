id: mcq-summary-or-not
type: mcq
rev: 1
prompt: |
  Which pair of blocks can be advertised as one route that covers the two of them and nothing else?
choices:
  - "`10.4.10.0/23` and `10.4.12.0/23`"
  - "`10.4.8.0/24` and `10.4.10.0/24`"
  - "`10.4.8.0/23` and `10.4.10.0/23`"
  - "`10.4.9.0/24` and `10.4.10.0/24`"
answer: 2
explanation: |
  Two blocks summarise cleanly when together they fill one aligned block. `10.4.8.0/23` (8 and 9) and `10.4.10.0/23` (10 and 11) are the two halves of `10.4.8.0/22`, which starts on a multiple of 4: one route, 10.4.8.0/22, covers exactly them. `10.4.10.0/23` and `10.4.12.0/23` sit side by side but across a /22 boundary (10 to 13), so the smallest single route over both is a /21 that takes in 8, 9, 14 and 15 too. `10.4.8.0/24` and `10.4.10.0/24` leave 10.4.9.0 out between them. And `10.4.9.0/24` and `10.4.10.0/24` are side by side, but no /23 starts at 9.
skills: [split-and-summarise]
