id: mcq-not-private
type: mcq
rev: 1
prompt: |
  Which block is not in the RFC 1918 private ranges?
choices:
  - "`172.31.0.0/16`"
  - "`10.255.0.0/16`"
  - "`192.168.200.0/24`"
  - "`172.32.0.0/16`"
answer: 3
explanation: |
  The three private ranges are 10.0.0.0/8 (everything starting 10), 172.16.0.0/12 and 192.168.0.0/16. The middle one is the trap: a /12 holds sixteen /16s, so it runs from 172.16 to 172.31, and `172.32.0.0/16` is ordinary public address space, owned by someone. `172.31.0.0/16` is the last /16 inside it (AWS's default VPC uses it), `10.255.0.0/16` is inside 10/8, and `192.168.200.0/24` inside 192.168/16.
skills: [private-and-reserved]
