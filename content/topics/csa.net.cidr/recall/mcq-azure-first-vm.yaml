id: mcq-azure-first-vm
type: mcq
rev: 1
prompt: |
  In an Azure subnet, 10.0.1.0/24, what is the first address a VM can be given?
choices:
  - "`10.0.1.1`"
  - "`10.0.1.2`"
  - "`10.0.1.4`"
  - "`10.0.1.5`"
answer: 2
explanation: |
  Azure keeps the first four addresses of every subnet and the last: `.0` is the network address, `.1` the default gateway, `.2` and `.3` map Azure's DNS into the network, and `.255` is the last. So the first VM gets `10.0.1.4`. Five are kept, but four of them come first, so the first usable address is the fifth address, `.4`, not `.5`. AWS is the same (`.1` its router, `.2` DNS, `.3` future use); Google Cloud keeps only `.0` and `.1` at the start, so its first VM gets `.2`.
skills: [private-and-reserved]
