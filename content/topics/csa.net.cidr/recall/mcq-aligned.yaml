id: mcq-aligned
type: mcq
rev: 1
prompt: |
  A block must start on a multiple of its own size. Which of these is written at the start of its block?
choices:
  - "`10.6.10.0/22`"
  - "`10.6.5.0/23`"
  - "`10.6.8.0/22`"
  - "`10.6.4.128/24`"
answer: 2
explanation: |
  A /22 holds four /24s, so it starts on a multiple of 4 in the third number: 8 is one, so `10.6.8.0/22` (10.6.8.0 to 10.6.11.255) is a real block, written at its start. 10 isn't a multiple of 4, so `10.6.10.0/22` is really `10.6.8.0/22` with host bits set. A /23 holds two /24s and starts on an even number, so `10.6.5.0/23` is really `10.6.4.0/23`; Linux, given that address, quietly uses the real block. And a /24 starts at `.0` in the last number, so `10.6.4.128/24` is really `10.6.4.0/24`. `ipcalc -b` shows each one's real Network.
skills: [block-math]
