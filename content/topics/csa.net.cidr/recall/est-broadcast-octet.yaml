id: est-broadcast-octet
type: estimate
rev: 1
prompt: |
  A server's address is 172.16.5.200/29. What is the last number of the last address in its block? Exactly.
unit: the last number
answer: 207
tolerance: { absolute: 0 }
given: { last: 200, p: 29 }
# Blocks of 8: the block starts at the multiple of 8 at or below 200, which
# is 200 itself, and ends 7 later.
working: floor(last / 2 ** (32 - p)) * 2 ** (32 - p) + 2 ** (32 - p) - 1
mistakes:
  - id: next-start
    value: 208
    working: floor(last / 2 ** (32 - p)) * 2 ** (32 - p) + 2 ** (32 - p)
    why: That's the next block's first address. A block of 8 from 200 holds 200 to 207.
  - id: last-usable
    value: 206
    working: floor(last / 2 ** (32 - p)) * 2 ** (32 - p) + 2 ** (32 - p) - 2
    why: That's the last address a machine could be given in the classic count; the block's last address is one more.
explanation: |
  A /29 holds 2³ = 8 addresses, so blocks start on multiples of 8. 200 is a multiple of 8 (25 × 8), so the server's address happens to be its block's first, and the block runs from 200 to 207. Its last address is 172.16.5.207.
skills: [block-math]
