id: est-vpc-usable
type: estimate
rev: 1
prompt: |
  An AWS VPC of /16 is split entirely into /20 subnets. How many addresses can instances use across all of them? Exactly.
unit: addresses
answer: 65456
tolerance: { absolute: 0 }
given: { vpc: 16, sub: 20 }
# 2 ** (sub - vpc) = 16 subnets, each 2 ** (32 - sub) = 4,096 addresses with
# AWS's 5 kept back in every one.
working: 2 ** (sub - vpc) * (2 ** (32 - sub) - 5)
mistakes:
  - id: all-of-them
    value: 65536
    working: 2 ** (32 - vpc)
    why: That's every address in the VPC. AWS keeps 5 of every subnet, and there are 16 subnets.
  - id: five-once
    value: 65531
    working: 2 ** (32 - vpc) - 5
    why: That keeps 5 back once, for the whole VPC. AWS keeps 5 in every subnet, so 16 subnets lose 80.
  - id: classic-two
    value: 65504
    working: 2 ** (sub - vpc) * (2 ** (32 - sub) - 2)
    why: That keeps back 2 per subnet, the classic count. AWS keeps 5.
explanation: |
  A /16 holds 2⁴ = 16 /20s, each of 4,096 addresses. AWS keeps 5 of every subnet, so each gives 4,091 and the VPC 16 × 4,091 = 65,456: 80 fewer than its 65,536. More, smaller subnets lose more: split into /24s, the same VPC would lose 256 × 5 = 1,280. AWS's default VPC is built from the same sizes: 172.31.0.0/16, with a /20 default subnet in each zone of its region.
skills: [split-and-summarise, block-math]
