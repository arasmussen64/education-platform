id: csa.net.cidr
kind: topic
status: ready
title: IPv4 and CIDR
summary: "Read an IPv4 address as 32 bits and a prefix length as a mask; work out any block's first and last address and size on sight; split a block into subnets of different sizes and summarise them again; tell whether two blocks overlap, and check a whole plan for it with a script of your own; and choose ranges by RFC 1918 and each cloud's rules."
# Module 3's topics gate on Checkpoint 1 through each other (the Module 3
# plan, docs/plans/cloud-module-3/MODULE-3-BRIEF.md, section 2): this one
# through Layers and packets, whose ARP, ICMP and network-lab onboarding the
# labs use. What it builds on, for the writer: csa.linux.net-tools (ip addr,
# ip route, ip neigh; /24 used there without being explained),
# csa.linux.permissions (perm-umask's $((0666 & ~0022)), a mask taking bits
# away), csa.linux.boot (the metadata address 169.254.169.254),
# csa.linux.scripting (while read, if, ShellCheck; arrays are new here).
prerequisites: [csa.net.layers]
estimated_minutes: 295
rev: 1
objectives:
  - "Read and write an IPv4 address as bits and a prefix length as a dotted mask, and say what an address and prefix means: which block, its first and last address, how many addresses, and how many a cloud lets you use."
  - "Do block arithmetic on sight: block sizes as powers of two, the block an address is in by the interesting octet, how many /x fit in a /y, and when blocks summarise into one prefix."
  - "Split a block into subnets of different sizes (variable-length masks), biggest first so each starts on a multiple of its size, with room to grow, and summarise blocks into the smallest block that covers them, knowing what extra space it pulls in."
  - "Decide on sight whether two blocks overlap, say why an overlap breaks peering, VPNs and routing, and check a whole plan for overlaps with a bash script of your own."
  - "Use the RFC 1918 private ranges and the other special ranges correctly, and plan within each cloud's rules: the addresses AWS, Azure and Google Cloud keep back in every subnet, their size limits, and the ranges to avoid."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - AWS subnets /28 to /16; the first four addresses and the last reserved
#   (network, VPC router, DNS at base plus two, future use, broadcast: "We
#   do not support broadcast in a VPC"); a CIDR given with host bits is put
#   in canonical form (100.68.0.18/18 becomes 100.68.0.0/18):
#   docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html
# - AWS VPC blocks /16 to /28; RFC 1918 recommended; can't use 0.0.0.0/8,
#   127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4; "Some AWS services use the
#   172.17.0.0/16 CIDR range ... AWS Cloud9 and Amazon SageMaker AI";
#   VPCs on one Direct Connect gateway must not have overlapping blocks:
#   docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html
# - AWS: "You cannot create a VPC peering connection between VPCs that have
#   matching or overlapping IPv4 or IPv6 CIDR blocks":
#   docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
# - AWS's default VPC is 172.31.0.0/16 with a /20 default subnet in each
#   Availability Zone:
#   docs.aws.amazon.com/vpc/latest/userguide/default-vpc-components.html
# - Azure (FAQ dated 2026-07-08): RFC 1918 recommended and 100.64.0.0/10
#   "treated as a private IP address space"; can't add 224.0.0.0/4,
#   255.255.255.255/32, 127.0.0.0/8, 169.254.0.0/16, 168.63.129.16/32;
#   five reserved per subnet (network, .1 gateway, .2 and .3 for Azure DNS,
#   broadcast); smallest IPv4 subnet /29, largest /2; subnets can't
#   overlap; "You can't enable virtual network peering if address spaces
#   overlap": learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
# - Google Cloud (last updated 2026-10-26): four unusable addresses in a
#   subnet's primary range (network, default gateway, second-to-last
#   "reserved by Google Cloud for potential future use", broadcast); the
#   minimum range is eight addresses, the shortest mask /4, with the advice
#   to stay at /8; valid ranges include RFC 1918, 100.64.0.0/10, the
#   documentation ranges, 198.18.0.0/15, 240.0.0.0/4; prohibited 0.0.0.0/8,
#   127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4, 255.255.255.255/32 and
#   Google's own; subnets are regional: docs.cloud.google.com/vpc/docs/subnets
# - Google Cloud peering: "No subnet IP range can exactly match, contain,
#   or fit within another subnet IP range in a peered VPC network":
#   docs.cloud.google.com/vpc/docs/vpc-peering
# - RFC 1918 (February 1996, BCP 5): the three private blocks. RFC 4632
#   (August 2006, BCP 122) obsoletes RFC 1519 (September 1993), CIDR's
#   first specification. RFC 6598 (April 2012): 100.64.0.0/10, Shared
#   Address Space for carrier-grade NAT; using it otherwise risks
#   "problems". RFC 5737 (January 2010): the three documentation ranges.
#   RFC 3927, section 7: "A router MUST NOT forward a packet with an IPv4
#   Link-Local source or destination address" (2.7 says the same of
#   every network device). All at rfc-editor.org.
# - Captured on 2026-11-12 in the network-lab base (Ubuntu 24.04): ipcalc
#   0.51 and sipcalc 1.1.6 output for 10.20.30.77/27 and 10.20.3.1/23;
#   Linux given 10.20.3.1/23 makes the connected route 10.20.2.0/23; a host
#   given a /16 asks ARP for a host on another network and gets no answer
#   (INCOMPLETE, then FAILED). Every predict_shell output was run in Git
#   Bash (bash 5.3.9) and in the base's bash 5.2.21 with mawk 1.3.4, with
#   the same result.
#
