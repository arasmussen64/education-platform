skills:
  - id: binary-and-masks
    description: "An octet in binary and back; a prefix length as a dotted mask and back; the wildcard; AND with the mask gives a block's first address and OR with the wildcard its last; an address as one 32-bit number in bash's `$(( ))` with `<<`, `>>`, `&` and `|`"
  - id: block-math
    description: "A block's size, 2 to the power of its host bits; the block an address is in, by the interesting octet; blocks start on a multiple of their size; usable addresses classically and in each cloud (AWS and Azure keep 5, Google Cloud 4); the smallest prefix that holds a number of machines"
  - id: split-and-summarise
    description: "How many /x fit in a /y; carving a block into subnets of different sizes, biggest first and aligned, with room to grow; summarising aligned, contiguous blocks into one prefix; the smallest block covering a set of blocks and the extra space it takes in"
  - id: overlaps
    description: "Two blocks overlap exactly when they agree on the shorter prefix's bits; spotting it on sight; why overlaps break peering, VPNs and routing; finding every overlap in a plan with a script"
  - id: private-and-reserved
    description: "RFC 1918's three ranges and their edges; shared address space, link-local, loopback, multicast and the documentation ranges; each cloud's reserved addresses, subnet size limits and refused ranges; the ranges to avoid"
