id: mcq-nice-values
type: mcq
rev: 1
prompt: |
  A nightly backup slows the web server while it runs. You start it with `nice -n 19 ./backup.sh`. What changes?
choices:
  - "The backup is limited to 5% of the CPU at all times"
  - "When the backup and the web server compete for CPU, the web server gets almost all of it; when the CPU is otherwise idle, the backup still runs at full speed"
  - "The backup runs only at night"
  - "The backup gets a higher priority: 19 is the maximum"
answer: 1
explanation: |
  Nice 19 is the *lowest* priority (-20 is the highest). It shrinks the backup's share under contention, which is exactly the goal, without wasting an idle CPU when the web server has nothing to do. It's not a cap: for a hard limit you'd use a cgroup quota (`systemd-run -p CPUQuota=20% ./backup.sh`). And if the slowdown is really disk contention rather than CPU, `ionice` is the matching tool.
skills: [scheduler]
