id: mcq-weight-vs-quota
type: mcq
rev: 2
prompt: |
  A service's cgroup has `cpu.weight` 1000 and `cpu.max` `100000 100000`, on an otherwise idle 8-CPU server. How much CPU can it use?
choices:
  - "All eight CPUs: nothing else is competing, and a quota is only enforced under contention"
  - "All eight CPUs: a weight of 1000 is ten times the default, which outranks a one-CPU quota"
  - "An eighth of a CPU: the quota of 100,000 µs is shared out across the server's eight CPUs"
  - "One CPU: the quota is a hard cap, and the weight only matters when groups compete"
answer: 3
explanation: |
  The quota is absolute: 100,000 µs of CPU time per 100,000 µs period is one CPU's worth, no matter how much is free. It is a total across the CPUs, not divided among them, and it is enforced on an idle machine exactly as on a busy one.

  Weight is the one that needs contention: it is a share for dividing CPU when groups compete, and on an idle machine it changes nothing. It never outranks a quota. So this service can never exceed one CPU, and its high weight will only help if other groups fight it for that one. Mixing the two up is the most common misreading of container CPU settings.
skills: [cgroups-v2, throttling]
