id: mcq-k8s-cpu-limits
type: mcq
rev: 2
prompt: |
  A Kubernetes pod sets `requests.cpu: 250m` and `limits.cpu: 500m`. What does each become on the node?
choices:
  - "The request becomes the cgroup's `cpu.max`, a hard quota; the limit becomes `cpu.weight`, a share"
  - "Both go into `cpu.max`: the request as the quota, a quarter of a CPU, and the limit as the period"
  - "Neither reaches the cgroup: the scheduler uses both only to pick a node with enough spare CPU"
  - "The request becomes the cgroup's `cpu.weight`, a share; the limit becomes `cpu.max`, a hard quota"
answer: 3
explanation: |
  The request does two jobs: the scheduler only places the pod on a node with that much CPU unreserved, and the kubelet (Kubernetes' agent on the node) turns it into a weight, so the container gets its share when the node is contended. A request is never a cap: on a quiet node the container may use more.

  The limit is the cap. It becomes `cpu.max` `50000 100000`: 50 ms of CPU in every 100 ms period, half a CPU, enforced whether the node is busy or not, which is what can throttle the container. The two numbers in `cpu.max` are that quota and its period, not the request and the limit. That's why many teams set CPU requests on everything and CPU limits only where a runaway process must be contained: a limit buys predictability at the price of throttling.
skills: [throttling, cgroups-v2]
