id: est-cpu-max-to-cpus
type: estimate
rev: 1
prompt: |
  A container's `cpu.max` reads `150000 100000`. Docker wrote that from the `--cpus=` flag the container was started with. What number did the flag carry? Exactly.
unit: CPUs
answer: 1.5
tolerance: { absolute: 0 }
given: { quota: 150000, period: 100000 }
# Checked with Docker, 2026-11-15: --cpus=1.5 gives cpu.max "150000 100000".
working: quota / period
mistakes:
  - id: as-a-percentage
    value: 150
    working: quota / period * 100
    why: "That's the quota as a percentage of one CPU, the number systemd's `CPUQuota=` takes. Docker's `--cpus=` counts whole CPUs, so it's 1.5."
  - id: upside-down
    value: 0.67
    working: period / quota
    why: "That divides the period by the quota. The quota comes first in the file: 150,000 µs of CPU time in every 100,000 µs period is 1.5 CPUs."
explanation: |
  The first number is the CPU time the group may use in each period, the second is the period: 150,000 ÷ 100,000 = 1.5, so the container was started with `--cpus=1.5`. Its threads can keep one CPU fully busy and half of another, however many CPUs the host has. The same file under a systemd service would come from `CPUQuota=150%`.
skills: [cgroups-v2]
