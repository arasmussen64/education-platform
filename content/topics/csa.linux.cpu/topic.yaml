id: csa.linux.cpu
kind: topic
status: draft
title: "CPU scheduling and cgroups"
summary: "How Linux shares the CPUs: the fair scheduler and nice values, load average and what it really counts, steal time in a VM, cgroups v2 weights and quotas, and how to find and fix a container that's being throttled."
prerequisites: [csa.linux.processes]
estimated_minutes: 90
rev: 1
objectives:
  - "Explain how the Completely Fair Scheduler shares CPU time, what nice values do, and read `top`'s CPU line (`us`, `sy`, `id`, `wa`, `st`)."
  - "Read a load average against the number of CPUs, and recognise steal time as a virtual machine's host taking the CPU away."
  - "Read and set cgroups v2 CPU controls: `cpu.weight` (a share under contention) and `cpu.max` (a hard quota per period), and know how systemd and containers use them."
  - "Find CPU throttling in a container with `cpu.stat`, explain why it shows up as latency while utilisation looks low, and fix it."
