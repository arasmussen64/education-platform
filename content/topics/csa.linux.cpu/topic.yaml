prove:
  explain:
    prompt: |
      A service in a container responds slowly in bursts although the node's CPU graph sits around 30%, and a colleague wants to "give it a higher priority". Explain, in your own words: how Linux shares CPU time between runnable processes and what nice values change; how you'd read the node's load average and steal time to rule the machine in or out; what a cgroup's CPU weight and CPU quota each do, and how a Kubernetes CPU limit becomes one of them; and how you'd confirm the container is being throttled and what you'd change.
    rubric:
      - id: cfs
        required: true
        description: "CFS gives every runnable task a fair share of CPU time, weighted by nice (-20 highest to 19 lowest); nice changes the share under contention, not a hard cap, and an idle CPU goes to whoever is runnable."
      - id: load-steal
        required: true
        description: "Load average counts runnable tasks plus those in uninterruptible (disk) wait, averaged over 1, 5 and 15 minutes, read against the CPU count; steal time (st) is CPU the hypervisor gave to another VM, a sign of a noisy neighbour or exhausted burst credits."
      - id: weight-vs-quota
        required: true
        description: "cpu.weight (shares) decides how CPU is split only when groups compete; cpu.max is a hard quota of microseconds per period (e.g. 50000 100000 = half a CPU) enforced even when the machine is idle; a Kubernetes CPU limit sets cpu.max, a request sets cpu.weight."
      - id: throttling
        required: true
        description: "cpu.stat's nr_throttled and throttled_usec show the group being stopped for the rest of a period after using its quota; a bursty service hits the quota in a few milliseconds and then waits, so latency rises while average utilisation looks low; raise or remove the CPU limit, keep the request, or spread the work."
      - id: priority
        required: false
        description: "A higher priority (lower nice or higher weight) only helps when CPUs are contended; it does nothing against a quota, which is the usual cause in containers."
    model_answer: |
      Linux's scheduler, CFS, keeps a list of the tasks that are ready to run and gives each a fair slice of CPU time, weighted by its nice value: nice runs from -20, the biggest share, to 19, the smallest, and the default is 0. Nice only matters when tasks compete for a CPU; an idle CPU goes to whoever wants it, so "a higher priority" changes nothing unless the machine is busy. To know whether it is, I'd read the load average from uptime against the number of CPUs: it counts tasks that are runnable or stuck in uninterruptible disk wait, averaged over one, five and fifteen minutes, so 8 on a 4-CPU machine means two tasks waiting per CPU and 2 on 16 CPUs means mostly idle. In top's CPU line I'd look at st, steal time, which is time the hypervisor gave our virtual CPU to another tenant; if that's high the node itself is the problem, a noisy neighbour or a burstable instance out of credits. Then the container. Its processes live in a cgroup with two CPU controls. cpu.weight is a share: when groups compete, CPU is divided in proportion to their weights, and it has no effect when there's spare CPU. cpu.max is a quota: two numbers, how many microseconds of CPU the group may use in each period, so 50000 100000 means half a CPU, and it's enforced even on an idle machine. A Kubernetes CPU request sets the weight; a CPU limit sets the quota, with 500m becoming 50000 100000. To confirm throttling I'd read the group's cpu.stat: nr_throttled is how many periods the group was stopped in, and throttled_usec how long it spent stopped. A bursty service uses its 50 ms of quota in the first few milliseconds of a period when a request arrives, then sits throttled until the next period starts, so each request waits, latency goes up, and yet the average over a second looks like 30%. The fix is to raise the CPU limit well above the average, or remove it and rely on the request so the service is only slowed when the node is actually contended, or spread the work over more replicas. Giving it a higher priority wouldn't help, because a quota isn't a priority.
