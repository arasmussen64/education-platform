- term: CFS
  aliases: [Completely Fair Scheduler]
  definition: "The Completely Fair Scheduler, the Linux scheduler's long-standing name: it keeps running the task that has had least CPU time, so each gets its fair share."
- term: nice value
  definition: "A number from -20 to 19 that tilts a process's share of CPU when processes compete; higher is nicer to others. It caps nothing on an idle CPU."
- term: load average
  definition: "The average number of tasks that were running, waiting for a CPU or waiting on a disk over 1, 5 and 15 minutes. Read it against the CPU count."
- term: context switch
  definition: "The scheduler swapping one task off a CPU and another on. Thousands a second is normal."
- term: throttling
  definition: "CPU throttling: the kernel pausing a cgroup's tasks until the next period because they used up their CPU quota, `cpu.max`. It shows as latency, counted in `cpu.stat`."
