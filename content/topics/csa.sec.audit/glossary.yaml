# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# Module 4's plan (section 3.5) gives this topic audit trail, actor,
# retention, tamper-evident, hash chain, WORM, legal hold and
# forward-secure sealing; the others are the words its lesson adds to them.
# A chain's anchor has no entry of its own: "anchor" alone would be marked
# in the DNS and certificates lessons, where the word means a trust anchor.
- term: audit trail
  aliases: [audit log]
  definition: "The record of who did what, to what, from where, when and with what outcome, kept for investigators and auditors. It is separate from the logs engineers use to fix a system."
- term: actor
  definition: "In an audit record, the person or program that did the thing: the answer to \"who?\"."
- term: masking
  definition: "Writing only part of a sensitive value, such as a card number's last four digits, so that a record still says which one and nobody who reads it can use it."
- term: log injection
  definition: "Getting a line break into a value that a program writes to a text log, so that what follows reads as a second, forged event."
- term: retention
  definition: "How long records are kept before they are deleted, set by the rules that apply: long enough for auditors, and no longer than data protection law allows."
- term: tamper-evident
  definition: "Built so that a change can't go unnoticed. Nothing stops a file being changed by someone with enough power; a tamper-evident log makes the change show."
- term: hash chain
  definition: "A log in which each line carries a hash of the line before's hash and its own record, so that editing, deleting or moving a line breaks a link. Its newest hash, kept out of reach, is its anchor."
- term: forward-secure sealing
  aliases: [FSS]
  definition: "The systemd journal's tamper evidence: it seals its entries at every interval with a key that then moves on and can't be turned back, so an intruder can't re-seal the past."
- term: sealing key
  definition: "The key the journal seals with. It stays on the server and changes at every interval, so the server never holds the key for an earlier interval."
- term: verification key
  definition: "The key that checks every seal a journal ever makes. It is made once, with the sealing key, and kept off the server by people who don't run it."
- term: WORM
  aliases: [write-once storage]
  definition: "Write once, read many: storage in which an object can't be changed or deleted until a set date. S3 Object Lock, Azure's immutable blobs and Cloud Storage's Bucket Lock are examples."
- term: legal hold
  definition: "Protection against change and deletion with no end date, placed on stored records until someone lifts it. Used when a lawsuit or an investigation means nobody knows how long they are needed."
