id: csa.sec.audit
kind: topic
status: ready
title: Audit logging
summary: "The log that answers who did what, when and from where: which events belong in an audit trail and what must never be written to one; how long to keep it, and what each cloud keeps if you do nothing; how a hash chain and an anchor make tampering show; sealing a real journal so that even root can't rewrite its past; and write-once storage and legal holds on the three clouds."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections
# 2, 3, 4.3 and 5) and its designer's brief (csa.sec.audit.md), with the
# pay base as it was built (content/lab-bases/pay/README.md).
# The plan's prerequisite is csa.sec.crypto, for hash (sha256sum), MAC and
# HMAC, signature and key, which the tamper-evidence half of this topic
# stands on. Through it the topic also uses csa.sec.authn-authz's
# authentication, authorization, session, token, least privilege and
# separation of duties, by name. It builds on Module 1 (the journal and
# journalctl, drop-ins, sed, awk, grep, cut, scripts and chmod +x) and on
# csa.net.certificates (Certificate Transparency's append-only logs).
# Taught here because no earlier lesson has them: a journal namespace,
# `systemd-analyze cat-config`, `sed -E` with a group, `printf '%s'`, and
# the `while IFS= read -r` loop (the worked example's last step).
# This topic defines, for the module (the plan's 3.5): audit trail, actor,
# retention, tamper-evident, hash chain (and anchor), WORM, legal hold and
# forward-secure sealing (with its two keys), and log injection and
# masking. It says "secret" and "token" in plain words (Secrets is not a
# prerequisite), gives clock synchronisation one sentence (SAML, OAuth 2.0
# and OIDC owns time sync) and control plane and data plane one sentence
# each (Module 8 owns them). It is the first topic on the payments-server
# base, so its worked example carries the onboarding that Vulnerability
# management and Compliance basics point back to.
prerequisites: [csa.sec.crypto]
# Worked out: the lesson about 33 minutes (4,570 words with its tables and
# its story, which is counted below, at 130 a minute), the copied reading
# 11 (1,433 words), 24 practice quick questions at 1.5 each 36, then the
# worked example 30, the fill-in 25, the write 40, the build 60, the debug
# 45 and the explain 20, and the puzzle and the story about 5: 305. The
# plan's 295 counted a 15-minute
# lesson and 29 minutes of assigned reading; the other readings are
# optional now (ADR-0031, step 3) and the lesson carries the topic.
estimated_minutes: 305
rev: 1
objectives:
  - "Decide which events belong in an audit trail (who did what, to what, from where, when, with what outcome) and which don't; say what must never be written to one and how a field is masked; recognise log injection."
  - "Decide how long to keep an audit trail from the rules that apply, size the storage for it, and say what each cloud keeps by default and for how long."
  - "Name each cloud's audit trail and what it leaves out until you switch it on: CloudTrail's management and data events, Azure's activity log and resource logs, Google Cloud's Admin Activity and Data Access logs."
  - "Make a log tamper-evident with a hash chain: build one in the shell, verify it, find the first broken line, and say why a chain needs an anchor or a key to catch a cut-off end or a full rewrite."
  - "Seal a real audit trail with journald's forward-secure sealing, hand the verification key to someone else and verify it; say what an intruder with root can and can't change; choose write-once storage and legal holds on the three clouds."
# Facts the lesson and the items rely on, each read on 2026-11-22 unless a
# line says otherwise:
# - OWASP Logging Cheat Sheet: the events to always log (authentication
#   successes and failures, authorization failures, session management
#   failures, higher-risk functionality such as user administration,
#   administrative actions, access to cardholder data, key use, data
#   exports), the when, where, who and what attributes, the data to exclude
#   (session identifiers, "a hashed value can be used if tracking is
#   needed", access tokens, passwords, keys, payment card data), "Synchronize
#   time across all servers and devices", "Build in tamper detection so you
#   know if a record has been modified or deleted", log injection by CR and
#   LF; its footer: "This work is licensed under Creative Commons
#   Attribution-ShareAlike 4.0 International":
#   cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
# - PCI DSS's requirement 10 as Microsoft quotes it (the standard itself
#   was not opened: its library needs a browser): 10.2.1.4 "Audit logs
#   capture all invalid logical access attempts"; 10.2.2's details per event
#   (user identification, type of event, date and time, success and failure
#   indication, origination of event, the affected resource); 10.3.3 logs
#   "promptly backed up to a secure, central, internal log server(s) or
#   other media that is difficult to modify"; 10.5.1 "Retain audit log
#   history for at least 12 months, with at least the most recent three
#   months immediately available for analysis"; 10.6.1 "System clocks and
#   time are synchronized using time-synchronization technology":
#   learn.microsoft.com/en-us/entra/standards/pci-requirement-10
# - GDPR Article 5(1)(e), "kept in a form which permits identification of
#   data subjects for no longer than is necessary for the purposes for
#   which the personal data are processed": gdpr-info.eu/art-5-gdpr/ (an
#   unofficial copy of the regulation's text; the designer read EUR-Lex's
#   own on 2026-11-12, which was not opened again).
# - CloudTrail "is enabled by default"; event history is "a viewable,
#   searchable, downloadable, and immutable record of the past 90 days of
#   management events in an AWS Region", with "no CloudTrail charges"; it
#   "only shows management events. It does not show data events, Insights
#   events, or network activity events"; "For an ongoing record ... create
#   an event data store or a trail":
#   docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html
# - A CloudTrail record's fields (eventTime in UTC, eventVersion "1.11",
#   userIdentity, eventSource, eventName, awsRegion, sourceIPAddress,
#   userAgent, errorCode only "if the request returns an error",
#   requestParameters, responseElements, readOnly, eventType,
#   managementEvent, eventCategory "Management" or "Data"):
#   docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
#   (userIdentity's type, principalId, arn, accountId and userName are on
#   the page it links to, read by the designer; the record in cloudtrail-who
#   is made up for the question and says so.)
# - CloudTrail log file validation: "SHA-256 for hashing and SHA-256 with
#   RSA for digital signing"; "Every hour, CloudTrail also creates and
#   delivers a file that references the log files for the last hour and
#   contains a hash of each"; "Each digest file also contains the digital
#   signature of the previous digest file if one exists"; it tells whether
#   a log file "was modified, deleted, or unchanged"; it has to be enabled:
#   docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
# - Azure's activity log records control plane operations, with "no
#   required configuration"; "Azure retains activity log events for 90 days
#   and then deletes them. You aren't charged"; "Activity Log isn't an
#   authentication or authorization audit log. Requests that Azure Resource
#   Manager rejects during authentication or authorization before an
#   operation starts don't generate Activity Log entries"; resource logs
#   "aren't collected by default and require configuration with a
#   diagnostic setting" (ms.date 2026-11-03):
#   learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log
# - Microsoft Entra ID keeps audit logs and sign-ins "Seven days" on Free
#   and "30 days" on P1 and P2; longer by routing them to a storage account
#   through Azure Monitor (ms.date 2026-01-06):
#   learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-reports-data-retention
# - Google Cloud Audit Logs: four types; "Admin Activity audit logs are
#   always written; you can't configure, exclude, or disable them", System
#   Event the same; Policy Denied is generated by default; "Except for
#   BigQuery, Data Access audit logs are disabled by default", and enabling
#   them may add to logging charges: docs.cloud.google.com/logging/docs/audit.
#   The _Required bucket keeps 400 days, not configurable; _Default keeps
#   30 days, configurable for a project: docs.cloud.google.com/logging/quotas
# - S3 Object Lock: write-once-read-many; "works only in buckets that have
#   S3 Versioning enabled"; in compliance mode a protected version "can't be
#   overwritten or deleted by any user, including the root user", and "its
#   retention period can't be shortened"; governance mode is overridden
#   with s3:BypassGovernanceRetention; a legal hold "has no expiration
#   date" and is placed and removed with s3:PutObjectLegalHold:
#   docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
# - Azure immutable storage: time-based retention policies and legal
#   holds; one day to 146,000 days; an unlocked policy can be shortened,
#   extended or deleted, a locked one can't be deleted or decreased, with
#   at most five increases at container level; "lock the policy in a
#   reasonable amount of time, typically less than 24 hours" (ms.date
#   2026-08-18): learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
# - Cloud Storage Bucket Lock: "Locking a bucket's retention policy is an
#   irreversible action"; "Once you lock a policy, you cannot remove it or
#   reduce the retention period it has"; "You cannot delete a bucket with a
#   locked policy unless every object in the bucket has met the retention
#   period"; at most 3,155,760,000 seconds (100 years); object holds:
#   docs.cloud.google.com/storage/docs/bucket-lock
# - journalctl(1): --setup-keys makes a sealing key that "shall remain on
#   the host" and a verification key that "should be stored externally";
#   --interval "Defaults to 15min"; --verify, --verify-key:
#   freedesktop.org/software/systemd/man/latest/journalctl.html.
#   journald.conf(5): Storage is persistent in a namespace; Seal is on by
#   default once keys exist; 10000 messages in 30s per service, 0 turns the
#   limit off, and the limit "is multiplied by a factor derived from the
#   available free disk space"; SystemMaxUse defaults to 10% of the file
#   system, "capped to 4G"; MaxRetentionSec's default of 0 "turns off this
#   feature"; a namespace reads journald@NAMESPACE.conf:
#   freedesktop.org/software/systemd/man/latest/journald.conf.html
# - LWN, "Forward secure sealing", Jake Edge, 22 August 2012: sealed every
#   15 minutes by default, the sealing key on the system, the verification
#   key elsewhere and able to work out the sealing key for any time; an
#   intruder gets only the current key; "may be redistributed under the
#   terms of the Creative Commons CC BY-SA 4.0 license":
#   lwn.net/Articles/512895/
# - The story: CISA and the FBI, "Enhanced Monitoring to Detect APT
#   Activity Targeting Outlook Online" (AA23-193A, 12 July 2023, updated 14
#   July): in mid-June 2023 a federal agency "observed MailItemsAccessed
#   events with an unexpected ClientAppID and AppID" in its Microsoft 365
#   audit logs and reported it; Microsoft found that the actors had used a
#   consumer signing key to forge tokens and had taken unclassified mail
#   from "a small number of accounts"; the agencies are "not aware of other
#   audit logs or events that would have detected this activity"; Purview
#   Audit (Premium) logging "requires licensing at the G5/E5 level":
#   cisa.gov/news-events/cybersecurity-advisories/aa23-193a
# Tried in this topic's labs (systemd 255.4-1ubuntu8.19 on Ubuntu 24.04,
# the pay base), 2026-11-22: a sealed audit namespace verifies with
# "=> Validated from ... to ..., final 0 entries not sealed"; a copy with 12
# bytes changed in place fails with "Invalid hash" and "FAIL ... (Bad
# message)"; a copy rewritten entry by entry passes with no Validated line;
# a file from before sealing passes with no Validated line and no SEALED
# flag; with RateLimitBurst=50 a batch of 1,500 refunds kept 187, and
# journald then wrote "Suppressed N messages"; a journal with
# Storage=volatile writes under /run, is never sealed, and is gone after a
# restart; journald's own line at start, "System Journal (...) is 8.0M, max
# 4.0G", shows the default cap; `journalctl --setup-keys`, redirected,
# writes only the verification key to standard output. auditd was not run:
# a container can't (the kernel allows audit control only from the first
# PID namespace; the designer's finding), so its rules are taught on paper
# and the rule file in audit-rule-keys is written for the question.
# Every output in the lesson, the labs and the recall items marked
# "captured" is real output of those labs; keys, hashes of journal entries
