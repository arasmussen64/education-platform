skills:
  - id: what-to-log
    description: "Which events belong in an audit trail (sign-ins both ways, privilege and configuration changes, admin actions, access to sensitive data) and which fields (who, what, when in UTC from synchronised clocks, from where, the outcome); what is never recorded (passwords, session IDs, tokens, keys) and how a card number is masked; log injection; the audit trail as a stream of its own; auditd's watch rules and auid, on paper"
  - id: retention
    description: "How long to keep a trail, from the rules that apply (PCI DSS's 12 months with three immediately available, GDPR's storage limitation); sizing storage from events a day, bytes an event and days; journald's 4 GB default cap, SystemMaxUse= and MaxRetentionSec=; the clouds' default windows"
  - id: cloud-audit-trails
    description: "What each cloud records with no setup and what it doesn't: CloudTrail's event history against trails and data events; Azure's activity log, resource logs through diagnostic settings, and Entra ID's logs by licence; Google Cloud's four audit logs and two buckets; reading who did what in a record"
  - id: hash-chains
    description: "Chaining each record to the hash before it; what an edit, a deletion, a swap, a cut-off end and a full rewrite each look like to a verifier; the anchor; CloudTrail's signed hourly digests and Certificate Transparency as the same idea at scale"
  - id: sealing-and-worm
    description: "journald's forward-secure sealing: the two keys, the interval, verifying, what root can and can't change, PASS without a validated range; shipping logs off the server; write-once storage on three clouds (S3 Object Lock's modes, Azure's locked and unlocked policies, Cloud Storage's Bucket Lock) and legal holds"
