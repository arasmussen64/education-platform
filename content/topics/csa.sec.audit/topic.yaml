prove:
  build: build-payments-audit-trail
  debug: debug-gaps-in-the-trail
  explain:
    prompt: |
      Your company's payments service is moving to the cloud, and the security lead asks you how its audit trail will work. Explain, in your own words: what the trail records and what it must never record, with a reason for each; how long it's kept, what decides that, and what the cloud keeps for you by default if you do nothing; how someone could alter or delete the trail, and how each of hash chains, sealing and write-once storage makes that detectable or impossible, including what an intruder with root can still do; and who should hold the keys and the delete permission. Say one way the three clouds differ.
    rubric:
      - id: what-and-not
        required: true
        description: "Records sign-ins (successes and failures), privilege and configuration changes, admin actions and access to sensitive data, each with who, what, when (UTC, from synchronised clocks), from where and the outcome; never passwords, session IDs, tokens or keys (anyone who reads the log could use them), and a card number only as its last four digits; kept apart from operational logs."
      - id: how-long
        required: true
        description: "From the rules that apply: PCI DSS's at least 12 months with the most recent three immediately available; GDPR's no longer than necessary, so it is deleted afterwards; storage sized from events a day, bytes an event and days. Defaults are short (CloudTrail's event history 90 days of management events, Azure's activity log 90 days, Entra ID 7 or 30 days, Google's _Default bucket 30 days and _Required 400), and the record of who read data is off until enabled."
      - id: tamper-evidence
        required: true
        description: "A hash chain makes an edit, a deletion or a reordering show, but not a cut-off end or a rewrite of every later hash, unless the newest hash (an anchor) is kept out of reach, or a key is used; sealing moves its key forward so an intruder with root can alter only entries since the last seal; a verification that names no validated time range proves nothing."
      - id: keep-it
        required: true
        description: "Detection doesn't stop deletion, so the trail is shipped off the server to write-once storage (S3 Object Lock in compliance mode, a locked Azure policy, a locked Cloud Storage bucket), with a legal hold when no end date is known; the verification key and the right to delete are held by people who don't run the servers."
      - id: clouds-differ
        required: false
        description: "For example: Google always keeps 400 days of admin activity where AWS's event history and Azure's activity log keep 90; Azure's activity log leaves out requests rejected before they start; S3 has governance and compliance modes, Azure unlocked and locked policies, and Google one lock that can't be undone."
    model_answer: |
      The audit trail is the record an investigator or an auditor reads months later to answer "who did what, to what, from where, and did it work?". So it records the events that question is asked about: every sign-in, failed and successful, every change to who may do what, admin actions and configuration changes, and access to sensitive data such as refunds, exports and card details. Each line says who, what, when (in UTC, from clocks that are synchronised, or lines from two servers can't be put in order), from where, and the outcome. It never holds a password, a session ID, a token or a key, because whoever reads the log could then use them, and a card number appears only as its last four digits. It isn't the debug log: page views and errors go elsewhere, so the trail stays readable.

      How long is decided by rules, not taste. The card rules, PCI DSS, want at least 12 months with the latest three immediately searchable. Data protection law wants personal data kept no longer than needed, so the trail is also deleted on schedule. I'd size the storage from events a day times bytes an event times days. If we do nothing, the cloud keeps little: AWS's event history is 90 days of management events, Azure's activity log 90 days, Entra ID's sign-in logs 7 days on the free licence and 30 on the paid ones, Google's default bucket 30 days (its admin activity 400). And none of them records who read our data until we switch that on: data events in CloudTrail, resource logs through a diagnostic setting in Azure, Data Access logs in Google Cloud. So we export what must last a year, and switch on the data-plane record for what matters.

      Someone with root can edit a log file. We can't stop that on the server itself, but we can make it show. A hash chain puts on every line a hash of the line before's hash and this line's record, so an edit, a deletion or a swap breaks a link. It can't show lines cut off the end, or an attacker who redoes every hash after their change, unless the newest hash is kept somewhere they can't reach, or a key they don't have is involved. Sealing does that with keys: the journal seals itself every interval and then moves its key forward, so an intruder who gets root can rewrite only what was written since the last seal, and the check has to show a validated time range, since a forged file still says PASS. Detection doesn't stop deletion, so the trail is also shipped off the server into write-once storage: S3 Object Lock in compliance mode, a locked retention policy in Azure, a locked bucket in Google Cloud, with a legal hold if a lawsuit means we don't know the end date.

      The verification key and the permission to delete go to people who don't run the payments servers: the trail exists to check the admins too. One difference between the clouds: Azure's activity log has no entry for a request refused before it starts, so failed attempts have to be found in the sign-in and resource logs.
