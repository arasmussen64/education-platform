# The shop's audit policy: what its audit writer records.
#   audit EVENT FIELD...    record EVENT with these fields (time is always added, in UTC)
#   mask FIELD              write only the last four characters of FIELD
# "shop-cli events" lists the events and their fields. After a change:
#   sudo systemctl reload shop-audit
audit login.ok user src outcome
audit login.failed user src outcome
audit refund actor order amount src outcome
audit card.update user card src outcome
mask card
