# The audit journal namespace's settings (journald.conf(5)): the journal that
# shop-audit.service writes, read with "journalctl --namespace=audit".
# Drop-ins in /etc/systemd/journald@audit.conf.d/ are read after this file.
# After a change: sudo systemctl restart systemd-journald@audit
[Journal]
Seal=yes
MaxRetentionSec=400d
SystemMaxUse=8G
