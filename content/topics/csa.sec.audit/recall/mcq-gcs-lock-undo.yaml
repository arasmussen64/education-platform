id: mcq-gcs-lock-undo
type: mcq
rev: 1
prompt: |
  A team locked a Cloud Storage bucket's retention policy at 10 years, and meant 1 year. What can be done about it?
choices:
  - "Nothing: the lock can't be undone, and the period can only be raised"
  - "Google's support can unlock a policy within 30 days of the lock"
  - "The policy can be shortened once, in the first 24 hours after locking"
  - "The bucket can be emptied and deleted now, and a new one made"
answer: 0
explanation: |
  Google's documentation calls locking a bucket's retention policy "an irreversible action". Once locked, the policy can't be removed and its period can't be reduced; it can only be increased. The bucket itself can be deleted only when every object in it has met the retention period, so these objects stay, and are paid for, for ten years.

  That is the point of a lock, and the cost of one: a control that even the owner can't undo is one an intruder with the owner's account can't undo either. So the order of work is the same on every cloud. Try the policy unlocked (or in S3's governance mode), check the period twice, and lock last.
skills: [sealing-and-worm]
