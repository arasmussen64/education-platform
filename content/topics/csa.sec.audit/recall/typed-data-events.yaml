id: typed-data-events
type: typed
rev: 1
prompt: |
  CloudTrail sorts what it records into kinds. Operations on a resource, such as creating a bucket, are management events. What does AWS call the kind that covers reading and writing the objects inside a bucket, which event history never shows? Give the two-word name.
kind: text
answers:
  - data events
  - data event
mistakes:
  - id: management
    answers: [management events, management event]
    why: "Management events are operations on resources themselves (create, change, delete), and they are the one kind event history does show."
  - id: azure-word
    answers: [resource logs, resource log]
    why: "That is Azure's name for the same idea. AWS's name for the kind of event has two words, and the first is what a bucket holds."
explanation: |
  **Data events**: operations inside a resource, such as `GetObject` and `PutObject` on S3 objects. They are off until a trail or event data store is told to collect them: a busy bucket makes millions. Azure's resource logs and Google Cloud's Data Access logs are the same gap under other names.
skills: [cloud-audit-trails]
