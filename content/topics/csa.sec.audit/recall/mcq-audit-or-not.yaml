id: mcq-audit-or-not
type: mcq
rev: 1
prompt: |
  The shop is choosing what its payments service writes to the audit trail. Which set of events belongs in it?
choices:
  - "Sign-ins that worked and that failed, role changes, and refunds"
  - "Page views, product searches, and every error the service runs into"
  - "Every request the service receives, written at debug level to be safe"
  - "Failed sign-ins and refused requests only, since successes are normal"
answer: 0
explanation: |
  An audit trail answers "who did what, to what, from where, and did it work?" for the actions an investigator will ask about: proving who you are (sign-ins, both ways), changing who may do what (role changes), and touching money or sensitive data (refunds, exports, card updates).

  Successes belong there as much as failures. The intruder who guessed a password shows up as five failed sign-ins and then one that worked, and the one that worked is the line that matters. Page views, searches and errors are for the operational log, which engineers read to fix the service and can throw away. "Everything, at debug level" buries the hundred lines that matter under millions that don't, costs a fortune to keep for a year, and is the surest way to write a password or a card number down by accident.
skills: [what-to-log]
