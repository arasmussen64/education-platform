id: mcq-ct-append-only
type: mcq
rev: 1
prompt: |
  Certificate Transparency logs are append-only: entries are added and never removed. What does that let the owner of a domain do?
choices:
  - "Find a certificate for their name that they never asked for"
  - "Revoke a certificate faster than a certificate authority can"
  - "Hide a certificate for an internal name from the public lists"
  - "Stop a certificate authority from issuing for their name at all"
answer: 0
explanation: |
  Certificates and mutual TLS met these logs: public certificate authorities publish every certificate they issue in them. Because nothing can be taken out or changed afterwards, a certificate issued for `shop.test` by mistake, or by someone who fooled a CA, stays visible, and the domain's owner can watch the logs for their own name.

  It is the same idea as this topic's chain, built for the whole internet: a log that can only grow, whose keepers can't rewrite history without everyone noticing. It doesn't prevent anything. Like every audit trail, it makes sure that what happened can be seen. Stopping a CA from issuing is what a CAA record in DNS is for.
skills: [hash-chains]
