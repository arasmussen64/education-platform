id: mcq-never-in-the-trail
type: mcq
rev: 1
prompt: |
  The shop records each password reset in its audit trail. Which of these must the line never hold?
choices:
  - "The session ID of the browser session that asked for the reset"
  - "The user name of the account whose password is being reset"
  - "The source address the reset request arrived from, as the server saw it"
  - "The outcome, whether the reset went through or was refused"
answer: 0
explanation: |
  A session ID is what the browser shows the site to prove it is already signed in. Whoever reads it in a log can use it and be that person, for as long as the session lasts. The same goes for an access token, and a password or a key is worse still. None of them is ever written to a log, where many more people can read them than should.

  The other three are exactly what the line is for: who (the account), from where (the source address) and how it ended (the outcome). If sessions have to be told apart in the trail, write a hash of the session ID, which can be compared and can't be used. A card number follows a rule of its own: its last four digits at most.
skills: [what-to-log]
