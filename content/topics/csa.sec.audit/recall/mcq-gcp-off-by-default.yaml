id: mcq-gcp-off-by-default
type: mcq
rev: 1
prompt: |
  Which of Google Cloud's audit logs do you have to switch on yourself for most services?
choices:
  - "Data Access logs"
  - "Admin Activity logs"
  - "System Event logs"
  - "Policy Denied logs"
answer: 0
explanation: |
  Google Cloud writes four audit logs. **Admin Activity** (changes to resources and settings) and **System Event** (changes Google's own systems make) are always written, and can't be switched off. **Policy Denied** (a request refused by a security policy) is written by default. **Data Access** (reads of data and of settings) is off by default for every service except BigQuery, because it is by far the largest and you pay to store it.

  It is the same gap as on the other two clouds, under a third name: who changed things is recorded for you, and who read things isn't, until you ask.
skills: [cloud-audit-trails]
