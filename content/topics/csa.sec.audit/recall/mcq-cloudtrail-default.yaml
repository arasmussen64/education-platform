id: mcq-cloudtrail-default
type: mcq
rev: 1
prompt: |
  A new AWS account, with nothing set up. What has CloudTrail recorded when you look a month later?
choices:
  - "The last 90 days of management events, in each Region's event history"
  - "The last 90 days of every API call, reads of S3 objects included"
  - "Nothing at all: recording starts only once somebody creates a trail"
  - "Every management event since the account was made, kept without limit"
answer: 0
explanation: |
  CloudTrail is on from the start. Its **event history** is a free, searchable record of the last 90 days of **management events**: creating, changing and deleting resources, sign-ins to the console, changes to who may do what. It is kept Region by Region.

  Two limits matter. It is 90 days and no more, so anything older is gone unless you made a **trail** (or a CloudTrail Lake event data store) to deliver events to storage of your own. And it holds management events only: what happens inside a resource, such as reading an object in a bucket, is a data event, and event history never shows those.
skills: [cloud-audit-trails]
