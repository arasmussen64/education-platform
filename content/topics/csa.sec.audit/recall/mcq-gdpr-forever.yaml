id: mcq-gdpr-forever
type: mcq
rev: 1
prompt: |
  "Keep the audit trail forever, to be safe," says a colleague. The trail holds staff and customer names and addresses. What is wrong with forever?
choices:
  - "GDPR allows personal data only as long as its purpose needs, so it must be deleted"
  - "PCI DSS requires audit logs to be destroyed after exactly 12 months, to the very day"
  - "Nothing, as long as it is sealed: sealed logs are exempt from data protection law"
  - "Nothing but cost: storage is the only thing that keeping a log for longer changes"
answer: 0
explanation: |
  An audit trail is full of personal data: who signed in, from which address, whose card was updated. GDPR's storage limitation rule (Article 5(1)(e)) says personal data is kept in a form that identifies people "for no longer than is necessary" for its purpose. So retention has two ends. Keep the trail as long as the rules require, and then delete it, on a schedule, by a setting and not by hand.

  PCI DSS sets a floor, at least 12 months, and no ceiling, so it doesn't order anything destroyed. Sealing protects a log from being changed and has no bearing on how long it may be kept. And cost is the least of it: a trail kept forever is a growing pile of personal data to lose in a breach.
skills: [retention]
