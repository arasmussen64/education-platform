id: mcq-azure-unlocked
type: mcq
rev: 1
prompt: |
  An Azure container holding audit logs has a time-based retention policy of 400 days, which is still unlocked. What does that give you?
choices:
  - "Blobs are protected, but the policy can still be shortened or removed"
  - "Nothing yet: an unlocked policy protects no blob until someone locks it"
  - "Blobs are protected, and the policy can be extended but never shortened"
  - "The same as a locked one, since Azure locks every policy after 24 hours"
answer: 0
explanation: |
  Azure's immutable storage starts a time-based retention policy **unlocked**, for testing. The blobs really are protected: they can't be changed or deleted while the policy stands. But the policy itself can be shortened or deleted, by anyone allowed to manage it, so the protection lasts only as long as nobody with that right wants it gone.

  **Locking** is the step that makes it a real write-once store: a locked policy can't be deleted, and its period can be extended but never shortened. Nothing locks it for you. Microsoft's advice is to lock within about a day, and that is advice, not something the service does.

  It is the same pair as S3's governance and compliance modes: one for trying things out, one for the trail that must survive its own administrators.
skills: [sealing-and-worm]
