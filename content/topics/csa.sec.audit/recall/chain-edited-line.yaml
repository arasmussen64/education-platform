id: chain-edited-line
type: predict_shell
rev: 1
prompt: |
  `audit.log` was a five-line chained log: each line is a hash, a space and a record, and the hash is the SHA-256 of the line before's hash, a space and the record (64 zeros stand in for the line before the first). `anchor` is the last line's hash as the auditors copied it down. Since then someone has changed the amount on line 4 from `250.00` to `25.00`, and left the hashes alone. `chain-verify` walks the log, working each hash out again. What does the command print?
files:
  audit.log: |
    ed8f833f60e6f25c11adf231f65b0e59c72a22517e84a6b0508e311b3d89f782 event=login.ok user=ana src=203.0.113.9
    65835bfbc09fea16ebecce8b58c76cd04e284f9246dd90939bbdd247e67637c5 event=refund actor=ana order=42 amount=19.99
    5100f6fd3415bb700a680b5c340834a3d6fec98f71e41297b275194692ec8fbe event=role.change actor=root user=ben new=admin
    acd4b0701143622d145b93beb78999033c430e9729e5c300712ba6b5ca83814a event=refund actor=ben order=43 amount=25.00
    a8ab96ffa0f136805f8f5c1efff15656b091ac505137f546adf94be6c0449601 event=login.ok user=cy src=192.0.2.44
  chain-verify: |
    #!/bin/bash
    # chain-verify LOG ANCHOR: checks a chained log against the last hash
    # the auditors hold.
    log=$1
    anchor=$2
    prev=$(printf '%064d' 0)
    n=0
    while IFS= read -r line; do
      n=$((n + 1))
      hash=${line%% *}
      record=${line#* }
      want=$(printf '%s %s' "$prev" "$record" | sha256sum | cut -d' ' -f1)
      if [ "$hash" != "$want" ]; then
        echo "broken at line $n"
        exit 1
      fi
      prev=$hash
    done < "$log"
    if [ "$prev" != "$anchor" ]; then
      echo "anchor mismatch"
      exit 1
    fi
    echo "ok $n"
  anchor: |
    a8ab96ffa0f136805f8f5c1efff15656b091ac505137f546adf94be6c0449601
command: |
  bash chain-verify audit.log "$(cat anchor)"
expected_output: |
  broken at line 4
explanation: |
  Lines 1 to 3 are untouched, so each hash is what the script works out. On line 4 it hashes line 3's hash, a space and the record as it now reads, with `25.00` in it, and gets something quite different from the hash written there, which was made from `250.00`. It stops: `broken at line 4`.

  An edit breaks exactly one link, its own. Line 5 would still pass, because line 5's hash was made from line 4's *hash*, and the editor left that alone. That is what makes the verdict useful: it names the line that was changed.

  To hide the edit, the editor would have to put the right new hash on line 4, and then line 5 no longer fits, and so on to the end. The last hash would change, and the auditors hold the old one.
skills: [hash-chains]
