id: mcq-key-where
type: mcq
rev: 1
prompt: |
  `journalctl --setup-keys` prints a verification key. Where should that key be kept?
choices:
  - "Off the server, with someone who doesn't administer it"
  - "Beside the journal's files, so that verifying is quick"
  - "In root's home folder, readable by root and nobody else"
  - "Inside the sealed journal, where a change to it would show"
answer: 0
explanation: |
  The verification key can work out the sealing key for any moment, past or future. On the server, it would hand an intruder exactly what sealing takes away from them: the power to re-seal old entries. So it leaves the machine at once, and the sealing key, which only moves forward, is the one that stays.

  It also shouldn't sit with the people whose actions the trail records. That is separation of duties: the admins of the payments server run it, and someone else, auditors or a security team, holds the means to check them. Every choice that keeps the key on the server, however well protected from other users, leaves it in reach of whoever becomes root there.
skills: [sealing-and-worm]
