prove:
  build: build-the-diagnostics
  debug: debug-a-run-that-will-not-learn
  explain:
    prompt: |
      A teammate's network isn't learning and they are about to try a bigger model, a different optimizer and more epochs, all at once. Walk them through the checklist in order and say what each step rules in or out: what the first loss should be and why; what overfitting one batch and the gradient check each prove; how to read the loss curve for the learning rate, including the case where a rate that is too high stalls rather than diverges; what dead ReLUs and exploding gradients look like in the numbers and what fixes each; what shuffled labels and unscaled inputs do to a run and why; and why to change one thing at a time with the seed fixed.
    rubric:
      - id: order
        required: true
        description: "First cheap checks that separate a bug from a hard problem: the first loss should be about log(number of classes) with a small output layer (far off means the output scale or the data is wrong); a working network drives the loss on eight rows to nearly zero, and if it can't the code is broken; the gradient check compares backward with central differences and a failure is a bug in backward. Only then touch the learning rate, the model or the data."
      - id: rate-and-curve
        required: true
        description: "Stalled (fell by less than a tenth) usually means the rate is too low; diverging (NaN or rising) means too high; but a too-high rate can also stall by killing the hidden units, so a stalled run gets the dead-unit count before the rate is raised. The fix is the rate by a factor of ten, then look again."
      - id: dead-and-exploding
        required: true
        description: "A dead ReLU outputs zero on every row, so no gradient reaches its weights and it never recovers; a large negative bias or one oversized step makes them, and the count is read from the activations. Exploding gradients show as a gradient norm that grows step over step until it overflows, from a starting scale that is too big or a rate too high; the fixes are He-scaled starts, a lower rate and clipping the gradient norm."
      - id: data
        required: true
        description: "Labels that don't match their rows let one batch be memorized but leave the full run stalled and the validation accuracy at chance, because there is no pattern to learn; inputs on the wrong scale make the first steps enormous and the run diverge, because the gradient scales with the inputs. Standardize with the training set's mean and spread, applied to the validation set too."
      - id: one-thing
        required: true
        description: "Change one thing at a time with the seed fixed, so that a difference in the result has one cause; changing three things at once leaves no way to know which one mattered, and without a fixed seed two runs differ anyway."
    model_answer: |
      Before touching anything, check what is cheap to check. With the output layer started small, the first loss should be about log 3 for three classes, 1.10, because the network is guessing evenly; a first loss far from that means the output scale, the loss or the labels are not what you think. Then take eight rows and train on them alone for a few hundred steps: a network whose code works will drive that loss to nearly zero, because eight points are trivial to memorize, and if it cannot, the bug is in the code, not in the data or the hyperparameters. The gradient check settles whether backward is right: compare every gradient with a central difference of the loss, and a gap above a millionth is a bug in a backward method. These three pass, so what is left is the training setup. Read the loss curve: falling and levelling off is converging; falling by less than a tenth in thirty epochs is stalled, which usually means the learning rate is too low; NaN or rising is diverging, which means too high. But a rate that is too high does not always diverge. One huge step can push a hidden unit's bias so far negative that it outputs zero on every row, and a ReLU that outputs zero passes no gradient back, so it never recovers: in the example a rate of 10 left twelve of sixteen units dead and the run stalled, looking exactly like a rate that was too low. So count the dead units before raising the rate; the count is the number of units whose activation is zero on every row. Dead units also come from a large negative bias at the start; the fixes are zero biases with He-scaled weights, a smaller rate, and, in libraries, a leaky ReLU that never passes exactly zero. Exploding gradients show in the gradient norm, the length of all the gradients taken together: it grows step over step until it overflows to infinity and the loss becomes NaN. A starting scale that is too big through several layers does it from the first step; a rate that is too high does it after a few. He-scaled starts fix the first, a lower rate fixes the second, and clipping the gradient norm to a limit lets a run survive either, since the step is bounded. If all of that is in order and the run still stalls, suspect the data. Labels that do not match their rows, from shuffling inputs and labels separately, give a run that can still memorize eight rows but has no pattern to learn across the training set: the loss barely moves and the validation accuracy sits at chance. Inputs on the wrong scale, say in the thousands, make the first logits and so the first gradients enormous, because the gradient of a dense layer scales with its input, and the run diverges at a rate that was fine before; standardizing each column with the training set's mean and spread, applied to the validation set with the same numbers, fixes it. Through all of this, change one thing at a time with the seed fixed. If the bigger model, the new optimizer and the extra epochs go in together and the run improves, nothing says which one did it, and if it gets worse, nothing says which one to take out; with the seed fixed, two runs that differ in one setting differ for one reason.
review_pool:
  - review-predict-dead-units
  - review-mcq-cannot-overfit-one-batch
