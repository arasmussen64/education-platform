- term: hyperparameter
  definition: A setting of a training run chosen by hand, not learned from the data, such as the learning rate, the batch size or the number of layers.
- term: gradient norm
  definition: The length of all of a network's gradients taken together as one vector, the square root of the sum of every squared entry. It says how big the next step will be.
- term: exploding gradient
  definition: Gradients that grow step over step until the numbers overflow to infinity and NaN, caused by a learning rate that is too high or starting weights that are too big.
- term: gradient clipping
  definition: Scaling all the gradients down by one factor whenever their norm passes a chosen limit, so a step keeps its direction and can never be longer than the rate times the limit.
