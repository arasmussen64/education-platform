id: parsons-standardize
type: parsons
rev: 1
prompt: |
  Put the lines in order to standardize two columns with the training set's mean and spread, apply the same numbers to a validation row, and print both. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'X_train, X_val = np.array([[1.0, 100.0], [3.0, 300.0], [5.0, 500.0]]), np.array([[3.0, 100.0]])'
  - 'mean, std = X_train.mean(axis=0), X_train.std(axis=0)'
  - 'X_train, X_val = (X_train - mean) / std, (X_val - mean) / std'
  - 'print(X_train.round(3).tolist(), X_val.round(3).tolist())'
distractors:
  - 'mean, std = X_val.mean(axis=0), X_val.std(axis=0)'
explanation: |
  The mean and spread come from the training rows, then both sets are shifted and scaled by those same two numbers, then printed. The decoy measures them on the validation set, which has one row: its spread is zero, the division gives NaN, and even with more rows the two sets would be on different footings.
skills: [data-bugs]
