id: build-stand-up-gateway
stage: build
runtime: lab
lab:
  init: systemd
rev: 1
title: "Stand up the API gateway"
prompt: |
  A fresh version of the checkpoint's build, in a different story. A new server for the company's API gateway: the `gateway` service is installed (`/etc/systemd/system/gateway.service`, listening on port 9090) but not running, there's no firewall, and SSH still takes passwords. Bring it up to the runbook, from a blank slate and with no hints:

  1. **Run the service.** Enable `gateway` so it starts on boot and start it now, so `systemctl is-active gateway` is `active` and `curl -s localhost:9090` answers.
  2. **Put up the firewall.** `/etc/nftables.conf` with an `input` chain whose policy is `drop`, accepting loopback, established and related traffic, SSH (`tcp dport 22`) and the gateway (`tcp dport 9090`). Load it and `systemctl enable nftables`.
  3. **Harden SSH.** A drop-in with `PasswordAuthentication no` and `PermitRootLogin no`, checked with `sudo sshd -t`, and `ssh -i ~/keys/ben ben@localhost` still working.

  No shortcuts that weaken the server. When it's all up, run the checks.
test_skills:
  service-running: [csa.linux.services/systemctl, csa.linux.services/unit-files]
  api-answers: [csa.linux.services/supervision]
  firewall-default-deny: [csa.linux.net-tools/firewall-path, csa.linux.hardening/firewall-min]
  firewall-persisted: [csa.linux.hardening/firewall-min]
  ssh-hardened: [csa.linux.hardening/ssh-hardening]
  key-login-works: [csa.linux.permissions/ssh-keys]
