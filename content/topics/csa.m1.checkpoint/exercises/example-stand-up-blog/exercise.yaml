id: example-stand-up-blog
stage: worked_example
runtime: lab
lab:
  init: systemd
rev: 1
title: "A server stood up, start to finish"
prompt: |
  A solved sibling of the checkpoint's build, in a different story: a fresh server for the company blog, with `blog-web` installed but not running, no firewall, and SSH still taking passwords. The walkthrough brings it up to the same runbook the checkpoint asks for, service, firewall, SSH, in the order that never locks you out, and writes down the result. Type each line yourself in the lab's shell and read what it prints before you type the next.
steps:
  - label: "See what's there"
    lines: "1"
    note: "`systemctl is-active blog-web` says `inactive`, and `ss -ltnp` shows only SSH on 22: nothing is listening on the blog's port, 8000. This is the starting point of every standup: know what the server is doing before you change it."
  - label: "Prove the key before touching SSH"
    lines: "2"
    note: "`ssh -i ~/keys/ben ben@localhost whoami` prints `ben`. You're about to turn passwords off, so you check *first* that the key already works. It does."
  - label: "Run the service"
    lines: "3"
    note: "`systemctl enable --now blog-web` enables it for every boot and starts it now, one command. A second later, `curl -s localhost:8000` answers `blog-web ok`. Part one of three."
  - label: "Write the firewall"
    lines: "4-12"
    note: "The same shape as the hardening topic's firewall, in `/etc/nftables.conf`: an `input` chain with `policy drop`, accepting loopback, established and related traffic, SSH on 22, and the blog on 8000. Everything else is dropped. Writing it to the file is what lets it come back after a reboot."
  - label: "Load it and keep it"
    lines: "13"
    note: "`nft -f` loads the file into the running kernel; `systemctl enable nftables` makes the service load it at boot. Counting the `dport` rules confirms both ports are in. Your own `ssh` to `localhost` goes over loopback, which the first rule accepts, so you're not locked out."
  - label: "Harden SSH"
    lines: "14"
    note: "A drop-in turning off password and root logins, then `sshd -t`, which is silent when the file is valid, then the reload. `sshd -t` only checks the file: the running `sshd`, started by `ssh.socket` at your first login in step 2, keeps its old settings until `sudo systemctl reload ssh`, so reload before you test."
  - label: "Prove it, and write it down"
    lines: "15-16"
    note: "The login still works with the key, with passwords off and the firewall up. Then the three facts that say the runbook was followed, the service active, the port answering, the login working, go into `~/runbook/done.txt`. An incident or a handover starts from a file like this."
