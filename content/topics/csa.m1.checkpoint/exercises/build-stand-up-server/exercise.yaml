id: build-stand-up-server
stage: build
runtime: lab
lab:
  init: systemd
rev: 2
title: "Stand up the shop's server"
prompt: |
  A fresh server has arrived, and the shop's API has to go live on it. Nothing is set up yet: the `shop-api` service is installed but not running, there is no firewall, and SSH still accepts passwords. Bring the server up to the shop's runbook, its written standard for a new server. There are no steps to follow here, only what must be true when you finish:

  1. **The service runs.** `shop-api` is running now, starts by itself after a reboot, and answers on port 8080.
  2. **The firewall lets in only what the server serves.** From another machine, SSH (port 22) and the API (port 8080) answer and nothing else does. The firewall is nftables, and the same rules come back after a reboot: they are saved in `/etc/nftables.conf`, and the `nftables` service is enabled.
  3. **SSH is hardened.** The SSH server that is running refuses password logins and root logins, and Ben, who deploys the shop's code, can still log in with his key: `ssh -i ~/keys/ben ben@localhost` (a copy of his private key is in your `~/keys`, so you can test as him).

  To test from another machine, use `from-office`: it runs a command on a second machine on the office network, where this server's address is `10.0.9.1`. For example, `from-office curl -s http://10.0.9.1:8080/`.

  No shortcut that leaves the server weaker counts: with the firewall off, or passwords still accepted, the checks fail. When all three are true, run the checks.
hints:
  - "The service: `sudo systemctl enable --now shop-api` enables and starts it in one step. Confirm with `systemctl is-active shop-api` and `curl -s localhost:8080`."
  - "The firewall is the one from the hardening topic plus a rule for 8080: an `input` chain `policy drop` with `iif lo accept`, `ct state established,related accept`, `tcp dport 22 accept` and `tcp dport 8080 accept`, written to `/etc/nftables.conf`. `sudo nft -f /etc/nftables.conf` loads it; `sudo systemctl enable nftables` keeps it. `from-office curl -s http://10.0.9.1:8080/` tests it from outside."
  - "The SSH drop-in: `printf 'PasswordAuthentication no\\nPermitRootLogin no\\n' | sudo tee /etc/ssh/sshd_config.d/90-hardening.conf`, then `sudo sshd -t`. A server that is already running keeps its old settings until `sudo systemctl reload ssh` (`restart` if the service isn't running)."
test_skills:
  service-running: [csa.linux.services/systemctl, csa.linux.services/unit-files]
  api-answers: [csa.linux.services/supervision]
  reachable-from-outside: [csa.linux.hardening/firewall-min, csa.linux.net-tools/test-tools]
  firewall-default-deny: [csa.linux.net-tools/firewall-path, csa.linux.hardening/firewall-min]
  firewall-persisted: [csa.linux.hardening/firewall-min]
  ssh-hardened: [csa.linux.hardening/ssh-hardening]
  key-login-works: [csa.linux.permissions/ssh-keys]
