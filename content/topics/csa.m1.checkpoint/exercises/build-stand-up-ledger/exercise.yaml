id: build-stand-up-ledger
stage: build
runtime: lab
lab:
  init: systemd
rev: 2
title: "Stand up the ledger"
prompt: |
  A fresh version of the checkpoint's build, in a different story. A new server has arrived for the accounts ledger, the service that records every payment the company takes. Nothing is set up yet: the `ledger` service is installed but not running, there is no firewall, and SSH still accepts passwords. Bring the server up to the runbook, the company's written standard for a new server. There are no steps and no hints here, only what must be true when you finish:

  1. **The service runs.** `ledger` is running now, starts by itself after a reboot, and answers on port 7000.
  2. **The firewall lets in only what the server serves.** From another machine, SSH (port 22) and the ledger (port 7000) answer and nothing else does. The firewall is nftables, and the same rules come back after a reboot: they are saved in `/etc/nftables.conf`, and the `nftables` service is enabled.
  3. **SSH is hardened.** The SSH server that is running refuses password logins and root logins, and Ben, who deploys the company's code, can still log in with his key: `ssh -i ~/keys/ben ben@localhost` (a copy of his private key is in your `~/keys`, so you can test as him).

  To test from another machine, use `from-office`: it runs a command on a second machine on the office network, where this server's address is `10.0.9.1`. For example, `from-office curl -s http://10.0.9.1:7000/`.

  No shortcut that leaves the server weaker counts: with the firewall off, or passwords still accepted, the checks fail. When all three are true, run the checks.
test_skills:
  service-running: [csa.linux.services/systemctl, csa.linux.services/unit-files]
  api-answers: [csa.linux.services/supervision]
  reachable-from-outside: [csa.linux.hardening/firewall-min, csa.linux.net-tools/test-tools]
  firewall-default-deny: [csa.linux.net-tools/firewall-path, csa.linux.hardening/firewall-min]
  firewall-persisted: [csa.linux.hardening/firewall-min]
  ssh-hardened: [csa.linux.hardening/ssh-hardening]
  key-login-works: [csa.linux.permissions/ssh-keys]
