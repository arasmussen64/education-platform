id: step-the-whole-runbook
stage: fill_in
runtime: lab
lab:
  init: systemd
rev: 1
title: "Step 4 of the runbook: the whole thing, from an outline"
prompt: |
  The checkpoint's build with nothing done for you, but an outline to work from. A fresh server: `shop-api` installed and not running, no firewall, SSH taking passwords. Follow the outline and check each part as you go:

  ```
  # 1. Run the service: enable it for every boot and start it now.
  # 2. Put up the firewall: default deny, keep SSH (22) and the API (8080), load it, enable it.
  # 3. Harden SSH: passwords and root login off, check the config, prove the key login.
  ```

  Then run the checks. When these pass, try one of the checkpoint's fresh versions from a blank slate, with no outline.
hints:
  - "Part 1 is one command: `sudo systemctl enable --now shop-api`. Confirm with `curl -s localhost:8080`."
  - "Part 2 is the firewall file from the hardening topic plus a `tcp dport 8080 accept` line, then `sudo nft -f /etc/nftables.conf` and `sudo systemctl enable nftables`."
  - "Part 3 is the drop-in (`PasswordAuthentication no`, `PermitRootLogin no`), `sudo sshd -t`, `sudo systemctl reload ssh`, and `ssh -i ~/keys/ben ben@localhost whoami` printing `ben`."
