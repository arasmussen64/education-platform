id: step-run-the-service
stage: fill_in
runtime: lab
lab:
  init: systemd
rev: 2
title: "Step 1 of the runbook: run the service"
prompt: |
  The checkpoint's build, with two of its three parts already done for you: on this server the firewall is up and saved, and SSH is hardened. One part is left. `shop-api` is installed (`/etc/systemd/system/shop-api.service`) but not running. Make it start on every boot and start it now, so `systemctl is-active shop-api` says `active` and `curl -s localhost:8080` answers. Then try it from another machine, through the firewall: `from-office curl -s http://10.0.9.1:8080/` (`from-office` runs a command on a second machine on the office network, where this server's address is `10.0.9.1`). Then run the checks, which test the whole server, the parts done for you included.
hints:
  - "Enabling a unit makes it start at boot; starting it runs it now. `sudo systemctl enable --now shop-api` does both in one step."
  - "Confirm with `systemctl is-active shop-api` and `systemctl is-enabled shop-api` (both must be right), then `curl -s localhost:8080` and `from-office curl -s http://10.0.9.1:8080/`."
  - "If it isn't `active`, `systemctl status shop-api` and `journalctl -u shop-api` say why."
