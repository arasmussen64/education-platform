id: step-run-the-service
stage: fill_in
runtime: lab
lab:
  init: systemd
rev: 1
title: "Step 1 of the runbook: run the service"
prompt: |
  The checkpoint's build, with two of its three parts already done for you: on this server the firewall is up and persisted and SSH is hardened. One part is left. `shop-api` is installed (`/etc/systemd/system/shop-api.service`) but not running. Make it start on every boot and start it now, so `systemctl is-active shop-api` says `active` and `curl -s localhost:8080` answers. Then run the checks, which test the whole server, the parts done for you included.
hints:
  - "Enabling a unit makes it start at boot; starting it runs it now. `sudo systemctl enable --now shop-api` does both in one step."
  - "Confirm with `systemctl is-active shop-api` and `systemctl is-enabled shop-api` (both must be right), then `curl -s localhost:8080`."
  - "If it isn't `active`, `systemctl status shop-api` and `journalctl -u shop-api` say why."
