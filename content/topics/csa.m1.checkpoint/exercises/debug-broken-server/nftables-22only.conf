#!/usr/sbin/nft -f
# The shop server's firewall, default-deny, but someone forgot to open the
# API's port: only SSH (22) gets through, so the API on 8080 is blocked.
flush ruleset
table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		tcp dport 22 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
