id: review-mcq-nested-order
type: mcq
rev: 1
prompt: |
  `grid = [[1, 2], [3, 4]]`. Which comprehension flattens it to `[1, 2, 3, 4]`, and what's the catch?
choices:
  - '`[x for x in row for row in grid]`; no catch'
  - '`[x for row in grid for x in row]`; the for clauses go outer first, the opposite of how the result reads, so past one level a loop is clearer'
  - '`[row for row in grid]`; it already is flat'
  - '`[grid[x] for x in range(4)]`; a grid is just a list'
answer: 1
explanation: |
  With two `for` clauses in one comprehension, they come in the order you'd write the loops: `for row in grid` first, then `for x in row`. That's valid and common for one level of flattening, but it reads backwards from the result, and one more level or a condition in the middle turns it into a puzzle. `[x for x in row for row in grid]` uses `row` before it exists and fails.
skills: [list-comp, judgement]
