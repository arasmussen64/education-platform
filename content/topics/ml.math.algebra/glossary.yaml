- term: equation
  definition: A claim that two things are equal, with a left side, an equals sign and a right side, such as `6x + 8 = 50`. Solving it means finding the value of the unknown that makes it true.
- term: exponent
  definition: The small raised number in a power, saying how many copies of the base are multiplied together. In `5 ** 3` the exponent is 3, so it means `5 * 5 * 5`.
