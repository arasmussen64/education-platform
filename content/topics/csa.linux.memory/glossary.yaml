- term: virtual memory
  definition: "Each process's own private range of addresses, which the kernel maps onto physical memory in pages, so processes can't see each other's memory."
- term: RSS
  aliases: [resident set size]
  definition: "Resident set size, how much physical memory a process is actually using, as opposed to the virtual memory it has reserved."
- term: page cache
  definition: "Copies of recently read or written files that the kernel keeps in otherwise unused memory and gives back the moment a program needs it."
- term: swapping
  aliases: [swap space]
  definition: "The kernel moving idle memory pages out to disk space set aside for it, swap, when memory is short. Some swap in use is normal; constant swapping in and out is a shortage."
- term: thrashing
  definition: "A machine so short of memory that it spends its time moving pages to disk and back, so everything crawls. `vmstat` shows steady `si` and `so`."
- term: huge page
  definition: "A memory page of 2 MB or 1 GB instead of 4 KB, which saves bookkeeping for programs that hold a lot of memory, such as databases."
- term: OOM killer
  definition: "The part of the kernel that kills a process when memory runs out, either on the whole machine or inside one cgroup's limit. Its victim exits with status 137."
- term: cgroup
  aliases: [control group]
  definition: "Control group, a set of processes the kernel counts together and can limit, shown as a folder of files under `/sys/fs/cgroup` such as `memory.max`."
