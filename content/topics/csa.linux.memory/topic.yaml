prove:
  build: build-contain-the-leak
  debug: debug-oomkilled
  explain:
    prompt: |
      A teammate says a 16 GB server is "almost out of memory" because `free` shows 400 MB free, and separately that a container on a Kubernetes node "keeps getting killed although the node has 20 GB free". Explain, in your own words: what virtual memory and the page cache are and which number in `free` tells you whether the server is short of memory; what swap is for, and how you'd tell harmless swap use from a machine that is thrashing; how the kernel's OOM killer chooses a process and what its log line tells you; and why a container is killed at its own memory limit while the node still has memory, and what to change.
    rubric:
      - id: virtual-and-cache
        required: true
        description: "Each process has its own virtual address space mapped to physical pages; the kernel uses otherwise-idle RAM as a page cache for files, which free counts under buff/cache and gives back when needed; MemAvailable (available) is the number that says how much a new program could use."
      - id: swap
        required: true
        description: "Swap is disk space the kernel moves idle anonymous pages to; some swap used is normal and frees RAM for the cache; continuous swap-in and swap-out (vmstat si and so) with high wait means thrashing, which is a memory shortage."
      - id: oom
        required: true
        description: "When memory and swap are exhausted the kernel kills the process with the highest oom_score, roughly the biggest, adjusted by oom_score_adj; the log line names the PID, the program and its anon-rss; a process killed this way exits with 137 (128 plus SIGKILL's 9)."
      - id: container-limit
        required: true
        description: "A container runs in a cgroup whose memory.max is its limit; exceeding it triggers an OOM kill inside the cgroup regardless of the node's free memory (OOMKilled, exit 137, memory.events oom_kill); raise the limit, fix the leak, or set requests and limits that match what the program really uses."
      - id: huge-pages
        required: false
        description: "Huge pages (2 MB rather than 4 KB) cut page-table overhead and TLB misses for large memory users like databases; transparent huge pages can cause latency spikes and are often disabled for them."
    model_answer: |
      Every process sees its own private range of addresses, virtual memory, and the kernel maps those addresses onto physical pages of RAM a page at a time, so processes can't see each other's memory and can together ask for more than the machine has. RAM that nothing is using would be wasted, so the kernel fills it with the page cache: copies of files recently read or written, which make the next read fast and can be dropped the moment a program needs the space. That's why free shows 400 MB free on a healthy 16 GB server: most of the rest is cache, and free lists it under buff/cache. The number that answers "is this server short of memory" is available, MemAvailable in /proc/meminfo, which counts the free memory plus the cache the kernel could give back. Swap is disk space the kernel can move memory pages to, and it uses it for anonymous pages, program data, that haven't been touched in a long time, which frees RAM for things that are actually used. Some swap in use is normal and good. The problem is thrashing: vmstat 1 showing non-zero si and so every second means pages are being written out and read back constantly, programs are waiting on the disk, and the machine genuinely needs more memory or less load. When memory and swap are both gone, the kernel's OOM killer picks a victim: the process with the highest oom_score, which is roughly the one using the most memory, adjusted by oom_score_adj so that an operator can protect a critical process or make another the preferred victim. Its log line in dmesg or the journal reads "Out of memory: Killed process 4321 (java) total-vm:... anon-rss:..." where anon-rss is the memory the process really held, and the process exits with status 137, which is 128 plus 9 for SIGKILL. A container is a group of processes in a cgroup, and the container's memory limit is that cgroup's memory.max. When the processes inside reach it, the kernel runs the OOM killer inside that cgroup only, so the container's main process is killed while the node has 20 GB free, and Kubernetes reports OOMKilled with exit code 137; the cgroup's memory.events shows oom_kill counting up. The fix is to find out what the program really needs, raise the limit to that or fix the leak if it grows without bound, and set the request close to the limit so the scheduler places the pod where that memory exists. Huge pages, 2 MB instead of 4 KB, cut the bookkeeping for programs that hold a lot of memory, like databases, though transparent huge pages can cause latency spikes and are often turned off for them.
