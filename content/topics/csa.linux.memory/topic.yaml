id: csa.linux.memory
kind: topic
status: ready
title: "Memory and the OOM killer"
summary: "How Linux hands out memory: virtual memory and pages, the page cache that makes 'free' look small, swap and when it's a problem, huge pages, how the kernel picks a process to kill when memory runs out, and why a container dies at its own limit while the server has plenty."
prerequisites: [csa.linux.processes]
estimated_minutes: 90
rev: 1
objectives:
  - "Explain virtual memory and pages, and read `free` and `/proc/meminfo`: why `free` is small on a healthy server and `available` is the number that matters."
  - "Explain paging and swap, tell harmless swap use from thrashing with `vmstat`'s `si` and `so`, and say what huge pages are for."
  - "Read the OOM killer's log in `dmesg` or the journal, explain how the kernel chooses its victim and how `oom_score_adj` changes that, and recognise exit code 137."
  - "Explain why a container is killed when it reaches its own cgroup memory limit even when the node has memory to spare, and how requests and limits relate."
