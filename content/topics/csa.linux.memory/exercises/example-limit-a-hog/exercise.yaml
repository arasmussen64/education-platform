id: example-limit-a-hog
stage: worked_example
runtime: lab
lab:
  init: systemd
rev: 1
title: "Read the memory, then run out of it on purpose"
prompt: |
  The lab machine has `memhog`, a program that takes a number of megabytes of memory, uses them, holds them for a few seconds and exits. The walkthrough reads the machine's memory the right way, then runs `memhog` inside a limit of 64 MB and asks it for 200, so you can watch the kernel's OOM killer do exactly what it does to a container that reaches its limit. Type each line yourself in the lab's shell and read what it prints before you type the next.
steps:
  - label: "Read free"
    lines: "1"
    note: "`free -m` in megabytes. `free` is small and `buff/cache` large on a machine that's been running: the kernel uses idle memory as a cache for files. `available` is what a new program could use, and the number to watch."
  - label: "The same from the source"
    lines: "2"
    note: "`free` reads `/proc/meminfo`. `MemAvailable` is the `available` column; `Cached` is most of `buff/cache`. The values are in kilobytes."
  - label: "Watch for swapping"
    lines: "3"
    note: "`vmstat 1 3` prints three lines a second apart. The `si` and `so` columns are swap in and swap out per second; zeros, as here, mean no swapping. Steady non-zero numbers there, with a high `wa`, mean the machine is thrashing."
  - label: "Run a hog inside a limit"
    lines: "4"
    note: "`systemd-run` runs a command as a service on the spot, here called `hog`. `MemoryMax=64M` is the cgroup's `memory.max`: the most the service may use. `MemorySwapMax=0` says it may not swap either. The hog asks for 200 MB, more than it's allowed."
  - label: "See what happened to it"
    lines: "5"
    note: "`Result=oom-kill`: the kernel killed it when it reached the limit, while the machine had gigabytes free. `ExecMainStatus=9` is the signal, `SIGKILL`; a shell would report exit status 137, 128 plus 9. Try `systemctl status hog` too, and `sudo systemctl reset-failed hog` clears the record so you can run it again."
  - label: "Read the kernel's log line"
    lines: "6"
    note: "`journalctl -k` is the kernel's log. Its line names the victim (`memhog`), its PID, `anon-rss`, the memory it really held when it died, and `oom_score_adj`. On a real server this is the line to find first when something exits with 137."
  - label: "Save what you found"
    lines: "7"
    note: "The result as systemd reports it, and the one line from `/proc/meminfo` that says how much memory this machine really has to give."
skills: [virtual-memory, oom-killer, container-memory]
