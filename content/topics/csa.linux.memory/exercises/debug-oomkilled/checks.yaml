# The checks for "Killed, again and again": the cache and the indexer stay
# up, each still inside a real limit (a finite one of at most 512 MB, with
# no swap) and still doing its work, and the database is the kernel's last
# choice of victim, in its unit as well as in the running process.
#
# The limit checks are what make this a lab about limits. Without them,
# MemoryMax=infinity "fixes" both services, and so does letting them swap:
# a cache that needs 100 MB stays up at a 32 MB limit with the rest of its
# pages on disk (tried on Docker Desktop, 2026-11-10). wrong/limits-removed.sh
# and wrong/swap-instead-of-room.sh prove both are caught.
checks:
  - id: cache-stays-up
    description: "shop-cache is running, and stays running."
    command: |
      for _ in $(seq 1 8); do
        state=$(systemctl is-active shop-cache)
        [ "$state" = active ] && break
        sleep 1
      done
      pid=$(systemctl show -p MainPID --value shop-cache)
      sleep 3
      if [ "$(systemctl is-active shop-cache)" = active ] && [ "$(systemctl show -p MainPID --value shop-cache)" = "$pid" ]; then
        echo active
      else
        echo "not steadily active (last state: $state)"
      fi
    expect:
      equals: active
  - id: cache-limit-kept
    description: "shop-cache still has a hard memory limit, of no more than 512 MB."
    # "infinity" means the limit was taken away; it isn't a number, so the
    # comparison fails.
    command: |
      limit=$(systemctl show shop-cache -p MemoryMax --value)
      if [ "$limit" = infinity ]; then echo "no limit"; else echo "$limit"; fi
    expect:
      lte: 536870912
  - id: indexer-stays-up
    description: "shop-indexer is running, and stays running."
    command: |
      for _ in $(seq 1 8); do
        state=$(systemctl is-active shop-indexer)
        [ "$state" = active ] && break
        sleep 1
      done
      pid=$(systemctl show -p MainPID --value shop-indexer)
      sleep 3
      if [ "$(systemctl is-active shop-indexer)" = active ] && [ "$(systemctl show -p MainPID --value shop-indexer)" = "$pid" ]; then
        echo active
      else
        echo "not steadily active (last state: $state)"
      fi
    expect:
      equals: active
  - id: indexer-limit-kept
    description: "shop-indexer still has a hard memory limit, of no more than 512 MB."
    command: |
      limit=$(systemctl show shop-indexer -p MemoryMax --value)
      if [ "$limit" = infinity ]; then echo "no limit"; else echo "$limit"; fi
    expect:
      lte: 536870912
  - id: no-swap
    description: "Neither of the two may swap: MemorySwapMax is 0 for shop-cache and for shop-indexer."
    command: echo "$(systemctl show shop-cache -p MemorySwapMax --value) $(systemctl show shop-indexer -p MemorySwapMax --value)"
    expect:
      equals: "0 0"
  - id: programs-do-their-work
    description: "shop-cache and shop-indexer each run their own program, unchanged, holding its whole working set in memory."
    # A program that uses less memory fits any limit: the cache edited to
    # hold 20 MB, or replaced with sleep, stays up inside the 32 MB that was
    # killing it (tried on Docker Desktop, 2026-11-11). Once started, the
    # cache holds 100 MB and the indexer 60 MB, and with no swap all of it
    # is in each cgroup's memory.current. wrong/cache-made-smaller.sh proves
    # the shortcut is caught.
    command: |
      for _ in $(seq 1 10); do
        cache=$(cat /sys/fs/cgroup/system.slice/shop-cache.service/memory.current 2>/dev/null || echo 0)
        indexer=$(cat /sys/fs/cgroup/system.slice/shop-indexer.service/memory.current 2>/dev/null || echo 0)
        [ "$cache" -ge 100000000 ] && [ "$indexer" -ge 60000000 ] && break
        sleep 1
      done
      [ "$cache" -ge 100000000 ] && [ "$indexer" -ge 60000000 ]
  - id: db-protected
    description: "shop-db's oom_score_adj is -500 or lower, in its unit and in the running process, so a restart keeps it."
    # The running process alone can be changed on the spot (writing to
    # /proc/PID/oom_score_adj) while the unit still says 1000, and the next
    # restart makes the database the first victim again. So the larger of
    # the two has to be low enough; wrong/db-only-at-runtime.sh proves it.
    command: |
      unit=$(systemctl show shop-db -p OOMScoreAdjust --value); unit=${unit:-0}
      running=$(cat "/proc/$(systemctl show shop-db -p MainPID --value)/oom_score_adj")
      if [ "$unit" -gt "$running" ]; then echo "$unit"; else echo "$running"; fi
    expect:
      lte: -500
