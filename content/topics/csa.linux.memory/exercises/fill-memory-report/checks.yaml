# The checks for "Finish the memory report": each of the script's lines
# against the same question answered directly, run as the learner.
checks:
  - id: no-gaps
    description: "The script has no ... left in it."
    command: "! grep -q '\\.\\.\\.' /home/learner/bin/memory-report"
  - id: available-line
    description: "The available line is the memory a new program could use, in MB, as /proc/meminfo reports it."
    # The script and this check read MemAvailable a moment apart, and on a
    # busy machine the two readings differ by a few MB, so allow a little.
    # MemFree, the likely mistake, is hundreds of MB off.
    command: |
      kb=$(grep '^MemAvailable:' /proc/meminfo | awk '{print $2}')
      reported=$(runuser -u learner -- /home/learner/bin/memory-report | sed -n 's/^available: \([0-9][0-9]*\) MB$/\1/p')
      test -n "$reported" && test $((reported - kb / 1024)) -le 64 && test $((kb / 1024 - reported)) -le 64
  - id: swap-line
    description: "The swap line is the swap in use, in MB."
    # The same two readings a moment apart, of the whole machine: on a CI
    # runner where a neighbouring lab is filling memory, the swap in use
    # moves between them, so allow a little. The total, the likely mistake,
    # is thousands of MB off.
    command: |
      used=$(free -m | awk '/^Swap:/ {print $3}')
      reported=$(runuser -u learner -- /home/learner/bin/memory-report | sed -n 's/^swap used: \([0-9][0-9]*\) MB$/\1/p')
      test -n "$reported" && test $((reported - used)) -le 64 && test $((used - reported)) -le 64
  - id: top-process-line
    description: "The top process line names the process holding the most memory (memhog, holding 150 MB)."
    command: runuser -u learner -- /home/learner/bin/memory-report | grep '^top process:'
    expect:
      matches: "^top process: memhog 1[45][0-9] MB$"
  - id: oom-kills-line
    description: "The oom kills line is how many times the kernel's log says it killed a process for running out of memory."
    # First a kill of the check's own (a throwaway program in a 32 MB limit),
    # so a report that always says 0 can't pass on a machine with no kills
    # yet. The kernel's log is shared by every container on the machine, and
    # in CI other memory labs run alongside this one and add kills to it, so
    # the report's count must lie between the counts taken just before and
    # just after it runs; with only this lab running, both are one number.
    command: |
      kills() { journalctl -k --no-pager 2>/dev/null | grep -c 'Killed process'; }
      start=$(kills)
      systemd-run --quiet --wait --collect -p MemoryMax=32M -p MemorySwapMax=0 /usr/local/bin/memhog 64 1 > /dev/null 2>&1
      for _ in $(seq 50); do [ "$(kills)" -gt "$start" ] && break; sleep 0.1; done
      before=$(kills)
      line=$(runuser -u learner -- /home/learner/bin/memory-report | grep '^oom kills:')
      after=$(kills)
      n=${line#oom kills: }
      case "$n" in '' | *[!0-9]*) exit 1 ;; esac
      [ "$line" = "oom kills: $n" ] && [ "$n" -ge "$before" ] && [ "$n" -le "$after" ]
