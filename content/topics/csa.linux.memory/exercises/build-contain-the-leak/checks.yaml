# The checks for "Contain the leak": the limit and the swap setting, the
# kill and the restart, the database's protection, and the report. The
# descriptions say "the leaking service" and not its name, because finding
# out which one it is is the lab's first step and the page shows them
# before any attempt.
checks:
  - id: limit-set
    description: "The leaking service has a hard memory limit of 128 MB (MemoryMax)."
    command: systemctl show shop-indexer -p MemoryMax --value
    expect:
      equals: "134217728"
  - id: swap-off
    description: "The leaking service may not swap (its MemorySwapMax is 0)."
    command: systemctl show shop-indexer -p MemorySwapMax --value
    expect:
      equals: "0"
  - id: killed-at-limit
    description: "The kernel has killed it at its limit at least once (the service's journal says so)."
    # At 16 MB a second the leak reaches 128 MB about eight seconds after a
    # restart, so a check run straight after one waits for the first kill.
    command: |
      for _ in $(seq 1 20); do
        n=$(journalctl -u shop-indexer --no-pager 2>/dev/null | grep -c -i 'oom')
        [ "$n" -ge 1 ] && break
        sleep 1
      done
      echo "$n"
    expect:
      gte: 1
  - id: still-supervised
    description: "The leaking service is still running (or being restarted), not stopped."
    # is-active exits non-zero for "activating", which is a fine answer here.
    command: systemctl is-active shop-indexer || true
    expect:
      matches: "^(active|activating)$"
  - id: db-protected
    description: "shop-db's oom_score_adj is -500 or lower, in its unit and in the running process, so a restart keeps it."
    # The running process alone can be changed on the spot (writing to
    # /proc/PID/oom_score_adj) while the unit says nothing, and the next
    # restart puts it back to 0. So the larger of the two has to be low
    # enough; wrong/db-only-at-runtime.sh proves it. Unset is 0.
    command: |
      unit=$(systemctl show shop-db -p OOMScoreAdjust --value); unit=${unit:-0}
      running=$(cat "/proc/$(systemctl show shop-db -p MainPID --value)/oom_score_adj")
      if [ "$unit" -gt "$running" ]; then echo "$unit"; else echo "$running"; fi
    expect:
      lte: -500
  - id: peak-reported
    description: "~/report/peak.txt holds the leaking service's peak memory in bytes, read before it had a limit, so more than the 128 MB the limit allows."
    # Restarting the service gives it a new cgroup whose memory.peak starts
    # again from nothing, and under a 128 MB limit (134217728 bytes) it can
    # never go higher. A peak read after the limit was 37 MB (Docker
    # Desktop, 2026-11-11), which a bound of 20 MB let through; above the
    # limit, it proves the peak was read first. wrong/peak-read-after-limit.sh
    # proves it is caught.
    command: cat /home/learner/report/peak.txt
    expect:
      matches: "^[0-9]+$"
      gt: 134217728
