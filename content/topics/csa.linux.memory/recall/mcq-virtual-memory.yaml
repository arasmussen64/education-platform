id: mcq-virtual-memory
type: mcq
rev: 1
prompt: |
  Two processes on the same server both report that a variable lives at address `0x7f3a1c00`. How can that be?
choices:
  - "It can't; the kernel gives every process different addresses"
  - "Each process has its own virtual address space, and the kernel maps each one's pages to different physical memory, so the same virtual address means different RAM in each process"
  - "They share that memory, so one can read the other's variable"
  - "One of them is swapped out"
answer: 1
explanation: |
  Addresses a program sees are virtual: private to that process and translated by the kernel and the CPU, page by page, into physical locations. Two processes using the same virtual address are looking at two different pages of RAM (unless they deliberately share memory). That translation is also what lets the kernel move a page to swap or drop a cached file page without the program noticing anything but a delay.
skills: [virtual-memory]
