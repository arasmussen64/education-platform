id: mcq-leak-signs
type: mcq
rev: 2
prompt: |
  A service is OOM-killed every two days, restarts, and is fine for two days. Its memory graph is a sawtooth: a steady climb to the limit, then a drop. What does that pattern tell you, and what doesn't fix it?
choices:
  - "The page cache is filling the limit, and dropping the caches only clears it for a while"
  - "The server is short of RAM for its load, and restarting the service only hides the shortage"
  - "The limit is set too low for normal use, and changing the program's code would not help"
  - "The program leaks memory, and raising the limit only makes each climb take longer"
answer: 3
explanation: |
  A steady climb with no plateau means memory in use grows with time rather than with load: a leak. The program keeps allocating and never frees, so it will reach any limit eventually, and doubling the limit turns two days into four. The fix is in the program: measure which part grows (heap profiles, `memory.current` over time) and fix it. In the meantime a scheduled restart is an honest stopgap.

  A limit that was simply too low, or a server short of RAM, would look different: usage would rise to what the work needs and stay there, moving with the load, not climb at the same slope for two days whatever the service is doing. And caches don't leak: the kernel takes the page cache back by itself when memory is needed, and it does that before it kills anything.
skills: [oom-killer, container-memory]
