id: mem-hugepages
type: predict_shell
rev: 1
prompt: |
  The same `/proc/meminfo` says how many huge pages are reserved and how big each is. The command prints those two lines as they are. What is printed?
files:
  meminfo: |
    MemTotal:       16396288 kB
    MemFree:          421888 kB
    MemAvailable:    6002688 kB
    HugePages_Total:     512
    HugePages_Free:      512
    Hugepagesize:       2048 kB
command: grep -E '^(HugePages_Total|Hugepagesize):' meminfo
expected_output: |
  HugePages_Total:     512
  Hugepagesize:       2048 kB
explanation: |
  512 huge pages of 2,048 kB each: 1 GB of RAM set aside in 2 MB pages instead of 4 KB ones, waiting for a program that asks for them, typically a database. `HugePages_Free` being 512 too says nothing has claimed them yet, so that gigabyte is currently unusable by anything else. Reserved huge pages are a trade: less page-table overhead for the program that wants them, less memory for everyone else.
skills: [swap-paging]
