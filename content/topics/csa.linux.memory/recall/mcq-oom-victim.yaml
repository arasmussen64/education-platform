id: mcq-oom-victim
type: mcq
rev: 2
prompt: |
  A server runs out of memory and swap. Which process does the kernel's OOM killer kill, and how can you influence the choice?
choices:
  - "The one with the lowest `oom_score`, roughly the smallest; an `oom_score_adj` of -1000 puts it first"
  - "The one with the highest `oom_score`, roughly the biggest one; `oom_score_adj` tilts that score"
  - "The one that asked for memory last, since it caused the shortage; nothing changes that choice"
  - "The one started most recently, since it has the least work to lose; `systemctl` sets the order"
answer: 1
explanation: |
  The kernel scores every process by how much memory killing it would free, so the highest score, not the lowest, is the victim. Then it tilts the score with `oom_score_adj`: set -1000 on the database (`echo -1000 > /proc/PID/oom_score_adj`, or `OOMScoreAdjust=` in its unit file) and it's never chosen; set 500 on a cache you can lose and it goes first. systemd and Kubernetes set these values for you based on a workload's importance.

  Neither the last process to ask for memory nor the newest one is singled out: the request that failed only triggers the search, and age plays no part. Killing the biggest process is usually right, because it's usually the one that leaked.
skills: [oom-killer]
