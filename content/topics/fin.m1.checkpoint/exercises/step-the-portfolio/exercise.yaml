title: "Step 4: the portfolio, from an outline"
prompt: |
  The loan part is done. The four portfolio functions are only an outline: a comment saying what each does and a `...` where its body goes. Replace each `...` with the code its comment describes, so the program prints the full report, ending:

  ```
  annualized return 25.4%
  volatility 24.4%
  max drawdown 8.5%
  ```

  A `...` on its own line is legal Python that does nothing, so the program runs until a function's missing result is used, then stops with an error about `NoneType`.
hints:
  - "`simple_returns`: a loop over `range(1, len(prices))`, appending `prices[i] / prices[i - 1] - 1`."
  - "`annualized_return`: seven prices are six monthly periods, so `years = (len(prices) - 1) / periods_per_year`, half a year here. Then `(prices[-1] / prices[0]) ** (1 / years) - 1`."
  - "`volatility`: the sample standard deviation divides the sum of squared distances by `len(returns) - 1`; `** 0.5` takes the square root."
  - "`max_drawdown`: start `peak` at the first price and the worst fall at 0; in the loop, `peak = max(peak, price)` and `worst = max(worst, 1 - price / peak)`."
