title: "Step 2: one month of the schedule"
prompt: |
  The whole program is here except one month's arithmetic inside `print_schedule`: the interest, the part that repays the loan, and the new balance. Replace each `...` with an operator so the program prints the full report, starting `month 1: interest 90.00, principal 791.64, balance 14,208.36`.

  Every `...` stands for an operator, so until all three are replaced Python can't run the program at all, and shows a syntax error.
hints:
  - "This month's interest is the balance still owed times the monthly rate: 15,000 × 0.006 = 90.00 in month 1."
  - "The payment covers the interest first; what's left of it repays the loan: 881.64 − 90.00 = 791.64."
  - "The balance goes down by the part that repays the loan, not by the whole payment."
