id: step-the-schedule
stage: fill_in
rev: 1
title: "Step 3: every month, and the totals"
prompt: |
  The whole program is here except three operators in `print_schedule`: in the loop that counts the months, in the running total of interest, and in the total paid. Replace each `...` with an operator so the program prints all 18 months, then `payment 881.64`, `total paid 15,869.49` and `total interest 869.49`, then the portfolio lines.

  Every `...` stands for an operator, so until all three are replaced Python can't run the program at all, and shows a syntax error.
hints:
  - "`range(1, n)` stops before `n`. To count months 1 to 18, the end has to be one more than `months`."
  - "A running total grows by each month's interest."
  - "Every month's payment is the same, so the total paid is the payment times the number of months."
