id: step-payment
stage: fill_in
rev: 1
title: "Step 1: the monthly rate and the payment"
prompt: |
  The whole program is here except two parts: the monthly rate and the payment formula. Replace each `...` with an operator so the program prints the full report (the schedule, the totals and the portfolio lines; the first line is `month 1: interest 90.00, principal 791.64, balance 14,208.36` and the payment is `881.64`).

  Every `...` stands for an operator, so until all four are replaced Python can't run the program at all, and shows a syntax error.
hints:
  - "The rate in the schedule is per month: a yearly rate of 7.2% is 0.6% a month, the yearly rate divided by 12."
  - "The level payment is `principal * rate / (1 - (1 + rate) ** -periods)`: one minus one-plus-the-rate to the power of minus the number of periods."
  - "`(1 + rate) ** -periods` is one over `(1 + rate) ** periods`: what a payment made at the end is worth today, per unit."
