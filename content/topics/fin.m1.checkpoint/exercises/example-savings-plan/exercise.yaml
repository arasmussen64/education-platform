id: example-savings-plan
stage: worked_example
rev: 1
title: "A savings plan and a fund's months"
prompt: |
  Before the loan and the portfolio, the same shape in another story: 300 saved every month at 6% a year, shown month by month, then a quick look at how a made-up fund's price moved. Press **Run**, then read how each part works. Notice how the program is split: the inputs first, one function for each job, and a few lines at the end that call them.
steps:
  - label: "The inputs, at the top"
    lines: "1-4"
    note: "Everything the program works on is named once, at the top, so changing the story means changing four lines. A rate is a decimal: 6% is `0.06`."
  - label: "A schedule, one month per line"
    lines: "7-17"
    note: "The monthly rate is the yearly rate divided by 12. Each month the interest is the balance so far times that rate; then the balance grows by the interest and the deposit. A running total adds up the interest as it goes. Nothing is rounded until it's printed: `:,.2f` gives two decimal places and commas between thousands. A loan schedule has the same loop, with a payment taken off instead of a deposit added."
  - label: "Returns from a price list"
    lines: "20-24"
    note: "Each month's change is the price over the one before, minus 1. Five prices give four changes, so the loop starts at position 1 and looks back one."
  - label: "A running peak"
    lines: "27-33"
    note: "`peak = max(peak, price)` keeps the highest price seen so far as the loop walks the list. Here it only records the peaks; the fall from the peak to each price, `1 - price / peak`, is the drawdown, and the largest of those is the maximum drawdown."
  - label: "Calling the parts"
    lines: "36-39"
    note: "The last lines only call the functions and print. Because every function takes its inputs as parameters, each can be tested on its own with other numbers, which is how the checks of the build test yours."
