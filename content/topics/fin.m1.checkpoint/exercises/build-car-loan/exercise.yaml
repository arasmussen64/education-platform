id: build-car-loan
stage: build
rev: 1
title: "The car loan and a year of prices"
prompt: |
  The same two reports for another story, from a blank editor. Begin with these four lines (the prices are made up):

  ```python
  principal = 18000
  annual_rate = 0.048
  months = 24
  prices = [80.0, 82.0, 79.0, 84.0, 88.0, 85.0, 78.0, 81.0, 86.0, 90.0, 87.0, 92.0, 94.0]
  ```

  **The car loan.** 18,000 at 4.8% a year, repaid in 24 equal monthly payments; the monthly rate is the yearly rate divided by 12. Write `payment(principal, rate, periods)`, the level payment for a rate per period (`principal * rate / (1 - (1 + rate) ** -periods)`), and `print_schedule(principal, annual_rate, months)`, which prints each month's interest (the balance owed times the monthly rate), the part of the payment that repays the loan, and the balance left; then the payment, the total paid and the total interest.

  **The portfolio.** `prices` holds a made-up stock's closing price at the end of each month for a year. Write `simple_returns(prices)` (each price over the one before, minus 1), `annualized_return(prices, periods_per_year)` (`(last / first) ** (1 / years) - 1`, with `years` the number of periods divided by `periods_per_year`), `volatility(returns)` (the sample standard deviation, dividing by one less than the number of returns; the report multiplies it by the square root of 12) and `max_drawdown(prices)` (the largest fall from the highest price so far, as a decimal).

  Round only when printing: money to the cent with commas, percentages to one decimal place. The program prints:

  ```
  month 1: interest 72.00, principal 716.07, balance 17,283.93
  month 2: interest 69.14, principal 718.94, balance 16,564.99
