id: review-mcq-missing-f
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  name = "Ada"
  print("Hi, {name}!")
  ```
choices:
  - '`Hi, Ada!`'
  - '`Hi, {name}!`'
  - '`Hi, name!`'
  - 'An error'
answer: 1
explanation: |
  Without the `f` before the quote, it's ordinary text, so the braces and the word inside are printed just as they are. With `f"Hi, {name}!"`, it prints `Hi, Ada!`.
skills: [fstrings]
