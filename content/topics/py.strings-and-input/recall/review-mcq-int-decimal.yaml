id: review-mcq-int-decimal
type: mcq
rev: 1
prompt: |
  You run this line and type `3.5`. What happens?

  ```python
  size = int(input("Size? "))
  ```
choices:
  - '`size` refers to `3`: the decimal part is dropped'
  - '`size` refers to `4`: it rounds'
  - 'It stops with a `ValueError`'
  - '`size` refers to `3.5`'
answer: 2
explanation: |
  `int()` can only read text that looks like a whole number, so `int("3.5")` stops with `ValueError: invalid literal for int() with base 10: '3.5'`. For numbers that might have decimals, use `float(input(...))`.
skills: [convert]
