id: review-predict-format
type: predict_output
rev: 1
prompt: |
  What will this program print?
code: |
  print(f"{3.14159:.2f}")
  print(f"{10 / 4}")
  print(f"{2:.2f}")
expected_output: |
  3.14
  2.5
  2.00
explanation: |
  `:.2f` rounds to exactly two decimal places: `3.14159` becomes `3.14`, and even the whole number `2` becomes `2.00`. Without it, a value appears as usual: `10 / 4` is `2.5`.
skills: [fstrings]
