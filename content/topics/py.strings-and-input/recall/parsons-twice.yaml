id: parsons-twice
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Twice 7 is 14`. One line is a decoy that doesn't belong.
lines:
  - 'text = "7"'
  - 'number = int(text)'
  - 'double = number * 2'
  - 'print(f"Twice {text} is {double}")'
distractors:
  - 'double = text * 2'
explanation: |
  `"7"` is text, so it must be converted with `int()` before any arithmetic; `text * 2` would repeat the text and give `"77"`. Each line uses the one before it, and the f-string prints last.
skills: [convert, fstrings]
