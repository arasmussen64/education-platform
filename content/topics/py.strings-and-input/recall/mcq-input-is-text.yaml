id: mcq-input-is-text
type: mcq
rev: 1
prompt: |
  A program runs this line, and you type `7`:

  ```python
  answer = input("Pick a number: ")
  ```

  What type is `answer`?
choices:
  - '`int`'
  - '`float`'
  - 'It depends on what you type'
  - '`str`'
answer: 3
explanation: |
  `input()` always gives text, a `str`, whatever you type: here it's `"7"`. To get the number 7, convert it: `int(input("Pick a number: "))`.
skills: [input-text]
