id: predict-fstring
type: predict_output
rev: 1
prompt: |
  What will this program print?
code: |
  item = "tea"
  price = 2.5
  print(f"{item}: {price * 2}")
  print(f"{price:.2f}")
expected_output: |
  tea: 5.0
  2.50
explanation: |
  In an f-string, each pair of curly braces is replaced by its value, and calculations work inside them: `{price * 2}` becomes `5.0`. `:.2f` shows a number with exactly two decimal places, so `2.5` appears as `2.50`.
skills: [fstrings]
