id: mcq-plus-on-input
type: mcq
rev: 1
prompt: |
  You run this program and type `4`, then `5`. What does it print?

  ```python
  a = input("First? ")
  b = input("Second? ")
  print(a + b)
  ```
choices:
  - '`9`'
  - '`45`'
  - '`4 5`'
  - 'An error'
answer: 1
explanation: |
  Both answers are text, `"4"` and `"5"`, and `+` joins text, so it prints `45`. To add them as numbers, convert each one: `a = int(input("First? "))`. Same lesson as the calculator in Values and types.
skills: [input-text, convert]
