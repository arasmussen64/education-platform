prove:
  build: build-km-to-miles
  debug: debug-shopping
  explain:
    prompt: |
      A friend's program asks for an age, then adds 1:

      ```python
      age = input("Age? ")
      print(age + 1)
      ```

      It stops with `TypeError: can only concatenate str (not "int") to str`. In your own words: why does it fail, and how should they fix it?
    rubric:
      - id: text
        required: true
        description: "input() always gives text (a str), even when the person types digits."
      - id: mismatch
        required: true
        description: "Python won't add a number to text, so age + 1 is a TypeError."
      - id: convert
        required: true
        description: "The fix: convert first, for example age = int(input(\"Age? \")), then add."
      - id: decimals
        required: false
        description: "Mentions float() for numbers with decimals, since int() can't read \"3.5\"."
    model_answer: |
      input() always gives back text, a str, even when the person types digits like 36. So age is the text "36", and Python won't add the number 1 to text: that's the TypeError. The fix is to turn the text into a number first, with age = int(input("Age? ")). Then age + 1 is 37. For numbers that might have decimals, float() is the one to use, because int() can't read text like "3.5".
