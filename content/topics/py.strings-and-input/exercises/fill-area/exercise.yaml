id: fill-area
stage: fill_in
rev: 1
title: "The area of a rectangle"
prompt: |
  This program should ask for a rectangle's width and height, both whole numbers, and print its area. Line 1 is done. Replace each `...` so that typing `3` and then `4` prints:

  ```
  Area: 12
  ```
hints:
  - "Line 2 can follow the same pattern as line 1, with its own question."
  - "Inside the braces you can calculate: the area is `width * height`."
skills: [convert, fstrings]
