id: example-greeting
stage: worked_example
rev: 1
title: "A greeting that does maths"
prompt: |
  This program asks two questions, then answers. Press **Run** and type your answers when it asks, then read how each line works.
steps:
  - label: "Ask, and keep the answer"
    lines: "1"
    note: "`input()` shows the question, waits for Enter, and gives what was typed. It's always text, a `str`."
  - label: "Turn the text into a number"
    lines: "2"
    note: '`int(...)` turns the typed text, say `"36"`, into the number `36`. Here it wraps `input()` directly, so `age` refers to a number.'
  - label: "Put a value into text"
    lines: "3"
    note: "The `f` before the quote makes an f-string: `{name}` is replaced by whatever `name` refers to."
  - label: "Calculate inside the braces"
    lines: "4"
    note: "Any calculation works inside the braces: `{age + 1}`. That's only possible because line 2 made `age` a number."
