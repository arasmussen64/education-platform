id: write-price-tag
stage: write
rev: 1
title: "A price tag"
prompt: |
  Write a program that asks for an item's name, then its price (which may have decimals), and prints a price tag. The price always has two decimal places. Typing `Apples` and `1.5` should print:

  ```
  Apples cost $1.50
  ```
hints:
  - "Use `float(input(...))` for the price, because it may have decimals."
  - "In an f-string, `{price:.2f}` shows exactly two decimal places."
  - "The `$` is ordinary text, so put it right before the braces."
skills: [convert, fstrings]
