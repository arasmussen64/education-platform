id: build-km-to-miles
stage: build
rev: 1
title: "Kilometres to miles"
prompt: |
  Starting from a blank editor, write a program that asks for a distance in kilometres (it may have decimals) and prints it in miles, with two decimal places. One kilometre is 0.621371 miles. Typing `5` should print:

  ```
  That's 3.11 miles.
  ```
skills: [convert, fstrings]
