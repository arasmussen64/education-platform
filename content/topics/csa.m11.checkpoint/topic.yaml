- csa.cnet.edge
- csa.cnet.performance
- csa.cnet.visibility
- csa.cnet.troubleshooting
estimated_minutes: 480
rev: 1
objectives:
- Build a hub and spokes on each cloud, joined to each other and to a simulated data center by BGP over IPsec. Private names resolve across all four, and no workload has a public address.
- The checker tests a matrix of allowed and denied paths, and name resolution from every spoke.
- A fault module drops one tunnel. Traffic must fail over within 60 seconds.
- Then a break-fix with four faults.
