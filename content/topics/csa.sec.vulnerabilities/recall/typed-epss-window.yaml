id: typed-epss-window
type: typed
rev: 1
prompt: |
  EPSS estimates the probability that a published CVE will be exploited in the wild within a fixed window that starts today. How many days long is that window? Type the number.
kind: text
answers:
  - "30"
  - "30 days"
  - "thirty"
mistakes:
  - id: a-week
    answers: ["7", "7 days"]
    why: "A week is too short: EPSS looks 30 days ahead, and is worked out again every day."
  - id: a-year
    answers: ["365", "365 days", "a year"]
    why: "EPSS looks 30 days ahead, not a year. Over a year far more flaws would be exploited, and the numbers would all be higher."
  - id: ninety
    answers: ["90", "90 days"]
    why: "It is 30 days. 90 is a common length for an exception, not EPSS's window."
explanation: |
  **30 days.** An EPSS of 0.02 says: about a 2% chance that this CVE is exploited somewhere in the next 30 days. The score is worked out again every day for every CVE, so yesterday's number is already old, and a number always goes with its date.
skills: [cvss-epss-kev]
