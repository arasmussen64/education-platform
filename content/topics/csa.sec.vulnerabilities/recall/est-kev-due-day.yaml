id: est-kev-due-day
type: estimate
rev: 1
prompt: |
  CISA adds a CVE to its KEV catalog on 9 November. On 10 November your scan finds it on an internet-facing server. It gives total control and can't be automated. Under BOD 26-04's table, on which day of November is the fix due? Exactly.
unit: November
answer: 12
tolerance: { absolute: 0 }
given: { listed: 9, found: 10 }
# The row for exposed, in KEV, not automatable, total control is 3 days,
# which the learner knows from the table.
working: min(listed, found) + 3
mistakes:
  - id: from-found
    value: 13
    working: found + 3
    why: That counts from the day you found it. The clock starts on the earlier of two days, the day CISA listed the flaw and the day you found it, and CISA listed it on the 9th.
  - id: fourteen-days
    value: 23
    working: listed + 14
    why: That is 14 days. An exposed asset, a KEV entry and total control is a 3-day row (with forensic triage); 14 days is the row for partial control.
explanation: |
  Exposed, in KEV, not automatable, total control: the table's third row, 3 days and forensic triage. The clock started on the earlier of the two days, the 9th, when CISA listed the flaw. 9 + 3 = 12: due on 12 November, in calendar days, weekend or not. `date -d "2026-11-09 + 3 days" +%F` prints `2026-11-12`.

  You found it a day after the clock started, so you have two days left, not three. Had you found it a year later, it would have been overdue the moment you found it.
skills: [patch-slas]
