id: mcq-fixed-means
type: mcq
rev: 1
prompt: |
  Monday's patch run on a server ended with exit status 0, and the change ticket says every package was patched. On Tuesday, what shows that a finding on that server is fixed?
choices:
  - "The run's exit status of 0: apt stops with an error if it skips a package"
  - "A fresh scan no longer lists it, and nothing still runs the old code"
  - "The change ticket: a signed-off change is the record an auditor accepts"
  - "The fixed version's presence in the index of the patch repository"
answer: 1
explanation: |
  A finding is fixed when a fresh scan of the machine no longer lists it and no process is still running the program as it was before the upgrade. Everything else is a claim about the fix.

  An exit status of 0 says the run ended, not that every package moved: `apt-get upgrade` can leave a package where it is and still end without an error, which is why the run's whole output is read, and why `apt-cache policy NAME` (the installed version beside the candidate, the version apt would install) is the next question. A change ticket records what someone meant to do. And a fixed version sitting in the repository fixes nothing until it is installed. The scan is the judge, and then the look at what is running.
skills: [remediate-and-track]
