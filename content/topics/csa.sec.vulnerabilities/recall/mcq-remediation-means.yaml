id: mcq-remediation-means
type: mcq
rev: 1
prompt: |
  Under BOD 26-04, which of these counts as remediating a vulnerability on an asset?
choices:
  - "Only installing the vendor's patch: a workaround leaves the finding open for good"
  - "Raising a ticket with the vendor, which stops the clock until the vendor answers"
  - "Adding a firewall rule that logs every attempt to use the flaw against the asset"
  - "Anything that eliminates it: a patch, decommissioning the system, or another action"
answer: 3
explanation: |
  The directive defines remediation by its result: the vulnerability is eliminated, "through patching, decommissioning the system, or another action". Switching the system off for good, removing the vulnerable package, or turning off the vulnerable feature where that truly removes the flaw all count.

  A ticket changes nothing on the asset, and no clock stops for it. A rule that only logs attempts doesn't stop them. A rule that blocks them is a **mitigation**: it lowers the risk while the flaw is still there. The directive does say one mitigation changes the timeline: taking an exposed system off the internet turns "exposed" from yes to no, and the row moves with it. The flaw is still in the register until it is gone.
skills: [prioritise]
