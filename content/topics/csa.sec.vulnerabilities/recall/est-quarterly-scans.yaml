id: est-quarterly-scans
type: estimate
rev: 1
prompt: |
  PCI DSS requirement 11.3.1 asks for an internal vulnerability scan at least once every three months, and for a rescan that confirms the high-risk and critical findings of a scan have been resolved. Last year 3 of the shop's quarterly scans had such findings, and each needed one rescan. How many internal scans did the shop run that year, at least? Exactly.
unit: scans
answer: 7
tolerance: { absolute: 0 }
given: { failed: 3 }
# Once every three months is four scans a year.
working: 4 + failed
mistakes:
  - id: no-rescans
    value: 4
    working: "4"
    why: That is the four quarterly scans alone. Each of the three scans that had high-risk or critical findings also needed a rescan to show they were resolved.
  - id: monthly
    value: 12
    working: "12"
    why: That is one scan a month. The requirement is at least once every three months, four a year, plus the rescans.
explanation: |
  Once every three months is four scans a year. Three of them needed a rescan: 4 + 3 = 7.

  The rescan is the part people skip. A scan that finds something starts work; only a rescan that no longer finds it ends that work, and an assessor asks to see both. Four is also only the least the standard asks: this topic's weekly run does 52.
skills: [patch-slas]
