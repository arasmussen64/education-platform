id: mcq-cvss-is-severity
type: mcq
rev: 1
prompt: |
  An advisory gives a flaw a CVSS base score of 9.8. What does that number tell you?
choices:
  - "How likely it is to be used in an attack during the next 30 days"
  - "How severe the flaw is in general, worked out from its vector"
  - "That attackers are already using it against real systems today"
  - "How severe it is on your server, given what that server exposes"
answer: 1
explanation: |
  A CVSS **base** score measures severity: how easy the flaw is to use and how much damage it does, worked out from the choices in its vector. It is about the flaw in general, the same number for everyone in the world.

  It says nothing about likelihood (that is EPSS's 30-day probability) and nothing about whether anyone is attacking with it (that is the KEV catalog). And it knows nothing about your server: CVSS has environmental metrics for that, which you would have to fill in yourself. Most 9.8s are never used in an attack, which is why patching by CVSS alone spends the week on the wrong findings.
skills: [cvss-epss-kev]
