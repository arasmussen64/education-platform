id: mcq-what-a-scanner-does
type: mcq
rev: 1
prompt: |
  What does a vulnerability scanner such as OSV-Scanner do when it scans a server's packages?
choices:
  - "It sends known attacks at the server's open ports and records which ones work"
  - "It reads the server's logs for signs that a known flaw has been used already"
  - "It checks the server's settings against a hardening benchmark, rule by rule"
  - "It compares each installed package's version with a database of advisories"
answer: 3
explanation: |
  A package scanner reads the list of what is installed (on Ubuntu, the package database in `/var/lib/dpkg/status`) and looks each package and version up in a database of advisories, each of which names a package, the versions affected and the first fixed version. It attacks nothing and changes nothing, which is why it is safe to run on a production server every day, and why it is only as good as its database.

  Sending real attacks is penetration testing, a different job with a different risk. Reading logs for signs of use is what forensic triage does, after a scan has told you where to look. Checking settings against a benchmark is what Hardening's scanner did, and Compliance basics comes back to it.
skills: [scan-and-read]
