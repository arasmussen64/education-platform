id: mcq-exception-shape
type: mcq
rev: 1
prompt: |
  A fix can't be applied within its 14 days, because the vendor's patch breaks the driver of the payment terminals. What should the team do with the finding?
choices:
  - "Write an exception: an owner, the reason, a compensating control and an expiry date"
  - "Give every finding of that severity a longer timeline, so that it is no longer late"
  - "Mark it fixed for now, and check it again at the next quarterly scan of the server"
  - "Remove its record from the scanner's database, so the report shows nothing overdue"
answer: 0
explanation: |
  Some fixes honestly can't make their date. The answer is an **exception**, which is Threat modeling's "accept the risk" written down for one finding: a named **owner** who signs for the risk, the **reason**, a **compensating control** that lowers the risk meanwhile (here, perhaps, the terminals' network cut off from everything but the payment service), and an **expiry date** on which someone has to decide again. The finding stays open in the register, marked as excepted.

  The other three make the report look better and leave the flaw where it is. "Fixed" is a false record; editing the scanner's database hides this finding on every server, including the ones that could be patched; and stretching the timeline for a whole severity hands the same delay to every other finding.
skills: [remediate-and-track]
