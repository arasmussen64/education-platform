id: mcq-same-flaw-two-hosts
type: mcq
rev: 1
prompt: |
  OpenSSH's CVE-2024-6387 is not in KEV, can't be automated, and gives total control. Under BOD 26-04's table, what are its timelines on the internet-facing payments server and on an internal batch host?
choices:
  - "14 days on both: exposure changes who can attack, never the timeline"
  - "3 days on both: an EPSS of 0.995 puts it in the fastest row anywhere"
  - "3 days on the payments server; 60 days on the internal batch host"
  - "14 days on the payments server; fix on system upgrade on the batch host"
answer: 3
explanation: |
  The flaw's three answers are the same on both machines: not in KEV, not automatable, total control. The answer that differs belongs to the machine. Exposed, that row gives **14 days**; not exposed, it gives **fix on system upgrade**: at the machine's next planned major upgrade or rebuild.

  That is the table's point: the same flaw is urgent on one machine and routine on another. EPSS is not one of the table's four questions, so 0.995 doesn't change the row; it is a good reason to do the 14-day fix on day one. The 3-day rows need a KEV entry, or an automatable attack on an exposed machine. 60 days is the row for an automatable flaw on an internal machine.
skills: [prioritise]
