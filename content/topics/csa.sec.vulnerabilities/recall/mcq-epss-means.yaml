id: mcq-epss-means
type: mcq
rev: 1
prompt: |
  OpenSSH's CVE-2024-6387 had an EPSS of 0.995 on 10 November 2026. What does 0.995 mean?
choices:
  - "A severity of 9.95 out of 10, on the same scale that CVSS scores use"
  - "That 99.5% of the servers that run OpenSSH are still open to this flaw"
  - "An estimated 99.5% chance that it is exploited somewhere in the next 30 days"
  - "That it ranks in the top 0.5% of all CVEs when they are sorted by severity"
answer: 2
explanation: |
  EPSS is a probability from 0 to 1: a model's estimate that a published CVE will be exploited in the wild in the next 30 days. 0.995 is 99.5%. It is recalculated every day, so it has a date.

  It doesn't count vulnerable servers, and it isn't a severity: this flaw's CVSS is 8.1. EPSS does come with a ranking, the **percentile**, but that ranks CVEs by their EPSS, not by severity: this one's percentile was 0.99945, a higher probability than 99.945% of all CVEs. And "somewhere" matters: the probability is about the world, not about your server.
skills: [cvss-epss-kev]
