id: mcq-kev-criteria
type: mcq
rev: 1
prompt: |
  What must be true before CISA adds a vulnerability to its KEV catalog?
choices:
  - "It has a CVSS base score of 9.0 or more, and the vendor has released a patch"
  - "It has a CVE ID, reliable evidence of exploitation in the wild, and a clear fix"
  - "It has an EPSS above 0.9, or a working exploit for it has been published online"
  - "It has a CVE ID, and a scan has found it on a US federal agency's own network"
answer: 1
explanation: |
  Three things: a CVE ID, reliable evidence that it has been actively exploited in the wild, and a clear action that remedies it, such as a vendor's update. Severity isn't one of them: the catalog holds flaws of every CVSS score, because attackers use what works, not what scores highest.

  A published exploit or a proof of concept is not exploitation, and CISA says scanning for a flaw isn't either: someone has to have used it against a system without its owner's permission. And where it was found doesn't matter: the catalog is about the flaw, not about one network.
skills: [cvss-epss-kev]
