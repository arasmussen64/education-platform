id: est-pci-late
type: estimate
rev: 1
prompt: |
  A vendor released a critical security patch on 5 October. PCI DSS requirement 6.3.3 gives critical patches one month from release. The patch was installed on 20 November. How many days late was it? Exactly.
unit: days
answer: 15
tolerance: { absolute: 0 }
given: { released: 5, installed: 20 }
# One month from 5 October is 5 November.
working: installed - released
mistakes:
  - id: since-release
    value: 46
    working: (31 - released) + installed
    why: That is the days since the patch was released. The month it was allowed ended on 5 November, and lateness counts from there.
  - id: three-months
    value: 0
    working: "0"
    why: Three months is PCI DSS's example for other patches. A critical or high-security patch has one month, which ended on 5 November.
explanation: |
  One month from 5 October is 5 November. Installed on 20 November: 15 days late.

  PCI DSS counts from the patch's **release**, not from the day you noticed it, and gives critical and high-security patches one month; for the rest it asks for "an appropriate time frame" and offers three months as an example. BOD 26-04 counts differently (from the KEV listing or the day you found the flaw, whichever is earlier). A shop that takes cards and adopts CISA's table has to meet whichever date comes first.
skills: [patch-slas]
