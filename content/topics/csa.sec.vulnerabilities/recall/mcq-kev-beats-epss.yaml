id: mcq-kev-beats-epss
type: mcq
rev: 1
prompt: |
  On 10 November 2026 git's CVE-2025-48384 is in CISA's KEV catalog and has an EPSS of 0.044. OpenSSH's CVE-2024-6387 is not in KEV and has an EPSS of 0.995. Which of the two do you treat as known to be exploited?
choices:
  - "git's: KEV records evidence of real attacks, and EPSS is a forecast"
  - "Whichever has the higher CVSS score: severity decides, not lists"
  - "OpenSSH's: a 99.5% probability outweighs a place on somebody's list"
  - "Neither: a flaw counts as exploited only once it is on both lists"
answer: 0
explanation: |
  KEV is evidence: CISA adds a CVE only when it has reliable evidence that the flaw has been exploited in the wild. EPSS is a forecast from a model. When they disagree, evidence wins, so git's flaw is the one known to be exploited, low forecast or not. A model can miss an attack that happens quietly in a few places.

  That doesn't make OpenSSH's flaw safe. An EPSS of 0.995 puts it at the top of everything that isn't in KEV, far above a flaw with a higher CVSS and an EPSS near zero. The order is: KEV first, then EPSS, then CVSS to settle ties.
skills: [cvss-epss-kev]
