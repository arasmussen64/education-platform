id: mcq-forensic-triage
type: mcq
rev: 1
prompt: |
  BOD 26-04 adds "& forensic triage" to some of its 3-day rows, such as a KEV entry that gives total control on an exposed asset. Why?
choices:
  - "The flaw may already have been used on that asset, so you look for signs of it"
  - "The asset must be rebuilt from an image, and triage decides which image to use"
  - "CISA needs evidence from every agency to keep the catalog's entries up to date"
  - "Patches for flaws of that kind often fail, so the system is examined afterwards"
answer: 0
explanation: |
  Those rows describe a flaw that attackers are known to use, that hands over the whole machine, on an asset they can reach. On such an asset the question is no longer only "is it patched?" but "did someone get in before we patched?". **Forensic triage** is the look for signs of that: in the audit trail, in new accounts and keys, in processes and files that shouldn't be there. A patch closes the door and does nothing about someone already inside.

  It isn't a report to CISA, a test of the patch, or a rebuild, though finding signs of an intrusion may well end in one.
skills: [prioritise]
