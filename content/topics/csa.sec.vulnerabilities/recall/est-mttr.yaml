id: est-mttr
type: estimate
rev: 1
prompt: |
  Last month five findings were fixed 2, 5, 9, 1 and 13 days after they were found. What was the mean time to remediate, in days? Exactly.
unit: days
answer: 6
tolerance: { absolute: 0 }
given: { a: 2, b: 5, c: 9, d: 1, e: 13 }
working: (a + b + c + d + e) / 5
mistakes:
  - id: total
    value: 30
    working: a + b + c + d + e
    why: That is the total of the five. The mean divides it by the number of findings, 5.
  - id: median
    value: 5
    working: "5"
    why: That is the median, the middle value when the five are put in order. The mean adds them up and divides by 5.
explanation: |
  2 + 5 + 9 + 1 + 13 = 30 days over 5 findings: a mean time to remediate (MTTR) of 6 days.

  A mean hides its worst case: the 13-day fix may have been the KEV entry that had 3 days. So MTTR is reported beside SLA compliance, and is more useful split by timeline (the mean for 3-day findings, for 14-day findings) than as one number. It also counts only what was fixed: a finding open for a year isn't in it at all, which is why the backlog is the third number.
skills: [remediate-and-track]
