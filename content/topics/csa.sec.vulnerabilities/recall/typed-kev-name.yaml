id: typed-kev-name
type: typed
rev: 1
prompt: |
  CISA publishes a catalog of vulnerabilities for which it has reliable evidence of exploitation in the wild. Under BOD 26-04, being in that catalog moves a finding to a shorter timeline. What is the catalog's three-letter short name?
kind: text
answers:
  - KEV
  - KEV catalog
  - Known Exploited Vulnerabilities
  - Known Exploited Vulnerabilities catalog
mistakes:
  - id: cve
    answers: [CVE]
    why: "A CVE ID is the name of one flaw, and every public flaw has one. The catalog lists the few that are known to be used in attacks."
  - id: epss
    answers: [EPSS]
    why: "EPSS is a forecast, a probability for every CVE. The catalog holds evidence: flaws that have been exploited."
  - id: cvss
    answers: [CVSS]
    why: "CVSS scores severity. The catalog is a list of flaws known to be exploited, whatever their severity."
explanation: |
  **KEV**, the Known Exploited Vulnerabilities catalog. CISA adds a CVE when it has an ID, reliable evidence of exploitation in the wild and a clear fix; on 22 November 2026 it held 1,790 entries. It is evidence where EPSS is a forecast and CVSS a severity, which is why a KEV entry goes to the front whatever its other two numbers say.
skills: [cvss-epss-kev]
