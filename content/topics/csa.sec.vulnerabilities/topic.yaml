skills:
  - id: scan-and-read
    description: "What a scanner compares (installed versions against advisories) and where it looks (the package database; an app's lockfile; an image); running OSV-Scanner offline and reading a finding (the ID, the package, the installed and fixed versions, the severity); findings against packages; the distribution's own advisories and backports; false positives and false negatives"
  - id: cvss-epss-kev
    description: "What each of the three measures and who publishes it: CVSS (severity, from a vector: AV, AC, PR, UI, scope, C/I/A; the ratings from Low to Critical; more than one score for one CVE), EPSS (a probability for the next 30 days, with a percentile, new every day) and CISA's KEV catalog (evidence of exploitation; its three criteria); the order when they disagree"
  - id: prioritise
    description: "The asset's context (exposed to the internet or not), SSVC's decision points (exploitation, automatable, technical impact) and CISA's BOD 26-04 table as a policy that turns four answers into a timeline; forensic triage; a flaw in code that isn't running; what counts as remediation, and mitigation beside it"
  - id: patch-slas
    description: "Timelines from a policy, and due dates counted in calendar days from the earlier of the KEV listing and the day the flaw was found; found late is already overdue; PCI DSS 6.3.3's month from release and 11.3.1's quarterly scans and rescans; the arithmetic of due dates and lateness"
  - id: remediate-and-track
    description: "Patching from a repository; a patch run that reports success and still leaves a package behind, and asking apt why; processes that still run the old code and how to find and restart them; rescanning; rebuilding the image for immutable servers; exceptions with an owner, a compensating control and an expiry; the register; mean time to remediate, SLA compliance and the backlog's arithmetic"
