prove:
  build: build-weekly-vuln-run
  debug: debug-patched-but-flagged
  explain:
    prompt: |
      A manager reads this week's scan: 1,400 findings, 90 of them "critical". She asks why the team fixed a "high" on the web servers before most of the criticals, and how you'll show the auditors that you patch in time. Explain, in your own words: what a scanner does and why a distribution's own advisories matter; what CVSS, EPSS and the KEV catalog each tell you, and what you do when they disagree; how the asset's exposure and the kind of control an attacker would get change the order; how you set and count due dates, and what you do when a fix can't make its date; and how you prove a finding is fixed and report progress.
    rubric:
      - id: scanner
        required: true
        description: "A scanner compares the versions of what is installed with a database of advisories; it attacks nothing and is only as good as its data. It must read the distribution's own advisories, because a distribution backports fixes into its old version numbers, so upstream's 'fixed in' version would flag patched servers."
      - id: three-signals
        required: true
        description: "CVSS is severity in general, worked out from a vector worth reading; EPSS is a probability of exploitation in the next 30 days; KEV is evidence that a flaw has been exploited. KEV entries come first, then the likelier ones, with severity settling ties: never CVSS alone."
      - id: context
        required: true
        description: "Whether the asset is exposed to the internet, whether the attack can be automated and whether it gives total or partial control change the timeline, as in a written policy such as CISA's BOD 26-04 table (3, 14 or 60 days, or at the next upgrade); where an exploited flaw gives total control the asset also gets forensic triage, a look for signs it was already used."
      - id: slas
        required: true
        description: "Due dates are counted in calendar days from the earlier of the KEV listing and the day the flaw was found (so a flaw found late can be overdue at once); PCI DSS gives the patches for critical vulnerabilities one month from release. A fix that can't make its date gets a written exception: an owner, the reason, a compensating control and an expiry date."
      - id: prove-and-track
        required: true
        description: "A finding is fixed when the patch is installed, whatever still ran the old code has been restarted (or the image rebuilt and the servers replaced), and a rescan no longer lists it. A register holds one line per finding with its due date, status and owner; progress is reported as mean time to remediate, the share fixed on time and the backlog's direction."
      - id: example
        required: false
        description: "An example with real numbers, such as a KEV entry with an EPSS near 0.04 going ahead of a flaw at 0.995 that isn't in KEV, or the same flaw being 14 days on an exposed server and 'at the next upgrade' on an internal one."
    model_answer: |
      A scanner doesn't attack anything. It reads what is installed, package by package and version by version, and looks each one up in a database of advisories that say which versions have a known flaw and which version fixes it. So it is only as good as that database, and for a Linux distribution's packages it has to be the distribution's own advisories: Ubuntu fixes old versions by backporting the patch, so its fixed sudo is still called 1.9.15p5 while the project says "before 1.9.17p1", and a scanner that compared upstream numbers would flag patched servers for ever.

      "Critical" is a CVSS word, and CVSS only says how bad a flaw would be if someone used it, in general, from a vector that describes the attack. Two other signals say whether anyone will. EPSS is a daily estimate of the chance that the flaw is exploited somewhere in the next 30 days. CISA's KEV catalog lists flaws for which there is evidence of real attacks. When they disagree, evidence comes first, then likelihood, and severity settles ties. Most of those 90 criticals have an EPSS near zero and aren't in KEV; the "high" on the web servers was in KEV. In my lab's data, git's flaw with an EPSS of 0.04 was in KEV and went ahead of an OpenSSH flaw at 0.995 that wasn't.

      Then the asset matters. The web servers face the internet. Our policy is CISA's BOD 26-04 table: is the asset exposed, is the flaw in KEV, can the attack be automated, does it give total or partial control. Those four answers give 3, 14 or 60 days, or "fix at the next upgrade" for a flaw nobody exploits on a machine nobody outside can reach. For an exploited flaw that gives total control we also do forensic triage: look for signs that it was used on that machine before we patched.

      Due dates are calendar days, counted from the earlier of the day CISA listed the flaw and the day we found it, so something we find late can be overdue the day we find it, and the register says so. For the card systems PCI DSS also gives the patches for critical vulnerabilities one month from release. When a fix honestly can't make its date, we write an exception with a named owner, the reason, a compensating control such as blocking the port, and an expiry date.

      A finding is fixed when the patch is in, the processes that were still running the old code have been restarted (on our image-built servers, when the image is rebuilt and the servers replaced), and a rescan no longer shows it. Every finding has a line in the register with its machine, due date, status and owner. For the auditors I'd show that register and three numbers from it: the mean time to remediate, the share of fixes made by their due date, and whether the backlog is shrinking, which means fixing more each week than arrives.
