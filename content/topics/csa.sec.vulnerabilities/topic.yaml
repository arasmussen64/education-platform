#   individuals: gao.gov/products/gao-18-559.
# - The clouds (the lesson's table): Amazon Inspector "discovers and scans
#   Amazon EC2 instances, container images in Amazon ECR, and Lambda
#   functions", rescans when a package changes or a new CVE is published,
#   and gives an Amazon Inspector score that adjusts the CVSS base score
#   to the environment:
#   docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html.
#   Defender for Cloud's Defender for Servers plan scans machines with
#   Microsoft Defender Vulnerability Management: agent-based in Plan 1 and
#   Plan 2, agentless in Plan 2 only (ms.date 2026-07-03):
#   learn.microsoft.com/en-us/azure/defender-for-cloud/auto-deploy-vulnerability-assessment.
#   Google's Artifact Analysis scans container images automatically "every
#   time you push a new image to Artifact Registry" and keeps the results
#   up to date; on-demand scanning's results last 48 hours:
#   docs.cloud.google.com/artifact-analysis/docs/artifact-analysis. VM
#   Manager's vulnerability reports list known vulnerabilities in VMs'
#   operating systems with CVE, severity and CVSS v3 score:
#   docs.cloud.google.com/compute/vm-manager/docs/os-inventory/vulnerability-reports.
#   No price is quoted for any of them.
# - Trivy "uses the advisory database from the appropriate OS vendor" (the
#   Ubuntu CVE Tracker for Ubuntu), because vendors backport fixes:
#   trivy.dev/latest/docs/scanner/vulnerability/. Grype's README lists
#   "Threat & risk prioritization with EPSS, KEV, and risk scoring":
#   github.com/anchore/grype (Apache-2.0).
# - OSV-Scanner's offline mode: --offline, --offline-vulnerabilities, and
#   OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY with {dir}/osv-scalibr/{ecosystem}/all.zip:
#   google.github.io/osv-scanner/usage/offline-mode/.
# Tried in this topic's labs on the pay base (OSV-Scanner 2.7.0, apt 2.8,
# OpenSSH 9.6p1, rsync 3.2.7, systemd 255 on Ubuntu 24.04), 2026-11-22: the
# scan's 228 packages, seven findings in five packages and exit status 1;
