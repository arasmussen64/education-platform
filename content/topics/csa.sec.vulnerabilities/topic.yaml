id: csa.sec.vulnerabilities
kind: topic
status: ready
title: Vulnerability management
summary: "The loop that keeps known flaws out of your systems: scan a server's packages with a real scanner and read each finding; tell apart what CVSS (severity), EPSS (likelihood) and CISA's KEV catalog (evidence) say and act when they disagree; turn a finding into a due date with a written policy (CISA's BOD 26-04 table, PCI DSS's month); fix, prove the fix with a rescan and a look at what is still running the old code; and keep a register that shows it."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 2,
# 3 and 5), its designer's brief (csa.sec.vulnerabilities.md) and the build
# notes (BUILD-NOTES.md), which change the brief: on the pay base an openssh
# upgrade restarts sshd by itself, so "patched on disk, old code in memory"
# is shown with the shop's own unit, shop-sync.service, which runs an rsync
# daemon that a package upgrade never restarts (tried on the base,
# 2026-11-22: after "apt-get install --only-upgrade rsync" the package's own
# rsync.service was restarted and shop-sync's process still ran
# "/usr/bin/rsync (deleted)").
#
# This topic builds on csa.sec.threat-modeling (risk, likelihood, impact,
# residual risk, the four responses to a risk and control, all its terms)
# and, through the track's order, on Module 1: csa.linux.packages (apt
# update and upgrade, --only-upgrade, apt policy and the candidate, holds
# and pins, "an upgrade replaces files and doesn't touch what is running",
# immutable servers), csa.linux.hardening (scan, fix, scan again),
# csa.linux.services (systemctl restart, systemctl cat, drop-ins),
# csa.linux.storage (lsof +L1), csa.linux.shell and csa.linux.scripting
# (grep, cut, sort, awk, a script with chmod +x), and Module 3's
# csa.net.cidr and csa.net.nat (public against private addresses). New
# here, each explained where it is first used: awk's arrays and NR == FNR,
# sort's keys, date -d, grep -f.
#
# It defines, for the module (the plan's 3.5): vulnerability, exploit, CVE,
# advisory, backport, CVSS, EPSS, KEV, SSVC, SLA, exception, compensating
# control and MTTR.
prerequisites: [csa.sec.threat-modeling]
# Worked out: the lesson about 37 minutes (4,770 words with its tables at
# 130 a minute), 22 practice quick items at 1.5 each 33, the worked example
# 25, the fill-in 25, the write 40, the build 60, the debug 45 and the
# explain 20: 285; the copied reading (CISA's Appendix A, 604 words) 5
# more: 290, the plan's figure. Every other reading is an optional link
# and is left out.
estimated_minutes: 290
rev: 1
objectives:
  - "Scan a server's packages with a real scanner (OSV-Scanner, offline) and read each finding: the advisory, the package, the installed and fixed versions, the severity; say what a scanner compares, and why a distribution's own advisories are the ones to trust for its packages (backports)."
  - "Say what CVSS (how severe a flaw is, from its vector), EPSS (the probability of exploitation in the next 30 days) and CISA's KEV catalog (evidence of exploitation) each tell you, read a vector, and decide when they disagree."
  - "Prioritise with the asset's context (exposed to the internet or not) and the flaw's (automatable or not, total or partial control), by applying a written policy, CISA's BOD 26-04 table, and say when a finding also needs forensic triage."
  - "Work out due dates in calendar days from the right start (the earlier of the KEV listing and the day the flaw was found; PCI DSS's month from a patch's release), and write an exception with an owner, a compensating control and an expiry for a fix that can't make its date."
  - "Fix a finding and prove it: patch from a repository, restart what still runs the old code, rescan; keep a register, and report mean time to remediate, the share fixed on time and the backlog's direction."
# Facts the lesson, the items and the labs rely on, each read on
# 2026-11-22 unless a line says otherwise:
# - CISA's BOD 26-04, "Prioritizing Security Updates Based on Risk", issued
#   June 10, 2026; it "supersedes and hereby revokes" BOD 19-02 (April 29,
#   2019) and BOD 22-01 (Nov. 3, 2021). Four variables: asset exposure
#   (publicly exposed), KEV status, exploit automation, technical impact
#   (partial or total control). Table 1 is an image on the page
#   (BOD_26-04_Table_1_Remediation_Timelines_0.png), read as an image:
#   rows 1 Y/Y/Y/Total "3 days & forensic triage"; 2 Y/Y/Y/Partial 3 days;
#   3 Y/Y/N/Total "3 days & forensic triage"; 4 Y/Y/N/Partial 14; 5
#   Y/N/Y/Total 3; 6 Y/N/Y/Partial 14; 7 Y/N/N/Total 14; 8 Y/N/N/Partial 60;
#   9 N/Y/Y/Total "3 days & forensic triage"; 10 N/Y/Y/Partial 14; 11
#   N/Y/N/Total 14; 12 N/Y/N/Partial 14; 13 N/N/Y/Total 60; 14 N/N/Y/Partial
#   60; 15 and 16 N/N/N "Fix on system upgrade". "Days are calendar days."
#   The timelines begin when CISA adds the vulnerability to the KEV catalog
#   or the agency identifies it on an asset: "Whichever event occurs first
#   starts the remediation timeline." Remediated: "eliminated through
#   patching, decommissioning the system, or another action". "& forensic
#   triage": remediate or mitigate within the three days "and carry out a
#   forensic triage of the asset to assess whether the system is
#   compromised". "Fix on system upgrade": "the next time the vulnerable
#   asset receives a scheduled major upgrade or rebuild". Removing a system
#   from the internet changes "Publicly Exposed" from Yes to No and shifts
#   the timeline. Phase III, "Within 180 days of issuance", is where
#   agencies must meet Table 1's timelines: 180 days from 10 June 2026 is
#   7 December 2026 (a date that will pass: the lesson says "from 7
#   December 2026"). CISA reassesses the table once per fiscal year:
#   cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
# - KEV: three criteria, "an assigned Common Vulnerabilities and Exposures
#   (CVE) ID", "reliable evidence that the vulnerability has been actively
#   exploited in the wild", "a clear remediation action for the
#   vulnerability, such as a vendor-provided update"; scanning and a proof
#   of concept "do not constitute as active exploitation":
#   cisa.gov/known-exploited-vulnerabilities. The catalog's page showed
#   1,790 entries on 2026-11-22, with a column "Forensic triage required
#   per BOD 26-04": cisa.gov/known-exploited-vulnerabilities-catalog. The
#   labs' extract is catalog version 2026.11.10 (1,779 entries), whose
#   entry for CVE-2025-32463 says dateAdded 2025-09-29 and for
#   CVE-2025-48384 2025-08-25 (content/lab-bases/pay/data/SOURCES.md).
# - EPSS "estimates the probability that a published CVE will be exploited
#   in the wild in the next 30 days", published every day for every CVE with
#   percentiles: first.org/epss/. FIRST's research page speaks of a Version
#   5 in use today and gives it no date: first.org/epss/research. The labs'
#   file of 2026-11-10 says model_version v2026.06.15; its scores:
#   CVE-2025-32463 0.563 (percentile 0.99059), CVE-2025-48384 0.04379,
#   CVE-2024-6387 0.99506 (0.99945), CVE-2024-12084 0.72514, CVE-2024-32487
#   0.00628, CVE-2025-26465 0.07723, CVE-2025-32462 0.04477.
# - CVSS v4.0 Specification Document, version 1.2 (2024-06-18): ratings None
#   0.0, Low 0.1 to 3.9, Medium 4.0 to 6.9, High 7.0 to 8.9, Critical 9.0 to
#   10.0; CVSS-B, CVSS-BT, CVSS-BE, CVSS-BTE; "Consumers of CVSS should
#   enrich the Base metrics with Threat and Environmental metric values";
#   FIRST owns CVSS and licenses it free of charge with attribution, and
#   publishers give both the score and the vector:
#   first.org/cvss/v4.0/specification-document. The CVSS 3.1 vectors and
#   scores of the seven advisories are in the records themselves
#   (content/lab-bases/pay/data/advisories/), and each score was worked out
#   again from its vector with the 3.1 formula: 9.3 and 7.8 for
#   CVE-2025-32463, 2.8 and 8.8 for CVE-2025-32462.
# - SSVC: created by Carnegie Mellon's Software Engineering Institute with
#   CISA in 2019; CISA's tree has exploitation status, technical impact,
#   automatable, mission prevalence and public well-being impact, and four
#   outcomes, Track, Track*, Attend and Act:
#   cisa.gov/stakeholder-specific-vulnerability-categorization-ssvc. The
#   seven CVEs' values are CISA's Vulnrichment data in the base's ssvc.csv.
# - PCI DSS. The version in force is 4.0.1 (published 11 June 2024; 4.0
#   was retired on 31 December 2024). The PCI SSC's post about 4.0.1
#   (blog.pcisecuritystandards.org/just-published-pci-dss-v4-0-1, read
#   2026-11-22 by the reviewer) says 6.3.3 went back to v3.2.1's wording,
#   so that the month applies to critical vulnerabilities only; the
#   lesson, the items and the rubric say "critical", not "critical or
#   high". The standard itself sits behind a licence click-through and
#   was not opened; nothing of it is quoted. Microsoft's guidance still
#   quotes version 4.0 (the PCI SSC's own text is never copied;
#   identifiers and short quotations only): 6.3.3, critical or
#   high-security patches "are installed within one month of
#   release" and others "within an appropriate time frame as determined by
#   the entity (for example, within three months of release)"; 11.3.1,
#   internal scans "At least once every three months", and "Rescans are
#   performed that confirm all high-risk and critical vulnerabilities ...
#   have been resolved"; 11.3.2, external scans every three months by an
