# The checks of "Patched on Monday, flagged on Tuesday". Each states an end
# state and never a cause; what a check prints when it fails doesn't say
# which part is missing.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: scan-clean
    description: "A fresh scan of this server finds nothing, each of the five packages is at or above the version that fixes its findings, and their programs on disk are the fixed packages' own."
    command: |
      lib=/usr/local/lib/lab-pay
      original=$($lib/scan-tsv dpkg-status:/usr/share/lab-pay/original-dpkg-status 2> /dev/null)
      [ "$(echo "$original" | grep -c .)" -eq 7 ] || { echo "the check couldn't read the image's original findings"; exit 0; }
      now=$($lib/scan-tsv 2> /dev/null) || { echo "the scanner didn't run"; exit 0; }
      [ -z "$now" ] || { echo "a fresh scan still lists $(echo "$now" | grep -c .) finding(s)"; exit 0; }
      while IFS=$'\t' read -r cve package installed fixed severity; do
        case $package in openssh) binary=openssh-server ;; *) binary=$package ;; esac
        have=$(dpkg-query -W -f '${Version}' "$binary" 2> /dev/null)
        dpkg --compare-versions "${have:-0}" ge "$fixed" || { echo "one of the five packages is not at a fixed version"; exit 0; }
      done <<< "$original"
      # A package list can be made to say anything. The program on disk has
      # to be the one inside the patch repository's package.
      real() {
        deb=$(ls /srv/patches/"$1"_*.deb 2> /dev/null | head -n 1)
        [ -n "$deb" ] && dpkg-deb --fsys-tarfile "$deb" 2> /dev/null | tar -xO ".$2" 2> /dev/null | cmp -s - "$2"
      }
      for pair in sudo:/usr/bin/sudo openssh-server:/usr/sbin/sshd less:/usr/bin/less rsync:/usr/bin/rsync git:/usr/bin/git; do
        real "${pair%%:*}" "${pair#*:}" || { echo "one of the five packages is not at a fixed version"; exit 0; }
      done
      echo "clean"
    expect:
      equals: clean
  - id: next-run-patches
    description: "Next Monday's patch run would leave nothing behind: `apt-get upgrade` has nothing to install, keep back or step down today, and each of the five packages is free to take its next update."
    command: |
      apt-get update > /dev/null 2>&1
      said=$(LC_ALL=C apt-get -s upgrade 2>&1)
      echo "$said" | grep '^0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded' > /dev/null \
        || { echo "a patch run today would not be a quiet one: $(echo "$said" | grep -E 'upgraded,' | head -n 1)"; exit 0; }
      if echo "$said" | grep -i -E 'kept back|downgrad' > /dev/null; then echo "a patch run today would keep a package back or step one down"; exit 0; fi
      [ -z "$(apt-mark showhold 2> /dev/null)" ] || { echo "a package on this server would not take its next update"; exit 0; }
      pinned=$(LC_ALL=C apt-cache policy 2> /dev/null | sed -n '/^Pinned packages:/,$p' | tail -n +2 | grep -c .)
      [ "$pinned" -eq 0 ] || { echo "a package on this server would not take its next update"; exit 0; }
      echo "nothing left behind"
    expect:
      equals: "nothing left behind"
  - id: ssh-runs-installed-code
    description: "The SSH server on port 22 announces the installed OpenSSH version, the program it runs is the one the package installed, and a reboot would start it the same way."
    command: |
      want="SSH-2.0-$(/usr/sbin/sshd -V 2>&1 | cut -d, -f1)"
      banner=""
      for try in 1 2 3 4 5; do
        banner=$(nc -w 3 127.0.0.1 22 < /dev/null 2> /dev/null | head -n 1 | tr -d '\r')
        [ -n "$banner" ] && break
        sleep 1
      done
      [ -n "$banner" ] || { echo "nothing answers on port 22"; exit 0; }
      [ "$banner" = "$want" ] || { echo "port 22 announces \"$banner\", and the installed OpenSSH is \"$want\""; exit 0; }
      pid=$(systemctl show ssh -p MainPID --value 2> /dev/null)
      [ "${pid:-0}" -gt 0 ] || { echo "ssh.service has no running server"; exit 0; }
      exe=$(readlink "/proc/$pid/exe" 2> /dev/null)
      [ "$exe" = /usr/sbin/sshd ] || { echo "the SSH server that is running is not the program the package installed"; exit 0; }
      # /run is emptied by a reboot: a unit file or drop-in there is gone
      # the next time the server starts.
      for path in $(systemctl show ssh -p FragmentPath --value 2> /dev/null) $(systemctl show ssh -p DropInPaths --value 2> /dev/null); do
        case $path in /run/*) echo "a reboot would not start the SSH server the way it runs now"; exit 0 ;; esac
      done
      echo "installed code"
    expect:
      equals: "installed code"
  - id: ssh-reachable
    description: "A login over SSH with a key still gets in."
    command: /usr/local/lib/lab-pay/root-login
    expect:
      equals: allowed
  - id: ssh-unchanged
    description: "SSH's settings and host keys are what they were."
    command: |
      sealed=/usr/local/lib/lab-vuln
      [ "$(sshd -T 2> /dev/null)" = "$(cat $sealed/sshd-T)" ] || { echo "SSH's settings have changed"; exit 0; }
      now=$(for key in /etc/ssh/ssh_host_*_key.pub; do ssh-keygen -lf "$key"; done 2> /dev/null)
      [ "$now" = "$(cat $sealed/host-keys)" ] || { echo "SSH's host keys have changed"; exit 0; }
      echo "unchanged"
    expect:
      equals: unchanged
  - id: nothing-removed
    description: "sudo, OpenSSH, less, rsync and git are all still installed and still work."
    command: |
      for package in sudo openssh-server openssh-client less rsync git; do
        [ "$(dpkg-query -W -f '${db:Status-Status}' "$package" 2> /dev/null)" = installed ] \
          || { echo "$package is no longer installed"; exit 0; }
      done
      su learner -c 'sudo -n true' > /dev/null 2>&1 || { echo "sudo no longer works for the learner"; exit 0; }
      git --version > /dev/null 2>&1 || { echo "git no longer runs"; exit 0; }
      less --version > /dev/null 2>&1 || { echo "less no longer runs"; exit 0; }
      rsync --version > /dev/null 2>&1 || { echo "rsync no longer runs"; exit 0; }
      echo "all five"
    expect:
      equals: "all five"
  - id: scanner-untouched
    description: "The scanner, its advisory records and the lab's data are as the image shipped them."
    command: /usr/local/lib/lab-pay/base-intact 2>&1 | head -n 3
    expect:
      equals: intact
