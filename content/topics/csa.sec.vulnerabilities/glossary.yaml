# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: vulnerability
  definition: A flaw in software, or in how it is set up, that lets someone do what the system's owner never allowed.
- term: exploit
  definition: A program or technique that uses a vulnerability. To exploit a flaw is to use it in an attack.
- term: CVE
  aliases: [CVE ID]
  definition: "Common Vulnerabilities and Exposures: the public ID, a year and a number, that names one flaw everywhere, such as CVE-2025-32463."
- term: advisory
  definition: A publisher's notice about a flaw, naming the package, the versions affected and the first fixed version. A scanner compares what is installed with advisories.
- term: backport
  definition: A fix taken from a newer release and applied to the older version a distribution ships, so the package is fixed although its version number still looks old.
- term: vulnerability scanner
  definition: A tool that reads the list of installed software and reports each item whose version an advisory says is flawed. It compares versions and attacks nothing.
- term: CVSS
  definition: "Common Vulnerability Scoring System: a severity score from 0 to 10 (Low to Critical) worked out from a vector that describes the attack. It says how bad a flaw is, not how likely."
- term: EPSS
  definition: "Exploit Prediction Scoring System: a model's daily estimate, from 0 to 1, of the probability that a CVE is exploited in the wild in the next 30 days."
- term: KEV
  aliases: [KEV catalog, Known Exploited Vulnerabilities]
  definition: CISA's public catalog of flaws for which it has reliable evidence of exploitation in the wild. Evidence, where EPSS is a forecast.
- term: SSVC
  definition: "Stakeholder-Specific Vulnerability Categorization: a way to prioritise a flaw by answering separate questions (is it exploited, is the attack automatable, total or partial impact) in place of one score."
- term: forensic triage
  definition: A look for signs that a flaw was already used on a machine (in logs, accounts, keys, processes), done as well as patching where the policy asks, as for an exploited flaw giving total control of an exposed machine.
- term: SLA
  definition: "Service-level agreement: a promised level of service. In vulnerability management, the time a policy allows between finding a flaw and fixing it."
- term: exception
  definition: A written, time-limited decision to leave a finding unfixed past its due date, with a named owner, the reason, a compensating control and an expiry date.
- term: compensating control
  definition: Another safeguard that lowers a risk while the proper fix can't be applied, such as blocking a port until a patch can be installed.
- term: MTTR
  aliases: [mean time to remediate]
  definition: Mean time to remediate, the average number of days from finding a vulnerability to fixing it. It counts only findings that were fixed.
