id: csa.net.http-tls
kind: topic
status: ready
title: HTTP and TLS
summary: "HTTP on the wire and the TLS that protects it: what HTTP/2 changes over HTTP/1.1 and which one ALPN picks; the encryption and key exchange under TLS, a TLS 1.3 and a TLS 1.2 handshake read message by message, what an observer still sees and why SNI is sent in clear; and an nginx server set up for several sites on one address, with the right TLS versions, HTTP/2, a refusing default server and OCSP stapling, with the three clouds' load balancers side by side."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2,
# 3.7 and 5, topic 31) and its designer's brief (csa.net.http-tls.md, the
# HTTP-versions and handshake parts; certificates, chains, ACME and mutual
# TLS are csa.net.certificates', HTTP/3 and QUIC csa.net.congestion's).
# Through csa.net.dns this builds on csa.net.transport (RTT, the handshake
# and the byte stream TCP promises), the earlier Module 3 topics (machines,
# on, name@machine services, Unbound) and Module 1 (curl -v and -I, tcpdump,
# systemctl reload, SSH's key pair, awk, grep and sed). DNS defined a
# signature, a hash and, in a sentence, a certificate and a certificate
# authority. From csa.net.congestion (not yet written, in the module's third
# wave) it uses QUIC, a stream, head-of-line blocking at the transport,
# 0-RTT (which, as that topic promises, this lesson's replay sentence
# explains) and HTTP/3 as names it taught. This topic defines, for the
# module (the plan's 3.7): symmetric and public-key encryption, key
# exchange, forward secrecy, cipher suite and handshake; and for
# csa.net.http-semantics: HTTP request and response, method, header, status
# line, HTTP/2 streams and HTTPS.
prerequisites: [csa.net.dns, csa.net.congestion]
# Worked out: the lesson about 25 minutes (3,200 words with its tables),
# the readings about 30 (The Illustrated TLS 1.3 Connection's sections 15,
# MDN's three sections 7, nginx's three directives 4, Let's Encrypt's post
# 5), 12 recall items at 1.5 each 18, then the worked example 30, the
# fill-in 25, the write 35, the build 45, the debug 35 and the explain 20:
# about 265. The plan's 175 is kept (MODULE-3-BRIEF.md, topic 31), as its
# split of the designer's 332 minutes set it.
estimated_minutes: 175
rev: 1
objectives:
  - "Say what HTTP/2 changes over HTTP/1.1 (one connection with many streams, binary frames, compressed headers) and the head-of-line blocking it moves down to TCP, read which version ALPN chose in `curl -v`, and count the round trips TCP and TLS 1.2 or 1.3 cost before a request can leave."
  - "Explain symmetric and public-key encryption, key exchange and forward secrecy, and read a TLS 1.3 and a TLS 1.2 handshake message by message in `openssl s_client -trace`, saying which messages are encrypted."
  - "Say what an observer on the network still sees of an HTTPS connection (addresses, ports and the name in SNI, and in TLS 1.2 the certificate), what ECH changes, and why SNI is sent at all."
  - "Set up nginx for several sites on one address: a certificate per name chosen by SNI, a default server that refuses unknown names, TLS 1.2 and 1.3 only, HTTP/2, and OCSP stapling, read with `openssl s_client -status`; and say where the three clouds' load balancers differ."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - TLS 1.3 is RFC 9846 (July 2026, Proposed Standard), obsoleting RFC 8446,
#   5246 (TLS 1.2's), 5077, 6961, 7627 and 8422: rfc-editor.org/rfc/rfc9846.json.
#   Its section 1.3 (Major Differences from TLS 1.2): "All handshake messages
#   after the ServerHello are now encrypted", and ChangeCipherSpec is kept
#   only "when needed for middlebox compatibility"; section 2.3: 0-RTT has
#   "no guarantees of non-replay between connections":
#   rfc-editor.org/rfc/rfc9846.html.
# - ECH is RFC 9849, "TLS Encrypted Client Hello", March 2026, Proposed
#   Standard: rfc-editor.org/rfc/rfc9849.json. nginx 1.29.4 (2025-12-09)
#   supports it with OpenSSL's ECH feature branch: nginx.org/en/CHANGES.
# - TLS 1.0 and 1.1 are deprecated: RFC 8996, March 2021, Best Current
#   Practice: rfc-editor.org/rfc/rfc8996.json.
# - nginx: ssl_protocols' default is TLSv1.2 TLSv1.3 today; TLSv1.3 was
#   added to the default in 1.23.4 and TLSv1 and TLSv1.1 left it in 1.27.3
#   (2024-11-26); "now the ssl_protocols directive works in a virtual server
#   different from the default server when using OpenSSL 1.1.1 or newer"
#   only from 1.29.2 (2025-10-07): nginx.org/en/CHANGES and
#   nginx.org/en/docs/http/server_names.html ("Virtual server selection").
#   Ubuntu 24.04's nginx 1.24.0 and its nginx.conf ("ssl_protocols TLSv1
#   TLSv1.1 TLSv1.2 TLSv1.3;"), and OpenSSL 3.0.13 refusing TLS 1.1 until
#   the server's ciphers say SECLEVEL=0: tried in the labs' image.
# - nginx's ssl_stapling: "the certificate of the server certificate issuer
#   should be known" (the intermediates in ssl_certificate, or
#   ssl_trusted_certificate), and "For a resolution of the OCSP responder
#   hostname, the resolver directive should also be specified";
#   ssl_reject_handshake appeared in 1.19.4: nginx.org/en/docs/http/ngx_http_ssl_module.html.
#   The http2 directive appeared in 1.25.1, and listen's http2 parameter is
#   deprecated: nginx.org/en/docs/http/ngx_http_v2_module.html and
#   ngx_http_core_module.html. Tried in the labs (nginx 1.24.0): one listen
#   line's http2 switches HTTP/2 on for every server on that port; a
#   server block's own ssl_protocols is ignored unless it is the default
#   server; with no resolver, stapling still works from the address nginx
#   looked up when it loaded its settings (a warning, "no resolver
#   defined"); with a resolver that doesn't answer, no staple and "could
#   not be resolved (110: Operation timed out)" after 30 s; with only
#   cert.pem, "ssl_stapling" ignored, issuer certificate not found; the
#   first handshake after a start goes without a staple.
# - Browsers open about six connections per site under HTTP/1.x, and
#   pipelining was abandoned for HTTP/2's multiplexing: MDN, "Connection
#   management in HTTP/1.x". HTTP/2 needs "only one connection per origin":
#   hpbn.co/http2/.
# - Let's Encrypt dropped OCSP URLs from certificates on 2025-05-07 and
#   turned its OCSP responders off on 2025-08-06, for privacy; Must-Staple
#   requests failed from 2025-01-30: letsencrypt.org/2024/12/05/ending-ocsp/.
# - The clouds' load balancers (the lesson's table):
#   AWS Application Load Balancer: a listener made in the console gets
#   ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09 (TLS 1.2 and 1.3), one made
#   with the CLI, CloudFormation or the CDK ELBSecurityPolicy-2016-08 (TLS
#   1.0 to 1.2, no 1.3): docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html.
#   A certificate list chosen by SNI; the default certificate for a client
#   without SNI or with no matching name: .../https-listener-certificates.html.
#   Azure Application Gateway: the default TLS policy for API versions from
#   2023-02-01 is AppGwSslPolicy20220101 (1.2 and 1.3), before that
#   AppGwSslPolicy20150501 (from 1.0); TLS 1.0 and 1.1 support ended on
#   2025-08-31 (page dated 2026-08-18):
#   learn.microsoft.com/en-us/azure/application-gateway/application-gateway-ssl-policy-overview.
#   Multi-site listeners by host name with SNI; a basic listener takes what
#   no multi-site listener matches, so multi-site ones go first (dated
#   2026-09-02): learn.microsoft.com/en-us/azure/application-gateway/multiple-site-overview.
#   Google Cloud's load balancers: with no SSL policy, "the COMPATIBLE
#   profile selected, and the minimum TLS version set to 1.0":
#   docs.cloud.google.com/load-balancing/docs/ssl-policies-concepts. Several
#   certificates per target proxy chosen by SNI; a client without SNI or with
#   no match gets the first, "the default (primary) certificate":
#   docs.cloud.google.com/load-balancing/docs/ssl-certificates.
# Every command output in the lesson, the labs and the recall items marked
# "captured" is real output of this topic's labs (nginx 1.24.0, OpenSSL
# 3.0.13, curl 8.5.0, tshark 4.2.2 on Ubuntu 24.04), captured on
# 2026-11-12; dates, serials and keys differ in a new run.
#
