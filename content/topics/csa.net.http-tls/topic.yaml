skills:
  - id: http-versions
    description: "HTTP/1.1 against HTTP/2: requests, responses, methods, headers and status lines; persistent connections and six of them a site; streams multiplexed on one connection, binary frames and HPACK; head-of-line blocking at HTTP and at TCP; ALPN in `curl -v` and `curl -w '%{http_version}'`; HTTP/3 as QUIC's (topic 29); the round trips TCP and TLS 1.2 or 1.3 cost before a request"
  - id: tls-handshake
    description: "Symmetric and public-key encryption, key exchange (ECDHE) and forward secrecy, cipher suites; a TLS 1.3 and a TLS 1.2 handshake message by message in `openssl s_client -trace`, and which records are encrypted; what an observer still sees (SNI, and in TLS 1.2 the certificate), ECH, session tickets and 0-RTT's replay risk; key logs for reading your own traffic"
  - id: tls-server-config
    description: "Setting up a TLS server in nginx: a server block per name chosen by SNI, the default server and `ssl_reject_handshake`, `ssl_protocols` TLS 1.2 and 1.3 (decided by the default server in nginx 1.24), HTTP/2 with `listen ... http2`, the full chain, OCSP stapling with `ssl_stapling` and `resolver`, read with `openssl s_client -status`, and why the first handshake goes without; OCSP's decline; the clouds' load balancers' TLS policies and certificates by SNI"
