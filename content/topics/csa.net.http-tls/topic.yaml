prove:
  build: build-two-sites-one-address
  debug: debug-handshake-failures
  explain:
    prompt: |
      A colleague setting up a new web server says: "HTTPS is just encryption: pick any TLS settings and it'll work." Explain, in your own words: what a TLS 1.3 handshake does, message by message and in how many round trips, and how TLS 1.2's differs; what SNI is for, and what someone watching the network can still see of an HTTPS connection; which TLS versions a public server should allow, and why; what OCSP stapling does, why the first handshake after a restart goes without it, and why it matters less than it did; and what HTTP/2 changes over HTTP/1.1, including the problem it moves rather than solves.
    rubric:
      - id: handshake
        required: true
        description: "The ClientHello offers versions, cipher suites, a key share (and SNI, ALPN); the ServerHello picks and sends its key share, so both derive keys by key exchange (ECDHE), with forward secrecy because those keys are thrown away; the server's Certificate, its CertificateVerify (a signature with the certificate's private key, proving it holds it) and Finished, all encrypted in TLS 1.3, then the client's Finished: one round trip after TCP's. TLS 1.2 sends the certificate in clear and takes two round trips."
      - id: sni-and-observer
        required: true
        description: "SNI names the site in the ClientHello so a server with several sites on one address can choose the certificate before anything is encrypted; an observer still sees the addresses, ports and that name (and in TLS 1.2 the certificate), but not the path, headers, cookies or page; ECH encrypts the name where both ends support it."
      - id: versions
        required: true
        description: "TLS 1.2 and 1.3: 1.0 and 1.1 are deprecated (RFC 8996), and 1.3 alone shuts out clients that stop at 1.2; say it explicitly in the configuration rather than trusting a default (nginx 1.24 and some cloud defaults still allow 1.0), and in nginx 1.24 set it where the default server takes it."
      - id: stapling
        required: false
        description: "The server fetches the CA's signed OCSP answer (not revoked) and attaches it to the handshake, saving the client a lookup that would tell the CA which site it visits; nginx fetches it on the first handshake that asks, so that one goes without; Let's Encrypt has stopped OCSP, so it matters with CAs that still run it."
      - id: http-versions
        required: true
        description: "HTTP/1.1 carries one request at a time per connection, so browsers open about six; HTTP/2 multiplexes many streams on one connection with compressed headers, chosen by ALPN in the handshake; but TCP delivers bytes in order, so one lost packet stalls every stream, which HTTP/3 on QUIC removes."
    model_answer: |
      HTTPS is HTTP inside TLS, and TLS does three jobs, not one: it agrees keys with the server, proves the server is who it says, and then encrypts. In TLS 1.3 the client's ClientHello offers the versions and cipher suites it speaks and its half of a key exchange (an ECDHE key share), and names the site it wants in SNI and the HTTP versions it speaks in ALPN. The server's ServerHello picks a version and suite and sends its own key share. Each side combines its own throwaway private key with the other's public share and arrives at the same secret, which nobody watching can work out; the throwaway keys are deleted afterwards, which is forward secrecy: stealing the server's long-term key later doesn't open recorded traffic. Everything after the ServerHello is encrypted: the server's Certificate, its CertificateVerify, a signature over the handshake made with the private key behind that certificate, which proves it holds it, and its Finished. The client checks the certificate and sends its own Finished, and its request can go: one round trip after TCP's, two in all. TLS 1.2 takes two round trips for the handshake, three with TCP's, and sends the certificate in clear.

      SNI is there because one address often serves many sites: the server must choose which certificate to send before anything is encrypted, long before the HTTP Host header arrives. So someone on the network still sees the addresses and ports and that name, and with TLS 1.2 the certificate too, but not the path, the headers, the cookies or the page. ECH encrypts the name, where both ends support it.

      A public server should allow TLS 1.2 and 1.3: 1.0 and 1.1 have been deprecated since RFC 8996, and 1.3 alone would shut out older clients, like a partner's integration that stops at 1.2. Say it in the configuration; don't trust defaults: nginx 1.24 still allows 1.0 and 1.1 by default and Ubuntu's file names them, AWS's load balancer made from the CLI gets a policy from 2016, and Google's with no policy starts at 1.0. In nginx 1.24, the default server's ssl_protocols decides for the whole port.

      OCSP stapling has the server fetch the CA's signed "not revoked" answer and attach it to the handshake, so the client needn't ask the CA itself, which costs a round trip and tells the CA what you're visiting. nginx fetches it when the first handshake asks, so that one goes without. Let's Encrypt stopped OCSP in 2025 for privacy, so it matters only with CAs that still run it.

      HTTP/1.1 sends one request at a time on a connection, so browsers open about six per site. HTTP/2, chosen by ALPN, runs many streams on one connection with compressed headers. But TCP delivers bytes in order, so one lost packet stalls every stream: head-of-line blocking moved down to TCP, which HTTP/3 on QUIC removes.
