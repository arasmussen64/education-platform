# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: TLS
  aliases: [Transport Layer Security]
  definition: The protocol that encrypts a connection and proves the server's identity with its certificate. HTTPS is HTTP inside TLS; versions 1.2 and 1.3 are the ones to allow today.
- term: multiplexing
  definition: Carrying many requests and answers at once over one connection, each as its own numbered stream, as HTTP/2 does, instead of one at a time.
- term: ALPN
  aliases: [Application-Layer Protocol Negotiation]
  definition: The part of the TLS handshake in which the client lists the protocols it speaks over this connection (such as `h2` and `http/1.1`) and the server picks one.
- term: SNI
  aliases: [Server Name Indication]
  definition: The site's name, sent in the clear in the TLS ClientHello, so a server holding several sites can choose the right certificate before anything is encrypted.
- term: forward secrecy
  definition: Keys agreed with throwaway key pairs for each connection, so a recording of today's traffic stays unreadable even to someone who steals the server's private key later.
- term: cipher suite
  definition: "The set of algorithms one TLS connection uses, named in one string, such as `TLS_AES_256_GCM_SHA384` (TLS 1.3: the cipher and the hash)."
- term: OCSP stapling
  definition: A server fetching its CA's signed answer that its certificate is still good, and attaching it to its own handshake, so clients needn't ask the CA themselves.
- term: 0-RTT
  definition: "TLS 1.3's early data: a returning client sends its request with its very first message. Someone on the path could replay it, so servers accept it only for requests that are safe to repeat."
