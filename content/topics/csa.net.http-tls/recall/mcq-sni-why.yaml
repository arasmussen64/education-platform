id: mcq-sni-why
type: mcq
rev: 1
prompt: |
  `www.shop.test` and `api.shop.test` share one address. Why does a client put the site's name in its ClientHello (SNI), when the HTTP request will carry the name anyway, in its `Host` header?
choices:
  - "The server must choose a certificate before anything is encrypted, and the Host header comes after that"
  - "The Host header is encrypted with the certificate's key, so the server needs the name first to decrypt it"
  - "The name lets the server look its own address up again before it agrees to go on with the handshake"
  - "The CA's OCSP responder needs the name to know which certificate the server will want an answer for"
answer: 0
explanation: |
  The server answers the ClientHello with its certificate (encrypted, in TLS 1.3, but chosen at that moment), and the certificate must be the one for the site the client wants. The HTTP request, `Host` header and all, only comes once the handshake is over. So the name has to arrive in the first message, before there's a key to hide it with: that's SNI, and why an observer can read it.

  Nothing is encrypted with the certificate's key: in TLS 1.3 the key that protects the conversation comes from the key exchange, and the certificate's key only signs (CertificateVerify). The server has no reason to look up its own address. And the OCSP answer is something the server fetches by itself from the responder named in its own certificate, with no help from the client's name.
skills: [tls-handshake]
