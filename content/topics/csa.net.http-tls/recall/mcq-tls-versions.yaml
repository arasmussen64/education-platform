id: mcq-tls-versions
type: mcq
rev: 1
prompt: |
  The shop's public site has customers on all kinds of devices, and one partner whose older integration goes no further than TLS 1.2. Which TLS versions should the shop's server allow in 2026?
choices:
  - "TLS 1.2 and 1.3, since 1.0 and 1.1 are deprecated and 1.3 alone would shut the partner out"
  - "TLS 1.3 only, since it is current and every client still on 1.2 should be pushed to move"
  - "TLS 1.1 to 1.3, since the IETF has so far deprecated only the versions before TLS 1.1"
  - "Whatever the TLS library allows by default, since it is kept up to date with the advice"
answer: 0
explanation: |
  TLS 1.0 and 1.1 have been deprecated since RFC 8996 (March 2021, a Best Current Practice): servers shouldn't offer them. TLS 1.2 is still fine with modern settings, and plenty of clients (older systems, embedded devices, partners' integrations) stop there, so turning it off shuts them out. So allow 1.2 and 1.3: `ssl_protocols TLSv1.2 TLSv1.3;` in nginx, and the clouds' current TLS policies say the same.

  The IETF deprecated 1.0 and 1.1 together. And a library's default isn't advice: nginx 1.24, the one in Ubuntu 24.04, still allows TLS 1.0 and 1.1 by default (nginx dropped them from its default only in 1.27.3), and Ubuntu's own `nginx.conf` names them. Say what you mean in the file.
skills: [tls-server-config]
