id: trace-12-in-clear
type: predict_shell
rev: 1
prompt: |
  `t12.txt` and `t13.txt` are the records around the server's Certificate message in two `openssl s_client -trace` runs against `www.shop.test`, one with `-tls1_2` and one with `-tls1_3`, captured in this topic's lab on 2026-11-12 (trimmed to those records). A record's header says what it carries in `Content Type`; the inner type of an encrypted one is in `Inner Content Type`. For each file, the command prints the file's name and the outer `Content Type` line of the record that carries the Certificate. What is printed?
files:
  t12.txt: |
    Received Record
    Header:
      Version = TLS 1.2 (0x303)
      Content Type = Handshake (22)
      Length = 69
        ServerHello, Length=65
          cipher_suite {0xC0, 0x2C} TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

    Received Record
    Header:
      Version = TLS 1.2 (0x303)
      Content Type = Handshake (22)
      Length = 942
        Certificate, Length=938
          certificate_list, length=935
            ASN.1Cert, length=505
            ASN.1Cert, length=424

    Received Record
    Header:
      Version = TLS 1.2 (0x303)
      Content Type = Handshake (22)
      Length = 116
        ServerKeyExchange, Length=112
          KeyExchangeAlgorithm=ECDHE
            named_curve: ecdh_x25519 (29)
  t13.txt: |
    Received Record
    Header:
      Version = TLS 1.2 (0x303)
      Content Type = ApplicationData (23)
      Length = 27
      Inner Content Type = Handshake (22)
        EncryptedExtensions, Length=6

    Received Record
    Header:
      Version = TLS 1.2 (0x303)
      Content Type = ApplicationData (23)
      Length = 964
      Inner Content Type = Handshake (22)
        Certificate, Length=943
          context (len=0):
          certificate_list, length=939
            ASN.1Cert, length=505
            ASN.1Cert, length=424
command: |
  for f in t12.txt t13.txt; do grep -B4 '^    Certificate, Length' "$f" | grep '^  Content Type' | sed "s/^ */$f: /"; done
expected_output: |
  t12.txt: Content Type = Handshake (22)
  t13.txt: Content Type = ApplicationData (23)
explanation: |
  `grep -B4` prints the four lines before the Certificate line too, which hold that record's header, and `^  Content Type` (two spaces, then the words) matches the outer type only, not `Inner Content Type`. In TLS 1.2 the certificate crosses as a plain Handshake record (22): anyone capturing the connection can read the site's certificate, its names included. In TLS 1.3 the same message travels in an ApplicationData record (23), encrypted with the handshake keys; only the two ends can see that it's a Handshake message inside. RFC 9846, TLS 1.3's standard, puts it in one line: all handshake messages after the ServerHello are encrypted. The walkthrough's capture showed the same from outside: `www.shop.test` once on the wire with TLS 1.3 (in the ClientHello's server name) and three times with TLS 1.2 (once more in the certificate's subject and once in its names).
skills: [tls-handshake]
