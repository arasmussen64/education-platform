command: |
  grep -E '^    [A-Z][A-Za-z]+, Length' t13.txt | awk '{print $1}' | tr -d , | paste -sd ' ' -
expected_output: |
  ClientHello ServerHello EncryptedExtensions Certificate CertificateVerify Finished Finished NewSessionTicket NewSessionTicket
explanation: |
  A TLS 1.3 handshake in order. The client's **ClientHello** offers versions (`supported_versions`, TLS 1.3), cipher suites, its half of the key exchange (`key_share`, X25519) and the name it wants (`server_name`, whose bytes spell `www.shop.test`). The server's **ServerHello** picks the version and suite and sends its own key share; from here both sides can work out the handshake keys. Then the server sends, encrypted: **EncryptedExtensions** (the rest of its answers), its **Certificate** (two in the list: the site's and the intermediate's), **CertificateVerify** (a signature over the handshake so far, made with the certificate's private key, which proves it holds that key) and its **Finished**. The client checks all that and sends its own **Finished**, and its request can follow at once: one round trip. The two **NewSessionTicket**s come afterwards, for resuming later.

  The pattern skips the `ChangeCipherSpec` records (a record type, not a handshake message; TLS 1.3 sends one only so that old boxes in the middle aren't confused) and every line indented further, such as `ASN.1Cert, length=505`, whose `length` is lower case anyway.
skills: [tls-handshake]
