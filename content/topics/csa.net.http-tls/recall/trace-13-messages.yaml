id: trace-13-messages
type: predict_shell
rev: 1
prompt: |
  `t13.txt` is `openssl s_client -connect www.shop.test:443 -servername www.shop.test -tls1_3 -trace` from the office, captured in this topic's lab on 2026-11-12, kept open a second so the server's tickets arrived (trimmed: the random numbers, most extension lists, the certificates' text and the tickets' bytes are left out). Each handshake message starts a line indented by four spaces with its name and `, Length=`. The command lists those names in order on one line (`paste -sd ' ' -` joins lines with spaces). What is printed?
