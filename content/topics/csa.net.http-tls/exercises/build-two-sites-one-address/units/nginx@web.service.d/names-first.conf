# nginx on web looks up the CA's OCSP responder, ocsp.shop.test, as it
# reads its settings, so at boot it starts once the shop's resolver answers.
[Unit]
After=unbound@resolver.service ocsp-responder@ca.service

[Service]
ExecStartPre=
ExecStartPre=/usr/local/lib/lab/wait-for-names
ExecStartPre=/usr/sbin/ip netns exec %i /usr/local/lib/netlab/lab-enter %i /usr/sbin/nginx -t -q
