id: build-two-sites-one-address
stage: build
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Two sites, one address"
prompt: |
  The shop is moving its two sites onto one server, `web` (10.0.9.1), and you are setting it up. `netlab show` lists the machines:

  - `web` runs nginx, installed but not running, and not set to start at boot. Its settings are in its `/etc/nginx`: `nginx.conf`, as Ubuntu ships it (with one worker process, and warnings in the error log), and Ubuntu's default site, which answers plain HTTP for any name with nginx's welcome page.
  - The shop's certificate authority has issued a certificate for each site, laid out as certbot lays them out, in web's `/etc/nginx/tls/www.shop.test/` and `/etc/nginx/tls/api.shop.test/`: `cert.pem` (the site's certificate), `chain.pem` (the intermediate that signed it), `fullchain.pem` (the two, the site's first) and `privkey.pem` (its key). Each certificate names its CA's OCSP responder, `http://ocsp.shop.test:8888`.
  - `ca` (10.0.9.5) runs that responder. `resolver` (10.0.9.53) is the shop's name server: it gives `www.shop.test` and `api.shop.test` web's address, and `ocsp.shop.test` ca's. Every machine asks it, and every machine trusts the shop's certificate authority. Neither machine is yours to change, nor are the certificates.
  - `office` (10.0.9.2) is a customer's laptop.

  The pages are ready: the shop's in `/srv/www/www`, the API's in `/srv/www/api`. Set web up so that:

  1. **Both sites share web's one address**, on port 443, `www.shop.test` serving `/srv/www/www` and `api.shop.test` serving `/srv/www/api`, **each with its own certificate**, chosen by the name the client asks for.
  2. **Each site sends its full chain:** its own certificate followed by the intermediate.
  3. **TLS 1.2 and 1.3 only.** Nothing in nginx's files may name an older version.
  4. **HTTP/2** for clients that offer it.
  5. **`www.shop.test` staples its OCSP answer.** nginx asks the shop's resolver for the responder's address each time it fetches one.
  6. **A handshake for any other name, or for no name at all, is refused:** web hands out no certificate to a client that didn't ask for one of its sites.
  7. **Plain HTTP** on port 80, for either name, answers with a permanent redirect (301) to the same path on HTTPS.
  8. **It lasts:** nginx on web starts at every boot, and your settings are in its files.

  Write the sites in a file of their own, `on web nano /etc/nginx/sites-available/shop`, and switch it on with a link in `sites-enabled`, as Ubuntu's default site is: `on web ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop`. `on web nginx -t` checks the files, `sudo systemctl enable --now nginx@web` starts nginx now and at every boot, and `sudo systemctl reload nginx@web` makes a running nginx read its files again. `on web tail /var/log/nginx/error.log` shows what nginx complained about. From the office, `curl -v`, `openssl s_client` (with `-servername`, `-tls1_2`, `-status`, `-showcerts`) and `curl -sI http://...` show what each client gets. When everything above holds, run the checks.
skills: [tls-server-config, http-versions, tls-handshake]
