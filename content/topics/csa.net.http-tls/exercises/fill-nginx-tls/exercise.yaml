id: fill-nginx-tls
stage: fill_in
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "TLS on nginx"
prompt: |
  The shop's web server from the walkthrough, `web` (10.0.9.1), with its customers' laptop `office`, the CA's OCSP responder on `ca` (10.0.9.5, `http://ocsp.shop.test:8888`) and the shop's name server `resolver` (10.0.9.53). Its nginx settings have lost five values, each marked `___`: one in `/etc/nginx/nginx.conf` and four in the site file, `/etc/nginx/sites-available/shop`. Four of the five stand where nginx expects a setting's value, so nginx can't read its files at all: it couldn't start at boot, and `on web nginx -t` names the first line it can't read.

  Fill in each `___` so that:

  1. **Both sites accept TLS 1.2 and 1.3, and nothing older** (`nginx.conf`'s `ssl_protocols`, in its SSL Settings: in nginx 1.24 the versions are decided once for the whole address and port).
  2. **Both sites speak HTTP/2** to clients that offer it. nginx 1.24 switches it on with a word on a `listen` line, and one line is enough for the whole of port 443.
  3. **`www.shop.test` staples its OCSP answer**, and asks the shop's name server, `resolver`, for the responder's address each time it fetches one.
  4. **The second site is the partners' API, `api.shop.test`**, with its own certificate.

  Edit with `on web nano /etc/nginx/nginx.conf` and `on web nano /etc/nginx/sites-available/shop`, replace each `___` (and nothing else), check with `on web nginx -t`, then start nginx: `sudo systemctl restart nginx@web` (if systemd says the service has tried to start too often, `sudo systemctl reset-failed nginx@web` first). After that, a change needs only `sudo systemctl reload nginx@web`. From the office, `curl -v https://api.shop.test/`, `openssl s_client -connect www.shop.test:443 -servername www.shop.test -status < /dev/null` (twice: the first handshake after a start goes without a staple) and `-tls1_2` show what you've made. Then run the checks.
hints:
  - "The versions are written as nginx writes them, `TLSv` and the number, separated by spaces: the walkthrough's `nginx.conf` had them, and `on web nginx -T | grep ssl_protocols` shows the line nginx now reads."
  - "HTTP/2 in nginx 1.24 is the word `http2` on a `listen` line, after `ssl`. Stapling is switched `on`, and `resolver` takes the name server's address, which is in the prompt."
  - "`server_name` takes the name a client asks for, exactly as it asks for it."
skills: [tls-server-config, http-versions]
