id: debug-handshake-failures
stage: debug
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Handshake failures"
prompt: |
  The shop's web server, the morning after a weekend's "TLS hardening". Every machine is described here, the broken parts and the working ones alike; `netlab show` lists them.

  - **`web`** (10.0.9.1) runs nginx for the shop's two sites on its one address: `www.shop.test`, the public shop, and `api.shop.test`, the partners' API. Its settings are in its `/etc/nginx`: `nginx.conf`, and the sites in `sites-available/shop`, switched on by a link in `sites-enabled`. Each site has its own certificate from the shop's certificate authority, in `/etc/nginx/tls/<name>/` (`fullchain.pem` and `privkey.pem`), and `www.shop.test` staples its OCSP answer. nginx logs to `/var/log/nginx/error.log`, warnings included.
  - **`ca`** (10.0.9.5) runs the CA's OCSP responder, `http://ocsp.shop.test:8888`, which each certificate names. **`resolver`** (10.0.9.53) is the shop's name server: it gives both sites web's address and `ocsp.shop.test` ca's. Every machine asks it, and every machine trusts the shop's CA.
  - **`partner`** (10.0.9.3) is the warehouse's server. Its nightly sync, `partner-sync`, fetches the open orders from `https://api.shop.test/orders`. It is an old integration whose TLS library goes no further than TLS 1.2, and it belongs to the warehouse.
  - **`monitor`** (10.0.9.4) is the shop's uptime monitor. Its probe, `uptime-probe`, is an old tool: it connects to web's address, 10.0.9.1, without sending any name, and checks that it is given a certificate it can trust for `www.shop.test`. It belongs to the monitoring team.
  - **`office`** (10.0.9.2) is a customer's laptop, whose browser and `curl` speak TLS 1.3 and send the name they want. Customers see nothing wrong.

  Since the weekend:

  - the warehouse's sync fails: `on partner partner-sync`;
  - the uptime monitor says the shop is down: `on monitor uptime-probe`;
  - `www.shop.test` never staples its OCSP answer, however many handshakes you make: `on office openssl s_client -connect www.shop.test:443 -servername www.shop.test -status < /dev/null` says `OCSP response: no response sent` every time.

  There are three faults. Find each from what the clients see (`openssl s_client` from `office`, `partner` or `monitor`, with `-servername NAME` or `-noservername`, `-tls1_2`, `-status`) and from nginx's error log, `on web tail -n 20 /var/log/nginx/error.log`, and fix it at its cause. Fixing one can change what you see.

  The rules of the fix:

  - **TLS 1.0 and 1.1 stay off,** and no file of nginx's may name them.
  - **The partner's and the monitor's programs stay as they are:** they aren't the shop's.
  - **Each site keeps its own certificate:** no name may be handed another site's.
  - **No client is told to skip checking certificates.**
  - **Every fix is in a file,** so it lasts a restart.

  `on web nano FILE` edits a file, `on web nginx -t` checks the files, and `sudo systemctl reload nginx@web` makes nginx read them again. When the sync, the monitor and the stapling all work, run the checks.
skills: [tls-server-config, tls-handshake]
