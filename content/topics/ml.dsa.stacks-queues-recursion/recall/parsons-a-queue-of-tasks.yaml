id: parsons-a-queue-of-tasks
type: parsons
rev: 1
prompt: |
  Put the lines in order to take the first of three tasks, put it back at the end of the queue, and print `a ['b', 'c', 'a']`. One line is a decoy that doesn't belong.
lines:
  - 'from collections import deque'
  - 'tasks = deque(["a", "b", "c"])'
  - 'first = tasks.popleft()'
  - 'tasks.append(first)'
  - 'print(first, list(tasks))'
distractors:
  - 'first = tasks.pop()'
explanation: |
  A queue takes from the front: `popleft()` returns `"a"`, the first in, and `append` puts it at the back. The decoy's `pop()` takes `"c"` from the back, which is a stack's behaviour. `deque` makes both ends one step.
skills: [stack-queue]
