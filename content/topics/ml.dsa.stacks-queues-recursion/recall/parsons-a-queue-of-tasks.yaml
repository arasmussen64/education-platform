id: parsons-a-queue-of-tasks
type: parsons
rev: 1
prompt: |
  Put the lines in order to queue a fourth task behind three, take the first one, and print `a ['b', 'c', 'd']`. One line is a decoy that doesn't belong.
lines:
  - 'from collections import deque'
  - 'tasks = deque(["a", "b", "c"])'
  - 'tasks.append("d")'
  - 'first = tasks.popleft()'
  - 'print(first, list(tasks))'
distractors:
  - 'first = tasks.pop()'
explanation: |
  A queue takes from the front: `popleft()` returns `"a"`, the first in. The decoy's `pop()` takes from the back, `"d"`, which is a stack's behaviour. `append` puts the new task at the back either way, and `deque` makes both ends one step.
skills: [stack-queue]
