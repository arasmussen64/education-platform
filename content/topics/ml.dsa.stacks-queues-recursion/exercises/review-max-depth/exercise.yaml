title: "Nesting depth, from memory"
prompt: |
  Write `max_depth(nested)` by recursion: a value that isn't a list is 0, an empty list is 1, and a list is 1 more than its deepest item. Print it for `3`, `[]` and `[1, [2, [3]], []]`:

  ```
  0 1 3
  ```
