id: debug-a-job-queue
stage: debug
rev: 1
title: "A job queue"
prompt: |
  Jobs arrive in a queue; a job may be a list of parts, which go to the back of the queue when it is reached. `count_jobs` should count the single jobs, and `run_all` should run them in arrival order. The program should print:

  ```
  6
  a d b c f e
  ```

  It has two bugs. Run it: the count is 10 for 6 jobs, because `count_jobs` adds one for every **list** as well as for every name; a list is not a job, only the sum of its parts. Fix that, and the jobs come out as `f e d c b a`, last in first out: `run_all` takes jobs from the **back** of the deque with `pop()`, which makes it a stack. A queue takes from the front.
skills: [stack-queue, recursion]
