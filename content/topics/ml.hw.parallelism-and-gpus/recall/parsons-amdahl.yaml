id: parsons-amdahl
type: parsons
rev: 1
prompt: |
  Put the lines in order to define Amdahl's law and print the speed-up of 90 percent parallel work on 1,000 workers, `9.9`. One line is a decoy that doesn't belong.
lines:
  - 'def speedup(parallel_fraction, workers):'
  - '    serial = 1 - parallel_fraction'
  - '    return 1 / (serial + parallel_fraction / workers)'
  - 'print(round(speedup(0.9, 1000), 1))'
distractors:
  - '    return 1 / (serial + parallel_fraction * workers)'
explanation: |
  The parallel part is divided among the workers and the serial part is left as it is, so the total time is `serial + parallel_fraction / workers` and the speed-up is 1 over that: 1 over (0.1 plus 0.0009), 9.9. The decoy multiplies the parallel part by the workers, as if more workers made the work bigger, and gives a speed-up under 1.
skills: [amdahl]
