title: "A to-do file"
prompt: |
  This program should write two to-do items to a file and print them back, numbered:

  ```
  1 buy milk
  2 call Ada
  ```

  It has three bugs: the file is opened in the wrong mode for writing, the items run together on one line, and the printed lines have blank lines between them. Run it, read the error, and check what each line of the file actually contains.
skills: [write-file, read-lines, with-block]
