id: debug-files
stage: debug
rev: 2
title: "A to-do file"
prompt: |
  This program should write two to-do items to a file, one per line, then print the file back with each line numbered:

  ```
  1 buy milk
  2 call Ada
  ```

  Instead it stops with an error before printing anything. It has three bugs, and fixing one shows the next. Run it, read the error, and after each fix compare the output with the example, then run the checks, which also look inside the file.
hints:
  - "Read the error's last line, then look at the line it names. What does the second argument to `open` ask for?"
  - "`\"r\"`, the default, opens a file for reading, and the file must already be there. `\"w\"` opens it for writing."
  - "`write` adds exactly the text you give it, with no line break of its own. How would the file know where one item ends and the next begins?"
  - "Each line read from a file still ends with its `\\n`, and `print` adds another, which makes a blank line. `line.rstrip()` takes the line's own one off."
skills: [write-file, read-lines, with-block]
