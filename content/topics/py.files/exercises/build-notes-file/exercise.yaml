id: build-notes-file
stage: build
rev: 2
title: "A notes file"
prompt: |
  Starting from a blank editor, write four functions with docstrings for a file of notes, one note per line:

  - `save_lines(path, lines)` writes the lines to the file, replacing what was there.
  - `append_line(path, line)` adds one line at the end, keeping what was there.
  - `load_lines(path)` returns the lines as a list, without their line breaks. If the file doesn't exist, it returns `[]` instead of crashing.
  - `count_lines(path)` returns how many lines the file has (0 if it doesn't exist).

  Then `main()` saves `["milk", "eggs"]` to `notes.txt`, appends `tea`, and prints the count and then each line:

  ```
  3
  milk
  eggs
  tea
  ```

  Call `main()` under `if __name__ == "__main__":`.
skills: [write-file, read-lines, with-block]
