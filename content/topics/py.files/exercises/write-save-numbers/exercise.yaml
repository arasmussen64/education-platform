id: write-save-numbers
stage: write
rev: 1
title: "Save the numbers"
prompt: |
  Write a function `save_numbers(path, numbers)` that writes the numbers to the file, one per line, replacing whatever the file held before. After `save_numbers("n.txt", [3, 10, 7])` the file contains three lines: `3`, `10` and `7`. The function returns nothing.
hints:
  - "Open with `\"w\"` so the file starts empty, inside a `with`."
  - "`write` takes text, so turn each number into a string, and add `\"\\n\"`: `f.write(f\"{number}\\n\")`."
skills: [write-file, with-block]
