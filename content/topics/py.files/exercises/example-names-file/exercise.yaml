id: example-names-file
stage: worked_example
rev: 1
title: "Save, then load"
prompt: |
  Two functions that are the shape of most file work: one writes a list to a file, one reads it back. Press **Run**. Then add a fourth name on line 18 and run again.
steps:
  - label: "Write, one line each"
    lines: "1-5"
    note: "`\"w\"` starts the file empty. Each `write` adds one name and a `\\n`, so the names land on separate lines. The `with` block closes the file at the end, which is when the text is safely saved."
  - label: "Read, one line at a time"
    lines: "8-14"
    note: "No mode means read. `for line in f` gives each line with its line break still on; `rstrip()` takes it off before the name goes into the list. The function returns the list and prints nothing."
  - label: "Use them"
    lines: "17-20"
    note: "Save, load, sort, print. Because `load_names` returns a plain list, everything you know about lists works on what came out of the file."
