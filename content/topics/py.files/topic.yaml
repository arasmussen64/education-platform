id: py.files
kind: topic
status: ready
title: "Files"
summary: "Read and write text files with open and with, one line at a time."
prerequisites: [py.exceptions]
estimated_minutes: 45
rev: 1
objectives:
  - "Read a text file line by line with `with open(...) as f:` and `for line in f:`, stripping the line break from each line."
  - "Write and append to a text file, one line at a time, with `\"w\"` and `\"a\"` and a `\\n` at the end of each line."
  - "Know what `with` does for you, and handle a file that isn't there with `except FileNotFoundError`."
