id: mcq-mode
type: mcq
rev: 1
prompt: |
  `log.txt` already has ten lines in it. What happens to them at `open("log.txt", "w")`?
choices:
  - 'They are kept; new text is added after them'
  - 'They are erased; the file starts empty'
  - 'An error: the file already exists'
  - 'Nothing: `"w"` only reads the file'
answer: 1
explanation: |
  `"w"` means write from scratch: the file is emptied the moment it's opened, before anything is written. To keep the ten lines and add to them, open with `"a"`, for append. Opening a file for reading never changes it.
skills: [write-file]
