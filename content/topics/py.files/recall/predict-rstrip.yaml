id: predict-rstrip
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines.
code: |
  with open("pets.txt", "w") as f:
      f.write("cat\n")
      f.write("dog\n")

  with open("pets.txt") as f:
      for line in f:
          print(line.rstrip() + "!")

  with open("pets.txt") as f:
      print(len(f.readlines()))
expected_output: |
  cat!
  dog!
  2
explanation: |
  Two lines are written, each ending in `\n`. Reading them back, each `line` is `"cat\n"` then `"dog\n"`; `rstrip()` removes the line break before the `!` is added. `readlines()` gives both lines as a list, so its length is 2.
skills: [read-lines, write-file]
