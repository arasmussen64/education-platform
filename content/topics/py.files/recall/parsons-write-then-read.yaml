id: parsons-write-then-read
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program writes a file and then prints `hello` (followed by a blank line, because `read()` keeps the line break). Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'with open("notes.txt", "w") as f:'
  - '    f.write("hello\n")'
  - 'with open("notes.txt") as f:'
  - '    print(f.read())'
distractors:
  - '    f.write(hello)'
explanation: |
  Writing comes first, with `"w"`, and the indented `write` belongs to that `with`. Then a second `with` opens the file for reading, and its indented `print` shows what's there. `f.write(hello)` without quotes names a variable that doesn't exist.
skills: [write-file, with-block]
