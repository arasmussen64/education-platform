id: mcq-with
type: mcq
rev: 1
prompt: |
  Why write `with open("data.txt") as f:` instead of `f = open("data.txt")`?
choices:
  - '`with` makes the file read faster'
  - '`with` lets you read and write at the same time'
  - '`with` closes the file for you when the block ends, even if an error happens inside it'
  - 'There''s no difference; `with` is just shorter'
answer: 2
explanation: |
  The `with` block owns the file: when the indented lines end, however they end, the file is closed. That saves written text to disk and frees the file. Without `with`, you'd have to call `f.close()` yourself and remember it on every path, including after errors.
skills: [with-block]
