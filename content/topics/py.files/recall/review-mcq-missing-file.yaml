id: review-mcq-missing-file
type: mcq
rev: 1
prompt: |
  What happens at `open("missing.txt")` when there's no such file?
choices:
  - 'An empty file is created and opened'
  - 'A `FileNotFoundError` is raised, which `try` / `except FileNotFoundError` can catch'
  - '`open` returns `None`'
  - 'The program waits for the file to appear'
answer: 1
explanation: |
  Opening for reading never creates a file; a missing one is an error, like a bad `int()`. Catch it where you can decide what to do: print a message, or carry on as if the file were empty. Opening with `"w"` or `"a"` does create the file if it isn't there.
skills: [with-block]
