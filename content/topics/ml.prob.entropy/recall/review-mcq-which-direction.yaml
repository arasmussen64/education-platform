id: review-mcq-which-direction
type: mcq
rev: 1
prompt: |
  KL divergence is not symmetric. In the cross-entropy loss for a classifier, which is `P` and which is `Q` in `D(P ‖ Q)`?
choices:
  - '`P` is the data (the true labels'' distribution) and `Q` is the model''s probabilities'
  - '`P` is the model and `Q` is the data, since the model is what we compute with and the data is what we measure against'
  - 'It doesn''t matter, because the loss is symmetric even if KL isn''t: swapping them changes the number but not the minimizer'
  - 'Neither; the loss uses entropy, not KL, because the labels'' entropy is zero and only the model''s term remains'
answer: 0
explanation: |
  Outcomes come from the data, and surprise is measured with the model's belief, so the cross-entropy is `H(data, model)` and the loss minimizes `D(data ‖ model)`. Swapping them would average over the model's probabilities instead of the data's and would give a different number and a different minimizer.
skills: [kl, loss]
