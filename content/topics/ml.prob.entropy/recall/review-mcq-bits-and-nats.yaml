id: review-mcq-bits-and-nats
type: mcq
rev: 1
prompt: |
  Module 4's cross-entropy loss used `np.log` and this topic uses `np.log2`. How do the two numbers relate?
choices:
  - 'A nat is `log2(e) = 1.443` bits, so 0.299 nats is 0.431 bits; the same model minimizes both'
  - 'They are unrelated: one is a loss that training minimizes and the other is an entropy that describes a distribution'
  - 'A nat is 2 bits, because `e` is about 2, so the loss in nats is half the surprise in bits'
  - 'The nats version is always smaller, so it is the better loss, which is why libraries use the natural log'
answer: 0
explanation: |
  `log2(x) = ln(x) / ln(2)`, so every quantity in bits is the quantity in nats divided by `ln 2 = 0.693`, or times 1.443. The units differ, the ranking of models doesn't, which is why libraries use natural logs (simpler derivatives) and information theory uses bits (one yes-or-no question each).
skills: [surprise, loss]
