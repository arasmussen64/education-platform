id: write-the-loss-by-its-name
stage: write
rev: 1
title: "The loss, by its name"
prompt: |
  Write `cross_entropy_loss(labels, p_hat)`: for each example take the probability the model gave the true answer (`p_hat` where the label is 1, `1 - p_hat` where it is 0), and return the mean of `-np.log` of those, in nats, as a float. Then print it for the starter's labels and probabilities, print Module 4's formula `-mean(y log p + (1 - y) log(1 - p))` for the same data to see they agree, and print the loss for the near-perfect probabilities `labels * 0.999 + 0.0005` (0.9995 for every true answer) and for a model that says 0.5 for everything:

  ```
  0.299
  0.299
  0.0005 0.6931
  ```

  The last number is `ln 2`: guessing a half costs one bit per example, which is 0.693 nats.
hints:
  - "`np.where(labels == 1, p_hat, 1 - p_hat)` picks the probability of the true answer for every example at once."
  - "Mean, not sum: the loss is per example."
skills: [loss]
