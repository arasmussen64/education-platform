- term: shell
  definition: "The program that reads a line of text you type, runs it as a command and prints the result. On most Linux servers it's `bash`."
- term: process
  definition: "A program while it's running, with its own memory, open files and a number the kernel knows it by, the PID."
- term: system call
  aliases: [syscall]
  definition: "One request a program makes to the kernel, such as open this file, read from that connection or wait this long. `strace` lists them as they happen."
- term: stderr
  aliases: [standard error]
  definition: "A program's second output stream, kept for errors and complaints so they stay apart from its real output (stdout). Its number is 2, as in `2>/dev/null`."
- term: exit status
  aliases: [exit code]
  definition: "The number a command leaves behind when it ends: 0 means it worked, anything else means it didn't. `echo $?` prints the last one."
- term: shebang
  definition: "The first line of a script, starting `#!`, which names the program that should run the file, such as `#!/usr/bin/env bash`."
