id: mcq-jq-path
type: mcq
rev: 1
prompt: |
  A cloud command gives you JSON like this, and you want just the first server's name:
  ```json
  {"servers": [{"name": "web-1", "state": "running"}, {"name": "web-2", "state": "stopped"}]}
  ```
  Which command picks it out?
choices:
  - "`grep name servers.json`"
  - "`jq '.servers[0].name' servers.json`"
  - "`cut -d, -f1 servers.json`"
  - "`awk '{print $2}' servers.json`"
answer: 1
explanation: |
  `jq` understands JSON's structure: `.servers` is the list, `[0]` its first item, `.name` that item's field, so it prints `"web-1"`. `grep` prints the whole matching line, which here is the whole document. `cut` and `awk` split on characters, not on the structure, so they break as soon as the JSON is laid out differently. For JSON, reach for `jq` the way you reach for `awk` for columns.
skills: [sed-awk]
