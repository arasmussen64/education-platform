id: mcq-jq-path
type: mcq
rev: 2
prompt: |
  A cloud command gives you JSON like this, and you want just the first server's name:
  ```json
  {"servers": [{"name": "web-1", "state": "running"}, {"name": "web-2", "state": "stopped"}]}
  ```
  Which command picks it out?
choices:
  - "`jq '.servers.name[0]' servers.json`"
  - "`grep name servers.json | head -n 1`"
  - "`jq '.servers[0].name' servers.json`"
  - "`awk -F, '{print $1}' servers.json`"
answer: 2
explanation: |
  `jq` understands JSON's structure: `.servers` is the list, `[0]` its first item (counting starts at 0), `.name` that item's field, so it prints `"web-1"`. The order matters: `.servers.name[0]` asks the list itself for a `name`, which a list doesn't have, so `jq` stops with an error. Pick the item first, then the field. `grep` and `head` work on lines, and here the whole document is one line, so the first matching line is everything. `awk -F,` splits on commas, not on the structure, so it prints everything up to the first comma, brackets and all, and breaks as soon as the JSON is laid out differently. For JSON, reach for `jq` the way you reach for `awk` for columns.
skills: [sed-awk]
