id: mcq-iostat-vmstat
type: mcq
rev: 1
prompt: |
  A server is slow. You suspect either the disk or memory. Which pair of tools answers "is the disk saturated?" and "is the machine swapping?"
choices:
  - "`iostat -x 1` for the disk; `vmstat 1` for swapping"
  - "`grep` for the disk; `sed` for swapping"
  - "`lsof` for the disk; `strace` for swapping"
  - "`find` for the disk; `sort` for swapping"
answer: 0
explanation: |
  `iostat -x 1` prints each disk's utilisation and wait times every second: a disk near 100% busy with long waits is saturated. `vmstat 1` prints memory, swap in and out (`si` and `so`), the run queue and CPU every second: steady non-zero `si` and `so` mean the machine is swapping. The other tools work on text or on a single process, not on the machine's resources.
skills: [diagnose-tools]
