id: mcq-lsof-port
type: mcq
rev: 2
prompt: |
  Your service won't start: "address already in use" on port 8080. Which command tells you which process holds the port?
choices:
  - "`find / -name 8080`"
  - "`strace -p 8080`"
  - "`grep -r 8080 /etc`"
  - "`lsof -i :8080`"
answer: 3
explanation: |
  `lsof` is the tool that shows which files and network ports processes have open, and `lsof -i :8080` lists the ones holding that port, with their PIDs; `ss -ltnp` shows the same from the socket side. `strace` shows the system calls of one process, and `-p` takes a process ID, so `strace -p 8080` would attach to whichever process happens to have PID 8080. Searching `/etc` with `grep` finds the config files that mention 8080, which tells you what is *set up* to use the port, not what is holding it right now. And `find -name` looks for a file that is *called* `8080`; a port isn't a file with a name.
skills: [diagnose-tools]
