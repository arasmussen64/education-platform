id: mcq-lsof-port
type: mcq
rev: 1
prompt: |
  Your service won't start: "address already in use" on port 8080. Which command tells you which process holds the port?
choices:
  - "`lsof -i :8080` (or `ss -ltnp`)"
  - "`iostat -x 1`"
  - "`strace ./service`"
  - "`grep 8080 /etc/services`"
answer: 0
explanation: |
  `lsof -i :8080` lists the processes that have that network port open, with their PIDs; `ss -ltnp` shows the same from the socket side. `iostat` is for disks. `strace` would show *your* service failing to bind, which you already know. `/etc/services` is a static list of port names, not of what's running.
skills: [diagnose-tools]
