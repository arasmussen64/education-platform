id: mcq-grep-recursive
type: mcq
rev: 2
prompt: |
  You want every line, in every file under the current folder, that contains `TODO`, with the file name and the line number. Which command?
choices:
  - "`grep -n TODO *`"
  - "`find . -name TODO`"
  - "`grep -rn TODO .`"
  - "`cat * | grep TODO`"
answer: 2
explanation: |
  `-r` makes `grep` search folders recursively, `-n` adds line numbers, and `.` says where to start; with more than one file, `grep` prefixes each line with its file name. `grep -n TODO *` gets the names and numbers right but stops at the top: `*` is only what's in the current folder, and without `-r` `grep` skips each folder there with a complaint that it "is a directory". `find -name` matches file *names*, not their contents. `cat *` also reads only the current folder's files, and joins them into one stream, so the file names and line numbers are lost.
skills: [grep-filter]
