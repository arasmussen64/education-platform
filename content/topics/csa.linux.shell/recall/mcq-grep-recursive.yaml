id: mcq-grep-recursive
type: mcq
rev: 1
prompt: |
  You want every line, in every file under the current folder, that contains `TODO`, with the file name and the line number. Which command?
choices:
  - "`grep TODO`"
  - "`grep -rn TODO .`"
  - "`find . -name TODO`"
  - "`cat * | grep TODO`"
answer: 1
explanation: |
  `-r` makes `grep` search folders recursively, `-n` adds line numbers, and `.` says where to start; with more than one file, `grep` prefixes each line with its file name. Plain `grep TODO` has no file, so it waits for input from the keyboard. `find -name` matches file *names*, not their contents. `cat *` reads only the files in the current folder, not the ones below, and loses the file names.
skills: [grep-filter]
