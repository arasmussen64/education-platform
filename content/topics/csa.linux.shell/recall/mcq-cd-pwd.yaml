id: mcq-cd-pwd
type: mcq
rev: 1
prompt: |
  You run these three commands in turn:
  ```
  cd /var/log
  cd ..
  pwd
  ```
  What does `pwd` print?
choices:
  - "`/var/log`"
  - "`/var`"
  - "`/`"
  - "`..`"
answer: 1
explanation: |
  `cd /var/log` moves to that folder (an absolute path: it starts at `/`, the root). `..` always means "the folder above this one", so `cd ..` moves up to `/var`. `pwd` prints where you are: `/var`. One more `cd ..` would reach `/`.
skills: [navigate]
