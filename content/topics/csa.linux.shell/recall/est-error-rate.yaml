id: est-error-rate
type: estimate
rev: 1
prompt: |
  `wc -l access.log` prints 2400: one line for each request in the last hour. Counting the lines whose status is 500 or above gives 60. What percentage of the hour's requests did the server fail? Exactly.
unit: "%"
answer: 2.5
tolerance: { absolute: 0 }
given: { requests: 2400, failed: 60 }
working: failed / requests * 100
mistakes:
  - id: fraction
    value: 0.025
    working: failed / requests
    why: That's the share as a fraction. A percentage is that times 100, which is 2.5%.
  - id: upside-down
    value: 40
    working: requests / failed
    why: That divides the wrong way round. It says one request in 40 failed, which as a percentage is 60 ÷ 2400 × 100 = 2.5.
explanation: |
  60 ÷ 2400 = 0.025, and × 100 makes it 2.5%. The quick way in your head: 1% of 2400 is 24, and 60 is two and a half 24s. A count of errors means little without the count of everything beside it: 60 failures in an hour is a bad hour out of 2,400 requests and a quiet one out of 2 million, which is why the two `wc -l` numbers travel together.
skills: [count-and-sort]
