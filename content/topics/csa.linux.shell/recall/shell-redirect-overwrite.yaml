id: shell-redirect-overwrite
type: predict_shell
rev: 1
prompt: |
  `>` sends a command's output into a file instead of the screen, and `>>` does the same but adds to the end of the file. Three `echo` commands write to `out.txt`, then `cat` shows the file. What is printed?
command: echo one > out.txt; echo two >> out.txt; echo three > out.txt; cat out.txt
expected_output: |
  three
explanation: |
  The first `>` creates `out.txt` holding `one`. `>>` appends, so the file then holds `one` and `two`. The second `>` *replaces* the whole file, leaving only `three`, which is all `cat` finds. That's the difference to remember: `>` starts the file fresh every time, `>>` keeps what's there.
skills: [pipes-redirects]
