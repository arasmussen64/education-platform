id: shell-ls-order
type: predict_shell
rev: 1
prompt: |
  The folder holds two files and a folder called `notes`, with a file inside it. What does `ls` print? In the plain sort order used here, capital letters come before small ones, and a folder is listed by its name like any file.
files:
  README: |
    Read me first.
  a.txt: |
    alpha
  notes/todo.md: |
    - buy milk
command: ls
expected_output: |
  README
  a.txt
  notes
explanation: |
  `ls` lists what's in the current folder, one name per line when its output goes to another program or a file (on a terminal it packs the names into columns). It sorts the names: in the plain byte order used here, `R` (a capital) comes before `a` (a small letter). The folder `notes` appears by name only; `ls` doesn't look inside it unless you ask, with `ls notes`, or `ls -R` for everything below.
skills: [navigate]
