id: mcq-strace
type: mcq
rev: 1
prompt: |
  A program has been "running" for ten minutes with no output and no CPU use. You want to see what it's waiting for. Which tool shows the system calls it is making right now?
choices:
  - "`strace -p <pid>`"
  - "`lsof -p <pid>`"
  - "`vmstat 1`"
  - "`grep <pid> /var/log/syslog`"
answer: 0
explanation: |
  `strace` attaches to a running process and prints every system call it makes, so a program stuck in `read(...)` on a socket, or waiting for a lock, shows exactly that line. `lsof -p` lists the files and connections the process has open: useful next, to see *which* socket. `vmstat` is about the whole machine's memory and CPU, and the log holds only what the program chose to write.
skills: [diagnose-tools]
