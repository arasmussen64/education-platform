id: shell-sed-first-vs-all
type: predict_shell
rev: 1
prompt: |
  `sed 's/old/new/'` replaces text on each line. What do the two commands print? Look closely at the end of the second one.
command: echo "a-b-c" | sed 's/-/_/'; echo "a-b-c" | sed 's/-/_/g'
expected_output: |
  a_b-c
  a_b_c
explanation: |
  Without a flag, `s` replaces only the *first* match on each line, so one dash changes. The `g` flag (global) replaces every match on the line. Forgetting `g` is the classic `sed` mistake: a file "cleaned" with exactly one change per line.
skills: [sed-awk]
