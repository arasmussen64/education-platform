id: shell-sort-numbers
type: predict_shell
rev: 1
prompt: |
  `sort` compares lines as text unless you say `-n` for numbers. What do the two sorts print? The `echo ---` prints a separator between them.
files:
  sizes.txt: |
    10
    9
    100
command: sort sizes.txt; echo ---; sort -n sizes.txt
expected_output: |
  10
  100
  9
  ---
  9
  10
  100
explanation: |
  As text, `1` comes before `9`, so `10` and `100` sort before `9`, the way words do in a dictionary. `-n` reads each line as a number and gives the order you expect. The same trap bites when sorting counts: use `sort -rn`, not `sort -r`.
skills: [count-and-sort]
