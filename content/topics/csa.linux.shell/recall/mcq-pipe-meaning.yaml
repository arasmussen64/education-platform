id: mcq-pipe-meaning
type: mcq
rev: 2
prompt: |
  In `sort names.txt | uniq`, what does the `|` do?
choices:
  - "Runs `sort`, and then runs `uniq` on the same file"
  - "Runs `uniq` only if `sort` finished without an error"
  - "Saves what `sort` prints into a file called `uniq`"
  - "Sends what `sort` prints into `uniq` as its input"
answer: 3
explanation: |
  A pipe connects the output of the program on the left to the input of the one on the right, so `uniq` reads the sorted lines, which never appear on the screen; it doesn't open `names.txt` itself. `uniq` only removes duplicates that are *next to each other*, which is why `sort` comes first. Running the second command only if the first succeeded is `&&`, and saving output into a file is `>`.
skills: [pipes-redirects]
