id: mcq-pipe-meaning
type: mcq
rev: 1
prompt: |
  In `sort names.txt | uniq`, what does the `|` do?
choices:
  - "Runs `sort`, and then runs `uniq` on the same file"
  - "Sends what `sort` prints into `uniq` as its input, instead of to the screen"
  - "Runs `uniq` only if `sort` succeeded"
  - "Saves the output of `sort` into a file called `uniq`"
answer: 1
explanation: |
  A pipe connects the output of the program on the left to the input of the one on the right, so `uniq` reads the sorted lines rather than the file. `uniq` only removes duplicates that are *next to each other*, which is why `sort` comes first. "Only if the first succeeded" is `&&`, and saving to a file is `>`.
skills: [pipes-redirects]
