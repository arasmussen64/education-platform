id: shell-head-tail
type: predict_shell
rev: 1
prompt: |
  `head` prints the first lines of a file and `tail` the last ones; `-n` says how many. The `;` runs the second command after the first. What do the two commands print, together?
files:
  names.txt: |
    ada
    grace
    linus
    margaret
    ken
command: head -n 2 names.txt; tail -n 1 names.txt
expected_output: |
  ada
  grace
  ken
explanation: |
  `head -n 2` prints the first two lines, `ada` and `grace`. Then `tail -n 1` prints the last line, `ken`. Each command prints on its own; `;` just runs them one after the other. Both are how you peek at a big log without printing all of it.
skills: [navigate]
