id: build-log-report
stage: build
runtime: lab
rev: 1
title: "A report from the shop's logs"
prompt: |
  The container is a small web shop's server. Its logs are in `/var/log/shop/`: `access.log` has one request per line (`METHOD PATH STATUS BYTES`), `app.log` has the application's log lines, and `requests.csv` has `user,path` rows with a header.

  Working in your home folder, make a folder called `report` holding four files:

  - `failed-count.txt`: the number of requests in `access.log` whose status code is in the 500s, as a plain number.
  - `top-path.txt`: the single most requested path in `access.log`, as it appears in the log.
  - `unique-users.txt`: how many different users appear in `requests.csv`, not counting the header line.
  - `errors.txt`: every line of `app.log` that mentions an error, whatever its capitalisation, in the order they appear, exactly as they are.

  Build each answer as a pipeline and check it before you write the file. When you're done, run the lab's checks.
skills: [grep-filter, count-and-sort, pipes-redirects]
