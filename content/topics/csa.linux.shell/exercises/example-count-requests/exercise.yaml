id: example-count-requests
stage: worked_example
runtime: lab
rev: 1
title: "Two questions about a log, answered and saved"
prompt: |
  Your first lab. The container is a small web shop's server with its logs in `/var/log/shop/`: `access.log` has one request per line (`METHOD PATH STATUS BYTES`) and `app.log` has the application's log lines. The walkthrough below answers two questions with pipelines and saves the answers into files. Start the lab, open its shell, and type each line yourself, watching what each one prints before you add the next. Then run the checks.
steps:
  - label: "Make a folder for the answers"
    lines: "1"
    note: "`mkdir -p` creates `example` in your home folder, and doesn't complain if it already exists. `~` is your home folder."
  - label: "Go where the logs are"
    lines: "2"
    note: "`cd` into `/var/log/shop`, an absolute path. `ls` there shows the two logs; `head -n 3 access.log` shows what a line looks like."
  - label: "Count the requests by status"
    lines: "3"
    note: "Four stages: `awk` keeps only the third field, the status; `sort` puts equal statuses next to each other; `uniq -c` counts each run; `sort -rn` puts the biggest count first. `>` saves the result instead of printing it. Run the pipeline without the `>` first to see it."
  - label: "The first three error lines"
    lines: "4"
    note: "`grep -i` finds lines with `error` in any capitalisation, and `head -n 3` keeps the first three. The log mixes `ERROR` and `error`, so the `-i` matters."
  - label: "Look at what you saved"
    lines: "5"
    note: "`cat` prints the two files one after the other, so you can see the answers. Now run the lab's checks from your own terminal."
