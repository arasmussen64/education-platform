id: fill-count-errors
stage: fill_in
runtime: lab
rev: 2
title: "Finish the error counter"
prompt: |
  In the lab, `~/bin/count-errors` is a script with three gaps, each marked `...`. Given a log file as its argument, it should print two things: how many of the file's lines mention an error, in any capitalisation, and then the first of those lines.

  Open it with `nano ~/bin/count-errors` and replace each `...` with what belongs there (a gap can hold more than one word). Save with Ctrl+O and then Enter, and leave with Ctrl+X, as in the lesson. The script is already marked executable, so there is no `chmod` to do. Try it: `~/bin/count-errors /var/log/shop/app.log`. It should work on any log, so try `/var/log/shop/worker.log` too. Then run the checks.
hints:
  - "`grep -c` counts matching lines instead of printing them, and `-i` ignores the difference between `ERROR` and `error`. The pattern is the word `error`."
  - "The second command prints the matching lines and keeps only the first: `head -n 1`."
  - "The file to read is already in place on both lines: `\"$log\"` is the script's first argument, named on the line `log=\"$1\"`. Only the `...` need changing."
skills: [grep-filter, pipes-redirects]
