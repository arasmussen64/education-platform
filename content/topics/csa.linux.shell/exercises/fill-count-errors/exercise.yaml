id: fill-count-errors
stage: fill_in
runtime: lab
rev: 1
title: "Finish the error counter"
prompt: |
  In the lab, `~/bin/count-errors` is a script with three gaps marked `...`. Given a log file, it should print how many lines mention an error, in any capitalisation, and then the first such line. Open it with `nano ~/bin/count-errors`, fill the gaps, and try it: `~/bin/count-errors /var/log/shop/app.log`. It should work on any log, so try `/var/log/shop/worker.log` too. Then run the checks.
hints:
  - "`grep -c` counts matching lines instead of printing them, and `-i` ignores the difference between `ERROR` and `error`. The pattern is the word `error`."
  - "The second command prints the matching lines and keeps only the first: `head -n 1`."
  - "Both commands take the log file from the variable `log`, so quote it: `\"$log\"`."
skills: [grep-filter, pipes-redirects]
