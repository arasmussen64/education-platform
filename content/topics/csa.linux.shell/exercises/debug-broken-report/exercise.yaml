id: debug-broken-report
stage: debug
runtime: lab
rev: 2
title: "The report that lies"
prompt: |
  In the lab, `~/bin/report LOGFILE` is meant to print three lines about a `METHOD PATH STATUS BYTES` log: `requests: N` (how many requests the log holds), `failed: N` (how many of them have a status in the 500s) and `top: PATH` (the most requested path).

  Run it on `/var/log/shop/access.log`. It prints `failed: 22` and `top: 200`, and neither is true: more requests than that failed, and `200` is not a path.

  The script has three bugs. Find and fix them (`nano ~/bin/report` opens the script), make sure the report is right for `/var/log/shop/old-access.log` as well, and run the checks.
skills: [grep-filter, count-and-sort, pipes-redirects]
