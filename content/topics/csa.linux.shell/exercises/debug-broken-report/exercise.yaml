id: debug-broken-report
stage: debug
runtime: lab
rev: 1
title: "The report that lies"
prompt: |
  In the lab, `~/bin/report LOGFILE` is meant to print three lines about a `METHOD PATH STATUS BYTES` log: `requests: N` (how many lines), `failed: N` (how many with a status in the 500s) and `top: PATH` (the most requested path). Run it on `/var/log/shop/access.log`: the first line is right and the other two are wrong.

  It has three bugs: one in what the failed line counts, and two in the pipeline behind the top line. Work out each true answer with your own pipeline first, then read the script's version of it and find what differs. Fix all three with `nano ~/bin/report`, check it on `/var/log/shop/old-access.log` as well, and run the checks.
skills: [grep-filter, count-and-sort, pipes-redirects]
