id: write-top-paths
stage: write
runtime: lab
rev: 1
title: "Write top-paths"
prompt: |
  Write a script, `~/bin/top-paths`, that takes two arguments, a log file in the `METHOD PATH STATUS BYTES` format and a number N, and prints the N most requested paths, biggest first, one per line as `COUNT PATH` (the count, a space, the path). For example, `~/bin/top-paths /var/log/shop/access.log 2` prints two lines.

  Start the file with `#!/usr/bin/env bash`, make it executable with `chmod +x`, and try it on both `/var/log/shop/access.log` and `/var/log/shop/old-access.log` with different values of N. Then run the checks.
hints:
  - "The arguments arrive as `$1` (the log) and `$2` (N). Give them names: `log=\"$1\"` and `n=\"$2\"`."
  - "The pipeline is the one from the lesson: take the path field with `awk '{print $2}'`, then `sort`, `uniq -c`, `sort -rn`, and `head -n \"$n\"`."
  - "`uniq -c` pads the count with spaces. A final `awk '{print $1, $2}'` prints count and path with one space between."
skills: [count-and-sort, pipes-redirects]
