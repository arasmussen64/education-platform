id: csa.linux.shell
kind: topic
status: ready
title: "Shell essentials"
summary: "Move around a Linux machine from the command line, and answer questions about files and logs by joining small tools with pipes: grep, cut, sort, uniq, sed and awk."
prerequisites: []
estimated_minutes: 120
rev: 1
objectives:
  - "Read a command as a program, its options and its arguments; move around with `pwd`, `cd` and `ls`; look inside files with `cat`, `head`, `tail` and `find`."
  - "Join commands with pipes and redirections (`|`, `>`, `>>`, `2>&1`) and say what each stage receives and produces."
  - "Answer a question about a log or a CSV file with `grep`, `cut`, `sort`, `uniq -c`, `wc`, `sed` and `awk`, and know what `jq` is for."
  - "Name the tool that shows what a misbehaving program is doing: `strace`, `lsof`, `iostat` or `vmstat`."
