prove:
  build: build-log-report
  debug: debug-broken-report
  explain:
    prompt: |
      A colleague hands you a web server's log, one request per line with its status code, and asks two things: how many requests failed yesterday, and which page failed most. Explain, in your own words, how you'd answer with the shell: what a pipeline is and why you'd build it one stage at a time; which tool picks out the lines, which splits off the field, and how `sort` and `uniq -c` work together to count; where `awk` or `sed` would come in; and what you'd reach for instead if the server itself were misbehaving, say hanging, or refusing to start because its port is taken.
    rubric:
      - id: pipeline
        required: true
        description: "A pipeline passes one command's output into the next command's input with |; it's built one stage at a time, looking at each stage's output before adding the next."
      - id: pick-lines
        required: true
        description: "grep selects the lines that match (the failing status), with -c to count them, -v to drop lines, -i to ignore case."
      - id: fields-and-counts
        required: true
        description: "cut or awk takes the field with the page; sort puts equal lines next to each other so uniq -c can count them; sort -rn and head give the most frequent."
      - id: edit-compute
        required: false
        description: "sed changes text (s/old/new/g); awk filters and adds up fields (NR > 1 to skip a header); jq does the same for JSON."
      - id: diagnose
        required: true
        description: "For a misbehaving program: strace shows the system calls it's stuck in, lsof shows which process holds a file or a port, iostat and vmstat show disk and memory pressure."
    model_answer: |
      A pipeline is a chain of small programs joined with |, where each one's output becomes the next one's input, and I'd build it one stage at a time, running it and looking at the result before adding the next stage, so I always know what the next tool is being handed. For the failures I'd start with grep to keep only the lines with the failing status, say grep ' 500 ' access.log, and count them with grep -c or by piping into wc -l. For the page that failed most I'd take the same lines and cut out the field that holds the page, with cut -d' ' -f2 or awk '{print $2}', then sort, because uniq only merges lines that are next to each other, then uniq -c to count each page, sort -rn to put the biggest count first, and head -n 1 to keep the top one. If the log needed cleaning first, sed could change or strip text on each line, and awk could filter on a field or add a column up, remembering to skip a header line with NR > 1, because awk would compare the header's text with the number as text and let it through. If the server itself were the problem rather than the log, I'd look at the program instead of at text: strace to see which system call it's stuck in, lsof -i :8080 (or ss -ltnp) to see which process already holds its port, and iostat or vmstat to see whether the disk is saturated or the machine is swapping.
