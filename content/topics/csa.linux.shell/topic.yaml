  - shell-find-logs
  - shell-sort-numbers
  - mcq-strace
  - mcq-iostat-vmstat
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: navigate
    description: "Move around and look: `pwd`, `cd`, `ls`, `cat`, `head`, `tail`, and `find` by name"
  - id: pipes-redirects
    description: "Join commands with `|`, `>`, `>>` and `2>&1`, and say what each stage receives and produces"
  - id: grep-filter
    description: "Pick lines out of files with `grep` and its flags: `-n`, `-i`, `-c`, `-v`, `-r`"
  - id: count-and-sort
    description: "Fields and counts: `cut`, `sort`, `uniq -c`, `wc` and `head`, to answer how many and which most"
  - id: sed-awk
    description: "Edit and compute over text with `sed` and `awk`, and know that `jq` does the same for JSON"
  - id: diagnose-tools
    description: "Pick the tool that shows what a misbehaving program is doing: `strace`, `lsof`, `iostat`, `vmstat`"
