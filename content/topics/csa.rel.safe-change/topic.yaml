title: Safe change at scale
summary: Roll a change out in stages (one machine, one zone, one region, then waves) with bake times and automatic rollback on health signals.
prerequisites:
- csa.m16.checkpoint
estimated_minutes: 240
rev: 1
objectives:
- Roll a change out in stages (one machine, one zone, one region, then waves) with bake times and automatic rollback on health signals.
- Treat configuration, feature flags, certificates and schema changes as deployments with the same stages.
- Find the global configuration that can break every region at once, and bound it.
- Explain, from providers' post-incident reviews, how a staged rollout would have contained each outage.
