id: py.logical-operators
kind: topic
status: ready
title: "Logical operators"
summary: "Combine conditions with and, or and not, and avoid the `x == 1 or 2` trap."
prerequisites: [py.if-elif-else]
estimated_minutes: 50
rev: 1
objectives:
  - "Combine two conditions with `and` (both must be `True`) or `or` (either is enough), and predict the answer."
  - "Flip a condition with `not`."
  - "Spot the trap `x == 1 or 2`, which is always `True`, and compare on both sides instead: `x == 1 or x == 2`."
