    url: https://www.youtube.com/watch?v=_b6NgY_pMdw&t=1108s
    type: video
    use: embed
    # From "or" to just before the parity program (18:28 to 34:07): or, and,
    # the grade program, chained comparisons like 90 <= score <= 100, and
