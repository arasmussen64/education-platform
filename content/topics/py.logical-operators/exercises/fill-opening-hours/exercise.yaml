id: fill-opening-hours
stage: fill_in
rev: 1
title: "Opening hours"
prompt: |
  A shop is open from 9 up to (but not including) 17, and its staff take lunch at 12 and 13. This program reads an hour from 0 to 23. Replace each `...` with a condition so that typing `10` prints:

  ```
  Open
  Lunch break: False
  ```

  and `12` prints `Open` then `Lunch break: True`, and `17` prints `Closed` then `Lunch break: False`.
hints:
  - "Being open needs two things to be true at once, 9 or more *and* less than 17: join them with `and`."
  - "Lunch is at either hour, so `or`, but write the comparison on both sides: `hour == 12 or hour == 13`. `hour == 12 or 13` would always count as true."
skills: [and-or, or-trap]
