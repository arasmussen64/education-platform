id: build-museum
stage: build
rev: 1
title: "Museum entry"
prompt: |
  Starting from a blank editor, write a program for a museum's entry price. It asks for the visitor's age (a whole number) and whether they're a member (`yes` or `no`). Entry is free for children under 5 and for anyone 70 or older. Otherwise it costs $4 for ages 5 to 17 and $12 for everyone else. Members pay half of that price (free stays free). The price always has two decimal places. Typing `30` and `yes` should print:

  ```
  Entry: $6.00
  ```
skills: [and-or, or-trap]
