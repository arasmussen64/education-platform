id: write-login
stage: write
rev: 1
title: "A login check"
prompt: |
  Write a program that asks for a username and then a PIN (a whole number). If the username is `ada` and the PIN is `1234`, it prints `Welcome`; otherwise it prints `Access denied`. Typing `ada` and `1234` should print:

  ```
  Welcome
  ```
hints:
  - "Both things have to be right at once, so join the two comparisons with `and`."
  - "The PIN is a whole number: read it with `int(input(...))`, so `pin == 1234` compares numbers."
  - "`else` handles every other case in one go: a wrong name, a wrong PIN, or both."
skills: [and-or]
