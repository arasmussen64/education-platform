stage: debug
rev: 1
title: "Weekend plans"
prompt: |
  This program reads a day (like `Sat` or `Mon`) and a temperature, then answers three questions: is it the weekend (`Sat` or `Sun`), is it a beach day (a weekend day with more than 20 degrees), and is it a day to stay in (a weekday colder than 5 degrees)? Typing `Sat` and `25` should print:

  ```
  Weekend: True
  Beach day: True
  Stay in: False
  ```

  and `Mon` and `3` should print `False`, `False`, `True`. It has three bugs. Run it with each of those, fix what you find, and run it again. Look closely at the first line it prints for `Mon`.
skills: [or-trap, and-or, not]
