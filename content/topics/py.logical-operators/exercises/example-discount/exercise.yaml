id: example-discount
stage: worked_example
rev: 1
title: "Two questions at once"
prompt: |
  This program prices a ticket: children and seniors pay less, and members who pay full price get $2 off. Press **Run** a few times (try `8` and `no`, then `30` and `yes`, then `70` and `yes`), and read how the conditions combine.
steps:
  - label: "Read the age and the membership"
    lines: "1-2"
    note: "The age becomes a number. The membership answer stays text, because we'll compare it with the text `\"yes\"`."
  - label: "Either is enough: or"
    lines: "3-6"
    note: "`age < 12 or age >= 65` is `True` if either comparison is. Note that both sides are complete questions: `age < 12 or 65` would be a mistake, always `True`."
  - label: "Both are needed: and"
    lines: "7-8"
    note: "`member == \"yes\" and price > 6` is `True` only when both comparisons are. A senior member pays 6 already, so the second half is `False` and no $2 comes off."
  - label: "Print the result"
    lines: "9"
    note: "Whatever happened above, `price` has a value, so this line always runs."
