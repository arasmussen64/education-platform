id: review-mcq-or-trap-fix
type: mcq
rev: 1
prompt: |
  Which line correctly checks whether `size` is `"S"` or `"M"`?
choices:
  - '`if size == "S" or "M":`'
  - '`if size == "S" or size == "M":`'
  - '`if size == "S" and size == "M":`'
  - '`if size == ("S" or "M"):`'
answer: 1
explanation: |
  Each side of `or` must be a complete question, so the comparison is written twice. `size == "S" or "M"` is always `True`, because `"M"` on its own counts as `True`. `and` would need `size` to be both at once, which is impossible. `("S" or "M")` is just `"S"`, so the last one only checks for `"S"`.
skills: [or-trap]
