id: review-predict-truth
type: predict_output
rev: 1
prompt: |
  What will this program print? Five lines, one per `print`.
code: |
  a = 5
  b = 12
  print(a < 10 and b < 10)
  print(a < 10 or b < 10)
  print(not (a < 10))
  print(a == 5 or b == 5)
  print(a == 5 and b == 5)
expected_output: |
  False
  True
  False
  True
  False
explanation: |
  `a < 10` is `True` and `b < 10` is `False`. `and` needs both, so the first line is `False`; `or` needs one, so the second is `True`. `not (a < 10)` flips `True` to `False`. `a == 5` is `True` and `b == 5` is `False`, so `or` gives `True` and `and` gives `False`.
skills: [and-or, not]
