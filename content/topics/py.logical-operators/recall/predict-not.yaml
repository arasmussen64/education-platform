id: predict-not
type: predict_output
rev: 1
prompt: |
  What will this program print? Four lines, one per `print`.
code: |
  raining = True
  cold = False
  print(raining and cold)
  print(raining or cold)
  print(not raining)
  print(not cold and raining)
expected_output: |
  False
  True
  False
  True
explanation: |
  `and` needs both sides `True`, and `cold` is `False`, so the first line is `False`. `or` needs just one, and `raining` is `True`. `not raining` flips `True` to `False`. On the last line, `not cold` is `True` (it flips `False`), and `True and raining` is `True`.
skills: [and-or, not]
