id: review-mcq-not
type: mcq
rev: 1
prompt: |
  `age` is 20. Which of these is `True`?
choices:
  - '`not age > 18`'
  - '`not age == 20`'
  - '`not age < 18`'
  - '`not age >= 18`'
answer: 2
explanation: |
  `not` flips the answer to the comparison after it. `age < 18` is `False` for 20, and `not False` is `True`. The others flip a `True` comparison (`20 > 18`, `20 == 20`, `20 >= 18`) into `False`.
skills: [not]
