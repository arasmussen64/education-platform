id: mcq-or-trap
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  day = "Mon"
  if day == "Sat" or "Sun":
      print("Weekend")
  else:
      print("Weekday")
  ```
choices:
  - '`Weekday`'
  - '`Weekend`'
  - 'Nothing'
  - 'An error'
answer: 1
explanation: |
  `or` joins two separate things: the question `day == "Sat"`, which is `False`, and the text `"Sun"` on its own, which Python counts as `True` because it isn't empty. `False or True` is `True`, so it prints `Weekend` for every day, with no error to warn you. The line should be `if day == "Sat" or day == "Sun":`.
skills: [or-trap]
