id: parsons-full-price
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Full price` and then `Welcome`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'age = 20'
  - 'member = age < 18'
  - 'if age >= 18 and not member:'
  - '    print("Full price")'
  - 'print("Welcome")'
distractors:
  - 'if age >= 18 and member:'
explanation: |
  `member` is worked out from `age`, so `age` comes first. `and` needs both sides true: 20 is at least 18, and `not member` is true because `member` is false. `and member` would need `member` to be true, so nothing would print before Welcome. The unindented print runs either way.
skills: [and-or, not]
