id: mcq-and-or
type: mcq
rev: 1
prompt: |
  `x` is 4 and `y` is 9. Which of these is `True`?
choices:
  - '`x > 5 and y > 5`'
  - '`x > 5 or y > 5`'
  - '`not y > 5`'
  - '`x > 5 and not y > 5`'
answer: 1
explanation: |
  `x > 5` is `False` and `y > 5` is `True`. `or` needs only one side to be `True`, so `x > 5 or y > 5` is `True`. `and` needs both, so the first and last choices are `False`, and `not y > 5` flips a `True` into `False`.
skills: [and-or, not]
