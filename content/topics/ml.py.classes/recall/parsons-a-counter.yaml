id: parsons-a-counter
type: parsons
rev: 1
prompt: |
  Put the lines in order to define a `Counter` class, make one, count twice and print `2`. One line is a decoy that doesn't belong.
lines:
  - 'class Counter:'
  - '    def __init__(self):'
  - '        self.count = 0'
  - '    def increment(self):'
  - '        self.count = self.count + 1'
  - 'clicks = Counter()'
  - 'for click in range(2):'
  - '    clicks.increment()'
  - 'print(clicks.count)'
distractors:
  - '        count = count + 1'
explanation: |
  The class comes first: `__init__` gives each new counter its own `count`, starting at 0, and `increment` adds one to **`self.count`**, the attribute on the object. Then an instance is made and its method called twice, by the loop. The decoy, `count = count + 1`, refers to a local variable that was never given a value, so Python stops with `UnboundLocalError`; it never touches the object's `count`.
skills: [define, methods]
