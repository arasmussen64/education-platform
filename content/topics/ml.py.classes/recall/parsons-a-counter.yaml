id: parsons-a-counter
type: parsons
rev: 2
prompt: |
  Put the lines in order to define a `Counter` class, make one, count twice and print `2`. One line is a decoy that doesn't belong.
lines:
  - 'class Counter:'
  - '    def __init__(self):'
  - '        self.count = 0'
  - 'clicks = Counter()'
  - 'for click in range(2):'
  - '    clicks.count = clicks.count + 1'
  - 'print(clicks.count)'
distractors:
  - '    count = count + 1'
explanation: |
  The class comes first: `__init__` gives each new counter its own `count`, starting at 0. Then an instance is made, and the loop adds one to **`clicks.count`**, the attribute on that object, twice. Changing an attribute from outside like this keeps the program short; in a real class a method such as `increment` would be the polite way to do it. The decoy, `count = count + 1`, uses a plain name `count` that was never given a value, so Python stops with `NameError`; it never touches the object's `count`.
skills: [define]
