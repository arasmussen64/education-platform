id: debug-forgotten-self
stage: debug
rev: 2
title: "A player's score"
prompt: |
  This program should track a player's score and print:

  ```
  Player('Ada', 30)
  30
  ```

  Instead it stops with `TypeError: Player.add_points() takes 1 positional argument but 2 were given`. It has two bugs, and the second shows only once the first is fixed. Run it, read the error carefully, fix what you find, and run it again.
hints:
  - "Read the error's last line: `add_points` was called with one value, 10. Where does the other argument Python counts come from?"
  - "Calling `ada.add_points(10)` hands `ada` itself to the method as its first argument. A method's first parameter is there to receive it, and it's called `self`."
  - "The next error says a `Player` has no `score`. Which line was meant to give it one, and where did that value go?"
  - "`score = 0` inside `__init__` makes a local variable that's gone when `__init__` ends. To keep it on the object, store it as `self.score`."
skills: [define, methods]
