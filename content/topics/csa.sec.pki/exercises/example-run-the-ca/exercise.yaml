id: example-run-the-ca
stage: worked_example
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Run the CA"
prompt: |
  The shop's partners call its API, `api.shop.test` on `web` (10.0.9.1), with client certificates, as in Module 3. This time the certificates come from a certificate authority (CA) that is run, not made once: it has a database, limits, and a way to take a certificate back. You'll issue the courier's certificate, watch one of the CA's limits hold, shut a door that nginx leaves open, revoke the courier's certificate, and make the revocation reach the API.

  The machines (`netlab show` lists them; the network labs' basics are in Layers and packets' first lab):

  - **`root`** holds the shop's root CA and has no network cable at all. Its files are in its own `/etc/shop-ca`. Nothing in this walkthrough needs the root: it signed the two issuing CAs before the lab began.
  - **`ca`** (10.0.9.5) holds the partners' issuing CA, in its own `/etc/shop-ca`. nginx there serves the folder `/etc/shop-ca/public` as `http://crl.shop.test/`, and `ocsp-responder@ca` answers at `http://ocsp.shop.test:8888`. (It is openssl's test responder: a bare port probe such as `nc -z` hangs it, and `sudo systemctl restart ocsp-responder@ca` brings it back.)
  - **`depot`** (10.0.9.3) is the warehouse's server, with its key and certificate in `/etc/partner/`. **`courier`** (10.0.9.4) has a key there and no certificate yet.
  - **`office`** (10.0.9.2) is a staff laptop, and **`resolver`** (10.0.9.53) the shop's name server.

  Your home folder is the same on every machine, so `/home/learner/transfer` stands in for the USB stick or the upload that carries a request to a CA and a certificate back. `~/shop-pki` holds what is public: the root's and the partners' CA's certificates, and the root's CRL. `~/staff` holds a staff member's certificate, from the shop's other issuing CA.

  **The lab's fast clock:** this CA's CRLs last 2 hours and a new one is published every hour, where a real CA's last days (Microsoft's Cloud PKI: 7 days, published every 3.5). The root's CRL here lasts ten years, so that the lab works however old its image is; a real root's is reissued every few months.

  Type each line yourself and read what it prints before you type the next.
steps:
  - label: "The machines, and a root with no network"
    lines: "1-2"
    note: "Seven machines. `root` is in the list with no interface under it, and on it `ip -brief address` shows only `lo`, the loopback every machine has (and a placeholder, `ip_vti0`, that is down). That is what **offline** means: nothing can reach the root's key over a network, because there is no network. Whatever the root signs is carried to it and back by hand."
  - label: "Read the CA"
    lines: "3-5"
    note: "A CA is a key, a certificate, a database and a policy, and `ca.cnf` names them all. `private_key` and `certificate` are the CA itself. `database` is `index.txt`, one line for every certificate issued: now one, starting `V` (valid), then its expiry (`270221050538Z` is 21 February 2027, 05:05:38 UTC), an empty revocation field, its serial number and its subject, the warehouse's. `copy_extensions = copy` takes the names a request asks for; the `[ partner ]` section is what the CA writes into every certificate whatever the request says: not a CA, client use only, and where to find the CRL and the OCSP responder. Line 5 reads the CA's own certificate, signed by the root, for the limits the root put on it: `CA:TRUE, pathlen:0` (it may sign no CA below it), a **name constraint** (`Permitted: DNS:.partners.shop.test`: its certificates are good only for names under that) and an extended key usage of client authentication only."
  - label: "Issue from a request"
    lines: "6-11"
    note: "The request (CSR) is made on courier, where the key lives and stays: `openssl req -new` signs the names wanted with the key, and only the request travels. On ca, `openssl ca` checks the request's signature, applies the `partner` section, signs, and writes a second `V` line in the database (`-batch` signs without asking `Sign the certificate? [y/n]`; leave it out and it asks). The certificate goes back to courier. Line 10 reads it: 90 days, the name from the request, client use, and two addresses the CA added, the **CRL distribution point** `http://crl.shop.test/partners.crl` and the OCSP responder. The API answers the courier `200`."
  - label: "A limit the CA doesn't check"
    lines: "12-15"
    note: "A request for `www.example.test`, a name the CA has no business signing. `openssl ca` signs it without a word: `Certificate is to be certified until ...`, `Database updated`. The CA's software doesn't read the CA's own name constraint. Whoever checks the certificate does: `openssl verify` says `error 47 at 0 depth lookup: permitted subtree violation`, and so would nginx. **The limits on a CA are enforced by the clients that verify, not by the CA that issues.** The certificate is still a mistake, so line 15 revokes it: its line in the database turns from `V` to `R`, with the time and the reason, `superseded`."
  - label: "A door nginx leaves open"
    lines: "16-19"
    note: "A staff laptop shows a certificate from the shop's other issuing CA, the staff's, followed by that CA's certificate, and the partners' API answers `200`. nginx's file of trusted CAs holds the partners' CA and the root (it needs the root to finish a chain), and a root it trusts makes every CA that root has signed acceptable, when the client sends the missing link itself. Line 17 switches on a line that was waiting in the site: `if ($ssl_client_i_dn != \"CN=Shop Partners CA\") { return 403; }`, which reads the issuer's name from the client's certificate and refuses any other. After the reload, the staff laptop gets `403`."
  - label: "Publish a CRL"
    lines: "20-22"
    note: "`-gencrl` makes a **CRL**, a certificate revocation list: the serial numbers this CA has revoked, signed by the CA, written into the folder nginx on ca serves. The office downloads it from the address every certificate names, and a copy is kept as `before.crl`. Its three facts: `lastUpdate` (when it was made), `nextUpdate` two hours later (by when a newer one will be out, and after which nobody should rely on this one), and its number, `0x1000`, which goes up by one with every CRL."
  - label: "Revoke, and see who notices"
    lines: "23-28"
    note: "The courier's laptop is lost, with its key on it. `-revoke` with `-crl_reason keyCompromise` changes the database line to `R`. Nothing else has changed yet: checked against the CRL saved a minute ago, the certificate is `OK`, because that list was made before the revocation and is still in date. A revocation exists for a client only once the client holds a list that has it. Line 26 publishes the next CRL, the office fetches it as `after.crl`, and now `openssl verify -crl_check` says `error 23 at 0 depth lookup: certificate revoked`."
  - label: "Ask the OCSP responder, twice"
    lines: "29-30"
    note: "OCSP (HTTP and TLS's) asks about one certificate, live. The responder here is openssl's own, reading the same database. This responder re-reads the database only after it notices a change, which is after it has answered, so its first answer following a change is the old one: `unknown`, from when it had never heard of the courier (or `good`, if it has looked since the certificate was issued). The second is `revoked`, with the time and the reason. A real responder doesn't lag like this, but every OCSP answer carries a `Next Update`, and a client may reuse it until then."
  - label: "Make the API check"
    lines: "31-37"
    note: "The courier still gets `200`: nginx on web has never been told to look at a CRL. `fetch-crls` (line 32 shows it) downloads the partners' CA's CRL and the root's into one file, since nginx wants a CRL from every CA in a client's chain, and reloads nginx, since nginx reads that file only when it loads its settings. Line 33 switches on `ssl_crl`, line 34 runs the script. Now the courier gets `400 The SSL certificate error`, nginx's error log says why, `client SSL certificate verify error: (23:certificate revoked)`, and the warehouse still gets `200`."
  - label: "Keep it fresh"
    lines: "38-40"
    note: "A CRL runs out. If the CA stops publishing, or web stops fetching, the list web holds passes its `nextUpdate` and nginx refuses every partner. So both are on timers. A **timer** unit starts the service of the same name on a schedule: `OnBootSec=30s` runs it half a minute after every boot, `OnUnitActiveSec=1h` an hour after each run. `crl-publish@ca.timer` publishes every hour a CRL that lasts two; `crl-fetch@web.timer` fetches every half hour. `enable --now` switches both on now and at every boot, and `list-timers` shows when each runs next. Run the checks."
skills: [run-a-ca, revocation, ca-hierarchy]
