prove:
  build: build-partner-pki
  debug: debug-partners-locked-out
  explain:
    prompt: |
      A colleague proposes, for the company's internal services: one root CA that signs every server's certificate directly, certificates valid for five years, and no revocation, "because we can just replace a certificate if we need to". Explain, in your own words, what you'd build instead and why: the hierarchy, the limits you'd put on each CA, and who enforces them; how a revocation reaches the services that rely on a certificate, what goes wrong when the list or the responder fails, and why browsers behave differently; how you'd replace an issuing CA and, one day, the root; and what the three clouds offer for a private CA.
    rubric:
      - id: hierarchy
        required: true
        description: "An offline root that signs only issuing CAs and its own CRL; issuing CAs online, signing the leaves. A stolen issuing CA is revoked by the root and replaced; a stolen root means changing every trust store, which is why its key is kept off the network and a root never signs leaves."
      - id: limits
        required: true
        description: "Limits written into each issuing CA's own certificate: no CA below it (pathlen:0), a name constraint permitting only its own names, an extended key usage for its purpose (a separate issuing CA for each purpose). They are enforced by the relying parties that verify a chain, not by the CA's software, so they hold even when the CA signs something it shouldn't."
      - id: revocation
        required: true
        description: "The CA records the revocation and publishes a CRL at the address in the certificate, with a nextUpdate; it republishes on a timer well inside the CRL's life, and relying parties fetch on a timer and load the list (nginx only on reload). A stale copy still accepts the revoked certificate; an expired or missing one locks everyone out. OCSP answers live but makes the responder part of availability. A service API should hard-fail; browsers soft-failed and now use lists shipped ahead (CRLSets, CRLite). Short lifetimes shrink the problem, and five-year certificates make it as large as it can be."
      - id: rotation
        required: true
        description: "A new issuing CA starts issuing and the old one stops, while its own certificate still has more than a leaf's lifetime left; relying parties trust both until the old one's last certificate has expired. A new root is sent out years ahead, since it has to reach every trust store before anything chains to it, with a cross-signed certificate to bridge the overlap."
      - id: clouds
        required: false
        description: "AWS Private CA in two modes at a monthly price for each CA (general-purpose about $400, short-lived about $50 and without revocation); Google's Certificate Authority Service, whose DevOps tier can't revoke and whose Enterprise tier can; no general-purpose managed private CA on Azure (Key Vault's partner public CAs; Cloud PKI for Intune-managed devices only)."
    model_answer: |
      One root signing everything means the most valuable key in the company is online and in daily use, and nobody is above it: if it is stolen, every machine's trust store has to change. I'd keep the root offline, on a machine with no network, and have it sign only issuing CAs and its own revocation list. The issuing CAs are online and sign the servers' certificates. If one of them is stolen, the root revokes it and signs a new one, and nothing else changes.

      I'd limit each issuing CA in its own certificate: no CA below it (pathlen:0), a name constraint that permits only our own names, and an extended key usage for its purpose, with a separate issuing CA for client certificates. Those limits aren't checked by the CA's software, which will sign anything; they are checked by every client that verifies a chain, so they hold even against our own mistakes or a thief with the key.

      "No revocation" means a stolen key works until the certificate expires, which with five years is as bad as it gets. A revocation has to travel: the CA marks the certificate in its database and publishes a CRL at the address written in the certificate; each service that relies on certificates fetches that list on a timer and loads it. If a service holds an old list, it still accepts the revoked certificate; if its list passes its nextUpdate, it refuses everyone, so the CA republishes well inside each list's life and the services fetch more often than that. OCSP gives a live answer, but then the responder's outages are ours. For our own services I'd refuse when the check can't be made. Browsers can't do that for the whole web, so they stopped asking CAs and use lists they download ahead of time. And I'd make certificates last weeks, renewed automatically, so that revocation matters less.

      An issuing CA is replaced by overlap: the new one starts issuing, the old one stops while its certificate still has more than a leaf's lifetime to run, and everything that checks certificates trusts both until the old one's last certificate has expired. A root takes years: the new one has to be in every trust store before anything depends on it, with a cross-signed certificate to cover the devices that are slow.

      In the clouds, AWS sells a private CA for about $400 a month, or $50 for one that only issues certificates of a week or less and doesn't revoke. Google has two tiers, and only the dearer one can revoke. Azure has nothing general: Key Vault works with public CAs, and Cloud PKI is for Intune's devices.
