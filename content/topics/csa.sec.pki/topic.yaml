id: csa.sec.pki
kind: topic
status: ready
title: Certificates and PKI
summary: "Running a certificate authority, not just using one: a CA as a key, a certificate, a database and a policy; an offline root and issuing CAs under it, and the limits a root writes into an issuing CA's certificate, which the clients enforce; revoking a certificate and making the revocation arrive, with CRLs, OCSP, the servers that check and the timers that keep the lists fresh; replacing a CA without locking anyone out; and reading a chain error down to the certificate at fault."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections
# 2, 3 and 5) and its designer's brief (csa.sec.pki.md), on the network
# base as it is (content/lab-bases/net/README.md), with no topic layer.
# The plan's prerequisite is csa.sec.crypto, which gives signature, hash,
# key strength, and a key that never leaves its store (KMS, HSM). Through
# it and Checkpoint 3 the topic builds on csa.net.certificates (what a
# certificate holds, the chain, root and intermediate, basic constraints
# and pathlen, key usage and extended key usage, CSR, the verify codes 10,
# 18, 19, 20 and 21, and 62, a CA made once with openssl req -x509 and
# openssl x509 -req, ACME, mutual TLS and nginx's ssl_verify_client and
# ssl_client_certificate), csa.net.http-tls (OCSP, a responder's good,
# revoked and unknown, stapling), the network labs' machines, on and
# name@machine services, and Module 1 (units, systemctl enable --now,
# journalctl, nano, awk, sed, grep, curl, scripts and ShellCheck).
# This topic defines, for the module (the plan's 3.5): PKI, CA database,
# offline root, issuing CA, name constraint, relying party, CRL, CRL
# distribution point, authority information access, hard and soft fail,
# short-lived certificate, systemd timer, authority key identifier and
# cross-signing. No Module 1 to 3 lesson teaches a timer unit (searched),
# and both Module 3 lessons name a CRL in one sentence without teaching
# it, so the lesson teaches both from the start.
prerequisites: [csa.sec.crypto]
# Worked out: the lesson about 32 minutes (4,200 words with its tables, at
# 130 a minute), 18 practice quick questions at 1.5 each 27, then the
# worked example 35, the fill-in 30, the write 35, the build 60, the debug
# 40 and the explain 20: about 280, and the puzzle and the story about 5
# more. The plan's 300 counted 34 minutes of assigned reading, which is
# optional now (ADR-0031, step 3) and so left out; the lesson is longer
# for it, and the build, which now includes two scripts and two timers, is
# counted at 60, not 55.
estimated_minutes: 285
rev: 1
objectives:
  - "Run a private certificate authority the way one is run in production, in miniature: an offline root that signs only issuing CAs and its own CRL, and an issuing CA with settings, a database of what it issued and revoked, and a policy; issue from a request made where the key lives, and read the CA's database."
  - "Limit what an issuing CA can do, with a path length, a name constraint and an extended key usage in the CA's own certificate, and say who enforces each: the clients that verify, never the CA's software."
  - "Revoke a certificate and make the revocation reach the servers that matter: publish a CRL at the address in the certificate, keep it fresh with a timer, run an OCSP responder, and have nginx check client certificates against the CRLs; say what goes wrong when a list is stale, expired or missing, and why browsers check differently."
  - "Replace an issuing CA by overlap, with both CAs trusted until the old one's last certificate has expired; work out when a CA must stop issuing and how long ahead a root must be replaced; and tell two CA certificates of one name apart by their key identifiers."
  - "Read `error N at D depth` from `openssl verify` and nginx's log for a wrong or expired intermediate, a path that is too long, a certificate that isn't a CA, a name outside the constraints, a revoked certificate and a CRL that is missing or expired, and fix each at its cause."
# Facts the lesson and the items rely on, each read on 2026-11-22:
# - openssl ca's manual: "This command was originally meant as an example
#   of how to do things in a CA. Its code does not have production
#   quality"; -gencrl "generates a CRL based on information in the index
#   file"; -crldays, -crlhours, -crlsec; -revoke; -crl_reason ("Setting
#   any revocation reason will make the CRL v2"); the index file "is a
#   critical part of the process and if corrupted it can be difficult to
#   fix"; unique_subject; copy_extensions "should be used with caution";
#   rand_serial: docs.openssl.org/3.0/man1/openssl-ca/
# - RFC 5280: pathLenConstraint "gives the maximum number of
#   non-self-issued intermediate certificates that may follow this
#   certificate" (4.2.1.9); name constraints "MUST be used only in a CA
#   certificate", "Conforming CAs MUST mark this extension as critical",
#   and "Any DNS name that can be constructed by simply adding zero or
#   more labels to the left-hand side of the name satisfies the name
#   constraint" (4.2.1.10); "Conforming CRL issuers MUST include the
#   nextUpdate field in all CRLs", which "indicates the date by which the
#   next CRL will be issued" (5.1.2.5): rfc-editor.org/rfc/rfc5280.txt
# - nginx's ngx_http_ssl_module: ssl_crl "Specifies a file with revoked
#   certificates (CRL) in the PEM format used to verify client
#   certificates. When using intermediate certificates, their CRLs should
#   be specified in the same file"; ssl_ocsp on | off | leaf (1.19.0),
#   leaf "enables validation of the client certificate only";
#   ssl_ocsp_responder, "Only http:// OCSP responders are supported";
#   ssl_ocsp_cache; ssl_verify_depth 1 by default; $ssl_client_i_dn, the
#   issuer DN of the client certificate "according to RFC 2253":
#   nginx.org/en/docs/http/ngx_http_ssl_module.html
# - The CA/Browser Forum's Baseline Requirements, version 2.3.1 (4 October
#   2026): the maximum validity of a subscriber certificate is 398 days if
#   issued before 2026-03-15, 200 days from then, 100 days from
#   2027-03-15 and 47 days from 2029-03-15 (6.3.2); a "Short-lived
#   Subscriber Certificate" has a validity period of at most 10 days if
#   issued from 2024-03-15, and at most 7 days from 2026-03-15 (1.6.1);
#   CRLs for subscriber certificates are published at least every seven
#   days if every certificate has an OCSP pointer, otherwise every four,
#   and "within twenty-four (24) hours after recording a Certificate as
#   revoked" (4.9.7):
#   raw.githubusercontent.com/cabforum/servercert/main/docs/BR.md. Ballot
#   SC-063v4, "Make OCSP Optional, Require CRLs, and Incentivize
#   Automation" (voting ended 2023-07-13): OCSP optional, CRLs required,
#   short-lived certificates "not required to contain a CRLDP or OCSP
#   pointer and are not required to be revoked":
#   cabforum.org/2023/07/14/ballot-sc063v4-make-ocsp-optional-require-crls-and-incentivize-automation/
#   The ballot page gives no date from which OCSP became optional; the
#   Baseline Requirements' own table of versions does (read 2026-11-23):
#   version 2.0.1, ballot SC-063, effective 2024-03-15.
# - Mozilla (August 2025): CRLite on for all desktop Firefox users from
#   Firefox 137, about 300 kB of revocation data a day; OCSP disabled for
#   domain-validated certificates in Firefox 142; Chrome's CRLSets about
#   600 kB, about 1% of revocations:
#   hacks.mozilla.org/2025/08/crlite-fast-private-and-comprehensive-certificate-revocation-checking-in-firefox/
# - Let's Encrypt, "DST Root CA X3 Expiration (September 2021)" (updated
#   2024-02-05), the story's source: the root expired on 30 September
#   2021; devices that don't trust ISRG Root X1 (iPhone 4, HTC Dream)
#   show warnings; older Android devices keep working through a
#   cross-sign that extends past the expiry; OpenSSL 1.0.x fails on the
#   Android-compatible chain even when it trusts ISRG Root X1; clients
#   should trust ISRG Root X1 and use OpenSSL 1.1.0 or later:
#   letsencrypt.org/docs/dst-root-ca-x3-expiration-september-2021/
# - AWS Private CA: "$400 per private CA per month for general-purpose
#   mode", "$50 per private CA per month for short-lived certificate
#   mode", which "can only issue certificates valid for up to 7 days";
#   $0.75 a certificate (1 to 1,000 a month), $0.35 (1,001 to 10,000),
#   $0.001 (above); short-lived $0.058; OCSP $0.06 per certificate per
#   month and $0.20 per 100,000 queries: aws.amazon.com/private-ca/pricing/
# - Google Certificate Authority Service: the DevOps tier doesn't support
#   listing, describing or revoking certificates and is for "high volume,
#   short-lived certificate issuance"; the Enterprise tier supports all
#   three: docs.cloud.google.com/certificate-authority-service/docs/tiers.
#   Its prices were not read (the pricing page wasn't opened), so the
#   lesson gives none.
# - Microsoft Cloud PKI (ms.date 2026-09-08): certificates "for
#   Intune-managed devices"; a "two-tier PKI hierarchy with root and
#   issuing CA in the cloud"; "The CRL validity period is seven days.
#   Publishing and refresh happen every 3.5 days. The CRL is updated with
#   every certificate revocation"; "up to three CAs in an Intune tenant":
#   learn.microsoft.com/en-us/intune/intune-service/protect/microsoft-cloud-pki-overview
# - Azure Key Vault certificates (ms.date 2026-07-10): partner issuers
#   DigiCert and GlobalSign, with automatic renewal; "Non-partnered
#   providers and authorities are also allowed but don't support automatic
#   renewal":
#   learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
# Tried in this topic's labs (OpenSSL 3.0.13, nginx 1.24.0, curl 8.5.0 on
# Ubuntu 24.04, the network base), 2026-11-22: openssl ca signs a name
# outside its own certificate's name constraint, and openssl verify then
# gives error 47 at 0; a CA under pathlen:0 gives 25 at 2; a CA:FALSE
# certificate used as a CA, 79 at 1; an expired issuing CA, 10 at 1; a
# server certificate under a clientAuth-only CA, 26 at 1 with -purpose
# sslserver; a same-name issuing CA with a new key, the old one sent, 20
# at 0; an untrusted root, 20 at 1, or 19 at 2 when it is sent; a revoked
# leaf, 23 at 0, and a revoked issuing CA, 23 at 1, with -crl_check_all;
# a missing CRL, 3 at the depth of the certificate it would cover; an
# expired CRL, 12. nginx with only an issuing CA in ssl_client_certificate
# refuses every client, (2:unable to get issuer certificate); with the
# issuing CA and the root it accepts a certificate from a sibling CA under
# the same root when the client sends that CA's certificate, unless
# ssl_crl is set and holds no CRL from the sibling, or the site tests
# $ssl_client_i_dn; it also accepts a certificate the root signed itself,
# for any name, ssl_crl or not (the root's CRL covers it), unless the site
# tests $ssl_client_i_dn (tried in the build, 2026-11-23); with
# ssl_verify_client optional_no_ca and that test, a stranger's certificate
# that names the shop's CA as its issuer and is shown alone gets 200;
# ssl_crl without the root's CRL, (3:unable to get
# certificate CRL); an expired CRL, (12:CRL has expired); a replaced CRL
# file isn't used until a reload; ssl_ocsp leaf answers 400 for a revoked
# client and 400 with "certificate status request failed" when the
# responder is stopped; "ssl_ocsp on" was not usable with openssl's own
# responder signing with the CA's key (not in the lesson). openssl ocsp
# -index re-reads the database when it changes, after answering: its first
# answer following a change is the old one. A DER CRL with no entries is
# 181 bytes and one with 1,000 is 35,670 (ECDSA P-256, 20-byte serials,
# no reason codes). A timer with only OnUnitActiveSec has no next run
# after a boot. Every command output in the lesson, the labs and the
# recall items marked "captured" is real output of those labs; dates,
# serials and keys differ in a new run.
