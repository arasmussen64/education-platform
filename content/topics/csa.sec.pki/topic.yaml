skills:
  - id: run-a-ca
    description: "A CA as a key, a certificate, a database and a policy: `openssl ca`, its settings file, `index.txt` (V, R and E, the revocation time and reason), random serials and `copy_extensions`; issuing from a CSR made on the machine that keeps the key; an offline root and an online issuing CA; why `openssl ca` is a teaching tool, and what runs real CAs"
  - id: ca-hierarchy
    description: "Two tiers and why; the limits in an issuing CA's own certificate (`pathlen:0`, a critical name constraint, an extended key usage) and a separate issuing CA for each purpose; that relying parties enforce them, not the CA's software; what nginx accepts when it trusts a root"
  - id: revocation
    description: "Revoking; CRLs (`lastUpdate`, `nextUpdate`, the distribution point, size), publishing and fetching on timers, and the timer unit itself; OCSP responders; relying parties that check (nginx's `ssl_crl` and `ssl_ocsp`, `openssl verify -crl_check_all`); stale, expired and missing lists; hard and soft fail, browsers' CRLSets and CRLite, the public web's rules and short-lived certificates; the arithmetic of how long a revocation takes and how large a list grows"
  - id: ca-rotation
    description: "Replacing an issuing CA by overlap: when the old one stops issuing, both in relying parties' files until its last certificate expires; a same-name CA with a new key, told apart by authority and subject key identifiers; replacing a root years ahead, and cross-signing; the arithmetic of both"
  - id: fix-chains
    description: "Reading `error N at D depth` from `openssl verify` and nginx's `client SSL certificate verify error: (N:...)` for 2, 3, 10 at depth 1, 12, 19, 20 at depth 0 and above, 23, 25, 26, 47 and 79; `-show_chain`; nginx's `key values mismatch`"
