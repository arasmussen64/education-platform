id: debug-a-profile-that-lied
stage: debug
rev: 2
title: "A profile that lied"
prompt: |
  The program profiles `run`, which calls `light` a thousand times and `heavy` once, and should name the function with the most own time (the time spent in its own lines, not in the functions it calls) and the number of calls to `light`:

  ```
  most own time: heavy | calls to light: 1000
  ```

  Instead it stops on its last line with `IndexError: list index out of range`. It has two bugs, and the second shows only once the first is fixed. Run it, print what the failing line reads, and fix what you find; then run it again.
hints:
  - "`rows[0]` is out of range, so `rows` is empty: the profile holds no rows for the program's own functions. Print `stats.stats` to see what it did record."
  - "A profiler records only what runs between `enable()` and `disable()`. What runs between them here?"
  - "Call `run()` after `profiler.enable()` and before `profiler.disable()`."
  - "Now it names `light`. Each row is `(name, calls, own time)`: which value does the sort use, and which one is the question about?"
  - "Sort by own time, the third value: `key=lambda row: row[2]`."
skills: [cprofile, decide]
