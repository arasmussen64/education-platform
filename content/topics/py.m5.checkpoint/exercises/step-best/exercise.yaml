id: step-best
stage: fill_in
rev: 1
title: "The best student"
prompt: |
  The average and the grade work. Now `best_student` should find the student with the highest average: best-so-far over records. Replace each `...`: where the search starts, what the current student is compared with, and which field is returned. Running the program should print the full report, ending with `Best: Ada`.
hints:
  - "Start with the first student as the best so far: `students[0]`."
  - "Compare averages, not records: `average(student[\"scores\"]) > average(best[\"scores\"])`."
  - "The function returns a name, so return the best record's `\"name\"` field."
