id: build-gradebook
stage: build
rev: 1
title: "Gradebook"
prompt: |
  Starting from a blank editor, write a gradebook. The data is a list of records; put this at the top of your file:

  ```python
  STUDENTS = [
      {"name": "Ada", "scores": [95, 88, 92]},
      {"name": "Bob", "scores": [72, 65, 80]},
      {"name": "Cy", "scores": [85, 90, 78]},
  ]
  ```

  Then write these functions, each with a docstring, none of which changes the list it's given:

  - `average(scores)` returns the average of a non-empty list of scores (a number, not rounded).
  - `letter_grade(average)` returns `"A"` for 90 or more, `"B"` for 80 or more, `"C"` for 70 or more, `"D"` for 60 or more, otherwise `"F"`.
  - `best_student(students)` returns the name of the student with the highest average; if two tie, the first.
  - `report_lines(students)` returns a list of strings: one per student, like `Ada: 91.7 (A)` (the average with one decimal place), and then a last line `Best: Ada`.
  - `test_gradebook()` has at least four asserts, covering the grade boundaries and the best student, and ends with `print("gradebook: all checks passed")`.
  - `main()` prints each line of `report_lines(STUDENTS)`.

  Finish with:

  ```python
  if __name__ == "__main__":
      test_gradebook()
      main()
  ```

  Running the program should print:

  ```
  gradebook: all checks passed
  Ada: 91.7 (A)
  Bob: 72.3 (C)
  Cy: 84.3 (B)
  Best: Ada
  ```
test_skills:
  test_average: [py.lists/loop-lists, py.return-values/return-vs-print]
  test_letter_grade: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_best_student: [py.accumulator-patterns/best-so-far, py.nested-data/records]
  test_report_lines: [py.nested-data/records, py.strings-and-input/fstrings, py.decomposition/compose]
  test_leaves_data_alone: [py.references-and-mutation/mutating-functions, py.references-and-mutation/copying]
  test_docstrings: [py.decomposition/docstrings]
  test_tests: [py.testing-with-assert/test-functions, py.testing-with-assert/choose-cases]
  test_program: [py.testing-with-assert/test-functions, py.programs-and-print/print-text]
