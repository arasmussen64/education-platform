id: example-inventory
stage: worked_example
rev: 1
title: "An inventory report"
prompt: |
  This program is like the checkpoint's build, in a different story: a shop's stock as a list of records, each with a name, a quantity and a price. It works out each item's value and status, finds the most valuable item, and returns the report as lines for `main` to print. Press **Run**, then read how it's built.

  The shape is the module's: data as a list of dictionaries, small functions that return values and leave the data alone, a test function, and `main` under the guard.
steps:
  - label: "The data: records"
    lines: "1-6"
    note: "A list of dictionaries, one per item, each with the same three keys. Capital letters for the name say: this is fixed data the whole file uses."
  - label: "A number from a record, a word from a number"
    lines: "9-20"
    note: "`value` reads two fields and returns a number. `status` turns a number into a word, with the boundaries in order from the top. Neither prints; neither changes anything."
  - label: "The best record"
    lines: "23-29"
    note: "Best-so-far over records: keep the item whose value is highest, comparing with `>` so the first of two equals wins. Return just its name."
  - label: "The report as lines"
    lines: "32-38"
    note: "A list of strings, built with a loop and `append`, with a last line for the best item. Returning the lines, rather than printing them, is what lets the test below check them."
  - label: "Tests, then the program"
    lines: "41-55"
    note: "The tests cover a boundary (exactly 5 is low, 6 is ok), the best item, and one full line. `main` only prints. Both run only when the file is run directly."
