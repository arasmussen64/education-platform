id: debug-gradebook
stage: debug
rev: 1
title: "A gradebook that eats its data"
prompt: |
  This program should print:

  ```
  Ada: 85.0 (B)
  Bob: 65.0 (D)
  Students: 2
  ```

  It has three bugs: an average that's wrong, grade boundaries that are off by one, and a function that quietly changes the list it's given, so the last line comes out wrong. Check each function against its docstring, and ask of each one: does it change anything it was given?
test_skills:
  test_average: [py.lists/loop-lists, py.arithmetic/operators]
  test_letter_boundaries: [py.booleans-and-comparisons/compare, py.if-elif-else/elif-order]
  test_leaves_list_alone: [py.references-and-mutation/mutating-functions, py.lists/change-grow]
  test_program: [py.decomposition/compose, py.nested-data/records]
