id: build-weather-report
stage: build
rev: 1
title: "Weather report"
prompt: |
  Starting from a blank editor, write a weather report. Put this data at the top of your file:

  ```python
  CITIES = [
      {"name": "Lima", "temps": [18, 20, 19]},
      {"name": "Cairo", "temps": [30, 33, 29]},
      {"name": "Oslo", "temps": [4, 7, 5]},
  ]
  ```

  Then write these functions, each with a docstring, none of which changes the list it's given:

  - `average(temps)` returns the average of a non-empty list of temperatures (a number, not rounded).
  - `label(average)` returns `"hot"` for 25 or more, `"mild"` for 15 or more, otherwise `"cold"`.
  - `hottest(cities)` returns the name of the city with the highest average; if two tie, the first.
  - `report_lines(cities)` returns a list of strings: one per city, like `Lima: 19.0 (mild)` (the average with one decimal place), then a last line `Hottest: Cairo`.
  - `test_weather()` has at least four asserts, covering the label boundaries and the hottest city, and ends with `print("weather: all checks passed")`.
  - `main()` prints each line of `report_lines(CITIES)`.

  Finish with `if __name__ == "__main__":`, calling `test_weather()` and then `main()`. Running the program should print:

  ```
  weather: all checks passed
  Lima: 19.0 (mild)
  Cairo: 30.7 (hot)
  Oslo: 5.3 (cold)
  Hottest: Cairo
  ```
test_skills:
  test_average: [py.lists/loop-lists, py.return-values/return-vs-print]
  test_label: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_hottest: [py.accumulator-patterns/best-so-far, py.nested-data/records]
  test_report_lines: [py.nested-data/records, py.strings-and-input/fstrings, py.decomposition/compose]
  test_leaves_data_alone: [py.references-and-mutation/mutating-functions, py.references-and-mutation/copying]
  test_docstrings: [py.decomposition/docstrings]
  test_tests: [py.testing-with-assert/test-functions, py.testing-with-assert/choose-cases]
  test_program: [py.testing-with-assert/test-functions, py.programs-and-print/print-text]
