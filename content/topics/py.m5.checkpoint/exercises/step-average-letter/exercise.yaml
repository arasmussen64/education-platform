id: step-average-letter
stage: fill_in
rev: 1
title: "An average and a grade"
prompt: |
  Here's the checkpoint's gradebook with the two smallest functions unfinished. Replace each `...`: what the total is divided by, and the two boundaries for an A and a B. Running the program should print:

  ```
  gradebook: all checks passed
  Ada: 91.7 (A)
  Bob: 72.3 (C)
  Cy: 84.3 (B)
  Best: Ada
  ```
hints:
  - "An average is the total divided by how many scores there are: `len(scores)`."
  - "An A is 90 or more, a B is 80 or more: `>= 90` and `>= 80`. The chain checks from the top, so each `if` can assume the ones above were false."
