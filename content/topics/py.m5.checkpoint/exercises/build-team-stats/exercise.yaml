id: build-team-stats
stage: build
rev: 1
title: "Team stats"
prompt: |
  Starting from a blank editor, write a report for a basketball team. Put this data at the top of your file:

  ```python
  PLAYERS = [
      {"name": "Ada", "points": [22, 18, 27]},
      {"name": "Bob", "points": [8, 12, 10]},
      {"name": "Cy", "points": [15, 20, 13]},
  ]
  ```

  Then write these functions, each with a docstring, none of which changes the list it's given:

  - `average(points)` returns the average of a non-empty list of points (a number, not rounded).
  - `rating(average)` returns `"star"` for 20 or more, `"starter"` for 10 or more, otherwise `"bench"`.
  - `top_scorer(players)` returns the name of the player with the highest average; if two tie, the first.
  - `report_lines(players)` returns a list of strings: one per player, like `Ada: 22.3 (star)` (the average with one decimal place), then a last line `Top scorer: Ada`.
  - `test_team()` has at least four asserts, covering the rating boundaries and the top scorer, and ends with `print("team: all checks passed")`.
  - `main()` prints each line of `report_lines(PLAYERS)`.

  Finish with `if __name__ == "__main__":`, calling `test_team()` and then `main()`. Running the program should print:

  ```
  team: all checks passed
  Ada: 22.3 (star)
  Bob: 10.0 (starter)
  Cy: 16.0 (starter)
  Top scorer: Ada
  ```
test_skills:
  test_average: [py.lists/loop-lists, py.return-values/return-vs-print]
  test_rating: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_top_scorer: [py.accumulator-patterns/best-so-far, py.nested-data/records]
  test_report_lines: [py.nested-data/records, py.strings-and-input/fstrings, py.decomposition/compose]
  test_leaves_data_alone: [py.references-and-mutation/mutating-functions, py.references-and-mutation/copying]
  test_docstrings: [py.decomposition/docstrings]
  test_tests: [py.testing-with-assert/test-functions, py.testing-with-assert/choose-cases]
  test_program: [py.testing-with-assert/test-functions, py.programs-and-print/print-text]
