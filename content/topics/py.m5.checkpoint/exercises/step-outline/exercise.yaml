id: step-outline
stage: fill_in
rev: 1
title: "Put it all together"
prompt: |
  Now write the whole gradebook. The data, the plan as comments, and the lines at the bottom are given. Write each part under its comment, pressing **Run** after each part. Running the finished program should print:

  ```
  gradebook: all checks passed
  Ada: 91.7 (A)
  Bob: 72.3 (C)
  Cy: 84.3 (B)
  Best: Ada
  ```
hints:
  - "Under each comment, write what you filled in for that part in the steps before: average and letter_grade, best_student, report_lines, test_gradebook and main."
  - "Every function gets a docstring, and none of them changes the list it's given."
  - "The tests need at least four asserts, including the grade boundaries, and must print the message at the end."
