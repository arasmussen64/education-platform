# A planned outline for the Machine Learning Foundations track
# (docs/specs/ml-foundations.md). It becomes real content when written.
id: ml.tf.language-model
kind: topic
status: planned
title: Training a tiny language model
summary: "Next-token prediction as a classification at every position; the loss over a sequence; batches of windows cut from one corpus; a two-block transformer trained with the module's loop and Adam; the loss curve in bits per character against a held-out slice; and samples drawn with a temperature, on a corpus generated in code so nothing is downloaded."
prerequisites:
- ml.tf.transformer-block
estimated_minutes: 60
rev: 1
objectives:
- Turn a corpus into training windows and targets shifted by one, and say why the targets are the inputs moved one step.
- Compute the loss over every position of a batch of sequences and convert it to bits per character.
- "Train a two-block transformer on the module's corpus to a held-out loss bar within the time the browser allows, with a seed."
- Sample from the model one token at a time with a temperature, and say what the temperature changes.
