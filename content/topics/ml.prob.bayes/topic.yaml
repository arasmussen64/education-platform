prove:
  build: build-a-spam-filter
  debug: debug-base-rate-report
  explain:
    prompt: |
      A friend has tested positive for a condition that 1 person in 100 has, with a test that catches 95 percent of cases and wrongly flags 10 percent of healthy people, and is sure they have it. In your own words: what does Bayes' rule say, and what is the base rate's part in it? Walk them through a table of 100,000 people. Why would a second positive test change the picture so much more than the first? And what does "naive" mean in naive Bayes, and why does the method work anyway?
    rubric:
      - id: rule
        required: true
        description: "The chance of the condition given a positive test is the prior (base rate) times the test's hit rate, divided by the total chance of a positive from both groups: posterior = prior × likelihood / evidence; the direction matters, P(positive | sick) is not P(sick | positive)."
      - id: table
        required: true
        description: "Of 100,000 people, 1,000 have it and 950 test positive; 99,000 don't and 9,900 test positive anyway; so a positive person is one of 10,850, of whom 950 have it: about 9 percent. The healthy group is 99 times larger, so its small false-positive rate outweighs the sick group's high hit rate."
      - id: update
        required: true
        description: "After the first test the prior is no longer 1 percent but 9 percent; the same rule with that prior gives about 48 percent after a second positive. Each piece of independent evidence multiplies in, and the posterior becomes the next prior."
      - id: naive
        required: false
        description: "Naive Bayes assumes the words of a message are independent given its class, so their likelihoods just multiply; that's false (words come in phrases), so its probabilities are overconfident, but the ranking of spam against not-spam is usually right, which is all a filter needs."
    model_answer: |
      Bayes' rule turns the question round. The test's 95 percent is the chance of a positive given that you're sick; what your friend wants is the chance of being sick given a positive, and getting from one to the other needs the base rate, how common the condition is to begin with. Take 100,000 people. One in a hundred has it: 1,000 people, and the test catches 950 of them. The other 99,000 don't have it, and the test wrongly flags 10 percent, 9,900 people. So the positives are 950 plus 9,900, and only 950 of those 10,850 have the condition: about 9 percent. The healthy group is 99 times bigger than the sick group, so even a small false-positive rate on it swamps the hits. Written as a formula, that's the prior, 0.01, times the likelihood of a positive when sick, 0.95, divided by the total chance of a positive from both groups, which is Bayes' rule. A second positive test changes much more because it starts from a different place: the prior is no longer 1 percent but 9 percent, and running the same rule again gives about 48 percent. Each independent piece of evidence multiplies in, and yesterday's posterior is today's prior; a third positive would take it to about 90 percent, and a fourth past 98. Naive Bayes is the same rule applied to a message word by word, and "naive" is the assumption that the words are independent once you know whether the message is spam, so their likelihoods simply multiply. That isn't true, since words come in phrases, so the probabilities it reports are too confident; but the comparison between spam and not-spam usually comes out the right way round, which is all a filter needs.
