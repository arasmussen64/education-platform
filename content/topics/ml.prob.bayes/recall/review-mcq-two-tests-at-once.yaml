id: review-mcq-two-tests-at-once
type: mcq
rev: 1
prompt: |
  With the topic's numbers (base rate 0.01, sensitivity 0.95, false-positive rate 0.10), one positive test gives 0.088 and a second, independent positive gives 0.477. Why so much more the second time?
choices:
  - 'Because the second test is more accurate than the first, so it moves the probability further'
  - 'It shouldn''t: two independent tests at once should give about twice 0.088, roughly 0.18, and the rest is rounding'
  - 'Because the second update starts from 0.088, not 0.01: each positive multiplies the odds by the same 9.5'
  - 'Because the false positives were used up by the first test, leaving mostly true positives for the second'
answer: 2
explanation: |
  Both tests are identical; what differs is the prior. Each independent positive multiplies the **odds** of having the condition (the chance of having it against the chance of not: 1 to 99 at the start) by `0.95 / 0.10 = 9.5`: from odds of 1 to 99, to 9.5 to 99 (0.088), to 90 to 99 (0.477). Applying the rule twice is the same as applying it once with both results as evidence; nothing is doubled or used up.
