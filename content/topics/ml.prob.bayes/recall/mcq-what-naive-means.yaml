id: mcq-what-naive-means
type: mcq
rev: 1
prompt: |
  What is "naive" about naive Bayes, and why does it still work as a spam filter?
choices:
  - 'It assumes the words are independent given the class; that''s false, but the ranking of spam against ham usually survives it'
  - 'It uses no training data at all, only a fixed dictionary of spam words, so it is naive about the messages it actually sees'
  - 'It assumes every message is equally likely to be spam, ignoring the prior, which is naive but harmless because the words dominate'
  - 'It adds one to every count, a crude guess that is naive about rare words but keeps every probability positive'
answer: 0
explanation: |
  The independence assumption is the naivety: "win" and "cash" are not independent clues, yet the filter multiplies them as if they were. The result is too confident, but a decision only needs the comparison to come out the right way round. It does use training counts and the prior; the add-one smoothing is a fix for unseen words, not the naive part.
skills: [naive-bayes]
