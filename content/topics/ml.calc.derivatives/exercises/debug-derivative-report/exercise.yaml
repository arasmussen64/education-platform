id: debug-derivative-report
stage: debug
rev: 1
title: "A slope that won't settle"
prompt: |
  This program should check the sigmoid's derivative rule against a numeric slope, and print:

  ```
  x**2 at 3: 6.0
  sigmoid at 0: 0.25 0.25
  sigmoid at 2: 0.104994 0.104994
  ```

  It has two bugs. Run it: the first line is off in the fourth or fifth decimal, which means the numeric slope itself is wrong. Look at `h`: a step of `1e-12` is so small that the two function values are nearly identical and rounding noise is no longer small next to their difference. Fix that, and the first line is right, but the rule's numbers still disagree with the numeric ones: the sigmoid's derivative is the output times one minus the **output**.
skills: [numeric-check, rules]
