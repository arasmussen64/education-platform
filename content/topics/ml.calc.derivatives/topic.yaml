prove:
  build: build-derivative-checker
  debug: debug-derivative-report
  explain:
    prompt: |
      A teammate is watching a training run. The network's early layers barely change when every unit uses the sigmoid, and switching those units to ReLU helped. They ask you why. In your own words: what does a derivative tell training, in direction and in speed? Why is the sigmoid's derivative small far from zero, and what does that do to learning? What is ReLU's derivative, and why does that help? And why do you check a derivative numerically before trusting it?
    rubric:
      - id: direction-and-speed
        required: true
        description: "The derivative's sign says which way the output rises, so descent steps the other way; its size says how fast the output changes, so how far a step moves."
      - id: saturation
        required: true
        description: "The sigmoid flattens towards 0 and 1, so its derivative sigma(1 - sigma) is at most 0.25 and nearly zero far from zero; a unit out there passes almost no slope back, and it (and everything behind it) stops learning."
      - id: relu
        required: true
        description: "ReLU is max(x, 0): derivative 1 wherever the unit is active and 0 where it's off, so an active unit passes the slope through at full strength rather than shrinking it."
      - id: numeric-check
        required: false
        description: "A rule can be misremembered or mistyped; comparing it with a central difference, (f(x + h) - f(x - h)) / 2h, at a few points catches that before training runs on a wrong slope."
    model_answer: |
      Training moves each knob a little, and the derivative of the loss with respect to that knob says how. Its sign says which way the loss rises, so the step goes the other way; its size says how fast the loss changes there, so a big derivative means a big step and a tiny one means almost no movement. The sigmoid is the trouble. It squashes any input into a number between 0 and 1, so it flattens out on both sides, and its derivative, sigma times one minus sigma, is at most 0.25 at zero and almost nothing far from zero: about 0.0066 at 5 and 0.000045 at 10. A unit whose input is out there is saturated: it passes almost no slope back to the layers behind it, so they barely change, and a stack of such units multiplies several tiny factors together. ReLU is max(x, 0). Its derivative is 1 wherever the unit is active and 0 where it's off, so an active unit hands the slope straight through at full strength, which is why the early layers started moving. And a rule is only a claim until it's checked: I compute the central difference, f(x + h) minus f(x - h) over 2h with a small h, at a few points and compare. A misremembered rule, or a slip like one minus x instead of one minus sigma, shows up as a gap far bigger than a millionth before it has cost a day of training.
review_pool:
  - review-predict-power-rule
  - review-mcq-exp-derivative
  - review-mcq-direction-and-speed
  - review-d-relu
