id: parsons-sigmoid-check
type: parsons
rev: 2
prompt: |
  Put the lines in order to check the sigmoid's derivative rule at `x = 1` against a central difference, printing `True`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'x = np.array([1.0 - 1e-6, 1.0, 1.0 + 1e-6])'
  - 's = 1 / (1 + np.exp(-x))'
  - 'by_rule = s[1] * (1 - s[1])'
  - 'gap = by_rule - (s[2] - s[0]) / 2e-6'
  - 'print(abs(gap) < 1e-6)'
distractors:
  - 'by_rule = s[1] * (1 + s[1])'
explanation: |
  `x` holds three points: a millionth below 1, 1 itself, and a millionth above. `s` is the sigmoid of all three at once, so `s[1]` is the sigmoid at 1. The sigmoid's derivative is `σ(x) * (1 - σ(x))`, the output times one minus the output. The central difference takes the outputs a millionth each way, `s[2] - s[0]`, and divides by the two-millionth gap; the two agree to six decimals, so the comparison prints `True`. The decoy's `1 + s[1]` gives about 1.3 at `x = 1` instead of about 0.197, nothing like the slope.
skills: [rules, numeric-check]
