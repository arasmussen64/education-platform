id: mcq-exp-and-log
type: mcq
rev: 1
prompt: |
  Which pair of rules is right?
choices:
  - 'The derivative of `np.exp(x)` is `x * np.exp(x - 1)`, and the derivative of `np.log(x)` is `np.log(x) / x`'
  - 'The derivative of `np.exp(x)` is `1 / np.exp(x)`, and the derivative of `np.log(x)` is `np.exp(x)`'
  - 'The derivative of `np.exp(x)` is `np.exp(x)` itself, and the derivative of `np.log(x)` is `1 / x`'
  - 'Neither has a rule; they can only be estimated numerically'
answer: 2
explanation: |
  `e` is the base chosen so that the exponential is its own derivative: the slope of `np.exp` at any `x` is its value there. The natural log undoes it, and its derivative is `1 / x`, which is why the loss used for probabilities, four topics on, has such a simple gradient. The choice with `x * np.exp(x - 1)` misapplies the power rule, which is for a variable base and a fixed power, not the other way round.
skills: [rules]
