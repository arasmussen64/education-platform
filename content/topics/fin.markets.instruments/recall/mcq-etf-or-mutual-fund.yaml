id: mcq-etf-or-mutual-fund
type: mcq
rev: 1
prompt: |
  At 11:00 on a busy day you decide to put money into a fund. With a mutual fund and with an ETF, what price do you get?
choices:
  - "Both at the 11:00 price, since the two kinds of fund trade on an exchange all day long"
  - "Both at the closing price, since every fund works its value out once a day after the close"
  - "The ETF at whatever price it trades at as you buy; the mutual fund at that day's value per share"
  - "The mutual fund at the 11:00 price; the ETF at the next morning's opening price on the exchange"
answer: 2
explanation: |
  An **ETF** (exchange-traded fund) trades on an exchange like a share: you buy it from another investor at the market price of the moment, which stays close to, but isn't exactly, the value of what the fund holds. A **mutual fund** is bought from the fund itself, at its **net asset value** per share, which it works out once a day after the market closes; an order placed at 11:00 gets that evening's price.

  Both are pooled funds holding many investments, and both can be index funds or actively managed: how you buy them, and at what price, is the main difference.
skills: [funds]
