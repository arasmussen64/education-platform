id: mcq-what-a-share-is
type: mcq
rev: 1
prompt: |
  You own one share of a company that has 10 million shares. What is it a claim on?
choices:
  - "A fixed yearly payment, set when the share was first sold, plus the price back later"
  - "One ten-millionth of the company: its profits after others are paid, and a vote"
  - "Repayment of the price you paid, ahead of the company's other creditors"
  - "One ten-millionth of the company's sales each year, paid out every quarter"
answer: 1
explanation: |
  A share is a slice of ownership. Its owner has a claim on what's left after everyone with a prior claim (staff, suppliers, lenders, the tax collector) has been paid, whether the company pays it out as dividends or keeps it to grow, and usually a vote at shareholder meetings. Nothing is promised: in a bad year what's left can be nothing.

  A fixed yearly payment and a repayment at the end are what a bond promises, not a share. Shareholders are paid after creditors, not ahead of them, and they have no claim on sales, only on what remains after costs.
skills: [claims]
