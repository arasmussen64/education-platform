id: est-share-rates-rise
type: estimate
rev: 1
prompt: |
  Investors expect a made-up share to bring $42 a year from now (a dividend and its sale price together). They wanted 5% a year for the risk; after interest rates rise they want 8%. Nothing about the company has changed. By how many dollars does the share's value today fall? Within 2%.
unit: "US dollars"
answer: 1.11
tolerance: { percent: 2 }
amounts: made-up
given: { expected: 42, before: 5, after: 8 }
working: expected / (1 + before / 100) - expected / (1 + after / 100)
mistakes:
  - id: three-percent-of-42
    value: 1.26
    working: expected * (after - before) / 100
    why: "That takes 3% of the $42 off. Work out both present values, $42 / 1.05 and $42 / 1.08, and subtract."
  - id: new-value
    value: 38.89
    working: expected / (1 + after / 100)
    why: "That's the new value. The question asks how much it fell from the old one, $40."
explanation: |
  Before: $42 / 1.05 = $40.00. After: $42 / 1.08 ≈ $38.89. The value falls by about $1.11, almost 3%, though the company and its prospects are exactly the same. When interest rates rise, investors can earn more elsewhere, so they want more from shares too, and the same expected cash is worth less today.
skills: [price-drivers]
