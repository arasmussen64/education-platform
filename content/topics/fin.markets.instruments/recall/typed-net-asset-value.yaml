id: typed-net-asset-value
type: typed
rev: 1
prompt: |
  A mutual fund works out, once a day after the market closes, what everything it holds is worth, less what it owes, divided by its number of shares. Orders placed that day are filled at that price. What is it called? Three words, or its three-letter short form.
kind: text
answers:
  - "net asset value"
  - "NAV"
  - "net asset value per share"
mistakes:
  - id: market-price
    answers: ["market price", "share price"]
    why: "A market price is what an ETF or a share trades at during the day. A mutual fund's once-a-day price is its net asset value."
  - id: expense-ratio
    answers: ["expense ratio"]
    why: "The expense ratio is the fund's yearly cost as a percentage. The daily value per share is the net asset value."
explanation: |
  **Net asset value** (NAV) per share is a mutual fund's value worked out from its holdings at the day's closing prices. Buying or selling a mutual fund happens at the next NAV after your order. An ETF has a NAV too, but you trade it on an exchange at the market price, which stays close to it.
skills: [funds]
