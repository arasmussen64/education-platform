id: typed-face-value
type: typed
rev: 1
prompt: |
  A bond promises a coupon each year and, at the end, repayment of a fixed amount, which its coupon rate is also a share of. Name that amount, two words.
kind: text
answers:
  - "face value"
  - "par value"
  - "principal"
  - "par"
mistakes:
  - id: price
    answers: ["price", "market price", "market value"]
    why: "The price changes every day with market rates. The fixed amount repaid at the end is the face value."
  - id: coupon
    answers: ["coupon"]
    why: "The coupon is the yearly interest payment, a share of the amount repaid at the end, which is the face value."
explanation: |
  The **face value** (also called par value or principal) is what the issuer borrowed and repays at **maturity**, the bond's end date. The coupon is a fixed share of it, so a 5% bond with a $1,000 face value pays $50 a year whatever its price does.
skills: [claims, bond-value]
