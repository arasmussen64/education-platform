id: predict-bond-at-three-rates
type: predict_output
rev: 1
prompt: |
  A made-up 1-year bond with a face value of $1,000 and a 4% coupon: one payment of $1,040 a year from now. What does the program print?
code: |
  for market_rate in [0.02, 0.04, 0.08]:
      price = 1040 / (1 + market_rate)
      print(market_rate, round(price, 2))
expected_output: |
  0.02 1019.61
  0.04 1000.0
  0.08 962.96
explanation: |
  The bond's one payment is fixed at $1,040; only the rate it's discounted at changes. At 4%, the coupon rate, the price is exactly the face value, `1000.0` (Python prints one decimal for a whole float). When the market wants less (2%) the fixed payment is worth more today, `1019.61`; when it wants more (8%), less, `962.96`. Rates up, price down.
skills: [bond-value]
