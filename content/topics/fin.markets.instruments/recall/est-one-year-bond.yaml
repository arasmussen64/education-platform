id: est-one-year-bond
type: estimate
rev: 1
prompt: |
  A made-up bond has a face value of $1000 and pays a 3% coupon once a year. It has one year left: one last coupon and the face value, both a year from now. The market now wants 5%. What is the bond's price today, in dollars? Within 0.5%.
unit: "US dollars"
answer: 980.95
tolerance: { percent: 0.5 }
amounts: made-up
given: { face: 1000, coupon: 3, market: 5 }
working: face * (1 + coupon / 100) / (1 + market / 100)
mistakes:
  - id: coupon-forgotten
    value: 952.38
    working: face / (1 + market / 100)
    why: "That discounts only the face value. The last coupon, $30, arrives on the same day, so discount $1,030."
  - id: undiscounted
    value: 1030
    working: face * (1 + coupon / 100)
    why: "That's what the bond pays a year from now. Today it's worth that divided by 1.05, because the market wants 5% for waiting."
explanation: |
  A year from now the bond pays $30 + $1,000 = $1,030. Discounted at the 5% the market wants: $1,030 / 1.05 ≈ $980.95. It's below the face value because its 3% coupon pays less than the market's 5%: a buyer pays less now to make up the difference.
skills: [bond-value]
