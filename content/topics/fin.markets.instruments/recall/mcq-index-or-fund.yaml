id: mcq-index-or-fund
type: mcq
rev: 1
prompt: |
  A news report says "the index rose 1% today". A friend asks how to buy some of the index itself. What do you tell them?
choices:
  - "An index is a measurement of a list of securities, so they'd buy a fund that copies it"
  - "An index is a fund run by the exchange, so they'd buy its shares directly from the exchange"
  - "An index is a single company's share price, so they'd buy that company's shares instead"
  - "An index is a type of bond issued by the government, so they'd buy it from a bank"
answer: 0
explanation: |
  A market index is a number worked out from a list of securities (the shares of a country's largest companies, say) that measures how that list's prices move. Nobody can invest in a number. An **index fund**, a mutual fund or an ETF, buys the securities on the list in the amounts the index uses, so its return follows the index's, less its fees.

  An index isn't a fund, a company or a bond, though there are indexes of bonds too.
skills: [funds]
