id: contrast-share-or-bond
type: mcq
rev: 1
prompt: |
  A made-up company goes bankrupt. Selling everything it owns raises $50 million, and it owes $80 million to the holders of its bonds. Its shareholders and its bondholders both want their money. Roughly what does each group get?
choices:
  - "Both groups share the $50 million in proportion to what they paid for their holdings"
  - "The shareholders are paid first, because they own the company, then the bondholders"
  - "The bondholders get the $50 million, about 62 cents per dollar owed; shareholders nothing"
  - "The bondholders get the full $80 million and the shareholders the rest of the money"
answer: 2
explanation: |
  A bond is a loan: its holders are creditors with a promise of coupons and repayment, and they're paid before the owners. Here the $50 million covers only 50 / 80 = 62.5% of what the bondholders are owed, so they recover about 62 cents a dollar, and the shareholders, who own whatever is left after every creditor, get nothing.

  That's the trade-off between the two: the bond's claim is fixed and comes first, so it's safer but its upside is capped at the promised payments; the share's claim is on what's left, so it can be worth nothing or a great deal.
