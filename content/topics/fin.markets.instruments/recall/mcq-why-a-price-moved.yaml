id: mcq-why-a-price-moved
type: mcq
rev: 1
prompt: |
  A made-up company reports record profits, up 20% on last year, and its share price falls 8% that day. Which explanation fits how share prices work?
choices:
  - "The record profits will be paid out as tax, so the owners get less this year"
  - "Investors had expected even more, so what they now expect to receive fell"
  - "Profits don't affect a share's price at all, only the number of buyers does"
  - "Higher profits always lower the price, because they make the shares scarcer"
answer: 1
explanation: |
  A share's price is roughly the present value of what owners expect to receive from it in future. Today's price already holds today's expectations, so news moves it only by how much it changes them. If investors had expected profits up 30%, a 20% rise is a disappointment, and the expected future payouts, and the price, fall. The other thing that moves prices is the rate investors want: when interest rates rise, the same expected cash is worth less today.

  Profits do matter, since they're what dividends and growth come from, but through expectations. Tax doesn't turn a profit into a loss for the owners, and higher profits don't make shares scarcer.
skills: [price-drivers]
