- term: bond
  definition: "A loan to a company or government, cut into pieces investors can buy: it promises fixed interest payments and repayment of its face value at the end."
- term: coupon
  definition: "A bond's fixed interest payment, a set share of its face value (the coupon rate) paid on a schedule, once a year in this module."
- term: face value
  aliases: [par value]
  definition: "The amount a bond repays at the end of its life, and the amount its coupon rate is a share of. Its price can be above or below it."
- term: maturity
  definition: "The date a bond ends and its face value is repaid."
- term: mutual fund
  definition: "A fund that pools many investors' money to buy many investments, bought from and sold back to the fund once a day at its net asset value."
- term: ETF
  aliases: [exchange-traded fund]
  definition: "A fund that pools investors' money like a mutual fund, but whose shares trade on an exchange all day at a market price close to its net asset value."
- term: index fund
  definition: "A mutual fund or ETF that buys the securities on a market index's list in the index's proportions, so its return follows the index's, less fees."
- term: net asset value
  aliases: [NAV]
  definition: "A fund's holdings at the day's closing prices, less what it owes, divided by its number of shares: the price a mutual fund is bought and sold at."
