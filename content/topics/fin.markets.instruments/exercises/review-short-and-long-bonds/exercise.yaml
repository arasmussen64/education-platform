title: "Short bonds and long bonds"
prompt: |
  Three made-up bonds each have a face value of $1,000 and a 4% coupon paid once a year; they last 2, 10 and 30 years. Market rates rise from 3.5% to 4.5%. Start from these two lines:

  ```python
  old_rate = 0.035
  new_rate = 0.045
  ```

  For each bond, print its price at the old rate, at the new rate, and the change as a share of the old price:

  ```
  2 years: $1,009.50 to $990.64, -1.9%
  10 years: $1,041.58 to $960.44, -7.8%
  30 years: $1,091.96 to $918.56, -15.9%
  ```

  A bond's price is the present value of its coupons and its face value. Keep the two starting lines: the checks run your program with other rates.
skills: [bond-value]
