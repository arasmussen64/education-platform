id: example-a-bond-as-cash-flows
stage: worked_example
rev: 1
title: "A bond as a list of cash flows"
prompt: |
  A made-up bond with a face value of $1,000 pays a 5% coupon once a year for 3 years, then repays the $1,000. This program writes it as a list of cash flows and prices it at three market rates. Press **Run**, then read how each part works.
steps:
  - label: "Present value of a list of flows"
    lines: "1-5"
    note: "The function from Present and future value: the flow at position `t` is `t` years away, so it's divided by `(1 + rate) ** t`. The first flow, at position 0, is today and isn't discounted at all."
  - label: "The bond's terms"
    lines: "8-10"
    note: "The face value is what the issuer repays at the end; the coupon rate says how much interest it pays each year, as a share of the face value. Both are fixed when the bond is issued."
  - label: "Build the cash flows"
    lines: "12-17"
    note: "Today the holder receives nothing, so the list starts with `0`. Then one coupon of $50 for each year. `flows[-1]` is the last item: the face value is added to the last year's coupon, because that's when it's repaid. The list reads `[0, 50.0, 50.0, 1050.0]`."
  - label: "Price it at three market rates"
    lines: "19-21"
    note: "A bond's price is the present value of its cash flows at the rate the market wants now. At 5%, the same as the coupon, it's worth exactly its face value. At 3% it's worth more; at 7% less, $947.51. The bond's payments never changed: only the rate they're discounted at."
