id: write-share-value
stage: write
rev: 1
title: "What a share is worth"
prompt: |
  A made-up company is expected to pay dividends of $2.00, $2.10, $2.20, $2.30 and $2.40 over the next five years, one a year, and you expect to be able to sell the share for $60.00 at the end of year five. You want 8% a year for the risk. The starter holds those numbers and `present_value_of_flows(flows, rate)` from Present and future value.

  Write `share_value(dividends, sale_price, rate)`, which builds the cash flows (nothing today, then one dividend a year, with the sale price added to the last year) and returns their present value. Then print the value at the rate, at a rate 2 points higher, and with a sale price $10 lower:

  ```
  Value at 8%: $49.56
  Value at 10%: $45.52
  Value if the sale price is $50.00: $42.75
  ```

  The last two lines are the two things that move a share's price: the rate investors want, and what they expect. Keep the three starting lines: the checks run your program with another share.
hints:
  - "Start the list with `[0]` for today, append each dividend, then add `sale_price` to `flows[-1]`, as the worked example did with the bond's face value."
  - "Return `present_value_of_flows(flows, rate)`."
  - "The second line calls `share_value(dividends, sale_price, rate + 0.02)` and prints `rate + 0.02` with `:.0%`; the third uses `sale_price - 10`."
skills: [price-drivers]
