id: debug-bond-pricer
stage: debug
rev: 1
title: "A bond pricer that's too generous"
prompt: |
  This program prices a made-up bond: a face value of $1,000, a 3% coupon paid once a year for 4 years, the face value repaid at the end of year 4, and a market that now wants 5%. It should print:

  ```
  Price: $929.08
  Below face value: the market wants more than the coupon pays
  ```

  Instead it prints `Price: $1,177.30` and says the bond is at or above face value, although the market wants more than the bond pays. It has two bugs. Run it, fix one thing at a time, and run it again after each fix.
skills: [bond-value]
