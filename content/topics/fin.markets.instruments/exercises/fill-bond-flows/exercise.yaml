id: fill-bond-flows
stage: fill_in
rev: 1
title: "Pricing a bond"
prompt: |
  A made-up bond with a face value of $500 pays a 6% coupon once a year for 4 years, and the market now wants 8%. Replace each `...` so the program builds the bond's cash flows and prints its price:

  ```
  Price: $466.88
  ```

  Both gaps stand where a value goes, so Python starts the program with the gaps still in it and stops with a `TypeError` that mentions `ellipsis`. The checks also run it with another bond.
hints:
  - "Each year's coupon is a share of the face value: the face value times the coupon rate, not the market rate."
  - "At the end the issuer repays the face value, on top of the last coupon."
skills: [bond-value]
