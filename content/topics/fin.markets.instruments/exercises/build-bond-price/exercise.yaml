id: build-bond-price
stage: build
rev: 1
title: "A bond pricer"
prompt: |
  From a blank editor. Write `bond_price(face, coupon_rate, years, market_rate)`, which returns the price of a bond that pays `face * coupon_rate` once a year for `years` years and repays `face` with the last coupon, discounted at `market_rate`. Nothing is paid today. You may write the present value yourself or define `present_value_of_flows(flows, rate)` first, as in Present and future value (the flow at position `t` is divided by `(1 + rate) ** t`).

  Start the rest of the program with these three lines (the checks change them):

  ```python
  face = 1000
  coupon_rate = 0.04
  years = 6
  ```

  Then print the bond's price at market rates of 2%, 4% and 6%:

  ```
  At 2%: $1,112.03
  At 4%: $1,000.00
  At 6%: $901.65
  ```

  The checks also call `bond_price` with other bonds.
skills: [bond-value]
