# A planned outline for the Machine Learning Foundations track
# (docs/specs/ml-foundations.md). It becomes real content when written.
id: ml.tf.attention
kind: topic
status: planned
title: Attention from scratch
summary: Queries, keys and values as three linear maps of the same rows; scaled dot-product scores; a softmax over positions that turns scores into weights; the causal mask that stops a position from seeing its future; the weighted sum of values; the whole thing as a layer with a backward pass that passes the gradient check.
prerequisites:
- ml.tf.tokens-and-embeddings
estimated_minutes: 60
rev: 1
objectives:
- "Compute single-head attention by hand for a few positions: scores, the scaling by the square root of the key size, the softmax, the weighted sum."
- Apply the causal mask and say what it forbids and why a language model needs it.
- Implement attention as a layer with forward, backward, parameters and gradients, and gradient-check it.
- Read an attention weight matrix and say what it means for one position to attend to another.
