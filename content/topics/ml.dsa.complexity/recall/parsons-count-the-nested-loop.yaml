id: parsons-count-the-nested-loop
type: parsons
rev: 1
prompt: |
  Put the lines in order to count how many pairs a nested loop compares among 20 items, and print `190`. One line is a decoy that doesn't belong.
lines:
  - 'count = 0'
  - 'n = 20'
  - 'for i in range(n):'
  - '    for j in range(i + 1, n):'
  - '        count += 1'
  - 'print(count)'
distractors:
  - '    for j in range(n):'
explanation: |
  The inner loop starts at `i + 1`, so each pair is counted once: 19 + 18 + ... + 1 = 190, which is `20 * 19 / 2`. The decoy's inner loop starts at 0 and counts every ordered pair including each item with itself, 400. Both are quadratic; the honest count is half the square.
skills: [count]
