id: csa.linux.services
kind: topic
status: ready
title: "Services and logs"
summary: "Run a program as a service that starts at boot, restarts when it crashes and keeps its logs: systemd unit files, systemctl, and reading the journal with journalctl."
prerequisites: [csa.linux.processes]
estimated_minutes: 220
rev: 1
objectives:
  - "Read and write a service's unit file: what the `[Unit]`, `[Service]` and `[Install]` sections are for, and the handful of lines most services need (`ExecStart`, `User`, `Restart`, `WantedBy`)."
  - "Control a service with `systemctl`: start, stop, restart, reload, status, enable and disable, and what to run after editing a unit file."
  - "Read a service's logs with `journalctl`: one unit, the last lines, following live, only errors, since the last boot, and as JSON."
  - "Explain why a systemd service beats a program started with `nohup` or `&`: supervision, restarts, boot order and logging in one place."
