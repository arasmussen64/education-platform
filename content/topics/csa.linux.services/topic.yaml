# The browser has no systemd, so the recall items read unit files, systemctl
# listings and journal output with the text tools of the first topic. The
# worked example, the fill-in, the write and both proofs are labs in a
# container that boots systemd (ADR-0017, ADR-0018).
practice:
  - example-first-service
  - mcq-why-a-service
  - svc-unit-sections
  - svc-unit-fields
  - mcq-after-wants
  - mcq-daemon-reload
  - svc-where-units-live
  - svc-failed-units
  - svc-enabled-units
  - mcq-status-output
  - mcq-restart-policy
  - svc-journal-restarts
  - svc-journal-errors
  - mcq-journalctl-flags
  - svc-journal-priorities
  - mcq-journal-persistent
  - mcq-reload-vs-restart
