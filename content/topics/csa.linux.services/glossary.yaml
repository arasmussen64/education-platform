- term: unit file
  definition: "A small text file that tells systemd how to run something: for a service, the command, the user, when to restart it and when it's wanted."
- term: drop-in
  definition: "A small file in a `NAME.d/` folder that changes only some settings of a configuration, such as a packaged unit, so the original file stays as shipped."
- term: journal
  definition: "systemd's log of everything services and the kernel print, with times, priorities and unit names. `journalctl` reads it."
