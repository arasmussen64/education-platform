id: mcq-after-wants
type: mcq
rev: 1
prompt: |
  A unit has `After=network-online.target` but not `Wants=network-online.target`. What does that mean?
choices:
  - "If the network target is being started, this service waits for it; but nothing makes sure the network target is started at all"
  - "The network target is started whenever this service is, and this service waits for it"
  - "This service starts first, and the network target afterwards"
  - "The service refuses to start unless the network target has already finished"
answer: 0
explanation: |
  `After=` is only about *order*: when both are being started, this one goes second. `Wants=` is about *dependency*: starting this service also pulls the other in. Without `Wants=`, on a machine where nothing else wants `network-online.target`, your service may start with no network and no waiting at all. That's why unit files usually carry both lines. "Refuses to start unless" is the stricter `Requires=`.
skills: [unit-files, supervision]
