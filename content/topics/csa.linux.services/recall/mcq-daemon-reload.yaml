id: mcq-daemon-reload
type: mcq
rev: 2
prompt: |
  You change `ExecStart=` in `/etc/systemd/system/app.service` and run `systemctl restart app`, but the old command is still what's running. What did you miss?
choices:
  - "`systemctl reload app`: `restart` reuses the loaded unit, while `reload` rereads the file from disk"
  - "`systemctl daemon-reload`: systemd keeps its own copy of a unit until it is told to reread the files"
  - "`systemctl enable app`: a changed unit file only takes effect once the service is enabled again"
  - "A reboot: unit files are read only while the machine starts, and no command rereads them later"
answer: 1
explanation: |
  systemd keeps its own copy of every unit it has loaded. Editing the file on disk changes nothing until `systemctl daemon-reload` makes it reread them, and `restart` then uses the new `ExecStart=`; `systemctl status` even warns that the unit "changed on disk" when you forget. No reboot is needed. `enable` is about starting at boot, not about rereading. And `reload` asks the *service* to reread *its own* config (nginx's, say), not systemd to reread the unit file.
skills: [unit-files, systemctl]
