id: mcq-status-output
type: mcq
rev: 2
prompt: |
  `systemctl status app` prints, among other lines:
  ```
  Loaded: loaded (/etc/systemd/system/app.service; disabled; preset: enabled)
  Active: active (running) since Sun 2026-11-09 10:05:22 UTC; 2h 14min ago
  ```
  What do you know?
choices:
  - "It is running now and will start at the next boot, because the preset is enabled"
  - "It is running now, but as things stand it will not be started at the next boot"
  - "It is loaded but not running: `disabled` means that the service has been stopped"
  - "It stopped running 2 hours and 14 minutes ago, and has been `disabled` since then"
answer: 1
explanation: |
  `Active: active (running)` is the present: it's up, and has been since 10:05, which is the 2 hours 14 minutes. `disabled` in the `Loaded` line is about the future: nobody has enabled it, so a reboot won't start it. It says nothing about whether the service is running now. The preset only says what the distribution *would* choose; it doesn't act by itself. `systemctl enable app` fixes the second half.
skills: [systemctl]
