id: mcq-status-output
type: mcq
rev: 1
prompt: |
  `systemctl status app` prints, among other lines:
  ```
  Loaded: loaded (/etc/systemd/system/app.service; disabled; preset: enabled)
  Active: active (running) since Sun 2026-11-09 10:05:22 UTC; 2h 14min ago
  ```
  What do you know?
choices:
  - "It's running now, but it will not start at the next boot"
  - "It's running now and will start at boot, because the preset is enabled"
  - "It isn't running: `disabled` means stopped"
  - "It crashed 2 hours ago"
answer: 0
explanation: |
  `Active: active (running)` is the present: it's up, and has been since 10:05. `disabled` in the `Loaded` line is about the future: nobody has enabled it, so a reboot won't start it. The preset only says what the distribution *would* choose; it doesn't act by itself. `systemctl enable app` fixes the second half.
skills: [systemctl]
