id: mcq-journalctl-flags
type: mcq
rev: 1
prompt: |
  You want to watch a service's log live while you reproduce a bug, and see only what happened since the machine last booted. Which command?
choices:
  - "`journalctl -u app -b -f`"
  - "`journalctl -u app -n 50`"
  - "`journalctl -u app --since yesterday -p err`"
  - "`systemctl status app -f`"
answer: 0
explanation: |
  `-u app` picks the unit, `-b` limits to the current boot, and `-f` follows new entries as they arrive, like `tail -f`. `-n 50` shows the last fifty lines and stops. `--since yesterday -p err` is a different question: errors from a time range. `systemctl status` shows a few recent lines but has no follow mode.
skills: [journalctl]
