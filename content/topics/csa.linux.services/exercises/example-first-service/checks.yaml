# The checks for "Your first service": the unit is where units live, systemd
# has it enabled and running, and the program's output reached the journal.
checks:
  - id: unit-installed
    description: "heartbeat.service is installed in /etc/systemd/system."
    command: test -f /etc/systemd/system/heartbeat.service
  - id: enabled
    description: "The service is enabled, so it starts at boot."
    command: systemctl is-enabled heartbeat
    expect:
      equals: enabled
  - id: active
    description: "The service is running."
    command: systemctl is-active heartbeat
    expect:
      equals: active
  - id: in-journal
    description: "Its heartbeat lines are in the journal."
    # A freshly started service's first line can take a moment to land.
    command: |
      count=0
      for _ in 1 2 3 4 5 6; do
        count=$(journalctl -u heartbeat -o cat --no-pager 2>/dev/null | grep -c 'heartbeat: alive')
        [ "$count" -ge 1 ] && break
        sleep 1
      done
      echo "$count"
    expect:
      gte: 1
