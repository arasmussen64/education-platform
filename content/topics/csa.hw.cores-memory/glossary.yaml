# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: vCPU
  aliases: [virtual CPU]
  definition: The unit of CPU a cloud sells. On most x86 sizes it is one hardware thread, two to a physical core; on Arm and a few AMD sizes it is a whole core.
- term: simultaneous multithreading
  aliases: [SMT, Hyper-Threading, hyperthread, hardware thread]
  definition: A core running two streams of instructions at once, each a hardware thread that Linux counts as a CPU. Two threads on one core do more than one, well short of two.
- term: NUMA
  aliases: [non-uniform memory access]
  definition: A big server's layout in which each processor has memory of its own. Its CPUs reach their own memory quickly and the other processor's more slowly; Linux calls each group a node.
- term: burstable instance
  aliases: [burstable size]
  definition: A cheaper VM size that may use only a share of its CPUs all the time, its baseline, and runs above it by spending CPU credits it earned while quieter.
- term: CPU credit
  definition: 'A burstable instance''s allowance: one vCPU at 100% for one minute. It earns credits at its baseline rate and spends them by working above it.'
- term: percentile
  definition: The value a given share of the samples are at or below. The 95th percentile of a week's CPU samples is busier than all but the top 5%.
- term: headroom
  definition: Room left free on purpose, for growth and short bursts, stated in a sizing policy, such as "the busy hours may fill at most 60% of the new machine".
