id: csa.hw.cores-memory
kind: topic
status: ready
title: "Cores, memory and noisy neighbours"
summary: "What a cloud VM's CPUs really are: sockets, cores and hardware threads, and when a vCPU is a thread or a whole core; NUMA nodes and far memory; how burstable sizes ration CPU with credits on each cloud; how to tell CPU the host withheld from a cap of the machine's own and from a machine that is simply too small; and how to size a machine from a week of its numbers."
# Module 2's plan (docs/plans/cloud-module-2/MODULE-2-BRIEF.md, section 2):
# every Module 2 topic depends on Checkpoint 1 through another Module 2 topic,
# and this one builds on Hypervisors (host, guest, tenant, dedicated host,
# what a hypervisor isolates). The Module 1 topics it leans on (cpu, memory,
# services, triage, shell, scripting) are all before Checkpoint 1.
prerequisites: [csa.hw.hypervisors]
# Counted: lesson 15, the reading the lesson asks for 38, the 23 quick
# questions of the practice ladder 40, the worked example 30, the fill-in 25,
# the write 30, the build 60, the debug 45, the explain 20.
estimated_minutes: 300
rev: 1
objectives:
  - "Read `lscpu` and a provider's instance table: sockets, cores and threads per core, and so whether a vCPU is one hardware thread or a whole core, and what switching SMT off changes and costs."
  - "Read a machine's NUMA nodes in `lscpu` and `numactl --hardware`, say why memory on the far node is slower, and keep a process's CPUs and memory on one node."
  - "Work a burstable instance's credit bucket: what it earns and spends, when it runs dry, what happens then in AWS's standard and unlimited modes, on Azure's B-series and on Google's shared-core sizes."
  - "Tell CPU the host withheld (steal, over an interval in `/proc/stat`) from a cap of the machine's own (a cgroup quota, a `memory.high` throttle, a CPU pin) and from a machine that is simply too small, with the witness and the fix for each."
  - "Size a machine from a week of its metrics: the 95th percentile of CPU and the peak of memory against a stated headroom, the cheapest size that fits, and when a burstable size does."
# Facts, each read on the day (2026-11-11), with where:
# - vCPUs, cores and threads per core: AWS's instance table,
#   https://docs.aws.amazon.com/ec2/latest/instancetypes/gp.html (m5.xlarge
#   4/2/2, m5.24xlarge 96/48/2, m7i.large 2/1/2, m7i.xlarge 4/2/2,
#   m7i.2xlarge 8/4/2, m7g.large 2/2/1, m7g.xlarge 4/4/1, m7a.xlarge 4/4/1,
#   m8g.2xlarge 8/8/1, t3.large 2/1/2, t3.2xlarge 8/4/2); AWS's CPU options
#   page (SMT off on most sizes, not on T2, C7a, M7a, R7a, Graviton; "charged
#   the same"); Azure, https://learn.microsoft.com/en-us/azure/virtual-machines/mitigate-se
#   ("Azure allocates 2 threads per core - these are called vCPUs"; check
#   Thread(s) per core in lscpu), .../vm-customization (threads per core = 1;
#   "The base VM price remains the same"), .../sizes/general-purpose/dsv5-series
#   ("hyper threaded configuration"), .../dpsv6-series (Cobalt 100, "an entire
#   physical core for each virtual machine vCPU"), .../sizes/compute-optimized/f-family
#   (Fasv7 "without Simultaneous Multithreading"); Google,
#   https://docs.cloud.google.com/compute/docs/cpu-platforms ("each hardware
#   thread is called a virtual CPU"; Arm one thread per core; Tau T2D and H4D
#   one thread per core) and .../instances/set-threads-per-core (n2-standard-8
#   at 1 thread: "still billed for 8 vCPUs").
# - Pinning and sharing: AWS Nitro whitepaper, "The EC2 approach to
#   preventing side-channels" (fixed-performance cores "pinned"; never shared
#   simultaneously through SMT; some sizes share last-level cache lines
#   non-simultaneously; burstable instances overcommitted and run
#   sequentially on a core; Nitro exposes the CPU topology and NUMA).
# - Steal: AWS re:Post, https://repost.aws/knowledge-center/ec2-troubleshoot-cpu-utilization
#   (causes: a busy neighbour, an overloaded hypervisor, "The CPU credit
#   balance for a burstable instance is depleted"; keep steal under 5%);
#   proc_stat(5) (steal is the eighth value, in USER_HZ). Azure's pages read
#   say nothing about what a B-series guest sees when throttled, so the
#   lesson claims nothing for Azure.
# - Credits: AWS's main resource (credit = 1 vCPU x 100% x 1 minute; earned
#   an hour = baseline x vCPUs x 60; a day's earnings at most; T8i, T4g, T3a
#   and T3 launch unlimited; standard "gradually comes down to baseline";
#   credits kept 7 days after a stop, T2 none; the credit table); AWS's
#   on-demand pricing page (surplus credits on T2 and T3 Linux $0.05 a
#   vCPU-hour, every region); AWS's unlimited-mode page (t3.large against
#   m5.large breaks even at 42.5%; flat out costs "approximately 1.5 times"
#   an M5); Azure's B-series credit model page ("throttled back to its base
#   CPU performance"; credits banked a minute formula; B2ts_v2 and B32as_v2
#   examples) and Bsv2 table (B2ts_v2 20% 60 24 576, B2ls_v2 30% 60 36 864,
#   B2s_v2 40% 60 48 1,152, B4ls_v2 30% 120 72 1,728; hyper-threaded; no
#   local disk); Google, .../general-purpose-machines (e2-micro 12.5%,
#   e2-small 25%, e2-medium 50% of each of 2 vCPUs; bursts of 30, 60, 120
#   seconds at 100%, "a Token bucket"; no extra charge). Azure's B-series v1
#   (B1s, B2s, B2ms) was announced for retirement on 2025-10-15, to retire
#   2028-11-15: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/retirement/retired-sizes-list
#   so the lesson uses Bsv2.
# - Pressure, throttles and pins: https://docs.kernel.org/accounting/psi.html,
#   https://docs.kernel.org/admin-guide/cgroup-v2.html (memory.high "throttle
#   limit"; memory.events high), systemd.resource-control(5) (MemoryHigh=
#   "heavily slowed down"; AllowedCPUs=). Tried on Docker Desktop: an empty
#   AllowedCPUs= leaves a running process on its old CPUs until restarted.
# - NUMA: https://docs.kernel.org/mm/numa.html; Azure HBv3 overview (SMT
#   disabled, 4 NUMA domains in the VM); numactl(8) (--membind "Allocation
#   will fail when there is not enough memory").
# - Sizing: AWS Compute Optimizer's preferences page ("A percentile is the
#   value below which a given percentage of your data points fall"; P90, P95,
#   P99.5; CPU headroom 30, 20 or 0%, memory 30, 20 or 10%; "Balanced": P95
#   with 30% headroom). The build's prices: AWS's public price file for US
#   East (N. Virginia), Linux, on-demand, published 2026-11-10, read
#   2026-11-11.
# Linked, never copied. Licences as each source states them, read
