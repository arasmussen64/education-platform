prove:
  build: build-capacity-review
  debug: debug-crawling-db
  explain:
    prompt: |
      A team moved a database from a physical server with 16 cores to a cloud VM with 16 vCPUs of a burstable type. A week later the database is slow every afternoon, and a colleague blames "noisy neighbours". Explain, in your own words: what 16 vCPUs usually are, and how you would check; how a burstable instance's credits work, and why the slowdown took a week to show; how you would tell CPU the host withheld from a cap of the machine's own and from a machine that is simply too small, and what a neighbour can and cannot take from you; how you would size its replacement from a week of its numbers; and how the three clouds differ on any two of these.
    rubric:
      - id: vcpu
        required: true
        description: "On most x86 sizes a vCPU is one hardware thread and two share a core, so 16 vCPUs are 8 cores; Arm sizes and some AMD sizes give a whole core per vCPU. lscpu's threads per core, cores per socket and sockets, or the provider's instance table, say which."
      - id: credits
        required: true
        description: "A burstable instance earns credits at a fixed rate set by its baseline (vCPUs × baseline × 60 an hour) and spends them in proportion to its CPU use, one credit for one vCPU flat out for a minute; below the baseline the balance grows to about a day's earnings, above it the balance falls. A steady load a little above the baseline takes days to empty a full bucket, and then the instance is held to its baseline (or, in AWS's unlimited mode, keeps going and is billed for the surplus)."
      - id: stolen-capped-busy
        required: true
        description: "Steal (st, the eighth counter in /proc/stat, compared over an interval) is CPU the host withheld: spent credits on a burstable size, or a busy host. Throttled periods in cpu.stat, a memory.high throttle (memory.events high rising) or a CPU pin are caps of the machine's own and show no steal. A run queue (vmstat's r) above the CPU count with no steal and no limit is a machine that is too small. Each has a different remedy: a fixed-size or unlimited instance, raising the cap, more vCPUs."
      - id: neighbours
        required: true
        description: "On fixed-size instances the provider dedicates cores to the instance (AWS pins them), so a neighbour can't take CPU time, though shared caches, memory bandwidth, disks and the network can still be contended; a dedicated host removes the neighbours. Here the cause is the burstable type's credits, not a neighbour."
      - id: right-size
        required: true
        description: "Size the CPU on the 95th percentile of a week of samples, not the average (which undersizes the busy hours) or the largest sample (one burst then sets the size), against a stated headroom (for example at most 60 or 70% busy); size memory on its peak with headroom; take the cheapest size that meets both; a burstable size only if the average per vCPU is at or under its baseline and the peaks are short, which this database's isn't."
      - id: clouds-differ
        required: true
        description: "Any two correct differences, for example: AWS's T3 and later default to unlimited mode and bill surplus credits, while Azure's B-series is throttled to its base; Google's shared-core sizes have no visible bank and burst for seconds; Google bills all of a machine type's vCPUs when SMT is switched off, as AWS and Azure charge the full size too; which sizes give a core per vCPU."
      - id: numa
        required: false
        description: "Large instances span NUMA nodes; memory on the far node is slower; keep a process's CPUs and memory on one node."
    model_answer: |
      On most x86 cloud sizes a vCPU is one hardware thread, and each physical core runs two, so the VM's 16 vCPUs are 8 cores, about half the physical server the database came from. Two threads on a core do more than one but well short of two cores' work. Arm sizes, and a few AMD ones, give a whole core per vCPU. To check, I'd read lscpu: sockets times cores per socket is the cores, and threads per core says how many vCPUs share each one; the provider's instance table says the same. A big size also spans NUMA nodes, and a database should keep its CPUs and its memory on the same node, because far memory is slower to reach.

      A burstable instance runs on credits. One credit is one vCPU at 100% for a minute. It earns its baseline on every vCPU, vCPUs times baseline times 60 credits an hour, and spends what it uses; under the baseline the bucket fills, up to about a day's earnings, and over it the bucket drains. A database a little above the baseline drains a full bucket slowly: a t3.medium at 25% instead of its 20% loses 6 credits an hour and runs dry after four days. That's why it took a week. Then, in AWS's standard mode or on Azure's B-series, the instance is held to its baseline; in AWS's unlimited mode, the default for T3, it keeps going and the bill grows instead. Google's shared-core sizes have no bank at all and burst for seconds.

      To tell the causes apart I'd take two readings of /proc/stat a minute apart and work out steal, the eighth counter's growth over the growth of the first eight. High steal means the host is withholding CPU: here, spent credits. If steal were zero I'd look for caps of the machine's own: nr_throttled rising in the service's cpu.stat, a memory.high throttle counting up in memory.events, a CPU pin. With no steal and no limits, a run queue in vmstat above the number of CPUs means the machine is too small. Noisy neighbours are rarely the answer on a fixed-size instance, whose cores are pinned to it; a neighbour can still crowd shared caches, memory, disks and the network, but that never shows as steal. A dedicated host removes neighbours.

      To size the replacement I'd take a week of five-minute samples and size the CPU on the 95th percentile, not the average, which undersizes the busy afternoons, nor the largest sample, which lets one burst set the size, so that at the 95th percentile it uses, say, at most 60% of the new vCPUs. Memory goes on its peak with headroom. Then the cheapest size that meets both. A database busy every afternoon has an average above a burstable baseline, so it needs a fixed-size instance.
