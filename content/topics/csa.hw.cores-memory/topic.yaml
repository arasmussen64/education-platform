  - id: vcpu-to-core
    description: "Read `lscpu` (sockets, cores per socket, threads per core) and a provider's instance table; turn vCPUs into physical cores; say when a vCPU is a thread and when a whole core, and what switching SMT off changes and costs"
  - id: numa
    description: "Read NUMA nodes in `lscpu` and `numactl --hardware`; local and far memory and node distances; keep a process's CPUs and memory on one node; say when it matters"
  - id: burst-credits
    description: "Burstable instances: the baseline, credits earned and spent, when the bucket empties or fills, what happens at zero in AWS's standard and unlimited modes, and how Azure's B-series and Google's shared-core sizes differ"
  - id: stolen-or-capped
    description: "Tell CPU the host withheld (steal over an interval in `/proc/stat`, `mpstat`'s `%steal`) from a cap of the machine's own (a cgroup CPU quota, a `memory.high` throttle, a CPU pin with `AllowedCPUs=`) and from a machine that is too small, using `cpu.stat`, `memory.events` and the pressure files; what a neighbour can and cannot take; which remedy fits"
