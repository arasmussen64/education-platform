id: build-capacity-review
stage: build
runtime: lab
rev: 1
title: "The capacity review"
prompt: |
  The shop is moving its servers to the cloud and wants a one-page capacity review before it signs anything. The evidence is in `/srv/review/`, and `/srv/review/README.txt` says what each answer means and how exact it must be:

  - three of the servers being moved, `app-1`, `db-2` and `arm-2`, saved under `machines/` as copies of what each one's `lscpu` reads: how many physical cores each has, how many NUMA nodes `db-2` has, and which node its CPU 40 is on;
  - two readings of the reporting server's `/proc/stat`, ten minutes apart: how much of that time was stolen;
  - a day of the admin tool's CPU use, minute by minute, and the burstable instance it is proposed for: when its credits first run out, and for how many minutes it would be held to its baseline;
  - a week of the web server's metrics and a dated list of sizes: the cheapest size that meets the shop's sizing policy, which the README states;
  - a ticket from the finance team about a slow VM, with what an on-call script saved from it: the cause, the one number that shows it, and the fix, each from the lists in the README.

  Write your answers in `~/review/answers.txt`, one `key=value` line for each key it lists. Use any tools you like: the commands of this topic's practice, a calculator, or both. Then run the checks; each answer has a check of its own.
skills: [vcpu-to-core, numa, stolen-or-capped, burst-credits, right-size]
