id: est-cores-from-vcpus
type: estimate
rev: 1
prompt: |
  A physics simulation runs one worker per physical core, because two workers on the two threads of one core slow each other down. AWS's instance table (read 2026-11-11) lists `m5.24xlarge` with 96 vCPUs and 2 threads per core. How many workers should it run? Exactly.
unit: workers
answer: 48
tolerance: { absolute: 0 }
given: { vcpus: 96, threads: 2 }
working: vcpus / threads
mistakes:
  - id: counts-threads
    value: 96
    working: vcpus
    why: That counts hardware threads. Two of them share each core, so 96 vCPUs are 48 cores.
  - id: multiplied
    value: 192
    working: vcpus * threads
    why: That multiplies where it should divide. The vCPUs already are the threads; dividing by the threads per core gives the cores.
explanation: |
  96 ÷ 2 = 48 cores, so 48 workers. AWS's table says the same in its own column: `m5.24xlarge` has 48 CPU cores.
skills: [vcpu-to-core]
