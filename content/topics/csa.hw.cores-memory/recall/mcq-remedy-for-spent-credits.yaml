id: mcq-remedy-for-spent-credits
type: mcq
rev: 1
prompt: |
  A reporting job runs flat out for about twenty hours a day on Azure's `Standard_B2s_v2` (2 vCPUs, base CPU performance 40%; Microsoft's Bsv2 table, read 2026-11-11). A few hours into each day's run, the VM's "CPU Credits Remaining" metric reaches 0, and from then on the reports take two and a half times as long as they should. Which change addresses the cause?
choices:
  - "Raise the job's priority with `nice`, since a higher priority gets more of the CPU"
  - "Remove the CPU quota on the job's service, since the quota is what is throttling it"
  - "Move the job to a fixed-size VM with the same vCPUs, since it needs CPU all day"
  - "Add a second data disk to the VM, since the job is waiting on its disk's allowance"
answer: 2
explanation: |
  A B-series VM out of credits is "throttled back to its base CPU performance", 40% of each vCPU here, by Azure, outside the VM: the reports run at 40% of full speed, so they take two and a half times as long. Twenty hours flat out a day averages far above the 40% baseline, so the four quiet hours can never bank enough, and the bucket runs dry every day however full it starts. Work whose average is above the baseline needs whole vCPUs all the time, which a fixed-size VM gives.

  `nice` only orders the work inside the VM, and the VM as a whole is what's held back. Nothing in the story points at a cgroup quota or at a disk: the credit metric at 0 is the evidence.
skills: [stolen-or-capped, burst-credits]
