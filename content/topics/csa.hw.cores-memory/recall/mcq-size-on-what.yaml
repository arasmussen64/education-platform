id: mcq-size-on-what
type: mcq
rev: 1
prompt: |
  You are choosing the CPU of a replacement VM from a week of its 5-minute CPU samples. Which number do you size it on, and why?
choices:
  - "The average, with some headroom, because it is the load the machine carries most of the week"
  - "The largest sample, with no headroom, because anything less leaves some stretch of time too busy"
  - "The 95th percentile, with headroom, because busy hours must fit but one burst shouldn't decide"
  - "The current size, unchanged, because the samples were measured on it and so they say it fits"
answer: 2
explanation: |
  The 95th percentile is the value that 95% of the samples are at or below: in a week of 2,016 five-minute samples, everything but the busiest 100 or so. Sizing on it makes the busy hours fit, and the headroom in the policy (say "at most 60% busy at the 95th percentile") leaves room for growth and short bursts. AWS's Compute Optimizer works the same way, on a percentile with a chosen headroom.

  The average undersizes: half the week is busier than it, and the busy half is when people use the service. The largest sample oversizes: one runaway report then decides the size, and you pay all month for a burst of five minutes. And numbers measured on the current machine say how much of it is used, not whether it is the right size.
skills: [right-size]
