# The checks for "The disks that didn't come back": the three volumes are
# mounted from the right disks, with what was on them still there, fstab
# names each by its own UUID, and mount -a has nothing left to complain
# about. The descriptions say what must be true and not what was wrong,
# because the page shows them before any attempt.
#
# Two shortcuts make mount -a quiet without fixing anything, and each has
# a wrong fix to prove it is caught: reformatting a disk to match the file
# (wrong/reformatted-to-match.sh) and naming the disks by device instead of
# by UUID (wrong/device-names-in-fstab.sh).
checks:
  - id: shop-mounted
    description: "/srv/shop is mounted from data1, with the shop's data still on it."
    command: test "$(findmnt -n -o SOURCE /srv/shop)" = "$(readlink -f /dev/lab/data1)" && test -f /srv/shop/README
  - id: backups-mounted
    description: "/srv/backups is mounted from data2, which still carries the filesystem it came with."
    command: |
      test "$(findmnt -n -o SOURCE /srv/backups)" = "$(readlink -f /dev/lab/data2)" && findmnt -n -o FSTYPE /srv/backups
    expect:
      equals: xfs
  - id: archive-mounted
    description: "/srv/archive is mounted from data3."
    command: test "$(findmnt -n -o SOURCE /srv/archive)" = "$(readlink -f /dev/lab/data3)"
  - id: fstab-by-uuid
    description: "/etc/fstab lists all three by UUID, each mount point with its own disk's."
    # The UUIDs are the ones the lab gave the disks when it made them, so
    # changing a disk to match the file doesn't pass either. With or without
    # the double quotes blkid prints them in: mount takes both.
    command: |
      grep -Eq '^UUID="?11111111-1111-4111-8111-111111111111"?[[:space:]]+/srv/shop[[:space:]]' /etc/fstab \
        && grep -Eq '^UUID="?22222222-2222-4222-8222-222222222222"?[[:space:]]+/srv/backups[[:space:]]' /etc/fstab \
        && grep -Eq '^UUID="?33333333-3333-4333-8333-333333333333"?[[:space:]]+/srv/archive[[:space:]]' /etc/fstab
  - id: mount-a-quiet
    description: "mount -a succeeds."
    command: mount -a > /dev/null 2>&1
