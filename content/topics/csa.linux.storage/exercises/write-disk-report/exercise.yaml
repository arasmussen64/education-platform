id: write-disk-report
stage: write
runtime: lab
lab:
  init: systemd
rev: 2
title: "Write disk-report"
prompt: |
  Write a script, `~/bin/disk-report MOUNTPOINT`, that answers the four questions you ask about a filesystem that's filling up, as four lines. For a filesystem mounted at `/data`, say, it might print:

  ```
  used: 61%
  inodes: 7%
  biggest: /data/cache
  deleted but open: 0
  ```

  `used` is the filesystem's space in use, as `df` reports it; `inodes` the same for inodes; `biggest` the top-level folder inside the mount point that holds the most; and `deleted but open` how many files on that filesystem have been deleted but are still held open by some process (space `df` counts but `du` can't find).

  The lab has two filesystems to try it on, with different answers: the shop's data disk, mounted at `/srv/shop`, and its smaller media disk, mounted at `/srv/media`. On each of them a process is holding deleted files open. The checks run your script on both, so it has to work out its answers from the mount point it is given. Make the script executable, run it on each, and run the checks.
hints:
  - "The mount point arrives as `$1`; give it a name, `mount=\"$1\"`, and use `\"$mount\"` wherever the commands below say MOUNT. `df --output=pcent MOUNT | tail -n 1 | tr -d ' '` gives just the percentage; `df --output=ipcent` does the same for inodes."
  - "`sudo du -sk MOUNT/* | sort -rn | head -n 1 | cut -f2` finds the biggest top-level folder: sizes in kilobytes, biggest first, keep the first line, keep its path (the second tab-separated field)."
  - "`sudo lsof +L1` lists deleted files still held open, one per line, with the path near the end of the line; `grep -c \" MOUNT/\"` counts the ones on your filesystem and leaves out the other one's. It needs `sudo`, or you only see your own processes' files."
skills: [disk-full, block-devices]
