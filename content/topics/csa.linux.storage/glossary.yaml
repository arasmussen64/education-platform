- term: block device
  definition: "A disk as Linux sees it: a long row of numbered blocks that can be read and written, such as `/dev/nvme0n1`."
- term: filesystem
  definition: "The structure written onto a disk that turns its blocks into named files and folders, such as ext4 or XFS."
- term: mount point
  definition: "The folder where a filesystem is attached to the tree of files, so that `/data`, say, leads into that disk."
- term: inode
  definition: "The record that holds a file's details and points at its data. Every file costs one, so a filesystem can run out of inodes while it has bytes free."
- term: UUID
  definition: "A unique ID written into a filesystem when it's made, which stays the same when the disk gets a different device name. `/etc/fstab` names filesystems by it."
- term: LVM
  aliases: [Logical Volume Manager]
  definition: "Logical Volume Manager, a layer that pools disks into volume groups and carves them into logical volumes that can span disks and grow while in use."
- term: IOPS
  definition: "Input/output operations per second, the measure that small random reads and writes run into. Cloud disks have an IOPS limit as well as a throughput limit."
