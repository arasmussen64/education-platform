id: csa.linux.storage
kind: topic
status: ready
title: "Disks and filesystems"
summary: "From a raw disk to files you can use: partitions, filesystems, mount points and fstab; growing a disk in the cloud, with LVM; the two ways a disk fills up and how to fix each; and what durability costs."
prerequisites: [csa.linux.shell]
estimated_minutes: 100
rev: 1
objectives:
  - "Read `lsblk`, `blkid`, `df` and `/etc/fstab`: disks, partitions, filesystems, UUIDs and mount points, and attach, format and mount a new disk."
  - "Choose between ext4 and XFS for a new volume, and explain what inodes are."
  - "Grow a disk in the cloud without downtime, including what LVM adds (physical volumes, volume groups, logical volumes)."
  - "Fix a full disk: find what's using the space, tell a full disk from one that's out of inodes, and free a deleted file a process still holds open."
  - "Explain `fsync`, IOPS, throughput, latency and queue depth, and why turning durability off is dangerous."
