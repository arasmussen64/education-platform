id: disk-fstab-fields
type: predict_shell
rev: 1
prompt: |
  `fstab` is an `/etc/fstab`: what to mount, where, the filesystem type, the options, and two numbers for `dump` and `fsck`. The command drops the comment line and prints the mount point, the type and the options of each entry. What is printed?
files:
  fstab: |
    # <file system>                           <mount point> <type> <options>         <dump> <pass>
    UUID=3f2a9c1e-5b7d-4e2f-9a1b-2c3d4e5f6a7b /             ext4   defaults          0      1
    UUID=7c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f /var          xfs    defaults,nofail   0      2
    /dev/mapper/data-vol1                     /data         xfs    defaults,nofail   0      2
command: grep -v '^#' fstab | awk '{print $2, $3, $4}'
expected_output: |
  / ext4 defaults
  /var xfs defaults,nofail
  /data xfs defaults,nofail
explanation: |
  Three filesystems mounted at boot. The root is named by UUID, as is `/var`; `/data` is an LVM logical volume, whose `/dev/mapper` name is stable, so a UUID isn't needed. `nofail` on the two data volumes means that if one is missing the boot carries on without it, instead of dropping into an emergency shell; the root filesystem must never have it. The last two fields (`0 1`, `0 2`) say the root is checked first at boot and the others after.
skills: [block-devices]
