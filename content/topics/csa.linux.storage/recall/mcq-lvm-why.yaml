id: mcq-lvm-why
type: mcq
rev: 1
prompt: |
  What does LVM (the Logical Volume Manager) add on top of plain partitions?
choices:
  - "A faster filesystem"
  - "A layer between disks and filesystems: disks become physical volumes pooled in a volume group, carved into logical volumes that can span disks and be grown online, so a filesystem is no longer tied to one disk or one partition"
  - "Automatic backups of every volume"
  - "Encryption of the whole disk"
answer: 1
explanation: |
  With plain partitions a filesystem is stuck inside one partition on one disk. LVM pools disks (physical volumes) into a volume group and hands out logical volumes from the pool; a logical volume can be bigger than any single disk, and `lvextend -r` grows it and its filesystem while mounted. Adding a disk to the group (`vgextend`) gives every volume room to grow. Snapshots are a bonus; speed, backups and encryption are other tools' jobs.
skills: [lvm-grow]
