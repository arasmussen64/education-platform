id: mcq-deleted-open
type: mcq
rev: 1
prompt: |
  You run `rm /var/log/app/huge.log` to free 10 GB, but `df` shows no change. Why, and what frees the space?
choices:
  - "`rm` only marks files for deletion; run `sync` to finish"
  - "A running process still has the file open, so the data stays until it closes; find it with `lsof +L1`, then truncate the file through `/proc/PID/fd/N` or restart the process"
  - "The filesystem needs to be remounted to update `df`"
  - "The space was never used; `df` was wrong"
answer: 1
explanation: |
  Deleting removes the name from the folder; the file's blocks belong to it until no program has it open. A log writer usually keeps its log open forever, so the 10 GB stay allocated and even keep growing, now invisibly. `lsof +L1` lists open-but-deleted files with the PID and descriptor; `: > /proc/PID/fd/N` empties the file in place, or restarting the process closes it. In future, `truncate -s 0 huge.log` (or `logrotate` with `copytruncate`) frees the space immediately and keeps the file the program expects.
skills: [disk-full]
