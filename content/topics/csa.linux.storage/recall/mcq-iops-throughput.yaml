id: mcq-iops-throughput
type: mcq
rev: 2
prompt: |
  A database doing many small random reads and writes is slow, although the cloud disk's throughput graph shows it far below its MB/s limit. What's the likely limit, and what does queue depth have to do with it?
choices:
  - "IOPS: small random operations run into it first; a deeper queue lets every single request finish sooner"
  - "Throughput: the graph is lagging behind; a deeper queue raises the MB/s limit that the provider sets"
  - "IOPS: small random operations run into it first; a deeper queue gets more done, but each request waits longer"
  - "Latency: each request is slow because the queue is empty; a deeper queue shortens every request's wait"
answer: 2
explanation: |
  Cloud volumes are rated separately for IOPS (operations per second) and for throughput (megabytes per second), and often per instance too. Small random I/O hits the IOPS limit while barely moving the MB/s needle; large sequential I/O does the opposite, so the throughput graph is telling the truth and simply isn't the limit here. Queue depth is how many requests are in flight at once: more in flight means more work done per second, but each request sits in the queue longer, which is exactly what a database waiting on `fsync` can't afford. So a deeper queue never makes a single request faster, and it doesn't change the limits the provider sets. Latency is the symptom you see, not a separate limit to raise. The fix is a volume with more IOPS, or fewer operations.
skills: [durability]
