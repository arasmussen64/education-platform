id: mcq-ext4-vs-xfs
type: mcq
rev: 1
prompt: |
  You're formatting a new 2 TB volume for a database's data files and may need to grow it later, but never to shrink it. Which is true of the choice between ext4 and XFS?
choices:
  - "Only ext4 can be grown, so it must be ext4"
  - "Both are journaling filesystems that suit this well; XFS grows online and allocates inodes as needed but can't shrink, ext4 can shrink when unmounted but fixes its inode count at creation; either is a reasonable choice, and XFS is the common one for large data volumes"
  - "XFS has no journal, so a crash would corrupt the database"
  - "ext4 can't hold files over 1 TB"
answer: 1
explanation: |
  Both journal their metadata and both handle terabyte volumes and large files. The practical differences are small: XFS can't shrink (rarely needed) and never runs out of inodes; ext4 can shrink offline and is what Debian and Ubuntu install by default. Red Hat defaults to XFS for exactly this kind of volume. The wrong answer to avoid is thinking the choice is dangerous either way: it isn't.
skills: [filesystems]
