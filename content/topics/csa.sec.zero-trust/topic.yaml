prove:
  build: build-replace-the-vpn
  debug: debug-who-gets-in
  explain:
    prompt: |
      Your company's staff reach its internal apps over a VPN, and the head of security wants "zero trust" by next year. A colleague asks you what that will actually mean. Explain, in your own words: what zero trust is, and why being on the company network should prove nothing; the parts that decide and enforce each request, pointing at what would play each part in a design you'd build; how the device becomes part of the decision, and why a header the device sends doesn't count; how you'd make sure nothing reaches an app except through the enforcement point, and how you'd prove it; how access ends when someone leaves, and how long they might keep it in your design; and how you'd move from the VPN, including one thing that gets worse. Say one way the three clouds' services for this differ.
    rubric:
      - id: definition
        required: true
        description: "Zero trust means least-privilege decisions made for each request, with no trust granted for network location, on a network assumed to hold an attacker already. A VPN checks once and then trusts everything inside (the implicit trust zone), so one stolen password or one infected laptop reaches everything."
      - id: components
        required: true
        description: "A deciding side (the policy engine decides and logs, the policy administrator carries it out, often one service) and a policy enforcement point in the request's path. Mapped to something real: an access proxy in front of the apps enforces; the identity provider, with the proxy's sign-in service, decides who is signed in and in which group."
      - id: device
        required: true
        description: "The device is recognised by a credential the company issued, such as a device certificate from the company's own device CA, verified at the proxy; short lifetimes or renewal checks carry the device's state (posture). A header or a MAC address is the device describing itself, which anyone can copy."
      - id: segmentation
        required: true
        description: "Each app's own firewall accepts only the proxy (and each database only its app), with default drop in both directions, so an app can't be reached round the proxy or used to reach its neighbours. Proved by trying connections from every machine, and from a new machine with no firewall of its own."
      - id: continuous
        required: true
        description: "Sessions are re-checked against the identity provider at an interval, so switching someone off ends their access at the next re-check. A stated exposure window: the interval plus a request gap, longer where a token or a cache is accepted without asking again."
      - id: migration-and-risks
        required: true
        description: "App by app while the VPN still runs: put the app behind the proxy, close its own door, repeat, remove the VPN last, keep a guarded emergency way in. Something that gets worse: the proxy and the identity provider become a single point of failure and a target; or apps that aren't web apps need an agent or their own tunnel."
      - id: clouds-differ
        required: false
        description: "Any correct difference: AWS Verified Access decides each request by policy and charges for each application by the hour; Entra Private Access uses a client on the device and connectors beside the apps, under Conditional Access; Google's Identity-Aware Proxy checks an IAM role on each request and can be bypassed by reaching the app's port directly."
    model_answer: |
      A VPN asks who you are once, at the gateway, and then puts your laptop on the company network. From then on nothing asks again: every server and every port is reachable, by you and by anything running on your laptop. So one stolen password, or one laptop with malware, is the whole network. Zero trust drops the idea that being on the network means anything. It assumes an attacker is already inside, and decides every request separately: who is asking, on what device, for which app, and it grants only that.

      There are two sides to it. One side decides: it knows the policy and the facts, and says yes or no to each request. The standard splits that into a policy engine, which decides and logs, and a policy administrator, which carries the decision out. The other side enforces: something in the path of every request that lets it through or stops it. In a design I'd build, the enforcement point is an access proxy in front of the apps. The deciding side is our identity provider together with the proxy's sign-in service: the provider knows who is signed in and which groups they are in, and the proxy asks about every request.

      The device counts too, because the same person on a company laptop and on a stranger's machine isn't the same risk. The company gives each laptop it manages a certificate from its own device CA, and the proxy verifies it. Renewing those often means a lost or unpatched laptop stops getting one. A header saying "I'm compliant" is worthless, because the device is describing itself and anyone can send the same header.

      The proxy only matters if you can't go round it. So each app's own firewall accepts connections from the proxy and nothing else, the database accepts only its app, and each machine may start only the connections its job needs. I'd prove it by trying every connection from every machine, and from a new machine with no firewall, since a rule that trusts the whole subnet looks fine until something new arrives.

      When someone leaves, their account is switched off at the identity provider. The proxy re-checks each session there every few minutes, so their access ends at the next re-check: with a five-minute interval, within about five minutes. Anything that accepts a token without asking again adds its lifetime to that.

      Moving is done app by app with the VPN still running: put an app behind the proxy, close its direct door, move to the next, and switch the VPN off last, keeping one guarded emergency way in. What gets worse is that the proxy and the identity provider are now what everything depends on, so they have to be highly available and well defended.

      The clouds sell this differently: AWS's Verified Access is priced for each application by the hour, while Microsoft's Private Access puts a client on every device and connectors beside the apps.
