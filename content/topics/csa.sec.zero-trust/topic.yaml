id: csa.sec.zero-trust
kind: topic
status: ready
title: Zero trust
summary: "What a VPN really grants, and what replaces it. NIST's zero trust: decisions for each request, on a network assumed compromised. An access proxy that asks the identity provider about every request; the device as part of who is asking; a firewall round every app, proved by traffic; sessions re-checked so that access ends when trust does, and how to work out how long that takes; and the clouds' own access proxies."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 2,
# 3, 4.1 and 5) and its designer's brief (csa.sec.zero-trust.md), with what
# building the identity lab base found (BUILD-NOTES.md and
# content/lab-bases/id/README.md). It builds on csa.sec.federation (the
# identity provider, OpenID Connect's code flow, tokens and refresh tokens,
# the realm file, the lab's scripted browser) and csa.sec.strong-auth
# (device compliance, sign-in risk and conditional access, the break-glass
# account), and through them on csa.sec.authn-authz (the policy decision
# and enforcement points, 401 against 403, least privilege), Module 3
# (nginx, TLS, client certificates, the site-to-site VPN, the network labs)
# and Module 1 (nftables, "a firewall is proved by what gets through",
# background jobs, ShellCheck).
#
# This topic defines, for the module (the plan's 3.5): zero trust, policy
# engine, policy administrator, access proxy, ZTNA, device posture,
# micro-segmentation, lateral movement and exposure window; and with them
# implicit trust zone, remote-access VPN, managed device, device
# certificate, east-west traffic and continuous verification.
prerequisites: [csa.sec.federation, csa.sec.strong-auth]
# Worked out: the lesson 4,100 words with its tables, about 32 minutes, the
# puzzle and the story 3, 22 practice recall items at 1.5 each 33, then the
# worked example 30, the write lab 30, the fill-in 25, the build 60, the
# debug 40 and the explain 20: about 273. No reading is assigned: every
# resource is an optional link. The plan's 300 assumed a copied reading.
estimated_minutes: 275
rev: 1
objectives:
  - "State zero trust as NIST SP 800-207 does (least-privilege decisions for each request, no trust from network location, a network assumed compromised), say what the implicit trust zone is and why it should shrink, and point at the policy engine, the policy administrator and the policy enforcement point in a real system."
  - "Put an access proxy in front of internal apps so that each request is decided by who is asking and which group the app asks for, read its three answers (`202`, `401`, `403`), and make each app reachable only through it; and say what a remote-access VPN grants that the proxy doesn't."
  - "Make the device part of the decision with a certificate from the company's own device CA, verified at the proxy, and say why a header or a MAC address proves nothing and how short-lived certificates carry device posture."
  - "Micro-segment a network: a firewall on each machine, one rule for each job, default drop in both directions, proved by traffic from every machine and from a new one; and say how security groups, network security groups and Google Cloud's firewall rules do the same."
  - "Design continuous verification: re-check sessions against the identity provider, and work out the exposure window (how long a switched-off person or a lost device keeps access) from re-check intervals, token lifetimes and caches."
  - "Plan the move from a VPN to zero trust network access, app by app, name what gets worse, and say how AWS Verified Access, Entra Private Access and Google's Identity-Aware Proxy differ."
# Facts the lesson and the items rely on, each read on 2026-11-23 unless a
# line says otherwise.
# - NIST SP 800-207, "Zero Trust Architecture" (Rose, Borchert, Mitchell,
#   Connelly), final, August 2020, no revision listed:
#   csrc.nist.gov/pubs/sp/800/207/final; the PDF at
#   nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-207.pdf, read
#   as text. Section 2: the operative definition ("accurate, least
#   privilege per-request access decisions ... in the face of a network
#   viewed as compromised"); the airport checkpoint and "the implicit trust
#   zone is the boarding area"; lateral movement. 2.1: the seven tenets,
#   "Network location alone does not imply trust". 3: the policy engine
#   "makes and logs the decision", the policy administrator "executes the
#   decision", "Some implementations may treat the PE and PA as a single
#   service". 3.2: the device agent/gateway and resource portal models.
#   3.3.1: "20 to 30 employee records", "exceed 100 records in a day".
#   3.4.1: "enterprise-issued credentials and not using information that
#   cannot be authenticated ... (e.g., network MAC addresses that can be
#   spoofed)"; "Enterprise resources should not be reachable without
#   accessing a PEP". 5.2: denial of service on the PEP or PA "is also
#   possible in legacy remote-access VPNs and is not unique to ZTA".
# - The story: the US Senate Homeland Security and Governmental Affairs
#   Committee's page of 8 June 2021, with the exchange between Senator
#   Portman and Colonial Pipeline's chief executive, Joseph Blount: "a
#   compromised password of a virtual private network, or VPN, account";
#   "in the case of this particular legacy VPN, it did only have
#   single-factor authentication"; "It was a complicated password"; "we use
#   an RSA token allowance ... for remote access"; the decision "that
#   evening" (7 May) to negotiate, and "The payment was made the following
#   day". The page gives no ransom amount and no length of shutdown, so the
#   story gives neither. The plan's wording "a VPN profile nobody meant to
#   be in use" is not on that page and is not in the story.
# - Ward and Beyer, "BeyondCorp: A New Approach to Enterprise Security",
#   ;login: December 2014 (the PDF, read as text): "To receive a
#   certificate, a device must be both present and correct in the Device
#   Inventory Database"; "These checks are also enforced as certificates
#   are renewed periodically"; the certificate "does not single-handedly
#   grant access privileges".
# - CISA, Zero Trust Maturity Model, version 2.0, April 2023 (the PDF, read
#   as text): the pillars "Identity, Devices, Networks, Applications and
#   Workloads, and Data"; the stages Traditional, Initial, Advanced,
#   Optimal. CISA's page for it is marked "Archived Content".
# - nginx's ngx_http_ssl_module page: ssl_verify_client on | off | optional
#   | optional_no_ca; optional "requests the client certificate and
#   verifies it if the certificate is present"; optional_no_ca "does not
#   require it to be signed by a trusted CA certificate"; $ssl_client_verify
#   is SUCCESS, FAILED:reason or NONE.
# - oauth2-proxy's nginx guide
#   (oauth2-proxy.github.io/oauth2-proxy/configuration/integrations/nginx):
#   "if you enabled --cookie-refresh, this is needed for it to work with
#   auth_request", for the auth_request_set line that passes Set-Cookie on.
# - Microsoft Learn, "Continuous access evaluation in Microsoft Entra"
#   (ms.date 2026-04-08): access tokens "valid for one hour" by default;
#   the critical events; "latency of up to 15 minutes might be observed";
#   "up to 28 hours" in CAE sessions; changes to policies and group
#   membership "could take up to one day to be effective". "Learn about
#   Microsoft Entra Private Access" (ms.date 2026-03-12): "Remote workers
#   don't need to use a VPN ... if they have the Global Secure Access
#   Client installed"; Quick Access and per-app access, each with a private
#   network connector, under Conditional Access. Its licensing page was not
#   opened, so the lesson gives no Entra price.
# - AWS: "What is AWS Verified Access?" ("without requiring the use of a
#   virtual private network (VPN)"; "evaluates each application request";
#   "charged hourly for each application ... and for the amount of data
#   processed"); its pricing page's examples for US East (Ohio): $0.27 an
#   application-hour for the first 148,800 hours, then $0.20, and $0.02 a
#   GB. "Security group rules" (VPC user guide): "You can specify allow
#   rules, but not deny rules"; a new group has no inbound rules and one
#   outbound rule that allows everything; a rule's source may be a
#   security group. "Verified Access policies" (auth-policies.html): "They are
#   written in Cedar"; "all access requests will be blocked until you
#   define a policy".
# - Google Cloud: the IAP overview ("without requiring a VPN"; the role
#   "IAP-secured Web App User"; users who can reach "the
#   application-serving port of the Virtual Machine (VM) can bypass IAP
#   authentication"; signed headers); the VPC firewall rules page ("A
#   network tag is an arbitrary attribute"; service accounts recommended
#   for strict control; the implied deny-ingress and allow-egress rules).
#   IAP's pricing page did not render, so no price is given.
# - Microsoft, "Application security groups" (the page's source in
#   MicrosoftDocs/azure-docs, ms.date 2025-07-25): "the AllowVNetInBound
#   default security rule allows all communication between resources in
#   the same virtual network", and the example's Deny-Database-All rule.
# Tried in this topic's labs on the identity base (Keycloak 26.8.2,
# oauth2-proxy 7.15.6, nginx 1.24, strongSwan 5.9), 2026-11-23: every
# message, log line and refusal the lesson, the items and the labs show.
# The base's scripted browser carries a sign-in through oauth2-proxy
# unchanged; the session cookie is one cookie of about 3.3 kB, so nothing
# splits and no Redis is needed; a refresh against a switched-off person is
# refused ("invalid_grant" "User disabled") and the session cleared; with
# the realm rotating refresh tokens, a proxy that doesn't pass the new
# cookie on signs people out at their second refresh.
