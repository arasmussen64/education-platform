skills:
  - id: zt-model
    description: "NIST SP 800-207's definition (least-privilege decisions for each request, no trust from network location, a network assumed compromised) and its seven tenets in plain words; the implicit trust zone and why the checkpoint moves close to the resource; the policy engine, the policy administrator and the policy enforcement point, and which part of a real system plays each; the trust algorithm, alone or in context; the resource portal and agent deployment models; that zero trust is a design and not a product"
  - id: access-proxy
    description: "An access proxy as the enforcement point for web apps: nginx's auth_request with oauth2-proxy's /oauth2/auth and its three answers (202, 401, 403), a group for each app, the redirect to sign in; a policy on every location; the user's name passed to the app in a header, trusted only because nothing else reaches the app; the deciding service reachable only by the enforcing one; what a remote-access VPN grants against what the proxy grants; the clouds' services and what they cost; the move from a VPN in steps"
  - id: device-trust
    description: "The device as part of who is asking: a device certificate from the company's own device CA, verified at the proxy (ssl_verify_client optional, $ssl_client_verify SUCCESS), issued and renewed only while the device is in good standing; managed and unmanaged devices getting different access; why a certificate from anywhere, a header or a MAC address proves nothing; what a local lab's certificate does and doesn't show"
  - id: micro-segmentation
    description: "A firewall on every machine with one rule for each job, default drop in and out; east-west traffic and lateral movement; naming one source and one port, never the subnet; proving segmentation by traffic from every machine and from a new one, and reading a reachability matrix against the design; security groups that name groups, Azure's AllowVNetInBound default, Google Cloud's service accounts against network tags"
  - id: continuous-verification
    description: "Trust re-checked during a session: a refresh against the identity provider, a switched-off person refused at the next one, refresh tokens that rotate and the cookie that must follow; the exposure window as a sum (the re-check interval and a request gap, token lifetimes, certificate lifetimes, caches after the enforcement point); Entra's continuous access evaluation, its 15 minutes and its day for group changes"
