id: est-exposure-refresh
type: estimate
rev: 1
prompt: |
  An access proxy asks the identity provider about a session again once the session is 300 seconds past its last refresh. A person's account is switched off just after one of those refreshes. Their browser sends a request every 10 seconds.

  At most how many seconds after the account was switched off is their first request refused? Exactly.
unit: seconds
answer: 310
tolerance: { absolute: 0 }
given: { refresh: 300, every: 10 }
working: refresh + every
mistakes:
  - id: interval-only
    value: 300
    working: refresh
    why: "The proxy only asks again when a request arrives after the 300 seconds are up. A request that lands just before then is still served, and the next one comes 10 seconds later."
  - id: next-request
    value: 10
    working: every
    why: "That would be true if the proxy asked the identity provider on every request. It asks only when the session is 300 seconds past its last refresh."
explanation: |
  Until the session is 300 seconds old the proxy doesn't ask, so every request in that time is served from the cookie alone. In the worst case a request lands just before the 300 seconds are up and is served; the next arrives 10 seconds later, finds the session due, and the refresh fails. 300 + 10 = 310 seconds.

  That number is the **exposure window**: how long access outlives trust. It is set by the refresh interval, and you choose the interval. Halve it and the window halves, and the identity provider gets twice the refresh traffic.
skills: [continuous-verification]
