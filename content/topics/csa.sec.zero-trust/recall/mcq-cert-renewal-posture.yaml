id: mcq-cert-renewal-posture
type: mcq
rev: 1
prompt: |
  Google's BeyondCorp design gives a device a certificate only while the device is "present and correct" in the company's device inventory, and makes devices renew their certificates periodically, with the same check each time. What does the short lifetime buy?
choices:
  - "A certificate that is stolen can no longer be copied on to another device"
  - "People on managed devices no longer have to sign in with a password"
  - "A device that stops being healthy loses access when its renewal is refused"
  - "The proxy no longer needs to verify which CA signed a certificate"
answer: 2
explanation: |
  A certificate says "the company issued this to a device that was in good standing on the day". The shorter its life, the more recently that was true. A laptop that is reported lost, falls behind on patches or leaves the inventory isn't chased down: its next renewal is refused, its certificate runs out, and the proxy stops seeing `SUCCESS`.

  This is how device posture reaches a proxy that can't inspect the device itself. The lifetime is the exposure window for devices, as the refresh interval is for people. Nothing here stops copying (hardware-kept keys do that), and the certificate "does not single-handedly grant access": the person still signs in.
skills: [device-trust]
