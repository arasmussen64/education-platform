id: mcq-implicit-trust
type: mcq
rev: 1
prompt: |
  NIST pictures an airport: every passenger passes the security checkpoint, and after it everyone mills about the boarding area together. In that picture, which part is the implicit trust zone?
choices:
  - "The boarding area, where everyone who got through is treated alike"
  - "The checkpoint itself, where each passenger is examined and let through"
  - "The whole airport, from the car park at the door to the runway"
  - "The aircraft, which only passengers holding a ticket may board"
answer: 0
explanation: |
  The implicit trust zone is the area behind the last checkpoint, where nobody is asked anything more: everyone there is trusted as much as the checkpoint trusted them. The checkpoint is where the decision is made and enforced; it can't apply any rule beyond the place where it stands.

  A VPN makes a whole network into a boarding area: one check at the gateway, then every machine and every port. Zero trust shrinks the zone, by moving the checkpoint as close to each resource as it will go, until being past one checkpoint gets you one app and nothing else.
skills: [zt-model]
