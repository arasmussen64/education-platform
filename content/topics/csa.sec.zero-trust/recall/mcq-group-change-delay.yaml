id: mcq-group-change-delay
type: mcq
rev: 1
prompt: |
  In Microsoft Entra, an admin removes a person from the group that a Conditional Access policy applies to. Continuous access evaluation is on. How soon is that change in force at SharePoint Online, by Microsoft's own documentation?
choices:
  - "Within 15 minutes, as for every other event"
  - "At once: group membership is read on every request"
  - "It can take up to a day, unless their sessions are revoked"
  - "Never, until the person signs out of every app and signs in again"
answer: 2
explanation: |
  Microsoft's page on continuous access evaluation lists this as a limitation: changes to Conditional Access policies and to group membership "could take up to one day to be effective", because they replicate from the identity provider to the services (read 2026-11-23; ms.date 2026-04-08). The near-real-time path, with its delay of up to 15 minutes, is for a short list of critical events: an account deleted or disabled, a password changed, sessions revoked, high user risk.

  So the fast lever is to revoke the person's sessions, which is one of those events. Knowing which changes travel fast and which travel slowly is part of knowing your exposure window.
skills: [continuous-verification]
