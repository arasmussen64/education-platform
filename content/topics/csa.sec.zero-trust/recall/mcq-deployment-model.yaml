id: mcq-deployment-model
type: mcq
rev: 1
prompt: |
  A company puts one access proxy in front of several internal web apps. Staff use any browser; nothing is installed on their laptops. Which of NIST's deployment models is that, and what is its known weakness?
choices:
  - "Device agent and gateway: each laptop must have the agent before it can connect"
  - "Resource portal: it learns about a device only when that device connects"
  - "Enclave gateway: the apps behind the gateway can't be told apart by policy"
  - "Application sandboxing: only programs the company has vetted may call the apps"
answer: 1
explanation: |
  One gateway that everyone reaches with an ordinary browser is the resource portal model. It is the easiest to roll out, since nothing goes on the laptop, and that is also its limit: with no agent on the device, the portal can only judge what the device shows it at the moment it connects (a certificate, say). It can't watch the device's health between requests. NIST adds that a portal anyone can reach can also be found and attacked by anyone.

  The agent models put software on every laptop, which reports on the device continuously and can carry non-web traffic too. That is the trade the clouds' products make differently.
skills: [zt-model]
