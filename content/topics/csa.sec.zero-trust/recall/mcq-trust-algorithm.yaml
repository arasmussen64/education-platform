id: mcq-trust-algorithm
type: mcq
rev: 1
prompt: |
  An HR clerk's account normally opens 20 to 30 employee records in a working day. Tonight at 02:00 it opens 100 in ten minutes. Every one of those requests, taken alone, is allowed: the right group, a shop laptop, a valid session. What kind of decision-making notices?
choices:
  - "One that weighs each request against what that account has done before"
  - "One that checks each request against a fixed list of conditions"
  - "One that asks for the password again at the start of every single session"
  - "One that gives each device a certificate that runs out after a day"
answer: 0
explanation: |
  NIST calls the logic behind a decision the trust algorithm, and sorts it two ways. A singular one judges each request by itself; a contextual one also looks at the history: how many records this account usually opens, at what hours, from where. The numbers here are NIST's own example.

  A stolen session or a dishonest insider passes every fixed condition, because the conditions were written for the honest version of the same person. Only context shows that something changed. The proxy in this topic's labs is singular: group and device, per request. Its logs are what a contextual check would be built from.
skills: [zt-model]
