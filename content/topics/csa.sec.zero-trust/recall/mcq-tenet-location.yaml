id: mcq-tenet-location
type: mcq
rev: 1
prompt: |
  A design review says: "The reporting database needs no sign-in of its own. It is safe, because only machines on the internal network can reach it." Which idea of zero trust does that break?
choices:
  - "Where a request comes from on the network proves nothing about it"
  - "Every data source and service counts as a resource to protect"
  - "The enterprise collects what it can about the state of its assets"
  - "Access to a resource is granted for one session at a time"
answer: 0
explanation: |
  NIST's second tenet: all communication is secured regardless of network location, and "network location alone does not imply trust". A request from inside must meet the same requirements as one from a hotel's wifi.

  "Only internal machines can reach it" is true until one internal machine is taken over: a laptop with malware on the VPN, a web server with an old plugin, a test machine somebody plugged in. From then on the attacker is "internal" too, and the database asks them nothing. The other three are tenets as well, but the review breaks none of them.
skills: [zt-model]
