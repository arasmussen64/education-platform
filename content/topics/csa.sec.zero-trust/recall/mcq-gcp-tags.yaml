id: mcq-gcp-tags
type: mcq
rev: 1
prompt: |
  A Google Cloud firewall rule can pick the VMs it applies to by network tag (a label such as `db`) or by the service account the VM runs as. For strict control Google recommends service accounts. Why?
choices:
  - "Anyone who can edit a VM can change its tags, and so its rules"
  - "Tags work only for IPv4 traffic, and service accounts for both"
  - "A rule that uses tags can allow traffic and can never deny it"
  - "A VM can carry one tag only, and many service accounts"
answer: 0
explanation: |
  Google's documentation calls a network tag "an arbitrary attribute", and notes that anyone allowed to edit an instance can change its tags (read 2026-11-23). Put the tag `db-client` on your own VM and the database's firewall rule now welcomes it. A VM's service account is an identity: changing it takes a separate permission on that account, and the VM must be stopped.

  It is this topic's question again, asked of a firewall: is the rule keyed to something the machine can claim, or to an identity someone had to grant?
skills: [micro-segmentation]
