id: mcq-vpn-or-ztna
type: mcq
rev: 1
prompt: |
  What does a remote-access VPN give a connected laptop that an access proxy does not?
choices:
  - "Encryption of everything the laptop sends across the public internet"
  - "A check of who the user is before anything is let through"
  - "A path onto the network, and with it every port it can reach there"
  - "A way to open the company's internal web apps from home"
answer: 2
explanation: |
  Both encrypt, both check who you are first, and both get you to the internal web apps. The difference is what the check buys. The VPN's check buys a place on the network: after it, the laptop can send packets to every machine and port the gateway forwards to, and so can any program running on it. The proxy's check buys one request to one app, and the next request is checked again.

  That is why a stolen VPN password is the whole network, and a stolen proxy session is one person's apps until the next refresh.
skills: [access-proxy]
