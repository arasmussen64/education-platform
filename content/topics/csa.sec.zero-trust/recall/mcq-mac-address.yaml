id: mcq-mac-address
type: mcq
rev: 1
prompt: |
  A switch lets a machine on to the office network only if its MAC address is on the list of company devices. NIST's zero-trust guidance says not to tell company devices apart this way. Why?
choices:
  - "A MAC address changes every time the machine is restarted or moved to another port"
  - "A MAC address is encrypted on the wire, so the switch can't read it"
  - "A MAC address is a claim the machine makes, and any machine can make it"
  - "A MAC address is shared by every machine on the same switch"
answer: 2
explanation: |
  A network card announces its MAC address in every frame, and the operating system can set it to anything: copying a listed address takes one command. NIST's wording is that managed devices are recognised by "enterprise-issued credentials" and not by "information that cannot be authenticated (e.g., network MAC addresses that can be spoofed)".

  It is the same fault as a compliance header: the check believes what the device says about itself. A credential differs in kind. The device proves it holds a secret (a private key) without revealing it, and nobody can copy that off the wire.
skills: [device-trust]
