id: typed-policy-engine
type: typed
rev: 1
prompt: |
  NIST splits the deciding side of a zero-trust design into two parts. One makes the decision to grant or refuse access to a resource, and logs it; the other carries the decision out by opening or shutting the path. Name the first part: two words.
kind: text
answers:
  - policy engine
  - PE
mistakes:
  - id: administrator
    answers: [policy administrator, PA]
    why: "That is the other part: it carries the decision out, telling the enforcement point to open the path or shut it."
  - id: enforcement
    answers: [policy enforcement point, PEP]
    why: "That is the part in the traffic's path, which lets a request through or stops it. It doesn't decide."
  - id: decision-point
    answers: [policy decision point, PDP]
    why: "That is the name for the two parts together. The one that makes and logs the decision has a name of its own."
explanation: |
  The policy engine. It takes what is known (who is asking, from which device, for what, and whatever the logs and the device inventory add) and grants, refuses or takes back access. The policy administrator turns that into a path that exists or doesn't. Together they are the policy decision point; the policy enforcement point is the gate in the traffic's path.

  Many products run the two as one service. The split still tells you where to look: a wrong decision is a policy fault, and a right decision that wasn't carried out is a plumbing fault.
skills: [zt-model]
