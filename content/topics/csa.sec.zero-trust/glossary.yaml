# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# Not here: "policy decision point" and "policy enforcement point" are
# Authentication and authorization's; "conditional access" and "break-glass
# account" are Strong authentication's; "site-to-site VPN" is VPNs and
# IPsec's; "workload identity" is Authentication and authorization's.
- term: zero trust
  aliases: [zero trust architecture]
  definition: Designing access so that nothing is trusted for where it is on the network. Each request is decided by who is asking, from which device, for which resource, and granted the least it needs.
- term: implicit trust zone
  definition: The area behind the last checkpoint, where everything is trusted alike and nothing more is asked. A VPN makes a whole network one; zero trust shrinks it to a single app.
- term: policy engine
  definition: The part of a zero-trust design that makes and logs each decision to grant or refuse access, from the policy and what is known about the person, the device and the request.
- term: policy administrator
  definition: The part of a zero-trust design that carries a decision out, telling the enforcement point to open a path or shut it. Often one service with the policy engine.
- term: access proxy
  aliases: [identity-aware proxy]
  definition: A reverse proxy in front of internal apps that asks who is signed in, and whether they may, before passing each request on. The enforcement point for web apps.
- term: zero trust network access
  aliases: [ZTNA]
  definition: Reaching private apps through a proxy or agent that decides each app and request separately, in place of a VPN that puts the device on the whole network.
- term: remote-access VPN
  definition: A VPN tunnel from one person's device to a company gateway. After one check at the gateway, the device reaches whatever the gateway forwards to, as if it were in the office.
- term: managed device
  definition: A device the company enrols in a device-management service, which records its state and can configure it. A person's own device is unmanaged.
- term: device posture
  definition: The facts about a device that bear on trusting it, such as whether the company manages it, its patch level and whether its disk is encrypted.
- term: device certificate
  definition: A client certificate the company's own device CA issues to a device it manages. The device proves it holds the private key in the TLS handshake, which a claim in a header can't do.
- term: micro-segmentation
  definition: Splitting a network down to single services, each machine with its own firewall that allows only the connections its job needs, in and out, and drops the rest.
- term: lateral movement
  definition: An attacker moving from the first machine they took over to others on the same network, which a flat internal network does nothing to stop.
- term: east-west traffic
  definition: Traffic between machines inside a data centre or network, as against north-south traffic in and out of it. A perimeter firewall never sees it.
- term: continuous verification
  definition: Re-checking a person's and a device's standing during a session, not only at sign-in, so that access ends soon after the reason for it does.
- term: exposure window
  definition: How long access can outlive trust, such as the time between an account being switched off and its last request being served. Set by re-check intervals, token lifetimes and caches.
