# nginx's site on zt: the half of the access proxy that enforces. It sits
# in the path of every request, and lets one through only when
# oauth2-proxy, the half that decides, says so.
server {
    # zt's internet-facing address only. HTTPS, with the certificate the
    # shop's CA issued for apps.shop.test.
    listen 203.0.113.80:443 ssl;
    server_name apps.shop.test;
    ssl_certificate /etc/tls/apps.shop.test.crt;
    ssl_certificate_key /etc/tls/apps.shop.test.key;

    # Sign-in (/oauth2/start), the identity provider's way back
    # (/oauth2/callback) and sign-out are oauth2-proxy's own pages, so
    # nginx hands them over as they are.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The question nginx asks before it lets a request through: "is this
    # browser signed in, and is the person in the group staff?" Only nginx
    # itself can ask it (internal). oauth2-proxy gets the request's headers,
    # cookie included, and no body.
    location = /decide/staff {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth?allowed_groups=staff;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Where a browser with no session is sent: to sign in, and then back to
    # the page it asked for.
    location @sign_in {
        return 302 /oauth2/start?rd=$request_uri;
    }

    # The wiki.
    location /wiki/ {
        # Ask first. 202 from oauth2-proxy lets the request through, 401
        # means "not signed in" and 403 "signed in, and not allowed".
        auth_request /decide/staff;
        error_page 401 = @sign_in;

        # oauth2-proxy's answer names the person; tell the wiki, in place
        # of anything the browser sent in X-User.
        auth_request_set $user $upstream_http_x_auth_request_preferred_username;
        proxy_set_header X-User $user;

        # When oauth2-proxy has refreshed the session, its answer carries a
        # new cookie. Pass it on to the browser.
        auth_request_set $new_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $new_cookie always;

        proxy_pass http://10.20.0.10:8080/;
    }
}
