# oauth2-proxy on zt: the half of the access proxy that decides. It signs
# people in at the identity provider (it is an OpenID Connect client, like
# the orders site in "SAML, OAuth 2.0 and OIDC") and answers nginx's
# question "who is this, and are they in this group?".

# Listen on zt's own loopback only: nothing but nginx on zt can reach it.
http_address = "127.0.0.1:4180"
# It sits behind nginx, and believes what nginx (and only a proxy on this
# machine) says in its headers about the request.
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1"]

# The identity provider, and this proxy's registration there.
provider = "oidc"
oidc_issuer_url = "https://login.shop.test/realms/shop"
client_id = "access-proxy"
client_secret_file = "/etc/oauth2-proxy/client-secret"
redirect_url = "https://apps.shop.test/oauth2/callback"
code_challenge_method = "S256"
# Anyone the identity provider signs in may have a session; which pages
# they get is decided per request, by group.
email_domains = ["*"]
oidc_groups_claim = "groups"

# The session lives in an encrypted cookie in the browser.
cookie_secret_file = "/etc/oauth2-proxy/cookie-secret"
cookie_secure = true
# Once a session is 5 seconds old, ask the identity provider again (with
# the session's refresh token) whether it still stands. 5 seconds is the
# lab's fast clock: a real proxy would say a few minutes.
cookie_refresh = "5s"

# Go straight to the identity provider, with no "sign in" button first.
skip_provider_button = true
# Put the person's name and groups in the answer's headers, for nginx.
set_xauthrequest = true
# oauth2-proxy passes nothing on itself: it only answers 202, 401 or 403.
upstreams = ["static://202"]
