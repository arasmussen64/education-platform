# The shop's remote-access VPN, the gateway's side. A laptop that knows the
# shared secret gets a tunnel, and through it the whole apps network:
# local_ts is 10.20.0.0/24, every port.
connections {
  staff {
    version = 2
    local_addrs = 203.0.113.2
    proposals = aes256-sha256-modp2048
    local {
      auth = psk
      id = vpn.shop.test
    }
    remote {
      auth = psk
    }
    children {
      apps {
        local_ts = 10.20.0.0/24
        remote_ts = dynamic
        mode = tunnel
        esp_proposals = aes256gcm16-modp2048
        start_action = none
      }
    }
  }
}
secrets {
  ike-staff {
    secret = "@VPN_SECRET@"
  }
}
