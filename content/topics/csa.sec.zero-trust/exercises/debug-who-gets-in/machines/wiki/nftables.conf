#!/usr/sbin/nft -f
# wiki: the access proxy may reach the wiki's port. Nothing else comes in,
# and the wiki starts no connections of its own.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    iifname "lo" accept
    ip saddr 10.20.0.2 tcp dport 8080 accept
  }
  chain output {
    type filter hook output priority filter; policy drop;
    ct state established,related accept
    oifname "lo" accept
  }
}
