#!/usr/sbin/nft -f
# vpngw: the VPN gateway's firewall. It forwards into the apps network
# only what came out of a VPN tunnel, and the answers.
flush ruleset

table inet filter {
  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    iifname "wan" oifname "lan" meta ipsec exists accept
  }
}
