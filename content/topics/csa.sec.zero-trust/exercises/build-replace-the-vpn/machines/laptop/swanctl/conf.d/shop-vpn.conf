# The VPN client on this laptop. It starts the tunnel at boot and keeps
# trying. The shared secret was saved here when the laptop was set up.
connections {
  shop-vpn {
    version = 2
    local_addrs = 203.0.113.10
    remote_addrs = 203.0.113.2
    proposals = aes256-sha256-modp2048
    keyingtries = 0
    dpd_delay = 10s
    local {
      auth = psk
      id = laptop.shop.test
    }
    remote {
      auth = psk
      id = vpn.shop.test
    }
    children {
      apps {
        local_ts = dynamic
        remote_ts = 10.20.0.0/24
        mode = tunnel
        esp_proposals = aes256gcm16-modp2048
        start_action = start
        dpd_action = restart
      }
    }
  }
}
secrets {
  ike-shop-vpn {
    secret = "@VPN_SECRET@"
  }
}
