# The checks for "Write reach-matrix": the script is there, runs, and
# ShellCheck is quiet about it (run with --norc, and no warning may be
# switched off in the script); then it is tried on machines the check
# builds for the purpose (reach-cases, in /usr/local/lib/lab/), at
# addresses and on ports picked when the check runs, in a random order. The
# lab's own apps are for trying the script out; knowing their ports passes
# nothing here.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: script-ready
    description: "~/bin/reach-matrix exists, is executable, starts with a shebang line, and ShellCheck has nothing to say about it, with no warning switched off."
    command: |
      f=/home/learner/bin/reach-matrix
      [ -f "$f" ] || { echo "there is no ~/bin/reach-matrix"; exit 0; }
      [ -x "$f" ] || { echo "~/bin/reach-matrix isn't executable (chmod +x)"; exit 0; }
      head -n 1 "$f" | grep '^#!' > /dev/null || { echo "~/bin/reach-matrix doesn't start with a shebang line"; exit 0; }
      if grep -E 'shellcheck[[:space:]]+disable' "$f" > /dev/null; then echo "~/bin/reach-matrix switches a ShellCheck warning off"; exit 0; fi
      said=$(shellcheck --norc "$f" 2>&1) || { echo "ShellCheck has something to say (run shellcheck ~/bin/reach-matrix): $(echo "$said" | grep -m 1 -o 'SC[0-9].*')"; exit 0; }
      echo ready
    expect:
      equals: ready
  - id: a-made-up-network
    description: "For fifteen connections between machines the check adds to the network, it prints one line each, in the file's order, with open, refused or dropped as each connection behaves."
    command: /usr/local/lib/lab/reach-cases
    timeout: 60
    expect:
      equals: right
  - id: another-made-up-network
    description: "The same for a second set of machines, at other addresses and ports, in another order."
    command: /usr/local/lib/lab/reach-cases
    timeout: 60
    expect:
      equals: right
  - id: all-at-once
    description: "It tries the connections at the same time: fifteen of them, six dropped, are answered within 7 seconds."
    command: /usr/local/lib/lab/reach-cases --timed
    timeout: 60
    expect:
      equals: right
