#!/usr/sbin/nft -f
# payroll: the access proxy may reach payroll's port, and payroll may reach
# its database. Nothing else comes in or goes out.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    iifname "lo" accept
    ip saddr 10.20.0.2 tcp dport 8081 accept
  }
  chain output {
    type filter hook output priority filter; policy drop;
    ct state established,related accept
    oifname "lo" accept
    ip daddr 10.20.0.12 tcp dport 5432 accept
  }
}
