# oauth2-proxy on zt: it signs people in at the identity provider and
# answers nginx's question "who is this, and are they in this group?".
http_address = "127.0.0.1:4180"
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1"]
provider = "oidc"
oidc_issuer_url = "https://login.shop.test/realms/shop"
client_id = "access-proxy"
client_secret_file = "/etc/oauth2-proxy/client-secret"
redirect_url = "https://apps.shop.test/oauth2/callback"
code_challenge_method = "S256"
email_domains = ["*"]
oidc_groups_claim = "groups"
cookie_secret_file = "/etc/oauth2-proxy/cookie-secret"
cookie_secure = true
# Gap 6. Ask the identity provider again once a session is this old: a
# number and a unit, such as "90s" or "2m".
cookie_refresh = "___"
skip_provider_button = true
set_xauthrequest = true
upstreams = ["static://202"]
