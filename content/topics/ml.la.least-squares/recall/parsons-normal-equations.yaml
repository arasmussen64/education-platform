id: parsons-normal-equations
type: parsons
rev: 2
prompt: |
  Put the lines in order to fit a line through `(0, 1)`, `(1, 3)`, `(2, 5)` with the normal equations, printing the slope and intercept `[2. 1.]`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'points = np.array([[0.0, 1.0], [1.0, 3.0], [2.0, 5.0]])'
  - 'A = np.column_stack([points[:, 0], np.ones(3)])'
  - 'coef = np.linalg.solve(A.T @ A, A.T @ points[:, 1])'
  - 'print(coef)'
distractors:
  - 'coef = np.linalg.solve(A, points[:, 1])'
explanation: |
  Each row of `points` is one point, so `points[:, 0]` is the x values and `points[:, 1]` the y values. `A` has three rows and two columns: three equations, two unknowns. `solve` needs a square matrix, so the decoy fails. Multiplying both sides by `A.T` gives the normal equations, which are square (2 by 2) and give the best fit, here the exact line `y = 2x + 1`.
skills: [design, normal]
