id: mcq-control-fit
type: mcq
rev: 1
prompt: |
  The threat: an attacker on the internet can post forged delivery reports to the shop's hook, and the shop acts on them. The hook is already served over HTTPS. Which control answers this threat?
choices:
  - "Serve the hook only over TLS 1.3, with the strongest cipher suites"
  - "Encrypt the stored delivery reports with a key kept in a key service"
  - "Log every report with its time and the address that it came from"
  - "Check each report's signature with the secret shared with the sender"
answer: 3
explanation: |
  A forged report is **spoofing**: the caller isn't who it claims to be. The control has to restore authentication, and checking a signature made with a secret that only the shop and the real sender hold does that: a report the sender didn't sign is refused.

  Stronger TLS changes nothing, because TLS on the hook proves the *shop* to the caller and hides the traffic. The attacker's forged report arrives over perfectly good TLS. Encrypting stored reports answers information disclosure, a different property. Logging answers repudiation: it records the forged report, and the shop still acts on it. Each of the three is a good thing to have, and none of them answers this threat.
skills: [respond-to-risk]
