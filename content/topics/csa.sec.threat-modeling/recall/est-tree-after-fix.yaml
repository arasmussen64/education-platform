id: est-tree-after-fix
type: estimate
rev: 1
prompt: |
  An attack tree for "send a parcel to another address" has three ways under its goal, any one of which is enough. Sign in as a driver, which takes two steps, both needed: a phishing page, $150, and using the password within the hour, $20. Or steal a driver's unlocked phone: $400. Or bribe a dispatcher: $900. The company adds a second factor, so signing in as a driver now needs a third step as well: getting the code from the driver's phone, $600. What does the cheapest attack cost after the change, in dollars? Exactly.
unit: "US dollars"
answer: 400
tolerance: { absolute: 0 }
amounts: made-up
given: { page: 150, use: 20, phone: 400, bribe: 900, code: 600 }
working: min(page + use + code, phone, bribe)
mistakes:
  - id: the-fixed-path
    value: 770
    working: page + use + code
    why: "That is the new cost of signing in as a driver. It is no longer the cheapest way: stealing an unlocked phone costs less."
  - id: before-the-fix
    value: 170
    working: page + use
    why: "That was the cheapest attack before the change. The sign-in now needs the code as well."
explanation: |
  Before the change the sign-in path cost $150 + $20 = $170, the cheapest of $170, $400 and $900. The second factor adds a step to that path: $170 + $600 = $770. The goal still takes the cheapest way, and that is now the unlocked phone, at $400.

  So the control raised the attacker's cost from $170 to $400, not to $770. A countermeasure moves the cheapest path somewhere else, and the tree shows where: the next thing to look at is what an unlocked phone can do.
skills: [attack-trees]
