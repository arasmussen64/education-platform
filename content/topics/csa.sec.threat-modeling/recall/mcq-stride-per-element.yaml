id: mcq-stride-per-element
type: mcq
rev: 1
prompt: |
  Microsoft's STRIDE-per-element mapping says which categories apply to which kind of element in a data-flow diagram. Which category applies to a process and to no other kind of element?
choices:
  - "Spoofing: only a process can pretend to be something that it is not"
  - "Repudiation: only a process can take an action and then deny it"
  - "Denial of service: only a process can be overwhelmed by requests"
  - "Elevation of privilege: only a process has rights to exceed"
answer: 3
explanation: |
  Elevation of privilege is doing more than your rights allow, and only something that *acts with rights* can be made to do that: a process. A store, a flow and an external entity don't run your code with your permissions.

  The other three reach further. Spoofing applies to processes and to external entities (a person or a partner's system can be impersonated). Repudiation applies to processes, external entities and data stores. Denial of service applies to processes, data stores and data flows: a database can be filled and a link can be flooded.

  The whole mapping: external entity S and R; process all six; data store T, R, I and D; data flow T, I and D.
skills: [stride]
