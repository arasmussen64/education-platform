id: typed-stride-letter-logs
type: typed
rev: 1
prompt: |
  An administrator deletes a customer's orders from the database. The database keeps no record of who ran the statement, so afterwards nobody can show which administrator it was. Which STRIDE category is this threat? Give the category's name.
kind: text
answers:
  - repudiation
  - R
mistakes:
  - id: tampering
    answers: [tampering, T]
    why: "The administrator's rights allow the delete, so nothing was changed without permission. The threat is that the action can't be tied to anyone afterwards."
  - id: the-property
    answers: [non-repudiation, nonrepudiation, accountability]
    why: "That is the property this threat breaks. The category is named for the breaking of it."
  - id: elevation
    answers: [elevation of privilege, E]
    why: "The administrator used rights they really have. Elevation of privilege is doing more than your rights allow."
explanation: |
  **Repudiation**: someone takes an action and can deny it, because nothing ties the action to them. The property it breaks is non-repudiation, and the control is a record that can be trusted: who did what, when, kept where the person who did it can't edit it. Audit logging, later in this module, builds that record.
skills: [stride]
