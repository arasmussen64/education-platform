id: mcq-threat-statement
type: mcq
rev: 1
prompt: |
  Four people each write down one threat to the shop's invoice API. Which is written so that a team can rate it and decide what to do about it?
choices:
  - "Hackers could attack the invoice API in many ways and steal customers' data from the shop's systems"
  - "The invoice API is insecure and needs better authentication before the next release goes out"
  - "An attacker with a customer's order number can download that order's invoice, exposing the address"
  - "Spoofing, tampering and information disclosure all apply to the invoice flow of the order API"
answer: 2
explanation: |
  A threat a team can use says **who** can do **what**, with what they need first, and what it leads to: an attacker (who) holding a customer's order number (what they need) can download that order's invoice (what), exposing the address (what it leads to). From that sentence you can rate the likelihood (how hard is an order number to get?), rate the impact (one customer's address), and see the control (check that the invoice belongs to the signed-in customer).

  "Hackers could attack in many ways" names no action, so there is nothing to rate or to stop. "Is insecure and needs better authentication" is a verdict and a fix with no threat between them: better than what, against whom? A list of category names says where to look, not what was found.
skills: [stride]
