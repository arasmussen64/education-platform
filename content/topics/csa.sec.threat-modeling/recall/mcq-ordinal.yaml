id: mcq-ordinal
type: mcq
rev: 1
prompt: |
  A model rates likelihood and impact on scales of 1 to 3. A risk of 6 or more is high: it goes on the top line and must get a control. Two threats both score 6: one is likelihood 3 and impact 2, the other likelihood 2 and impact 3. Which conclusion do the two scores **not** support?
choices:
  - "That both threats belong on the model's top line"
  - "That both need a control and can't simply be accepted"
  - "That the two threats matter equally to the business"
  - "That each rating was a rank picked from a stated scale"
answer: 2
explanation: |
  The scales are **ordinal**: a 3 is more than a 2, and nobody said how much more. Multiplying ranks gives a number that sorts threats into bands, and that is all it does. A near-certain nuisance and a rarer disaster can share a 6, and which matters more is a judgement the matrix can't make for you. The score also leaves out what each would cost to fix.

  The other three do follow, from the model's own rules: both scores are 6, so both are high, both go on the top line, and neither may be accepted. And every rating is one of three ranks on a scale the design wrote down.
skills: [rank-risks]
