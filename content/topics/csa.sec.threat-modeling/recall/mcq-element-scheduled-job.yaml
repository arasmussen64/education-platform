id: mcq-element-scheduled-job
type: mcq
rev: 1
prompt: |
  Every night a scheduled job reads the orders database, works out the day's totals and writes them to a report file in a shared folder, where the accountants open it in the morning. In a data-flow diagram, what are the job and the report file?
choices:
  - "The job is a process and the file is a data store"
  - "The job is a data flow and the file is a data store"
  - "The job is a process and the file is a data flow"
  - "The job is an external entity and the file is a process"
answer: 0
explanation: |
  The job reads, works something out and writes: it **changes or decides** something, which makes it a process, however rarely it runs. The file **keeps** the totals until the accountants ask for them: a data store, like a database, a queue or a bucket.

  The data flows here are the three movements: the job reading the database, the job writing the file, and the accountants reading the file. A flow moves data and holds nothing afterwards. An external entity is something outside your control, which the accountants are and your own job is not.
skills: [draw-the-system]
