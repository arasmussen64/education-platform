id: mcq-four-responses
type: mcq
rev: 1
prompt: |
  A clinic's nightly export file sat in a bucket whose link anyone could open. The clinic stops making the export, and gives its accountants a read-only report page behind the staff sign-in. Which of the four responses to the "open link" risk is that?
choices:
  - "Mitigate: a control makes the same risk less likely"
  - "Eliminate: the feature that carried the risk is gone for good"
  - "Transfer: the accountants now carry the risk instead"
  - "Accept: the clinic lives with the risk, with a reason"
answer: 1
explanation: |
  **Eliminate** removes the thing the threat needs: with no export file and no bucket link, there is nothing to open. It is the strongest response when the feature can go, or can be replaced by something that doesn't carry the risk.

  Mitigating would keep the export and add a control, such as a sign-in on the bucket. Transferring moves who pays, by insurance or a contract, and changes neither how likely nor how bad it is. Accepting means doing nothing, on purpose, with a written reason, and is for low risks. The new report page has risks of its own, which the model now has to review: every response changes the system, so the first question is asked again.
skills: [respond-to-risk]
