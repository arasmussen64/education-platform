id: est-residual
type: estimate
rev: 1
prompt: |
  A model rates on scales of 1 to 3, a risk is likelihood times impact, and 6 or more is high. An open file link is rated likelihood 3 and impact 3. The team makes the link long and random, which they rate as likelihood 2: it now has to be leaked or forwarded first. The impact is unchanged. What is the residual risk? Exactly.
unit: points
answer: 6
tolerance: { absolute: 0 }
given: { l_before: 3, impact: 3, l_after: 2, high: 6 }
working: l_after * impact
mistakes:
  - id: the-fall
    value: 3
    working: l_before * impact - l_after * impact
    why: "That is how far the risk fell. The residual risk is what is left after the control: the new likelihood times the impact."
  - id: added
    value: 5
    working: l_after + impact
    why: "That adds the two ratings. A risk is likelihood times impact."
explanation: |
  The **residual risk** is the risk that remains once the control is in place: 2 x 3 = 6. That is still high. The control helped, from 9 to 6, and didn't finish the job: a random link is still a link that opens for anyone who has it.

  A residual risk that is still high needs another control (here, a sign-in on the files), and the model records both. Asking "what is left?" after every control is how a team avoids ticking a risk off because *something* was done about it.
skills: [respond-to-risk]
