id: mcq-stride-letter-quota
type: mcq
rev: 1
prompt: |
  A signed-in customer uploads 50 GB files through the shop's support form, again and again, until the server's disk is full and the site stops taking orders. Which STRIDE category is this threat?
choices:
  - "Tampering: the server's disk is changed without permission"
  - "Denial of service: the site can no longer serve its customers"
  - "Elevation of privilege: a customer does more than one should"
  - "Information disclosure: the uploads reveal the disk's size"
answer: 1
explanation: |
  The harm is that the site stops working for everyone else: **denial of service**, which breaks availability. Its controls limit how much one caller can use: a quota on upload size and count, a rate limit, and room to grow.

  It isn't tampering: uploading is what the form is for, and no data was changed behind anyone's back. It isn't elevation of privilege: the customer used only the rights a customer has, far too many times. A denial of service doesn't need an outsider or a flood of traffic; a feature with no limit is enough. And nothing was disclosed.
skills: [stride]
