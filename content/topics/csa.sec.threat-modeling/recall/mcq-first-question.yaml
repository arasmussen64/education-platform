id: mcq-first-question
type: mcq
rev: 1
prompt: |
  A team starts a design review by listing attacks on "the new reporting feature". Half an hour in, two of them find they had different systems in mind: one pictured reports emailed to customers, the other a page inside the staff site. Which of threat modeling's four questions did the team skip?
choices:
  - "What are we working on?"
  - "Who is likely to attack us?"
  - "What are we going to do about it?"
  - "Did we do a good enough job?"
answer: 0
explanation: |
  The first question comes first because every later answer depends on it. A threat is something that can go wrong *in a particular system*: which parts it has, who runs each, what flows between them. Two people with two pictures list two sets of threats and can't tell which ones are real. So the review starts by drawing the system, its parts and its flows, and agreeing on the drawing.

  "What are we going to do about it?" and "Did we do a good enough job?" are the third and fourth questions, and both need the list of threats the second one produces. "Who is likely to attack us?" is a fair thing to ask, and some methods start from the attacker, but it isn't one of the four, and knowing the attacker doesn't tell you what you have built.
skills: [draw-the-system]
