id: typed-spoofing-property
type: typed
rev: 1
prompt: |
  Each STRIDE category breaks one security property, and a control only answers a threat if it restores that property. Which property does spoofing break? Name it in one word.
kind: text
answers:
  - authentication
  - authn
mistakes:
  - id: authorization
    answers: [authorization, authz]
    why: "Authorization decides what a known caller may do, and elevation of privilege is the category that breaks it. Spoofing comes before that: it is about who the caller is."
  - id: integrity
    answers: [integrity]
    why: "Integrity is what tampering breaks: data changed without permission. Spoofing is someone pretending to be someone else."
  - id: confidentiality
    answers: [confidentiality]
    why: "Confidentiality is what information disclosure breaks. Spoofing is someone pretending to be someone else, whether or not anything is read."
explanation: |
  **Authentication**: proving who or what someone is. Spoofing is pretending to be someone or something else, so it is answered by whatever proves the real one: a second factor at a sign-in, a signature on a partner's message, a client certificate. That is why "we use HTTPS" doesn't answer a forged message: ordinary TLS proves the server to the caller, and says nothing about who the caller is.

  The six pairs: Spoofing and authentication, Tampering and integrity, Repudiation and non-repudiation, Information disclosure and confidentiality, Denial of service and availability, Elevation of privilege and authorization.
skills: [stride, respond-to-risk]
