id: mcq-element-kind
type: mcq
rev: 1
prompt: |
  The shop's order service writes a message to a queue for each new order. The mailer reads the messages later and sends the emails. The queue is a service the cloud provider runs. In a data-flow diagram, what kind of element is the queue?
choices:
  - "A data flow: it moves messages from one process to another"
  - "A data store: it keeps the messages until a reader asks for them"
  - "A process: it decides which reader gets each message"
  - "An external entity: the cloud provider runs it, not the shop"
answer: 1
explanation: |
  The test for a data store is that it **keeps** something until asked. A queue holds each message until the mailer comes for it, minutes or hours later, so it is a store, the same as a database or a bucket. A data flow has nothing in it once the message has arrived; the two flows here are the order service writing to the queue and the mailer reading from it. A process changes or decides something, and the queue hands messages over as they came.

  Who runs the queue is a different question from what kind of element it is. The shop chose it, configures it and puts its own data in it, so it is part of the shop's system: a store. That the provider operates it is a matter of trust, which the zones show, not the element's kind. An external entity is something outside your control altogether, such as a customer or a partner's system.
skills: [draw-the-system]
