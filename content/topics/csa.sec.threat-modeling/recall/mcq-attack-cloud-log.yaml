id: mcq-attack-cloud-log
type: mcq
rev: 1
prompt: |
  A threat model written in 2025 names ATT&CK technique `T1562.008` for "the attacker turns off the cloud's audit log". A reviewer opens that ID on MITRE's site, which is at version 20.1, and lands on `T1685.002`, Disable or Modify Tools: Disable or Modify Cloud Log. What should the model's author do?
choices:
  - "Keep T1562.008, since an ATT&CK ID never changes its meaning"
  - "Name T1685.002, and say which ATT&CK version the model used"
  - "Drop the technique, since ATT&CK no longer covers cloud logs"
  - "Name both IDs, since each version's IDs stay valid for ever"
answer: 1
explanation: |
  ATT&CK is revised twice a year, and IDs move. Version 19, in April 2026, split the old Defense Evasion tactic into two, Stealth and Defense Impairment, and the technique for switching off cloud logs moved with it: the old address for `T1562.008` now forwards to `T1685.002`. The behaviour is still covered; it has a new number.

  So a model names the technique as the current version has it **and says which version that is**. Then a reader a year later knows where to look, and whether to check for another move. An old ID with no version sends them to a page that may have gone, and two IDs with no version tell them nothing about which one is current.
skills: [attack-and-abuse]
