id: mcq-attack-snapshot
type: mcq
rev: 1
prompt: |
  An attacker with access to a company's cloud account shares a disk snapshot with a cloud account of their own, and copies the data out from there, without a single download leaving the company's network. Which MITRE ATT&CK technique (version 20.1) is that?
choices:
  - "T1530, Data from Cloud Storage"
  - "T1619, Cloud Storage Object Discovery"
  - "T1078.004, Valid Accounts: Cloud Accounts"
  - "T1537, Transfer Data to Cloud Account"
answer: 3
explanation: |
  **T1537, Transfer Data to Cloud Account**: the data leaves by being shared or copied to another account inside the same cloud, which is why it is filed under the Exfiltration tactic and why it is easy to miss. Nothing crosses the company's own network, so a monitor that watches downloads sees nothing.

  T1530 is reading data out of a storage service, and T1619 is listing what a storage service holds; both come earlier in an attack. T1078.004 is signing in with a real cloud account, which is how this attacker got access in the first place. A model that names T1537 points its readers at the control that fits: a rule about which accounts a snapshot may be shared with.
skills: [attack-and-abuse]
