id: mcq-transfer-not-lower
type: mcq
rev: 1
prompt: |
  A clinic's nightly export file sits in a bucket whose link anyone can open. The clinic changes nothing about the bucket, and buys cyber insurance that pays its costs if the file leaks. What has changed about the "export leak" risk?
choices:
  - "How likely it is: the insurer's checks close the open link"
  - "How bad it is: patients' data is no longer exposed by a leak"
  - "Who pays if it happens, and not how likely or how bad it is"
  - "Nothing at all: a transferred risk is the same as an accepted one"
answer: 2
explanation: |
  Insurance is the **transfer** response: someone else carries the cost. The link is as open as it was, so the likelihood is the same, and the patients' names and numbers are as exposed if it leaks, so the impact on them is the same. What moved is who pays the clinic's bills afterwards.

  That is why a transferred risk still has a **residual risk** to write down, and why transfer suits costs more than harms: an insurer can pay a fine, and can't un-publish a patient list. It isn't the same as accepting, though: accepting leaves the whole cost with the clinic. For a high risk like this one, neither is an answer. It needs a control.
skills: [respond-to-risk]
