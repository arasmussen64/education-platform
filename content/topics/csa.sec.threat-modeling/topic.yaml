skills:
  - id: draw-the-system
    description: "The four questions and why the first comes first; the kinds of element in a data-flow diagram (external entity, process, data store, data flow) and how to tell them apart; trust zones and boundaries, and which flows cross; a flow drawn from the side that starts it; shared responsibility as a boundary to the cloud provider"
  - id: stride
    description: "The six categories and the property each breaks; which apply to which kind of element (Microsoft's mapping); STRIDE run over each flow that crosses a boundary; a threat written as who can do what, leading to what; a `none` line as a recorded review"
  - id: rank-risks
    description: "Likelihood and impact on stated scales; risk as likelihood times impact, and high as a line; OWASP's method (factors scored 0 to 9 and averaged, the bands, business impact when known); what a ranking of ranks can't say"
  - id: respond-to-risk
    description: "Mitigate, eliminate, transfer and accept, and when each fits; a control of a kind that restores the property the threat breaks (why TLS doesn't answer spoofing at a sign-in or a hook); residual risk; why a high risk isn't simply accepted"
  - id: attack-trees
    description: "A goal, AND and OR nodes and leaves with costs; the cheapest path (an OR takes its cheapest child, an AND adds its children); probabilities of independent steps; how a countermeasure moves the cheapest path"
  - id: attack-and-abuse
    description: "MITRE ATT&CK: tactics and techniques, the cloud matrices, technique IDs and why a model names the version; ATT&CK beside STRIDE; abuse cases as an attacker's story with an acceptance test, and their place in a design review"
