prove:
  build: build-model-the-clinic
  debug: debug-approved-model
  explain:
    prompt: |
      A product manager asks why the team should spend a morning threat-modeling a new booking feature when "we already use HTTPS and the cloud is secure". Explain, in your own words: the four questions and why the first one comes first; what a trust boundary is, and where you'd draw them for an app that a partner's system calls back; how STRIDE helps you find what can go wrong, with one example of a threat that HTTPS doesn't touch; how you'd rank the threats and what that ranking can't tell you; how you'd choose what to do about the worst one, and why "we use TLS" isn't an answer to every threat; and what MITRE ATT&CK and abuse cases each add to a design review. Say one way the cloud's shared responsibility changes where your boundaries are.
    rubric:
      - id: four-questions
        required: true
        description: "The four questions (what are we working on, what can go wrong, what are we going to do about it, did we do a good enough job), and that the system must be drawn and agreed before a threat means anything: its parts, its flows and who runs each."
      - id: boundaries
        required: true
        description: "A trust boundary is where the level of trust changes because the owner or the network changes: the internet, a partner's systems, a provider-managed service. A partner's callback crosses one, and threats cluster on the flows that cross."
      - id: stride-beyond-tls
        required: true
        description: "STRIDE as six categories, each breaking one property (authentication, integrity, non-repudiation, confidentiality, availability, authorization), run over the flows that cross a boundary; and a threat HTTPS doesn't touch, such as a forged callback, a guessed or phished password, a change nobody is recorded as making, or a link that opens for anyone."
      - id: ranking-limits
        required: true
        description: "Likelihood times impact on stated scales, with a line above which a risk must be answered; the numbers are ranks, so equal scores aren't equal risks, and the score leaves out the effort to fix."
      - id: fitting-controls
        required: true
        description: "Mitigate, eliminate, transfer or accept; a control must restore the property the threat breaks (something that proves the sender or the user for spoofing, a record for repudiation), so TLS, which proves the server and hides the traffic, doesn't answer a forged message or a stolen password; what is left afterwards is the residual risk."
      - id: attack-and-abuse
        required: true
        description: "ATT&CK names techniques seen in real attacks, by ID and version, so a threat can be named precisely and matched to controls and detections; an abuse case tells a threat as an attacker's story with an acceptance test the team can run, which carries the threat into the backlog."
      - id: clouds-differ
        required: false
        description: "Shared responsibility moves the boundary by the kind of service: on a VM you own the operating system up, on a managed service the provider runs more and you keep the data, the identities and the configuration; each provider words it differently (AWS's of and in the cloud, Azure's table by service type, Google's shared fate)."
    model_answer: |
      HTTPS answers two questions: is this really our server, and can anyone read or change the traffic on the way. Most of what goes wrong with a feature is neither of those, and a morning of threat modeling is how we find the rest while it is still a drawing.

      It asks four things in order. What are we working on? We draw the parts, the flows between them and who runs each, because a threat only means something in a system we agree on. What can go wrong, what are we going to do about it, and did we do a good enough job follow from that.

      A trust boundary is where trust changes because the owner or the network changes: between the internet and our network, between us and the SMS company, between our servers and a service the cloud provider runs for us. Threats cluster on the flows that cross one, so those get reviewed first. The SMS company's callback to our site crosses one.

      STRIDE is a checklist of six ways to break six properties: spoofing breaks authentication, tampering integrity, repudiation the record of who did what, information disclosure confidentiality, denial of service availability, elevation of privilege authorization. On the callback, spoofing asks "how do we know the SMS company sent this?" If we don't check, anyone can post a STOP and cancel a patient's appointments, over perfect HTTPS.

      I'd rate each threat's likelihood and impact on scales we write down and multiply them, and treat anything above a line as something we must fix. The numbers are ranks: two sixes aren't equally bad, and the score doesn't say what a fix costs.

      For the worst one we can mitigate, eliminate the feature, transfer the cost or accept it. A control only counts if it restores the property the threat breaks: a forged callback needs a signature check, a phished password a second factor. TLS does neither. What remains afterwards is the residual risk, and we write that down too.

      ATT&CK gives the threats the names of techniques real attackers have used, with an ID and a version, which tells us what to detect. An abuse case turns a threat into a story with a test ("an unsigned report gets 401 and changes nothing") so it lands in the backlog.

      And "the cloud is secure" covers the provider's half. On a VM we own the operating system and everything above it; on a managed database the provider runs more, but the data, the accounts and the settings are always ours.
