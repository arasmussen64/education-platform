id: csa.sec.threat-modeling
kind: topic
status: ready
title: Threat modeling
summary: "Find what can go wrong in a system before it is built: draw its parts, its flows and the boundaries where trust changes; run STRIDE over every flow that crosses one; rank the threats by a stated method; answer each with a control that restores the property it breaks; work out an attack tree's cheapest path; and name attackers' techniques with MITRE ATT&CK and turn the worst threats into abuse cases a team can test."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 3,
# 4.4 and 5) and its designer's brief (csa.sec.threat-modeling.md). The
# module's first topic, so it carries the note every threat-model lab
# leans on ("Before your first threat-model lab", in the worked example's
# prompt). It builds on Module 3 whole (HTTPS, certificates and mutual TLS,
# cookies, load balancers, DNS, VPNs) and Module 1 (least privilege for a
# service, attack surface, awk with arrays, sed -i, nano), and assumes
# nothing from Module 2. It defines, for the module (the plan's 3.5):
# threat, trust boundary, STRIDE, risk, likelihood, impact, residual risk,
# control, attack tree, ATT&CK, abuse case, webhook and shared
# responsibility. MFA, authentication, authorization and a signing secret
# get one plain sentence each here and are taught by the next topics.
prerequisites:
  - csa.m3.checkpoint
# Worked out (content/README.md): the lesson about 4,900 words with its
# tables, 38 minutes; the copied reading (OWASP's cheat sheet, from
# "Overview" to the end of "Review and Validation", 1,950 words) 15;
# 21 practice quick questions at 1.5 each, 32; the worked example 20, the
# fill-in 20, the write 30; the build 70, the debug 35, the explain 20:
# 280. The plan's 300 assumed 81 minutes of assigned readings, which are
# optional now (ADR-0031), and a shorter lesson.
estimated_minutes: 280
rev: 1
objectives:
  - "Draw a system as a data-flow diagram (external entities, processes, data stores, data flows) in trust zones, and mark every flow that crosses a trust boundary, a cloud provider's managed services included."
  - "Run STRIDE over the flows that cross a boundary, and write each threat as a sentence that says who can do what and what it leads to, or record why there is nothing to record."
  - "Rank threats by likelihood times impact on stated scales, read OWASP's longer method, and say what such a ranking leaves out."
  - "Choose a response to each risk (mitigate, eliminate, transfer, accept) and a control of a kind that restores the property the threat breaks; say what residual risk is."
  - "Draw an attack tree for the worst risk, work out its cheapest path, and say what a countermeasure does to it."
  - "Name an attacker's technique with MITRE ATT&CK's cloud matrices, citing the version, and bring abuse cases with acceptance tests into a design review."
# Facts the lesson and the items rely on, each read on 2026-11-22:
# - The four questions ("What are we working on?", "What can go wrong?",
#   "What are we going to do about it?", "Did we do a good enough job?")
#   and the definition "analyzing representations of a system to highlight
#   concerns about security and privacy characteristics": the Threat
#   Modeling Manifesto, CC BY 4.0: threatmodelingmanifesto.org.
# - OWASP's Threat Modeling Cheat Sheet (CC BY-SA 4.0, its footer): DFDs
#   with trust boundaries; STRIDE's six properties; likelihood times impact
#   is hard to estimate and leaves out the effort to fix; mitigate,
#   eliminate, transfer (which lowers neither likelihood nor consequence),
#   accept: cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html.
# - STRIDE per element, from the six category units of Microsoft Learn's
#   module "Use a framework to identify threats and find ways to reduce or
#   eliminate risk" (9 units, ms.date 2025-05-12): spoofing: process,
#   external entity; tampering: process, data store, data flow;
#   repudiation: process, external entity, data store; information
#   disclosure and denial of service: process, data store, data flow;
#   elevation of privilege: process. The same units pair the categories
#   with authentication, integrity, non-repudiation, confidentiality,
#   availability and authorization, and list the controls the lesson's
#   table draws on:
#   learn.microsoft.com/en-us/training/modules/tm-use-a-framework-to-identify-threats-and-find-ways-to-reduce-or-eliminate-risk/.
# - OWASP Risk Rating Methodology (CC BY-SA 4.0, the site's footer): risk =
#   likelihood x impact; four threat-agent and four vulnerability factors,
#   four technical and four business impact factors, each 0 to 9 and
#   averaged; LOW 0 to under 3, MEDIUM 3 to under 6, HIGH 6 to 9; the
#   severity table (HIGH and HIGH is Critical, LOW and LOW is Note);
#   business impact is used when known:
#   owasp.org/www-community/OWASP_Risk_Rating_Methodology (it answers 308
#   to community.owasp.org/OWASP_Risk_Rating_Methodology).
# - Bruce Schneier, "Attack Trees" (Dr. Dobb's Journal, December 1999): an
#   OR node costs its cheapest child, an AND node the sum of its children;
#   the safe's cheapest attack is a $20,000 bribe, and raising the bribe to
#   $80,000 leaves a $60,000 threat as the cheapest:
#   schneier.com/academic/archives/1999/12/attack_trees.html.
# - MITRE ATT&CK: v20.1 is current since 13 October 2026 (v19.2 from 28
#   April, v18.1 from 28 October 2025): attack.mitre.org/resources/versions/.
#   15 Enterprise tactics, Stealth TA0005 and Defense Impairment TA0112
#   among them: attack.mitre.org/tactics/enterprise/. v19 split Defense
#   Evasion into Stealth and Defense Impairment, and "Impair Defenses" was
#   revoked by "Disable or Modify Tools" (T1685):
#   attack.mitre.org/resources/updates/updates-april-2026/. The page
#   attack.mitre.org/techniques/T1562/008/ is a refresh to
#   /techniques/T1685/002, "Disable or Modify Tools: Disable or Modify
#   Cloud Log" (created 14 April 2026, tactic Defense Impairment). The IaaS
#   matrix's 12 tactics and the techniques the items name (T1190 Exploit
#   Public-Facing Application; T1566 Phishing; T1078.004 Valid Accounts: Cloud Accounts;
#   T1110.004 Brute Force: Credential Stuffing; T1552.005 Unsecured
#   Credentials: Cloud Instance Metadata API; T1530 Data from Cloud
#   Storage; T1619 Cloud Storage Object Discovery; T1537 Transfer Data to
#   Cloud Account; T1098.001 Account Manipulation: Additional Cloud
#   Credentials): attack.mitre.org/matrices/enterprise/cloud/iaas/ and each
#   technique's own page. Tactics are the "why", techniques the "how", from
#   "real-world observations": attack.mitre.org/resources/.
# - OWASP's Abuse Case Cheat Sheet is archived ("Reviewers have identified
#   that abuse cases are rarely used in practice"), CC BY-SA 4.0:
#   cheatsheetseries.owasp.org/cheatsheets/Abuse_Case_Cheat_Sheet.html.
# - Shared responsibility: AWS's "security of the cloud" and "security in
#   the cloud", with more left to the customer on EC2 than on S3 or
#   DynamoDB: aws.amazon.com/compliance/shared-responsibility-model/.
#   Azure's matrix by service type, and the four things a customer always
#   keeps (data, endpoints, accounts, access management), ms.date
#   2026-08-24: learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility.
#   Google's shared responsibility by IaaS, PaaS and SaaS, and "shared
#   fate" (blueprints, the Risk Protection Program with insurers):
#   docs.cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate.
# - Tools named once: OWASP Threat Dragon 2.6.2, a desktop and web app that
#   draws data-flow diagrams (threatdragon.com/docs/); AWS Labs' Threat
#   Composer, Apache-2.0 (github.com/awslabs/threat-composer).
# - The story: Brian Krebs, "Target Hackers Broke in Via HVAC Company"
#   (5 February 2014, updated 6 February):
#   krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/.
#   Read against the Senate Commerce Committee's majority staff report, "A
#   'Kill Chain' Analysis of the 2013 Target Data Breach" (26 March 2014),
#   by the topic's reviewer on 2026-11-22. It is itself built on published
#   reports. It gives the same cards and dates, malware on a few tills
#   between 15 and 28 November and on most by 30 November, and Fazio's
#   access as billing, contract submission and project management; it adds
#   a New York Times report that the first access was on 12 November (so
#   the lesson says mid-November), that Fazio's credentials were reportedly
#   stolen with emails carrying malware, and the words the lesson quotes:
#   Target "failed to properly isolate its most sensitive network assets":
#   commerce.senate.gov/services/files/24d3c229-4f2f-405d-b8db-a3a67f183883.
# - TLS among the answers to spoofing ("Securing data transmissions with
#   TLS/SSL", "TLS/SSL" under "For your system"): the spoofing unit of the
#   Microsoft Learn module above. The labs' table files tls under I alone,
#   and the lesson says why.
# Every tm-check sentence quoted in the lesson and the labs is the lab
# base's real output (content/lab-bases/tm), captured in this topic's
# labs on 2026-11-22.
#
# Licences, each read on its page on 2026-11-22. OWASP's cheat sheets and
# community pages are CC BY-SA 4.0 (their footers); the manifesto is CC BY
# 4.0; Schneier's article states no licence; MITRE ATT&CK is © The MITRE
# Corporation, under its terms of use; Microsoft Learn's training modules
# come from the private learn-pr repository, under Microsoft Learn's terms
# of use; AWS's page is © Amazon Web Services; Azure's documentation is CC
# BY 4.0 (MicrosoftDocs/azure-docs); Google's page showed no licence line
# in the text fetched. Only the first is copied in.
