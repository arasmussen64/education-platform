# The checks of "Model the clinic": each runs one part of the threat-model
# base's tm-check on the learner's model. The design's own answers (the
# reference) are handed to tm-check on standard input ("-"), from here, so
# they are never a file in the lab. What a failure says never names a flow
# or a letter. The last check is that the design note is as it was.
#
# The reference: the SMS company is the only part that must sit apart from
# all the others; the three people on the internet may share a zone or not,
# and so may the site, the managed database and the bucket ("either"). The
# forged reply may be filed under S or T and rated impact 2 or 3. Each high
# weakness narrows the kinds of control that answer it: a longer password
# does not answer a phished one, input validation does not stop a forged
# report, and TLS does not close a link that opens for anyone.
checks:
  - id: model-reads
    description: "The model reads: every line is one of the format's."
    timeout: 10
    command: |
      tm-check reads /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: diagram-matches-design
    description: "Every part and flow the design names is there, of the right kind, drawn from the side that starts it."
    timeout: 10
    command: |
      tm-check diagram /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: zones-where-trust-changes
    description: "Two parts share a zone only when one organisation runs both on one network."
    timeout: 10
    command: |
      tm-check boundaries /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: every-crossing-reviewed
    description: "Every flow that crosses a boundary has all six letters reviewed, and no two threats read the same."
    timeout: 10
    command: |
      tm-check stride /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: design-weaknesses-found
    description: "Everything the design describes as weak has a threat on its flow, rated by the design's scales."
    timeout: 10
    command: |
      tm-check findings /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: ranked-by-risk
    description: "Each risk is likelihood times impact, and top lists every risk of 6 or more, highest first."
    timeout: 10
    command: |
      tm-check ranking /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: every-threat-answered
    description: "Every risk of 6 or more has a control of a kind that answers it, and every other threat a control or an accept line."
    timeout: 10
    command: |
      tm-check controls /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: attack-techniques
    description: "The threats the task asks an ATT&CK technique for each carry one that fits."
    timeout: 10
    command: |
      tm-check attack /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: attack-tree
    description: "A tree for one of the highest risks: three leaves or more, an and node with two steps, and the cheapest path's cost."
    timeout: 10
    command: |
      tm-check tree /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: abuse-cases
    description: "Every risk of 6 or more has an abuse case with a test."
    timeout: 10
    command: |
      tm-check abuse /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"staff":["external","internet"],"analyst":["external","internet"],"web":["process","clinic"],"bookings-db":["store","clinic"],"sms-gateway":["external","sms-co"],"exports":["store","clinic"]},"flows":{"f1":["patient","web"],"f2":["staff","web"],"f3":["web","bookings-db"],"f4":["sms-gateway","web"],"f5":["web","exports"],"f6":["analyst","exports"]},"weak":[{"flow":"f2","letters":["S"],"L":3,"I":3,"controls":["mfa","mutual-tls","access-proxy"],"attack":["T1110","T1078","T1566"]},{"flow":"f2","letters":["R"],"L":2,"I":2},{"flow":"f4","letters":["S","T"],"L":3,"I":[2,3],"controls":["signing","mutual-tls","authn"]},{"flow":"f6","letters":["I"],"L":3,"I":3,"controls":["authz","least-privilege","minimise-data","access-proxy","encryption"],"attack":["T1530","T1619"]}],"either":[["patient","staff"],["patient","analyst"],["staff","analyst"],["web","bookings-db"],["web","exports"],["bookings-db","exports"]]}
      REF
    expect:
      equals: ok
  - id: design-untouched
    description: "~/design.md is as it was."
    timeout: 10
    command: echo '535a2c1c95b6ff7f67dab05fd12881ee5c1b77351aae5b92e51298bc74a87e67  /home/learner/design.md' | sha256sum -c --status - && echo same
    expect:
      equals: same
