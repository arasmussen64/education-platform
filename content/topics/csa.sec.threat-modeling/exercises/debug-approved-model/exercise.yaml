id: debug-approved-model
stage: debug
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "The approved model"
prompt: |
  Riverside Parcels delivers parcels. Its drivers' app was threat-modelled last month, and the security board approved the model. `~/design.md` describes the system, every part of it: the drivers' phones, the customers, the drivers' API, its database, the bucket of doorstep photos and the maps company, with five flows, what is already in place, and the scales to rate with. `~/model.tm` is the approved model, in the format of this topic's labs (`tm-check --help` prints it). The model is meant to say what can go wrong on every flow that crosses a trust boundary, how much each threat matters by the design's scales, and what answers each one.

  Since the approval:

  - a tester downloaded a stranger's doorstep photo, house number in view, without signing in to anything;
  - a driver's password was phished and used to send parcels to another address, although the approved model says that risk is dealt with;
  - the security board's own reviewer says the review is incomplete, though `tm-check stride ~/model.tm` says `ok`.

  Three things in the model are wrong. Find them by reading the design against the model, and put each right in `~/model.tm` (`nano ~/model.tm`). Putting one right can leave other lines of the model needing work: carry each fix through until the model is whole again.

  The rules of the fix:

  - **Keep every threat the approved model has.** Fix a threat's line; don't delete it.
  - **Rate by the design's scales**, and let the risk, the `top` line and what answers the threat follow from the rating.
  - **Nothing the design describes may be marked `none`.**
  - **Leave `~/design.md` as it is.** The design is right; the model is what's wrong.

  `tm-check reads ~/model.tm` says whether every line is still in the format, and `tm-check stride`, `ranking` and `controls` check the review's coverage, the sums and the kinds of control. Then run the checks.
skills: [draw-the-system, rank-risks, respond-to-risk]
