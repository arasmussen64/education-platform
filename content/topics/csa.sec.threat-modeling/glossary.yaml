# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: threat
  definition: Something that could go wrong for a system because someone means it to, or misuses it. Written so a team can act on it, a threat says who can do what, and what it leads to.
- term: threat model
  aliases: [threat modeling]
  definition: A written answer to four questions about a system, in order. What are we working on, what can go wrong, what are we going to do about it, and did we do a good enough job.
- term: data-flow diagram
  aliases: [DFD]
  definition: A drawing of a system for threat modeling, made of external entities (outside your control), processes (which change or decide), data stores (which keep) and data flows, each drawn from the side that starts it.
- term: trust zone
  definition: A group of a system's parts that one organisation runs on one network, so the same assumptions hold for all of them.
- term: trust boundary
  definition: The line between two trust zones, where the level of trust changes because the owner or the network does. Threats cluster on the flows that cross one.
- term: webhook
  definition: An address on your system that a partner's system calls when something happens on their side. The partner starts the conversation, so your system must decide whether to believe the caller.
- term: shared responsibility
  definition: The line between what a cloud provider looks after and what its customer does. It moves with the kind of service, but your data, your accounts and your settings are always yours.
- term: STRIDE
  definition: A checklist of six kinds of threat, each breaking one property. Spoofing (authentication), Tampering (integrity), Repudiation (non-repudiation), Information disclosure (confidentiality), Denial of service (availability), Elevation of privilege (authorization).
- term: spoofing
  definition: Pretending to be someone or something else, such as a stranger posting a message as if they were a partner. It breaks authentication.
- term: tampering
  definition: Changing data without permission, on its way or where it is kept. It breaks integrity.
- term: repudiation
  definition: Doing something and being able to deny it, because nothing ties the action to whoever did it. A trusted record of who did what answers it.
- term: information disclosure
  definition: Data reaching someone who shouldn't see it, such as a password shown in an error page or a file that opens for anyone. It breaks confidentiality.
- term: elevation of privilege
  definition: Doing more than your rights allow, such as a customer's request running an administrator's action. It breaks authorization, and only a process can suffer it.
- term: likelihood
  definition: How easily a threat could happen, rated on a scale the design states. Who could do it, and what do they need first?
- term: impact
  definition: How bad it is if a threat happens, rated on a scale the design states.
- term: risk
  definition: How much a threat matters. Usually likelihood times impact, on stated scales, which gives a rank for sorting threats and not a measurement.
- term: residual risk
  definition: The risk that is left once a control is in place. Rate the threat again with the control there, and if it is still high, it needs more.
- term: security control
  definition: Something added to make a threat less likely or less harmful. It answers a threat only if it restores the property that threat breaks.
- term: attack tree
  definition: A threat drawn as a goal with the ways to reach it beneath. An or node costs its cheapest branch, an and node the sum of its steps, which gives the attacker's cheapest path.
- term: ATT&CK
  aliases: [MITRE ATT&CK]
  definition: MITRE's catalogue of what attackers have really done. Tactics are the why, and techniques, with IDs such as `T1530`, the how. IDs change between versions, so cite the version.
- term: abuse case
  definition: A threat told as a user story in the attacker's voice, with an acceptance test, the attacker's attempt failing, that the team can run on every release.
