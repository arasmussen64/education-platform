# A planned outline for the Machine Learning Foundations track
# (docs/specs/ml-foundations.md). It becomes real content when written.
id: ml.tf.scaling
kind: topic
status: planned
title: What scaling changes
summary: "A transformer's parameter count from its width, depth, vocabulary and context; training FLOPs as six times parameters times tokens; attention's quadratic cost in the context length; the memory of activations and of the key-value cache at inference; warmup and cosine learning-rate schedules; and a measured mini scaling study on the module's models."
prerequisites:
- ml.tf.language-model
- ml.hw.cost-of-a-model
estimated_minutes: 50
rev: 1
objectives:
- "Count a transformer's parameters from its hyperparameters and say which terms grow with width, depth, vocabulary and context."
- Estimate training FLOPs from parameters and tokens, and inference memory from the key-value cache, and say where the context length bites.
- Implement learning-rate warmup and cosine decay and say what each protects against.
- "Train three sizes of the module's model on the same corpus, plot held-out loss against size, and say what changed and what didn't."
