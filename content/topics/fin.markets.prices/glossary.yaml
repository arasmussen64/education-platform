- term: OHLC
  aliases: [price bar, price bars]
  definition: "Open, high, low, close: a bar's first trade, highest trade, lowest trade and last trade over its period, a day or a week, usually shown with the volume."
- term: trading volume
  definition: "How many shares changed hands in a period. A big price move on high volume is one many people took part in."
- term: stock split
  aliases: [share split]
  definition: "A company turning each share into several (2-for-1, 3-for-1), each worth that much less. Owners hold the same value in more pieces."
- term: ex-dividend date
  aliases: [ex-date]
  definition: "The first day a share trades without the right to the next dividend. Its price usually drops by about the dividend that morning, at no loss to holders."
- term: adjusted price
  aliases: [adjusted close, adjusted closes]
  definition: "A past price restated in today's terms for splits and dividends, so that returns measured across them are right. Raw prices show cliffs that never cost anyone money."
- term: price-weighted index
  definition: "An index that follows the sum of its companies' share prices, so a high-priced share counts most whatever the company is worth."
- term: cap-weighted index
  aliases: [market-cap-weighted index, value-weighted index]
  definition: "An index that follows the sum of its companies' market values, price times shares, so each company counts in proportion to what it's worth."
