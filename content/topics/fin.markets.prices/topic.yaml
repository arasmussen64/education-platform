prove:
  build: build-split-adjusted-return
  debug: debug-index-calculator
  explain:
    prompt: |
      Two made-up companies make up an index. Tall Co's shares cost $300 and there are 2 million of them. Wide Co's shares cost $15 and there are 200 million of them. Over a year Tall Co's price rises 20% and Wide Co's falls 10%. In your own words: what does a price-weighted index of the two do over the year, and what does a cap-weighted one do, with the numbers? Why do the same two companies give two different answers? Which one better tells you how the money invested in these two companies did, and why?
    rubric:
      - id: price-weighted
        required: true
        description: "The price-weighted index follows the sum of prices: 300 + 15 = 315 goes to 360 + 13.50 = 373.50, about +18.6%; Tall Co dominates because its price is high."
      - id: cap-weighted
        required: true
        description: "The cap-weighted index follows market values: $600 million + $3,000 million = $3,600 million goes to $720 million + $2,700 million = $3,420 million, a fall of 5%; Wide Co dominates because it's worth five times as much."
      - id: why
        required: true
        description: "Price weighting counts a share's price, which says nothing about a company's size (a split would change it); cap weighting counts what each company is worth, price times shares."
      - id: money
        required: true
        description: "The cap-weighted index matches what happened to the total money invested in the two companies (it's what owning all their shares would have returned)."
      - id: weighted-returns
        required: false
        description: "Shows the cap-weighted return as the returns weighted by each company's share of the total: 1/6 × 20% + 5/6 × (−10%) = −5%."
    model_answer: |
      A price-weighted index adds up the share prices. At the start that's $300 + $15 = $315; at the end Tall Co is $360 and Wide Co $13.50, $373.50 in all, so the index is up about 18.6%. Tall Co's $300 price makes it count twenty times as much as Wide Co, so its 20% rise decides the answer. A cap-weighted index adds up market values, price times shares. Tall Co is worth $300 × 2 million = $600 million and Wide Co $15 × 200 million = $3,000 million, $3,600 million in all. At the end Tall Co is worth $720 million and Wide Co $2,700 million, $3,420 million, so the index is down 5%. That's the two returns weighted by size: one sixth of 20% plus five sixths of −10% is −5%. The answers differ because the two indexes listen to different things: a share's price says nothing about how big a company is (Tall Co could split 20-for-1 tomorrow and become a $15 share), while market value is what the whole company is worth. The cap-weighted index tells you how the money invested in these companies did: someone who owned all the shares of both had $3,600 million and ended with $3,420 million, 5% less, even though the price-weighted index says +18.6%.
