id: fill-two-indexes
stage: fill_in
rev: 1
title: "Two indexes from three companies"
prompt: |
  Three made-up companies, each with its number of shares (in millions) and its share price at the start and end of a year. Replace each `...` with an operator so the program prints the year's return of a price-weighted index (it follows the sum of the share prices) and of a cap-weighted index (it follows the sum of the companies' market values, price times shares):

  ```
  price-weighted: +0.4%
  cap-weighted: +16.7%
  ```

  Every `...` stands for an operator, so until all four are replaced Python can't run the program at all, and shows a syntax error. Keep the `companies` line as it is: the checks run your program with other companies too.
hints:
  - "A company's market value is its share price times its number of shares."
  - "An index's return is its end level divided by its start level, minus 1. The divisor and the starting level of 100 cancel out, so the sums alone are enough."
skills: [indexes]
