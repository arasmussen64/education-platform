id: debug-index-calculator
stage: debug
rev: 1
title: "An index calculator"
prompt: |
  This program should print a cap-weighted index of three made-up companies over three days. Each company counts in proportion to its market value, its share price times its number of shares (in millions), and the index is set to 100 on day 0: each day's level is 100 times that day's total market value divided by day 0's. It should print:

  ```
  day 0: 100.00
  day 1: 102.00
  day 2: 105.92
  ```

  Instead it prints 23500.00 for day 0, and its levels fall from day to day while the companies' total market value rises. It has two bugs. Run it, fix what you find, and run it again, then run the checks, which also try other share counts.
hints:
  - "Work out day 0's total market value by hand: 25 x 40 + 200 x 5 + 10 x 125. Does `market_value` give that?"
  - "Day 0's level should be exactly 100. What has to happen to that day's market value to turn it into 100?"
skills: [indexes]
