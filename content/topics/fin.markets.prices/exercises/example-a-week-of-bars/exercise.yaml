id: example-a-week-of-bars
stage: worked_example
rev: 1
title: "A week of price bars"
prompt: |
  This program reads a made-up week of daily price bars: each day's open, high, low, close and volume. Press **Run**, then read how each part works.
steps:
  - label: "The bars"
    lines: "1-8"
    note: "One dictionary per trading day. `open` is the first trade of the day, `close` the last, `high` and `low` the highest and lowest trades in between, and `volume` how many shares changed hands. All made up."
  - label: "One day at a time"
    lines: "10-14"
    note: "`close - open` says how the day went, and `high - low` how far apart its extremes were. Wednesday rose 3.20 in a day with a 3.60 range. `:+.2f` prints a sign in front of the number, plus or minus, and two decimal places."
  - label: "The week as one bar"
    lines: "16-27"
    note: "A longer bar is built from shorter ones: the first day's open, the highest high, the lowest low and the last day's close. Volumes add up (`:,` puts commas between thousands). Wednesday's big rise came on more than twice the volume of any other day, which is what a chart reader looks for: a move many people took part in."
  - label: "Returns go close to close"
    lines: "29-32"
    note: "A day's return is today's close over yesterday's close, minus 1, as in *Measuring returns*. It isn't the open-to-close move: Friday opened at 52.80, below Thursday's 53.00 close, so it gained 0.40 within the day but only 0.38% from close to close. The night between one close and the next open counts too."
