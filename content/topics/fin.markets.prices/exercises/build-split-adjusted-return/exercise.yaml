id: build-split-adjusted-return
stage: build
rev: 1
title: "A split-adjusted return"
prompt: |
  A made-up stock's closing prices over six days are `closes = [120.0, 124.0, 130.0, 66.0, 67.5, 69.0]`. Before day 3 the company split its shares 2-for-1: every share became two, each worth half as much. Starting from a blank editor, begin with these three lines:

  ```python
  closes = [120.0, 124.0, 130.0, 66.0, 67.5, 69.0]
  split_day = 3
  ratio = 2
  ```

  `split_day` is the position of the first close after the split, and `ratio` how many new shares each old one became. Write two functions:

  - `adjust_for_split(closes, split_day, ratio)` returns a new list of closes in today's shares: every close before `split_day` divided by `ratio`, every close from `split_day` on unchanged. It leaves the list it was given as it was.
  - `total_return(prices)` returns the last price divided by the first, minus 1, as a decimal (0.15 for 15%).

  Then print each adjusted close to two decimal places, the return worked out from the raw closes, and the true return from the adjusted ones, both as percentages to one decimal place:

  ```
  day 0: 60.00
  day 1: 62.00
  day 2: 65.00
  day 3: 66.00
  day 4: 67.50
  day 5: 69.00
  return from the raw closes: -42.5%
  true return: 15.0%
  ```

  The checks run your program with other closes, split days and ratios too, and call your functions directly.
skills: [adjust, ohlc]
