id: mcq-read-a-bar
type: mcq
rev: 1
prompt: |
  A made-up stock's bar for one day reads: open 30.00, high 33.00, low 29.00, close 29.50. What does it say happened that day?
choices:
  - "It rose to 33.00, then fell back to finish below its opening price"
  - "It finished at 33.00, its best price of the day"
  - "It fell all day from 33.00 to 29.00, ending near its low"
  - "Its average price for the day was 29.50, below the open"
answer: 0
explanation: |
  The open, 30.00, is the first trade and the close, 29.50, the last; the high and low are the extremes in between. So it traded as high as 33.00 at some point and finished below where it started. The bar doesn't say when the high came, only that it did. The close is 29.50, not 33.00. It can't have fallen all day from 33.00, since it opened at 30.00. And none of the four is an average: each is one real trade.
skills: [ohlc]
