id: parsons-split-adjust
type: parsons
rev: 1
prompt: |
  A made-up stock closed at 80.0 and 84.0, then split 2-for-1 and closed at 43.0. Put the lines in order so the program adjusts the two closes before the split into today's shares and prints `[40.0, 42.0, 43.0]`. One line is a decoy that doesn't belong. (The first line sets two names at once: `closes` to the list of closes and `adjusted` to an empty list.)
lines:
  - 'closes, adjusted = [80.0, 84.0, 43.0], []'
  - 'for i in range(len(closes)):'
  - '    if i < 2:'
  - '        adjusted.append(closes[i] / 2)'
  - '    else:'
  - '        adjusted.append(closes[i])'
  - 'print(adjusted)'
distractors:
  - '    if i <= 2:'
explanation: |
  The split happened before position 2, the first close in new shares, so only positions 0 and 1 are divided by 2: `i < 2`. Each old share became two, each worth half, so dividing the old closes by 2 puts the whole history in today's shares. The close after the split is already in today's shares and is copied as it is. The decoy's `i <= 2` would halve the 43.0 as well and print `[40.0, 42.0, 21.5]`, inventing a fall that never happened.
skills: [adjust]
