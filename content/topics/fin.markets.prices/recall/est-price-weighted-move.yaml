id: est-price-weighted-move
type: estimate
rev: 1
prompt: |
  A made-up price-weighted index follows the sum of three share prices: $10, $50 and $240. One day the $240 share falls 10% and the other two don't move. By how many percent does the index fall? Exactly.
unit: "%"
answer: 8
tolerance: { absolute: 0 }
given: { a: 10, b: 50, c: 240, fall: 10 }
working: c * fall / 100 / (a + b + c) * 100
amounts: made-up
mistakes:
  - id: equal-weights
    value: 3.33
    working: fall / 3
    why: "That gives each share the same weight. A price-weighted index follows the sum of the prices, so the $240 share is 80% of it."
  - id: whole-fall
    value: 10
    working: fall
    why: "That's how far the one share fell. It's only part of the index: $24 off a sum of $300."
explanation: |
  The prices add up to $300, and the $240 share falling 10% takes $24 off: 24 ÷ 300 = 8%. In a price-weighted index the highest-priced share counts most, here 80% of the index, whatever the companies are worth: a company with a $240 share may be smaller than one with a $10 share and many more shares.
skills: [indexes]
