id: typed-ex-dividend-date
type: typed
rev: 1
prompt: |
  A company will pay a dividend. Name the date from which a buyer of the share no longer gets that dividend, the morning its price usually drops by about the dividend.
kind: text
answers:
  - "ex-dividend date"
  - "ex-date"
  - "ex-dividend"
  - "ex date"
  - "ex dividend date"
mistakes:
  - id: record
    answers: ["record date", "date of record"]
    why: "The record date is when you must be on the company's books to be paid. Since US trades settle T+1, it's usually the same day as the ex-dividend date, but the date that decides whether a buyer gets the dividend is the ex-dividend date."
  - id: payment
    answers: ["payment date", "payable date", "pay date"]
    why: "The payment date is when the cash arrives, after the ex-dividend date. The price drops on the ex-dividend date."
explanation: |
  Buy before the ex-dividend date and you get the next dividend; buy on it or after and the seller does. So that morning the share is worth about the dividend less, and the price usually opens lower by about that much. That drop isn't a loss to holders, who get the cash, which is why past prices are adjusted for dividends before measuring returns.
skills: [adjust]
