id: mcq-why-adjust
type: mcq
rev: 1
prompt: |
  A made-up stock closed at $150 one day, split 3-for-1, and closed at $52 the next day. A program measures the day's return from the raw closes and reports a loss of about 65%. What should it have done?
choices:
  - "Divide the closes before the split by 3, giving a gain of about 4%"
  - "Multiply the closes after the split by 3, giving a loss of about 4%"
  - "Leave out the day of the split, since splits make returns meaningless"
  - "Nothing: the shareholders really did lose about 65% that day"
answer: 0
explanation: |
  A 3-for-1 split turns each share into three, each worth a third, so owners have the same money in more pieces. In today's shares the $150 close is $150 ÷ 3 = $50, and $50 to $52 is a gain of 4%. (Multiplying the later closes by 3 instead would give the same 4% gain, not a loss, but the convention is to restate the past in today's shares, so the latest prices are the real ones.) Leaving the day out would lose a real 4% move. And nobody lost 65%: the chart's cliff is the split, not a fall in value.
skills: [adjust]
