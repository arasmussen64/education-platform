id: contrast-price-or-cap
type: mcq
rev: 1
prompt: |
  A made-up index holds two companies. Big Co has 1,000 million shares at $20, a market value of $20 billion. Small Co has 10 million shares at $200, a market value of $2 billion. One day Small Co's price rises 10% and Big Co's doesn't move. Which index moves more?
choices:
  - "The price-weighted one: Small Co's $200 price outweighs Big Co's $20, whatever their sizes"
  - "The cap-weighted one: Small Co's rise counts in full there, while prices are capped"
  - "Both move the same, because the same company rose by the same 10% in each of them"
  - "Neither moves, because a single company's rise is averaged away by the other one"
answer: 0
explanation: |
  A price-weighted index adds up share prices, so a $200 share counts ten times as much as a $20 one, whatever the companies are worth. Small Co's $20 rise lifts the sum from $220 to $240, about 9%. A cap-weighted index adds up market values, so Big Co's $20 billion dwarfs Small Co's $2 billion: the total goes from $22 billion to $22.2 billion, under 1%. The same move gives two very different index returns. Nothing is capped in either; and one company's move is weighted, not averaged away.
skills: [indexes]
