id: est-dividend-factor
type: estimate
rev: 1
prompt: |
  A made-up stock closed at $50 the day before its ex-dividend date and pays a dividend of $1. Using the factor 1 − dividend ÷ that close, what does an adjusted price list show for an earlier close of $45, in dollars? Exactly, to the cent.
unit: dollars
answer: 44.10
tolerance: { absolute: 0 }
given: { close_before: 50, dividend: 1, earlier: 45 }
working: earlier * (1 - dividend / close_before)
amounts: made-up
mistakes:
  - id: subtracted
    value: 44
    working: earlier - dividend
    why: "That takes the dollar off the earlier price. The adjustment is a percentage, 2%, the dividend's share of the close before the ex-date, so it scales every earlier price by the same factor."
  - id: divided
    value: 45.92
    working: earlier / (1 - dividend / close_before)
    why: "That divides by the factor, raising the earlier price. Earlier prices come down, so that the drop on the ex-date isn't counted as a loss: multiply by 0.98."
explanation: |
  The factor is 1 − 1 ÷ 50 = 0.98: the dividend was 2% of the price the day before the ex-date. Every earlier close is multiplied by 0.98, so $45 becomes $44.10. Scaling rather than subtracting keeps every earlier day's return the same and adds the dividend into the return across the ex-date, roughly as if it had been put back into the stock that day. Other ways of adjusting exist; this module uses this one throughout.
skills: [adjust]
