id: typed-close
type: typed
rev: 1
prompt: |
  Of the four prices in a daily bar, which one is the price of the last trade of the day, the one daily returns are worked out from? Type its one-word name.
kind: text
answers:
  - "close"
  - "closing price"
  - "the close"
mistakes:
  - id: open
    answers: ["open", "opening price"]
    why: "The open is the first trade of the day. Daily returns go from one day's close to the next."
  - id: high
    answers: ["high", "low"]
    why: "The high and the low are the day's extremes, which could have come at any time."
explanation: |
  A daily bar holds the open (first trade), the high, the low and the close (last trade), plus the volume. Returns are measured close to close, so the night between one close and the next open counts as part of the day's return. Charts that show one line instead of bars draw the closes.
skills: [ohlc]
