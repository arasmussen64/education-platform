id: csa.net.dns
kind: topic
status: ready
title: DNS
summary: "Trace a lookup end to end, from a laptop's stub through a recursive resolver to the root, the TLD and the zone's own servers; read and write zone files, delegate with glue and keep a secondary in step; work out how long answers and \"no such name\" stay cached, and move a name with the TTL lowered first; give one name a private answer without losing the rest; and read DNSSEC's chain of trust, and what a broken one looks like."
# DNS uses UDP and falls back to TCP on port 53, so this topic comes after
# csa.net.transport, which defines the datagram, the port and the connection
# it leans on (and reaches back through Module 3 to csa.m1.checkpoint). It
# does not depend on Module 2: the words DNS, zone, record, resolver and
# zone transfer are defined here. What it builds on, for the writer:
# csa.linux.net-tools (dig, its answer section and TTL column, +short,
# /etc/hosts read by curl but not by dig, dnsmasq), csa.linux.services
# (systemctl, journalctl), csa.linux.shell and scripting (awk, sort, grep,
# a script with chmod +x, for the write lab), csa.net.layers (the network
# labs' machines, on, name@machine; its walkthrough's onboarding note) and
# csa.net.cidr (the reverse zone's backwards octets, one line).
prerequisites: [csa.net.transport]
estimated_minutes: 315
rev: 1
objectives:
  - "Follow one lookup from a laptop's stub resolver through a recursive resolver to the root, the top-level domain's servers and the zone's own servers, reading `dig +trace` and `dig +norecurse`: each referral, the glue that came with it, and the server whose answer is authoritative (`aa`)."
  - "Read and write a zone file (SOA and its serial, expire and minimum; NS, A, AAAA, CNAME and why it can't sit at the apex, MX, TXT, CAA, PTR), delegate a child zone with NS records, glue and a DS record, and keep a secondary in step through the serial, NOTIFY and zone transfers."
  - "Work out how long an answer, or a \"no such name\", can stay cached (the TTL, the SOA's negative TTL, a resolver's caps), and run a planned move as a procedure: lower the TTL, wait out the old one, switch, check, raise it again."
  - "Give one name a different answer inside a network (split-horizon) without losing the rest of the zone, and predict the classic failure where a private zone shadows the public one, on Route 53, Azure Private DNS and Cloud DNS."
  - "Explain DNSSEC's chain of trust (DNSKEY, RRSIG, DS, the trust anchor, the ad flag), recognise a broken one (SERVFAIL, `dig +cd` still answering, an Extended DNS Error naming the cause), and fix it by signing again or publishing the right DS, never by switching validation off."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - A negative answer's TTL is the smaller of the SOA record's TTL and its
#   MINIMUM field: RFC 2308, sections 3 and 5 (Module 3 DNS brief, F1, read
#   2026-11-11; the labs' NXDOMAIN gave 300 for SOA TTL 300 and MINIMUM 900,
#   captured 2026-11-12).
# - Unbound's defaults: cache-max-ttl 86400 (1 day), cache-max-negative-ttl
#   3600, infra-host-ttl 900, val-bogus-ttl 60, serve-expired no; static
#   answers NODATA or NXDOMAIN for names without local data, transparent
#   resolves them normally; test. is one of its default local zones
#   (static); domain-insecure ignores the chain of trust below a name, and
#   val-permissive-mode hands bogus data to clients:
#   https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
# - Route 53 VPC Resolver: a matching private hosted zone with no matching
#   record returns NXDOMAIN and "doesn't forward the request to a public DNS
#   resolver"; a VPC Resolver rule for the same name takes precedence over
#   the private zone; the Amazon-provided DNS server is at the VPC range's
#   base plus two:
#   https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html
# - Route 53 VPC Resolver validates DNSSEC only when switched on per VPC
#   ("could result in an outage"), ignores DO and CD, and doesn't set AD:
#   https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-dnssec-validation.html
# - Route 53 DNSSEC signing "is supported only for public hosted zones";
#   each KSK is based on a customer managed key in AWS KMS, and Route 53
#   manages the ZSK:
#   https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-configuring-dnssec.html
# - Route 53 alias records can sit at the zone apex, a CNAME can't; alias
#   queries to AWS resources are free; an alias to an AWS resource uses the
#   resource's TTL:
#   https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-choosing-alias-non-alias.html
# - Azure Private DNS: "Enable fallback to internet" (resolutionPolicy
#   NxDomainRedirect, API 2024-06-01 or later) "is only available for
#   Private DNS zones associated to Private Link resources" (ms.date
#   2025-02-04): https://learn.microsoft.com/en-us/azure/dns/private-dns-fallback
# - Azure DNS signs public zones with ECDSAP256SHA256 and implements RFC
#   9824; "DNSSEC response validation is not performed by the default
#   Azure-provided resolver"; ZSKs roll automatically, a KSK change needs
#   Microsoft support and a new DS (ms.date 2025-01-27, updated
#   2026-08-12): https://learn.microsoft.com/en-us/azure/dns/dnssec
# - Azure DNS alias record sets (A, AAAA, CNAME) can point at a Standard
#   public IP, a Traffic Manager profile, a CDN endpoint, Front Door or
#   another record set, and sit at the apex, since "The DNS protocol
#   prevents the assignment of CNAME records at the zone apex" (ms.date
#   2026-10-05, updated 2026-10-19):
#   https://learn.microsoft.com/en-us/azure/dns/dns-alias
# - Cloud DNS: "A private zone can overlap with any public zone", and a
#   missing record in it gives NXDOMAIN "even if there is a record ...
#   defined in a public zone":
#   https://docs.cloud.google.com/dns/docs/zones/zones-overview
# - Cloud DNS manages DNSKEY creation, rotation and signing once DNSSEC is
#   on; "If you cannot add a DS record through your domain registrar ...
#   enabling DNSSEC in Cloud DNS has no effect"; the page doesn't say
#   whether a VPC's own resolver validates, so nothing is claimed for it:
#   https://docs.cloud.google.com/dns/docs/dnssec
# - Slack, 30 September 2021 (post of 29 November 2021): a DNSSEC rollout
#   caused a 24-hour outage for under 1% of users; the DS was removed at the
#   registrar on the assumption it wasn't cached, .com tells resolvers to
#   keep it 24 hours, and validating resolvers returned SERVFAIL:
#   https://slack.engineering/what-happened-during-slacks-dnssec-rollout/
# - The DigitalOcean tutorial (modified 2020-11-04) still says "13 root
#   servers in operation": there are 13 root server names, each answered by
#   many machines. RFC 6761 section 6.2 reserves .test; RFC 2181 section 10.1
#   forbids a CNAME beside other data; RFC 8914 defines EDE 6 (DNSSEC Bogus)
#   and 7 (Signature Expired); RFC 9499 defines referral and glue: as the
#   Module 3 DNS brief recorded them on 2026-11-11.
# Every command output in the lesson, the labs' notes and the items marked
# "captured" is real output of this topic's labs on the owner's PC (Docker
# Desktop 29.8.2, the network-lab base: BIND 9.18.39, Unbound 1.19.2, dig
# 9.18.39), captured 2026-11-12. Keys, key tags, signatures and served
# serials differ at every build.
#
# Linked, never copied. Licences, each read on 2026-11-12: the DigitalOcean
