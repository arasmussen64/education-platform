prove:
  build: build-move-the-api
  debug: debug-half-the-lookups
  explain:
    prompt: |
      A colleague is moving the company's main website to a new load balancer on Friday, and plans to "change the DNS on Friday afternoon". Explain, in your own words: how a laptop finds the website's address, from its own resolver to the zone's authoritative servers, and which of them may be holding an old answer; what you'd do in the days before the move and why, with the numbers; why a name you look up before creating it can stay "missing"; what happens to the company's own staff if the company also has a private zone for the same domain in its cloud network; and what DNSSEC adds, what a broken signature looks like to users, and why turning validation off is the wrong fix. Say one way the three clouds differ.
    rubric:
      - id: resolution
        required: true
        description: "The stub asks a recursive resolver, which follows referrals from the root to the TLD's servers to the zone's own (authoritative) servers, whose answer carries aa; old answers sit in resolvers' caches (and stubs'), each until its TTL runs out, not at the authority."
      - id: ttl-procedure
        required: true
        description: "Lower the TTL at least one old TTL before the move (with the serial raised, live on every server), switch, check through several resolvers, then raise the TTL again; nobody can empty other people's caches, so the wait is the only way."
      - id: negative
        required: true
        description: "A \"no such name\" (NXDOMAIN) is cached too, for the smaller of the SOA record's TTL and its MINIMUM field, so a name looked up before it exists stays missing that long."
      - id: split-horizon
        required: true
        description: "A private zone answers every name under it: names missing there give NXDOMAIN inside the network even when they exist publicly (Route 53, Cloud DNS, and Azure except Private Link zones with fallback), so copy every needed record or make the private zone narrower."
      - id: dnssec
        required: true
        description: "Signatures (RRSIG) checked against the zone's key (DNSKEY), vouched for by the parent's DS up to a trust anchor, prove origin and integrity, not secrecy; broken means SERVFAIL at validating resolvers only, while dig +cd still shows the data and an Extended DNS Error names the cause; fix by signing again or publishing the right DS, because switching validation off lets forgeries through."
      - id: clouds-differ
        required: false
        description: "Any correct difference: Azure's default resolver doesn't validate DNSSEC, Route 53's VPC Resolver validates only once switched on per VPC, Cloud DNS signs but needs the registrar's DS; Azure's fallback to the internet for Private Link zones; Route 53 alias and Azure alias records at the apex."
    model_answer: |
      The laptop doesn't look anything up itself. Its stub resolver asks the resolver in its network settings, which does the research: it asks a root server, which refers it to the servers for .com, which refer it to the company's own name servers, and those answer with the authoritative flag, aa. Each answer has a TTL, and the resolver keeps it that long; so does the laptop. So after a change the authoritative servers have the new address at once, but every resolver that fetched the old one keeps handing it out until its TTL runs out, and nobody can empty other people's caches.

      So "change the DNS on Friday afternoon" isn't enough. If the record's TTL is 86400 seconds, a day, I'd lower it to 300 at least a day before the move, raise the zone's serial so every server loads it, and check each server gives the new TTL. On Friday I'd switch the address, check through a few different resolvers, and once it works raise the TTL again, because short TTLs mean many more queries and an outage of the name servers felt in minutes.

      Names that don't exist are cached too. An NXDOMAIN carries the zone's SOA, and resolvers keep it for the smaller of the SOA record's TTL and its MINIMUM, so if someone looks a name up before we create it, it can stay missing for that long.

      If the company also has a private zone for the domain in its cloud network, the network's resolver answers every name under it from the private zone. A name missing there gives NXDOMAIN to the staff even though it exists publicly. So the private zone needs every record staff use, or it should be narrower, like internal.example.com.

      DNSSEC adds signatures: each record set is signed with the zone's key, the parent's DS record vouches for that key, and so on up to the root key the resolver trusts. It proves the answer is the zone owner's and wasn't changed, but it isn't secret. If the signatures expire or the DS doesn't match the key, validating resolvers return SERVFAIL, while dig +cd still shows the records and the Extended DNS Error says why. The fix is signing again or publishing the right DS; turning validation off would accept forged answers too.

      The clouds differ: Azure's default resolver doesn't validate DNSSEC at all, while Route 53's validates only once it's switched on for a VPC.
