skills:
  - id: trace-resolution
    description: "Stub, recursive resolver, forwarder and authoritative server; following one lookup from the root down through referrals and glue to the aa answer; reading dig +trace, dig +norecurse @server and the header's flags (qr, aa, rd, ra, ad, cd) and status; which server to ask when answers disagree"
  - id: records-and-zones
    description: "Record types and when to use each (A, AAAA, CNAME and its rules, MX, TXT, CAA, NS, SOA, PTR); the zone file and the SOA's fields; delegating a child zone with NS, glue and a DS; the serial, NOTIFY and zone transfers; a secondary that falls behind, and reading BIND's journal"
  - id: ttl-and-caching
    description: "TTLs counting down in a resolver's cache; negative caching for the smaller of the SOA's TTL and MINIMUM; resolvers' caps; the planned move: lower, wait out the old TTL, switch, check, raise; why nobody can flush the world's caches"
  - id: split-horizon
    description: "One name, two answers: a resolver's local zone (Unbound's static and transparent) with local data; private zones on Route 53, Azure and Cloud DNS, and how they shadow the public zone with NXDOMAIN; Route 53's resolver rules and Azure's fallback for Private Link zones"
  - id: dnssec
    description: "What DNSSEC proves and what it doesn't; DNSKEY, RRSIG, DS, the trust anchor and the ad flag; reading a broken chain (SERVFAIL, dig +cd, EDE 6 and 7); signing again and DS records; why switching validation off is the wrong fix; what each cloud signs and validates"
