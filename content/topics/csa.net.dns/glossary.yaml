# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: DNS
  aliases: [Domain Name System]
  definition: The Domain Name System, the internet's directory of names, kept by thousands of organisations, each answering for its own part of the tree of names.
- term: stub resolver
  definition: The small part of a machine that looks names up by asking one resolver, the one in its settings (`/etc/resolv.conf` on Linux), and takes whatever comes back.
- term: recursive resolver
  definition: A DNS server that does the research for its clients, following referrals from the root down to the zone's own servers, then keeping each answer for its TTL.
- term: authoritative server
  definition: A DNS server that holds a zone and answers for it, marking its answers `aa`. It answers only for its own zones and asks nobody else.
- term: referral
  definition: A DNS answer that says "not me, ask these servers", naming a child zone's name servers, with no answer to the question itself.
- term: glue
  definition: The addresses of a child zone's name servers, handed over with a referral, needed when those servers' names are inside the zone being delegated.
- term: negative caching
  definition: Resolvers keeping a "no such name" (NXDOMAIN) answer too, for the smaller of the SOA record's TTL and its minimum field.
- term: split-horizon
  aliases: [split-view]
  definition: One name, two answers, a private one for machines inside a network and a public one for everyone else, by a resolver's local zone or a cloud's private zone.
- term: DNSSEC
  aliases: [DNS Security Extensions]
  definition: Signatures on DNS answers, checked from the root's key down through each parent's DS record, proving an answer came from the zone's owner unchanged. It doesn't make it secret.
