# The office's resolver: Unbound, recursive and validating. Every machine
# in the office asks it for every name (their /etc/resolv.conf names
# 10.1.0.53); it asks the root, then test.'s server, then the zone's own
# servers, and keeps each answer for its TTL.
server:
  interface: 0.0.0.0
  access-control: 10.1.0.0/24 allow
  access-control: 127.0.0.0/8 allow
  # The lab's internet has its own root server (root.hints), not the
  # real one, and its root key (root.key, a DS record) starts the chain
  # of trust that DNSSEC validation follows.
  root-hints: "/etc/unbound/root.hints"
  trust-anchor-file: "/etc/unbound/root.key"
  # Unbound answers every name under .test itself, as reserved for
  # testing; the lab's internet uses .test, so that is switched off.
  local-zone: "test." nodefault
  # A server that didn't answer is tried again after 60 seconds, not
  # Unbound's 900: after a boot, the name servers may start after this.
  infra-host-ttl: 60
  # Say why an answer failed (an Extended DNS Error), and log failed
  # validations to the journal.
  ede: yes
  val-log-level: 2
  username: "unbound"
  chroot: ""
  pidfile: "/run/unbound.pid"
  use-syslog: no
  logfile: ""
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
