# A public resolver that customers use (an ISP's, or one like 8.8.8.8):
# Unbound, recursive and validating, open to anyone. It isn't the shop's:
# the shop can't change it, restart it or empty its cache.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  root-hints: "/etc/unbound/root.hints"
  trust-anchor-file: "/etc/unbound/root.key"
  local-zone: "test." nodefault
  infra-host-ttl: 60
  ede: yes
  val-log-level: 2
  username: "unbound"
  chroot: ""
  pidfile: "/run/unbound.pid"
  use-syslog: no
  logfile: ""
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
