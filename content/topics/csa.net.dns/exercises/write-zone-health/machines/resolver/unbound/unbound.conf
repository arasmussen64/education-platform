# The office's resolver: Unbound, recursive. Every machine in the office
# asks it for every name (their /etc/resolv.conf names 10.1.0.53); it asks
# the root, then test.'s server, then the zone's own servers, and keeps
# each answer for its TTL. This lab's zones aren't signed, so it checks no
# signatures.
server:
  interface: 0.0.0.0
  access-control: 10.1.0.0/24 allow
  access-control: 127.0.0.0/8 allow
  root-hints: "/etc/unbound/root.hints"
  module-config: "iterator"
  # Unbound answers every name under .test itself, as reserved for
  # testing; the lab's internet uses .test, so that is switched off.
  local-zone: "test." nodefault
  # A server that didn't answer is tried again after 60 seconds, not
  # Unbound's 900: after a boot, the name servers may start after this.
  infra-host-ttl: 60
  username: "unbound"
  chroot: ""
  pidfile: "/run/unbound.pid"
  use-syslog: no
  logfile: ""
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
