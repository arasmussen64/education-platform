id: debug-the-walk-goes-wrong
stage: debug
rev: 2
title: "The walk goes wrong"
prompt: |
  This program should walk down the curve `(x - 3) ** 2` from `x = 0` for 30 steps, estimating the slope numerically at each step, and print where it ends up, rounded to 2 decimal places:

  ```
  3.0
  ```

  Instead it prints `-590.94`. It has two bugs. Run it, fix what you find, and run it again: the number it prints changes as you go.
hints:
  - "The lowest point of `(x - 3) ** 2` is at `x = 3`. Is the walk getting closer to 3 or further away? Print `x` inside the loop to watch it."
  - "Downhill means against the slope: where the slope is negative, `x` should grow. Which way does `x = x + rate * slope` move it?"
  - "Once the walk heads the right way it stops at 2.5. At `x = 3` the slope is 0: what does the program's estimate give there?"
  - "The estimate `(f(x + h) - f(x)) / h` is only close to the true slope when `h` is tiny, like `0.000001`. With `h = 1` it's off by 1 everywhere."
skills: [descent, numeric-derivative]
