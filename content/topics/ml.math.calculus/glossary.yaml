- term: derivative
  definition: The slope of a function at one point, how fast its output changes as its input moves a little. Estimated in code as `(f(x + h) - f(x)) / h` with a tiny `h`.
- term: power rule
  definition: The derivative of `x ** n` is `n * x ** (n - 1)`. Bring the exponent down in front as a multiplier, then lower the exponent by one.
- term: gradient descent
  definition: Finding the lowest point of a function by repeating `x = x - rate * slope`. Each step goes against the slope, which is downhill, and the steps shrink as the slope nears zero.
- term: learning rate
  definition: The number that scales each step of gradient descent, `rate` in `x = x - rate * slope`. Too small is slow. Too large overshoots the bottom and can bounce away.
