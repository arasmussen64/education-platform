id: parsons-numeric-derivative
type: parsons
rev: 2
prompt: |
  Put the lines in order so the program estimates the slope of `x ** 3` at `x = 2` and prints `12.0`. One line is a decoy that doesn't belong.
lines:
  - 'def f(x):'
  - '    return x ** 3'
  - 'slope = (f(2 + 0.0001) - f(2)) / 0.0001'
  - 'print(round(slope, 2))'
distractors:
  - 'slope = (f(2 + 0.0001) - f(2)) * 0.0001'
explanation: |
  The slope between two nearby points is rise over run: the change in `f` **divided** by the small step, here 0.0001. With a step that small the estimate is close to the exact derivative, `3 * 2 ** 2`, which is 12. The decoy multiplies by the step instead of dividing, and gives nearly 0.
skills: [numeric-derivative]
