id: parsons-load-and-walk
type: parsons
rev: 2
prompt: |
  Put the lines in order so the program reads JSON text and prints `sql`. One line is a decoy that doesn't belong.
lines:
  - 'import json'
  - "data = json.loads('{\"user\": {\"name\": \"Cy\", \"langs\": [\"py\", \"sql\"]}}')"
  - 'langs = data["user"]["langs"]'
  - 'print(langs[1])'
distractors:
  - "data = json.load('{\"user\": {\"name\": \"Cy\", \"langs\": [\"py\", \"sql\"]}}')"
explanation: |
  `json.loads` reads a **string**; `json.load` reads an open file, and given a string it fails. Once loaded, the JSON object is a dict and the array a list, so square brackets walk down to the list of languages, and `[1]` is the second one.
skills: [json-io]
