id: debug-spread-report
stage: debug
rev: 2
title: "A spread that comes out zero"
prompt: |
  `summary(values, probs)` should return a table's mean, variance and standard deviation, where `values` are the outcomes and `probs` their chances. The program summarizes a fair die and a prize draw, and should print:

  ```
  die 3.5 2.9167 1.708
  prize 2.0 106.0 10.296
  ```

  Instead the means are right, but the variance and the standard deviation print as 0.0 (or -0.0) for both tables. It has two bugs. Run it, fix what you find, and run it again; then run the checks, which try `summary` on another table.
hints:
  - "Work the die's variance out by hand from the definition: it should be 2.9167. Which step of the definition is missing from `summary`?"
  - "Variance weights the squared distances from the mean. Unsquared, the weighted distances from the mean always add to zero: that's what makes the mean the balance point."
  - "The standard deviation is the square root of the variance, not half of it."
skills: [variance]
