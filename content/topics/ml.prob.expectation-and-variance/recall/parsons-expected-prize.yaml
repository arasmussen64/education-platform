id: parsons-expected-prize
type: parsons
rev: 2
prompt: |
  A lottery ticket pays 100 with chance 0.01 and nothing otherwise. Put the lines in order to print the expected prize, `1.0`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'values, probs = np.array([100.0, 0.0]), np.array([0.01, 0.99])'
  - 'expected = (values * probs).sum()'
  - 'print(expected)'
distractors:
  - 'expected = values.mean()'
explanation: |
  The second line names the two outcomes and their probabilities at once. The expected value weights each outcome by its probability: `100 * 0.01 + 0 * 0.99 = 1.0`, the long-run average per ticket, and the most such a ticket is worth paying. The decoy averages the two outcomes as if they were equally likely and prints 50.0.
skills: [expectation]
