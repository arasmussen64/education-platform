id: debug-tests-that-dont-test
stage: debug
rev: 2
title: "Three tests for add"
prompt: |
  This program has a correct `add`, three tests for it, and a loop at the bottom that runs the tests and counts them. It should print:

  ```
  3 passed
  ```

  Instead it stops with an `AssertionError`. It has two bugs. Run it, read what happens, fix what you find, and run it again. Keep all three tests: don't delete any.
hints:
  - "Read the error: which line failed? Work out `add(2, 3)` yourself. Is `add` wrong, or is the test?"
  - "A test's expected value has to be the right answer, and `add(2, 3)` is 5."
  - "Next it prints `2 passed`. The loop at the bottom runs only some of the functions: which ones, and which of the three doesn't qualify?"
  - "The loop runs every function whose name starts with `test_`, as pytest does, so `check_negative_numbers` never runs. Name it `test_negative_numbers`."
skills: [write-tests, assert]
