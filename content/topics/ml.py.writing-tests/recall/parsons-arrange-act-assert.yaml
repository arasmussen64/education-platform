id: parsons-arrange-act-assert
type: parsons
rev: 2
prompt: |
  Put the lines in order to write one test (arrange, act, assert) and run it. The test passes, and a passing test says nothing, so the finished program prints nothing. One line is a decoy that doesn't belong.
lines:
  - 'def test_total_of_two_items():'
  - '    cart = [2.5, 4.0]'
  - '    total = sum(cart)'
  - '    assert total == 6.5'
  - 'test_total_of_two_items()'
distractors:
  - '    assert total = 6.5'
explanation: |
  Arrange (`cart`), act (`sum`), assert (`== 6.5`): three lines, one behaviour. The decoy uses a single `=`, which is an assignment and isn't valid inside `assert`; a comparison needs `==`. The test is a function, so it runs only when called, on the last line. An `assert` that holds does nothing at all, which is why a passing test is silent; one that fails stops the program with an `AssertionError`.
skills: [write-tests, assert]
