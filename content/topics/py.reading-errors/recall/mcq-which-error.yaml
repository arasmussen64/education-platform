id: mcq-which-error
type: mcq
rev: 1
prompt: |
  A program stops with this message. What's wrong?

  ```
  Traceback (most recent call last):
    File "solution.py", line 2, in <module>
      print(total)
  NameError: name 'total' is not defined
  ```
choices:
  - 'Line 2 uses a name that was never given a value, or was spelled differently where it was'
  - 'Line 2 is missing a closing bracket'
  - '`print` can only show text, not numbers'
  - 'The program has no line 2'
answer: 0
explanation: |
  The last line names the error, `NameError`, and says the name `total` isn't defined. The line above says where: line 2. Python reached `total` without ever having given it a value, so either the line that defines it is missing or comes later, or it's spelled differently there.
skills: [read-traceback, error-kinds]
