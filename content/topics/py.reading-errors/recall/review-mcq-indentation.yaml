id: review-mcq-indentation
type: mcq
rev: 1
prompt: |
  A program stops with this message before anything is printed:

  ```
    File "solution.py", line 3
      print("Adult")
      ^
  IndentationError: expected an indented block after 'if' statement on line 2
  ```

  What should you do?
choices:
  - 'Remove the `if` on line 2'
  - 'Indent line 3, so it belongs to the `if` on line 2'
  - 'Add a colon to the end of line 3'
  - 'Move line 3 above line 2'
answer: 1
explanation: |
  After `if ...:` Python expects at least one indented line: that's the block that runs when the condition is `True`. Line 3 isn't indented, so Python reports an `IndentationError` and points at it. Indenting `print("Adult")` fixes it.
skills: [error-kinds]
