id: mcq-value-error
type: mcq
rev: 1
prompt: |
  This line runs and the person types `twenty`:

  ```python
  age = int(input("Age? "))
  ```

  Which error does Python report?
choices:
  - '`TypeError`: text can''t be turned into a number'
  - '`NameError`: `twenty` is not defined'
  - '`ValueError`: the text doesn''t look like a whole number'
  - '`SyntaxError`: `twenty` isn''t valid Python'
answer: 2
explanation: |
  `int()` is given text, which is the right *type*: it reads text all the time, like `"36"`. But the *value* `"twenty"` doesn't look like a whole number, so it's a `ValueError`: `invalid literal for int() with base 10: 'twenty'`. The typed text is never read as Python code, so there's no `NameError` or `SyntaxError`.
skills: [error-kinds]
