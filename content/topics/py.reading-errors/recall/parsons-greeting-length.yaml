id: parsons-greeting-length
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Hello, Ada` and then `10`. (`len(...)` counts the characters in a piece of text; you'll meet it properly in Module 3.) Two lines are decoys that don't belong.
lines:
  - 'name = "Ada"'
  - 'greeting = "Hello, " + name'
  - 'print(greeting)'
  - 'print(len(greeting))'
distractors:
  - 'print(greting)'
  - 'greeting = "Hello, " + nam'
explanation: |
  Each name has to be spelled the same way everywhere: `greting` and `nam` were never assigned, so either decoy would stop the program with a `NameError` naming the misspelled word. `len` counts the 10 characters of `Hello, Ada`.
skills: [error-kinds, read-traceback]
