id: mcq-which-line
type: mcq
rev: 1
prompt: |
  A program stops with this message. Where should you look first, and for what?

  ```
  Traceback (most recent call last):
    File "solution.py", line 4, in <module>
      print("Next year: " + age + 1)
  TypeError: can only concatenate str (not "int") to str
  ```
choices:
  - 'Line 4, for text and a number being added together'
  - 'Line 1, because errors come from the top of the program'
  - 'The last line of the program, because that''s where it stopped'
  - 'Anywhere: a traceback doesn''t say where the problem is'
answer: 0
explanation: |
  The traceback names the line, 4, and shows it. The last line says it's a `TypeError`: `+` was asked to join text (`str`) with a number (`int`), which it won't do. Either convert the number into text (`str(age + 1)`) or use an f-string.
skills: [read-traceback]
