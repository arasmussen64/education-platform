id: review-mcq-syntax-location
type: mcq
rev: 1
prompt: |
  A program stops with this message before anything is printed:

  ```
    File "solution.py", line 2
      name = input("Name? ")
      ^^^^
  SyntaxError: invalid syntax. Perhaps you forgot a comma?
  ```

  Line 2 looks fine. Where is the mistake most likely to be?
choices:
  - 'Nowhere: Python is wrong, run it again'
  - 'In the file''s name'
  - 'At the end of line 1, such as a missing closing bracket or quote'
  - 'On the last line of the program'
answer: 2
explanation: |
  A `SyntaxError` is reported where Python first *noticed* something wrong, which is often the line after the real mistake. If line 1 ends with a bracket or quote that was never closed, Python keeps reading onto line 2 and gives up there. Check the line before the one named.
skills: [read-traceback]
