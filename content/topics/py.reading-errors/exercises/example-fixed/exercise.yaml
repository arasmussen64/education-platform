id: example-fixed
stage: worked_example
rev: 1
title: "Three errors, fixed one at a time"
prompt: |
  This program works now, but its first version stopped three times before it ran. Press **Run** and type a name and an age, then read how each error was found and fixed.
steps:
  - label: "A SyntaxError, before anything ran"
    lines: "3"
    note: "The first version was missing the closing `\"` on this line. Python reported `SyntaxError` at line 3 before running a single line: it couldn't read the program. Adding the quote was the whole fix, and only then did the next error show."
  - label: "A NameError, at the line that used it"
    lines: "1"
    note: "Line 3 was then written as `{nmae}`. Running it printed the prompts and stopped: `NameError: name 'nmae' is not defined`, at line 3. The fix was to spell it as this line does: `name`."
  - label: "A TypeError, from a missing conversion"
    lines: "2"
    note: "This line used to read `age = input(\"Age? \")`, so `age` was text, and `age + 1` on line 3 stopped with `TypeError: can only concatenate str (not \"int\") to str`. The message points at line 3, but the fix belongs here: `int()`."
  - label: "One change, one run, each time"
    lines: "3"
    note: "Three runs, three different messages, three one-line fixes. Each message named the line to look at. Reading the last line of the traceback first made each fix take a minute."
