id: write-repeat
stage: write
rev: 1
title: "Say it again"
prompt: |
  Write a program that asks for a word and then how many times to repeat it (a whole number), and prints the word that many times on one line, with nothing in between. Typing `hi` and `3` should print:

  ```
  hihihi
  ```

  If you see an error, read its last line and the line number it names before changing anything.
hints:
  - "In Python, text times a whole number repeats the text: `\"ab\" * 3` is `\"ababab\"`."
  - "If you get `TypeError: can't multiply sequence by non-int of type 'str'`, both values are text: the number of times needs `int()`."
  - "Print the repeated text on its own, with nothing else in the `print`."
skills: [fix-routine]
