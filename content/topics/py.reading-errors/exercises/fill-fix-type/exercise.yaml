id: fill-fix-type
stage: fill_in
rev: 1
title: "Read the error, then fix the line"
prompt: |
  Press **Check** first, without changing anything, and read the error it reports. Then replace the `...` on line 2 so the program works. Typing `5` should print:

  ```
  Seconds: 300
  ```
hints:
  - "The error says a `TypeError` happened on line 3: `minutes * 60` mixed the wrong kinds of value. Line 3 is right, though: `minutes` is the wrong kind."
  - "Line 2 should turn the typed text into a whole number: `int(minutes)`."
skills: [fix-routine, error-kinds]
