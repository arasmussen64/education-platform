id: build-ten-years
stage: build
rev: 1
title: "Ten years from now"
prompt: |
  Starting from a blank editor, write a program that asks for a name and an age (a whole number), and prints one line saying how old that person will be in ten years. Typing `Ada` and `36` should print:

  ```
  Hello, Ada! In 10 years you'll be 46.
  ```

  Match the punctuation exactly. If a Check reports an error, read it the way this topic taught before changing anything.
skills: [fix-routine]
