prove:
  build: build-three-sites
  debug: debug-friday-change
  explain:
    prompt: |
      A colleague says: "Routing is simple: each router knows the whole path to every network, and if a link breaks, the network sorts itself out." Explain, in your own words: how a router decides where to send one packet, including what happens when several routes match and when two routes have the same prefix; why the reply is a separate decision, and what goes wrong when it takes a different path; when static routes are enough and when you'd want a routing protocol, including what each does when a link fails without going down; how you'd find where packets are disappearing, and two different causes you might find; and one way a cloud's route table chooses differently from a Linux router.
    rubric:
      - id: lpm
        required: true
        description: "Each router looks only at the destination address and knows only the next hop; the longest matching prefix wins, and the default route only when nothing else matches; for equal prefixes the route's source decides (administrative distance: connected before static before BGP), not the order of the lines."
      - id: return-path
        required: true
        description: "Each router decides alone, so the reply is routed afresh and may take another path; a stateful firewall that sees only one direction drops the connection (ping can still work), and strict reverse-path filtering drops replies arriving on the 'wrong' interface; fix with symmetric routes, or source NAT at the firewall."
      - id: static-dynamic
        required: true
        description: "Static routes suit a stub or a few routes, and need a floating backup at a higher distance to fail over; they react only to failures their own router sees (a link losing carrier), not to a path that dies silently; a routing protocol exchanges reachability with neighbours, notices one going quiet and reroutes, at the cost of more to run and understand."
      - id: black-hole-hunt
        required: true
        description: "A method: traceroute from the source, then ip route get (or the table) on the last router that answers and the next, tcpdump on either side; and at least two causes told apart by their evidence (no route: !N or Network is unreachable; blackhole or forwarding off: silence, with nstat's IpInAddrErrors for forwarding; a next hop that never answers ARP: a FAILED neighbour; a missing return route: requests arrive, replies don't; a loop: two hops alternating and Time to live exceeded)."
      - id: cloud-tables
        required: true
        description: "One correct cloud difference: AWS prefers a static route over a propagated one for the same prefix; Azure prefers user-defined, then BGP, then system routes, but keeps the virtual network's own routes even against a longer BGP route; Google Cloud uses subnet routes first and lets no static route match or fit inside one; or a VM must be allowed to forward (AWS's source/destination check, Azure's IP forwarding, Google's canIpForward)."
      - id: floating
        required: false
        description: "Floating static routes and their traps: distance 255 is never installed, and a static route that names only its next hop can stay alive through a wider route (a blackhole) when its cable goes, so it names its interface too."
    model_answer: |
      Each router knows much less than that. It looks at one thing, the packet's destination address, finds the routes in its table whose prefix holds that address, and uses the longest one: a /24 beats a /16 beats the default route, which is only for addresses nothing else holds. The order of the lines doesn't matter. If two routes have exactly the same prefix, the source of the route decides: each kind has an administrative distance, connected 0, static 1, eBGP 20 in FRR, and the lowest wins. Then the router hands the packet to the next hop and forgets it. Nobody holds the whole path: it's a chain of separate decisions.

      The reply is a new packet with its own destination, so every router on the way back decides again, and it may take another road. That breaks things that need to see both directions. A stateful firewall that sees the SYN but not the SYN-ACK drops the client's next packet as invalid, so the web app times out while ping still works, and conntrack shows the entry UNREPLIED. Strict reverse-path filtering drops replies that arrive on an interface the router wouldn't use to reach their source. The fixes are to make the routes symmetric, or to have the firewall source-NAT so the replies must come back through it, at the cost of the server no longer seeing the client's address.

      Static routes are enough for a stub with one way out or a handful of routes that never change. For a second path you add a floating static route with a higher distance, say 200 (never 255, which FRR never installs), and it takes over when the first route's link goes down. But a static route only knows what its own router sees: if the path dies while the link stays up, it keeps sending traffic into the hole. A routing protocol has neighbours tell each other what they can reach, notices a neighbour going quiet and reroutes, which is worth it with redundant paths and changing networks.

      To find where packets disappear I'd traceroute from the source to find the last hop that answers, then run ip route get on that router and the next, and tcpdump on the interfaces either side. A !N means a router has no route. Silence can be a blackhole route, where ip route get says Invalid argument, or forwarding switched off, where nstat's IpInAddrErrors climbs. If requests arrive at the server and replies leave but never get back, a router on the return path is missing its route. A FAILED entry in ip neigh means a route's next hop doesn't exist.

      Clouds differ too. In AWS, a static route beats a propagated one for the same prefix, but a longer propagated route still wins. Azure keeps a virtual network's own routes even over a more specific route learned over BGP.
