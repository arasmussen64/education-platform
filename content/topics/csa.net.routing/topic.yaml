skills:
  - id: longest-prefix-match
    description: "Predict the route and next hop for a destination from a real table: the longest matching prefix wins, the default only when nothing else holds the address, and an address can sit inside a short prefix and outside a longer one whose numbers look closer; for equal prefixes the route's source decides (FRR's distance; AWS, Azure and Google Cloud each in an order of their own)"
  - id: static-routes
    description: "Write static routes in FRR with their next hop and interface, floating backups at a higher distance (never 255), blackhole and reject routes, and save them with write memory; read FRR's RIB (`>*`, `[distance/metric]`) against the kernel's FIB (`ip route`, `ip route get`)"
  - id: static-or-dynamic
    description: "When static routes are enough and when a routing protocol is needed: what each does when a link fails loudly (carrier lost) or silently (link up, path dead), and how the clouds mix static route tables with routes propagated from gateways that speak BGP"
  - id: return-path
    description: "Every router decides alone, so a reply needs a route of its own back; asymmetric paths, why a stateful firewall that sees one direction drops the connection while ping works, and why strict reverse-path filtering drops replies; the two fixes"
  - id: find-the-black-hole
    description: "Find where packets die and why: no route, a blackhole, a reject route, forwarding off, a next hop that never answers ARP, a missing return route, a loop, ECMP with one dead path, a cloud VM not allowed to forward; with traceroute, `ip route get`, tcpdump, `ip neigh`, `nstat` and `sysctl`"
