id: csa.net.routing
kind: topic
status: ready
title: Routing
summary: "How a router decides where each packet goes, and how the reply finds its own way back: longest-prefix match, static routes and floating backups in FRR, when a routing protocol is worth it, asymmetric paths, and finding where packets vanish, with the three clouds' route tables side by side."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 26) and its designer's brief (csa.net.routing.md). Through
# csa.net.cidr this builds on csa.net.layers (ARP, ICMP, TTL, the network
# labs' machines, on and netlab) and csa.m1.checkpoint; for the writer,
# Module 1's net-tools (ip route, traceroute, tcpdump, nftables, ct state,
# conntrack, namespaces), scripting (the write lab) and hardening (a fix
# never weakens security). IPv6 isn't needed: longest-prefix match is the
# same there, which the lesson says in one sentence. This topic defines
# sysctl and /etc/sysctl.d/ for the module (the plan's section 3.7).
prerequisites: [csa.net.cidr]
# Worked out: the lesson about 23 minutes (3,000 words at 130 a minute),
# reading 37 (the main video 15, the Systems Approach's two sections 12, the
# cloud pages' sections 10), 24 recall items at 1.5 each 36, then the worked
# example 30, the fill-in 20, the write 30, the build 55, the debug 45 and
# the explain 20: 296.
estimated_minutes: 300
rev: 1
objectives:
  - "Read a routing table (Linux's `ip route`, FRR's `show ip route`, an AWS, Azure or Google Cloud route table) and say where a packet to a given address goes and why: the longest matching prefix, the default route only when nothing else matches, and which source wins when two routes have the same prefix."
  - "Write static routes in FRR, with floating backups, blackhole and reject routes, tie each to its interface, save them, and tell the router's candidate routes (its RIB) from the ones the kernel forwards with (its FIB)."
  - "Say when static routes are enough and when a routing protocol is needed, from what each does when a link fails loudly or silently, and how the clouds mix static route tables with routes learned over BGP."
  - "Remember that the reply is a separate routing decision, recognise an asymmetric path, and explain what it breaks (a stateful firewall, strict reverse-path filtering) and how to fix it."
  - "Find where packets disappear with traceroute, `ip route get`, `ip neigh`, tcpdump and counters, and name the cause from the evidence, including a router whose forwarding is off and a cloud VM that isn't allowed to forward."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - FRR 8.4's administrative distances (connected 0, static 1, eBGP 20,
#   OSPF 110, IS-IS 115, RIP 120, iBGP 200) and "An admin distance of 255
#   indicates to Zebra that the route should not be installed into the Data
#   Plane"; next-hop tracking "doesn't resolve nexthops via the default route
#   by default" (ip nht resolve-via-default, off):
#   https://docs.frrouting.org/en/stable-8.4/zebra.html
# - FRR's static routes: ip route NETWORK GATEWAY|IFNAME [DISTANCE], blackhole
#   (silent) and reject (ICMP unreachable); its example's "null0 255"
#   blackhole, which disagrees with the zebra page:
#   https://docs.frrouting.org/en/stable-8.4/static.html
# - AWS route priority: longest prefix, then static, then prefix-list, then
#   propagated (Direct Connect BGP, VPN static, VPN BGP); "If the destination
#   of a propagated route is identical to the destination of a static route,
#   the static route takes priority"; more specific routes win "irrespective
#   of whether they are propagated routes, static routes, or routes that
#   reference prefix lists":
#   https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html
# - Azure: longest prefix, then user-defined over BGP over system; "System
#   routes for traffic related to virtual network, virtual network peerings,
#   or virtual network service endpoints are preferred routes. They're
#   preferred, even if BGP routes are more specific"; None drops traffic;
#   400 UDRs per route table by default; a NIC that forwards for other
#   addresses "must have the Azure Enable IP forwarding option enabled", and
#   the OS may need forwarding too; the "Routing example" table for Subnet1
#   (ms.date 2026-03-31, updated 2026-09-16):
#   https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
# - Google Cloud's routing order: subnet routes used exclusively when they
#   match, and no static route may exactly match or fit within a subnet
#   route; then the most specific destination; then priority; no ECMP across
#   preference categories; an empty route set drops the packet with ICMP
#   type 3 code 0 (last updated 2026-10-26):
#   https://docs.cloud.google.com/vpc/docs/routes
# - Google Cloud: a VM used as a next hop needs canIpForward (--can-ip-forward,
#   at creation or by updating the instance) and forwarding in the guest
#   (last updated 2026-11-07): https://docs.cloud.google.com/vpc/docs/using-routes
# - AWS: "Each EC2 instance performs source/destination checks by default
#   ... Therefore, you must disable source/destination checks on the NAT
#   instance": https://docs.aws.amazon.com/vpc/latest/userguide/work-with-nat-instances.html
# - Linux: ip_forward "its change resets all configuration parameters to
#   their default state"; rp_filter 0 none, 1 strict (RFC 3704), 2 loose, the
#   higher of conf/all and the interface used; fib_multipath_hash_policy 0
#   layer 3, 1 layer 4: https://docs.kernel.org/networking/ip-sysctl.html
# - Azure on asymmetric routing: stateful devices drop the flows they didn't
#   see start; the two fixes are routing and source NAT (ms.date 2026-03-12):
#   https://learn.microsoft.com/en-us/azure/expressroute/expressroute-asymmetric-routing
