# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: router
  definition: A machine whose job is passing packets from one network to another. It reads each packet's destination, looks it up in its routing table and hands it to the next hop.
- term: routing table
  definition: A router's list of routes, each a prefix, a next hop and an interface. On Linux, `ip route` shows the kernel's.
- term: next hop
  definition: The neighbouring router, or the destination itself, that a route hands a packet to, one step closer to where it's going.
- term: longest-prefix match
  aliases: [longest prefix match]
  definition: How a router chooses among the routes that hold an address, taking the one with the longest prefix, the smallest block. The order of the table's lines doesn't matter.
- term: default route
  definition: The route for 0.0.0.0/0 (or ::/0), which holds every address, so it's used only when no more specific route matches.
- term: static route
  definition: A route a person typed in. It knows only what its own router can see, so it notices a cable going but never a path that dies silently.
- term: administrative distance
  definition: A number for each source of routes (in FRR, connected 0, static 1, eBGP 20, OSPF 110), lowest winning, used to choose between routes for exactly the same prefix.
- term: ECMP
  aliases: [equal-cost multipath]
  definition: Equal-cost multipath, two or more routes for the same prefix that tie on everything, with each connection sent down one of them, chosen by a hash of its addresses and ports.
- term: routing protocol
  definition: A way for routers to tell their neighbours the routes they know and keep talking, so they reroute by themselves when a neighbour goes quiet. OSPF and BGP are two.
