#!/usr/sbin/nft -f
# r2, the inspection firewall between the office's router (r1) and the data
# centre's (r3). New connections from the office to the stock app, and
# pings, are let through; anything else gets through only as part of a
# conversation r2 has already seen start.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid counter drop
        ip saddr 10.1.0.0/24 ip daddr 10.3.0.0/24 tcp dport 8080 ct state new accept
        ip saddr 10.1.0.0/24 ip daddr 10.3.0.0/24 icmp type echo-request accept
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
