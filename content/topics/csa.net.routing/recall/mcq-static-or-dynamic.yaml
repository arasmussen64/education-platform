id: mcq-static-or-dynamic
type: mcq
rev: 1
prompt: |
  Which of these networks most needs a routing protocol rather than static routes?
choices:
  - "Six sites joined in a ring, two paths between any two, where links fail a few times a year"
  - "A branch office with one router and one link back to head office, and nothing else"
  - "A cloud subnet whose only way out is a NAT gateway inside the same virtual network"
  - "A lab of three routers in a line, with no spare links, that hasn't changed in years"
answer: 0
explanation: |
  A routing protocol earns its keep where there is a second path to move to and failures happen: its routers keep telling each other what they can reach, notice when a neighbour goes quiet, and move traffic round the break, including breaks a static route can't see because the link still looks up. Six sites in a ring have two ways between any two, and their links fail.

  The other three have one way out each: a branch with one link (a stub), a subnet whose every packet leaves through one gateway, a line of routers with nothing spare. With nowhere else to go, a protocol has nothing to choose between, and a few static routes are simpler, easier to read and never change by themselves. Static routes suit a stub, a handful of routes, or a route that must never move.
skills: [static-or-dynamic]
