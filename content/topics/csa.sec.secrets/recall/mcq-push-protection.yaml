id: mcq-push-protection
type: mcq
rev: 1
prompt: |
  GitHub's push protection refuses a push that holds a secret it recognises. According to GitHub's documentation (read 2026-11-23), where is it on without anyone switching it on?
choices:
  - "For users, when they push to a public repository"
  - "For every repository of an organization, public or private"
  - "For private repositories only, since public ones are scanned afterwards"
  - "Nowhere: it is a paid feature that an owner must enable"
answer: 0
explanation: |
  GitHub has two kinds. Push protection for users "is enabled by default" and stops that user pushing secrets to public repositories. Push protection for repositories "is disabled by default": an administrator or owner has to enable it for a repository or an organization, private ones included.

  Either way it is a guard that can be argued with: by default, anyone with write access can bypass it by giving a reason, which makes an alert and an audit-log entry. So it is GitHub's version of a server-side hook, with a door in it. It catches formats GitHub knows, and the reason to still scan yourself is your own formats and your own rules.
skills: [scan-for-leaks]
