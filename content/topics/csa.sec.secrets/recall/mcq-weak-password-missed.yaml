id: mcq-weak-password-missed
type: mcq
rev: 1
prompt: |
  A file holds two lines, and gitleaks 8.16 with its built-in rules reported one finding, on line 2 (captured in this topic's lab, 2026-11-23):

  ```
  db_password = "Summer2026!"
  api_key = "8f3a...40 random hex digits..."
  ```

  Why did the real password on line 1 get through?
choices:
  - "It doesn't look random enough for the general rule, which goes by entropy"
  - "gitleaks reads only lines that have the word `key` or `token` in them, and line 1 has neither"
  - "Passwords inside double quotes are taken to be test data and skipped"
  - "The scan stops at the first finding in a file, and line 2 was read first"
answer: 0
explanation: |
  A scanner has two kinds of rule. Specific rules know a format: an AWS key ID starts `AKIA`, a GitHub token `ghp_`, a private key has its `-----BEGIN` line. Those are found reliably. The general rule (`generic-api-key`) looks for a word like `key`, `secret` or `password` next to a string, and then asks how random the string looks, its entropy: 40 hex digits look random, and `Summer2026!` looks like a word and a year. So the general rule passed over it. That is a false negative, and it's the kind scanners are worst at: passwords people choose.

  Line 1 does have a keyword (`password`), quotes make no difference, and gitleaks reports every finding in a file. The lesson to keep: a clean scan means "no secret that looks like one", not "no secret".
skills: [scan-for-leaks]
