id: mcq-secret-mount-left
type: mcq
rev: 1
prompt: |
  A recipe has this step, and the image is built with `podman build --secret id=pkg,src=/tmp/token.txt ...`:

  ```
  RUN --mount=type=secret,id=pkg wget -q -O /opt/shop-lib.txt --header "Authorization: Bearer $(cat /run/secrets/pkg)" http://127.0.0.1:8081/shop-lib.txt
  ```

  After the build, what of the token is in the image?
choices:
  - "Nothing: no layer holds it, and the history shows only the command"
  - "The token itself, inside the layer that this `RUN` step added to the image"
  - "The token itself, in the image's environment settings"
  - "A whiteout file in the last layer that names the token"
answer: 0
explanation: |
  A secret mount shows the secret to one build step as a file, `/run/secrets/pkg`, for as long as that step runs. The file is mounted over the step, not written into it, so it is in no layer; and the history records the command as written, `$(cat /run/secrets/pkg)` and all, not what the shell made of it. The lab's check searched the saved image for the token as text, as base64 and as hex, in every layer, the history and the settings, and found nothing.

  That holds as long as the step doesn't copy the secret somewhere itself: `cp /run/secrets/pkg /opt/` would put it in the layer like any other file. A whiteout appears only when a later layer deletes a file from an earlier one, which never happened here.
skills: [keep-secrets-out]
