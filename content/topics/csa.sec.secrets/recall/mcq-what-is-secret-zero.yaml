id: mcq-what-is-secret-zero
type: mcq
rev: 1
prompt: |
  A team moves every password out of its config files into a secrets manager. Their new problem is called "secret zero". What is it?
choices:
  - "The first credential an application needs before it can ask for the others"
  - "The most sensitive secret stored in the manager, which is guarded hardest"
  - "A secret whose value is all zeros, used as a placeholder in tests"
  - "The first secret to be rotated when a breach is discovered"
answer: 0
explanation: |
  The secrets manager won't hand a database password to just anyone: the application has to prove who it is, and whatever it proves that with is a credential too. If that credential is a token in a file beside the application, the team has swapped twenty static secrets for one static secret that opens the other twenty. That first credential is secret zero, and the secrets manager has one of its own as well: the key that unseals it.

  Hiding it better doesn't solve it. What solves it is not having a stored secret at that step: the platform that started the workload vouches for it (a cloud's metadata service, a signed workload token), or a trusted deployer hands over a credential that works once and for a few minutes.
skills: [secret-zero]
