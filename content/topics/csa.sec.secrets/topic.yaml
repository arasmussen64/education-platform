skills:
  - id: keep-secrets-out
    description: "Where secrets leak: code and git history, image layers and history (a build argument, an ENV line, a file removed by a later step), command lines, environment variables, unit files and `systemctl show`, logs; who can read each; and where a secret belongs: a file only the service's user can read, a systemd credential, a build's secret mount, a secrets manager's key-value store"
  - id: scan-for-leaks
    description: "How a scanner decides (format rules, and a keyword beside a high-entropy string); `gitleaks detect` over a history, `--log-opts`, `--no-git`, `--redact`, a rule of your own and an allowlist; a pre-receive hook that scans every pushed commit with the server's settings, and why a clone's settings can't be trusted; push protection; verification; what scanners miss"
  - id: rotate-and-revoke
    description: "The order after a leak (revoke, replace, read the record, clean up, find the cause); rotating without downtime with two keys or two users in turn; how long a leaked secret could be used, as arithmetic; AWS Secrets Manager, Azure Key Vault and Google Secret Manager side by side"
  - id: secret-zero
    description: "The first credential and why hiding it doesn't solve it; platform identity (a metadata service, a signed workload token) validated by the secrets manager and bound to one subject and audience; AppRole with a single-use, wrapped SecretID from a trusted deployer; the manager's own unseal key: shares, auto-unseal with a cloud KMS, and the labs' key file"
  - id: dynamic-secrets
    description: "The database engine: a connection, a role with its creation SQL and lifetimes, rotating the root credential, leases, renewal up to the maximum, revoking by prefix; OpenBao Agent signing in and writing credentials to a file; least privilege in the database itself; the lifetime arithmetic"
