id: csa.sec.secrets
kind: topic
status: ready
title: Secrets
summary: "Passwords, API keys and tokens, and where they go wrong: every place a secret leaks (git history, image layers, command lines, the environment, logs) and who can read each; scanners, and the one place a scan can't be skipped; what to do in the first hour after a leak, and rotating without downtime; the secret-zero problem and how a workload gets its first credential; and dynamic secrets, which expire before a thief can use them."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections
# 2, 3, 4.2 and 5) and its designer's brief (csa.sec.secrets.md), with the
# vault base as it was built (content/lab-bases/vault/README.md) and the
# plan's build notes.
# The plan's prerequisites: csa.sec.crypto, which owns OpenBao's first
# words (bao, path, token, policy, the transit engine, the audit log), the
# KMS, HMAC and envelope encryption, and whose first lab carries the
# "Before your first key-service lab" note this topic points back to; and
# csa.sec.federation, which owns what a signed token is and how one is
# validated (issuer, subject, audience, expiry, the signature against the
# issuer's key), on which this topic's answer to secret zero rests.
# Through them it builds on csa.sec.authn-authz (least privilege, policy,
# workload identity in a sentence), csa.linux.boot (the metadata service's
# temporary role credentials), csa.linux.containers (images, layers,
# whiteouts), csa.linux.services (units, Environment=, journalctl),
# csa.linux.permissions (file modes, groups, sudo) and csa.linux.processes
# (ps, /proc).
# This topic defines, for the module (the plan's 3.5): secret, secret
# sprawl, secrets manager, the minimum of git (repository, commit, hook),
# build secret, secret scanner, rotation, secret zero, AppRole, response
# wrapping, the unseal key and auto-unseal, dynamic secret and its lease,
# OpenBao Agent. Three words the plan's table gives it are defined as
# longer phrases, because the short ones already mean something else in
# earlier lessons, where the app would mark them with this topic's
# definition: "git commit" (not "commit"), "secret rotation" (log
# rotation is Module 1's) and no entry for "lease" alone (DHCP's leases
# are Module 3's) or "seal" alone (Applied cryptography's labs seal
# orders).
prerequisites: [csa.sec.crypto, csa.sec.federation]
# Worked out: the lesson about 42 minutes (5,500 words with its tables,
# code and recap, at 130 a minute; it is long because it also teaches
# the minimum of git, which no earlier topic used), 16 practice quick
# questions at 1.5 each 24, then the worked example 45 (it gained a part
# on dynamic credentials, so that the build isn't the first time the
# learner sets the database engine up), the fill-in 25, the write 35, the
# build 55, the debug 45 and the explain 20: about 291, and the puzzle
# and the story about 5 more. The plan's 310 counted 50 minutes of
# assigned reading, which is optional now (ADR-0031, step 3) and so left
# out.
estimated_minutes: 295
rev: 1
objectives:
  - "Find where a secret has leaked on a server and in its software (a repository's history, an image's layers and history, a process's command line and environment, a unit file, the journal), say who can read each, and put the secret where it belongs: a file only the service's user can read, a build's secret mount, a secrets manager."
  - "Catch leaks with a scanner: over a repository's whole history, and in a hook on the git server that nobody pushing can skip and no pushed settings can silence; add a rule for a format of your own, and say what scanners miss."
  - "Answer a leak in the right order (revoke, replace, read the record, clean up, find the cause), rotate a secret without downtime with two keys in turn, and work out how long a leaked secret could be used."
  - "Explain the secret-zero problem, and how a workload should get its first credential: the platform vouches for it with a signed token bound to that workload and audience, or a trusted deployer hands over a single-use wrapped credential; and how a secrets manager's own key is protected."
  - "Replace a static database password with dynamic secrets: a role that makes short-lived accounts on request, the admin password rotated so that only the secrets manager knows it, an agent that keeps the credentials fresh in a file; and say how the three clouds' secrets managers rotate."
