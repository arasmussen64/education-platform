prove:
  build: build-shop-without-static-secrets
  debug: debug-the-export-leaks
  explain:
    prompt: |
      A teammate says: "Secrets are fine as long as they're not in the code. We pass them as environment variables, keep the real values in a vault, and rotate them once a year." Explain, in your own words: where secrets leak besides code, and who can read each place; what you'd do in the first hour after a key turns up in a public repository; how a scanner fits in, and where it can't be skipped; what the secret-zero problem is and how a workload should get its first credential; and what dynamic secrets change, with what is still static and how it's protected.
    rubric:
      - id: leak-paths
        required: true
        description: "Besides code: git history (every commit, in every clone, after the file is deleted); image layers and history (a build argument, an ENV line, a file a later step removed); command-line arguments (every user of the machine, through ps); environment variables (the process's user and root, every child process, crash reports and debug output); unit files (Environment= is readable by all, and systemctl show prints it); logs. A secret belongs in a file only the service's user can read, a build's secret mount, or a secrets manager."
      - id: first-hour
        required: true
        description: "Revoke first, because nothing else makes a leaked secret harmless: rewriting history or hiding the repository doesn't reach the copies already made. Then give the service a new secret, read the provider's record for what the old one was used for, clean up, and find how it got there. A secret that has been anywhere it shouldn't be is replaced, not trusted."
      - id: scanning
        required: true
        description: "A scanner finds known formats by their shape and general secrets by a keyword beside a random-looking string, so it misses weak passwords (false negatives). It must read the whole history, not the newest files. A hook on a developer's machine can be skipped; a pre-receive hook on the git server can't, and it scans with settings kept on the server, not ones that arrive in the push. Hosted push protection does the same and can be bypassed with a reason."
      - id: secret-zero
        required: true
        description: "Every secrets manager needs a first credential from its caller, and a token in a file beside the app is one static secret that opens all the rest. The answer is identity, not hiding: the platform that runs the workload vouches for it (a metadata service, a signed workload token), and the manager checks the signature, issuer, audience and which workload the token names, bound exactly. Where there is no platform identity, a trusted deployer delivers a single-use wrapped credential, and a failed unwrap is an alarm. The manager's own key is protected by people's shares or a cloud KMS."
      - id: dynamic
        required: true
        description: "A dynamic secret is made on request, for one workload, with a lease: it expires within minutes or hours, can be revoked at once (all of a role's at a time), and names the workload in the database's logs. A leaked one is usually dead before anyone reads it. What stays static is the manager's own admin credential at the database, rotated so that only the manager knows it, the manager's unseal key, and the platform's signing key: few, and guarded hardest."
      - id: clouds
        required: false
        description: "AWS Secrets Manager runs rotation itself (managed, or a Lambda function, as often as every four hours; single user or alternating users). Azure Key Vault sends a near-expiry event 30 days ahead and your function rotates. Google Secret Manager sends a SECRET_ROTATE message on a schedule and rotates nothing itself. All three prefer a platform identity to a stored secret."
    model_answer: |
      "Not in the code" is where it starts, not where it ends. A secret that was ever committed is in the repository's history, in every clone, even after the file is deleted. One that was a build argument is in the image's history, and a file that a later build step removed is still in the earlier layer. A secret passed on a command line can be read by every user of the machine with `ps`. Environment variables are better than that but not good: the process's own user and root can read them, every program it starts inherits them, and debug output and crash reports print them; put in a unit file with `Environment=`, they are readable by everyone. And programs log things: one debug line with a header in it and the secret is in the journal and wherever the journal is shipped. So environment variables aren't the answer. A secret should reach a program as a file only its own user can read, reach a build as a secret mount, and live in a secrets manager.

      If a key turns up in a public repository, the first thing I'd do is revoke it at the service it belongs to. Nothing else helps: I can't call back the copies, and rewriting history or making the repository private doesn't reach them. Then I'd give the service a new key, read the provider's record of what the old key did while it was out, clean up the repository, and work out how it got there. Rotating once a year is no use here: a leaked key would work for half a year on average.

      A scanner looks for secrets by their shape (known key formats) and by a keyword next to a random-looking string, so it finds API keys well and weak passwords badly. It has to read the whole history. A scan on each developer's machine helps and can be skipped; the place it can't be skipped is a hook on the git server that refuses any push with a secret in any of its commits, using settings kept on the server, since a clone's own settings file can be changed by the push itself.

      Keeping the values in a vault moves the problem: the app needs a credential to ask the vault, and if that's a token in a file, it is one secret that opens all the others. That's secret zero. The real answer is to have nothing stored at that step: the platform that runs the workload signs a short-lived token saying which workload it is, and the vault checks the signature, the issuer, the audience and the exact workload named. Without that, a trusted deployer can hand over a credential that works once, wrapped, so that if anyone else opens it first the app notices. The vault's own key is held as shares by people or unsealed by a cloud key service.

      Dynamic secrets change the whole picture: the vault makes a database account for each workload on request, good for an hour, and drops it afterwards. If one leaks it is usually dead before anyone reads it, all of them can be revoked with one command, and the database's logs name the workload. What is still static is small: the vault's admin account at the database, rotated so that nobody but the vault knows it, the vault's own key, and the platform's signing key.

      On the clouds: AWS Secrets Manager can run rotation for you, down to every four hours; Azure Key Vault and Google Secret Manager send an event and your own code does the rotating. All three would rather you used the platform's identity than a stored secret.
