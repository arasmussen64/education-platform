id: fill-count-vowels
stage: fill_in
rev: 1
title: "Count the vowels"
prompt: |
  This program should ask for a word in lower case and print how many vowels (`a`, `e`, `i`, `o`, `u`) it has. Replace each `...`: the loop that visits every character, and the condition that spots a vowel. Typing `education` should print:

  ```
  5
  ```
hints:
  - "The loop is `for ch in word:`. Each pass, `ch` is the next character."
  - "A character is a vowel if it equals one of the five letters. Join the comparisons with `or`, each one complete: `ch == \"a\" or ch == \"e\" or ...`."
skills: [loop-chars]
