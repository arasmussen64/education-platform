title: "First, last and half"
prompt: |
  This program asks for a word and prints its first character, its last character, and its first half (for a word with an odd number of letters, the smaller half). Typing `python` should print:

  ```
  First: p
  Last: n
  Half: pyt
  ```

  and `loops` should print `l`, `s` and `lo`. It has three bugs, and one of them crashes the program. Read the error first, then check each line against the example.
skills: [index, slice]
