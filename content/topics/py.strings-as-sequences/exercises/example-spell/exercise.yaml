id: example-spell
stage: worked_example
rev: 1
title: "Spell it out"
prompt: |
  This program takes a word apart: its first and last characters, a slice, and then every character on its own line with its position. Press **Run**, then change the word on line 1 to `"loop"` and run it again.
steps:
  - label: "One character at a time"
    lines: "1-3"
    note: "Positions count from 0, so `word[0]` is the first character. `word[-1]` counts from the end, so it's the last character however long the word is."
  - label: "A slice"
    lines: "4"
    note: "`word[1:4]` is the characters at positions 1, 2 and 3. The stop position, 4, is left out, just as `range(1, 4)` stops before 4."
  - label: "Walking along the string"
    lines: "5-9"
    note: "`for ch in word` gives each character in turn. The loop keeps its own count, `position`, so each line can show where the character sits. `len(word)` after the loop is the number of characters, which is also where `position` ends up."
