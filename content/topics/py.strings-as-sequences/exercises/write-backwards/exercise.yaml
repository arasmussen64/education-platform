id: write-backwards
stage: write
rev: 1
title: "Backwards"
prompt: |
  Write a program that asks for a word and prints it backwards, using a loop. Typing `stressed` should print:

  ```
  desserts
  ```
hints:
  - "Start with an empty string, `backwards = \"\"`, before the loop."
  - "Each pass, put the new character in *front* of what you have: `backwards = ch + backwards`. The first character ends up last."
  - "Print the result once, after the loop."
skills: [loop-chars]
