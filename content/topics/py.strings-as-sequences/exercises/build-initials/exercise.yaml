id: build-initials
stage: build
rev: 1
title: "Initials"
prompt: |
  Starting from a blank editor, write a program that asks for a full name, with the names separated by single spaces, and prints the initials: the first character of each name, run together. Typing `Ada King Lovelace` should print:

  ```
  AKL
  ```

  A single name prints its first character.
skills: [index, loop-chars]
