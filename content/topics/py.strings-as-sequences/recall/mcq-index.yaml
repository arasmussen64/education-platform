id: mcq-index
type: mcq
rev: 1
prompt: |
  With `word = "garden"`, what is `word[2]`?
choices:
  - '`"a"`'
  - '`"r"`'
  - '`"ga"`'
  - '`"gar"`'
answer: 1
explanation: |
  Positions count from 0: `g` is at 0, `a` at 1 and `r` at 2. A single index gives a single character, never a piece of the string; that's what slices are for.
skills: [index]
