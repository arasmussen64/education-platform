id: review-predict-walk
type: predict_output
rev: 1
prompt: |
  Trace this loop and say what it prints: one line.
code: |
  text = "banana"
  count = 0
  doubled = ""
  for ch in text:
      if ch == "a":
          count += 1
          doubled = doubled + ch + ch
  print(count, doubled)
expected_output: |
  3 aaaaaa
explanation: |
  The loop visits each character of `banana` in turn. Three of them are `a`; for each, `count` goes up by 1 and two copies of the character are added to `doubled`. The other characters are skipped, so `doubled` ends as six `a`s.
skills: [loop-chars]
