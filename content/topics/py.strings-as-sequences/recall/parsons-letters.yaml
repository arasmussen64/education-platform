id: parsons-letters
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `p`, then `n`, then `yt`. One line is a decoy that doesn't belong.
lines:
  - 'word = "python"'
  - 'print(word[0])'
  - 'print(word[-1])'
  - 'print(word[1:3])'
distractors:
  - 'print(word[6])'
explanation: |
  Positions start at 0, so `word[0]` is p; `-1` counts from the end, so it's n; the slice `1:3` takes positions 1 and 2, `yt`. `word[6]` is one past the last position (5), an `IndexError`.
skills: [index, slice]
