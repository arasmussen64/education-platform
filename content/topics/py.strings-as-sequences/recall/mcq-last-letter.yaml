id: mcq-last-letter
type: mcq
rev: 1
prompt: |
  `word` holds a word the user typed, of any length. Which expression is the last character, whatever the word?
choices:
  - '`word[len(word)]`'
  - '`word[-1]`'
  - '`word[5]`'
  - '`word[len(word) + 1]`'
answer: 1
explanation: |
  Negative indexes count from the end, so `word[-1]` is always the last character. `word[len(word) - 1]` works too. `word[len(word)]` is one past the end and raises an `IndexError`, and `word[5]` is the sixth character, which only happens to be the last one for six-letter words.
skills: [index]
