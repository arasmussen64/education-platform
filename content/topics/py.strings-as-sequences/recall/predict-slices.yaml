id: predict-slices
type: predict_output
rev: 1
prompt: |
  What does this program print? Four lines.
code: |
  word = "notebook"
  print(word[0:4])
  print(word[4:])
  print(word[-1], len(word))
  print(word[:2] + word[-2:])
expected_output: |
  note
  book
  k 8
  nook
explanation: |
  `word[0:4]` is positions 0 to 3, `note`. `word[4:]` runs from position 4 to the end, `book`. `word[-1]` is the last character, `k`, and the string has 8 characters. `word[:2]` is `no` and `word[-2:]` is the last two characters, `ok`; `+` joins them into `nook`.
skills: [slice, index]
