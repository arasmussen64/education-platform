id: review-mcq-negative
type: mcq
rev: 1
prompt: |
  With `word = "stream"`, which expression gives `"rea"`?
choices:
  - '`word[2:4]`'
  - '`word[3:6]`'
  - '`word[2:5]`'
  - '`word[-3:]`'
answer: 2
explanation: |
  `r` is at position 2, `e` at 3 and `a` at 4, so the slice starts at 2 and stops before 5: `word[2:5]`. `word[2:4]` stops too early (`re`), `word[3:6]` is `eam`, and `word[-3:]` is the last three characters, also `eam`.
skills: [slice, index]
