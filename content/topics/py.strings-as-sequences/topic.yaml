id: py.strings-as-sequences
kind: topic
status: ready
title: "Strings as sequences"
summary: "Index, slice and loop over the characters of a string."
prerequisites: [py.for-and-range]
estimated_minutes: 40
rev: 1
objectives:
  - "Pick one character out of a string with `[i]`, counting from 0, and from the end with negative indexes; measure a string with `len()`."
  - "Take part of a string with a slice, `[start:stop]`, knowing the stop position is left out."
  - "Loop over a string's characters with `for ch in text`, counting or building a new string as you go."
resources:
  - title: "The Python Tutorial: An Informal Introduction to Python, the Text section (Python Software Foundation)"
    url: https://docs.python.org/3/tutorial/introduction.html#text
    type: reading
    use: link
    license: PSF License Version 2
  - title: "Python Tutor: watch a loop walk along a string, one character at a time"
    url: "https://pythontutor.com/visualize.html#code=word%20%3D%20%22loop%22%0Acount%20%3D%200%0Afor%20ch%20in%20word%3A%0A%20%20%20%20print%28ch%29%0A%20%20%20%20if%20ch%20%3D%3D%20%22o%22%3A%0A%20%20%20%20%20%20%20%20count%20%2B%3D%201%0Aprint%28count%29&cumulative=false&curInstr=0&heapPrimitives=true&mode=display&origin=opt-frontend.js&py=311&rawInputLstJSON=%5B%5D&textReferences=false"
    type: interactive
