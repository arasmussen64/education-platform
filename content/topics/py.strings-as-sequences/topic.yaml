practice:
  - example-spell
  - parsons-letters
  - mcq-index
  - predict-slices
  - mcq-last-letter
  - fill-count-vowels
  - write-backwards
prove:
  build: build-initials
  debug: debug-middle
  explain:
    prompt: |
      A friend writes `word[len(word)]` to get the last letter of `word = "python"` and gets `IndexError: string index out of range`. In your own words: how are the characters of a string numbered, why is that index one too far, what are two ways to get the last letter, and what does `word[1:3]` give and why?
    rubric:
      - id: zero-based
        required: true
        description: "Positions count from 0, so the characters of a 6-letter word are at 0 to 5."
      - id: last-letter
        required: true
        description: "The last letter is word[len(word) - 1] or word[-1]; len(word) itself is one past the end."
      - id: slice
        required: true
        description: "word[1:3] is \"yt\": it starts at position 1 and stops before position 3."
      - id: negative
        required: false
        description: "Negative indexes count from the end: -1 is the last character, -2 the one before."
    model_answer: |
      Python numbers the characters of a string from 0, so in "python" p is at 0, y at 1, and the last letter, n, is at 5. len(word) is 6, the number of characters, which is one past the last position, so word[6] is out of range. The last letter is word[len(word) - 1], or more simply word[-1], because negative indexes count back from the end. A slice like word[1:3] starts at position 1 and stops before position 3, so it gives the two characters at 1 and 2: "yt". The stop position is left out, the same way range stops before its end value.
review_pool:
  - review-predict-walk
  - review-mcq-negative
  - review-code-count-letter
  - mcq-index
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: index
    description: "Pick one character with `[i]`, counting from 0 or from the end with negatives, and measure with `len()`"
  - id: slice
    description: "Take part of a string with `[start:stop]`, where the stop position is left out"
  - id: loop-chars
    description: "Loop over a string's characters with `for`, counting or building a new string"
