- term: reference
  definition: The link from a name to a value. A name doesn't hold its value; it refers to it, and several names can refer to the same one.
- term: alias
  definition: A second name for the same value. After `b = a`, `a` and `b` are aliases for one list, so a change made through either name shows through both.
- term: mutation
  aliases: [mutate]
  definition: Changing a value itself, as `append`, `del` and `sort` change a list, without making a new value. Every name that refers to the value sees the change.
- term: in place
  definition: Said of a change made to the existing value, with no new value built. `items.sort()` sorts in place; `sorted(items)` builds a new list.
- term: mutable
  definition: Able to be changed in place. Lists and dictionaries are mutable.
