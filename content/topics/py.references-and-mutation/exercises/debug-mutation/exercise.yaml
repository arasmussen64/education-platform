title: "A shopping list that keeps changing"
prompt: |
  This program should print:

  ```
  ['milk', 'tea']
  ['milk', 'eggs']
  ['milk']
  ```

  `backup` is meant to be a snapshot of the list as it was; `add_item` promises a new list and an unchanged original. It has three bugs, all about which names share a list and what `append` gives back. Trace it with the arrows in mind.
skills: [mutating-functions, copying, aliasing]
