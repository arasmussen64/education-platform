id: review-code-appended
stage: review_code
rev: 1
title: "Appended, as a new list"
prompt: |
  Write a function `appended(items, value)` that returns a **new** list with `value` added at the end, leaving the list it's given unchanged. `appended([1, 2], 3)` returns `[1, 2, 3]`, and `appended([], "a")` returns `["a"]`.
skills: [mutating-functions, copying]
