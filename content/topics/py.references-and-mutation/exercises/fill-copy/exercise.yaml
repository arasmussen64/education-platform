id: fill-copy
stage: fill_in
rev: 1
title: "Keep the original"
prompt: |
  This program should print the original list as it was, then a sorted version of it. Replace the `...` so that `ordered` is a **copy** of `original`, so sorting it leaves `original` alone. Running it should print:

  ```
  [3, 1, 2]
  [1, 2, 3]
  ```
hints:
  - "`ordered = original` would make a second name for the same list, and sorting it would sort `original` too."
  - "Make a new list with the same items: `list(original)`, `original[:]` or `original.copy()`."
skills: [copying, aliasing]
