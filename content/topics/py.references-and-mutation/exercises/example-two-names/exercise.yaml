id: example-two-names
stage: worked_example
rev: 1
title: "Two names, one list; one name, a copy"
prompt: |
  One list, a second name for it, and a copy of it. Press **Run** and check each printed line against what you expected. Then open the lesson's first Python Tutor link and watch the same thing as arrows.
steps:
  - label: "A second name"
    lines: "1-2"
    note: "`same = scores` copies nothing. It gives the one list a second name. Python Tutor draws it as two arrows to one box."
  - label: "A copy"
    lines: "3"
    note: "`list(scores)` builds a new list with the same items. From here on, `copy` and `scores` are two separate lists that happen to match."
  - label: "Change through each name"
    lines: "4-5"
    note: "Appending through `same` grows the shared list, so `scores` grows too. Appending to `copy` touches only the copy."
  - label: "Same list, or just equal?"
    lines: "6-10"
    note: "The first two prints are the same list seen twice. `is` asks whether two names refer to one list: `True` for `same`, `False` for `copy`, even though `copy` started out equal."
