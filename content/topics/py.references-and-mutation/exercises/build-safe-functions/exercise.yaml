id: build-safe-functions
stage: build
rev: 1
title: "Functions that leave their list alone"
prompt: |
  Starting from a blank editor, write two functions with docstrings. Each returns a **new** list and leaves the list it's given unchanged:

  - `add_bonus(scores, bonus)` returns the scores with `bonus` added to each.
  - `without_lowest(scores)` returns the scores without the first occurrence of the smallest one, in their original order. The list has at least one item.

  Then `main()` prints, for the scores `[70, 55, 90]`:

  ```
  With bonus: [75, 60, 95]
  Without lowest: [70, 90]
  Original: [70, 55, 90]
  ```

  The last line proves the original survived both calls. Call `main()` at the bottom.
skills: [mutating-functions, copying, aliasing]
