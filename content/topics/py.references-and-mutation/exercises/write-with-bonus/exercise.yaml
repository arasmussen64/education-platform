id: write-with-bonus
stage: write
rev: 1
title: "A bonus, without touching the original"
prompt: |
  Write a function `with_bonus(scores, bonus)` that returns a **new** list with `bonus` added to every score, leaving the list it's given exactly as it was. `with_bonus([70, 80], 5)` returns `[75, 85]`, and `with_bonus([], 5)` returns `[]`.
hints:
  - "Build a new list: start with `[]`, loop over the scores, append each score plus the bonus."
  - "Never assign to `scores[i]` here: that would change the caller's list."
skills: [mutating-functions]
