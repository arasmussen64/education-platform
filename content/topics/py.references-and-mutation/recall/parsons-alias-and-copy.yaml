id: parsons-alias-and-copy
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `[1, 2, 3, 4] [1, 2, 3, 4, 5]`. One line is a decoy that doesn't belong.
lines:
  - 'original = [1, 2, 3]'
  - 'alias = original'
  - 'alias.append(4)'
  - 'copy = list(original)'
  - 'copy.append(5)'
  - 'print(original, copy)'
distractors:
  - 'copy = original'
explanation: |
  `alias = original` makes a second name for the same list, so appending through `alias` changes `original` too. `list(original)` makes a real copy, taken after the 4 was added, so it has four items and then gets its own 5. `copy = original` would be another alias, and both names would show the 5.
skills: [aliasing, copying]
