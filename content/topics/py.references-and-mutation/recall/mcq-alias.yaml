id: mcq-alias
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  a = [1, 2, 3]
  b = a
  b.append(4)
  print(a)
  ```
choices:
  - '`[1, 2, 3]`'
  - '`[1, 2, 3, 4]`'
  - '`[4]`'
  - 'An error: `a` can''t be changed through `b`'
answer: 1
explanation: |
  `b = a` doesn't copy the list; it gives the same list a second name. `b.append(4)` changes that one list, and `a` refers to it too, so `a` shows four items. To get an independent list, copy it: `b = list(a)`.
skills: [aliasing]
