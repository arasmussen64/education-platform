id: review-predict-alias
type: predict_output
rev: 1
prompt: |
  What does this program print? Two lines. Watch the difference between changing the list and pointing a name somewhere else.
code: |
  scores = [70, 80]
  backup = scores
  scores[0] = 99
  print(backup)
  backup = [1]
  print(scores)
expected_output: |
  [99, 80]
  [99, 80]
explanation: |
  `backup = scores` makes two names for one list, so replacing item 0 through `scores` shows in `backup`. `backup = [1]` then points `backup` at a brand-new list; that changes where the name points, not the old list, so `scores` still shows `[99, 80]`.
skills: [aliasing]
