id: mcq-function-changes
type: mcq
rev: 1
prompt: |
  Which of these functions changes the list that the caller passes in?
choices:
  - |
    ```python
    def f(items):
        items.append(1)
    ```
  - |
    ```python
    def g(items):
        items = items + [1]
    ```
  - |
    ```python
    def h(items):
        return items + [1]
    ```
  - |
    ```python
    def k(items):
        total = sum(items)
    ```
answer: 0
explanation: |
  `append` changes the list in place, and `items` is the caller's list under another name, so the caller sees the extra item. `g` builds a new list and points its own `items` at it, which the caller never sees. `h` returns a new list and leaves the argument alone, and `k` only reads the list.
skills: [mutating-functions]
