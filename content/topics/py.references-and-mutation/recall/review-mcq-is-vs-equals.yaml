id: review-mcq-is-vs-equals
type: mcq
rev: 1
prompt: |
  After these two lines, what are `x == y` and `x is y`?

  ```python
  x = [1, 2]
  y = [1, 2]
  ```
choices:
  - '`True` and `True`'
  - '`True` and `False`'
  - '`False` and `True`'
  - '`False` and `False`'
answer: 1
explanation: |
  `==` compares contents: both lists hold 1 and 2, so it's `True`. `is` asks whether they are the very same list: each line built its own list, so it's `False`. Appending to `y` would not change `x`. After `y = x`, both would be `True`.
skills: [copying]
