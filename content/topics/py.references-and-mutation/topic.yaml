  - mcq-alias
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: aliasing
    description: "Predict what happens when two names refer to one list and it's changed through either"
  - id: copying
    description: "Make a real copy with `list()`, a slice or `copy()`, and tell `==` from `is`"
  - id: mutating-functions
    description: "Tell a function that changes its argument from one that returns a new list, and prefer the second"
