prove:
  build: build-safe-functions
  debug: debug-mutation
  explain:
    prompt: |
      A friend expected `queue` to be unchanged after this, but it prints `['Bob', 'Cy']`:

      ```python
      def remove_first(items):
          del items[0]
          return items

      queue = ["Ada", "Bob", "Cy"]
      served = remove_first(queue)
      print(queue)
      ```

      In your own words: what does the parameter `items` refer to while the function runs, and why did `del` change `queue`? Does `return items` give back a copy? How would you write a version that leaves `queue` as it was? And what is `served is queue` here, and why?
    rubric:
      - id: same-object
        required: true
        description: "The argument is passed by assignment: items refers to the very same list as queue, not a copy."
      - id: mutation-visible
        required: true
        description: "del changes that one list, and the change shows through every name that refers to it, so queue is shorter too."
      - id: fix
        required: true
        description: "Make a new list first (items[1:], or list(items) and then del) and return that, leaving the original alone."
      - id: identity
        required: true
        description: "served is queue is True, because return items hands back the same list, not a copy."
    model_answer: |
      Calling remove_first(queue) assigns the list to the parameter: items and queue are two names for one list; nothing is copied. del items[0] changes that list, and because queue refers to the same list, queue sees the change too. return items doesn't copy either; it hands back the same list, so served is queue is True. To leave queue alone, the function has to make a new list and work on that: return items[1:], which builds a new list of everything but the first item, or copy with list(items) and delete from the copy. The rule of thumb: a function either changes the list it's given and returns None, like append, or returns a new list and leaves the original alone. Doing both at once is what surprised your friend.
