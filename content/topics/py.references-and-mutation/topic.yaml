id: py.references-and-mutation
kind: topic
status: ready
title: "References and mutation"
summary: "Two names can refer to one list; know when a change shows through both, how to copy, and which functions change what they're given."
prerequisites: [py.lists]
estimated_minutes: 45
rev: 1
objectives:
  - "Predict what happens when two names refer to the same list and one of them is used to change it."
  - "Make a real copy of a list when you need one, and tell `==` (same contents) from `is` (the very same list)."
  - "Tell a function that changes the list it's given from one that returns a new list, and prefer writing the second kind."
