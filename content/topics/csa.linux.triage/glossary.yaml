- term: USE method
  definition: "Brendan Gregg's checklist for a slow system: for every resource, check its utilisation (how busy), saturation (is work queuing) and errors."
- term: run queue
  definition: "The tasks ready to run and waiting for a CPU; `r` in `vmstat`. More than the number of CPUs means tasks are waiting."
- term: retransmit
  definition: "A TCP packet sent again because no acknowledgement came back in time, a sign of packets lost or a congested path."
- term: flame graph
  definition: "A picture of profiling data in which each bar is a function and its width is the share of CPU time spent in it and the functions it called."
- term: device-mapper
  definition: "The kernel layer that builds a disk on top of other disks, such as LVM's logical volumes, named `/dev/dm-0`, `/dev/dm-1` and so on."
