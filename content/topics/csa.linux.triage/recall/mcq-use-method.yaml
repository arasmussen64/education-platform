id: mcq-use-method
type: mcq
rev: 2
prompt: |
  What does the USE method ask you to check, and for what?
choices:
  - "Utilisation, saturation and errors, for the application first: its requests, threads and queues"
  - "Usage, speed and efficiency, for the server as a whole, summed up in one figure to track over time"
  - "Utilisation, saturation and errors, for every resource in turn: CPUs, memory, disks, interfaces"
  - "Uptime, swap and errors, for the kernel: how long it has run, what it swapped and what it logged"
answer: 2
explanation: |
  The method's value is that it's a complete checklist: by the time you've asked the three questions of every resource, you've looked everywhere, instead of at whatever you suspected first. Utilisation is how busy; saturation is work queueing because the resource can't keep up; errors are failures. The resources are physical: each CPU, memory, each disk, each network interface. "The application" isn't one of them: that's where you go afterwards, once you know which resource is short. The method never sums the server up in one figure, because an average is exactly what hides one saturated CPU or disk. And uptime and swap are things some of the commands show, not what the letters stand for.
skills: [use-method]
