id: mcq-use-method
type: mcq
rev: 1
prompt: |
  What does the USE method ask you to check, and for what?
choices:
  - "Users, Services and Errors, for the application"
  - "Utilisation, Saturation and Errors, for every resource in turn: each CPU, memory, each disk, each network interface"
  - "Uptime, Swap and Entropy, for the kernel"
  - "Usage, Speed and Efficiency, for the whole server as one number"
answer: 1
explanation: |
  The method's value is that it's a complete checklist: by the time you've asked the three questions of every resource, you've looked everywhere, instead of at whatever you suspected first. Utilisation is how busy; saturation is work queueing because the resource can't keep up; errors are failures. The resources are physical: CPUs, memory, disks, interfaces, not "the application", which is where you go afterwards.
skills: [use-method]
