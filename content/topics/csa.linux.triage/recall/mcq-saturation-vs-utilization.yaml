id: mcq-saturation-vs-utilization
type: mcq
rev: 1
prompt: |
  Server A's four CPUs show 95% utilisation and a run queue (`r` in `vmstat`) of 3. Server B's show 60% utilisation and a run queue of 14. Which is in trouble, and why?
choices:
  - "A: 95% means it's nearly out of CPU"
  - "B: a run queue far above the CPU count means tasks are waiting to run (saturation), which is what makes things slow, even though utilisation is lower; A is busy but keeping up"
  - "Both equally; utilisation is what matters"
  - "Neither; the run queue is only about disk"
answer: 1
explanation: |
  Utilisation says how busy a resource was; saturation says whether work queued up. Fourteen runnable tasks on four CPUs means ten are waiting at any moment, and every request on B waits its turn. A at 95% with three runnable tasks has a CPU free most of the time. The same logic applies to disks (queue size and await over utilisation) and networks (drops over throughput): look for the queue, not the gauge.
skills: [use-method]
