id: mcq-on-off-cpu
type: mcq
rev: 2
prompt: |
  Two slow processes. Process A is at 190% CPU. Process B is at 2% CPU but each request takes seconds. Which tool first, for each?
choices:
  - "`strace -c` for A, to see which functions are busy; `perf top` for B, to see which calls it waits in"
  - "`perf top` for both: a profiler shows where the time goes, whether a process is busy or waiting"
  - "`strace -c` for both: system calls are where every process spends its time, busy or waiting"
  - "`perf top` for A, to see which functions are busy; `strace -c` for B, to see which calls it waits in"
answer: 3
explanation: |
  A is busy on the CPU, so the question is which code is running: `perf top -p PID` (or `perf record -g` and a flame graph) shows which functions the time goes to. B is slow without using CPU, so it's waiting, on a disk, a socket, a lock or a sleep: `strace -c -p PID` summarises its system calls, their total time and their errors, and `strace -T` prints each call's duration, so a 1.7-second `connect` or a slow `fsync` stands out. Swapped round, each tool has little to show: a profiler samples what is running on the CPU and finds almost nothing in a process that's waiting, and `strace` sees only system calls, not the functions inside the program where a busy process spends its time. `strace` also slows what it traces, so use it briefly; `perf` is light enough for production.
skills: [cpu-profiling]
