id: mcq-mpstat-single-core
type: mcq
rev: 2
prompt: |
  A dashboard shows an 8-CPU server at 13% CPU, yet its API is slow and `vmstat` shows a run queue of 2 to 3. `mpstat -P ALL 1` shows CPU 3 at 100% and the others nearly idle. What's going on?
choices:
  - "CPU 3 is faulty and runs its work slowly; taking it offline moves the work to the healthy seven"
  - "One single-threaded process fills one CPU and can't use the others; the average hides it"
  - "The kernel has put every process on CPU 3 by mistake; a reboot spreads them over all eight again"
  - "The dashboard is right and the CPUs are fine at 13%; the slowness must be in the disk or network"
answer: 1
explanation: |
  An average over eight CPUs turns one saturated CPU into 12.5%, which looks healthy; the per-CPU view is why `mpstat -P ALL` is on the checklist. A program that can only use one thread is limited by that one CPU, and adding CPUs changes nothing; running more worker processes or making the program multi-threaded does. `pidstat -t 1` and `top -H` show threads, so you can see which one is pinned. So the dashboard's 13% is true and still misleading: one CPU flat out under a program that can't use the others is CPU trouble, and there's no need to look to the disk or the network yet. A CPU at 100% is one doing work at full speed, not a faulty one. And the kernel spreads runnable tasks across CPUs by itself; what it can't do is split one thread over several.
skills: [use-method, first-minute]
