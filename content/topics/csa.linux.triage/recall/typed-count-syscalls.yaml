id: typed-count-syscalls
type: typed
rev: 1
prompt: |
  Process 4321 answers slowly but uses hardly any CPU: it's waiting on something. Type the `strace` command that attaches to it and counts its system calls, their time and their errors, with `sudo` in front if you like.
kind: command
answers:
  - "sudo strace -c -p 4321"
  - "strace -c -p 4321"
  - "sudo strace -p 4321 -c"
  - "strace -p 4321 -c"
  - "sudo strace -cp 4321"
  - "strace -cp 4321"
mistakes:
  - id: perf-for-busy
    answers: ["sudo perf top", "perf top"]
    why: "`perf top` shows which code is burning CPU, for a busy process. This one is waiting, and waiting happens inside system calls."
  - id: no-count
    answers: ["sudo strace -p 4321", "strace -p 4321"]
    why: "That prints every call as it happens, a fast-scrolling stream. `-c` counts them and prints a summary when you press Ctrl-C."
explanation: |
  A busy process wants `perf`, to see which code runs; a waiting one wants `strace`, to see what it's asking the kernel for. `-p 4321` attaches to the running process and `-c` counts each system call, its total time and its errors, printing the table when you stop it. `strace` slows the process it watches, so keep it short.
skills: [cpu-profiling]
