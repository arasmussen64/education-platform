id: mcq-first-minute-order
type: mcq
rev: 1
prompt: |
  In the sixty-second checklist, why does `dmesg -T | tail` come second, right after `uptime`?
choices:
  - "Because it's the slowest command"
  - "Because the kernel's recent messages (an OOM kill, a disk timeout, a network error) can name the cause outright before any measuring, and they're easy to miss later once you're deep in numbers"
  - "Because `dmesg` restarts the kernel log"
  - "Because it shows the load average more precisely than `uptime`"
answer: 1
explanation: |
  Errors are the E in USE, and `dmesg` is where the kernel reports them. Ten seconds reading its tail can save the rest of the hour: "Killed process 4321 (java)" or "nvme1: I/O timeout" is the answer, not a clue. `-T` prints human-readable timestamps so you can tell a message from ten seconds ago from one from last week. The rest of the list then measures utilisation and saturation per resource.
skills: [first-minute]
