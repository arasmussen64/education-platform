id: mcq-retransmits
type: mcq
rev: 2
prompt: |
  A service's requests to a database are slow, the database server itself is idle, and `sar -n ETCP 1` on the application server shows a steady 150 retransmits per second. What does that point to, and what would you check next?
choices:
  - "Packets are being lost on the path between the two; check drops and errors on both interfaces"
  - "The database answers too slowly, so TCP resends the queries; check its slow-query log and indexes"
  - "Too many connections are being opened: `retrans/s` counts new ones, so check `active/s` as well"
  - "Nothing is wrong with the network: TCP always resends some packets, and 150 a second is normal"
answer: 0
explanation: |
  A retransmit is TCP's reaction to a segment that was never acknowledged: wait, then send it again. A few per second is noise; a steady hundred and fifty means something between the two servers is dropping packets or the path is congested, and each loss adds at least a round trip to a request. TCP resends because a packet went missing, not because the other side's answer is slow to come, and the database is idle anyway, so the delay is in transit. `retrans/s` counts segments sent again; new connections are a different counter (`active/s`, from `sar -n TCP`). Next, check for drops and errors on both interfaces (`sar -n EDEV`, `ip -s link`), the link's utilisation (`sar -n DEV`) and the path between them (`mtr`). A wrong MTU or a congested switch are the usual culprits, and if the loss is beyond the two hosts, take the numbers to the network team.
skills: [network-errors]
