id: csa.linux.triage
kind: topic
status: ready
title: "Performance triage"
summary: "When a server is slow, find out why in minutes instead of guessing: the USE method (utilisation, saturation, errors, for every resource), the sixty-second checklist, and reading vmstat, iostat, pidstat, sar, strace and perf to see where the time goes."
prerequisites: [csa.linux.memory, csa.linux.cpu, csa.linux.storage, csa.linux.net-tools, csa.linux.scripting]
estimated_minutes: 220
rev: 1
objectives:
  - "Apply the USE method: for each resource (CPU, memory, disks, network), check utilisation, saturation and errors, and say why saturation, not utilisation, is the sign of trouble."
  - "Run the sixty-second checklist (`uptime`, `dmesg -T`, `vmstat 1`, `mpstat -P ALL 1`, `pidstat 1`, `iostat -xz 1`, `free -m`, `sar -n DEV 1`, `sar -n TCP,ETCP 1`, `top`) and read what each line is for."
  - "Read `iostat -xz` for a saturated disk: `%util`, `await` and the queue size."
  - "Choose between `perf` (where CPU time goes) and `strace` (which system calls, how long, how many errors), and read a `perf report` and a `strace -c` summary."
  - "Read `sar -n DEV` and `sar -n ETCP` for a saturated interface and for retransmits, and say what retransmits mean."
