# The recall items read dmesg, vmstat, iostat, pidstat, strace -c, perf
# report and sar output with the text tools of the first topic. The worked
# example, the fill-in, the write and both proofs are labs on a slow server
# with real load: a CPU-pegging worker to find with the checklist, and a
# runaway burning a CPU in failing system calls to catch with strace. The
# labs lean on the signals that are reliable in a container (per-process and
# per-cgroup CPU, strace); disks and the network are in the lesson and the
# recall (ADR-0017, ADR-0018). The write and the build are scripts written
# from a blank file with strict mode, a default argument and an array,
# which is why "Shell scripting" is a prerequisite; services and sudo come
# with Memory and CPU, which need them too.
