# Settings for shop-sync, which copies changed products to the search page.
# shop-sync reads this file when it starts, so restart it after a change.

# How many workers copy products at once. The search page needs all 32 to
# keep up with the catalogue.
WORKERS=32

# The debug trace. When it is on, every worker writes a record of each
# product it handles straight to disk, in TRACE_DIR, and waits until the
# record is there. Nothing reads the records but a person investigating.
# Switched on 2026-10-02 for ticket 4127 (stale search results), which was
# closed on 2026-10-09.
TRACE=on
TRACE_DIR=/srv/data/sync-trace
