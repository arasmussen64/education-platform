# The data disk's allowance. On a cloud, a network disk is provisioned for
# so many writes a second, and every program on the server that writes to
# it shares them. On the lab machine the disk is a file on your computer,
# which would take far more, so this slice holds the shop's writes to it,
# all together, to what the disk is provisioned for: 100 writes a second.
# The setting names /dev/lab/data-backing, the device the data disk is
# built on, so that a write which has to wait does its waiting inside the
# data disk, where iostat shows it. This is the disk's limit, not a fault:
# it stays exactly as it is.
[Slice]
IOWriteIOPSMax=/dev/lab/data-backing 100
