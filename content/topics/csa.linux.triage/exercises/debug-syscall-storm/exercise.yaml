id: debug-syscall-storm
stage: debug
runtime: lab
lab:
  init: systemd
rev: 2
title: "The runaway that's eating a CPU"
prompt: |
  This server is slow. One CPU is pegged, yet no real work is getting done. The shop runs two services here, and one of them is healthy and must stay running.

  One process is behind it. Find it, and find out what it is doing with a whole CPU: a good part of its time goes on asking the kernel for the same thing, over and over, and being refused every time. Then stop it in a way that lasts: it must not be back a second later, and it must not start again at the next boot. Last, leave a note of a line or two for the next person in `~/triage/finding.txt`: the name of the service at fault, and the name of the system call that fails every time it is made.

  Work down from the whole machine to the one process, as the first-minute checklist does. Then run the checks.
hints:
  - "Start with the whole machine and narrow down: `vmstat 1` for how the CPU time splits, `pidstat 1` or `ps -eo pid,comm,%cpu --sort=-%cpu` for which process, and `systemctl status PID` for the service that process belongs to."
  - "To see what a process asks the kernel for, count its system calls for a few seconds: `sudo timeout 3 strace -c -f -p PID`. The table it prints has a `calls` and an `errors` column; one call fails every time it is made."
  - "Killing the process isn't enough when its service is set to restart it. Stop the service itself, and take it out of the next boot as well: `sudo systemctl disable --now NAME`. Then check the other service is still `active`."
skills: [first-minute, cpu-profiling, use-method]
