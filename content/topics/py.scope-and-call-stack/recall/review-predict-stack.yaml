id: review-predict-stack
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: three lines.
code: |
  def step(n):
      print("step", n)
      return n * 10


  def pair(n):
      first = step(n)
      second = step(n + 1)
      return first + second


  print(pair(2))
expected_output: |
  step 2
  step 3
  50
explanation: |
  `pair(2)` calls `step(2)`, which prints `step 2` and returns 20; then `step(3)`, which prints `step 3` and returns 30. `pair` adds them and returns 50, which the outer `print` shows. Two calls to the same function, each with its own `n`, one after the other.
skills: [call-stack]
