id: review-predict-shadow
type: predict_output
rev: 1
prompt: |
  What does this program print? Two lines.
code: |
  total = 100


  def spend(amount):
      total = amount * 2
      return total


  print(spend(5))
  print(total)
expected_output: |
  10
  100
explanation: |
  Assigning to `total` inside `spend` makes a new local `total`, which holds 10 and is returned. The global `total` is a different variable, untouched, so the last line prints 100. Same name, two variables.
skills: [local-global]
