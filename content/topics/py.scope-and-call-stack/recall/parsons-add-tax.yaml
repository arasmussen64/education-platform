id: parsons-add-tax
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `12.0`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'def add_tax(price):'
  - '    total = price * 1.2'
  - '    return total'
  - 'cost = add_tax(10)'
  - 'print(cost)'
distractors:
  - 'print(total)'
explanation: |
  `total` is local to `add_tax`: it exists only while the function runs, so the value has to come out through `return`. `print(total)` outside the function would be a `NameError`. The caller keeps the result as `cost` and prints that.
skills: [local-global, pass-dont-reach]
