id: predict-same-name
type: predict_output
rev: 1
prompt: |
  What does this program print? Two lines. The function and the outer code both use a variable called `n`.
code: |
  def change(n):
      n = n + 10
      print("inside", n)


  n = 1
  change(n)
  print("outside", n)
expected_output: |
  inside 11
  outside 1
explanation: |
  The call points the function's own `n`, a local variable, at the same value `1` that the outer `n` refers to. Nothing is copied: for a moment, two names refer to one value. Then `n = n + 10` points the local `n` at a new number, 11, which the first line prints. The outer `n` is a different variable and still refers to 1. To change the outer value, the function would have to `return n` and the caller would store it.
skills: [local-global, pass-dont-reach]
