id: mcq-local-dies
type: mcq
rev: 1
prompt: |
  What happens when this program runs?

  ```python
  def double(n):
      result = n * 2
      return result

  print(double(4))
  print(result)
  ```
choices:
  - 'It prints `8`, then `8`'
  - 'It prints `8`, then stops with `NameError: name ''result'' is not defined`'
  - 'It prints `8`, then `None`'
  - 'It prints `8`, then `4`'
answer: 1
explanation: |
  `result` is made inside `double`, so it's local: it exists only while the call runs and is gone once `double` returns. The first `print` shows the returned `8`. The second line asks for `result` outside the function, where no such name exists. To use the value outside, store what the function returns: `answer = double(4)`.
skills: [local-global]
