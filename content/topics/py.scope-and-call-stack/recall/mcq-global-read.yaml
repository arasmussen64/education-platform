id: mcq-global-read
type: mcq
rev: 1
prompt: |
  What happens when this program runs?

  ```python
  rate = 1.1

  def with_tax(price):
      return price * rate

  print(with_tax(10))
  ```
choices:
  - 'A `NameError`: `rate` isn''t defined inside the function'
  - 'It prints `10`: `rate` is ignored inside the function'
  - 'It prints `11.0`: a function can read a variable defined outside it'
  - 'An `UnboundLocalError`'
answer: 2
explanation: |
  Reading a global variable inside a function is allowed, so `rate` is found and the function returns `11.0`. What a function can't do is *change* a global by assigning to it: `rate = 1.2` inside the function would make a new local `rate` instead. Even so, the clearer habit is to pass `rate` in as a parameter.
skills: [local-global]
