prove:
  build: build-describe-average
  debug: debug-scope
  explain:
    prompt: |
      This program prints `50 60`:

      ```python
      def add_bonus(score):
          score = score + 10
          return score

      score = 50
      new_score = add_bonus(score)
      print(score, new_score)
      ```

      Explain it step by step for a friend who expected `60 60`: which `score` is which, how the value got into the function and how the new one got out, and what would happen if the line `score = 50` were deleted. Would the function itself still work?
    rubric:
      - id: two-scores
        required: true
        description: "The parameter score is a separate, local name; score = score + 10 changes only the function's own score, so the outer one stays 50."
      - id: in-and-out
        required: true
        description: "The value gets in as an argument (the call passes 50) and comes out with return, which the caller stores as new_score."
      - id: deletion
        required: true
        description: "The function would still work, because it uses only its parameter; the call line would fail with a NameError, because the outer score no longer exists."
      - id: stack
        required: false
        description: "While add_bonus runs, the outer code waits; when it returns, its own names are gone."
    model_answer: |
      There are two different variables called score. One is made at the top level by score = 50. The other is the function's parameter: a local name that exists only while add_bonus runs. The call add_bonus(score) copies the value 50 into that local score. Inside, score = score + 10 makes the local score 60; the outer one isn't touched, because a function can't change a variable outside itself by assigning to a name. The new value comes out through return, and the caller stores it as new_score. So the print shows 50 and 60. If score = 50 were deleted, the function would be fine, since it only uses its parameter, but the line add_bonus(score) would fail with a NameError: there would be no outer score to pass in. While the function runs, the outer code waits; when it returns, its local score disappears.
