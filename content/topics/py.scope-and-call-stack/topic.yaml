id: py.scope-and-call-stack
kind: topic
status: ready
title: "Scope and the call stack"
summary: "Know which variables a function can see, pass values in and out instead of reaching for globals, and trace calls on the stack."
prerequisites: [py.return-values]
estimated_minutes: 45
rev: 1
objectives:
  - "Tell a local variable (made inside a function, gone when it returns) from a global one (made outside every function), and know what a function can and can't do with each."
  - "Pass values into a function as arguments and out with `return`, instead of reaching for variables outside it."
  - "Trace nested calls on the call stack: each call waits for the one it made, and each has its own variables."
