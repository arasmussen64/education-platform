id: write-pure
stage: write
rev: 1
title: "A discount, from its parameters alone"
prompt: |
  Write a function `apply_discount(price, percent)` that returns the price after taking `percent` percent off, rounded to 2 decimal places. For example, `apply_discount(100, 25)` returns `75.0` and `apply_discount(19.99, 15)` returns `16.99`. The function must use only its two parameters: no variables from outside it, and no printing.
hints:
  - "The discount is `price * percent / 100`. Take it off the price."
  - "`round(value, 2)` rounds to 2 decimal places. Return the rounded result."
  - "Everything the function needs comes in through `price` and `percent`, so it gives the right answer whoever calls it, with whatever values."
skills: [pass-dont-reach]
