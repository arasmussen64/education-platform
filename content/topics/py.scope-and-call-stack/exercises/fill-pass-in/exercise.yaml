title: "Pass it in"
prompt: |
  `total_with_tax` uses a variable called `rate` that lives inside `main`, which it can't see. Fix it the right way: give the function a second parameter, and pass the rate in at the call. Replace each `...`. Running the program should print `120.0`.
hints:
  - "Add `rate` to the function's parameters: `def total_with_tax(price, rate):`."
  - "Then the call must pass it: `total_with_tax(100, rate)`. Inside the function, `rate` now means whatever was passed in."
skills: [pass-dont-reach, local-global]
