id: build-describe-average
stage: build
rev: 1
title: "Describe an average"
prompt: |
  Starting from a blank editor, write:

  - `average(a, b)`, which returns the average of two numbers (a float, like `6.0`);
  - `describe(a, b)`, which returns the text `The average of 4 and 8 is 6.0`, using `average` to work the number out;
  - `main()`, which prints `describe(4, 8)` and then `describe(3, 4)`.

  Call `main()` at the bottom. Neither `average` nor `describe` prints anything, and each uses only its own parameters, so they work whoever calls them, with whatever numbers.
skills: [pass-dont-reach, call-stack, local-global]
