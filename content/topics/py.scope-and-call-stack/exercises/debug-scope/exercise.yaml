title: "A plant that won't grow"
prompt: |
  This program should print:

  ```
  The plant is 15 cm tall
  ```

  It has three bugs, all about values that don't make it from one function to another. Trace it: when `grow` changes `plant_height`, whose variable is that? Where does `message` live? Fix it without the `global` keyword: pass values in and return them out.
skills: [local-global, pass-dont-reach, call-stack]
