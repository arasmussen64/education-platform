id: review-code-in-range
stage: review_code
rev: 1
title: "In range?"
prompt: |
  Write a function `in_range(value, low, high)` that returns `True` when `value` is between `low` and `high`, including both ends, and `False` otherwise. It uses only its parameters and prints nothing. For example, `in_range(5, 1, 10)` and `in_range(10, 1, 10)` return `True`; `in_range(0, 1, 10)` returns `False`.
skills: [pass-dont-reach, local-global]
