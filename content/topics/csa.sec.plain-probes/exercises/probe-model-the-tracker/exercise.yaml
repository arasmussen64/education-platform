id: probe-model-the-tracker
stage: build
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Probe: a threat model of a drivers' app"
prompt: |
  A probe for the threat-model lab base's CI trial, not a lesson: the Threat modeling topic will teach this.

  `~/design.md` describes a parcel company's drivers' app: four parts, three flows, what is already in place, and the scales to rate with. Read it (`less ~/design.md`), then write the threat model in `~/model.tm` (`nano ~/model.tm`), one fact a line, in the lab's format. `tm-check --help` shows the format and the kinds of control.

  The model needs:

  1. The zones, elements and flows the design names. Two parts share a zone only when one organisation runs both on one network.
  2. Every flow that crosses a boundary reviewed for all six STRIDE letters: a `threat` line for what can go wrong, a `none` line with a reason for the rest.
  3. Each threat rated by the design's scales, with its risk (likelihood times impact), and a `top` line listing every risk of 6 or more, highest first.
  4. A `control` of a kind that answers it for every risk of 6 or more, and a control or an `accept` line for every other threat.
  5. An attack tree for the highest risk (`goal`, `node`, `leaf`, `cheapest`): three leaves or more, and one `and` node with two steps.
  6. An abuse case with a test for every risk of 6 or more (`abuse`, `test`).

  As you go, `tm-check reads ~/model.tm` says whether every line is in the format, and `tm-check ranking ~/model.tm`, `tm-check tree ~/model.tm` and the other parts `tm-check --help` lists check the sums. Leave `~/design.md` as it is.
