objectives:
- Run the joiner, mover and leaver process from the HR system of record.
- Certify access with regular reviews.
- Give standing admin rights to no one, with privileged access management and just-in-time elevation.
- Inventory non-human identities (service accounts, keys, tokens, AI agents) and give each an owner and an expiry.
- Protect the directory itself with tiered administration.
