title: "An Adam that divides by zero"
prompt: |
  This program runs Adam on `x²` from 2 at rate 0.1 and should print `x` after 1, 2 and 50 steps:

  ```
  1 1.9
  2 1.8002
  50 -0.0758
  ```

  It has two bugs. Run it: the first is a `ZeroDivisionError` in the correction for starting at zero (the Adam paper calls it *bias correction*; it has nothing to do with a network's biases `b1` and `b2`), because `t` starts at 0 and `1 - beta1 ** 0` is zero; Adam counts its steps from 1. Fix that and it runs, but the first step isn't 0.1 and the numbers drift: `s` is meant to average the gradient **squared**, and this version averages the gradient itself.
skills: [adam]
