id: parsons-momentum-update
type: parsons
rev: 1
prompt: |
  Put the lines in order to take ten momentum steps on `x²` from `x = 2`, with a learning rate of 0.1 and `beta = 0.9`, printing the final `x` rounded to 4 places. One line is a decoy that doesn't belong.
lines:
  - 'x, v = 2.0, 0.0'
  - 'for step in range(10):'
  - '    g = 2 * x'
  - '    v = 0.9 * v + g'
  - '    x = x - 0.1 * v'
  - 'print(round(x, 4))'
distractors:
  - '    v = 0.9 * g + v'
explanation: |
  Each step the gradient is added to the velocity, which keeps 0.9 of its old value, and the step follows the velocity. The decoy keeps all of the old velocity and only 0.9 of the gradient: it never forgets, so `x` swings back and forth between about -2 and 2 forever and never settles. With momentum the ten steps carry `x` past zero (steps 4 to 9 are negative, as far as -1.42) and back, finishing at 0.0088, just on the positive side again: that swing is the overshoot a velocity brings.
skills: [momentum]
