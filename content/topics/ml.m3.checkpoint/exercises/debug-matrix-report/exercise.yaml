id: debug-matrix-report
stage: debug
rev: 1
title: "Three bugs in a matrix program"
prompt: |
  This is the checkpoint's program, and it should print:

  ```
  plane [ 2.015 -1.035  3.024]
  lstsq agrees True
  variance kept 0.9998
  compression error 0.079
  ```

  It has three bugs, in three different places, and each hides the next. Run it and read each error: the first is a **shape mismatch** when the design matrix is built (how many ones?); the second is a **transposed multiply** in the normal equations (how many rows does the matrix handed to `np.linalg.solve` have, and how many entries does the right-hand side have?); and once both are fixed the program runs but the variance kept is wrong, because the covariance is computed on **uncentered** data.
test_skills:
  test_the_output: [ml.la.numpy-arrays/elementwise, ml.la.least-squares/design, ml.la.pca/covariance]
  test_exact_plane: [ml.la.systems/solve, ml.la.pca/explained]
