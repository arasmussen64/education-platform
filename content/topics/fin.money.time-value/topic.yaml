prove:
  build: build-flows-value
  debug: debug-offer-comparer
  explain:
    prompt: |
      A friend says "a dollar is a dollar: $1,000 next year is the same as $1,000 today". In your own words, give three different reasons why a dollar today is worth more than a dollar next year, and show it with one number of your own: what a future amount is worth today at a rate you choose, and how you worked it out.
    rubric:
      - id: earn
        required: true
        description: "Money today can be invested and earn interest, so it grows into more than a dollar by next year; waiting gives that up."
      - id: prices
        required: true
        description: "Prices tend to rise (inflation), so the same number of dollars buys less later."
      - id: risk
        required: true
        description: "A promise of future money is uncertain: it might not be paid, or not in full."
      - id: a-number
        required: true
        description: "A correct present value with its working, such as $1,000 next year at 5% is 1,000 / 1.05 = $952.38 today, discounting by dividing by (1 + rate) once per year."
      - id: rate-and-time
        required: false
        description: "Says the further away the money or the higher the rate, the less it's worth today, or that the discount rate rolls the reasons into one number."
    model_answer: |
      A dollar today is worth more than a dollar next year for three reasons. First, money today can earn: put in an account at 5%, $1,000 today becomes $1,050 next year, so taking $1,000 next year instead gives up $50. Second, prices tend to rise, so a dollar next year buys a little less than a dollar does today. Third, a promise of money later is uncertain: the person or company might not pay, or might pay late. The discount rate rolls these into one number and moves the later money back to today. At 5%, $1,000 next year is worth 1,000 / 1.05 = $952.38 today, because $952.38 put away now at 5% grows to exactly $1,000 in a year. The further away the money and the higher the rate, the smaller that present value: $1,000 in ten years at 5% is worth only 1,000 / 1.05 ** 10, about $614, today.
