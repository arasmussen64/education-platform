id: fin.money.time-value
kind: topic
status: ready
title: "Present and future value"
summary: "Move money through time: discount a future amount to today, compare offers paid at different times, and value a list of cash flows."
prerequisites:
  - fin.money.compounding
  - py.return-values
# The lesson (about 8 minutes), the reading (about 10), 12 practice quick
# questions at a minute and a half, the worked example, fill-in and write
# (about 20), and the build, debug and explain (about 25).
estimated_minutes: 80
rev: 1
objectives:
  - "Discount a future amount to today, and grow today's amount to the future."
  - "Compare offers paid at different times by moving them to the same date."
  - "Value a list of uneven cash flows, the first at time 0."
  - "Say why a dollar today is worth more than a dollar later."
# OpenStax Principles of Finance is CC BY-NC-SA 4.0 by its preface, read on
# 2026-11-17 with both sections' pages; linked, never copied.
resources:
  - title: "OpenStax Principles of Finance, section 7.1: Now versus Later Concepts (why time changes the value of money; present and future value)"
    url: https://openstax.org/books/principles-finance/pages/7-1-now-versus-later-concepts
    type: reading
    use: link
    license: CC BY-NC-SA 4.0 (linked, not copied)
  - title: "OpenStax Principles of Finance, section 9.1: Timing of Cash Flows (the present and future value of a mixed list of payments)"
    url: https://openstax.org/books/principles-finance/pages/9-1-timing-of-cash-flows
    type: reading
    use: link
    license: CC BY-NC-SA 4.0 (linked, not copied)
# Every amount of money here is made up for the sums (estimate items say
# amounts: made-up). The module's conventions hold: rates are decimals in
# code, money is rounded only for printing.
practice:
  - example-offer-today
  - parsons-flows-today
  - mcq-what-pv-means
  - est-pv-car-fund
  - mcq-higher-rate
  - est-pv-promise
  - contrast-today-or-later
  - est-compare-bonus
  - est-compare-prize
  - predict-flows-today
  - est-flows-shop
