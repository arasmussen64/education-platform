    description: "Present value of one amount: discount it to today with `future / (1 + rate) ** periods`"
  - id: compare-offers
    description: "Move amounts paid at different times to the same date before comparing them"
  - id: uneven-flows
    description: "The present value of a list of cash flows, the first at time 0"
