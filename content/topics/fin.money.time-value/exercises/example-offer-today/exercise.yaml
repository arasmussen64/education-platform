id: example-offer-today
stage: worked_example
rev: 1
title: "$10,000 now or $11,000 later"
prompt: |
  This program answers the lesson's puzzle: $10,000 today, or $11,000 in two years, when money can earn 6% a year? It compares the two at the same date, first today and then in two years. Press **Run**, then read how each part works.
steps:
  - label: "Present value undoes future value"
    lines: "1-2"
    note: "Growing an amount multiplies it by `(1 + rate) ** periods`, so moving it back to today divides by the same thing. That's discounting, and the answer is the amount's present value."
  - label: "The two offers and the rate"
    lines: "5-8"
    note: "6% is the rate money could earn meanwhile, `0.06` as a decimal. Here it's the discount rate: the rate used to move money through time."
  - label: "Compare today"
    lines: "10-12"
    note: "$11,000 in two years is worth `11000 / 1.06 ** 2`, $9,789.96, today. That's less than the $10,000 on offer now, so the money now wins, by $210.04 in today's money."
  - label: "Or compare in two years"
    lines: "14-15"
    note: "Moving the other way gives the same verdict: $10,000 put away at 6% grows to $11,236.00 by the time the later offer pays $11,000. Any date works, as long as both amounts are moved to the same one."
