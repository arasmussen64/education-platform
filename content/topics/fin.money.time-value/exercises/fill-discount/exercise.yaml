id: fill-discount
stage: fill_in
rev: 1
title: "Is the later offer worth more?"
prompt: |
  You're offered $8,000 now or $9,000 in 3 years, and money can earn 5% a year. Replace each `...` with an operator so `present_value` moves an amount back to today, and the program says which offer is worth more:

  ```
  The later offer, today: 7,774.54
  Take the money now
  ```

  Each `...` stands where an operator goes, so until every one is replaced, Python can't run the program at all and shows a syntax error. Keep the starting lines: the checks run your program with other rates too, where the later offer wins.
hints:
  - "Growing an amount multiplies by `(1 + rate) ** periods`. Moving it back to today undoes that: which operator undoes a multiplication?"
  - "`(1 + rate)` is applied once per period, so it's raised to the power `periods`: `**`."
  - "Take the later offer only when its value today is bigger than the money on offer now."
skills: [discount, compare-offers]
