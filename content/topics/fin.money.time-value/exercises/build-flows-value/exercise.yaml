id: build-flows-value
stage: build
rev: 1
title: "A list of cash flows, valued today"
prompt: |
  A project costs $5,000 today and then pays $1,500, $2,000 and $2,500 at the ends of the next three years. Money can earn 7% a year. The flows are a list, the first at time 0 (today) and one a year after that; money paid out is negative.

  Write a function `present_value_of_flows(flows, rate)` that returns what the whole list is worth today: each flow moved back to time 0 at `rate` per period, then added up. Return the unrounded number. Then print the project's value:

  ```
  Worth today: 189.49
  ```

  Keep the two starting lines: the checks call your function with other lists and rates, and run your program with another list. Later topics in this module use `present_value_of_flows` by this name.
skills: [uneven-flows, discount]
