id: write-best-offer
stage: write
rev: 1
title: "The best of three offers"
prompt: |
  Three offers for the same thing: $9,000 now, $10,000 in 2 years, or $10,500 in 4 years. Money can earn 5% a year. The amounts and the years they're paid are in two lists, so offer `i` pays `amounts[i]` in year `years[i]`.

  Write `present_value(future, rate, periods)`, which returns what `future`, paid after `periods` periods, is worth today at `rate` per period. Then print each offer's value today, and which offer is worth the most:

  ```
  Year 0: 9,000.00
  Year 2: 9,070.29
  Year 4: 8,638.38
  Best: the offer in year 2
  ```

  Keep the three starting lines: the checks call your function and run your program with another rate. If two offers were worth exactly the same, either may be named; the checks never ask.
hints:
  - "`present_value` divides by `(1 + rate) ** periods`, the growth it undoes. An amount paid now has `periods` of 0, and anything to the power 0 is 1, so it isn't changed."
  - "Loop over the positions: `for i in range(len(amounts)):` gives `amounts[i]` and `years[i]` together."
  - "Keep the position of the best offer so far in a variable, starting at 0, and replace it whenever an offer's value today is bigger."
skills: [discount, compare-offers]
