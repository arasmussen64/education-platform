id: debug-offer-comparer
stage: debug
rev: 1
title: "An offer comparer"
prompt: |
  Two ways of being paid for a job, as lists of cash flows with the first at time 0 (today) and one a year after that. Offer A pays $3,000 today and at the end of each of the next two years; offer B pays nothing today, $4,000 in a year and $5,200 in two. Money can earn 8% a year. This program should print what each offer is worth today, then take the one worth more:

  ```
  Offer A: 8,349.79
  Offer B: 8,161.87
  Take offer A
  ```

  Instead both values come out lower than those, and it recommends the other offer. It has two bugs. Run it, fix what you find, and run it again. Keep the three starting lines: the checks also run it with other offers.
hints:
  - "Fix one thing at a time and run it after each change."
skills: [uneven-flows, compare-offers]
