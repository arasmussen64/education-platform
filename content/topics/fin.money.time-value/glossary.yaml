- term: present value
  definition: "What a future amount is worth today: the sum that, put away now at the rate, would grow into it. `future / (1 + rate) ** periods`."
- term: discounting
  definition: "Moving a future amount back to today by dividing by `(1 + rate)` once for each period. The opposite of compounding."
- term: discount rate
  definition: "The rate used to move money through time, usually what the money could earn meanwhile. A higher discount rate makes later money worth less today."
- term: cash flow
  definition: "A payment in or out at a point in time. A list of cash flows has one per period, the first at time 0 (today), with money paid out negative."
