id: review-est-pv-inheritance
type: estimate
rev: 1
prompt: |
  A trust will pay you $50,000 in 20 years. Money can earn 5% a year. What is that worth today? Within 2%.
unit: dollars
answer: 18844.47
tolerance: { percent: 2 }
given: { future: 50000, rate: 5, years: 20 }
working: future / (1 + rate / 100) ** years
mistakes:
  - id: simple-discount
    value: 25000
    working: future / (1 + rate / 100 * years)
    why: "That discounts with simple interest. Over 20 years compounding matters a lot: divide by 1.05 twenty times."
  - id: minus-simple
    value: 0
    working: future - future * rate / 100 * years
    why: "Taking 5% of $50,000 off for each of 20 years takes it all. Discounting divides; it never reaches zero."
explanation: |
  50,000 / 1.05 ** 20 = 50,000 / 2.653 = $18,844.47. A rule-of-72 check: 5% doubles money about every 14.4 years, so 20 years is a bit more than one doubling, and today's value is a bit less than half.
skills: [discount]
amounts: made-up
