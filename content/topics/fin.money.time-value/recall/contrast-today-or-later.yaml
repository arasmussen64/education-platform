id: contrast-today-or-later
type: mcq
rev: 1
prompt: |
  Two offers: $4,000 now, or $4,600 in 3 years, with money earning 5% a year. Priya compares them today, so she discounts the $4,600. Sam compares them in 3 years, so he grows the $4,000. Can they reach different verdicts?
choices:
  - 'Yes: discounting and growing use the rate the opposite way, so the verdicts flip'
  - 'No: both put the two offers at one date, so the same offer wins either way'
  - 'Yes: only comparing today is valid, because money in the future is uncertain'
  - 'No, but only because 5% is low; at a high enough rate the two can disagree'
answer: 1
explanation: |
  Priya: $4,600 / 1.05 ** 3 = $3,973.68 today, less than $4,000, so the money now wins by $26.32. Sam: $4,000 × 1.05 ** 3 = $4,630.50 in 3 years, more than $4,600, so the money now wins by $30.50. Same verdict. Moving both amounts to any one date multiplies or divides both by the same factor, so the winner can't change; only the size of the gap does ($30.50 is $26.32 grown for 3 years). What does give a wrong answer is comparing amounts at different dates, $4,000 now against $4,600 later, as if they were the same money.
skills: [compare-offers]
