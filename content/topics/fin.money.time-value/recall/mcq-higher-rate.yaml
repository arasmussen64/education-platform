id: mcq-higher-rate
type: mcq
rev: 1
prompt: |
  At a discount rate of 5% a year, $1,000 paid in 10 years is worth $613.91 today. What happens to that present value if the discount rate is 10% instead?
choices:
  - 'It rises to about $1,227.83, twice as much'
  - 'It falls to about $385.54'
  - 'It falls to about $306.96, half as much'
  - 'It stays at $613.91, since the $1,000 is the same'
answer: 1
explanation: |
  A higher rate means money today could grow faster, so a promise of later money is worth less now: 1,000 / 1.10 ** 10 = $385.54. The fall isn't a simple halving, because the rate is inside a power: doubling the rate more than doubles the growth over 10 years (1.63 against 2.59). The present value never rises with the rate, and it can't stay put: the whole point of the rate is to say what waiting costs.
skills: [discount]
