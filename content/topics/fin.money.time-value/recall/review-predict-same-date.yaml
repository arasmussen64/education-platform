id: review-predict-same-date
type: predict_output
rev: 1
prompt: |
  Two offers moved to the same date, two ways. What does the program print?
code: |
  rate = 0.10
  now = 1000
  later = 1150
  print(f"{later / (1 + rate) ** 2:,.2f}")
  print(f"{now * (1 + rate) ** 2:,.2f}")
expected_output: |
  950.41
  1,210.00
explanation: |
  The first line moves $1,150 paid in 2 years back to today: 1,150 / 1.21 = 950.41, less than the $1,000 now. The second moves the $1,000 forward 2 years: 1,000 × 1.21 = 1,210.00, more than the $1,150 later. Either way the money now wins: comparing at one date, any date, gives the same verdict.
skills: [compare-offers, discount]
