id: mcq-what-pv-means
type: mcq
rev: 1
prompt: |
  At 4% a year, the present value of $1,000 paid in 5 years is $821.93. What does that number tell you?
choices:
  - '$821.93 put away today at 4% grows to $1,000 in 5 years'
  - 'The $1,000 loses $821.93 of its value over the 5 years'
  - '$1,000 today is worth $821.93 once 5 years have passed'
  - 'The $1,000 earns $821.93 in interest over the 5 years'
answer: 0
explanation: |
  Present value is future value run backwards: 821.93 × 1.04 ** 5 = 1,000. So being promised $1,000 in 5 years is worth the same as holding $821.93 today, when money can earn 4%. It isn't a loss of $821.93 (the gap is $178.07), and the interest on $821.93 over the 5 years is that same $178.07, not $821.93. "$1,000 today is worth $821.93 later" has the direction of time the wrong way round: money today is worth more later, not less, because it can earn.
