id: typed-power-for-today
type: typed
rev: 1
prompt: |
  In a list of cash flows where the first is paid today, the flow at position `t` is divided by `(1 + rate) ** t`. What power is the payment today raised to? Type the number.
kind: text
answers:
  - "0"
mistakes:
  - id: one
    answers: ["1"]
    why: "A power of 1 would discount the payment today by a whole period, as if it came in a year. Today's money is already today's money: its power is 0."
explanation: |
  The payment today is at position 0, and `(1 + rate) ** 0` is 1, so dividing by it changes nothing: money today is worth what it says. The flow at position 1 is a year away and is divided by `(1 + rate)` once, and so on.
skills: [uneven-flows]
