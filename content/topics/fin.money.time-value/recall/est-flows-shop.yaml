id: est-flows-shop
type: estimate
rev: 1
prompt: |
  A small shop expects to earn $300 in a year, $500 in two years and $800 in three. Money can earn 10% a year. What are the three amounts worth today, together? Within 1%.
unit: dollars
answer: 1287
tolerance: { percent: 1 }
given: { one: 300, two: 500, three: 800, rate: 10 }
working: one / (1 + rate / 100) + two / (1 + rate / 100) ** 2 + three / (1 + rate / 100) ** 3
mistakes:
  - id: not-discounted
    value: 1600
    working: one + two + three
    why: "That adds money paid at different dates. Move each one back to today first."
  - id: discounted-once
    value: 1454.55
    working: (one + two + three) / (1 + rate / 100)
    why: "That discounts everything one year. The $500 is two years away and the $800 three, so each gets its own power."
explanation: |
  Each amount gets its own power: 300 / 1.1 = 272.73, 500 / 1.1 ** 2 = 413.22 and 800 / 1.1 ** 3 = 601.05, which add to about $1,287.00. That's $313 less than the $1,600 they add up to, because the later money could have been earning.
skills: [uneven-flows]
amounts: made-up
