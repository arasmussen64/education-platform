id: typed-discounting
type: typed
rev: 1
prompt: |
  Growing today's money into the future is compounding. What is moving a future amount back to its value today called? One word.
kind: text
answers:
  - "discounting"
mistakes:
  - id: compounding
    answers: ["compounding"]
    why: "Compounding goes forward, multiplying by `(1 + rate)` each period. Going back divides by it, which is discounting."
explanation: |
  Discounting divides a future amount by `(1 + rate) ** periods`, undoing the growth it would have had. The result is its present value, and the rate used is called the discount rate.
skills: [discount]
