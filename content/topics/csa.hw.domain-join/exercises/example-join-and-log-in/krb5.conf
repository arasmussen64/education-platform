# This machine's Kerberos settings. They say only which realm a name without
# one belongs to: where the realm's KDCs are, Kerberos asks DNS for (the
# domain's _kerberos SRV records), so nothing here names a server.
[libdefaults]
    default_realm = AD.SHOP.TEST
    dns_lookup_kdc = true
    dns_lookup_realm = false
