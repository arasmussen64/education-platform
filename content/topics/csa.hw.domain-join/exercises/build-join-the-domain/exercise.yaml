id: build-join-the-domain
stage: build
runtime: lab
lab:
  init: systemd
rev: 1
title: "Join the server to the domain"
prompt: |
  The shop runs an Active Directory domain, `ad.shop.test`, on one domain controller, `dc1` (10.0.9.10). This server, `lab`, is new and knows nothing about the domain: it asks the site's ordinary resolver for names (a small name server on `lab` itself, whose settings are in `/etc/dnsmasq.d/`), and that resolver has never heard of the domain. Make `lab` a member:

  1. **`lab` finds the domain through the resolver it already uses.** Asked there, the domain's SRV records name dc1 and dc1's address has its name, and the site's own names (`intranet.shop.internal`) still resolve.
  2. **`lab` is joined to the domain**, with the domain's administrator account (`Administrator`, password `Shop-Admin-1`).
  3. **Members of the domain group `linux-admins` can log in over SSH** with their domain passwords, and land in a home directory that is made for them at their first login. **Nobody else in the domain can log in to `lab`**, by SSH or any other way.
  4. **It all lasts:** every change is saved where the next boot reads it.

  The rules: nothing about dc1 is typed in by hand on `lab` (not into a hosts file, a record of the resolver's own, a Kerberos configuration or SSSD's settings), and dc1 is left as strict as you found it: it keeps refusing passwords sent over unencrypted LDAP.

  The people: `alice` (`Alice-Pass-1`) and `carol` (`Carol-Pass-1`) are in `linux-admins`; `bob` (`Bob-Pass-1`) is not. `on-dc COMMAND` runs a command on dc1. When you think `lab` is a member, run the checks.
skills: [domain-join]
