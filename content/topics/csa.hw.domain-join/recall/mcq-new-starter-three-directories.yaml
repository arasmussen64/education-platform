id: mcq-new-starter-three-directories
type: mcq
rev: 1
prompt: |
  A company has a domain in its office, Microsoft Entra ID kept in step with it by Microsoft Entra Connect, and Microsoft Entra Domain Services for its servers in Azure. Someone starts work on Monday and needs one account that works in all three. Where is the account created?
choices:
  - "In the office's domain: it is copied to Entra ID, and from there to the managed domain"
  - "In Entra ID: it is copied down to the office's domain, and to the managed domain as well"
  - "In the managed domain: it is copied up to Entra ID, and from there to the office's domain"
  - "In all three, by hand: each directory keeps accounts of its own, and nothing copies them"
answer: 0
explanation: |
  The copies run one way, downhill from the office. Microsoft Entra Connect copies people and groups from the office's domain into Entra ID. Entra Domain Services then fills its managed domain with a copy of the tenant's people from Entra ID, and Microsoft's page on it says that copy is one-way too: nothing is copied from the managed domain back to Entra ID. So the account is made once, at the top, in the office's domain, and the person has one name and one password everywhere.

  An account made in Entra ID reaches the managed domain, but Entra Connect doesn't copy new people down into the office's domain, so the office's servers wouldn't know the person. One made in the managed domain stays there: Entra ID and the office never see it. And making three accounts by hand is what the copying exists to avoid: three passwords to keep in step, and three places to remember on the day the person leaves.
skills: [entra-vs-adds]
