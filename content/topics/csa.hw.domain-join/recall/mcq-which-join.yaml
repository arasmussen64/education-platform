id: mcq-which-join
type: mcq
rev: 1
prompt: |
  Three devices need an identity. A company laptop, used only with web apps and Microsoft 365, mostly away from the office. A server VM running an application that signs people in with Kerberos. A member of staff's own phone, used for email. How should each be joined?
choices:
  - "Laptop: Entra joined. Server VM: domain joined. Phone: Entra registered"
  - "Laptop: Entra joined. Server VM: Entra joined. Phone: Entra registered"
  - "Laptop: domain joined. Server VM: domain joined. Phone: Entra joined"
  - "Laptop: Entra registered. Server VM: Entra joined. Phone: Entra joined"
answer: 0
explanation: |
  An organisation's own laptop that lives on the internet and uses web apps is **Entra joined**: people sign in to it with their Entra accounts, it gets single sign-on to those apps with tokens, and it is managed over the internet by a device-management service such as Intune. A server running a Kerberos application must be **domain joined**, to AD DS or a managed domain, because Entra ID has no Kerberos to offer it. A personal phone is only **Entra registered**: it gets an identity so its owner can sign in to company apps, and the company doesn't take the device over.

  An Entra-joined server would sign people in with tokens its application can't use. A domain-joined laptop needs to reach a domain controller's network to sign in fresh and to get its Group Policy, which a laptop that's rarely in the office can't. And joining a personal phone hands a person's own device to the company to manage. (A device that is domain joined and also known to Entra ID is called hybrid joined, common for office desktops.)
skills: [entra-vs-adds]
