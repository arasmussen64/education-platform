id: entra-discovery-doc
type: predict_shell
rev: 1
prompt: |
  An application that signs people in with Microsoft Entra ID starts with one HTTPS request, for Entra's sign-in document: `https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration`. `openid-configuration.json` is that document, fetched on 2026-11-11 and cut down to seven of its 25 keys, one a line. The first command lists the keys that end in `_endpoint`; the second counts the lines with a web address. What is printed?
files:
  openid-configuration.json: |
    {
      "issuer": "https://login.microsoftonline.com/{tenantid}/v2.0",
      "authorization_endpoint": "https://login.microsoftonline.com/common/oauth2/v2.0/authorize",
      "token_endpoint": "https://login.microsoftonline.com/common/oauth2/v2.0/token",
      "jwks_uri": "https://login.microsoftonline.com/common/discovery/v2.0/keys",
      "userinfo_endpoint": "https://graph.microsoft.com/oidc/userinfo",
      "id_token_signing_alg_values_supported": ["RS256"],
      "scopes_supported": ["openid", "profile", "email", "offline_access"]
    }
command: |
  grep -o '"[a-z_]*_endpoint"' openid-configuration.json | tr -d '"'
  grep -c 'https://' openid-configuration.json
expected_output: |
  authorization_endpoint
  token_endpoint
  userinfo_endpoint
  5
explanation: |
  `grep -o` prints only the part of each line that matches, the quoted key names ending in `_endpoint`, and `tr -d '"'` takes the quotes off; five of the seven lines hold an `https://` address.

  This is how an application finds Entra ID: one document over HTTPS, from anywhere on the internet. The browser is sent to the `authorization_endpoint` to sign in; the application then collects a signed **token** from the `token_endpoint`, and checks its signature with the public keys at `jwks_uri` (`RS256` is the kind of signature). Compare a domain member, which finds its domain controller with an SRV lookup in the domain's own DNS, inside the network, and proves who people are with Kerberos tickets. Entra publishes no `_kerberos` or `_ldap` SRV records at all: an application that only speaks Kerberos or LDAP has nothing to talk to here.
skills: [entra-vs-adds]
