id: mcq-managed-domain-or-own
type: mcq
rev: 1
prompt: |
  A team is moving an old application to VMs in Azure. It signs people in with Kerberos, so it needs a domain. Its installer must also run as a domain administrator, because it adds new kinds of entry to the directory's design. Which fits?
choices:
  - "Domain controllers of the team's own on VMs: a managed domain gives no such rights"
  - "Microsoft Entra Domain Services: a managed domain has a domain administrator"
  - "Entra ID alone: the application's new kinds of entry can be kept in the tenant instead"
  - "Either kind of domain: the two differ in who patches the servers, and in nothing else"
answer: 0
explanation: |
  A managed domain is a domain someone else runs, and the price of that is control. Microsoft's comparison of the two says a managed domain in Entra Domain Services gives no domain or enterprise administrator privileges and no changes to the directory's design (schema extensions), where a domain you run yourself has both. An installer that needs either can only run against domain controllers of your own, on VMs that you then patch, back up and run in pairs.

  Entra ID alone doesn't fit at all: it has no Kerberos for the application to sign people in with. And the two kinds of domain differ in more than who does the patching: for most applications a managed domain is less work and enough, which is why it is worth asking what an application needs from the directory before choosing.
skills: [entra-vs-adds]
