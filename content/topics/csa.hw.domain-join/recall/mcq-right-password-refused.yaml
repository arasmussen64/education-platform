id: mcq-right-password-refused
type: mcq
rev: 1
prompt: |
  bob can't log in to a domain member over SSH. These are the SSH server's journal lines for his attempt (captured on the lab's `lab`, 2026-11-11):

  ```text
  pam_sss(sshd:auth): authentication success; logname= uid=0 euid=0 tty=ssh ruser= rhost=127.0.0.1 user=bob@ad.shop.test
  pam_sss(sshd:account): Access denied for user bob@ad.shop.test: 6 (Permission denied)
  Failed password for bob@ad.shop.test from 127.0.0.1 port 39718 ssh2
  fatal: Access denied for user bob@ad.shop.test by PAM account configuration [preauth]
  ```

  What do they say?
choices:
  - "His password is right, but this server's own rule for who may log in doesn't include him"
  - "His password is wrong: the domain checked it and refused it, so SSH reports a failed password"
  - "His account is disabled in the directory, so the domain refused him before checking anything"
  - "The server can't reach the domain controller, so it refuses every domain account for now"
answer: 0
explanation: |
  Logging in to a member asks two questions, in two places. `pam_sss(sshd:auth): authentication success` is the first, answered by the domain: the password is right. `pam_sss(sshd:account): Access denied` is the second, answered by this server: SSSD's access rule (`realm permit`) doesn't include bob. So nothing about bob needs fixing; if he should be let in, put him in the permitted group, or permit the group he's in.

  "Failed password" is SSH's own word for any refused attempt, which is why the line before it matters: the password itself passed. A disabled account fails at the first question, with no `authentication success`; Kerberos says `Client's credentials have been revoked`. And a server that can't reach its domain controller can't confirm the password either, so it couldn't log `authentication success` for an account it has never seen.
skills: [domain-join]
