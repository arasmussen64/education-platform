prove:
  build: build-join-the-domain
  debug: debug-nobody-can-log-in
  explain:
    prompt: |
      A company runs Active Directory on two servers in its office. It is moving its forty application servers, Windows and Linux, and its three hundred staff laptops to the cloud, and a colleague proposes: "We already have Entra ID with our email, and that's Active Directory in the cloud, so we can switch the domain controllers off." Explain, in your own words: what the domain does today for a server that is joined to it and for a person who logs in to one, including the settings it hands out; how Entra ID differs, and which of the forty servers and three hundred laptops could rely on it alone; what you'd run in the cloud for the rest, on whichever provider, and how the two directories are kept in step; and one thing a lab built on Samba couldn't show you about Windows.
    rubric:
      - id: what-the-domain-does
        required: true
        description: "A joined server has a computer account and keys of its own in a keytab, so it can look people up in the directory and check their passwords with Kerberos: one account per person works on every member, and each member decides who may log in (a permitted group, not names). Group Policy objects linked to sites, the domain and organisational units push settings to the computers and people in them, applied in order with the closest folder last, unless a folder blocks inheritance or a link is enforced."
      - id: entra-differs
        required: true
        description: "Entra ID signs people in to web and SaaS applications with tokens over HTTPS (OpenID Connect, OAuth, SAML); it offers no Kerberos or LDAP for servers to use, and has no organisational units and no Group Policy; devices are Entra joined or registered and managed by MDM such as Intune. Laptops used with web apps can be Entra joined; servers running applications that expect Kerberos, LDAP or Group Policy can't rely on it alone."
      - id: what-to-run
        required: true
        description: "For those servers, domain services in the cloud: domain controllers on VMs that you patch and back up, or a managed domain (Microsoft Entra Domain Services, AWS Managed Microsoft AD, Google's Managed Service for Microsoft AD), reachable on the servers' network with the network's DNS pointed at it; accounts kept in step by synchronising the office directory to Entra ID (Microsoft Entra Connect), from which Entra Domain Services takes its own copy."
      - id: samba-limit
        required: false
        description: "The lab's domain controller was Samba: the protocols are the same, but Windows's own tools and a Windows member actually fetching and applying Group Policy weren't seen."
    model_answer: |
      Today the domain is what lets one account work everywhere. When a server joins, it gets a computer account in the directory and its own keys in a keytab, so it can ask the domain controllers who someone is and check their password with Kerberos, without keeping any passwords itself. A person has one account and one password for every member, and each member decides who may log in: a group, like linux-admins, permitted on the server, so people come and go by changing the group. The domain also hands out settings with Group Policy: objects linked to the domain and to organisational units reach the computers and people in those folders, applied from the domain down so the closest folder wins, unless a folder blocks inheritance or a link is enforced.

      Entra ID isn't that in the cloud. It signs people in to web and SaaS applications with signed tokens over HTTPS, using OpenID Connect, OAuth and SAML. It has no Kerberos or LDAP for a server to use, no organisational units and no Group Policy; devices are Entra joined or registered and managed by Intune over the internet. So the three hundred laptops, if their staff use web apps, can be Entra joined and managed that way. The forty servers whose applications sign people in with Kerberos, look them up over LDAP or depend on GPOs can't rely on it.

      For them I'd keep domain services in the cloud: either domain controllers on VMs, which we'd patch, back up and run in pairs, or a managed domain, Microsoft Entra Domain Services on Azure, AWS Managed Microsoft AD or Google's Managed Service for Microsoft AD, with the servers' network handing out its DNS. The office directory is synchronised to Entra ID with Microsoft Entra Connect, so everyone keeps one account, and Entra Domain Services takes its copy from Entra ID.

      What Samba couldn't show me is Windows itself: its management tools, and a Windows member actually fetching a GPO and applying its settings.
