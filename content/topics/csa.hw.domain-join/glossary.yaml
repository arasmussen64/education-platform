# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: computer account
  aliases: [machine account]
  definition: A machine's own entry in a domain's directory, made when it joins, with a long random password kept in its keytab. Its login name ends in `$`.
- term: SSSD
  aliases: [System Security Services Daemon]
  definition: 'The background service a Linux domain member asks about domain accounts: who someone is, their groups, whether a password is right and whether they may log in.'
- term: PAM
  aliases: [pluggable authentication modules]
  definition: The chain of steps every Linux login program runs to check a password and set up a session. A domain join adds SSSD's steps to it.
- term: Group Policy object
  aliases: [GPO, Group Policy]
  definition: A named bundle of settings for Windows computers and their users, which does nothing until it is linked to a site, the domain or an OU.
- term: SYSVOL
  definition: A shared folder on every domain controller, from which members read Group Policy settings.
- term: block inheritance
  definition: A setting of an OU that stops Group Policy objects linked above it from reaching what's inside, except links that are enforced.
- term: Entra ID
  aliases: [Microsoft Entra ID, Azure Active Directory]
  definition: Microsoft's cloud directory behind Microsoft 365 and Azure. It signs people in to web apps with tokens over HTTPS, and has no Kerberos, LDAP, OUs or Group Policy for servers.
- term: managed domain
  definition: A domain whose domain controllers the cloud provider runs for you, such as Microsoft Entra Domain Services or AWS Managed Microsoft AD.
