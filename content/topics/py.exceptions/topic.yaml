prove:
  build: build-parse-ages
  debug: debug-exceptions
  explain:
    prompt: |
      A friend's program crashes with `ValueError: invalid literal for int() with base 10: 'ten'` when someone types `ten` for their age. Explain, in your own words: what an exception is; what `try` and `except ValueError` do, and why you name the error rather than catching everything; where the risky line has to go; why a loop around it lets the person try again; and when you would `raise` an error yourself.
    rubric:
      - id: exception
        required: true
        description: "An exception is an error that happens while the program runs; unhandled, it stops the program with a traceback."
      - id: try-except
        required: true
        description: "The lines under try are attempted; if the named error happens, the except block runs instead and the program carries on; naming ValueError means other, unexpected errors still stop the program so bugs aren't hidden."
      - id: placement
        required: true
        description: "The line that can fail, int(text), must be inside the try; what uses the result goes after, or in else."
      - id: loop
        required: true
        description: "while True around the try: on success return or break, on a ValueError print a message and go round again."
      - id: raise
        required: false
        description: "raise ValueError(\"...\") in your own function when it's given a value it can't work with, so the caller finds out at once."
    model_answer: |
      An exception is an error that happens while the program is running, like turning the text ten into a number. If nothing handles it, Python stops the program and prints a traceback. try and except let you handle it: the lines under try are attempted, and if a ValueError happens there, Python jumps to the except block, runs it, and carries on after. You name ValueError rather than catching everything so that a different, unexpected error still stops the program and shows you the bug instead of being swallowed. The line that can fail, int(text), has to be inside the try; the lines that use the number go after it, or in an else block that runs only when the try succeeded. To let the person try again, put the whole thing in while True: on success return the number (or break), and in the except print a message and let the loop ask again. And when a function of your own is given something it can't work with, like a negative age, raise ValueError with a message, so the problem is reported at once instead of turning into a wrong answer later.
