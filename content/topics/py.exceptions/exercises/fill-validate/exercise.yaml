id: fill-validate
stage: fill_in
rev: 1
title: "A positive number, or ask again"
prompt: |
  `get_positive` should keep asking until the user types a whole number greater than 0, then return it as a number. Replace each `...`: the error to catch, and what to return once the number is good. Typing `-2`, then `abc`, then `5` should print:

  ```
  Must be more than 0.
  Not a whole number.
  Twice that is 10
  ```
hints:
  - "`int()` raises `ValueError` for text that isn't a whole number: `except ValueError:`."
  - "Return the converted number, `number`, not the text the user typed."
skills: [validate-loop, try-except]
