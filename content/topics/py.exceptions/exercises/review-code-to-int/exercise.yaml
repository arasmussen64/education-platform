id: review-code-to-int
stage: review_code
rev: 1
title: "A number, or nothing"
prompt: |
  Write a function `to_int(text)` that returns the whole number in `text`, or `None` if the text isn't a whole number. `to_int("42")` returns `42`; `to_int("4.2")` and `to_int("forty")` return `None`. Catch the error rather than inspecting the text.
skills: [try-except]
