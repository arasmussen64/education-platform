id: write-safe-divide
stage: write
rev: 1
title: "Divide, safely"
prompt: |
  Write a function `safe_divide(a, b)` that returns `a / b`, or `None` when `b` is 0. Dividing by zero raises `ZeroDivisionError`; catch it rather than testing `b` first. `safe_divide(6, 3)` returns `2.0`, and `safe_divide(1, 0)` returns `None`. The function prints nothing.
hints:
  - "Put `return a / b` inside a `try`."
  - "`except ZeroDivisionError:` then `return None`."
skills: [try-except]
