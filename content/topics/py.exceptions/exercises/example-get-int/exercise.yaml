id: example-get-int
stage: worked_example
rev: 1
title: "Ask until it's a number"
prompt: |
  The function every input-reading program wants: ask, and keep asking, until the answer is a whole number. Press **Run**, type `abc`, then `30`. Then try typing nothing and pressing Enter.
steps:
  - label: "The loop that doesn't give up"
    lines: "3"
    note: "`while True` would run forever, so something inside must end it. Here that's the `return` on line 6: the function ends, and the loop with it, as soon as a conversion works."
  - label: "Try the risky line"
    lines: "4-6"
    note: "`int(text)` is the line that can fail, so it's inside the `try`. If it works, `return` hands the number back and the function is done."
  - label: "Handle the one error you expect"
    lines: "7-8"
    note: "Only a `ValueError` is caught: text that isn't a whole number. The message prints and the loop asks again. Any other error would still stop the program, which is what you want for a bug."
  - label: "The caller just gets a number"
    lines: "11-13"
    note: "`main` doesn't know or care how many tries it took. That's the point of putting the checking in one function."
