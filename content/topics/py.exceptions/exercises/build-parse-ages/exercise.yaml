id: build-parse-ages
stage: build
rev: 1
title: "Ages from messy text"
prompt: |
  Starting from a blank editor, write three functions with docstrings:

  - `to_age(text)` returns the whole number in `text` if it's 0 or more, and `None` otherwise: for text that isn't a whole number (catch the `ValueError`) and for negative numbers.
  - `valid_ages(texts)` takes a list of strings and returns a list of the ages that are valid, in order, skipping the rest.
  - `require_positive(n)` returns `n` if it's greater than 0, and otherwise raises `ValueError` with the message `must be positive`.

  Then `main()` prints, for the list `["34", "x", "-5", "7"]`:

  ```
  Valid ages: [34, 7]
  Skipped: 2
  ```

  Call `main()` under `if __name__ == "__main__":`.
skills: [try-except, raise, validate-loop]
