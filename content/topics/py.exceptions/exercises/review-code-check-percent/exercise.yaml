id: review-code-check-percent
stage: review_code
rev: 1
title: "A percentage, or an error"
prompt: |
  Write a function `check_percent(n)` that returns `n` when it's between 0 and 100 (both included), and otherwise raises `ValueError` with the message `out of range`. `check_percent(50)` returns `50`; `check_percent(101)` raises.
skills: [raise]
