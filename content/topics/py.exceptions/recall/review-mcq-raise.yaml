id: review-mcq-raise
type: mcq
rev: 1
prompt: |
  What does this line do when it runs inside a function?

  ```python
  raise ValueError("age must be 0 or more")
  ```
choices:
  - 'Prints the message and carries on with the next line'
  - 'Stops the function at once with a `ValueError` carrying that message, which a caller can catch with `except`'
  - 'Returns the message as the function''s value'
  - 'Defines a new kind of error called `age must be 0 or more`'
answer: 1
explanation: |
  `raise` throws an error from your own code, exactly like the ones Python throws. The function stops there; if a caller has `try` / `except ValueError` around the call, that block runs, and if nobody catches it, the program stops with the message. Raising early is how a function refuses bad input instead of giving a wrong answer.
skills: [raise]
