id: mcq-else-clause
type: mcq
rev: 1
prompt: |
  In a `try` / `except` / `else` statement, when does the `else` block run?
choices:
  - 'Always, after the `try` block'
  - 'Only when the `try` block raised an error'
  - 'Only when the `try` block finished without an error'
  - 'Only when the `except` block ran'
answer: 2
explanation: |
  `else` is the "it worked" branch: it runs when the `try` block raised nothing. That's where to put the code that uses the result, so it isn't inside the `try` (where its own errors would be mistaken for the one you're catching) and doesn't run after a failure.
skills: [try-except]
