id: review-predict-half
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines.
code: |
  def half(text):
      try:
          return int(text) / 2
      except ValueError:
          return 0


  print(half("8"))
  print(half("eight"))
  print(half("3"))
expected_output: |
  4.0
  0
  1.5
explanation: |
  `"8"` converts, so the function returns 8 / 2, which is `4.0`. `"eight"` makes `int` raise `ValueError`, so the `except` returns 0. `"3"` converts to 1.5. A `return` inside `try` is fine: if the line fails, the `return` never happens and the `except` takes over.
skills: [try-except]
