id: parsons-safe-int
type: parsons
rev: 2
prompt: |
  Put the lines in order so the program prints `10` and then `0`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'for text in ["10", "ten"]:'
  - '    try:'
  - '        number = int(text)'
  - '    except ValueError:'
  - '        number = 0'
  - '    print(number)'
distractors:
  - '    except NameError:'
explanation: |
  The loop takes each text in turn. The risky line, `int(text)`, goes inside the `try`. `"10"` converts without trouble, so `10` is printed. Converting `"ten"` raises a `ValueError`, so the `except ValueError` block runs and sets `number` to 0. A `NameError` is a different error, about a name that doesn't exist, so that line wouldn't catch this one. The `print` comes after the `try` and `except`, back at the loop's indentation, so it runs once for each text.
skills: [try-except]
