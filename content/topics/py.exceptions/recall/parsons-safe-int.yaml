id: parsons-safe-int
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `0`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'text = "ten"'
  - 'try:'
  - '    number = int(text)'
  - 'except ValueError:'
  - '    number = 0'
  - 'print(number)'
distractors:
  - 'except NameError:'
explanation: |
  The risky line, `int(text)`, goes inside the `try`. Converting `"ten"` raises a `ValueError`, so the `except ValueError` block runs and sets `number` to 0. A `NameError` is a different error, about a name that doesn't exist, so that line wouldn't catch this one. The `print` comes after, unindented.
skills: [try-except]
