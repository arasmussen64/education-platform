id: mcq-which-error
type: mcq
rev: 1
prompt: |
  Which error does `int("abc")` raise?
choices:
  - '`ValueError`: the type is fine (a string) but the value can''t be turned into a number'
  - '`TypeError`: `int` doesn''t take strings'
  - '`NameError`: `abc` isn''t defined'
  - '`SyntaxError`: the quotes are wrong'
answer: 0
explanation: |
  `int()` happily takes strings like `"42"`; it's the *value* `"abc"` that doesn't fit, so it raises `ValueError`. `TypeError` would be giving it something of the wrong type, like a list. That's why input checking catches `ValueError`.
skills: [try-except]
