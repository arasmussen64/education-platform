id: mcq-loop-exit
type: mcq
rev: 1
prompt: |
  In this function, when does the `while True` loop stop?

  ```python
  def get_int(prompt):
      while True:
          try:
              return int(input(prompt))
          except ValueError:
              print("Try again.")
  ```
choices:
  - 'Never: `while True` always runs forever'
  - 'When `int()` succeeds: the `return` ends the function, and the loop with it'
  - 'After the first `ValueError`, because `print` ends the loop'
  - 'After exactly three tries'
answer: 1
explanation: |
  `while True` has no exit of its own, so the exit is inside: when `int()` succeeds, `return` hands the number back and the whole function ends, loop included. When it fails, the `except` prints and the loop comes round to ask again. That's the "keep asking until it's valid" shape.
skills: [validate-loop]
