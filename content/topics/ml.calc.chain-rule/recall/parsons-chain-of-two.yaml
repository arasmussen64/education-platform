id: parsons-chain-of-two
type: parsons
rev: 2
prompt: |
  Put the lines in order to differentiate `exp(x²)` at `x = 2` by the chain rule and check it numerically, printing `True`. `np.float64(2.0)` is the number 2.0 as a NumPy float. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'x = np.float64(2.0)'
  - 'u = x**2'
  - 'by_rule = np.exp(u) * 2 * x'
  - 'gap = by_rule - (np.exp((x + 1e-6) ** 2) - np.exp((x - 1e-6) ** 2)) / 2e-6'
  - 'print(abs(gap) < 1e-6)'
distractors:
  - 'by_rule = np.exp(x) * 2 * x'
explanation: |
  Inner `u = x²`, outer `exp(u)`. The outer derivative is `exp` evaluated at the **inner value** `u = 4`, times the inner derivative `2x = 4`: about 218.4. `gap` is that answer minus the numeric slope, and the two agree, so the gap is tiny. Each line needs the one before it: `np.float64(2.0)` is the number 2.0 as a NumPy float, so it needs the import. The decoy evaluates `exp` at `x` itself, about 29.6, which is nothing like the slope.
skills: [two, check]
