title: "A derivative that doesn't match"
prompt: |
  `y(x)` is `sigmoid(3x + 1)` squared, a chain of three links, and `dy(x)` should be its derivative by the chain rule. The program prints both at `x = 0.5`, then whether `dy` matches a numeric slope of `y`. It should print:

  ```
  y 0.854038
  dy/dx 0.388715
  matches True
  ```

  Instead `dy/dx` comes out as 4.479922 and the last line says `matches False`. It has two bugs. Run it, fix what you find, and run it again; then run the checks, which compare `dy` with a numeric slope at another point.
hints:
  - "`y` is right, so look at how its derivative is worked out. Write the chain out link by link: what does each link receive, and what is its local derivative?"
  - "The middle link, the sigmoid, receives `u = 3x + 1`, so its derivative must be evaluated at `u`, not at `x`."
  - "The chain rule multiplies the local derivatives; it doesn't add them."
skills: [two, many, check]
