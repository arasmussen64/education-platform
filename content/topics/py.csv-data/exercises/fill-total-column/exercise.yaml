id: fill-total-column
stage: fill_in
rev: 1
title: "Total a column"
prompt: |
  `total_of(path, field)` should add up one numeric column of a CSV file and return the total. Replace each `...`: what `DictReader` reads, and which field of each row to convert and add.
hints:
  - "`csv.DictReader` takes the open file: `csv.DictReader(f)`."
  - "The column to add is the one named by the `field` parameter: `row[field]`, converted with `float()`."
skills: [dict-reader, summarize]
