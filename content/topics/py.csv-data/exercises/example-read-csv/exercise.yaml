id: example-read-csv
stage: worked_example
rev: 1
title: "People in a CSV"
prompt: |
  A program that writes a small CSV file and then reads it back as records. Press **Run**. Then add a third person to `write_sample` and run again.
steps:
  - label: "A CSV is just text"
    lines: "4-9"
    note: "The first line is the header, the rest are records, fields separated by commas. Writing it with plain `write` shows there's nothing magic in the file."
  - label: "One dictionary per row"
    lines: "15-17"
    note: "`csv.DictReader(f)` reads the header and then gives each record as a dictionary with the header's names as keys. The loop is the familiar loop over records."
  - label: "Values are text"
    lines: "18"
    note: "`row[\"age\"]` is the string `\"36\"`. `int()` turns it into a number before it's added. Without that, `+=` would fail with a `TypeError`."
