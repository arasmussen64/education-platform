id: build-csv-summary
stage: build
rev: 2
title: "A sales summary"
prompt: |
  Starting from a blank editor, write a program that summarizes a CSV of sales. Start with `import csv`, then write, each with a docstring:

  - `read_rows(path)` returns all the rows of the file as a list of dictionaries (so the file can be closed before the rows are used).
  - `total_of(rows, field)` returns the total of that field across the rows, as a number.
  - `count_by(rows, field)` returns a dictionary of each value of the field to how many rows have it, in order of first appearance.
  - `main()` writes this file as `sales.csv`, then prints the three lines below.

  ```
  item,region,amount
  pen,north,2.5
  book,south,10
  lamp,north,150
  mug,south,8
  ```

  ```
  Rows: 4
  Total amount: 170.5
  By region: {'north': 2, 'south': 2}
  ```

  Call `main()` under `if __name__ == "__main__":`.
skills: [dict-reader, summarize, split-rows]
