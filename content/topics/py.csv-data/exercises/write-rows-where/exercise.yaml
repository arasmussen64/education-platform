id: write-rows-where
stage: write
rev: 1
title: "Only the matching rows"
prompt: |
  Write a function `rows_where(path, field, value)` that reads a CSV file with `csv.DictReader` and returns a list of the rows (dictionaries) whose `field` equals `value`, in file order. For a file of orders with a `region` column, `rows_where("orders.csv", "region", "north")` returns the northern orders. Start your file with `import csv`.
hints:
  - "Start with an empty list, open the file, loop over `csv.DictReader(f)`."
  - "Compare the field as text: `if row[field] == value:` then append the whole `row`."
skills: [dict-reader, summarize]
