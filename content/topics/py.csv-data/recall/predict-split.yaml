id: predict-split
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines. A line read from a file would look exactly like this string.
code: |
  line = "Ada,London,36\n"
  fields = line.rstrip().split(",")
  print(fields)
  print(len(fields))
  print(fields[2], type(fields[2]))
expected_output: |
  ['Ada', 'London', '36']
  3
  36 <class 'str'>
explanation: |
  `rstrip()` removes the line break, and `split(",")` cuts the line at each comma into a list of three strings. The age is `'36'`, text, not a number: that's true of everything read from a file, and why `int()` is needed before arithmetic.
skills: [split-rows]
