id: mcq-header
type: mcq
rev: 1
prompt: |
  The first line of a CSV file is `name,city,age`. What is it?
choices:
  - 'The first record: a person called `name`'
  - 'The header: the names of the fields, one per column, which `DictReader` uses as keys'
  - 'A comment that Python ignores'
  - 'The number of columns, written out'
answer: 1
explanation: |
  By convention the first line of a CSV names the fields. `csv.DictReader` reads it first and uses those names as the keys of every row's dictionary, so `row["city"]` means "the city field of this row". `csv.reader` doesn't treat it specially, so you'd skip it yourself.
skills: [split-rows]
