id: parsons-split-row
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `pen 5.0`. One line is a decoy that doesn't belong.
lines:
  - 'line = "pen,north,2.5"'
  - 'fields = line.split(",")'
  - 'amount = float(fields[2])'
  - 'print(fields[0], amount * 2)'
distractors:
  - 'amount = fields[2]'
explanation: |
  `split(",")` cuts the row at the commas into a list of three strings. Everything in it is text, so the amount has to be converted with `float()` before `* 2`; as text, `"2.5" * 2` would be `"2.52.5"`. The print needs both.
skills: [split-rows, summarize]
