id: review-mcq-strings
type: mcq
rev: 1
prompt: |
  `row["amount"]` came from a CSV through `DictReader` and holds `"2.5"`. To add it to a running total, you must…
choices:
  - 'convert it first: `total += float(row["amount"])`'
  - 'do nothing special: `total += row["amount"]` works'
  - 'use `int(row["amount"])`, since CSV numbers are whole'
  - 'read the file with `csv.reader` instead, which gives numbers'
answer: 0
explanation: |
  Everything read from a text file is text. Adding a string to a number is a `TypeError`, and `int("2.5")` is a `ValueError`, so `float()` is the conversion that fits an amount like `2.5`. Neither reader converts for you.
skills: [summarize]
