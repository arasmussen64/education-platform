id: mcq-dictreader-row
type: mcq
rev: 1
prompt: |
  With `for row in csv.DictReader(f):` over a file whose header is `name,city,age`, what is `row` on each pass?
choices:
  - 'A list of three strings'
  - 'The line as one string, with the commas'
  - 'A dictionary like `{"name": "Ada", "city": "London", "age": "36"}`, every value a string'
  - 'A dictionary with the ages already converted to numbers'
answer: 2
explanation: |
  `DictReader` pairs each line's fields with the header's names, giving one dictionary per row. The values are still text: converting `"36"` to a number is your job, with `int(row["age"])`. `csv.reader` is the one that gives lists.
skills: [dict-reader]
