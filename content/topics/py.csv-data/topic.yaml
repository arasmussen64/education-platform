id: py.csv-data
kind: topic
status: ready
title: "CSV data"
summary: "Read a CSV file into records with the csv module, turn its text into numbers, and summarize it."
prerequisites: [py.files]
estimated_minutes: 45
rev: 1
objectives:
  - "Know what a CSV file is: one record per line, fields separated by commas, and a header line naming the fields."
  - "Read a CSV with `csv.DictReader`, which gives one dictionary per row with the header's names as keys, and remember that every value is text."
  - "Summarize rows: convert fields to numbers, total a column, and count or add up by group with a dictionary."
