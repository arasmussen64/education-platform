prove:
  build: build-csv-summary
  debug: debug-csv
  explain:
    prompt: |
      Explain CSV files to a friend who has only seen spreadsheets: what the file itself looks like and why the first line matters; what `csv.DictReader` gives you for each row; why `row["amount"] + 1` fails with a `TypeError` and what to do instead; and how you would add up the amounts for each region using a dictionary.
    rubric:
      - id: format
        required: true
        description: "A CSV is plain text: one record per line, fields separated by commas, and the first line is a header naming the fields."
      - id: dictreader
        required: true
        description: "DictReader gives one dictionary per data row, with the header's names as keys."
      - id: strings
        required: true
        description: "Every value is text, so a number field must be converted with int() or float() before arithmetic."
      - id: group-sum
        required: true
        description: "Loop over the rows, use the region as a dictionary key, and add the converted amount to that key's total, starting it at 0 the first time."
    model_answer: |
      A CSV file is the spreadsheet with everything but the text taken away: each line is one record, the fields are separated by commas, and the first line is a header that names the fields, like date,region,amount. With the csv module, csv.DictReader(f) walks the file for you and gives one dictionary per data row, using the header names as keys, so row["amount"] is that row's amount. The catch is that everything read from a file is text: row["amount"] is the string "2.5", and adding 1 to a string is a TypeError. Convert first, float(row["amount"]), inside a try if the data might be messy. To total by region, make an empty dictionary, loop over the rows, and for each one add the converted amount to totals[row["region"]], starting that key at 0 the first time you see it; at the end the dictionary holds one total per region.
review_pool:
