id: mcq-write-the-system
type: mcq
rev: 1
prompt: |
  Three adult tickets and two child tickets cost 29; one adult and four children cost 23. With the unknowns in the order `[adult, child]`, which `A` and `b` describe this?
choices:
  - '`A = [[3, 2], [1, 4]]`, `b = [29, 23]`'
  - '`A = [[3, 1], [2, 4]]`, `b = [29, 23]`'
  - '`A = [[29, 23], [3, 2]]`, `b = [1, 4]`'
  - '`A = [[3, 2], [1, 4]]`, `b = [23, 29]`'
answer: 0
explanation: |
  One row per purchase, the coefficients of adult then child: `[3, 2]` and `[1, 4]`, with the totals `[29, 23]` in the same order. `A = [[3, 1], [2, 4]]` has the rows and columns swapped, which would describe 3 adults and 1 child costing 29. Solving the right one gives an adult ticket of 7 and a child's of 4.
skills: [write-system]
