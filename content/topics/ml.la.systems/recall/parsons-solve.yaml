id: parsons-solve
type: parsons
rev: 2
prompt: |
  Put the lines in order to solve `3x + y = 9` and `x + 2y = 8`, printing `[2. 3.]`. One line gives two names their values at once: in `A, b = ..., ...`, `A` gets the value before the comma and `b` the one after it. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'A, b = np.array([[3.0, 1.0], [1.0, 2.0]]), np.array([9.0, 8.0])'
  - 'unknowns = np.linalg.solve(A, b)'
  - 'print(unknowns)'
distractors:
  - 'unknowns = np.linalg.solve(b, A)'
explanation: |
  The second line names the coefficient matrix and the right-hand sides at once. `solve` takes the coefficient matrix first and the right-hand sides second, and returns the unknowns in the order of the columns: x = 2, y = 3 (check: 6 + 3 = 9, 2 + 6 = 8). The decoy swaps the arguments, which asks a different question and fails, because `b` isn't a square matrix.
skills: [solve]
