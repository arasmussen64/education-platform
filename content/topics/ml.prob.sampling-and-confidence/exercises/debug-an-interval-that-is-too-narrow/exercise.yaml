id: debug-an-interval-that-is-too-narrow
stage: debug
rev: 1
title: "An interval that is far too sure of itself"
prompt: |
  This program builds a 95 percent interval for the mean of 36 scores from a population with mean 100 and spread 15, then checks the procedure's coverage over 1,000 fresh samples. It should print:

  ```
  interval 95.9 106.5
  coverage 0.937
  ```

  It has two bugs. Run it: the coverage is tiny, because the standard error divides by `n` instead of its **square root**, making the interval six times too narrow. Fix that, and the coverage lands near two thirds (0.652 here) rather than 0.95: the interval reaches one standard error each side, where 95 percent needs `z = 1.96` of them.
skills: [standard-error, interval]
