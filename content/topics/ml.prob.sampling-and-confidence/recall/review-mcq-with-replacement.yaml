id: review-mcq-with-replacement
type: mcq
rev: 1
prompt: |
  To bootstrap an interval for a sample's median, you resample the sample 2,000 times. Why must the resampling be **with replacement**, to the same size as the sample?
choices:
  - 'Because without replacement every resample would be the whole sample reordered, so the median would never change'
  - 'Because drawing with replacement is faster, since the generator never has to check what it has already drawn before'
  - 'Because the median only exists for resamples that repeat values, and only replacement produces repeats'
  - 'It needn''t be; sampling a smaller subset without replacement works the same, as the subset is a sample too'
answer: 0
explanation: |
  The bootstrap pretends the sample is the population and draws new samples from it; drawing with replacement means some values appear twice and some not at all, which is what makes each resample different and lets the spread of the recomputed statistic stand in for its real sampling spread. A smaller subset without replacement would measure the spread of a smaller sample, not of yours.
skills: [bootstrap]
