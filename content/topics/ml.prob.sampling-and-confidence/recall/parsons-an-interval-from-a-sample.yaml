id: parsons-an-interval-from-a-sample
type: parsons
rev: 2
prompt: |
  Put the lines in order to print a 95 percent confidence interval for the mean of a sample of 25 values with mean 50 and sample standard deviation 10, `46.08 53.92`. One line is a decoy that doesn't belong.
lines:
  - 'mean, sd, n = 50.0, 10.0, 25'
  - 'se = sd / n ** 0.5'
  - 'margin = 1.96 * se'
  - 'print(round(mean - margin, 2), round(mean + margin, 2))'
distractors:
  - 'se = sd / n'
explanation: |
  The standard error divides the sample's spread by the **square root** of the sample size (`n ** 0.5`): `10 / 5 = 2`, so the margin is `1.96 * 2` and the interval is `50 ± 3.92`. The decoy divides by `n` itself, giving 0.4, an interval five times too narrow, which would make the estimate look far more certain than it is.
skills: [standard-error, interval]
