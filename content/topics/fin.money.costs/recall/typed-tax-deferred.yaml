id: typed-tax-deferred
type: typed
rev: 1
prompt: |
  In one kind of account, investment gains aren't taxed as they happen; the tax comes later, when the money is taken out, so the untaxed money keeps compounding meanwhile. What is that kind of account called? Type the two-word name, hyphen optional.
kind: text
answers:
  - "tax-deferred account"
  - "tax-deferred"
  - "tax deferred account"
  - "tax deferred"
mistakes:
  - id: tax-free
    answers: ["tax-free", "tax free", "tax-free account", "tax-exempt"]
    why: "Tax-free means no tax at all. Here the tax is still paid, only later: the account is tax-deferred."
  - id: taxable
    answers: ["taxable account", "taxable", "ordinary account"]
    why: "An ordinary taxable account pays tax on gains every year. The one that waits is tax-deferred."
explanation: |
  In a **tax-deferred account** the money that would have gone in tax each year stays invested, so the whole return compounds until the money comes out. This topic models it in outline with one made-up flat rate; real accounts' rules differ by country and by account.
skills: [tax-deferral]
