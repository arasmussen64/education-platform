id: parsons-fee-drag
type: parsons
rev: 1
prompt: |
  $10,000 grows 5% a year for 20 years, and a fee of 1% of the balance is taken every year after the growth. Put the lines in order so the program prints the share of the no-fee amount that the fee takes, `18.2% lost`. Two lines are decoys that don't belong. (The first line gives four names their values at once.)
lines:
  - 'start, growth, fee, years = 10000, 0.05, 0.01, 20'
  - 'without = start * (1 + growth) ** years'
  - 'with_fee = without * (1 - fee) ** years'
  - 'print(f"{1 - with_fee / without:.1%} lost")'
distractors:
  - 'with_fee = without * (1 - fee * years)'
  - 'print(f"{with_fee / without:.1%} lost")'
explanation: |
  Without the fee the money is multiplied by `(1 + growth) ** years`. The fee keeps `1 - fee` of the balance each year, so after 20 years the fee has left `0.99 ** 20`, about 81.8%, of what there would have been: 18.2% lost. The decoy `1 - fee * years` charges 1% of the starting amount twenty times, 20% in all, as if the fee never touched the growth. The other decoy prints the share that's left, not the share lost.
skills: [fee-drag]
