id: mcq-why-deferral-wins
type: mcq
rev: 1
prompt: |
  Two accounts earn the same 7% a year, and a made-up 30% tax applies to gains in both. One is taxed every year; the other is tax-deferred and taxed once on the whole gain at the end. Why does the deferred one end with more after tax?
choices:
  - "Its gains are taxed at a lower rate, because one large payment counts as a single year"
  - "The money that would have gone in tax each year stays invested and keeps compounding"
  - "It pays less tax in dollars over the years, because the gains it's taxed on are smaller"
  - "Taxes paid at the end are worth less, because inflation shrinks every later payment"
answer: 1
explanation: |
  Both pay the same 30% rate. Taxed every year, the balance compounds at 7% × 0.7 = 4.9%. Deferred, the whole 7% compounds, including the part that will one day go in tax, and that part earns growth of its own for the whole time. At the end the tax takes 30% of the gain, but what's left is still more.

  The deferred account actually pays more tax in dollars, because its gain is bigger; it still ends ahead. Inflation is real but isn't in this example: the numbers come out the same without it.
skills: [tax-deferral]
