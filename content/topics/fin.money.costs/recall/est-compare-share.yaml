id: est-compare-share
type: estimate
rev: 1
prompt: |
  Two made-up retirement projections for the same savings: the low-cost option ends at $612000 and the high-cost option at $455000. As a share of the better option's amount, how far behind is the other one, in percent? Within 1%.
unit: "%"
answer: 25.65
tolerance: { percent: 1 }
amounts: made-up
given: { better: 612000, worse: 455000 }
working: (better - worse) / better * 100
mistakes:
  - id: share-of-worse
    value: 34.51
    working: (better - worse) / worse * 100
    why: "That divides by the smaller amount, which answers \"how much more does the better one have?\". The share of the better one's amount is (612,000 - 455,000) / 612,000."
  - id: ratio
    value: 74.35
    working: worse / better * 100
    why: "That's how much of the better amount the other one reaches. The gap is what's missing: 100% minus that."
explanation: |
  The gap is $157,000, and as a share of $612,000 that's about 25.7%: the high-cost option ends with about a quarter less. Dividing by $455,000 instead gives 34.5%, a true statement about a different question (the cheap option has 34.5% more), so always say which amount the share is of.
skills: [costs-compare]
