id: contrast-yearly-or-one-off-fee
type: mcq
rev: 1
prompt: |
  Two made-up funds grow the same before costs. Fund P takes 1% of your money once, when you put it in. Fund Q takes 1% of your balance every year. After 30 years, roughly what share of the no-cost amount has each one taken?
choices:
  - "Both about 1%, because a percentage fee is the same size however it's charged"
  - "P about 26% and Q 1%, because the charge at the start loses all its growth"
  - "P 1% and Q about 26%, because Q's fee is charged again on every year's growth"
  - "P 1% and Q 30%, because Q charges 1% of the starting amount thirty times"
answer: 2
explanation: |
  P's one-off fee, a **transaction fee**, removes 1% at the start, and everything after grows on 99% of the money: it ends 1% behind. Q's **ongoing fee** leaves 99% every year, so after 30 years it leaves 0.99 ** 30, about 74%, of the no-fee amount: about 26% gone.

  It isn't 30%: Q's fee is a share of a balance that the fee itself keeps shrinking, not 1% of the start each year. P's charge does lose the growth it would have earned, but that's still only 1% of the final amount, because the growth is lost in proportion.
skills: [fee-drag]
