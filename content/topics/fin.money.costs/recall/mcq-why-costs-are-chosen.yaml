id: mcq-why-costs-are-chosen
type: mcq
rev: 1
prompt: |
  Two funds track the same market and hold the same companies. One charges 0.1% a year and the other 1.0%. Over the next 20 years, which statement is safest?
choices:
  - "The dearer fund will very likely end behind, by roughly the fees' gap compounded"
  - "The dearer fund will likely end ahead, because a higher fee buys better management"
  - "Nobody can say which ends ahead, because future market returns are unknown"
  - "Both will end level, because a fund's fee comes out of the company's profits"
answer: 0
explanation: |
  Holding the same companies, both funds get the same returns before costs, whatever the market does. So the one thing that differs is known in advance: the dearer fund keeps 99.0% of its balance a year and the cheaper 99.9%, and after 20 years it's about 16% behind ((0.990 / 0.999) ** 20 ≈ 0.835). That's why costs are called the one part of the return you choose.

  Future returns are unknown, but they're the same for both funds here, so they don't decide the comparison. The fee comes out of the fund, which is to say out of your balance, not out of the companies' profits. And with identical holdings there's nothing for a higher fee to buy.
skills: [costs-compare]
