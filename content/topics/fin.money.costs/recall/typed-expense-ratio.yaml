id: typed-expense-ratio
type: typed
rev: 1
prompt: |
  A fund's yearly running costs are stated in its prospectus as a percentage of the money in the fund, taken out before you see its return. Name that percentage, two words.
kind: text
answers:
  - "expense ratio"
  - "total expense ratio"
  - "annual fund operating expenses"
mistakes:
  - id: transaction-fee
    answers: ["transaction fee", "commission", "sales load", "load"]
    why: "That's charged when you buy or sell. The yearly running cost, as a share of the fund, is the expense ratio."
  - id: management-fee
    answers: ["management fee"]
    why: "The manager's fee is usually one part of it. The whole yearly cost, as a percentage, is the expense ratio."
explanation: |
  The **expense ratio** is an ongoing fee: every year the fund takes that share of its assets to pay its costs, so it compounds against you the way the topic's fee loop shows. The SEC's bulletin points to the fee table in a fund's prospectus, where it appears as annual fund operating expenses.
skills: [fee-drag]
