id: est-deferred-amount
type: estimate
rev: 1
prompt: |
  $10000 goes into a tax-deferred account and grows 6% a year, untaxed, for 30 years. At the end, a made-up flat tax of 25% is taken from the gain (the final balance minus the $10000). What is left after the tax, in dollars? Within 1%.
unit: "US dollars"
answer: 45576
tolerance: { percent: 1 }
amounts: made-up
given: { start: 10000, growth: 6, years: 30, tax: 25 }
working: start * (1 + growth / 100) ** years - tax / 100 * (start * (1 + growth / 100) ** years - start)
mistakes:
  - id: taxed-everything
    value: 43076
    working: start * (1 + growth / 100) ** years * (1 - tax / 100)
    why: "That taxes the whole balance, including the $10,000 put in. In this outline only the gain is taxed."
  - id: no-tax
    value: 57435
    working: start * (1 + growth / 100) ** years
    why: "That's the balance before the tax at the end. A quarter of the $47,435 gain still goes in tax."
explanation: |
  Untaxed, the money grows to $10,000 × 1.06 ** 30 ≈ $57,435. The gain is $47,435, and a quarter of it, about $11,859, goes in tax, leaving about $45,576. Taxed every year at the same rate, the money would have grown at 4.5% instead, to about $37,453: the deferred account ends about $8,100 ahead because the tax money stayed invested.
skills: [tax-deferral]
