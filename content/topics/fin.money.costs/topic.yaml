prove:
  build: build-what-a-fee-takes
  debug: debug-fee-calculator
  explain:
    prompt: |
      A friend is choosing between two funds that hold the same things. One charges 0.1% a year and the other 1%. "It's less than one percent," they say, "it can't matter much." Explain, in a paragraph and with at least one number, why a yearly fee matters more the longer the money is invested, and why a fee is different from the return itself when comparing two funds.
    rubric:
      - id: compounds
        required: true
        description: "A yearly fee is a share of the whole balance, including all earlier growth, so it compounds: each year it leaves (1 - fee) of the balance, and over n years (1 - fee) ** n."
      - id: number
        required: true
        description: "Gives a correct number that grows with time, e.g. a 1% fee takes about 10% over 10 years and about 26% over 30, or the 0.1% fund ends about 16% ahead of the 1% fund after 20 years."
      - id: known-in-advance
        required: true
        description: "For two funds holding the same things the returns before fees are the same, so the fee is the one difference that's known in advance and chosen; future returns aren't."
      - id: share-of-better
        required: false
        description: "Compares the final amounts as a share of the better one, with the same start, growth and years for both."
    model_answer: |
      A yearly fee isn't charged once on what you put in: it's a share of the whole balance every year, including everything the earlier years grew, so it compounds against you exactly the way growth compounds for you. Each year a 1% fee leaves 99% of the balance, so after n years it has left 0.99 ** n of what there would have been. That's about 90% after 10 years, so the fee took 10%; about 74% after 30 years, a quarter gone; and about 67% after 40, a third gone. The friend's two funds hold the same things, so before fees they get the same return, whatever the market does. The only difference between them is the fee, and it's known in advance: each year the dear fund keeps 0.990 of its balance and the cheap one 0.999, so after 20 years the dear fund has (0.990 / 0.999) ** 20, about 0.835, of the cheap fund's amount, about 16% less. Nobody can choose what the market returns, but anyone can choose what they pay, which is why costs are the one part of the return you control.
