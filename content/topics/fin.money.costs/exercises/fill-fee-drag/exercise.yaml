id: fill-fee-drag
stage: fill_in
rev: 1
title: "What a 1.5% fee takes"
prompt: |
  $5,000 grows 8% a year for 25 years, with and without a yearly fee of 1.5% of the balance. Each year the balance grows, then the fee is taken. Replace each `...` so the program prints:

  ```
  Without the fee: $34,242.38
  With the fee: $23,467.65
  The fee takes 31.5%
  ```

  Both gaps stand where a value goes, so Python starts the program with the gaps still in it and stops with a `TypeError` that mentions `ellipsis`. The checks also run it with other numbers.
hints:
  - "Taking a fee of 1.5% leaves 98.5% of the balance: multiply by `1 - fee`."
  - "The share the fee takes is the gap as a share of the amount you'd have had without it."
skills: [fee-drag, costs-compare]
