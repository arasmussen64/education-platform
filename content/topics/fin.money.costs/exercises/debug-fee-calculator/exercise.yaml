id: debug-fee-calculator
stage: debug
rev: 1
title: "A fee calculator"
prompt: |
  This calculator shows what a yearly fee of 1.2% of the balance does to $40,000 growing 5% a year for 25 years. Each year the balance should grow, then the fee is taken as a share of the new balance; the last line gives the gap as a share of what you'd have had without the fee. It should print:

  ```
  Without the fee: $135,454.20
  With the fee: $100,165.02
  The fee takes 26.05% of what you'd have had
  ```

  Instead the fee looks almost harmless: the balance with the fee is only about $1,600 short and the share is 1.21%. It has two bugs. Run it, fix one thing at a time, and run it again after each fix.
skills: [fee-drag, costs-compare]
