id: build-what-a-fee-takes
stage: build
rev: 1
title: "What a fee takes, decade by decade"
prompt: |
  From a blank editor. $25,000 grows 6% a year, and a fund charges a fee of 0.8% of the balance every year. Start your program with these three lines (the checks change them):

  ```python
  start = 25000
  growth = 0.06
  fee = 0.008
  ```

  Write two functions:

  - `final_amount(start, growth, fee, years)` returns the balance after `years` years, when each year the balance grows by `growth` and then the fee is taken as a share of the new balance. With `fee` set to 0 it gives the amount with no fee.
  - `share_lost(start, growth, fee, years)` returns the share of the no-fee amount that the fee takes, as a decimal.

  Then print a line for 10, 20, 30 and 40 years:

  ```
  10 years: $44,771.19 without the fee, $41,315.73 with it, 7.7% lost
  20 years: $80,178.39 without the fee, $68,279.57 with it, 14.8% lost
  30 years: $143,587.28 without the fee, $112,840.79 with it, 21.4% lost
  40 years: $257,142.95 without the fee, $186,483.97 with it, 27.5% lost
  ```

  The checks also call your functions with other numbers.
skills: [fee-drag, costs-compare]
