id: example-a-fee-over-thirty-years
stage: worked_example
rev: 1
title: "A 1% fee over thirty years"
prompt: |
  $10,000 grows 7% a year for 30 years, once with no fee and once with a fee of 1% of the balance every year. This program follows both balances year by year, then works out the share the fee took. Press **Run**, then read how each part works.
steps:
  - label: "The numbers, as decimals"
    lines: "1-4"
    note: "Growth of 7% is `0.07` and a fee of 1% is `0.01`, the module's rule for rates. Money is a float, rounded only when it's printed."
  - label: "Two balances, side by side"
    lines: "6-7"
    note: "Both start at the same $10,000, so any difference at the end is the fee's doing."
  - label: "Grow, then take the fee"
    lines: "8-11"
    note: "Each year both balances grow by 7%. Then the fee is taken from the second one as a share of its new balance: keeping 99% is multiplying by `1 - fee`. The fee is charged on the growth from every earlier year too, which is why it compounds."
  - label: "A line every ten years"
    lines: "12-13"
    note: "`year % 10 == 0` is true when the year divides by 10 with nothing left over: years 10, 20 and 30. The loop counts from 1 so that `year` is the number of years that have passed. `:,.2f` prints money with commas and two decimal places."
  - label: "The share the fee took"
    lines: "15-16"
    note: "The gap between the two balances, as a share of the no-fee balance: 26.0%. The fee took about a quarter of what the money would have grown to."
  - label: "The same share, by formula"
    lines: "17"
    note: "Each year the fee leaves `1 - fee` of the balance, so after 30 years it has left `(1 - fee) ** 30` of what there would have been: 0.99 ** 30 is about 0.740. One minus that is the same 26.0%, whatever the growth rate."
