id: review-two-funds-fees
stage: review_code
rev: 1
title: "Two funds, two fees"
prompt: |
  Two made-up funds hold the same things and grow 6.5% a year before fees. Fund A charges 0.9% of the balance a year and fund B 0.15%. Start from these lines:

  ```python
  start = 30000
  growth = 0.065
  fee_a = 0.009
  fee_b = 0.0015
  years = 30
  ```

  Each year the balance grows, then the fee is taken as a share of the new balance. Print both funds' final amounts, then the difference between them as a share of the better fund's amount:

  ```
  Fund A: $151,293.10
  Fund B: $189,693.11
  Difference: 20.2% of the better fund's amount
  ```

  Keep the starting lines: the checks run your program with other fees, where fund A may be the cheaper one.
skills: [costs-compare, fee-drag]
