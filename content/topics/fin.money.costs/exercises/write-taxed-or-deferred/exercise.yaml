id: write-taxed-or-deferred
stage: write
rev: 1
title: "Taxed every year, or taxed at the end"
prompt: |
  $20,000 grows 7% a year for 25 years, with a made-up flat tax of 30% on gains. Start from these four lines (the checks change them):

  ```python
  start = 20000
  growth = 0.07
  tax = 0.30
  years = 25
  ```

  Write two functions, each returning the final amount after tax:

  - `taxed_every_year(start, growth, tax, years)`: each year the gain is `balance * growth`, the tax takes its share of that gain, and the rest is added to the balance.
  - `taxed_at_the_end(start, growth, tax, years)`: the balance grows untaxed every year; at the end the tax takes its share of the whole gain, the final balance minus `start`.

  Then print:

  ```
  Taxed every year: $66,132.84
  Taxed at the end: $81,984.06
  Difference: $15,851.21
  ```
hints:
  - "Taxed every year: inside the loop, `gain = balance * growth`, then `balance = balance + gain * (1 - tax)`."
  - "Taxed at the end: grow with `balance = balance * (1 + growth)` in the loop; after it, `gain = balance - start` and return `balance - gain * tax`."
  - "Money prints with `f\"${amount:,.2f}\"`."
skills: [tax-deferral]
