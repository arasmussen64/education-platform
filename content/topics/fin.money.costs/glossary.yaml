- term: transaction fee
  definition: "A charge made when you buy, sell or exchange an investment, such as a commission. It's taken once per trade."
- term: ongoing fee
  definition: "A charge taken regularly, usually yearly, as a share of what you hold, whether or not you trade. It compounds against you."
- term: expense ratio
  definition: "A fund's yearly running costs as a percentage of the money in it, taken out of the fund before you see its return."
- term: fee drag
  definition: "The share of the no-fee amount that a yearly fee takes over time: `1 - (1 - fee) ** years` when the fee is taken after each year's growth."
- term: after-tax return
  definition: "What an investment grows by once tax on the gain is taken: a 6% gain taxed at 25% is a 4.5% after-tax return."
- term: tax-deferred account
  definition: "An account whose investment gains aren't taxed as they happen but later, when money comes out, so the untaxed money keeps compounding meanwhile."
