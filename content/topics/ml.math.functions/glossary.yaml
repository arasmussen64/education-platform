- term: slope
  definition: How much a line's output changes when its input goes up by 1, the number that multiplies `x` in `y = m * x + b`. From two points, the change in y divided by the change in x.
- term: intercept
  aliases: [y-intercept]
  definition: A line's output when its input is 0, the number on its own in `y = m * x + b`. On a graph it is where the line crosses the y-axis.
- term: composition
  definition: Using one function's output as another function's input, written `f(g(x))`. It is worked from the inside out, and swapping the order usually changes the answer.
- term: table of values
  definition: A function's inputs listed beside their outputs, one row for each input. In Python it is a loop that prints `x` and `f(x)`, and a graph is its rows drawn as points.
