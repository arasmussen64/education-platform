- term: PID
  aliases: [process ID]
  definition: "Process ID, the number the kernel uses for a running process. `kill`, `ps` and `/proc/PID/` all refer to a process by it."
- term: PPID
  definition: "Parent process ID, the PID of the process that started this one. Every process has a parent, back to PID 1."
- term: fork
  definition: "The step that makes a new process: a running process makes a copy of itself, the child, which then usually runs exec."
- term: exec
  definition: "The step in which a process replaces its own program with another one, keeping its PID. A shell runs a command by forking, then exec."
- term: zombie
  definition: "A process that has already exited but whose entry stays in the process table until its parent reads its exit status. `kill -9` can't remove it."
- term: systemd
  definition: "The first program the kernel starts, PID 1 on most Linux servers. It starts every service in the right order, restarts them when they crash and keeps their logs."
