id: fill-run-report
stage: fill_in
runtime: lab
lab:
  init: systemd
rev: 1
title: "Finish the report runner"
prompt: |
  In the lab, `~/bin/run-report` is a script with four gaps marked `...`. It should start the shop's report job, `/srv/tools/make-report.sh`, in the background, print `started report as PID N` with the job's PID, wait for the job to finish, and then print `report finished` or `report failed with status N`, exiting with the job's status. The job takes a second and succeeds; `~/bin/run-report broken` passes the word along to the job, which then fails with status 3, so you can test both paths. Fill the gaps with `nano ~/bin/run-report`, try both runs, and run the checks.
hints:
  - "`&` at the end of a command runs it in the background. Right after that, `$!` is the PID of the job just started; `$$` is the script's own PID, which isn't what you want."
  - "`wait \"$pid\"` pauses until that job ends, and then `$?` is the job's exit status. Read `$?` on the very next line: every command, even `echo`, replaces it."
  - "The gaps, in order: `&`, `$!`, `\"$pid\"`, `$?`."
skills: [job-control, process-model]
