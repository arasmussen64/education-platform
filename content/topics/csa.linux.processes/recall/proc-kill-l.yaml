id: proc-kill-l
type: predict_shell
rev: 1
prompt: |
  `kill -l NUMBER` prints the name of the signal with that number. Three of them are the ones everyone ends up typing. What is printed?
command: kill -l 9; kill -l 15; kill -l 2
expected_output: |
  KILL
  TERM
  INT
explanation: |
  `kill -9` is `KILL`, the signal that can't be caught or ignored. `kill` with no number sends 15, `TERM`, the polite request to stop. Ctrl-C sends 2, `INT`. The numbers are what you'll see in old scripts and in exit codes (a process killed by signal N often reports 128 + N, so 137 means `KILL`), but the names are clearer: `kill -TERM 1234`.
skills: [signals]
