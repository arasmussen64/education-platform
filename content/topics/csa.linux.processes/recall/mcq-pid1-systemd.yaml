id: mcq-pid1-systemd
type: mcq
rev: 1
prompt: |
  What is special about PID 1 on a Linux server?
choices:
  - "It's the shell of the first user who logged in"
  - "It's the kernel"
  - "It's the init system, systemd on most distributions: the first process the kernel starts, which starts and supervises services and adopts orphaned processes"
  - "It's the process using the most memory"
answer: 2
explanation: |
  The kernel starts exactly one program, and everything else descends from it. On nearly every modern distribution that program is systemd. It reads unit files, starts services in dependency order, restarts the ones that crash, groups them into targets, and becomes the parent of any process whose own parent has died, reaping it when it exits. The kernel itself isn't a process in this list, and PID 1 is often small.
skills: [init-systemd]
