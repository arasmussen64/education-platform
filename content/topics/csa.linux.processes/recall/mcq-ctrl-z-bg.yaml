id: mcq-ctrl-z-bg
type: mcq
rev: 2
prompt: |
  You started a long backup in the terminal without `&`, and now you need the prompt back while it keeps running. What do you do?
choices:
  - "Press Ctrl-C to pause it, then type `bg` to let it carry on in the background"
  - "Press Ctrl-Z to move it to the background, then type `fg` to get the prompt back"
  - "Press Ctrl-Z to pause it, then type `bg` to let it carry on in the background"
  - "Press Ctrl-C to move it to the background, then type `fg` to get the prompt back"
answer: 2
explanation: |
  Ctrl-Z sends `TSTP`, which pauses the job and gives you the prompt back; `bg` sends `CONT`, and the job carries on in the background, where `jobs` lists it. Ctrl-C sends `INT`, which neither pauses the backup nor moves it anywhere: it ends it, and the progress is lost. Ctrl-Z alone leaves the job stopped, not running, and `fg` is the opposite of what you want: it brings the job back to the front and takes the prompt away again.
skills: [job-control, signals]
