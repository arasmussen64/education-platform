id: mcq-ctrl-z-bg
type: mcq
rev: 1
prompt: |
  You started a long backup in the terminal without `&`, and now you need the prompt back while it keeps running. What do you do?
choices:
  - "Press Ctrl-C, then start it again with `&`"
  - "Press Ctrl-Z to stop it, then type `bg` to let it continue in the background"
  - "Press Ctrl-D"
  - "Open `top` and lower its priority"
answer: 1
explanation: |
  Ctrl-Z sends `TSTP`, which pauses the job and returns the prompt; `bg` sends `CONT` and the job carries on in the background, where `jobs` lists it and `fg` can bring it back. Ctrl-C sends `INT`, which ends the backup and loses the progress. Ctrl-D closes the shell's input. Priority (`nice`) is about CPU share, not about getting your prompt back.
skills: [job-control, signals]
