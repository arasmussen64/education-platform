id: mcq-nohup
type: mcq
rev: 2
prompt: |
  You start a long data import over SSH with `./import.sh &`, close your laptop, and later find it stopped partway. Why, and what would have kept it running?
choices:
  - "The closed terminal sent its jobs `KILL`; a `trap` for `KILL` in the script would have caught it"
  - "A background job is paused when its terminal closes; `bg` before leaving would have kept it running"
  - "`&` ties a job to the SSH connection; started without the `&`, `./import.sh` would have carried on"
  - "The closed terminal sent its jobs `HUP`; `nohup ./import.sh &` would have made it ignore the signal"
answer: 3
explanation: |
  When the terminal goes away, its jobs get `HUP` (hang-up), whose default action is to exit. `nohup` makes the command ignore `HUP` (and sends its output to `nohup.out`), so it outlives the session; tools like `tmux` do the same by keeping the terminal alive; on a server, the lasting answer is a systemd service, which PID 1 supervises and restarts. The signal isn't `KILL`, and no `trap` could catch `KILL` anyway. The job wasn't paused, it was ended, and `bg` only resumes a job you stopped with Ctrl-Z. Leaving out the `&` wouldn't help either: a job in the foreground gets the same `HUP`.
skills: [job-control]
