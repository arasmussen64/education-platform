id: mcq-systemctl-enable-start
type: mcq
rev: 2
prompt: |
  You've installed nginx on a server. You want it running now *and* after every reboot. Which pair of commands?
choices:
  - "`systemctl start nginx` alone: a service that has been started is also started at every boot"
  - "`systemctl enable nginx` alone: enabling a service starts it now and at every boot from then on"
  - "`systemctl restart nginx` and `systemctl start nginx`: one covers reboots, the other starts it now"
  - "`systemctl start nginx` and `systemctl enable nginx`: one starts it now, the other at every boot"
answer: 3
explanation: |
  `start` runs the service now; `enable` links its unit into a target so that it starts at boot. They're separate on purpose: you can run something once without making it permanent, or set it up for the next boot without disturbing the machine now. With `start` alone the service is gone after a reboot, and with `enable` alone it stays stopped until one; `systemctl enable --now nginx` does both in one command. `restart` has nothing to do with the machine rebooting: it stops the service and starts it again, now.
skills: [init-systemd]
