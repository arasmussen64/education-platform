id: mcq-systemctl-enable-start
type: mcq
rev: 1
prompt: |
  You've installed nginx on a server. You want it running now *and* after every reboot. Which pair of commands?
choices:
  - "`systemctl start nginx` only; starting a service also makes it start at boot"
  - "`systemctl enable nginx` only; enabling a service also starts it now"
  - "`systemctl start nginx` and `systemctl enable nginx` (or `systemctl enable --now nginx`)"
  - "`nginx &` from your shell, then log out"
answer: 2
explanation: |
  `start` runs the service now; `enable` links its unit into a target so it starts at boot. They're separate on purpose: you can run something once without making it permanent, or install it for next boot without disturbing the machine now. `enable --now` does both. A program started with `&` from your shell belongs to your terminal, not to PID 1, and gets `HUP` when you log out.
skills: [init-systemd]
