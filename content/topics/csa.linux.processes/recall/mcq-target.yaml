id: mcq-target
type: mcq
rev: 2
prompt: |
  In systemd, what is a *target* such as `multi-user.target`?
choices:
  - "A named group of units that are started together: `multi-user.target` is a fully started server"
  - "The folder where unit files are kept: `multi-user.target` holds the units any user may start"
  - "The account a service runs as: `multi-user.target` lets a service run as several users at once"
  - "A limit that systemd enforces: `multi-user.target` sets how many users may be logged in at once"
answer: 0
explanation: |
  A target names a set of units that should be active together, and booting "into" a target means starting them all, in dependency order; targets are how systemd replaces the old numbered runlevels. `multi-user.target` is the usual server state, without a graphical desktop; `graphical.target` adds the desktop; `rescue.target` is the minimal repair shell. `systemctl enable` works by linking a unit into a target's wants. A target isn't a folder (unit files live in folders such as `/etc/systemd/system`), it isn't an account, and it limits nothing: the "multi-user" in the name only means the machine is up far enough for users to log in.
skills: [init-systemd]
