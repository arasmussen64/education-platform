id: mcq-target
type: mcq
rev: 1
prompt: |
  In systemd, what is a *target* such as `multi-user.target`?
choices:
  - "A machine the service connects to"
  - "A named group of units that should be active together, used as a goal to boot into: `multi-user.target` is a fully started server without a graphical desktop"
  - "The directory where unit files live"
  - "The user a service runs as"
answer: 1
explanation: |
  Targets are how systemd replaces the old numbered runlevels: a target names a set of units, and booting "into" it means starting them all, in dependency order. `multi-user.target` is the usual server state; `graphical.target` adds the desktop; `rescue.target` is the minimal repair shell. `systemctl enable` works by linking a unit into a target's wants.
skills: [init-systemd]
