id: csa.linux.processes
kind: topic
status: ready
title: "Processes and signals"
summary: "What a running program is to Linux: how a process is born with fork and exec, how signals stop it politely or by force, what a zombie is, and what PID 1 does for the services on a server."
prerequisites: [csa.linux.shell]
estimated_minutes: 90
rev: 1
objectives:
  - "Explain how a process comes into being (fork, then exec), what a PID and a parent process are, and what an exit status tells the shell."
  - "Say what a signal is and choose the right one: `TERM` to ask a program to stop, `KILL` when it won't, `INT` from Ctrl-C, `HUP` when a terminal closes."
  - "Run jobs in the background with `&`, `wait`, `jobs`, `fg`, `bg` and `nohup`, and read `$?`, `&&` and `||`."
  - "Explain what a zombie process is, why `kill -9` can't remove one, and what the init system (systemd, PID 1) does: units, targets and `systemctl`."
