prove:
  build: build-nightly-runner
  debug: debug-stop-workers
  explain:
    prompt: |
      A teammate says a service "won't die": `kill` did nothing, and it still shows in `ps`, marked `<defunct>`. Another teammate wants to stop a runaway script "the gentle way first". Explain, in your own words: what a process is and how a new one comes into being (fork and exec), and what a PID and a parent process are; what a signal is, the difference between `TERM` and `KILL`, and why you send `TERM` first; what a zombie actually is and why `kill -9` can't remove one, and what does; and what PID 1 (systemd) does for the services on a server.
    rubric:
      - id: fork-exec
        required: true
        description: "A process is a running program with its own ID (PID); a new one is made by fork, a copy of the parent, which then calls exec to replace itself with the new program; every process but PID 1 has a parent."
      - id: signals
        required: true
        description: "A signal is a short message from the kernel to a process; TERM asks the program to stop and lets it clean up (it can be caught or ignored), KILL ends it at once and can't be caught; TERM first so files and connections close cleanly, KILL only if it doesn't stop."
      - id: zombie
        required: true
        description: "A zombie has already exited; what's left is its entry in the process table, kept until the parent reads its exit status with wait. Signals can't kill what's already dead; the fix is to make the parent reap it, or end the parent so PID 1 adopts and reaps it."
      - id: init
        required: true
        description: "PID 1, systemd, is started by the kernel and starts everything else: it starts services from unit files, restarts them, groups them into targets, and adopts orphaned processes; systemctl talks to it."
      - id: job-control
        required: false
        description: "& runs a command in the background, Ctrl-Z stops it, bg and fg resume it, wait waits for it, nohup lets it outlive the terminal; $? is the exit status, 0 for success, which && and || test."
    model_answer: |
      A process is a program that is running: its code, its memory, its open files, and a number, the PID, that the kernel uses to refer to it. New processes come from existing ones. When the shell runs a command it first calls fork, which makes a copy of itself, and the copy then calls exec, which replaces the copied program with the one you asked for; the original shell is the parent, the new process is its child, and the child's PPID is the parent's PID. When a process finishes it leaves an exit status, 0 for success, which the parent collects. A signal is a short message from the kernel to a process, usually sent with kill or by a key like Ctrl-C. TERM means "please stop": the program can catch it, finish writing its files, close its connections and exit, or even ignore it. KILL can't be caught or ignored: the kernel just ends the process. So you send TERM first, wait a moment, and only then KILL, because a program killed outright may leave half-written files or locks behind. A zombie is a process that has already exited; what's left is only its entry in the process table, kept so the parent can read its exit status with wait. Signals act on running programs, and a zombie isn't running, so kill -9 does nothing to it. It disappears when the parent reads the status, or when the parent itself ends, because then PID 1 adopts the zombie and reaps it. PID 1 is systemd, the first process the kernel starts; it starts the services described in unit files, restarts them when they fail, groups them into targets like multi-user.target, adopts orphans, and is what systemctl talks to when you start, stop, enable or check a service.
