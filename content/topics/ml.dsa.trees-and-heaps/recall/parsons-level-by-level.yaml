id: parsons-level-by-level
type: parsons
rev: 1
prompt: |
  Put the lines in order to walk the tree breadth-first, level by level, and print `['a', 'b', 'c', 'd']`. One line is a decoy that doesn't belong.
lines:
  - 'from collections import deque'
  - 'tree = {"a": ["b", "c"], "b": ["d"], "c": [], "d": []}'
  - 'queue = deque(["a"])'
  - 'order = []'
  - 'while queue:'
  - '    node = queue.popleft()'
  - '    order.append(node)'
  - '    queue.extend(tree[node])'
  - 'print(order)'
distractors:
  - '    node = queue.pop()'
explanation: |
  Breadth-first takes nodes from the front of the queue, so a node's children, added at the back, wait until the nodes already queued are done: a, then b and c, then d. The decoy's `pop()` takes from the back, which turns the queue into a stack and visits c before b: depth-first, in a different order.
skills: [traverse]
