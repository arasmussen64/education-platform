id: py.while-loops
kind: topic
status: ready
title: "while loops"
summary: "Repeat until a condition changes, count with a loop variable, and stop an infinite loop."
prerequisites: [py.m2.checkpoint]
estimated_minutes: 45
rev: 1
objectives:
  - "Repeat lines with `while` for as long as a condition is `True`, and know exactly when the condition is checked."
  - "Count up or down with a loop variable: give it a start, test it, and update it with `+= 1` or `-= 1`."
  - "Recognize an infinite loop, stop one, and fix the condition or the update that caused it."
