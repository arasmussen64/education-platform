id: example-countdown
stage: worked_example
rev: 1
title: "A countdown"
prompt: |
  This program counts down from 3 and then prints `Liftoff!`. Press **Run**, then change line 1 to `count = 5` and run it again. Then try `count = 0`.
steps:
  - label: "The start"
    lines: "1"
    note: "The loop variable gets its starting value before the loop. Everything the loop does depends on it."
  - label: "The test, checked before each repeat"
    lines: "2"
    note: "`while count > 0:` is checked before every pass. If it's `True`, the indented lines run once more; if it's `False`, Python skips to line 5. With `count = 0` the block never runs at all."
  - label: "The body: do something, then update"
    lines: "3-4"
    note: "Each pass prints the current value, then `count -= 1` makes it one smaller. Without that line, `count` would stay 3 and the loop would never end."
  - label: "After the loop"
    lines: "5"
    note: "Back at the left margin, so it isn't part of the loop. It runs once, when the condition has become `False`."
