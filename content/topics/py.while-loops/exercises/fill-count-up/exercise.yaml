id: fill-count-up
stage: fill_in
rev: 1
title: "Count to n"
prompt: |
  This program should ask for a number and count from 1 up to it, one number per line. Replace each `...`: the loop variable's starting value, and the line that moves it on. Typing `3` should print:

  ```
  1
  2
  3
  ```
hints:
  - "The first number printed is 1, so that's where `i` starts."
  - "Inside the loop, after printing, make `i` one bigger: `i += 1`. Without it, `i` never changes and the loop never ends."
skills: [counting, infinite-loops]
