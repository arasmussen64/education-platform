id: write-sum-to-n
stage: write
rev: 1
title: "Add them up"
prompt: |
  Write a program that asks for a whole number and prints the sum of every whole number from 1 up to it, using a loop. Typing `4` should print:

  ```
  10
  ```

  because 1 + 2 + 3 + 4 is 10.
hints:
  - "You need two names: one that counts from 1 to n, and one that holds the total so far, starting at 0."
  - "Each pass through the loop adds the current number to the total, then moves the counter on by one."
  - "Print the total once, after the loop."
skills: [counting, while-condition]
