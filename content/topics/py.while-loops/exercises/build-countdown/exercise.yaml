id: build-countdown
stage: build
rev: 1
title: "Countdown"
prompt: |
  Starting from a blank editor, write a program that asks for a whole number and counts down from it to 1, one number per line, then prints `Go!`. Typing `3` should print:

  ```
  3
  2
  1
  Go!
  ```
skills: [counting, while-condition]
