id: debug-doubling
stage: debug
rev: 1
title: "Doubling up"
prompt: |
  This program starts at 1 and keeps doubling until it reaches the target or more, printing each step, then says how many steps it took. Typing `8` should print:

  ```
  Step 1: 2
  Step 2: 4
  Step 3: 8
  Reached 8 in 3 steps
  ```

  and typing `5` should print the same three steps and then `Reached 5 in 3 steps`. It has three bugs. Trace it before you run it.
skills: [while-condition, counting, infinite-loops]
