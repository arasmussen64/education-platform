id: review-predict-halving
type: predict_output
rev: 1
prompt: |
  Trace this loop and say what it prints. Remember that `//` divides and drops the remainder.
code: |
  n = 20
  steps = 0
  while n > 1:
      n = n // 2
      steps += 1
  print(n, steps)
expected_output: |
  1 4
explanation: |
  `n` goes 20, 10, 5, 2, 1, taking four halvings; `steps` counts them. When `n` is 1, `1 > 1` is `False` and the loop ends, so the print shows `1 4`. Note that `print` isn't indented, so it runs once, after the loop.
skills: [while-condition, counting]
