id: mcq-how-many-times
type: mcq
rev: 1
prompt: |
  How many times does this program print `hi`?

  ```python
  i = 0
  while i < 4:
      print("hi")
      i += 1
  ```
choices:
  - '3'
  - '4'
  - '5'
  - 'Forever'
answer: 1
explanation: |
  `i` is 0, 1, 2 and 3 when the condition is checked and found `True`: four passes. On the fifth check `i` is 4, `4 < 4` is `False`, and the loop ends. Counting from 0 with `< n` runs exactly `n` times.
skills: [counting, while-condition]
