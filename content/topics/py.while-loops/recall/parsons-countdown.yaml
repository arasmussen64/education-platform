id: parsons-countdown
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `3`, `2`, `1` and then `Liftoff!`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'count = 3'
  - 'while count > 0:'
  - '    print(count)'
  - '    count = count - 1'
  - 'print("Liftoff!")'
distractors:
  - 'while count < 0:'
explanation: |
  `count` must exist before the loop can test it. Inside the loop, printing comes before counting down, or the output would be 2, 1, 0. The unindented `print` runs once the loop has stopped. `while count < 0:` would never run at all, because 3 isn't below 0.
skills: [while-condition, counting]
