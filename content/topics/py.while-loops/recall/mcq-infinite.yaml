id: mcq-infinite
type: mcq
rev: 1
prompt: |
  What does this program do?

  ```python
  i = 5
  while i > 0:
      print(i)
      i += 1
  ```
choices:
  - 'Prints 5, 4, 3, 2, 1 and stops'
  - 'Prints nothing: `5 > 0` is `False`'
  - 'Never stops: `i` keeps growing, so `i > 0` stays `True`'
  - 'Stops with a `SyntaxError` at `+=`'
answer: 2
explanation: |
  The body makes `i` bigger each time, so the condition `i > 0` is `True` on every check and the loop runs forever: an infinite loop. To count down, the update must be `i -= 1`. Always check that the block changes the condition's value in the direction that ends the loop.
skills: [infinite-loops]
