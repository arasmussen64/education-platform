id: predict-doubling
type: predict_output
rev: 1
prompt: |
  Trace this loop and say what it prints: five lines.
code: |
  n = 1
  while n <= 8:
      print(n)
      n = n * 2
  print("done", n)
expected_output: |
  1
  2
  4
  8
  done 16
explanation: |
  Each pass prints `n` and then doubles it: 1, 2, 4, 8 are printed. After 8 is printed, `n` becomes 16; `16 <= 8` is `False`, so the loop ends and the last line prints `done 16`. The loop variable keeps its final value after the loop.
skills: [while-condition, counting]
