id: review-mcq-check-when
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  i = 10
  while i < 5:
      print("looping")
      i += 1
  print("finished")
  ```
choices:
  - '`looping` once, then `finished`'
  - 'Only `finished`'
  - '`looping` forever'
  - '`looping` five times, then `finished`'
answer: 1
explanation: |
  The condition is checked before the first pass. `10 < 5` is `False`, so the block never runs, and the program goes straight on to `print("finished")`. A `while` loop can run zero times.
skills: [while-condition]
