id: parsons-sorted-scores
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `72`, then `95`, then `[72, 95, 88]`. One line is a decoy that doesn't belong.
lines:
  - 'scores = [72, 95, 88]'
  - 'ordered = sorted(scores)'
  - 'print(ordered[0])'
  - 'print(ordered[-1])'
  - 'print(scores)'
distractors:
  - 'ordered = scores.sort()'
explanation: |
  `sorted` gives a new list in order and leaves `scores` as it was, which is why the last print shows the original order. `scores.sort()` sorts in place and returns `None`, so `ordered` would be `None` and `ordered[0]` an error. The prints follow the order of the output.
skills: [sort-slice]
