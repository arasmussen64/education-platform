type: mcq
rev: 1
prompt: |
  This function should return the position of the first item equal to `target`, or `-1` if there isn't one. What's wrong with it?

  ```python
  def position_of(items, target):
      for i in range(len(items)):
          if items[i] == target:
              return i
          else:
              return -1
  ```
choices:
  - 'Nothing: it works for every list'
  - 'It gives up after looking at the first item: the `return -1` belongs after the loop'
  - 'It should return `i + 1`, because positions start at 1'
  - 'It should use `while` instead of `for`'
answer: 1
explanation: |
  On the very first pass, the `else` returns −1 unless the first item is the one wanted, so the loop never looks further. A search returns the position as soon as it finds a match, and returns −1 only once the whole loop has finished without finding one: the `return -1` goes after the loop, unindented.
skills: [search]
