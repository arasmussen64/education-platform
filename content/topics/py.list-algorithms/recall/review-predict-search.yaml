id: review-predict-search
type: predict_output
rev: 1
prompt: |
  What does this program print? Two lines.
code: |
  items = ["pen", "cup", "key"]
  position = -1
  for i in range(len(items)):
      if items[i] == "cup":
          position = i
  print(position)
  print("key" in items, "hat" in items)
expected_output: |
  1
  True False
explanation: |
  The loop checks each position; `"cup"` is at position 1, so `position` becomes 1 (it would stay −1 if nothing matched). `in` answers whether a value is one of the items: `"key"` is, `"hat"` isn't.
skills: [search]
