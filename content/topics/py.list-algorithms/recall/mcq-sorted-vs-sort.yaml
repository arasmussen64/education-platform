id: mcq-sorted-vs-sort
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  scores = [3, 1, 2]
  result = scores.sort()
  print(result)
  ```
choices:
  - '`[1, 2, 3]`'
  - '`None`'
  - '`[3, 1, 2]`'
  - 'An error: lists have no `sort`'
answer: 1
explanation: |
  `sort()` sorts the list in place: after the call, `scores` is `[1, 2, 3]`. But it gives nothing back, so `result` is `None`. To get a sorted list as a value, use `sorted(scores)`, which returns a new list and leaves `scores` alone.
skills: [sort-slice]
