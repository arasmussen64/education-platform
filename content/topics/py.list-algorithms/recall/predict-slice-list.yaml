id: predict-slice-list
type: predict_output
rev: 1
prompt: |
  What does this program print? Five lines.
code: |
  numbers = [10, 20, 30, 40, 50]
  print(numbers[1:3])
  print(numbers[:2])
  print(numbers[-2:])
  print(sorted([3, 1, 2]))
  print(numbers)
expected_output: |
  [20, 30]
  [10, 20]
  [40, 50]
  [1, 2, 3]
  [10, 20, 30, 40, 50]
explanation: |
  Slices work on lists as on strings: `[1:3]` is positions 1 and 2, `[:2]` the first two, `[-2:]` the last two. `sorted` gives a new list in order. None of these change `numbers`, which prints as it started.
skills: [sort-slice]
