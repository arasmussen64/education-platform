id: review-mcq-highest
type: mcq
rev: 1
prompt: |
  What does `sorted([2, 9, 5], reverse=True)[0]` give?
choices:
  - '`2`'
  - '`9`'
  - '`5`'
  - '`[9, 5, 2]`'
answer: 1
explanation: |
  `sorted(..., reverse=True)` gives `[9, 5, 2]`, biggest first, and `[0]` takes its first item, 9. Without `reverse=True` the list would be `[2, 5, 9]` and `[0]` would be 2. `max([2, 9, 5])` gives the same 9 more directly.
skills: [sort-slice]
