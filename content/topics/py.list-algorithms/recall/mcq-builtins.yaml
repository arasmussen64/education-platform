id: mcq-builtins
type: mcq
rev: 1
prompt: |
  With `values = [4, 9, 2]`, which expression is `15`?
choices:
  - '`sum(values)`'
  - '`len(values)`'
  - '`max(values)`'
  - '`values.total()`'
answer: 0
explanation: |
  `sum` adds up a list of numbers: 4 + 9 + 2 = 15. `len` counts the items (3), `max` picks the biggest (9), and there's no `total` method on lists.
skills: [sort-slice]
