id: review-code-evens
stage: review_code
rev: 1
title: "Only the evens"
prompt: |
  Write a function `evens(numbers)` that returns a **new** list of the even numbers in the list, in their original order, leaving the list it's given unchanged. `evens([1, 2, 3, 4])` returns `[2, 4]`, and `evens([1, 3])` returns `[]`.
skills: [filter-transform]
