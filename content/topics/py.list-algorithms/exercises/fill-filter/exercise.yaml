id: fill-filter
stage: fill_in
rev: 1
title: "Keep the long words"
prompt: |
  `long_words` should return a new list of the words that have at least `min_length` characters, in their original order. Replace each `...`: the new list's starting value, the test, and what gets added. `long_words(["hi", "there", "you", "hello"], 4)` returns `["there", "hello"]`.
hints:
  - "A filter starts with an empty list: `result = []`."
  - "The test is on the word's length: `len(word) >= min_length`."
  - "Append the word itself, not its length."
skills: [filter-transform]
