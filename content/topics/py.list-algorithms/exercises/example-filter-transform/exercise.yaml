id: example-filter-transform
stage: worked_example
rev: 1
title: "Filter, transform, sort"
prompt: |
  The three moves of this topic on one list of scores. Press **Run**. Then change line 1 to a different list and run again: the code never mentions how many scores there are.
steps:
  - label: "Filter: keep the ones that pass"
    lines: "2-6"
    note: "A new, empty list; a loop over the old one; `append` only when the test is true. `scores` itself is untouched."
  - label: "Transform: change each one"
    lines: "8-11"
    note: "The same shape without the `if`: every item goes into the new list, changed. Four lines you'll write hundreds of times."
  - label: "Sort and slice"
    lines: "13-14"
    note: "`sorted` gives a new list in order, smallest first. A slice of its last three, `[-3:]`, is the top three, lowest of them first."
