id: write-doubled
stage: write
rev: 1
title: "Doubled"
prompt: |
  Write a function `doubled(numbers)` that returns a **new** list with every number doubled, leaving the original list unchanged. `doubled([1, 2, 3])` returns `[2, 4, 6]`, and `doubled([])` returns `[]`.
hints:
  - "This is the transform pattern: an empty list, a loop over the numbers, and an `append` of each number times 2."
  - "Don't change `numbers` itself; build and return the new list."
skills: [filter-transform]
