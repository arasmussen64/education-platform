id: build-score-tools
stage: build
rev: 1
title: "Score tools"
prompt: |
  Starting from a blank editor, write three functions with docstrings, none of which changes the list it's given:

  - `passing(scores, cutoff)` returns a new list of the scores that are at least `cutoff`, in their original order.
  - `position_of(items, target)` returns the position of the first item equal to `target`, or `-1` if it isn't there.
  - `top_three(scores)` returns a new list of the three highest scores, highest first (fewer if the list is shorter).

  Then `main()` prints, for the scores `[72, 45, 88, 91, 60]`:

  ```
  Passing: [72, 88, 91, 60]
  Position of 88: 2
  Top three: [91, 88, 72]
  ```

  Call `main()` at the bottom.
skills: [filter-transform, search, sort-slice]
