id: debug-algorithms
stage: debug
rev: 2
title: "Top three and first match"
prompt: |
  This program has two list tools: `top_three` gives the three highest scores, highest first, and `first_position` gives the position of the first item that matches, or -1 when nothing does. It should print:

  ```
  [91, 88, 72]
  0
  ```

  Instead it stops with a `TypeError`. It has three bugs, and fixing one shows the next. Read the error, then compare each function with what its docstring promises, and run the checks, which try each function on its own.
hints:
  - "Read the error's last line: which value is `None`, and which line gave it that value?"
  - "`scores.sort()` sorts the list in place and gives back `None`. `sorted(scores, reverse=True)` gives back a new sorted list and leaves `scores` as it was, which the checks also ask for."
  - "A slice `[:n]` takes the first `n` items. How many does `[:2]` take?"
  - "`first_position` keeps looking after it finds a match, so each later match replaces the one before. Return as soon as one is found, and return -1 only after the loop."
skills: [sort-slice, search]
