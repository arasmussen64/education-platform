id: py.list-algorithms
kind: topic
status: ready
title: "List algorithms"
summary: "Filter and transform lists into new lists, search them, and sort and slice them."
prerequisites: [py.lists]
estimated_minutes: 45
rev: 1
objectives:
  - "Build a new list from an old one with a loop and `append`: keep the items that pass a test (filter), or change each item (transform)."
  - "Search a list: whether something is in it, and the position of the first match, or −1 if there's none."
  - "Sort and slice: `sorted()` for a new sorted list (and `reverse=True` for highest first), `.sort()` for sorting in place, and `min`, `max` and `sum`."
