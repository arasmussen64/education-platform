id: py.modules-and-libraries
kind: topic
status: ready
title: "Modules and libraries"
summary: "Use code other people wrote: import from Python's standard library, read its docs, and make your own file a module."
prerequisites: [py.m5.checkpoint]
estimated_minutes: 45
rev: 1
objectives:
  - "Bring a module in with `import` and use its functions with a dot, or import one name with `from ... import`, and know the trade-off."
  - "Use a few standard-library tools: `random.choice`, `random.randint`, `random.shuffle`, `statistics.mean`, `math.sqrt`, and look up the rest in the docs."
  - "Make your own file a module: functions at the top, and `if __name__ == \"__main__\":` so importing it doesn't run it."
