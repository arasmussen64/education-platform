id: example-dice
stage: worked_example
rev: 1
title: "Dice, with help from two modules"
prompt: |
  Two standard-library modules at work: `random` for the dice and `statistics` for an average. Press **Run** a few times: the rolls change, the checks on them don't.
steps:
  - label: "Bring the modules in"
    lines: "1-2"
    note: "Each `import` runs that module's file once and gives you its functions under the module's name. Imports go at the top, so a reader knows what the file depends on."
  - label: "Module dot function"
    lines: "5-7"
    note: "`random.randint(1, sides)` is a whole number from 1 to `sides`, both included. The dot says which module the function comes from. Our own function wraps it with a name that says what it means here."
  - label: "Use the results like any other values"
    lines: "10-16"
    note: "The rolls go into a list, so `min`, `max` and `len` work on them. `statistics.mean` and `random.choice` are two more dotted calls. The printed lines are the same every run, because they test the random values rather than showing them."
