id: write-shuffled
stage: write
rev: 1
title: "Shuffled, as a new list"
prompt: |
  Write a function `shuffled(items)` that returns a **new** list with the same items in random order, leaving the list it's given unchanged. Use `random.shuffle`, which shuffles a list in place and returns `None`, on a copy. Start your file with `import random`.
hints:
  - "Make a copy first: `result = list(items)`."
  - "`random.shuffle(result)` rearranges the copy; then `return result`. Never `return random.shuffle(...)`, which is `None`."
skills: [stdlib-tools, import-use]
