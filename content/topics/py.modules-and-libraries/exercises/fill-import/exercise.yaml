title: "Borrow two functions"
prompt: |
  Two helpers that borrow from the standard library. Replace each `...`: the name to import from `statistics` so that `mean(numbers)` works, and the missing part of the sum under the square root (the long side of a right triangle is the square root of `a² + b²`). `average([2, 4])` returns `3`, and `hypotenuse(3, 4)` returns `5.0`.
hints:
  - "The function used below is `mean`, so that's the name to import: `from statistics import mean`."
  - "`math.sqrt(a * a + b * b)`: both short sides are squared before adding."
skills: [import-use, stdlib-tools]
