id: build-helpers-module
stage: build
rev: 1
title: "A module of helpers"
prompt: |
  Starting from a blank editor, write a module of small helpers, each with a docstring, built on the standard library:

  - `mean_of(numbers)` returns the mean of a non-empty list, using `statistics.mean`.
  - `spread(numbers)` returns the biggest number minus the smallest.
  - `pick(items)` returns one item of a non-empty list, chosen at random with `random.choice`.
  - `dice(count, sides)` returns a list of `count` random whole numbers, each from 1 to `sides`.

  Then `main()` prints `Mean: 5` and `Spread: 7` for the list `[2, 4, 9]`, and the file ends with the `__name__` check, so that **importing the file runs nothing and prints nothing**.
skills: [import-use, stdlib-tools, own-module]
