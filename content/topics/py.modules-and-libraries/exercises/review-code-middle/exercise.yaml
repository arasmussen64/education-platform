title: "The middle value"
prompt: |
  Write a function `middle(numbers)` that returns the median of a non-empty list, using `statistics.median`, and leaves the list unchanged. `middle([3, 1, 10])` returns `3`, and `middle([1, 2, 3, 40])` returns `2.5`. Start your file with the import you need.
skills: [stdlib-tools, import-use]
