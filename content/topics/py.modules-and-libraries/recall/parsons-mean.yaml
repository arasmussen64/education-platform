id: parsons-mean
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Average: 90`. The import comes first, as it always does. One line is a decoy that doesn't belong.
lines:
  - 'import statistics'
  - 'scores = [80, 90, 100]'
  - 'average = statistics.mean(scores)'
  - 'print(f"Average: {average}")'
distractors:
  - 'average = mean(scores)'
explanation: |
  `import statistics` brings the module in under its name, so its functions are reached with a dot: `statistics.mean`. Plain `mean` would be a `NameError`, because only `from statistics import mean` would define it. Imports go at the top, before anything uses them.
skills: [import-use, stdlib-tools]
