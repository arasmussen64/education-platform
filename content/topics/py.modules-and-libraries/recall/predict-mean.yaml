id: predict-mean
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines.
code: |
  import statistics
  import math

  scores = [80, 90, 100]
  print(statistics.mean(scores))
  print(math.sqrt(16))
  print(round(math.pi, 2))
expected_output: |
  90
  4.0
  3.14
explanation: |
  `statistics.mean` of 80, 90 and 100 is exactly 90, so it prints as a whole number. `math.sqrt` always gives a float, `4.0`. `math.pi` is the constant 3.14159…, rounded here to two decimals.
skills: [stdlib-tools]
