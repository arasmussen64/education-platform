id: review-predict-from-import
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines.
code: |
  from math import sqrt, floor

  print(sqrt(81))
  print(floor(7.9))
  print(floor(sqrt(10)))
expected_output: |
  9.0
  7
  3
explanation: |
  Both names were imported directly, so no `math.` is needed. `sqrt(81)` is `9.0` (a float), `floor(7.9)` rounds down to 7, and `sqrt(10)` is about 3.16, which `floor` turns into 3.
skills: [import-use, stdlib-tools]
