id: mcq-import-forms
type: mcq
rev: 1
prompt: |
  After `import random`, which line picks one item from a list?
choices:
  - '`random.choice(["a", "b"])`'
  - '`choice(["a", "b"])`'
  - '`random(["a", "b"])`'
  - '`import random.choice(["a", "b"])`'
answer: 0
explanation: |
  `import random` brings the module in under its name; its functions are reached with a dot. Plain `choice` only works after `from random import choice`. `random` itself isn't a function, and `import` isn't something you call.
skills: [import-use]
