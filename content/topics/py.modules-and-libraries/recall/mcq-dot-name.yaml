id: mcq-dot-name
type: mcq
rev: 1
prompt: |
  What happens here?

  ```python
  from statistics import mean

  print(statistics.mean([1, 2, 3]))
  ```
choices:
  - 'It prints `2`'
  - 'A `NameError`: `statistics` isn''t defined, because only the name `mean` was imported'
  - 'It prints `2.0`'
  - 'An `ImportError`'
answer: 1
explanation: |
  `from statistics import mean` brings in the one name `mean`; the module's own name, `statistics`, is never defined in this file. Either write `mean([1, 2, 3])`, or import the whole module with `import statistics` and keep the dot.
skills: [import-use]
