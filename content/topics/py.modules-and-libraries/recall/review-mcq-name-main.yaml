id: review-mcq-name-main
type: mcq
rev: 1
prompt: |
  A file `tools.py` defines some functions and ends with:

  ```python
  if __name__ == "__main__":
      main()
  ```

  What happens when another file runs `import tools`?
choices:
  - '`main()` runs, because importing runs the whole file'
  - 'Nothing at all: imported files aren''t run'
  - 'The functions become available as `tools.something`, and `main()` does not run'
  - 'An error: a module can''t have a `main`'
answer: 2
explanation: |
  Importing does run the file top to bottom, which is how its `def`s come to exist. But `__name__` is `"__main__"` only when a file is run directly; during an import it's the module's name, `"tools"`, so the condition is false and `main()` is skipped. The functions are ready to use, the program doesn't start.
skills: [own-module]
