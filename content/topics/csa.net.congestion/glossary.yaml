# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: congestion window
  aliases: [cwnd]
  definition: How much data a TCP sender dares to have in flight, sent but not yet acknowledged, at once. It's the sender's guess at what the path can carry, kept beside the receiver's own window.
- term: slow start
  definition: How a new TCP connection grows. It starts with about 10 segments in flight and doubles that every round trip, until a packet is lost or it reaches its slow-start threshold.
- term: CUBIC
  definition: The usual congestion control in Linux, Windows and Apple's systems. It treats every lost packet as congestion, cuts its window to 0.7 of what it was, then grows it back along a cubic curve.
- term: BBR
  definition: A congestion control from Google that measures the path, its bottleneck bandwidth and shortest round trip, and sends at that rate instead of slowing down at every lost packet.
- term: bufferbloat
  definition: Delay from a router's deep queue that loss-based senders keep full. Nothing is lost and the link is busy, but every packet waits, so the round trip climbs far above its minimum.
- term: head-of-line blocking
  definition: One lost or slow item holding up everything queued behind it, such as one lost TCP packet stalling every HTTP/2 stream on the connection until it is resent.
- term: QUIC
  definition: A transport built on UDP and run inside the application, with TLS 1.3 built into its handshake, streams that don't block each other, and connection IDs that survive a change of address.
- term: CDN
  aliases: [content delivery network]
  definition: A provider's servers in many cities, each keeping copies of a site's content and answering the users near it, so most requests never travel to the site's own servers.
