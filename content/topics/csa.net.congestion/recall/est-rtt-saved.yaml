id: est-rtt-saved
type: estimate
rev: 1
prompt: |
  A browser opens a new connection to an API with a 150 ms round trip and sends one request. How many milliseconds sooner does the first byte of the answer arrive over HTTP/3 than over HTTP/2 on TCP with TLS 1.3? Count round trips only. Exactly.
unit: ms
answer: 150
tolerance: { absolute: 0 }
given: { rtt: 150 }
# TCP's handshake, TLS 1.3's, and the request: 3 round trips. QUIC's one
# handshake and the request: 2.
working: 3 * rtt - 2 * rtt
mistakes:
  - id: h3-total
    value: 300
    working: 2 * rtt
    why: That's how long HTTP/3 takes to the first byte. The question asks how much sooner it is than HTTP/2.
  - id: h2-total
    value: 450
    working: 3 * rtt
    why: That's how long HTTP/2 over TCP and TLS 1.3 takes to the first byte. The question asks for the difference.
explanation: |
  Over TCP, the TCP handshake takes a round trip, TLS 1.3 another, and the request and its answer a third: 450 ms. QUIC does the transport's and TLS 1.3's handshakes together in one round trip, then the request: 300 ms. 150 ms sooner, one round trip, on every new connection. Measured in this topic's lab over a 100 ms path: the first byte at 0.304 s over HTTP/2, and the answer at 205 ms over HTTP/3.
skills: [quic-changes]
