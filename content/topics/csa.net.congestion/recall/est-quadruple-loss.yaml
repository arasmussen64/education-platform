id: est-quadruple-loss
type: estimate
rev: 1
prompt: |
  A loss-based connection gets 20 Mbit/s on a path that loses 0.1% of packets. If the same path starts losing 0.4%, about how many Mbit/s will it get? Exactly.
unit: Mbit/s
answer: 10
tolerance: { absolute: 0 }
given: { speed: 20, before: 0.1, after: 0.4 }
working: speed * (before / after) ** 0.5
mistakes:
  - id: linear
    value: 5
    working: speed * before / after
    why: That divides by the loss rate itself. The ceiling falls with the square root of the loss rate, and √4 is 2.
  - id: unchanged
    value: 20
    working: speed
    why: A loss-based sender cuts its window at every loss, so more loss means a smaller average window and a lower rate.
explanation: |
  The ceiling is about 1.2 × MSS ÷ (RTT × √p). Four times the loss divides it by √4 = 2: 20 ÷ 2 = 10 Mbit/s. Loss hurts less than distance, but it adds up: sixteen times the loss would leave a quarter.
skills: [loss-latency-math]
