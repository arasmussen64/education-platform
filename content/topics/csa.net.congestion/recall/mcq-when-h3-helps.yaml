id: mcq-when-h3-helps
type: mcq
rev: 1
prompt: |
  For which users is turning HTTP/3 on most likely to make pages load faster?
choices:
  - "Mobile users far from the servers, on links that lose packets"
  - "Servers in one data centre, talking over a clean 25 Gbit/s link"
  - "Office users behind a firewall that drops UDP sent to port 443"
  - "Batch jobs downloading one large file over one long request"
answer: 0
explanation: |
  HTTP/3 saves a round trip on every new connection, which is worth most where round trips are long; keeps a lost packet from stalling every stream, which matters most where packets are lost; and survives an address change, which phones make. Inside one data centre the round trips are a fraction of a millisecond and almost nothing is lost, so there's little to save. Behind a firewall that drops UDP 443, browsers can't use HTTP/3 at all and stay on HTTP/2. One large download is one stream, with no other streams to unblock, and its speed is the congestion control's business, not the HTTP version's.
skills: [http3-in-practice]
