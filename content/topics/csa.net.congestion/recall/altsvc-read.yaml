id: altsvc-read
type: predict_shell
rev: 1
prompt: |
  `headers.txt` is what `curl -sI https://shop.test/` printed in the office, captured on 2026-11-12 in this topic's lab "CUBIC meets a lossy link", with its line endings made plain. The command prints where the site says it speaks HTTP/3, and for how long a browser should remember that, in days (86,400 seconds a day). What is printed?
files:
  headers.txt: |
    HTTP/2 200
    alt-svc: h3=":443"; ma=2592000
    content-type: text/plain; charset=utf-8
    server: Caddy
    content-length: 20
    date: Thu, 12 Nov 2026 18:49:22 GMT
command: |
  grep -o 'h3=":[0-9]*"' headers.txt; awk -F'ma=' '/^alt-svc/ {print $2 / 86400, "days"}' headers.txt
expected_output: |
  h3=":443"
  30 days
explanation: |
  `grep -o` prints only the part of the line that matches: `h3=":443"`, HTTP/3 on UDP port 443 of this same site. awk splits the `alt-svc` line at `ma=`, so the second field is 2592000, and 2,592,000 ÷ 86,400 is 30.

  The answer itself came over HTTP/2, on TCP: a browser always meets a site over TCP first, and the Alt-Svc header tells it "HTTP/3 is here too; remember that for 30 days". Without `ma`, the advertisement counts for 24 hours (RFC 7838). Google's load balancer sends the same `ma`. A site can also announce HTTP/3 before any connection, in an HTTPS DNS record with `alpn=h3`.
skills: [http3-in-practice]
