id: mcq-three-clouds-h3
type: mcq
rev: 1
prompt: |
  Which statement about HTTP/3 at the three clouds' edges was true in November 2026?
choices:
  - "CloudFront offers it to viewers; Application Gateway's is in preview"
  - "Front Door offers it; Google's global load balancer leaves it off"
  - "Google's regional load balancer offers it; CloudFront doesn't yet"
  - "Application Gateway's is generally available; NLB drops all QUIC"
answer: 0
explanation: |
  As the providers' pages read on 2026-11-12: CloudFront supports HTTP/3 between viewers and its edge, with connection migration; Azure Application Gateway's HTTP/3 is "currently in preview", for front-end connections only. Azure Front Door's FAQ lists HTTP, HTTPS and HTTP/2, not HTTP/3. Google's global external Application Load Balancer advertises HTTP/3 by default, while its regional external one doesn't support it. AWS's Network Load Balancer passes QUIC through to its targets. These are the facts in the topic most likely to change, so the question carries its date; check the pages again before you rely on them.
skills: [http3-in-practice]
