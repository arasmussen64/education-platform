skills:
  - id: loss-based-cc
    description: "The congestion window beside the receive window; slow start from 10 segments, doubling every round trip until a loss or ssthresh; congestion avoidance and AIMD; Reno's halving and CUBIC's cut to 0.7 and cubic regrowth; fast retransmit against a timeout; why random loss and long round trips slow loss-based algorithms; bufferbloat; reading `cwnd`, `ssthresh`, `rtt` and `retrans` in `ss -tni`"
  - id: bbr-model
    description: "BBR's model (the highest recent delivery rate, the shortest recent round trip), pacing, its four states, about one bandwidth-delay product in flight; it doesn't react directly to loss; its costs (retransmissions, an unfair share against CUBIC, loss behind policers); version 1 in mainline Linux, version 3 in the IETF draft; congestion control is the sender's choice, set for good in `/etc/sysctl.d/`, per socket with `TCP_CONGESTION`, or for one test with `iperf3 -C`; fq isn't needed"
  - id: loss-latency-math
    description: "Calculation: the loss-based ceiling, about 1.2 × MSS ÷ (RTT × √p), and how it scales with the round trip and the loss rate; a window per round trip as a rate; a bandwidth-delay product from BBR's model; slow start's growth and what it delivers; parallel connections; transfer times"
  - id: quic-changes
    description: "QUIC's handshake (one round trip to the first request, against two for TCP with TLS 1.3) and 0-RTT on return; streams without head-of-line blocking across them; connection IDs and migration; encryption of almost everything against ossification; the 1,200-byte first datagram and the three-times limit; QUIC's own idle timeout and the UDP timers of boxes on the path; what `tcpdump` shows (UDP lengths) and what a client's own log shows"
  - id: http3-in-practice
    description: "How a browser finds HTTP/3: the Alt-Svc header (`h3=\":443\"; ma=...`, 24 hours without `ma`) and HTTPS DNS records with `alpn=h3`; the silent fallback to HTTP/2 when UDP 443 is blocked; turning it on (Caddy's `protocols`, a listener on UDP 443, `udp dport 443` in every firewall on the path); when it helps and when it doesn't; the three clouds' support, and that it ends at their edge"
