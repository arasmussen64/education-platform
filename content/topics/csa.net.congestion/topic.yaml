#   https://learn.microsoft.com/en-us/azure/frontdoor/front-door-faq
# - Google's global external Application Load Balancer runs on Google Front
#   Ends, "distributed globally", and a request goes to "the GFE that is
#   closest to the client" (the same Google page as above, re-read
#   2026-11-12 by the topic's reviewer)
# Measured in this topic's labs on 2026-11-12 (Docker Desktop 29.8.2, kernel
