id: csa.net.congestion
kind: topic
status: ready
title: Congestion control and QUIC
summary: "Explain the congestion window beside the receive window, slow start, and how CUBIC and other loss-based algorithms slow down at every lost packet, so that loss and distance together cap one connection; explain what BBR measures instead and what it costs, and set a sender's congestion control so that it lasts; then explain what QUIC changes, how a browser finds HTTP/3 and falls back without it, and turn HTTP/3 on for a server and its firewall."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 29) and its designer's brief (csa.net.congestion.md). Through
# csa.net.transport this builds on csa.net.nat, csa.net.routing (sysctl and
# /etc/sysctl.d, later files winning), csa.net.ipv6 (a DNS record in a
# sentence), csa.net.cidr, csa.net.layers (MTU, the network labs' machines,
# on, netlab, name@machine services) and csa.m1.checkpoint; for the writer,
# Module 1's nftables (policy drop, saved against running), tcpdump, ss,
# curl -I and awk's printf. From csa.net.transport it uses the receive
# window and window scaling, round trips and the bandwidth-delay product,
# retransmission and backoff, iperf3, UDP and the 30-second UDP mapping, and
# the postcards picture of TCP's byte stream. It defines QUIC, stream,
# head-of-line blocking, 0-RTT and Alt-Svc (the plan's section 3.7), and
# says of TLS and HTTP/2 only what it needs: HTTP and TLS, after it,
# teaches them and refers back here for QUIC.
prerequisites: [csa.net.transport]
# Worked out: the lesson about 25 minutes (3,300 words at 130 a minute);
# reading about 50 (HPBN's three sections 18, the tcp_bbr.c comment 4, the
# BBR draft's abstract and introduction 5, HTTP/3 explained's six sections
# 15, the three clouds' HTTP/3 pages 8); 21 recall items at 1.5 each 32;
# the worked example 40, the fill-in 25, the write 30, the build 50, the
# debug 45 and the explain 20: 317, less the overlap of the worked
# example's reading with the lesson's (the same captures): 300.
estimated_minutes: 300
rev: 1
objectives:
  - "Explain the congestion window beside the receive window, slow start from 10 segments, and congestion avoidance with Reno's halving and CUBIC's cut to 0.7, and read `cwnd`, `ssthresh`, `rtt` and `retrans` in `ss -tni`."
  - "Explain why a loss-based algorithm slows down on a long path that loses packets at random, and work out roughly what one connection can carry from its round trip and loss rate (about 1.2 × MSS ÷ (RTT × √p)), and what changes it: distance, loss, parallel connections, a different algorithm."
  - "Explain what BBR measures and does instead (the bottleneck bandwidth, the minimum round trip, pacing), show the difference on a lossy path, name its costs, and set a sender's congestion control so that it lasts, knowing that only the sending side's choice matters."
  - "Explain what QUIC changes: one handshake for transport and encryption, streams that don't block each other, connection IDs that survive a new address, an encrypted transport that boxes in the middle can't read; and read what a capture and a client's own log show of it."
  - "Explain how a browser finds HTTP/3 (Alt-Svc, HTTPS DNS records), what happens when UDP port 443 is blocked, when HTTP/3 helps and when it doesn't, and what the three clouds offer; and turn it on for a server and every firewall in front of it."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - Linux's net/ipv4/tcp_bbr.c, the comment at the top: bottleneck_bandwidth
#   = windowed_max(delivered / elapsed, 10 round trips); min_rtt =
#   windowed_min(rtt, 10 seconds); "The core algorithm does not react
#   directly to packet losses or delays"; STARTUP, DRAIN, PROBE_BW,
#   PROBE_RTT; with fq "with pacing enabled", "otherwise TCP stack falls back
#   to an internal pacing"; no version named; SPDX GPL-2.0 OR BSD-3-Clause:
#   https://raw.githubusercontent.com/torvalds/linux/master/net/ipv4/tcp_bbr.c
# - Mainline Linux's BBR is version 1: Neal Cardwell on the bbr-dev list,
#   2025-03-15, "The net-next and mainline Linux trees still have BBR 1.x";
#   no merge of version 3 found since (a search, 2026-11-12):
#   https://groups.google.com/g/bbr-dev/c/4vwZGw0nxdQ
# - draft-ietf-ccwg-bbr-07, 2 November 2026, "specifies version 3 of the
#   BBR algorithm, BBRv3"; intended status Experimental; Cardwell, Swett
#   (Google), Beshay (Meta); BBR.LossThresh 2%, BBR.Beta 0.7; open source
#   implementations for TCP and QUIC:
#   https://datatracker.ietf.org/doc/draft-ietf-ccwg-bbr/
# - RFC 9438 (August 2023, Standards Track, obsoletes RFC 8312): β_cubic
#   0.7, C 0.4, "adopted as the default TCP congestion control algorithm in
#   the Linux, Windows, and Apple stacks":
#   https://www.rfc-editor.org/rfc/rfc9438.html
# - RFC 5681 section 3.1: slow start while cwnd < ssthresh, cwnd grows by at
#   most SMSS per ACK of new data; congestion avoidance SMSS*SMSS/cwnd per
#   ACK; ssthresh = max(FlightSize / 2, 2*SMSS) after a timeout:
#   https://www.rfc-editor.org/rfc/rfc5681.txt
# - RFC 6928: initial window min(10*MSS, max(2*MSS, 14600)):
#   https://www.rfc-editor.org/rfc/rfc6928.txt
# - RFC 3649 (Experimental, December 2003): "the current Standard TCP's
#   average congestion window is roughly 1.2/sqrt(p) segments":
#   https://www.rfc-editor.org/rfc/rfc3649.txt
# - Geoff Huston, "BBR, the new kid on the TCP block", APNIC blog,
#   2017-05-09: BBR "more successful in claiming path resources" than CUBIC
#   in his tests; Google's report of token-bucket policers and "continuous
#   moderate losses": https://blog.apnic.net/2017/05/09/bbr-new-kid-tcp-block/
# - The kernel's ip-sysctl page: tcp_congestion_control "to be used for new
#   connections", "For passive connections, the listener congestion control
#   choice is inherited"; tcp_available_congestion_control, "More congestion
#   control algorithms may be available as modules, but not loaded";
#   tcp_allowed_congestion_control for non-privileged processes:
#   https://docs.kernel.org/networking/ip-sysctl.html
# - tcp(7), man-pages 6.19 (2026-04-19): TCP_CONGESTION per socket;
#   unprivileged processes restricted to tcp_allowed_congestion_control:
#   https://man7.org/linux/man-pages/man7/tcp.7.html
# - tc-netem(8): "Each packet loss is independent" (loss random); rate
#   "Delays packets based on packet size to emulate a fixed link speed":
#   https://man7.org/linux/man-pages/man8/tc-netem.8.html
# - iperf3: -C "Set the congestion control algorithm (Linux and FreeBSD
#   only)", -t default 10 s, -f format, --forceflush:
#   https://software.es.net/iperf/invoking.html
# - RFC 9000: clients pad datagrams carrying Initial packets to at least
#   1200 bytes; before validation a server sends at most three times what it
#   received; "Only clients are able to migrate in this version of QUIC";
#   the effective idle timeout is the minimum of the two advertised values;
#   "sending packets every 30 seconds is necessary to prevent the majority
#   of middleboxes from losing state for UDP flows":
#   https://www.rfc-editor.org/rfc/rfc9000.txt
# - RFC 7838 section 3.1: an alternative service is "considered fresh for 24
#   hours", changed with "ma": https://www.rfc-editor.org/rfc/rfc7838.txt
# - RFC 9460 (November 2023): "@ 7200 IN HTTPS 1 . alpn=h3":
#   https://www.rfc-editor.org/rfc/rfc9460.txt
# - nginx: QUIC and HTTP/3 "available since 1.25.0" (Ubuntu 24.04 has
#   1.24): https://nginx.org/en/docs/quic.html
# - Caddy's global options: protocols h1, h2, h2c, h3, default "h1 h2 h3";
#   skip_install_trust; local_certs: https://caddyserver.com/docs/caddyfile/options
# - CloudFront: for HTTP/3 "viewers must support TLSv1.3 and Server Name
#   Indication (SNI)"; "CloudFront supports HTTP/3 connection migration";
#   Route 53 HTTPS records for protocol negotiation in DNS:
#   https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesGeneral.html
# - AWS Network Load Balancer, Nov 13, 2025: QUIC in passthrough mode, "by
#   using the QUIC Connection ID to maintain session stickiness", all
#   commercial and GovCloud (US) regions, within UDP LCUs:
#   https://aws.amazon.com/about-aws/whats-new/2025/11/aws-network-load-balancer-quic-passthrough-mode
# - Google Cloud's external Application Load Balancer: HTTP/3 on the global
#   external and the classic (Premium Tier) ones, not the regional external
#   or Standard Tier; "for connections between clients and the load
#   balancer"; quicOverride NONE (default, "Automatic"), ENABLE, DISABLE;
#   "When a connection falls back to HTTPS or HTTP/2, we don't count this as
#   a failure of the load balancer":
#   https://docs.cloud.google.com/load-balancing/docs/https
# - Azure Application Gateway: HTTP/3 "currently in preview"; "HTTP/3
#   applies only to frontend client connections. Backend connections
#   continue to use HTTP/1.1"; needs a TLS 1.3 policy (ms.date 2026-09-09):
#   https://learn.microsoft.com/en-us/azure/application-gateway/http3-quic-support
# - Azure Front Door FAQ: "Azure Front Door supports HTTP, HTTPS, and
#   HTTP/2"; HTTP/1.1 to origins except gRPC routes (ms.date 2026-11-02,
#   updated 2026-11-11). A third-party article claims HTTP/3; nothing
