prove:
  build: build-fast-far-site
  debug: debug-slow-from-far
  explain:
    prompt: |
      A company is moving its shop's servers to a region on another continent, about 140 ms round trip from most of its customers, many of them on mobile networks that lose about 1% of their packets. Its nightly backups will come back across the same distance. Explain, in your own words: how loss and distance together limit a TCP connection that uses CUBIC, with rough numbers; what BBR does differently, what it costs, and on which machine it has to be set to help the backups; what QUIC changes compared with TCP and TLS, and why that helps mobile customers in particular; how a browser finds out that a site speaks HTTP/3, and what happens when a customer's network blocks it; and how the three clouds' load balancers or CDNs handle HTTP/3.
    rubric:
      - id: loss-and-distance
        required: true
        description: "Loss-based algorithms such as CUBIC read every lost packet as congestion and cut the congestion window; one connection sends at most one window per round trip, so its throughput falls with the round trip and with the square root of the loss rate (about 1.2 × MSS ÷ (RTT × √p)), worked into a rough number for a path of their own; twice the round trip halves it."
      - id: bbr
        required: true
        description: "BBR models the path's bottleneck bandwidth (the highest recent delivery rate) and minimum round trip, paces its packets at that rate and keeps about one bandwidth-delay product in flight, and doesn't treat random loss as congestion; its costs are more retransmissions and an unfair share against CUBIC; it must be set on the sender (for the backups, the machines that send them), lastingly, in /etc/sysctl.d or per program."
      - id: quic
        required: true
        description: "QUIC runs over UDP with TLS 1.3 built into its handshake, so the first request goes after one round trip instead of two; its streams are independent, so one lost packet stalls only its own stream (no head-of-line blocking across streams); connection IDs let a phone change networks without breaking the connection; almost all of it is encrypted, so boxes on the path can't read or meddle with it."
      - id: discovery-and-fallback
        required: true
        description: "The browser first comes over TCP and learns of HTTP/3 from the Alt-Svc header (h3 on a UDP port, remembered for ma seconds) or from an HTTPS DNS record; when UDP 443 is blocked the browser falls back to HTTP/2 without telling anyone, so the site works but loses the benefit; turning HTTP/3 on means the server listening on UDP 443 and every firewall on the path allowing it."
      - id: clouds
        required: true
        description: "At least two correct, dated facts, such as: CloudFront offers HTTP/3 to viewers, with connection migration; AWS's Network Load Balancer passes QUIC through, sticky by connection ID; Google's global external Application Load Balancer advertises HTTP/3 by default, between clients and the load balancer only; Azure Application Gateway's HTTP/3 is a preview with HTTP/1.1 to backends; Front Door's FAQ lists HTTP/2, not HTTP/3."
      - id: queues
        required: false
        description: "Bufferbloat: on a clean path a loss-based sender fills deep queues and adds delay for everyone, where BBR keeps the queue short; or the slow start sum, that a small page costs several round trips whatever the link's speed."
    model_answer: |
      CUBIC, Linux's default, is loss-based: it reads every lost packet as a sign of congestion and cuts its congestion window to 0.7, and a connection can only send one window per round trip. Mobile networks lose packets at random, so the window keeps being cut though nothing is congested. Roughly, one connection carries 1.2 × MSS ÷ (RTT × √p). With 1,448-byte segments, a 140 ms round trip and 1% loss that's 1.2 × 1,448 × 8 ÷ (0.14 × 0.1), about 1 Mbit/s, however fast the link. Twice the distance halves it, and four times the loss halves it too.

      BBR doesn't react directly to loss. It measures the path: the highest delivery rate it has seen lately and the shortest round trip, the path's delay without queues. It paces its packets at that rate and keeps about one bandwidth-delay product in flight, so it gets most of the link through the same 1% loss. In my lab, across a 50 Mbit/s link that lost 1%, BBR got about 45 Mbit/s and CUBIC about 5. The costs are more retransmissions, since it resends what's lost without slowing down, and that it can take more than its share from CUBIC flows on a shared link. Congestion control is the sender's choice, so for the backups it has to be set on the servers that send them, as net.ipv4.tcp_congestion_control = bbr in a file in /etc/sysctl.d so it survives a reboot. Setting it on the receiving end does nothing.

      QUIC is a new transport over UDP with TLS 1.3 built in. Over TCP, the TCP handshake takes a round trip and TLS another before the first request; QUIC does both in one, so at 140 ms every new connection gets its first answer 140 ms sooner. Its streams are numbered separately, so one lost packet holds up only its own stream, not every image on the page as on HTTP/2 over TCP. A connection is known by its connection ID, not its addresses, so a phone moving from Wi-Fi to 5G keeps its connection. And almost all of it is encrypted, so boxes in the middle can't break it.

      A browser first reaches the site over TCP, and the answer's Alt-Svc header, like h3=":443"; ma=2592000, says HTTP/3 is on UDP 443 and to remember that for 30 days; an HTTPS DNS record with alpn=h3 can say it before the first visit. If a customer's network blocks UDP 443, the browser quietly falls back to HTTP/2: nothing breaks, it's just slower. So the server must listen on UDP 443 and every firewall on the path must allow it.

      CloudFront offers HTTP/3 to viewers, with connection migration, and AWS's Network Load Balancer can pass QUIC through to the servers. Google's global external Application Load Balancer advertises HTTP/3 by default, but only between clients and the load balancer. Azure's Application Gateway has HTTP/3 in preview and talks HTTP/1.1 to its backends, and Front Door's FAQ lists HTTP/2 as its newest.
