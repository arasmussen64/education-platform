#!/usr/sbin/nft -f
# shop: the web server's own firewall. It lets in SSH and the site, and
# the answers to connections shop starts itself (the backups to dr1);
# everything else is dropped.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        # SSH, and the site over TCP: HTTP and HTTPS.
        tcp dport { 22, 80, 443 } accept
        # The site over HTTP/3, which runs on QUIC, over UDP.
        udp dport 443 accept
    }
}
