#!/usr/sbin/nft -f
# fw: the site's firewall, between the internet and shop. It lets the
# internet reach shop's SSH and the site over TCP (HTTP and HTTPS), lets out
# everything shop starts, and drops everything else. fw itself takes
# nothing from the internet.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "shop" oifname "isp" accept
        iifname "isp" oifname "shop" ip daddr 203.0.113.10 tcp dport { 22, 80, 443 } accept
    }
}
