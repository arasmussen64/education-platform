# The checks of "Slow from far away". The descriptions say what must be true
# at the end, never what was wrong, and so do the sentences a failing check
# prints: the terminal shows them at the first check.
# The archive's speed is one fresh 6-second transfer, which must reach 25
# Mbit/s: the middle of the gap between CUBIC's 1.4 to 13.5 and BBR's 41 to
# 46 on this path (the Module 3 congestion designer's runs and the base's
# BBR probe, on Docker Desktop and on GitHub's runners, 2026-11-11 and 12).
# Fixes that last are read where they last: shop's congestion control
# against a fresh build of its files, its firewall against its
# /etc/nftables.conf, Caddy's running site against its Caddyfile. The
# scenery (the links, the archive job, the HTTP/3 client) is compared with
# what it was shipped as.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: archive-speed
    description: "The nightly archive reaches dr1 at 25 Mbit/s or more on its one connection, half the link's 50."
    timeout: 45
    command: archive-push 2>&1
    expect:
      gte: 25
  # netlab verify's copy of shop (chk-shop) is built from the topology and
  # shop's own files, as a reboot would build it: the values there are the
  # ones shop would have after a reboot, whether a file sets them or not.
  # Only isp, which is scenery, is compared, so the copy is read whatever
  # else on shop has changed. Two things choose the algorithm a connection
  # starts with: the system's setting, and a route's own (ip route ...
  # congctl), so shop's routes are compared too. The description doesn't
  # say which setting, since the terminal shows it at the first check.
  - id: speed-lasts
    description: "A reboot keeps the archive's speed: the way shop sends it now, by its kernel's setting and its routes, is the way its own files set at boot."
    command: |
      state() { on "$1" sysctl -n net.ipv4.tcp_congestion_control; ip -n "$1" route show table main; }
      live=$(state shop)
      fresh=$(netlab verify isp -- bash -c "$(declare -f state); state chk-shop" 2>&1) || { echo "the internet's router, isp, isn't as it was shipped"; exit 0; }
      live_cc=${live%%$'\n'*} fresh_cc=${fresh%%$'\n'*}
      [ "$live_cc" = "$fresh_cc" ] || { echo "shop sends with $live_cc now, and would send with $fresh_cc after a reboot"; exit 0; }
      [ "$live" = "$fresh" ] || { echo "shop's routes now aren't the ones its own files give it at boot"; exit 0; }
      echo lasts
    expect:
      equals: lasts
  # Tried twice, in case Caddy is still starting after a boot.
  - id: h3-from-the-office
    description: "The office gets the site over HTTP/3."
    timeout: 20
    command: |
      for try in 1 2; do
        out=$(on office h3get -m 5 https://shop.test/ 2>&1)
        case "$out" in *"hello over HTTP/3.0"*) echo "over HTTP/3"; exit 0 ;; esac
        sleep 1
      done
      echo "the office gets no answer over HTTP/3 from https://shop.test/"
    expect:
      equals: "over HTTP/3"
  - id: advertised
    description: "The site's answers over HTTPS tell browsers it speaks HTTP/3 on UDP port 443."
    command: |
      headers=$(on office curl -sI -m 5 https://shop.test/ 2>&1)
      if echo "$headers" | grep -i '^alt-svc:.*h3=":443"' > /dev/null; then echo advertised; else echo "the site's answers over HTTPS don't say it speaks HTTP/3 on port 443"; fi
    expect:
      equals: advertised
  # Listeners of the check's own on shop, on ports the site doesn't serve:
  # three UDP ports that datagrams from the office must not reach (4433,
  # 5000 and 9999), and one TCP port that must give no answer at all, as a
  # firewall's drop gives. Each listener is the check's, so none of them is
  # the site. The description and the sentence a failing run prints name no
  # UDP port: the terminal shows them at the first check, and one of the
  # ports is the one a fault opens.
  - id: only-what-it-serves
    description: "shop's firewall still lets in nothing from the office but SSH and the site: datagrams sent to three UDP ports the site doesn't serve, and connections to TCP port 8080, get nowhere."
    timeout: 25
    command: |
      . /usr/local/lib/netlab/checklib.sh
      dir=$(mktemp -d)
      cleanup() { kill $(jobs -p) 2> /dev/null; rm -rf "$dir"; }
      trap cleanup EXIT
      for port in 4433 5000 9999; do
        on shop timeout 12 socat -u UDP4-RECV:"$port" STDOUT > "$dir/udp-$port" 2> /dev/null &
      done
      on shop holdserver 8080 > /dev/null 2>&1 &
      # Each listener must be up before the office sends, or a datagram the
      # firewall let in would find nobody and look like one it dropped.
      for try in $(seq 1 25); do
        [ "$(on shop ss -Huln | grep -cE ':(4433|5000|9999) ')" -ge 3 ] && break
        sleep 0.2
      done
      for port in 4433 5000 9999; do
        on office bash -c "echo probe | nc -u -w 1 203.0.113.10 $port" > /dev/null 2>&1
      done
      tcp=$(tcp_state office 203.0.113.10 8080)
      sleep 1
      for port in 4433 5000 9999; do
        [ -s "$dir/udp-$port" ] && { echo "a datagram from the office reached a UDP port on shop that the site doesn't serve"; exit 0; }
      done
      [ "$tcp" = dropped ] || { echo "from the office, shop's TCP port 8080 is $tcp"; exit 0; }
      echo "only the site"
    expect:
      equals: "only the site"
  - id: firewall-lasts
    description: "The firewall running on shop is the one its /etc/nftables.conf loads at every boot."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      [ "$(systemctl is-enabled nftables@shop 2> /dev/null)" = enabled ] || { echo "shop's firewall isn't loaded at boot"; exit 0; }
      differs=$(nft_saved shop) || { echo "shop's running firewall isn't the one its /etc/nftables.conf loads at boot: $(echo "$differs" | tr '\n' ' ')"; exit 0; }
      echo saved
    expect:
      equals: saved
  # Caddy's running configuration, from its admin endpoint on shop, against
  # what its Caddyfile gives (caddy adapt turns the file into the same JSON
  # Caddy runs), both with their keys sorted.
  - id: site-lasts
    description: "The site Caddy serves now is the one shop's /etc/caddy/Caddyfile gives it, and Caddy starts at every boot."
    command: |
      tidy() { python3 -c 'import json, sys
      try:
          print(json.dumps(json.load(sys.stdin), sort_keys=True))
      except ValueError:
          pass'; }
      [ "$(systemctl is-enabled caddy@shop 2> /dev/null)" = enabled ] || { echo "Caddy doesn't start on shop at boot"; exit 0; }
      live=$(on shop curl -s -m 3 http://localhost:2019/config/ | tidy)
      [ -n "$live" ] || { echo "Caddy isn't running on shop"; exit 0; }
      saved=$(on shop caddy adapt --config /etc/caddy/Caddyfile 2> /dev/null | tidy)
      [ -n "$saved" ] || { echo "Caddy can't read shop's /etc/caddy/Caddyfile"; exit 0; }
      [ "$live" = "$saved" ] || { echo "the site Caddy serves now isn't the one shop's /etc/caddy/Caddyfile gives it at boot"; exit 0; }
      echo saved
    expect:
      equals: saved
  # The links' live shaping against a fresh build's (netlab verify's copy,
  # from the sealed topology), so a change made live with tc shows. A
  # qdisc's handle is only a number: left out. Each interface is named.
  - id: links-as-shipped
    description: "The private link and the internet are as they were shipped, and so are the archive job and the HTTP/3 client."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      sealed=$(intact) || { echo "$sealed"; exit 0; }
      shaping() {
        p=$1
        {
          ip netns exec "${p}wan" tc qdisc show dev dr1
          ip netns exec "${p}wan" tc qdisc show dev shop
          ip netns exec "${p}isp" tc qdisc show dev office
          ip netns exec "${p}isp" tc qdisc show dev shop
        } | sed 's/netem [0-9a-f]*:/netem/'
      }
      live=$(shaping "")
      fresh=$(netlab verify wan isp -- bash -c "$(declare -f shaping); shaping chk-")
      if [ "$live" = "$fresh" ]; then echo "as shipped"; else echo "the links' shaping was changed: now $(echo "$live" | tr '\n' ' ')"; fi
    expect:
      equals: "as shipped"
