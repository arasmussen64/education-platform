id: write-count-over
stage: write
rev: 1
title: "Count the big ones"
prompt: |
  Write a function `count_over(numbers, limit)` that returns how many items of the list are greater than `limit`. `count_over([3, 8, 10, 1], 5)` returns `2`, and `count_over([], 5)` returns `0`. Equal to the limit doesn't count.
hints:
  - "Start a count at 0, loop over the items, and add 1 for each item that is `> limit`."
  - "Return the count after the loop. An empty list means the loop never runs and the count stays 0."
skills: [loop-lists]
