id: build-list-functions
stage: build
rev: 1
title: "Three list functions"
prompt: |
  Starting from a blank editor, write three functions that work on a list of numbers, each with a docstring, using loops rather than Python's `sum`, `max` or `min`:

  - `total(numbers)` returns the sum of the items (`0` for an empty list).
  - `largest(numbers)` returns the biggest item. The list has at least one item, and the items may all be negative.
  - `last_item(items)` returns the last item of any list with at least one item.

  Then `main()` prints, for the list `[4, 9, 2]`:

  ```
  Total: 15
  Largest: 9
  Last: 2
  ```

  Call `main()` at the bottom.
skills: [loop-lists, create-index, change-grow]
