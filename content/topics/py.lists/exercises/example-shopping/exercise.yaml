id: example-shopping
stage: worked_example
rev: 1
title: "A shopping list"
prompt: |
  One list, and the five things you do with lists most: index into it, change an item, add one, measure it, loop over it. Press **Run**. Then change line 1 to a list of two items and run again: every line still works, because nothing here depends on the length.
steps:
  - label: "Make it and index into it"
    lines: "1-3"
    note: "Square brackets make the list. `shopping[0]` is the first item and `shopping[-1]` the last, counting from 0 at the front and −1 at the back, just like a string."
  - label: "Change and grow"
    lines: "4-5"
    note: "`append` adds to the end. Assigning to a position replaces what's there. Both change the list itself; neither needs a new name."
  - label: "The whole list, and its length"
    lines: "6-7"
    note: "Printing a list shows it with brackets, quotes and commas. `len` counts the items: four now."
  - label: "Loop over the items"
    lines: "8-9"
    note: "`for item in shopping` visits each item in turn. No positions are needed here, so none are used."
