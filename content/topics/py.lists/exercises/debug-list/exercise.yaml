id: debug-list
stage: debug
rev: 2
title: "Scores"
prompt: |
  This program should add a score of 100 to the list, print the last score, then print every score on its own line:

  ```
  100
  70
  85
  90
  100
  ```

  Instead it stops with a `TypeError` before printing anything. It has three bugs, and fixing one shows the next. Read the message, fix one thing, run again, and compare the output with the example line by line.
hints:
  - "Read the error's last line: which value is `None`? Find the line that gave that name its value."
  - "`append` changes the list in place and gives back `None`, so `scores = scores.append(100)` swaps the list for `None`. Call `append` on its own line."
  - "A list of 4 items has positions 0 to 3, so `scores[len(scores)]` is one past the end. `scores[-1]` is the last item."
  - "The loop prints `i`, which is a position. To print the score at that position, look it up in the list with `i`."
skills: [change-grow, create-index, loop-lists]
