id: review-code-reversed
stage: review_code
rev: 1
title: "Backwards, as a new list"
prompt: |
  Write a function `reversed_copy(items)` that returns a **new** list with the items in reverse order, leaving the original list as it was. `reversed_copy([1, 2, 3])` returns `[3, 2, 1]`, and `reversed_copy([])` returns `[]`. Use a loop, not `reverse()`, `reversed()` or a slice.
skills: [loop-lists, change-grow]
