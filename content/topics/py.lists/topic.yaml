id: py.lists
kind: topic
status: ready
title: "Lists"
summary: "Create a list, index into it, change and grow it, and loop over it."
prerequisites: [py.m4.checkpoint]
estimated_minutes: 45
rev: 1
objectives:
  - "Make a list with square brackets, read items by position from the front (0) and the back (−1), and measure it with `len()`."
  - "Change a list: replace an item by position, add to the end with `append`, remove one, and check whether something is in it with `in`."
  - "Loop over a list's items with `for`, or over its positions with `range(len(...))` when the position matters."
