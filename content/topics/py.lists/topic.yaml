prove:
  build: build-list-functions
  debug: debug-list
  explain:
    prompt: |
      A friend writes this and gets `TypeError: object of type 'NoneType' has no len()` on the last line:

      ```python
      names = ["Ada", "Bob"]
      names = names.append("Cy")
      print(names[len(names)])
      ```

      In your own words: what does `append` do, and what does it give back? Why did `names` become `None`? How should the second line read? And once that's fixed, why would `names[len(names)]` still fail, and what should it be?
    rubric:
      - id: append-in-place
        required: true
        description: "append adds the item to the end of the list it's called on, changing that list; it returns None."
      - id: none
        required: true
        description: "Assigning the result replaced the list with None, so names no longer refers to a list."
      - id: fix
        required: true
        description: "Just names.append(\"Cy\"), with no assignment."
      - id: index
        required: true
        description: "Positions run from 0 to len(names) - 1, so len(names) is one past the end; the last item is names[-1] or names[len(names) - 1]."
    model_answer: |
      append changes the list it's called on: it adds the item to the end, in place. It doesn't give the list back; it returns None. So names = names.append("Cy") first adds Cy to the list and then throws the list away by making names refer to None, and the next line asks for len(None), which fails before it can even index. The fix is to drop the assignment: names.append("Cy") on its own. After that, names has three items at positions 0, 1 and 2, so names[len(names)] asks for position 3, which doesn't exist and raises an IndexError. The last item is names[-1], or names[len(names) - 1].
review_pool:
  - review-predict-change
  - review-mcq-last-item
  - review-code-reversed
  - mcq-in-list
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: create-index
    description: "Make a list, read items by position from the front or the back, and measure it with `len()`"
  - id: change-grow
    description: "Replace an item, `append` to the end, remove one, and test membership with `in`"
  - id: loop-lists
    description: "Loop over a list's items, or over its positions when the position matters"
