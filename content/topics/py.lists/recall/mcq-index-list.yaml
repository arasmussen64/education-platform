id: mcq-index-list
type: mcq
rev: 1
prompt: |
  With `colors = ["red", "green", "blue"]`, what is `colors[1]`?
choices:
  - '`"red"`'
  - '`"green"`'
  - '`"blue"`'
  - 'An error: there is no item 1'
answer: 1
explanation: |
  Positions count from 0, so `colors[0]` is `"red"`, `colors[1]` is `"green"` and `colors[2]` is `"blue"`. The same rule as for the characters of a string.
skills: [create-index]
