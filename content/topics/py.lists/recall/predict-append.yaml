id: predict-append
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines. Python prints a list with its brackets and commas.
code: |
  numbers = [3, 1, 4]
  numbers.append(1)
  numbers[0] = 5
  print(numbers)
  print(len(numbers))
  print(numbers[-1])
expected_output: |
  [5, 1, 4, 1]
  4
  1
explanation: |
  `append(1)` adds a fourth item to the end. `numbers[0] = 5` replaces the first item. The list is then `[5, 1, 4, 1]`, four items long, and `numbers[-1]` is its last item, 1.
skills: [change-grow, create-index]
