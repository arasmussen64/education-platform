id: review-mcq-last-item
type: mcq
rev: 1
prompt: |
  `items` is a list of unknown length, with at least one item. Which expression is always its last item?
choices:
  - '`items[len(items)]`'
  - '`items[3]`'
  - '`items[-1]`'
  - '`items[last]`'
answer: 2
explanation: |
  Negative positions count from the end, so `items[-1]` is always the last item, however long the list. `items[len(items)]` is one past the end and raises an `IndexError`; `items[len(items) - 1]` would work too. `items[3]` is only the last item of a four-item list.
skills: [create-index]
