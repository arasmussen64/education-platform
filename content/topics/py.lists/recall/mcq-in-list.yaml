id: mcq-in-list
type: mcq
rev: 1
prompt: |
  What does `"cat" in pets` do, when `pets` is a list?
choices:
  - 'Adds `"cat"` to the list'
  - 'Gives `True` if `"cat"` is one of the items in the list, and `False` otherwise'
  - 'Gives the position of `"cat"` in the list'
  - 'Causes an error: `in` only works in `for` loops'
answer: 1
explanation: |
  `in` is a question: is this value one of the items? It gives a `bool`, which is why it reads naturally in an `if`: `if "cat" in pets:`. To add an item, use `append`; to find a position, loop over the positions and compare.
skills: [change-grow]
