id: parsons-first-name
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `2` and then `Ada`. One line is a decoy that doesn't belong.
lines:
  - 'names = []'
  - 'names.append("Ada")'
  - 'names.append("Bob")'
  - 'print(len(names))'
  - 'print(names[0])'
distractors:
  - 'names.append["Cy"]'
explanation: |
  The list has to exist, empty, before anything is appended. Ada is appended first, so it's at position 0. `len` prints 2 before `names[0]` prints Ada, matching the output. `append["Cy"]` uses square brackets where a call needs round ones.
skills: [create-index, change-grow]
