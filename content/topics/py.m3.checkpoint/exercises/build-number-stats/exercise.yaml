id: build-number-stats
stage: build
rev: 1
title: "Number statistics"
prompt: |
  Starting from a blank editor, write a program that asks for a line of whole numbers separated by single spaces, at least one number. It prints:

  - **how many numbers** there are,
  - **their total**,
  - **the largest** of them,

  and then a **bar chart**: one line per number, in order, with that many `#`. Typing `12 7 3 5` should print:

  ```
  Numbers: 4
  Total: 27
  Largest: 12
  ############
  #######
  ###
  #####
  ```

  The question it asks can say anything you like. Build each number up from its digits as text, then turn it into a number with `int()` when it ends.
test_skills:
  test_count: [py.strings-as-sequences/loop-chars, py.accumulator-patterns/running-total]
  test_total: [py.strings-and-input/convert, py.accumulator-patterns/running-total]
  test_largest: [py.accumulator-patterns/best-so-far, py.if-elif-else/if-else]
  test_last_number: [py.tracing-code/trace-table, py.accumulator-patterns/best-so-far]
  test_chart: [py.nested-loops/grids, py.nested-loops/end-param]
  test_layout: [py.strings-and-input/fstrings, py.programs-and-print/print-text]
