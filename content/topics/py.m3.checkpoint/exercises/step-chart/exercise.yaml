id: step-chart
stage: fill_in
rev: 1
title: "Draw the chart"
prompt: |
  The statistics are done. Now add the bar chart: one line per word, one `#` per letter. The plan is a second loop over the text: every letter prints a `#` and stays on the line; every space ends the line. Replace each `...`. Typing `the quick brown fox` should print:

  ```
  Words: 4
  Letters: 16
  Longest word: quick
  ###
  #####
  #####
  ###
  ```
hints:
  - "`print(\"#\", end=\"\")` prints a `#` and stays on the same line."
  - "A space means the word's bar is complete: a bare `print()` ends the line."
  - "The last bar has no space after it, so end its line after the loop with one more `print()`."
