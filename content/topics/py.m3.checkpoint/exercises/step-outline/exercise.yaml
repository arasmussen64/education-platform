id: step-outline
stage: fill_in
rev: 1
title: "Put it all together"
prompt: |
  Now write the whole program. Only the plan is left: four comments, one for each part. Write each part under its comment, and press **Run** after each one to check it so far. Typing `the quick brown fox` should print:

  ```
  Words: 4
  Letters: 16
  Longest word: quick
  ###
  #####
  #####
  ###
  ```
hints:
  - "Under each comment, write what you filled in for that part in the steps before."
  - "The second part is one loop over the characters with an if / else: a space ends a word (count it, compare it, empty it); anything else is a letter that joins the current word. Then handle the last word after the loop."
  - "The chart is a second loop over the text: `#` with `end=\"\"` for a letter, a bare `print()` for a space, and one more `print()` after the loop."
