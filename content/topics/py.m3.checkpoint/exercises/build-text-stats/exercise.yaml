id: build-text-stats
stage: build
rev: 1
title: "Text statistics"
prompt: |
  Starting from a blank editor, write a program that asks for a line of text: words made of letters, separated by single spaces, at least one word. It prints:

  - **how many words** there are,
  - **how many letters** (characters that aren't spaces),
  - **the longest word** (if two are equally long, the first of them),

  and then a **bar chart**: one line per word, in order, with one `#` for each letter in the word. Typing `the quick brown fox` should print:

  ```
  Words: 4
  Letters: 16
  Longest word: quick
  ###
  #####
  #####
  ###
  ```

  The question it asks can say anything you like. Lists and `split()` come later in the course; this one is loops and strings.
test_skills:
  test_words: [py.strings-as-sequences/loop-chars, py.accumulator-patterns/running-total]
  test_letters: [py.accumulator-patterns/running-total, py.booleans-and-comparisons/compare]
  test_longest: [py.accumulator-patterns/best-so-far, py.if-elif-else/if-else]
  test_last_word: [py.tracing-code/trace-table, py.accumulator-patterns/best-so-far]
  test_chart: [py.nested-loops/grids, py.nested-loops/end-param]
  test_layout: [py.strings-and-input/fstrings, py.programs-and-print/print-text]
