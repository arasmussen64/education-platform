id: build-results
stage: build
rev: 1
title: "Match results"
prompt: |
  Starting from a blank editor, write a program that asks for a team's results as one word of letters, `W` for a win and `L` for a loss, like `WWLWWWL`, with at least one result. It prints:

  - **how many games** were played,
  - **how many wins**,
  - **the longest winning streak**: the most wins in a row,

  and then a **chart**: one line per winning streak, in order, with one `#` per win in it. Typing `WWLWWWL` should print:

  ```
  Games: 7
  Wins: 5
  Longest winning streak: 3
  ##
  ###
  ```

  A team with no wins prints the three lines and no chart. The question it asks can say anything you like.
test_skills:
  test_games: [py.strings-as-sequences/loop-chars, py.accumulator-patterns/running-total]
  test_wins: [py.accumulator-patterns/running-total, py.booleans-and-comparisons/compare]
  test_streak: [py.accumulator-patterns/best-so-far, py.if-elif-else/if-else]
  test_last_streak: [py.tracing-code/trace-table, py.accumulator-patterns/best-so-far]
  test_chart: [py.nested-loops/grids, py.nested-loops/end-param]
  test_layout: [py.strings-and-input/fstrings, py.programs-and-print/print-text]
