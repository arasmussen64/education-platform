id: step-longest
stage: fill_in
rev: 1
title: "Find the longest word"
prompt: |
  The counting works. Now the program should also find the longest word, by building each word as it goes and comparing it with the longest so far when it ends. Replace each `...`. Typing `the quick brown fox` should print:

  ```
  Words: 4
  Letters: 16
  Longest word: quick
  ```

  and `we go far` should end with `Longest word: far`.
hints:
  - "Build the current word one character at a time: `word = word + ch`."
  - "When a space arrives the word is complete: if it's longer than `longest`, it becomes the new `longest`. Then start a new, empty word: `\"\"`."
  - "After the loop, the last word hasn't been compared yet. Do the same check once more: `len(word) > len(longest)`."
