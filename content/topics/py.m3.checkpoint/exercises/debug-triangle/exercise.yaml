id: debug-triangle
stage: debug
rev: 2
title: "A triangle, counted"
prompt: |
  This program asks for a height, prints a triangle of stars (row 1 has one star, row 2 has two, and so on), and then says how many stars it printed. Typing `3` should print:

  ```
  *
  **
  ***
  Stars: 6
  ```

  Right now, typing `3` prints three stars and then stops with a `NameError`. It has three bugs. Read the error first and fix it. Then run it with `3` again, compare the output with the example line by line, and fix what you find.
hints:
  - "Read the error's last line: which name does it say isn't defined? Compare it with the names the program does make."
  - "With the crash fixed, count the lines it prints for `3` and the stars on each. Then trace one pass of the outer loop: where does each line break come from?"
  - "A bare `print()` ends a row. Inside the inner loop it runs after every star; it belongs after the inner loop, indented once."
  - "`range` stops before its stop value, so `range(1, n)` draws one row too few. The rows need `range(1, n + 1)`."
test_skills:
  test_rows: [py.for-and-range/range-bounds, py.nested-loops/inner-outer]
  test_one_line_per_row: [py.nested-loops/end-param, py.nested-loops/grids]
  test_count: [py.reading-errors/read-traceback, py.accumulator-patterns/running-total]
