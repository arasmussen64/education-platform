id: example-weather
stage: worked_example
rev: 1
title: "A week of weather"
prompt: |
  This program is like the checkpoint's build, in a different story. The user types a week as letters, `s` for a sunny day and `r` for a rainy one, like `ssrsssrr`. The program counts the days of each kind, finds the longest run of sunny days in a row, and draws a bar for each kind. Press **Run** and try `ssrsssrr`, then `sss`, then `rrr`, and read how it's built.

  Like the earlier checkpoints, it's planned in parts: read the input, work things out, print them. The new part is a loop that notices where one run ends and the next begins, which is exactly what the build needs for words.
steps:
  - label: "Plan with comments"
    lines: "1"
    note: "The comments on lines 1, 4, 23 and 28 name the four parts. The middle two are where the thinking is."
  - label: "Read the input"
    lines: "2"
    note: "One line of text. Everything else is worked out from its characters."
  - label: "Starting values"
    lines: "5-8"
    note: "Four accumulators, all set before the loop. `streak` is the run of sunny days being counted right now; `longest` is the best run seen so far."
  - label: "Walk along the string"
    lines: "9-18"
    note: "One character at a time. A rainy day ends the current run: that's the moment to compare the run with the longest and keep it if it's longer, then start a new run at 0. A sunny day just grows the run. In the build, a space will end a word the same way."
  - label: "The last run"
    lines: "19-21"
    note: "If the week ends on sunny days, no rainy day comes along to end that run, so it was never compared. These lines do the comparison once more, after the loop. Forget them and `sss` reports a longest run of 0."
  - label: "Print the statistics"
    lines: "24-26"
    note: "Three f-strings, one per line."
  - label: "Draw the bars"
    lines: "29-36"
    note: "`end=\"\"` keeps each `#` on the same line as its label, and a bare `print()` ends the bar. A loop that runs `sunny` times draws `sunny` characters. `\"#\" * sunny` would draw the same bar in one line."
