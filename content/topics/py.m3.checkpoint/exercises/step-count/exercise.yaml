title: "Count the words and letters"
prompt: |
  Here's the first part of the checkpoint's program: it should count the words and the letters, and nothing else yet. Replace each `...`: what a word ends with, what to add for a letter, and the line that counts the last word. Typing `the quick brown fox` should print:

  ```
  Words: 4
  Letters: 16
  ```
hints:
  - "A word ends where a space is: `ch == \" \"`."
  - "Every character that isn't a space is a letter: add 1 to `letters`."
  - "The last word has no space after it, so count it after the loop: `words += 1`."
