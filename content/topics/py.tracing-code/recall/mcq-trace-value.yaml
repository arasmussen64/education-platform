id: mcq-trace-value
type: mcq
rev: 1
prompt: |
  What does `count` refer to after these lines have run?

  ```python
  count = 2
  count = count + 3
  count = count * 2
  if count > 9:
      count = count - 1
  ```
choices:
  - '`10`'
  - '`9`'
  - '`5`'
  - '`7`'
answer: 1
explanation: |
  Line by line: 2, then 2 + 3 = 5, then 5 × 2 = 10. At the `if`, 10 > 9 is `True`, so the last line runs and `count` becomes 9. Each line uses the value from the line before it.
skills: [trace-table]
