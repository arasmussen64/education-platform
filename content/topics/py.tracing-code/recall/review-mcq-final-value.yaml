id: review-mcq-final-value
type: mcq
rev: 1
prompt: |
  What does `n` refer to after these lines have run?

  ```python
  n = 10
  if n > 5:
      n = n + 1
  if n > 10:
      n = n * 2
  ```
choices:
  - '`22`'
  - '`11`'
  - '`20`'
  - '`10`'
answer: 0
explanation: |
  These are two separate `if` statements, so both questions are asked. 10 > 5 is `True`, so `n` becomes 11. Then 11 > 10 is `True` as well, so `n` becomes 22. With `elif` instead of the second `if`, the answer would have been 11.
skills: [follow-branches, trace-table]
