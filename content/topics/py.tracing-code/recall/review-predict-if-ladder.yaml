id: review-predict-if-ladder
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: one line, two numbers.
code: |
  a = 2
  b = 5
  a = a + b
  b = a - b
  if a > 6:
      a = a - 10
  print(a, b)
expected_output: |
  -3 2
explanation: |
  `a` becomes 2 + 5 = 7. Then `b = a - b` uses the *new* `a`: 7 − 5 = 2. At the `if`, 7 > 6 is `True`, so `a` becomes 7 − 10 = −3. The print shows `-3 2`.
skills: [trace-table, predict-output]
