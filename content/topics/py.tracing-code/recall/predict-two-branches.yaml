id: predict-two-branches
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: two lines. The first `if` changes a value that the second `if` then looks at.
code: |
  x = 3
  y = 3
  if x == y:
      x = x + 1
  if x == y:
      print("same")
  else:
      print("different")
  print(x, y)
expected_output: |
  different
  4 3
explanation: |
  At the first `if`, `x == y` is `True`, so `x` becomes 4. At the second `if`, the values are 4 and 3, so `x == y` is now `False`: `different` is printed. The last line prints the current values, `4 3`. The same question had different answers because a value changed in between.
skills: [follow-branches, predict-output]
