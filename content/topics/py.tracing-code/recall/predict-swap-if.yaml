id: predict-swap-if
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: two lines.
code: |
  a = 4
  b = 9
  if a > b:
      a = b
  else:
      b = a
  print(a)
  print(b)
expected_output: |
  4
  4
explanation: |
  With `a` at 4 and `b` at 9, `a > b` is `False`, so the `if` branch is skipped and the `else` runs: `b = a` makes `b` refer to 4 as well. Both prints then show 4.
skills: [trace-table, follow-branches]
