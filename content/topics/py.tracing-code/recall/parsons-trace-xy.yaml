id: parsons-trace-xy
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `12` and then `6`. One line is a decoy that doesn't belong.
lines:
  - 'x = 5'
  - 'y = x + 1'
  - 'x = y * 2'
  - 'print(x)'
  - 'print(y)'
distractors:
  - 'x = y + 2'
explanation: |
  Trace it: `x` is 5, so `y` is 6, so the new `x` is 12. Changing `x` afterwards doesn't change `y`. The prints follow the order of the output: 12, then 6. `y + 2` would make `x` 8.
skills: [trace-table, predict-output]
