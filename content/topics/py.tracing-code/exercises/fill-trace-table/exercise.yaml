id: fill-trace-table
stage: fill_in
rev: 1
title: "Match the trace table"
prompt: |
  Someone traced this program and got the table below, but the first two lines of the program have gone missing. Replace each `...` with the starting value that makes the program match the table.

  | line | `price` | `quantity` | `total` | printed |
  |---|---|---|---|---|
  | 1 | 6 | | | |
  | 2 | 6 | 4 | | |
  | 3 | | | | `6 4` |
  | 4 | 6 | 4 | 24 | |
  | 5 | 24 > 20 is `True` | | | |
  | 6 | 6 | 4 | 19 | |
  | 7 | | | | `19` |
hints:
  - "Rows 1 and 2 of the table show what the first two lines must set."
  - "Check your answer against row 4: `price * quantity` has to be 24, and row 6 says 5 was taken off."
skills: [trace-table]
