id: example-trace
stage: worked_example
rev: 1
title: "A trace, line by line"
prompt: |
  This is the program from Python Tutor. Read the trace below, then press **Run** to check the last row. Then change line 1 to `total = 5`, trace it yourself, and run again.
steps:
  - label: "Start the table"
    lines: "1-2"
    note: "Two names, two columns. After line 2 the table reads: `total` 10, `bonus` 3. Nothing has been printed."
  - label: "Work out the condition"
    lines: "3"
    note: "Look up the current value of `total`: 10. Is 10 > 8? `True`. So the lines indented under the `if` run, and the `else` block won't."
  - label: "Change a name using its own value"
    lines: "4"
    note: "The right-hand side is worked out first, with the old values: 10 + 3 = 13. Then `total` points at 13. New row: `total` 13, `bonus` 3."
  - label: "Skip the branch that didn't run"
    lines: "5-6"
    note: "The `else` block is skipped, so `bonus` stays 3. Crossing out skipped lines in your trace stops you from applying them by mistake."
  - label: "Print the current values"
    lines: "7"
    note: "`print(total, bonus)` shows the values in the last row of the table, separated by a space: `13 3`."
