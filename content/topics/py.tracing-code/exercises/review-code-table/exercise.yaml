title: "A short trace, as code"
prompt: |
  Write the program this trace describes, using the names `a` and `b` and giving them their starting values on the first two lines. The checks also run it with other starting values.

  1. `a` starts at 8 and `b` at 3.
  2. If `a` is more than `b`, `a` goes down by `b`.
  3. Print `a` and `b` on one line, separated by a space.

  As written, it prints `5 3`.
