id: write-from-table
stage: write
rev: 1
title: "From the table to the program"
prompt: |
  Write the program that this trace table describes. Use the names `n` and `half`.

  | line | what happens | `n` | `half` | printed |
  |---|---|---|---|---|
  | 1 | `n` starts at 7 | 7 | | |
  | 2 | `half` is `n` divided by 2, whole numbers only | 7 | 3 | |
  | 3 | is `n` more than 5? `True` | | | |
  | 4 | `n` goes down by `half` | 4 | 3 | |
  | 5 | print `n` and `half` on one line | | | `4 3` |
hints:
  - "Whole-number division is `//`: `7 // 2` is 3."
  - "Row 3 is an `if` with a condition; row 4 is the indented line under it."
  - "The last line prints two values separated by a space: `print(n, half)`."
skills: [trace-table, predict-output]
