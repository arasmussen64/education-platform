title: "Apples and oranges"
prompt: |
  This program asks how many apples and how many oranges someone has, then says which there are more of and by how many, or `Same number` when the counts are equal. Typing `5` and `3` should print:

  ```
  More apples, by 2
  ```

  and `2` and `6` should print `More oranges, by 4`, and `4` and `4` should print `Same number`. It has three bugs. Trace it with each pair of numbers before you run it: the trace will show you where it goes wrong.
skills: [trace-table, follow-branches, predict-output]
