id: build-from-trace
stage: build
rev: 1
title: "A program from its trace"
prompt: |
  Starting from a blank editor, write the program that this trace describes. Use the names `score` and `bonus`, and give them their starting values on the first two lines, because the checks also run your program with other starting values.

  1. `score` starts at 50 and `bonus` at 20.
  2. If `score` is at least 50, `score` goes up by `bonus`. Otherwise, `bonus` becomes 0.
  3. If `score` is now more than 60, print `High`; otherwise print `Low`.
  4. Print `score` and `bonus` on one line, separated by a space.

  As written, it prints:

  ```
  High
  70 20
  ```
skills: [trace-table, follow-branches]
