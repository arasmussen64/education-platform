# Cloudflare blog states no licence (copyright Cloudflare); AWS documentation
# is copyright Amazon Web Services; Google Cloud's documentation is CC BY 4.0
# (as Module 2 recorded it); Microsoft's Azure documentation is CC BY 4.0
# (MicrosoftDocs/azure-docs); RFCs are under the IETF Trust's provisions.
