id: csa.net.layers
kind: topic
status: ready
title: Layers and packets
summary: "Follow one request down and up the network layers, using the OSI and TCP/IP models as a debugging order: headers and hex, what each router changes, ARP and the neighbour table, ICMP's messages, encapsulation and MTU, and the path MTU black hole where small pages load and big downloads hang."
# Module 3 opens straight after Module 1 (the Module 3 plan, section 2), and
# this is its first topic. It also carries the module's lab onboarding: the
# note at the top of example-follow-a-request's prompt and its first five
# steps, which every later Module 3 topic's first lab points back to.
# What it builds on in Module 1, for the writer: net-tools (ip, ss, tcpdump,
# traceroute, nftables and ct state, namespaces and veth pairs), shell
# (grep, awk, sed), scripting (a bash script, chmod +x, $(...), if),
# services (systemctl, journalctl) and hardening (a fix lives in the file).
prerequisites: [csa.m1.checkpoint]
estimated_minutes: 310
rev: 1
objectives:
  - "Follow one request from a laptop to a server and back, layer by layer, in real captures: which headers wrap the data, what each router changes (the MAC addresses, the TTL, the checksum) and what it leaves alone (the IP addresses and ports), read field by field in `tcpdump` text and in a hex dump."
  - "Use the OSI and TCP/IP models as a debugging order (link, neighbour, route, port, protocol): name the layer a symptom belongs to, and the tool that tests it."
  - "Explain ARP and read the neighbour table: why a packet for a far host carries the gateway's MAC address, and what `FAILED` and a stale `PERMANENT` entry mean."
  - "Read ICMP's messages (echo, destination unreachable and its codes, time exceeded) in `ping` and `traceroute` output, and say which of them a firewall must never drop."
  - "Work out MTU, MSS and tunnel overheads on sight (GRE, IPIP, VXLAN), and the largest packet a path carries, including where the three clouds' MTUs differ."
  - "Recognise a path MTU black hole (handshakes and small pages work, big transfers hang), prove it with captures and DF pings, and fix it at its cause."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - AWS: all instance types support 1500 MTU; current generation types
#   support 9001 jumbo frames; 1500 over an internet gateway, VPN
#   connections, and between Regions unless a transit gateway is used; 8500
#   over inter-Region VPC peering; over the limit, packets "are fragmented,
#   or they are dropped if the Don't Fragment flag is set"; PMTUD's type 3
#   code 4 can be blocked by a network ACL:
#   https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/network_mtu.html
# - AWS: "We do not support broadcast in a VPC, therefore we reserve this
#   address": https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html
#   No AWS page read says whether GRE between instances is allowed, so the
#   lesson claims nothing about it.
# - Google Cloud: VPC networks default to an MTU of 1,460, settable from
#   1,300 to 8,896; no IP fragmentation inside the network, and Fragmentation
#   Needed or Packet Too Big sent back; no MSS clamping inside a VPC, MSS
#   clamping for destinations outside it: https://docs.cloud.google.com/vpc/docs/mtu
# - Google Cloud: VPC networks "do not support broadcast or multicast";
#   they support GRE version 0, which Cloud NAT and Application Load
#   Balancers don't: https://docs.cloud.google.com/vpc/docs/vpc
# - Azure: the default MTU is 1500; larger only for traffic within the
#   virtual network and directly peered ones in the same region (not
#   gateways, global peering or the internet); largest 3900 on Mellanox
#   adapters, 9000 on MANA; ping -M do -s is the MTU less 28 (dated
#   2024-07-22, updated 2026-08-07):
#   https://learn.microsoft.com/en-us/azure/virtual-network/how-to-virtual-machine-mtu
# - Azure: "Multicast, broadcast, IP-in-IP encapsulated packets, and Generic
#   Routing Encapsulation (GRE) packets are blocked in virtual networks"
#   (FAQ dated 2026-07-08):
#   https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
# - Cloudflare's MTU explainer says 1,500 bytes is "the maximum MTU size"
#   (the Module 3 critic read it 2026-11-11; it refused this writer's plain
#   fetch with HTTP 403 on 2026-11-12, so it isn't listed as a resource).
# - RFC 791 (IPv4 header), RFC 792 (ICMP types and codes; an error carries
#   the IP header and the first 64 bits of the datagram), RFC 826 (ARP),
#   RFC 1191 (PMTUD), RFC 2923 section 2.1 (the black hole), RFC 7348
#   (VXLAN, UDP 4789, 8-byte header), RFC 8200 (IPv6 routers don't fragment):
#   as the Module 3 layers brief recorded them on 2026-11-11.
# Every capture in the lesson, the items and the labs' notes is real output
# of this topic's labs on the owner's PC (Docker Desktop 29.8.2, kernel
# 6.18.33.2-microsoft-standard-WSL2, the network-lab base's Ubuntu 24.04
# packages: tcpdump 4.99.4, iputils 20240117, tshark), captured 2026-11-12;
# MAC addresses and identification numbers differ at every run. Linux's
# default tunnel MTUs (GRE 1476, IPIP 1480, VXLAN 1450, WireGuard 1420 over
# a 1500-byte link) and the ten-minute PMTU cache are the Module 3 layers
# brief's captures (F7, F9), the GRE and PMTU ones seen again here.
#
# Linked, never copied. Licences, each read on 2026-11-12: Beej's guide is
# CC BY-NC-ND 3.0 (its foreword's "Copyright and Distribution", v1.11.4);
# YouTube's standard licence for Ben Eater's videos (title and channel
