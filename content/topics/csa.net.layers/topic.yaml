skills:
  - id: layer-model
    description: "The OSI and TCP/IP models as a map: which layer a header, a device, a tool and a symptom belong to; working up the layers to place a fault (link, neighbour, route, port, protocol); why \"it pings\" proves only layer 3; where the clouds hide layers 1 and 2"
  - id: read-headers
    description: "Reading a capture field by field: Ethernet (MAC addresses, EtherType), IPv4 (header length, total length, identification, DF, TTL, protocol, addresses) and the ports; the same packet on two sides of a router; the same fields in a hex dump"
  - id: arp-neighbours
    description: "ARP's request and reply; the gateway's MAC address on every packet to another network; the neighbour table's states, and what FAILED, INCOMPLETE and a wrong PERMANENT entry mean; why gratuitous ARP doesn't work in the clouds"
  - id: icmp-messages
    description: "ICMP's types and codes and what each tells you (echo, destination unreachable with host, port and fragmentation needed, time exceeded); errors quoting the packet that caused them, so they are related; which ICMP a firewall must let through"
  - id: encapsulation-mtu
    description: "MTU, frame size and MSS; the overheads (Ethernet 14, IPv4 20, TCP 20, UDP 8, ICMP 8; GRE 24, IPIP 20, VXLAN 50) and the inner MTU a tunnel leaves; the largest ping -M do -s that fits; the three clouds' MTUs"
  - id: pmtud-blackholes
    description: "Path MTU discovery (DF, fragmentation needed, the sender's per-destination memory); the black hole when that ICMP is dropped; proving it with tracepath, DF pings, a capture on the sender and ip route get; fixing it at the cause, and why MSS clamping and lowered MTUs are workarounds"
