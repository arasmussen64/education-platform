prove:
  build: build-branch-tunnel
  debug: debug-big-downloads-hang
  explain:
    prompt: |
      Staff say the shop's site loads but big downloads hang, and a colleague says "the firewall must be broken, turn it off". Explain, in your own words: how one request travels from a laptop to a server across a router and a tunnel, layer by layer, and what each router changes and what it leaves alone; how the laptop finds the router's hardware address; what ICMP is for, and which of its messages must never be blocked; what MTU and encapsulation overhead are, and how path MTU discovery works; why dropping ICMP makes small pages work but big downloads hang, how you'd prove that's what is happening, and how you'd fix it without turning the firewall off; and one way the three clouds differ in any of this.
    rubric:
      - id: layers-and-encapsulation
        required: true
        description: "Each layer wraps the one above in a header (the application's data in TCP, in IP, in an Ethernet frame); the models are a debugging order: link, neighbour, route, port, protocol."
      - id: hop-by-hop
        required: true
        description: "Each hop builds a new frame (new source and destination MAC addresses) and lowers the TTL (so it rewrites the checksum); the IP addresses and ports stay the same end to end (without NAT); a tunnel adds an outer IP header around the whole packet."
      - id: arp
        required: true
        description: "The laptop broadcasts an ARP request for the gateway's IP address and gets its MAC address in a reply sent straight back; it never asks for the far server's MAC; answers are cached in the neighbour table, with states."
      - id: icmp
        required: true
        description: "ICMP carries errors and tests (echo, destination unreachable with its codes, time exceeded); an error quotes the packet that caused it, so a stateful firewall can treat it as related; fragmentation needed (IPv6's Packet Too Big) must get through."
      - id: mtu-pmtud
        required: true
        description: "MTU is the largest packet a link carries; headers and tunnels take room (GRE 24 bytes, so 1476 over 1500); the sender sets DF, a router that can't forward the packet sends fragmentation needed with its MTU, and the sender remembers it and sends smaller packets."
      - id: black-hole
        required: true
        description: "Small packets fit, so handshakes and small pages work; the first full-size packet is dropped and its ICMP blocked, so bulk transfers stall; proof: a DF ping from the sender, tracepath, a capture on the sender showing the ICMP arriving, ip route get with no remembered MTU; fix: let the ICMP through (related, or the specific type), not turn the firewall off; MSS clamping helps TCP only."
      - id: clouds-differ
        required: false
        description: "Any correct difference: AWS 9001 inside a VPC and 1500 at its edges; Google 1460 by default and MSS clamping on the way out; Azure 1500 except inside a virtual network; Azure blocks GRE between VMs while Google allows it; no broadcast in any of them, so no gratuitous-ARP failover."
    model_answer: |
      The firewall isn't broken; it's dropping one message too many. Start with how a request travels. The browser's HTTP request is wrapped in a TCP segment with the ports, that in an IP packet with the laptop's and the server's addresses and a TTL, and that in an Ethernet frame with MAC addresses. Each layer adds its own header, and on the way up each one is taken off again. The layers are also the order to debug in: is the link up, does the next box answer, is there a route, does the port answer, does the protocol work.

      The laptop's frame doesn't go to the server: it goes to the router. The laptop broadcasts an ARP request, "who has 10.0.1.1?", the router answers with its MAC address, and the laptop keeps that in its neighbour table. It never asks for the server's MAC; ARP doesn't cross routers. Each router takes the frame off, lowers the TTL by one (so it redoes the header's checksum), and builds a new frame for the next hop. The IP addresses and ports stay the same end to end. Across the internet, a GRE tunnel wraps the whole packet in a new outer IP header, 24 bytes of extra headers.

      That costs room. A link's MTU is the largest packet it carries, 1500 on Ethernet, so the tunnel's is 1476. Senders set don't-fragment, and a router that can't forward a packet sends back ICMP "fragmentation needed" with its MTU; the sender remembers it and sends smaller packets. That's path MTU discovery. ICMP is how the network reports errors (unreachable, time exceeded) and how ping works, and each error quotes the packet that caused it, so a stateful firewall can accept it as related.

      If the server's firewall drops all ICMP, the handshake and small pages still fit, but the first full-size packet never fits the tunnel and the message saying so is thrown away, so the download hangs. To prove it: tracepath shows 1476, a don't-fragment ping from the server gets nothing back, tcpdump on the server shows the ICMP arriving, and ip route get shows no remembered MTU. The fix is to let related ICMP in above the drop rule, not to turn the firewall off. MSS clamping would only rescue TCP.

      The clouds differ too: AWS uses 9001 inside a VPC but only 1500 through an internet gateway, while Google defaults to 1460 and clamps the MSS on the way out.
