# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: frame
  definition: The link layer's message, a packet wrapped with a header that names the source and destination MAC addresses. A frame only ever travels one hop, to the next box.
- term: packet
  definition: The internet layer's message, an IP header and its payload, carried end to end from one IP address to another, router by router. People also say packet for any layer's message.
- term: octet
  definition: Eight bits, one byte, as network standards call it. An IPv4 address is four octets, each from 0 to 255.
- term: MAC address
  definition: The hardware address of a network card, six bytes written like `9a:27:2d:a1:83:36`. Frames on one link are delivered by it.
- term: IP address
  definition: The address of a machine's interface on an IP network, which routers forward packets by. IPv4's are 32 bits, written like 10.0.1.10; IPv6's are 128.
- term: port
  definition: A number from 0 to 65535 in a TCP or UDP header that picks out one program's conversation on a machine, such as 443 for HTTPS.
- term: TTL
  aliases: [time to live]
  definition: Time to live. In an IP header, a count each router lowers by one, the packet being dropped at zero so loops can't keep it; in DNS, the seconds an answer may be cached.
- term: ARP
  aliases: [Address Resolution Protocol]
  definition: How an IPv4 machine finds the MAC address of the next box on its own network, by broadcasting "who has this address?" and keeping the answer in its neighbour table.
- term: ICMP
  aliases: [Internet Control Message Protocol]
  definition: The network's error and test messages, carried in IP packets, such as echo request and reply (ping), destination unreachable, fragmentation needed and time exceeded.
- term: MTU
  aliases: [maximum transmission unit]
  definition: The biggest IP packet a link carries, headers included, such as 1500 bytes on Ethernet. A tunnel's headers leave less room inside it.
- term: tunnel
  definition: A way of carrying whole packets inside other packets, so they cross a network as the outer packets' payload. Its headers take room, so its MTU is smaller.
