#!/usr/sbin/nft -f
# srv's firewall: no ping, and two ports dropped; everything else is let in,
# and a port nothing listens on is refused.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
        icmp type echo-request drop
        tcp dport { 3306, 8443 } drop
    }
}
