#!/usr/sbin/nft -f
# r2's firewall: from the internet, nothing goes on into the cloud's
# network except what arrives through a tunnel (the tunnel's packets come
# out of gre1, not wan), as a cloud's gateway does.
flush ruleset

table inet filter {
    chain forward {
        type filter hook forward priority filter; policy accept;
        iifname "wan" drop
    }
}
