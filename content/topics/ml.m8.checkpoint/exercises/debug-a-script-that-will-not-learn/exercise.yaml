id: debug-a-script-that-will-not-learn
stage: debug
rev: 2
# The app stops a Run or a Check after this long (5 seconds when a file
# doesn't say). This program trains a network, and the Check runs it
# twice, so it needs longer.
# Keep the solution under 40% of it: npm run time:content, in web/.
time_limit_ms: 15000
title: "Three bugs in a training script"
prompt: |
  This is the digit reader from the build, with the same network, data and training settings, except that the weights of both layer types are started by one helper, `start_weights` (its `fan_in` is the number of inputs a unit sums: `n_in` for a dense layer, `k * k` for a kernel). It should print:

  ```
  loss 1.97 -> 0.06 | held-out accuracy 0.95 | at least 0.9: True
  evaluating twice gives the same answer: True
  ```

  Instead the loss goes from 2.31 to 2.30 in twenty epochs, and the held-out accuracy is 0.10. It has three bugs. Each one shows from the outside, but one at a time: fixing one brings the next into view. Run it after every change, and tell them apart the way the module's checklist does.
hints:
  - "Read the first loss before anything else. 2.30 is log 10, the loss of guessing evenly among ten digits, and the curve never moves. What would make every hidden value zero and stop any gradient reaching the weights?"
  - "`start_weights` returns zeros. A start must be small random numbers scaled by the fan-in: `rng.standard_normal(shape) / np.sqrt(fan_in)`."
  - "Now it learns, but evaluating the same network twice gives two different answers. Nothing changes the weights between the two, so something in the network is random: which layer, and which mode is it in when `evaluate` runs?"
  - "`evaluate` must call `net.eval()` before its forward pass; `fit` already switches back with `net.train()` before each epoch's steps."
  - "Now the double evaluation agrees, but the accuracy ends short of 0.9. It learns, so the weights and the data are fine: compare the learning rate with the one the build's digit reader trains at."
  - "The build trains Adam at 0.01, and `RATE` is ten times that: each step overshoots. Set `RATE = 0.01`."
# Every test names the module skills it checks (ADR-0012), so a failed test
# says which topics to revisit.
test_skills:
  test_the_output: [ml.nn.initialization-and-activations/symmetry, ml.nn.regularization/dropout, ml.nn.debugging-training/learning-rate]
  test_the_pieces: [ml.nn.initialization-and-activations/symmetry, ml.nn.initialization-and-activations/scale, ml.nn.regularization/dropout, ml.nn.debugging-training/learning-rate, ml.nn.debugging-training/bug-or-hard]
