id: debug-returns
stage: debug
rev: 2
title: "Three functions, three results"
prompt: |
  This program tries out three small functions: `largest(a, b)` is the bigger of two numbers, `sum_to(n)` is 1 + 2 + ... + n, and `half(n)` is half of `n`. It should print:

  ```
  8
  9
  10
  5.0
  ```

  Instead it prints five lines, and two of them say `None`. It has three bugs. Run it, match each line it prints with the call in `main` that printed it, then run the checks, which try each function on its own.
hints:
  - "Each line `main` prints is one function's result. Line by line, which function gave a wrong one, and what did it give?"
  - "`None` is what a call gives when its function ends without a `return`. `largest(3, 8)` printed a line of its own and then gave `None`: which branch does it take, and what does that branch do with `b`?"
  - "`sum_to(4)` gives 1, the total after the loop's first pass. Look at how far `return total` is indented: is it inside the loop?"
  - "`half` works out `n / 2` and then drops it. A value only leaves a function through `return`."
skills: [return-vs-print, none, use-result]
