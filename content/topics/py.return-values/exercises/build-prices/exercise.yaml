id: build-prices
stage: build
rev: 1
title: "Prices with tax"
prompt: |
  Starting from a blank editor, write two functions that return values and a `main()` that uses them:

  - `total_price(price, quantity)` returns the price times the quantity.
  - `with_tax(amount)` returns the amount plus 10% tax, rounded to 2 decimal places (`round(x, 2)` rounds `x` to 2 decimal places).
  - `main()` works out the total for 3 items at $4.00 each, adds tax, and prints `Total: $13.20` with two decimal places.

  Neither function prints anything. Call `main()` at the bottom.
skills: [return-vs-print, use-result, none]
