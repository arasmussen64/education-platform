id: review-code-absolute
stage: review_code
rev: 1
title: "Without the sign"
prompt: |
  Write a function `absolute(n)` that returns `n` without its sign: `absolute(-5)` returns `5`, `absolute(3)` returns `3`, and `absolute(0)` returns `0`. Don't use Python's built-in `abs`, and don't print inside the function.
skills: [return-vs-print, use-result]
