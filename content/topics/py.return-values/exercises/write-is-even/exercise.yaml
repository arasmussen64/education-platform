id: write-is-even
stage: write
rev: 1
title: "Is it even?"
prompt: |
  Write a function `is_even(n)` that returns `True` when `n` is even and `False` when it isn't. The function must not print anything; it hands the answer back. Then, in `main()`, print `is_even(4)` and `is_even(7)` and call `main()` at the bottom, so running the program prints:

  ```
  True
  False
  ```
hints:
  - "A number is even when `n % 2 == 0`. That comparison is already `True` or `False`."
  - "So the whole body can be one line: `return n % 2 == 0`."
  - "`main` prints what the calls return: `print(is_even(4))`."
skills: [return-vs-print, use-result]
