id: example-square
stage: worked_example
rev: 1
title: "A function that hands something back"
prompt: |
  `square` returns a value, and `main` uses it three different ways. Press **Run**. Then change line 2 to `print(n * n)` instead of `return n * n` and run again: every use breaks in its own way.
steps:
  - label: "return hands the value back"
    lines: "1-2"
    note: "`return n * n` works out the square and gives it to whoever called. Nothing is shown; the function's job is only to work it out."
  - label: "Straight into another call"
    lines: "6"
    note: "`square(3)` becomes `9`, and `print` shows it. The call sits where a value would."
  - label: "Stored under a name"
    lines: "7-8"
    note: "The returned value goes into `area`, which the f-string uses a line later."
  - label: "Into another square"
    lines: "9"
    note: "The inner call becomes `4`, which the outer call squares to `16`. Returned values can be passed anywhere a value can."
