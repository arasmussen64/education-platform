id: py.return-values
kind: topic
status: ready
title: "Return values"
summary: "Hand a result back with return, tell it apart from print, and know what None is."
prerequisites: [py.defining-functions]
estimated_minutes: 40
rev: 1
objectives:
  - "Hand a value back to the caller with `return`, and tell that apart from showing it with `print`."
  - "Know that a function without `return` gives back `None`, and recognize `None` when it turns up."
  - "Use a returned value: store it, pass it into another call, combine it, or test it in an `if`."
