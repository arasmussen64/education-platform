id: predict-return-ends
type: predict_output
rev: 1
prompt: |
  What does this program print? Two lines. Remember what `return` does to the rest of the function.
code: |
  def sign(n):
      if n < 0:
          return "negative"
      return "not negative"
      print("this line never runs")


  print(sign(-3))
  print(sign(0))
expected_output: |
  negative
  not negative
explanation: |
  For −3 the `if` is `True`, so the function returns `"negative"` at once. For 0 the `if` is `False`, so Python reaches `return "not negative"`. Either way the function ends at a `return`, so the last line of the body never runs. Each call becomes the returned text, which `print` shows.
skills: [use-result]
