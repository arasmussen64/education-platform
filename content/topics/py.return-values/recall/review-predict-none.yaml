id: review-predict-none
type: predict_output
rev: 1
prompt: |
  What does this program print? Two lines. The function works the sum out but does nothing more with it.
code: |
  def add(a, b):
      total = a + b


  answer = add(2, 3)
  print(answer)
  print(type(answer))
expected_output: |
  None
  <class 'NoneType'>
explanation: |
  `add` stores the sum in `total` and then ends, without a `return`. So the call gives back `None`, which has its own type, `NoneType`. The sum was worked out and thrown away; `return total` would hand it back.
