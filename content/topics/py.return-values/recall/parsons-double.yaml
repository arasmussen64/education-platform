id: parsons-double
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `9`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'def double(n):'
  - '    return n * 2'
  - 'result = double(4)'
  - 'print(result + 1)'
distractors:
  - '    print(n * 2)'
explanation: |
  `return` hands the value back to whoever called the function, so `result` is 8 and the print shows 9. If the function printed instead of returning, `result` would be `None`, and `None + 1` is a `TypeError`.
skills: [return-vs-print, use-result]
