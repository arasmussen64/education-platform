id: review-mcq-return-stops
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  def first_even(limit):
      for n in range(1, limit):
          if n % 2 == 0:
              return n
      return 0

  print(first_even(10))
  ```
choices:
  - '`2`'
  - '`0`'
  - '`2`, `4`, `6` and `8` on separate lines'
  - '`10`'
answer: 0
explanation: |
  The loop tries 1, then 2. At 2 the `if` is `True` and `return n` ends the loop *and* the function at once, handing back 2. The `return 0` after the loop only happens when no even number was found. A `return` inside a loop stops everything, which is what a search wants.
skills: [use-result]
