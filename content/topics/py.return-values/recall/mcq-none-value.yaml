id: mcq-none-value
type: mcq
rev: 1
prompt: |
  Which of these functions gives back `None` when called as `f(5)`?
choices:
  - |
    ```python
    def f(n):
        return n
    ```
  - |
    ```python
    def f(n):
        print(n)
    ```
  - |
    ```python
    def f(n):
        return n + 0
    ```
  - |
    ```python
    def f(n):
        return str(n)
    ```
answer: 1
explanation: |
  Only the function with `print(n)` has no `return`. It shows `5` on the screen, and the call itself gives back `None`. `return n` and `return n + 0` both give back `5`, and `return str(n)` gives back `"5"`. Showing and handing back are different things.
