id: mcq-none-value
type: mcq
rev: 1
prompt: |
  Which of these functions gives back `None` when called as `f(5)`?
choices:
  - |
    ```python
    def f(n):
        return n
    ```
  - |
    ```python
    def f(n):
        print(n)
    ```
  - |
    ```python
    def f(n):
        return n + 0
    ```
  - |
    ```python
    def f(n):
        return str(n)
    ```
answer: 1
explanation: |
  Only the second function has no `return`. It shows `5` on the screen, and the call itself gives back `None`. The others return `5`, `5` and `"5"` respectively. Showing and handing back are different things.
skills: [none]
