id: mcq-print-vs-return
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  def double(n):
      print(n * 2)

  result = double(4)
  print(result)
  ```
choices:
  - '`8` then `8`'
  - '`8` then `None`'
  - '`None` then `8`'
  - '`8` only'
answer: 1
explanation: |
  The call `double(4)` prints `8` from inside the function. But `double` has no `return`, so the call gives back `None`, which is what `result` holds; the second `print` shows it. To get `8` into `result`, the function needs `return n * 2`.
skills: [return-vs-print, none]
