id: parsons-descent-loop
type: parsons
rev: 2
prompt: |
  Put the lines in order to run ten steps of gradient descent on `x² + 3y²` from `(4, 2)` with a learning rate of 0.1, printing `[0.429 0.   ]`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'p = np.array([4.0, 2.0])'
  - 'for step in range(10):'
  - '    grad = np.array([2 * p[0], 6 * p[1]])'
  - '    p = p - 0.1 * grad'
  - 'print(np.round(p, 3))'
distractors:
  - '    p = p + 0.1 * grad'
explanation: |
  Every step works out the gradient where the point is now, `[2x, 6y]`, and then moves **against** it: `p - rate * grad`. Each step multiplies `x` by `1 - 0.1 * 2 = 0.8` and `y` by `1 - 0.1 * 6 = 0.4`, so after ten steps `x` is `4 * 0.8 ** 10 = 0.429` and `y` has all but vanished. The decoy steps with the gradient, uphill, and the point runs away from the bottom.
skills: [loop]
