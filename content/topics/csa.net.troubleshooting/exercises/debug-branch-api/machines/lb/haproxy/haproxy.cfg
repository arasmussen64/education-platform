global
    log stdout format raw local0
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 10s
    timeout server 5s

# The shop's API, at its service address.
frontend api
    bind 10.20.0.80:80
    default_backend apis

# Three API servers in turn, each checked every 2 seconds. Connections to
# them leave from lb's own address, 10.20.0.79.
backend apis
    balance roundrobin
    source 10.20.0.79
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server api1 10.20.0.11:80 check
    server api2 10.20.0.12:80 check
    server api3 10.20.0.13:80 check
