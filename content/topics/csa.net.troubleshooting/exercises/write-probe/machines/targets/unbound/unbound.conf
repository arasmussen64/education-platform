# targets' name server, for the office: it answers for shop.test itself
# (static: any name it doesn't hold gets "no such name" at once) and looks
# nothing else up.
server:
  interface: 0.0.0.0
  access-control: 10.50.0.0/24 allow
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  chroot: ""
  username: "unbound"
  pidfile: "/run/unbound.pid"
  module-config: "iterator"
  local-zone: "test." nodefault
  local-zone: "shop.test." static
  local-data: "www.shop.test. 30 IN A 10.50.0.10"
  use-syslog: no
  logfile: ""
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
