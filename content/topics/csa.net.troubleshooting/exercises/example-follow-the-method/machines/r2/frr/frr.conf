frr version 8.4.4
frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
router bgp 65020
 bgp router-id 10.0.12.2
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 10.0.12.1 remote-as 65010
 neighbor 10.0.12.1 timers connect 5
 neighbor 10.0.23.2 remote-as 65030
 neighbor 10.0.23.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.20.0.0/24
  neighbor 10.0.12.1 route-map FROM-OFFICE in
  neighbor 10.0.12.1 route-map TO-OFFICE out
  neighbor 10.0.23.2 route-map FROM-CLOUD in
  neighbor 10.0.23.2 route-map TO-CLOUD out
 exit-address-family
exit
!
ip prefix-list OFFICE seq 5 permit 10.10.0.0/24
ip prefix-list DC seq 5 permit 10.20.0.0/24
ip prefix-list CLOUD seq 5 permit 10.30.0.0/24
!
route-map FROM-OFFICE permit 10
 match ip address prefix-list OFFICE
exit
!
route-map TO-OFFICE permit 10
 match ip address prefix-list DC
exit
!
route-map TO-OFFICE permit 20
 match ip address prefix-list CLOUD
exit
!
route-map FROM-CLOUD permit 10
 match ip address prefix-list CLOUD
exit
!
route-map TO-CLOUD permit 10
 match ip address prefix-list DC
exit
!
route-map TO-CLOUD permit 20
 match ip address prefix-list OFFICE
exit
!
