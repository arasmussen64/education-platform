# The office's resolver. It looks names up for the office's machines, and
# asks the shop's own name server, ns1, about shop.test.
server:
  interface: 0.0.0.0
  access-control: 10.10.0.0/24 allow
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  chroot: ""
  username: "unbound"
  pidfile: "/run/unbound.pid"
  module-config: "iterator"
  # Hands out a name's addresses in a new order each time.
  rrset-roundrobin: yes
  local-zone: "test." nodefault
  domain-insecure: "shop.test"
  use-syslog: no
  logfile: ""
  verbosity: 1
  # Forget a name server that was slow at boot after a minute (the default
  # is 15 minutes).
  infra-host-ttl: 60
stub-zone:
  name: "shop.test"
  stub-addr: 10.20.0.53
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
