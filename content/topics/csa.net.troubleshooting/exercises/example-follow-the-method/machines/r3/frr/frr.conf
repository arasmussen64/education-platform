frr version 8.4.4
frr defaults traditional
hostname r3
log syslog informational
service integrated-vtysh-config
!
router bgp 65030
 bgp router-id 10.0.23.2
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 10.0.23.1 remote-as 65020
 neighbor 10.0.23.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.30.0.0/24
  neighbor 10.0.23.1 route-map FROM-SHOP in
  neighbor 10.0.23.1 route-map TO-SHOP out
 exit-address-family
exit
!
ip prefix-list SHOP seq 5 permit 10.10.0.0/24
ip prefix-list SHOP seq 10 permit 10.20.0.0/24
ip prefix-list CLOUD seq 5 permit 10.30.0.0/24
!
route-map FROM-SHOP permit 10
 match ip address prefix-list SHOP
exit
!
route-map TO-SHOP permit 10
 match ip address prefix-list CLOUD
exit
!
