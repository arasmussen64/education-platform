// ns1: the shop's name server for shop.test. Authoritative only.
options {
  directory "/var/cache/bind";
  recursion no;
  allow-query { any; };
  allow-transfer { none; };
  listen-on { any; };
  listen-on-v6 { none; };
  dnssec-validation no;
  pid-file "/run/named/named.pid";
};
logging {
  channel default { stderr; severity info; print-time no; print-category yes; };
  category default { default; };
};
zone "shop.test" {
  type primary;
  file "/etc/bind/db.shop.test";
};
