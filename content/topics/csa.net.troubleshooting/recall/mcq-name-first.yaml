id: mcq-name-first
type: mcq
rev: 1
prompt: |
  The method asks you to write down the cause and the line of evidence that shows it before you change anything. Why?
choices:
  - "If you can't, you're guessing, and a lucky guess hides the real cause"
  - "Auditors ask for the cause of every incident before any change is made"
  - "Writing it down first makes the change itself go faster and safer"
  - "The ticket system won't close a ticket until a cause has been chosen"
answer: 0
explanation: |
  Naming the cause and its evidence is the test of whether you have found it. If you can't fill in the two lines, you have a suspect, not a cause, and the next step is another split, not a change. A change made on a guess may make the symptom go away for a while (or for a reason you don't know), and then the real cause stays, and comes back.

  It's not paperwork: no auditor or ticket system is what makes it worth doing, and it doesn't speed the change up. What it buys is knowing that the change you are about to make is aimed at the cause.
skills: [prove-and-record]
