id: mcq-provider-ticket
type: mcq
rev: 1
prompt: |
  Your evidence shows loss starting on the provider's link between their last router and yours. Which ticket gives their support desk what it needs to act?
choices:
  - "The time window, both ends' addresses, mtr from each end, the first lossy hop"
  - "A screenshot of the shop's error page, and how many customers have seen it"
  - "The servers' CPU and memory graphs, to show that the shop's side is healthy"
  - "A note that the internet has been slow since Tuesday, with the office's address"
answer: 0
explanation: |
  A provider's desk can act on evidence it can check against its own network: when (the window, with the time zone), between which addresses, mtr reports from both ends (so the return path is covered), and where the loss starts: the last clean hop and the first lossy one, the link between them being theirs. Add what you've ruled out and a capture if you have one.

  An error page and a customer count show the impact, not where the fault is. The servers' graphs are the shop's side. And "slow since Tuesday" with one address gives them nothing to look at.
skills: [prove-and-record]
