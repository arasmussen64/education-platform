id: mcq-return-path
type: mcq
rev: 1
prompt: |
  An mtr from the office to a cloud server shows 0% loss at hops 1 to 4, and 8% from hop 5, a router in the provider's network, to the end. Before the ticket goes to the provider, you also run mtr from the cloud server back toward the office. Why?
choices:
  - "Each answer comes back by a return path that a report from one end can't show"
  - "A report from the office only shows the routers that the office itself owns"
  - "The provider reads only reports that were made inside its own network"
  - "One report can't show loss under 10%, so a second is needed to confirm it"
answer: 0
explanation: |
  An mtr report counts the probes whose answers came back. The probe goes out by the path you see; the answer comes back by the return path, which can be a different way through the networks and appears nowhere in the report. So "8% from hop 5" may be loss on the way out after hop 4, or on the way back from hop 5 onward. The report from the other end shows the path in the other direction, and the two together say where the loss is. Akamai's guide, and every provider's desk, asks for both.

  The office's report does show the provider's routers (hop 5 is one), a report from anywhere is evidence, and mtr shows loss of any size: 8% is right there.
skills: [locate-on-the-path]
