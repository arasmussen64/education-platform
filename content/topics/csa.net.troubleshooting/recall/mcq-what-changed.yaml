id: mcq-what-changed
type: mcq
rev: 1
prompt: |
  The API's errors started at 14:02. The day's change log has three entries: a firewall rule changed on the edge router at 13:58; the site's certificate renewed at 09:00; and the API itself was last deployed a week ago. Where do you look first?
choices:
  - "The firewall change at 13:58, the last change before the errors began"
  - "The certificate renewed at 09:00, since certificates cause most outages"
  - "The deploy a week ago, since a change to the code is the riskiest kind"
  - "The busiest of the API's servers, since load causes most of its errors"
answer: 0
explanation: |
  "What changed?" is the first suspect, and the change closest before the symptom comes first: four minutes before the errors began, on a box every request crosses. The SRE chapter's "what touched it last" is this question. Check it first and it's cleared or confirmed in minutes.

  The certificate renewed five hours before anything failed, and the deploy a week before: neither lines up with 14:02 (though either can be next if the firewall is cleared). "Most outages are X" and "the busiest server" are guesses that ignore the evidence of time.
skills: [scope-it]
