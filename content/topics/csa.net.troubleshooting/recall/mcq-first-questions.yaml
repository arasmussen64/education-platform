id: mcq-first-questions
type: mcq
rev: 1
prompt: |
  A ticket arrives with one line: "the shop is down". Before you touch anything, which step narrows the problem the most?
choices:
  - "Ask from where it fails, for which name or address, and since when"
  - "Restart the web server first, since a restart clears most stuck states"
  - "Check the web server's CPU and memory graphs for the last hour"
  - "Open the shop's port on the firewall to rule the firewall out"
answer: 0
explanation: |
  "Down" says nothing yet about who is affected or what fails. From where (one office, or everyone), to what (the name, or the address too), and since when (and so what changed just before) turn it into a symptom you can split: three questions that cost nothing and cut the suspects by half or more each.

  The other three are guesses. A restart may hide the cause and throws away the evidence a stuck process holds; the graphs look where it's easy to look (Gregg's streetlight); and opening the firewall "to see" is a random change that can add a hole and teaches nothing even when the symptom goes.
skills: [scope-it]
