id: mcq-symptom-grid
type: mcq
rev: 1
prompt: |
  The shop's three services, each tried from each of the shop's three places at the same time:

  | From | the website | the API | a name lookup |
  | --- | --- | --- | --- |
  | the office | fails | works | works |
  | the data centre | works | works | works |
  | the cloud | works | works | works |

  Where is the fault most likely to be?
choices:
  - "On the office's path to the website, or a rule that applies to the office alone"
  - "On the website's server, which has stopped answering the requests sent to it"
  - "In the name servers, which give out an address for the website that's out of date"
  - "In the API, whose errors make the website's pages fail when the office loads them"
answer: 0
explanation: |
  Read the grid by its shape. A whole failing column would point at that destination, since it fails for everyone; a whole failing row at that source, since everything fails from there. Here one cell fails: one source to one destination. So look between them, or at something that treats that source differently: a firewall rule, a route or a security group that names the office's addresses.

  The website's server answers the data centre and the cloud, so it isn't down. Name lookups work from the office, and the other places get the site with the same names. And the API works from the office too.
skills: [scope-it]
