id: monitor-by-address
type: predict_shell
rev: 1
# Captured on 2026-11-12 (the lab's clock, UTC) in the worked example's
# network on the network-lab base, before its fix: twenty consecutive
# lines of /var/log/shop-monitor.log, around 25 seconds in which the
# office's resolver (unbound@resolver) was stopped. Pinned in Git Bash
# (gawk) and with Ubuntu 24.04's mawk 1.3.4.
prompt: |
  `monitor.log` is twenty lines of the office monitor's log (captured in the worked example's network): the time, the page, the addresses curl tried in order (`-` when it had none to try), the HTTP status, the seconds and curl's exit status. The command gives each load its first address and what it was (failed, slow or ok), and counts each pair. `LC_ALL=C` makes `sort` order by the characters' codes, the same on every machine. What is printed?
files:
  monitor.log: |
    22:10:31 /health  10.20.0.11              200    0.001 exit=0
    22:10:36 /catalog 10.30.0.11,10.20.0.11   200    2.502 exit=0
    22:10:38 /health  10.20.0.11              200    0.001 exit=0
    22:10:42 /catalog 10.30.0.11,10.20.0.11   200    2.503 exit=0
    22:10:44 /health  10.20.0.11              200    0.002 exit=0
    22:10:46 /catalog 10.20.0.11              200    0.003 exit=0
    22:10:51 /health  10.30.0.11,10.20.0.11   200    2.502 exit=0
    22:10:53 /catalog -                       000    0.000 exit=6
    22:10:55 /health  -                       000    0.000 exit=6
    22:11:02 /catalog -                       000    5.002 exit=28
    22:11:04 /health  -                       000    0.000 exit=6
    22:11:06 /catalog -                       000    0.000 exit=6
    22:11:13 /health  -                       000    5.002 exit=28
    22:11:15 /catalog 10.20.0.11              200    0.002 exit=0
    22:11:20 /health  10.30.0.11,10.20.0.11   200    2.502 exit=0
    22:11:22 /catalog 10.20.0.11              200    0.010 exit=0
    22:11:26 /health  10.30.0.11,10.20.0.11   200    2.504 exit=0
    22:11:31 /catalog 10.30.0.11,10.20.0.11   200    2.502 exit=0
    22:11:33 /health  10.20.0.11              200    0.003 exit=0
    22:11:37 /catalog 10.30.0.11,10.20.0.11   200    2.504 exit=0
command: |
  awk '{split($3, tried, ","); r = ($NF != "exit=0") ? "fail" : ($5 >= 1 ? "slow" : "ok"); print tried[1], r}' monitor.log | LC_ALL=C sort | uniq -c | awk '{print $2, $3, $1}'
expected_output: |
  - fail 6
  10.20.0.11 ok 7
  10.30.0.11 slow 7
explanation: |
  `split($3, tried, ",")` cuts the addresses column at its commas, so `tried[1]` is the first address tried. A load whose last field isn't `exit=0` failed; one that worked in 1 second or more was slow; the rest were ok. `sort | uniq -c` counts each pair, and the last awk puts the count at the end. In the codes' order `-` comes before the digits.

  Read it as the breakdown: each value holds one kind of trouble. Every failure has `-` for its address: curl never had an address to try. Exit status 6 is "no address for the name", and the two 28s took 5 seconds with nothing tried, so they ran out of time looking the name up: naming, for about 20 seconds from 22:10:53 (the office's resolver was stopped). Every slow load tried 10.30.0.11 first, at 2.5 seconds each: the stale route of the worked example, a different fault. Two faults, two values; fixing one would leave the other.
skills: [measure-intermittent, read-logs-and-counters]
