id: mcq-two-changes
type: mcq
rev: 1
prompt: |
  Calls from the branch fail now and then. You suspect both a firewall rule and a route, change both at once, and the failures stop. What have you lost?
choices:
  - "Which change fixed it, and whether the other was needed at all"
  - "Nothing at all: the failures have stopped and the users are happy"
  - "The change log, which can only record one change for each ticket"
  - "The way back, since two changes can't be undone at the same time"
answer: 0
explanation: |
  One change at a time is what lets the result mean something. With two, you know only that one of them, or both together, made the symptom go. The other change may have been harmless, may have opened something it shouldn't (a firewall rule widened "to be sure"), or may break something else next week, and the incident note can't name the cause. If a fault that comes and goes happened to stop by itself, neither change did anything.

  "It works" is the trap: the failures were intermittent, so stopping for a while proves little (the lesson's arithmetic of clean runs). Change logs and rollbacks handle two changes fine; what's lost is the knowledge.
skills: [prove-and-record]
