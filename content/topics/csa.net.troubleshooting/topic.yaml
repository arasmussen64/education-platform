skills:
  - id: scope-it
    description: "The scoping questions (from where, to what, by name or address, IPv4 or IPv6, small or large, always or sometimes, since when, what changed); a grid of sources against destinations and what its pattern points at; what changed as the first suspect"
  - id: split-the-suspects
    description: "Choosing the test that rules out about half of what's left, and reading each result as ruling in or out: by name against by address, ping against TCP against HTTP, small against large, another source, another path or source port; curl's exit status as a verdict on the layer"
  - id: locate-on-the-path
    description: "mtr's report read correctly (loss that carries on to the end is real and starts on the link before; loss at one hop alone is rate limiting; the return path is invisible, so test both ways); captures at two points, and on every outgoing path where traffic is shared; ip route get hop by hop"
  - id: measure-intermittent
    description: "Sampling over time; the failure rate; breaking the failures down by a variable until one value holds them all; the arithmetic: a share of servers or paths, two independent faults together, a page of several connections, and the chance a fault survives a clean run"
  - id: read-logs-and-counters
    description: "Which record holds the evidence for which fault: a service's journal, nginx's error log and its error numbers (110, 111, 113), HAProxy's log line (server, timers, status, termination state), BIND's transfer lines, nftables counters, ip -s link, conntrack -S; lining timestamps up with the symptom"
  - id: prove-and-record
    description: "Naming the cause and its evidence before changing anything; one change at a time; proving the fix with enough samples and that nothing else broke (still a firewall, still there after a reboot); the incident note; the provider ticket"
