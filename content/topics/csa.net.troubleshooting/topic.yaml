id: csa.net.troubleshooting
kind: topic
status: ready
title: Network troubleshooting
summary: "Find a network fault with a method rather than by guessing: scope the symptom, split the suspects with tests that each rule out half, locate the fault on the path with mtr, captures and the routers' own answers (and see through a hop that only rate-limits its replies), measure a fault that comes and goes and break its failures down until one value holds them all, read what the systems recorded, name the cause and its evidence before changing anything, prove the fix with enough samples, and hand a provider's fault over with the evidence their desk needs."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2,
# 3.7 and 5, topic 38) and its designer's brief (csa.net.troubleshooting.md).
# Through csa.net.load-balancing (HAProxy, its show stat and log, health
# checks that pass while users fail; through http-semantics and http-tls,
# nginx as a proxy and its upstream, 502 and 504; through dns and transport,
# resolvers, name servers and secondaries, TCP's timers, refused against
# dropped) and csa.net.ipsec (through csa.net.bgp and csa.net.routing:
# longest-prefix match, ip route get, FRR's show ip route, ECMP and sysctl,
# BGP and the looking glass; through csa.net.cidr and csa.net.layers: ARP,
# ip neigh and gratuitous ARP, ICMP's types, MTU and PMTUD, the network
# labs' machines, on and name@machine services) every Module 3 topic comes
# before this one, and its casebook reads their debugs' evidence as recorded
# cases. Module 1 taught ip, ss, dig, curl, nc, traceroute and mtr by name,
# tcpdump, nftables and its counters, conntrack, journalctl, the USE method
# and scripts with set -euo pipefail, awk and sort | uniq -c.
prerequisites: [csa.net.load-balancing, csa.net.ipsec]
# Worked out: the lesson about 30 minutes (about 3,900 words with its
# tables, at 130 a minute), the assigned reading about 54 (the SRE chapter's
# "Theory", "In Practice" and "Case Study", about 4,400 words, 34; Gregg's
# three sections, about 330 words, 3; Akamai's "Read MTR Reports", "Analyze
# MTR Reports" and "ICMP Rate Limiting", about 2,100 words counting their
# reports, 13; Everything curl's one page, about 500 words, 4), 18 quick
# items at 1.5 each 27, then the worked example 35, the casebook 30, the
# probe 30, the build 45, the debug 50 and the explain 20: about 321. The plan's 300
# is kept (MODULE-3-BRIEF.md, topic 38, with the designer's trim (a): the
# SRE chapter's core sections only and five multiple-choice items moved to
# the review pool), as Module 3's other long topics kept theirs: the
# lesson's tables of curl's exit codes, the records and the clouds' tools
# stand in for pages under More resources that aren't assigned.
estimated_minutes: 300
rev: 1
objectives:
  - "Turn \"it doesn't work\" into a precise symptom: from where, to what, by name or by address, which address family, which size, always or sometimes, since when, and what changed; read a grid of sources against destinations for what its pattern points at."
  - "Choose the test that rules out about half of the remaining suspects and read each result as ruling in or out: by name against by address, ping against TCP against HTTP, small against large, another source, another path; read curl's exit status as a verdict on the layer."
  - "Find where on a path traffic stops: read mtr's report without being fooled by a hop that limits its answers or by a return path you can't see, capture at two points, ask each router with ip route get, and prove which of two equal paths a connection took with captures, not with a prediction."
  - "Measure a fault that comes and goes: sample it over time, work out its failure rate, break the failures down by a variable until one value holds them all, and work out how many clean samples it takes to believe a fix."
  - "Read what the systems recorded and line it up with the symptom: a service's journal, nginx's error log and its error numbers, HAProxy's log line, a name server's transfer messages, a firewall rule's counter, conntrack's and an interface's counters."
  - "Name the cause and its evidence before changing anything, change one thing, prove the fix with enough samples and that nothing else broke, write the incident note, and for a fault on a provider's side, write the ticket their desk needs; say how each cloud's tools stand in for the captures you can't take there."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - Google's SRE book, chapter 12, "Effective Troubleshooting" (Chris
#   Jones): sections Theory (with Common Pitfalls, four of them), In
#   Practice (Problem Report, Triage, Examine, Diagnose with "Simplify and
#   reduce", where it describes dividing and conquering and bisection, and
#   "What touched it last", Test and Treat), Negative Results Are Magic,
#   Cure, Case Study, Making Troubleshooting Easier, Conclusion; about 6,000
#   words; footer "Licensed under CC BY-NC-ND 4.0":
#   https://sre.google/sre-book/effective-troubleshooting/
# - Brendan Gregg, "Performance Analysis Methodology" (last updated
#   23-Jan-2025, no licence stated): the anti-methods Blame-Someone-Else,
#   Streetlight, Drunk Man, Random Change, Passive Benchmarking, Traffic
#   Light; the Problem Statement Method's six questions, among them "What
#   has changed recently?" and "Does the problem affect other people or
#   applications (or is it just you)?"; Process of Elimination:
#   https://www.brendangregg.com/methodology.html
# - Akamai's (formerly Linode's) "Diagnosing Network Issues with MTR"
#   (updated 2018-05-10, "© 2003-2026 Akamai Technologies. All rights
#   reserved."): rate limiting of ICMP by some providers can show loss where
#   there is none; loss at a hop with 0.0% at the next is likely rate
#   limiting; "always trust the reports from later hops"; "collect MTR
#   reports in both directions"; --report sends 10 packets unless
#   --report-cycles says otherwise. Its line that "small amounts of loss in
#   the neighborhood of 10%" are "no cause for real concern" is not repeated
#   and the lesson corrects it (TCP's throughput falls with the square root
#   of the loss rate, csa.net.congestion):
#   https://www.akamai.com/cloud/guides/diagnosing-network-issues-with-mtr/
# - Linux's IP sysctls: icmp_ratelimit, default 1000, "0 to disable any
#   limiting, otherwise the minimal space between responses in
#   milliseconds", for ICMP types in icmp_ratemask, default 6168:
#   Destination Unreachable, Source Quench, Time Exceeded and Parameter
#   Problem (so echo replies aren't limited); fib_multipath_hash_policy 0
#   layer 3 (default), 1 layer 4:
#   https://docs.kernel.org/networking/ip-sysctl.html
# - curl's manual: exit codes 6 "Could not resolve host", 7 "Failed to
#   connect to host", 22 (HTTP 400 or above, only with --fail), 28
#   "Operation timeout", 35 "SSL connect error", 52 "The server did not
#   reply anything", 56 "Failure in receiving network data", 60 "Peer
#   certificate cannot be authenticated with known CA certificates";
#   remote_ip "The remote IP address of the most recently done connection";
#   time_total "The total time, in seconds, that the full operation lasted":
#   https://curl.se/docs/manpage.html
# - Everything curl, "How libcurl connects": "When libcurl has multiple
#   addresses left to try to connect to, and there is more than 600
#   millisecond left", it allows half the remaining time for the attempt:
#   https://everything.curl.dev/transfers/conn/how.html
# - Tried in this topic's labs (curl 8.5.0 on the network-lab base,
#   2026-11-12): a refused port gave exit 7 at once; a dropped address,
#   exit 28 at the time limit; a name that doesn't exist, exit 6; a server
#   that hangs up, exit 52; with two addresses for a name, the first silent,
#   the monitor's curl --max-time 5 took 2.50 s and reached the second; with
#   the second refused, 2.5 s and exit 7; with the first refused and the
#   second silent, 5.0 s and exit 28.
# - Linux error numbers (Python's errno on the lab image): 110 ETIMEDOUT
#   "Connection timed out", 111 ECONNREFUSED "Connection refused", 113
#   EHOSTUNREACH "No route to host".
# - nginx's proxy_connect_timeout: "Defines a timeout for establishing a
#   connection with a proxied server", default 60s ("© F5, Inc. All rights
#   reserved."): https://nginx.org/en/docs/http/ngx_http_proxy_module.html
# - HAProxy 2.8's httplog format "%ci:%cp [%tr] %ft %b/%s
#   %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc ..."; timers in milliseconds,
#   -1 for an event that never happened (Tc: the connection never
#   established; Tr: the response headers never seen); termination state:
#   first letter C client, S server (aborted or refused), c client-side
#   timeout, s server-side timeout, P proxy, R resource, - normal; second R
#   request, Q queue, C connect, H headers, D data, - normal; SC the server
#   refused, sC timeout connect, sH timeout server before the headers, sQ
#   too long in the queue (configuration manual, sections 8.2.3, 8.4 and
#   8.5): https://docs.haproxy.org/2.8/configuration.html
# - AWS: Reachability Analyzer "is a configuration analysis tool", gives the
#   blocking component, and "You are charged per analysis run"
#   (https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html);
#   VPC Flow Logs "capture information about the IP traffic going to and
#   from network interfaces", collected "outside of the path of your network
#   traffic" (https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html);
#   Traffic Mirroring copies "network traffic from an elastic network
#   interface", from the listed (Nitro) instance types, charged "on an
#   hourly basis for each active traffic mirror session"
#   (https://docs.aws.amazon.com/vpc/latest/mirroring/what-is-traffic-mirroring.html).
# - Azure Network Watcher (ms.date 2026-02-25): seven diagnostic tools, IP
#   flow verify, NSG diagnostics, next hop, effective security rules,
#   connection troubleshoot, packet capture (on a VM or a scale set) and VPN
#   troubleshoot; connection monitor; flow logs for a network security group
#   or a virtual network; NSG flow logs "retire on September 30, 2027" and no
#   new ones can be made:
#   https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
# - Google Cloud (CC BY 4.0 by each page's footer): Connectivity Tests
#   "simulates the expected forwarding path of a packet", and "For some
#   connectivity scenarios" also performs live data plane analysis with test
#   packets (last updated 2026-11-12,
#   https://docs.cloud.google.com/network-intelligence-center/docs/connectivity-tests/concepts/overview);
#   Packet Mirroring "clones the traffic of specified instances" and
#   "captures all traffic and packet data, including payloads and headers",
#   charged for the data it processes (last updated 2026-11-11,
#   https://docs.cloud.google.com/vpc/docs/packet-mirroring); VPC Flow Logs
#   (last updated 2026-11-10, https://docs.cloud.google.com/vpc/docs/flow-logs).
#
# Linked, never copied. Licences, each read on 2026-11-12: the SRE book is
# CC BY-NC-ND 4.0 (the page's footer); Gregg's page states no licence (link
# only); Akamai's guide is all rights reserved (its footer); Everything curl
# is CC BY 4.0 (its repository's README and LICENSE, curl/everything-curl);
# curl's manual is part of curl's source, under the curl licence (the
