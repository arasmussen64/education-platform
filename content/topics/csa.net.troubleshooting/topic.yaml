prove:
  build: build-outage-report
  debug: debug-branch-api
  explain:
    prompt: |
      A colleague says: "When the network acts up, I restart the router, and if that doesn't work I open the firewall for a minute to see if it helps." The network now has an intermittent problem: about one request in five fails, at no particular time. Explain, in your own words: what's wrong with your colleague's approach; how you would scope the problem and what you'd measure first; which tests would split the possible causes, and what each result would rule out; how you would find where on the path the trouble is, including what can make a hop in `mtr` look lossy when it isn't; which records you'd read; how many clean results you'd want before believing a fix, and why; what you would do if the cause turned out to be in your provider's network; and one way finding a fault in a cloud differs from finding it on your own routers.
    rubric:
      - id: anti-methods
        required: true
        description: "Restarting and opening the firewall are guesses (random change): they can hide the cause, add a security hole and teach nothing, and a restart also throws away evidence (caches, counters, the state of a stuck process)."
      - id: scope
        required: true
        description: "From where, to what, by name or address, which address family and size, always or sometimes and how often, since when, what changed; and for an intermittent fault, sample it over time before guessing."
      - id: split
        required: true
        description: "Tests that halve the suspects, with what each rules out: by address against by name (naming), ping against TCP against HTTP (the layer), small against large (MTU), another source or path; curl's exit status as a quick verdict (6 naming, 7 refused or unreachable, 28 silence)."
      - id: locate
        required: true
        description: "mtr or traceroute: loss that carries on to the end is real and starts on the link before the first lossy hop; loss at one hop that later hops don't show is that router limiting its answers; the return path is invisible, so test from both ends; captures at two points, and on each path where traffic is shared."
      - id: intermittent
        required: true
        description: "Break the failures down by a variable that was logged (address, source port or path, server, size, time) until one value holds them all; one in five suggests one bad member of five, or two faults together."
      - id: prove
        required: true
        description: "Name the cause and its evidence first; change one thing; take enough clean samples (a one-in-five fault survives ten clean tries about 11% of the time, 0.8 to the power 10, so ten isn't enough; twenty leaves about 1%); check nothing else broke and the fix lasts."
      - id: provider
        required: true
        description: "Prove it and hand it over: the time window, the addresses, mtr from both ends, the last clean hop and the first lossy one, and what has been ruled out."
      - id: clouds
        required: false
        description: "In a cloud you can't log in to the provider's routers: AWS's Reachability Analyzer, Azure's Network Watcher (IP flow verify, next hop) or Google's Connectivity Tests analyse the configuration, and flow logs and traffic or packet mirroring stand in for captures."
    model_answer: |
      Restarting the router and opening the firewall "to see" are guesses. If the fault goes away, I don't know why, it may come back, and opening the firewall may leave a hole. A restart also wipes the evidence: the neighbour table, the counters, the state of whatever was stuck. And one in five, at no particular time, may well survive a restart and look "fixed" for a while by chance.

      First I'd scope it: from where it fails (everyone, one office, one network), to what (a name, or the address too), IPv4 or IPv6, small or large requests, how often, since when, and what changed just before. Then I'd measure: a loop of requests every few seconds that logs the time, the address curl tried, the status, the seconds and curl's exit status.

      With a log, I'd split. The same request by address instead of by name rules naming in or out. Ping against `nc -z` against curl finds the layer that fails, and curl's exit status says it too: 6 is no address, 7 a refusal or an unreachable, 28 silence. Small against large catches an MTU problem; another source or another path tells the path from the destination. Then I'd break the failures down by every variable I logged. If they all share one address, one server or one source port, that's my lead: one in five sounds like one bad member of five, or two faults together.

      To locate it, mtr from the source: loss that starts at a hop and carries on to the end is real, and starts on the link before it. Loss at one hop that the next doesn't show is that router limiting how often it answers probes, not losing traffic. The answers come back by a return path I can't see, so I'd ask for an mtr from the other end too. Captures at two points show where a packet stops. Then the records: the service's journal, nginx's error log (110 timed out, 111 refused), the balancer's log line, the firewall's counters, conntrack's.

      Before changing anything I'd write down the cause and the line that shows it. Then one change, and enough clean samples: if the fault was still there, ten clean tries would happen 0.8¹⁰, about 11% of the time, so I'd want twenty or more (about 1%), and I'd check nothing else broke and that the fix survives a reboot.

      If the loss starts in the provider's network, I can't fix it: I'd send them the time window, the addresses, mtr reports from both ends, the last clean hop and the first lossy one, and what I'd ruled out. In a cloud I can't log in to their routers or capture on them, so I'd use the provider's tools instead: Reachability Analyzer, Network Watcher or Connectivity Tests to check the configuration, and flow logs or traffic mirroring in place of a capture.
