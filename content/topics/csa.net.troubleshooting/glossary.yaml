# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: symptom grid
  definition: Sources down the side, destinations across the top, each cell works, fails or sometimes. A failing column points at a destination, a row at a source, one cell at the path between.
- term: hypothesis
  definition: A guess at a fault's cause that a test can confirm or rule out.
- term: rate limiting
  definition: Capping how often something is done. Routers limit the ICMP answers they send, so in mtr a hop can look lossy while it forwards every packet.
- term: failure rate
  definition: The share of sampled requests that failed. Measured before a fix, it says how many clean samples in a row it takes to trust the fix afterwards.
- term: red herring
  definition: Evidence that looks like the cause and isn't, such as a rate-limited hop in mtr. The test is to change only that thing and see whether the failures follow it.
- term: incident note
  definition: The five-line record of a fault once it's fixed, its symptom, cause, evidence, fix, and how the fix was proved.
- term: provider ticket
  definition: A report to the provider whose network holds a fault, with the time window and time zone, both ends' addresses, mtr from each end, the first lossy hop and what's ruled out.
