- term: simple return
  definition: "The change in a price as a share of where it started: `new / old - 1`. A list of n prices gives n − 1 of them."
- term: growth factor
  definition: "1 plus a return: what an amount is multiplied by over one period. +10% is 1.10 and −10% is 0.90; several periods multiply their growth factors."
- term: log return
  definition: "The natural log of a growth factor, `math.log(new / old)`. Log returns over several periods add up to the log return of the whole stretch."
- term: annualized return
  aliases: [CAGR, compound annual growth rate]
  definition: "The steady yearly rate that gives the same total growth: `(1 + total) ** (1 / years) - 1`. For yearly returns it equals their geometric mean."
- term: arithmetic mean
  definition: "The ordinary average, the sum over the count. For returns, the best single guess for one period ahead; it overstates growth over many periods."
- term: geometric mean
  definition: "For returns, the steady rate per period that gives the same growth: multiply the growth factors, take the nth root, subtract 1. Never more than the arithmetic mean."
