prove:
  build: build-returns-and-annualized
  debug: debug-performance-report
  explain:
    prompt: |
      A fund's report says: "Average annual return over the last two years: +10%." The fund returned +60% in the first year and −40% in the second. In your own words, with numbers for $10,000 invested at the start: what is the money worth after two years, how did the report get +10%, and what yearly figure honestly describes what happened to the money? When is the report's kind of average the right number to use?
    rubric:
      - id: chain
        required: true
        description: "$10,000 becomes $16,000, then $9,600: the growth factors multiply, 1.6 × 0.6 = 0.96, a 4% loss over two years."
      - id: arithmetic
        required: true
        description: "The +10% is the arithmetic mean, (60% − 40%) / 2, which adds returns as if they didn't compound."
      - id: geometric
        required: true
        description: "The honest yearly figure is the geometric mean (the annualized return): 0.96 to the power 1/2, minus 1, about −2.0% a year."
      - id: when-arithmetic
        required: true
        description: "The arithmetic mean is the right number for one period ahead (an expectation for a single year); the geometric mean for growth over many years."
      - id: swings
        required: false
        description: "Says the bigger the swings, the bigger the gap between the two averages."
    model_answer: |
      The first year turns $10,000 into $16,000, a 60% gain. The second year takes 40% of that: $16,000 × 0.6 = $9,600. So after two years the investor has lost $400, 4%. Returns multiply: the growth factors are 1.6 and 0.6, and 1.6 × 0.6 = 0.96. The report got +10% by taking the arithmetic mean, (60% + (−40%)) ÷ 2, which treats the returns as if they added. But a 40% loss is taken from a bigger amount than the 60% gain was, so adding them overstates what happened. The honest yearly figure is the geometric mean, the annualized return: the steady rate that gives the same end. 0.96 to the power 1/2 is 0.9798, so it's about −2.0% a year: $10,000 × 0.9798 × 0.9798 is $9,600. The arithmetic mean still has a use: if every year is drawn from the same spread of outcomes, it's the best guess for one year's return. For what happens to money over several years, the geometric mean is the one to report, and the more the returns swing, the further apart the two averages are.
