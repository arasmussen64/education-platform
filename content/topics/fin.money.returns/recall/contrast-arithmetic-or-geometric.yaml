id: contrast-arithmetic-or-geometric
type: mcq
rev: 1
prompt: |
  A fund's yearly returns over four years were +30%, −20%, +25% and −10%. You want one yearly figure for what happened to money left in it for all four years. Which average do you use, and why?
choices:
  - 'The arithmetic mean, 6.25%: it counts every year equally'
  - 'The geometric mean, about 4.0%: returns compound, so multiply'
  - 'The arithmetic mean, 6.25%: the geometric one ignores losses'
  - 'The geometric mean, 17%: what the four years grew money by'
answer: 1
explanation: |
  Money left in for four years is multiplied by each year's growth factor: 1.30 × 0.80 × 1.25 × 0.90 = 1.17. The steady rate that gives 1.17 over four years is 1.17 to the power 1/4, minus 1, about 4.0%. That's the geometric mean, the annualized return. The arithmetic mean, (30 − 20 + 25 − 10) ÷ 4 = 6.25%, counts every year equally too, but it adds returns that really multiply, so it overstates growth; it's the right figure for one year's expectation. The geometric mean doesn't ignore losses: they're in the product. And 17% is the total growth over all four years, not a yearly figure.
skills: [means]
