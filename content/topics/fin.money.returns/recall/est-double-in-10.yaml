id: est-double-in-10
type: estimate
rev: 1
prompt: |
  A house bought for $200000 sold for $400000 exactly 10 years later. What was its annualized return, as a percentage? Within 0.01 of a percentage point.
unit: "%"
answer: 7.18
tolerance: { absolute: 0.01 }
given: { bought: 200000, sold: 400000, years: 10 }
working: ((sold / bought) ** (1 / years) - 1) * 100
mistakes:
  - id: divided
    value: 10
    working: (sold / bought - 1) * 100 / years
    why: "That shares the 100% out evenly over 10 years. Returns compound, so the steady rate that doubles money in 10 years is lower."
  - id: rule-of-72
    value: 7.2
    working: 72 / years
    why: "The rule of 72 gives about 7.2%, a good estimate in your head. The exact rate is 2 to the power 1/10, minus 1."
amounts: made-up
explanation: |
  The house doubled, a growth factor of 2. The steady yearly factor that doubles in 10 years is 2 to the power 1/10, 1.0718: 7.18% a year. The rule of 72's 7.2% is close, which is why it's a handy rule.
skills: [annualize]
