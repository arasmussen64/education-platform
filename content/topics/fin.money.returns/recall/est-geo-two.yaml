id: est-geo-two
type: estimate
rev: 1
prompt: |
  A technology fund returned +40% one year and −30% the next. Its arithmetic mean return is +5%. What is its geometric mean return, as a percentage (a fall is negative)? Within 0.01 of a percentage point.
unit: "%"
answer: -1.01
tolerance: { absolute: 0.01 }
given: { rise: 40, fall: 30, arithmetic: 5 }
working: ((1 + rise / 100) * (1 - fall / 100)) ** (1 / 2) * 100 - 100
mistakes:
  - id: arithmetic
    value: 5
    working: arithmetic
    why: "That's the arithmetic mean, given in the question. The geometric mean multiplies the growth factors: 1.40 × 0.70 = 0.98."
  - id: total
    value: -2
    working: ((1 + rise / 100) * (1 - fall / 100) - 1) * 100
    why: "That's the total over the two years. The geometric mean is the yearly rate: the square root of 0.98, minus 1."
explanation: |
  1.40 × 0.70 = 0.98: the money shrank 2% over two years, though the arithmetic mean says +5% a year. The square root of 0.98 is 0.9899, a geometric mean of −1.01% a year. The bigger the swings, the bigger the gap between the two averages.
skills: [means, compound-returns]
