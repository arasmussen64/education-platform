id: est-chain-three
type: estimate
rev: 1
prompt: |
  A fund returned +10% in its first year, −20% in its second and +15% in its third. What was its total return over the three years, as a percentage? Within 0.01 of a percentage point.
unit: "%"
answer: 1.2
tolerance: { absolute: 0.01 }
given: { first: 10, second: 20, third: 15 }
working: ((1 + first / 100) * (1 - second / 100) * (1 + third / 100) - 1) * 100
mistakes:
  - id: added
    value: 5
    working: first - second + third
    why: "That adds the returns. Each year multiplies what the last one left: 1.10 × 0.80 × 1.15."
  - id: averaged
    value: 1.67
    working: (first - second + third) / 3
    why: "That's the arithmetic mean of the three returns, not the total. Multiply the growth factors to get the total."
explanation: |
  Multiply the growth factors: 1.10 × 0.80 × 1.15 = 1.012, a total return of 1.2% over three years. Adding the returns says 5%, almost four points too much.
skills: [compound-returns]
