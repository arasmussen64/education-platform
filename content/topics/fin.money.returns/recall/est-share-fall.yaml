id: est-share-fall
type: estimate
rev: 1
prompt: |
  A fund's price was $250 at the start of a year and $200 at the end. What was its simple return for the year, as a percentage (a fall is negative)? Exactly.
unit: "%"
answer: -20
tolerance: { absolute: 0 }
given: { start: 250, end: 200 }
working: (end / start - 1) * 100
mistakes:
  - id: wrong-base
    value: -25
    working: (end - start) / end * 100
    why: "That measures the $50 fall against the end price. A return is measured from the start, $250: 50 ÷ 250 is 20%."
  - id: upside-down
    value: 25
    working: (start / end - 1) * 100
    why: "That divides the start by the end, the wrong way round, and turns a fall into a rise."
amounts: made-up
explanation: |
  200 ÷ 250 = 0.80, so the return is −20%. Notice that getting back from $200 to $250 takes a rise of 25%, not 20%: a fall and the rise that undoes it are measured from different amounts.
skills: [simple-returns]
