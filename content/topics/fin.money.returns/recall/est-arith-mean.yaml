id: est-arith-mean
type: estimate
rev: 1
prompt: |
  An index fund's returns in three years were +20%, −10% and +5%. What is the arithmetic mean of those returns, as a percentage? Exactly.
unit: "%"
answer: 5
tolerance: { absolute: 0 }
given: { year_one: 20, year_two: 10, year_three: 5 }
working: (year_one - year_two + year_three) / 3
mistakes:
  - id: summed
    value: 15
    working: year_one - year_two + year_three
    why: "That's the sum of the returns. The arithmetic mean divides it by the count, 3."
  - id: geometric
    value: 4.28
    working: ((1 + year_one / 100) * (1 - year_two / 100) * (1 + year_three / 100)) ** (1 / 3) * 100 - 100
    why: "That's the geometric mean, the steady growth rate. The question asks for the arithmetic mean: the sum over the count."
explanation: |
  (20 − 10 + 5) ÷ 3 = 5%. That's the right figure for one year's expectation if each year is drawn alike. For what happened to the money over the three years, the geometric mean, about 4.28%, is the one: 1.20 × 0.90 × 1.05 = 1.134, and its cube root is 1.0428.
skills: [means]
