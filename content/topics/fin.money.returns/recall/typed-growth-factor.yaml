id: typed-growth-factor
type: typed
rev: 1
prompt: |
  A return of +8% multiplies what you hold by 1.08, and a return of −8% by 0.92. What is the name for that number, 1 plus the return? Type the two-word term.
kind: text
answers:
  - "growth factor"
mistakes:
  - id: log-return
    answers: ["log return"]
    why: "A log return is the natural log of that number, `math.log(1.08)`. The number itself, 1 plus the return, is the growth factor."
  - id: simple-return
    answers: ["simple return"]
    why: "The simple return is the 0.08 itself. Adding 1 gives the growth factor, which is what chains by multiplying."
explanation: |
  The **growth factor** is `1 + r`, what one period multiplies an amount by. Several periods chain by multiplying growth factors: +8% then −8% is 1.08 × 0.92 = 0.9936, a small loss, not zero.
skills: [compound-returns]
