id: mcq-simple-return
type: mcq
rev: 1
prompt: |
  A share's price went from $80 to $100 in a year. Which line computes its simple return for the year, as a decimal?
choices:
  - '`100 / 80 - 1`'
  - '`80 / 100 - 1`'
  - '`(100 - 80) / 100`'
  - '`100 - 80`'
answer: 0
explanation: |
  A return is measured from where it started: the new price over the old, minus 1, so `100 / 80 - 1` is 0.25, 25%. `80 / 100 - 1` divides the wrong way round and gives −0.20, a fall, for a price that rose. `(100 - 80) / 100` measures the $20 against the end price, 20%. `100 - 80` is the gain in dollars, $20, not a return.
skills: [simple-returns]
