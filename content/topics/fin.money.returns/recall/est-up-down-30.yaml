id: est-up-down-30
type: estimate
rev: 1
prompt: |
  A share rose 30% on a takeover rumour, then fell 30% when the rumour proved false. What is its total return over the two moves, as a percentage? Exactly.
unit: "%"
answer: -9
tolerance: { absolute: 0 }
given: { rise: 30, fall: 30 }
working: ((1 + rise / 100) * (1 - fall / 100) - 1) * 100
mistakes:
  - id: added
    value: 0
    working: rise - fall
    why: "+30 and −30 add to 0, but returns multiply: 1.30 × 0.70 = 0.91."
  - id: fall-only
    value: -30
    working: 0 - fall
    why: "The rise isn't simply undone: the 30% fall is taken from the higher price. 1.30 × 0.70 = 0.91, a 9% loss."
explanation: |
  1.30 × 0.70 = 0.91, so the share ends 9% below where it started. Up and down by the same percentage always loses: (1 + r)(1 − r) is 1 − r², which is less than 1. Here r² is 0.09.
skills: [compound-returns]
