id: predict-log-returns
type: predict_output
rev: 1
prompt: |
  Log returns of three prices, added up, and the log return of the whole stretch. What does the program print?
code: |
  import math

  prices = [50.0, 60.0, 45.0]
  total = 0.0
  for i in range(1, len(prices)):
      total = total + math.log(prices[i] / prices[i - 1])
  print(round(total, 4))
  print(round(math.log(prices[-1] / prices[0]), 4))
  print(round(math.exp(total) - 1, 4))
expected_output: |
  -0.1054
  -0.1054
  -0.1
explanation: |
  The log returns are `log(60 / 50)` and `log(45 / 60)`, about 0.1823 and −0.2877, and they add to −0.1054. That's the log of `45 / 50`, the whole stretch, because the log of a product is the sum of the logs and the growth factors multiply. `math.exp` undoes the log: `exp(-0.1054)` is 0.90, so the simple total return is −0.1, a 10% fall.
skills: [compound-returns]
