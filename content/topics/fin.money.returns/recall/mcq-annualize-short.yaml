id: mcq-annualize-short
type: mcq
rev: 1
prompt: |
  A new fund rose 5% in its first month. Its advert says "79.6% annualized return". Where does the 79.6% come from, and what does it tell you?
choices:
  - 'It is 1.05 to the power 12, minus 1: one month compounded, which says little'
  - 'It is the fund manager’s forecast for the year, made from that month'
  - 'It is 5% times 12 months with compounding, so a year is very likely to match'
  - 'It is the fund’s total return over its first year, published early'
answer: 0
explanation: |
  `1.05 ** 12 - 1` is 0.796: the 79.6% assumes the first month repeats eleven more times, compounding. Annualizing puts returns of different lengths on one footing, but a single month carries almost no information about a year: next month could just as easily be −5%. No year has passed, so it isn't a year's return, and the arithmetic makes no forecast. 5% times 12 without compounding would be 60%.
skills: [annualize]
