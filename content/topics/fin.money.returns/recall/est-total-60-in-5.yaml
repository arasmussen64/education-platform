id: est-total-60-in-5
type: estimate
rev: 1
prompt: |
  A pension fund grew 60% in total over 5 years. What steady yearly return would give the same growth, its annualized return, as a percentage? Within 0.01 of a percentage point.
unit: "%"
answer: 9.86
tolerance: { absolute: 0.01 }
given: { total: 60, years: 5 }
working: ((1 + total / 100) ** (1 / years) - 1) * 100
mistakes:
  - id: divided
    value: 12
    working: total / years
    why: "That shares the 60% out evenly, as if returns added. 12% a year compounds to 76% in five years; the rate that compounds to 60% is lower."
  - id: forgot-minus-one
    value: 109.86
    working: (1 + total / 100) ** (1 / years) * 100
    why: "That's the yearly growth factor, 1.0986, as a percentage. Take away 1 to get the return."
explanation: |
  The total growth factor is 1.60. The steady yearly factor that gives it over 5 years is the fifth root, 1.60 to the power 1/5 = 1.0986, so the annualized return is 9.86% a year. Check: 1.0986 to the power 5 is 1.60.
skills: [annualize]
