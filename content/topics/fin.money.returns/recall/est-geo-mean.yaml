id: est-geo-mean
type: estimate
rev: 1
prompt: |
  A small-company fund returned +25%, −20% and +10% in three years. What is the geometric mean of those returns, the steady yearly rate that gives the same growth, as a percentage? Within 0.01 of a percentage point.
unit: "%"
answer: 3.23
tolerance: { absolute: 0.01 }
given: { year_one: 25, year_two: 20, year_three: 10 }
working: ((1 + year_one / 100) * (1 - year_two / 100) * (1 + year_three / 100)) ** (1 / 3) * 100 - 100
mistakes:
  - id: arithmetic
    value: 5
    working: (year_one - year_two + year_three) / 3
    why: "That's the arithmetic mean. The geometric mean multiplies the growth factors and takes the cube root."
  - id: total
    value: 10
    working: ((1 + year_one / 100) * (1 - year_two / 100) * (1 + year_three / 100) - 1) * 100
    why: "That's the total over the three years. The geometric mean is the yearly rate: take the cube root of 1.10 first."
explanation: |
  1.25 × 0.80 × 1.10 = 1.10, so the money grew 10% in three years. The cube root of 1.10 is 1.0323: 3.23% a year. The arithmetic mean, 5%, is higher, as it always is when returns differ.
skills: [means]
