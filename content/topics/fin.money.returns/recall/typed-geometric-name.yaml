id: typed-geometric-name
type: typed
rev: 1
prompt: |
  Multiply some yearly growth factors together, take the nth root for n years, and subtract 1. Which average of the returns does that give? Type its name.
kind: text
answers:
  - "geometric mean"
  - "geometric average"
  - "annualized return"
  - "CAGR"
  - "compound annual growth rate"
mistakes:
  - id: arithmetic
    answers: ["arithmetic mean", "arithmetic average", "mean", "average"]
    why: "The arithmetic mean adds the returns and divides by their count. Multiplying growth factors and taking the root is the geometric mean."
  - id: median
    answers: ["median"]
    why: "The median is the middle value when the returns are sorted. Multiplying growth factors and taking the root is the geometric mean."
explanation: |
  That's the **geometric mean** of the returns, the steady yearly rate that gives the same growth, which is also the annualized return (sometimes called CAGR, compound annual growth rate). It's never larger than the arithmetic mean, and it's the one that describes what happened to money over several years.
skills: [means]
