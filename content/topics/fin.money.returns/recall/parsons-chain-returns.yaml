id: parsons-chain-returns
type: parsons
rev: 1
prompt: |
  A fund returned +50% one year and −50% the next. Put the lines in order so the program chains the two returns and prints the total return over both years, `-25.00%`. One line is a decoy that doesn't belong.
lines:
  - 'growth = 1.0'
  - 'for r in [0.50, -0.50]:'
  - '    growth = growth * (1 + r)'
  - 'print(f"{growth - 1:.2%}")'
distractors:
  - '    growth = growth + r'
explanation: |
  Each year multiplies what you have by its growth factor, `1 + r`: 1.5, then 0.5. Starting from 1.0, the loop leaves `growth` at 0.75, and taking away 1 gives the total return, −25%. The decoy adds the returns, which gives 1.0 and a total of 0%: the "average return of zero" that hides the loss.
skills: [compound-returns]
