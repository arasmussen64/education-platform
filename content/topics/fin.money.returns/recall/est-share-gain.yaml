id: est-share-gain
type: estimate
rev: 1
prompt: |
  You bought a share for $40, and a year later it's worth $46. What was its simple return for the year, as a percentage? Exactly.
unit: "%"
answer: 15
tolerance: { absolute: 0 }
given: { bought: 40, now: 46 }
working: (now / bought - 1) * 100
mistakes:
  - id: dollars
    value: 6
    working: now - bought
    why: "That's the gain in dollars, $6. A return is the gain as a share of what you paid: 6 ÷ 40."
  - id: wrong-base
    value: 13.04
    working: (now - bought) / now * 100
    why: "That measures the $6 against the end price. A return is measured from where it started, $40."
amounts: made-up
explanation: |
  46 ÷ 40 = 1.15, so the simple return is 15%: the $6 gain is 15% of the $40 you paid.
skills: [simple-returns]
