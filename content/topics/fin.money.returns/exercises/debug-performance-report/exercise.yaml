stage: debug
rev: 1
title: "A fund's performance report"
prompt: |
  This report reads a fund's year-end prices (made up) and prints each year's return, the fund's growth per year (the steady yearly rate that gives the same total), and then checks itself: $10,000 grown at that rate for the same number of years should end exactly where $10,000 in the fund itself did.

  ```
  Year 1: 15.00%
  Year 2: -25.00%
  Year 3: 25.00%
  Year 4: 8.99%
  Growth per year: 4.11%
  $10,000 at that rate for 4 years: $11,750.00
  $10,000 in the fund itself: $11,750.00
  ```

  Instead, it shows a loss in years when the price rose, and its last two lines don't agree. It has two bugs. Run it, fix what you find, and run it again.
skills: [simple-returns, means]
