id: fill-two-means
stage: fill_in
rev: 1
title: "Two averages of the same returns"
prompt: |
  A fund returned +30%, −20% and +10% in three years. Replace each `...` with an operator so the program prints the arithmetic mean of the returns and their geometric mean:

  ```
  Arithmetic mean: 6.67%
  Geometric mean: 4.59%
  ```

  Every `...` stands for an operator, so until each one is replaced, Python can't run the program at all and shows a syntax error.
hints:
  - "Chaining multiplies growth factors: inside the loop, `growth` is multiplied by `1 + r`."
  - "The arithmetic mean is the sum over the count."
  - "The geometric mean takes the nth root of the growth: a power of 1 over the count."
skills: [means, compound-returns]
