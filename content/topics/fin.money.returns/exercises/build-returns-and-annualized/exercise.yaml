id: build-returns-and-annualized
stage: build
rev: 1
title: "Returns and the annualized return"
prompt: |
  Starting from a blank editor, write two functions:

  - `simple_returns(prices)` returns the list of simple returns (decimals) from a list of prices, one for each price after the first.
  - `annualized_return(prices, periods_per_year)` returns the annualized return (a decimal) of a list of prices taken `periods_per_year` times a year: 1 for yearly prices, 12 for monthly, 4 for quarterly.

  Then, for a fund's made-up year-end prices `[100, 112, 95, 118, 130]`, print each year's return and the annualized return, to two decimal places as percentages:

  ```
  Year 1: 12.00%
  Year 2: -15.18%
  Year 3: 24.21%
  Year 4: 10.17%
  Annualized: 6.78%
  ```

  Both functions return unrounded numbers. The checks call them with other prices and frequencies too.
skills: [simple-returns, annualize]
