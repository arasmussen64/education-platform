id: example-returns-from-prices
stage: worked_example
rev: 1
title: "Returns from a list of prices"
prompt: |
  A share's price at the end of four years, made up: $40.00, $44.00, $39.60 and $43.56. This program turns the prices into yearly returns, chains them, and checks the total two ways. Press **Run**, then read how each part works.
steps:
  - label: "One return for each price after the first"
    lines: "1-4"
    note: "Four prices give three returns. `range(1, len(prices))` counts 1, 2, 3, so `prices[i - 1]` is always the price before `prices[i]`. Each return is the later price over the earlier, minus 1."
  - label: "Chaining: multiply the growth factors"
    lines: "5-7"
    note: "Each year multiplies what you hold by `1 + r`, its growth factor. Starting from 1.0, three years leave `growth` at 1.10 × 0.90 × 1.10 = 1.089."
  - label: "The yearly returns"
    lines: "8-9"
    note: "+10%, −10%, +10%. `:.2%` multiplies by 100 and adds the percent sign."
  - label: "Two ways to the same total"
    lines: "10-11"
    note: "The chained growth, minus 1, is 8.90%, and so is the last price over the first, minus 1. The prices in between don't change the total; they only show the path."
  - label: "Adding returns is wrong"
    lines: "12"
    note: "The three returns add to 10%, not 8.90%: +10% then −10% loses 1% (1.10 × 0.90 = 0.99), because the fall is taken from a bigger amount than the rise was."
