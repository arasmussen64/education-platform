id: write-annualize-monthly
stage: write
rev: 1
title: "Six months, annualized"
prompt: |
  A fund's monthly returns for its first six months are in the starter (made up). Write a function `annualize_monthly(monthly)` that takes a list of monthly returns (decimals) and returns the annualized return: chain the growth factors, then raise the result to the power 12 over the number of months, and subtract 1. Then print the total for the six months and the annualized return:

  ```
  Six months: 4.49%
  Annualized: 9.19%
  ```

  The function returns an unrounded decimal, and works for any number of months. Keep the `monthly` list as it is: the checks call your function with other lists too.
hints:
  - "Start `growth` at 1.0 and multiply it by `1 + r` for each monthly return."
  - "Twelve months is a year, so a list of `len(monthly)` months is `len(monthly) / 12` years: raise the growth to `12 / len(monthly)`."
  - "The first line is the six months' chained growth, minus 1. A small helper function that chains a list of returns can serve both lines."
skills: [annualize, compound-returns]
