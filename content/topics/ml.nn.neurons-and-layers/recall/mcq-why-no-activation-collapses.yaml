id: mcq-why-no-activation-collapses
type: mcq
rev: 1
prompt: |
  Why does a network of two dense layers with nothing between them learn no more than a single dense layer?
choices:
  - 'Because the second layer overwrites the first layer''s weights during training'
  - 'Because without an activation the gradients are zero and nothing trains'
  - 'Because `(X @ W1 + b1) @ W2 + b2` is `X @ (W1 @ W2) + (b1 @ W2 + b2)`: a linear function of a linear function is linear'
  - 'Because two layers have more parameters than the data can support, so they overfit before they can learn anything the first layer alone couldn''t'
answer: 2
explanation: |
  Multiply out the two layers and one matrix and one bias appear; the worked example checks that the stacked pair and the merged layer give the same outputs to the last bit. The pair has more numbers but can express exactly the same functions, all of them linear. The activation is what breaks this: ReLU between the layers bends the function, and then the composition can do what one layer can't. Gradients don't vanish without an activation; they just lead to a linear fit.
skills: [nonlinearity]
