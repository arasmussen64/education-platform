id: debug-a-network-that-will-not-run
stage: debug
rev: 2
title: "A network that won't run"
prompt: |
  A `[3, 4, 2]` network of the module's classes (a dense layer, a ReLU, another dense layer) on a batch of two rows. It should print:

  ```
  output shape: (2, 2)
  hidden values are never negative: True | some are zero: True
  ```

  Instead it stops inside `forward` with `ValueError: matmul: Input operand 1 has a mismatch in its core dimension 0`. It has two bugs, and the second shows only once the first is fixed. Run it, read the traceback, fix what you find and run it again; then run the checks, which try the classes on other sizes.
hints:
  - "Read the traceback from the bottom: which line failed, and which two arrays were being multiplied there? Print their shapes."
  - "A batch `X` is `(rows, inputs)`, so `X @ W` needs `W` to be `(inputs, outputs)`, as the docstring of `Dense` says. What shape does `__init__` build it in?"
  - "Build `W` as `(n_in, n_out)`."
  - "Once it runs, the hidden layer has negative values in it. A ReLU zeroes what is below zero and keeps what is above: which NumPy function does that, `np.minimum(X, 0.0)` or `np.maximum(X, 0.0)`?"
skills: [compose, nonlinearity]
