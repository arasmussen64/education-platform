- term: namespace
  definition: "A kernel feature that gives a group of processes its own copy of a global resource, such as process numbers, network interfaces, mounts or the hostname."
- term: overlayfs
  aliases: [overlay filesystem]
  definition: "The kernel filesystem that stacks read-only image layers under one writable layer and shows them as one tree, a container's root."
- term: whiteout
  definition: "A marker in a container's writable layer that hides a file from the read-only layers below, which is how overlayfs shows a file as deleted."
- term: bind mount
  definition: "A folder from the host mounted into a container, so what's written there lives on the host and outlives the container."
- term: capability
  aliases: [capabilities]
  definition: "One piece of root's powers, which Linux lets programs hold separately. Container runtimes drop most of them, so root inside a container can do less."
- term: seccomp
  definition: "A kernel filter listing which system calls a process may make. Container runtimes apply one so a container can't call the riskiest ones."
- term: Dockerfile
  definition: "A text file of instructions, one to a line, that Docker follows from the top to build an image: `FROM` names the starting image, and `RUN`, `COPY` and `ADD` each add a layer of files."
- term: tmpfs
  definition: "A filesystem that keeps its files in memory. Unmounting it throws them away, which makes it a handy place for a container's writable layer."
