id: mcq-layer-cache
type: mcq
rev: 2
prompt: |
  A Dockerfile copies the whole project with `COPY . .` and then runs `npm install`. Every build takes four minutes even when only one source file changed. What's wrong?
choices:
  - "`COPY` layers are never cached; `ADD . .` would be, because `ADD` keeps a checksum of the files it copies"
  - "`RUN` layers are never cached, because Docker can't know what a command will download this time"
  - "The cache is kept per image tag, so each build needs the same tag as the last one to reuse its layers"
  - "Any source edit changes the `COPY . .` layer, so the install after it can't be reused from the cache"
answer: 3
explanation: |
  The build cache works instruction by instruction, top to bottom, and stops reusing at the first one whose inputs differ. Putting the code copy before the dependency install makes the expensive step come after something that changes with every edit. Copy `package.json` and the lockfile first, run `npm install`, then `COPY . .`: the install layer is then reused until the dependencies change, which turns the four minutes into seconds for most builds and makes the dependency layer shareable across versions of the app.

  `COPY` and `ADD` are cached alike, both by a checksum of the files. `RUN` is cached too: Docker reuses its layer whenever the command text and everything before it are unchanged, without asking what the command would download. And the cache is found by comparing instructions and files, not by tag.
skills: [layers-overlay]
