id: mcq-volumes
type: mcq
rev: 2
prompt: |
  A PostgreSQL container has been running for a month. You upgrade it by removing the container and starting a new one from the newer image, and all the data is gone. Why, and what should have been done?
choices:
  - "The data was in the old image's layers, which the new image replaced; the old image should have been kept"
  - "The data was only in memory, because a container's root filesystem is read-only; it needed a larger `--memory`"
  - "The data was in the container's writable layer, deleted with it; its directory should have been a volume"
  - "The data is in the upper layer, kept under the old container's name; the new one needed the same `--name`"
answer: 2
explanation: |
  Every write a container makes goes to its upper layer, and the upper layer is part of the container, not the image. Remove the container and the layer is deleted; the next container starts from a clean one, whatever it is called. The data directory should have been a volume or a bind mount (`-v pgdata:/var/lib/postgresql/data`): a directory managed outside the layers, mounted into the container at a path, which persists until you delete it on purpose. Any stateful service in a container needs one, and the official database images document the path to mount.

  The image never held the data: its layers are read-only and a running container can't change them, so keeping the old image would bring nothing back. And the container's root filesystem is writable, through that upper layer, which is how the database could run for a month.
skills: [layers-overlay]
