id: mcq-volumes
type: mcq
rev: 2
prompt: |
  A PostgreSQL container has been running for a month. You upgrade it by removing the container and starting a new one from the newer image, and all the data is gone. Why, and what should have been done?
choices:
  - "The data was in the old image's layers, which the new image replaced; the old image should have been kept"
  - "The data was only in memory, because a container's root filesystem is read-only; it needed a larger `--memory`"
  - "The data belonged to the container you removed, so the new one started empty; it needed a named volume"
  - "The data is in the upper layer, kept under the old container's name; the new one needed the same `--name`"
answer: 2
explanation: |
  Without a volume you name, a container's data belongs to that one container, and a new container starts with none of it. In an image you built yourself, the database's writes go to the container's upper layer, the writable part that belongs to the container, not the image, and removing the container deletes it. The official `postgres` image declares its data directory a volume, so Docker gives each container an *anonymous* one there (a volume with a long random name). `docker rm` leaves that behind, and `docker volume ls` may still list it, but nothing connects it to the new container, which gets a fresh, empty one.

  Either way the fix is a volume with a name, or a bind mount (a host directory): `-v pgdata:/var/lib/postgresql/data` for the official image up to version 17, `-v pgdata:/var/lib/postgresql` from version 18. Every container started with it mounts the same data, which persists until you delete it on purpose. Any stateful service in a container needs one.

  The image never held the data: its layers are read-only and a running container can't change them, so keeping the old image would bring nothing back. The container's root filesystem is writable, through that upper layer, so the data was never only in memory. And a container's name is only a label: a new container with the old name still starts from a clean upper layer.
skills: [layers-overlay]
