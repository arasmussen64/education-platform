id: mcq-runtime-chain
type: mcq
rev: 2
prompt: |
  You type `docker run nginx`. Which programs are involved, in order, in getting nginx running as a container?
choices:
  - "`docker` asks `containerd`, which hands the work to `dockerd`, which calls `runc` to start nginx"
  - "`docker` asks `dockerd`, which hands the work to `containerd`, which calls `runc` to start nginx"
  - "`docker` asks `dockerd`, which hands the work to `runc`, which calls `containerd` to start nginx"
  - "`docker` asks `systemd` to start nginx as a service unit, and `dockerd` only reports on its state"
answer: 1
explanation: |
  Docker is layered, from the widest job to the narrowest. `dockerd` handles images, networks and the API, so it is what the `docker` command talks to. `containerd` manages container lifecycles (Kubernetes talks to it directly, with no Docker daemon at all). `runc` is the small tool at the end that does the actual Linux work from the earlier topics: it creates the namespaces and the cgroup, sets up the root filesystem and execs nginx. Then `runc` exits and a `containerd-shim` stays as the container's parent.

  That order can't be shuffled: `runc` starts one container and exits, so it can't be the one handing work on, and `containerd` sits below `dockerd`, not above it. systemd starts the Docker daemons at boot, but it isn't what starts nginx here: the container's nginx is not a service unit. Knowing the chain explains why `ps` shows `containerd-shim` as the parent of a container's PID 1, and why the Docker daemon can be restarted without stopping containers.
skills: [container-vs-vm]
