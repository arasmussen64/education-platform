id: mcq-root-in-container
type: mcq
rev: 1
prompt: |
  An image runs its application as root "because it's only root inside the container". Why is that a risk, and what reduces it?
choices:
  - "No risk: a container's root is a pretend user with no power"
  - "Without a user namespace, root in the container is the same UID 0 as the host's root, held back only by the capabilities and seccomp filter the runtime applies; a container escape or a bind-mounted host path then gives real root. Run as a non-root user in the image, drop capabilities, avoid `--privileged`, and use user namespaces where you can"
  - "The only risk is that logs will be owned by root"
  - "It's a risk because root can't use the network namespace"
answer: 1
explanation: |
  Namespaces change what a process sees, not who it is: UID 0 inside is UID 0 outside unless a user namespace remaps it. Runtimes drop most capabilities and filter system calls, which is what keeps a containerised root from loading kernel modules or rebooting the host, but a bind mount of `/var/run/docker.sock` or a kernel bug undoes that. A `USER` line in the Dockerfile, read-only root filesystems and no privileged mode are cheap, and rootless runtimes map root away entirely.
skills: [namespaces]
