id: csa.linux.containers
kind: topic
status: ready
title: "How containers work"
summary: "A container is a process on the host's kernel with its own view of the system: namespaces for isolation, cgroups for limits, and a root filesystem assembled from image layers by overlayfs. Why that makes it fast and dense, and why it is not a virtual machine."
prerequisites: [csa.linux.cpu, csa.linux.memory]
estimated_minutes: 90
rev: 1
objectives:
  - "Explain what a container is: a process tree on the host kernel, isolated by namespaces (pid, net, mnt, uts, ipc, user) and limited by a cgroup, with its own root filesystem."
  - "Explain how an image is built from read-only layers, how overlayfs stacks them under a writable layer when a container runs, and what happens to a container's writes when it's removed."
  - "Read a Dockerfile for the layers it creates and order its steps for caching."
  - "Say how a container differs from a virtual machine, in startup, density and isolation, and what root inside a container means for security."
