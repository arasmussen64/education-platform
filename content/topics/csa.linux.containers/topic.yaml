    url: https://jvns.ca/blog/2016/10/10/what-even-is-a-container/
    type: reading
    use: link
    license: "Copyright Julia Evans; linked, not copied"
  - title: "namespaces(7), from the Linux man-pages project: the namespace types and what each isolates"
    url: https://man7.org/linux/man-pages/man7/namespaces.7.html
    type: reading
    use: link
    license: "Linux man-pages project (free documentation; linked, not copied)"
  - title: "cgroups(7), from the Linux man-pages project (the overview and the v2 sections)"
    url: https://man7.org/linux/man-pages/man7/cgroups.7.html
    type: reading
    use: link
    license: "Linux man-pages project (free documentation; linked, not copied)"
  - title: "Understanding the image layers (Docker documentation)"
    url: https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/
    type: reading
    use: link
    license: "Apache-2.0 (Docker documentation)"
  - title: "Overlay Filesystem, from the Linux kernel documentation: lower, upper and merged directories"
    url: https://docs.kernel.org/filesystems/overlayfs.html
    type: reading
    use: link
    license: GPL-2.0
