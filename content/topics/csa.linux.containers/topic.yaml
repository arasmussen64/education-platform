prove:
  build: build-box
  debug: debug-leaky-box
  explain:
    prompt: |
      A colleague says "a container is just a lightweight VM". Explain, in your own words, what a container really is: what namespaces do and which ones matter; what cgroups add; how an image is built from layers and what overlayfs does with them when a container runs; where a container's writes go and what happens to them when the container is removed; and the real differences from a virtual machine, including what root inside a container means for security.
    rubric:
      - id: process-namespaces
        required: true
        description: "A container is an ordinary process tree on the host's kernel, given its own view of the system by namespaces: pid (its own PID 1 and numbering), net (its own interfaces and ports), mnt (its own mounts and root filesystem), uts (hostname), ipc, and optionally user (its root mapped to an unprivileged host user)."
      - id: cgroups
        required: true
        description: "A cgroup limits and accounts the container's CPU, memory and process count (cpu.max, memory.max, pids.max), so one container can't starve the host or the others."
      - id: layers
        required: true
        description: "An image is a stack of read-only layers, one per Dockerfile instruction that changes files (FROM's base, RUN, COPY, ADD); overlayfs mounts them as lowerdir under a writable upperdir and shows the merged result as the container's root; files are copied up on first write."
      - id: writes
        required: true
        description: "Writes go to the container's own upper layer, which is deleted with the container; the image is never changed; data that must survive goes in a volume or bind mount."
      - id: vs-vm
        required: true
        description: "A VM runs its own kernel on a hypervisor: stronger isolation, slower start, more memory per instance; a container shares the host kernel: starts in milliseconds, runs densely, but a kernel bug or a privileged container affects the host, and root in a container without user namespaces is root on the host, so run as a non-root user and drop capabilities."
    model_answer: |
      A container is not a small virtual machine; it's a normal process, or a tree of processes, running on the host's own kernel. What makes it feel like a separate machine is a set of namespaces, which give those processes their own view of the system. The pid namespace gives the container its own process numbers, with its main process as PID 1 inside, although the host sees the same process under some other PID. The network namespace gives it its own interfaces, IP address and ports, so two containers can both listen on 8080. The mount namespace gives it its own set of mounts, and so its own root filesystem. The uts namespace gives it its own hostname, ipc its own shared-memory objects, and a user namespace can map root inside the container to an ordinary user outside. A cgroup then limits what the container may consume: cpu.max caps its CPU, memory.max its memory, pids.max how many processes it may create, so one container can't take the host down. The root filesystem comes from an image, which is a stack of read-only layers: the base image's layers from FROM, then one more for each Dockerfile instruction that changes files, RUN, COPY and ADD, while instructions like WORKDIR and CMD only change metadata. When the container starts, overlayfs mounts those layers as the lower directories under a fresh, empty upper directory and presents the merged view as the container's root. Reading goes down through the layers until a file is found; the first time a file is written, it's copied up to the upper layer and changed there. So every write a container makes lands in its own upper layer, the image underneath never changes, and when the container is removed the upper layer goes with it, which is why anything that must survive, a database's files, uploads, goes in a volume or a bind mount from the host. The real differences from a virtual machine follow from the shared kernel. A VM boots its own kernel on a hypervisor, which takes seconds to start and costs hundreds of megabytes before the application runs, but gives strong isolation: a bug in the guest kernel stays in the guest. A container starts in milliseconds and dozens fit where a few VMs would, but it is only as isolated as the kernel's namespaces and cgroups make it: a kernel vulnerability affects every container on the host, and root inside a container is, without a user namespace, the same root as the host's, held back only by the capabilities and the seccomp filter the runtime applies. That's why images should run as a non-root user, why privileged containers are a last resort, and why multi-tenant platforms put a VM boundary around containers that don't trust each other.
