# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: GPU
  aliases: [graphics processing unit]
  definition: A processor with thousands of small arithmetic units that do the same sum on many numbers at once. Right for multiplying huge grids of numbers, no help for steps that wait on each other.
- term: CUDA
  definition: NVIDIA's software that lets an ordinary program hand its arithmetic to an NVIDIA GPU. "A CUDA GPU" means an NVIDIA card.
- term: Tensor Core
  definition: A unit on NVIDIA's cards that does one thing, multiplying grids of numbers, several times faster when each number takes fewer bytes.
- term: VRAM
  aliases: [GPU memory]
  definition: A GPU card's own memory, separate from the VM's. A model's weights must all fit in it at once; with no swap, too big is an out-of-memory error.
- term: quantisation
  aliases: [quantization]
  definition: Storing a model's weights in fewer bits, 8 or 4, so it fits a smaller card. The answers usually change a little, so they're checked again.
- term: MIG
  aliases: [Multi-Instance GPU]
  definition: NVIDIA's way of cutting a large card into up to seven smaller GPU instances, each with memory and compute of its own, so a fault stays inside one.
- term: time-slicing
  definition: 'Sharing a GPU by letting programs take turns on the whole card, with no walls between them: they share all its memory, and one that fills it takes the others down.'
