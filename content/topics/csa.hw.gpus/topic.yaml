prove:
  build: build-gpu-plan
  debug: debug-fit-check
  explain:
    prompt: |
      A team asks for "a GPU server". They want to serve a model with 7 billion parameters and, once a week, train a smaller one. Their trial server shows 20% GPU utilisation, and a second team would like to share the card. Explain, in your own words: why this work suits a GPU at all, and what CUDA cores and Tensor Cores each do; why you would ask about memory before speed, and how you would work out whether the model fits a card; what `nvidia-smi`'s utilisation figure does and doesn't tell you, and what 20% might mean; how you would choose an instance, and one way the three clouds differ; and how one card can be shared safely, and when a link between cards matters.
    rubric:
      - id: why-gpu
        required: true
        description: "A GPU has thousands of simple arithmetic units doing the same operation on many numbers at once, which suits multiplying large tables of numbers, what a model mostly does; CUDA cores do general arithmetic at any precision, Tensor Cores are specialised for multiplying grids (matrices) and are fastest at reduced precision (16 bits and below)."
      - id: memory-first
        required: true
        description: "All of a model's weights must be in the card's own memory at once, with no swap to fall back on: parameters × bytes each (7 billion at 2 bytes is 14 GB, about 13 GiB); fewer bits halve or quarter it; the sum is a floor, so a stated headroom is added; training needs several times the weights (about 4); if it doesn't fit it doesn't run."
      - id: utilisation
        required: true
        description: "GPU-Util is the share of time some program was running on the card, not the share of the card in use; 20% means the card mostly waits, and the host's numbers say for what: CPUs flat out preparing input, a disk at its limit, work arriving too small, or another program taking turns; near 100% with the host idle means the GPU itself is the limit."
      - id: choosing
        required: true
        description: "Pick a card whose memory holds the model with its headroom, then the number of cards, enough vCPUs to feed it and a local disk if the data is large, then compare the cost of the whole job rather than the hourly price; and one correct difference between the clouds (their families and cards, fractional cards, how card memory is stated in GiB or GB, no free GPUs)."
      - id: sharing
        required: true
        description: "MIG partitions a supported large card (A100, H100 and the like, not a T4 or L4) into up to seven instances with their own memory and fault isolation, in fixed profiles; time-slicing shares the whole card in turns with no memory or fault isolation, so one program running out of memory can take the other down."
      - id: multi-gpu
        required: false
        description: "A model larger than one card's memory is split over several, which then exchange data constantly and need a fast card-to-card link (NVLink); separate jobs on separate cards don't."
    model_answer: |
      A model is a very large table of numbers, and serving or training it is mostly multiplying inputs by those tables: millions of the same small sum, none waiting for another. A CPU has a few powerful cores that do one thing after another; a GPU has thousands of simple arithmetic units doing the same sum on different numbers at once, so it finishes that kind of work far sooner, and is no help for work done step by step. Its CUDA cores do any arithmetic at the precision asked for; its Tensor Cores only multiply grids of numbers, and do it several times faster in 16 bits or fewer.

      I'd ask about memory first, because every weight must be in the card's own memory at the same time, and a GPU has no swap: a model that doesn't fit stops with an out-of-memory error instead of running slowly. The sum is parameters times bytes each: 7 billion at 16 bits, 2 bytes, is 14 GB, about 13 GiB as nvidia-smi counts. That's the floor; the running model also needs room for its inputs and working numbers, so I'd add a stated headroom, say 25%, about 16.3 GiB, and compare that with the card's memory in GiB. Training keeps several copies of the weights, about four times their size, so the weekly training job needs its own sum.

      GPU-Util is the share of time some program was running on the card, not how much of the card it used. 20% means the card waits four fifths of the time, and the host shows for what: every CPU flat out means the input preparation can't keep up; CPUs waiting on a disk at its limit means the data should be on a local NVMe disk; everything idle means the work arrives too small and should be batched.

      To choose, I'd take the cards that hold the model with its headroom, then enough vCPUs to feed one, a local disk for the data, and compare the cost of the whole job, since a faster card can be cheaper. The clouds state card memory differently: AWS in GiB, Azure and Google in GB, so the same L4 is 22 on one and 24 on another.

      To share the card safely the second team needs a MIG partition on a card that supports it, such as an A100: each partition has its own memory and a crash stays inside it. Taking turns by time-slicing shares all the memory, so one team running out could take the other down. A link like NVLink only matters when one model is split across several cards.
