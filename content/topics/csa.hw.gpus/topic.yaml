id: csa.hw.gpus
kind: topic
status: ready
title: "GPU basics"
summary: "What a GPU is good at and what is inside one; why its memory decides before its speed; reading nvidia-smi and telling what a GPU is waiting for; choosing a GPU instance on three clouds; and sharing one card with MIG or by taking turns."
# Module 2's plan (docs/plans/cloud-module-2/MODULE-2-BRIEF.md, section 2):
# this topic stands on "Cores, memory and noisy neighbours" (vCPUs, instance
# tables, on-demand prices, regions, a month of 730 hours) and "Memory tiers
# and disks" (GB against GiB, local NVMe against network disks and their
# allowances, which is the disk that starves a GPU). Both stand on
# Hypervisors (host, guest, passthrough) and so on Checkpoint 1. The Module
# 1 topics it leans on are triage (mpstat, iostat, %iowait), shell and
# scripting.
prerequisites: [csa.hw.cores-memory, csa.hw.disks]
# Counted: the lesson and recap 25 (3,400 words, a wide table among them);
# the reading the lesson asks for 57 (the main resource 7, NVIDIA's
# background sections 4, Hugging Face's guide to its first code 5 and the
# estimator's tables 3, the nvidia-smi definitions 2, the MIG guide's
# introduction and concepts 13, the time-slicing section 3, Google's GPU
# page's four parts 8, five rows of AWS's table 5, Azure's NCasT4_v3 page 4,
# TensorFlow's three parts 3); 30 quick questions at 1.5 minutes, 45; the
# worked example 20; the fill-in 20; the write 25; the build 50; the debug
# 40; the explain 15. 297, rounded to 300.
estimated_minutes: 300
rev: 1
objectives:
  - "Say why a GPU is fast at some work and no help with other work, what CUDA, CUDA cores and Tensor Cores are, and what lower precision trades."
  - "Work out whether a model fits a card: parameters × bytes each, in GiB, plus the headroom the job needs, and how much more training needs than serving."
  - "Read `nvidia-smi`: the card, its memory in use and total, GPU-Util and the process table, and say what GPU-Util does and doesn't measure."
  - "From a GPU's utilisation and the host's CPU and disk numbers, say what is starving it, and what would help."
  - "Choose a GPU instance from dated tables of the three clouds: a card that holds the model, the number of cards, vCPUs to feed them, and the price of the whole job."
  - "Say how one card is shared: MIG partitions and their slice arithmetic, time-slicing and what it doesn't isolate, fractional cards, pass-through, and when NVLink matters."
# Facts, each read on 2026-11-11, with where:
# - CPU against GPU, CUDA first released in 2007: the main resource (NVIDIA
#   Blog, published 2009-12-16, updated 2023-04-26; about 900 words).
# - SMs, L2 cache and memory; an A100 has 108 SMs, a 40 MB L2 and 80 GB;
#   FP16 on Tensor Cores or CUDA cores; Tensor Cores since Volta, for matrix
#   multiply and accumulate:
#   https://docs.nvidia.com/deeplearning/performance/dl-performance-gpu-background/index.html
# - Lower precision needs less memory and runs faster on Tensor Cores; "up
#   to 3x overall speedup on the most arithmetically intense model
#   architectures"; FP16 16 bits against FP32's 32:
#   https://docs.nvidia.com/deeplearning/performance/mixed-precision-training/index.html
# - About 4 x X GB in float32, 2 x X GB in bfloat16/float16; inference
#   dominated by the weights under 1,024 tokens; Llama-2-70b 140 GB;
#   bigcode/octocoder (15.5 billion) measured 29.0 in 16 bits, 15.2 in 8
#   bits and 9.5 in 4 bits, its code dividing by 1,024 three times:
#   https://huggingface.co/docs/transformers/llm_tutorial_optimization
# - bert-base-cased: float32 418.18 MB to load, 1.61 GB "Training using
#   Adam" (about 4 times); inference adds up to about 20%:
#   https://huggingface.co/docs/accelerate/usage_guides/model_size_estimator
# - GPU-Util: "Percent of time over the past sample period during which one
#   or more kernels was executing on the GPU", the sample period between 1
#   second and 1/6 second: https://docs.nvidia.com/deploy/nvidia-smi/index.html
# - The nvidia-smi summary's layout under driver 580.65.06, and the totals
#   an H100 80GB HBM3 (81559MiB, 700 W cap) and an A100-SXM4-40GB (40537MiB,
#   driver 450.80.02) report; MIG "up to seven separate GPU Instances",
#   isolated paths through the memory system, fault isolation; the
#   supported cards (A30, A100, H100, H200, B200 and others; no T4, L4, A10
#   or L40S); the A100-40GB as 8 memory slices of 5 GB and 7 SM slices, and
#   its profile table (1g.5gb 7, 1g.10gb 4, 2g.10gb 3, 3g.20gb 2, 4g.20gb 1,
#   7g.40gb 1; 3g.20gb takes 4/8 of the memory); 4g.20gb with 3g.20gb
#   allowed from driver R510; the 8-GPU example with 4g.20gb, 2g.10gb and
#   1g.5gb on one card: NVIDIA's Multi-Instance GPU User Guide, Release 620,
#   2026-11-04, https://docs.nvidia.com/datacenter/tesla/pdf/MIG_User_Guide.pdf
#   (read as text). The web edition's index,
#   https://docs.nvidia.com/datacenter/tesla/mig-user-guide/latest/, loads;
#   its sub-pages redirected on the 11th, so the PDF is linked.
# - An A100 40GB reporting 40960MiB under driver 525.60.13: a user's post on
#   NVIDIA's developer forum, 2025-02-05,
#   https://forums.developer.nvidia.com/t/a100-sxm4-40gb-shows-in-nvidia-smi-but-not-accessible-in-cuda/322730
# - Time-slicing: "there is no memory or fault-isolation between replicas";
#   suits older cards without MIG:
#   https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/gpu-sharing.html
# - NVLink: a direct GPU-to-GPU interconnect within a server; 900 GB/s
#   (Hopper), 1,800 (Blackwell), 3 TB/s (Vera Rubin) per GPU, so no number
#   is taught: https://www.nvidia.com/en-us/data-center/nvlink/
# - AWS sizes and card memory: g4dn.xlarge 1 x T4 16 GiB, 125 GB NVMe;
#   g4dn.12xlarge "64 GiB (4 x 16 GiB)"; g5.xlarge A10G 22 GiB; g6.xlarge L4
#   22 GiB; g6.12xlarge "89 GiB (4 x 22 GiB)"; g6e.xlarge L40S 44 GiB;
#   g6f.large 0.125 x L4, 2.79 GiB; p4d.24xlarge 8 x A100 40 GiB; p5.48xlarge
#   8 x H100 80 GiB: https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html
# - AWS prices, US East (N. Virginia), Linux, on demand: g4dn.xlarge 0.526,
#   g4dn.12xlarge 3.912, g5.xlarge 1.006, g6.xlarge 0.8048, g6.12xlarge
#   4.6016, g6e.xlarge 1.861, g6f.large 0.202 dollars an hour. AWS's public
#   price file, https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ec2-ondemand-without-sec-sel/US%20East%20(N.%20Virginia)/Linux/index.json,
#   published 2026-11-10.
# - Azure sizes: NCasT4_v3 "up to 4 NVIDIA T4 GPUs with 16 GB of memory
#   each" (NC4as 4 vCPUs, 28 GiB, 176 GiB temp disk; NC8as 8; NC64as 64 and
#   4 cards); NVadsA10_v5 from 1/6 of an A10 (NV6ads, 6 vCPUs, 4 GB) to a
#   whole one (NV36ads, 36 vCPUs, 440 GiB, 24 GB), for graphics and virtual
#   desktops; NC_A100_v4 A100 PCIe 80 GB (NC24ads 24 vCPUs); NCads_H100_v5
#   H100 NVL 94 GB (NC40ads 40 vCPUs): the series pages under
#   https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/gpu-accelerated/
# - Azure prices, East US, Linux, pay-as-you-go: NC4as_T4_v3 0.526,
#   NC8as_T4_v3 0.752, NC64as_T4_v3 4.352, NV6ads_A10_v5 0.454,
#   NV36ads_A10_v5 3.20, NC24ads_A100_v4 3.673, NC40ads_H100_v5 6.98 dollars
#   an hour: https://prices.azure.com/api/retail/prices
# - Google Cloud sizes: g2-standard-4 1 x L4 24 GB; a2-highgpu-1g A100
#   40 GB; a2-ultragpu-1g A100 80 GB; "NVIDIA T4 GPUs reach end of support
#   on August 1, 2027": https://docs.cloud.google.com/compute/docs/gpus
#   (last updated 2026-11-10). Prices, Iowa: g2-standard-4 0.706832276,
#   a2-highgpu-1g 3.673385, a2-ultragpu-1g 5.06879789 dollars an hour:
#   https://cloud.google.com/products/compute/pricing/accelerator-optimized
# - Pass-through, fractional sizes on G4, Spot, GPU quotas:
#   https://docs.cloud.google.com/compute/docs/gpus/about-gpus
# - "GPUs and TPUs are not included in the Free Tier offer"; a free-trial
#   account can't add GPUs: https://docs.cloud.google.com/free/docs/free-cloud-features
# - The naive pipeline leaves the model idle; prefetching overlaps:
#   https://www.tensorflow.org/guide/data_performance (last updated
