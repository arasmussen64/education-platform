id: build-gpu-plan
stage: build
runtime: lab
rev: 1
title: "The GPU plan"
prompt: |
  The shop wants a one-page GPU plan before it rents anything. Everything you need is in `/srv/plan/`, and `/srv/plan/README.txt` says what each answer means, the rules of the plan and how exact each answer must be:

  - `jobs.txt`: four jobs in plain words. A chat model to serve, a model to train, a large model to serve in one of two precisions, and six small services that must not be able to disturb one another;
  - `gpus.csv`: a dated table of GPU instances on the three clouds, with each card's memory as the provider states it and the same figure in GiB (`gpus-README.txt` says what every column is and where it came from);
  - `mig-a100-40gb.txt` and `layouts.txt`: NVIDIA's table of MIG profiles for the A100 40GB, and four layouts someone has proposed for one card;
  - `boxes/box-4` and `boxes/box-5`: what an on-call script saved from two trial servers running the same training job.

  Write your answers in `~/plan/answers.txt`, one `key=value` line for each key it lists. Use any tools you like: the commands of this topic's practice, a calculator, or both. Then run the checks; each answer has a check of its own.
skills: [gpu-vs-cpu, vram-fit, read-nvidia-smi, gpu-starvation, gpu-instance-choice, gpu-sharing]
