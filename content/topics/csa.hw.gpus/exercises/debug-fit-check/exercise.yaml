id: debug-fit-check
stage: debug
runtime: lab
rev: 1
title: "The fit check"
prompt: |
  `~/bin/fit-check` was written by a colleague who has since left. Given a model's size in billions of parameters, the bits each parameter is stored in and a headroom percentage, it is meant to print the cheapest instance in `/srv/plan/gpus.csv` on which the model runs on one card with that headroom to spare, as `instance price`, or `none` when no instance in the table can. `/srv/plan/README.txt` says how it is called, with the two calls the team made last month, and `/srv/plan/gpus-README.txt` says what each column of the table is.

  The team followed its advice twice last month. One model would not run: the GPU ran out of memory as it started. For another job, the invoice was several times what a neighbouring team paid for the same job on a different instance.

  There are three faults in the script. Find them and fix them with `nano ~/bin/fit-check`, without changing what it is meant to do: it still takes the same three arguments and prints the same one line, for any model, not only last month's. Leave everything in `/srv/plan` as it is. Then run the checks, which also try the script on models you won't have seen.
skills: [vram-fit, gpu-instance-choice]
