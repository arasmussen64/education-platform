id: mcq-what-gpu-util-means
type: mcq
rev: 1
prompt: |
  NVIDIA's `nvidia-smi` manual (read 2026-11-11) defines GPU-Util as the share of the last sample period during which "one or more kernels was executing on the GPU" (a kernel, in NVIDIA's sense, is a program running on the GPU). `nvidia-smi` shows 100%. What do you know?
choices:
  - "Every arithmetic unit was busy throughout; there's no spare capacity left on the card"
  - "Some GPU program ran throughout; it says nothing of how much of the card that program used"
  - "All of the card's memory was in use throughout; the next program to load will not fit"
  - "The card ran at its rated speed throughout; any more work will slow every program on it"
answer: 1
explanation: |
  The definition counts time, not units: 100% means that in every moment of the sample period at least one program was running on the card. It is a shop being open, not a shop being full. A small program that keeps a few of the card's thousands of units busy shows 100% just as a huge one does.

  So it can't tell you every unit was busy, or that the card is at its rated speed, or how much more work it would take. Memory is a different figure altogether (`Memory-Usage`), and a card can show 100% with most of its memory free, or 0% with its memory full.
skills: [read-nvidia-smi]
