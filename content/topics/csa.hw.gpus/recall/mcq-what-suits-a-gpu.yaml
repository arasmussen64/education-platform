id: mcq-what-suits-a-gpu
type: mcq
rev: 1
prompt: |
  Four jobs are queued on a server that has a GPU. Which of them gains the most from running on the GPU?
choices:
  - "Parsing a log file line by line, where each line depends on the one before it"
  - "Serving a thousand small web requests that each read one row from a database"
  - "Multiplying two tables of ten million numbers each, over and over again"
  - "Compressing one large file with a method that has to work through it in order"
answer: 2
explanation: |
  A GPU is thousands of small arithmetic units doing the same sum on different numbers at the same moment. Multiplying two huge tables of numbers is exactly that: millions of multiplications, none waiting for another, which is why models (very large tables of numbers) run on GPUs.

  Parsing a log where each line depends on the last, and compressing a file in order, are one step after another: each step waits for the one before, so thousands of units can't share the work, and one fast CPU core does it better. The web requests are small and independent, but each spends its time waiting on the database, not doing arithmetic; more CPU cores and a faster database help them, a GPU doesn't.
skills: [gpu-vs-cpu]
