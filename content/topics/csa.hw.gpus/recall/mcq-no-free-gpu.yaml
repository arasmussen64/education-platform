id: mcq-no-free-gpu
type: mcq
rev: 1
prompt: |
  A learner wants to try a GPU without spending anything, and has a new Google Cloud account on its free trial. What does Google's page on free features (read 2026-11-11) say?
choices:
  - "Free-trial accounts get one small GPU for ninety days, and after that it's billed by the hour"
  - "Free-trial accounts can't add GPUs at all, and the Free Tier never includes them"
  - "The Free Tier includes one T4 a month in three US regions, as it includes an `e2-micro`"
  - "Free-trial accounts can add any GPU, and the trial's credit pays for the first hours"
answer: 1
explanation: |
  Google's page says that GPUs and TPUs "are not included in the Free Tier offer", that you are always charged for the GPUs you add, and it lists adding GPUs among the things a free-trial account can't do. AWS and Azure have no free GPUs either. That is why this topic has no GPU to practise on: everything in it is read from saved output or worked out from dated tables.

  The always-free `e2-micro` is a small VM with no GPU, and there is no GPU allowance like it. The trial credit can't buy what the trial account isn't allowed to add.
skills: [gpu-instance-choice]
