id: mcq-not-starved
type: mcq
rev: 1
prompt: |
  A training job shows GPU-Util at 98 to 100% the whole time, its vCPUs 30% busy, no disk wait, and the card's memory 80% used. The team asks what to change so it finishes sooner.
choices:
  - "The CPUs are starving it: doubling the vCPUs would roughly halve the time it takes"
  - "The disk is starving it: moving the data to a local NVMe disk would shorten the run"
  - "The memory is starving it: a card with more memory would run the same job faster"
  - "Nothing is starving it: only a faster card, or a second one, would shorten the run"
answer: 3
explanation: |
  The card is busy all the time and the stations before it have room to spare: the CPUs are mostly idle and nothing waits on the disk. That is the GPU working as the limit, which is what it was bought for. To finish sooner the job needs a faster card, or a second card and a job written to share the work between them.

  More vCPUs or a faster disk would feed a card that is already full. And memory isn't a speed: the model fits, with a fifth to spare, and more of it would sit empty.
skills: [gpu-starvation]
