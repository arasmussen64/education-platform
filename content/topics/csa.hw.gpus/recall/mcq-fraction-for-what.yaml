id: mcq-fraction-for-what
type: mcq
rev: 1
prompt: |
  Azure sells `NV6ads_A10_v5`: 6 vCPUs and a sixth of an A10 card, with 4 GB of card memory, for $0.454 an hour (East US, Linux, read 2026-11-11). Azure's page says the series is for graphics applications and virtual desktops. For which job is it the right buy?
choices:
  - "A service that answers questions with a 7-billion-parameter model"
  - "A nightly job that trains a model whose weights are 5 GiB in size"
  - "A remote desktop for one engineer who uses a 3D drawing program"
  - "A batch job that needs a whole A10 to itself for two hours a day"
answer: 2
explanation: |
  A fraction of a card is made for light graphics work, such as one person's remote desktop running a 3D drawing program: a little card memory and a share of the card's time, at a fraction of the price.

  The 7-billion-parameter model needs about 13 GiB for its weights in 16 bits, more than three times what this slice has. Training a model of 5 GiB needs about four times that, 20 GiB. And a job that needs a whole A10 should rent a whole A10 (`NV36ads_A10_v5`) for its two hours, not a sixth of one all day.
skills: [gpu-sharing]
