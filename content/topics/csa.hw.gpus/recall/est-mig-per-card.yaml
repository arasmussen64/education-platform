id: est-mig-per-card
type: estimate
rev: 1
prompt: |
  NVIDIA's MIG guide (read 2026-11-11): an A100 40GB is cut into 8 memory slices of 5 GB and 7 compute slices. A `2g.10gb` instance takes 2 compute slices and 2 memory slices (10 GB). Using only those sums, how many `2g.10gb` instances fit on one card? Exactly.
unit: instances
answer: 3
tolerance: { absolute: 0 }
given: { memory_slices: 8, slice_gb: 5, compute_slices: 7, takes_compute: 2, takes_memory: 2 }
working: min(memory_slices // takes_memory, compute_slices // takes_compute)
mistakes:
  - id: memory-only
    value: 4
    working: memory_slices // takes_memory
    why: The memory would allow four, but each also takes 2 of the 7 compute slices, and 7 compute slices make only three pairs.
  - id: smallest-profile
    value: 7
    working: compute_slices
    why: Seven is how many of the smallest profile, `1g.5gb`, fit. A `2g.10gb` takes twice the compute.
explanation: |
  The memory allows 8 ÷ 2 = 4 and the compute 7 ÷ 2 = 3, rounded down; the card holds whichever runs out first, 3. NVIDIA's table agrees: three `2g.10gb` on one A100 40GB, with one compute slice and two memory slices left unused. The sums are the first test; NVIDIA's own table of profiles and placements is the last word.
skills: [gpu-sharing]
