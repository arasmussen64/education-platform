id: est-mig-cards-for-teams
type: estimate
rev: 1
prompt: |
  10 teams each need an isolated `2g.10gb` MIG instance. NVIDIA's table (read 2026-11-11) says 3 instances of `2g.10gb` fit on one A100 40GB. How many cards are needed? Exactly.
unit: cards
answer: 4
tolerance: { absolute: 0 }
given: { teams: 10, per_card: 3 }
working: ceil(teams / per_card)
mistakes:
  - id: by-memory
    value: 3
    working: ceil(teams * 10 / 40)
    why: That counts memory only. Ten 10 GB instances are 100 GB, two and a half cards, but each card's 7 compute slices hold only three of them, so it takes 4 cards.
  - id: a-card-each
    value: 10
    working: teams
    why: That gives every team a whole card. MIG partitions let three teams share one card, each with walls of its own.
explanation: |
  10 ÷ 3 = 3.3, and a third of a card can't be rented, so 4 cards: three hold three teams each and the fourth holds one, with room for two more. The walls between partitions are what make sharing safe for teams that mustn't disturb each other.
skills: [gpu-sharing]
