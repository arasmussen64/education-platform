id: typed-partition-feature
type: typed
rev: 1
prompt: |
  Two teams must share one A100, and one team's experiments often run out of card memory. Name NVIDIA's feature that cuts a large card into up to seven smaller GPU instances, each with memory and compute of its own, so a fault stays inside one.
kind: text
answers:
  - MIG
  - Multi-Instance GPU
mistakes:
  - id: turns
    answers: [time-slicing, time slicing]
    why: "Time-slicing lets programs take turns on the whole card with no walls: they share all its memory, so one that runs out takes the others down."
  - id: virtual-gpu
    answers: [vGPU, virtual GPU]
    why: "A vGPU is a card shared between VMs by the hypervisor, the way clouds sell fractional GPUs for graphics work. The walls inside one card for compute are MIG."
  - id: link
    answers: [NVLink]
    why: "NVLink joins cards to each other for one job that spans them. It doesn't divide a card."
explanation: |
  **MIG**, Multi-Instance GPU, builds walls inside a card: up to seven GPU instances, each with memory and compute slices of its own, and a fault stays inside its instance. It exists only on NVIDIA's large data-centre cards and a few of its newest workstation cards (A30, A100, H100, H200, B200 and others in NVIDIA's list), never on a T4, L4, A10 or L40S.
skills: [gpu-sharing]
