id: mcq-same-card-three-clouds
type: mcq
rev: 1
prompt: |
  A job needs one card of about 22 GiB. The dated table (on demand, Linux, read 2026-11-11; AWS US East, Google Cloud Iowa, Azure East US):

  | Instance | Card | Memory as stated | vCPUs | Per hour |
  | --- | --- | --- | --- | --- |
  | `g6.xlarge` (AWS) | L4 | 22 GiB | 4 | $0.8048 |
  | `g2-standard-4` (Google Cloud) | L4 | 24 GB | 4 | $0.706832 |
  | `NV36ads_A10_v5` (Azure) | A10 | 24 GB | 36 | $3.20 |

  What is the fair conclusion?
choices:
  - "AWS's L4 is a smaller card than Google's, since 22 is less than 24, so it suits smaller jobs"
  - "Azure's card must be about four times as fast, since it costs about four times the other two"
  - "The three are the same offer, since every cloud prices one card of a kind the same way"
  - "Similar cards cost very different amounts by cloud, because of what is sold along with them"
answer: 3
explanation: |
  AWS and Google sell the same L4 card: AWS states its memory in GiB and rounds down, Google states it in GB, and 24 GB is 22.35 GiB. Their prices differ by about 14%. Azure's nearest whole card here is an A10, a card of the same class, sold only with 36 vCPUs and 440 GiB of memory, which is most of why it costs four times as much: you pay for the whole instance, not for the card alone.

  So the 22 against 24 is units, not size; the higher price buys vCPUs and memory, not a faster card; and the clouds plainly don't price a card the same. Compare whole instances, in one unit, for the job you have.
skills: [gpu-instance-choice]
