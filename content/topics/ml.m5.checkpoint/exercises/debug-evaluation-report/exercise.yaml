id: debug-evaluation-report
stage: debug
rev: 2
title: "Three bugs in an evaluation report"
prompt: |
  This is the checkpoint's program on its data. It picks a threshold for each model; then, on the test data, it counts each model's confusion table and works out its accuracy, precision, recall and F1, puts an interval on each accuracy, and compares the two models with a paired bootstrap before giving a verdict. It should print:

  ```
  thresholds 1.7 1.05
  A (39, 2, 22, 137) [0.88  0.951 0.639 0.765]
  B (35, 27, 26, 112) [0.735 0.565 0.574 0.569]
  interval A [0.835 0.925]
  interval B [0.674 0.796]
  A minus B 0.145 [0.075 0.215]
  verdict: A is better
  ```

  Instead every line but the verdict comes out different: the thresholds print as `1.3 1.3`, and A's accuracy as 0.915. It has three bugs, and none of them crashes. Run it and compare, then run the checks, which try the functions on their own. You're done when it prints the lines above and every check passes.
hints:
  - "Start with the first line. A threshold must be chosen on data the report doesn't use, or the numbers flatter the model. Which data does the program hand `choose_threshold`?"
  - "`y_val`, `score_a_val` and `score_b_val` are made and never used. Choosing the thresholds on the test data means trying forty-one thresholds on the very examples being reported."
  - "Check `metrics` against the definitions: precision divides by everything flagged, `tp + fp`; recall by everything really positive, `tp + fn`."
  - "The checks give `paired_bootstrap` the same model twice, and two identical models must differ by exactly zero. A paired bootstrap resamples the per-example differences, `diff`; resampling each model's correctness separately and subtracting throws the pairing away."
# Every test names the module skills it checks (ADR-0012), so a failed test
# says which topics to revisit.
test_skills:
  test_the_output: [ml.prob.evaluating-models/splits, ml.prob.evaluating-models/metrics, ml.prob.evaluating-models/compare]
  test_thresholds_come_from_validation: [ml.prob.evaluating-models/splits]
  test_metrics_and_pairing: [ml.prob.evaluating-models/metrics, ml.prob.sampling-and-confidence/bootstrap]
