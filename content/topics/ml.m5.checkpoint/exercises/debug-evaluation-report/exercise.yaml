id: debug-evaluation-report
stage: debug
rev: 1
title: "Three bugs in an evaluation report"
prompt: |
  This is the checkpoint's program on its data, and it should print:

  ```
  thresholds 1.7 1.05
  A (39, 2, 22, 137) [0.88  0.951 0.639 0.765]
  B (35, 27, 26, 112) [0.735 0.565 0.574 0.569]
  interval A [0.835 0.925]
  interval B [0.674 0.796]
  A minus B 0.145 [0.075 0.215]
  verdict: A is better
  ```

  It has three bugs, in three different places. None of them crashes; each makes a number lie. Run it and compare:

  1. **The thresholds are chosen on the test set.** The first line prints `1.3 1.3` and model A's accuracy comes out as 0.915, flattering numbers that come from trying forty-one thresholds on the very examples being reported. The thresholds belong on the **validation** data, `y_val` and the validation scores.
  2. **Precision and recall are swapped** in `metrics`: precision divides by everything flagged, `tp + fp`; recall by everything really positive, `tp + fn`.
  3. **The comparison's interval is built from the wrong resamples:** `paired_bootstrap` resamples A's and B's correctness separately and subtracts, which throws away the pairing. It must resample the per-example **differences**. With that fixed, the `A minus B` line reads `0.145 [0.075 0.215]` instead of `0.145 [0.07 0.22]`.
# Every test names the module skills it checks (ADR-0012), so a failed test
# says which topics to revisit.
test_skills:
  test_the_output: [ml.prob.evaluating-models/splits, ml.prob.evaluating-models/metrics, ml.prob.evaluating-models/compare]
  test_thresholds_come_from_validation: [ml.prob.evaluating-models/splits]
  test_metrics_and_pairing: [ml.prob.evaluating-models/metrics, ml.prob.sampling-and-confidence/bootstrap]
