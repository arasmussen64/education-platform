id: step-interval-on-an-accuracy
stage: fill_in
rev: 1
title: "Step 3: an interval on each accuracy"
prompt: |
  Each accuracy is a mean of 200 zeros and ones, so it gets a standard error and an interval. Replace each `...` so the standard error is `sqrt(p(1 - p) / n)` and the interval reaches `z` standard errors each side, and the program prints each model's accuracy with its interval:
  
  ```
  0.885 [0.841 0.929]
  0.705 [0.642 0.768]
  ```
hints:
  - "`n` is `len(correct)`, and the whole fraction goes under the square root."
  - "The half-width is `z` times the standard error."
