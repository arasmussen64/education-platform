title: "Step 1: the four counts"
prompt: |
  The first part of the checkpoint is the confusion matrix. Replace each `...` so `confusion` counts the false positives (flagged, but the label is 0) and the false negatives (not flagged, but the label is 1), and the program prints both models' counts and shows the four add up to all 200 examples:
  
  ```
  (56, 18, 5, 121)
  (45, 43, 16, 96)
  200
  ```
hints:
  - "A false positive is `pred == 1` together with `y == 0`."
  - "A false negative is `pred == 0` together with `y == 1`."
