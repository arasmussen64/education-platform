id: example-one-model-against-the-baseline
stage: worked_example
rev: 1
title: "One model against the baseline"
prompt: |
  The checkpoint's tools, run on a single model against the model that always says no. Press **Run**, then read how each part works; the checkpoint is this with a second real model in place of the baseline, and a verdict.
steps:
  - label: "The functions"
    lines: "4-36"
    note: "The confusion counts, the four metrics, the interval on an accuracy, the paired bootstrap and the threshold chosen on validation data are the ones you built across the module."
  - label: "The report"
    lines: "39-56"
    note: "`report` runs the whole judgement for two models: each one's counts and metrics, an interval on each accuracy, the paired bootstrap of A minus B, and a verdict that follows the interval: `A is better` if it stays above zero, `B is better` if it stays below, `not established` otherwise. This example doesn't call it; the checkpoint's build is where you write it."
  - label: "The data"
    lines: "59-66"
    note: "Two hundred held-out examples, each positive with a 30 percent chance, and two models' scores for each: seeded stand-ins for two trained models, A's scores separating the classes by 2.0 and B's by 1.2, both with noise of spread 1. A second two hundred, scored by the same stand-ins, are the validation set."
  - label: "A threshold chosen honestly"
    lines: "68-70"
    note: "The threshold is chosen on the validation scores, never on the examples about to be judged. The baseline predicts 0 for everyone."
  - label: "Counts, metrics and the baseline"
    lines: "71-73"
    note: "The model's four counts and metrics, then the baseline's counts (no positives flagged at all, so no precision or recall to speak of) and its accuracy, which is just the share of negatives."
  - label: "How sure, and how much better"
    lines: "74-77"
    note: "The interval on the model's accuracy, and the paired bootstrap of model minus baseline, which is well above zero: the model beats always-no by more than chance can explain. The checkpoint asks the same question of two real models, where the answer isn't obvious."
