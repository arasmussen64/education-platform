id: parsons-numeric-gradient
type: parsons
rev: 2
prompt: |
  Put the lines in order to estimate the gradient of `f(x, y) = x * y` at `(2, 3)` one coordinate at a time, printing `[3. 2.]`. `np.prod` multiplies an array's entries together, so `np.prod(p)` is `x * y`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'p, h = np.array([2.0, 3.0]), 1e-6'
  - 'grad = np.zeros(len(p))'
  - 'for i in range(len(grad)):'
  - '    step = np.zeros(len(p))'
  - '    step[i] = h'
  - '    grad[i] = (np.prod(p + step) - np.prod(p - step)) / (2 * h)'
  - 'print(np.round(grad, 6))'
distractors:
  - '    step[:] = h'
explanation: |
  The second line names the point and the size of the nudge at once, and `grad` starts as zeros, one for each coordinate of `p`. Each partial derivative nudges **one** coordinate and leaves the other alone: inside the loop `step` starts as zeros and `step[i] = h` puts the nudge in coordinate `i` only, `[h, 0]` for the slope in `x` and then `[0, h]` for the slope in `y`. With `f = x * y`, the slope in `x` is `y = 3` and the slope in `y` is `x = 2`. The decoy, `step[:] = h`, nudges both at once, which gives the sum of the two partials, `3 + 2 = 5`, not a partial derivative.
skills: [gradient, partial]
