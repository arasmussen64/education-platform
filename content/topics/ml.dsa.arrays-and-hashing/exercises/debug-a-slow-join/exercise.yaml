id: debug-a-slow-join
stage: debug
rev: 2
title: "A slow join"
prompt: |
  `group_by` should collect records into lists by the value of a field, and `join` should merge every left record with every right record that shares its `id`. The program prints a small join, then the size of a bigger one:

  ```
  [{'id': 1, 'name': 'Ada', 'item': 'book'}, {'id': 2, 'name': 'Grace', 'item': 'lamp'}, {'id': 2, 'name': 'Grace', 'item': 'pen'}]
  2000
  ```

  Run it and you'll see exactly those lines: the output is right. It has two bugs anyway, and only the checks show them, so run the checks and read what fails. One of the checks counts the comparisons `join` makes. You're done when every check passes.
hints:
  - "Try `group_by` by hand on three records where two share a key. What happens to a key's group when a second record with that key arrives?"
  - "`groups[record[field]] = [record]` replaces the group each time. A new record must be appended to its key's group: `groups.setdefault(record[field], []).append(record)`."
  - "The output never showed that, because `join` doesn't use `group_by` at all: it compares every left record with every right record, a loop inside a loop, 1,000 × 2,000 = 2 million comparisons in the check."
  - "Index the right side once with `group_by`, then look each left record's key up in that index."
skills: [patterns, replace]
