id: parsons-count-words
type: parsons
rev: 1
prompt: |
  Put the lines in order to count how often each word appears, and print `3 3` (three `"a"`s, three distinct words). One line is a decoy that doesn't belong.
lines:
  - 'words = ["a", "b", "a", "c", "a"]'
  - 'counts = {}'
  - 'for word in words:'
  - '    counts[word] = counts.get(word, 0) + 1'
  - 'print(counts["a"], len(counts))'
distractors:
  - '    counts[word] = counts[word] + 1'
explanation: |
  `counts.get(word, 0)` returns the count so far, or 0 for a word not yet seen, so the first time a word appears it becomes 1. The decoy indexes `counts[word]` directly, which raises `KeyError` on the first word. Three `"a"`s, and three distinct keys.
skills: [patterns]
