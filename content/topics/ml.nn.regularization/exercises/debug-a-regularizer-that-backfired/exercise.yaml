id: debug-a-regularizer-that-backfired
stage: debug
rev: 2
title: "Two regularizers that backfired"
prompt: |
  A one-hidden-layer network with dropout, trained with Adam and weight decay for 200 epochs. It should print:

  ```
  validation loss at the end: 0.387 | evaluating twice gives the same answer: True
  the first layer's weights shrank under decay: True | validation accuracy: 0.85
  ```

  Instead the validation loss ends at 1.787, evaluating the same network twice gives two different answers, and the first layer's weights have not shrunk. It has two bugs. Run it, take the two wrong facts one at a time, then run the checks, which try the pieces on small cases.
hints:
  - "Each bug has its own symptom. The same network, evaluated twice on the same rows, should give the same answer: what in this network is random?"
  - "Dropout draws a fresh mask on every forward pass in training mode. Which mode is the network in when `evaluate` runs it, given what `fit` switches on before each step?"
  - "`evaluate` must call `net.eval()` before its forward pass."
  - "Weight decay is a pull towards zero: it adds `weight_decay * param` to each gradient, so every step moves each weight a little towards 0. Which sign does `Adam.step` use?"
  - "`grad = grad + self.weight_decay * param`."
skills: [dropout, decay]
