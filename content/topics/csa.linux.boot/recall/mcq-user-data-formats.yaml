id: mcq-user-data-formats
type: mcq
rev: 1
prompt: |
  How does cloud-init tell a `#cloud-config` document from a script, and what's the difference in how each is handled?
choices:
  - "By the file extension: `.yaml` or `.sh`"
  - "By the first line: `#cloud-config` marks YAML that cloud-init's modules interpret (users, packages, files, runcmd), while a shebang like `#!/bin/bash` marks a script cloud-init simply runs; both arrive as user data"
  - "Scripts run on every boot; cloud-config runs never"
  - "cloud-config is for Ubuntu and scripts are for everything else"
answer: 1
explanation: |
  User data is just bytes handed to the instance, and cloud-init reads the first line to decide what it has. Cloud-config is declarative, so each module knows how to apply its part sensibly; a script is whatever you wrote. Both run once per instance by default. You can even combine them in a multipart document. Prefer cloud-config for setup and keep scripts short, or better, bake what you can into the image.
skills: [cloud-init]
