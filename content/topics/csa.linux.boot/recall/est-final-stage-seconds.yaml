id: est-final-stage-seconds
type: estimate
rev: 1
prompt: |
  A new instance took a minute and a half to come up. Its `/var/log/cloud-init-output.log` has these lines, each ending with how long the machine had been up:

  ```
  Cloud-init v. 24.4 running 'init-local' at Tue, 10 Nov 2026 14:02:10 +0000. Up 3.10 seconds.
  Cloud-init v. 24.4 running 'init' at Tue, 10 Nov 2026 14:02:15 +0000. Up 8.40 seconds.
  Cloud-init v. 24.4 running 'modules:config' at Tue, 10 Nov 2026 14:02:17 +0000. Up 10.20 seconds.
  Cloud-init v. 24.4 running 'modules:final' at Tue, 10 Nov 2026 14:02:18 +0000. Up 11.50 seconds.
  Cloud-init v. 24.4 finished at Tue, 10 Nov 2026 14:03:42 +0000. Datasource DataSourceEc2Local.  Up 95.50 seconds
  ```

  How many seconds did the final stage take? Exactly.
unit: seconds
answer: 84
tolerance: { absolute: 0 }
given: { local: 3.1, network: 8.4, config: 10.2, final: 11.5, finished: 95.5 }
working: finished - final
mistakes:
  - id: whole-uptime
    value: 95.5
    working: finished
    why: "That's how long the machine had been up when cloud-init finished. The final stage began at 11.50 seconds, so it took 95.50 − 11.50."
  - id: all-four-stages
    value: 92.4
    working: finished - local
    why: "That's cloud-init's whole run, from the start of the local stage. The final stage is only the last stretch, from 11.50 to 95.50 seconds."
  - id: the-config-stage
    value: 1.3
    working: final - config
    why: "That's the config stage, from its own line to the next one. The final stage runs from the `modules:final` line to `finished`."
explanation: |
  Each line carries an `Up` time, so a stage's length is the gap to the next line. The final stage began at 11.50 seconds and cloud-init finished at 95.50: 84 seconds, against 5.3 for the local stage, 1.8 for the network stage and 1.3 for config. The final stage is where packages are installed and `runcmd` runs, so that is where this boot's minute and a half went, waiting on package mirrors or on a slow command. The lines printed between `modules:final` and `finished` say which, and baking the packages into the image is the usual cure.
skills: [cloud-init]
