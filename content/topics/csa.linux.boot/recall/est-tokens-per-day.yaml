id: est-tokens-per-day
type: estimate
rev: 1
prompt: |
  A monitoring agent on an instance that requires IMDSv2 runs for 24 hours and reads the instance's metadata every 5 minutes. Each time it needs a new session token it asks for the longest-lived one the service allows, and it uses that token until it expires. How many tokens does it ask for in the 24 hours? Exactly.
unit: tokens
answer: 4
tolerance: { absolute: 0 }
given: { hours: 24, every: 5 }
# 6 is the longest a token may live, in hours (21,600 seconds), which the
# learner must know.
working: hours / 6
mistakes:
  - id: a-token-per-read
    value: 288
    working: hours * 60 / every
    why: "That's one token for every read. A token is a session: one `PUT` gets it, and the same token goes on every `GET` until it expires."
  - id: one-for-ever
    value: 1
    working: "1"
    why: "That's a token that never expires. The longest a token may live is six hours, 21,600 seconds, so a day takes four."
  - id: one-an-hour
    value: 24
    working: hours
    why: "That's a new token every hour. The longest a token may live is six hours, so each one covers six hours of reads."
explanation: |
  The longest lifetime a token can have is 21,600 seconds, six hours, so 24 hours take 24 ÷ 6 = 4 tokens: one at the start, and one each time the last has expired. The 288 reads all reuse them. That is what the session buys: the `PUT` is rare, and a forged plain `GET` from a web application never has a token to send. Software that asks for a token before every single read works too, but makes twice the requests for nothing.
skills: [imds-v2]
