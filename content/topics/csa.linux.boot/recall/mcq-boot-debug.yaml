id: mcq-boot-debug
type: mcq
rev: 1
prompt: |
  A new cloud VM never answers on SSH, five minutes after launch. Where do you look first, given that you can't log in?
choices:
  - "Nowhere; terminate it and launch another"
  - "The cloud console's serial console or boot log, which shows the kernel and systemd messages from outside the VM: a kernel panic, a filesystem waiting forever, or a cloud-init stage failing all appear there"
  - "`journalctl -b` on your laptop"
  - "The DNS records for the VM"
answer: 1
explanation: |
  Everything the VM prints during boot goes to its serial console, and every cloud exposes it: EC2's "Get system log", Azure's boot diagnostics, Google's serial port output. It shows exactly how far the boot got. Once you can log in, `journalctl -b`, `systemd-analyze blame` and `cloud-init status --long` take over. Launching another VM may work by luck and teaches you nothing about why this one didn't.
skills: [boot-sequence, cloud-init]
