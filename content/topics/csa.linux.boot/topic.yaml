id: csa.linux.boot
kind: topic
status: ready
title: "Boot, cloud-init and instance metadata"
summary: "What happens between pressing power and a ready server: firmware, bootloader, kernel, systemd; how cloud-init turns a bare image into your configured instance from user data; what the instance metadata service offers; and why its session-based form (IMDSv2 and its cousins) closes a famous hole."
prerequisites: [csa.linux.services]
estimated_minutes: 90
rev: 1
objectives:
  - "Follow a Linux machine from power-on to ready: firmware, bootloader, kernel and initramfs, systemd and its targets, and read `systemd-analyze` and the boot journal."
  - "Explain what cloud-init does on first boot, its stages and datasource, the two forms of user data, and why most of it runs once per instance."
  - "Describe what the instance metadata service provides and how a program reaches it, on AWS, Azure and Google Cloud."
  - "Explain the server-side request forgery risk that session-based metadata access (IMDSv2, and the required headers on Azure and Google Cloud) defends against, and how to require it."
