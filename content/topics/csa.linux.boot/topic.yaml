    description: "Firmware, bootloader, kernel and initramfs, systemd and its targets; `systemd-analyze`, `journalctl -b` and the boot's log"
  - id: cloud-init
    description: "cloud-init's datasource and stages, the two forms of user data, once-per-instance behaviour, and its logs and status"
  - id: metadata
    description: "The instance metadata service: what it offers, where it lives, and how programs on the instance reach it on each cloud"
  - id: imds-v2
