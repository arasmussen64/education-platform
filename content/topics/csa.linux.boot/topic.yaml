# The recall items read systemd-analyze, the boot journal, user data,
# cloud-init's log and metadata listings with the text tools of the first
# topic. The worked example, the fill-in, the write and both proofs are labs
# on a machine that stands in for a fresh instance: cloud-init runs at its
# first boot from a seed, "console" stand-ins launch and reboot it, and a
# metadata-service stand-in answers at 169.254.169.254 (ADR-0017, ADR-0018).
practice:
  - example-first-boot
  - mcq-boot-order
  - boot-analyze-summary
  - boot-analyze-blame
  - boot-journal-targets
  - mcq-boot-debug
  - mcq-user-data-formats
  - boot-cloud-config
  - boot-cloud-init-stages
