# The lab's cloud-init settings. The datasource is NoCloud: the seed files in
# /var/lib/cloud/seed/nocloud stand in for what a cloud's metadata service
# would hand over. Network configuration is left to the container.
datasource_list: [ NoCloud ]
network:
  config: disabled
# apt reads only the shop's own repository (make-repo.sh sets that up).
# Without this, cloud-init writes Ubuntu's public mirrors back into apt's
# sources at first boot, and the packages module then waits on the internet:
# a slow mirror ran one of these labs out of time in CI on 2026-11-23.
apt:
  preserve_sources_list: true
