id: debug-wont-come-up
stage: debug
runtime: lab
lab:
  init: systemd
rev: 2
title: "The instance came up half-configured"
prompt: |
  A new web server for the shop "launched but isn't set up right". Its user data, the `#cloud-config` document attached at launch, is meant to do three things on first boot: install the shop's report tool (the package `shop-report`); write the tool's settings, the one line `SHOP_TIER=web`, to `/etc/shop/report.env`, which is where the tool reads them; and create an empty file, `/var/lib/shop/ready`, which the load balancer (the machine that shares requests out between the web servers) looks for before it sends this server any traffic.

  On the instance in this lab, none of that happened. `cloud-init status --long` reports errors, `dpkg -l shop-report` finds no such package, and neither `/etc/shop/report.env` nor `/var/lib/shop/ready` exists. A copy of the user data the instance was launched with is in `~/user-data.yaml`.

  Three separate things are wrong. Find each one in the evidence cloud-init leaves behind (the lesson names the three places to look) before you change anything.

  Repair the user data, not this one server: the next server launched from `~/user-data.yaml` has to come up right by itself, with nobody logging in to finish the job. `lab-launch FILE` and `lab-reboot` stand in for the cloud console's Launch and Reboot buttons, as they did in the worked example.

  You're done when the instance that is running was launched from your `~/user-data.yaml`, `cloud-init status` says `done` with no errors, and all three things are in place. Then run the checks.
hints:
  - "cloud-init says what went wrong in two places. `cloud-init status --long` lists the errors, and `/var/log/cloud-init-output.log` holds the output of every command it ran, apt's and `runcmd`'s included. Read the log from the top and stop at each complaint."
  - "Then compare `~/user-data.yaml`, line by line, with the three things it is meant to do: the package's exact name (`apt-cache search shop` lists what the shop's repository has), the exact path of the settings file, the exact path of the marker (`ls /var/lib` shows which folders the image has)."
  - "The package is `shop-report`. `write_files` writes exactly the `path:` it is given, and the tool reads `/etc/shop/report.env`. The marker belongs at `/var/lib/shop/ready`, in a folder the image already has. Making the folder that the broken command names would silence the error and leave the marker where nothing looks for it."
  - "An instance that has already booted won't run its once-per-instance steps again, so fixing the file and using `lab-reboot` changes nothing on it. `lab-launch ~/user-data.yaml` launches a fresh instance from the repaired file."
skills: [cloud-init, boot-sequence]
