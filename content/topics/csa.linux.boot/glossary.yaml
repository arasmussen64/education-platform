- term: firmware
  definition: "The program built into a machine that runs first when it powers on (UEFI, or BIOS on old machines), finds a disk and starts the bootloader."
- term: bootloader
  definition: "The small program the firmware starts, usually GRUB, which loads the kernel and the initramfs into memory."
- term: initramfs
  definition: "A small temporary root filesystem loaded with the kernel, holding the drivers and tools it needs to find and mount the real disk."
- term: cloud-init
  definition: "The set of services that turn a generic cloud image into your server at first boot: hostname, users and keys, packages and your commands, from the user data."
- term: user data
  definition: "The instructions attached to a cloud server at launch, a `#cloud-config` document or a script, which cloud-init carries out at first boot."
- term: IMDS
  aliases: [instance metadata service, metadata service]
  definition: "Instance metadata service, the private web address (`169.254.169.254`) a cloud server asks for its identity, user data and temporary role credentials."
- term: IMDSv2
  definition: "The session-based form of AWS's metadata service: a token from a `PUT` must accompany every request, which a forged request can't easily add."
- term: server-side request forgery
  aliases: [SSRF]
  definition: "A flaw in a web application that fetches a URL a user supplies, which an attacker uses to make the server fetch internal addresses for them."
