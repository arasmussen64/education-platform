id: mcq-type1-type2
type: mcq
rev: 1
prompt: |
  Three machines: VirtualBox running on a Windows laptop, Hyper-V under Azure's virtual machines, and KVM on a Linux server. Which sentence places all three correctly?
choices:
  - "VirtualBox is type 2, a program on Windows; Hyper-V is type 1, on the hardware; KVM makes Linux itself the hypervisor, so type 1"
  - "VirtualBox is type 1, on the laptop's hardware; Hyper-V is type 2, a program on Windows; KVM is a program Linux runs, so type 2"
  - "VirtualBox is type 2, a program on Windows; Hyper-V is type 2, a program on its root Windows; KVM runs on Linux, so it's type 2"
  - "VirtualBox is type 2, a program on Windows; Hyper-V is type 1, on the hardware; KVM is a program that runs on Linux, so type 2"
answer: 0
explanation: |
  A **type 2** hypervisor is a program on an ordinary operating system, which owns the hardware: VirtualBox on Windows, or QEMU on its own. A **type 1** hypervisor owns the hardware itself: Hyper-V, Xen, VMware's ESXi. **KVM** is a part of the Linux kernel (`kvm.ko`) that turns Linux itself into the hypervisor, and is counted with type 1, though QEMU's own documentation treats it as one accelerator among several for a program running on Linux. The split is blurry, which is why the more useful question is what else runs with full control of the hardware: Hyper-V's root partition runs Windows, KVM's host is a whole Linux system, and AWS's Nitro hypervisor has no shell, file system or network of its own.

  Hyper-V does have a Windows root partition, but the hypervisor sits under it, on the hardware, so it isn't a program on Windows. And VirtualBox never owns the laptop's hardware: Windows does, and VirtualBox asks it for everything.
skills: [hypervisor-types]
