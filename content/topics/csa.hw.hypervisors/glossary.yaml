# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# "Hypervisor" itself is Module 1's word (its CPU topic), so it isn't here.
- term: virtualization extensions
  aliases: [VT-x, AMD-V]
  definition: Features of a modern processor that let a guest's code run directly on it at full speed, while the processor keeps each privileged instruction's effect inside that guest or hands it to the hypervisor.
- term: emulation
  aliases: [emulator]
  definition: Imitating a processor or a device in software, instruction by instruction. It works on any machine, and is many times slower than running on the real hardware.
- term: paravirtual
  aliases: [paravirtualized]
  definition: A device or driver made for VMs, which passes whole batches of work to the host through shared memory instead of imitating a real card. virtio on KVM, VMBus on Hyper-V.
- term: SR-IOV
  aliases: [single-root I/O virtualization]
  definition: A feature of some PCIe cards that splits one physical card into many small virtual ones, each handed straight to a VM, so its traffic skips the host's software.
- term: live migration
  definition: Moving a running VM from one host to another without stopping it, so the provider can work on the old host. The VM pauses only briefly, usually under a second.
- term: noisy neighbour
  definition: Another customer's busy VM on the same host, slowing yours by crowding hardware you share, such as the processor's largest cache, its memory bandwidth, disks or the network.
- term: dedicated host
  aliases: [sole-tenant node]
  definition: A whole physical server rented to one customer, so no other customer's VMs run on it. It still runs the provider's hypervisor and can still fail.
- term: bare metal
  definition: A computer running with no hypervisor under its operating system. A bare metal instance rents you a whole server with nothing under your kernel.
