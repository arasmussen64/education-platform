id: csa.hw.hypervisors
kind: topic
status: ready
title: "Hypervisors"
summary: "What sits under every cloud VM: what a hypervisor does and how the processor helps it, type 1 and type 2, emulated, paravirtual and SR-IOV devices, how AWS, Azure and Google Cloud build their hosts and maintain them, how to tell from inside a Linux guest what it runs on, and what a hypervisor can and can't keep apart."
prerequisites: [csa.m1.checkpoint]
# 12 minutes of lesson, 70 of core reading (resources 0 to 9 at about 200
# words a minute), 17 quick questions at about 90 seconds, 75 for the worked
# example, fill-in and write labs, 80 for the build and the debug, 15 for the
# explain. Each lab builds a 400 MB image the first time, a few minutes once.
estimated_minutes: 280
rev: 1
objectives:
  - "Say what a hypervisor does and how the processor's virtualization extensions help it, tell type 1 from type 2, place KVM with QEMU, Hyper-V, Xen and AWS Nitro, and say what nested virtualization is."
  - "Tell an emulated device from a paravirtual one (virtio, VMBus) and from an SR-IOV virtual function by the driver behind it, and say what each costs."
  - "Read from inside a Linux guest what it runs on: `systemd-detect-virt --vm`, `lscpu`, the `hypervisor` flag, the boot log, and the driver behind each network card and disk."
  - "Say how AWS, Azure and Google Cloud build their hosts, what a guest sees on each, and what host maintenance does to a running VM."
  - "Say what a hypervisor can and can't isolate, and what a dedicated host, an isolated size, a sole-tenant node or bare metal changes."
# Every resource was opened and read on 2026-11-11 by the topic's writer.
# Linked, never copied. Licences as each source states them: Brendan
# Gregg's blog, Red Hat's pages and the AWS whitepaper are copyright their
# authors; Microsoft Learn and Google Cloud's documentation are CC BY 4.0;
# systemd's manual pages are LGPL-2.1-or-later; the QEMU manual says "QEMU
# and this manual are released under the GNU General Public License,
# version 2".
#
# Facts the lesson, the questions and the constructed fixtures rest on, each
# read on 2026-11-11:
# - Nitro: three parts (cards, security chip, hypervisor); cards give NVMe
#   and ENA over PCIe as SR-IOV virtual functions; the hypervisor has no
#   network stack, file system, drivers or shell, and is updated live in
#   place: https://docs.aws.amazon.com/whitepapers/latest/security-design-of-aws-nitro-system/the-components-of-the-nitro-system.html
# - "lightweight Nitro Hypervisor that is based on core KVM technology":
#   https://aws.amazon.com/ec2/faqs/ (the High Memory entry)
# - Nitro instances use ENA and NVMe; bare metal can take 20 minutes or more
#   to come up: https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html
# - T2 is the general-purpose family listed with Xen:
#   https://docs.aws.amazon.com/ec2/latest/instancetypes/gp.html
# - No operator access to Nitro hosts or instance memory:
#   https://docs.aws.amazon.com/whitepapers/latest/security-design-of-aws-nitro-system/no-aws-operator-access.html
# - Pinned cores, no core shared between customers through SMT, burstable
#   instances sharing a core in turns, LLC sharing, Dedicated Instances and
#   Hosts: https://docs.aws.amazon.com/whitepapers/latest/security-design-of-aws-nitro-system/the-ec2-approach-to-preventing-side-channels.html
# - AWS nested virtualization on M7i, M7i-flex, M8i, M8id, M8i-flex, C7i,
#   C7i-flex, C8i, C8id, C8i-flex, R7i, R7iz, R8i, R8id, R8i-flex, X8i, I7i,
#   I7ie; KVM and Hyper-V inside; no extra cost:
#   https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-ec2-nested-virtualization.html
# - Azure's hypervisor is based on Hyper-V, root partition owns the devices:
#   https://learn.microsoft.com/en-us/azure/security/fundamentals/hypervisor
# - Hyper-V partitions, VMBus, VSP and VSC, enlightened I/O, Intel VT or
#   AMD-V required (page dated 2026-01-21):
#   https://learn.microsoft.com/en-us/windows-server/virtualization/hyper-v/architecture
# - Accelerated Networking is SR-IOV, can't be switched on while the VM
#   runs, sizes with 2 or more vCPUs (4 or more with hyperthreading), ConnectX
#   and MANA cards (dated 2026-08-11):
#   https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
# - Synthetic interface on hv_netvsc, VF on mlx4, mlx5 or mana with the same
#   MAC, IP on the synthetic one, "Data path switched to/from VF", VF removed
#   in host servicing for about 30 seconds, several times a year (dated
#   2026-07-16): https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-how-it-works
# - VMs paused for up to 30 seconds in memory-preserving maintenance:
#   https://learn.microsoft.com/en-us/azure/virtual-machines/linux/time-sync
# - Azure Boost offloads networking (MANA) and storage (FPGA, NVMe) from the
#   hypervisor and host OS: https://learn.microsoft.com/en-us/azure/azure-boost/overview
# - Dpsv6 (Arm): nested virtualization not supported, Accelerated Networking
#   required: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/general-purpose/dpsv6-series
# - Isolated sizes dedicated to one customer, about 10% dearer; Dedicated
#   Host; confidential VMs encrypt without physical isolation (dated
#   2026-09-25): https://learn.microsoft.com/en-us/azure/virtual-machines/isolation
# - Compute Engine's "security-hardened, KVM-based hypervisor"; no nested
#   virtualization on E2, memory-optimized, Arm, or AMD except N4D:
#   https://docs.cloud.google.com/compute/docs/instances/nested-virtualization/overview
# - Live migration in the same zone, blackout "typically much less than 1
#   second", clock jump up to 5 seconds, GPU and bare metal VMs stopped:
#   https://docs.cloud.google.com/compute/docs/instances/live-migration-process
# - gVNIC (driver gve), the only interface on third-generation and later
#   series: https://docs.cloud.google.com/compute/docs/networking/using-gvnic
# - Sole-tenant node: "a physical Compute Engine server that is dedicated to
#   hosting only your project's VMs":
#   https://docs.cloud.google.com/compute/docs/nodes/sole-tenant-nodes
# - KVM: kvm.ko with kvm-intel.ko or kvm-amd.ko, needs Intel VT or AMD-V:
#   https://linux-kvm.org/page/Main_Page
# - QEMU's accelerators (KVM, Xen, MSHV, HVF, WHPX, NVMM, TCG), TCG the
#   default: https://www.qemu.org/docs/master/system/introduction.html
# - systemd-detect-virt's ids, innermost layer only, --vm, non-zero exit when
#   nothing is found: https://www.freedesktop.org/software/systemd/man/latest/systemd-detect-virt.html
# - Xen's network and disk drivers are called vif and vbd in /sys: the Linux
#   kernel source, drivers/net/xen-netfront.c, drivers/block/xen-blkfront.c
#   and drivers/xen/xenbus/xenbus_probe.c (torvalds/linux, master)
# Measured in this topic's lab image on the owner's laptop (Windows 11,
# Docker Desktop 29.8.2, QEMU 8.2.2, kernel 6.8.0-149-generic): a 300,000-step
# loop took 0.29 s on the lab machine and 4.96 s in a guest under TCG; boots
# took 5 to 10 seconds; QEMU's refusal of KVM is quoted as it printed it.
