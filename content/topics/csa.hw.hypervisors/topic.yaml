prove:
  build: build-fleet-report
  debug: debug-slow-guest
  explain:
    prompt: |
      A colleague says: "Our database VM in the cloud is basically a dedicated server. So last night's slowdown can't have come from the provider, and nobody else could ever see our data." Explain, in your own words: what a hypervisor does, and how a VM's network card and disk can reach the hardware (emulated, paravirtual, SR-IOV) and what each costs; how you'd check from inside the Linux guest what it runs on and which path its devices use; how AWS, Azure and Google Cloud build their hosts differently, and what each does to a running VM during host maintenance; and what a hypervisor does and doesn't isolate, with what you could buy or change to close each gap.
    rubric:
      - id: role
        required: true
        description: "A hypervisor shares one machine's CPUs, memory and devices among guests; with the processor's virtualization extensions most guest code runs directly, and the processor keeps privileged instructions to that guest, trapping to the hypervisor for those that touch the real machine; without them everything is emulated, many times slower."
      - id: device-paths
        required: true
        description: "Emulated: software imitates a real card (e1000), any guest works, slow. Paravirtual (virtio, Hyper-V's VMBus): a driver made for VMs, faster, but the host's software still carries the traffic. SR-IOV: the guest gets a virtual function of the physical card, near the hardware's speed, but tied to that card."
      - id: read-guest
        required: true
        description: "systemd-detect-virt --vm (and why without --vm it may name a container), lscpu's hypervisor vendor or the hypervisor flag, and the driver behind each network card and disk."
      - id: three-clouds
        required: true
        description: "AWS: a small KVM-based Nitro hypervisor with networking and storage on Nitro cards (ENA, NVMe), updated in place. Azure: Hyper-V; a synthetic network card with an optional SR-IOV virtual function, removed for about 30 seconds during host servicing, and pauses of up to 30 seconds. Google: KVM-based; virtio or gVNIC; live migration with a pause typically under a second."
      - id: limits
        required: true
        description: "Isolated: memory and devices. Not isolated: steady performance (shared cache, a core in turns on burstable sizes), side channels on shared hardware in principle, the host failing, and the operator unless the platform prevents it. A dedicated host, isolated size or sole-tenant node removes other tenants only."
      - id: types
        required: false
        description: "Type 1 owns the hardware, type 2 runs as a program on an operating system; KVM makes the Linux kernel the hypervisor."
      - id: nested
        required: false
        description: "Running a hypervisor (KVM, an emulator) inside a cloud VM needs nested virtualization, which only some instance types offer, or bare metal."
    model_answer: |
      The VM isn't a dedicated server: it's a guest on a hypervisor, the software on a physical host that shares that one machine's CPUs, memory and devices among several guests. Each of our vCPUs is a thread the host schedules onto its real cores, and our "physical" memory is the host's memory mapped a second time, privately. With the processor's virtualization extensions (Intel VT-x or AMD-V), almost all of the guest's code runs directly on the real processor, and the processor keeps the privileged instructions, the ones only a machine's owner may run, to our guest: some it applies to our guest's own copy of the machine's settings, and at the rest, such as an order to a disk's chip, it stops and hands control to the hypervisor, which does the safe equivalent for our guest alone. Without the extensions everything would have to be emulated in software, which in the lab made a loop seventeen times slower. The network card and disk can reach the hardware three ways. An emulated device is software imitating a real card, like QEMU's e1000: every guest has the driver, but every step traps into the host, so it's slow. A paravirtual device, virtio on KVM or a synthetic device on Hyper-V's VMBus such as hv_netvsc, is made for VMs: the guest needs that driver and hands the host whole batches through shared queues, which is much faster, though the host's software still carries every packet. With SR-IOV the physical card presents virtual functions, and the guest gets one of its own, so its traffic skips the host's software and runs at nearly the hardware's speed, at the price of being tied to that card. From inside the Linux guest I'd run systemd-detect-virt --vm, which names the VM (amazon, microsoft, google), because without --vm it names the innermost layer, which can be a container; lscpu's Hypervisor vendor line and the hypervisor flag in /proc/cpuinfo confirm it; and the driver behind each interface and disk under /sys says the path: virtio_net or hv_netvsc is paravirtual, e1000 emulated, ena, mlx5_core or mana a virtual function. The clouds build this differently. AWS's Nitro System runs a small KVM-based hypervisor that only divides CPU and memory; networking, EBS storage and management run on separate Nitro cards, which hand the instance an ENA network card and NVMe disks as virtual functions, and the hypervisor is replaced in place under running instances. Azure runs Hyper-V with a Windows root partition; a VM has a synthetic network card on VMBus and, with Accelerated Networking, a virtual function too, which Azure removes for about 30 seconds while it services the host, while maintenance that keeps memory pauses the VM for up to 30 seconds. Google runs a KVM-based hypervisor, guests see virtio or gVNIC, and maintenance is a live migration to another host in the same zone, with a pause typically well under a second and a clock that may jump up to 5 seconds. As for isolation, the hypervisor keeps other guests out of our memory and devices, so nobody on the host can simply read our data. It doesn't promise steady speed: neighbours share the processor's largest cache and memory bandwidth, and on burstable sizes even a core in turns, so last night's slowdown could well have been a noisy neighbour. Shared hardware can in principle leak through side channels, which providers limit; AWS never puts two customers on one core at the same time. If the host fails, every guest on it stops, so we spread VMs over hosts and zones. And what the operator can reach depends on the platform: AWS built Nitro with no operator access, and confidential VMs encrypt a guest's memory from the host. A Dedicated Host on AWS, an isolated size or Dedicated Host on Azure, or a sole-tenant node on Google removes other tenants, and with them noisy neighbours and side channels between customers, but not the hypervisor or host failures; a bare metal instance removes the hypervisor too. And to run a hypervisor of our own inside a cloud VM we'd need an instance type with nested virtualization, or bare metal.
