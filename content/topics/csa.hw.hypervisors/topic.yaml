    description: "What a hypervisor does (shares CPUs, memory and devices, and traps what a guest may not do itself); type 1 against type 2; emulation against hardware-assisted virtualization (QEMU alone against QEMU with KVM); nested virtualization"
  - id: read-the-guest
    description: "Work out from inside a Linux guest what it runs on: `systemd-detect-virt` and its innermost-layer rule, `lscpu`'s hypervisor lines, the `hypervisor` flag, the DMI name plate, the boot log"
  - id: device-paths
    description: "Tell emulated, paravirtual and SR-IOV devices apart by their driver, and say what each costs in speed, drivers and mobility"
  - id: cloud-hypervisors
    description: "How AWS (Nitro: a KVM-based hypervisor and offload cards, ENA and NVMe), Azure (Hyper-V: VMBus devices and an Accelerated Networking virtual function) and Google Cloud (KVM: virtio or gVNIC) build their hosts, and what host maintenance does on each"
