# The checks for "The slow guest". The first boots the learner's VM itself,
# as learner, with ~/bin/shop-vm exactly as it now stands, and keeps what
# the guest printed in /var/tmp/labcheck (outside the learner's files, and
# emptied first, so an old run never counts), with the owner of every VM
# process it saw. The checks after it read that, so the VM boots once per
# run of the checks rather than once per check. A log the learner wrote is
# never read, and a launcher that prints a report without starting a VM, or
# starts it as root, fails real-vm. Booting under emulation took 5 to 10
# seconds on the owner's PC; the 120 leaves room for a busy CI machine.
checks:
  - id: guest-boots
    description: "~/bin/shop-vm, started by learner without sudo, boots the VM, and the guest reports on itself and switches off."
    timeout: 120
    # While the launcher runs, this also notes the owner of every VM process
    # that wasn't there before it started, for real-vm below.
    command: |
      out=/var/tmp/labcheck
      rm -rf "$out"; mkdir -p "$out"; chmod 700 "$out"; : > "$out/vm-users"
      before=" $(pgrep -d ' ' -x qemu-system-x86) "
      runuser -u learner -- /home/learner/bin/shop-vm < /dev/null > "$out/console.log" 2>&1 &
      launcher=$!
      while kill -0 "$launcher" 2> /dev/null; do
        for p in $(pgrep -x qemu-system-x86); do
          case "$before" in *" $p "*) continue ;; esac
          ps -o user= -p "$p" >> "$out/vm-users"
        done
        sleep 0.2
      done
      wait "$launcher"
      tr -d '\r' < "$out/console.log" | sed -n '/=== guest report/,/=== end/p' > "$out/report.txt"
      grep -q '^=== end' "$out/report.txt" && echo "the guest reported and switched off"
    expect:
      contains: "the guest reported"
  - id: real-vm
    description: "The report came from a real VM that ~/bin/shop-vm started, and that VM ran as learner, not as root."
    timeout: 10
    command: |
      users=$(sort -u /var/tmp/labcheck/vm-users | paste -sd ' ')
      if [ -z "$users" ]; then echo "no VM was started"
      elif [ "$users" = learner ]; then echo "a VM ran as learner"
      else echo "the VM ran as $users"
      fi
    expect:
      equals: "a VM ran as learner"
  - id: two-cpus
    description: "The guest has 2 CPUs."
    timeout: 10
    command: grep '^cpus:' /var/tmp/labcheck/report.txt
    expect:
      equals: "cpus: 2"
  - id: memory-1g
    description: "The guest has 1 GiB of memory: the kernel counts between 900,000 and 1,048,576 kB of it."
    timeout: 10
    command: |
      awk -F': ' '$1 == "memory_kb" {print $2}' /var/tmp/labcheck/report.txt
    expect:
      gte: 900000
      lte: 1048576
  - id: nic-paravirtual
    description: "The guest's network card is paravirtual: every card it has is on virtio_net."
    timeout: 10
    command: grep '^nic:' /var/tmp/labcheck/report.txt | awk '{print $3}' | sort -u | paste -sd ' '
    expect:
      equals: "driver=virtio_net"
  - id: disk-paravirtual
    description: "The guest sees the shop's 32 MiB disk as a virtio block device (vda, on virtio_blk)."
    timeout: 10
    command: |
      grep -c -E '^disk: vd[a-z]+ driver=virtio_blk size_mb=32$' /var/tmp/labcheck/report.txt
    expect:
      equals: "1"
  - id: data-private
    description: "The shop's disk image belongs to learner, and the intern account can't read it."
    timeout: 10
    command: |
      f=/srv/shop-vm/shop-disk.img
      [ "$(stat -c %U "$f")" = learner ] || { echo "owned by $(stat -c %U "$f")"; exit 0; }
      if runuser -u intern -- head -c 1 "$f" > /dev/null 2>&1; then echo "intern can read it"; else echo private; fi
    expect:
      equals: private
  - id: data-intact
    description: "The shop's data is still on its disk, where it was: the same 32 MiB image with the same orders on it."
    timeout: 10
    command: |
      f=/srv/shop-vm/shop-disk.img
      [ "$(stat -c %s "$f")" = 33554432 ] && [ "$(head -c 4096 "$f" | sha256sum | cut -d' ' -f1)" = "$(cat /usr/local/share/lab/shop-data.sha256)" ] && echo intact
    expect:
      equals: intact
  - id: guest-untouched
    description: "The guest in /opt/vm is as it was: its kernel and root filesystem are unchanged."
    timeout: 10
    command: sha256sum --check --quiet /usr/local/share/lab/opt-vm.sha256 && echo unchanged
    expect:
      equals: unchanged
  - id: vm-gone
    description: "No VM is left running."
    timeout: 10
    # A process that has ended but whose exit nobody collected (a zombie)
    # still matches pgrep -x; -r R,S,D,T asks only for live ones.
    command: "! pgrep -r R,S,D,T -x qemu-system-x86 > /dev/null"
