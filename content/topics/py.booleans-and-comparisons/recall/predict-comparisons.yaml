id: predict-comparisons
type: predict_output
rev: 1
prompt: |
  What will this program print? Four lines, one per `print`.
code: |
  x = 7
  y = 10
  print(x < y)
  print(x == 7)
  print(x >= y)
  print(type(x < y))
expected_output: |
  True
  True
  False
  <class 'bool'>
explanation: |
  Each comparison is a question with a `True` or `False` answer: 7 is less than 10, 7 is equal to 7, and 7 is not greater than or equal to 10. The last line shows that the answer to a comparison is a value of its own type, `bool`.
skills: [compare, bool-values]
