id: review-mcq-question-or-assignment
type: mcq
rev: 1
prompt: |
  Which of these lines asks a question that Python answers with `True` or `False`?
choices:
  - '`print(score)`'
  - '`score = 100`'
  - '`score == 100`'
  - '`score + 100`'
answer: 2
explanation: |
  Two equals signs ask "is `score` equal to 100?", and the answer is `True` or `False`. One equals sign gives `score` the value 100 without asking anything. `score + 100` works out a number, and `print(score)` shows a value.
skills: [assign-vs-equals]
