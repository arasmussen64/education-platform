id: mcq-equals-signs
type: mcq
rev: 1
prompt: |
  What does the second line print?

  ```python
  x = 5
  print(x == 6)
  ```
choices:
  - '`True`'
  - '`False`'
  - '`6`'
  - 'An error'
answer: 1
explanation: |
  The first line gives `x` the value 5: one equals sign, no question asked. The second line asks a question with two equals signs: "is `x` equal to 6?" The answer is `False`, and that's what gets printed.
skills: [assign-vs-equals, compare]
