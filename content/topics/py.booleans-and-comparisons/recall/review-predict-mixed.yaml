id: review-predict-mixed
type: predict_output
rev: 1
prompt: |
  What will this program print? Four lines, one per `print`.
code: |
  print("5" == 5)
  print(5 == 5.0)
  print("b" != "a")
  print(3 > 3)
expected_output: |
  False
  True
  True
  False
explanation: |
  Text and a number are never equal, so `"5" == 5` is `False`. Numbers compare as numbers whatever their type, so `5 == 5.0` is `True`. `!=` asks whether two values are different, and `"b"` and `"a"` are. `3 > 3` is `False`: 3 isn't greater than itself (`3 >= 3` would be `True`).
skills: [compare, bool-values]
