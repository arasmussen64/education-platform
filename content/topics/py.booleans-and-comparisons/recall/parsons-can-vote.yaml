id: parsons-can-vote
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `True` and then `False`. One line is a decoy that doesn't belong.
lines:
  - 'age = 18'
  - 'can_vote = age >= 18'
  - 'print(can_vote)'
  - 'print(age == 21)'
distractors:
  - 'print(age = 21)'
explanation: |
  `age >= 18` is a comparison, which gives `True` or `False`, and that value is kept in `can_vote` before it's printed. `age == 21` asks a question; `age = 21` would try to assign, which isn't allowed inside `print`. The prints follow the order of the output.
skills: [compare, assign-vs-equals]
