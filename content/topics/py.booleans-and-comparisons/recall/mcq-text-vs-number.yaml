id: mcq-text-vs-number
type: mcq
rev: 1
prompt: |
  You run this program and type `5`. What does it print?

  ```python
  answer = input("Number? ")
  print(answer == 5)
  ```
choices:
  - '`True`'
  - '`5`'
  - '`False`'
  - 'An error'
answer: 2
explanation: |
  `input()` gives text, so `answer` is the text `"5"`. Text and a number are never equal, so the comparison is `False`: no error, just a wrong-looking answer. To compare numbers, convert first: `answer = int(input("Number? "))`.
skills: [bool-values, compare]
