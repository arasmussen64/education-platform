id: build-temperature
stage: build
rev: 1
title: "Temperature check"
prompt: |
  Starting from a blank editor, write a program that asks for a temperature in degrees (it may have decimals) and prints three answers, `True` or `False`: whether it's below zero, whether it's above 30, and whether it's exactly 20. Typing `-2.5` should print:

  ```
  Below zero: True
  Above 30: False
  Exactly 20: False
  ```
skills: [compare, bool-values]
