id: fill-ages
stage: fill_in
rev: 1
title: "Questions about an age"
prompt: |
  This program asks for an age and answers three questions about it. The first question is done. Replace each `...` with a comparison so that typing `18` prints:

  ```
  Adult: True
  Exactly 18: True
  Under 13: False
  ```

  and typing `12` prints `False`, `False`, `True`.
hints:
  - "Each `...` is a comparison between `age` and a number, like the one on line 2."
  - "\"Exactly 18\" asks whether `age` equals 18. Asking uses two equals signs."
  - "\"Under 13\" is `True` for 12 and `False` for 13, so 13 itself is not under 13."
skills: [compare, assign-vs-equals]
