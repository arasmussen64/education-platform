id: write-two-numbers
stage: write
rev: 1
title: "Two numbers, three answers"
prompt: |
  Write a program that asks for two whole numbers and prints three answers about them, `True` or `False`: whether they're the same, whether the first is bigger, and whether they add up to 100. Typing `40` and `60` should print:

  ```
  Same: False
  First is bigger: False
  Add up to 100: True
  ```
hints:
  - "Read each number with `int(input(...))`, so you compare numbers, not text."
  - "Each answer is a comparison printed after its label: `print(\"Same:\", first == second)`."
  - "For the last line, work out the sum first, or compare it directly: `first + second == 100`."
skills: [compare, bool-values]
