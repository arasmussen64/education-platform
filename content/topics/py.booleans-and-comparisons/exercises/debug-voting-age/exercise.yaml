title: "Old enough?"
prompt: |
  This program asks for an age and answers three questions about it. Typing `18` should print:

  ```
  Old enough: True
  Exactly the limit: True
  Teen or older: True
  ```

  and typing `13` should print `False`, `False`, `True`. It has three bugs. Run it, fix what you find, and run it again. Check the answers, not just whether it runs.
skills: [compare, assign-vs-equals, bool-values]
