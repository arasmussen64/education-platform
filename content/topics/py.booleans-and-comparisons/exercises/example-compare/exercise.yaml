id: example-compare
stage: worked_example
rev: 1
title: "Three questions about two numbers"
prompt: |
  This program asks for two whole numbers, then prints the answers to three questions about them. Press **Run**, type two numbers (try `3` and `5`, then `4` and `4`), and read how each line works.
steps:
  - label: "Read two numbers"
    lines: "1-2"
    note: "`int(input(...))`, as in Module 1, so `a` and `b` refer to numbers, not text. Comparing text with a number would never be equal."
  - label: "Ask: are they equal?"
    lines: "3"
    note: "Two equals signs ask a question. `a == b` is `True` if the numbers are the same and `False` if not, and `print` shows that answer after the label."
  - label: "Ask: is the first smaller?"
    lines: "4"
    note: "`<` is another comparison. Every comparison gives `True` or `False`, a value of type `bool`."
  - label: "Ask: are they different?"
    lines: "5"
    note: "`!=` means \"not equal\". For the same two numbers, `a != b` is always the opposite of `a == b`."
