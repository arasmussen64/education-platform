id: py.booleans-and-comparisons
kind: topic
status: ready
title: "Booleans and comparisons"
summary: "Compare values with ==, !=, <, >, <= and >=, and predict True or False."
prerequisites: [py.m1.checkpoint]
estimated_minutes: 40
rev: 1
objectives:
  - "Compare two values with `==`, `!=`, `<`, `>`, `<=` or `>=`, and predict whether the answer is `True` or `False`."
  - "Tell `=`, which gives a name a value, from `==`, which asks whether two values are equal."
  - "Recognize `True` and `False` as values of their own type, `bool`, and know that text and a number are never equal."
