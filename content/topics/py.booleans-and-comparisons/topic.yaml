prove:
  build: build-temperature
  debug: debug-voting-age
  explain:
    prompt: |
      A friend writes this, to check whether someone typed the secret number:

      ```python
      secret = 7
      guess = input("Guess? ")
      print(guess = secret)
      ```

      Python stops with an error. They change `=` to `==`, and now it prints `False` even when they type `7`. In your own words: what's the difference between `=` and `==`, what kind of value does a comparison give, and why is the comparison `False` when they type `7`?
    rubric:
      - id: assign-vs-compare
        required: true
        description: "= gives a name a value; == asks whether two values are equal."
      - id: bool-result
        required: true
        description: "A comparison gives True or False, a value of type bool."
      - id: text-vs-number
        required: true
        description: "input() gives text, so guess is the text \"7\", and text is never equal to the number 7."
      - id: fix
        required: false
        description: "The fix: convert the guess with int(input(...)) before comparing."
    model_answer: |
      A single = gives a name a value: secret = 7 makes secret refer to 7. Two equals signs ask a question: guess == secret means "is guess equal to secret?", and the answer is a value, True or False, whose type is bool. The answer is False even when they type 7 because input() always gives text: guess is the text "7", and text is never equal to a number. To compare numbers, convert first: guess = int(input("Guess? ")), and then guess == secret is True when they type 7.
review_pool:
  - review-predict-mixed
  - review-mcq-question-or-assignment
  - review-code-same-word
  - mcq-equals-signs
  - parsons-can-vote
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: compare
    description: "Compare two values with `==`, `!=`, `<`, `>`, `<=` or `>=` and predict `True` or `False`"
  - id: assign-vs-equals
    description: "Tell `=`, which gives a name a value, from `==`, which asks a question"
  - id: bool-values
    description: "Know `True` and `False` are a type of their own, `bool`, and that text and a number are never equal"
