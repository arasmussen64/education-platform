id: write-dead-and-saturated
stage: write
rev: 1
title: "Counting dead units and saturated inputs"
prompt: |
  Write two diagnostics. `dead_fraction(H)` takes a ReLU layer's outputs for a batch (rows are inputs, columns are units) and returns the share of units that are zero for every input in the batch. `saturated_fraction(Z, threshold=4.0)` takes a layer's pre-activations and returns the share of entries whose size is beyond the threshold (in either direction), where a sigmoid's slope is under 0.02. The program prints:

  ```
  0.5 0.5 0.75
  ```
hints:
  - "A unit is dead for the batch when the largest value in its column is 0; `H.max(axis=0)` gives one number per unit."
  - "Size means absolute value: `np.abs(Z) > threshold` catches -6 as well as 5."
skills: [activations]
