id: fill-he-and-xavier
stage: fill_in
rev: 1
title: "The two scales"
prompt: |
  `xavier_scale(n_in)` keeps a tanh or sigmoid layer's signal the same size; `he_scale(n_in)` does the same for a ReLU layer, which zeroes half of its variance. Replace each `...` with the right numerator so that the program prints:

  ```
  0.1 0.2 1.0
  ```

  The program fails until every `...` is replaced.
hints:
  - "Xavier's variance is 1 over the inputs: the per-layer factor scale times the square root of the inputs comes to exactly 1."
  - "He doubles that variance, because a ReLU keeps only about half of each layer's variance."
skills: [scale]
