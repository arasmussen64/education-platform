# The checks of "the bakery's online orders": as the build's, with this
# design's reference. Zones: the internet, the developers' laptops,
# CardWorks, the bakery's cloud subnet and the kitchen. Scope: the
# shopfront, orders and the saved cards are cde (the bakery takes the card
# on its own form and keeps it); the kitchen's print server is out. The
# weaknesses, in --only's order: admin pages any customer can open (E,
# 3x3: authz or least-privilege), the plain old address (I, 2x3: tls), the
# price from the browser (T, 3x2: input-validation), the saved card
# numbers (I, 2x3: encryption or minimise-data) and unrecorded queries (R,
# 2x2).
checks:
  - id: model-reads
    description: "The model reads: every line is one of the format's."
    timeout: 10
    command: |
      tm-check reads /home/learner/model.tm - <<'REF'
      {"elements":{"customer":["external","internet"],"developer":["external","devs"],"psp":["external","provider"],"shopfront":["process","cloud"],"orders":["process","cloud"],"cards-db":["store","cloud"],"bake-list":["store","kitchen"]},"flows":{"f1":["customer","shopfront"],"f2":["shopfront","orders"],"f3":["orders","psp"],"f4":["orders","cards-db"],"f5":["orders","bake-list"],"f6":["developer","cards-db"]},"weak":[{"flow":"f1","letters":["E"],"L":3,"I":3,"controls":["authz","least-privilege"],"attack":["T1078","T1190"]},{"flow":"f1","letters":["I"],"L":2,"I":3,"controls":["tls"],"attack":["T1557"]},{"flow":"f1","letters":["T"],"L":3,"I":2,"controls":["input-validation"]},{"flow":"f6","letters":["I"],"L":2,"I":3,"controls":["encryption","minimise-data"]},{"flow":"f6","letters":["R"],"L":2,"I":2}],"scope":{"shopfront":"cde","orders":"cde","cards-db":"cde","bake-list":"out"}}
      REF
    expect:
      equals: ok
  - id: design-untouched
    description: "~/design.md is as it was."
    timeout: 10
    command: echo '18c6c2309f2309d38eaea57e66f2bce8be0847d3d0536327d37241bfe57fbf5d  /home/learner/design.md' | sha256sum -c --status - && echo same
    expect:
      equals: same
  - id: diagram-matches-design
    description: "Every part and flow the design names is there, of the right kind, drawn from the side that starts it."
    timeout: 10
    command: |
      tm-check diagram /home/learner/model.tm - <<'REF'
      {"elements":{"customer":["external","internet"],"developer":["external","devs"],"psp":["external","provider"],"shopfront":["process","cloud"],"orders":["process","cloud"],"cards-db":["store","cloud"],"bake-list":["store","kitchen"]},"flows":{"f1":["customer","shopfront"],"f2":["shopfront","orders"],"f3":["orders","psp"],"f4":["orders","cards-db"],"f5":["orders","bake-list"],"f6":["developer","cards-db"]},"weak":[{"flow":"f1","letters":["E"],"L":3,"I":3,"controls":["authz","least-privilege"],"attack":["T1078","T1190"]},{"flow":"f1","letters":["I"],"L":2,"I":3,"controls":["tls"],"attack":["T1557"]},{"flow":"f1","letters":["T"],"L":3,"I":2,"controls":["input-validation"]},{"flow":"f6","letters":["I"],"L":2,"I":3,"controls":["encryption","minimise-data"]},{"flow":"f6","letters":["R"],"L":2,"I":2}],"scope":{"shopfront":"cde","orders":"cde","cards-db":"cde","bake-list":"out"}}
      REF
    expect:
      equals: ok
  - id: zones-where-trust-changes
    description: "Two parts share a zone exactly when one organisation runs both on one network with nothing filtering between them."
    timeout: 10
    command: |
      tm-check boundaries /home/learner/model.tm - <<'REF'
      {"elements":{"customer":["external","internet"],"developer":["external","devs"],"psp":["external","provider"],"shopfront":["process","cloud"],"orders":["process","cloud"],"cards-db":["store","cloud"],"bake-list":["store","kitchen"]},"flows":{"f1":["customer","shopfront"],"f2":["shopfront","orders"],"f3":["orders","psp"],"f4":["orders","cards-db"],"f5":["orders","bake-list"],"f6":["developer","cards-db"]},"weak":[{"flow":"f1","letters":["E"],"L":3,"I":3,"controls":["authz","least-privilege"],"attack":["T1078","T1190"]},{"flow":"f1","letters":["I"],"L":2,"I":3,"controls":["tls"],"attack":["T1557"]},{"flow":"f1","letters":["T"],"L":3,"I":2,"controls":["input-validation"]},{"flow":"f6","letters":["I"],"L":2,"I":3,"controls":["encryption","minimise-data"]},{"flow":"f6","letters":["R"],"L":2,"I":2}],"scope":{"shopfront":"cde","orders":"cde","cards-db":"cde","bake-list":"out"}}
      REF
    expect:
      equals: ok
