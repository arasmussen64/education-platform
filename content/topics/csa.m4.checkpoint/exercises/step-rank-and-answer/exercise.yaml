id: step-rank-and-answer
stage: fill_in
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Step 3 of the model: rank and answer"
hints:
  - "Risk is likelihood times impact. `top` lists every threat of 6 or more, highest first, once each."
  - "A control must stop this threat, not just fit its letter. A password already is one; TLS is already in place; a key encrypted in the repository still has a key somewhere; card codes may not be stored after authorisation even encrypted (PCI DSS 3.3.1)."
  - "The tree: an and node adds its steps; an or node, and the goal, take the cheapest way under them."
prompt: |
  Step 3 of part 1: how much it matters, and what to do. In `~/model.tm` the diagram, the scope and every threat with its likelihood and impact are written. What is left: each threat's risk (the `___` after its impact), the `top` line, a `control` (or an `accept` line where the risk is below 6) for every threat, the two ATT&CK techniques the task names (for the staff sign-in and for the key in the repository), and the tree's `cheapest` cost.

  Part 1's prompt lists the techniques to choose from: `T1110` Brute Force, with `T1110.004` Credential Stuffing; `T1078` Valid Accounts; `T1566` Phishing; `T1190` Exploit Public-Facing Application; `T1195` Supply Chain Compromise; `T1552` Unsecured Credentials, with `T1552.001` Credentials In Files; `T1530` Data from Cloud Storage. `tm-check --help` lists the kinds of control and the letters each answers. Edit the model with `nano ~/model.tm`. Choose, don't list: at most two controls and two techniques on a threat.

  `tm-check reads ~/model.tm` says which line still has a gap or isn't in the format; the checks test the whole model, the parts done for you included. Leave `~/design.md` as it is.
