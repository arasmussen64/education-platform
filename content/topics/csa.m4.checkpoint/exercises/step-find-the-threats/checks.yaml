# The checks of "Step 2 of the model: the threats": each runs one part of the threat-model
# base's tm-check on the learner's model, with the design's own answers
# (the reference) on standard input, so they are never a file in the lab.
# What a failure says never names a flow, a letter or an element; the scope
# check says only whether the scoping is right (--quiet), so its answers
# can't be found by trying one element at a time. --choose caps what a
# model may list. The five answered checks share one description: each is
# one high weakness's control, so a wrong choice brings back one skill,
# and the page never says which weakness is which.
#
# The reference: PayPoint, the storefront on the CDN, the shop's subnet,
# the office and the warehouse are five zones apart from the internet. In
# scope: the storefront is impacting (it serves the page that holds the
# card form), the back office is cde (card numbers pass through it), and
# the orders API, the orders database and the log server are cde (the log
# server holds card numbers and codes, and all three share the back
# office's unfiltered subnet); the stock database is out. The weaknesses,
# in --only's order: the staff sign-in (S, 3x3: mfa, access-proxy or
# mutual-tls, never authn), the hook (S, 3x2: signing or mutual-tls), the
# third party's script (T, 2x3: integrity, PCI DSS 6.4.3), the key in the
# repository (S or I, 2x3: secret-store), card data in the logs (I, 2x3:
# minimise-data, PCI DSS 3.3.1) and refunds nobody signs (R, 2x2).
checks:
  - id: model-reads
    description: "The model reads: every line is one of the format's."
    timeout: 10
    command: |
      tm-check reads /home/learner/model.tm - <<'REF'
