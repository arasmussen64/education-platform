id: step-find-the-threats
stage: fill_in
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Step 2 of the model: the threats"
hints:
  - "Go through the parts one at a time and ask, for each sentence: who could abuse this, on which flow? A password alone on a public address; a hook that takes any caller; a script nothing pins; a key every contractor can read; card numbers in request logs; refunds with no name on them."
  - "The controls name the threats in order: t1 the sign-in (mfa), t2 the hook (signing), t3 the script (integrity), t4 the key (secret-store), t5 the logs (minimise-data), t6 the refunds (audit-log). The letter is the property each breaks."
  - "Rate by the scales: likelihood 3 is anyone with nothing first, 2 needs an account or control of a system first. Impact 3 is card numbers or money, 2 an order or one customer, or a missing record of who did something. A none line takes every other letter of its flow, written together."
prompt: |
  Step 2 of part 1: what can go wrong. In `~/model.tm` the zones, elements, flows and scope lines are written, and so are the controls, the `top` line, the techniques and the tree, which name the threats `t1` to `t6`. What is left: the `threat` lines, `t1` to `t6`, each on the flow where it happens, with its letter and its rating by the design's scales, and a `none` line, with its reason, for every letter of a crossing flow that has no threat.

  Read `~/design.md` for its facts: it never calls anything weak. Edit the model with `nano ~/model.tm`. Until the six threats are there, the lines below them name threats that don't exist yet, and `tm-check reads` says so.

  `tm-check reads ~/model.tm` says which line still has a gap or isn't in the format; the checks test the whole model, the parts done for you included. Leave `~/design.md` as it is.
