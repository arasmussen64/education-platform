      REF
    expect:
      equals: ok
  - id: every-crossing-reviewed
    description: "Every flow that crosses a boundary has all six letters reviewed, and no two threats read the same."
    timeout: 10
    command: |
      tm-check stride /home/learner/model.tm - <<'REF'
      {"elements":{"patient":["external","internet"],"psp":["external","provider"],"portal":["process","cloud"],"billing":["process","cloud"],"invoices-db":["store","cloud"],"terminal":["process","office"],"reception-pc":["process","office"]},"flows":{"f1":["patient","portal"],"f2":["patient","psp"],"f3":["psp","portal"],"f4":["portal","billing"],"f5":["patient","billing"],"f6":["billing","invoices-db"],"f7":["terminal","psp"],"f8":["reception-pc","terminal"]},"weak":[{"flow":"f3","letters":["S","T"],"L":3,"I":2,"controls":["signing"]},{"flow":"f5","letters":["I"],"L":3,"I":2,"controls":["authz"],"attack":["T1190"]},{"flow":"f8","letters":["S"],"L":2,"I":3,"controls":["authn","mfa"],"attack":["T1078"]},{"flow":"f8","letters":["I","T","E"],"L":2,"I":3,"controls":["patch"]},{"flow":"f6","letters":["E"],"L":1,"I":3}],"scope":{"portal":"impacting","billing":"out","invoices-db":"out","terminal":"cde","reception-pc":"cde"}}
      REF
    expect:
      equals: ok
  - id: design-weaknesses-found
    description: "Everything the design describes as weak has a threat on its flow, rated by the design's scales, and none of it is marked as nothing to record; no flow has more than three threats under one letter."
    timeout: 10
    command: |
      tm-check findings /home/learner/model.tm - --choose <<'REF'
