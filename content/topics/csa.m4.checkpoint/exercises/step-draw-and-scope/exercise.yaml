id: step-draw-and-scope
stage: fill_in
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Step 1 of the model: zones and scope"
hints:
  - "One zone for each owner on each network. Who runs PayPoint? Where does the storefront run, and can it reach the shop's subnet? The office and the warehouse are networks of their own. Six zones in all, the internet among them."
  - "An element's zone is the zone of the network and owner it sits in: the four parts on 10.20.1.0/24 share one zone, because one owner runs them with nothing filtering between them."
  - "Scope, in order: does card data pass through it or sit on it (cde)? Does it share an unfiltered network with such a part (cde too)? Could whoever took it over change what happens to card data, such as the page the card form sits in (impacting)? Otherwise, and kept apart, out. Read where the logs come from."
prompt: |
  Step 1 of part 1: where trust changes, and what is in scope. The checkpoint's build, with most of the model done for you: in `~/model.tm` the elements, flows, threats, controls and the tree are written. What is left: the zone lines at the top (one owner, one network, nothing filtering inside), the zone of each element (each `___` on an element line), and the scope of each process and store (each `scope` line's `___`, which becomes the scope word and a reason of five words or more).

  `~/design.md` is the shop's checkout (`less ~/design.md`); the scope words are Compliance basics', and part 1's prompt has them. Edit the model with `nano ~/model.tm`.

  `tm-check reads ~/model.tm` says which line still has a gap or isn't in the format; the checks test the whole model, the parts done for you included. Leave `~/design.md` as it is.
