id: step-the-whole-model
stage: fill_in
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Step 4 of the model: the whole model"
hints:
  - "Work in the outline's order and run `tm-check reads ~/model.tm` after each part: a line can only use names the lines above it define."
  - "Six zones; nine elements; ten flows. Scope by the three questions in order. The six weaknesses each sit in one part's description."
  - "Run the checks after each part: each check is one part of the model, and its message says what kind of thing is still wrong."
prompt: |
  Step 4 of part 1: the whole model, from an outline. `~/model.tm` has only the order of work, as comments. Write the checkout's threat model under them, by part 1's task (its prompt has the format's `scope` line, the scope words, the kinds of control and the techniques to choose from). This is the build itself, with the order of work and the hints: once it passes, the build is the same model.

  `~/design.md` is the shop's checkout (`less ~/design.md`). Edit the model with `nano ~/model.tm`. Choose, don't list: at most three threats on a flow under one letter, two controls and two techniques on a threat.

  `tm-check reads ~/model.tm` says which line still has a gap or isn't in the format; the checks test the whole model, the parts done for you included. Leave `~/design.md` as it is.
