# The orders API. Every request to /v1/ must carry an access token.
<VirtualHost *:443>
  ServerName orders-api.shop.test
  SSLEngine on
  SSLCertificateFile /etc/tls/orders-api.shop.test.crt
  SSLCertificateKeyFile /etc/tls/orders-api.shop.test.key
  LogLevel warn oauth2:info

  ScriptAlias /v1/ /usr/local/lib/shop/v1/
  <Location /v1/>
    AuthType oauth2
    # How the API checks a token's signature: the keys the provider publishes.
    OAuth2TokenVerify jwks_uri https://login.shop.test/realms/shop/protocol/openid-connect/certs
    # Who must have issued the token, and whom it must be for.
    <RequireAll>
      Require oauth2_claim iss:https://login.shop.test/realms/shop
      Require oauth2_claim aud:https://orders-api.shop.test
    </RequireAll>
  </Location>
</VirtualHost>
