# The orders site: staff sign in through the shop's identity provider, and
# the page asks the orders API for their orders with the access token the
# provider gave the site for them.
<VirtualHost *:443>
  ServerName orders.shop.test
  SSLEngine on
  SSLCertificateFile /etc/tls/orders.shop.test.crt
  SSLCertificateKeyFile /etc/tls/orders.shop.test.key
  LogLevel warn auth_openidc:info

  OIDCProviderMetadataURL https://login.shop.test/realms/shop/.well-known/openid-configuration
  OIDCClientID orders-web
  # The client secret and the session passphrase, in a file only root reads.
  Include /etc/apache2/oidc-secret.conf
  OIDCRedirectURI https://orders.shop.test/oidc/callback
  OIDCScope "openid"
  OIDCPKCEMethod S256
  OIDCRemoteUserClaim preferred_username

  ScriptAlias /orders/ /usr/local/lib/shop/orders/
  <Location /oidc/callback>
    AuthType openid-connect
    Require valid-user
  </Location>
  <Location /orders/>
    AuthType openid-connect
    Require claim groups:staff
  </Location>
</VirtualHost>
