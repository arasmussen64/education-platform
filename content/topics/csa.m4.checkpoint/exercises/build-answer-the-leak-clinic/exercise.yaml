# A fresh version of build-answer-the-leak (ADR-0012, further parts). What
# differs from the shop in every part: the business and its service (lab
# results for ward tablets, not gift cards for tills); the key's format
# and name; what leaked (one key, in a settings file and pasted into a
# setup note, so the current files need two changes and only one key is
# rotated; the private key in another folder; no old key), in a history
# of another length; the window, the addresses (a /25 and another /28)
# and a partner's key used from outside; and the figures, which count
# results downloaded rather than dollars issued. The machinery is the
# shop's: the same checks with this story's particulars.
id: build-answer-the-leak-clinic
stage: build
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "The leak at the clinic"
prompt: |
  A fresh version of part 3, in another story: a second try that can't be passed from memory. On 9 November a contractor pushed a copy of Westbrook Clinic's lab-results service's repository to a public mirror, with its whole history, for six and a half hours. This machine is the clinic's lab-results server, and the incident is yours: `/srv/incident/sheet.txt` says what happened and **what must be true when you are done**. Read it first: the checks hold you to it, and to nothing else.

  Every part of the machine, the broken and the working alike:

  - **The results service**, `results.service`, runs `/usr/local/lib/results/results` as the user `results`: `https://results.clinic.test:8443`, where the ward tablets ask for a patient's results (`POST /fetch?count=N`). It fetches them from the laboratory with the clinic's key for the laboratory, read from the file its settings name, for every request. Its settings, `/etc/results/results.conf`, also name the certificate (followed by its chain) and the private key it serves HTTPS with, read when it starts. `journalctl -u results` shows what it did.
  - **The laboratory** is a stand-in for an outside company's API, `medilab.service`, on `127.0.0.1:9460`. Its keys look like `ml_live_` and 32 letters and digits, and the clinic may have several active at once. `mlctl` is the clinic's tool for its account there: `sudo mlctl keys`, `sudo mlctl new` (prints `ID KEY`, once), `sudo mlctl revoke ID`, and `mlctl check`, which says which key is on its standard input and whether it works (`echo "$key" | mlctl check`).
  - **The repository**, `/srv/git/results.git`, which the developers push to; `~/results` is your clone of it. Its hooks folder is yours to write in. git runs a hook called `pre-receive` there once for each push, before anything is accepted, with one line on its standard input for each branch pushed (`OLD NEW REF`, 40 zeros for a branch that is new); if the hook exits with anything but 0, the push is refused. **The clinic's scanner settings** are `/etc/gitleaks/server.toml`: gitleaks' built-in rules and one for the laboratory's keys. gitleaks 8.16 here: `gitleaks detect --source DIR --config FILE` scans a repository's history, `--no-git` the files alone, `--log-opts="RANGE"` the commits `git log RANGE` lists; `-v` prints each finding, `--redact` hides the secret, `--no-banner` the logo, and it exits 1 when it finds something.
  - **The clinic's CA.** The root's certificate is `/srv/ca/public/root.pem`; its key is kept offline, elsewhere. The issuing CA is `/srv/ca/issuing/`, laid out for `openssl ca -config /srv/ca/issuing/ca.cnf` (its database, serial and CRL number, and its key, which root reads), and it publishes its CRL as `/srv/ca/public/issuing.crl`. Every certificate it issues is a server's, with the name the request asks for.
  - **The ward tablets** run `ward-check` before they show results: it connects to the service trusting only the clinic's root, expects the chain, and refuses a certificate the latest published CRL lists. Run it yourself: `ward-check`, or `ward-check HOST:PORT`.
  - **The evidence.** The laboratory sent its trail of every call made with the clinic's keys that day, `/srv/incident/medilab-trail.log`, and the trail's last hash, its anchor, `/srv/incident/medilab-trail.anchor`. Each line is a hash and a record, chained as in Audit logging's labs; `chain-verify LOG ANCHOR` is that topic's verifier.

  **Order matters.** The wards use the service all day: a new key in place before the leaked one dies, and a certificate revoked only with its replacement at hand.

  **Time yourself.** An incident like this should take about 60 minutes. Note the time when you open the lab's shell (`date`). Nothing stops you at 60 minutes: the target is yours to hold yourself to. There are no hints here.

  When the sheet's five points are true, run the checks.
test_skills:
  leaks-listed: [csa.sec.secrets/scan-for-leaks]
  service-issues: [csa.sec.secrets/rotate-and-revoke]
  leaked-keys-dead: [csa.sec.secrets/rotate-and-revoke]
  key-kept-private: [csa.sec.secrets/keep-secrets-out]
  current-files-clean: [csa.sec.secrets/keep-secrets-out]
  push-guard: [csa.sec.secrets/scan-for-leaks]
  old-cert-revoked: [csa.sec.pki/revocation]
  wards-refuse-the-old: [csa.sec.pki/revocation]
  new-cert-served: [csa.sec.pki/run-a-ca, csa.sec.pki/fix-chains]
  key-file-private: [csa.linux.permissions/chmod-chown]
  trail-intact: [csa.sec.audit/hash-chains]
  exposure-right: [csa.sec.audit/what-to-log]
  lasting: [csa.linux.services/systemctl]
