id: mcq-limit-order
type: mcq
rev: 1
prompt: |
  A made-up stock's best ask is $20.40. You place a limit order to buy 100 shares at $20.00. What happens next?
choices:
  - "It buys at once at $20.40, the best price anyone is offering right now"
  - "It waits on the book as a bid until someone will sell at $20.00 or less"
  - "It buys at once at $20.00, and the seller takes the difference"
  - "It is rejected, because a buy limit must not be below the best ask"
answer: 1
explanation: |
  A limit order to buy means "at this price or lower, never higher". Nobody is selling at $20.00 or less right now, so nothing can trade yet, and the order joins the book as a new bid at $20.00. It fills if a seller later comes down to that price, and it may never fill at all. Buying at $20.40 is what a market order would do. No seller is made to accept less than they asked, and an exchange doesn't reject a limit order for being away from the current price: that's the usual way to wait for a better one.
skills: [order-types]
