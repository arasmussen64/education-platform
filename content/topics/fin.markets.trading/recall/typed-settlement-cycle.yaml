id: typed-settlement-cycle
type: typed
rev: 1
prompt: |
  Since 28 May 2024, most US trades in stocks settle one business day after the trade date. Type the short name for that settlement cycle, written as a letter, a sign and a number.
kind: text
answers:
  - "T+1"
mistakes:
  - id: old-cycle
    answers: ["T+2"]
    why: "That was the US cycle from 2017 until 28 May 2024: two business days. It's now one."
  - id: same-day
    answers: ["T+0"]
    why: "That would be settlement on the day of the trade. US stocks settle one business day later."
explanation: |
  T is the trade date and the number counts business days after it, so T+1 means a trade on Monday settles on Tuesday, and one on Friday settles the next Monday. The SEC adopted the change on 15 February 2023 and firms had to follow it from 28 May 2024. A shorter cycle means less time in which one side could fail to pay or deliver, and so smaller deposits at the clearing house.
skills: [order-journey]
