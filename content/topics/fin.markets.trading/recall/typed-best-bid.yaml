id: typed-best-bid
type: typed
rev: 1
prompt: |
  On an order book, one word names the highest price any buyer is offering right now, the price a market order to sell gets. Type that word.
kind: text
answers:
  - "bid"
  - "best bid"
  - "bid price"
mistakes:
  - id: ask
    answers: ["ask", "best ask", "offer", "ask price"]
    why: "The ask (also called the offer) is the lowest price a seller will take: what a market order to buy pays. A seller gets the bid."
  - id: spread
    answers: ["spread"]
    why: "The spread is the gap between the best ask and the best bid, not a price anyone pays."
explanation: |
  The bid is the best a buyer will pay and the ask the least a seller will take, and the ask is always the higher of the two. A market order to sell gets the best bid, and one to buy pays the best ask. Selling at the bid right after buying at the ask loses the spread, the price of trading at once.
skills: [spread]
