id: mcq-settlement-day
type: mcq
rev: 1
prompt: |
  You buy shares of a US company through a US broker at 15:00 on a Friday, and the following Monday is an ordinary business day. When does the trade settle, so that the shares and the money officially change hands?
choices:
  - "At 15:00 on Friday, the moment the orders match"
  - "On Saturday, one calendar day after the trade"
  - "On Monday, one business day after the trade"
  - "On Tuesday, two business days after the trade"
answer: 2
explanation: |
  Since 28 May 2024, most US trades in stocks, bonds and ETFs settle one business day after the trade date, called T+1. Weekends and market holidays don't count, so a Friday trade settles on Monday. The match on Friday is the trade itself: the price and the number of shares are fixed then, but moving the shares and the money between the firms' accounts happens at settlement. Tuesday would have been right under the old rule, T+2, which was the standard from 2017 until May 2024.
skills: [order-journey]
