id: mcq-clearing-house
type: mcq
rev: 1
prompt: |
  Your broker sends your order to buy 100 shares, and it is matched with a stranger's order to sell. Between the trade and settlement, which firm promises that the trade completes even if the other side's broker goes bust?
choices:
  - "The exchange where the two orders were matched"
  - "The company whose shares are being traded"
  - "The clearing house, which stands between the two sides"
  - "Your own broker, which holds the shares in your account for you"
answer: 2
explanation: |
  The clearing house steps into the middle of every trade it clears: it becomes the seller to the buyer's broker and the buyer to the seller's broker, so each side relies on the clearing house, not on a stranger. To make that promise safely it asks its member brokers for deposits that grow with the risk of what they've traded (in the US, for stocks, the clearing house is the NSCC). The exchange only matches orders; it guarantees nothing afterwards. The company whose shares change hands takes no part in the trade at all. Your broker holds your account, but it's one of the two sides the promise protects against.
skills: [order-journey]
