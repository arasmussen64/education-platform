id: contrast-market-or-limit
type: mcq
rev: 1
prompt: |
  A thinly traded made-up stock is quoted at a bid of $8.00 and an ask of $8.60. Ana sends a market order to buy 100 shares; Ben sends a limit order to buy 100 shares at $8.20. Which is true?
choices:
  - "Ana is sure to trade but not sure of her price; Ben is sure of his price but not sure to trade"
  - "Ana is sure of her price but not sure to trade; Ben is sure to trade but not sure of his price"
  - "Both are sure to trade at once, Ana at $8.60 and Ben at $8.20, since the book has sellers"
  - "Both wait on the book until the price settles between $8.00 and $8.60, so neither trades yet"
answer: 0
explanation: |
  A market order is about time: it trades now, against whatever asks are there. Ana pays at least $8.60 and more if the 100 shares have to come from higher asks, so she knows she'll trade but not exactly at what price. A limit order is about price: Ben pays $8.20 or less, never more, but no one is selling that low right now, so his order rests on the book as a bid and may never fill. That's the whole trade-off, and on a thin book with a wide spread, as here, the difference between the two is large.
skills: [order-types, spread]
