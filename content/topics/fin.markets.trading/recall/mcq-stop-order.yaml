id: mcq-stop-order
type: mcq
rev: 1
prompt: |
  You own shares of a made-up stock trading at $50 and place a sell stop order at $45. Overnight, bad news comes out, and the next morning the stock's first trade is at $41. What happens to your order?
choices:
  - "It sells at $45, the price you set, as a stop order promises"
  - "It does nothing, because the price jumped past $45 without trading there"
  - "It becomes a market order and sells near $41, below your stop price"
  - "It becomes a limit order at $45 and waits for the price to recover"
answer: 2
explanation: |
  A stop order sleeps until the stop price is reached, then becomes a market order. A trade at $41 is at or below $45, so the stop is triggered, and a market order sells at the best bid available then, somewhere near $41. A stop limits a loss only when prices move smoothly; when they jump, as they can overnight, it sells below the stop. Nothing promises the stop price itself. A price that gaps through the stop still triggers it. What waits at $45 is a stop-limit order, a different order that may never sell at all.
skills: [order-types]
