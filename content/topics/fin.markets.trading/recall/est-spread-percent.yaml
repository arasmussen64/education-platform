id: est-spread-percent
type: estimate
rev: 1
prompt: |
  A small made-up company's shares are quoted at a bid of $39.80 and an ask of $40.20. What is the spread as a percentage of the middle price, halfway between the bid and the ask? Exactly.
unit: "%"
answer: 1
tolerance: { absolute: 0 }
given: { bid: 39.80, ask: 40.20 }
working: (ask - bid) / ((bid + ask) / 2) * 100
amounts: made-up
mistakes:
  - id: dollars
    value: 0.4
    working: ask - bid
    why: "That's the spread in dollars, $0.40. As a percentage, divide it by the middle price, $40.00, and multiply by 100."
  - id: half
    value: 0.5
    working: (ask - bid) / 2 / ((bid + ask) / 2) * 100
    why: "That's half the spread, the distance from the middle to either side. The spread is the whole gap from bid to ask."
explanation: |
  The spread is $40.20 − $39.80 = $0.40 and the middle is ($39.80 + $40.20) ÷ 2 = $40.00, so the spread is 0.40 ÷ 40.00 = 1% of the price. A percentage makes spreads comparable across prices: a $0.40 spread is huge on a $4 share (10%) and tiny on a $400 one (0.1%). Large, busy companies' shares often trade with spreads of a few hundredths of a percent; a 1% spread says few people are trading this one.
skills: [spread]
