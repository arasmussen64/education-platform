- term: broker
  aliases: [broker-dealer]
  definition: "A firm licensed to trade securities on its customers' behalf. Your order goes to a broker, which sends it on to an exchange or fills it another way."
- term: clearing house
  aliases: [clearinghouse]
  definition: "A firm that stands between the two sides of every trade it clears, promising each that the trade completes, and asks brokers for deposits to back that promise."
- term: settlement
  definition: "The moment a trade is completed: the shares move to the buyer's broker and the money to the seller's. US stocks settle one business day after the trade (T+1)."
- term: bid-ask spread
  definition: "The gap between the lowest price a seller will take (the ask) and the highest a buyer will pay (the bid). Buying and selling at once loses it."
- term: market order
  definition: "An order to buy or sell now at the best price available. It is sure to trade but not sure of its price."
- term: limit order
  definition: "An order to buy at a set price or lower, or sell at a set price or higher. It is sure of its price but may never trade; what can't trade waits on the book."
- term: stop order
  aliases: [stop-loss order]
  definition: "An order that waits until the price reaches a set level, the stop price, and then becomes a market order. It can fill well past the stop when prices jump."
- term: order book
  definition: "The list of limit orders waiting at an exchange for one security: bids from the highest down, asks from the lowest up."
