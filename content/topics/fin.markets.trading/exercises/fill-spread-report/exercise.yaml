id: fill-spread-report
stage: fill_in
rev: 1
title: "A spread report"
prompt: |
  Three made-up stocks are quoted with a best bid and a best ask. Replace each `...` with an operator so the program prints each stock's spread, and the spread as a percentage of the middle price (halfway between the bid and the ask):

  ```
  ABC: spread 0.04, 0.16% of the middle
  TINY: spread 0.20, 6.25% of the middle
  BIG: spread 1.00, 0.67% of the middle
  ```

  Every `...` stands for an operator, so until all three are replaced Python can't run the program at all, and shows a syntax error. Keep the `quotes` line as it is: the checks run your program with other quotes too.
hints:
  - "The spread is the ask minus the bid: the ask is the higher of the two."
  - "Halfway between two numbers is their sum divided by 2."
  - "A part as a percentage of a whole is the part divided by the whole, times 100."
skills: [spread]
