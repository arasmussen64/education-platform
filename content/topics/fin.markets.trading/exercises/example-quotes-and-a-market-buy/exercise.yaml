id: example-quotes-and-a-market-buy
stage: worked_example
rev: 1
title: "A quote, and a market order that walks the book"
prompt: |
  This program reads the best bid, the best ask and the spread from a made-up order book, then works out what a market order to buy 500 shares really pays. Press **Run**, then read how each part works.
steps:
  - label: "The book"
    lines: "1-11"
    note: "Each side is a list of dictionaries, one per price, already sorted best first: the highest bid and the lowest ask lead their lists. These are limit orders other people left waiting. The numbers are made up."
  - label: "The quote"
    lines: "13-17"
    note: "The best bid (99.95) is the most anyone will pay right now and the best ask (100.05) the least anyone will sell for. The spread is the gap between them, 0.10, and the middle, 100.00, is the price you'd call fair if you had to pick one."
  - label: "A market order walks the book"
    lines: "19-27"
    note: "A market order says \"now, at whatever price\". It takes the cheapest ask first: only 200 shares are offered at 100.05, so the other 300 come from the next price, 100.10. `min(wanted, order[\"shares\"])` takes all of an order or just what's still wanted, whichever is smaller; once `wanted` reaches 0 every later `taken` is 0, and the `if` keeps those out of the printout."
  - label: "What it cost"
    lines: "29-30"
    note: "500 shares cost 50,040.00, an average of 100.08 a share, 0.08 above the middle on every share. That 40.00 is the price of trading right now. A bigger order, or a book with fewer shares at each price, walks further and pays more."
