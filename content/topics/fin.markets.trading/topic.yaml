prove:
  build: build-match-a-market-order
  debug: debug-market-sell
  explain:
    prompt: |
      A friend sees that a small company's shares last traded at $4.00 and sends a market order to buy 5,000 of them. The order fills at an average of $4.30. They think the app cheated them. In your own words: what is a market order, and what does it trade against? Why can it pay much more than the last price shown, especially for a thinly traded stock? Make up a small order book that would give a result like theirs, with numbers. And what could they have done differently?
    rubric:
      - id: market-order
        required: true
        description: "A market order trades at once against the limit orders resting on the book: a buy takes the best (lowest) ask first, then the next best, until it's filled."
      - id: last-price
        required: true
        description: "The last price is where someone traded before, not a price anyone is offering now; the order pays the asks that are on the book when it arrives."
      - id: thin-book
        required: true
        description: "A thinly traded stock has a wide spread and few shares at each price, so a big market order walks the book to higher and higher asks; gives a made-up book whose average fill is well above the last price, with the arithmetic."
      - id: alternative
        required: true
        description: "A limit order caps the price (at the cost of maybe not filling), or a smaller order, or looking at the spread and the book's size before trading."
      - id: spread
        required: false
        description: "Names the bid-ask spread as the gap between the best bid and best ask, and notes that even a small order pays the ask, above the middle."
    model_answer: |
      A market order says "buy now, at whatever price it takes". It trades against the limit orders other people have left resting on the order book: a buy is matched with the lowest ask first, and if that order doesn't have enough shares, with the next lowest, and so on until all 5,000 shares are bought. The $4.00 on the screen was the last price, where someone happened to trade earlier; nobody was promising to sell 5,000 shares at it. A thinly traded stock has few people offering shares, so the spread between bid and ask is wide and there are only a few hundred shares at each price. Say the book held 1,000 shares at $4.10, 1,500 at $4.20, 1,500 at $4.40 and 1,000 at $4.50. The order takes all of them: $4,100 + $6,300 + $6,600 + $4,500 = $21,500 for 5,000 shares, an average of $4.30, 7.5% above the last price. The app didn't cheat; the order walked the book. They could have used a limit order, say to buy at up to $4.15, which would have bought what was offered at that price or below and left the rest waiting as a bid, at the risk of not getting all the shares; or bought in smaller pieces over time; or simply looked at the bid, the ask and how many shares sat at each price before pressing buy.
