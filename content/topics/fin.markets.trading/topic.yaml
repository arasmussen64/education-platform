title: "How a trade happens"
summary: "An order's journey from a broker to an exchange, a clearing house and settlement; market, limit and stop orders; the bid, the ask and the spread; and a small order book that matches orders, built in Python."
prerequisites:
  - fin.markets.instruments
  - py.dictionaries
estimated_minutes: 85
rev: 1
objectives:
  - "Follow an order from a broker to an exchange, a clearing house and settlement, and say what T+1 means in the US."
  - "Tell market, limit and stop orders apart: which is sure to trade and which is sure of its price."
  - "Read a bid, an ask and the spread, and work out what a market order really pays."
  - "Match orders in a small order book of your own: best price first, then earliest."
