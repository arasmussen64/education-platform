id: mcq-what-a-likelihood-is
type: mcq
rev: 1
prompt: |
  You flip a coin 8 times and see 6 heads. `L(p) = p**6 * (1 - p)**2` is the coin's likelihood. What is `L(0.75) = 0.0111`?
choices:
  - 'The probability that the coin''s bias is 0.75, given the eight flips you saw'
  - 'The probability of those eight flips if the bias were 0.75: the data''s probability as a function of `p`'
  - 'The fraction of the time the coin lands heads, which the six heads in eight flips estimate as 0.75 exactly'
  - 'The probability that the bias is at least 0.75, since six of eight is the smallest count that would suggest it'
answer: 1
explanation: |
  A likelihood keeps the data fixed and lets the parameter move: it is how probable your observations were under each candidate `p`. It is not a probability of `p` itself (that needs a prior and Bayes' rule), and the likelihoods of different `p` don't sum to 1. Maximum likelihood picks the `p` that made the data most probable, 0.75.
skills: [likelihood]
