id: review-mcq-divide-by-n
type: mcq
rev: 1
prompt: |
  The maximum-likelihood estimate of a normal's spread from a sample divides the sum of squared deviations by `n`; the textbook's sample standard deviation divides by `n - 1`. Which does `np.std(x)` compute by default, and which is the maximum-likelihood one?
choices:
  - '`np.std` divides by `n - 1`, which is the maximum-likelihood estimate, because the mean was estimated from the same data'
  - '`np.std` divides by `n`, which is the maximum-likelihood estimate; `n - 1` gives a slightly larger one'
  - 'They are the same number for any sample larger than 30, which is why the distinction is only taught for small samples'
  - '`np.std` divides by `n`, but the maximum-likelihood estimate divides by `n - 1`, since the likelihood accounts for the lost degree of freedom'
answer: 1
explanation: |
  NumPy's default (`ddof=0`, the option that says how much to subtract from `n` before dividing) divides by `n`, and that is what maximizing the normal's likelihood gives. The `n - 1` version (`ddof=1`) corrects a small tendency to come out too low and is what Module 1's textbook used; the two differ by the factor `sqrt(n / (n - 1))`, noticeable for small samples and not for large ones, but never identical.
skills: [fit]
