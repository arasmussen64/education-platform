id: mcq-what-cross-entropy-assumes
type: mcq
rev: 1
prompt: |
  A classifier is trained by minimizing cross-entropy. Seen as maximum likelihood, what is that loss assuming about the labels?
choices:
  - 'That the labels are normally distributed around the model''s output, with the same spread for every example, as in least squares'
  - 'That there are equally many 1s and 0s, so that the log of `p` and the log of `1 - p` carry equal weight'
  - 'That each label is an independent Bernoulli draw with the model''s `p`: the loss is minus the log of their joint probability'
  - 'Nothing: cross-entropy is a convention with no model behind it, chosen because its gradient is simple'
answer: 2
explanation: |
  Minus the log of `Π p^y (1 - p)^(1 - y)` is `-Σ [y log p + (1 - y) log(1 - p)]`, the cross-entropy sum. So minimizing it maximizes the likelihood of the labels under the assumption that each is an independent coin flip with the model's probability. The normal assumption belongs to squared error; nothing about the class balance is assumed.
skills: [losses]
