id: mcq-why-the-log
type: mcq
rev: 1
prompt: |
  Why maximize the log-likelihood instead of the likelihood itself?
choices:
  - 'Because the log keeps the same maximizer and turns the product into a sum'
  - 'Because the log-likelihood is always positive, which makes it easier to compare across models of different sizes'
  - 'Because the log makes the maximum larger, so the optimizer has a bigger target to find'
  - 'Because the likelihood of a continuous variable can''t be computed without a log, since densities are not probabilities'
answer: 0
explanation: |
  A thousand probabilities each below 1 multiply to something like `1e-300`, which a float can't hold; their logs add to a manageable negative number, and each term differentiates on its own. Nothing about the answer changes, because the log keeps order: whatever made the likelihood largest makes its log largest. (Log-likelihoods are usually negative, not positive.)
skills: [maximize]
