id: parsons-age-label
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Age: 30` and then `<class 'int'>`. One line is a decoy that doesn't belong.
lines:
  - 'age = 30'
  - 'text = "Age: " + str(age)'
  - 'print(text)'
  - 'print(type(age))'
distractors:
  - 'text = "Age: " + age'
explanation: |
  `age` has to exist before `str(age)` can use it, and `text` before it's printed. The two prints follow the order of the output. `"Age: " + age` would try to add text and a number, which is a `TypeError`: `str()` turns the number into text first.
skills: [plus-by-type, identify-types]
