id: predict-plus
type: predict_output
rev: 1
prompt: |
  What will this program print?
code: |
  print(2 + 3)
  print("2" + "3")
expected_output: |
  5
  23
explanation: |
  `+` does different things depending on the types. With two numbers it adds: `2 + 3` is `5`. With two strings it joins them: `"2" + "3"` is the text `"23"`. The quotes make all the difference.
skills: [plus-by-type]
