id: review-mcq-quoted-decimal
type: mcq
rev: 1
prompt: |
  What type is this value?

  ```python
  "3.5"
  ```
choices:
  - '`float`'
  - '`str`'
  - '`int`'
  - 'Both `float` and `str`'
answer: 1
explanation: |
  The quotes make it text, a `str`, even though what's inside looks like a decimal number. Without the quotes, `3.5` would be a `float`. A value has exactly one type.
skills: [identify-types]
