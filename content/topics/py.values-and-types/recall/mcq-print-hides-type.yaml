id: mcq-print-hides-type
type: mcq
rev: 1
prompt: |
  Both lines of this program print `5`.

  ```python
  print(5)
  print("5")
  ```

  What's the difference between them?
choices:
  - 'None: `5` and `"5"` are the same value.'
  - 'Line 2 shows the quotes, so it prints `"5"`.'
  - 'Line 1 is an error, because text needs quotes.'
  - 'Line 1 prints an `int` and line 2 prints a `str`. They only look the same once printed.'
answer: 3
explanation: |
  `5` is a number (an `int`) and `"5"` is text (a `str`). They're different values, but `print` never shows the quotes, so both appear as `5`. And line 1 isn't an error: `5` is a number, not a name like the `Hello` from the last topic. To find out which one you have, print its type: `print(type("5"))` shows `<class 'str'>`.
skills: [identify-types]
