id: mcq-which-type
type: mcq
rev: 1
prompt: |
  What type is this value?

  ```python
  7.0
  ```
choices:
  - '`int`, because 7 is a whole number'
  - '`str`, because it has a dot in it'
  - '`float`, because it has a decimal point'
  - 'It has no type: only text has a type'
answer: 2
explanation: |
  A decimal point makes a number a `float`, even when the part after the point is zero. `7` would be an `int`, and `"7.0"`, in quotes, would be a `str`. Every value has a type, numbers included.
skills: [identify-types]
