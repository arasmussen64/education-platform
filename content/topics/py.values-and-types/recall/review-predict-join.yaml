id: review-predict-join
type: predict_output
rev: 1
prompt: |
  What will this program print?
code: |
  print("4" + "4")
  print(4 + 4)
  print(type("4" + "4"))
expected_output: |
  44
  8
  <class 'str'>
explanation: |
  Joining two strings makes a longer string: `"4" + "4"` is `"44"`, and it's still a `str`. Adding two numbers gives a number: `4 + 4` is `8`.
skills: [plus-by-type, identify-types]
