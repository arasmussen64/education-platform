id: write-mixed-values
stage: write
rev: 1
title: "Add, join, and check"
prompt: |
  Write a program with three `print` lines that show:

  1. the number `10` plus the number `5`;
  2. the text `"10"` joined to the text `"5"` with `+`;
  3. the type of the value `10.5`.

  It should print exactly:

  ```
  15
  105
  <class 'float'>
  ```
hints:
  - "For line 1, put `+` between two numbers, with no quotes."
  - "For line 2, put both pieces in quotes, so `+` joins them."
  - "For line 3, put `type(...)` inside `print(...)`."
skills: [plus-by-type, identify-types]
