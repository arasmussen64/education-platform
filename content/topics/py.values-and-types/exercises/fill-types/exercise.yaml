id: fill-types
stage: fill_in
rev: 1
title: "One of each type"
prompt: |
  Replace each `...` with a value of the right type, so the program prints:

  ```
  <class 'int'>
  <class 'float'>
  <class 'str'>
  ```

  Any value of the right type will do.
hints:
  - "A whole number has no quotes and no decimal point, like `7`."
  - "A decimal point makes a `float`, like `7.5`."
  - 'Quotes make text, like `"seven"`.'
skills: [identify-types]
