id: build-type-report
stage: build
rev: 1
title: "A type report"
prompt: |
  Starting from a blank editor, write a program that reports the type of three values: the number `12`, the number `12.5`, and the text `"12"`. It should print exactly:

  ```
  12 is <class 'int'>
  12.5 is <class 'float'>
  12 is <class 'str'>
  ```

  Use `type()` to find each type, rather than typing the types out yourself.
skills: [identify-types]
