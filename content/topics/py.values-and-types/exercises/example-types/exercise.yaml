id: example-types
stage: worked_example
rev: 1
title: "Asking Python for a type"
prompt: |
  This program asks Python for the type of four values. Press **Run**, then read how each line works.
steps:
  - label: "Text is a str"
    lines: "1"
    note: "`type(...)` gives the type of the value in its parentheses, and `print` shows it. Python writes `<class 'str'>`: just read the name in quotes. `str` means a string, which is text."
  - label: "A whole number is an int"
    lines: "2"
    note: "No quotes and no decimal point, so `42` is an `int`, an integer."
  - label: "A decimal point makes a float"
    lines: "3"
    note: "`3.5` has a decimal point, so it's a `float`."
  - label: "Quotes make text, even for digits"
    lines: "4"
    note: 'The quotes make `"42"` a `str`, not a number. It only looks like one.'
