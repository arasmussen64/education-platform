prove:
  build: build-type-report
  debug: debug-fruit-receipt
  explain:
    prompt: |
      A friend wrote a calculator. It asks for two numbers, adds them and prints the result. They type `1` and `2`, and it prints `12`.

      In your own words: why does it print `12` instead of `3`, and what should they change?
    rubric:
      - id: input-is-text
        required: true
        description: "What the user types arrives as text (a str), even when it looks like a number."
      - id: plus-joins-text
        required: true
        description: "With text, + joins the pieces, so \"1\" + \"2\" makes \"12\"; with numbers it adds."
      - id: convert
        required: true
        description: "The fix: turn the text into numbers first, for example with int(...), then add."
      - id: check-type
        required: false
        description: "Mentions checking what kind of value you have, for example with type()."
    model_answer: |
      Whatever someone types comes into the program as text, a string, even if it looks like a number. The + sign joins strings together, so "1" + "2" makes "12", while 1 + 2 with real numbers makes 3. The fix is to turn the text into numbers before adding, for example int("1") gives the number 1. Printing type() of the values would show they were str, not int.
review_pool:
  - review-mcq-quoted-decimal
  - review-predict-join
  - review-type-printer
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: identify-types
    description: "Tell `str`, `int` and `float` apart, and check with `type()`"
  - id: plus-by-type
    description: "Predict what `+` does: add numbers, join text"
