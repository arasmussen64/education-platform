id: csa.hw.cpu-architectures
kind: topic
status: draft
title: "CPU architectures"
summary: "What a CPU runs, and why a program built for one architecture won't start on another; x86-64 and 64-bit Arm, and the Arm chips the three clouds rent out (Graviton, Cobalt, Axion, Ampere); what has to be rebuilt to move a service to Arm; and what the move really saves, from price lists."
# Module 2 keeps Module 1's checkpoint as its gate through Hypervisors
# (docs/plans/cloud-module-2/MODULE-2-BRIEF.md, section 2). The lesson also
# leans on Module 1's processes and memory topics (exit status 128 plus a
# signal), packages (dpkg), containers (images and tags), scripting and
# shell (find, grep, awk, case in a script), all inside that gate.
prerequisites: [csa.hw.hypervisors]
estimated_minutes: 290
rev: 1
objectives:
  - "Say what an instruction set is, and why a compiled program runs on one architecture only while a script or bytecode moves as it is."
  - "Read the architecture of a machine, a program file and a container image: `uname -m`, `dpkg --print-architecture`, `file`, and an image's index."
  - "Tell the two failures apart, the wrong architecture (`Exec format error`) and the right one with a missing feature (`Illegal instruction`), and build for the oldest CPU in a fleet."
  - "Sort a deployment's parts into runs as it is, rebuild, get it from the vendor, and can't move yet."
  - "Name the Arm families on AWS, Azure and Google Cloud, read an instance type's name, and say what runs on them."
  - "Work out what Arm saves from price lists (the percentage, a fleet's month and the months to pay back the work), and say what has to be measured before promising it."
