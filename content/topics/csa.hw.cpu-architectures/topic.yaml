# Facts the lesson and the items rest on, each read on 2026-11-11:
# - Graviton2 Neoverse N1 (no SVE), Graviton3 V1 (SVE), Graviton4 V2 (SVE2),
#   Graviton5 V3 (M9g): github.com/aws/aws-graviton-getting-started, README.
# - "Every vCPU on a Graviton processor maps to a physical core" and no SMT;
#   interpreted and JIT languages run as they are, C, C++ and Go must be
#   built for arm64: the transition guide.
# - Graviton instances "cost up to 20% less" than comparable x86 ones, and
#   M6g "up to 40% better price performance over M5": aws.amazon.com/ec2/
#   graviton/ and aws.amazon.com/ec2/instance-types/m6g/.
# - "Graviton processors only support Linux operating systems":
#   docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html.
# - AWS name letters: g Graviton, a AMD, i Intel: docs.aws.amazon.com/ec2/
#   latest/instancetypes/instance-type-names.html. Default threads per core:
#   m7i.large 2, m7g.large and m7a.large 1: docs.aws.amazon.com/AWSEC2/
#   latest/UserGuide/cpu-options-supported-instances-values.html.
# - Cobalt 100: Neoverse N2, 3.4 GHz, a physical core per vCPU, guests up to
#   Windows 11 Client and no Windows Server (page updated 2025-07-03):
#   learn.microsoft.com/en-us/azure/virtual-machines/sizes/cobalt-overview.
#   Azure name letters a AMD, p Arm, s premium SSD: vm-naming-conventions
#   (updated 2026-02-26). Azure's next Arm series, Dpsv7, is in the price
#   list (D2ps_v7 $0.114, Linux and Windows meters) but has no documentation
#   page yet (404) and is in preview, so nothing here names it.
# - Google: C4A on Axion (Neoverse V2), N4A on Axion (Neoverse N3), T2A on
#   Ampere Altra, a vCPU a whole core with no SMT: docs.cloud.google.com/
#   compute/docs/instances/arm-on-compute and general-purpose-machines. N4A
#   generally available since 2026-01-27: cloud.google.com/blog/products/
#   compute/axion-based-n4a-vms-now-in-preview (its update note). Windows
#   client images aren't supported on N4A, C4A or T2A, and the Arm images
#   listed are all Linux: docs.cloud.google.com/compute/docs/images/os-details.
# - x86-64-v2, v3 (AVX2), v4 (AVX-512); "Programs that use newer CPU
#   instructions might not run on older CPUs": the Red Hat post (updated
#   2024-02-05).
# - Docker Desktop builds under emulation with no setup; plain Linux
#   installs QEMU with tonistiigi/binfmt: the Docker page above.
# - The SQL Server image mcr.microsoft.com/mssql/server:2022-latest has no
#   index and is amd64 only, and Docker 29.8.2 answers a linux/arm64 run with
#   "was found but does not provide the specified platform (linux/arm64)":
#   read from the registry and run on the owner's PC.
# - On the owner's PC (Docker Desktop, Docker 29.8.2) an arm64 program
#   started directly in a lab container failed with "cannot execute binary
#   file: Exec format error", exit status 126; earlier the designer saw one
#   run, through an emulator registered with the kernel. No check depends
#   on which.
# Prices (on-demand, Linux, US dollars an hour), read 2026-11-11: AWS from
# the price file behind https://aws.amazon.com/ec2/pricing/on-demand/ for US
# East (N. Virginia), published 2026-11-10T17:38:52Z; Azure from
# https://prices.azure.com/api/retail/prices for East US; Google from
# https://cloud.google.com/products/compute/pricing/general-purpose for Iowa
# (us-central1). The write lab's 2026-11.csv holds every one used.
#
# The quick questions read uname, dpkg, file, unzip and image indexes with
# the text tools of Shell essentials, and the sums are estimate questions
# (ADR-0024) and awk. Every lab is a plain lab on an x86-64 machine with a
# cross-compiler for Arm and QEMU's emulator for one Arm program, so a
# program built for Arm is tested by naming the emulator, the same on
# every machine (ADR-0017, ADR-0018). No checked docker buildx lab before
# Module 6 (the Module 2 plan).
