skills:
  - id: read-arch
    description: "Read the architecture of a machine (`uname -m`, `dpkg --print-architecture`), of a file (`file`, and what's inside an archive) and of an image (the platforms in its index); know that amd64 is x86-64 and aarch64 is arm64"
  - id: instruction-sets
    description: "What an instruction set is; why a binary runs on one architecture (`Exec format error`); what an emulator does and costs; feature levels within one architecture and `Illegal instruction`; building for the oldest CPU"
  - id: rebuild-inventory
    description: "Sort a deployment into runs as it is, rebuild, vendor and can't move: scripts and bytecode, compiled programs, native extensions and libraries inside archives, images, agents, licensed software"
  - id: arm-families
    description: "The Arm families on AWS, Azure and Google Cloud and their generations; reading an instance type's name; what runs on them"
  - id: price-performance
    description: "Percent saved at equal size, a fleet's monthly saving and the months to pay back the work, from dated price lists; why price per vCPU isn't price per unit of work; when Arm isn't the cheaper choice"
