prove:
  explain:
    prompt: |
      Your manager has read that Arm instances are 40% cheaper and wants the whole estate moved next quarter: a Go API, a Python service that uses packages with compiled parts, a Java application, a monitoring agent bought from a vendor, and a SQL Server database on Windows Server. Explain, in your own words: what an instruction set is and why a program built for x86-64 won't start on Arm, with the two error messages you'd expect to meet and what each means; which of the five parts run unchanged, which must be rebuilt, which need something from a vendor and which can't move yet; what the Arm families are called on AWS, Azure and Google Cloud and what a vCPU is on them; and what the saving really is at list price, what you'd measure before promising it, and how you'd roll the move out.
    rubric:
      - id: instruction-set
        required: true
        description: "A CPU family understands one set of instructions; a compiled program holds those instructions as machine code, so an x86-64 binary fails on Arm with Exec format error before it starts; interpreted programs and bytecode move if their interpreter or runtime exists for Arm."
      - id: inventory
        required: true
        description: "Go: rebuild for arm64. Python: the code runs as it is, the packages' compiled parts need arm64 builds. Java: bytecode runs on an Arm JVM unless a jar carries a native library. The vendor's agent: only the vendor can supply an arm64 build. SQL Server on Windows Server: stays on x86-64 for now (no Windows Server on the clouds' Arm types, and an amd64-only image)."
      - id: families
        required: true
        description: "Graviton on AWS (a g after the generation, like m8g), Cobalt (and Ampere Altra) on Azure (a p in the size, like D4ps_v6), Axion and Ampere Altra on Google Cloud (C4A, N4A, T2A); a vCPU there is a whole physical core, where on most Intel types it is one of a core's two hyperthreads."
      - id: money
        required: true
        description: "At list price and equal size, Arm is typically 15 to 30% below the same generation's Intel type (7 to 31% across the three clouds on the day this was written), not 40%: that figure is a claim about price performance; and Arm isn't always cheaper (an older or cost-optimised x86 type can list below it). Measure throughput or requests per dollar on the real workload under load, and count the cost of the work against the monthly saving."
      - id: feature-level
        required: false
        description: "The second error, Illegal instruction (signal 4, exit status 132): a build that uses instructions an older chip of the same architecture lacks, like SVE on Graviton2; build for the oldest CPU in the fleet."
      - id: rollout
        required: false
        description: "Start with stateless parts built from open source; run x86 and Arm side by side, move a few servers first and compare; build images for both architectures so either kind of machine can run them."
    model_answer: |
      A CPU carries out one small operation at a time, and the list of operations a family of CPUs understands, each written as a number, is its instruction set. Intel and AMD chips use x86-64, also called amd64; Arm chips use 64-bit Arm, also called aarch64 or arm64. A compiled program like the Go API is machine code for one of them, translated from its source ahead of time, so the x86-64 build won't start on an Arm server: the kernel reads the file's header and refuses with "Exec format error". The second message to expect is "Illegal instruction", exit status 132, which means the architecture is right but the program uses an instruction this particular chip doesn't have, such as SVE vectors built in for Graviton3 and run on a Graviton2. The answer to that is to build for the oldest CPU in the fleet. Scripts and bytecode are different: they're read by an interpreter or a runtime, and they move as long as an Arm build of that exists.

      So, part by part. The Go API must be rebuilt for arm64, which for Go is the same build with another target. The Python service's own code runs as it is on an Arm Python, but its packages with compiled parts need their arm64 builds, which for popular packages usually exist. The Java application's bytecode runs on an Arm Java runtime, unless one of its jars carries a native library, which then needs an arm64 version. The vendor's monitoring agent is machine code we don't have the source of, so only the vendor can give us an arm64 build; until they do, those servers stay. The SQL Server database can't move yet: the clouds' Arm types run Linux (Azure also runs Windows 11 on Cobalt, the desktop edition), none offers Windows Server on Arm, and Microsoft's SQL Server image is amd64 only.

      The Arm chips are Graviton on AWS, named with a g after the generation, like m8g; Cobalt 100 on Azure, and Ampere Altra there too, named with a p in the size, like D4ps_v6; and Axion and Ampere Altra on Google Cloud, the C4A, N4A and T2A series. On all of them a vCPU is a whole physical core, while on most Intel types a vCPU is one of a core's two hyperthreads, so two vCPUs of each aren't the same hardware.

      The money: at list price, the same size on Arm is usually 15 to 30% cheaper than the same generation of Intel; AWS's own page says up to 20%. The 40% is a claim about price performance, work done per dollar, and it may or may not hold for our services. It isn't always cheaper either: Google's cost-optimised x86 type lists below its Arm ones. Before promising anything I'd run each service on both under real load and compare requests per second per dollar, and put the engineering time against the monthly saving to see how long it takes to pay back. Then I'd move the stateless open-source parts first, a few servers at a time beside the x86 ones, with images built for both architectures, and widen it once the numbers agree.
