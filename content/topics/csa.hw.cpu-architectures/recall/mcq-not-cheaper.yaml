id: mcq-not-cheaper
type: mcq
rev: 1
prompt: |
  A batch tier on Google Cloud runs on `e2-standard-2` (x86-64, 2 vCPUs, 8 GiB). Someone proposes `c4a-standard-2` (Axion, 2 vCPUs, 8 GiB) "because Arm is cheaper". On-demand list prices for Linux in Iowa, read on 2026-11-11 from Google's price page:

  ```
  e2-standard-2     0.0670 dollars an hour
  c4a-standard-2    0.0898 dollars an hour
  ```

  What's the right reply?
choices:
  - "At list price the Arm type costs a third more; compare the types you'd really run, then measure"
  - "Arm is cheaper per vCPU on every cloud, so the move saves money whatever these two prices say"
  - "The Arm type costs more an hour but needs no licence, so it still comes out cheaper by the month"
  - "The Arm type's price includes its disk and the x86 one's doesn't, so these two can't be compared"
answer: 0
explanation: |
  0.0898 minus 0.0670 = 0.0228 dollars more an hour, 34% more than today. Arm isn't a price class. The saving the clouds advertise is against x86 types of the same generation and kind: `n4a-standard-2` is 15% below `n4-standard-2`. `e2` is Google's cost-optimised series, and at this size it lists below every Arm type Google sells. Neither price includes a disk, and Linux on either needs no licence.

  C4A might still do this batch work faster per dollar: its vCPUs are whole cores and newer ones. The only way to know is to run the batch on both and compare cost per job. "Arm is cheaper" is a reason to measure, never a reason to move.
skills: [price-performance]
