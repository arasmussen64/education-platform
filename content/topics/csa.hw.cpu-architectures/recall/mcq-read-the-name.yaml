id: mcq-read-the-name
type: mcq
rev: 1
prompt: |
  Each list holds one instance type from AWS, one from Azure and two from Google Cloud. Which list has only Arm types in it?
choices:
  - "`m8g.large`, `Standard_D4ps_v6`, `c4a-standard-4`, `t2a-standard-2`"
  - "`m7a.large`, `Standard_D4ps_v6`, `c4a-standard-4`, `t2a-standard-2`"
  - "`m8g.large`, `Standard_D4as_v6`, `c4a-standard-4`, `t2a-standard-2`"
  - "`m8g.large`, `Standard_D4ps_v6`, `c4d-standard-4`, `t2a-standard-2`"
answer: 0
explanation: |
  Each cloud says "Arm" in its own place in the name. **AWS:** a `g` straight after the generation number, for Graviton: `m8g` is general purpose (`m`), generation 8, Graviton (Graviton4). **Azure:** a `p` among the small letters after the vCPU count: `D4ps_v6` is the D family, 4 vCPUs, `p` for an Arm processor (here Cobalt 100), `s` for premium disks, version 6. **Google Cloud:** the series name itself: C4A and N4A are Axion, T2A is Ampere Altra.

  The trap is the letter `a`. On AWS and Azure a small `a` means AMD, an x86 maker: `m7a.large` and `Standard_D4as_v6` are x86-64. On Google Cloud the `A` at the end of a series means Arm and a `D` means AMD: `c4d-standard-4` is x86-64. Each wrong list swaps in one of those look-alikes.
skills: [arm-families]
