id: arch-two-names
type: predict_shell
rev: 1
prompt: |
  Each architecture has two names. `names.txt` pairs the kernel's name for it (what `uname -m` prints) with the name Debian and Ubuntu packages use (what `dpkg --print-architecture` prints). `uname.txt` holds what `uname -m` printed on a cloud server. The command looks the server's name up in the pairs. What does it print?
files:
  names.txt: |
    x86_64 amd64
    aarch64 arm64
  uname.txt: |
    aarch64
command: awk -v m="$(cat uname.txt)" '$1 == m {print $2}' names.txt
expected_output: |
  arm64
explanation: |
  `$(cat uname.txt)` is `aarch64`, so awk prints the second word of the line whose first word is `aarch64`: `arm64`. The server is 64-bit Arm, and to its package manager it's `arm64`. `aarch64` and `arm64` are one architecture, as `x86_64` and `amd64` are one: the kernel and the compilers say `aarch64` and `x86_64`; Debian, Ubuntu, Docker and Go say `arm64` and `amd64`. A package, a download or an image built for `arm64` is what this server needs. Reading `amd64` as "only for AMD processors" is a common slip: it is the name of the whole 64-bit x86 architecture, Intel's chips included, because AMD designed it.
skills: [read-arch]
