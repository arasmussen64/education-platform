# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: instruction set
  definition: The list of operations a family of CPUs understands, and the numbers that stand for them. Also called its architecture; x86-64 and 64-bit Arm are the two clouds rent out.
- term: machine code
  definition: A program as the CPU reads it, a long run of numbers that each stand for one instruction of one instruction set. It runs only on CPUs of that set.
- term: compiler
  definition: A program that translates source code, once and ahead of time, into one architecture's machine code. Its output is a binary.
- term: cross-compile
  aliases: [cross-compiler]
  definition: To compile on one architecture a program for another, such as building an Arm binary on an x86-64 machine, with no emulator needed.
- term: x86-64
  aliases: [amd64]
  definition: The 64-bit instruction set of Intel's and AMD's processors. The kernel calls it `x86_64`; Debian, Docker and Go call it `amd64`.
- term: arm64
  aliases: [aarch64, 64-bit Arm]
  definition: The 64-bit Arm instruction set, used by AWS Graviton, Azure Cobalt 100, Google Axion and Ampere Altra. The kernel calls it `aarch64`.
- term: instance type
  definition: One size of machine a cloud rents out, with its vCPUs, memory and price. Sizes of the same design make a family, and each generation runs on newer chips.
- term: image index
  aliases: [multi-architecture image]
  definition: A list a container registry keeps under one tag, with one image for each platform, such as `linux/amd64` and `linux/arm64`. A runtime picks the one for its own platform.
