skills:
  - id: choose-the-balancer
    description: "Layer 4 or layer 7, a proxy or a pass-through balancer, for a given flow: what each can see and do (paths, headers, cookies, ending or passing the TLS, protocols that aren't HTTP or whose server speaks first, the client's address through X-Forwarded-For or the PROXY protocol); choosing a server (round robin, weighted, least connections, hashing, and source hashing behind NAT); the clouds' balancers by kind"
  - id: health-checks
    description: "What a check should test (the server, not a shared dependency: liveness, local health, dependency checks); interval, timeout and the two thresholds; hysteresis against flapping; what HAProxy and each cloud do when every server fails at once (503, fail open, no new flows); the clouds' probe rules"
  - id: failover-math
    description: "The numbers: how long a refused or a hung server keeps its traffic and how long a recovered one waits, for HAProxy (it waits inter after each check ends) and for balancers that check on a fixed clock; flaps an hour from a failure rate; the load on the survivors and the servers N+1 needs; how long a rolling deploy waits on draining"
  - id: drain-and-stick
    description: "Drain, wait for the sessions to finish, maintenance, patch, ready; deregistration delay and connection draining on each cloud; sticky sessions by cookie or by the client's address, what they cost (uneven load, everyone behind one NAT on one server, sessions lost with a server), and how stickiness meets draining"
  - id: read-the-balancer
    description: "HAProxy's own state through its runtime API (show stat's status, scur, stot and chkdown; show servers state's operational and administrative states) and its log (DOWN and UP with their reasons, no server available, NOSRV); state set at runtime against the configuration, which wins at a reload or restart"
