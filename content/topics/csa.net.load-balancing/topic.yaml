prove:
  build: build-shop-balancer
  debug: debug-errors-every-few-minutes
  explain:
    prompt: |
      A shop runs three web servers behind a load balancer, with cookie stickiness, and a stock service that isn't HTTP. Last night a routine restart of the database took the whole shop offline for half a minute, although the front page doesn't use the database, and all week the on-call engineer has watched one server "blinking" in and out. Explain, in your own words: whether the web traffic and the stock service each need a layer 4 or a layer 7 balancer, and why; what the health check should test, and why the database restart took every server out at once; how long a dead and a hung server keep getting traffic with the settings you would choose, with the numbers; why a server blinks in and out, and how to stop it without blinding the balancer; how you would take a server out for patching without hurting anyone, and how sticky sessions change that; and what any two of AWS, Azure and Google Cloud would have done differently when every server failed its check.
    rubric:
      - id: l4-l7
        required: true
        description: "A layer 7 balancer reads the HTTP request (paths, headers, cookies) and usually ends the TLS, so the web traffic with cookie stickiness needs it; the stock service isn't HTTP (and its server speaks first), so it needs layer 4 (mode tcp, or a pass-through balancer); a proxy hides the client's address unless it adds X-Forwarded-For or sends the PROXY protocol, while a pass-through balancer keeps it."
      - id: what-to-check
        required: true
        description: "Check the server itself (liveness or local health), not the shared database: a check on something every server shares fails on every server at once when it blips, leaving the balancer nothing to send to, so even pages that don't need the database fail."
      - id: timing
        required: true
        description: "With HAProxy, a server that refuses connections is out after about fall x inter, one that hangs after about fall x (inter + timeout), and a recovered one is back after about rise x inter, with any correct numbers (for example 3 x 2 = 6 s, 3 x (2 + 2) = 12 s, 2 x 2 = 4 s); or a cloud's sums, such as an ALB's 2 x 30 + 5 = 65 s for a hung target."
      - id: flapping
        required: true
        description: "A check that fails now and then, acted on after one failure, flaps; require several failures in a row to go down and several successes to come back (hysteresis), rather than removing the checks or slowing them down, which would leave a hung server in rotation."
      - id: drain
        required: true
        description: "Drain (no new visitors, open sessions finish), wait for its sessions to reach zero, then maintenance, patch, ready; a sticky visitor keeps reaching a draining HAProxy server until maintenance moves them; and state set through the runtime API must also go in the configuration (disabled) to last a restart."
      - id: clouds
        required: true
        description: "Any two correct, for example: an AWS ALB or NLB fails open and sends to all targets; Azure Load Balancer sends no new flows and lets established TCP flows continue; Google's Application Load Balancers answer 503; or the defaults differ (ALB every 30 s, out after 2, back after 5; Google 5 s, 2 and 2; Azure Load Balancer every 5 or 15 s, and an HTTP probe down at the first non-200)."
      - id: n-plus-one
        required: false
        description: "When one of N servers fails, the rest carry its share, so size the fleet for the peak on N - 1 servers (four at 60% become three at 80%)."
    model_answer: |
      The web traffic needs a layer 7 balancer. Stickiness by cookie means reading each request's cookie, which is inside the HTTP request, and over HTTPS inside the TLS, so the balancer ends the TLS and reads the request; it can then route by path and add X-Forwarded-For, because as a proxy it opens its own connections and the servers would otherwise see only its address. The stock service isn't HTTP, and its server speaks first: an HTTP proxy would wait for a request that never comes. So it needs layer 4, HAProxy's mode tcp or a pass-through balancer, which passes the bytes along without reading them (a pass-through one also keeps the client's address; a TCP proxy needs the PROXY protocol for that).

      The health check should test the server itself: that its process answers, and its own disk and threads are fine, like the /livez page in the labs. Last night's check must have asked the database, which all three servers share. When the database restarted, every server failed its check at the same moment, the balancer took them all out, and it had nothing left to send even the front page to, so everyone got 503 for half a minute. With a shallow check, only the pages that need the database would have failed, and only while it was away.

      I'd check every 2 seconds, out after 3 failures in a row, back after 2 good checks: inter 2s fall 3 rise 2 in HAProxy. A server that dies and refuses connections is out after about 3 x 2 = 6 seconds. One that hangs makes each check wait its timeout, which is inter unless timeout check is set, so it's out after about 3 x (2 + 2) = 12 seconds, and its customers wait meanwhile. A recovered server is back after about 2 x 2 = 4 seconds.

      The blinking server fails a check now and then, and the balancer acts on a single failure (fall 1 rise 1), so it goes out and comes back again and again, moving its visitors each time. The fix is hysteresis: three failures in a row to go down, two successes to come back. Removing its check, or setting fall 10, would stop the blinking but leave a hung server in rotation for a long time.

      To patch a server, I'd drain it so new visitors go elsewhere, wait until its sessions reach zero, put it in maintenance, patch it, and make it ready again. With sticky sessions, HAProxy's drain still sends a visitor whose cookie names that server back to it, so their basket survives until they finish, and only maintenance moves them. Anything set through the runtime API is lost at the next restart, so a server that must stay out goes in the configuration as disabled.

      If every server fails its check at once, an AWS Application Load Balancer fails open and sends to all of them anyway, which would have hidden last night's mistake by luck. Azure Load Balancer sends no new flows and lets established TCP flows continue, and Google's Application Load Balancers answer 503, as HAProxy did. Finally, with three servers, losing one puts its share on two, so the fleet must carry the peak on two.
