id: csa.net.load-balancing
kind: topic
status: ready
title: Load balancing
summary: "Spread traffic across servers and keep it away from broken ones: layer 4 or layer 7, a proxy or a pass-through balancer, and what each can see; choosing a server; health checks that test the server and not what it shares, with the seconds a dead or hung server keeps its traffic; what each cloud does when every server fails; flapping and hysteresis; draining, stickiness and N+1; and reading HAProxy's own state and log."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2,
# 3.7 and 5, topic 34) and its designer's brief (csa.net.load-balancing.md).
# Through csa.net.http-semantics (proxy, upstream, 502 and 503, the cookie)
# and csa.net.http-tls (HTTP requests and headers, TLS and its certificate,
# SNI) this builds on csa.net.transport (a load balancer in one sentence,
# connections and idle timers), csa.net.nat (a device that opens connections
# in its own name hides the client's address; many people behind one NAT
# address), csa.net.layers (layers 4 and 7; the network labs' machines, on
# and name@machine services) and Module 1 (curl, nc, systemd units, signals,
# journalctl, awk -F, and scripts with arguments).
prerequisites: [csa.net.http-semantics]
# Worked out: the lesson about 31 minutes (about 4,000 words with its tables
# and the configuration, at 130 a minute), the assigned reading about 50
# (HAProxy's Starter Guide section 2, 1,850 words, 14; Yanacek's sections,
# about 3,300 words, 25; Google's proxy and passthrough section 6; AWS's ALB
# health-check page's table and fail-open paragraph 5), 21 quick items at
# 1.5 each 32, then the worked example 35, the fill-in 25, the write 35, the
# build 60, the debug 45 and the explain 20: about 340. The plan's 315 is
# kept (MODULE-3-BRIEF.md, topic 34): the lesson's tables stand in for the
# clouds' own pages, which are under More resources and not assigned.
estimated_minutes: 315
rev: 1
objectives:
  - "For a given flow, choose a layer 4 or a layer 7 balancer, a proxy or a pass-through one, and say what each can see and change: paths, headers, cookies, TLS, the client's address, protocols that aren't HTTP or whose server speaks first. Name each cloud's balancers by kind."
  - "Configure HAProxy from an empty file: a frontend, backends with round robin and a path rule, a TCP listener, health checks, cookie stickiness and X-Forwarded-For, started at every boot."
  - "Design a health check that tests the server and not what it shares, and work out how long a dead or a hung server keeps its traffic and how long a recovered one waits, for HAProxy and for the clouds' defaults; say what each cloud does when every server fails its checks at once."
  - "Take a server out without hurting anyone (drain, wait, maintenance), and say how stickiness, by cookie or by address, and each cloud's draining settings change that; size a fleet so it survives losing one server."
  - "Diagnose a misbehaving balancer from its runtime API and its log: a fleet taken down by a check on a shared dependency, a server flapping in and out, a server taken out by hand that comes back at the next restart."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - HAProxy 2.8 (Ubuntu 24.04's 2.8.30; the manuals at docs.haproxy.org/2.8
#   are 2.8.31): fall defaults to 3, rise to 2, inter to 2000 ms; inter "also
#   serves as a timeout for health checks ... if timeout check is not set";
#   with it, min(timeout connect, inter) to connect and timeout check to
#   read (configuration manual). set server ... state drain "only removes
#   the server from load balancing but still allows it to be checked and to
#   accept new persistent connections"; maint "disables any traffic to the
#   server as well as any health checks"; show stat fields 4 scur, 7 stot,
#   17 status, 21 chkfail, 22 chkdown, 23 lastchg (numbered from 0);
#   srv_admin_state 0x01 forced maintenance, 0x04 maintenance because of the
#   configuration, 0x08 forced drain (management guide, 9.1 and 9.3).
#   option forwardfor: "the server must be configured to always use the last
#   occurrence of this header only". disabled: the server starts "marked down
#   in maintenance mode". balance source: "the same client IP address will
#   always reach the same server". The Starter Guide, section 2: the two
#   kinds of balancer, DSR, health checks that "may even validate that the
#   server still works and that the database it relies on is still
#   accessible", stickiness and the shopping cart.
#   https://docs.haproxy.org/2.8/configuration.html,
#   https://docs.haproxy.org/2.8/management.html,
#   https://docs.haproxy.org/2.8/intro.html
# - Tried in this topic's labs on the network-lab base (HAProxy 2.8.30,
#   Docker Desktop, 2026-11-12): a reload resets show info's Start_time_sec
#   and Uptime_sec (a new worker, a new Pid), which the checks compare with
#   the file's modification time; HAProxy's check is "GET /livez HTTP/1.0"
#   with no other header; a refused server is DOWN after about fall x inter
#   (web3: 6 s), a frozen one after about fall x (inter + timeout) (web2:
#   12 s with inter 2s fall 3, 7.8 s with timeout check 1s, its checks'
#   SYNs every inter + timeout); the deep check took all three servers DOWN
#   and the front page answered 503; a fast 503 on every fourth check
#   flapped fall 1 and never fall 2; drain kept the sticky visitor; a
#   download ran on through maint; a reload undid maint set through the
#   API; disabled shows administrative state 5, and set server ... state
#   ready then puts the server back in rotation until the next reload; a
#   server-speaks-first service gave nothing through mode http.
# - AWS ALB health checks: interval 30 s, timeout 5 s (instance and IP
#   targets), healthy 5, unhealthy 2, path /, success code 200; "Each health
#   check request is independent", the answer time "does not affect the
#   interval for the next health check request"; fails open:
#   https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
# - AWS NLB health checks: TCP by default, interval 30 s, timeout 6 s (HTTP)
#   or 10 s (TCP, HTTPS), healthy 5, unhealthy 2, success 200-399; fails
#   open; an unhealthy target's client connections get a TCP RST unless it
#   fails open; "targets receive more than the configured number of health
#   checks":
#   https://docs.aws.amazon.com/elasticloadbalancing/latest/network/target-group-health-checks.html
# - AWS ALB attributes: deregistration delay 300 s, done early with nothing
#   in flight; a new request for a draining target goes to a healthy one;
#   AWSALB, expiry 7 days, not configurable; round robin (default), least
#   outstanding requests, weighted random:
#   https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
# - AWS NLB attributes: client IP preservation on for instance targets and
#   IP targets with UDP (and QUIC), off for IP targets with TCP and TLS;
#   proxy protocol version 2; deregistration delay 300 s, at least 120 s
#   recommended; "all clients behind the same NAT device have the same source
#   IP address":
#   https://docs.aws.amazon.com/elasticloadbalancing/latest/network/edit-target-group-attributes.html
# - Azure Load Balancer health probes (ms.date 2026-09-04): TCP, HTTP, HTTPS;
#   all instances probe down, "No new flows are sent to the backend pool",
#   Standard keeps established TCP flows; interval 5 s by default in the
#   portal, 15 s through ARM templates, the REST API, the CLI and PowerShell,
#   minimum 5; HTTP probe timeout 30 s; HTTP explicit answers "immediately
#   mark the probe as up or down"; a fluctuating probe makes it wait longer
#   before marking up; fail the probe on purpose to drain; 168.63.129.16:
#   https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
# - Azure Load Balancer distribution modes (ms.date 2026-05-19): 5-tuple hash
#   by default; Client IP (2-tuple), Client IP and protocol (3-tuple);
#   "Clients that run behind proxies might be seen as one unique client":
#   https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
# - Azure Application Gateway's default probe (ms.date 2026-08-03): interval
#   30 s, timeout 30 s, unhealthy threshold 3, 200 to 399 healthy, host
#   127.0.0.1; one good probe marks a server healthy:
#   https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-probe-overview
# - Google Cloud (each page "Last updated 2026-11-10 UTC", CC BY 4.0 by its
#   footer): health checks 5 s interval, 5 s timeout, thresholds 2 and 2;
#   all backends unhealthy: Application Load Balancers 503, classic 502,
#   proxy Network Load Balancers end new client connections, passthrough
#   ones drop all traffic if their failover policy says so and otherwise
#   spread it across unhealthy backends as a last resort, and the global
#   external passthrough one fails over to the next-nearest region
#   (https://docs.cloud.google.com/load-balancing/docs/health-check-concepts);
#   connection draining 0 to 3,600 s, unset or 0 "as quickly as possible"
#   (https://docs.cloud.google.com/load-balancing/docs/enabling-connection-draining);
#   "Proxy load balancers don't preserve client IP addresses by default",
#   passthrough ones "don't terminate client connections"
#   (https://docs.cloud.google.com/load-balancing/docs/choosing-load-balancer);
#   a five-tuple hash by default
#   (https://docs.cloud.google.com/load-balancing/docs/backend-service); the
#   external Application Load Balancer appends the client's and then its own
#   address to X-Forwarded-For
#   (https://docs.cloud.google.com/load-balancing/docs/https).
# - nginx's active health checks: "This module is available as part of our
#   commercial subscription":
#   https://nginx.org/en/docs/http/ngx_http_upstream_hc_module.html
# - David Yanacek, "Implementing health checks" (2019-12-05, now on
#   builder.aws.com): liveness, local health and dependency checks; trouble
#   when a check "fails for a non-critical reason" and the failure "is
#   correlated across servers"; fail open.
