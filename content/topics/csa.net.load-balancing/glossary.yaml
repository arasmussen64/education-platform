# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: virtual IP
  aliases: [VIP]
  definition: An address that belongs to a service rather than to any one server. Clients connect to it, and the load balancer behind it chooses a server for each connection or request.
- term: health check
  definition: A load balancer asking each server, every few seconds, whether it's all right, and taking it out of rotation after a set number of failures in a row.
- term: X-Forwarded-For
  definition: A request header a layer 7 proxy adds with the client's own address, so the server behind it can see who is asking. Read the value your own balancer added.
- term: PROXY protocol
  definition: A short header a load balancer sends at the start of a TCP connection with the client's address, for any protocol. The server must be set up to expect it.
- term: sticky sessions
  aliases: [session affinity]
  definition: Keeping one visitor on one server, by a cookie or by the client's address. It costs even load, and every session on a server is lost when it dies.
- term: fail open
  definition: "What AWS's load balancers do when every server fails its health checks: send traffic to all of them anyway, as if all were healthy."
- term: hysteresis
  definition: Needing more evidence to change state than to keep it, such as several failed checks in a row to take a server out, so a server that fails now and then doesn't flap.
- term: draining
  aliases: [connection draining]
  definition: "Taking a server out gently: no new visitors are sent to it, and the connections it already has are left to finish before it is stopped."
