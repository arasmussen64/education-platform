id: mcq-which-is-pass-through
type: mcq
rev: 1
prompt: |
  Which of these describes a cloud load balancer correctly?
choices:
  - "Azure Load Balancer passes the packets through, so the servers see the client's address"
  - "AWS's Application Load Balancer passes the packets through, so the servers see the client"
  - "Azure Application Gateway is a layer 4 balancer, so it can't read a request's path or cookies"
  - "Google's Application Load Balancers keep the client's address on every connection by default"
answer: 0
explanation: |
  Azure Load Balancer is a pass-through, layer 4 balancer: it hashes each connection to a backend instance (the 5-tuple by default) and forwards the packets, so the servers see the client's own address.

  AWS's Application Load Balancer is a layer 7 proxy: it ends the client's connection and opens its own, and passes the client's address on in `X-Forwarded-For`. Azure Application Gateway is layer 7 too, which is why it can route by path. And Google says it plainly: its proxy load balancers, the Application Load Balancers among them, "don't preserve client IP addresses by default"; its passthrough Network Load Balancers do.
skills: [choose-the-balancer]
