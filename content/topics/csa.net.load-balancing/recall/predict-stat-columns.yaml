id: predict-stat-columns
type: predict_shell
rev: 1
# Constructed: HAProxy 2.8's show stat format (its first 24 fields, as
# HAProxy's management guide, section 9.1, numbers them), with made-up
# numbers. Pinned 2026-11-12 in Git Bash (gawk) and Ubuntu 24.04's mawk
# 1.3.4.
prompt: |
  `stat.csv` is the first 24 fields of HAProxy's `show stat` for the shop's balancer (constructed: HAProxy's real format, made-up numbers). The first line names the fields. The command prints, for each web server, its name, its status, how many times it has gone from UP to DOWN, and how many sessions it has served. What is printed?
files:
  stat.csv: |
    # pxname,svname,qcur,qmax,scur,smax,slim,stot,bin,bout,dreq,dresp,ereq,econ,eresp,wretr,wredis,status,weight,act,bck,chkfail,chkdown,lastchg
    shop,FRONTEND,,,2,9,262143,260,24120,49660,0,0,0,,,,,OPEN,,,,,,
    web,web1,0,0,1,3,,96,8928,18336,,0,,0,0,0,0,UP,1,1,0,0,0,412
    web,web2,0,0,0,2,,68,6324,12988,,0,,0,0,0,0,UP,1,1,0,9,9,1
    web,web3,0,0,1,3,,96,8868,18336,,0,,0,0,0,0,UP,1,1,0,0,0,412
    web,BACKEND,0,0,2,9,,260,24120,49660,0,0,,0,0,0,0,UP,3,3,0,,0,412
command: |
  awk -F, '$1 == "web" && $2 != "BACKEND" {print $2, $18, $23, $8}' stat.csv
expected_output: |
  web1 UP 0 96
  web2 UP 9 68
  web3 UP 0 96
explanation: |
  `-F,` splits each line at its commas. `$1 == "web"` keeps the lines of the backend called `web`, and `$2 != "BACKEND"` drops the backend's own total line, leaving the three servers. Field 18 is `status`, 23 `chkdown` (UP-to-DOWN transitions) and 8 `stot` (sessions served). The header line's first field is `# pxname`, not `web`, so it's left out too.

  Read the answer as an operator would: all three are UP *now*, but web2 has gone down 9 times, its `lastchg` (field 24) says it changed state 1 second ago, and it has served fewer sessions than the others. It's **flapping**: in and out of rotation, each time moving its visitors. A status that says UP hides that; `chkdown` and `lastchg` show it. The next question is why its checks fail now and then, and whether `fall` is high enough that a single failure doesn't take it out.
skills: [read-the-balancer, health-checks]
