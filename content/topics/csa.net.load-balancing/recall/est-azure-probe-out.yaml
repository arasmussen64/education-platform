id: est-azure-probe-out
type: estimate
rev: 1
# Azure Load Balancer health probes, read 2026-11-12: the portal's default
# interval is 5 s, the CLI's, templates' and PowerShell's 15 s; a TCP probe
# fails once the interval passes with no answer; the threshold counts
# consecutive failures:
# https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
prompt: |
  A team created an Azure Load Balancer's TCP health probe with the Azure CLI, leaving the interval at the CLI's default, and set the probe threshold to 2. A backend instance hangs just after a probe it passed: it no longer completes TCP handshakes. A TCP probe fails once the interval has passed with no answer. How many seconds after that passing probe does the load balancer stop sending it new flows? Exactly.
unit: seconds
answer: 30
tolerance: { absolute: 0 }
given: { threshold: 2 }
working: threshold * 15
mistakes:
  - id: portal-default
    value: 10
    working: threshold * 5
    why: "5 seconds is the default when a probe is made in the Azure portal. Made with the CLI, a template or PowerShell, it's 15 seconds."
  - id: one-probe
    value: 15
    working: "15"
    why: "That's one failed probe. A threshold of 2 means two failures in a row."
explanation: |
  Made from the CLI, the probe checks every 15 seconds (5 in the portal). Each probe of the hung instance fails when the next one is due, and two in a row take it out: 2 × 15 = 30 seconds. Established TCP flows to it continue, as Azure's Standard Load Balancer does whenever an instance's probe goes down; only new flows go elsewhere. The same probe made in the portal would take 10 seconds, so a team that set up two environments two ways can see two different failover times.
skills: [failover-math]
