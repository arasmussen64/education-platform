id: est-azure-probe-out
type: estimate
rev: 1
# Azure Load Balancer health probes (ms.date 2026-09-04), read 2026-11-12:
# the portal's default interval is 5 s, the CLI's, templates' and
# PowerShell's 15 s; "TCP probe timeout duration: N/A (probes will fail once
# the configured probe interval duration is passed and the next probe is
# sent)"; for TCP probes, "2 consecutive failures or timeouts are required"
# with a threshold of 2:
# https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
prompt: |
  A team created an Azure Load Balancer's TCP health probe with the Azure CLI, leaving the interval at the CLI's default, and set the probe threshold to 2. A backend instance hangs just after a probe it passed: it no longer completes TCP handshakes. A TCP probe that gets no answer counts as failed once the interval has passed and the next probe is sent. How many seconds after that passing probe does the load balancer stop sending it new flows? Exactly.
unit: seconds
answer: 45
tolerance: { absolute: 0 }
given: { threshold: 2 }
working: (threshold + 1) * 15
mistakes:
  - id: failed-when-sent
    value: 30
    working: threshold * 15
    why: "That counts each probe as failed the moment it is sent. A TCP probe fails only when the next one goes out, so the second failure is counted one interval later."
  - id: portal-default
    value: 15
    working: (threshold + 1) * 5
    why: "5 seconds is the default when a probe is made in the Azure portal. Made with the CLI, a template or PowerShell, it's 15 seconds."
explanation: |
  Made from the CLI, the probe goes out every 15 seconds (5 in the portal). The probes sent at 15 and 30 seconds get no answer, and each counts as failed only when the next probe goes out, at 30 and 45 seconds. The second failure in a row takes the instance out: (2 + 1) × 15 = 45 seconds. Established TCP flows to it continue, as Azure's Standard Load Balancer does whenever an instance's probe goes down; only new flows go elsewhere. The same probe made in the portal would take (2 + 1) × 5 = 15 seconds, so a team that set up two environments two ways can see two very different failover times.
skills: [failover-math]
