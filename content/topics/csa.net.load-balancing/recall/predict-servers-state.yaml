id: predict-servers-state
type: predict_shell
rev: 1
# Captured on 2026-11-12 from this topic's write lab (HAProxy 2.8.30 on the
# network-lab base) after "set server web/web2 state drain" and "set server
# web/web3 state maint"; HAProxy's answer ends with an empty line, left out
# here. Pinned in Git Bash (gawk) and Ubuntu 24.04's mawk 1.3.4.
prompt: |
  `servers-state.txt` is HAProxy's answer to `show servers state web` (captured from this topic's write lab). Its first line is the format's version and its second names the columns. The command prints each server's name, whether it is up, and what an operator has set it to. What is printed?
files:
  servers-state.txt: |
    1
    # be_id be_name srv_id srv_name srv_addr srv_op_state srv_admin_state srv_uweight srv_iweight srv_time_since_last_change srv_check_status srv_check_result srv_check_health srv_check_state srv_agent_state bk_f_forced_id srv_f_forced_id srv_fqdn srv_port srvrecord srv_use_ssl srv_check_port srv_check_addr srv_agent_addr srv_agent_port
    3 web 1 web1 10.0.1.11 2 0 1 1 18 15 3 4 6 0 0 0 - 8080 - 0 0 - - 0
    3 web 2 web2 10.0.1.12 2 8 1 1 18 15 3 4 6 0 0 0 - 8080 - 0 0 - - 0
    3 web 3 web3 10.0.1.13 0 1 1 1 1 15 3 0 14 0 0 0 - 8080 - 0 0 - - 0
command: |
  awk 'NR > 2 {s = "ready"; if ($7 == 8) s = "drain"; if ($7 == 1) s = "maint"; print $4, ($6 == 2 ? "up" : "down"), s}' servers-state.txt
expected_output: |
  web1 up ready
  web2 up drain
  web3 down maint
explanation: |
  `NR > 2` skips the version line and the header. Column 4 is the server's name, column 6 its **operational state** (2 up, 0 down) and column 7 its **administrative state**, what an operator set: 0 ready, 8 drain and 1 maintenance, each set here through the runtime API. (`cond ? a : b` in awk is "a if the condition holds, else b".)

  web2 is draining: still up, still checked, taking only its sticky visitors while their sessions finish. web3 is in maintenance: no traffic and no checks, so HAProxy counts it down. Both states live only in the running HAProxy. A reload or a restart reads `haproxy.cfg` again, and all three come back ready, unless the file says otherwise: `disabled` on a server's line starts it with administrative state 5, the configuration's 4 and maintenance's 1.
skills: [read-the-balancer, drain-and-stick]
