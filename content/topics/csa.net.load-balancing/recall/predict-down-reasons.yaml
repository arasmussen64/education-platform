id: predict-down-reasons
type: predict_shell
rev: 1
# Captured on 2026-11-12 with journalctl -u haproxy@lb in this topic's
# debug lab (HAProxy 2.8.30 on the network-lab base), during a restart of
# the database: ten of its lines, in their order, with the [WARNING] and
# [ALERT] copies HAProxy also writes left out. Pinned in Git Bash (gawk) and
# Ubuntu 24.04's mawk 1.3.4.
prompt: |
  `haproxy.log` is part of the shop's balancer's log one evening (captured from this topic's labs: ten lines of `journalctl -u haproxy@lb`, in their order). The first command prints the time, the server and the first word of the reason of each line that took a server out; the second counts the requests logged as `<NOSRV>`. What is printed?
files:
  haproxy.log: |
    Nov 12 16:42:49 lab haproxy@lb[830]: Server web/web2 is UP, reason: Layer7 check passed, code: 200, check duration: 0ms. 2 active and 0 backup servers online. 0 sessions requeued, 0 total in queue.
    Nov 12 16:42:50 lab haproxy@lb[830]: Server web/web1 is DOWN, reason: Layer7 wrong status, code: 503, info: "Service Unavailable", check duration: 1ms. 1 active and 0 backup servers left. 0 sessions active, 0 requeued, 0 remaining in queue.
    Nov 12 16:42:50 lab haproxy@lb[830]: Server web/web2 is DOWN, reason: Layer7 wrong status, code: 503, info: "Service Unavailable", check duration: 1ms. 0 active and 0 backup servers left. 0 sessions active, 0 requeued, 0 remaining in queue.
    Nov 12 16:42:50 lab haproxy@lb[830]: backend web has no server available!
    Nov 12 16:42:51 lab haproxy@lb[830]: 10.0.9.2:53798 [12/Nov/2026:16:42:51.740] shop web/<NOSRV> 0/-1/-1/-1/0 503 217 - - SCNN 1/1/0/0/0 0/0 "GET / HTTP/1.1"
    Nov 12 16:42:51 lab haproxy@lb[830]: 10.0.9.2:53814 [12/Nov/2026:16:42:51.773] shop web/<NOSRV> 0/-1/-1/-1/0 503 217 - - SCNN 1/1/0/0/0 0/0 "GET /orders HTTP/1.1"
    Nov 12 16:42:52 lab haproxy@lb[830]: 10.0.9.2:53816 [12/Nov/2026:16:42:52.307] shop web/<NOSRV> 0/-1/-1/-1/0 503 217 - - SCNN 1/1/0/0/0 0/0 "GET / HTTP/1.1"
    Nov 12 16:42:52 lab haproxy@lb[830]: 10.0.9.2:53826 [12/Nov/2026:16:42:52.335] shop web/<NOSRV> 0/-1/-1/-1/0 503 217 - - SCNN 1/1/0/0/0 0/0 "GET /orders HTTP/1.1"
    Nov 12 16:42:58 lab haproxy@lb[830]: Server web/web1 is UP, reason: Layer7 check passed, code: 200, check duration: 1ms. 1 active and 0 backup servers online. 0 sessions requeued, 0 total in queue.
    Nov 12 16:42:58 lab haproxy@lb[830]: Server web/web2 is UP, reason: Layer7 check passed, code: 200, check duration: 1ms. 2 active and 0 backup servers online. 0 sessions requeued, 0 total in queue.
command: |
  grep 'is DOWN' haproxy.log | awk '{print $3, $7, $11}'
  grep -c NOSRV haproxy.log
expected_output: |
  16:42:50 web/web1 Layer7
  16:42:50 web/web2 Layer7
  4
explanation: |
  Split at spaces, a line that took a server out has its time third (`16:42:50`), the backend and server seventh (`web/web1`), and the first word of the reason eleventh: `Layer7`, from `Layer7 wrong status, code: 503`. The check reached the server and got an answer, the wrong one, a `503`. `grep -c` counts lines, and four requests went nowhere.

  Read it as the operator: both servers in rotation went DOWN **in the same second, for the same reason**, so look for what they share, not at either server. The line after says what that cost: `backend web has no server available!`, and every request after it, the front page (`GET /`) as well as `/orders`, is logged as `web/<NOSRV>` with HAProxy's own `503`. Eight seconds later both came back together. A check on something every server shares, the database here, fails on all of them at once; a check of the server itself would have left the front page working.
skills: [read-the-balancer, health-checks]
