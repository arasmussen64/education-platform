global
    log stdout format raw local0
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend shop
    bind 10.0.9.1:80
    default_backend web

backend web
    balance roundrobin
    cookie SHOPSRV insert indirect nocache
    option forwardfor
    option httpchk GET /health
    http-check expect status 200
    default-server inter 1s fall 1 rise 1
    server web1 10.0.1.11:8080 check cookie web1
    server web2 10.0.1.12:8080 check cookie web2
    server web3 10.0.1.13:8080 check cookie web3

listen stock
    bind 10.0.9.1:7000
    mode tcp
    option tcplog
    balance roundrobin
    server stock1 10.0.1.31:7000 check
    server stock2 10.0.1.32:7000 check
