# The checks of "Balance the shop": the four things the walkthrough saves,
# each compared with what the lab really does now, and every web server back
# in rotation at the end. The first check waits for the balancer after a
# boot; the rest read at once.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: down-reason-saved
    description: "~/example/down.txt holds the line HAProxy logged when web3 went down, with the reason it gave."
    timeout: 40
    command: |
      . /usr/local/lib/lab/lbcheck.sh
      haproxy_ready || { echo "HAProxy on lb doesn't answer its runtime API"; exit 0; }
      f=/home/learner/example/down.txt
      [ -s "$f" ] || { echo "there is no ~/example/down.txt, or it's empty"; exit 0; }
      line=$(head -n 1 "$f")
      case $line in
        *"web/web3 is DOWN, reason: Layer4"*) echo saved ;;
        *) echo "~/example/down.txt holds \"$line\", not HAProxy's line for web3 going down with its reason" ;;
      esac
    expect:
      equals: saved
  - id: hung-seconds-saved
    description: "~/example/hung-seconds.txt holds the seconds a hung web2 took to be marked DOWN, which this balancer's settings make 9 to 13."
    command: |
      f=/home/learner/example/hung-seconds.txt
      [ -s "$f" ] || { echo "there is no ~/example/hung-seconds.txt, or it's empty"; exit 0; }
      n=$(head -n 1 "$f" | tr -d ' \r')
      case $n in
        '' | *[!0-9]*) echo "~/example/hung-seconds.txt holds \"$n\", not a whole number of seconds"; exit 0 ;;
      esac
      if [ "$n" -ge 8 ] && [ "$n" -le 14 ]; then echo saved; else echo "~/example/hung-seconds.txt says $n seconds; with checks every 2 s, each waiting 2 s for an answer, three failures take 10 to 12"; fi
    expect:
      equals: saved
  - id: xff-saved
    description: "~/example/xff.txt holds the X-Forwarded-For line a web server reports, and the balancer passes on the office's address now."
    command: |
      . /usr/local/lib/lab/lbcheck.sh
      f=/home/learner/example/xff.txt
      [ -s "$f" ] || { echo "there is no ~/example/xff.txt, or it's empty"; exit 0; }
      saved=$(head -n 1 "$f" | tr -d '\r')
      live=$(office http://10.0.9.1/whoami | grep '^X-Forwarded-For:')
      [ "$live" = "X-Forwarded-For: 10.0.9.2" ] || { echo "a web server asked through the balancer now reports \"${live:-no answer}\""; exit 0; }
      [ "$saved" = "$live" ] && { echo saved; exit 0; }
      echo "~/example/xff.txt holds \"$saved\", and a web server reports \"$live\""
    expect:
      equals: saved
  - id: banner-saved
    description: "~/example/banner.txt holds the stock service's greeting, which the balancer's port 7000 gives the office now."
    command: |
      f=/home/learner/example/banner.txt
      [ -s "$f" ] || { echo "there is no ~/example/banner.txt, or it's empty"; exit 0; }
      saved=$(head -n 1 "$f" | tr -d '\r')
      live=$(on office timeout 4 nc -w 2 10.0.9.1 7000 < /dev/null | head -n 1)
      case $live in
        "STOCK-SYNC 1.0 ready "*) ;;
        *) echo "the office connects to 10.0.9.1 port 7000, and the stock service sends nothing"; exit 0 ;;
      esac
      [ "$saved" = "$live" ] && { echo saved; exit 0; }
      echo "~/example/banner.txt holds \"$saved\", and port 7000 says \"$live\""
    expect:
      equals: saved
  - id: all-in-rotation
    description: "Every web server is up and in rotation: none left stopped, draining or in maintenance."
    command: |
      . /usr/local/lib/lab/lbcheck.sh
      wait_up 10 10.0.1.11:8080 10.0.1.12:8080 10.0.1.13:8080 || true
      api "show servers state web" | awk 'NF && NR > 2 {
        if ($6 != 2) bad = bad " " $4 " is not up (operational state " $6 ")"
        else if ($7 != 0) bad = bad " " $4 " is out of rotation (administrative state " $7 ")"
      } END {print (bad == "" ? "in rotation" : substr(bad, 2))}'
    expect:
      equals: "in rotation"
