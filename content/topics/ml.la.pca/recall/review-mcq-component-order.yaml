id: review-mcq-component-order
type: mcq
rev: 1
prompt: |
  `values, vectors = np.linalg.eigh(C)` for a covariance matrix `C`. Which column of `vectors` is the first principal component?
choices:
  - '`vectors[:, 0]`, the first column'
  - '`vectors[:, -1]`, the last column: `eigh` lists eigenvalues in ascending order, so the largest is last'
  - '`vectors[0]`, the first row'
  - 'Whichever has the largest entries'
answer: 1
explanation: |
  `eigh` returns the eigenvalues ascending and the matching eigenvectors as columns in the same order, so the direction of most variance is the last column. Rows aren't eigenvectors at all. Many programs reverse both, `values[::-1]` and `vectors[:, ::-1]`, so that index 0 is the first component.
skills: [components]
