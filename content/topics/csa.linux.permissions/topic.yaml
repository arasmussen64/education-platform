id: csa.linux.permissions
kind: topic
status: draft
title: "Users, permissions and SSH"
summary: "Who may read, change or run a file: owners, groups and the mode bits; users, groups and sudo; and SSH keys, the way you reach every server you'll ever run."
prerequisites: [csa.linux.shell]
estimated_minutes: 90
rev: 1
objectives:
  - "Read an `ls -l` line: the file type, then the owner's, the group's and everyone else's permissions, and write the same as an octal number."
  - "Change permissions and ownership with `chmod` (octal and symbolic) and `chown`, and explain what `x` means on a directory and what `umask` does to new files."
  - "Explain users, groups, `/etc/passwd` and `id`, and why services run as a user of their own while people use `sudo` rather than logging in as root."
  - "Set up SSH keys safely: which file stays on your machine, which goes to the server and where, and the permissions `sshd` insists on."
