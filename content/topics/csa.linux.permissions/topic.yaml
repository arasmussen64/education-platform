prove:
  explain:
    prompt: |
      You're setting up a server for a small web app, and a colleague who is new to Linux asks you to explain how you'll keep it safe. Explain, in your own words: what `-rwxr-x---` on the app's start script means, who can run it, and what `chmod 750` and `chown app:app` would do; why the app should run as a user of its own, and why nobody logs in as root but uses `sudo` instead; and how SSH keys work: which file stays on your laptop, which goes to the server and where, and why `sshd` refuses keys whose files have loose permissions.
    rubric:
      - id: modes
        required: true
        description: "The ten characters are the type (- file, d directory) and three groups of rwx for the owner, the group and others; -rwxr-x--- means the owner can read, write and run it, the group can read and run it, others nothing; in octal r=4, w=2, x=1 per group, so 750."
      - id: change
        required: true
        description: "chmod sets the permissions (750, or u=rwx,g=rx,o=); chown app:app sets the owner and the group; both need the owner or root; x on a directory means you may enter it."
      - id: least-privilege
        required: true
        description: "The app runs as its own user so a bug in it can only touch that user's files; people log in as themselves and use sudo for single commands, which asks for their password, is logged, and can be limited to specific commands."
      - id: ssh
        required: true
        description: "ssh-keygen makes a pair: the private key stays on the laptop and is never copied; the public key is appended to ~/.ssh/authorized_keys on the server; ~/.ssh must be 700 and the key files 600, or sshd ignores them, because a readable private key is a stolen one."
      - id: groups
        required: false
        description: "Groups give several users the same access; usermod -aG adds a user to a group, taking effect at the next login."
    model_answer: |
      Those ten characters are the file's type and its permissions. The first, a dash, says it's an ordinary file (d would be a directory). Then come three groups of three letters: for the owner, for the file's group, and for everyone else. rwx for the owner means the app user can read, write and run the script; r-x for the group means members can read and run it but not change it; --- means nobody else can do anything with it. As a number, each group adds r=4, w=2, x=1, so this is 750, and chmod 750 start.sh sets exactly that. chown app:app start.sh makes the app user the owner and the app group the group, which only root (or the current owner) may do. On a directory, x means you may enter it; without x you can't reach the files inside even if you can list their names. The app runs as its own user so that if it's broken into, the attacker can only touch what that user can: its own files, not the whole machine. For the same reason nobody logs in as root. People log in as themselves and use sudo for the one command that needs root; sudo asks for their own password, writes every command to the log, and can be limited in sudoers to specific commands for specific groups. For SSH, ssh-keygen makes a pair of files. The private key, id_ed25519, stays on my laptop and is never copied anywhere, protected by a passphrase; the public key, id_ed25519.pub, is appended to ~/.ssh/authorized_keys in my account on the server (ssh-copy-id does that). The server proves I hold the private key without ever seeing it. sshd checks that ~/.ssh is 700 and authorized_keys and the private key are 600, and ignores them otherwise, because a key file other users can read or write is as good as stolen or swapped, and a server that accepts it is already compromised.
