id: mcq-chmod-750
type: mcq
rev: 2
prompt: |
  After `chmod 750 run.sh`, which of these is true?
choices:
  - "The owner can read, write and run it; the group and others can read and run it, not change it"
  - "The owner can read, write and run it; the group can read and write it; others can do nothing"
  - "The owner can read, write and run it; the group can read and run it; others can do nothing"
  - "The owner and the group can read, write and run it; others can read it but not run it"
answer: 2
explanation: |
  `7` is `rwx` (4+2+1), `5` is `r-x` (4+1) and `0` is `---`, in the order owner, group, others. The symbolic spelling of the same change is `chmod u=rwx,g=rx,o= run.sh`. Letting the group *and* others read and run it would be `755`, the usual mode for a program meant for all users. Read and write for the group is `6` (4+2), so that description is `760`: the trap is reading `5` as `rw-`. And the owner and the group both with everything, others reading only, is `774`.
skills: [chmod-chown]
