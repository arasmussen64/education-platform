id: mcq-chmod-750
type: mcq
rev: 1
prompt: |
  After `chmod 750 run.sh`, which of these is true?
choices:
  - "The owner can read, write and run it; the group can read and run it; others can do nothing"
  - "Everyone can read and run it; only the owner can write it"
  - "Only the owner can read it; it can't be run by anyone"
  - "The owner and the group can read, write and run it"
answer: 0
explanation: |
  `7` is `rwx`, `5` is `r-x`, `0` is `---`, in the order owner, group, others. The symbolic spelling of the same change is `chmod u=rwx,g=rx,o= run.sh`. "Everyone can read and run, owner writes" would be `755`, the usual mode for a program meant for all users.
skills: [chmod-chown]
