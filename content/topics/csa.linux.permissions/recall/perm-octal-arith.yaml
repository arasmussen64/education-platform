id: perm-octal-arith
type: predict_shell
rev: 1
prompt: |
  The owner may read, write and run a file; the group may read and run it; others may only read it. Each permission is a number (`r` 4, `w` 2, `x` 1) and each group of three adds up. `$(( ... ))` does arithmetic in the shell. What is printed?
command: echo $((4+2+1))$((4+0+1))$((4+0+0))
expected_output: |
  754
explanation: |
  Owner `rwx` is 4+2+1 = 7, group `r-x` is 4+1 = 5, others `r--` is 4, and the three digits side by side are the octal mode: `754`, which `chmod 754 file` would set. Writing the sums out like this is how to check an unfamiliar number: `640` is `rw-`, `r--`, `---`.
skills: [read-modes]
