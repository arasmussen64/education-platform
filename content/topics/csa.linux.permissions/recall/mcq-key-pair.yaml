id: mcq-key-pair
type: mcq
rev: 1
prompt: |
  `ssh-keygen -t ed25519` created `~/.ssh/id_ed25519` and `~/.ssh/id_ed25519.pub`. To log in to a server with the key, what goes where?
choices:
  - "Copy `id_ed25519` to the server's `~/.ssh/`; keep `id_ed25519.pub` on your laptop"
  - "Append the contents of `id_ed25519.pub` to `~/.ssh/authorized_keys` on the server (`ssh-copy-id` does this); `id_ed25519` never leaves your laptop"
  - "Copy both files to the server, so it can compare them"
  - "Email `id_ed25519` to the administrator so they can install it"
answer: 1
explanation: |
  The `.pub` file is the public half: safe to share, and it belongs in the server's `authorized_keys`, one key per line. The private half proves you hold the key without ever being sent, and it should never be copied or mailed anywhere: anyone who has it *is* you. `ssh-copy-id user@host` appends the public key and fixes the permissions in one step.
skills: [ssh-keys]
