id: mcq-directory-x
type: mcq
rev: 1
prompt: |
  A directory `reports` has mode `drw-r--r--`. A user who owns it runs `cat reports/today.txt`. What happens?
choices:
  - "It works: the owner has read permission on the directory"
  - "Permission denied: without `x` on the directory, nobody can enter it to reach the files inside, even the owner"
  - "It works, but only because the file itself is readable"
  - "The file is printed, then the directory is deleted"
answer: 1
explanation: |
  On a directory, `r` only lets you list the names inside; `x` is what lets you pass through it to open a file by path. With `rw-` and no `x`, `ls reports` shows the names but `cat reports/today.txt` fails, whatever the file's own mode. That's why directories are `755` or `700`, not `644`: wherever a directory has `r`, it needs `x` too.
skills: [chmod-chown]
