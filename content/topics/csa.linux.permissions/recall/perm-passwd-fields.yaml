id: perm-passwd-fields
type: predict_shell
rev: 1
prompt: |
  `passwd` holds four lines in the format of `/etc/passwd`: `name:x:uid:gid:comment:home:shell`, fields separated by colons. The command prints the name and uid of every user whose shell is `/bin/bash`, the ones who can actually log in and get a shell. What is printed?
files:
  passwd: |
    root:x:0:0:root:/root:/bin/bash
    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
    ada:x:1000:1000:Ada:/home/ada:/bin/bash
    deploy:x:1001:1001::/home/deploy:/usr/sbin/nologin
command: |
  awk -F: '$7 == "/bin/bash" {print $1, $3}' passwd
expected_output: |
  root 0
  ada 1000
explanation: |
  `-F:` splits on colons; `$7` is the shell and `$1` and `$3` the name and uid. `root` (uid 0, the all-powerful account) and `ada` have a real shell. `daemon` and `deploy` have `nologin`: they exist to own files and run services, and nobody can log in as them, which is exactly what you want for a service user. The `x` in field 2 means the password hash lives in `/etc/shadow`, readable only by root.
skills: [users-sudo]
