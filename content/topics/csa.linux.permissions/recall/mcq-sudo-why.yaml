id: mcq-sudo-why
type: mcq
rev: 1
prompt: |
  On a shared server, why do administrators log in as themselves and use `sudo`, rather than logging in as `root`?
choices:
  - "Because `sudo` runs commands faster than root does"
  - "Because each privileged command is then tied to a named person, asks for that person's own password, is logged, and can be limited to specific commands; a shared root login is anonymous and all-powerful all the time"
  - "Because root can't run commands in `/home`"
  - "Because `sudo` doesn't need a password"
answer: 1
explanation: |
  `sudo` gives root's power for one command at a time, with a name attached and a line in the log, so you can see who changed what, and `sudoers` can grant one group just one command. A root login does everything with no record of who was typing, and keeps that power for every command, including the mistyped ones. The usual default is that `sudo` *does* ask for your password, and remembers it for a few minutes.
skills: [users-sudo]
