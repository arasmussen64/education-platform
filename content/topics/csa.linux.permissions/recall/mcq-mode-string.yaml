id: mcq-mode-string
type: mcq
rev: 2
prompt: |
  `ls -l` shows `-rw-r----- 1 app app 2048 Nov 9 09:00 app.conf`. Who can do what, and what is the octal mode?
choices:
  - "The owner and the `app` group can read and write it, everyone else can read it: `664`"
  - "The owner can read and write it, the `app` group can read it, nobody else can touch it: `640`"
  - "The owner can read, write and run it, the `app` group and everyone else can read it: `744`"
  - "The owner can read, write and run it, the `app` group can read and write it, nobody else can touch it: `760`"
answer: 1
explanation: |
  Split the mode after the first character: `rw-` for the owner (4+2 = 6), `r--` for the group (4), `---` for others (0): `640`. Nothing in this mode has an `x`, so nobody can run the file, and the owner's digit is `6`, not the `7` of `744` and `760`. Everyone else reading it, as `664` and `744` say, would need `r--` at the end, and here the last three characters are dashes, which shut everyone else out. And the group's three are `r--`, so the group can't write, as `664` and `760` would let it.
skills: [read-modes]
