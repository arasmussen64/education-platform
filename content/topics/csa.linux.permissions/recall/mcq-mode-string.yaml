id: mcq-mode-string
type: mcq
rev: 2
prompt: |
  `ls -l` shows `-rw-r----- 1 app app 2048 Nov 9 09:00 app.conf`. Who can do what, and what is the octal mode?
choices:
  - "The owner can read and write it, the `app` group and everyone else can read it: `644`"
  - "The owner can read and write it, the `app` group can read it, nobody else can touch it: `640`"
  - "The owner can read, write and run it, the `app` group can read it, nobody else can touch it: `740`"
  - "The owner and the `app` group can read and write it, nobody else can touch it: `660`"
answer: 1
explanation: |
  Split the mode after the first character: `rw-` for the owner (4+2 = 6), `r--` for the group (4), `---` for others (0): `640`. `644` would need `r--` at the end, and here the last three characters are dashes, which shut everyone else out. `740` would need an `x` in the owner's three, and nothing in this mode has `x`, so nobody can run the file. `660` would give the group `w` as well, and the group's three are `r--`.
skills: [read-modes]
