id: mcq-mode-string
type: mcq
rev: 1
prompt: |
  `ls -l` shows `-rw-r----- 1 app app 2048 Nov 9 09:00 app.conf`. Who can do what, and what is the octal mode?
choices:
  - "The owner can read and write it, members of the `app` group can read it, nobody else can touch it: `640`"
  - "Everyone can read it, only the owner can write it: `644`"
  - "The owner can read, write and run it, the group can read it: `740`"
  - "The owner and the group can read and write it: `660`"
answer: 0
explanation: |
  Split the mode after the first character: `rw-` for the owner (4+2 = 6), `r--` for the group (4), `---` for others (0): `640`. Nothing has `x`, so nobody can run it, and the last three dashes shut everyone else out. `644` would need `r--` at the end; `660` would give the group `w`.
skills: [read-modes]
