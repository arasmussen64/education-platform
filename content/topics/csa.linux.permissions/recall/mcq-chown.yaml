id: mcq-chown
type: mcq
rev: 1
prompt: |
  You've unpacked a web app into `/srv/app` as yourself, and it should be owned by the `app` user and group, every file and folder included. Which command, and why does it need `sudo`?
choices:
  - "`sudo chown -R app:app /srv/app`, because only root may give a file to another user"
  - "`chmod -R app /srv/app`, because `chmod` changes the owner"
  - "`chown app /srv/app`, which changes the folder and everything in it"
  - "`sudo chgrp app /srv/app`, which sets both the owner and the group"
answer: 0
explanation: |
  `chown owner:group` sets both at once, and `-R` walks the whole tree; without `-R` only `/srv/app` itself changes. Handing a file to another user is a root-only operation (otherwise anyone could dump files into someone else's disk quota or make them look like someone else's), hence `sudo`. `chmod` is for permissions, not ownership, and `chgrp` changes only the group.
skills: [chmod-chown]
