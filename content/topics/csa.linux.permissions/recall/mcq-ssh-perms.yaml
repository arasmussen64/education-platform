id: mcq-ssh-perms
type: mcq
rev: 2
prompt: |
  You added your public key to a server's `~/.ssh/authorized_keys`, but `ssh` still asks for a password. On the server, `ls -ld ~/.ssh` shows `drwxrwxr-x`. What's wrong?
choices:
  - "`sshd` runs as another user and can't read `~/.ssh`; it needs `drwxrwxrwx` to see the key"
  - "Password login is still switched on, and `sshd` only tries keys once passwords are turned off"
  - "`~/.ssh` can be written by its group, so `sshd` refuses to use the `authorized_keys` inside it"
  - "The mode is fine for a directory; the key belongs in `/etc/ssh/authorized_keys`, not in your home"
answer: 2
explanation: |
  `sshd` checks the ownership and modes of your home folder, `~/.ssh` and `authorized_keys`, and ignores the keys if anyone but you could write to them, because someone who can write there could add their own key to your account. `drwxrwxr-x` has `w` for the group, so the keys are skipped and `ssh` falls back to asking for a password. Fix it with `chmod 700 ~/.ssh` and `chmod 600 ~/.ssh/authorized_keys`, and look in the server's auth log for "bad ownership or modes" when keys mysteriously don't work. Opening the directory up further makes it worse, not better: `sshd` can already read it. Keys are tried before passwords, so leaving password login on doesn't block them. And each user's keys live in their own `~/.ssh/authorized_keys`, which is where you put yours.
skills: [ssh-keys]
