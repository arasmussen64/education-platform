- term: octal
  definition: "The way file modes are written as numbers: each of owner, group and others gets one digit, read 4 plus write 2 plus execute 1, so `rwxr-x---` is 750."
- term: umask
  definition: "A mask that takes permission bits away from every new file and folder a process creates. With the usual 022, new files get 644 and new folders 755."
- term: service user
  aliases: [service account, service accounts]
  definition: "A user that exists only to own one program's files and run it, with no password and no login shell, such as `www-data`."
- term: SSH
  definition: "Secure Shell, the encrypted way to log in to a server's shell over the network, and to copy files to it."
- term: private key
  definition: "The secret half of a key pair, used by SSH and TLS. It never leaves its owner's machine and proves who they are without ever being sent."
- term: public key
  definition: "The shareable half of a key pair. Added to a server's `~/.ssh/authorized_keys`, it lets whoever holds the matching private key log in; a TLS certificate carries one too."
