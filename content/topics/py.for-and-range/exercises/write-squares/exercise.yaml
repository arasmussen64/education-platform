id: write-squares
stage: write
rev: 1
title: "Squares"
prompt: |
  Write a program that asks for a whole number and prints the square of every number from 1 up to it, one per line. Typing `3` should print:

  ```
  1
  4
  9
  ```
hints:
  - "A `for` loop with `range` fits: you know the numbers before the loop starts."
  - "To get 1 up to and including n, the range is `range(1, n + 1)`."
  - "The square of `i` is `i * i`."
skills: [range-bounds, for-body]
