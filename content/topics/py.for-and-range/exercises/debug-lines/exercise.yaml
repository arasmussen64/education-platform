id: debug-lines
stage: debug
rev: 1
title: "Lines and a count"
prompt: |
  This program asks how many lines to print, prints them numbered from 1, says `Ready` three times, and then reports how many lines it printed. Typing `2` should print:

  ```
  Line 1
  Line 2
  Ready
  Ready
  Ready
  Lines printed: 2
  ```

  It has three bugs. Run it with `2` and with `4`, read the output line by line against the example, and fix what you find.
skills: [range-bounds, for-body]
