id: build-evens
stage: build
rev: 1
title: "The even numbers"
prompt: |
  Starting from a blank editor, write a program that asks for a whole number and prints the even numbers from 2 up to it, one per line, including the number itself if it's even. Typing `7` should print:

  ```
  2
  4
  6
  ```

  and typing `8` should print `2`, `4`, `6`, `8`.
skills: [range-bounds, for-body]
