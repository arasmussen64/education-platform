id: example-meow
stage: worked_example
rev: 1
title: "Counting with range"
prompt: |
  Two `for` loops: one that uses its loop variable and one that doesn't. Press **Run**, then change `range(3)` to `range(1, 4)` and run again. What changed?
steps:
  - label: "range gives the values, for hands them over"
    lines: "1-2"
    note: "`range(3)` produces 0, 1, 2. Each pass, `i` refers to the next one and the block runs. Three values, three passes, and no start, test or update to write."
  - label: "Only counting"
    lines: "3-4"
    note: "The block doesn't use the value, so the variable is named `_`, which tells a reader \"this just counts\". `range(2)` gives two passes."
  - label: "After the loops"
    lines: "5"
    note: "Back at the left margin, so it runs once, after both loops have finished."
