id: fill-times-table
stage: fill_in
rev: 1
title: "A times table"
prompt: |
  This program prints a times table, from 1 times the number up to 10 times. Replace the two `...` in the `range` so that typing `3` prints:

  ```
  3 x 1 = 3
  3 x 2 = 6
  ...
  3 x 10 = 30
  ```

  (ten lines in all).
hints:
  - "The first line multiplies by 1, so the range starts at 1."
  - "The stop value is never included. To reach 10, stop at 11."
skills: [range-bounds, for-body]
