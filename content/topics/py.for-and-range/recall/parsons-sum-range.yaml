id: parsons-sum-range
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `6`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'total = 0'
  - 'for n in range(1, 4):'
  - '    total = total + n'
  - 'print(total)'
distractors:
  - 'for n in range(1, 3):'
explanation: |
  `range(1, 4)` gives 1, 2 and 3 (the end isn't included), and 1 + 2 + 3 is 6; `range(1, 3)` would stop at 2 and give 3. The total starts at 0 before the loop, and the unindented `print` comes after it, so it runs once.
skills: [range-bounds, for-body]
