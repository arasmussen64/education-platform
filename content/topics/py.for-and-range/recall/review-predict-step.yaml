id: review-predict-step
type: predict_output
rev: 1
prompt: |
  What will this program print? Watch the direction of the step.
code: |
  for n in range(10, 0, -3):
      print(n)
  print("end")
expected_output: |
  10
  7
  4
  1
  end
explanation: |
  A negative step counts down: 10, 7, 4, 1. The next value would be −2, which is past the stop value 0, so the loop ends there. `0` itself is never included, because the stop is excluded whichever way you count.
skills: [range-bounds, for-body]
