id: predict-range
type: predict_output
rev: 1
prompt: |
  What will this program print? Six lines.
code: |
  for i in range(1, 10, 3):
      print(i)
  for i in range(3):
      print("x", i)
expected_output: |
  1
  4
  7
  x 0
  x 1
  x 2
explanation: |
  `range(1, 10, 3)` starts at 1 and jumps by 3, stopping before 10: 1, 4, 7 (10 would be next, but it isn't included). `range(3)` is 0, 1, 2, and each value is printed after the `x`.
skills: [range-bounds, for-body]
