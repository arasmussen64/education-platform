id: mcq-for-or-while
type: mcq
rev: 1
prompt: |
  A program should keep asking for a password until the right one is typed. Which loop fits best, and why?
choices:
  - '`for i in range(3)`, because three tries is the usual limit'
  - 'A `while` loop, because the number of tries isn''t known before the loop starts'
  - '`for _ in range(1)`, because the loop only needs to run once'
  - 'No loop: an `if` statement can check the password'
answer: 1
explanation: |
  A `for` loop with `range` is for repeating a known number of times. Here the loop has to continue *until something changes*, the right password being typed, and nobody knows how many tries that will take. That's a `while` loop with a condition.
skills: [for-vs-while]
