id: review-mcq-count
type: mcq
rev: 1
prompt: |
  How many times does the block of `for i in range(3, 8):` run?
choices:
  - '6'
  - '8'
  - '5'
  - '4'
answer: 2
explanation: |
  `range(3, 8)` gives 3, 4, 5, 6 and 7: five values, because 8 isn't included. A quick way to count is `stop - start`: 8 − 3 = 5.
skills: [range-bounds]
