id: review-mcq-choose-loop
type: mcq
rev: 1
prompt: |
  Which of these jobs is the best fit for `for` with `range`, rather than `while`?
choices:
  - 'Keep asking for a number until the user types a positive one'
  - 'Print a line of 20 dashes, one dash per pass'
  - 'Keep doubling a number until it passes 1,000'
  - 'Keep reading words until the user types `stop`'
answer: 1
explanation: |
  Printing 20 dashes is a known number of repeats, so `for _ in range(20)` says exactly that. The other three keep going until something changes, and nobody knows in advance how many passes that takes: those are `while` loops.
skills: [for-vs-while]
