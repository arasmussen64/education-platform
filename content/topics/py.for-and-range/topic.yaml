id: py.for-and-range
kind: topic
status: ready
title: "for and range"
summary: "Loop a set number of times with for and range, and avoid off-by-one errors."
prerequisites: [py.while-loops]
estimated_minutes: 45
rev: 1
objectives:
  - "Repeat a block a set number of times with `for i in range(n)`, knowing that `i` runs from 0 to n − 1."
  - "Use `range(start, stop)` and `range(start, stop, step)`, and predict exactly which numbers come out."
  - "Choose between `for` and `while`: a known number of repeats, or a condition that has to change."
