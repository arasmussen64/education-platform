  - write-squares
prove:
  build: build-evens
  debug: debug-lines
  explain:
    prompt: |
      A friend writes this to print the numbers 1 to 5:

      ```python
      for i in range(5):
          print(i)
      ```

      It prints 0 to 4. In your own words: why does `range(5)` give those numbers, how many times does a loop over `range(n)` run, and what are two different ways to print 1 to 5 instead?
    rubric:
      - id: zero-based
        required: true
        description: "range(5) starts at 0 and stops before 5: 0, 1, 2, 3, 4."
      - id: count
        required: true
        description: "A loop over range(n) runs exactly n times."
      - id: fixes
        required: true
        description: "Two fixes: range(1, 6), or keep range(5) and print(i + 1)."
      - id: stop-excluded
        required: false
        description: "The stop value is never included, which is why range(1, 6) is needed to reach 5."
    model_answer: |
      range(5) counts from 0 and stops before 5, so it gives 0, 1, 2, 3 and 4: five numbers, which is why a loop over range(n) runs exactly n times. The stop value itself is never included. To print 1 to 5, either ask for that range directly, range(1, 6), which starts at 1 and stops before 6, or keep range(5) and print i + 1 inside the loop.
review_pool:
  - review-predict-step
  - review-mcq-count
  - review-code-fives
  - review-mcq-choose-loop
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: range-bounds
    description: "Know that `range(n)` runs 0 to n − 1, and that `range(start, stop, step)` stops before `stop`"
  - id: for-body
    description: "Repeat a block with `for`, using the loop variable, or `_` when it isn't needed"
  - id: for-vs-while
    description: "Choose `for` for a known number of repeats and `while` for a condition"
