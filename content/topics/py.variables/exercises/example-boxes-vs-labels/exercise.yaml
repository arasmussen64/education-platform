id: example-boxes-vs-labels
stage: worked_example
rev: 1
title: "Names and values"
prompt: |
  Follow the name `city` through this program. Press **Run**, then read how each part works.
steps:
  - label: "Give a value a name"
    lines: "1"
    note: 'Python works out the right side, the text `"Paris"`, then points the name `city` at it. Read `=` as "now refers to".'
  - label: "Use the name to get the value"
    lines: "2"
    note: "No quotes, so Python looks up what `city` refers to and prints `Paris`."
  - label: "Point the name at a new value"
    lines: "3-4"
    note: '`city` now refers to `"Tokyo"`. Nothing names `"Paris"` any more.'
  - label: "Two names, one value"
    lines: "5"
    note: '`home = city` points `home` at what `city` refers to right now: `"Tokyo"`.'
  - label: "Moving one name doesn't move the other"
    lines: "6-7"
    note: '`city` now refers to `"Lima"`, but `home` still refers to `"Tokyo"`, so line 7 prints `Tokyo Lima`.'
