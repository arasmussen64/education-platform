id: build-swap-and-print
stage: build
rev: 1
title: "Swap and print"
prompt: |
  Starting from a blank editor, write a program that:

  1. gives `top` the value `"red"` and `bottom` the value `"blue"`, one line each;
  2. prints them with `print(top, bottom)`;
  3. swaps their values;
  4. prints them again, the same way.

  It should print:

  ```
  red blue
  blue red
  ```
skills: [assignment, swap]
