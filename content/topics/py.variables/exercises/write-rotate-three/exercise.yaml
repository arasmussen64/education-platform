id: write-rotate-three
stage: write
rev: 1
title: "Rotate three values"
prompt: |
  The program starts with `a = 1`, `b = 2` and `c = 3`. Rotate the values one place, so that:

  - `a` gets `b`'s value,
  - `b` gets `c`'s value, and
  - `c` gets `a`'s **original** value.

  Then print them with `print(a, b, c)`. It should print `2 3 1`.
hints:
  - "Before you change `a`, keep its value safe under a spare name, like `first`."
  - "Then move each value along: `a = b`, then `b = c`."
  - "Finally, give `c` the value you kept safe."
skills: [swap]
