id: trace-swap
type: predict_output
rev: 1
prompt: |
  Someone tried to swap `a` and `b` like this. Trace it: what does it print?
code: |
  a = "up"
  b = "down"
  a = b
  b = a
  print(a, b)
expected_output: |
  down down
explanation: |
  After `a = b`, both names refer to `"down"`, and nothing refers to `"up"` any more. So `b = a` just points `b` at `"down"` again. To swap, keep one value safe first: `temp = a`, then `a = b`, then `b = temp`.
skills: [trace-values, swap]
