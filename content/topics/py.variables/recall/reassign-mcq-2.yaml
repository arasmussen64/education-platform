id: reassign-mcq-2
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  score = 10
  best = score
  score = 12
  print(best)
  ```
choices:
  - '`12`'
  - '`10`'
  - '`22`'
  - '`best`'
answer: 1
explanation: |
  `best = score` points `best` at the value `score` refers to then, `10`. Pointing `score` at `12` afterwards doesn't move `best`, so it prints `10`.
skills: [trace-values]
