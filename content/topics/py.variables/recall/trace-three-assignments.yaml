id: trace-three-assignments
type: predict_output
rev: 1
prompt: |
  Trace this program line by line. What will it print?
code: |
  x = 4
  y = x + 1
  x = 10
  print(x, y)
expected_output: |
  10 5
explanation: |
  Line 2 works out `x + 1` using the value `x` refers to at that moment, 4, so `y` refers to `5`. Line 3 points `x` at `10`, but that doesn't redo line 2's sum: `y` still refers to `5`.
skills: [trace-values]
