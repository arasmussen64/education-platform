id: mcq-name-or-text
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  name = "Ada"
  print("name")
  ```
choices:
  - '`Ada`'
  - 'An error, because `name` is a variable'
  - '`name`'
  - '`"name"`'
answer: 2
explanation: |
  The quotes make `"name"` text, so `print` shows exactly that word, without the quotes. To print the value the variable refers to, leave the quotes off: `print(name)` shows `Ada`. It's the rule from the first topics again: quotes mean text, no quotes means a name.
skills: [assignment]
