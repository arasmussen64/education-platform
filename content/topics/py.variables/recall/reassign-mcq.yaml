id: reassign-mcq
type: mcq
rev: 1
prompt: |
  After this code runs, what does `b` refer to?

  ```python
  a = 3
  b = a
  a = 5
  ```
choices:
  - '`5`, because `b` follows `a`'
  - '`3`'
  - 'The name `a`'
  - 'Nothing: changing `a` erased `b`'
answer: 1
explanation: |
  `b = a` points `b` at the value `a` refers to at that moment: `3`. Then `a = 5` points `a` at a new value. `b` was never tied to `a`, so it still refers to `3`.
skills: [trace-values]
