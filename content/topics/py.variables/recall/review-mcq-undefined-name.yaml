id: review-mcq-undefined-name
type: mcq
rev: 1
prompt: |
  What happens when you run this program?

  ```python
  total = 10
  print(totl)
  ```
choices:
  - 'It prints `10`, because Python works out that you meant `total`'
  - 'It prints `totl`'
  - 'It stops with `NameError: name ''totl'' is not defined`'
  - 'It prints nothing'
answer: 2
explanation: |
  `totl` is a different name from `total`, and nothing ever gave `totl` a value, so Python stops with a `NameError` on line 2. Python never fills in what you meant: names must match exactly, letter for letter. (Run from a terminal, recent versions of Python add a hint to the message, `Did you mean: 'total'?`, but the program still stops.)
skills: [assignment]
