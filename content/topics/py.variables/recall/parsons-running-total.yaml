id: parsons-running-total
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `65`. One line is a decoy that doesn't belong.
lines:
  - 'total = 20'
  - 'total = total * 3'
  - 'total = total + 5'
  - 'print(total)'
distractors:
  - 'print(Total)'
explanation: |
  `total` has to exist before anything can use it, so the first assignment comes first. Then 20 × 3 is 60 and 60 + 5 is 65; the other way round would give 75. `Total` with a capital T is a different name, one that was never assigned.
skills: [assignment, trace-values]
