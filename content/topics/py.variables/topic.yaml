practice:
  - example-boxes-vs-labels
  - reassign-mcq
  - trace-three-assignments
  - mcq-name-or-text
  - fill-swap
  - write-rotate-three
prove:
  build: build-swap-and-print
  debug: debug-lost-value
  explain:
    prompt: |
      A friend runs this and is surprised that `b` is still `3` at the end:

      ```python
      a = 3
      b = a
      a = 5
      ```

      In your own words: what happens, step by step, and why doesn't `b` change?
    rubric:
      - id: refers
        required: true
        description: "Assignment makes a name refer to a value: b = a makes b refer to the value a refers to at that moment, 3."
      - id: rebinding
        required: true
        description: "a = 5 points a at a new value; b isn't tied to a, so it still refers to 3."
      - id: right-first
        required: false
        description: "Python works out the right side first, then attaches the name on the left."
      - id: example
        required: false
        description: "Uses a concrete picture, like name tags or arrows."
    model_answer: |
      Assignment makes a name refer to a value. a = 3 points a at 3. b = a looks up what a refers to right now, which is 3, and points b at that same 3. It doesn't connect b to a. Then a = 5 points a at a new value, 5. Nothing points b anywhere else, so b still refers to 3. Think of name tags: moving the tag a to a new value doesn't move the tag b.
review_pool:
  - reassign-mcq-2
  - trace-swap
  - review-mcq-undefined-name
  - review-swap-variant
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: assignment
    description: "Use `=` to give a value a name, and the name to get the value back"
  - id: trace-values
    description: "Trace code line by line: which value each name refers to"
  - id: swap
    description: "Swap values, keeping one safe under a spare name"
