id: build-tickets
stage: build
rev: 1
title: "Cinema tickets"
prompt: |
  Starting from a blank editor, write a program that prices a cinema ticket. It asks for the visitor's age (a whole number), the day (like `Sat` or `Mon`), and whether they're a member (`yes` or `no`). Then:

  - **The kind of ticket and its price:** under 5 is `free` ($0); 5 to 12 is `child` ($6); 65 and over is `senior` ($8); everyone else is `adult` ($12).
  - **Weekends** (`Sat` or `Sun`) add $2, unless the ticket is free.
  - **Members** pay 90% of the result.

  It prints the kind of ticket and the price with two decimal places. Typing `10`, `Sat` and `no` should print:

  ```
  Ticket: child
  Price: $8.00
  ```

  The questions it asks can say anything you like.
test_skills:
  test_adult: [py.if-elif-else/if-else, py.strings-and-input/convert]
  test_child_and_free: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_senior: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_weekend: [py.logical-operators/or-trap, py.logical-operators/and-or]
  test_member: [py.arithmetic/operators, py.if-elif-else/if-else]
  test_two_decimals: [py.strings-and-input/fstrings]
  test_layout: [py.programs-and-print/print-text, py.strings-and-input/fstrings]
