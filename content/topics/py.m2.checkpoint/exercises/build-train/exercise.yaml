id: build-train
stage: build
rev: 1
title: "Train fare"
prompt: |
  Starting from a blank editor, write a program that prices a train journey. It asks for the distance in kilometres (it may have decimals), the time (`peak` or `offpeak`), and whether the traveller has a railcard (`yes` or `no`). Then:

  - **The kind of journey and its fare:** up to 10 km is `short` ($2.50); up to 50 km is `medium` ($6); anything longer is `long` ($15).
  - **Peak** journeys add $1.50.
  - **Railcard** holders pay two thirds of the result.

  It prints the kind of journey and the fare with two decimal places. Typing `30`, `peak` and `no` should print:

  ```
  Journey: medium
  Fare: $7.50
  ```

  The questions it asks can say anything you like.
test_skills:
  test_medium: [py.if-elif-else/if-else, py.strings-and-input/convert]
  test_short_and_long: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_peak: [py.booleans-and-comparisons/compare, py.if-elif-else/if-else]
  test_railcard: [py.arithmetic/operators, py.arithmetic/precedence]
  test_two_decimals: [py.strings-and-input/fstrings]
  test_layout: [py.programs-and-print/print-text, py.strings-and-input/fstrings]
