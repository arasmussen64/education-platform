id: debug-parking
stage: debug
rev: 1
title: "Parking fees"
prompt: |
  This program works out a parking fee from the hours parked (which may have decimals) and the day. Up to 1 hour costs $2.00, up to 3 hours costs $5.00, and anything longer costs the day rate, $12.00. On Sundays (`Sun` or `sun`) parking is free. Typing `2` and `Mon` should print:

  ```
  Fee: $5.00
  ```

  It has three bugs. Trace it with a short stay, a long stay and a Sunday before you run it, then fix what you find and run it again. Check that it prints something for every case.
test_skills:
  test_short_stay: [py.if-elif-else/elif-order, py.tracing-code/follow-branches]
  test_longer_stays: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_sunday_free: [py.logical-operators/or-trap]
  test_always_prints: [py.if-elif-else/blocks]
