id: step-read
stage: fill_in
rev: 1
title: "Read the inputs"
prompt: |
  Here's the checkpoint's ticket program with its first part missing. Replace each `...` so it asks for the age (a whole number), the day, and whether the visitor is a member. Typing `10`, `Sat` and `no` should print:

  ```
  Ticket: child
  Price: $8.00
  ```
hints:
  - "Each `...` gets one answer from the user with `input()`."
  - "The age is compared with numbers below, so convert it: `int(input(...))`. The day and the membership are compared with text, so leave them as they are."
