id: step-extras
stage: fill_in
rev: 1
title: "Add the extras"
prompt: |
  The band is chosen; now the two extras are missing their conditions. Replace each `...` so that Saturdays and Sundays add $2 to any ticket that isn't free, and members pay 90%. Typing `10`, `Sat` and `no` should print:

  ```
  Ticket: child
  Price: $8.00
  ```

  and `30`, `Sat`, `yes` should print `Ticket: adult` and `Price: $12.60`.
hints:
  - "The weekend condition has two parts joined with `and`: it's a weekend, and the price is more than 0. Put the weekend part in brackets."
  - "A weekend is `day == \"Sat\" or day == \"Sun\"`: a complete comparison on each side of `or`. `day == \"Sat\" or \"Sun\"` would count as true every day."
  - "The member condition compares the answer with the text `\"yes\"`."
