id: build-pool
stage: build
rev: 1
title: "Swimming pool entry"
prompt: |
  Starting from a blank editor, write a program that prices entry to a swimming pool. It asks for the swimmer's age (a whole number), the session (`morning`, `afternoon` or `evening`), and whether they have a swim card (`yes` or `no`). Then:

  - **The kind of ticket and its price:** under 3 is `free` ($0); 3 to 15 is `child` ($3); 60 and over is `senior` ($3.50); everyone else is `adult` ($5).
  - **Evening sessions** add $1, unless the ticket is free.
  - **Card holders** pay 80% of the result.

  It prints the kind of ticket and the price with two decimal places. Typing `30`, `evening` and `yes` should print:

  ```
  Ticket: adult
  Price: $4.80
  ```

  The questions it asks can say anything you like.
test_skills:
  test_adult: [py.if-elif-else/if-else, py.strings-and-input/convert]
  test_child_and_free: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_senior: [py.if-elif-else/elif-order, py.booleans-and-comparisons/compare]
  test_evening: [py.logical-operators/and-or, py.booleans-and-comparisons/compare]
  test_card: [py.arithmetic/operators, py.if-elif-else/if-else]
  test_two_decimals: [py.strings-and-input/fstrings]
  test_layout: [py.programs-and-print/print-text, py.strings-and-input/fstrings]
