id: step-bands
stage: fill_in
rev: 1
title: "Choose the band"
prompt: |
  Now the inputs are read, and the conditions of the chain are missing. Replace each `...` with a condition so that the right band is chosen: under 5 is free, 5 to 12 is a child, 65 and over is a senior, and everyone else is an adult. Typing `10`, `Sat` and `no` should print:

  ```
  Ticket: child
  Price: $8.00
  ```
hints:
  - "The first condition catches the youngest: `age < 5`."
  - "The first `True` condition wins, so the second one only needs to ask whether the age is 12 or less: anyone reaching it is already 5 or more."
  - "The third catches seniors: 65 or more. Everyone left over falls into the `else`."
