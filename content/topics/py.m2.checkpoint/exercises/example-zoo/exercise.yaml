id: example-zoo
stage: worked_example
rev: 1
title: "Zoo tickets"
prompt: |
  This program is like the checkpoint's build, in a different story: zoo tickets with age bands, a weekend extra and a discount for annual pass holders. Press **Run** and try `10`, `Sat`, `no`, then `30`, `Mon`, `yes`, and read how it's built.

  Like the receipt in Checkpoint 1, it's planned in three parts: read the inputs, work out the ticket, print it.
steps:
  - label: "Plan with comments"
    lines: "1"
    note: "The comments on lines 1, 6 and 24 name the three parts. The middle part is the new one: it has rules in it."
  - label: "Read the inputs"
    lines: "2-4"
    note: "The age is a number, so `int()`. The day and the pass answer stay text, because they'll be compared with text like `\"Sat\"` and `\"yes\"`."
  - label: "Choose the band, in order"
    lines: "7-18"
    note: "One `if` / `elif` / `else` chain picks exactly one band. The first `True` condition wins, so each test can assume the ones above it were `False`: by the time Python reaches `age <= 15`, the age is at least 3. Each branch sets two names, `kind` and `price`, so everything below can use them."
  - label: "Add the extras, in the order the rules give"
    lines: "19-22"
    note: "The weekend condition has a complete comparison on each side of `or`, and `and price > 0` keeps free tickets free. The pass discount comes *after* the extra, so it applies to the whole price. Swap the two `if`s and the answers change."
  - label: "Print the ticket"
    lines: "25-26"
    note: "Two f-strings. `{kind}` is text and prints as it is; `{price:.2f}` shows two decimal places, so 12 prints as `12.00`."
