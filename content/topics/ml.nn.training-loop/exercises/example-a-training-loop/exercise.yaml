id: example-a-training-loop
stage: worked_example
rev: 1
title: "A training loop"
prompt: |
  Three overlapping clouds of points to classify, split into training and validation rows; `fit` over 30 epochs of shuffled mini-batches with the history printed as text bars; the same loop at a learning rate that stalls and one that diverges; batch sizes of 8 and of the whole set; and Adam. Press **Run**, then read how each part works.
steps:
  - label: "The classes and the optimizers"
    lines: "4-107"
    note: "The module's layers and the softmax cross-entropy as they stand after the last topics, plus two optimizers as objects: `SGD.step` subtracts the learning rate times the gradient from every parameter, and `Adam.step` keeps running averages of each gradient and of its square and scales each parameter's step by their ratio, as Module 4 derived. The loop asks the network for `parameters()` and `gradients()` and hands them to whichever optimizer it was given."
  - label: "Data, the split, batches and evaluation"
    lines: "110-142"
    note: "`make_blobs` draws 100 points around each of three centres with a seed. `split` shuffles once and cuts 80/20: the validation rows are never trained on. `batches` shuffles the training indices afresh and yields them `batch_size` at a time, the last batch short. `accuracy` is the share of rows whose largest logit is the true class; `evaluate` runs forward and the loss on a whole set with no update."
  - label: "fit, and reading a curve"
    lines: "145-169"
    note: "For each epoch, for each batch: forward, loss, backward, step. After the epoch, the training and validation losses and the validation accuracy go into the history. `read_curve` names a curve from its first and last values: diverging if the loss grew by half or stopped being a number, stalled if it fell by less than a tenth, converging otherwise."
  - label: "Thirty epochs, printed"
    lines: "172-186"
    note: "240 training rows and 60 held out (the split is random, so the classes aren't exactly 20 each). Guessing a third for every class would sit at log 3, 1.099; the random start does better by luck and the loss falls steadily; the bars shrink; the validation accuracy climbs to 92%. Eight batches an epoch for thirty epochs is 240 steps."
  - label: "A rate that stalls and one that diverges"
    lines: "188-191"
    note: "At 0.00005 (printed as 5e-05) the loss moves by a few hundredths in thirty epochs: stalled. At 0.05 it converges. At 30 every step overshoots so badly that the weights overflow and the loss is NaN by the end of the first epoch: diverging (the `errstate` only silences NumPy's overflow warnings so the run can finish). The first fix for either is the learning rate, by a factor of ten."
  - label: "Batch size, and Adam"
    lines: "193-199"
    note: "Batches of 8 take 900 steps in thirty epochs and reach 97%; the whole set as one batch takes 30 smooth steps and reaches 83% at the same rate, because fewer steps of the same size cover less ground. Adam at 0.01 on batches of 32 reaches 97%, adjusting each parameter's step on its own."
