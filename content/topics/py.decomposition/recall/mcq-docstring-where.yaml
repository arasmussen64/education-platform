id: mcq-docstring-where
type: mcq
rev: 1
prompt: |
  Where does a function's docstring go?
choices:
  - 'In a `#` comment on the line above the `def`'
  - 'On the first line inside the function, in triple quotes'
  - 'At the end of the function, after the `return`'
  - 'Inside `main()`, next to the call'
answer: 1
explanation: |
  A docstring is a string on the first line of the function's body, in triple quotes: `"""Return the area of a rectangle."""`. Python keeps it as the function's documentation, which `help()` shows. A `#` comment above the `def` is just a comment, and a string anywhere else in the body is ignored.
skills: [docstrings]
