id: review-mcq-good-name
type: mcq
rev: 1
prompt: |
  Which of these is the best name for a function that returns how many words a line of text has?
choices:
  - '`process(x)`'
  - '`func2(data)`'
  - '`count_words(text)`'
  - '`do_stuff(text)`'
answer: 2
explanation: |
  `count_words(text)` says what the function does and what it works on, so a reader of `main` knows what's happening without opening the function. `process`, `func2` and `do_stuff` could mean anything, and a parameter called `x` or `data` says nothing about what to pass.
skills: [split-jobs]
