id: parsons-total-price
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `36.0`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'def total_price(price, quantity):'
  - '    subtotal = price * quantity'
  - '    tax = subtotal * 0.2'
  - '    return subtotal + tax'
  - 'print(total_price(10, 3))'
distractors:
  - '    print(subtotal + tax)'
explanation: |
  Inside the function, each step builds on the one before: the subtotal (30), then the tax on it (6.0), then the sum returned. A function that printed instead of returning would hand back `None`, and the caller's print would show that.
skills: [compose, split-jobs]
