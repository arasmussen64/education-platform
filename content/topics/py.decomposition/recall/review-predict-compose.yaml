id: review-predict-compose
type: predict_output
rev: 1
prompt: |
  What does this program print? One line.
code: |
  def tax(amount):
      """Return 10% tax on the amount."""
      return amount * 0.1


  def total(amount):
      """Return the amount plus tax."""
      return amount + tax(amount)


  def receipt(amount):
      """Return the total as a receipt line."""
      return f"Total: {total(amount):.2f}"


  print(receipt(50))
expected_output: |
  Total: 55.00
explanation: |
  `receipt(50)` calls `total(50)`, which calls `tax(50)` to get 5.0 and returns 55.0. `receipt` formats that with two decimal places. Three small functions, each with one job, stacked three calls deep.
skills: [compose]
