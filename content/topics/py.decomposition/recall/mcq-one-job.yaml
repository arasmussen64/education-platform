id: mcq-one-job
type: mcq
rev: 1
prompt: |
  A program asks for a temperature in Celsius, converts it to Fahrenheit, and prints a sentence with both. Which split into functions follows "one job per function"?
choices:
  - '`do_everything()`, which asks, converts and prints'
  - '`to_fahrenheit(celsius)` returns the converted number; `describe(celsius, fahrenheit)` returns the sentence; `main()` asks, calls both and prints'
  - '`convert_and_print(celsius)` converts and prints; `main()` asks'
  - '`main()` asks, converts and prints; `helper()` is empty, for later'
answer: 1
explanation: |
  Each function in the second option has one job and a name that says what it is, and the two workers return values that `main` combines. "Convert and print" is two jobs in one function, which can't be reused or tested without printing, and an empty `helper` is a name without a job.
skills: [split-jobs]
