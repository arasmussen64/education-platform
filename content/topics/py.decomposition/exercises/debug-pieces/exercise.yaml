id: debug-pieces
stage: debug
rev: 2
title: "Pieces out of place"
prompt: |
  This program describes a rectangle 3 wide and 4 high, with one small function for each job. It should print:

  ```
  3 x 4: area 12, perimeter 14
  ```

  Instead it stops with an `UnboundLocalError` before printing anything. It has three bugs, and fixing one shows the next. Run it, read the error, then check each function against what its docstring promises. You're done when it prints the line above and every check passes.
hints:
  - "Read the error's last line and the line number it names: which variable is used before it has a value?"
  - "The lines in `main` run from top to bottom, so `describe(w, h)` runs before `w` and `h` are set."
  - "Once it runs, the perimeter comes out as `None`. `perimeter` works out `2 * (width + height)`, but a function only hands a value back with `return`."
  - "The checks say `area` has no docstring. A docstring is the first line inside the function; a string anywhere after that is just a string."
skills: [compose, docstrings, split-jobs]
