id: build-report
stage: build
rev: 1
title: "Text statistics, in pieces"
prompt: |
  Starting from a blank editor, rebuild part of Checkpoint 3 as small functions, each with a docstring. The text is words separated by single spaces, at least one word.

  - `count_words(text)` returns how many words there are.
  - `longest_word(text)` returns the longest word (the first of them, if two tie).
  - `summary(text)` returns one line like `4 words, longest: quick`, using the other two functions.
  - `main()` prints `summary("the quick brown fox")` and then `summary("hello")`.

  Call `main()` at the bottom. The three workers return their results and print nothing.
skills: [split-jobs, docstrings, compose]
