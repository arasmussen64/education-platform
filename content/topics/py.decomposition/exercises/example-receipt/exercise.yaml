id: example-receipt
stage: worked_example
rev: 1
title: "A receipt, in pieces"
prompt: |
  Checkpoint 1's receipt, rebuilt as functions: two workers that return values, and a `main` that composes them. Press **Run**. Then read `main` on its own: it's the plan of the program, and each line of it is one job handed to one function.
steps:
  - label: "One job: the maths"
    lines: "1-3"
    note: "`total_with_tax` works out one number and returns it. Its docstring, the sentence in triple quotes on its first line, says what it does. It doesn't print, so `main` or a test can use the number."
  - label: "One job: the wording"
    lines: "6-8"
    note: "`receipt_line` turns a label and an amount into one line of text. Same shape: docstring, then return. It knows nothing about tax."
  - label: "main composes"
    lines: "11-15"
    note: "`main` is the plan: a price, the total from `total_with_tax`, then two lines from `receipt_line`. Each result is passed into the next call. Printing happens only here."
  - label: "The one call"
    lines: "18"
    note: "As always, the definitions sit above and a single call at the bottom starts the program."
