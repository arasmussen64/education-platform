id: fill-docstring
stage: fill_in
rev: 1
title: "Say what it does, then use it"
prompt: |
  `words_in` counts the words in a line of text, but it has no docstring, and `describe` counts nothing: it should use `words_in`. Replace the first `...` with a docstring for `words_in`, and the second with the call that gives the number of words. Running the program should print:

  ```
  'the quick brown fox' has 4 words
  ```
hints:
  - 'A docstring is a sentence in triple quotes on the first line of the body: `"""Return how many words the text has."""`'
  - "`describe` shouldn't count again. Inside the braces, call the function that already does it: `words_in(text)`."
skills: [docstrings, compose]
