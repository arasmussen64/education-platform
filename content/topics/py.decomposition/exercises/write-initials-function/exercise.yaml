id: write-initials-function
stage: write
rev: 1
title: "Initials, as a function"
prompt: |
  In Module 3 you wrote a program that printed someone's initials. Now write it as a reusable piece: a function `initials(full_name)` that **returns** the initials of a name whose parts are separated by single spaces, with a docstring saying what it does. `initials("Ada King Lovelace")` returns `"AKL"`, and `initials("Guido")` returns `"G"`. The function prints nothing.
hints:
  - "Start with the first character, `full_name[0]`, then walk along the name: every character that follows a space is an initial too."
  - 'The docstring goes on the first line of the body: `"""Return the initials of a full name."""`'
  - "Build the result in a variable and `return` it at the end, instead of printing."
skills: [docstrings, split-jobs]
