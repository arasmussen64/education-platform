# The recall items read sshd configuration, socket listings, firewall
# status, sudoers and scan reports with the text tools of the first topic.
# The worked example, the fill-in, the write and both proofs are labs that
# harden a real machine and prove it without locking anyone out: SSH keys
# only, a default-deny firewall, the open ports audited, and a lock-out to
# undo. Benchmark scanners (CIS, OpenSCAP, Lynis) are in the lesson and the
# recall; the labs prove the baseline with their own checks, which is the
# same scan-before-and-after idea (ADR-0017, ADR-0018).
practice:
  - example-harden-ssh
  - mcq-baseline-contents
  - hard-listening-audit
  - mcq-remove-services
  - hard-sshd-effective
  - hard-sshd-config
  - mcq-ssh-settings
  - mcq-fail2ban-mfa
  - hard-ufw-status
  - mcq-firewall-default-deny
