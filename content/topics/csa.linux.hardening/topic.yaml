prove:
  build: build-harden-the-server
  debug: debug-locked-out
  explain:
    prompt: |
      You're handed a freshly installed Ubuntu server that will face the internet, and a week to make it defensible. Explain, in your own words: what your baseline would contain and why each item matters; the SSH changes you'd make and how you'd make them without locking yourself out; how you'd set the firewall and what the cloud's security group adds; how you'd find and remove what the server doesn't need; and how you'd prove the result with a benchmark scan, including what you'd do with a finding you can't fix.
    rubric:
      - id: baseline
        required: true
        description: "Updates applied and automatic security updates on; only needed packages and services; SSH keys only and no root login; a default-deny firewall with the needed ports; people log in as themselves and use sudo, services run as their own users; sane permissions on secrets; time sync; logs kept and shipped; a baseline is applied once and then audited."
      - id: ssh
        required: true
        description: "In sshd_config: PasswordAuthentication no, PermitRootLogin no, an AllowGroups or AllowUsers list, a low MaxAuthTries; check with sshd -t before restarting, keep the current session open while testing a new one, read what the files add up to with sshd -T, and reload so the running server uses them; keys are already in place first."
      - id: firewall
        required: true
        description: "Default deny inbound, allow established, loopback, SSH and the service's ports (ufw or nftables); allow outbound; the cloud security group is the same rule set at the network edge, and both are set because either alone can be misconfigured."
      - id: surface
        required: true
        description: "ss -ltnp lists what listens and on which address; anything on 0.0.0.0 that isn't needed (print servers, rpcbind, unused databases) is uninstalled or disabled, or bound to localhost; fewer packages mean fewer updates and fewer holes."
      - id: scan
        required: true
        description: "A CIS Benchmark is a published, numbered list of settings (Level 1 safe for all, Level 2 stricter); OpenSCAP, Lynis or the Ubuntu Security Guide scan the machine against it and score it; scan before, apply the baseline, scan after and keep both reports; a finding you can't fix is recorded as an exception with the reason and a compensating control, not hidden."
    model_answer: |
      My baseline is the short list that stops the common attacks, applied once and then checked. First, patch it fully and turn on unattended security updates, since most compromises use fixes that already exist. Second, SSH: the key is already installed for my user, so I set PasswordAuthentication no, so passwords can't be guessed, PermitRootLogin no, so the one account everyone knows the name of can't be used, AllowGroups ssh-users so only people in that group can log in, and MaxAuthTries 3. Before restarting sshd I run sshd -t, which checks the file for mistakes, and I keep my current session open while I open a new one to prove the change works; sshd -T then shows the settings actually in effect, which catches a stray include file. Third, the firewall: default deny on everything inbound, allow established connections and the loopback, then only 22 and 443 (or 80 if the site redirects), with outbound allowed for now; ufw does this in four lines, nftables in a short ruleset. The cloud's security group gets the same rules, because it filters at the network edge before packets reach the host, and because either one can be misconfigured by someone later. Fourth, attack surface: ss -ltnp shows everything that is listening and on which address; a print service, rpcbind or a database listening on 0.0.0.0 that nothing needs gets uninstalled, or at least disabled and bound to localhost, and I remove packages I'm not using, since each one is an update to track and a potential hole. Fifth, least privilege: people log in as themselves and use sudo, with no NOPASSWD: ALL for a whole group; services run as their own unprivileged users with systemd's sandboxing where it's cheap; secrets are mode 600; the clock is synced so logs and certificates agree; logs are kept past a reboot and shipped off the box so an intruder can't erase them. Then I prove it. A CIS Benchmark is a published, numbered list of recommended settings for a given OS, Level 1 being the safe-for-everyone set and Level 2 the stricter one that can break things. I run a scan before any change, with the Ubuntu Security Guide, OpenSCAP against the CIS profile, or Lynis for a quick hardening index, apply the baseline, and scan again, keeping both reports so the improvement is on record and the next scan has something to compare to. A finding I can't or shouldn't fix, say a setting the application needs, is written down as an exception with the reason and the compensating control, not quietly ignored, and the scan is scheduled to run again so drift shows up.
review_pool:
  - hard-listening-audit
  - hard-sshd-effective
  - hard-ufw-status
  - hard-lynis-before-after
  - mcq-ssh-settings
  - mcq-prove-with-scan
