id: csa.linux.hardening
kind: topic
status: ready
title: "Hardening"
summary: "Apply a security baseline to a server, then prove it: SSH with keys only and no root login, a default-deny firewall, fewer services, least privilege, automatic security updates, and a benchmark scan (CIS, OpenSCAP, Lynis) before and after to show the difference."
prerequisites: [csa.linux.permissions, csa.linux.services, csa.linux.packages, csa.linux.net-tools]
estimated_minutes: 100
rev: 1
objectives:
  - "List what a server security baseline contains and why each item is there: updates, minimal packages, SSH keys only and no root login, a default-deny firewall, least-privilege users and services, file permissions, time sync, logging."
  - "Harden SSH: `PasswordAuthentication no`, `PermitRootLogin no`, allowed groups, and `sshd -t` and `sshd -T` to test the files and see what they add up to without locking yourself out, then a reload so the running server uses them."
  - "Set a default-deny inbound firewall with only the needed ports, with the cloud's security group as the outer layer."
  - "Audit what a server exposes and remove what it doesn't need: `ss -ltnp` as the checklist, uninstalling and disabling services."
  - "Explain what a CIS Benchmark is (Levels 1 and 2), run a scan with OpenSCAP or Lynis, and prove the baseline with a before-and-after comparison, documenting exceptions."
