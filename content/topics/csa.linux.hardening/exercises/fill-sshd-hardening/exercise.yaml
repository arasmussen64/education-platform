id: fill-sshd-hardening
stage: fill_in
runtime: lab
lab:
  init: systemd
rev: 2
title: "Finish the SSH hardening"
prompt: |
  A hardening drop-in has been started at `/etc/ssh/sshd_config.d/90-hardening.conf`, but four values are missing, each marked `...`: whether to allow password logins, whether to allow root logins, which group may log in, and the maximum number of tries. Fill them in with `sudo nano /etc/ssh/sshd_config.d/90-hardening.conf` so that passwords and root login are off, only the `ssh-users` group may log in, and the try limit is `3`. Check the file with `sudo sshd -t` (it should say nothing). Then apply it. On a server where SSH is already running that is `sudo systemctl reload ssh`; here the service couldn't start while the file had gaps, so there is nothing to reload and it's `sudo systemctl restart ssh`. Read the effective settings with `sudo sshd -T | grep -iE 'password|root|allowgroups|maxauth'`, and prove you can still get in with `ssh -i ~/keys/ben ben@localhost` (ben is in `ssh-users`). Then run the checks.
hints:
  - "`PasswordAuthentication` and `PermitRootLogin` both take `no`. `AllowGroups` takes the group name, `ssh-users`. `MaxAuthTries` takes the number `3`."
  - "`sudo sshd -t` parses the file and is silent when it's valid; if you leave a `...` in, it will complain about a bad value. Fix it until it's quiet."
  - "`sudo sshd -T` prints the settings in the files, lowercased; that's how you confirm the drop-in is read. The SSH server that is running has them only after a `reload` or a `restart`: if you change the file again later, tell the server again."
skills: [ssh-hardening]
