id: build-harden-the-server
stage: build
runtime: lab
lab:
  init: systemd
rev: 1
title: "Apply the baseline"
prompt: |
  Put the whole baseline on this server, and don't lock yourself out. Four things:

  1. **Harden SSH.** A drop-in in `/etc/ssh/sshd_config.d/` with `PasswordAuthentication no`, `PermitRootLogin no`, `AllowGroups ssh-users`, `MaxAuthTries 3`. Check it with `sudo sshd -t`, then apply it with `sudo systemctl reload ssh` (`restart` if the service isn't running).
  2. **A default-deny firewall.** Write `/etc/nftables.conf` with an `input` chain whose policy is `drop`, accepting only loopback, established and related connections, and new connections to SSH (`tcp dport 22`). Load it with `sudo nft -f /etc/nftables.conf` and enable it with `sudo systemctl enable nftables`, so it comes back on reboot. (Turning the firewall *off* to make something work is the thing a baseline forbids.)
  3. **Close the open door.** A debugging service, `shop-debug`, is listening on `0.0.0.0:9000`. Stop and disable it so it isn't listening and won't come back.
  4. **Prove you can still get in:** `ssh -i ~/keys/ben ben@localhost` must still work (ben is in `ssh-users`).

  Check your work with `sudo sshd -T`, `sudo nft list ruleset`, `sudo ss -ltnp` and the login. Then run the checks.
hints:
  - "The firewall, in `/etc/nftables.conf`: `table inet filter { chain input { type filter hook input priority filter; policy drop; iif lo accept; ct state established,related accept; tcp dport 22 accept; } }` (plus `forward` drop and `output` accept chains). `nft -c -f /etc/nftables.conf` checks it without loading."
  - "`sudo systemctl stop shop-debug && sudo systemctl disable shop-debug` closes the door now and keeps it closed; confirm with `sudo ss -ltnp | grep 9000` showing nothing."
  - "Loopback is allowed by `iif lo accept`, so your `ssh ... ben@localhost` keeps working through the firewall; that's why that rule comes first."
skills: [baseline, ssh-hardening, firewall-min, attack-surface]
