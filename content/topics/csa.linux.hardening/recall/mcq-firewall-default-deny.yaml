id: mcq-firewall-default-deny
type: mcq
rev: 2
prompt: |
  A web server's firewall allows everything inbound except a blocklist of ports someone wrote down last year, and the cloud security group allows all traffic "because the host firewall handles it". What's wrong?
choices:
  - "The blocklist is a year out of date: both layers need the newly risky ports added to it"
  - "The host firewall is wasted effort: with a security group in front of it, it can be switched off"
  - "Both layers should deny inbound by default and allow only the ports the server needs"
  - "Only the outbound side: a web server needs its outgoing traffic filtered, not its incoming"
answer: 2
explanation: |
  Both layers are backwards. A blocklist protects against the ports you thought of; a default deny protects against the ones you didn't, including the debugging port someone opens next month. Bringing the blocklist up to date doesn't change that: it is out of date again the day after.

  The two layers are deliberately redundant, so neither is wasted effort: a security group is edited in a console by many hands, a host firewall by an admin on the box, and each catches the other's slips. Two independent default-deny layers mean one mistake doesn't open the machine. Inbound is where attacks arrive, so it comes first; outbound filtering comes later in the track, when the server's own outgoing traffic is worth controlling.
skills: [firewall-min]
