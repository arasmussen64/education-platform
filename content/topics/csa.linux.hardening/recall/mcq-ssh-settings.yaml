id: mcq-ssh-settings
type: mcq
rev: 1
prompt: |
  You're about to set `PasswordAuthentication no` and `PermitRootLogin no` on a server you reach only over SSH. What's the safe procedure?
choices:
  - "Edit the file, restart sshd, log out, log back in"
  - "First confirm your key already logs you in; edit the file; run `sshd -t` to check it for errors; reload sshd; then, keeping your current session open, open a second session to prove you can still get in; only then close the first"
  - "Reboot the server to apply the change"
  - "Set the options over the cloud console's serial port instead"
answer: 1
explanation: |
  A typo in `sshd_config` can leave sshd unable to start, and turning passwords off before a key works locks you out: both are solved by testing before reloading and by never closing the session you came in on until a fresh one succeeds. `sshd -t` validates the file; a reload keeps existing connections alive; the second session is the proof. A reboot would be the lock-out itself if the config were wrong.
skills: [ssh-hardening]
