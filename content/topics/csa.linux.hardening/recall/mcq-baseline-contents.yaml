id: mcq-baseline-contents
type: mcq
rev: 2
prompt: |
  Which list is a server security *baseline*, as opposed to a collection of nice-to-haves?
choices:
  - "A custom-built kernel, SSH moved to an unusual port, a renamed root account, and a banner warning attackers off"
  - "Antivirus on every server, passwords that expire each month, a screensaver lock, and IPv6 switched off"
  - "A firewall blocklist of risky ports, password logins guarded by `fail2ban`, root over SSH, and logs kept on the server"
  - "Automatic security updates, key-only SSH with no root login, a default-deny firewall, and logs shipped off the server"
answer: 3
explanation: |
  A baseline is the minimum every server gets because it defeats the attacks every server faces: known vulnerabilities (patching), password guessing (keys, no root login), open doors (a default-deny firewall, fewer services), privilege misuse (sudo, service users, secrets readable only by their owner), and covering tracks (synced time, logs shipped away). A baseline is also something you can scan for, which is what makes it provable.

  The list with the blocklist is the tempting one, because it has a firewall, SSH protection and logs. But each is the weak form: a blocklist stops only the ports someone thought of, passwords can still be guessed however many addresses `fail2ban` bans, root can log in, and logs kept on the server are logs an intruder can erase. The unusual port, the renamed account and the banner are camouflage that hides nothing from a scanner, and the antivirus list is aimed at desktops.
skills: [baseline]
