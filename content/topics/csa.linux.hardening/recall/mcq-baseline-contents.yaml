id: mcq-baseline-contents
type: mcq
rev: 1
prompt: |
  Which list is a server security *baseline*, as opposed to a collection of nice-to-haves?
choices:
  - "A custom kernel, a non-standard SSH port, and a banner warning attackers off"
  - "Patched with automatic security updates; SSH keys only and no root login; a default-deny firewall; only the services the server needs; people using sudo and services as their own users; secrets readable only by their owner; synced time; logs kept and shipped off the machine"
  - "Antivirus, a password policy, and a screensaver lock"
  - "Disabling IPv6 and renaming the root account"
answer: 1
explanation: |
  A baseline is the minimum every server gets because it defeats the attacks every server faces: known vulnerabilities (patching), password guessing (keys, no root), open doors (firewall, fewer services), privilege misuse (sudo, service users, permissions), and covering tracks (time, logs). The other lists are either cosmetic (a moved port, a banner) or aimed at desktops. A baseline is also something you can scan for, which is what makes it provable.
skills: [baseline]
