id: mcq-cis-levels
type: mcq
rev: 1
prompt: |
  What is a CIS Benchmark, and what do its Level 1 and Level 2 mean?
choices:
  - "A speed test for servers; Level 2 is faster"
  - "A published, consensus-written list of security settings for a specific operating system, each with a rationale and an audit check; Level 1 is the set safe to apply to any server, Level 2 is stricter, for sensitive systems, and may break things"
  - "A certification you pay for; Level 2 costs more"
  - "A Linux kernel setting; Level 2 enables SELinux"
answer: 1
explanation: |
  The benchmarks exist for Ubuntu, RHEL, Windows, Kubernetes, the cloud providers and more, and each recommendation is numbered, so a finding like "5.2.8 Ensure SSH root login is disabled" means the same thing to everyone. Level 1 is the practical baseline; Level 2 adds controls with real trade-offs. Scanners (OpenSCAP, the Ubuntu Security Guide, commercial tools) check a machine against a benchmark profile and report what passes and fails.
skills: [benchmarks-scanning]
