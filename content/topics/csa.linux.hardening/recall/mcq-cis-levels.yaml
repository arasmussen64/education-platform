id: mcq-cis-levels
type: mcq
rev: 2
prompt: |
  What is a CIS Benchmark, and what do its Level 1 and Level 2 mean?
choices:
  - "A scanner that scores a server's settings out of 100; Level 1 is its quick scan and Level 2 its full one"
  - "A list of recommended settings for one operating system; Level 1 is safe for any server, Level 2 is stricter"
  - "A list of recommended settings for one operating system; Level 1 is the strictest, Level 2 is safe for any server"
  - "A certification that an auditor awards to a company; Level 1 covers its servers, Level 2 its whole network"
answer: 1
explanation: |
  A CIS Benchmark is a published, consensus-written list of security settings for a specific system, each with a rationale and an audit check. They exist for Ubuntu, RHEL, Windows, Kubernetes, the cloud providers and more, and each recommendation is numbered, so a finding like "5.2.8 Ensure SSH root login is disabled" means the same thing to everyone. Level 1 is the practical baseline, safe to apply to any server; Level 2 adds stricter controls for sensitive systems, with real trade-offs: they may break things. The higher number is the stricter one, not the other way round.

  The benchmark is the list, not the tool: scanners (OpenSCAP, the Ubuntu Security Guide, commercial tools) check a machine against a benchmark profile and report what passes and fails, and the score out of 100 is Lynis's own hardening index. Nobody awards a benchmark to a company; it is a free document you measure servers against.
skills: [benchmarks-scanning]
