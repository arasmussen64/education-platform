id: mcq-prove-with-scan
type: mcq
rev: 1
prompt: |
  After hardening a server, a scan still reports one failing rule: the application needs a setting the benchmark forbids. What do you do?
choices:
  - "Edit the report so the rule shows as passed"
  - "Record it as a documented exception: which rule, why the application needs it, what compensating control reduces the risk, and who approved it; keep the before-and-after reports, and schedule the scan to rerun so drift shows up"
  - "Stop running the scanner, since it will always complain"
  - "Uninstall the application"
answer: 1
explanation: |
  Benchmarks are written for the general case, and a real server will have a few justified deviations. What matters is that they're deliberate and visible: an exception with a reason and a compensating control is a decision; a silent failure is a gap nobody owns. The before-and-after reports are the proof the baseline was applied, and a scheduled rescan is what keeps it true next month, when someone "temporarily" re-enables password logins.
skills: [benchmarks-scanning]
