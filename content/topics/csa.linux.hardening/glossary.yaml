- term: hardening
  definition: "The short list of changes that make a server resist the usual attacks: patches, keys-only SSH, a default-deny firewall, fewer services and least privilege."
- term: attack surface
  definition: "Everything an attacker could reach on a system: every listening port, service, account and permission. Hardening makes it smaller."
- term: security group
  definition: "A cloud provider's firewall around a server, set in the cloud rather than on the machine, holding the same allow rules at the network's edge."
- term: CIS Benchmark
  definition: "A published, numbered list of recommended security settings for one operating system or product, each with a reason and an audit command. Level 1 suits every server."
