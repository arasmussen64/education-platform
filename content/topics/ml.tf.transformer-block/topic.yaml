id: ml.tf.transformer-block
kind: topic
status: planned
title: Heads, residuals and the transformer block
summary: "Several attention heads in parallel, each a slice of the model's width, concatenated; residual connections that give the gradient a straight road back; layer normalization and its gradient; the position-wise MLP; the block assembled from the module's layers, gradient-checked, and its parameter count from the model's width."
prerequisites:
- ml.tf.attention
estimated_minutes: 60
rev: 1
objectives:
- Split the width into heads, run attention per head and concatenate, and say what heads buy.
- Implement residual connections and layer normalization with their backward passes, and say what each does to the gradient and the activations.
- Assemble a transformer block (attention, residual, norm, MLP, residual, norm) that passes the gradient check.
- "Count a block's parameters from the width, the number of heads and the MLP's size."
