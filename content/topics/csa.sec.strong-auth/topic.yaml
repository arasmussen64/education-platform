skills:
  - id: phishing-resistance
    description: "Why a password, a one-time code, a push and a text message can be relayed by an adversary in the middle (the secret is typed, or the session cookie is taken) and why WebAuthn cannot (the browser and the key bind the signature to the real site's origin and relying-party id, and the server checks); CISA's strongest-to-weakest order; NIST's AALs, with a phishing-resistant option required at AAL2 and syncable authenticators barred from AAL3; registration as the weak moment; a phishing site with a valid certificate."
  - id: authentication-strength
    description: "Requiring a method by role or app rather than offering it: an identity provider's conditional sign-in flow (a role condition, then a security key as a must), Entra's three built-in authentication strengths and step-up; reading the amr claim; why a phishable alternative beside a strong method weakens it, and why a condition on a role nobody has fails open."
  - id: conditional-access
    description: "Policies as assignments, conditions and grant controls in Microsoft Entra's shape; how they evaluate (every applicable policy, assignments ANDed, an exclusion beats an inclusion, a block wins, grant controls ANDed or ORed); device compliance and sign-in risk; the P1 and P2 licences and the free security defaults; and the AWS and Google equivalents; the sums of blocked sign-ins and licence cost."
  - id: break-glass
    description: "Emergency access accounts: two or more cloud-only accounts with a phishing-resistant key different from the daily method, excluded only through one dedicated group from the policies that block or restrict, with an alert on every sign-in and a drill on a schedule; mandatory MFA applies to them too; and how checks prove they get in while nothing else got weaker."
  - id: rollout-without-lockout
    description: "Report-only and the What If tool (which names the first condition that didn't match), a staged rollout with an admin excluded, and reading report-only results; the numbers: how long a one-time code is accepted, the odds of guessing one before lockout, and how many sign-ins a report-only week would block."
