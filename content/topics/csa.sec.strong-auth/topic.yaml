prove:
  build: build-admin-sign-in
  debug: debug-weak-front-door
  explain:
    prompt: |
      Your company's admins sign in with passwords and an authenticator app, and an attacker has just phished one of them anyway. Explain, in your own words: how a phishing site gets past one-time codes, and what makes a security key or passkey different; how you would make admins use keys without leaving the old way open; the conditional-access policies you would write for admins, for everyone, and for a payments app, how they combine, and what they would cost on Entra; and how you would keep an emergency way in that does not become the weak spot, and prove it.
    rubric:
      - id: relay
        required: true
        description: "A phishing site relays the password and the one-time code to the real site within the code's short life, and keeps the session cookie the real site hands back, so MFA happens but doesn't help."
      - id: origin-binding
        required: true
        description: "A security key signs a challenge the browser binds to the site's real origin, and the key answers only for the site it registered with; the server checks the origin too. Nothing is typed, so a relay has nothing to collect."
      - id: require-not-offer
        required: true
        description: "Remove the phishable path for admins (an authentication strength, or a flow only a key can finish), so a key is the only way to finish; and enrol the first key under a stronger proof, because registration is the weak moment."
      - id: ca-evaluation
        required: true
        description: "Every applicable policy must be satisfied, a block wins, an exclusion beats an inclusion, and report-only and What If come before enforcement; Conditional Access needs P1 and risk needs P2, with security defaults as the free floor."
      - id: break-glass
        required: true
        description: "Two cloud-only accounts with phishing-resistant keys different from the daily method, excluded only through one dedicated group from the blocking or restricting policies, with an alert on every use and a drill on a schedule; and a test that others gained no way round."
      - id: clouds-differ
        required: false
        description: "Any correct difference: AWS enforces MFA for root and recommends passkeys; Google is phasing in mandatory 2-step verification and models device context with access levels; Entra's access tokens last 60 to 90 minutes."
    model_answer: |
      The phishing site is a relay. It shows the admin the real sign-in page, takes the password and the app code as they are typed, and passes them straight to the real site while the code is still good. The real site sets a session cookie, and the relay keeps it. From then on the attacker is the admin, with no need for the code again. The code did its job and still lost, because a code is a secret the person types, and a site in the middle collects it like any other field.

      A security key is different because it signs a fresh challenge that the browser wraps with the real site's name, and the key only answers for the name it was registered with. At the lookalike site the browser asks for the wrong name and the key has nothing to give; even a browser told to lie is caught, because the server checks the name inside what was signed. There is nothing to type and nothing to relay.

      To make admins actually use keys, I remove the phishable path: a flow (or an Entra authentication strength) where only a key finishes an admin sign-in, so adding a key is not enough on its own, the code has to stop working. I would enrol the first key under a stronger proof, such as a Temporary Access Pass, because whoever can register a key with just a password undoes the whole thing.

      For conditional access I would require MFA for everyone, require a phishing-resistant strength for admins, require a compliant device for the payments app, block high sign-in risk, and block legacy authentication. Every policy that applies must be satisfied, a block always wins, and an exclusion beats an inclusion. I would try them in report-only and with the What If tool first. It needs Entra ID P1, and the risk policy needs P2; with no licence the free security defaults are the floor.

      For the emergency way in I would keep two cloud-only accounts with their own passkeys, kept somewhere safe and different from the admins' daily method. I would exclude just those two, through one dedicated group, from the policies that block or restrict, and nothing wider. Every sign-in by them raises an alert someone reads, and a drill on a schedule proves they still get in. To show it didn't weaken anything, I test that an ordinary person in another group is still held to every policy while the emergency account gets in during a simulated outage.

      The clouds differ: AWS enforces MFA for the root user and recommends passkeys, and Google is phasing in mandatory 2-step verification and models device context with access levels rather than a per-sign-in policy engine.
