id: csa.sec.strong-auth
kind: topic
status: ready
title: Strong authentication and conditional access
summary: "Why a password and a one-time code can be phished and a security key cannot: an adversary-in-the-middle relay, seen for real, and the origin binding that defeats it. Requiring a strength by role in an identity provider and reading it from a token's amr claim; conditional-access policies in Microsoft Entra's shape and how they combine; a break-glass path that gets in without weakening anything; and rolling a policy out without locking anyone out."
# Module 4's plan (docs/plans/cloud-module-4/MODULE-4-BRIEF.md, sections 2,
# 3, 4.1 and 5) and its designer's brief (csa.sec.strong-auth.md), with what
# building the identity lab base found (BUILD-NOTES.md and
# content/lab-bases/id/README.md). Prerequisite: csa.sec.federation, which
# teaches tokens, claims, the realm file, realm-apply/realm-saved, signin and
# clocks, and owns the identity-lab onboarding; this topic points at its first
# lab for the basics and does not repeat them. Through federation it reaches
# csa.sec.authn-authz (factor, MFA, policy, the policy decision/enforcement
# points, 401/403) and the network and PKI topics (TLS, certificates, origin).
#
# This topic defines, for the module (the plan's 3.5): phishing, adversary in
# the middle, TOTP, FIDO2, WebAuthn, passkey, origin, AAL, authentication
# strength, conditional access, report-only, break-glass account. "Relying
# party" is Certificates and PKI's.
prerequisites: [csa.sec.federation]
# Worked out the README's way: lesson about 40 minutes (around 4,200 words with
# its tables), the puzzle and story 3, 19 ladder recall items at 1.5 = 29, the
# worked example 30, the fill-in 25, the write 35, the build 55, the debug 40,
# and the explain 15; plus the clock-free conditional-access reading in the
# lesson itself. About 300. No outside reading is assigned: every resource is
# an optional "go deeper" link (ADR-0031: the lesson teaches the whole topic).
estimated_minutes: 300
rev: 1
objectives:
  - "Say which MFA methods a phishing relay can defeat and why: a password, a one-time code, a push and a text message can all be relayed to the real site in real time, while a security key or passkey signs a challenge the browser binds to the real site's name, so a relay gets nothing; and place each method on NIST's AAL levels."
  - "Require a strength of authentication for a role, not just offer it: configure an identity provider so admins can only finish with a security key while others use an app code, read which methods a sign-in used from the token's amr claim, and explain why adding a key does nothing while a phishable method still lets an admin in."
  - "Write conditional-access policies in Microsoft Entra's shape (assignments, conditions on risk, device, location and client, grant controls) and predict any sign-in's outcome: every applicable policy must be satisfied, a block wins, an exclusion beats an inclusion, a report-only policy is reported and never enforced; and know what each needs (P1, P2) and what the free security defaults give."
  - "Keep a break-glass path that doesn't weaken anything: cloud-only emergency accounts with their own phishing-resistant keys, excluded only from the policies that block or restrict, through one dedicated group, with an alert on every use and a drill on a schedule; and prove with checks that they get in when the normal path fails and that nobody else gained a way round."
  - "Roll a policy out without locking anyone out: report-only first, What If for the cases you can't wait for, an excluded admin, and the numbers: how long a code is good for, the odds of guessing one, and how many sign-ins a report-only week would block."
# Facts, each read on 2026-11-23 unless noted.
# - NIST SP 800-63B (the current revision superseding SP 800-63B of 2020;
#   the page read carries the timestamp 26 Aug 2025): phishing resistance is
#   "the ability of the authentication protocol to prevent the disclosure of
#   authentication secrets ... to an impostor verifier"; its two methods are
#   channel binding and verifier name binding (WebAuthn is the example of the
#   latter); "Authenticators that involve the manual entry of an authenticator
#   output (e.g., out-of-band and OTP authenticators) SHALL NOT be considered
#   phishing-resistant"; passwords (3.1.1), out-of-band (3.1.3) and OTP (3.1.4)
#   are "not phishing-resistant". "Verifiers SHALL offer at least one
#   phishing-resistant authentication option at AAL2." AAL3: "The cryptographic
#   authenticator used at AAL3 SHALL have a non-exportable private key and SHALL
#   provide phishing resistance"; "syncable authenticators SHALL NOT be used at
#   AAL3": pages.nist.gov/800-63-4/sp800-63b.html.
# - CISA, "Implementing Phishing-Resistant MFA" (October 2022): strongest to
#   weakest, FIDO/WebAuthn and PKI at the top, then app codes and push with
#   number matching ("vulnerable to phishing"), then push without number
#   matching, then SMS and voice ("vulnerable to phishing, SS7, and SIM swap");
#   "The only widely available phishing-resistant authentication is
#   FIDO/WebAuthn." US government work. The 508 PDF would not yield text to the
#   fetcher on 2026-11-23, so these points are taken from the designer's
#   recorded reading of 2026-11-12 and are consistent with SP 800-63B above;
#   the page is linked, not copied.
# - Microsoft Entra Conditional Access overview (ms.date 2026-04-27): policies
#   are "if-then statements", enforced "after first-factor authentication is
#   completed"; "Block access is the most restrictive decision"; "Using this
#   feature requires Microsoft Entra ID P1 licenses"; "Risk-based Conditional
#   Access policies ... require Microsoft Entra ID Protection, which is a
#   Microsoft Entra ID P2 feature"; security defaults are "available for all
#   customers": learn.microsoft.com/en-us/entra/identity/conditional-access/overview.
# - Microsoft, mandatory MFA for Azure (ms.date 2026-04-03): phase 1 from
#   October 2024 (Azure portal, Entra and Intune admin centres; Microsoft 365
#   admin centre from February 2025); phase 2 from 1 October 2025 (Azure CLI,
#   PowerShell, mobile app, IaC tools, REST control plane; read operations
#   excepted); break-glass accounts "are also required to sign in with MFA once
#   enforcement begins"; workload identities aren't impacted:
#   learn.microsoft.com/en-us/entra/identity/authentication/concept-mandatory-multifactor-authentication.
# - Microsoft Entra pricing (read 2026-11-23, no date on the page): Entra ID P1
#   $7.00, P2 $10.00 per user per month, billed yearly:
#   microsoft.com/en-us/security/business/microsoft-entra-pricing.
# - Google Cloud mandatory 2-step verification (read 2026-11-23): resellers
#   from 28 April 2025, personal accounts from 12 May 2025, non-SSO Cloud
#   Identity organisations created before 3 August 2026 from 20 October 2026
#   (later ones 30 days after creation), federated accounts "to be announced";
#   "Accounts with passkeys must still enable 2SV":
#   docs.cloud.google.com/docs/authentication/mfa-requirement.
# - The story: Cloudflare, "The mechanics of a sophisticated phishing scam and
#   how we stopped it" (9 August 2022): three employees entered their
#   credentials on a page at cloudflare-okta.com after an SMS wave; the
#   credentials were relayed in real time (over Telegram); the attackers were
#   stopped at the "hard key (U2F)" step because every employee signs in with a
#   FIDO2 security key, which the page credits to the keys being "tied to users
#   and implement origin binding"; no systems were compromised:
#   blog.cloudflare.com/2022-07-sms-phishing-attacks/. Cloudflare uses no TOTP,
#   so the relay of a code is described there as a presumed mechanism; the
#   lesson tells it that way.
# - Tried on the identity base (Keycloak 26.8.2) on 2026-11-23, and the labs
#   are built on what was seen: a sign-in flow written in the realm file that
#   requires a security key for the admin role and an app code for everyone
#   else (realm-saved round-trips it clean); the oidc-amr-mapper with a
#   default.reference.value of pwd, otp or hwk on each step, giving amr
#   ["pwd","hwk"] or ["pwd","otp"]; a security key baked into the realm file as
#   a webauthn credential, which signs in after a restart; the relay on a second
#   host (login.shop-help.test) over HTTPS from the lab CA, which carried a
#   password-and-code sign-in through and caught the one-time code and the
#   session cookie, while a security key was refused ("the security key has no
#   credential for login.shop-help.test"); ca-whatif against the realm export;
#   Keycloak's LOGIN events in the journal, which signin-watch reads; and
#   brute-force detection set in the realm file. A lone ALTERNATIVE webauthn
#   step behaves like REQUIRED on this base (Keycloak drives key registration),
#   so the fill-in's weakening wrong fixes use a misnamed role, a DISABLED key
#   and an un-applied file instead.
# Licences, each read on 2026-11-23: CISA's and NIST's pages are US government
# work (public domain); Microsoft Learn pages are under Microsoft Learn's terms
# of use (linked); passkeys.dev is CC BY-NC-ND 4.0 (linked); the FIDO Alliance
# and Microsoft pricing pages are each owner's (linked); Google Cloud's
# documentation is CC BY 4.0 except as noted (linked). Nothing is copied in.
