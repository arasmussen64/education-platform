id: fill-require-a-key
stage: fill_in
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Require a key, by role"
prompt: |
  The shop wants its admins to finish signing in only with a security key, while everyone else uses a password and an app code. The sign-in flow that does this is written in the realm file already, as two conditional sub-flows: **admins use a security key**, and **others use a code**. Four values in it are still `"..."`, and Keycloak won't load the file until every one is filled.

  Two machines: `office` (10.0.5.2), a staff laptop, and `idp` (10.0.5.10), the identity provider at `https://login.shop.test`, realm `shop`. Four people are set up: two admins, `alice` and `carol`, each with a security key (in the group `admins`, which carries the realm role `admin`); and two others, `ana` (in `staff`) and `ben` (in `warehouse`), each with an authenticator app. The identity labs' basics (the realm file, `realm-apply`, `realm-saved`, `signin`) are in `csa.sec.federation`'s first lab, `example-trace-a-sign-in`.

  **Mend the flow.** `on idp nano /etc/keycloak/realms/shop.json`, and find the two sub-flows. `kc-flows shop --file` draws them as a tree, so you can see the shape you are filling in (and `kc-flows shop` draws the flow the running provider uses now). Each gap is a `"..."` to replace. Two of them are in the `authenticatorConfig` list near the end of the file, where each step's settings live under the name the step gives in its `"authenticatorConfig"`:

  - In **admins use a security key**: the `conditional-user-role` step's settings (`is-admin`) name the realm role this sub-flow is for, in `"condUserRole": "..."`. Below it, the `webauthn-authenticator` step's `"requirement": "..."` decides whether the key is a must or one choice among several: fill in the word that makes it a must.
  - In **others use a code**: the `conditional-user-role` step's settings (`not-admin`) name the same role, `admin`, but this sub-flow must run for everyone who is **not** an admin, so `"negate": "..."` turns the condition around: fill in `"true"` or `"false"` (a string, in quotes). Below it, the `auth-otp-form` step's `"requirement": "..."` makes the app code a must for them.

  Each step also names a settings block ending `-ref` that holds its reference value (`pwd`, `hwk`, `otp`): that is what the token's `amr` claim lists for a sign-in that passed the step, kept for ten hours (`default.reference.maxAge`, in seconds).

  The words a step's requirement may take are `REQUIRED`, `ALTERNATIVE`, `CONDITIONAL` and `DISABLED`. Think about which one means "you cannot finish without this".

  Then `sudo realm-apply shop`. It refuses a file that still has a `"..."` and says which line. Until then Keycloak serves the realm as it was baked (a plain password sign-in), which is why an admin can still get in with a password alone right now.

  **Try it.** An admin with a key signs in and the token shows it:

      on office signin --code trace-cli http://127.0.0.1:8400/callback https://login.shop.test/realms/shop alice --key /etc/idlab/keys/alice.key | cut -c1-90

  `ana`, in `staff`, needs her app code (`--otp-secret "$(cat /etc/idlab/otp/ana)"`). `realm-saved` should say `saved`. Then run the checks.
skills: [authentication-strength]
