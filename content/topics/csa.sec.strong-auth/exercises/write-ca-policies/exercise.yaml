id: write-ca-policies
stage: write
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Write the conditional-access policies"
prompt: |
  The shop runs a partner portal, and you write its conditional-access policies: the if-then rules that decide, at each sign-in, whether to block it or demand a stronger method. You write them in Microsoft Entra's own shape, one JSON file a policy in `~/ca/policies/` (which starts empty), and try them with `ca-whatif`, a model of Entra's Conditional Access as its documentation describes it. It is not Entra and not its What If tool; it reads the people, groups and roles in `~/ca/directory.json` (read-only) and the named locations in `~/ca/locations.json` (the `warehouse` is trusted).

  A policy file looks like this:

      {
        "displayName": "a name",
        "state": "enabled",
        "conditions": {
          "users": { "includeUsers": ["All"], "excludeGroups": ["emergency-access"] },
          "applications": { "includeApplications": ["All"] }
        },
        "grantControls": { "operator": "OR", "builtInControls": ["block"] }
      }

  A policy **applies** when every condition it sets matches (an exclusion beats an inclusion); then its `grantControls` either `block`, or demand controls (`mfa`, `compliantDevice`) or an `authenticationStrength` (`{"displayName": "Phishing-resistant MFA"}`, or `Multifactor authentication`, or `Passwordless MFA`). `state` is `enabled`, `disabled`, or `enabledForReportingButNotEnforced` (report-only). `ca-whatif alice partner-portal methods=pwd,hwk` tries one sign-in; `ca-whatif --lint` checks your files.

  Write these policies. The groups are `staff`, `contractors`, `partner-admins` and `emergency-access`; the role is `Global Administrator`; the apps are `partner-portal` and `reports`.

  1. **Everyone** must do multifactor authentication, for every app.
  2. **`partner-admins` and the `Global Administrator` role** must use a phishing-resistant method, for every app.
  3. **Contractors** may reach the partner portal **only from the trusted `warehouse` location**.
  4. A **medium** sign-in risk must use a phishing-resistant method; a **high** risk is **blocked**.
  5. **Legacy authentication** (the `exchangeActiveSync` and `other` client types) is **blocked**.
  6. The **emergency accounts** (the group `emergency-access`, today `bg-1` and `bg-2`) sign in with their own security keys, and must get in whatever else a sign-in looks like. Exclude them from every policy that **blocks or restricts** a sign-in, through that group and nothing wider. A report-only policy needs no exclusion: it never stops anyone.
  7. A new policy, **"partner portal needs a compliant device"**, goes in **report-only** first, so you can see what it would do before enforcing it.

  Signals a sign-in can carry: `methods` (`pwd`, `otp`, `sms`, `push`, `hwk` for a key, and more), `risk` and `userrisk` (`none`/`low`/`medium`/`high`), `device` (`compliant`/`noncompliant`/`unknown`), `location` (a named location), and `client` (`browser`, `mobileAppsAndDesktopClients`, `exchangeActiveSync`, `other`). A method satisfies MFA when it is two factors by itself or a password with something you have; only `hwk`, `whfb` and `cert` are phishing-resistant.

  When your files lint and your sign-ins decide the way you mean, run the checks.
skills: [conditional-access, break-glass, rollout-without-lockout]
