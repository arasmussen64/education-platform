id: build-admin-sign-in
stage: build
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Build the shop's strong sign-in"
prompt: |
  The shop's sign-in today: a password for everyone, an app code only for people who happen to have set one up, no limit on wrong guesses, and no conditional access. You make it strong, and keep an emergency way in that doesn't weaken it.

  Two machines: `office` (10.0.5.2), a staff laptop, and `idp` (10.0.5.10), the identity provider at `https://login.shop.test`, realm `shop`. The people: admins `alice` and `carol` (group `admins`, each with a security key); `ana` (`staff`) and `ben` (`warehouse`), each with an app code; and two emergency accounts, `bg-1` and `bg-2`, each with its own security key and no app code. The groups `admins` and `emergency-access` both carry the realm role `admin`. The realm file is `/etc/keycloak/realms/shop.json` on `idp`, applied with `sudo realm-apply shop`.

  **The end state.**

  1. **Admins** (anyone with the realm role `admin`) can finish signing in only with a password and their security key. **Everyone else** needs a password and an app code. Nobody gets in with a password alone. Write the sign-in flow in the realm file and make it the realm's browser flow. An admin with no key is refused, never offered a page to register one: the file's `requiredActions` already switch off setting up a key or a code at sign-in, and stay so. The tokens' `amr` claim must record each step (`pwd`, `hwk`, `otp`): the client `trace-cli` already has the mapper, and each step needs an `authenticatorConfig` whose settings give its `default.reference.value` and a `default.reference.maxAge` in seconds (without a max age the reference lapses at once).
  2. **Guessing is stopped:** brute-force detection is on in the realm and locks an account after at most **five** failed passwords (Keycloak's realm settings `bruteForceProtected` and `failureFactor`), for at least a minute, and counts failures over at least an hour. Keycloak's own defaults (`waitIncrementSeconds` 60, `maxDeltaTimeSeconds` 12 hours) already do that last part: leave them be, or make them longer, because a lock of a few seconds lets a guesser carry on for ever.
  3. **The emergency accounts** `bg-1` and `bg-2` are in the group `emergency-access`, and nobody else is. Every sign-in by either raises an alert: the shop's watcher (`signin-watch`, already running on the lab machine) adds a line to `/var/log/shop/alerts.log` for each sign-in by an account listed, one a line, in `/etc/shop/watched-accounts` on the lab machine, which you keep (`sudo nano /etc/shop/watched-accounts`).
  4. **Conditional access**, as JSON policy files in `/etc/shop/ca/` on `idp`, in the shape you wrote in `write-ca-policies`: everyone does MFA, for every app; the `admins` group uses a phishing-resistant method; the `payments` app needs a compliant device; a high sign-in risk is blocked; legacy authentication is blocked; and a new policy, "admin app needs a compliant device", goes in **report-only**. The apps are `trace-cli`, `payments` and `admin-app`. `on idp ca-whatif USER APP methods=...` tries a sign-in (it models Entra's Conditional Access; it isn't Entra) and `on idp ca-whatif --lint` checks the files. It reads the people and their groups from the realm file, but not the realm role a group hands its members, so write these policies by group (`admins`, `emergency-access`), not by role.
  5. **The emergency accounts are never locked out by a policy:** every policy that blocks or restricts excludes the `emergency-access` group, and nothing wider.
  6. **It lasts:** the running realm is the one its file builds.

  `kc-flows shop` draws the flow the running realm uses now (Keycloak's built-in one), and `kc-flows shop --file` draws what your file says. The realm's people are made again at every apply, so a security key someone registered while you work is gone after the next `realm-apply`; the four keys above are in the file and stay. When `realm-saved` says `saved`, the policies lint, and your sign-ins go the way you mean, run the checks.
skills: [authentication-strength, conditional-access, break-glass, rollout-without-lockout]
