id: mcq-all-must-pass
type: mcq
rev: 1
prompt: |
  Two policies apply to one sign-in: one requires MFA, the other requires a compliant device. What must the sign-in do?
choices:
  - "Both: do MFA and be on a compliant device"
  - "Either one is enough"
  - "Only the stricter policy's control"
  - "Only the newer policy's control"
answer: 0
explanation: |
  Every policy that applies must be satisfied; their requirements add up. So a sign-in caught by both an MFA policy and a compliant-device policy has to meet both. Policies don't override or out-rank each other, and there is no "the strictest one wins" shortcut: the controls stack.

  Within a single policy you can choose "require all" or "require one of"; across policies, it is always all of them. This is why it pays to work out, before enforcing, which policies a given sign-in will hit.
skills: [conditional-access]
