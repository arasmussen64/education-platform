id: mcq-mfa-and-strength
type: mcq
rev: 1
prompt: |
  Can one Entra policy ask for both "Require multifactor authentication" and "Require authentication strength"?
choices:
  - "No: the built-in MFA strength is the MFA control, so pick one"
  - "Yes, and the person is prompted for each of the two in turn"
  - "Yes, and whichever of the two requirements is stronger wins"
  - "No: an authentication strength needs its own separate app to work"
answer: 0
explanation: |
  Entra refuses the pair in a single policy. The multifactor-authentication control and the built-in multifactor-authentication strength ask for the same thing, so combining them is redundant; Entra makes you choose one or the other. Use the strength when you want to name which methods count (for example, phishing-resistant only); use the plain control when any second factor will do.

  There is no "both at once", no stacking, and no second app required: it is one choice per policy.
skills: [authentication-strength]
