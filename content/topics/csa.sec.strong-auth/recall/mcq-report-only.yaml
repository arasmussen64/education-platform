id: mcq-report-only
type: mcq
rev: 1
prompt: |
  A new policy is in report-only, and it would block a particular sign-in. What does the person signing in experience?
choices:
  - "Nothing: the sign-in works, and the log records \"Report-only: Failure\""
  - "A warning, but they can continue"
  - "A prompt for multifactor authentication"
  - "A block, which report-only only hides from the reports"
answer: 0
explanation: |
  A report-only policy is worked out at each sign-in and written to the log, but never enforced: the person is neither prompted nor blocked, and the sign-in proceeds as if the policy weren't there. The log entry "Report-only: Failure" is what tells you the policy would have blocked this one, had it been on.

  That is the point of report-only: see exactly who a new policy would catch, before you turn it on and catch them.
skills: [rollout-without-lockout]
