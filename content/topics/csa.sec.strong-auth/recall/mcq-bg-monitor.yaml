id: mcq-bg-monitor
type: mcq
rev: 1
prompt: |
  What should tell you an emergency account has been used?
choices:
  - "An alert on every sign-in, which someone reviews"
  - "The quarterly access review"
  - "The account's password-expiry notice"
  - "Nothing: they are excluded from the logs"
answer: 0
explanation: |
  An emergency account should almost never sign in, so every sign-in by one is worth a look. The control is an alert that fires on each use and reaches someone who will act on it: a real use means a real outage or an intrusion. A quarterly review is far too slow, and these accounts are not excluded from logging, only from blocking policies.

  Watching is half of what makes exclusion safe: the account can always get in, and you always know when it did.
skills: [break-glass]
