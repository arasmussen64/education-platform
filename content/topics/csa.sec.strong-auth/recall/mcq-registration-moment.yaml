id: mcq-registration-moment
type: mcq
rev: 1
prompt: |
  A new admin can register their first security key after typing only a password. Why does that matter?
choices:
  - "Whoever has the password can register their own key first"
  - "It doesn't matter: the key is strong from the moment it is added"
  - "Keys enrolled that way are quietly refused by WebAuthn later on"
  - "It only matters for passkeys synced through a shared cloud account"
answer: 0
explanation: |
  A key is only as trustworthy as the moment it was enrolled. If a password alone lets someone add a key, then a phisher who has the password can add *their own* key and from then on pass every phishing-resistant check as the admin. The strength of the key is undone by the weakness of how it was registered.

  So the first factor has to be enrolled under a stronger proof: an administrator-issued Temporary Access Pass, an in-person check, or an existing strong credential. After that the key stands on its own.
skills: [phishing-resistance]
