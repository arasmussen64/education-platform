id: mcq-device-compliance
type: mcq
rev: 1
prompt: |
  For "require a compliant device" to pass, what must be true of the device?
choices:
  - "Intune (or a like service) reports the registered device compliant"
  - "The device has an up-to-date antivirus signature from a known vendor"
  - "The person is signing in from a location on the trusted-locations list"
  - "The browser is a private (InPrivate) window in Microsoft Edge"
answer: 0
explanation: |
  Compliance is a verdict from a device-management service: the device is registered with the organisation and Intune (or a supported third-party manager) reports it meets the rules, such as encryption and a screen lock. In a browser the device proves which one it is with a client certificate issued when it was registered, the same idea as the client certificates in the PKI topic.

  Antivirus state, the sign-in location and the browser mode are different signals (or no signal at all); none of them is what "compliant device" checks.
skills: [conditional-access]
