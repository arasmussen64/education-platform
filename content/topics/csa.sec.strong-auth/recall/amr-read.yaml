id: amr-read
type: predict_shell
rev: 1
prompt: |
  Three ID tokens from the lab, decoded to JSON (as `jwt show` does) and cut down to three claims each, one file a person. The `amr` claim lists how each sign-in was done. The command names the sign-ins that used a hardware key. What does it print?
files:
  alice.json: |
    { "sub": "0a000000-0000-4000-8000-000000000011", "preferred_username": "alice", "amr": ["pwd", "hwk"] }
  ana.json: |
    { "sub": "0a000000-0000-4000-8000-000000000013", "preferred_username": "ana", "amr": ["pwd", "otp"] }
  carol.json: |
    { "sub": "0a000000-0000-4000-8000-000000000012", "preferred_username": "carol", "amr": ["pwd", "hwk"] }
command: |
  grep -l '"hwk"' *.json
expected_output: |
  alice.json
  carol.json
explanation: |
  `grep -l` prints the name of each file that has a match, not the matching line, and the shell hands it the files in sorted order: `alice.json`, `ana.json`, `carol.json`. Only alice's and carol's tokens hold `"hwk"`, the reference value for a hardware key; ana's shows `"pwd"` and `"otp"`, a password and an app code.

  `amr` ("authentication methods references") is how an app or a check reads what a sign-in actually used, rather than taking the person's word for it. The identity provider fills it in from the steps the sign-in passed, and only if its flow is set up to record them.
skills: [authentication-strength]
