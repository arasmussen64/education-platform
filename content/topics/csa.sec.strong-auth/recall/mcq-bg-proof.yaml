id: mcq-bg-proof
type: mcq
rev: 1
prompt: |
  Which test shows a break-glass design didn't quietly weaken everything else?
choices:
  - "Others stay blocked while the emergency account still gets in"
  - "The emergency account signs in successfully at least once every quarter"
  - "No conditional-access policy mentions the emergency accounts by name"
  - "The What If tool reports the emergency account's sign-in as \"not applied\""
answer: 0
explanation: |
  The risk with break-glass is that the exclusion is wider than you meant, so you prove two things at once: the emergency account still gets in when the normal path is down, and a made-up ordinary person in another group is still caught by every policy. If both hold, the door for emergencies is open and no one else slipped through it.

  Signing in quarterly is the drill, not the proof; not naming accounts is good practice but no guarantee; and a What If result for the emergency account alone says nothing about everyone else.
skills: [break-glass]
