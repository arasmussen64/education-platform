id: mcq-risk-licence
type: mcq
rev: 1
prompt: |
  Which of these conditional-access policies needs the more expensive Entra ID P2 licence?
choices:
  - "A policy that acts on sign-in risk"
  - "A policy that requires a compliant device"
  - "A policy that blocks legacy authentication"
  - "A policy that requires phishing-resistant MFA for admins"
answer: 0
explanation: |
  Conditional Access itself needs Entra ID P1. Acting on sign-in risk or user risk needs the risk signals from Entra ID Protection, which is a P2 feature. Device compliance, blocking legacy authentication and requiring an authentication strength are all plain Conditional Access, so they come with P1.

  So the licence question usually comes down to one thing: do you want the policy to react to how risky a sign-in looks? That is the P2 line.
skills: [conditional-access]
