id: mcq-bg-mandatory-mfa
type: mcq
rev: 1
prompt: |
  Since Azure's mandatory MFA, can an emergency account sign in to the Azure portal with a password alone?
choices:
  - "No: mandatory MFA covers emergency accounts too"
  - "Yes: emergency accounts are exempt from the mandatory-MFA rule"
  - "Yes, as long as they are excluded from every Conditional Access policy"
  - "Only when signing in through the command line, never the portal"
answer: 0
explanation: |
  Microsoft's mandatory MFA for the Azure portal and admin centres has no opt-out, and it says plainly that emergency accounts are covered too. Being excluded from Conditional Access doesn't help, because mandatory MFA is a separate, tenant-wide requirement, not a Conditional Access policy. So the emergency account's credential has to be a real second factor: a passkey or a certificate, which is why those are the recommended methods.

  This is the rule that kills the old habit of a break-glass account with just a very long password.
skills: [break-glass]
