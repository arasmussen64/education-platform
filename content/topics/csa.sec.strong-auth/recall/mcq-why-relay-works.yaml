id: mcq-why-relay-works
type: mcq
rev: 1
prompt: |
  Ana used a password and a one-time code, and the attacker still got in. How?
choices:
  - "The phishing site passed her code to the real site within its 30 seconds, and kept the session it was given"
  - "Her code generator was cloned when her phone was hacked earlier"
  - "Six-digit codes are easy to guess with enough tries"
  - "The attacker read the code from her text messages over the phone network"
answer: 0
explanation: |
  The phishing site was a relay: it showed Ana the real sign-in page, took her password and her code as she typed them, and handed them straight to the real site while the code was still good. The real site then set a session cookie, which the relay kept. From then on the attacker is Ana, with no need for the code again.

  Nothing was guessed, cloned or intercepted over the network. The weakness is that a password and a code are secrets the person types, so a site that stands in the middle collects them like any other field on a form.
skills: [phishing-resistance]
