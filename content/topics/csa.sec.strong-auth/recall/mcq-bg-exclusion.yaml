id: mcq-bg-exclusion
type: mcq
rev: 1
prompt: |
  From which conditional-access policies should the emergency (break-glass) accounts be excluded?
choices:
  - "Those that block or restrict sign-in, through one dedicated group"
  - "Every policy, including the report-only ones"
  - "None: they must meet every control like anyone else"
  - "Only the policies that require MFA"
answer: 0
explanation: |
  Exclude the emergency accounts just from the policies that could stop them getting in: the blocking and restricting ones. Do it through a single group whose only members are those accounts, so a later edit can't quietly add an ordinary admin. Report-only policies don't enforce anything, so there is no need to exclude from them.

  "Excluded" is not "unprotected": the accounts still have their own strong credential and are watched. The exclusion only guarantees that when everything else fails, these accounts can still get in.
skills: [break-glass]
