id: mcq-offer-or-require
type: mcq
rev: 1
prompt: |
  Every admin now has a passkey, and app codes still work too. What has that bought you against phishing?
choices:
  - "Little: a phisher uses the code until a code can't finish an admin sign-in"
  - "Full protection: the admins now all count as phishing-resistant"
  - "Only the admins who pick the code over the key are still at risk"
  - "The passkey makes the app code safe by binding it to the real site's name too"
answer: 0
explanation: |
  Offering a strong method is not the same as requiring it. If a sign-in can still be finished with an app code, the attacker simply steers the admin to the code: the passkey sits unused. You get the benefit only when the phishable path is removed, so a key is the one way to finish.

  A code is not made safe by a passkey existing elsewhere; it is still a secret the person types and a relay can collect. "Enforce the strength, don't just offer it" is the whole point.
skills: [authentication-strength]
