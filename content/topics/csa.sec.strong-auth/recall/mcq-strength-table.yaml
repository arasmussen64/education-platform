id: mcq-strength-table
type: mcq
rev: 1
prompt: |
  A person signs in with a password and approves a push notification. Which of Entra's three built-in authentication strengths does that satisfy?
choices:
  - "Multifactor authentication only"
  - "Multifactor authentication and passwordless MFA"
  - "All three: push with number matching counts as phishing-resistant"
  - "None: a push isn't a real second factor"
answer: 0
explanation: |
  A password plus a push is two factors, so it meets the plain multifactor-authentication strength. It is not passwordless (a password was used) and it is not phishing-resistant (a push can be relayed or fatigue-approved). Entra's phishing-resistant strength accepts only a FIDO2 key, Windows Hello for Business, or a certificate.

  The three strengths are a ladder: multifactor, passwordless MFA, and phishing-resistant MFA. Picking the right rung is how you require a key for admins without blocking everyone else.
skills: [authentication-strength]
