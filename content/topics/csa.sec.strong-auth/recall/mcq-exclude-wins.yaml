id: mcq-exclude-wins
type: mcq
rev: 1
prompt: |
  A policy includes the group `staff` and excludes the group `contractors`. Ana is in both. Does the policy apply to her?
choices:
  - "No: an exclusion overrides an inclusion"
  - "Yes: the inclusion is checked first"
  - "Yes, but only in report-only mode"
  - "Yes: the larger group wins"
answer: 0
explanation: |
  Entra evaluates a policy's assignments with the exclusion winning: anyone who matches an exclude is left out, whatever they match on the include side. Ana is a contractor, so she is excluded, and the policy doesn't apply to her. Order of checking and group sizes don't enter into it.

  This is the same rule that lets a dedicated exclude group carry the break-glass accounts safely past a blocking policy, and the same rule that, used carelessly, lets a too-wide exclude group wave ordinary people through.
skills: [conditional-access]
