id: mcq-cisa-order
type: mcq
rev: 1
prompt: |
  A helpdesk team can use three of these. Rank them strongest to weakest, as CISA does: push with number matching, SMS codes, a FIDO2 security key.
choices:
  - "FIDO2 key, push with number matching, SMS codes"
  - "Push with number matching, FIDO2 key, SMS codes"
  - "SMS codes, push with number matching, FIDO2 key"
  - "FIDO2 key, SMS codes, push with number matching"
answer: 0
explanation: |
  CISA's October 2022 fact sheet puts FIDO/WebAuthn at the top as the only widely available phishing-resistant method. Below it are app-based codes and push with number matching, which are better than nothing but still "vulnerable to phishing attacks", because the person approves or types something a relay can use. SMS and voice are weakest: phishable like the rest, and open as well to network tricks like SIM swap.

  So the order is FIDO2 key, then push with number matching, then SMS. Number matching only stops blind approvals (push bombing); it does not stop a relay.
skills: [phishing-resistance]
