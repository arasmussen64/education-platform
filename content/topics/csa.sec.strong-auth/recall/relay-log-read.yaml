id: relay-log-read
type: predict_shell
rev: 1
prompt: |
  `relay.log` is what the lab's phishing relay kept as it passed three sign-ins through to the real site, in the relay's own format (the passwords and cookies are replaced by obviously fake values). The command counts how many different one-time codes the phisher collected. What does it print?
files:
  relay.log: |
    relay up on 443, login.shop-help.test -> login.shop.test
    caught username=ana
    caught password=not-a-real-password
    caught otp=481920
    caught session cookie: KEYCLOAK_IDENTITY=fake-cookie-value-one
    caught session cookie: KEYCLOAK_SESSION=fake-session-one
    caught username=ana
    caught password=not-a-real-password
    caught otp=481920
    caught username=ben
    caught password=another-fake-password
    caught otp=735104
    caught session cookie: KEYCLOAK_IDENTITY=fake-cookie-value-two
    caught session cookie: KEYCLOAK_SESSION=fake-session-two
command: |
  grep -o 'otp=[0-9]*' relay.log | sort -u | wc -l
expected_output: |
  2
explanation: |
  `grep -o` prints each `otp=NNN` match on its own line; `sort -u` drops the repeat (ana typed `481920` twice, once on each try), leaving `481920` and `735104`; `wc -l` counts the two lines.

  Two codes, from two people. Look at what follows each: ana's first try and ben's end with session cookies, which the real site sets only after a sign-in that finished, while ana's second try ends with nothing, because the provider takes each code once and refused the repeat. A one-time code is a secret the person types, so a site that relays what they type collects it like any other, and uses it at once. The session cookie is what the attacker really keeps: with it they are signed in without a code at all.
skills: [phishing-resistance]
