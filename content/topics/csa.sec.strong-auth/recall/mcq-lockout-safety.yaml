id: mcq-lockout-safety
type: mcq
rev: 1
prompt: |
  Before turning on a block of legacy authentication for all users, what does Microsoft's warning ask you to do?
choices:
  - "Apply it to a small group first and exclude at least one admin"
  - "Switch security defaults on at the same time"
  - "Export every user's MFA methods first"
  - "Disable report-only mode across the tenant"
answer: 0
explanation: |
  Microsoft's lockout warning is to roll a sweeping policy out carefully: try it on a small group, and keep at least one administrator excluded until you've proven it, so a mistake can't shut everyone (you included) out. Report-only first, then a pilot group, then everyone.

  Security defaults and Conditional Access can't both be on; exporting MFA methods isn't what the warning asks; and you don't disable report-only to go live, you graduate out of it.
skills: [rollout-without-lockout]
