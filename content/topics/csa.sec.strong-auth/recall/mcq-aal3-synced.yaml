id: mcq-aal3-synced
type: mcq
rev: 1
prompt: |
  A regulator asks for AAL3. Are passkeys synced through a cloud account enough on their own?
choices:
  - "No: a syncable authenticator can't be used at AAL3; a device-bound key can"
  - "Yes: all passkeys are phishing-resistant, so they meet AAL3"
  - "Yes, as long as the cloud account itself has MFA"
  - "No: passkeys only ever reach AAL1"
answer: 0
explanation: |
  NIST SP 800-63B says AAL3 needs a phishing-resistant authenticator whose private key cannot be exported. A synced passkey is copied between your devices through a cloud account, so its key is exportable by design, and the standard says syncable authenticators "SHALL NOT be used at AAL3". A device-bound key, such as a hardware security key, keeps its key on the one device and does reach AAL3.

  Synced passkeys are still phishing-resistant and fine at AAL2, where the standard says a phishing-resistant option must at least be offered. The AAL3 bar is specifically about the key never leaving the hardware.
skills: [phishing-resistance]
