id: mcq-other-clouds
type: mcq
rev: 1
prompt: |
  What is Google Cloud's nearest equivalent to a conditional-access rule on device state?
choices:
  - "An Access Context Manager access level using device attributes"
  - "An organization policy constraint applied across the whole project"
  - "A deny policy attached to the signing-in user's IAM principal"
  - "A Cloud Armor security rule sitting on the load balancer"
answer: 0
explanation: |
  Google Cloud models context with Access Context Manager: you define access levels from signals like IP range, region, and device attributes (collected by Endpoint Verification), then enforce them through IAP, VPC Service Controls or IAM Conditions. The device-attribute part needs a paid enterprise subscription.

  Organization policy constraints shape what resources can be created; deny policies refuse specific permissions; Cloud Armor filters web traffic. None of those is a per-sign-in check on the device, the way an access level is.
skills: [conditional-access]
