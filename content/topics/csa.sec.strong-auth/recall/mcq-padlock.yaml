id: mcq-padlock
type: mcq
rev: 1
prompt: |
  The phishing site showed a valid padlock. What did that padlock prove?
choices:
  - "That the browser reached `login.shop-help.test` privately, not that it is the shop"
  - "That the shop's own CA had checked and approved the site"
  - "Nothing: the certificate must have been forged"
  - "That the page was safe to type a password into"
answer: 0
explanation: |
  A certificate vouches that you really reached the name in the address bar, over an encrypted connection nobody else can read. That name was `login.shop-help.test`, a name the attacker registered and got a perfectly real certificate for. The padlock says the connection is private and the name is genuine; it says nothing about whether that name is the one you meant, or whether the people behind it are honest.

  This is why "look for the padlock" is weak advice against phishing, and why a lookalike name with a valid certificate is exactly the trap. A security key, which checks the name for you, is the answer the padlock can't give.
skills: [phishing-resistance]
