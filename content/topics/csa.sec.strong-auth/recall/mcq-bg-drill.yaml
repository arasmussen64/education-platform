id: mcq-bg-drill
type: mcq
rev: 1
prompt: |
  How often does Microsoft say to validate emergency access accounts?
choices:
  - "At least every 90 days"
  - "Once a year, at the annual access review"
  - "Only after a real outage has happened"
  - "Every 30 days, like a password rotation"
answer: 0
explanation: |
  Microsoft's guidance is to test the emergency accounts at least every 90 days, and again whenever the team changes. A credential kept for the worst day is worthless if it has quietly expired, the key has been lost, or the one person who knew the drill has left. The drill confirms the account still gets in and that the alert still fires.

  Once a year is too rare for something you must be able to trust under pressure; waiting for an outage means finding out it's broken at the worst moment.
skills: [break-glass]
