id: mcq-security-defaults
type: mcq
rev: 1
prompt: |
  A small shop has no paid Entra licence. What free protection can it still turn on?
choices:
  - "Security defaults: MFA for everyone and admins, legacy auth blocked"
  - "A single free Conditional Access policy, which every tenant gets"
  - "ID Protection's risk-based sign-in and user-risk policies"
  - "Privileged Identity Management for the shop's administrator accounts"
answer: 0
explanation: |
  With no P1 or P2, the free baseline is security defaults: everyone must register for MFA, admins always do MFA, legacy authentication and device-code flow are blocked, and the Azure management surface is protected. It is all-or-nothing and can't be customised, but it is a real floor, free for every tenant.

  Conditional Access needs P1, risk-based policies need P2, and PIM is a P2 feature too; none of those is the free option.
skills: [rollout-without-lockout]
