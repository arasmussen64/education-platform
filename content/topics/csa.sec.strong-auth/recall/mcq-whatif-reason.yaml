id: mcq-whatif-reason
type: mcq
rev: 1
prompt: |
  The What If tool lists a policy as "not applied", with the reason "sign-in risk". What does that mean?
choices:
  - "The first condition that didn't match was the sign-in risk"
  - "The policy is disabled"
  - "The user is excluded from the policy"
  - "The user's risk is too high to evaluate"
answer: 0
explanation: |
  What If evaluates one imagined sign-in against every enabled and report-only policy, and for each policy that doesn't apply it names the first condition that failed to match. "Sign-in risk" means the policy sets a risk condition the imagined sign-in didn't meet, so the policy was ruled out there. It is a tracing aid: it tells you why a policy you expected to fire didn't.

  It isn't saying the policy is off, the user is excluded, or the risk is unevaluable; just that risk was the first unmatched condition.
skills: [rollout-without-lockout]
