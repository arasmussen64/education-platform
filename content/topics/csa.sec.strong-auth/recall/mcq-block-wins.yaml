id: mcq-block-wins
type: mcq
rev: 1
prompt: |
  One policy blocks high-risk sign-ins. Another grants access with MFA. A high-risk sign-in arrives with MFA already done. What happens?
choices:
  - "Blocked: a block beats any grant"
  - "Allowed: the MFA satisfied a policy"
  - "Allowed, after a password change"
  - "Blocked only if the user is an admin"
answer: 0
explanation: |
  When any applicable policy blocks, the sign-in is blocked, full stop: Entra doesn't weigh it against the grants. So a high-risk sign-in is stopped even though MFA was done, because the block policy applies. A grant can only ever let something through that nothing else is blocking.

  This "block wins" rule is what makes a high-risk block a hard stop, and why you don't rely on a grant to "make up for" a condition you really mean to refuse.
skills: [conditional-access]
