id: mcq-bg-method
type: mcq
rev: 1
prompt: |
  Your admins sign in with an authenticator push. What should the emergency accounts use?
choices:
  - "A FIDO2 passkey, a different method from the admins'"
  - "The same authenticator push, on a shared phone"
  - "A long password with no second factor, kept in a safe"
  - "A text message to the on-call phone"
answer: 0
explanation: |
  An emergency account exists for when the usual way in fails, so its credential must not fail the same way. If the admins' push service is down, or push is what got phished, an emergency account on push is no help. Give it a phishing-resistant method that is deliberately different, a FIDO2 passkey, kept somewhere safe.

  A password alone fails the mandatory-MFA rule and is weak anyway; SMS shares too many failure modes. Different and strong is the rule.
skills: [break-glass]
