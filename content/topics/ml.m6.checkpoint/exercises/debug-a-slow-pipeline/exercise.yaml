id: debug-a-slow-pipeline
stage: debug
rev: 2
title: "Three bugs in a pipeline"
prompt: |
  This is the checkpoint's toolkit on its data: it dedupes seven events by `id`, takes the three biggest spenders, joins the events to their users' cities, finds the closest name to a typo, and puts the pipeline's steps in an order that respects their dependencies, taking ready steps in the order they became ready. It should print:

  ```
  7 events, 5 distinct
  [9, 12, 7]
  [(7, 'Oslo'), (3, 'Lima'), (9, 'Pune'), (15, 'Oslo')]
  ('Pune', 2)
  ['load', 'clean', 'join', 'features', 'train', 'report']
  ```

  Instead the closest name comes out as `('Pune', 0)`, and the schedule runs `join` before `clean`. It has three bugs, and one of them doesn't change the output at all: only the checks, which count comparisons, show it. Run it, check each function against its docstring, and fix what you find; then run the checks, which try each function on its own. You're done when it prints the lines above and every check passes.
hints:
  - "Fix one thing at a time and run it after each change. The checks try each function on its own, so a failing check points at one function."
  - "The schedule: when two steps are ready, the one that became ready first must run first. Which end of the deque does `ready.pop()` take from?"
  - "`pop()` takes from the back, which makes `ready` a stack; `popleft()` takes from the front, which makes it a queue."
  - "The closest name: `Pnue` to `Pune` can't be 0 edits. Each cell of the table reads the cells above, to the left and diagonally above-left, so those must be filled first. In which order does the outer loop fill the rows?"
  - "Fill the rows from the top, `range(1, len(a) + 1)`, each from left to right."
  - "The dedupe prints the right answer, but the checks count about 2.25 million comparisons. `record[key] not in seen` scans `seen` from the start when it's a list; a set answers it in one step."
# Every test names the module skills it checks (ADR-0012), so a failed test
# says which topics to revisit.
test_skills:
  test_the_output: [ml.dsa.graphs/topo, ml.dsa.dynamic-programming/edit-distance]
  test_dedupe_scales: [ml.dsa.arrays-and-hashing/replace, ml.dsa.complexity/choose]
  test_schedule_is_a_queue: [ml.dsa.stacks-queues-recursion/stack-queue, ml.dsa.graphs/topo]
  test_edit_distance: [ml.dsa.dynamic-programming/edit-distance]
