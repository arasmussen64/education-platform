#!/usr/sbin/nft -f
# gw's firewall and NAT. The shop's machines go out to the internet as
# 198.51.100.2; the shop's app is published on 198.51.100.2's port 443;
# nothing else comes in. nftables@gw loads this file at every boot.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        iifname "lan" accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "lan" oifname "wan" accept
        ct status ___ accept
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname "wan" tcp dport 443 dnat to ___
    }
    chain postrouting {
        type nat hook ___ priority ___; policy accept;
        oifname "___" masquerade
    }
}
