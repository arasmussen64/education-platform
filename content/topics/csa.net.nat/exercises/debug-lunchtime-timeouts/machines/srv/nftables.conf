#!/usr/sbin/nft -f
# srv's firewall, the payment provider's side (scenery): its payment service
# on port 443 takes connections only from the one address the shop
# registered with it, 198.51.100.3, and drops any other without a word.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;
        tcp dport 443 ip saddr != 198.51.100.3 drop
    }
}
