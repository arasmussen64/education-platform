id: example-watch-the-translation
stage: worked_example
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Watch the translation"
prompt: |
  If this is your first network lab, read the note "Before your first network lab" at the top of `example-follow-a-request`, the walkthrough in Layers and packets, first: it explains the machines, `on`, the topology file and services like `nftables@gw`.

  **This lab.** The shop's two machines, `office` (10.1.0.10, a laptop) and `app` (10.1.0.20, the shop's web app, on port 8443), sit on a private network, `shop` (10.1.0.0/24), behind `gw`, the shop's gateway. gw's interface `lan` (10.1.0.1) faces the shop, and `wan` (198.51.100.2, the shop's one public address) faces the internet provider's router, `inet` (198.51.100.1). On the lab's small internet, behind inet, are `srv` (203.0.113.10: a web server on port 80 that answers with the address each connection came from, and a server on ports 9000 and 9001 that holds every connection open until the client closes it) and `client` (203.0.113.20), a customer. The internet has no route back to private addresses such as 10.1.0.0/24, as on the real internet. gw's firewall, its `/etc/nftables.conf`, is Module 1's kind: the shop's machines may go out, nothing new comes in, and `nftables@gw` loads it at every boot. The app answers each request with the address it came from too, and logs it, as its rate limiter would see it.

  The walkthrough makes gw a NAT gateway: forwarding on for good, source NAT for the shop's machines going out, destination NAT to publish the app on gw's port 443, the classic mistake made on purpose, a NAT run out of ports, and the rules saved so a reboot keeps them. Type each line yourself in the lab's shell and read what it prints before you type the next. A line ending in `&` runs in the background, so the next line can make traffic while it captures; `wait` waits for it to finish.
steps:
  - label: "Try the internet from the office"
    lines: "1-2"
    note: "The office's request to srv times out (`curl: (28) Connection timed out after 3002 milliseconds`). A gateway's first job is to pass packets from one network to the other, and `net.ipv4.ip_forward = 0` says gw doesn't: it drops whatever arrives that isn't for gw itself. A fresh Linux machine starts this way."
  - label: "Forward, for good"
    lines: "3-4"
    note: "A setting made with `sysctl -w` lasts until the next boot; one in a file under `/etc/sysctl.d/` comes back at every boot (Routing showed both). `tee` writes the line into gw's own `/etc/sysctl.d/90-gateway.conf`, as root on gw, and `sysctl -p FILE` applies that one file now, without waiting for a reboot."
  - label: "Watch the packets leave"
    lines: "5-7"
    note: "`tcpdump` watches gw's internet side in the background for six seconds while the office tries again. The curl still times out, and the capture shows why: the office's SYN leaves gw with its own source address (`10.1.0.10.52512 > 203.0.113.10.80: Flags [S]` in the run this was written from; the port changes every time), is sent again a second later, and nothing comes back. srv answers to 10.1.0.10, and the internet has no route to it."
  - label: "Source NAT"
    lines: "8-11"
    note: "**NAT**, network address translation, is rewriting the addresses in packets as they pass. A `nat` table with a `postrouting` chain, which runs after the routing decision, as a packet leaves: `oifname \"wan\" masquerade` rewrites the source of everything leaving through `wan` (its output interface) to whatever address `wan` has. That's **source NAT** (SNAT), in the form called **masquerading**; `snat to ADDRESS` would name a fixed address instead. Now srv answers `you are 198.51.100.2`: it sees the gateway, not the office."
  - label: "Read the translation"
    lines: "12"
    note: "conntrack, the connection table from Module 1, is where gw remembers each translation. Each line holds two **tuples** (the set of protocol, addresses and ports that names one connection): the original, as the office sent it (`src=10.1.0.10 dst=203.0.113.10 sport=42546 dport=80`, with a port of its own in your run), and the reply, as srv answers it (`src=203.0.113.10 dst=198.51.100.2 sport=80 dport=42546`: masquerading kept the office's port, since it was free). gw maps one to the other in both directions, so the replies need no rule of their own. The other line is the try from before the NAT: its reply tuple still says `dst=10.1.0.10`, and it is `[UNREPLIED]`. The `conntrack v1.4.8 ... flow entries have been shown` line is conntrack's own count, which it writes to the error stream."
  - label: "Publish the app"
    lines: "13-17"
    note: "**Destination NAT** (DNAT, also called port forwarding) rewrites the destination instead, in `prerouting`, before the routing decision, so gw then routes the packet to its new destination: anything arriving on `wan` for port 443 goes to the app at 10.1.0.20:8443. The customer's first try still times out, because the `forward` chain's policy is drop and no rule accepts the first packet of a published connection. `ct status dnat accept`, the line people forget, accepts connections that destination NAT rewrote. Now the app answers `you are 203.0.113.20`: it sees the customer's own address, which its logs and its rate limiter need."
  - label: "The classic mistake, on purpose"
    lines: "18-23"
    note: "The masquerade rule again, without `oifname \"wan\"`. Now it rewrites everything gw sends out of any interface, including the customer's connection on its way into the shop's network, and the app answers `you are 10.1.0.1`: every customer looks like the gateway's own address on the LAN. The app's log says the same: the request from 203.0.113.20, then one from 10.1.0.1. A rate limiter counting requests per address would now see one enormous customer. The last two lines put the right rule back."
  - label: "Run a NAT out of ports"
    lines: "24-30"
    note: "A rule before the masquerade sends TCP to ports 9000 and 9001 through just ten source ports, 20000 to 20009 (a port range needs a protocol, so `ip protocol tcp` comes first). `holdconns` opens 15 connections at once to srv's port 9000 and holds them: `opened 10 of 15`. The other five time out, because gw drops their SYNs and nothing refuses them, which is how **port exhaustion** looks. `conntrack -S` prints one line of counters for each CPU, and `insert_failed` counts each SYN gw couldn't find a port for, retries included: the run this was written from showed `insert_failed=15` for the five connections that failed, because each one's SYN was sent again while it waited. Then five connections to port 9001 all open: a NAT keeps translations apart by the whole tuple, so another destination can use the same ten ports, and `conntrack -L` shows ports from 20000 to 20009 serving 9000 and 9001 at the same time. The clouds' NAT gateways count the same way, per destination. The last two lines take the ten-port rule away."
  - label: "Make it last"
    lines: "31-32"
    note: "Rules typed with `nft` live until the next boot. To keep them, write `flush ruleset` and then everything `nft list ruleset` prints into `/etc/nftables.conf`, which `nftables@gw` loads at every boot (the `>` writes into gw's own file). The ruleset now holds gw's whole job: the firewall with its `ct status dnat accept`, the masquerade, and the published port."
skills: [snat-and-dnat, nat-rules, port-exhaustion]
