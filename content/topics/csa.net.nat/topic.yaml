prove:
  build: build-nat-gateway
  debug: debug-lunchtime-timeouts
  explain:
    prompt: |
      A team is moving 200 VMs into private subnets behind a cloud NAT gateway, and one of them calls a payment API thousands of times a minute. Explain, in your own words: what source NAT does to an outbound connection and how the replies find their way back; what destination NAT does and what the server behind it sees; what limits how many connections a NAT can carry, and how you'd size it for that API on one cloud of your choice; how port exhaustion would show itself and what you'd try first; and when you'd avoid NAT altogether.
    rubric:
      - id: snat-conntrack
        required: true
        description: "SNAT rewrites the source address (and port) of outgoing packets to the NAT's public address, after routing; the NAT records the mapping (conntrack on Linux) and reverses it on the replies, so replies need no rule of their own."
      - id: dnat-client
        required: true
        description: "DNAT rewrites the destination before routing so traffic for a public address and port reaches an inside server, which still sees the client's real address unless something also source-NATs the inbound traffic (a masquerade rule not limited to the outside interface)."
      - id: sizing
        required: true
        description: "Capacity is ports per public address per unique destination (address, port, protocol); one cloud's numbers stated correctly (AWS 55,000 connections per address per destination, up to 8 addresses on a zonal gateway; Azure 64,512 SNAT ports per address, up to 16, or its 50,000 per destination; Google 64,512 per address in per-VM blocks, 64 by default); a sum for the API's connections; and that ports stay held after a close (hold-down, TIME-WAIT) and while idle."
      - id: exhaustion
        required: true
        description: "New connections to the busy destination time out while others work; the evidence (insert_failed in conntrack -S, or that cloud's metric: ErrorPortAllocation, SNAT Connection Count Failed, OUT_OF_RESOURCES); the first fix is reusing connections; then more addresses (or more ports per VM on Google), shorter idle timeouts."
      - id: avoid
        required: true
        description: "At least one correct case for avoiding NAT (IPv6 with an egress-only gateway; a gateway or private endpoint for cloud services, with no ports and no per-GB NAT charge; a load balancer for inbound services) and one where NAT is right (overlapping ranges, an allow-listed outbound address)."
    model_answer: |
      When a VM in a private subnet opens a connection to the internet, the NAT gateway rewrites the packet's source, the VM's private address and port, to its own public address and a port it picks, after the routing decision. It writes the pair down, conntrack on a Linux gateway. The server answers to the public address and port; the gateway finds the pair and rewrites the destination back to the VM's address and port, so the replies need no rule of their own.

      Destination NAT is the other way round: the gateway rewrites the destination of traffic arriving for one of its public ports, before routing, so it reaches an inside server. The source stays the client's, so the server's logs and rate limits see real clients, unless a source NAT rule also catches the inbound traffic, a masquerade without "only out of the internet interface", and then every client looks like the gateway.

      What limits a NAT is ports per public address per destination: connections to the same address, port and protocol each need their own translated port, while connections to different destinations can share one. On AWS, each address carries up to 55,000 connections to one destination, and a zonal gateway takes up to 8 addresses. If the payment VM held, say, 120,000 connections to the API at once, 120,000 / 55,000 is 2.2, so 3 addresses. Ports also stay busy after a connection closes, for a hold-down or TIME-WAIT of about a minute, and while a connection sits idle until the idle timeout (350 seconds on AWS), so a connection per request at thousands a minute adds up fast.

      Port exhaustion shows as new connections to that one API timing out while other sites and the connections already open keep working; on AWS the ErrorPortAllocation metric goes above zero, on Linux insert_failed climbs in conntrack -S. The first fix is to reuse connections, keep-alive or a pool, so far fewer are opened; then more addresses, and shorter idle timeouts.

      I'd avoid NAT where there's a private path: a gateway endpoint for S3, which is free and needs no ports, instead of paying per gigabyte through the NAT. IPv6 traffic goes out through an egress-only gateway with no translation. NAT is the right tool when two networks overlap, or when a partner allow-lists one outbound address, as payment providers often do.
