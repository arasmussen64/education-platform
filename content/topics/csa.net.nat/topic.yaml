id: csa.net.nat
kind: topic
status: ready
title: NAT
summary: "What source and destination NAT rewrite, where in a gateway's path each happens, and how connection tracking translates the replies back; writing a NAT gateway in nftables that keeps customers' addresses and survives a reboot; sizing NAT for connection counts per destination on AWS, Azure and Google Cloud; telling port exhaustion from other failures; and when to avoid NAT altogether."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 27) and its designer's brief (csa.net.nat.md). Through
# csa.net.routing and csa.net.cidr this builds on csa.net.layers (the network
# labs' machines, on, name@machine, ICMP) and csa.m1.checkpoint. For the
# writer: Module 1's net-tools (ports, the ephemeral range, TIME-WAIT, the
# nftables hooks, policy drop, ct state, conntrack -L, /etc/nftables.conf and
# its scratch-namespace check, and one sentence each on masquerading and
# DNAT); IPv4 and CIDR (the private ranges, 100.64.0.0/10, overlaps);
# Routing (return paths, sysctl and /etc/sysctl.d/, forwarding); IPv6 (dual
# stack, global addresses, the egress-only internet gateway, NAT64), for the
# last skill. Words this topic defines: NAT, SNAT, masquerade, DNAT, PAT, the
# 5-tuple and conntrack's two tuples, port exhaustion, idle timeout, port
# hold-down, unique destination, endpoint-independent mapping, managed NAT
# gateway, carrier-grade NAT, gateway and private endpoints (one sentence
# each), and, in passing, rate limiter, FIN and load balancer (which
# csa.net.transport and csa.net.load-balancing take further).
prerequisites: [csa.net.routing, csa.net.ipv6]
# Worked out: the lesson about 18 minutes (2,400 words at 130 a minute, its
# table and code included); reading 44 (the main video 15, the nftables
# wiki's NAT page 9, Azure's SNAT page 10, the named sections of AWS's and
# Google's pages 10); 22 recall items in the ladder at 1.5 each, 33; then the
# worked example 30, the fill-in 20, the write 30, the build 55, the debug 45
# and the explain 20: 295, the designer's 290 within rounding.
estimated_minutes: 290
rev: 1
objectives:
  - "Explain what source NAT, masquerading and destination NAT change in a packet, where in a gateway's path each happens (prerouting before the routing decision, postrouting after it), and how connection tracking translates replies back with no rule of their own; read a `conntrack -L` entry's two tuples."
  - "Write a NAT gateway's rules in nftables (source NAT limited to the outside interface, destination NAT for a published service, the forward rule that lets published traffic in), keep the client's real address visible to the published server, and make it all survive a reboot."
  - "Size NAT for a connection count on AWS, Azure and Google Cloud: ports per public address, the per-destination rule, addresses needed, VMs per address on Google Cloud, and what port hold-down and idle timeouts do to the numbers."
  - "Recognise port exhaustion from its evidence (new connections to one destination time out while others work; `insert_failed` in `conntrack -S`; each cloud's metric) and choose the remedy that fits."
  - "Say when to avoid NAT (IPv6, private paths to cloud services, a load balancer for inbound services, logs that need real clients, the cost per gigabyte) and when it is the right tool (overlapping ranges, an allow-listed outbound address)."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - AWS NAT gateway: "Each IPv4 address can support up to 55,000 simultaneous
#   connections to each unique destination", a unique destination being the
#   destination address, port and protocol; up to 8 IPv4 addresses (1
#   primary, 7 secondary), 2 Elastic IPs by default; ports 1024 to 65535;
#   5 Gbps scaling to 100 Gbps; NAT64 for IPv6:
#   https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html
# - AWS: a connection idle for 350 seconds times out and the gateway returns
#   an RST to an inside host that continues it; "Cannot initiate more
#   connections": spread clients across gateways, "Limit the number of
#   connections your clients can create to the destination", watch
#   IdleTimeoutCount, add addresses:
#   https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html
# - AWS metrics: ErrorPortAllocation, "The number of times the NAT gateway
#   could not allocate a source port"; IdleTimeoutCount after 350 seconds;
#   ActiveConnectionCount, concurrent TCP connections:
#   https://docs.aws.amazon.com/vpc/latest/userguide/metrics-dimensions-nat-gateway.html
# - AWS regional NAT gateways: "up to 32 IP addresses per Availability Zone
#   (compared to 8 for zonal NAT gateways)", each adding 55,000 connections
#   to a popular destination; no private NAT:
#   https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
# - AWS prices, the pricing page's US East (Ohio) example: $0.045 per NAT
#   gateway-hour and $0.045 per GB processed; a regional gateway charged for
#   each hour in each zone; public IPv4 $0.005 an hour; "There are no data
#   processing or hourly charges for using Gateway Type VPC endpoints":
#   https://aws.amazon.com/vpc/pricing/
# - AWS gateway endpoints for S3 and DynamoDB, "no additional charge", a
#   route with the service's prefix list in the chosen route tables:
#   https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
# - AWS egress-only internet gateway: IPv6 only, outbound allowed, inbound
#   initiation prevented, stateful, no charge for the gateway:
#   https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html
# - Azure NAT Gateway: "Each public IP address for a NAT gateway provides
#   64,512 SNAT ports"; up to 16 public IPv4 (StandardV2 also 16 IPv6); "The
#   same SNAT port can be used to connect to different destination endpoints
#   at the same time"; TCP idle timeout 4 to 120 minutes (default 4), UDP 4
#   minutes fixed; port reuse timers 65 s after a FIN, 16 s after an RST,
#   30 s half open, 65 s for UDP; "up to 50,000 concurrent connections per
#   public IP address to the same destination endpoint"; 2 million active
#   connections (ms.date 2025-11-04, updated 2026-10-13):
#   https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
# - Azure: SNAT ports picked at random from the inventory, reused for
#   different destinations, a cool-down before reuse to the same one
#   (ms.date 2024-04-29, updated 2025-06-19):
#   https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-snat
# - Azure metrics: SNAT Connection Count filtered by Failed, "A failed
#   connection volume greater than zero can indicate SNAT port exhaustion";
#   Total SNAT Connection Count; alert at 1.6 million of 2 million (ms.date
#   2025-09-09, updated 2026-10-13):
#   https://learn.microsoft.com/en-us/azure/nat-gateway/nat-metrics
# - Azure NAT Gateway: no unsolicited inbound connections; StandardV2 zone
#   redundant, IPv6 and NAT64; StandardV2's known issue disrupting IPv6
#   outbound through load-balancer outbound rules; priced per hour and per
#   GB processed, Standard and StandardV2 alike (ms.date 2026-08-31):
#   https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview and
#   https://azure.microsoft.com/en-us/pricing/details/azure-nat-gateway/
# - Azure load-balancer outbound rules "explicitly define SNAT", IPv6 among
#   them (ms.date 2026-01-08):
#   https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
# - Azure's default system routes drop 100.64.0.0/10 (next hop None) unless
#   the virtual network's address space uses it (ms.date 2026-03-31):
#   https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
# - Google Cloud NAT: each NAT address "offers 64,512 TCP source ports and
#   64,512 UDP source ports"; ports 0 to 1,023 unused; default minimum ports
#   per VM 64 (static) and 32 (dynamic); "1,008 VMs" at 64 per VM; with
#   static allocation "the number of ports allocated to each VM is fixed and
#   doesn't change"; a tuple reused while "at least one piece of information
#   in the destination 3-tuple changes" (last updated 2026-11-10):
#   https://docs.cloud.google.com/nat/docs/ports-and-addresses
# - Google Cloud NAT timeouts: UDP 30 s, ICMP 30 s, TCP established 1,200 s,
#   TCP transitory 30 s, TCP TIME_WAIT 30 or 120 s (30 for gateways created
#   after 2026-09-30); default maximum ports per VM, dynamic, 65,536 (last
#   updated 2026-11-10): https://docs.cloud.google.com/nat/docs/tune-nat-configuration
# - Google metrics: nat/dropped_sent_packets_count with reason
#   OUT_OF_RESOURCES ("if Cloud NAT runs out of NAT IP addresses or ports");
#   open_connections, allocated_ports, port_usage (last updated 2026-11-10):
#   https://docs.cloud.google.com/nat/docs/monitoring
# - Google Cloud NAT prices: $0.0014 an hour per VM up to 32 VMs, $0.044 an
#   hour above 32; $0.045 per GiB processed; $0.005 an hour per external
#   address: https://cloud.google.com/nat/pricing
# - Google's firewall: the implied deny ingress blocks incoming traffic no
#   rule allows: https://docs.cloud.google.com/firewall/docs/firewalls
# - RFC 6598: "The Shared Address Space address range is 100.64.0.0/10", for
#   carrier-grade NAT, with problems likely for other uses:
#   https://www.rfc-editor.org/rfc/rfc6598
# - RFC 4787, REQ-1: "A NAT MUST have an "Endpoint-Independent Mapping"
#   behavior": https://www.rfc-editor.org/rfc/rfc4787
# - AWS NAT instance: forwarding in /etc/sysctl.d/custom-ip-forwarding.conf,
#   iptables MASQUERADE, source/destination checks stopped:
#   https://docs.aws.amazon.com/vpc/latest/userguide/work-with-nat-instances.html
# Captured in this topic's labs (nftables 1.0.9 and conntrack 1.4.8 on Ubuntu
