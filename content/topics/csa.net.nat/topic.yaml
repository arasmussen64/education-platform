skills:
  - id: snat-and-dnat
    description: "What source NAT, masquerading and destination NAT each rewrite and where (`postrouting` after the routing decision, `prerouting` before it); conntrack's original and reply tuples; replies translated back with no rule; what a server behind the NAT sees, and why a masquerade rule that names no interface hides every customer's address"
  - id: nat-rules
    description: "Write nftables NAT: a `nat` table with `postrouting` (`priority srcnat`) and `prerouting` (`priority dstnat`) chains, `oifname \"wan\"` scoping, `masquerade` against `snat to ADDRESS[:PORTS]` (a port range needs a protocol match), `dnat to ADDRESS:PORT`, rule order, `ct status dnat accept` in the forward chain, the forward chain's drop as the real protection, and all of it saved in `/etc/nftables.conf` with forwarding in `/etc/sysctl.d/`"
  - id: nat-sizing
    description: "The arithmetic: ports per public address (64,512 on Azure and Google; AWS's 55,000 connections per address per unique destination), connections per destination, addresses needed, VMs per NAT address on Google Cloud, a Linux port range's size, ports held by hold-down and idle timeouts, and what NAT processing costs"
  - id: port-exhaustion
    description: "Tell port exhaustion from other failures: new connections to the busy destination time out while existing ones and other destinations work; `insert_failed` in `conntrack -S`, retries counted; AWS `ErrorPortAllocation`, Azure `SNAT Connection Count` Failed, Google `OUT_OF_RESOURCES`; remedies in order: reuse connections, more addresses (more ports per VM on Google), shorter idle timeouts, a private path"
  - id: avoid-nat
    description: "When NAT is the wrong tool: IPv6 with an egress-only gateway, gateway and private endpoints for cloud services (no ports, no per-GB NAT charge), a load balancer for inbound services, logs that must see real clients; when it is the right one: overlapping ranges, an allow-listed outbound address; carrier-grade NAT and why `100.64.0.0/10` is a poor range for a cloud network"
