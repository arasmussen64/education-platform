id: mcq-dnat-needs-forward
type: mcq
rev: 1
prompt: |
  gw has `iifname "wan" tcp dport 443 dnat to 10.1.0.20:8443` in its prerouting chain. Its forward chain is `policy drop` with two rules: `ct state established,related accept` and `iifname "lan" oifname "wan" accept`. A customer's connection to 198.51.100.2, port 443, times out. Why?
choices:
  - "No rule accepts a published connection's first packet; it needs `ct status dnat accept`"
  - "A DNAT rule in prerouting is skipped whenever the forward chain's policy is drop"
  - "The app must listen on port 443 itself, because DNAT can only change the address"
  - "The established,related rule has to come after the DNAT rule, in the same chain"
answer: 0
explanation: |
  DNAT happens in prerouting and does its job: the customer's SYN now goes to 10.1.0.20:8443, so gw forwards it, and the forward chain must accept it. The first rule only accepts packets of connections already established; the second only what comes in on `lan`. The SYN arrived on `wan`, so the policy drops it, and the customer sees a timeout. `ct status dnat accept` accepts any connection that destination NAT rewrote, which is exactly the published ones and nothing else: the line people forget. (Writing `iifname "wan" ip daddr 10.1.0.20 tcp dport 8443 accept` works too.)

  Prerouting runs whatever the forward chain's policy is. DNAT can change the port as well (`:8443`), which the walkthrough showed. And the DNAT rule lives in another table and hook altogether; order within the forward chain doesn't involve it.
skills: [nat-rules]
