id: est-aws-gateways
type: estimate
rev: 1
prompt: |
  A fleet holds 500000 connections at once to one destination (one address, port 443, TCP) through zonal AWS NAT gateways. A zonal gateway takes at most 8 IPv4 addresses, and each address supports up to 55000 simultaneous connections to each unique destination. Spreading the fleet's subnets across gateways, how many gateways does it need, at least? Exactly.
unit: NAT gateways
answer: 2
tolerance: { absolute: 0 }
given: { conns: 500000, max_ips: 8, per_ip: 55000 }
working: ceil(conns / (max_ips * per_ip))
mistakes:
  - id: rounded-down
    value: 1
    working: floor(conns / (max_ips * per_ip))
    why: "One full gateway carries 8 × 55000 = 440000 connections to that destination, 60000 short: round up."
  - id: addresses-not-gateways
    value: 10
    working: ceil(conns / per_ip)
    why: "That's how many addresses the connections need. A zonal gateway takes up to 8 of them, so 10 addresses need 2 gateways."
explanation: |
  One zonal gateway with all 8 addresses carries 8 × 55000 = 440000 connections to one destination. 500000 / 440000 = 1.14, rounded up to 2 gateways, each serving some of the subnets (AWS's troubleshooting page suggests exactly that split). A regional NAT gateway, which takes up to 32 addresses in each Availability Zone, could do it alone (AWS's pages, read 2026-11-12). Half a million connections to one API is also a sign the clients should reuse their connections.
skills: [nat-sizing]
