# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: NAT
  aliases: [network address translation]
  definition: Network address translation. A gateway rewrites the addresses (and often the ports) in packets as they pass, and connection tracking rewrites the replies back.
- term: source NAT
  aliases: [SNAT]
  definition: NAT that rewrites a packet's source, usually so many private machines can share one public address, told apart by port. Done after the routing decision, on the way out.
- term: destination NAT
  aliases: [DNAT, port forwarding]
  definition: NAT that rewrites a packet's destination, so a connection to the gateway's address and port reaches a machine behind it. Done before the routing decision.
- term: masquerade
  aliases: [masquerading]
  definition: Source NAT to whatever address the outgoing interface has at that moment, for a line whose address can change.
- term: port exhaustion
  definition: A NAT running out of source ports for one destination, so new connections to it fail or time out while connections elsewhere still work.
- term: PAT
  aliases: [NAPT, port address translation]
  definition: Port address translation, many inside machines sharing one public address, their connections kept apart by the source port the NAT gives each. What home routers and cloud NAT gateways do.
- term: 5-tuple
  definition: The five things that name a connection, its protocol and its source and destination addresses and ports. A NAT keeps translations apart by it.
- term: carrier-grade NAT
  definition: An internet provider putting many customers behind a few public addresses, on the shared range 100.64.0.0/10, which is why that range is a poor choice for a cloud network.
- term: hairpinning
  definition: An inside machine reaching an inside server through the gateway's public address. The gateway has to send the packets back the way they came, which needs extra NAT rules.
