id: review-mcq-area-not-height
type: mcq
rev: 1
prompt: |
  A density curve for a uniform variable on `[0, 0.5]` is flat at height 2. Is that a mistake?
choices:
  - 'Yes: a probability can''t be above 1, and a density is a probability for each value'
  - 'No: a density''s height isn''t a probability; the area is, and 2 times a width of 0.5 is exactly 1'
  - 'Yes: a uniform density is always at height 1, whatever its range, because every value is equally likely'
  - 'No, but only because the variable is discrete; a continuous one could not have a height above 1'
answer: 1
explanation: |
  Probability is area under a density, and the total area must be 1. Over a range of width 0.5 that takes a height of 2. Heights above 1 are normal for narrow distributions; it's areas that stay between 0 and 1. The variable is continuous, which is exactly why there's a density and not a table.
skills: [density]
