id: review-mcq-bernoulli-or-binomial
type: mcq
rev: 1
prompt: |
  A test is positive for 8 percent of healthy people. Which is Bernoulli and which is binomial?
choices:
  - 'One healthy person''s result is Bernoulli with `p = 0.08`; the count among 200 is binomial with `n = 200`'
  - 'Both are Bernoulli, because each test is a yes or a no and 200 of them are just 200 Bernoullis written down'
  - 'Both are binomial, because there is a probability involved and a Bernoulli is only a name for the formula'
  - 'One person is binomial with `n = 1`; 200 people is normal, because a count that large follows the bell curve closely enough'
answer: 0
explanation: |
  One yes-or-no is Bernoulli; a count of yeses over a fixed number of independent tries is binomial. (A Bernoulli is a binomial with `n = 1`, which is why the second half of the last choice is the only thing wrong with it: 200 is still a count, so binomial, even though its shape is near a bell.)
skills: [name]
