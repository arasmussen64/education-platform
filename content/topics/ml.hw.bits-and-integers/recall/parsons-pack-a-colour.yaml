id: parsons-pack-a-colour
type: parsons
rev: 1
prompt: |
  Put the lines in order to pack a red, green and blue byte into one integer, read the green byte back out, and print `0xff8007 128`. One line is a decoy that doesn't belong.
lines:
  - 'r, g, b = 255, 128, 7'
  - 'packed = (r << 16) | (g << 8) | b'
  - 'green = (packed >> 8) & 0xFF'
  - 'print(hex(packed), green)'
distractors:
  - 'green = packed & 0xFF'
explanation: |
  Red is shifted up 16 bits, green 8, blue none, and the three are combined with `|`: `0xff8007`. To read green back, shift the packed value down 8 bits so green sits in the bottom byte, then mask with `0xFF` to drop red above it. The decoy masks without shifting and gets blue, 7.
skills: [bits]
