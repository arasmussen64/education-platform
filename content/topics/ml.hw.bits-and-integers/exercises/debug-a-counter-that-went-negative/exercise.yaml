id: debug-a-counter-that-went-negative
stage: debug
rev: 2
title: "A counter that went negative"
prompt: |
  The program counts how often each pixel value appears in 320 pixels, then counts the pixels whose `FLAG_DARK` bit is set (the pixels under 10 get it). It should print:

  ```
  counts of 3 and 200: 160 120
  dark pixels: 160
  ```

  Instead it prints `-96` for the count of 3, and `0` dark pixels. It has two bugs. Run it, take the two wrong numbers one at a time, and work out by hand what each line should be computing.
hints:
  - "Each wrong number has its own cause. Fix one, run it again, then look at the other."
  - "160 printed as -96 is exactly 256 less. What dtype holds the histogram, and what is the largest count it can store?"
  - "Counts need room to grow: give the histogram a wide integer dtype, `np.int64`."
  - "Print `f & FLAG_DARK` for a dark pixel. The mask keeps the bit in its own place, so it is 4 when the flag is set, never 1. Test whether it is non-zero: `(f & FLAG_DARK) != 0`."
skills: [fixed-width, bits]
