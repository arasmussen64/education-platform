# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: if-else
    description: "Run a block only when a condition is `True`, with `else` for when it isn't"
  - id: elif-order
    description: "Chain conditions with `elif`: the first `True` one wins, so their order matters"
  - id: blocks
    description: "End an `if` line with a colon and indent the lines that belong to it; unindented lines run every time"
