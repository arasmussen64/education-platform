id: py.if-elif-else
kind: topic
status: ready
title: "if / elif / else"
summary: "Choose between paths with if, elif and else, and indent the lines that belong to each."
prerequisites: [py.booleans-and-comparisons]
estimated_minutes: 45
rev: 1
objectives:
  - "Run some lines only when a condition is `True`, with `if`, and other lines when it isn't, with `else`."
  - "Chain several conditions with `elif`, knowing that the first `True` one wins and the rest are skipped."
  - "End an `if` line with a colon, indent the lines that belong to it, and tell which lines run every time."
