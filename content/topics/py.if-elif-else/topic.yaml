prove:
  build: build-shipping
  debug: debug-discount
  explain:
    prompt: |
      A friend's program is meant to print `Distinction` for scores of 90 or more, `Pass` for 60 or more, and `Fail` otherwise:

      ```python
      score = int(input("Score? "))
      if score >= 60:
          print("Pass")
      elif score >= 90:
          print("Distinction")
      else:
          print("Fail")
      ```

      It prints `Pass` for 95, and never prints `Distinction`. In your own words: how does Python work through an if / elif / else chain, why does this one never reach `Distinction`, how would you fix it, and when does the `else` part run?
    rubric:
      - id: first-true-wins
        required: true
        description: "Python checks the conditions from the top and runs only the first branch whose condition is True; the rest are skipped."
      - id: why-never
        required: true
        description: "95 is >= 60, so the first branch wins and the elif is never looked at."
      - id: fix
        required: true
        description: "Put the stricter test first: check score >= 90 before score >= 60."
      - id: else-runs
        required: true
        description: "else runs only when none of the conditions above it were True."
      - id: blocks
        required: false
        description: "The indented lines under each condition are what belongs to that branch."
    model_answer: |
      Python reads an if / elif / else chain from the top and stops at the first condition that is True: it runs that branch's indented lines and skips every other branch. For 95, the first question, score >= 60, is already True, so it prints Pass and never even looks at score >= 90. The fix is to ask the stricter question first: if score >= 90, print Distinction; elif score >= 60, print Pass; else, print Fail. The else branch runs only when none of the conditions above it were True, so here it catches every score under 60.
