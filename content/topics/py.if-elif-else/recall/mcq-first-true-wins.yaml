id: mcq-first-true-wins
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  x = 15
  if x > 10:
      print("A")
  elif x > 5:
      print("B")
  else:
      print("C")
  ```
choices:
  - '`A` and then `B`'
  - '`A`'
  - '`B`'
  - '`C`'
answer: 1
explanation: |
  Python checks the conditions from the top and runs only the first branch whose condition is `True`. `15 > 10` is `True`, so it prints `A` and skips the rest, even though `15 > 5` would also have been `True`.
skills: [elif-order]
