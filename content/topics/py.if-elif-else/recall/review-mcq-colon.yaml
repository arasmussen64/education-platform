id: review-mcq-colon
type: mcq
rev: 1
prompt: |
  Which line correctly starts an `if` that checks whether `age` is at least 18?
choices:
  - '`if age >= 18`'
  - '`if age >= 18:`'
  - '`if age => 18:`'
  - '`if (age >= 18) then:`'
answer: 1
explanation: |
  An `if` line ends with a colon, and the lines that belong to it are indented underneath. Without the colon it's a `SyntaxError`. `=>` isn't a Python operator (it's `>=`), and Python has no `then`.
skills: [blocks]
