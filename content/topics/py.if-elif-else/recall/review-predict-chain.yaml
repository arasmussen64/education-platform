id: review-predict-chain
type: predict_output
rev: 1
prompt: |
  What will this program print? There are two separate decisions here, and one ends with `else`.
code: |
  n = 7
  if n > 5:
      print("big")
  elif n > 2:
      print("medium")
  if n > 2:
      print("more than two")
  else:
      print("small")
  print("end")
expected_output: |
  big
  more than two
  end
explanation: |
  The first chain prints `big` and skips its `elif`, because the first `True` condition wins. The second `if` is a separate decision, so it's asked as well: `7 > 2` is `True`, so `more than two` is printed and its `else` is skipped. `print("end")` isn't indented, so it runs whatever happened above.
skills: [elif-order, blocks]
