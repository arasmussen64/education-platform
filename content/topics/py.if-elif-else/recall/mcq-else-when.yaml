id: mcq-else-when
type: mcq
rev: 1
prompt: |
  When do the lines under `else:` run?
choices:
  - 'Every time, right after the `if` block'
  - 'Only when the `if` condition (and every `elif` above the `else`) was `False`'
  - 'Only when the `if` condition was `True`'
  - 'Only when there is no `elif` in the chain'
answer: 1
explanation: |
  `else` has no condition of its own. It's the "otherwise" branch: it runs only when none of the conditions above it were `True`. If the `if` ran, the `else` is skipped.
skills: [if-else]
