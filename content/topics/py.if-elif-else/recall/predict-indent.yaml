id: predict-indent
type: predict_output
rev: 1
prompt: |
  What will this program print? Look carefully at which lines are indented.
code: |
  score = 40
  if score >= 50:
      print("Pass")
      print("Well done")
  print("Done")
expected_output: |
  Done
explanation: |
  `40 >= 50` is `False`, so both indented lines are skipped: they belong to the `if`. `print("Done")` isn't indented, so it isn't part of the `if` and runs every time.
skills: [blocks, if-else]
