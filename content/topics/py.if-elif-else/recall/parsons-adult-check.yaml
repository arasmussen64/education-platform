id: parsons-adult-check
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Minor` and then `Done`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'age = 17'
  - 'if age >= 18:'
  - '    print("Adult")'
  - 'else:'
  - '    print("Minor")'
  - 'print("Done")'
distractors:
  - 'elif age >= 18:'
explanation: |
  The `if` line comes first, and the indented line right under it is what runs when the test is true; `else:` and its indented line handle the other case. `print("Done")` isn't indented, so it runs after the whole if-else, whichever branch ran. An `elif` only makes sense after an `if`, and this program has no second test.
skills: [if-else, blocks]
