id: fill-grade
stage: fill_in
rev: 1
title: "Letter grades"
prompt: |
  This program turns a score into a letter: 90 or more is an A, 80 or more a B, 70 or more a C, and anything lower an F. The first and last branches are done. Replace each `...` with a condition so that typing `85` prints:

  ```
  Grade: B
  ```

  and `75` prints `Grade: C`, `60` prints `Grade: F`.
hints:
  - "Each `...` is a comparison like the one on line 2, with a different number."
  - "The first `True` condition wins. By the time Python reaches the first `elif`, the score is already known to be below 90, so that branch only needs to ask whether it's 80 or more."
  - "80 itself should be a B, and 70 itself a C: use `>=`, not `>`."
skills: [elif-order, if-else]
