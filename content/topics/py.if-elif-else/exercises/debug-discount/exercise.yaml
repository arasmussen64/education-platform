id: debug-discount
stage: debug
rev: 1
title: "A discount that doesn't add up"
prompt: |
  This program works out a discount from an order's total: $100 or more gets 20%, $50 or more gets 10%, and anything less gets none. It always thanks the customer. Typing `120` should print:

  ```
  Discount: 20%
  Thank you!
  ```

  and `60` should print `Discount: 10%`, `20` should print `Discount: 0%`, each followed by `Thank you!`. It has three bugs. Run it with each of those totals, fix what you find, and run it again.
skills: [elif-order, blocks, if-else]
