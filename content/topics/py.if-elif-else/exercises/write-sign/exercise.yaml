id: write-sign
stage: write
rev: 1
title: "Positive, negative or zero"
prompt: |
  Write a program that asks for a whole number and prints `Positive`, `Negative` or `Zero`. Typing `5` should print:

  ```
  Positive
  ```
hints:
  - "There are three possible answers, so you need three branches: `if`, `elif` and `else`."
  - "Zero is neither positive nor negative. Check for it with `== 0`, or make sure your other conditions leave it out: `> 0` rather than `>= 0`."
  - "Every branch prints one word and nothing else."
skills: [if-else, elif-order]
