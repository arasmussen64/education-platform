id: review-code-temperature
stage: review_code
rev: 1
title: "Cold, mild or hot"
prompt: |
  Write a program that asks for a temperature in degrees (it may have decimals) and prints `Cold` below 10, `Hot` above 25, and `Mild` otherwise. Typing `18` should print:

  ```
  Mild
  ```
skills: [if-else, elif-order]
