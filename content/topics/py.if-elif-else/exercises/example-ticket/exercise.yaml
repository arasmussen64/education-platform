id: example-ticket
stage: worked_example
rev: 1
title: "A ticket price that depends on age"
prompt: |
  This program charges children less. Press **Run**, try an age under 12 and then one over, and read how the two paths work.
steps:
  - label: "Read the age"
    lines: "1"
    note: "As before: `int(input(...))`, so `age` is a number that comparisons can use."
  - label: "Ask the question"
    lines: "2-3"
    note: "`if age < 12:` ends with a colon. The indented line under it belongs to the `if`, so `price = 6` happens only when the comparison is `True`."
  - label: "Otherwise"
    lines: "4-5"
    note: "`else:` has no condition. Its indented line runs when the `if` didn't. Exactly one of lines 3 and 5 runs, so `price` always gets a value."
  - label: "Back to the left margin"
    lines: "6-7"
    note: "These lines aren't indented, so they're not part of the `if` or the `else`. They run every time, whatever the age was."
