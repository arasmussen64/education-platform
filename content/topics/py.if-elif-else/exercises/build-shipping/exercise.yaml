id: build-shipping
stage: build
rev: 1
title: "Shipping cost"
prompt: |
  Starting from a blank editor, write a program that asks for a parcel's weight in kilograms (it may have decimals) and prints the shipping cost, with two decimal places: up to and including 1 kg costs $5.00, up to and including 5 kg costs $9.50, and anything heavier costs $20.00. Typing `3` should print:

  ```
  Shipping: $9.50
  ```
skills: [elif-order, if-else]
