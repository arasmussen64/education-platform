- term: numerator
  definition: The top number of a fraction. It says how many of the equal pieces you have, and it is the number that gets divided.
- term: denominator
  definition: The bottom number of a fraction. It says how many equal pieces make one whole, and it is the number you divide by.
- term: ratio
  definition: A comparison of two amounts, as parts ("3 parts to 1") or as one divided by the other. It says how the amounts relate, not how big they are.
- term: percentage change
  definition: How much a value changed, as a percentage of where it started. `(new - old) / old * 100`; a minus sign means it fell.
