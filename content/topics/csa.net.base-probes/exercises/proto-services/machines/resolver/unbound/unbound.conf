# The office's recursive resolver. It starts at the lab internet's own root
# server (root.hints), not the real one, and doesn't validate DNSSEC here.
server:
  interface: 0.0.0.0
  interface: ::0
  access-control: 10.10.0.0/24 allow
  access-control: 2001:db8:10::/64 allow
  access-control: 127.0.0.0/8 allow
  root-hints: "/etc/unbound/root.hints"
  module-config: "iterator"
  chroot: ""
  username: "unbound"
  pidfile: "/run/unbound.pid"
  # A name server that didn't answer is tried again after 60 seconds, not
  # Unbound's 900: after a boot, the name servers may start after this.
  infra-host-ttl: 60
  qname-minimisation: yes
  use-syslog: no
  logfile: ""
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
