# The services probe's checks. Each reads real state: a resolver's answer,
# a lookup traced from the root, HAProxy's own view of its servers, the NAT's
# connection table, a capture decoded by tshark, and the resolver's and
# edge's running configuration against their files. "resolves" waits for the
# name servers after a boot; the rest read at once.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: resolves
    description: "From the office, www.shop.test resolves through the office's resolver to the load balancer."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      answer() { on client dig +short +time=2 +tries=1 www.shop.test; }
      answered() { [ -n "$(answer)" ]; }
      wait_for 60 answered
      answer
    timeout: 75
    expect:
      equals: "198.51.100.80"
  - id: trace
    description: "A lookup traced from the root ends at shop.test's own server."
    command: on client dig +trace +time=2 +tries=1 www.shop.test A | grep -E '^www\.shop\.test\.' | awk '{print $NF}' | tail -1
    expect:
      equals: "198.51.100.80"
  - id: both-servers-up
    description: "HAProxy on lb1 sees web1 and web2 healthy."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      up() { on lb1 sh -c 'echo "show stat" | socat stdio /run/haproxy/admin.sock' | awk -F, '$1 == "web" && $2 ~ /^web[12]$/ && $18 == "UP" {n++} END {print n+0}'; }
      both() { [ "$(up)" = 2 ]; }
      wait_for 10 both
      up
    expect:
      equals: "2"
  - id: balanced
    description: "Requests from the office to www.shop.test reach both web servers."
    command: for i in 1 2 3 4; do on client curl -s --max-time 3 http://www.shop.test/; done | sort -u | tr '\n' ' '
    expect:
      equals: "hello from web1 hello from web2"
  - id: ipv6-not-translated
    description: "Over IPv6 the office's own address reaches the load balancer: no NAT."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      capture lb1 eth0 'ip6 and tcp port 80' 4 -- on client curl -s -6 --max-time 3 http://www.shop.test/ | grep -o '2001:db8:10::10\.[0-9]*' | head -1 | cut -d. -f1
    expect:
      equals: "2001:db8:10::10"
  - id: ipv4-translated
    description: "Over IPv4 the office leaves through edge's NAT, from edge's public address and its small port range."
    command: |
      on client curl -s --max-time 3 http://198.51.100.80/ > /dev/null
      on edge conntrack -L -p tcp --dport 80 2>/dev/null | grep 'src=10.10.0.10' | grep -o 'dst=198.51.100.1 sport=80 dport=[0-9]*' | head -1 | awk -F'dport=' '$2 >= 40000 && $2 <= 40099 {print "translated"}'
    expect:
      equals: translated
  - id: slow-link
    description: "The office's link to the internet adds about 30 ms to a round trip."
    command: on client ping -c 3 -q 198.51.100.13 | awk -F/ '/rtt/ {printf "%d\n", $5}'
    expect:
      gte: 28
  - id: tshark-decodes
    description: "tshark reads, in a capture on the resolver, its question to shop.test's own server."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      on resolver unbound-control flush www.shop.test > /dev/null 2>&1
      f=$(pcap resolver eth0 'udp port 53' 4 -- on client dig +short +time=2 +tries=1 www.shop.test)
      tshark -r "$f" -Y 'dns.flags.response == 0 && ip.dst == 198.51.100.13' -T fields -e dns.qry.name 2>/dev/null | sort -u | head -1
      rm -f "$f"
    timeout: 20
    expect:
      equals: "www.shop.test"
  - id: resolver-fix-saved
    description: "The resolver's fix is in its /etc/unbound/unbound.conf, so a restart keeps it: an Unbound started from its files answers for the same zones itself as the running one."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      # The zones the running resolver answers for itself, against those of
      # an Unbound started from the resolver's files in netlab verify's
      # throwaway copy (chk-resolver sees the resolver's own /etc). A fix
      # made only live, with unbound-control, makes them differ.
      live=$(on resolver unbound-control list_local_zones 2> /dev/null | sort)
      fresh=$(netlab verify resolver -- bash -c '
        on chk-resolver unbound -d -p > /dev/null 2>&1 &
        for i in $(seq 1 50); do on chk-resolver unbound-control status > /dev/null 2>&1 && break; sleep 0.2; done
        on chk-resolver unbound-control list_local_zones 2> /dev/null | sort
        on chk-resolver unbound-control stop > /dev/null 2>&1
        wait')
      if [ -n "$live" ] && [ "$live" = "$fresh" ]; then echo saved; exit 0; fi
      echo "the running resolver isn't the one its files start: after a restart it would answer for $(diff <(echo "$live") <(echo "$fresh") | sed -n 's/^> //p' | head -n 2 | tr '\n' ' ')itself"
    timeout: 45
    expect:
      equals: saved
  - id: edge-firewall-saved
    description: "edge's running firewall and NAT are the ones its /etc/nftables.conf loads."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      nft_saved edge && echo saved
    expect:
      equals: saved
