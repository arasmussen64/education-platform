id: debug-ipv6-half-works
stage: debug
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "IPv6 half works"
prompt: |
  A probe for the network-lab base's CI spike: the Module 3 topic IPv6 will use it as its debug.

  The office runs dual stack. Its laptops, h1 and h2, get IPv4 from the office's router, r1, and are meant to configure IPv6 for themselves from r1's advertisements, in the office's subnet `2001:db8:42:a::/64`. r1 forwards both, translates IPv4 to its own address, and lets nobody on the internet open connections to the office. web, in the cloud (203.0.113.80 and 2001:db8:80::80), runs a test service: port 8080 answers with the address your connection came from (`on h1 nc -6 2001:db8:80::80 8080 < /dev/null`), and port 9000 counts what you send it. IPv4 works. IPv6 doesn't: the laptops can't reach anything over it.

  There are three faults. Fix each at its cause. The rules: no translation for IPv6 (each laptop keeps its own address on the internet); the internet still can't open connections to the office; the laptops configure themselves (type no addresses onto them); leave every MTU as it is; and every fix survives a restart.

  `on MACHINE COMMAND` runs a command on a machine, and `netlab show` lists the machines. `sudo netlab restart` builds the network again from every machine's files, as a reboot would.
