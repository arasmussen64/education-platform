id: proto-bgp-over-vti
stage: build
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Probe: BGP over a route-based IPsec tunnel"
prompt: |
  A probe for the network-lab base's CI spike, not a lesson: the Module 3 IPsec topic will teach this.

  Five machines: `host-a` in the shop's site, `vpn-a`, the shop's VPN gateway (yours), `isp`, the internet between them, `vpn-b`, which stands in for a cloud's VPN gateway (not yours), and `host-b` in the cloud's network, 10.2.0.0/24. `on MACHINE COMMAND` runs a command on a machine, and `netlab show` lists them. vpn-a's tunnel interface, `vti0` (169.254.10.1/30, mark 42), is already made by its `/etc/network/up`.

  Make host-a reach host-b through an IPsec tunnel between vpn-a (198.51.100.2) and vpn-b (203.0.113.2), with the route to the cloud learned over BGP:

  1. **IPsec, on vpn-a** (`/etc/swanctl/conf.d/`, then `sudo systemctl restart strongswan@vpn-a`): IKEv2 with the pre-shared key `lab-shared-secret-42` and each side's address as its identity; IKE proposal `aes256-sha256-modp2048`; one CHILD_SA for everything (`0.0.0.0/0` both ways) with `mark_in` and `mark_out` 42 and ESP proposal `aes256gcm16-modp2048`. vpn-a starts the tunnel, and starts it again whenever it closes, however many tries it takes.
  2. **BGP, on vpn-a** (`on vpn-a vtysh`): AS 65001, a session with 169.254.10.2 in AS 64512 inside the tunnel (with `timers bgp 3 9` and `timers connect 5`, as the cloud has), announcing the shop's 10.1.0.0/24 and accepting only prefixes inside 10.2.0.0/16 of length /24 or shorter. Saved, so a restart keeps it.
  3. Don't change vpn-b, the topology or vpn-a's network files, and add no routes by hand: the cloud's network arrives by BGP.

  Then run the checks.
