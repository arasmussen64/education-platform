frr version 8.4.4
frr defaults traditional
hostname vpn-b
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 203.0.113.1
ip route 172.16.9.0/24 blackhole
!
router bgp 64512
 bgp router-id 203.0.113.2
 timers bgp 3 9
 neighbor 169.254.10.1 remote-as 65001
 neighbor 169.254.10.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
  network 172.16.9.0/24
  neighbor 169.254.10.1 route-map FROM-SHOP in
  neighbor 169.254.10.1 route-map TO-SHOP out
 exit-address-family
exit
!
ip prefix-list SHOP seq 5 permit 10.1.0.0/16 le 24
ip prefix-list CLOUD seq 5 permit 10.2.0.0/24
ip prefix-list CLOUD seq 10 permit 172.16.9.0/24
!
route-map FROM-SHOP permit 10
 match ip address prefix-list SHOP
exit
!
route-map TO-SHOP permit 10
 match ip address prefix-list CLOUD
exit
!
