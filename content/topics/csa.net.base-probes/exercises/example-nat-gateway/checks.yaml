# The checks of "A NAT gateway": what srv and the app see (the address
# each connection came from), how many connections the office can hold to
# one destination at once, and whether gw's rules and forwarding come back
# after a reboot (its running rules against its /etc/nftables.conf, its
# live forwarding against its /etc/sysctl.d). Each reads at once.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: office-out
    description: "The office reaches srv's web server, which sees it as gw's address on the internet, 198.51.100.2."
    command: on office curl -sS -m 3 http://203.0.113.10/ 2>&1
    expect:
      equals: "you are 198.51.100.2"
  - id: published
    description: "A customer reaches the shop's app at 198.51.100.2, port 443, and the app sees the customer's own address."
    command: on client curl -sS -m 3 http://198.51.100.2:443/ 2>&1
    expect:
      equals: "you are 203.0.113.20"
  - id: plenty-of-ports
    description: "The office holds 50 connections to srv's port 9000 at once."
    command: on office holdconns 50 203.0.113.10 9000 1
    expect:
      equals: "opened 50 of 50"
  - id: saved
    description: "gw's running firewall and NAT are the ones its /etc/nftables.conf loads, and nftables@gw loads that file at every boot."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      [ "$(systemctl is-enabled nftables@gw 2> /dev/null)" = enabled ] || { echo "nftables@gw isn't enabled"; exit 0; }
      if differs=$(nft_saved gw); then
        echo saved
      else
        echo "gw's running rules aren't the ones its /etc/nftables.conf loads: $(echo "$differs" | head -n 2 | tr '\n' ' ')"
      fi
    expect:
      equals: saved
  - id: forwarding-lasts
    description: "gw forwards, and its /etc/sysctl.d says so, so it still forwards after a reboot."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      differs=$(sysctl_saved gw net.ipv4.ip_forward) || { echo "$differs"; exit 0; }
      on gw sysctl -n net.ipv4.ip_forward
    expect:
      equals: "1"
