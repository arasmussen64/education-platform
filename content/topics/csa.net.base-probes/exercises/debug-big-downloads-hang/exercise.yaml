id: debug-big-downloads-hang
stage: debug
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Big downloads hang"
prompt: |
  A probe for the network-lab base's CI spike: the Module 3 topic Layers and packets will use it as its debug.

  The shop's cloud network hangs off the office through a GRE tunnel from r1, the office's router, to r2, the cloud's router. In the cloud are web (10.0.2.20, the shop's site and its price list), files (10.0.2.30, the file server) and the cloud office's printer (10.0.3.5). Since the weekend, staff in the office report three things: the site's pages load, but downloading the price list never finishes (`on office curl -o /dev/null http://10.0.2.20/pricelist.csv`); the file server can't be reached at all; and printing to the printer fails.

  There are three faults. Find each one from the evidence and fix it at its cause. The rules: don't change any interface's MTU (the tunnel's is what the provider allows, and the networks are standard Ethernet); leave the office laptop's settings as they are (there are forty like it); web keeps answering nothing from outside but its website, not even ping; and every fix must survive a restart of the lab.

  `on MACHINE COMMAND` runs a command on a machine (`on office ping 10.0.2.20`), and `netlab show` lists the machines. Each machine keeps its settings in its own `/etc`, and `sudo netlab restart` builds the network again from them, as a reboot would.
