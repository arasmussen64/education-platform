#!/usr/sbin/nft -f
# web's firewall: from outside, only the website.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        # The server team's hardening: no ping.
        ip protocol icmp drop
        ct state established,related accept
        tcp dport 80 accept
    }
}
