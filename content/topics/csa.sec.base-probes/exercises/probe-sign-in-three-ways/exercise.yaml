id: probe-sign-in-three-ways
stage: debug
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Probe: a sign-in that fails three ways"
prompt: |
  A probe for the identity-lab base's CI spike, not a lesson: Module 4's federation topic and Checkpoint 4 will teach this.

  Five machines on one network. `idp` runs the shop's identity provider (Keycloak) at `https://login.shop.test`, with one realm, `shop`. Its settings are a file on `idp`, `/etc/keycloak/realms/shop.json`; `sudo realm-apply` rebuilds the running realm from that file. `app` runs the orders site, `https://app.shop.test/orders/` (Apache), which signs staff in through the identity provider. The site's stock page asks the stock API on `api` (`https://api.shop.test/stock/level`) with the signed-in person's access token. `ntp` is the shop's time server, `time.shop.test`. `office` is a staff laptop: `on office signin https://app.shop.test/orders/stock ana -v` opens the page as Ana's browser would and shows every step.

  Staff can't sign in. There are three faults. Useful: `on app clock`, `on app tail /var/log/apache2/error.log`, `journalctl -u keycloak@idp`, `journalctl -u stock-api@api`, `realm-saved`.

  Rules: the API's settings and the time server stay as they are; no redirect address with a wildcard; tokens last no longer than they do now; a machine's clock is set by its time sync and never by hand; every fix lasts a restart.

  Then run the checks.
