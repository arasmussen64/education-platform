# The probe's checks: real sign-ins from the office laptop, a token the
# check gets and verifies itself, and the lasting places (the realm file,
# the time sync, the sealed scenery). Keycloak answers, and app's time sync
# has had its chance, before the boot counts as finished, so no check waits
# for either; the first waits a few seconds for Apache, which starts after
# Keycloak.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: staff-sign-in
    description: "Ana, from the office laptop, signs in to the orders site and it knows her."
    timeout: 45
    command: |
      . /usr/local/lib/idlab/idlib.sh
      wait_for 10 on office curl -s -m 2 -o /dev/null https://app.shop.test/
      got=$(on office signin https://app.shop.test/orders/me ana)
      echo "$got" | grep -x 'user=ana' || echo "$got" | tail -1
    expect:
      equals: user=ana
  - id: warehouse-refused
    description: "Ben, who isn't staff, signs in at the identity provider and is still refused by the orders site."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      on office signin https://app.shop.test/orders/me ben | tail -1 | grep -o '^refused: 401' || echo "ben got in, or never reached the site"
    expect:
      equals: "refused: 401"
  - id: stock-shown
    description: "The orders site's stock page, opened by Ana, shows the level the stock API gave it."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      got=$(on office signin https://app.shop.test/orders/stock ana)
      echo "$got" | grep -x 'level=42' || echo "$got" | tail -1
    expect:
      equals: level=42
  - id: tokens-right
    description: "A sign-in the check runs itself, as the orders site, gets an ID token for the site and an access token for the stock API, both signed by the identity provider and valid for no more than five minutes."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      iss=https://login.shop.test/realms/shop
      secret=$(on idp awk -F= '$1 == "SHOP_WEB_SECRET" { print $2 }' /etc/keycloak/secrets.env)
      tokens=$(on office signin --code shop-web https://app.shop.test/oidc/callback $iss ana --secret="$secret")
      case $tokens in "{"*) ;; *) echo "$tokens"; exit 0 ;; esac
      nonce=$(echo "$tokens" | json "d['nonce_sent']")
      id=$(echo "$tokens" | json "d['id_token']" | on office jwt verify --issuer=$iss --audience=shop-web --nonce="$nonce")
      at=$(echo "$tokens" | json "d['access_token']" | on office jwt verify --issuer=$iss --audience=https://api.shop.test)
      life=$(echo "$tokens" | json "d['expires_in']")
      [ "${id%% *}" = valid ] || { echo "the ID token is $id"; exit 0; }
      [ "${at%% *}" = valid ] || { echo "the access token is $at"; exit 0; }
      [ "$life" -le 300 ] || { echo "tokens last $life seconds"; exit 0; }
      echo right
    expect:
      equals: right
  - id: redirect-exact
    description: "The identity provider sends a sign-in for the orders site back to the site's one callback address and nowhere else."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      uris=$(client_field shop shop-web "' '.join(d['redirectUris'])")
      [ "$uris" = "https://app.shop.test/oidc/callback" ] || { echo "registered: $uris"; exit 0; }
      r=$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')
      for other in "https://app.shop.test/oidc/callback/x$r" "https://app.shop.test/other$r" "https://evil$r.test/oidc/callback"; do
        got=$(on office signin --code shop-web "$other" https://login.shop.test/realms/shop ana --secret=x | tail -1)
        case $got in "refused: Invalid parameter: redirect_uri"*) ;; *) echo "$other was not refused: $got"; exit 0 ;; esac
      done
      echo exact
    expect:
      equals: exact
  - id: api-strict
    description: "The stock API still refuses a token signed by anyone else, a token with no signature, and the identity provider's own token for another audience; its settings and the time server's are as they were."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      iss=https://login.shop.test/realms/shop
      ask() { on office curl -s -m 5 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" https://api.shop.test/stock/level; }
      [ "$(ask "$(mint-token --iss=$iss --aud=https://api.shop.test)")" = 401 ] || { echo "a forged token was served"; exit 0; }
      [ "$(ask "$(mint-token --iss=$iss --aud=https://api.shop.test --alg=none)")" = 401 ] || { echo "an unsigned token was served"; exit 0; }
      secret=$(on idp awk -F= '$1 == "SHOP_WEB_SECRET" { print $2 }' /etc/keycloak/secrets.env)
      id=$(on office signin --code shop-web https://app.shop.test/oidc/callback $iss ana --secret="$secret" | json "d['id_token']")
      [ "$(ask "$id")" = 401 ] || { echo "a token for the orders site itself was served"; exit 0; }
      [ "$(intact)" = intact ] || { intact; exit 0; }
      echo strict
    expect:
      equals: strict
  - id: clock-right
    description: "The orders site's server keeps the right time, set by its time sync from the shop's time server, and will after a restart."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      off=$(clock_offset app)
      [ "${off#-}" -le 2 ] || { echo "app's clock is $off seconds off"; exit 0; }
      [ "$(systemctl is-enabled timesync@app 2> /dev/null)" = enabled ] || { echo "app's clock is right now, but its time sync won't start at boot"; exit 0; }
      [ "$(systemctl is-active timesync@app 2> /dev/null)" = active ] || { echo "app's clock is right now, but its time sync isn't running"; exit 0; }
      synced=$(clock_synced app) || { echo "app's clock is right now, but its time sync can't keep it right: $synced"; exit 0; }
      echo right
    expect:
      equals: right
  - id: realm-saved
    description: "The identity provider's running realm is the one its file builds."
    command: |
      . /usr/local/lib/idlab/idlib.sh
      kc_saved shop
    expect:
      equals: saved
