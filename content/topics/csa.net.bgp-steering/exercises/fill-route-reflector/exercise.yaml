id: fill-route-reflector
stage: fill_in
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Make core a route reflector"
prompt: |
  A company's data centre is one AS, 65001, with four routers that run BGP. `access` holds the data centre's four networks, 10.1.0.0/24 to 10.1.3.0/24, where the office laptop, `office`, is 10.1.0.10. `dc1` and `dc2` each hold one circuit to the cloud (AS 64600): dc1's `dx1` is the primary, dc2's `dx2` the backup. `core` sits in the middle, cabled to the other three. The inside BGP sessions (iBGP) run only over those three cables: access with core, core with dc1, core with dc2. Static routes carry traffic for the inside cables, where a bigger network would run OSPF. dc1 and dc2 announce the data centre to the cloud as one summary, 10.1.0.0/22, and dc1 gives the cloud's routes local preference 200 so the data centre's traffic leaves through it. The cloud's app, `app` (10.100.0.10), answers on TCP port 8080 with the address that reached it. The cloud's router isn't yours; `looking-glass cloud 'show ...'` reads it. BGP's timers are the labs' fast ones (a keepalive every 3 seconds and a hold time of 9; real routers default to 60 and 180).

  Since core was set up, the office reaches nothing in the cloud: `on access vtysh -c 'show bgp ipv4 unicast'` lists only the data centre's own networks. The cloud's routes reach dc1 and dc2, and stop at core, because a router never passes a route it learned over iBGP to another iBGP neighbour. core must become a **route reflector**. Four values are missing, each written `___`, three in core's saved file and one in dc2's. FRR started anyway and skipped the lines it couldn't read: `on core vtysh -c 'show running-config'` shows what it loaded, without them. The gaps, in order:

  1. to 3. In core's `/etc/frr/frr.conf`, under `address-family ipv4 unicast`, one line for each of its neighbours, access (10.0.1.2), dc1 (10.0.2.2) and dc2 (10.0.3.2): the word that makes the neighbour a client of core, the reflector, so core passes routes between them.
  4. In dc2's `/etc/frr/frr.conf`, the line for its neighbour core (10.0.3.1): the word that makes dc2 put its own address as the next hop of the routes it passes to core, as dc1's file already does on its own line for core (`on dc1 cat /etc/frr/frr.conf`).

  Edit the files with `on core nano /etc/frr/frr.conf` and `on dc2 nano /etc/frr/frr.conf`, replace each `___` (and nothing else), save, then `sudo systemctl restart frr@core frr@dc2`: FRR reads its file only when it starts, as at every boot. access keeps core as its only BGP neighbour. If something doesn't behave, `on core vtysh -c 'show bgp summary'` shows how many prefixes core sends each neighbour (`PfxSnt`), and `on access vtysh -c 'show bgp ipv4 unicast 10.100.0.0/16'` whether access can use the route it got. Then run the checks; the last one unplugs dc1's circuit to watch the office's traffic move to dc2, and plugs it back in.
hints:
  - "Gaps 1 to 3 are the same word, the one the lesson uses for a router a reflector serves: `neighbor ADDRESS route-...`."
  - "Gap 4 is the word on dc1's line `neighbor 10.0.2.1 ...` in dc1's file. Without it, dc2's routes from the cloud keep the cloud's own address on dx2, 169.254.20.2, as their next hop, and nothing inside the data centre has a route to that address."
  - "If the office reaches the cloud but the last check fails, look at access's path while dc1's circuit is down: `sudo netlab link dc1 dx1 down`, then `on access vtysh -c 'show bgp ipv4 unicast 10.100.0.0/16'` and `on core vtysh -c 'show bgp ipv4 unicast 10.100.0.0/16'` (an `inaccessible` next hop is one core can't reach), then `sudo netlab link dc1 dx1 up`."
skills: [route-reflection]
