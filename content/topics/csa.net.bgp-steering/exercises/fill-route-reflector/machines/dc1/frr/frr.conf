frr version 8.4.4
frr defaults traditional
hostname dc1
log syslog informational
service integrated-vtysh-config
!
ip route 10.0.0.0/16 10.0.2.1 core
!
router bgp 65001
 bgp router-id 169.254.30.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 10.0.2.1 remote-as 65001
 neighbor 10.0.2.1 description core
 neighbor 10.0.2.1 timers connect 5
 neighbor 169.254.30.2 remote-as 64600
 neighbor 169.254.30.2 description dx1
 neighbor 169.254.30.2 bfd
 neighbor 169.254.30.2 timers connect 5
 !
 address-family ipv4 unicast
  aggregate-address 10.1.0.0/22 summary-only
  neighbor 10.0.2.1 next-hop-self
  neighbor 169.254.30.2 route-map FROM-CLOUD in
  neighbor 169.254.30.2 route-map TO-CLOUD out
 exit-address-family
exit
!
ip prefix-list DC seq 5 permit 10.1.0.0/22
ip prefix-list CLOUD seq 5 permit 10.100.0.0/16
!
route-map FROM-CLOUD permit 10
 match ip address prefix-list CLOUD
 set local-preference 200
exit
!
route-map TO-CLOUD permit 10
 match ip address prefix-list DC
exit
!
