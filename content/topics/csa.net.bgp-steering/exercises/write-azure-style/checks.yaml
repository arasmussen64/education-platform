# The checks of "dx1 first, the ExpressRoute way": edge's two sessions,
# which circuit each side sends its traffic over (BGP's choice and why, and
# the kernel's route, which shares the traffic over both circuits when two
# paths tie), what edge announced and the cloud accepted, eBGP's policy
# rule, whether the work is saved, the cloud's router as it was, and last,
# the backup proved by unplugging dx1 and plugging it back in. sessions-up
# waits for BGP after a boot; the rest read at once.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: sessions-up
    description: "edge has BGP sessions up with the cloud over both circuits, dx1 (169.254.30.2) and dx2 (169.254.20.2)."
    # Each session must be Established for 3 seconds, long enough for the
    # first exchange of routes to finish. Up to 40 tries a second apart, so it
    # gets a minute and prints its own sentence rather than running out of time.
    timeout: 60
    command: |
      . /usr/local/lib/netlab/checklib.sh
      peer() { frr edge 'show bgp summary json' | json "(lambda p: '%s %s' % (p.get('state'), p.get('peerUptimeMsec', 0) >= 3000))(d.get('ipv4Unicast', {}).get('peers', {}).get('$1', {}))"; }
      both() { [ "$(peer 169.254.30.2)" = "Established True" ] && [ "$(peer 169.254.20.2)" = "Established True" ]; }
      wait_for 40 both && { echo up; exit 0; }
      for want in "169.254.30.2 dx1" "169.254.20.2 dx2"; do
        set -- $want
        got=$(peer "$1")
        case $got in
          "Established "*) ;;
          *) echo "edge has no BGP session up with the cloud over $2 ($1): FRR says ${got%% *}"; exit 0 ;;
        esac
      done
      echo up
    expect:
      equals: up
  - id: out-on-dx1
    description: "edge sends the office's traffic to the cloud over dx1 alone, chosen by local preference, and the office reaches the cloud's app."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      best=$(bgp-best edge 10.100.0.0/16)
      case $best in
        "via 169.254.30.2, "*"chosen by Local Pref") ;;
        *) echo "edge's chosen path to the cloud, 10.100.0.0/16, isn't dx1 by local preference: $best"; exit 0 ;;
      esac
      hops=$(ip -n edge route show 10.100.0.0/16 | grep -o 'via [0-9.]*' | sort | tr '\n' ' ')
      [ "$hops" = "via 169.254.30.2 " ] || { echo "edge's kernel sends traffic for 10.100.0.0/16 $hops, not over dx1 alone"; exit 0; }
      [ "$(on office nc -w 2 10.100.0.10 8080 < /dev/null 2> /dev/null)" = 10.1.0.10 ] || { echo "the office doesn't reach the cloud's app, 10.100.0.10"; exit 0; }
      echo dx1
    expect:
      equals: dx1
  - id: in-on-dx1
    description: "The cloud sends its traffic for the office over dx1 alone, chosen by the length of the AS path."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      best=$(bgp-best cloud 10.1.0.0/24)
      case $best in
        "via 169.254.30.1, "*"chosen by AS Path") ;;
        *) echo "the cloud's chosen path to the office, 10.1.0.0/24, isn't dx1 by AS path length: $best"; exit 0 ;;
      esac
      hops=$(ip -n cloud route show 10.1.0.0/24 | grep -o 'via [0-9.]*' | sort | tr '\n' ' ')
      [ "$hops" = "via 169.254.30.1 " ] || { echo "the cloud's kernel sends traffic for 10.1.0.0/24 $hops, not over dx1 alone"; exit 0; }
      echo dx1
    expect:
      equals: dx1
  - id: announced-exactly
    description: "Over each circuit edge announces exactly one route, the office's 10.1.0.0/24, and the cloud accepts it."
    # Both ends: what edge sends, and what the cloud kept. The cloud drops a
    # route whose AS path already holds its own AS, so the cloud's own
    # network sent back to it (a route map with no match line) shows only in
    # what edge sends.
    command: |
      . /usr/local/lib/netlab/checklib.sh
      for want in "169.254.30.2 169.254.30.1 dx1" "169.254.20.2 169.254.20.1 dx2"; do
        set -- $want
        sent=$(frr edge "show bgp ipv4 unicast neighbors $1 advertised-routes json" | json "sorted(d.get('advertisedRoutes', {}))")
        [ "$sent" = '["10.1.0.0/24"]' ] || { echo "over $3 edge announces $sent, not just the office's 10.1.0.0/24"; exit 0; }
        got=$(frr cloud "show bgp ipv4 unicast neighbors $2 routes json" | json "sorted(d.get('routes', {}))")
        [ "$got" = '["10.1.0.0/24"]' ] || { echo "over $3 the cloud accepted $got from edge, not just the office's 10.1.0.0/24"; exit 0; }
      done
      echo exactly
    expect:
      equals: exactly
  - id: policy-kept
    description: "edge's eBGP sessions still require a policy before they accept or send anything."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      frr edge 'show running-config' | grep 'no bgp ebgp-requires-policy' > /dev/null && { echo "edge's eBGP sessions no longer require a policy"; exit 0; }
      echo kept
    expect:
      equals: kept
  - id: saved
    description: "edge's running FRR configuration is the one in its /etc/frr/frr.conf, so a restart gives the same routing."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      differs=$(frr_saved edge) || { echo "edge's running configuration isn't its file: $(echo "$differs" | grep '^[<>]' | head -n 2 | tr '\n' ' ')"; exit 0; }
      echo saved
    expect:
      equals: saved
  - id: cloud-untouched
    description: "The cloud's router is as it was: its file, and the routing it runs."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      sealed=$(intact) || { echo "$sealed"; exit 0; }
      frr_saved cloud > /dev/null || { echo "the cloud's routing was changed live"; exit 0; }
      echo untouched
    expect:
      equals: untouched
  - id: fails-over
    description: "With dx1 unplugged, both directions move to dx2 within a few seconds by themselves; once it is plugged in again, they go back to dx1."
    # It unplugs dx1 itself (netlab link) and plugs it back in, even if it is
    # stopped part way: the trap runs on the way out. A session comes back a
    # few seconds after its cable does (both sides try again every 5).
    timeout: 90
    command: |
      . /usr/local/lib/netlab/checklib.sh
      trap 'netlab link edge dx1 restore > /dev/null 2>&1' EXIT
      hops() { ip -n "$1" route show "$2" 2> /dev/null | grep -o 'via [0-9.]*' | sort | tr '\n' ' '; }
      app() { [ "$(on office nc -w 1 10.100.0.10 8080 < /dev/null 2> /dev/null)" = 10.1.0.10 ]; }
      on_dx2() { [ "$(hops edge 10.100.0.0/16)" = "via 169.254.20.2 " ] && [ "$(hops cloud 10.1.0.0/24)" = "via 169.254.20.1 " ] && app; }
      on_dx1() { [ "$(hops edge 10.100.0.0/16)" = "via 169.254.30.2 " ] && [ "$(hops cloud 10.1.0.0/24)" = "via 169.254.30.1 " ] && app; }
      on_dx1 || { echo "before the test, traffic isn't on dx1 both ways"; exit 0; }
      netlab link edge dx1 down
      wait_for 8 on_dx2 || { echo "with dx1 unplugged, traffic doesn't use dx2 both ways (edge: $(hops edge 10.100.0.0/16); the cloud: $(hops cloud 10.1.0.0/24))"; exit 0; }
      netlab link edge dx1 restore
      wait_for 25 on_dx1 || { echo "with dx1 plugged back in, traffic doesn't go back to it both ways"; exit 0; }
      echo "fails over and back"
    expect:
      equals: "fails over and back"
