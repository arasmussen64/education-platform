frr version 8.4.4
frr defaults traditional
hostname access
log syslog informational
service integrated-vtysh-config
!
ip route 10.0.0.0/16 10.0.1.1 core
!
router bgp 65001
 bgp router-id 10.0.1.2
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 description core
 neighbor 10.0.1.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  network 10.1.1.0/24
  network 10.1.2.0/24
  network 10.1.3.0/24
 exit-address-family
exit
!
