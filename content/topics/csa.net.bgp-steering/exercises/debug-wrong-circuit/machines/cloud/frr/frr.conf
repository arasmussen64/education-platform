frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
router bgp 64600
 bgp router-id 10.100.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.20.1 remote-as 65001
 neighbor 169.254.20.1 description dx2, the secondary link
 neighbor 169.254.20.1 bfd
 neighbor 169.254.20.1 timers connect 5
 neighbor 169.254.30.1 remote-as 65001
 neighbor 169.254.30.1 description dx1, the primary link
 neighbor 169.254.30.1 bfd
 neighbor 169.254.30.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.100.0.0/16
  neighbor 169.254.20.1 maximum-prefix 10 restart 1
  neighbor 169.254.20.1 route-map FROM-CUSTOMER in
  neighbor 169.254.20.1 route-map TO-CUSTOMER out
  neighbor 169.254.30.1 maximum-prefix 10 restart 1
  neighbor 169.254.30.1 route-map FROM-CUSTOMER in
  neighbor 169.254.30.1 route-map TO-CUSTOMER out
 exit-address-family
exit
!
route-map FROM-CUSTOMER permit 10
 set metric 0
exit
!
route-map TO-CUSTOMER permit 10
exit
!
