frr version 8.4.4
frr defaults traditional
hostname edge
log syslog informational
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 10.1.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.20.2 remote-as 64512
 neighbor 169.254.20.2 description dx2
 neighbor 169.254.20.2 timers connect 5
 neighbor 169.254.30.2 remote-as 64512
 neighbor 169.254.30.2 description dx1
 neighbor 169.254.30.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  neighbor 169.254.20.2 route-map FROM-CLOUD in
  neighbor 169.254.20.2 route-map TO-CLOUD out
  neighbor 169.254.30.2 route-map FROM-CLOUD in
  neighbor 169.254.30.2 route-map TO-CLOUD out
 exit-address-family
exit
!
ip prefix-list OURS seq 5 permit 10.1.0.0/24
ip prefix-list CLOUD seq 5 permit 10.100.0.0/16
!
route-map FROM-CLOUD permit 10
 match ip address prefix-list CLOUD
exit
!
route-map TO-CLOUD permit 10
 match ip address prefix-list OURS
exit
!
