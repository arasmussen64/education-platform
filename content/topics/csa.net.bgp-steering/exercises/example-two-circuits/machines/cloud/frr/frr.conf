frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
router bgp 64512
 bgp router-id 10.100.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.20.1 remote-as 65001
 neighbor 169.254.20.1 description dx2, in the associated Region
 neighbor 169.254.20.1 bfd
 neighbor 169.254.20.1 timers connect 5
 neighbor 169.254.30.1 remote-as 65001
 neighbor 169.254.30.1 description dx1, outside the associated Region
 neighbor 169.254.30.1 bfd
 neighbor 169.254.30.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.100.0.0/16
  neighbor 169.254.20.1 route-map FROM-DX2 in
  neighbor 169.254.20.1 route-map TO-CUSTOMER out
  neighbor 169.254.30.1 route-map FROM-DX1 in
  neighbor 169.254.30.1 route-map TO-CUSTOMER out
 exit-address-family
exit
!
bgp community-list standard HIGH seq 5 permit 7224:7300
bgp community-list standard LOW seq 5 permit 7224:7100
bgp community-list standard MEDIUM seq 5 permit 7224:7200
!
route-map FROM-DX1 permit 10
 match community LOW
 set local-preference 100
exit
!
route-map FROM-DX1 permit 20
 match community MEDIUM
 set local-preference 200
exit
!
route-map FROM-DX1 permit 30
 match community HIGH
 set local-preference 300
exit
!
route-map FROM-DX1 permit 40
 set local-preference 150
exit
!
route-map FROM-DX2 permit 10
 match community LOW
 set local-preference 100
exit
!
route-map FROM-DX2 permit 20
 match community MEDIUM
 set local-preference 200
exit
!
route-map FROM-DX2 permit 30
 match community HIGH
 set local-preference 300
exit
!
route-map FROM-DX2 permit 40
 set local-preference 200
exit
!
route-map TO-CUSTOMER permit 10
exit
!
