id: example-two-circuits
stage: worked_example
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "Two circuits to one cloud"
prompt: |
  The network labs work as in Layers and packets; if you haven't done one yet, read the note at the top of its first lab, `example-follow-a-request`, before you start.

  **This lab.** A company's router, `edge` (AS 65001), has the office's network, 10.1.0.0/24 (the office laptop, `office`, is 10.1.0.10), and two private circuits to one cloud: `dx1`, with the cloud's router at 169.254.30.2, and `dx2`, at 169.254.20.2. Each is a cable with a BGP session over it, standing in for an AWS Direct Connect connection. The cloud's router, `cloud` (AS 64512), holds the cloud's network, 10.100.0.0/16, where `app` (10.100.0.10) answers on TCP port 8080 with the address that reached it (`on office nc -w 2 10.100.0.10 8080`). edge's two sessions are configured and saved, with filters: it accepts only the cloud's 10.100.0.0/16 and announces only the office's 10.1.0.0/24. The cloud's router isn't yours; read it with `looking-glass cloud 'show ...'`. dx2's addresses are the lower ones, so when two paths are equal in everything else, FRR's last tie-break picks dx2.

  The cloud's router is modelled on AWS Direct Connect's documented behaviour for private virtual interfaces ("Direct Connect routing policies and BGP communities", read 2026-11-12): AWS compares the longest prefix first, then local preference, which you can set with the communities `7224:7100` (low), `7224:7200` (medium) and `7224:7300` (high), "evaluated before any AS_PATH attribute"; with no community, a location in the associated Region gets medium preference and others "a lower value"; then AS path length; then MED. Here dx2 is in the associated Region (local preference 200) and dx1 isn't (the lab uses 150 for "a lower value"; AWS doesn't say how much lower). Like AWS, the cloud's side runs BFD on both sessions. BGP's timers are the labs' fast ones, a keepalive every 3 seconds and a hold time of 9, where AWS's side defaults to 30 and 90.

  The walkthrough makes dx1 the circuit for both directions: your own traffic with local preference, then the cloud's, trying MED, prepending and a community in turn; then it fails dx1 loudly and silently, adds BFD, fails it silently again, and saves. Several steps type into edge's console: everything between `on edge vtysh << 'EOF'` and `EOF` is what you would type at the `edge#` prompt after `on edge vtysh`, and pasting the block into the lab's shell does the same. The `sleep` lines give BGP a few seconds; a route map changed while in use takes about 5 seconds to apply. The `for` lines wait until traffic is back on dx1; typing by hand, run `on edge ip route show 10.100.0.0/16` until it shows `dev dx1`. The `ping` lines run in the background (`&`) while the next line cuts the link, and `wait` waits for the ping to finish: each lost ping is 0.2 seconds of lost traffic. Read what each line prints before you type the next.
steps:
  - label: "Who wins now"
    lines: "1-3"
    note: "edge has two paths to the cloud's 10.100.0.0/16, equal in everything: local preference (100, the default), AS path (`64512`), MED. FRR marks one `best (Neighbor IP)`, the lowest neighbour address, and both `multipath`: equal paths are installed side by side, so the kernel's route has two next hops and shares the traffic, connection by connection (ECMP, from Routing). That is what AWS documents too: equal paths over several virtual interfaces share the traffic. The cloud's choice for the office is not a tie: dx2 has local preference 200, dx1 150, both set by the cloud's own policy, and `best (Local Pref)` sends everything back over dx2."
  - label: "Your way out: dx1 first"
    lines: "4-17"
    note: "Outbound traffic is edge's decision, so local preference does it, as in BGP sessions and policy: a new route map for routes learned over dx1, `FROM-DX1`, accepts the same prefix list as before and sets local preference 300. dx1's path is now `best (Local Pref)` and the kernel's route has one next hop, `via 169.254.30.2 dev dx1`. Nothing has changed about how the cloud reaches the office: local preference never leaves your AS."
  - label: "The way in, try 1: MED"
    lines: "18-35"
    note: "The way in is the cloud's decision. All edge can change is what it announces, through route maps on the way out: `TO-DX1` and `TO-DX2` let out the same prefix list as `TO-CLOUD`, with a **MED** (multi-exit discriminator) of 50 over dx1 and 100 over dx2: \"of my two links to you, prefer the lower\". The cloud shows `metric 50` and `metric 100` and doesn't move: dx2 is still `best (Local Pref)`, because local preference is compared long before MED. AWS's page calls MED a low-priority attribute and doesn't recommend it."
  - label: "The way in, try 2: prepending"
    lines: "36-48"
    note: "**AS-path prepending** adds your own AS number to a path again (`set as-path prepend 65001 65001`), so dx2's path reads `65001 65001 65001`, three networks long against dx1's one. A longer path loses, but only once the attributes before it are equal, and local preference comes first: dx2 still wins on 200 against 150. The cloud's own policy, read through its looking glass, shows why: four entries, three that turn the documented communities into 100, 200 and 300, and a last one for routes with none (150 here; dx2's route map has 200). Prepending works against a provider that compares AS paths with nothing before them, as the next lab's cloud does."
  - label: "The way in, try 3: the documented community"
    lines: "49-61"
    note: "A **community** is a label on a route, written `ASN:VALUE`, that means only what the network that defined it says it means. AWS defined `7224:7300` as \"high preference\" (7224 is AWS's own public AS number, whatever private AS number its side of the session uses). `set community 7224:7300` on dx1 and `7224:7100` on dx2, as AWS recommends for a primary and a backup, and the prepend is taken out. The cloud shows `Community: 7224:7300`, local preference 300 on dx1 against 100 on dx2, and `best (Local Pref)` over dx1; its routing table says `via dx1`. Both directions now use dx1."
  - label: "A loud failure"
    lines: "62-66"
    note: "`netlab link edge dx1 down` unplugs the cable, and both routers notice at once: the session drops, its routes go, and dx2's take over. One ping is lost (`24 received`, the `+1 errors` is the one the kernel couldn't send while the route changed), and the kernel's route says `dev dx2`. `up` plugs it back in; within a few seconds the session returns and dx1 is preferred again."
  - label: "A silent failure"
    lines: "67-71"
    note: "`silent` leaves the cable up but makes whatever edge sends over it vanish at the cloud, like a fault in a provider's equipment: nothing changes on either router's interfaces. About 53 of the 75 pings are lost, over 10 seconds: BGP notices only when no keepalive has arrived for its hold time, 9 seconds here. `Last reset ... (Hold Timer Expired)` says how the session ended. With AWS's default hold time, 90 seconds, that would be a minute and a half of lost traffic; with Microsoft's 180, three minutes."
  - label: "BFD"
    lines: "72-85"
    note: "**BFD** (bidirectional forwarding detection) is a tiny protocol that only asks \"are you still there?\": each side sends a packet every few hundred milliseconds, and declares the path down after a number of them in a row go missing. The cloud's side already runs it (`down`, since edge didn't answer). `neighbor ... bfd` on each session starts it on edge with FRR's defaults, shown in `show bfd peers`: a packet every 300 ms, down after 3 missed, so a silent failure is noticed after 300 × 3 = 900 ms, and BGP drops the session when BFD says so. The silent cut again loses about 5 pings: one second instead of ten."
  - label: "Save"
    lines: "86-87"
    note: "`write memory` saves the running configuration to `/etc/frr/frr.conf`, which edge loads at every boot: the new route maps, the `bfd` lines and the communities. The checks compare edge's running configuration with that file, and the cloud's with its own."
skills: [inbound-steering, failure-detection, cloud-circuits]
