frr version 8.4.4
frr defaults traditional
hostname depot
log syslog informational
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.2.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.50.2 remote-as 64900
 neighbor 169.254.50.2 description ic1
 neighbor 169.254.50.2 timers connect 5
 neighbor 169.254.70.2 remote-as 64900
 neighbor 169.254.70.2 description ic2
 neighbor 169.254.70.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
  neighbor 169.254.50.2 route-map FROM-CLOUD in
  neighbor 169.254.50.2 route-map TO-CLOUD out
  neighbor 169.254.70.2 route-map FROM-CLOUD in
  neighbor 169.254.70.2 route-map TO-CLOUD out
 exit-address-family
exit
!
ip prefix-list OURS seq 5 permit 10.2.0.0/24
ip prefix-list CLOUD seq 5 permit 10.60.0.0/16
!
route-map FROM-CLOUD permit 10
 match ip address prefix-list CLOUD
exit
!
route-map TO-CLOUD permit 10
 match ip address prefix-list OURS
exit
!
