frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
router bgp 64900
 bgp router-id 10.60.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.50.1 remote-as 65002
 neighbor 169.254.50.1 description ic1, base advertised priority 200
 neighbor 169.254.50.1 timers connect 5
 neighbor 169.254.70.1 remote-as 65002
 neighbor 169.254.70.1 description ic2, base advertised priority 100
 neighbor 169.254.70.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.60.0.0/16
  neighbor 169.254.50.1 route-map FROM-ON-PREMISES in
  neighbor 169.254.50.1 route-map BASE-PRIORITY-200 out
  neighbor 169.254.70.1 route-map FROM-ON-PREMISES in
  neighbor 169.254.70.1 route-map BASE-PRIORITY-100 out
 exit-address-family
exit
!
route-map FROM-ON-PREMISES permit 10
exit
!
route-map BASE-PRIORITY-200 permit 10
 set metric 200
exit
!
route-map BASE-PRIORITY-100 permit 10
 set metric 100
exit
!
