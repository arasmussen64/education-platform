id: write-google-style
stage: write
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "The circuit Google names"
prompt: |
  Another site and a third cloud. The shop's depot has a router of its own, `depot` (AS 65002), with the depot's network, 10.2.0.0/24 (`pc` is 10.2.0.10), and two circuits to the cloud's router (AS 64900): `ic1`, with the cloud at 169.254.50.2, and `ic2`, at 169.254.70.2. On Google Cloud each circuit would be a VLAN attachment of a Cloud Interconnect and the router at the far end a Cloud Router, with a private AS number the company chose. The cloud's app, `app` (10.60.0.10), answers on TCP port 8080 with the address that reached it. depot's two sessions are configured and saved, with filters: it accepts only the cloud's 10.60.0.0/16 (prefix list `CLOUD`, route map `FROM-CLOUD`) and announces only the depot's 10.2.0.0/24 (prefix list `OURS`, route map `TO-CLOUD`); `on depot vtysh -c 'show running-config'` shows them. The cloud's router isn't yours; `looking-glass cloud 'show ...'` reads it.

  The cloud's router is modelled on Cloud Router's documented behaviour (Google's pages on advertised routes, learned routes, the base route priority and on-premises routers, read 2026-11-15). Three rules, in this lesson's words:

  - **What it tells you.** Every BGP session of a Cloud Router has a **base advertised priority**: a number from 0 to 65535, 100 unless someone changes it, which the Cloud Router sends as the MED of each route it announces over that session. As with every MED, the lower number is the way it would like you to come in. The company's cloud team has set one session's to 100 and the other's to 200: that is how they have said which circuit is the primary.
  - **How it chooses among your routes.** By the shortest AS path, then the route's origin, then the lowest MED; paths equal in all of them share the traffic. So this cloud, unlike the walkthrough's and the ExpressRoute lab's, does what the MED you send asks. AS-path length isn't the tool to lean on here: in its default mode a Cloud Router compares AS paths only among the sessions one of its BGP tasks holds (the programs that run its sessions), not across all of them, and Google's page says not to rely on it. This lab's cloud is one FRR router, which always compares them, so a prepend would move it; the lab asks for MED, which works either way.
  - **One active circuit, one backup.** Google's guide for on-premises routers gives the rule: the higher MED goes on the backup on both sides, the Cloud Router's and yours, so that the two directions agree and no conversation goes out one circuit and back the other.

  Like a Cloud Router left at its defaults, this one doesn't run BFD. BGP's timers are the labs' fast ones (a keepalive every 3 seconds and a hold time of 9; Google's guide recommends 20 and 60).

  In depot's console (`on depot vtysh`), make the circuit the cloud team chose the primary in both directions, and the other the backup:

  1. find out which circuit the cloud's priorities name: `on depot vtysh -c 'show bgp ipv4 unicast 10.60.0.0/16'` shows the `metric` (the MED) each session's route arrived with, the path depot chose, and why;
  2. depot sends the depot's traffic to the cloud over that circuit alone (it may do so already: make sure nothing on depot overrides it);
  3. the cloud sends its traffic for the depot over the same circuit alone, chosen by the MED depot sends, and with the depot's 10.2.0.0/24 still the only prefix depot announces over each circuit;
  4. when the primary is down, both directions use the other circuit by themselves, and the primary again when it comes back;
  5. eBGP's policy requirement stays on, and the cloud's router is left as it is;
  6. saved, so a restart keeps it.

  Then run the checks; the last one unplugs the primary to watch both directions move to the backup, and plugs it back in.
hints:
  - "MED is lower-is-better, the opposite of local preference: the session whose route arrives with `metric 100` is the one the cloud team made the primary, whatever the circuits are called."
  - "For the cloud's traffic: an outbound route map for each session that lets out only `OURS` (`match ip address prefix-list OURS`) and sets a MED with `set metric NUMBER`, the higher number on the backup. The Cloud Router's own two numbers are a good choice: both sides then read alike."
  - "Define each route map before you name it on a session, so it takes effect at once. `looking-glass cloud 'show bgp ipv4 unicast 10.2.0.0/24'` shows the metric the cloud received over each circuit and why it chose one; `looking-glass cloud 'show ip route 10.2.0.0/24'` shows whether it still shares its traffic over both."
skills: [inbound-steering, cloud-circuits]
