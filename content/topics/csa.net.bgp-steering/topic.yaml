skills:
  - id: inbound-steering
    description: "Make another network choose your preferred way in: a more specific prefix (longest match beats every attribute), AS-path prepending (a longer path loses, once everything before it is equal), MED (lower preferred, compared only between paths from one AS), and the communities a neighbour documents (AWS's 7224:7100, 7200 and 7300 become its local preference, compared before AS path); why the far side's local preference beats your prepending; NO_EXPORT and NO_ADVERTISE"
  - id: route-reflection
    description: "The iBGP rule (a route learned from one iBGP neighbour isn't passed to another) and why it exists; a full mesh needs n(n-1)/2 sessions; a route reflector passes routes between its clients and to everyone else, marking originator and cluster list; two reflectors for redundancy; next-hop-self at the border, so the routers inside can reach the next hop"
  - id: failure-detection
    description: "How fast each kind of failure is noticed: a lost carrier at once; a silent failure when the hold time runs out (FRR 180 s, AWS 90 s, Microsoft 180 s, the labs 9 s); BFD in interval times multiplier (300 ms x 3 on AWS and Microsoft, 1,000 ms x 5 by default on Google, which leaves it off); setting BFD up in FRR and reading show bfd peers; graceful restart named, and not with BFD on AWS"
  - id: cloud-circuits
    description: "BGP over Direct Connect, ExpressRoute and Cloud Interconnect: whose AS number is on each side, two sessions for redundancy, the prefix limits and what exceeding them does (AWS private virtual interface 100, idle; Azure private peering 4,000, dropped), summarising to stay under them, how to make a circuit primary in each direction on each cloud, a VPN as the last backup, and what each cloud's documentation says it ignores"
