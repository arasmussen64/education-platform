id: csa.net.bgp-steering
kind: topic
status: ready
title: Steering traffic and cloud circuits
summary: "Making another network choose your way in, with a more specific prefix, AS-path prepending, MED and the communities a provider documents; why routers inside one AS don't pass each other's BGP routes on, and what a route reflector does about it; noticing a failed link fast with BFD; and making one circuit primary in both directions on Direct Connect, ExpressRoute and Cloud Interconnect, with a second circuit and a VPN as backups."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 36) and its designer's brief (csa.net.bgp-steering.md, with
# frr-labs-common.md). The second half of the spec's old BGP topic; the
# first is csa.net.bgp, which this builds on: sessions, network, prefix
# lists, route maps, show bgp, the decision order, local preference, MED
# named, maximum-prefix, looking-glass and RFC 8212. Through it, routing's
# longest-prefix match, ECMP, the silent failure and floating statics, and
# CIDR's summaries (eight /24s make one /21); and the network labs'
# machines, on, netlab link and services as name@machine from
# csa.net.layers. This topic defines AS-path prepending, communities,
# route reflector and BFD for the module (the plan's section 3.7), and
# inbound and outbound traffic engineering, aggregation, the iBGP rule,
# next-hop-self, graceful restart (named) and the clouds' circuit words.
prerequisites: [csa.net.bgp]
# Worked out: the lesson about 22 minutes (2,900 words at 130 a minute),
# reading 46 (AWS's routing page 12, the two NSRC traffic-engineering
# videos 9, Microsoft's three pages' named parts 11, Google's advertised
# routes 6, the NSRC route-reflector video 7, AWS's BGP settings 1), 18
# recall items at 1.5 each 27, then the worked example 35 (nine steps,
# three failures timed), the fill-in 20, the write 25, the build 60, the
# debug 45 and the explain 20: 300. The plan gives 295, which is kept.
estimated_minutes: 295
rev: 1
objectives:
  - "Make another network choose your preferred way in, with a more specific prefix, AS-path prepending, MED (between links to one neighbour) and the communities a provider documents, and say which of them AWS, Azure and Google Cloud honour and in what order."
  - "Explain why routers inside one AS don't pass each other's BGP routes on, what a route reflector and its clients do about it, and the next-hop trap that comes with it; work out how many sessions a full mesh and a pair of reflectors need."
  - "Work out how long a failed link takes to notice: carrier loss at once, a silent failure only when the hold time runs out, and BFD's interval times its multiplier; set BFD up and prove it with a silent failure."
  - "Design and build two circuits to a cloud with one primary in both directions, a second circuit and a VPN as backups, summarised to stay within the provider's prefix limit, on Direct Connect's, ExpressRoute's and Cloud Interconnect's documented rules."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - AWS Direct Connect, private and transit virtual interfaces: "AWS
#   evaluates the longest prefix length first"; local preference communities
#   7224:7100 (low), 7224:7200 (medium), 7224:7300 (high), "evaluated before
#   any AS_PATH attribute"; without a community, Direct Connect locations
#   associated with the same Region get medium and others "a lower value";
#   then AS_PATH length; then MED, "AWS does not recommend using MED values
#   given their lower priority in evaluation"; ECMP across virtual
#   interfaces with the same AS_PATH length and attributes; active/passive
#   with 7224:7300 on the primary and 7224:7100 on the passive; a route whose
#   AS_PATH holds 7224 twice is a loop. Public virtual interfaces: AWS's ASN
#   7224; a private ASN is replaced by 7224 and "any prepending you do will
#   be stripped"; NO_EXPORT on every route AWS advertises; scope communities
#   7224:9100, 9200 and 9300; AWS's own routes tagged 7224:8100 (the
#   associated Region) and 7224:8200 (its continent):
#   https://docs.aws.amazon.com/directconnect/latest/UserGuide/routing-and-bgp.html
# - Direct Connect quotas: routes per BGP session on a private or transit
#   virtual interface, "Default of 100 each for IPv4 and IPv6", up to 1,000
#   with prefix controls; above that "the BGP session will go into an idle
#   state"; 1,000 on a public virtual interface:
#   https://docs.aws.amazon.com/directconnect/latest/UserGuide/limits.html
# - Direct Connect BGP settings: default hold timer 90 s (minimum 3),
#   keepalive 30 s; BFD minimum interval 300 ms, minimum multiplier 3;
#   graceful restart 120 s, "We recommend that you do not configure graceful
#   restart and BFD at the same time"; BGP TTL 1, no multihop:
#   https://docs.aws.amazon.com/directconnect/latest/UserGuide/bgp-specific-settings.html
#   Asynchronous BFD is on by default on AWS's side of every virtual
#   interface, and takes effect once your router runs it (AWS's knowledge
#   centre, "How do I enable BFD for my Direct Connect connection?"):
#   https://repost.aws/knowledge-center/enable-bfd-direct-connect
# - Azure ExpressRoute (ms.date 2026-08-27): Microsoft uses AS 12076
#   (65515 to 65520 reserved); two /30s, the first address of each yours;
#   "You must set up both BGP sessions for the availability SLA to be
#   valid"; up to 4,000 IPv4 prefixes on private peering (10,000 with
#   Premium), 100 IPv6, 200 per session on Microsoft peering; "The BGP
#   session drops if the number of prefixes exceeds the limit"; "Microsoft
#   doesn't honor any community values tagged to routes advertised to
#   Microsoft"; regional communities such as East US 12076:50004:
#   https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
# - ExpressRoute optimise routing (ms.date 2025-01-31): "Advertise your
#   on-premises prefixes on the appropriate ExpressRoute circuits or use AS
#   PATH prepending"; local preference on your side, "The default local
#   preference is typically 100"; "The connection weight is considered
#   before the AS Path length". Neither page names MED as a tool, so the
#   labs' Azure-style cloud sets every MED it receives to 0:
#   https://learn.microsoft.com/en-us/azure/expressroute/expressroute-optimize-routing
# - ExpressRoute BFD (ms.date 2026-03-12): on the MSEEs "BGP keep-alive and
#   hold-time are typically configured as 60 and 180 seconds", so a failure
#   "can take up to three minutes" to detect; BFD configured by default on
#   new peerings; MSEE intervals 300 ms, "In certain scenarios, the interval
#   may be set at a higher value of 750 milliseconds"; the example "bfd
#   interval 300 min_rx 300 multiplier 3":
#   https://learn.microsoft.com/en-us/azure/expressroute/expressroute-bfd
# - Google Cloud Router: "you define a base advertised priority that is used
#   as a value for the BGP MED attribute", default base priority 100, other
#   regions' subnets the base plus an inter-region cost, and "The route
#   selection process in the on-premises network might not prioritize the
#   lower-MED route":
#   https://docs.cloud.google.com/network-connectivity/docs/router/concepts/advertised-routes ;
#   learned routes: lowest MED preferred; in legacy best path selection (the
#   default) "the dynamic route control plane doesn't use the AS path
#   information", in standard mode it does; prefixes beyond the quota are
#   dropped: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/learned-routes ;
#   BFD "disabled on Cloud Router BGP sessions" by default, 1000 ms
#   intervals (1000 to 30000) and multiplier 5 (5 to 16), "Detection time =
#   Agreed transmit interval * BFD multiplier", 5 seconds at the defaults:
#   https://docs.cloud.google.com/network-connectivity/docs/router/concepts/bfd ;
#   Partner Interconnect's 99.99% "requires at least four VLAN attachments
#   across two metros" and two Cloud Routers:
#   https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-overview ;
#   Cloud Router's ASN 16550 with Partner Interconnect (as csa.net.bgp read
#   it, 2026-11-12): https://docs.cloud.google.com/network-connectivity/docs/router/how-to/create-router-vpc-network
# - RFC 4456 (April 2006): without reflection "all BGP speakers within a
#   single AS must be fully meshed"; a route from a non-client is reflected
#   to the clients, a route from a client to the non-clients and the other
#   clients; ORIGINATOR_ID and CLUSTER_LIST stop loops; the reflector
#   "SHOULD NOT modify ... NEXT_HOP, AS_PATH, LOCAL_PREF, and MED":
#   https://www.rfc-editor.org/rfc/rfc4456
# - RFC 1997 (August 1996): a community is 32 bits, by convention the AS
#   number then a value; NO_EXPORT 0xFFFFFF01, NO_ADVERTISE 0xFFFFFF02:
#   https://www.rfc-editor.org/rfc/rfc1997
# - FRR 8.4: BFD's defaults detect-multiplier 3, receive-interval and
#   transmit-interval 300 ms, "neighbor PEER bfd" and "bfd profile"
#   (https://docs.frrouting.org/en/stable-8.4/bfd.html);
#   route-reflector-client, aggregate-address ... summary-only ("Longer
#   prefixes advertisements of more specific routes to all neighbors are
#   suppressed"), set community, set as-path prepend, next-hop-self ("if it
#   is learned via eBGP"), maximum-prefix
#   (https://docs.frrouting.org/en/stable-8.4/bgp.html).
# Every output marked "captured" in the lesson, the labs and the recall items
# is real output of this topic's labs (FRR 8.4.4 on Ubuntu 24.04, on the
# network-lab base, Docker Desktop 29.8.2), captured on 2026-11-12: two
# equal paths installed as two next hops; MED, then a prepend, failing to
# move the AWS-style cloud and a community moving it; 53 of 75 pings lost
# and "Hold Timer Expired" in a silent failure without BFD, 5 of 25 with it;
# show bfd peers; core's summary sending nothing before it reflected, and
# "Originator" and "Cluster list" after; an "inaccessible" next hop; and
# "Idle (PfxCt)" with "will restart in 56 seconds". Times and uptimes will
# differ in a new run.
#
# Linked or embedded, never copied. Licences, each read on 2026-11-12: AWS's
