prove:
  build: build-primary-and-backup
  debug: debug-wrong-circuit
  explain:
    prompt: |
      Your company is connecting its data centre to one cloud with two dedicated circuits and a VPN, and to keep the network simple it has four routers that run BGP. Explain, in your own words: how you'd make one circuit carry the traffic in both directions and the other take over, and why the two directions need different tools; how this differs between two of AWS, Azure and Google Cloud; why the routers inside your company can't simply pass each other the cloud's routes, and what you'd do about it; how quickly a failed circuit would be noticed, with and without BFD, with numbers; and what happens if you announce more prefixes than the provider accepts.
    rubric:
      - id: two-directions
        required: true
        description: "Outbound is your own decision: local preference on the routes learned over the primary, higher than over the backup and the VPN. Inbound is the provider's decision, which you can only influence through what you announce: a more specific prefix first (longest match beats every attribute), then whatever the provider honours (its documented communities, AS-path prepending on the backup, MED toward one neighbour)."
      - id: clouds-differ
        required: true
        description: "Two clouds correctly: AWS turns its communities 7224:7100, 7224:7200 and 7224:7300 into local preference, compared before AS path, and its own preference for a location in the associated Region defeats prepending alone; Azure honours no community you send, so you prepend on the backup or announce more specific prefixes on the primary (and connection weight sets the virtual networks' choice); Google tells you its preference as MED (the advertised route priority, base 100), and its own choice among your routes uses MED and, in standard best-path mode, AS path."
      - id: reflection
        required: true
        description: "A router doesn't pass a route learned over iBGP to another iBGP neighbour, because iBGP has no AS path to catch loops; so either every router peers with every other, a full mesh of n(n-1)/2 sessions, or a route reflector (better two) passes its clients' routes on, marking them with an originator and a cluster list; and the routers inside must be able to reach the next hop, so the border routers set next-hop-self."
      - id: detection
        required: true
        description: "A cut cable is noticed at once; a silent failure only when the hold time runs out (90 seconds by default on AWS's side, 180 on Microsoft's), with traffic lost meanwhile; BFD sends a packet every few hundred milliseconds and declares the path down after a number are missed, so 300 ms x 3 notices it in under a second (Google's BFD is off unless switched on, 1 s x 5 by default)."
      - id: limits
        required: false
        description: "Announcing more prefixes than the provider accepts takes the session down (AWS: 100 by default on a private virtual interface, the session goes idle; Azure: 4,000 on private peering, the session drops), so summarise, for example eight /24s as one /21."
    model_answer: |
      The two directions are decided by two different routers. Which way our traffic leaves is our decision: I'd give the routes learned over the primary circuit a higher local preference than those over the backup, and the VPN's lowest, so our routers send everything over the primary while it's up and fall back by themselves. Which way the cloud's traffic comes back is the cloud's decision, made from what we announce, so the tools are indirect. The strongest is a more specific prefix: if the primary announces our network's two halves as well as the whole, longest-prefix match sends the traffic there whatever else the cloud prefers. After that it depends on what the provider listens to: its documented communities, AS-path prepending on the backup to make that path look longer, or MED, which only works between links to the same neighbour and comes late in the order.

      The clouds differ in exactly that. AWS documents communities: 7224:7300 on the primary and 7224:7100 on the backup become its local preference, which it compares before AS path. Prepending alone can fail on AWS, because with no community it gives a location in the circuit's associated Region medium preference anyway, and local preference beats path length. Azure ignores any community we send, so there I'd prepend on the backup or announce more specific prefixes on the primary. Google tells us its own preference as MED, its advertised route priority, base 100, so our routers should prefer the lower value.

      Inside, the four routers run iBGP. A router never passes a route it learned over iBGP to another iBGP neighbour, because without the AS path changing it couldn't detect a loop. So either every router peers with every other, a full mesh, 6 sessions for 4 routers and 45 for 10, or one router, better two, acts as a route reflector: it passes its clients' routes on, marking them with an originator and a cluster list so they can't loop. The trap is the next hop: a reflected route keeps the circuit router's next hop, the cloud's address on the circuit, which nothing inside can reach, so the circuit routers set next-hop-self.

      A cut cable is noticed at once. A circuit that fails silently, with its link still up, is noticed only when BGP's hold time runs out: 90 seconds by default on AWS, 180 on Microsoft's side, and traffic is lost meanwhile. With BFD at 300 ms and a multiplier of 3, it's noticed in 0.9 seconds and BGP moves at once; Google's BFD is off unless switched on, and 1 second times 5 at its defaults.

      If we announce more prefixes than the provider accepts, 100 on an AWS private virtual interface by default, the session goes down and nothing passes, so we'd summarise: eight /24s become one /21.
