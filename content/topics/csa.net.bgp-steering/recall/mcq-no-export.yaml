id: mcq-no-export
type: mcq
rev: 1
prompt: |
  A company tags the routes it announces to its provider with the well-known community `no-export` (RFC 1997's NO_EXPORT). What does the provider do with those routes?
choices:
  - "Uses them itself, but never passes them on to another AS"
  - "Refuses them, as it does any community it hasn't defined"
  - "Passes them to its own customers, but never to its peers"
  - "Uses them only when no other path to the prefix is left"
answer: 0
explanation: |
  A few communities have a meaning every BGP router knows, defined in RFC 1997 rather than by one network. NO_EXPORT says "don't advertise this outside your AS": the provider routes your traffic with it but tells nobody else. It suits a more specific prefix meant only to steer one provider's traffic, which shouldn't spread across the internet. NO_ADVERTISE is stronger still: pass it to no neighbour at all.

  A community a router doesn't recognise is passed on, not refused. NO_EXPORT draws no line between customers and peers: every other AS is outside. And it says nothing about when a path is used.
skills: [inbound-steering]
