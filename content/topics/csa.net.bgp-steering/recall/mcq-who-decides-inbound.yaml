id: mcq-who-decides-inbound
type: mcq
rev: 1
prompt: |
  A shop has two circuits to a cloud and wants the cloud's traffic for the shop to arrive over circuit 1. Which setting on the shop's own router decides that?
choices:
  - "Local preference on the routes the shop's router learns over circuit 1"
  - "FRR's weight on the session over circuit 1, which is compared first of all"
  - "None: the cloud's router chooses, from what the shop announces to it"
  - "A static route on the shop's router that sends the cloud's prefix to circuit 1"
answer: 2
explanation: |
  Every router chooses its own way out. The cloud's router picks how the cloud's traffic reaches the shop, from the paths it has heard for the shop's prefix, using its own local preference first. The shop can't set that; it can only change what it announces: a more specific prefix over circuit 1, a community the cloud documents, a prepend over circuit 2, or MED.

  Local preference, weight and a static route all change the shop's own outbound traffic: which way the shop's packets leave. Local preference never leaves the shop's AS, and weight never leaves the router.
skills: [inbound-steering]
