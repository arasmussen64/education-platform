id: debug-a-shaky-pipeline
stage: debug
rev: 2
title: "Three numeric bugs in a pipeline"
prompt: |
  This is the pipeline's numeric core on its data: `weekly` turns each day's clicks into a week's, `mean_loss` averages a hundred thousand float32 losses, and `softmax` turns each row of logits into probabilities. It is the pipeline's fast path, so none of the three may loop over the data in Python. It should print:

  ```
  weekly: [140, 350, 700, 840]
  mean loss: 0.1
  softmax: [[0.269, 0.731], [0.269, 0.731]]
  ```

  Instead every line is wrong: the weekly clicks are `[-116, 94, -68, 72]`, the mean loss is `0.099986`, and the first softmax row is `[nan, nan]`. It has three bugs. Run it, then run the checks, which give each function a harder input: an int8 click count of 127, two hundred thousand float32 tenths that must average to 0.1 within a millionth, and logits of 5,000 and -5,000.
hints:
  - "Each line of output comes from one function, and each function has one bug. Take them one at a time and run it after each fix."
  - "20 clicks times 7 is 140, but it prints -116: 256 less. What dtype is the clicks column, what is the largest number it holds, and what dtype does `clicks * 7` come out in?"
  - "Widen the column before multiplying: `clicks.astype(np.int64) * 7`."
  - "A hundred thousand tenths should average to exactly 0.1. The running total is a float32, which keeps about seven digits: once the total is in the thousands, what happens to the low digits of each 0.1 added to it?"
  - "Sum the whole array in one operation, accumulated in float64: `losses.sum(dtype=np.float64)`. That also removes the Python loop, the pipeline's hot spot."
  - "`exp(1000)` overflows to infinity, and infinity over infinity is NaN. Subtracting each row's largest logit first, `logits - logits.max(axis=1, keepdims=True)`, leaves the probabilities unchanged and keeps every exponent at most 0."
# Every test names the module skills it checks (ADR-0012), so a failed test
# says which topics to revisit.
test_skills:
  test_the_output: [ml.hw.bits-and-integers/fixed-width, ml.hw.floating-point/accumulation, ml.hw.floating-point/special]
  test_weekly_widens: [ml.hw.bits-and-integers/fixed-width, ml.hw.bits-and-integers/sizing]
  test_mean_does_not_drift: [ml.hw.floating-point/accumulation, ml.hw.vectorization/dependence, ml.hw.profiling/decide]
  test_softmax_stays_finite: [ml.hw.floating-point/special]
