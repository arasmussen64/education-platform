skills:
  - id: caching
    description: "Set Cache-Control for each kind of answer and say what a browser and a shared cache (a CDN, a reverse proxy) do with it: max-age, s-maxage, no-cache, no-store, private, public, immutable; validators, conditional requests and 304; fresh and stale from max-age and Age, and the heuristic for answers with no headers; Vary and the cache key; fingerprinted URLs; purging a CDN, and what no purge reaches; how CloudFront, Front Door and Cloud CDN read the same headers"
  - id: cors
    description: "The same-origin policy and what it protects; simple and preflighted requests; the preflight's answer and the CORS check; credentials (cookies) and why * is refused with them; Vary: Origin; Access-Control-Max-Age and the browsers' caps; allow-list mistakes (reflection, suffix matches, null); CORS isn't authentication"
  - id: methods-and-status
    description: "Methods as promises: safe and idempotent, which requests may be retried automatically, idempotency keys for POST; conditional requests (304, 412); status classes, and 502 against 504 at a proxy; 405 and 429"
  - id: api-styles
    description: "Choose REST, server-sent events, WebSockets or gRPC for a flow; the WebSocket upgrade (101, Sec-WebSocket-Accept) through proxies, the hop-by-hop Upgrade and Connection headers, idle timeouts and pings below the smallest one on the path; gRPC's protocol buffers, four kinds of call, deadlines, HTTP/2 with trailers, and gRPC-Web for browsers; what nginx and the clouds' load balancers need for each"
