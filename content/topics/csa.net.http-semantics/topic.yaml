id: csa.net.http-semantics
kind: topic
status: ready
title: HTTP semantics
summary: "What a request and its answer mean: methods as promises and which can be retried, status codes as an operator reads them, caching headers for each kind of page and what a CDN does with them, CORS and the browser's rules for other sites' pages, and choosing REST, server-sent events, WebSockets or gRPC for a flow and getting it through every proxy, with the three clouds side by side."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2,
# 3.7 and 5, topic 33) and its designer's brief (csa.net.http-semantics.md).
# Through csa.net.http-tls this builds on csa.net.dns (TTLs and caching
# resolvers, which this topic's caching calls "the same idea, one layer
# up"), csa.net.congestion and csa.net.transport (a load balancer, and the
# rule that the smallest idle timer on the path wins, which est-ping-interval
# retrieves on purpose), csa.net.layers (the network labs' machines, on and
# name@machine services) and Module 1 (curl -I, -v, -H, -X; nginx in
# services; awk, grep, cut in the shell). From csa.net.http-tls it uses
# HTTP request and response, method, header, status line, HTTP/2 streams and
# HTTPS. This topic defines the cookie for the module (the plan's 3.7).
prerequisites: [csa.net.http-tls]
# Worked out: the lesson about 24 minutes (3,100 words with its tables and
# code), the readings about 50 (MDN's caching sections 17, its CORS sections
# 16, "Idempotent" and the methods table 6, grpc.io's core concepts 8,
# nginx's WebSocket page 3), 23 recall items at 1.5 each 35, then the worked
# example 30, the fill-in 25, the write 35, the build 60, the debug 45 and
# the explain 20: about 325. The plan's 315 is kept (MODULE-3-BRIEF.md,
# topic 33); the lesson's tables stand in for the clouds' pages, which are
# under More resources.
estimated_minutes: 315
rev: 1
objectives:
  - "Say what each method promises (safe, idempotent) and which requests a client or proxy may retry by itself, why a `POST` needs an idempotency key, and read a status code as an operator does, telling a 502 from a 504."
  - "Set `Cache-Control` for fingerprinted assets, pages, personal pages and APIs, work out how long a copy stays fresh from `max-age`, `s-maxage`, `Age` and the heuristic, revalidate with an ETag, and say what a browser, a CDN and each cloud's CDN do with it, including what a purge can and can't take back."
  - "Explain the same-origin policy and CORS: which requests a browser preflights, what the answer must hold with and without credentials, why `Vary: Origin` matters, the allow-list mistakes, and why CORS is no substitute for checking who calls an API."
  - "Choose REST, server-sent events, WebSockets or gRPC for a flow, and name what each needs from every proxy and load balancer on the path: the WebSocket upgrade's hop-by-hop headers, pings below the smallest idle timeout, HTTP/2 with trailers for gRPC, and gRPC-Web for browsers."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - RFC 9110: safe methods "essentially read-only" (9.2.1); "PUT, DELETE, and
#   safe request methods are idempotent", and such a request "can be repeated
#   automatically if a communication failure occurs" (9.2.2); 502 "received
#   an invalid response", 504 "did not receive a timely response" from the
#   server behind a gateway or proxy (15.6.3, 15.6.5); 304 (15.4.5), 405
#   (15.5.6), 412 (15.5.13); 429 is RFC 6585's, not 9110's:
#   https://www.rfc-editor.org/rfc/rfc9110.html
# - RFC 9111: a cache answering from a stored response without validation
#   "MUST generate an Age header field" (4); heuristic freshness, "a typical
#   setting of this fraction might be 10%" (4.2.2); Vary and the cache key
#   (4.1); no-cache "MUST NOT be used to satisfy any other request without
#   forwarding it for validation" (5.2.2.4); no-store (5.2.2.5); private, "a
#   shared cache MUST NOT store the response" (5.2.2.7); s-maxage overrides
#   max-age for a shared cache (5.2.2.10); must-revalidate (5.2.2.2):
#   https://www.rfc-editor.org/rfc/rfc9111.html. immutable is RFC 8246.
# - The Fetch standard (last updated 19 October 2026, CC BY 4.0): the CORS
#   check (4.10: no allow-origin fails; * only when credentials mode isn't
#   "include"; otherwise the exact origin, then Allow-Credentials "true");
#   the preflight (4.8: an ok status, methods and header names, * not with
#   credentials, Authorization never by *); safelisted methods GET, HEAD,
#   POST: https://fetch.spec.whatwg.org/. cors-verdict in the network base
#   applies them, with its cases in tools/tests/test_cors_verdict.py.
# - MDN's CORS guide (modified 2026-10-28): simple requests' methods, headers
#   and three Content-Type values; with credentials no * in Allow-Origin,
#   -Headers, -Methods or -Expose-Headers; Vary: Origin when the origin comes
#   from a list. MDN's Access-Control-Max-Age (modified 2025-11-21): 5 s by
#   default, Firefox 86,400 s, Chromium 7,200 s since v76 (600 before).
# - MDN's caching guide (modified 2026-08-14): no-cache "does not prevent the
#   storing of responses"; the 10% heuristic; Age.
# - nginx: Upgrade and Connection are hop-by-hop and must be passed; "#
#   proxy_http_version 1.1; # before version 1.29.7"; a WebSocket closed
#   after 60 s without data unless proxy_read_timeout is raised or the server
#   pings (https://nginx.org/en/docs/http/websocket.html); proxy_read_timeout
#   60s; a response with Set-Cookie isn't cached; Vary * isn't cached, other
#   Vary values key the cache; the page lists no Cache-Control values that
#   stop caching (https://nginx.org/en/docs/http/ngx_http_proxy_module.html);
#   grpc_pass "requires the ngx_http_v2_module", grpc_read_timeout 60s
#   (https://nginx.org/en/docs/http/ngx_http_grpc_module.html).
# - grpc.io "Core concepts" (modified 2026-05-11): unary, server streaming,
#   client streaming and bidirectional streaming RPCs; deadlines and
#   DEADLINE_EXCEEDED. gRPC over HTTP/2: "Status must be sent in Trailers
#   even if the status code is OK", te: trailers "Used to detect incompatible
#   proxies": https://github.com/grpc/grpc/blob/master/doc/PROTOCOL-HTTP2.md.
#   gRPC-Web from browsers through Envoy, "You may also need to add some CORS
#   setup": https://grpc.io/docs/platforms/web/basics/
# - RFC 6455: 1.2 "Protocol Overview", 1.3 "Opening Handshake" with the key
#   dGhlIHNhbXBsZSBub25jZQ== giving s3pPLMBiTxaQ9kYGzzhZRbK+xOo=; a Ping "may
#   serve either as a keepalive" (5.5.2): https://www.rfc-editor.org/rfc/rfc6455.html
# - Valve, "Update on Christmas Issues", 2015-12-30: a second caching
#   configuration "incorrectly cached web traffic for authenticated users";
#   between 11:50 and 13:20 PST store pages for about 34k users; billing
#   addresses among what could be seen: https://store.steampowered.com/oldnews/19852
# - CloudFront: no cache policy, a default TTL of 24 hours; no-cache,
#   no-store and private respected with a minimum TTL of 0, and cached for
#   the minimum TTL above 0 (https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html);
#   invalidation, and versioned names recommended, since browsers keep old
#   copies (https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Invalidation.html).
# - Azure Front Door (updated 2026-07-15): private, no-cache and no-store
#   aren't cached; no Cache-Control, one to three days at random; purge; only
#   GET cached; Last-Modified, not ETag, as the validator:
#   https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
# - Cloud CDN: CACHE_ALL_STATIC the default mode, 1 hour for static content
#   without headers; private and no-store not cached; no-cache "is cached but
#   must be revalidated"; invalidation: https://docs.cloud.google.com/cdn/docs/caching
# - AWS ALB: idle_timeout.timeout_seconds default 60
#   (https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html);
#   "native support for WebSockets" on HTTP and HTTPS listeners
#   (https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html).
# - Azure Application Gateway (updated 2026-06-22): WebSocket support on, no
#   setting; "The request timeout value in HTTP Settings also applies to the
#   WebSocket session"; keep it above the ping interval:
#   https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-websocket
# - Google Cloud's Application Load Balancers: "The load balancer doesn't
#   require any configuration to proxy WebSocket connections"; timeouts
#   "depend on the type of load balancer": https://docs.cloud.google.com/load-balancing/docs/https
# Every output marked "captured" in the lesson, the labs and the recall items
# is real output of this topic's labs (nginx 1.24.0, python3-websockets 10.4
# on Ubuntu 24.04, on the network-lab base, Docker Desktop 29.8.2), captured
# on 2026-11-12: MISS then HIT for an asset, no-cache never stored, the 304,
# alice's page served to bob, the preflights from www.shop.test and
# evil.test, the 101 and its accept value, the 400 without the upgrade lines
# and the 426 with HTTP/1.1 and no headers, and idle WebSockets closed at
# nginx's proxy_read_timeout. Times will differ in a new run.
