prove:
  build: build-shop-edge
  debug: debug-stale-and-blocked
  explain:
    prompt: |
      The shop is putting a CDN in front of its site, adding a JavaScript widget that partners put on their own websites and that calls the shop's basket API from their pages, and giving warehouse staff a live order board. Explain, in your own words: which caching headers you would send for the HTML pages, the fingerprinted assets, the account pages and the API, and what goes wrong with each if you get it wrong; what CORS protects, what a browser checks before letting a partner's page read the basket, and why CORS doesn't stop anyone calling the API from a script on a server; which of the API's requests clients may retry by themselves, and why; and whether the order board should use REST, WebSockets, server-sent events or gRPC, and what the CDN, the load balancer and nginx must each allow for it to stay connected.
    rubric:
      - id: cache-policy
        required: true
        description: "Assets: a long max-age plus immutable, safe because a fingerprinted name changes with the content; HTML: no-cache (stored but revalidated, cheaply with an ETag and a 304), so a deploy shows at once, where a long max-age serves an old page; account pages: private or no-store, or a shared cache serves one customer's page to the next; the API: no-store; s-maxage for a CDN-only lifetime; and a copy already stored stays until it expires or the CDN is purged (a browser's can't be)."
      - id: cors-purpose
        required: true
        description: "The same-origin policy protects users' data in their browser (their cookies) from other sites' pages; CORS is the server listing which origins may read its answers; non-simple requests (a JSON PUT, a custom header) are preflighted with OPTIONS; with cookies the answer must name the exact origin and send Access-Control-Allow-Credentials: true, never *; Vary: Origin when the origin comes from a list; never reflect every origin, match a suffix or allow null."
      - id: cors-not-auth
        required: true
        description: "Only browsers apply CORS: curl, scripts and servers ignore it, so the API must still authenticate and authorise every call itself."
      - id: idempotency
        required: true
        description: "Safe (GET) and idempotent (PUT, DELETE) requests can be repeated with the same effect, so clients and proxies may retry them automatically; POST can't, since a retry may order or charge twice, unless the API accepts an idempotency key."
      - id: board-choice
        required: true
        description: "A push to many screens: server-sent events if it only flows one way, WebSockets if it goes both ways (either justified, rather than polling); every hop must keep a quiet connection open longer than the gap between messages or pings, and for WebSockets pass the upgrade (the hop-by-hop Upgrade and Connection headers, HTTP/1.1 to the upstream in nginx); ping more often than the smallest idle timeout on the path (nginx's proxy_read_timeout is 60 s by default, as is an AWS ALB's idle timeout)."
      - id: grpc
        required: false
        description: "For internal service-to-service calls with a strict contract or streaming, gRPC over HTTP/2 end to end, with trailers and deadlines; browsers need gRPC-Web and a proxy."
    model_answer: |
      For the CDN I'd give each kind of answer its own Cache-Control. The fingerprinted assets, app.3f9a.js and the like, get public, max-age=31536000, immutable: their names change whenever their content does, so a year-old copy is never wrong, and immutable stops browsers asking on a reload. The HTML pages get no-cache, which doesn't mean "don't store": browsers keep them but ask before each use, and with the ETag nginx sends, an unchanged page costs a 304 of a few headers. If I gave the HTML a long max-age instead, customers would see an old page for as long as their copies last, and after fixing it I'd still have to purge the CDN, while copies in browsers can't be reached at all. The account pages get private (or no-store): a CDN keys its copies on the URL, so a public account page would be handed from one customer to the next, which is what happened to Steam at Christmas 2015. The API gets no-store, so nothing keeps anyone's basket. Where I want the CDN to keep something longer than browsers, s-maxage is for shared caches only.

      CORS protects people, not the API. A customer's browser holds the shop's cookies, and a page from another site open in the same browser could otherwise read the customer's basket. The same-origin policy stops that by default, and CORS is the API saying which other origins may read its answers. For the partners' widget the API needs an allow-list of the partners' origins. A JSON PUT isn't a simple request, so the browser first sends an OPTIONS preflight naming the method and headers; the answer must name the partner's exact origin in Access-Control-Allow-Origin, list PUT and Content-Type, and, since the widget sends the customer's cookie, say Access-Control-Allow-Credentials: true, with no * anywhere. The real answer must carry the origin and credentials headers too, and Vary: Origin so the CDN never gives one partner's answer to another. I'd never echo back whatever Origin arrives, match on a suffix, or allow null. But a script on a server sends whatever it likes and ignores all of this, so the API still has to check the session or a token on every call.

      Clients may retry GET, PUT and DELETE by themselves, because repeating them has the same effect as sending them once: GET changes nothing, and PUT sets the item to the same state. POST isn't idempotent, so a retried POST /orders could make two orders; for payments I'd have the client send an idempotency key, so a repeat is recognised.

      The order board pushes new orders to many screens. If the screens only listen, server-sent events are enough; if they also send, WebSockets; both beat polling. For a WebSocket, every hop must pass the upgrade: nginx doesn't pass the hop-by-hop Upgrade and Connection headers unless told to, and needs proxy_http_version 1.1. And every hop drops a quiet connection: nginx after proxy_read_timeout, 60 seconds by default, an AWS ALB after its idle timeout, also 60 by default, and the CDN after its own. So the board should ping more often than the smallest of those, and I'd raise nginx's timeout above the ping interval. gRPC is for internal service-to-service calls over HTTP/2 with trailers; a browser would need gRPC-Web and a proxy.
