id: mcq-star-credentials
type: mcq
rev: 1
prompt: |
  The basket API answers with `Access-Control-Allow-Origin: *` and `Access-Control-Allow-Credentials: true`. The shop's page calls it with the customer's cookie (`credentials: "include"`). What does the browser do with the answer?
choices:
  - "Refuses it: with credentials, the allowed origin must be named exactly"
  - "Lets the page read it: `*` allows every origin, the page's own among them"
  - "Sends the request again without the cookie, and lets the page read that"
  - "Lets the page read it, and drops any cookie that the answer tries to set"
answer: 0
explanation: |
  The Fetch standard's CORS check accepts `*` only "if request's credentials mode is not "include"". With credentials, the answer must name the page's own origin, exactly, and say `Access-Control-Allow-Credentials: true`; otherwise the page gets a network error, and the console says CORS refused it. The rule exists because a wildcard with cookies would let any site on the internet read a signed-in customer's answers.

  So an API called with cookies keeps an allow-list and answers each allowed origin with its own name (and `Vary: Origin`). A browser never quietly retries a refused request without the cookie, and it doesn't hand over the answer minus a cookie: the page simply can't read it.
skills: [cors]
