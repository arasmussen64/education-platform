id: ws-upgrade-answers
type: predict_shell
rev: 1
prompt: |
  Two answers to the same WebSocket upgrade request for the shop's order board, through the edge and the origin's nginx, captured in this topic's lab (nginx 1.24, 2026-11-12) with `curl -si`, carriage returns taken off. For `upgraded.txt` the origin's `/board/` block passed the upgrade on; for `refused.txt` it had only its `proxy_pass` line. For each, the command prints the status code and how many `Upgrade` headers came back. What is printed?
files:
  upgraded.txt: |
    HTTP/1.1 101 Switching Protocols
    Server: nginx/1.24.0 (Ubuntu)
    Date: Thu, 12 Nov 2026 12:19:59 GMT
    Connection: upgrade
    Upgrade: websocket
    Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=
  refused.txt: |
    HTTP/1.1 400 Bad Request
    Server: nginx/1.24.0 (Ubuntu)
    Date: Thu, 12 Nov 2026 12:20:04 GMT
    Content-Type: text/plain
    Content-Length: 77
    Connection: keep-alive

    Failed to open a WebSocket connection: did not receive a valid HTTP request.
command: |
  for f in upgraded.txt refused.txt; do
    echo "$f $(head -n 1 "$f" | cut -d' ' -f2) $(grep -ci '^upgrade:' "$f")"
  done
expected_output: |
  upgraded.txt 101 1
  refused.txt 400 0
explanation: |
  `head -n 1` is the status line and `cut -d' ' -f2` its code; `grep -ci` counts the lines that start `Upgrade:`, whatever the case (a count of 0 still prints 0). With the upgrade passed on, the board answers `101 Switching Protocols`, says `Upgrade: websocket`, and proves it's a real WebSocket server with `Sec-WebSocket-Accept`, worked out from the request's key; from then on the connection carries WebSocket messages both ways.

  Without the three lines (`proxy_http_version 1.1`, `proxy_set_header Upgrade $http_upgrade`, `proxy_set_header Connection "upgrade"`), nginx sent the board an ordinary HTTP/1.0 request with no `Upgrade` in it, because `Upgrade` and `Connection` are hop-by-hop and a proxy drops them. The board refused it with `400 Bad Request` and its own explanation in the body. The edge in front had the lines, so the upgrade reached the origin's nginx and stopped there.
skills: [api-styles]
