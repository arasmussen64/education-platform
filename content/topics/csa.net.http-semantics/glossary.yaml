# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: idempotent
  definition: Said of a request whose effect is the same whether it is sent once or twice, such as `GET`, `PUT` or `DELETE`. Software may retry it by itself; `POST` isn't idempotent.
- term: idempotency key
  definition: A random value a client sends with every try of one `POST`, such as a payment, so the server recognises a repeat and answers it without acting twice.
- term: shared cache
  definition: A cache whose copies serve many people, such as a CDN or a reverse proxy, unlike a browser's private cache. `private` keeps an answer out of it.
- term: conditional request
  definition: A request that asks for a resource only if it changed, by sending its copy's `ETag` or date. An unchanged one is answered `304 Not Modified`, with no body.
- term: same-origin policy
  definition: The browser's rule that a page may send requests to another origin (scheme, host and port) but may not read the answers, unless that origin allows it with CORS.
- term: CORS
  aliases: [cross-origin resource sharing]
  definition: How a server tells browsers which other origins may read its answers, with `Access-Control-Allow-*` headers. It protects people using browsers, not the server.
- term: preflight
  definition: The `OPTIONS` request a browser sends before a cross-origin request that a plain HTML form couldn't send, asking whether the method and headers are allowed.
- term: WebSocket
  definition: "A two-way message channel that starts as an HTTP request with `Upgrade: websocket`, answered `101 Switching Protocols`, then carries messages both ways on one connection."
