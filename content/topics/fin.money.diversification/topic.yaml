prove:
  build: build-lowest-risk-mix
  debug: debug-correlation-report
  explain:
    prompt: |
      A friend keeps all their savings in the shares of the company they work for, because "I know it best". They've heard an index fund, which holds hundreds of companies, is "less risky", but they think that just means it earns less. Explain, in your own words and with at least one number: what correlation is and why it decides how much mixing holdings lowers risk; why an index fund lowers risk without lowering the expected return; what kind of risk it still can't remove; and what is especially risky about the friend's choice.
    rubric:
      - id: correlation
        required: true
        description: "Correlation measures how two holdings move together, from -1 to +1; when it's below 1 their surprises partly cancel, so a mix is less volatile than the weighted average of its parts (with a number, e.g. two 20% holdings, uncorrelated, half each: about 14%)."
      - id: same-expected-return
        required: true
        description: "A mix's expected return is the weighted average of its holdings' expected returns, so spreading out doesn't lower it; only the risk falls."
      - id: market-risk-remains
        required: true
        description: "Company-specific risk averages away across many holdings; market risk, what moves almost everything together, remains, so the index fund still falls in a market-wide fall."
      - id: concentration
        required: true
        description: "The friend's savings and their job depend on the same company, so one bad event can take both at once (Enron's employees are the example); knowing a company doesn't remove its specific risk."
      - id: square-root
        required: false
        description: "Says risk falls roughly as one over the square root of the number of uncorrelated holdings, then levels off at the shared part."
    model_answer: |
      Correlation is a number from -1 to +1 that says how two holdings' returns move together: +1 always together, 0 no pattern, -1 always opposite. It's worked out from the covariance, the average product of their distances from their means, divided by both volatilities. It matters because a mix's volatility depends on it. Two holdings that each have 20% volatility, held half and half, give a mix with 20% volatility if their correlation is 1, but only about 14% if it's 0, because one's bad months are often another's good ones and they partly cancel. An index fund holds hundreds of companies, so each company's own surprises, a failed product or a fraud, are a tiny share of it and mostly cancel against others' good news. Its expected return, though, is just the weighted average of its holdings' expected returns: spreading the money out doesn't make that smaller, it only makes the ride smoother. That's why diversification is called a free lunch. What it can't remove is market risk: a recession or a jump in interest rates moves nearly every company the same way, so the fund still falls in a market-wide fall. Adding holdings cuts risk quickly at first, roughly as one over the square root of the count, and then levels off at that shared part. The friend's choice has all of the one company's specific risk and none of the cancelling. Worse, their wages depend on the same company, so a single disaster can take their job and their savings at once. That's what happened to many Enron employees in 2001, whose retirement accounts were mostly Enron shares when the company collapsed. Knowing a company well doesn't make its risks go away.
