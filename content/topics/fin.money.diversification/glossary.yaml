- term: covariance
  definition: "How much two series move together: the average product of their distances from their means (dividing by one less than the count). Its size depends on how big the numbers are."
- term: correlation
  aliases: [correlation coefficient]
  definition: "Covariance divided by both series' volatilities, so it always lies between -1 (always opposite) and +1 (always together); 0 means no pattern."
- term: portfolio
  definition: "Everything an investor holds, taken together. Its return is the weighted average of its holdings' returns; its risk depends on how they move together."
- term: diversification
  aliases: [diversify]
  definition: "Spreading money across holdings that don't always move together, so their surprises partly cancel. It lowers risk without lowering the expected return."
- term: specific risk
  aliases: [company-specific risk, idiosyncratic risk]
  definition: "The part of a holding's ups and downs that comes from its own news, which averages away across many holdings."
- term: market risk
  aliases: [systematic risk]
  definition: "The part of a holding's ups and downs that moves almost everything together, such as a recession or a jump in rates. Diversification can't remove it."
