id: write-adding-funds
stage: write
rev: 1
title: "Adding funds one at a time"
prompt: |
  The starter holds two years of made-up monthly returns for eight funds, one list of 24 returns per fund (`fund_1` to `fund_8`), gathered into the list `funds`, and the `volatility` function from Risk. Each fund was made as a shared market part plus a part of its own.

  Write `mix_of_first(funds, k)`, which returns the monthly returns of a mix that splits its money equally between the first `k` funds: for each month, the average of those `k` funds' returns that month. Then print the mix's volatility for `k` from 1 to the number of funds:

  ```
  1 of 8: 6.73%
  2 of 8: 5.19%
  3 of 8: 4.72%
  4 of 8: 4.26%
  5 of 8: 4.06%
  6 of 8: 3.86%
  7 of 8: 3.67%
  8 of 8: 3.38%
  ```

  Watch how much the second fund takes off and how much less the later ones do. Keep the line `funds = [fund_1, ...]`: the checks run your program with other funds too.
hints:
  - "`funds[0]` is the first fund's list, so `len(funds[0])` is the number of months, and `funds[:k]` is a list of the first `k` funds."
  - "Loop over the months; inside, add up `fund[month]` for each fund in `funds[:k]`, then append the total divided by `k`."
  - "For the table: `for k in range(1, len(funds) + 1):` and `print(f\"{k} of {len(funds)}: {volatility(mix_of_first(funds, k)):.2%}\")`."
skills: [diversify]
