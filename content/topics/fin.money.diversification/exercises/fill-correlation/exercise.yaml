id: fill-correlation
stage: fill_in
rev: 1
title: "Stocks and gold"
prompt: |
  Six months of made-up returns for a stock fund and for gold. The `correlation` function has three gaps. Replace each `...` so the program prints:

  ```
  Stocks and gold: -0.94
  ```

  Every gap stands where a value goes, so Python can start the program with the gaps still in it: it stops inside `correlation` with a `TypeError` that mentions `ellipsis`. The checks also try the function on other returns.
hints:
  - "Covariance multiplies each month's distance from the mean, for both lists. What is `b[i]` measured from?"
  - "Covariance divides by one less than the count, as the sample standard deviation in `volatility` does."
  - "Correlation divides the covariance by both lists' volatilities multiplied together."
skills: [correlation]
