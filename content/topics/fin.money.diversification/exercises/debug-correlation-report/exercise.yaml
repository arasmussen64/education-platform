title: "A correlation report"
prompt: |
  This program measures how closely eight months of made-up stock and bond returns move together. As a sanity check it also measures the stocks against themselves, which must give exactly 1. It should print:

  ```
  Stocks and bonds: -0.46
  Stocks with themselves: 1.00
  ```

  Instead it prints `Stocks and bonds: 0.06` and `Stocks with themselves: -0.81`. It has two bugs. Run it, fix one thing at a time, and run it again after each fix.
skills: [correlation]
