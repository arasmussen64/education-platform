id: build-lowest-risk-mix
stage: build
rev: 1
title: "The lowest-risk mix"
prompt: |
  From a blank editor. Fund A has a volatility of 18% a year, fund B 8%, and their correlation is 0.2. Start your program with these three lines (the checks change them):

  ```python
  vol_a = 0.18
  vol_b = 0.08
  corr = 0.2
  ```

  Write two functions:

  - `portfolio_volatility(w, vol_a, vol_b, corr)` returns the volatility of a mix with the share `w` of its money in A and the rest in B, as a decimal.
  - `lowest_risk_mix(vol_a, vol_b, corr)` tries every `w` from 0 to 1 in steps of 0.01 (`i / 100` for `i` from 0 to 100) and returns two values, the `w` with the lowest volatility and that volatility: `return best_w, best_vol`.

  Then print the volatility for `w` from 0 to 1 in steps of 0.1, and the lowest-risk mix:

  ```
  0% in A: 8.00%
  10% in A: 7.76%
  20% in A: 7.95%
  30% in A: 8.52%
  40% in A: 9.42%
  50% in A: 10.55%
  60% in A: 11.86%
  70% in A: 13.29%
  80% in A: 14.80%
  90% in A: 16.38%
  100% in A: 18.00%
  Lowest risk: 11% in A, volatility 7.76%
  ```

  `:.0%` prints a decimal as a whole percentage (`0.1` as `10%`). The checks also call your functions with other numbers.
skills: [portfolio-volatility]
