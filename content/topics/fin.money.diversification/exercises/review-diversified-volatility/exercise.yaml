title: "Where diversification stops"
prompt: |
  A portfolio splits its money equally between `n` holdings. Each holding has the same volatility, `vol`, and every pair has the same correlation, `corr`. The portfolio's volatility is then `vol * sqrt(corr + (1 - corr) / n)`.

  Start from these two lines:

  ```python
  vol = 0.25
  corr = 0.16
  ```

  Write `diversified_volatility(vol, corr, n)`, which returns that volatility as a decimal, and print it for `n` in 1, 2, 5, 10, 100 and 1000:

  ```
  n = 1: 25.00%
  n = 2: 19.04%
  n = 5: 14.32%
  n = 10: 12.35%
  n = 100: 10.26%
  n = 1000: 10.03%
  ```

  Keep the two starting lines: the checks run your program with other values too.
skills: [diversify]
