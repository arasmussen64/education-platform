id: mcq-expected-return-of-a-mix
type: mcq
rev: 1
prompt: |
  Ten made-up companies are each expected to return 7% a year, with a volatility of 30% each. You hold all ten in equal amounts instead of one. What happens to the expected return and to the risk?
choices:
  - "The expected return falls below 7%, the price paid for lower risk"
  - "Both stay the same, because each company still has 30% volatility"
  - "Both fall, because spreading money out dilutes the good with the bad"
  - "The expected return stays 7%, and unless they move together the risk falls"
answer: 3
explanation: |
  A mix's expected return is the weighted average of its holdings' expected returns: ten 7%s average to 7%. Its risk isn't an average: it depends on the correlations, and anything below 1 makes the mix less volatile than its parts. So diversification lowers risk without lowering the expected return, which is why it's sometimes called the only free lunch in investing.

  There's no price in expected return here. What you give up is the chance of the one big winner taking all your money up with it, and the chance of the one big loser taking it down.
skills: [diversify]
