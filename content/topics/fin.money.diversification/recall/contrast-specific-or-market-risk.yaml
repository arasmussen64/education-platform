id: contrast-specific-or-market-risk
type: mcq
rev: 1
prompt: |
  Two things happen in one month. A drug maker's main medicine fails a trial and its shares fall 40%. Separately, interest rates jump and almost every share in the market falls. You own a fund that holds 500 companies, the drug maker among them. Which of the two falls does the fund mostly protect you from?
choices:
  - "The drug maker's fall: it's specific to one company, a small part of the fund"
  - "The fall in rates: a large fund holds bonds that rise when shares go down"
  - "Both alike: a fund of 500 companies cancels out any fall of a single cause"
  - "Neither: a fund always falls by as much as its worst holding falls that month"
answer: 0
explanation: |
  The trial failure is **specific risk**: it hits one company, which is about 0.2% of a fund of 500, so the fund barely notices. Across many companies such surprises, good and bad, mostly cancel. The jump in rates is **market risk**: it moves almost everything the same way, so holding more companies doesn't help, and the fund falls with the market.

  A fund of shares holds shares, not bonds, unless it says otherwise. And a fund falls by the weighted average of its holdings' falls, not by its worst one's.
skills: [diversify]
