id: mcq-correlation-of-one
type: mcq
rev: 1
prompt: |
  Two funds have volatilities of 30% and 10% and a correlation of exactly 1. You hold half of each. What happens to the risk?
choices:
  - "The mix has 20% volatility: a straight average, with no diversification gain at all"
  - "The mix has about 15.8% volatility, because the cross term in the formula drops out"
  - "The mix has 10% volatility, since the safer fund holds the riskier one back fully"
  - "The mix has 40% volatility, because funds that move together add their risks up"
answer: 0
explanation: |
  At a correlation of 1 the two-fund variance becomes exactly (0.5 × 30% + 0.5 × 10%)², so the volatility is the weighted average, 20%. Funds that always move together can't cancel each other out, so mixing them gives no benefit beyond the average.

  15.8% is what a correlation of 0 would give (the cross term drops out at 0, not at 1). The safer fund doesn't cap the mix's risk, and risks don't simply add: the shares, which sum to 1, weight them.
skills: [portfolio-volatility]
