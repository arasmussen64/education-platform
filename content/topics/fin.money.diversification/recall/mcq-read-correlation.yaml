id: mcq-read-correlation
type: mcq
rev: 1
prompt: |
  Over five years of monthly returns, an airline's shares and an oil producer's shares have a correlation of -0.6. What does that tell you?
choices:
  - "In most months they moved the same way, but the airline moved about 60% as far"
  - "They tended to move in opposite directions, though not every month"
  - "Over the five years the oil producer lost 60% while the airline gained"
  - "They had no pattern at all, since a correlation below zero means unrelated"
answer: 1
explanation: |
  Correlation runs from -1 (always opposite) through 0 (no pattern) to +1 (always together). At -0.6 the two tended to move in opposite directions: when fuel got dearer the oil producer often did well and the airline badly. It isn't -1, so some months they moved together.

  Correlation says nothing about how far each moved (that's volatility) or about their total returns over the period. And "unrelated" is a correlation near 0, not below it.
skills: [correlation]
