id: typed-risk-that-stays
type: typed
rev: 1
prompt: |
  Holding hundreds of companies cancels out the surprises that hit one company at a time. The risk that remains is what moves almost all of them together: a recession, a jump in interest rates. Name that kind of risk, two words.
kind: text
answers:
  - "market risk"
  - "systematic risk"
mistakes:
  - id: specific
    answers: ["specific risk", "company-specific risk", "idiosyncratic risk", "unsystematic risk"]
    why: "That's the risk diversification removes: what hits one company at a time. What's left is what moves all of them together."
  - id: volatility
    answers: ["volatility"]
    why: "Volatility measures how much something moves, from either source. The kind that no number of holdings removes is market risk."
explanation: |
  A share's ups and downs are part **specific risk**, its own news, and part **market risk**, what moves everything together. Specific risk averages away across many holdings; market risk doesn't, so it's the floor a diversified portfolio's volatility settles on.
skills: [diversify]
