id: est-mix-uncorrelated
type: estimate
rev: 1
prompt: |
  Two funds each have a volatility of 20% a year, and their returns are uncorrelated (a correlation of 0). You put half your money in each. What is the mix's volatility, in percent? Within 2%.
unit: "%"
answer: 14.14
tolerance: { percent: 2 }
given: { vol: 20 }
working: (0.5 ** 2 * vol ** 2 + 0.5 ** 2 * vol ** 2) ** 0.5
mistakes:
  - id: average
    value: 20
    working: 0.5 * vol + 0.5 * vol
    why: "Averaging the two volatilities is right only when the correlation is 1. With no correlation the cross term is zero and the mix is less risky than either fund."
  - id: halved
    value: 10
    working: 0.5 * vol
    why: "That halves the volatility, as if the two always cancelled out. They're uncorrelated, not opposite: the variances add, then you take the square root."
explanation: |
  With a correlation of 0 the cross term vanishes, so the variance is 0.5² × 20² + 0.5² × 20² = 100 + 100 = 200 (in percent squared), and the volatility is √200 ≈ 14.14%. Two equally risky funds that don't move together give a mix about 30% less risky than either, at the same expected return. That's the whole case for diversification in one sum.
skills: [portfolio-volatility]
