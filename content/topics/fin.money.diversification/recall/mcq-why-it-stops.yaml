id: mcq-why-it-stops
type: mcq
rev: 1
prompt: |
  A fund goes from holding 20 companies to holding 500. Its volatility barely changes. Why?
choices:
  - "Beyond 20 holdings the fees of buying the extra shares eat the gain"
  - "Volatility is measured over too short a period to notice the change"
  - "What's left is the part all companies share, which more holdings can't cancel"
  - "Large funds must hold the same companies, so the new ones add nothing"
answer: 2
explanation: |
  Each company's return is part shared (the economy, interest rates, the mood of the market) and part its own (a product flop, a lawsuit, a good year). The own parts are uncorrelated, so they cancel more and more as holdings are added, and by twenty or so most of that cancelling has happened. The shared part moves every holding the same way and no number of holdings removes it: that's the floor.

  Fees are a real cost, but they don't change volatility. And the period measured doesn't explain why the risk stops falling.
skills: [diversify]
