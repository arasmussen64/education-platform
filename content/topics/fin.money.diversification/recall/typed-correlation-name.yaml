id: typed-correlation-name
type: typed
rev: 1
prompt: |
  It's the covariance of two return series divided by both their volatilities, and it always lands between -1 and +1. Type its name, one word.
kind: text
answers:
  - "correlation"
  - "correlation coefficient"
mistakes:
  - id: covariance
    answers: ["covariance"]
    why: "Covariance is the number before the division. It can be any size, which is why it's divided by both volatilities to give the correlation."
  - id: volatility
    answers: ["volatility", "standard deviation"]
    why: "Volatility is how much one series moves. The number that says how two move together is the correlation."
explanation: |
  Correlation is covariance on a fixed scale: -1 means the two always move in opposite directions, 0 means no pattern, +1 means always together. It's the number that decides how much mixing two holdings lowers risk.
skills: [correlation]
