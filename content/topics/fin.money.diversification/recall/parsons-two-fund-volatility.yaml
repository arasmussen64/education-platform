id: parsons-two-fund-volatility
type: parsons
rev: 1
prompt: |
  A mix puts 60% of its money in a fund with a volatility of 20% and 40% in one with 10%, and the two have a correlation of 0.5. Put the lines in order so the program prints the mix's volatility, `14.42%`. Two lines are decoys that don't belong. (The first line gives four names their values at once: `vol_a` is 0.20, `vol_b` 0.10, `corr` 0.5 and `w` 0.6.)
lines:
  - 'vol_a, vol_b, corr, w = 0.20, 0.10, 0.5, 0.6'
  - 'variance = w**2 * vol_a**2 + (1 - w) ** 2 * vol_b**2 + 2 * w * (1 - w) * corr * vol_a * vol_b'
  - 'vol = variance ** 0.5'
  - 'print(f"{vol:.2%}")'
distractors:
  - 'variance = w * vol_a**2 + (1 - w) * vol_b**2 + 2 * w * (1 - w) * corr * vol_a * vol_b'
  - 'vol = variance / 2'
explanation: |
  The two-fund formula squares each share as well as each volatility: 0.36 × 0.04 + 0.16 × 0.01 = 0.016, and the cross term 2 × 0.6 × 0.4 × 0.5 × 0.20 × 0.10 adds 0.0048, a variance of 0.0208. Variance is in squared units, so the volatility is its square root (`** 0.5`), 0.1442, which `:.2%` prints as `14.42%`. The decoy that leaves the shares unsquared gives a variance that's too big, and halving a variance isn't taking its square root.
skills: [portfolio-volatility]
