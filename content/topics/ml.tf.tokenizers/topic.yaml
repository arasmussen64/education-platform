# A planned outline for the Machine Learning Foundations track
# (docs/specs/ml-foundations.md). It becomes real content when written.
id: ml.tf.tokenizers
kind: topic
status: planned
title: "Tokenizers: byte-pair encoding"
summary: Characters, words and subwords as three ways to cut text; the byte-pair encoding loop that merges the most frequent pair until the vocabulary is full; encoding and decoding that round-trip; the trade between vocabulary size and sequence length; and why the tokenizer is part of the model.
prerequisites:
- ml.tf.tokens-and-embeddings
estimated_minutes: 50
rev: 1
objectives:
- Count pair frequencies and perform the merges of byte-pair encoding by hand on a small corpus.
- Implement a tokenizer that learns merges, encodes text to tokens and decodes it back, and check the round trip.
- Measure how the vocabulary size trades against the length of the encoded corpus, and say what each costs the model.
- "Say why numbers, rare words and other languages come out in odd pieces, and why a model and its tokenizer can't be separated."
