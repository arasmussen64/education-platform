id: mcq-shape
type: mcq
rev: 1
prompt: |
  What is `np.array([[1, 2, 3], [4, 5, 6]]).shape`?
choices:
  - '`(3, 2)`'
  - '`(2, 3)`'
  - '`6`'
  - '`(2,)`'
answer: 1
explanation: |
  Two inner lists, so two rows; three numbers in each, so three columns: `(2, 3)`, rows first. `6` is the `size`, the total count. `(2,)` would be a one-dimensional array of two values.
skills: [make]
