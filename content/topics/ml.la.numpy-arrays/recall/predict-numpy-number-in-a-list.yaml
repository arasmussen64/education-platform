id: predict-numpy-number-in-a-list
type: predict_output
rev: 1
prompt: |
  An array's mean and its largest value, printed three ways: the mean on its own, both inside a list, and both inside a list after `float()`. What does the program print? Three lines, exactly as NumPy 2 writes them.
code: |
  import numpy as np

  a = np.array([1.5, 2.5, 3.5])
  m = a.mean()
  print(m)
  print([m, a.max()])
  print([float(m), float(a.max())])
expected_output: |
  2.5
  [np.float64(2.5), np.float64(3.5)]
  [2.5, 3.5]
explanation: |
  `a.mean()` and `a.max()` each give one NumPy number, a `np.float64`. Printed on its own, a NumPy number looks like any other: `2.5`. Inside a list (or a tuple or a dictionary), NumPy 2 writes its type around it, `np.float64(2.5)`. That text isn't an error and the value isn't wrong: it says "this is the number 2.5, held as a NumPy float". `float()` turns a NumPy number into a plain Python one, which prints as `2.5` wherever it sits. So when a check expects `[2.5, 3.5]` and your program prints `np.float64(...)`, your arithmetic is fine; wrap each value in `float()`.
skills: [make]
