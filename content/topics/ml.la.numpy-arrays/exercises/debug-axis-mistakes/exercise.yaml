id: debug-axis-mistakes
stage: debug
rev: 2
title: "A sales report"
prompt: |
  `report(grid)` takes sales with one row per shop and one column per day, and should print the average of each day, how far each sale was above its day's average, and which day (counting from 1) sold the most in total:

  ```
  daily averages: [20. 30. 50.]
  above average:
  [[-5. -5.  5.]
   [ 5.  5. -5.]]
  best day: 3
  ```

  Instead it prints two daily averages, not three, then stops with `ValueError: operands could not be broadcast together with shapes (2,3) (2,)`. It has two bugs. Run it, read the error, fix what you find, run it again, and check every line against the numbers by hand.
hints:
  - "Three days should give three averages. Work out day 1's by hand, (15 + 25) / 2: which numbers did the program average instead?"
  - "`axis=0` runs down the columns and gives one result per column, here one per day; `axis=1` runs along the rows and gives one per row, here one per shop."
  - "Once it runs, the best day comes out as 2. Add up each day's sales by hand: which total is biggest, and which totals did the program compare?"
skills: [vectorize, elementwise]
