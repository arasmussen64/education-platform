id: step-outline
stage: fill_in
rev: 1
title: "Put it all together"
prompt: |
  Now write the whole report tool. The sample file, the plan as comments, and the lines at the bottom are given. Write each part under its comment, pressing **Run** after each part. Running the finished program should print:

  ```
  report: all checks passed
  north: 150.50
  south: 80.00
  east: 45.25
  Rows: 6
  Bad rows: 2
  Total: 275.75
  ```
hints:
  - "Under each comment, write what you filled in for that part in the steps before: read_rows, amount_of and good_rows; totals_by_region; report_lines and write_report; test_report; main."
  - "Every function gets a docstring, and none of them changes the list it's given. amount_of returns None for a bad row, so nothing else needs a try."
  - "The tests need at least four asserts, including a row whose amount is text and one whose amount is blank, and must print the message at the end."
