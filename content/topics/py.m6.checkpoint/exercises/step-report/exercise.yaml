id: step-report
stage: fill_in
rev: 1
title: "The report, on screen and on disk"
prompt: |
  The totals are done; now the report. Replace each `...`: the format for money in `report_lines`, how many rows were bad, and in `write_report` the mode to open the file with and what ends each written line. Running the program should print:

  ```
  report: all checks passed
  north: 150.50
  south: 80.00
  east: 45.25
  Rows: 6
  Bad rows: 2
  Total: 275.75
  ```
hints:
  - "`:.2f` formats a number with two decimal places. The bad rows are all the rows minus the good ones: `len(rows) - len(good_rows(rows))`."
  - "`\"w\"` writes a fresh file, replacing what was there, and `write` adds nothing of its own, so each line needs `+ \"\\n\"`."
