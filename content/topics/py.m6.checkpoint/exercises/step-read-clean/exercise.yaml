id: step-read-clean
stage: fill_in
rev: 1
title: "Read the file, find the good rows"
prompt: |
  Here's the checkpoint's report tool with the reading and cleaning unfinished. Replace each `...`: what `DictReader` reads, the error a bad amount raises, what `amount_of` gives back for one, and the test `good_rows` uses. Running the program should print:

  ```
  report: all checks passed
  north: 150.50
  south: 80.00
  east: 45.25
  Rows: 6
  Bad rows: 2
  Total: 275.75
  ```
hints:
  - "`csv.DictReader` takes the open file, `f`. `float()` raises `ValueError` for text it can't convert, and an empty string counts as text it can't convert."
  - "A bad row's amount is `None`, so `good_rows` keeps the rows where `amount_of(row) is not None`."
