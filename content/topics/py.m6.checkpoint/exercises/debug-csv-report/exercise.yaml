id: debug-csv-report
stage: debug
rev: 1
title: "A report tool that loses its report"
prompt: |
  This smaller report tool should print:

  ```
  north: 150.50
  south: 80.00
  Rows: 4
  Bad rows: 1
  Total: 230.50
  ```

  and leave those five lines in `report.txt`. It has three bugs: it crashes on the bad row because it catches the wrong error; a region's total is only its last amount, not the sum; and the report file ends up holding one line. Run it, read the traceback, then check the dictionary update and the file writing against what you know about each.
test_skills:
  test_amount_of: [py.exceptions/try-except, py.reading-errors/error-kinds]
  test_totals: [py.dictionaries/lookup-update, py.accumulator-patterns/running-total]
  test_write_report: [py.files/write-file, py.files/with-block]
  test_program: [py.csv-data/dict-reader, py.decomposition/compose]
