id: debug-csv-report
stage: debug
rev: 2
title: "A report tool that loses its report"
prompt: |
  This smaller report tool writes a sample sales file, reads it, and totals each region's amounts, skipping any row whose amount isn't a number. It should print:

  ```
  north: 150.50
  south: 80.00
  Rows: 4
  Bad rows: 1
  Total: 230.50
  ```

  and leave those five lines in `report.txt`. Instead it stops with a `ValueError`. It has three bugs, and fixing one shows the next. Run it, read the traceback, then run the checks, which also look inside `report.txt`.
hints:
  - "Read the traceback from the bottom: which line raised the `ValueError`, and is it inside a `try`?"
  - "An `except` catches only the error it names. Which error does `float(\"abc\")` raise?"
  - "Once it runs, north comes out as 30.00, but its amounts are 120.50 and 30. Look at how `totals_by_region` puts an amount into the dictionary: does it add to what's already there?"
  - "`totals.get(row[\"region\"], 0) + amount` adds the amount to the region's total so far."
  - "The checks find only the last line in the file. `\"w\"` starts a file empty each time it's opened. How many times does `write_report` open it?"
test_skills:
  test_amount_of: [py.exceptions/try-except, py.reading-errors/error-kinds]
  test_totals: [py.dictionaries/lookup-update, py.accumulator-patterns/running-total]
  test_write_report: [py.files/write-file, py.files/with-block]
  test_program: [py.csv-data/dict-reader, py.decomposition/compose]
