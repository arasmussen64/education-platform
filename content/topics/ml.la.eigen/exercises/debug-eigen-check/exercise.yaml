id: debug-eigen-check
stage: debug
rev: 2
title: "Checking eigenpairs"
prompt: |
  `report(A, values, vectors)` is given a matrix and its eigenvalues and eigenvectors (the eigenvectors as the columns of `vectors`, the way `np.linalg.eig` returns them), and should check each pair and print:

  ```
  eigenvalue 2.0 check True
  eigenvalue 3.0 check True
  ```

  Instead it prints `eigenvalue 2.0 check False` twice. It has two bugs. Run it, fix what you find, and run it again.
hints:
  - "Each pass of the loop should take the `i`-th eigenvalue and the eigenvector that goes with it. Print `v` and the eigenvalue it's checked against on each pass: are they the pair you meant?"
  - "`values[0]` is the first eigenvalue on every pass. The loop's own eigenvalue is `values[i]`."
  - "`vectors[i]` is row `i`. The eigenvectors are the columns: `vectors[:, i]`."
skills: [define, compute]
