id: parsons-check-an-eigenpair
type: parsons
rev: 2
prompt: |
  Put the lines in order to check that `[0, 1]` is an eigenvector of the diagonal matrix with eigenvalue 3, printing `True`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'A, v = np.array([[2.0, 0.0], [0.0, 3.0]]), np.array([0.0, 1.0])'
  - 'Av = A @ v'
  - 'print(np.allclose(Av, 3 * v))'
distractors:
  - 'Av = A * v'
explanation: |
  The second line names the matrix and the vector at once. An eigenpair satisfies `A @ v == λ * v`: the matrix applied to the vector equals the vector scaled. Here `A @ [0, 1]` is `[0, 3]`, three times `[0, 1]`. The decoy uses `*`, elementwise multiplication, which isn't applying the matrix at all.
skills: [define]
