id: debug-a-gradient-that-fails-its-check
stage: debug
rev: 2
title: "A gradient that fails its check"
prompt: |
  The module's classes on three rows, with the gradient check: every parameter's gradient from `backward` against a central difference. The program should print:

  ```
  gradient shapes match the parameters: True | worst gap: under 1e-6
  ```

  Instead it prints the first half of the line, then stops inside the gradient check with `ValueError: operands could not be broadcast together with shapes (4,3) (3,4)`. It has two bugs, and the second shows only once the first is fixed. Run it, read the traceback, fix what you find and run it again; then run the checks, which try a deeper stack and a ReLU on its own.
hints:
  - "The failing line subtracts a parameter's numeric gradient from the one `backward` set, and they should have the same shape. Which parameter is `(3, 4)`, and which line of `backward` sets its gradient?"
  - "A weight gradient has one entry per entry of `W`, so for `W` of shape `(n_in, n_out)` it is `(n_in, n_out)` too. Which product of `self.X` and `grad_out` has that shape?"
  - "`self.dW = self.X.T @ grad_out`."
  - "Now the worst gap is too big. A ReLU passes the gradient where its input was positive. What does `ReLU.backward` test to decide that, and what did `forward` record?"
  - "Multiply by the mask the forward pass saved: `grad_out * self.mask`."
skills: [layer-backward, chain]
