id: parsons-the-backward-loop
type: parsons
rev: 1
prompt: |
  Put the lines in order to push a gradient of ones back through a ReLU and into a dense layer's weight gradient, in plain arrays, and print `[[1.0, 1.0, 1.0], [2.0, 2.0, 2.0]]`. One line is a decoy that doesn't belong.
lines:
  - 'import numpy as np'
  - 'X = np.array([[1.0, 2.0], [0.0, -1.0]])'
  - 'W1 = np.full((X.shape[1], 3), 0.5)'
  - 'h = np.maximum(X @ W1, 0.0)'
  - 'grad_h = np.ones((2, 3)) * (h > 0)'
  - 'dW1 = X.T @ grad_h'
  - 'print(dW1.tolist())'
distractors:
  - 'grad_h = np.ones((2, 3))'
explanation: |
  The forward pass comes first, because the ReLU's mask comes from it: the second row's sums are negative, so the mask zeroes that row's gradient. The chain then runs backwards: the gradient at the ReLU's output passes through the mask to become the gradient at the dense layer's output, and `X.T @ grad_h` turns it into the weight gradient, where the first row alone contributes 1 for the first input and 2 for the second. The decoy skips the mask, so the second row's gradient leaks through and its input of -1 pulls the second entries down to 1.
skills: [chain]
