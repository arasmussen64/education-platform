id: review-mcq-memory-bound
type: mcq
rev: 1
prompt: |
  A function multiplies every element of an array by 2 and is memory-bound. Which change would make it faster?
choices:
  - 'A faster processor, since the multiplications are the work'
  - 'Doing the multiplication in float64 instead of float32, so each step handles more bits'
  - 'Writing the result in place rather than into a new array, so half as many bytes move'
  - 'Splitting the array into two halves and multiplying each half twice'
answer: 2
explanation: |
  Memory-bound means the time is the bytes moved divided by the bandwidth; the processor is waiting, so a faster one changes nothing. float64 doubles the bytes and halves the speed. In place removes the write to a second block and halves the traffic. Doing the work twice is twice the traffic.
skills: [bytes-moved]
