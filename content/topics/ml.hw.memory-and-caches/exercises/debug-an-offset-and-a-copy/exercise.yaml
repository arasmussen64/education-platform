id: debug-an-offset-and-a-copy
stage: debug
rev: 2
title: "An offset and a copy"
prompt: |
  `byte_offset` should say where an element of a C-order array sits, and `clear_top_row` should zero the first row of an array in place. The program checks the offset of `[1, 2]` in a 3 by 4 float64 array against NumPy's own strides, then clears the top row. It should print:

  ```
  48 == 48
  [0. 0. 0. 0.] 4.0
  ```

  Instead the offset comes out as 40, and the first row is still `[0. 1. 2. 3.]` after clearing. It has two bugs. Work out the offset of `[1, 2]` by hand, check each function against its docstring, then run the checks, which try both functions on other shapes.
hints:
  - "Each line has its own cause. For the offset: in a C-order array of shape `(rows, cols)`, how many items do you pass to move down one row?"
  - "Moving down one row passes a whole row of `cols` items, so element `(row, col)` is `row * cols + col` items in. What does the code multiply the row by?"
  - "`clear_top_row` writes zeros into `top`. Is `top` the array's own memory, or a new array? A slice like `a[0]` is a view; `.copy()` makes a separate array."
  - "Drop the `.copy()`: writing through the view `a[0]` is what changes `a`."
skills: [layout]
