id: mcq-dot-sign
type: mcq
rev: 1
prompt: |
  Neither `u` nor `w` is the zero vector, and `u @ w` is exactly `0`. What do you know?
choices:
  - 'They point the same way'
  - 'They point opposite ways'
  - 'They are perpendicular: the angle between them is 90 degrees'
  - '`u` is longer than `w`'
answer: 2
explanation: |
  The dot product is the product of the lengths times the cosine of the angle. Neither length is zero, so the cosine is 0: the angle is 90 degrees. Same direction would give a positive product, opposite a negative one, and the dot product says nothing about which is longer.
skills: [angle]
