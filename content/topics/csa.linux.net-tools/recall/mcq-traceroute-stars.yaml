id: mcq-traceroute-stars
type: mcq
rev: 2
prompt: |
  `traceroute` to a server shows hops 1 to 6 with times, hops 7 and 8 as `* * *`, and hop 9, the destination, answering in 30 ms. What does that mean?
choices:
  - "Routers 7 and 8 are down, and the packets reach hop 9 over a backup path that traceroute can't show"
  - "Hops 7 and 8 are firewalls dropping this traffic, so the answer at hop 9 must be an old, cached one"
  - "The path loops between hops 7 and 8, and each star is a packet that went round one more time"
  - "Routers 7 and 8 don't answer traceroute's probes but do pass traffic on, as hop 9's reply proves"
answer: 3
explanation: |
  `traceroute` sends packets with increasing time-to-live and listens for each router's ICMP "time exceeded" message; a router that stays silent (many are configured to) shows as stars, which says nothing about whether it forwards traffic. The destination answering at hop 9 settles it: that reply is a fresh one, to a probe that travelled through routers 7 and 8 a moment ago.

  If those routers were down or dropping the traffic, nothing beyond them would answer, and the stars would continue to the end. There is no hidden backup path either: whatever path a probe takes, traceroute lists that path's routers. And a loop would show the same routers again and again, not silence. A run of stars that never ends, or ends before the destination, is where to look for a break, and `mtr` keeps probing so a flaky hop shows as packet loss over time.
skills: [test-tools]
