id: mcq-tcpdump-filter
type: mcq
rev: 2
prompt: |
  You want to see only the traffic between your server and one client, `198.51.100.7`, on port 443, without tcpdump turning every address into a name, and save it to open in Wireshark later. Which command?
choices:
  - "`tcpdump -nn -i eth0 -w client.pcap host 198.51.100.7 and port 443`"
  - "`tcpdump -nn -i eth0 -w client.pcap host 198.51.100.7 or port 443`"
  - "`tcpdump -nn -i eth0 host 198.51.100.7 and port 443 > client.pcap`"
  - "`tcpdump -nn -i eth0 -w client.pcap port 443 | grep 198.51.100.7`"
answer: 0
explanation: |
  The filter (`host … and port …`) is evaluated in the kernel, so only matching packets are captured and the server isn't buried; `-nn` keeps addresses and ports numeric, which is both faster and clearer; `-w` writes the raw packets in pcap format, which Wireshark reads.

  With `or` in place of `and`, the capture takes everything to or from that client on any port, plus everyone's traffic on port 443. Redirecting the output with `>` saves the printed one-line summaries as text, not the packets, so Wireshark has nothing to open. And `grep` after `-w` sees nothing, because `-w` sends the packets to the file and nothing to the pipe: the file ends up holding every client's port 443 traffic.
skills: [tcpdump]
