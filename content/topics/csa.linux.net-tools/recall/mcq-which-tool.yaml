id: mcq-which-tool
type: mcq
rev: 2
prompt: |
  From your laptop, you want to know whether a database server accepts TCP connections on port 5432 at all, before worrying about passwords or clients. Which command answers exactly that?
choices:
  - "`dig +short db.example.com`"
  - "`nc -zv db.example.com 5432`"
  - "`curl -I db.example.com:5432`"
  - "`traceroute db.example.com`"
answer: 1
explanation: |
  `nc -z` opens a TCP connection and closes it without sending anything, and `-v` reports "succeeded", "refused" or a timeout: reachability of that one port and nothing else.

  `dig` only resolves the name to an address. `curl` speaks HTTP, which a database doesn't, so its errors mix two questions: does the port answer, and does it answer in HTTP? `traceroute` shows the routers on the way to the machine and says nothing about a port; the same goes for `ping`, which is often blocked anyway. Test name, then port, then protocol, each with the tool made for it.
skills: [test-tools]
