id: net-ss-states
type: predict_shell
rev: 1
prompt: |
  `conns.txt` is the output of `ss -tan` on a web server: every TCP connection with its state in the first column. The command counts the states, most common first. What is printed? Include the padding before each count.
files:
  conns.txt: |
    State      Recv-Q Send-Q Local Address:Port    Peer Address:Port
    ESTAB      0      0        10.0.1.23:80      198.51.100.7:52114
    ESTAB      0      0        10.0.1.23:80      198.51.100.9:49822
    TIME-WAIT  0      0        10.0.1.23:80      198.51.100.7:52001
    CLOSE-WAIT 1      0        10.0.1.23:8080    10.0.1.40:38112
    ESTAB      0      0        10.0.1.23:22      203.0.113.5:61000
    TIME-WAIT  0      0        10.0.1.23:80      198.51.100.9:49790
    CLOSE-WAIT 1      0        10.0.1.23:8080    10.0.1.40:38120
    ESTAB      0      0        10.0.1.23:80      198.51.100.12:44310
    TIME-WAIT  0      0        10.0.1.23:80      198.51.100.12:44290
command: awk 'NR > 1 {print $1}' conns.txt | sort | uniq -c | sort -rn
expected_output: |2
        4 ESTAB
        3 TIME-WAIT
        2 CLOSE-WAIT
explanation: |
  Four open connections, three in `TIME-WAIT` (the normal few seconds after the server closed a connection first; harmless in this number) and two in `CLOSE-WAIT` on port 8080. `CLOSE-WAIT` means the other side closed and our program has not closed its end: with a byte still unread (`Recv-Q 1`), these look like an application that forgets to close sockets, and on a busy server they pile up until it runs out of file descriptors. `sort | uniq -c | sort -rn` is the same "which most" shape from the first topic.
skills: [sockets-ss]
