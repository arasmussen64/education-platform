id: net-tcpdump-reply-unheard
type: predict_shell
rev: 1
prompt: |
  A server, `10.0.9.1`, tries to download a file from port 8000 of `10.0.9.2`, and the download hangs. `capture.txt` is the first seven lines of `sudo tcpdump -nn -i eth1 port 8000`, run on the server while it tried. On each line the third field is the sender, with its port after the last dot, and the seventh is the TCP flags. The command counts the packets by sender and flags. What is printed? Include the padding before each count.
files:
  capture.txt: |
    21:49:58.226989 IP 10.0.9.1.39552 > 10.0.9.2.8000: Flags [S], seq 2261193196, win 64240, options [mss 1460,sackOK,TS val 2775329647 ecr 0,nop,wscale 10], length 0
    21:49:58.227038 IP 10.0.9.2.8000 > 10.0.9.1.39552: Flags [S.], seq 2443958096, ack 2261193197, win 65160, options [mss 1460,sackOK,TS val 2297099740 ecr 2775329647,nop,wscale 10], length 0
    21:49:59.230850 IP 10.0.9.1.39552 > 10.0.9.2.8000: Flags [S], seq 2261193196, win 64240, options [mss 1460,sackOK,TS val 2775330651 ecr 0,nop,wscale 10], length 0
    21:49:59.230877 IP 10.0.9.2.8000 > 10.0.9.1.39552: Flags [S.], seq 2443958096, ack 2261193197, win 65160, options [mss 1460,sackOK,TS val 2297100744 ecr 2775329647,nop,wscale 10], length 0
    21:49:59.230921 IP 10.0.9.2.8000 > 10.0.9.1.39552: Flags [S.], seq 2443958096, ack 2261193197, win 65160, options [mss 1460,sackOK,TS val 2297100744 ecr 2775329647,nop,wscale 10], length 0
    21:50:00.258794 IP 10.0.9.1.39552 > 10.0.9.2.8000: Flags [S], seq 2261193196, win 64240, options [mss 1460,sackOK,TS val 2775331679 ecr 0,nop,wscale 10], length 0
    21:50:00.258827 IP 10.0.9.2.8000 > 10.0.9.1.39552: Flags [S.], seq 2443958096, ack 2261193197, win 65160, options [mss 1460,sackOK,TS val 2297101772 ecr 2775329647,nop,wscale 10], length 0
command: awk '{print $3, $7}' capture.txt | sort | uniq -c
expected_output: |2
        3 10.0.9.1.39552 [S],
        4 10.0.9.2.8000 [S.],
explanation: |
  Three SYNs from the server, each a second after the last and each with the same `seq` number: one opening packet, sent three times. Four SYN-ACKs from port 8000, so the other machine is up, is listening, and answers every time. What never appears is the third step of the handshake, a `[.]` from the server.

  A server that had heard the SYN-ACK would acknowledge it at once, so this one isn't hearing it, although the capture shows the SYN-ACK arriving. Both are true because `tcpdump` sees an arriving packet before the machine's own firewall judges it. The reply reaches `eth1`, the `input` chain drops it, and the server's TCP, which was told nothing, sends its SYN again. That picture, answers visible on the wire and the same SYN repeated, points at this machine's own rules: here the `input` chain had no `ct state established,related accept`. Had the path or the far machine been dropping packets, the capture would show the SYNs alone.
skills: [tcpdump]
