- term: loopback
  definition: "A machine's network interface to itself, `lo`, at `127.0.0.1`. A program listening only there can be reached from that machine and nowhere else."
- term: default gateway
  definition: "The router a machine sends every packet to that no more specific route matches; the `default via` line of `ip route`."
- term: ephemeral port
  definition: "The source port the kernel picks for an outgoing connection, from a range that is 32768 to 60999 by default on Linux."
- term: three-way handshake
  definition: "How a TCP connection opens: a SYN from the client, a SYN-ACK back from the server, and an ACK from the client."
- term: connection tracking
  aliases: [conntrack]
  definition: "The kernel's record of every connection passing through the machine, which lets a firewall accept the replies to connections it already allowed."
- term: nftables
  definition: "The Linux kernel's packet filter and the `nft` command that configures it; the older `iptables` command now writes the same rules."
- term: veth pair
  definition: "A virtual network cable between two network namespaces: a packet sent into one end comes out of the other."
- term: network namespace
  definition: "A namespace that gives its processes their own interfaces, addresses, routes and ports, as if they were on a separate machine."
