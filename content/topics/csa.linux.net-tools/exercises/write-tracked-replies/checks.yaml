# The checks for "The reply that never arrives": the learner read the right
# connection out of the table, connections this machine makes get their
# replies whatever port they go to, the office still reaches only what it
# did (and the rest is dropped, not refused), the machine still talks to
# itself, and the rules are the ones the file loads at boot.
checks:
  - id: dashboard-port
    description: "~/conntrack/dashboard-port.txt holds the port, at the office's end, of the one connection the office's dashboard keeps open to the API."
    # The truth is read in the office itself: its connections to port 8080
    # that are open in two looks two seconds apart. A health check is open
    # for a few thousandths of a second, so only the dashboard's long
    # connection is in both.
    command: |
      look() {
        ip netns exec office ss -Htn state established '( dport = :8080 )' | awk '{print $3}' | sed 's/.*://' | sort
      }
      want=""
      for _ in 1 2 3 4 5 6; do
        first=$(look)
        sleep 2
        want=$(comm -12 <(echo "$first") <(look) | grep .)
        [ "$(echo "$want" | grep -c .)" = 1 ] && break
      done
      [ "$(echo "$want" | grep -c .)" = 1 ] || { echo "the dashboard has no connection open to the API"; exit 0; }
      got=$(tr -d '[:space:]' < /home/learner/conntrack/dashboard-port.txt 2>/dev/null)
      [ "$got" = "$want" ] || { echo "that is not the port the dashboard's connection comes from"; exit 0; }
      echo found
    expect:
      equals: found
  - id: replies-accepted
    description: "Connections this machine makes get their replies: the price list downloads from the office's file server, the monitoring endpoint answers, and so does an office port that no rule could have named."
    command: |
      want=$(ip netns exec office curl -s -m 3 http://127.0.0.1:8000/prices.csv)
      got=$(curl -4 -s -m 4 http://10.0.9.2:8000/prices.csv)
      [ -n "$want" ] && [ "$got" = "$want" ] || { echo "the price list does not download"; exit 0; }
      nc -z -w 3 10.0.9.2 9100 || { echo "the monitoring endpoint does not answer"; exit 0; }
      # A listener of the check's own, in the office, on a port picked now.
      port=$((7000 + RANDOM % 900))
      ip netns exec office timeout 6 nc -l "$port" > /dev/null 2>&1 &
      sleep 1
      if nc -z -w 3 10.0.9.2 "$port"; then result="replies accepted"; else result="a connection to another office port got no reply"; fi
      wait
      echo "$result"
    expect:
      equals: replies accepted
  - id: open-from-office
    description: "From the office, SSH and the API still answer, and the name server resolves shop.internal."
    command: ip netns exec office nc -z -w 3 10.0.9.1 22 && ip netns exec office nc -z -w 3 10.0.9.1 8080 && ip netns exec office dig +short +time=2 +tries=1 shop.internal
    expect:
      equals: "10.0.9.1"
  - id: dropped-silently
    description: "From the office, nothing else gets an answer for the whole timeout: the database port, unused ports low and high, and a call made from a chosen port are all dropped, not refused."
    command: |
      try() {
        start=$(date +%s%N)
        ip netns exec office nc -z -w 2 "$@" && { echo "the office reached port ${*: -1}"; exit 0; }
        ms=$(( ($(date +%s%N) - start) / 1000000 ))
        test "$ms" -ge 1500 || { echo "port ${*: -1} answered in ${ms} ms: let in or refused, not dropped"; exit 0; }
      }
      try 10.0.9.1 5432
      try 10.0.9.1 9999
      try 10.0.9.1 40000
      try -p $((7000 + RANDOM % 900)) 10.0.9.1 50505
      echo "all dropped"
    expect:
      equals: "all dropped"
  - id: untracked-dropped
    description: "From the office, a packet made to look like part of a connection that never existed gets no answer: replies get in because their connection is in the table, not because of how they look."
    # Python in the office sends one TCP packet with only the ACK flag set,
    # from port 7955 to port 9999 of this machine, and listens for a second
    # and a half. A firewall that accepts by the table drops it, since it
    # fits no tracked connection; one that accepts whatever isn't an opening
    # packet lets it in, and the kernel answers with a reset.
    command: |
      ip netns exec office python3 - <<'PY'
      import socket, struct, time

      SRC, DST, SPORT, DPORT = "10.0.9.2", "10.0.9.1", 7955, 9999


      def checksum(data):
          if len(data) % 2:
              data += b"\0"
          total = sum(struct.unpack("!%dH" % (len(data) // 2), data))
          while total >> 16:
              total = (total & 0xFFFF) + (total >> 16)
          return ~total & 0xFFFF


      def segment(flags):
          header = struct.pack("!HHLLBBHHH", SPORT, DPORT, 1000, 2000, 5 << 4, flags, 1024, 0, 0)
          pseudo = socket.inet_aton(SRC) + socket.inet_aton(DST) + struct.pack("!BBH", 0, 6, len(header))
          return header[:16] + struct.pack("!H", checksum(pseudo + header)) + header[18:]


      raw = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_TCP)
      raw.settimeout(0.3)
      raw.sendto(segment(0x10), (DST, 0))
      answered = False
      deadline = time.monotonic() + 1.5
      while time.monotonic() < deadline:
          try:
              packet = raw.recv(4096)
          except socket.timeout:
              continue
          tcp = packet[(packet[0] & 0x0F) * 4:]
          source, dest = struct.unpack("!HH", tcp[:4])
          if source == DPORT and dest == SPORT and tcp[13] & 0x04:
              answered = True
              break
      print("a reset came back: the packet was let in" if answered else "no answer")
      PY
    expect:
      equals: no answer
  - id: lo-accepted
    description: "The machine still reaches its own database on 127.0.0.1:5432 and its own name server."
    command: nc -z -w 2 127.0.0.1 5432 && dig +short +time=2 +tries=1 shop.internal
    expect:
      equals: "10.0.9.1"
  - id: persisted
    description: "/etc/nftables.conf loads the same rules that are running now, and nftables.service is enabled, so a reboot brings this firewall back."
    # As in the firewall build: the file is loaded into a throwaway network
    # namespace (each namespace has a ruleset of its own, so nothing running
    # is touched) and what it makes there is compared with the running
    # rules, counters left out. The namespace gets interfaces with this
    # machine's names, so a rule that names one still loads.
    command: |
      ns=labcheck-nft
      ip netns del $ns 2>/dev/null
      ip netns add $ns || { echo "could not make a scratch namespace"; exit 0; }
      n=0
      for link in $(ls /sys/class/net); do
        [ "$link" = lo ] || ip -n $ns link add "$link" type veth peer name "peer$n" 2>/dev/null
        n=$((n + 1))
      done
      from_file=$(ip netns exec $ns nft -f /etc/nftables.conf 2>&1 && ip netns exec $ns nft -s list ruleset)
      ip netns del $ns
      if [ "$from_file" != "$(nft -s list ruleset)" ]; then
        echo "the running rules are not the ones /etc/nftables.conf loads"
        exit 0
      fi
      systemctl is-enabled nftables
    expect:
      equals: enabled
