# The shop's names. This server runs the shop's name server (dnsmasq): it
# answers for these names and forwards everything else to the upstream
# server in upstream.conf. It listens on loopback, for this machine, and on
# the office side, for the office.
listen-address=127.0.0.1,10.0.9.1
bind-interfaces
no-resolv
host-record=shop.internal,10.0.9.1
cname=www.shop.internal,shop.internal
host-record=monitor.office.internal,10.0.9.2
