# The checks for "Build the shop server's firewall": the policy, what the
# office can and can't reach (and that what it can't is dropped, not
# refused), the machine talking to itself, replies coming back, and the
# rules surviving a reboot.
checks:
  - id: policy-drop
    description: "The input chain's policy is drop."
    command: nft list ruleset | grep -E 'hook input .*policy drop'
  - id: open-from-office
    description: "From the office, SSH and the API answer, and the name server resolves shop.internal."
    command: ip netns exec office nc -z -w 3 10.0.9.1 22 && ip netns exec office nc -z -w 3 10.0.9.1 8080 && ip netns exec office dig +short +time=2 +tries=1 shop.internal
    expect:
      equals: "10.0.9.1"
  - id: dropped-silently
    description: "From the office, the database port and an unused port get no answer at all for the whole timeout: dropped, not refused."
    command: |
      for port in 5432 9999; do
        start=$(date +%s%N)
        ip netns exec office nc -z -w 2 10.0.9.1 $port && exit 1
        ms=$(( ($(date +%s%N) - start) / 1000000 ))
        test "$ms" -ge 1500 || { echo "port $port answered in ${ms} ms: refused, not dropped"; exit 1; }
      done
      echo "both dropped"
    expect:
      equals: "both dropped"
  - id: lo-accepted
    description: "The machine still reaches its own database on 127.0.0.1:5432 and its own name server."
    command: nc -z -w 2 127.0.0.1 5432 && dig +short +time=2 +tries=1 shop.internal
    expect:
      equals: "10.0.9.1"
  - id: replies-accepted
    description: "A connection the machine makes to the office's monitoring endpoint, 10.0.9.2:9100, gets its replies through."
    command: nc -z -w 3 10.0.9.2 9100 && echo "monitor reached"
    expect:
      contains: reached
  - id: persisted
    description: "/etc/nftables.conf loads the same rules that are running now, and nftables.service is enabled, so a reboot brings this firewall back."
    # The checks above prove the running rules by what the office can and
    # can't reach. This one ties the file to them: the file is loaded into a
    # throwaway network namespace (each namespace has a ruleset of its own,
    # so nothing running is touched) and what it makes there is compared
    # with the running rules, counters left out. However a rule is spelled,
    # the two listings are the same when the file is what was loaded. The
    # namespace gets interfaces with this machine's names, so a rule that
    # names one still loads.
    command: |
      ns=labcheck-nft
      ip netns del $ns 2>/dev/null
      ip netns add $ns || { echo "could not make a scratch namespace"; exit 0; }
      n=0
      for link in $(ls /sys/class/net); do
        [ "$link" = lo ] || ip -n $ns link add "$link" type veth peer name "peer$n" 2>/dev/null
        n=$((n + 1))
      done
      from_file=$(ip netns exec $ns nft -f /etc/nftables.conf 2>&1 && ip netns exec $ns nft -s list ruleset)
      ip netns del $ns
      if [ "$from_file" != "$(nft -s list ruleset)" ]; then
        echo "the running rules are not the ones /etc/nftables.conf loads"
        exit 0
      fi
      systemctl is-enabled nftables
    expect:
      equals: enabled
