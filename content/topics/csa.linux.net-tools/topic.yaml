id: csa.linux.net-tools
kind: topic
status: draft
title: "Networking from the host"
summary: "Find out what a server is listening on and where its packets go: ip and ss, curl, dig, nc and traceroute, tcpdump for the truth on the wire, the TCP states and ephemeral ports, and the path a packet takes through nftables, connection tracking and a container's network namespace."
prerequisites: [csa.linux.shell]
estimated_minutes: 120
rev: 1
objectives:
  - "Read a host's interfaces, addresses and routes with `ip`, and say which interface and gateway a packet to a given address will use."
  - "Read `ss` output: what is listening on which address and port and by which process, the TCP states (`LISTEN`, `ESTAB`, `TIME-WAIT`, `CLOSE-WAIT`), and what ephemeral ports are."
  - "Pick the right test tool for a question, `curl`, `dig`, `nc` or `traceroute`, and read what each answers."
  - "Capture traffic with `tcpdump` and recognise a three-way handshake, a refused connection and a filter that keeps the capture small."
  - "Follow a packet through an nftables ruleset: hooks, chains, default policy and connection tracking, and through a container's network namespace and veth pair."
