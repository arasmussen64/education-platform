- term: APR
  aliases: [annual percentage rate]
  definition: "Annual percentage rate, a loan's or card's yearly rate as stated: the rate charged each period times the number of periods in a year, with no compounding counted."
- term: effective annual rate
  aliases: [EAR]
  definition: "What a year of interest really adds once compounding is counted: `(1 + apr / per_year) ** per_year - 1`. Bigger than the APR whenever interest is added more than once a year."
- term: APY
  aliases: [annual percentage yield]
  definition: "Annual percentage yield, the name US banks give a savings account's effective annual rate, compounding included."
- term: inflation
  definition: "Prices in general rising over time, so the same money buys less. Measured as the change in a price index such as the CPI."
- term: CPI
  aliases: [Consumer Price Index, CPI-U]
  definition: "The Consumer Price Index, the US Bureau of Labor Statistics' monthly measure of what a fixed basket of goods and services costs; CPI-U covers all urban consumers. Compare two dates by dividing."
- term: deflating
  definition: "Turning prices from one year into another year's money with a price index: `price * cpi[later] / cpi[earlier]`, so prices from different years can be compared."
- term: nominal return
  definition: "A return counted in dollars, before inflation is taken out: $100 that became $107 returned 7% nominal."
- term: real return
  definition: "A return counted in what money buys, after inflation: `(1 + nominal) / (1 + inflation) - 1`, roughly nominal minus inflation when both are small."
