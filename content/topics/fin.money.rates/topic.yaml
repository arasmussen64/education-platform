prove:
  build: build-effective-rate
  debug: debug-real-return-report
  explain:
    prompt: |
      A savings account pays 4% a year, and over the same year prices rise 5%. The saver says: "My money grew, so I'm richer than a year ago." In your own words, with numbers for $10,000: what does the balance grow to, what would $10,000 of last year's shopping cost now, and what is the real return, by the exact formula and by the rough one? Did the saver get richer? And what is the difference between a nominal return and a real one?
    rubric:
      - id: the-numbers
        required: true
        description: "$10,000 grows to $10,400; last year's $10,000 of shopping now costs $10,500; the balance buys less than it did."
      - id: real-return
        required: true
        description: "The real return is (1 + 0.04) / (1 + 0.05) - 1, about -0.95% a year; the rough version, 4% minus 5%, says -1%. Either way it's negative."
      - id: verdict
        required: true
        description: "The saver has more dollars but can buy less: poorer in what the money buys, by about $95 of last year's money (10,400 / 1.05 is about 9,905)."
      - id: nominal-vs-real
        required: true
        description: "A nominal return counts dollars; a real return counts what those dollars buy, after taking inflation out."
      - id: when-rough-fails
        required: false
        description: "Says the rough n - i is close when both rates are small and drifts when they're large."
    model_answer: |
      The balance grows from $10,000 to $10,400: that's the nominal return, 4%, counted in dollars. But prices rose 5%, so the shopping that cost $10,000 a year ago now costs $10,500. The saver's $10,400 doesn't cover it. The real return, which counts what the money buys, is (1 + 0.04) / (1 + 0.05) - 1 = -0.0095, about -0.95% a year. The rough rule, nominal minus inflation, gives 4% - 5% = -1%, close because both rates are small. Another way to see it: $10,400 today buys what 10,400 / 1.05 = $9,904.76 bought a year ago, about $95 less than the saver started with. So the saver is not richer. They have more dollars and less buying power. A nominal return is the change in dollars; a real return is the change in what those dollars buy, after inflation is taken out. The rough subtraction is fine for small rates, but with 50% inflation it would be badly off, and the division is the honest one.
