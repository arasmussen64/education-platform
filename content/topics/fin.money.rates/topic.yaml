# The CPI-U numbers in this topic are the US Bureau of Labor Statistics'
# series CUUR0000SA0 (All items in U.S. city average, all urban consumers,
# not seasonally adjusted), annual averages (period M13), read from the BLS
# public data API (api.bls.gov/publicAPI/v2/timeseries/data/CUUR0000SA0
# with annualaverage=true) on 2026-11-17:
#   1995 152.4, 2000 172.2, 2005 195.3, 2010 218.056, 2015 237.017,
#   2019 255.657, 2020 258.811, 2021 270.970, 2022 292.655, 2023 304.702,
#   2024 313.689, 2025 321.943.
# BLS: "everything that we publish ... is in the public domain" (its
# copyright page, read 2026-11-17); it asks to be credited as the source.
# The CFPB pages are US government works.
