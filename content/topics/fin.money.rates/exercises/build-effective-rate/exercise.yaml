id: build-effective-rate
stage: build
rev: 1
title: "Effective rates across frequencies"
prompt: |
  Starting from a blank editor, write a function `effective_annual_rate(apr, per_year)` that returns the effective annual rate, as a decimal, of an APR (a decimal: 21% is `0.21`) compounded `per_year` times a year. Then print a table for an APR of 21% compounded 1, 2, 4, 12 and 365 times a year, each rate to two decimal places as a percentage:

  ```
  1 a year: 21.00%
  2 a year: 22.10%
  4 a year: 22.71%
  12 a year: 23.14%
  365 a year: 23.36%
  ```

  The function returns an unrounded number. The checks call it with other rates and frequencies too.
skills: [effective-rate]
