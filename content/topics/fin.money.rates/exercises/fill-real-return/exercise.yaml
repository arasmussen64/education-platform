id: fill-real-return
stage: fill_in
rev: 1
title: "Taking inflation out"
prompt: |
  An investment returned 7% in a year when prices rose 3%. Replace each `...` with an operator so the program prints the real return by the exact formula, then the rough one:

  ```
  Real return: 3.88%
  Rough guess: 4.00%
  ```

  Every `...` stands for an operator, so until each one is replaced, Python can't run the program at all and shows a syntax error.
hints:
  - "The exact real return compares growth factors: how much 1 + nominal is bigger than 1 + inflation. Which operator compares them as a ratio?"
  - "The rough guess takes inflation away from the nominal return."
skills: [real-vs-nominal]
