id: debug-real-return-report
stage: debug
rev: 1
title: "A real-return report"
prompt: |
  This report takes $10,000 invested at the start of 2022 that grew 12% by 2024, and says how it did against prices, using real CPI-U yearly averages. It should print how much prices rose, what the money grew to, how much it would have needed just to keep up with prices, and the real return, by the exact formula:

  ```
  Prices rose 7.19% from 2022 to 2024.
  Your $10,000 grew to $11,200.00.
  To keep up with prices it needed $10,718.73.
  Real return: 4.49%
  ```

  Instead, the real return it prints is a negative number in the hundreds of percent, and the amount it says was needed to keep up is less than the $10,000 invested, although prices rose. It has two bugs. Run it, fix what you find, and run it again.
skills: [real-vs-nominal, deflate]
