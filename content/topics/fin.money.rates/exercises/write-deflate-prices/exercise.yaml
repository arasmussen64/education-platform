id: write-deflate-prices
stage: write
rev: 1
title: "A ticket in today's money"
prompt: |
  The starter holds real CPI-U yearly averages (BLS series `CUUR0000SA0`, read 2026-11-17) and a made-up history of a cinema ticket's price. Write a function `in_2025_dollars(price, year)` that returns a price from `year` in 2025 money, using `cpi`. Then print one line per ticket price, the price then and in 2025 money, to the cent:

  ```
  2000: $5.40 then, $10.10 in 2025 money
  2010: $7.90 then, $11.66 in 2025 money
  2020: $9.20 then, $11.44 in 2025 money
  2025: $11.00 then, $11.00 in 2025 money
  ```

  The function returns an unrounded number; round only when printing. Keep the two dictionaries as they are: the checks call your function with other prices and years from `cpi`.
hints:
  - "A price from an earlier year, in a later year's money, is the price times the later index over the earlier one."
  - "Inside the function: `return price * cpi[2025] / cpi[year]`."
  - "Loop over the ticket prices with `for year, price in tickets.items():` and print with `f\"{year}: ${price:.2f} then, ${in_2025_dollars(price, year):.2f} in 2025 money\"`."
skills: [deflate]
