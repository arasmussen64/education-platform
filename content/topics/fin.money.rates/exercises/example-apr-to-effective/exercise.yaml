id: example-apr-to-effective
stage: worked_example
rev: 1
title: "From APR to what a year really adds"
prompt: |
  A credit card charges 24% APR, compounded monthly. This program carries a $1,000 balance for a year, a month at a time, then checks the result with the formula. Press **Run**, then read how each part works.
steps:
  - label: "The rate as stated, and the rate charged"
    lines: "1-3"
    note: "A rate is a decimal in code: 24% is `0.24`. An APR is a per-period rate scaled up to a year, so the card charges `apr / per_year`, 0.02, each month."
  - label: "A year, a month at a time"
    lines: "4-6"
    note: "Each month multiplies the balance by `1 + monthly`. The second month's 2% is charged on the first month's interest too, which is compounding."
  - label: "What the year added"
    lines: "7"
    note: "The balance ends at 1.268 times where it started; taking away 1 leaves 0.268, the effective annual rate, 26.82%, not 24%."
  - label: "Printing money and rates"
    lines: "8-10"
    note: "`:.2%` multiplies by 100 and adds a percent sign. `:,.2f` puts commas between thousands and rounds to the cent; money is rounded only here, when printed."
  - label: "The formula agrees"
    lines: "11"
    note: "Twelve rounds of growth by `1 + monthly` is `(1 + monthly) ** per_year`. The loop and the formula give the same rate, and the formula works for any frequency: 365 for daily."
