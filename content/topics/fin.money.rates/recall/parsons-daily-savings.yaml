id: parsons-daily-savings
type: parsons
rev: 1
prompt: |
  A savings account pays 5% APR, compounded daily (365 times a year). Put the lines in order so the program prints its effective annual rate, `5.127%`. One line is a decoy that doesn't belong.
lines:
  - 'apr = 0.05'
  - 'daily = apr / 365'
  - 'effective = (1 + daily) ** 365 - 1'
  - 'print(f"{effective:.3%}")'
distractors:
  - 'effective = (1 + apr) ** 365 - 1'
explanation: |
  The account adds `apr / 365` each day, so the daily rate comes first. A year is 365 rounds of growth by that rate, `(1 + daily) ** 365`, and taking away 1 leaves what the year added: 5.127%. The decoy grows by the whole 5% every day, which would turn $1 into tens of millions in a year.
skills: [effective-rate]
