id: contrast-apr-or-apy
type: mcq
rev: 1
prompt: |
  Two savings accounts. Bank A advertises 4.90% APR, compounded daily. Bank B advertises 5.00% APY. Which pays more interest over a year, on the same balance?
choices:
  - 'Bank B: 5.00% is the bigger number, and both are yearly rates'
  - 'Bank A: daily compounding makes its 4.90% about 5.02% a year'
  - 'Neither: an APY is an APR with compounding, so they match'
  - 'Bank B: an APR leaves out compounding, so Bank A pays 4.90%'
answer: 1
explanation: |
  An APY already counts compounding, so Bank B pays exactly 5.00% in a year. An APR doesn't: Bank A's 4.90% is added a 365th at a time, and `(1 + 0.049 / 365) ** 365 - 1` is 5.02%. So Bank A pays a little more, though its headline number is smaller. It's true that an APY is an APR with compounding added, which is exactly why the two numbers can't be compared as they stand: turn both into effective annual rates first.
skills: [effective-rate]
