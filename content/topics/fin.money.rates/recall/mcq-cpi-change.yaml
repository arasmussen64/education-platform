id: mcq-cpi-change
type: mcq
rev: 1
prompt: |
  The yearly average of CPI-U was 172.2 in 2000 and 321.943 in 2025. Which statement is right?
choices:
  - 'Prices rose about 150% from 2000 to 2025'
  - 'Prices rose about 3.5% a year, every year'
  - 'Prices rose about 87% from 2000 to 2025'
  - 'The basket cost $321.94 in 2025'
answer: 2
explanation: |
  Divide the later index by the earlier one: 321.943 ÷ 172.2 = 1.87, so prices rose about 87%. The 150 comes from subtracting (321.943 − 172.2 = 149.7 points), and index points aren't percentages. Spreading 87% evenly over 25 years gives 3.5%, but rises compound: the steady yearly rate that gives 1.87 over 25 years is about 2.5%, and real years varied (8.0% in 2022). An index has no dollar value on its own; it only compares with itself at another date.
skills: [deflate]
