id: est-inflation-2021-2025
type: estimate
rev: 1
prompt: |
  CPI-U's yearly average was 270.970 in 2021 and 321.943 in 2025. By what percentage did prices rise from 2021 to 2025? Within 0.1 of a percentage point.
unit: "%"
answer: 18.81
tolerance: { absolute: 0.1 }
given: { cpi_2021: 270.970, cpi_2025: 321.943 }
working: (cpi_2025 / cpi_2021 - 1) * 100
mistakes:
  - id: points
    value: 50.97
    working: cpi_2025 - cpi_2021
    why: "That's the rise in index points. A percentage divides by where it started: 321.943 ÷ 270.970 − 1."
  - id: wrong-base
    value: 15.83
    working: (1 - cpi_2021 / cpi_2025) * 100
    why: "That measures the rise as a share of the 2025 level. A rise is measured from where it started, 2021."
# CPI-U, BLS series CUUR0000SA0, annual averages, read from the BLS public
# data API on 2026-11-17.
explanation: |
  321.943 ÷ 270.970 = 1.1881, so prices rose 18.81% in four years: what cost $100 in 2021 cost about $118.81 in 2025. The largest part came in 2022, the year of 8.0%.
skills: [deflate]
