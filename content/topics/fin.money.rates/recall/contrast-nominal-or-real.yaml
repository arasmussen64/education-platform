id: contrast-nominal-or-real
type: mcq
rev: 1
prompt: |
  Last year your pay went up 4%. Over the same year the CPI rose 6%. In real terms, what happened to your pay?
choices:
  - 'It went up 4%: a raise is a raise, whatever prices do'
  - 'It went up 2%: the gap between the two rates'
  - 'It fell about 1.9%: it buys less than a year ago'
  - 'It fell about 10%: the two rates add up against you'
answer: 2
explanation: |
  The nominal change is +4%, counted in dollars. The real change counts what the pay buys: `1.04 / 1.06 - 1` is −1.89%, so the same work buys about 1.9% less than a year ago. The rough rule, 4% − 6% = −2%, says nearly the same. A raise smaller than inflation is a cut in real terms. The gap between the rates is right in size but wrong in sign, and adding the rates, or ignoring prices, doesn't answer a question about buying power.
skills: [real-vs-nominal]
