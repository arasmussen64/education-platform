id: est-real-savings
type: estimate
rev: 1
prompt: |
  A savings account paid 3% over a year in which prices rose 6%. What was the real return, as a percentage, by the exact formula? Within 0.01 of a percentage point (a fall is negative).
unit: "%"
answer: -2.83
tolerance: { absolute: 0.01 }
given: { nominal: 3, inflation: 6 }
working: ((1 + nominal / 100) / (1 + inflation / 100) - 1) * 100
mistakes:
  - id: rough
    value: -3
    working: nominal - inflation
    why: "That's the rough rule, nominal minus inflation. The exact real return divides: 1.03 ÷ 1.06 − 1."
  - id: ignored-inflation
    value: 3
    working: nominal
    why: "That's the nominal return, counted in dollars. The real return takes out the 6% rise in prices."
explanation: |
  1.03 ÷ 1.06 = 0.9717, so the real return is −2.83%: the balance has 3% more dollars and buys 2.83% less. The rough rule says −3%, close because both rates are small. Savings that pay less than inflation lose buying power every year they sit.
skills: [real-vs-nominal]
