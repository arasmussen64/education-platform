id: mcq-apr-to-monthly
type: mcq
rev: 1
prompt: |
  A store card has an APR of 18%, compounded monthly. What rate does it charge on the balance each month?
choices:
  - '1.39%'
  - '1.5%'
  - '18%'
  - '0.18%'
answer: 1
explanation: |
  An APR is the monthly rate scaled up by 12, so the monthly rate is 18% ÷ 12 = 1.5%. The 1.39% is the monthly rate that would compound to exactly 18% over a year (1.0139 to the power 12 is about 1.18): that works an effective rate backwards, which isn't how an APR is split. 18% is the yearly figure, and 0.18% moves the decimal point the wrong way.
skills: [effective-rate]
