id: predict-real-return
type: predict_output
rev: 1
prompt: |
  An investment returned 12% in a year when prices rose 10%. What does the program print?
code: |
  nominal = 0.12
  inflation = 0.10
  exact = (1 + nominal) / (1 + inflation) - 1
  rough = nominal - inflation
  print(f"exact {exact:.2%}")
  print(f"rough {rough:.2%}")
expected_output: |
  exact 1.82%
  rough 2.00%
explanation: |
  `1.12 / 1.10` is 1.01818..., so the exact real return is 1.82%: the money buys 1.82% more than it did. The rough rule subtracts, 12% − 10% = 2.00%, and overstates it a little, because it forgets that the 12% gain is itself worth 10% less. With bigger rates the gap grows; with small ones it hardly shows. `:.2%` multiplies by 100 and adds the percent sign.
skills: [real-vs-nominal]
