id: typed-effective-rate-name
type: typed
rev: 1
prompt: |
  A loan quotes 12% a year, added monthly, but a year of it adds 12.68%. What is the 12.68% figure called, the yearly rate with compounding counted? Type its name or its short form.
kind: text
answers:
  - "effective annual rate"
  - "EAR"
  - "APY"
  - "annual percentage yield"
  - "effective rate"
mistakes:
  - id: apr
    answers: ["APR", "annual percentage rate"]
    why: "The APR is the 12% as stated: the monthly 1% times 12, with no compounding counted. The 12.68% is the effective annual rate."
  - id: nominal
    answers: ["nominal rate", "nominal"]
    why: "Nominal means before inflation is taken out, a different idea. The rate that counts compounding is the effective annual rate."
explanation: |
  The **effective annual rate** is `(1 + apr / per_year) ** per_year - 1`: here `1.01 ** 12 - 1`, 12.68%. For a US savings account the same figure is called the APY, annual percentage yield. The APR is the stated rate, the per-period rate times the number of periods, and leaves compounding out.
skills: [effective-rate]
