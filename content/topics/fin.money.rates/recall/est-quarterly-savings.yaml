id: est-quarterly-savings
type: estimate
rev: 1
prompt: |
  A savings account pays 6% APR, with interest added quarterly (4 times a year). What is its effective annual rate, as a percentage? Within 0.01 of a percentage point.
unit: "%"
answer: 6.14
tolerance: { absolute: 0.01 }
given: { apr: 6, per_year: 4 }
working: ((1 + apr / 100 / per_year) ** per_year - 1) * 100
mistakes:
  - id: the-apr
    value: 6
    working: apr
    why: "That's the APR. Each quarter's 1.5% earns interest in the quarters after it, so a year adds a little more than 6%."
  - id: full-rate-each-quarter
    value: 26.25
    working: ((1 + apr / 100) ** per_year - 1) * 100
    why: "That adds the whole 6% every quarter. Quarterly means a quarter of the APR each time: 1.5%."
  - id: one-quarter
    value: 1.5
    working: apr / per_year
    why: "That's one quarter's rate. A year is four of them, compounding."
explanation: |
  Each quarter adds 6% ÷ 4 = 1.5%. Four quarters: 1.015 to the power 4 is 1.06136, so the effective annual rate is 6.14%. With small rates the extra from compounding is small, here 0.14 of a point, but on a big balance over many years it adds up. A US bank would advertise this account's APY as 6.14%.
skills: [effective-rate]
