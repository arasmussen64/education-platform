id: est-real-bond
type: estimate
rev: 1
prompt: |
  A bond paid 9% interest in a year when inflation was 7%. What was its real return, as a percentage, by the exact formula? Within 0.01 of a percentage point.
unit: "%"
answer: 1.87
tolerance: { absolute: 0.01 }
given: { nominal: 9, inflation: 7 }
working: ((1 + nominal / 100) / (1 + inflation / 100) - 1) * 100
mistakes:
  - id: rough
    value: 2
    working: nominal - inflation
    why: "That's the rough rule, 9 − 7. The exact real return is 1.09 ÷ 1.07 − 1."
  - id: added
    value: 16
    working: nominal + inflation
    why: "That adds inflation to the return. Inflation takes buying power away, so it comes off."
explanation: |
  1.09 ÷ 1.07 = 1.0187, so the real return is 1.87%: after a year the money buys 1.87% more than it did. The rough rule's 2% is a little too high, because it forgets that the 9% interest is paid in dollars that are themselves worth 7% less.
skills: [real-vs-nominal]
