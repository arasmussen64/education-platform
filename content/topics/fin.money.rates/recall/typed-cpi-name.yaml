id: typed-cpi-name
type: typed
rev: 1
prompt: |
  Each month the US Bureau of Labor Statistics publishes an index of what a fixed basket of goods and services costs urban households, the usual measure of US inflation. Name it, in full or by its three-letter short form.
kind: text
answers:
  - "CPI"
  - "Consumer Price Index"
  - "CPI-U"
  - "Consumer Price Index for All Urban Consumers"
mistakes:
  - id: ppi
    answers: ["PPI", "Producer Price Index"]
    why: "The Producer Price Index tracks what producers get for what they sell, not what households pay. The household index is the CPI."
  - id: gdp
    answers: ["GDP", "gross domestic product"]
    why: "GDP measures how much an economy produces, not prices. The household price index is the CPI."
explanation: |
  The **Consumer Price Index**: CPI-U, for all urban consumers, is the version this topic reads (series `CUUR0000SA0`). It's an index, 100 for the average of 1982 to 1984, so a single value means nothing alone; inflation between two dates is the later value divided by the earlier, minus 1.
skills: [deflate]
