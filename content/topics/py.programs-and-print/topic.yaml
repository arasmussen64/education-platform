prove:
  build: build-banner
  debug: debug-boarding
  explain:
    prompt: |
      A friend ran this program:

      ```python
      print("Rise and shine!")
      print("It's a lovely day.")
      Print("Good morning")
      ```

      It printed the first two lines, then stopped with this error on line 3:

      ```
      NameError: name 'Print' is not defined
      ```

      In your own words: why did the first two lines still appear, what is the error telling your friend, and how should they fix it?
    rubric:
      - id: top-to-bottom
        required: true
        description: "Python runs the program one line at a time from the top, so the lines before the broken one had already run."
      - id: reads-error
        required: true
        description: "The error names the problem (a name Python doesn't know, Print) and the line it's on (line 3)."
      - id: fix-case
        required: true
        description: "The fix: Python takes capital letters literally, so it must be print with a small p."
      - id: syntax-errors-differ
        required: false
        description: "A syntax error is different: Python checks the whole program first, so nothing runs at all."
    model_answer: |
      Python runs a program one line at a time, starting at the top, so the first two prints had already happened when it reached line 3. The error's last line says what went wrong: NameError means Python met a name it doesn't know, here Print, and the line number shows where, line 3. Python takes capital letters literally, and the function is called print with a small p, so writing print("Good morning") fixes it.
review_pool:
  - review-mcq-syntax
  - review-predict-commas
  - review-mcq-commas
  - review-postcard
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: print-text
    description: "Show text with `print`, in quotes"
  - id: print-commas
    description: "Print several pieces of text on one line, with commas between them"
  - id: blank-lines
    description: "Print an empty line with `print()`"
  - id: read-errors
    description: "Read an error: what went wrong, and on which line"
