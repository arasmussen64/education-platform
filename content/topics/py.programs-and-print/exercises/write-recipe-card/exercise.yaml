id: write-recipe-card
stage: write
rev: 1
title: "A recipe card"
prompt: |
  Write a program that prints this recipe card, exactly:

  ```
  Pancakes

  2 eggs
  1 cup of flour
  1 cup of milk
  ```

  Every character counts, including capital letters and the blank line.
hints:
  - "Use one `print` for each line of the card."
  - "`print()` with nothing inside the parentheses makes the blank line."
  - 'The numbers are part of the text, so they go inside the quotes too, like `print("2 eggs")`.'
skills: [print-text, blank-lines]
