id: example-first-program
stage: worked_example
rev: 1
title: "Your first program"
prompt: |
  Here's a complete program, three lines long. Press **Run** to see what it prints, then read how each line works.
steps:
  - label: "Show a line of text"
    lines: "1"
    note: "`print` shows whatever is inside its parentheses. The quotes mark where the text starts and ends; they aren't shown."
  - label: "Leave a blank line"
    lines: "2"
    note: "`print()` with nothing inside prints an empty line."
  - label: "Join pieces with a space"
    lines: "3"
    note: "Separate pieces of text with commas, and `print` shows them on one line with a space between each."
