id: fill-shopping-list
stage: fill_in
rev: 1
title: "A shopping list"
prompt: |
  This program should print the shopping list below, with a blank line under the heading. Two lines are missing: replace each `...` with the code that belongs there.

  ```
  Shopping list

  apples
  bread
  milk
  ```
hints:
  - "`print()` with nothing inside the parentheses prints an empty line."
  - 'Text needs quotes around it, like `print("apples")`.'
skills: [blank-lines, print-text]
