id: mcq-read-error
type: mcq
rev: 1
prompt: |
  You run this program:

  ```python
  print("Hi!")
  print(Hello)
  print("Bye!")
  ```

  It prints `Hi!`, then stops with this error:

  ```
  Traceback (most recent call last):
    File "solution.py", line 2, in <module>
      print(Hello)
            ^^^^^
  NameError: name 'Hello' is not defined
  ```

  What went wrong?
choices:
  - 'Line 1: `Hi!` should have been printed last.'
  - 'Line 3: `print` is not allowed to show the word `Bye`.'
  - 'Line 2: `Hello` has no quotes, so Python looks for something named `Hello` and finds nothing.'
  - 'Line 2: `print` can only show text that starts with a small letter.'
answer: 2
explanation: |
  Read an error message from the bottom up. The last line says what went wrong: a `NameError` means Python met a name it doesn't know. The lines above say where: line 2, with `^^^^^` under the problem. Without quotes, `Hello` isn't text; Python treats it as a name, the way `print` is a name. Notice that `Hi!` still appeared: Python had already run line 1 before it reached the problem, and it stopped there, so `Bye!` never printed.
skills: [read-errors]
