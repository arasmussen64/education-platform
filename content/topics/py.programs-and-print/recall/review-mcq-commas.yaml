id: review-mcq-commas
type: mcq
rev: 1
prompt: |
  What does this line print?

  ```python
  print("Hi,", "Ada!")
  ```
choices:
  - '`Hi,Ada!`'
  - '`Hi Ada!`'
  - '`Hi,` on one line, then `Ada!` on the next'
  - '`Hi, Ada!`'
answer: 3
explanation: |
  A comma between two pieces of text prints them on the same line, with one space between them: `Hi, Ada!`. Look closely at the two commas. The one inside the quotes is part of the text, so it's printed. The one outside the quotes separates the pieces, so it isn't. Only a new `print` starts a new line.
skills: [print-commas]
