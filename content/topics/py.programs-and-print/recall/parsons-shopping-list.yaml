id: parsons-shopping-list
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints exactly this, top to bottom:

  ```
  Shopping list
  - eggs
  - milk
  Done
  ```

  One of the lines is a decoy that doesn't belong.
lines:
  - 'print("Shopping list")'
  - 'print("- eggs")'
  - 'print("- milk")'
  - 'print("Done")'
distractors:
  - 'Print("Done")'
explanation: |
  A program runs from the top line down, so the order of the `print` lines is the order of the output. `Print` with a capital P isn't `print`: Python would stop with a `NameError`, so that line can't be in the program.
skills: [print-text]
