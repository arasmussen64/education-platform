id: predict-four-lines
type: predict_output
rev: 1
prompt: |
  Read this program carefully. What will it print? Type each line as it would appear, leaving a line empty if you think one will be blank.
code: |
  print("one")
  print("two", "three")
  print()
  print("four")
expected_output: |
  one
  two three

  four
explanation: |
  Python runs the lines from the top, and each `print` starts a new line. A comma between two pieces of text prints them on one line with a space between them, so line 2 shows `two three`. An empty `print()` prints a blank line.
