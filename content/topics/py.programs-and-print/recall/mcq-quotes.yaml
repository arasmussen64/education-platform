id: mcq-quotes
type: mcq
rev: 1
prompt: |
  What does this program show when you run it?

  ```python
  print("Good morning")
  ```
choices:
  - '`"Good morning"`'
  - '`Good morning`'
  - '`print("Good morning")`'
  - 'An error, because the text has a space in it'
answer: 1
explanation: |
  The quotes mark where the text starts and ends, so Python knows it's text and not code. They aren't part of the text, so `print` shows just `Good morning`. A space inside the quotes is part of the text, like any letter.
