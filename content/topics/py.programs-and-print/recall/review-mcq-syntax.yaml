id: review-mcq-syntax
type: mcq
rev: 1
prompt: |
  What happens when you run this program?

  ```python
  print("Start")
  print("Middle"
  print("End")
  ```
choices:
  - 'It prints `Start`, then shows an error.'
  - 'It shows a `SyntaxError` and prints nothing at all.'
  - 'It prints `Start` and `End`, skipping the broken line.'
  - 'It prints all three lines.'
answer: 1
explanation: |
  Line 2 is missing its closing `)`. Before running anything, Python reads the whole program to check it makes sense as Python. It can't, so it stops with `SyntaxError: '(' was never closed`, and nothing runs, not even line 1. A `NameError` is different: it only happens when Python reaches that line, so the lines before it do run.
skills: [read-errors]
