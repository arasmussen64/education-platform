id: review-predict-commas
type: predict_output
rev: 1
prompt: |
  What will this program print?
code: |
  print("Name:", "Ada")
  print()
  print("Done")
expected_output: |
  Name: Ada

  Done
explanation: |
  A comma between two pieces of text prints them on one line with a space between them, so line 1 shows `Name: Ada`. `print()` on its own prints a blank line.
skills: [print-commas]
