# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: TCP
  aliases: [Transmission Control Protocol]
  definition: The transport protocol that turns IP's packets into a byte stream that arrives complete and in order, with a handshake, acknowledgements, resending and flow control.
- term: UDP
  aliases: [User Datagram Protocol]
  definition: The transport protocol that sends single datagrams and forgets them, with no handshake, acknowledgement, resending or ordering. Each one arrives whole or not at all.
- term: sequence number
  definition: The number TCP gives each byte it sends, so the receiver can put bytes in order, spot gaps and acknowledge "everything before byte N".
- term: round-trip time
  aliases: [RTT]
  definition: How long a packet takes to reach the other side and its answer to come back. One TCP connection carries at most one receive window per round trip.
- term: receive window
  definition: How many more bytes a TCP receiver says it can take, in every segment it sends. The sender may have no more than that in flight, unacknowledged.
- term: bandwidth-delay product
  aliases: [BDP]
  definition: A path's rate times its round-trip time, the bytes in flight when the path is full. One connection needs a window at least that big to fill it.
- term: keepalive
  definition: An empty TCP segment sent on a quiet connection so the other side must answer. Off unless the program switches it on; keeps idle timers on the path from firing.
- term: idle timeout
  definition: How long a NAT gateway, load balancer or stateful firewall keeps a quiet connection's record before throwing it out, after which the connection is reset or dropped.
