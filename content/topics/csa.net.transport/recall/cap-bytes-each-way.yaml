command: awk '{split($3, s, "."); bytes[s[5]] += $NF} END {for (p in bytes) print p, bytes[p]}' cap.txt | sort -n
expected_output: |
  5432 22
  53800 16
explanation: |
  app, from port 53800, sent two orders of 8 bytes each (`seq 1:9`, then `seq 9:17`): 16 bytes. The database, from 5432, sent two answers of 11 bytes each (`seq 1:12`, then `seq 12:23`): 22 bytes. The numbers count bytes from the start of the conversation, so each side's last `seq` and the other side's `ack` agree: the database's `ack 17` means "I have everything before byte 17".

  Everything else carries nothing: the handshake, the acknowledgements, the goodbye, and the three pairs of empty segments 5 seconds apart during the quiet. Those are keepalive probes, app's `ack 12` sent again with no data, each answered by the database's `ack 9`. A FIN carries no data either, but it counts as one in the numbering, which is why the last acknowledgements are `ack 18` and `ack 24`. `split($3, s, ".")` cuts `10.0.1.10.53800` at its dots, and the fifth part is the port; `$NF` is the line's last field.
skills: [read-a-capture]
