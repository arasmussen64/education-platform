id: cap-bytes-each-way
type: predict_shell
rev: 1
prompt: |
  `cap.txt` is a capture on app's `eth1` in the lab "Read the conversation" (captured 2026-11-12 with `tcpdump -nn`): shop-api's connection to the database (10.0.2.20, port 5432) from its first SYN to its goodbye, with an order, 16 seconds of quiet, and another order. The last number on each line is the segment's length: the bytes of data it carries. The command adds up the bytes each side sent, keyed by the sender's port (the fifth dot-separated part of the third column), and sorts them. What is printed?
