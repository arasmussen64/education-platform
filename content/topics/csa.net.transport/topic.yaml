prove:
  build: build-quiet-path
  debug: debug-slow-replication
  explain:
    prompt: |
      A company moved an app from its data centre to a cloud, and two things broke. The first database query after a quiet lunch hour fails with "Connection reset by peer", and a nightly copy to another region runs at a tenth of the link's speed. Explain, in your own words: how you'd read a capture of the database connection to find out who sent the reset, and how a box in the middle can send one that looks like the database's; why quiet connections get cut in a cloud, what the NAT gateways or load balancers of two clouds do by default, and how keepalives fix it, including what has to be true of the application for the system's keepalive setting to matter; how the receive window and window scaling limit one connection over a long path, with the bandwidth-delay product worked out for an example of your own; and, if you can, how a UDP flow through the same NAT differs.
    rubric:
      - id: capture
        required: true
        description: "A capture shows the SYNs' options (MSS, SACK, timestamps, window scale), the data counted by seq and ack, and how the connection ends: FIN is a goodbye, RST a slammed door; the reset's TTL (tcpdump -v) tells who made it: one that arrives with a higher TTL than the server's own packets started closer, at a box in the middle that forgot the connection and answered in the server's name."
      - id: idle-cuts
        required: true
        description: "Every stateful box on the path (NAT gateway, load balancer, firewall connection tracking) keeps a record of each connection and forgets one that stays quiet past its idle timer; the endpoints aren't told, and the next packet meets either a reset or a silent drop that ends in a timeout."
      - id: keepalive-fix
        required: true
        description: "TCP keepalives that come sooner than the smallest idle timer on the path (both the idle time and the interval between probes); the application must switch keepalive on for its socket, or the system's setting does nothing; the setting is kept in a file so it survives a reboot; behind a proxy (a layer 7 load balancer), an application heartbeat of real data, since TCP probes stop at the proxy."
      - id: window
        required: true
        description: "One connection carries at most one receive window per round trip, so throughput is at most window ÷ RTT; the path needs a window of at least the bandwidth-delay product, rate × RTT, worked with numbers; without window scaling the window stops at 65,535 bytes; a box that strips the option from the SYNs (seen by comparing captures on both sides) or a capped receive buffer caps the connection."
      - id: clouds-differ
        required: true
        description: "Two correct cloud defaults and what they do: AWS's NAT gateway forgets after 350 seconds and resets the inside end; Azure's load balancer forgets after 4 minutes and drops silently unless TCP reset on idle is on, and its NAT gateway after 4 minutes; Google Cloud NAT keeps an established TCP connection 20 minutes and a UDP mapping 30 seconds."
      - id: udp
        required: false
        description: "UDP has no connection, so boxes give its flows short timers (30 seconds is common) and drop pushes for a mapping they've forgotten; a client that waits for pushes sends keepalive datagrams of its own."
    model_answer: |
      To find who sent the reset I'd capture the database connection with tcpdump -nn -v on the app server. The SYN and SYN-ACK show what each side offered: mss 1460, sackOK, timestamps and wscale 10. Then the data, counted by seq and ack: ack 9 means "I have everything before byte 9". A connection that ends with FINs said goodbye; this one ended with an [R], a reset, the slammed door, answering the first query after lunch. With -v every packet shows its TTL. If the database's packets arrive with ttl 63, one router away, and the reset arrives with ttl 64, the reset was made one hop closer: the NAT gateway forgot the connection and answered in the database's name.

      Quiet connections get cut because every stateful box on the path keeps a record of each connection and throws out records that stay quiet too long, without telling either end. AWS's NAT gateway forgets after 350 seconds and then resets the inside end when it sends; Azure's load balancer forgets after 4 minutes and by default drops the packets silently, so the app hangs until its own timeout, unless TCP reset on idle is turned on. Linux's keepalive starts after two hours, far too late. The fix is TCP keepalives that come sooner than the smallest timer on the path, say a first probe after 240 seconds and the gap between probes below it too. The system's tcp_keepalive_time only applies to sockets whose program switched keepalive on, so the database driver has to ask for it, and the setting goes in /etc/sysctl.d or the app's config so it survives a reboot. Behind a proxy like an Application Load Balancer the probes stop at the proxy, so the app needs a heartbeat of real data.

      The nightly copy is one connection, and it can only have one receive window in flight per round trip: throughput is at most window divided by RTT. For a 100 Mbit/s link with an 80 ms round trip the path holds 100,000,000 ÷ 8 × 0.08 = 1,000,000 bytes, the bandwidth-delay product, so the window must reach a megabyte. Without window scaling it stops at 65,535 bytes, which over 80 ms is 6.5 Mbit/s. If the SYN leaving the server says wscale but the same SYN arriving at the far end doesn't, a firewall in between is stripping the option; a receiver whose buffers are capped would hold it down too.

      UDP through the same NAT has no connection at all, so the NAT keeps its mapping only a short time, 30 seconds on Google Cloud NAT, and a client waiting for pushes has to send small keepalive datagrams to keep it.
