skills:
  - id: read-a-capture
    description: "Read a TCP conversation in `tcpdump -nn` text: the SYN's options (`mss`, `sackOK`, `TS`, `wscale`), `seq` and `ack` as byte counts, data and its acknowledgement, the FIN exchange and who closed first, a reset against a goodbye, keepalive probes, and a reset forged by a box in the middle, found with `-v` by its TTL; comparing the same SYN on both sides of a box"
  - id: window-math
    description: "Flow control and the receive window; window scaling (a shift count in the SYNs only, both sides must offer it, and a box that strips it caps the window at 65,535 bytes); the bandwidth-delay product; throughput at most window ÷ RTT; the window field times 2 to the shift"
  - id: tcp-timers
    description: "How long TCP waits and what the application hears: a refused connection (at once), a connection attempt to a silent host (about 2 minutes on Linux), data nobody acknowledges (about 15 minutes), an idle connection with keepalive off (never), keepalive's defaults (2 hours, then 9 probes 75 seconds apart) and how long a dead peer takes to notice; why applications set shorter connect and read timeouts"
  - id: idle-cuts
    description: "Why quiet connections get cut: stateful boxes' idle timers and the three clouds' defaults; the two symptoms (a reset, or a silent drop ending in a timeout); keepalives sooner than the smallest timer on the path (idle time and interval both), switched on by the application, with the socket's timers or the system's, kept after a reboot; heartbeats where a proxy sits in the path; what raising a box's timer costs"
  - id: udp-behaviour
    description: "UDP's datagrams, with no handshake, acknowledgement, resending or order; a closed port answers with ICMP port unreachable, a firewall drop answers nothing, and `nc -u` can't tell them apart; boxes' short UDP timers; keepalive datagrams for a client that waits for pushes; when UDP is the right choice"
