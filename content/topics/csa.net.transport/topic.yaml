id: csa.net.transport
kind: topic
status: ready
title: TCP and UDP
summary: "Read a TCP conversation in a capture, from the settings its SYN offers to the goodbye or the slammed door; work out what one connection can carry over a long path, and why window scaling matters; know how long TCP waits before it gives up; keep quiet connections alive through the clouds' NAT gateways, load balancers and firewalls; and see how UDP differs."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 28) and its designer's brief (csa.net.transport.md). Through
# csa.net.nat this builds on csa.net.routing (sysctl and /etc/sysctl.d,
# stateful firewalls), csa.net.cidr and csa.net.layers (TTL, ICMP, MTU and
# MSS, the network labs' machines, on, netlab), and csa.m1.checkpoint; for
# the writer, Module 1's net-tools (tcpdump's flags, ss and its states,
# TIME-WAIT, ephemeral ports, nftables and ct state, conntrack). From
# csa.net.nat it uses NAT, masquerading, the managed NAT gateways, SNAT
# ports and a NAT's idle timeout. It defines load balancer, security group
# and connection pool in a sentence each (the plan's section 3.7).
prerequisites: [csa.net.nat]
# Worked out: the lesson about 25 minutes (3,200 words at 130 a minute),
# reading 45 (HPBN's two chapters' sections 20, Cloudflare's post 12, the
# three cloud pages 10, the kernel's and tcp(7)'s entries 3), 23 recall
# items at 1.5 each 35, then the worked example 30, the fill-in 25, the
# write 35, the build 50, the debug 45 and the explain 20: 310, less the
# overlap of the labs' reading with the lesson's: 300.
estimated_minutes: 300
rev: 1
objectives:
  - "Read a TCP conversation in `tcpdump` output: the settings each SYN offers (MSS, SACK, timestamps, window scale), bytes counted by `seq` and `ack`, the goodbye and who said it first, a reset against a goodbye, keepalive probes, and a reset forged by a box in the middle, told apart by its TTL."
  - "Explain flow control and the receive window, why window scaling exists and what a box that strips it does to a long path; work out a path's bandwidth-delay product and the most one connection can carry with a given window."
  - "Say how long TCP waits before it gives up (a connection attempt, data nobody acknowledges, an idle connection), what the application is told each time, and why applications set shorter timeouts of their own."
  - "Explain why quiet connections get cut in a cloud, name the three clouds' timers and what each box does when it forgets a connection, and fix it with keepalives that come sooner than the smallest timer on the path, switched on by the application and kept after a reboot."
  - "Explain what UDP does and doesn't do, what a closed port and a firewall drop look like, why boxes give UDP short timers, and how a client that waits for pushes keeps its NAT mapping alive."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - Linux: tcp_keepalive_time "Default: 2hours", tcp_keepalive_probes 9,
#   tcp_keepalive_intvl "75sec i.e. connection will be aborted after ~11
#   minutes of retries"; tcp_syn_retries 6, "the final timeout for an active
#   TCP connection attempt will happen after 131seconds"; tcp_retries2 15
#   "yields a hypothetical timeout of 924.6 seconds and is a lower bound";
#   tcp_window_scaling on; tcp_rmem's default 131072 and maximum "between
#   131072 and 32MB, depending on RAM size"; ip_local_port_range 32768 to
#   60999: https://docs.kernel.org/networking/ip-sysctl.html
# - tcp(7), man-pages 6.19 (2026-04-19): "Keep-alives are sent only when the
#   SO_KEEPALIVE socket option is enabled"; TCP_KEEPIDLE, TCP_KEEPINTVL,
#   TCP_KEEPCNT per socket: https://man7.org/linux/man-pages/man7/tcp.7.html
# - ss(8): -o prints timer:(<timer_name>,<expire_time>,<retrans>), names on,
#   keepalive, timewait, persist, unknown; -i prints wscale and rtt in ms:
#   https://man7.org/linux/man-pages/man8/ss.8.html
# - RFC 9293 section 3.8.4: keep-alives are optional, off by default for each
#   connection, sent only after an interval that defaults to no less than two
#   hours, and one missing answer doesn't mean a dead connection; the window
#   field is 16 bits: https://www.rfc-editor.org/rfc/rfc9293.html
# - RFC 7323 section 2: the window scale option is sent only in a SYN, both
#   sides must send it, the shift is at most 14 (windows of 2^30 = 1 GiB),
#   otherwise both shifts are zero: https://www.rfc-editor.org/rfc/rfc7323.html
# - RFC 9000 section 10.1.2: "sending packets every 30 seconds is necessary
#   to prevent the majority of middleboxes from losing state" for UDP flows:
#   https://www.rfc-editor.org/rfc/rfc9000.html
# - AWS NAT gateway: a connection idle for 350 seconds or more times out, and
#   the gateway "returns an RST packet to any resources behind the NAT
#   gateway that attempt to continue the connection (it does not send a FIN
#   packet)"; fix with traffic or keepalive under 350 seconds:
#   https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-troubleshooting.html
# - AWS Network Load Balancer: TCP idle timeout 350 s by default, 60 to 6,000;
#   TLS listeners 350 s, can't be modified; on Nitro v6 instances the
#   network interface's connection tracking defaults to 350 s, and a
#   mismatch "causes the target's network interface to silently drop
#   connection state":
#   https://docs.aws.amazon.com/elasticloadbalancing/latest/network/update-idle-timeout.html
# - AWS Application Load Balancer: idle timeout 60 s by default, 1 to 4,000;
#   "Application Load Balancers do not support HTTP/2 PING frames. These do
#   not reset the connection idle timeout"; send at least 1 byte of data:
#   https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-load-balancer-attributes.html
# - AWS security groups' connection tracking: TCP established 350 s on Nitro
#   v6 instance types, 432,000 s (5 days) on others, 60 to 432,000; UDP 30 s,
#   UDP stream 180 s; "configure TCP keep alives to be sent at intervals of
#   less than 5 minutes":
#   https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-connection-tracking.html
# - AWS's networking blog, 22 May 2026 (Lehwess and Pangle): Nitro V6 moved
#   connection tracking from 432,000 s to 350 s; tcp_keepalive_time 240,
#   intvl 60, probes 3; pools with maxIdleTime and maxLifetime; PostgreSQL's
#   tcp_keepalives_* settings, Redis's tcp-keepalive default 300 s:
#   https://aws.amazon.com/blogs/networking-and-content-delivery/best-practices-for-tcp-connection-management-on-ec2/
# - Azure Load Balancer: by default it silently drops a flow at its idle
#   timeout; TCP reset on idle sends resets both ways; 4 to 100 minutes for
#   load-balancing and inbound NAT rules, 4 to 120 for outbound rules, 4 by
#   default; application-layer keepalives where a proxy is in the path;
#   keepalives not for mobile apps (ms.date 2024-07-31, updated 2026-08-19):
#   https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset
# - Azure NAT Gateway: TCP idle timeout 4 minutes by default, 4 to 120; UDP 4
#   minutes, not configurable; a TCP reset for traffic on a flow that no
#   longer exists; raising the timer holds SNAT ports longer, not
#   recommended; "TCP keepalives appear as duplicate acknowledgements
#   (ACKs)"; UDP keepalives needed on both sides; "These timer settings are
#   subject to change" (ms.date 2025-11-04, updated 2026-10-13):
#   https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
# - Azure Front Door: "a 90-second HTTP keep-alive timeout", not
#   configurable (ms.date 2026-11-02, updated 2026-11-11):
#   https://learn.microsoft.com/en-us/azure/frontdoor/front-door-faq
# - Google Cloud NAT defaults: UDP mapping 30 s, TCP established 1,200 s (20
#   minutes), TCP transitory 30 s, all configurable; "Timeout processing has a
#   variance of up to five seconds":
#   https://docs.cloud.google.com/nat/docs/tune-nat-configuration
# - Google Cloud VPC firewall rules: "A firewall rule's tracking state is
#   considered active if at least one packet is sent every 10 minutes":
#   https://docs.cloud.google.com/firewall/docs/firewalls
# - Google Cloud's global external Application Load Balancer: client HTTP
#   keepalive 610 s by default, 5 to 1,200; backend keepalive "fixed at 10
#   minutes (600 seconds)":
#   https://docs.cloud.google.com/load-balancing/docs/https/request-distribution
# Measured in this topic's labs on 2026-11-12 (Docker Desktop 29.8.2, kernel
# 6.18.33.2-microsoft-standard-WSL2): one connection over the lab's 50
# Mbit/s link with 50 ms each way, 42 to 44 Mbit/s; with window scaling off
# at the receiver or stripped by a firewall, 4.8 to 5.0; with the receiver's
# tcp_rmem capped at 174,760 bytes, 9.45. A reset forged by the NAT gateway
# arrives with ttl 64 where the database's packets arrive with 63. After an
# answered keepalive probe the next comes after the interval: with 5 s idle
# and the default 75 s interval, one probe crossed a 15-second gateway and
# the connection was cut. Every output marked "captured" is real output of
# these labs that day; times and ports will differ in a new run.
#
# Linked, never copied. Licences, each read on 2026-11-12: High Performance
