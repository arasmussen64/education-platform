#!/usr/sbin/nft -f
# nat: the cloud's NAT gateway (scenery; it stands for the managed one, and
# behaves as AWS documents its own: a connection idle for too long is
# forgotten, and anything sent on it afterwards is answered with a reset).
# The shop's machines may go out, their address translated to nat's own;
# nothing new comes in. A connection is new only when it starts with a SYN:
# any other packet nat has no record of is answered with a reset.
flush ruleset

table inet gateway {
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname "inside" tcp flags & (syn | ack) == syn ct state new accept
        iifname "inside" meta l4proto udp ct state new accept
        iifname "inside" meta l4proto tcp reject with tcp reset
    }
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "outside" masquerade
    }
}
