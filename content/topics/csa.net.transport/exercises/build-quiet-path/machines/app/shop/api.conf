# shop-api's settings, read when it starts (sudo systemctl restart shop-api@app).
# Lines are "name = value"; a later line for the same name wins.

# The orders database, through the NAT gateway.
db_host = 10.0.2.20
db_port = 5432
# How long an order waits for the database's answer, in seconds.
db_query_timeout = 5
# on: keep one connection open and send every order over it.
# off: open a new connection for each order, and close it afterwards.
db_pool = on

# TCP keepalive on the database connection: on or off. With it on, these
# three set the connection's own timers (TCP_KEEPIDLE, TCP_KEEPINTVL,
# TCP_KEEPCNT); a line left out falls back to the system's
# net.ipv4.tcp_keepalive_* settings.
db_keepalive = off
# db_keepalive_idle = seconds of quiet before the first probe
# db_keepalive_interval = seconds between unanswered probes
# db_keepalive_count = unanswered probes before the connection is given up

# The standby database, which GET /health/standby tries to connect to.
standby_host = 10.0.2.21
standby_port = 5432
# How long to wait for the standby to answer a connection, in seconds. Left
# out, the wait is as long as the system's SYN retries last.
# standby_connect_timeout = seconds
