#!/usr/sbin/nft -f
# supplier: the supplier's own firewall (scenery). New connections to its
# stock API, port 6000, start with a SYN; after that only packets of a
# connection the firewall remembers get in. Anything else is dropped
# without an answer, including a packet of a connection it has forgotten.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        tcp dport 6000 tcp flags & (syn | ack) == syn ct state new accept
        icmp type echo-request accept
    }
}
