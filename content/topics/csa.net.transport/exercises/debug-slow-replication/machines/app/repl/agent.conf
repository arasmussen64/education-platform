# repl-agent's settings, read when it starts (sudo systemctl restart repl-agent@app).
# Lines are "name = value"; a later line for the same name wins.

# The DR site's status API.
status = 10.0.6.20:8443
# How long a status check waits for the answer, in seconds.
timeout = 4
# TCP keepalive on the status connection: on or off. repl-agent only
# switches it on or off; the timers are the system's
# (net.ipv4.tcp_keepalive_time, _intvl and _probes).
keepalive = on
