id: csa.hw.windows-licensing
kind: topic
status: ready
title: "Windows licensing in the cloud"
summary: "How Windows Server and SQL Server are licensed in the cloud: counting core licences with their minimums, what licence-included prices add by the vCPU, when a company may bring licences it owns to Azure, AWS or Google Cloud, when a dedicated host is the cheaper choice, how the SQL Server edition and core count set most of the bill, and where to check a rule or a price on the day."
# Module 2's plan (docs/plans/cloud-module-2/MODULE-2-BRIEF.md, sections 2
# and 4.22): this topic builds on Hypervisors (a host shared with other
# customers' VMs; dedicated hosts and sole-tenant nodes) and on Cores, memory
# and noisy neighbours (vCPU against physical core, on-demand prices, a region,
# a month of 730 hours). Shell essentials and Scripting in bash (awk over a
# CSV, a script with arguments) come through Checkpoint 1.
prerequisites: [csa.hw.hypervisors, csa.hw.cores-memory]
# Counted: the lesson, about 3,400 words, 26; the reading the lesson asks for
# 55 (the main resource's Azure parts and FAQ, about 1,300 words, 10; AWS's
# licensing guidance, its "License included options" and "BYOL options",
# about 2,000 words, 15; Google's page, 1,233 words, 10; four sections of the
# SQL Server licensing guidance, about 700 words, 6; AWS's dedicated-hosts
# guide to the end of "Homogeneous Dedicated Hosts", about 800 words, 6;
# Windows Server's pricing page 3; SQL Server 2025's editions table and scale
# limits, about 500 words, 5); the 26 quick questions of the practice ladder
# at a minute and a half each, 39; the worked example 25; the fill-in 25; the
# write 35; the build 50; the debug 35; the explain 20.
estimated_minutes: 310
rev: 1
objectives:
  - "Count the Windows Server and SQL Server core licences a VM, a physical server or a whole estate needs, with the minimums (8 a VM, 8 a processor and 16 a server for Windows Server; 4 a VM or processor for SQL Server) and the packs they are sold in."
  - "Work out what licence-included Windows Server and SQL Server add to a VM's price per vCPU-hour, and how much of a bill is licence rather than machine."
  - "Decide whether licences a company owns may be used on Azure, AWS or Google Cloud, on shared or dedicated hardware, from the product, its Software Assurance and the cloud: Azure Hybrid Benefit, License Mobility and the October 2019 rule for Listed Providers."
  - "Price a dedicated host or sole-tenant node against shared VMs, find from how many VMs it is cheaper, and say how licensing its physical cores changes the licence count."
  - "Choose the SQL Server edition and core count that fit a database, and cut the bill by licensing fewer cores."
  - "Find the page that settles a licensing rule or a price, and tell a rule that has held from a number that will have moved."
# Facts, each read on the day (2026-11-11) unless said otherwise, with where.
# Licensing rules are as Microsoft's Product Terms stood on that day.
# - Windows Server, Product Terms
#   (https://www.microsoft.com/licensing/terms/productoffering/WindowsServerStandardDatacenterEssentials/EAEAS):
#   licences "equals the number of Physical Cores on the Licensed Server,
#   subject to a minimum of 8 Licenses per Physical Processor and a minimum of
#   16 Licenses per Server"; Standard "two OSEs", Datacenter "any number of
#   OSEs". The page's licensing-by-VM section (8 a Virtual OSE, Software
#   Assurance or subscription only) didn't load on the 11th; the designer read
#   it on 2026-11-10, and the same 8 a VM is in the Microsoft Azure entry below.
# - Microsoft Azure, Product Terms
#   (https://www.microsoft.com/licensing/terms/productoffering/MicrosoftAzure/EAEAS),
#   "Azure Hybrid Benefit": "The minimum number of core licenses required per
#   VM is 8"; a processor licence is 16 core licences; Datacenter on "all
#   Physical Cores available to Customer on a Dedicated Host" runs unlimited
#   VMs; migration allowance 180 days for Standard, "indefinitely" for
#   Datacenter by VM, 180 days for dedicated-host licensing; licences once
#   allocated can't be used elsewhere, and after at least 90 days may be taken
#   back; SQL Server: an Enterprise core licence covers 1 vCPU of an
#   Enterprise VM or 4 of a Standard VM, a Standard one 1 vCPU of a Standard
#   VM, "Subject to a minimum of four Core Licenses per Virtual Machine";
#   Enterprise on all of a dedicated host's physical cores, unlimited VMs.
# - Microsoft Learn, "Azure Hybrid Benefit for Windows Server" (ms.date
#   2025-09-03): Software Assurance or subscription; "the base compute rate
#   is equal to the Linux rate"; 8 core licences a VM with the 4- and 12-core
#   examples; "can run only during the Software Assurance or subscription
#   license term"; "The Microsoft Product Terms for your program take
#   precedent over this article". "Explore Azure Hybrid Benefit for Windows
#   VMs" (ms.date 2024-12-02): changing the licence type "changes a metadata
#   licensing flag only", no restart. Azure's "Virtual Machine Licensing FAQ":
#   "Windows Server CALs are not required for accessing Windows Server running
#   in the Azure environment".
# - SQL Server, Product Terms
#   (https://www.microsoft.com/licensing/terms/productoffering/SQLServer/EAEAS):
#   physical cores, "a minimum of four Licenses per Physical Processor"; by
#   virtual OSE, subscription or Software Assurance only; 2-packs of core
#   licences. Microsoft's SQL Server licensing guidance
#   (https://www.microsoft.com/licensing/guidance/SQL): "sold in packs of
#   two-core licenses", "a minimum of four licenses per virtual OSE",
#   "License Mobility is available with Software Assurance only".
# - SQL Server 2025 editions (Microsoft Learn, ms.date 2025-11-19): Enterprise,
#   Standard, Enterprise Developer, Standard Developer, Evaluation, Express;
#   Developer "not as a production server"; Standard "lesser of 4 sockets or
#   32 cores" (24 in 2022 and earlier), 256 GB buffer pool; Express 1 socket
#   or 4 cores, 1,410 MB, 50 GB a database.
# - Listed Providers (https://www.microsoft.com/licensing/docs/view/Listed-Providers
#   and its October 2019 document, a .docx): "Beginning October 1, 2019,
#   on-premises licenses purchased without Software Assurance and mobility
#   rights cannot be deployed with dedicated hosted cloud services offered by
#   Listed Providers"; Alibaba, Amazon, Google, Microsoft; "This list is
#   subject to change". (AWS's guidance names three, without Microsoft; this
#   topic uses Microsoft's own list.)
# - AWS, "Microsoft licensing on AWS": License Mobility products with active
#   Software Assurance "on shared or dedicated tenant environments"; SQL
#   Server "licensed per vCPU on shared-tenancy (default) EC2 instances, with
#   a minimum ... of four vCPUs per EC2 instance"; Windows Server has no
#   License Mobility "even if the licenses have SA"; the four conditions
#   (perpetual, bought before 1 October 2019 or in an Enterprise Agreement
#   term begun before it, a version available before it, dedicated
#   infrastructure); "you must license all physical cores (not vCPUs) of the
#   host"; Datacenter on all cores, as many instances as fit; Standard, two,
#   stackable. AWS's FAQ (https://aws.amazon.com/windows/faq/): "Windows
#   Server 2022 is not eligible for BYOL", likewise 2025; SQL Server without
#   Software Assurance on Dedicated Hosts "must be version 2017 or earlier";
#   "no need to buy additional Windows Server CALs".
# - AWS rates per vCPU-hour, "Optimize CPUs for License-Included instances":
#   Windows Server $0.046, with SQL Server Standard $0.166, Enterprise
#   $0.421, Web $0.063. AWS's M6i host: "two sockets, 64 physical cores",
#   at most 32 m6i.xlarge (the dedicated-hosts guide); M7i: 2 sockets, 96
#   cores, 48 m7i.xlarge (the Dedicated Hosts pricing page's table).
# - Google Cloud, "Microsoft Licensing on Google Cloud" (last updated
#   2026-11-10): Windows Server "typically not eligible for BYOL using
#   License Mobility", SQL Server and SharePoint "typically eligible"; the
#   outsourcing conditions (a version released before 1 October 2019,
#   "Windows Server 2022 is not eligible", acquired under an enrolment
#   effective before it, sole-tenant nodes only); 90 days in a region.
#   "Disk and image pricing": Windows Server $0.046 per visible vCPU ($0.023
#   on f1-micro and g1-small); SQL Server Enterprise $0.399, Standard $0.1200,
#   Web $0.011 per core-hour, Express free, "a four core minimum". "Sole-tenant
#   pricing": "a sole-tenancy premium, which is 10%".
# - Azure dedicated hosts: "Users are charged per dedicated host, regardless
#   how many VMs are deployed"; a host's size or type can't change once
#   provisioned (overview, ms.date 2026-09-25). Dasv5-Type1: 64 physical
#   cores, 112 vCPUs, at most 28 D4as v5; Dsv6-Type1: 96 physical cores,
#   192 vCPUs, at most 32 D4s v6 and 25 D8s v6 (general-purpose host SKUs,
#   ms.date 2026-09-25). The plan's price fixture lists the Dsv6 host as 48 x
#   D4s_v6, which Microsoft's packing table contradicts; nothing here uses it.
#   Azure Dedicated Host's product page and pricing page, their FAQ
#   (https://azure.microsoft.com/en-us/products/virtual-machines/dedicated-host/
#   and https://azure.microsoft.com/en-us/pricing/details/virtual-machines/dedicated-host/,
#   read 2026-11-11 by the topic's reviewer): "The outsourcing software
#   licensing terms applicable to Windows Server and SQL Server licenses
#   acquired before October 1, 2019, allow you to allocate your existing
#   licenses to Dedicated Host"; newer licences only through Azure Hybrid
#   Benefit; Windows Server licences bought before that date and allocated
#   without the benefit "must license all of the physical cores of the host".
# - Prices: AWS's public price files for US East (N. Virginia), on-demand
#   (published 2026-11-10T17:38:52Z, read 2026-11-11), instances and Dedicated
#   Hosts; the Azure Retail Prices API for East US, pay-as-you-go, read
#   2026-11-11 (VMs, dedicated hosts, the SQL Server licence meters);
#   Microsoft's Windows Server 2025 pricing page ($1,176 and $6,771 for 16
#   core licences; $33.58 a core a month or $0.046 an hour through Azure
#   Arc) and SQL Server 2025 price sheet (a PDF dated 2025-11-03: Enterprise
#   $15,123 and Standard $3,945 a 2-core pack). Every question carries its
#   own dated table.
# Linked, never copied. Licences as each source states them, read
# 2026-11-11: Microsoft Learn's pages are CC BY 4.0 (the LICENSE of
# MicrosoftDocs/windowsserverdocs and of MicrosoftDocs/sql-docs);
# microsoft.com's licensing and pricing pages and azure.microsoft.com are
# copyright Microsoft; AWS's documentation is copyright Amazon Web Services;
# Google Cloud's pages are CC BY 4.0 (each page's footer); the video is on
# YouTube under its standard licence.
