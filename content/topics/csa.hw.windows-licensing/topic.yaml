prove:
  build: build-price-the-estate
  debug: debug-the-quote
  explain:
    prompt: |
      A company runs 40 Windows Server VMs and 6 SQL Server VMs in its own data centre. Half the licences have Software Assurance. One vendor says "bring your licences to any cloud"; another says "you'll need dedicated hosts". In your own words: what decides the licence bill for these servers on Azure, on AWS and on Google Cloud; when the company may use the licences it owns, and where; when a dedicated host would be the cheaper choice; and what you would check, and where, before anyone signs.
    rubric:
      - id: per-core
        required: true
        description: "Licences are counted in cores, with minimums: at least 8 core licences for a Windows Server VM (8 a processor and 16 a server on hardware the company licenses itself), at least 4 for SQL Server; licence included is paid per vCPU-hour on every cloud, and SQL Server costs several times what Windows Server does."
      - id: who-may-bring
        required: true
        description: "Software Assurance (or a subscription) is what lets a licence move. Azure takes Windows Server and SQL Server through Azure Hybrid Benefit, paying the Linux price. On AWS and Google Cloud, SQL Server with Software Assurance moves to shared VMs through License Mobility, and Windows Server doesn't: it is licence included, or licences bought before 1 October 2019 for a version released before then, on dedicated hardware. The half without Software Assurance can only use that old-licence door, on dedicated hardware of any of the three clouds, if it applies, or stay on premises. So each vendor is partly right."
      - id: host-economics
        required: true
        description: "A dedicated host or sole-tenant node is paid for whole, full or empty, at a premium (about 10% in prices read in November 2026); it is cheaper when it is nearly full and the licences are counted on its physical cores (Datacenter or SQL Server Enterprise on every core covers any number of VMs), or when the licences owned are only allowed there. On AWS, Windows Server brought to a host must cover all its physical cores."
      - id: fewer-cores
        required: true
        description: "For SQL Server the licence is most of the bill, so the right edition (Standard where its limits allow, Developer for test, Express for small), fewer vCPUs (a memory-optimised size, or vCPUs switched off) and never under the minimum of 4 matter more than the VM's price."
      - id: verify
        required: true
        description: "Names what to check and where: the Product Terms for the rule (they take precedence over any vendor's page), each cloud's licensing page or FAQ for how it applies there, the licences' purchase dates, versions and Software Assurance status, and the day's prices in a dated table."
      - id: allowance
        required: false
        description: "The migration allowance: Standard may cover the old servers and the Azure VMs for 180 days, Datacenter licensed by VM indefinitely."
    model_answer: |
      The licence bill is counted in cores with minimums. A Windows Server VM needs a core licence for each vCPU and at least 8; a server the company licenses itself needs every physical core licensed, at least 8 a processor and 16 a server. SQL Server needs one a vCPU and at least 4 a VM. If the company doesn't bring licences, every cloud rents them by the vCPU-hour, licence included: as of November 2026 about $0.046 a vCPU-hour for Windows Server on all three, and several times that for SQL Server (Standard $0.10 to $0.12, Enterprise $0.375 to $0.399), so on the SQL Server VMs the licence is most of the bill.

      Whether the owned licences may come depends on the product, its Software Assurance and the cloud. On Azure, licences with active Software Assurance qualify for Azure Hybrid Benefit, for both Windows Server and SQL Server: a Windows VM then costs the Linux price, and the half with Software Assurance would cover about half the VMs. The half without it can't use the benefit: on Azure, as on the other two clouds, licences without Software Assurance may come only if they were bought before 1 October 2019, and then only onto a dedicated host with every physical core licensed. AWS and Google Cloud are what Microsoft calls Listed Providers, and there SQL Server with Software Assurance moves onto ordinary shared VMs through License Mobility, but Windows Server has no License Mobility, so even with Software Assurance it can't go on shared VMs. The only way to bring Windows Server there is old licences, bought before 1 October 2019 for a version released before then, on dedicated hardware: an AWS Dedicated Host, licensed on every physical core, or a Google sole-tenant node. Windows Server 2022 or 2025 is licence included on those clouds. So the first vendor is right about SQL Server with Software Assurance and Azure, and the second is right only for old Windows Server licences on AWS or Google Cloud.

      A dedicated host is a whole server, billed by the hour whether it is full or empty, at roughly 10% more than the same capacity on shared VMs in the prices I read. It is cheaper when it is nearly full and the licences are counted on its physical cores: Datacenter on every core of a host covers any number of Windows VMs, and SQL Server Enterprise on every core any number of SQL Server VMs, so 40 VMs that would need 320 or more core licences one by one might need only the host's cores. Or when the licences are only allowed there. Below about half full it rarely pays. The sum is the host's price over one licence-included VM's price, rounded up, and the licence counts both ways.

      To cut the SQL Server bill I would size by memory on a memory-optimised size, license no more vCPUs than needed but never fewer than 4, and check whether Standard's limits are enough, with Developer for test copies and Express for small databases.

      Before anyone signs I would read the Product Terms for Windows Server, SQL Server and Microsoft Azure, which take precedence over any vendor's page, and each cloud's licensing FAQ; check each licence's purchase date, version and Software Assurance status in the company's licence statement; and price every option from that day's price pages, in a table with the date and region. I would also plan the move around the migration allowance: Standard licences may cover old and new for 180 days, Datacenter by VM indefinitely.
