id: mcq-half-empty-host
type: mcq
rev: 1
prompt: |
  For which of these estates is a dedicated host (or a sole-tenant node) most likely to be the cheaper choice than ordinary shared VMs?
choices:
  - "40 steady SQL Server Enterprise VMs whose licences can be counted on the host's cores"
  - "6 Windows VMs that run in office hours only, five days a week, and sit idle overnight"
  - "40 Linux VMs that must run fast, with no software on them that needs any licence"
  - "40 Windows VMs that all take their Windows licence included, by the hour, as usual"
answer: 0
explanation: |
  A dedicated host is a whole server, billed by the hour whether it is full or empty, at about a tenth more than the same capacity bought as shared VMs (in the prices read for this topic). It pays when it is nearly full and the licences are counted on its physical cores rather than on every VM's vCPUs. SQL Server Enterprise is the strongest case: licensed by VM, every vCPU of 40 VMs needs a core licence, where licensing every physical core of a host with Software Assurance covers any number of VMs on it.

  Six VMs leave most of a host empty, and an idle night costs the same as a busy day. Linux VMs have no licences to save, so the host's premium is pure cost, and a host is the same hardware, no faster. Windows licence included on a host is still charged per vCPU (AWS charges $0.046 a vCPU-hour there too), so the host saves nothing on licences.
skills: [dedicated-hosts]
