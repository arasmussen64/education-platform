id: mcq-benefit-needs-sa
type: mcq
rev: 1
prompt: |
  A company runs 30 Windows Server VMs in Azure with Azure Hybrid Benefit, using core licences it owns with Software Assurance. To save money, finance lets the Software Assurance lapse at the end of the year. What must happen to the 30 VMs when it does?
choices:
  - "The benefit must be turned off or the cover renewed, so they bill at the Windows price"
  - "Nothing at all, because the licences were bought outright and are the company's for good"
  - "Azure stops them at the end of the term, and they must all be built again from images"
  - "Each of them now needs a client access licence for every person who signs in to it"
answer: 0
explanation: |
  The right to use owned licences in Azure is a benefit of Software Assurance (or of a subscription), and Microsoft says workloads using it "can run only during the Software Assurance or subscription license term": before it ends, renew, turn the benefit off, or remove the VMs. Turning it off changes a licensing setting on each VM, with no restart, and from then on the VM costs the Windows price. Budget for that before the cover lapses.

  The perpetual licences are still the company's, for use on its own servers; what lapses is the right to use them through Azure Hybrid Benefit. Azure doesn't stop or delete the VMs: keeping them right is the customer's job, and Microsoft may audit it. And Windows Server in Azure needs no client access licences, with the benefit or without it.
skills: [bring-your-own]
