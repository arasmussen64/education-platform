id: rev-precedence
type: mcq
rev: 1
prompt: |
  A Microsoft Learn article and the Microsoft Product Terms give different numbers for the core licences a VM needs under Azure Hybrid Benefit. Which one do you plan by?
choices:
  - "The Product Terms, as the Microsoft Learn article itself says to do"
  - "Whichever of the two pages was changed most recently by Microsoft"
  - "The article, because it was written for the engineers who build VMs"
  - "Whichever of the two the company's reseller confirms in writing"
answer: 0
explanation: |
  The Product Terms are the contract: the licence terms Microsoft's customers have agreed to. Microsoft Learn's page on Azure Hybrid Benefit says it outright, "The Microsoft Product Terms for your program take precedent over this article", and AWS and Google send you to the same place. So when the two differ, the article is out of date or simplified, and the Product Terms decide; tell the article's owners with its feedback button.

  A newer page isn't more binding for being newer, an engineers' article is a summary, and a reseller's letter can't change what the terms allow. When an audit comes, it reads the Product Terms.
skills: [look-it-up]
