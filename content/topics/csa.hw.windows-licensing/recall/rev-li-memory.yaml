id: rev-li-memory
type: estimate
rev: 1
prompt: |
  From memory, with no table, as the lesson's prices stood in November 2026: about how much does Windows Server licence included add in a month to a general-purpose VM with 32 vCPUs? Use 730 hours a month. Within 30% is right.
unit: US dollars a month
answer: 1074.56
tolerance: { percent: 30 }
given: { vcpus: 32, hours: 730 }
# $0.046 a vCPU-hour, the rate the learner remembers (read on all three
# clouds' pages on 2026-11-11).
working: vcpus * 0.046 * hours
mistakes:
  - id: one-vcpu
    value: 33.58
    working: 0.046 * hours
    why: That is one vCPU for a month. The licence is charged on all 32.
  - id: one-day
    value: 35.33
    working: vcpus * 0.046 * 24
    why: That is one day. A month is 730 hours.
explanation: |
  About $0.046 a vCPU-hour, or roughly $34 a vCPU a month: 32 × $0.046 × 730 = $1,074.56. Anything from about $750 to $1,400 shows the right sense of size; for a real budget, read the day's price for the size.
skills: [licence-included]
prices_as_of: 2026-11-11
prices_source: https://aws.amazon.com/ec2/pricing/on-demand/
