id: typed-azure-byol-benefit
type: typed
rev: 1
prompt: |
  A company owns Windows Server core licences with active Software Assurance and moves its servers to Azure VMs. Name the Azure benefit that lets those licences cover the VMs, so each Windows VM is billed at the Linux price.
kind: text
answers:
  - Azure Hybrid Benefit
  - Hybrid Benefit
  - AHB
mistakes:
  - id: mobility
    answers: [License Mobility, Licence Mobility]
    why: "License Mobility is the Software Assurance benefit for partner clouds' shared servers, and Windows Server doesn't have it. On Azure the benefit is Azure Hybrid Benefit."
  - id: included
    answers: [licence included, license included, pay-as-you-go]
    why: "That's renting the licence by the hour inside the VM's price, the opposite of using licences you own."
explanation: |
  **Azure Hybrid Benefit** lets Windows Server (and SQL Server) licences with active Software Assurance, or subscription licences, cover Azure VMs: the VM then bills at the Linux price. Each VM takes at least 8 Windows Server core licences, and if the Software Assurance lapses the benefit must be turned off.
skills: [bring-your-own]
