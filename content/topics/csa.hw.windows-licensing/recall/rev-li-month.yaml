id: rev-li-month
type: estimate
rev: 1
prompt: |
  | Azure `Standard_D2s_v5` (2 vCPUs, 8 GiB), East US, pay-as-you-go, read 2026-11-11 | Per hour |
  | --- | --- |
  | Linux | $0.096 |
  | Windows | $0.188 |

  What does the Windows Server licence add to this VM's bill in a month? Use 730 hours a month. Within 2%.
unit: US dollars a month
answer: 67.16
tolerance: { percent: 2 }
given: { linux: 0.096, windows: 0.188, hours: 730 }
working: (windows - linux) * hours
mistakes:
  - id: whole-windows-price
    value: 137.24
    working: windows * hours
    why: That is the whole Windows VM for a month. The machine alone is the Linux price; the licence is the difference.
  - id: one-vcpu
    value: 33.58
    working: (windows - linux) / 2 * hours
    why: That is one vCPU's share. The licence is charged on both of this VM's vCPUs.
explanation: |
  $0.188 − $0.096 = $0.092 an hour, which is 2 vCPUs × $0.046. Over 730 hours, $67.16 a month: on a small VM the licence costs about as much as the machine.
skills: [licence-included]
prices_as_of: 2026-11-11
prices_source: https://azure.microsoft.com/en-us/pricing/details/virtual-machines/windows/
