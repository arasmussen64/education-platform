id: mcq-migration-overlap
type: mcq
rev: 1
prompt: |
  A company moves 40 Windows Server VMs into Azure over nine months, licensing each Azure VM with Azure Hybrid Benefit, and keeps each old server running beside its new VM until the move is done. Its core licences have Software Assurance. As the Product Terms stood in November 2026, how long may the same licences cover both the old servers and the Azure VMs?
choices:
  - "Datacenter ones with no end date, and Standard ones for 180 days"
  - "Both editions for 180 days, and after that only one of the two places"
  - "Neither edition for a single day: a licence covers one place at a time"
  - "Standard ones with no end date, and Datacenter ones for 180 days"
answer: 0
explanation: |
  Microsoft calls this the Azure migration allowance. Licensing VM by VM, Datacenter licences may keep covering the servers on premises "indefinitely" while they cover the Azure VMs too. Standard licences may cover both for 180 days from when they are allocated to Azure, once, to allow the move; after that they are used in one place or the other. So for a nine-month move, Standard needs more licences or a quicker move, and Datacenter does not.

  The 180 days is the Standard rule, not a rule for both editions, and the two editions' allowances are not the other way round. On an Azure dedicated host licensed with Datacenter, the allowance is 180 days again: it is a detail worth reading in the Product Terms' "Microsoft Azure" entry before planning a migration.
skills: [bring-your-own]
