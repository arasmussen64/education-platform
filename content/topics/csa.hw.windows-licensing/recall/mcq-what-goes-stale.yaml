id: mcq-what-goes-stale
type: mcq
rev: 1
prompt: |
  A design note written in November 2024 makes four statements about licensing. Two years on, which one is a rule you could still rely on without looking it up?
choices:
  - "SQL Server needs at least 4 core licences for every VM it is licensed on"
  - "Windows Server licence included adds $0.046 a vCPU-hour on every VM size"
  - "SQL Server Standard can use at most 24 cores in any single instance"
  - "SQL Server Express holds at most 10 GB of data in any single database"
answer: 0
explanation: |
  The minimum of 4 core licences a VM is part of how SQL Server is licensed, in the Product Terms, and it shows up in every cloud's price list; rules like it are the structure the rest hangs on. The others are a price and two limits of one version. The $0.046 is a price, and was never true of every size (the smallest burstable sizes pay less). The 24 cores and the 10 GB were SQL Server 2022's limits: SQL Server 2025 raised Standard to 32 cores and Express to 50 GB a database. So a limit needs its version, and a price its date.

  As a habit: keep the rules, and look up every price, version limit and dated condition again on the day, from the page that publishes it. Even a rule is "as the Product Terms stand" on the day you read them.
skills: [look-it-up]
