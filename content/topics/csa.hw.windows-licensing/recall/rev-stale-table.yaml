id: rev-stale-table
type: mcq
rev: 1
prompt: |
  A design note prices a migration of 60 Windows and SQL Server VMs from a price table dated 14 months ago. The method and the sums in it are right. What do you do with its cost section?
choices:
  - "Keep its method, read today's prices again, and date the new table"
  - "Use it as it is, because the clouds' list prices hardly ever change"
  - "Add 10% to every price in it, to allow for the 14 months of inflation"
  - "Drop the cost section until the clouds' prices have stopped moving"
answer: 0
explanation: |
  The method (count the cores with the minimums, decide what may be brought, price each allowed option at 730 hours, compare) doesn't go stale; the numbers do. Prices change without notice, licence rates differ between sizes, and new sizes and versions arrive, so read the day's prices from each cloud's own price page, put them in a table with the date and region, and say where they came from. Then anyone checking the note next year knows what to read again.

  A guessed 10% is a number nobody can check. And prices never stop moving, so a migration plan without a dated cost is a plan without a cost.
skills: [look-it-up]
