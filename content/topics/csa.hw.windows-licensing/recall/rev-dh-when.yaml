id: rev-dh-when
type: mcq
rev: 1
prompt: |
  A team's dedicated host has been 35% full for months, and nothing new is planned for it. What follows?
choices:
  - "It pays for the empty 65% too, so shared VMs cost less unless licences force a host"
  - "It is billed for the 35% that runs its VMs, the same as VMs on shared hardware are"
  - "It turns cheaper than shared VMs once Windows on it is taken with licence included"
  - "It can be resized down to fit the VMs it runs, so the team pays only for what it uses"
answer: 0
explanation: |
  A dedicated host is billed whole, by the hour, however many VMs it runs: Azure charges "per dedicated host, regardless how many VMs are deployed", and AWS bills Dedicated Hosts per host in the same way. A third full, it costs roughly three times as much per VM as shared hardware. It still pays if licences force it (Windows Server bought before October 2019 and brought to AWS or Google Cloud, which only dedicated hardware may take) or if licensing its physical cores saves more than the empty space costs. Otherwise move the VMs to shared hardware, or fill the host.

  Licence-included Windows on a host is charged per vCPU on top of the host, so it saves nothing. And a host is a physical server, so it can't shrink: Azure's page says a host's size or type can't be changed once it is provisioned, and a smaller one is a new host.
skills: [dedicated-hosts]
