id: mcq-rule-of-thumb-fails
type: mcq
rev: 1
prompt: |
  | Azure `Standard_B2ls_v2` (2 vCPUs, 4 GiB, burstable), East US, pay-as-you-go, read 2026-11-11 | Per hour |
  | --- | --- |
  | Linux | $0.0416 |
  | Windows | $0.0508 |

  A colleague budgets 2 × $0.046 = $0.092 an hour for this VM's Windows Server licence, from the usual rate of $0.046 a vCPU-hour. What does the table say?
choices:
  - "The licence is $0.0092 an hour here, because small burstable sizes are priced on their own"
  - "The licence is $0.092 an hour, as budgeted, so the table must simply be out of date by now"
  - "The licence is free here, because burstable sizes need no Windows Server licence at all"
  - "The licence is $0.046 an hour, because the 2 vCPUs share one core and it is priced by core"
answer: 0
explanation: |
  The licence is always the Windows price minus the Linux price: $0.0508 − $0.0416 = $0.0092 an hour, a tenth of the colleague's budget. The rule of thumb of $0.046 a vCPU-hour holds on the general-purpose and memory-optimised sizes, but AWS's and Azure's smallest burstable sizes pay much less for Windows: AWS's `t3.medium` paid $0.0184 more for Windows that day. On Google Cloud only its two oldest small types, `f1-micro` and `g1-small`, pay less, a flat $0.023.

  The table isn't wrong for being different; it is the source, and the rule of thumb is the shortcut. Windows isn't free on these sizes either, since there is a difference between the rows. And the licence is charged per vCPU, not per core. Read the price for the size you are buying.
skills: [licence-included, look-it-up]
