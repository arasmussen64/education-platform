id: rev-sql-small-production
type: mcq
rev: 1
prompt: |
  A small production app keeps a 30 GB database on SQL Server 2025, on a VM with 2 vCPUs, and its owner wants to pay as little as the licence terms allow. Which edition, and why?
choices:
  - "Express, because it is free and 30 GB is well under its limit"
  - "Developer, because it is free and has every feature there is"
  - "Standard, because Express stops at 10 GB in every database"
  - "Enterprise, because only it may run a production database"
answer: 0
explanation: |
  In SQL Server 2025, Express is free, may run production, and holds up to 50 GB a database on up to 4 cores, so a 30 GB database on 2 vCPUs fits. (The limit was 10 GB in SQL Server 2022 and earlier, which is why a limit always comes with its version.)

  Developer is free and complete, but licensed for development and test only, not production. Standard and Enterprise both run production; nothing here needs what they cost. One more reason to check the edition before the size of VM: SQL Server licence included is charged for at least 4 vCPUs, while Express costs nothing on any size.
skills: [sql-editions]
