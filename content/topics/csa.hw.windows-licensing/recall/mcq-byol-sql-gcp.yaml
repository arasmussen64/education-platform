id: mcq-byol-sql-gcp
type: mcq
rev: 1
prompt: |
  A company owns SQL Server Enterprise core licences with active Software Assurance, and wants to use them on ordinary Google Cloud VMs, on shared hardware. As the rules stood in November 2026, what applies?
choices:
  - "It may bring them there through License Mobility, at no fewer than 4 core licences a VM"
  - "It may bring them only to sole-tenant nodes, since Google Cloud is a Listed Provider now"
  - "It may not bring them at all, since nothing may move to a Listed Provider after 2019"
  - "It may bring them only if they cover SQL Server 2019 or some earlier version of it"
answer: 0
explanation: |
  SQL Server has License Mobility: with active Software Assurance, its licences may run on the shared servers of an authorised cloud partner, and Google's page says SQL Server licences "are typically eligible for BYOL with License Mobility". They are counted as on any VM, one a vCPU and at least 4 a VM. Google adds that a licence placed in a region can't be moved to another region for 90 days.

  Sole-tenant nodes and the 2019 cut-off belong to the other door, the one for products without License Mobility (such as Windows Server): licences bought before 1 October 2019, for versions released before then, on dedicated hardware. Microsoft's rule of that date (the "Listed Providers" rule, which names Alibaba, Amazon, Google and Microsoft) shuts out licences without Software Assurance and mobility rights. These have both.
skills: [bring-your-own]
