id: mcq-who-settles-it
type: mcq
rev: 1
prompt: |
  A reseller's blog post says that Windows Server 2025 licences may now be brought to AWS Dedicated Hosts. Before an architecture review relies on it, where is that settled?
choices:
  - "In Microsoft's Product Terms first, and then in AWS's own licensing pages and FAQ"
  - "In the AWS price list, whose Dedicated Host prices show which licences each allows"
  - "On the Windows Server download page, which lists the clouds each version may run on"
  - "In the reseller's written quote, which settles it once both sides have signed it"
answer: 0
explanation: |
  The licence is Microsoft's, so Microsoft's Product Terms are the contract that says where it may run: Microsoft Learn's own page on Azure Hybrid Benefit says the Product Terms take precedence over it, and AWS's and Google's licensing pages send you to them too. Then the cloud's licensing pages say how it applies there: AWS's FAQ, read in November 2026, said "Windows Server 2025 is not eligible for BYOL", because it was released after 1 October 2019. A blog post that says otherwise is either new news or wrong, and the two pages tell you which.

  A price list says what things cost, not what you may do with a licence. Download pages don't grant rights. And a quote, signed or not, can't give rights that Microsoft's terms don't: an audit checks the terms, not the quote.
skills: [look-it-up]
