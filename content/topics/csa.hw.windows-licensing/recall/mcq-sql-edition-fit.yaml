id: mcq-sql-edition-fit
type: mcq
rev: 1
prompt: |
  A company is choosing SQL Server 2025 editions for three databases, and wants for each the cheapest edition its licence terms and limits allow:

  - a 6 GB database behind an internal tool, in production, on a VM with 2 vCPUs;
  - a test copy of the 300 GB sales database, used only by the developers;
  - a 400 GB data warehouse in production, which needs 48 cores.

  Which editions fit?
choices:
  - "Express for the tool, Developer for the test copy, Enterprise for the warehouse"
  - "Express for the tool, Express for the test copy, Standard for the warehouse"
  - "Standard for the tool, Express for the test copy, Enterprise for the warehouse"
  - "Developer for the tool, Developer for the test copy, Standard for the warehouse"
answer: 0
explanation: |
  The limits are SQL Server 2025's, from Microsoft's editions page: Express is free and may run production, but uses at most 4 cores and holds at most 50 GB a database; Standard uses at most 32 cores (24 in SQL Server 2022 and earlier); Enterprise has no limit but the operating system's; the two Developer editions are free with every feature, and licensed "as a development and test system, not as a production server".

  So the 6 GB tool fits Express, and paying for Standard there buys nothing it needs. The 300 GB test copy is too big for Express and isn't production, which is what Developer is for. The 48-core warehouse is over Standard's 32 cores, so it needs Enterprise. And Developer can't run the tool, which is production. Name the version whenever you quote a limit: these changed with SQL Server 2025.
skills: [sql-editions]
