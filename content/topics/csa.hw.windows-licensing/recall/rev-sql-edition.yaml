id: rev-sql-edition
type: mcq
rev: 1
prompt: |
  A team wants a test copy of its 200 GB production database on SQL Server 2025, used by five developers and by nobody else. Which edition fits at the least cost?
choices:
  - "Developer, which is free and licensed only for development and test work"
  - "Express, which is free and puts no limit on how big a database may grow"
  - "Standard, because it is the cheapest paid edition that can hold 200 GB"
  - "Enterprise, because a test copy must run the same edition as production"
answer: 0
explanation: |
  SQL Server 2025 has two Developer editions, Enterprise Developer and Standard Developer, with every feature of the edition they are named after, free, and licensed "as a development and test system, not as a production server". A test copy used by developers is exactly that; pick the Developer edition that matches what production runs, so the tests see the same features.

  Express is free too, but holds at most 50 GB a database in SQL Server 2025, so 200 GB doesn't fit. Standard would work, at a price nobody needs to pay for a copy that serves no production traffic. And matching production's edition is what Enterprise Developer gives you, free.
skills: [sql-editions]
