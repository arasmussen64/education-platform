id: rev-li-share
type: estimate
rev: 1
prompt: |
  | AWS `r7i.xlarge` (4 vCPUs, 32 GiB), US East (N. Virginia), on-demand, read 2026-11-11 | Per hour |
  | --- | --- |
  | Linux | $0.2646 |
  | Windows Server and SQL Server Standard, licence included | $0.9286 |

  What percentage of the Windows and SQL Server Standard bill is software licences rather than the machine? Within 2 percentage points.
unit: "%"
answer: 71.5
tolerance: { absolute: 2 }
given: { linux: 0.2646, licensed: 0.9286 }
working: (licensed - linux) / licensed * 100
mistakes:
  - id: machine-share
    value: 28.5
    working: linux / licensed * 100
    why: That is the machine's share. The licences are the rest of the bill.
  - id: licence-over-machine
    value: 250.9
    working: (licensed - linux) / linux * 100
    why: That compares the licences with the machine. As a share of the bill they are $0.664 of $0.9286.
explanation: |
  The licences are $0.9286 − $0.2646 = $0.664 an hour (Windows $0.046 and SQL Server Standard $0.12 on each of 4 vCPUs), 71.5% of the bill. Even with the cheaper SQL Server edition, the software costs two and a half times the machine.
skills: [licence-included]
prices_as_of: 2026-11-11
prices_source: https://aws.amazon.com/ec2/pricing/on-demand/
