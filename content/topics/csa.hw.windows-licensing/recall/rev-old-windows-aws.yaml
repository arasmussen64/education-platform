id: rev-old-windows-aws
type: mcq
rev: 1
prompt: |
  A company bought Windows Server 2019 Datacenter licences outright in 2018 and never added Software Assurance. It wants to use them on AWS. As the rules stood in November 2026, where may it?
choices:
  - "On Dedicated Hosts only, with every physical core of each of those hosts licensed"
  - "On any instance, shared or dedicated, because the licences are the company's for good"
  - "Nowhere on AWS, because a licence with no Software Assurance can't go to any cloud"
  - "On shared instances only, and only once it has bought Software Assurance for them"
answer: 0
explanation: |
  Windows Server has no License Mobility, so even Software Assurance wouldn't take it to shared instances. The door it can use is the one for licences bought before 1 October 2019, for a version released before then, on dedicated hardware: these were bought in 2018 for Windows Server 2019, so they qualify, and that door needs no Software Assurance. On AWS that means Dedicated Hosts, licensed on all the host's physical cores, not on the VMs' vCPUs. With Datacenter on all of them, the host may run as many Windows instances as fit.

  Owning a licence for good doesn't let it run on anyone's shared servers. And "no Software Assurance, no cloud" is the rule for licences bought after the 2019 date, not before it.
skills: [bring-your-own]
