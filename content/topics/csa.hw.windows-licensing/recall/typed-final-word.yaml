id: typed-final-word
type: typed
rev: 1
prompt: |
  A reseller's blog, a cloud's FAQ and a Microsoft Learn page disagree about whether a licence may move to a dedicated host. Name the Microsoft document whose words settle it, ahead of every guide, blog and price page.
kind: text
answers:
  - Product Terms
  - the Product Terms
  - Microsoft Product Terms
  - Microsoft's Product Terms
mistakes:
  - id: learn
    answers: [Microsoft Learn]
    why: "Microsoft Learn explains the rules, and its own licensing page says the Product Terms take precedence over it."
  - id: agreement
    answers: [Enterprise Agreement, EA]
    why: "An Enterprise Agreement is the contract a company buys licences under. What each licence allows is written in the Product Terms."
  - id: assurance
    answers: [Software Assurance]
    why: "Software Assurance is a yearly add-on to licences, not a document of rules. The rules for it, too, are in the Product Terms."
explanation: |
  Microsoft's **Product Terms** are the published licence terms for each product and the final word: Microsoft Learn's own page says they take precedence over it. Check a claim there first, then in the cloud's own licensing pages for how it applies there, and write down the date you read it.
skills: [look-it-up]
