id: rev-new-sql-no-sa
type: mcq
rev: 1
prompt: |
  A company bought SQL Server 2022 Standard core licences in 2023, without Software Assurance, and is moving its databases to the cloud. As the rules stood in November 2026, how will SQL Server be licensed on each of the three big clouds?
choices:
  - "Licence included on all three, because nothing lets these licences move to a cloud"
  - "Azure Hybrid Benefit on Azure, and licence included on both of the other two clouds"
  - "License Mobility on AWS and on Google Cloud, and licence included on Azure"
  - "Dedicated hosts on AWS and on Google Cloud, because the licences are perpetual"
answer: 0
explanation: |
  Every door to the cloud needs something these licences lack. Azure Hybrid Benefit and License Mobility both need active Software Assurance (or a subscription). The dedicated-hardware door, for licences without it, needs licences bought before 1 October 2019 and, on AWS, SQL Server 2017 or earlier; these are 2022 licences bought in 2023. So in the cloud they pay for SQL Server by the hour, licence included, and the licences they own stay useful only on the company's own servers.

  Next time, buy Software Assurance (or subscription licences) with the licences: that is what makes them movable.
skills: [bring-your-own]
