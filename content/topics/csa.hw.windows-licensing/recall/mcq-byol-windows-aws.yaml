id: mcq-byol-windows-aws
type: mcq
rev: 1
prompt: |
  A company's Windows Server 2022 Datacenter core licences were bought in 2023, and their Software Assurance is active. The team wants to run them on ordinary, shared AWS instances. As the rules stood in November 2026, what may it do with them?
choices:
  - "Not use them on AWS at all: there it takes Windows licence included, or uses them in Azure"
  - "Use them on shared instances, since active Software Assurance lets Windows Server go anywhere"
  - "Use them on Dedicated Hosts only, once every physical core of each host has been licensed"
  - "Use them on shared instances, once the License Mobility form has reached Microsoft in time"
answer: 0
explanation: |
  Three questions decide it: which product, does it have Software Assurance, which cloud. Windows Server has no License Mobility, the Software Assurance benefit that lets a licence move to a cloud partner's shared servers, so Software Assurance doesn't carry it to AWS's shared instances; AWS's own guidance says so "even if the licenses have SA". The License Mobility form is for the products that have it, such as SQL Server.

  The other way onto AWS is dedicated hardware, and it is closed too: it takes licences bought before 1 October 2019 for a version released before then, and these are Windows Server 2022 licences bought in 2023. AWS's FAQ says plainly that Windows Server 2022 "is not eligible for BYOL". So on AWS it is licence included. The licences aren't wasted: with active Software Assurance they qualify for Azure Hybrid Benefit.
skills: [bring-your-own]
