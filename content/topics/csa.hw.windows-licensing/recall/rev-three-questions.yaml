id: rev-three-questions
type: mcq
rev: 1
prompt: |
  "Can we bring the licences we already own?" Which three facts about a licence decide the answer for a given cloud?
choices:
  - "The product, whether its Software Assurance is active, and which cloud it is going to"
  - "The product, the region it will run in, and the size of the VMs it will run on"
  - "Its list price, whether its Software Assurance is active, and the region it is bound for"
  - "The size of the VMs, the licence's list price, and which cloud it is going to"
answer: 0
explanation: |
  The product, because Windows Server has no License Mobility and SQL Server does. Software Assurance (or a subscription), because it is what lets a licence move at all: to Azure through Azure Hybrid Benefit, to AWS's or Google's shared servers through License Mobility. And the cloud, because Azure has a benefit of its own, while AWS and Google Cloud come under Microsoft's stricter rule for "Listed Providers" (a list that names Alibaba, Amazon, Google and Microsoft itself). For licences without Software Assurance, the purchase date and version come in too, through the October 2019 rule.

  The region and the VM size change what a licence costs to use (the minimums of 8 and 4 core licences a VM), not whether it may be used. A licence's list price decides whether bringing it is worth it, not whether it is allowed.
skills: [bring-your-own]
