# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: core licence
  aliases: [core license]
  definition: The right to run Microsoft server software on one processor core, or on one vCPU in a VM, bought in packs and counted with minimums.
- term: Software Assurance
  definition: A yearly add-on to Microsoft volume licences that brings new versions and the right to use the licences in more places, such as Azure, by VM or through License Mobility.
- term: licence included
  aliases: [license included]
  definition: Renting Microsoft's software by the hour inside a cloud VM's price, paid per vCPU, so you own nothing and count nothing.
- term: bring your own licence
  aliases: [BYOL, bring your own license]
  definition: Running licences you already own on a cloud's machines and paying the cloud only for the machine, where Microsoft's rules allow it.
- term: Azure Hybrid Benefit
  definition: Microsoft's right to bring Windows Server and SQL Server licences with Software Assurance to Azure, so a Windows VM costs the Linux price.
- term: License Mobility
  definition: A Software Assurance benefit that lets a licence run on an authorised partner cloud's shared servers. SQL Server has it; Windows Server doesn't.
- term: Product Terms
  definition: 'Microsoft''s published licence terms for each product: the final word on what a licence allows, ahead of any guide, blog or price page.'
- term: Listed Provider
  definition: A cloud on Microsoft's list (Alibaba, Amazon, Google and Microsoft itself) whose dedicated hosts take only licences bought before 1 October 2019 or with mobility rights.
