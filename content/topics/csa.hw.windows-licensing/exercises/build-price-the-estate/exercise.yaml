id: build-price-the-estate
stage: build
runtime: lab
rev: 1
title: "Price the estate"
prompt: |
  Fenwick Tools is moving 14 servers to the cloud: eight to Azure and six to AWS. Before it signs, it wants the licensing in one short report: what it must set aside, what the move costs with every licence included and at best, and whether an AWS Dedicated Host would pay for its six AWS servers.

  Everything is in `/srv/licensing/`. `estate.csv` lists the servers: where each is going, its vCPUs, its operating system and SQL Server edition, whether its Windows Server and SQL Server licences have active Software Assurance, when its Windows Server licences were bought and for which version, and what its VM costs an hour as Linux and with Windows Server licence included. `sql-rates.csv` gives what SQL Server licence included costs on each cloud, `host.txt` describes the Dedicated Host, and `README.txt` says what every file and column means and what each answer of the report is.

  Write the report in `~/report/estate.txt` (`nano ~/report/estate.txt` makes it), one `key=value` line for each key the README lists, money in whole dollars for a 730-hour month. Use any tools you like: the commands of this topic's practice, a calculator, or both. Then run the checks; each answer has a check of its own.
skills: [core-counting, licence-included, bring-your-own, dedicated-hosts]
