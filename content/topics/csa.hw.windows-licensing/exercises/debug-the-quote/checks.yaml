        vm f-web-2 "$(pick '2 4 8')" windows none no no
        vm f-db-1 2 windows standard "$(pick 'yes no')" no
        vm f-db-2 "$(pick '4 8')" windows enterprise "$(pick 'yes no')" "$(pick 'yes no')"
