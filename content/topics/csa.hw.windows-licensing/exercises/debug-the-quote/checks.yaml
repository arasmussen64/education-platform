  - id: benefit-still-used
    description: "Where Harbour Dental may bring its own Windows Server licences to a VM on shared hardware, the quote still uses them: that VM's windows line is 0.00."
    command: |
      f=/home/learner/quote/inventory.csv
      q=$(runuser -u learner -- /home/learner/quote/make-quote "$f" 2>/dev/null)
      for s in $(tail -n +2 "$f" | awk -F, '$2 == "vm" && $4 == "windows" && $6 == "yes" {print $1}'); do
        a=$(echo "$q" | awk -v s="$s" '$1 == "windows" && $2 == s {print $3}')
        [ "$a" = "0.00" ] || { echo "$s is quoted a Windows licence of '$a'"; exit 0; }
      done
      echo right
    expect:
      equals: right
  - id: host-still-quoted
    description: "The quote for inventory.csv still has a line for its dedicated host, hg-1."
    command: |
      runuser -u learner -- /home/learner/quote/make-quote /home/learner/quote/inventory.csv 2>/dev/null | awk '$1 == "host" && $2 == "hg-1" && $3 > 0 {found = 1} END {print found ? "quoted" : "no host line"}'
    expect:
      equals: quoted
  - id: inputs-untouched
    description: "The README and the two inventories in ~/quote are as they were."
    command: |
      cd /home/learner/quote && sha256sum --quiet -c /usr/local/lib/lab/inputs.sha256 > /dev/null 2>&1 && echo untouched || echo changed
    expect:
      equals: untouched
