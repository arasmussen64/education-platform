      result=right
      for f in /home/learner/quote/inventory.csv /home/learner/quote/inventory-b.csv "$dir/inventory-c.csv"; do
        same windows "$f" || { result="a windows line is wrong for $(basename "$f")"; break; }
      done
      rm -r "$dir"
      echo "$result"
    expect:
      equals: right
  - id: host-line-right
