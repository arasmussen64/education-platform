id: debug-the-quote
stage: debug
runtime: lab
rev: 1
title: "The quote that comes out low"
prompt: |
  Harbour Dental, a dental practice, is moving nine servers to Azure. Two of them, `records-1` and `records-2`, hold patient records, and the practice's rules say they must run on hardware no other customer shares, so they go on a dedicated host of its own, `hg-1`. The rest run on shared hardware.

  A colleague wrote `~/quote/make-quote`, a script that reads an inventory and prints a month's quote, one line a charge and the total, and ran it on `~/quote/inventory.csv`, the practice's inventory: `~/quote/make-quote ~/quote/inventory.csv`. `~/quote/README.txt` says what the inventory's columns mean, what the practice's licences cover, what SQL Server licence included costs, and what each line of the quote is. The quote should price every server where the inventory places it, using the customer's own licences wherever their terms allow, and nowhere else.

  **What's wrong.** Finance compared the quote with Azure's own pricing calculator, and the script's total is lower.

  **There are three faults** in the script. Find them, and fix them with `nano ~/quote/make-quote`. `~/quote/inventory-b.csv` is a second customer's inventory to try it on. The rules of the fix:

  - **Keep the quote's layout:** one line a charge, as the README describes, and the total.
  - **Work everything out from the inventory the script is given;** type no number of the practice's into it.
  - **Leave the README and the inventories as they are.**

  Then run the checks.
skills: [core-counting, bring-your-own, dedicated-hosts]
