id: step-tests
stage: fill_in
rev: 1
title: "The tests"
prompt: |
  The checker works. Now its tests need their expected values. Replace each `...` with the verdict `check_password` should give for that password: work each one out from the rules (8 or more characters, a digit, a capital letter, checked in that order). Running the program and typing `Secret99` should print:

  ```
  check_password: all checks passed
  OK
  ```
hints:
  - "`Secret99` and `Abcdefg1` meet all three rules, so their verdict is `\"OK\"`. `Abcdefg1` is the boundary: exactly 8 characters."
  - "`Abcdef1` has 7 characters, so the first rule fails: `\"too short\"`. `abc` fails it too."
  - "`longenough` is long but has no digit; `longenough1` has a digit but no capital letter. Each gets the message for the first rule it fails."
