id: build-username-checker
stage: build
rev: 1
title: "Username checker"
prompt: |
  Starting from a blank editor, write a username checker built from small functions, each with a docstring:

  - `is_right_length(name)` returns `True` when the name has 3 to 12 characters, both ends included.
  - `starts_with_letter(name)` returns `True` when the first character is a letter, `a` to `z` or `A` to `Z`.
  - `is_simple(name)` returns `True` when every character is a letter, a digit or an underscore (`_`).
  - `check_username(name)` returns `"OK"` when all three hold. Otherwise it returns the **first** problem, in this order: `"must be 3 to 12 characters"`, `"must start with a letter"`, `"only letters, digits and underscores"`.
  - `test_check_username()` has at least four asserts covering a good name, each rule failing, and a boundary length, and ends with `print("check_username: all checks passed")`.
  - `main()` asks for a username with `input` and prints the verdict.

  Finish with:

  ```python
  if __name__ == "__main__":
      test_check_username()
      main()
  ```

  So typing `ada_42` prints:

  ```
  check_username: all checks passed
  OK
  ```

  Comparisons like `"a" <= ch <= "z"`, `"A" <= ch <= "Z"` and `"0" <= ch <= "9"` tell you what kind of character `ch` is. A name always has at least one character.
test_skills:
  test_right_length: [py.defining-functions/def-call, py.booleans-and-comparisons/compare, py.logical-operators/and-or]
  test_starts_with_letter: [py.strings-as-sequences/index, py.logical-operators/and-or]
  test_is_simple: [py.strings-as-sequences/loop-chars, py.logical-operators/not, py.return-values/use-result]
  test_verdict: [py.decomposition/compose, py.if-elif-else/elif-order, py.return-values/use-result]
  test_docstrings: [py.decomposition/docstrings]
  test_tests: [py.testing-with-assert/test-functions, py.testing-with-assert/choose-cases]
  test_program: [py.testing-with-assert/test-functions, py.strings-and-input/input-text]
