id: debug-code-word
stage: debug
rev: 2
title: "A code-word checker"
prompt: |
  This program checks a code word: it must have at least 5 characters and at least one vowel (`a`, `e`, `i`, `o`, `u`). Run directly, it runs its own tests, then asks for a word. Given `brave`, it should print:

  ```
  check_word: all checks passed
  OK
  ```

  Instead it stops with an `AssertionError` before it asks for a word. It has three bugs, and the two rules above decide what's right. Run it, read which assert failed, and fix one thing at a time. You're done when it prints the lines above and every check passes.
hints:
  - "The first assert to fail is about `brave`, which should be `OK`. Work out by hand what each rule function gives for `brave`."
  - "`brave` has exactly 5 characters. Does `len(word) > 5` count it? \"At least 5\" includes 5 itself."
  - "Step through `has_vowel` with `brave`: how many characters does it look at before it returns?"
  - "A loop that returns in both branches stops at the first character. Return `False` only after the loop has looked at every one."
  - "By the two rules, what should `check_word(\"crypt\")` be? If an assert expects something else, it's the assert that's wrong."
test_skills:
  test_length_boundary: [py.booleans-and-comparisons/compare, py.testing-with-assert/choose-cases]
  test_vowel_search: [py.return-values/use-result, py.strings-as-sequences/loop-chars]
  test_expectations: [py.testing-with-assert/assert-basics]
  test_program: [py.testing-with-assert/test-functions, py.decomposition/compose]
