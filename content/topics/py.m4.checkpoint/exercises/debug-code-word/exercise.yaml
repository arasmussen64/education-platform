id: debug-code-word
stage: debug
rev: 1
title: "A code-word checker"
prompt: |
  This program checks a code word: it must have at least 5 characters and at least one vowel (`a`, `e`, `i`, `o`, `u`). Run directly and given `brave`, it should print:

  ```
  check_word: all checks passed
  OK
  ```

  It has three bugs: one in a rule function's comparison, one in how another rule function searches, and one in the tests themselves, which expect something wrong. Run it, read the first failing assert, and work out whether the function or the test is at fault.
test_skills:
  test_length_boundary: [py.booleans-and-comparisons/compare, py.testing-with-assert/choose-cases]
  test_vowel_search: [py.return-values/use-result, py.strings-as-sequences/loop-chars]
  test_expectations: [py.testing-with-assert/assert-basics]
  test_program: [py.testing-with-assert/test-functions, py.decomposition/compose]
