id: example-ticket-code
stage: worked_example
rev: 1
title: "A ticket-code checker"
prompt: |
  This program is like the checkpoint's build, in a different story: a ticket code must be exactly 6 characters, start with a letter and end with a digit. Press **Run** and try `AB1234`, then `12345A`, then `AB12`. Then read how it's built.

  The shape is the one the module has been building up to: one function per rule, a verdict function that combines them in order, a test function, and a `main` that only runs when the file is run directly.
steps:
  - label: "One rule, one function"
    lines: "1-14"
    note: "Each function asks one yes/no question and returns `True` or `False`. Each has a docstring. On its own, each is small enough to test with two or three asserts."
  - label: "The verdict, in a fixed order"
    lines: "17-24"
    note: "`check_code` asks the rules in order and returns at the first one that fails, so a code with two problems gets the first message. It doesn't repeat any rule: it calls the functions."
  - label: "The tests"
    lines: "27-33"
    note: "A good code, then one failing case per rule, including the boundary (a code of the right length). The print at the end shows the tests ran. If any assert were false, the program would stop here."
  - label: "The program, under the guard"
    lines: "36-44"
    note: "`main` reads the code and prints the verdict. It runs only when the file is run directly, so the Check button can load the file, call the functions and never be asked for input."
