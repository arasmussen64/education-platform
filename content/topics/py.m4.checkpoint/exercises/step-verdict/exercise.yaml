id: step-verdict
stage: fill_in
rev: 1
title: "The verdict"
prompt: |
  The three rules work. Now `check_password` should ask them in order and return at the first one that fails. Replace each `...` with the right rule function. Running the program and typing `Secret99` should print:

  ```
  check_password: all checks passed
  OK
  ```
hints:
  - "The order of the messages gives the order of the checks: length first, then the digit, then the capital letter."
  - "Each `if` asks whether a rule is *not* met: `if not has_min_length(password):` returns `\"too short\"`."
  - "Don't repeat the rule's code here. Call the function that already answers the question."
