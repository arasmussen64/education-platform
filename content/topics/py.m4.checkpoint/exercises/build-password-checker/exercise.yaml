id: build-password-checker
stage: build
rev: 1
title: "Password checker"
prompt: |
  Starting from a blank editor, write a password checker built from small functions, each with a docstring:

  - `has_min_length(password)` returns `True` when the password has 8 or more characters.
  - `has_digit(password)` returns `True` when at least one character is a digit, `0` to `9`.
  - `has_upper(password)` returns `True` when at least one character is a capital letter, `A` to `Z`.
  - `check_password(password)` returns `"OK"` when all three hold. Otherwise it returns the **first** problem, in this order: `"too short"`, `"needs a digit"`, `"needs a capital letter"`.
  - `test_check_password()` has at least four asserts covering a good password, each rule failing, and the boundary of exactly 8 characters, and ends with `print("check_password: all checks passed")`.
  - `main()` asks for a password with `input` and prints the verdict.

  Finish with:

  ```python
  if __name__ == "__main__":
      test_check_password()
      main()
  ```

  So typing `Secret99` prints:

  ```
  check_password: all checks passed
  OK
  ```

  Comparing characters works like this: `"0" <= ch <= "9"` is `True` when `ch` is a digit, and `"A" <= ch <= "Z"` when it's a capital letter.
test_skills:
  test_min_length: [py.defining-functions/def-call, py.return-values/return-vs-print, py.booleans-and-comparisons/compare]
  test_has_digit: [py.strings-as-sequences/loop-chars, py.return-values/use-result]
  test_has_upper: [py.strings-as-sequences/loop-chars, py.booleans-and-comparisons/compare]
  test_verdict: [py.decomposition/compose, py.if-elif-else/elif-order, py.return-values/use-result]
  test_docstrings: [py.decomposition/docstrings]
  test_tests: [py.testing-with-assert/test-functions, py.testing-with-assert/choose-cases]
  test_program: [py.testing-with-assert/test-functions, py.strings-and-input/input-text]
