id: build-pin-checker
stage: build
rev: 1
title: "PIN checker"
prompt: |
  Starting from a blank editor, write a PIN checker built from small functions, each with a docstring:

  - `is_four_digits(pin)` returns `True` when the PIN is exactly 4 characters and every one is a digit, `0` to `9`.
  - `not_all_same(pin)` returns `True` when the characters are not all the same (`1111` fails it).
  - `not_counting_up(pin)` returns `True` unless each digit is one more than the one before it (`1234` and `6789` fail it; `4321` passes).
  - `check_pin(pin)` returns `"OK"` when all three hold. Otherwise it returns the **first** problem, in this order: `"must be 4 digits"`, `"digits must not all be the same"`, `"digits must not count up"`.
  - `test_check_pin()` has at least four asserts covering a good PIN and each rule failing, and ends with `print("check_pin: all checks passed")`.
  - `main()` asks for a PIN with `input` and prints the verdict.

  Finish with:

  ```python
  if __name__ == "__main__":
      test_check_pin()
      main()
  ```

  So typing `1357` prints:

  ```
  check_pin: all checks passed
  OK
  ```

  `"0" <= ch <= "9"` tells you whether a character is a digit, and `int(ch)` turns one into a number.
test_skills:
  test_four_digits: [py.defining-functions/def-call, py.strings-as-sequences/loop-chars, py.booleans-and-comparisons/compare]
  test_not_all_same: [py.strings-as-sequences/index, py.return-values/use-result]
  test_not_counting_up: [py.strings-as-sequences/index, py.strings-and-input/convert, py.for-and-range/range-bounds]
  test_verdict: [py.decomposition/compose, py.if-elif-else/elif-order, py.return-values/use-result]
  test_docstrings: [py.decomposition/docstrings]
  test_tests: [py.testing-with-assert/test-functions, py.testing-with-assert/choose-cases]
  test_program: [py.testing-with-assert/test-functions, py.strings-and-input/input-text]
