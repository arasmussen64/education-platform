id: step-rules
stage: fill_in
rev: 1
title: "The three rules"
prompt: |
  Here's the checkpoint's password checker with the three rule functions unfinished. Replace each `...`: the smallest length allowed, the last digit, and the first capital letter. Running the program and typing `Secret99` should print:

  ```
  check_password: all checks passed
  OK
  ```
hints:
  - "A password needs 8 or more characters: `len(password) >= 8`."
  - 'The digits run from `"0"` to `"9"`, so the test is `"0" <= ch <= "9"`.'
  - 'Capital letters run from `"A"` to `"Z"`.'
