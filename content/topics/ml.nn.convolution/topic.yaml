# A planned outline for the Machine Learning Foundations track
# (docs/specs/ml-foundations.md). It becomes real content when written.
id: ml.nn.convolution
kind: topic
status: planned
title: "Convolutions: a layer that reads images"
summary: A 2-D cross-correlation by hand, a kernel as a feature detector, padding and stride, why a convolutional layer has far fewer parameters than a dense one on an image, pooling, and the forward and backward pass of a small convolutional layer checked numerically.
prerequisites:
- ml.nn.backward-layers
estimated_minutes: 60
rev: 1
objectives:
- Compute a 2-D cross-correlation by hand and in code, and say what an edge-detecting kernel does.
- Count the parameters of a convolutional layer against a dense layer on the same image, and say where the saving comes from.
- Implement the forward and backward pass of a single-channel convolutional layer and gradient-check it.
- Say what pooling and stride do to the shape and to what the network can see.
