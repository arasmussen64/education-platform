id: build-the-address-plan-clinic
stage: build
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "The address plan for the clinic"
prompt: |
  A fresh version of part 1, in another story: a second try that can't be passed from memory. The clinic is building its estate in three clouds: four regions in each of AWS, Azure and Google Cloud, joined to its two data centres, in Leeds and Bristol. Before the first network is made, it wants an address plan that will last five years: an IPv4 and an IPv6 block for every region and data centre, and one summary for each cloud.

  Everything is in `/srv/plan/`:

  - `README.txt`: the task, the rules the plan must keep, what each file's columns and settings mean, and where each cloud fact came from. Read it first: the checks hold you to it.
  - `sites.csv`: the twelve regions, with how many subnets each has today and how many machines its busiest subnet has, and the two data centres.
  - `policy.txt`: the clinic's address space, the blocks already in use, the growth to plan for, the addresses each cloud keeps back in every subnet, and the IPv6 sizes.

  Fill in `~/plan/plan.csv` (`nano ~/plan/plan.csv`): every row is named already, and each needs its IPv4 block and its IPv6 block. `plan-show` prints your plan as a tree, each block with its first and last address and how big it is, to look it over; `ipcalc` and `sipcalc` are here too. There are no steps and no hints here, only the requirements and the rules.

  **Time yourself.** A plan like this should take about 60 minutes. Note the time when you open the lab's shell (`date`). Nothing stops you at 60 minutes: the target is yours to hold yourself to.

  When every cell is filled in, run the checks.
test_skills:
  plan-complete: [csa.net.cidr/block-math, csa.net.ipv6/v6-notation]
  requirements-untouched: [csa.linux.shell/navigate]
  v4-sizes: [csa.net.cidr/block-math]
  v4-dcs: [csa.net.cidr/split-and-summarise]
  v4-apart: [csa.net.cidr/overlaps, csa.net.cidr/private-and-reserved]
  v4-summaries: [csa.net.cidr/split-and-summarise]
  v6-sizes: [csa.net.ipv6/v6-plan, csa.net.ipv6/v6-notation]
  v6-apart: [csa.net.ipv6/v6-plan, csa.net.ipv6/v6-address-types]
