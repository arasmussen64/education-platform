id: step-the-whole-plan
stage: fill_in
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "Step 4 of the plan: the whole plan"
prompt: |
  Step 4 of the plan: the whole plan, from an outline. `~/plan/plan.csv` has every row named and no blocks, and at the top, as comments, the order of work. Fill in every cell, in that order, by the rules of `/srv/plan/README.txt`.

  Edit the plan with `nano ~/plan/plan.csv`; `plan-show` shows it as a tree. This is the build itself, with the order of work and the hints: once it passes, the build is the same plan.
hints:
  - "Work in the outline's order, and run the checks after each part: each check is one rule, and its message names the row it found breaking it."
  - "Sizes: machines × 3 + the cloud's reserved addresses, up to a power of two, is a subnet; twice the subnets, up to a power of two, is a region. A summary is twice what its regions take, up to a power of two."
  - "Placing: biggest first, each block on a multiple of its own size, every summary away from 10.0 and 10.1 (the data centres), 10.100 and 10.255 (in use)."
  - "IPv6: one hex digit is four bits, so a /44 holds 16 /48s that differ in one digit. Google Cloud's network is a /48 inside fd20::/20; its regions are `-`."
