frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 203.0.113.1
!
router bgp 64512
 bgp router-id 10.100.0.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.62.2 remote-as 65020
 neighbor 169.254.62.2 description vpn, a Site-to-Site VPN
 neighbor 169.254.62.2 timers connect 5
 neighbor 169.254.100.1 remote-as 65020
 neighbor 169.254.100.1 description dx, a private circuit
 neighbor 169.254.100.1 timers connect 5
 !
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 10.100.0.0/16
  redistribute kernel route-map OFFER
  neighbor 169.254.62.2 route-map FROM-CUSTOMER in
  neighbor 169.254.62.2 route-map TO-CUSTOMER out
  neighbor 169.254.100.1 route-map FROM-CUSTOMER in
  neighbor 169.254.100.1 route-map TO-CUSTOMER out
  maximum-paths 1
 exit-address-family
exit
!
ip prefix-list CLOUD seq 5 permit 0.0.0.0/0
ip prefix-list CLOUD seq 10 permit 10.100.0.0/16
ip prefix-list OFFERS seq 5 permit 10.100.0.0/16 ge 24 le 25
ip prefix-list OFFERS seq 10 permit 172.16.0.0/12 ge 24 le 24
!
route-map FROM-CUSTOMER permit 10
exit
!
route-map OFFER permit 10
 match ip address prefix-list OFFERS
exit
!
route-map TO-CUSTOMER permit 10
 match ip address prefix-list CLOUD
exit
!
route-map TO-CUSTOMER permit 20
 match ip address prefix-list OFFERS
exit
!
