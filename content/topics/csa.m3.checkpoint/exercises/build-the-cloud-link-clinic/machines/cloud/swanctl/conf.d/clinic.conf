# The provider's side of the clinic's VPN (scenery, modelled on a cloud's VPN
# gateway). It answers the data centre's router and never starts the
# tunnel itself. Its CHILD_SA carries everything (0.0.0.0/0 both ways) with
# the mark 5, which ties it to cloud's vti0. Like many providers' gateways,
# it accepts the strong proposals on its sheet and, for old devices, a weak
# pair as well (AES-128 with SHA-1 and DH group 2). Modelled on AWS's
# documented behaviour ("Site-to-Site VPN tunnel endpoints evaluate
# proposals from your customer gateway starting with the lowest configured
# value from the list below, regardless of the proposal order from the
# customer gateway", read 2026-11-12): the weak pair comes first in its own
# lists, and strongSwan as a responder prefers its own order, so a gateway
# that offers the weak pair at all, even after the strong one, gets it.
connections {
  clinic {
    version = 2
    local_addrs = 203.0.113.40
    remote_addrs = 198.51.100.40
    proposals = aes128-sha1-modp1024,aes256-sha256-modp2048
    dpd_delay = 10s
    local {
      auth = psk
      id = 203.0.113.40
    }
    remote {
      auth = psk
      id = 198.51.100.40
    }
    children {
      clinic-vti {
        local_ts = 0.0.0.0/0
        remote_ts = 0.0.0.0/0
        mode = tunnel
        mark_in = 5
        mark_out = 5
        esp_proposals = aes128-sha1-modp1024,aes256gcm16-modp2048
        start_action = none
        dpd_action = clear
      }
    }
  }
}
secrets {
  ike-clinic {
    id-1 = 203.0.113.40
    id-2 = 198.51.100.40
    secret = "Fz3kW8nR5tY2bH9qL4vM7cX6"
  }
}
