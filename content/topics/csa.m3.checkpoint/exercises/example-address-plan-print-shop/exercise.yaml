id: example-address-plan-print-shop
stage: worked_example
runtime: lab
lab:
  restart_trial: true
rev: 1
title: "An address plan, worked through"
prompt: |
  A solved sibling of the checkpoint's build, in another story: a print shop's smaller estate, two clouds (AWS and Google Cloud) with two regions each, and one data centre. The walkthrough plans it in the order the build needs: read the rules, size each subnet, then each region, then each cloud's summary with its room to grow, place the biggest blocks first, keep the data centre where it is, add the IPv6 column, and look it over. Type each line yourself in the lab's shell and read what it prints before you type the next; the comment lines (starting with `#`) say what the numbers mean, and you can leave them out. Then run the checks: they are the ones the checkpoint's build uses, and the plan you wrote passes them.
steps:
  - label: "Read the rules first"
    lines: "6-7"
    note: "`README.txt` is the whole job: what each row is, the seven rules the checks hold the plan to, and where the clouds' facts came from. `sites.csv` gives each region's subnets and the machines in its busiest subnet today; `policy.txt` the print shop's space, 10.0.0.0/8, what's in use (its data centre, 10.50.0.0/16, and an old office range, 10.51.0.0/16), the growth (3 times the machines, 2 times the subnets, 2 times the room in a summary), the addresses each cloud keeps back (AWS 5, Google Cloud 4) and the IPv6 sizes."
  - label: "Size each subnet"
    lines: "9-14"
    note: "A subnet must hold three times today's machines (five years' growth) plus the addresses its cloud keeps back of every subnet: AWS 5, Google Cloud 4. Blocks come in powers of two, so each goes up to the next one: 305 needs 512. Leaving the reserved addresses out changes nothing here (120 and 124 both fit in 128), but next to a power of two it can: 84 machines × 3 = 252 fit in 256, and 252 + 5 = 257 don't. `ipcalc -b` prints a block's range: 10.0.0.0/23 runs from 10.0.0.0 to 10.0.1.255, 512 addresses (its `Hosts/Net` line says 510, because it leaves out the first and the last)."
  - label: "Size each region"
    lines: "16-20"
    note: "A region's block holds twice today's subnets, at the size each needs. 6 subnets of 512 are 3,072 addresses, which no block holds exactly, so gcp-us-east takes the next power of two, 4,096. A block of 2 to the power n addresses is a /(32 − n): 4,096 is 2^12, a /20."
  - label: "Size each summary, with room to grow"
    lines: "22-24"
    note: "A cloud's summary is one block that holds all its regions, so the rest of the estate reaches the cloud by one route, and keeps as much again free for regions it doesn't have yet. AWS's two regions take 5,120 addresses; twice that is 10,240; the next power of two is 16,384, a /18. Google Cloud's 9,216 needs a /18 too: a /19 holds only 8,192."
  - label: "Place the biggest first, away from what's in use"
    lines: "26-28"
    note: "Every block starts on a multiple of its own size, so place the biggest first and fill from the start: a /18 can start where the third number is 0, 64, 128 or 192; inside it a /20 on a multiple of 16, a /22 of 4, a /23 of 2. 10.0.0.0/18 and 10.0.64.0/18 are far from 10.50 and 10.51, which are in use. Each region sits inside its own cloud's summary, and none overlaps another."
  - label: "The data centre keeps its block"
    lines: "30-30"
    note: "A data centre can't be renumbered, so its row is its block in use, and `onprem`, the summary for the data centres, is the smallest block that holds them all. With one data centre that is its own block; with two, like the checkpoint's, it is the smallest block both fit in."
  - label: "The IPv6 column, on nibble boundaries"
    lines: "32-35"
    note: "IPv6 isn't short of addresses, so the plan is about structure: a /44 for each summary from the print shop's /40 (16 of them, differing in one hex digit), a /48 for each site inside its summary (16 in a /44, differing in the next digit). Each prefix length is a multiple of 4, so every boundary falls on a hex digit. Google Cloud gives a network a /48 from fd20::/20 (the first digit of the second group is 0, so fd20:5b2:: is fd20:05b2::), and picks each subnet's /64 from it itself, so its regions are `-`. `sipcalc` prints an IPv6 block's range."
  - label: "Write the plan and look it over"
    lines: "37-48"
    note: "`cat > ~/plan/plan.csv <<'EOF'` writes every line up to `EOF` into the plan: the header and one row per block, IPv4 then IPv6. `plan-show` prints it as a tree, each block under its summary with its first and last address, which is the quickest way to see an overlap. Then run the checks: the same ones the checkpoint's build uses."
