id: fill-patch-server
stage: fill_in
runtime: lab
lab:
  init: systemd
rev: 1
title: "Finish the patch script"
prompt: |
  In the lab, `~/bin/patch-server` is meant to patch the machine the careful way: refresh the package list, show what's waiting, keep `shop-report` at its current version because version 2.1 hasn't been tested yet, upgrade everything else without stopping to ask, and say whether a reboot is needed. Four of its lines have `...` where a word belongs. Fill them in with `nano ~/bin/patch-server`, run it, and check the result with `apt policy shop-report` and `apt-mark showhold`. Then run the checks.
hints:
  - "The first two gaps are the pair the lesson warns people confuse: `apt update` refreshes the list, and `apt list --upgradable` shows what has a newer version."
  - "`apt-mark hold shop-report` keeps it where it is; `apt-mark showhold` lists what's held, `apt-mark unhold` releases it."
  - "`apt upgrade -y` installs the newer versions; `-y` answers the \"continue?\" question, which matters in a script nobody is watching."
skills: [apt-dnf, patching]
