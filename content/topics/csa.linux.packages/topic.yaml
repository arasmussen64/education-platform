id: csa.linux.packages
kind: topic
status: ready
title: "Package management and patching"
summary: "Install, update and pin software with apt and dnf, keep a server patched without breaking it, and know why a cloud fleet is replaced from a fresh image rather than patched in place."
prerequisites: [csa.linux.shell]
estimated_minutes: 90
rev: 1
objectives:
  - "Install, remove, search for and inspect packages with `apt` and `dnf`, and explain what a package, a version, a dependency and a repository are."
  - "Tell `apt update` from `apt upgrade`, find which updates are security fixes, and pin or hold a package at a known version."
  - "Patch a server safely: security updates, automatic updates, when a reboot is needed, and how to check what needs restarting."
  - "Explain mutable and immutable servers, and why a cloud fleet is replaced from a new image rather than patched one machine at a time."
