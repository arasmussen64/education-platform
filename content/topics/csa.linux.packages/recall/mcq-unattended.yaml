id: mcq-unattended
type: mcq
rev: 1
prompt: |
  You want a server to install security fixes by itself every night, but not every other update, and not to reboot on its own. What's the usual setup on Ubuntu?
choices:
  - "`unattended-upgrades`, with the security origin allowed and automatic reboot off (and `dnf-automatic` on Fedora and RHEL)"
  - "A cron job that runs `apt upgrade -y` every night"
  - "`apt update` in `/etc/rc.local`"
  - "Nothing; Ubuntu installs all updates automatically by default"
answer: 0
explanation: |
  `unattended-upgrades` is built for this: its config lists which origins to take updates from (the security suite by default), lets you blacklist packages, mails or logs what it did, and has a separate switch for automatic reboots, which you leave off for servers you reboot on your own schedule. A blind `apt upgrade -y` installs everything, including the database upgrade you meant to hold. Ubuntu Server enables unattended security upgrades by default on many installs, but check rather than assume.
skills: [patching]
