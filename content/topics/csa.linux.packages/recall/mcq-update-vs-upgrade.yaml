id: mcq-update-vs-upgrade
type: mcq
rev: 1
prompt: |
  What is the difference between `apt update` and `apt upgrade`?
choices:
  - "`update` refreshes the list of available package versions from the repositories and installs nothing; `upgrade` installs the newer versions of what's installed"
  - "`update` installs updates; `upgrade` moves to the next release of the distribution"
  - "They're the same; `upgrade` is the newer spelling"
  - "`update` upgrades one package; `upgrade` upgrades all of them"
answer: 0
explanation: |
  `apt update` only downloads the package lists, which is why it's fast and changes nothing on the system. `apt upgrade` uses those lists to install newer versions. Run them in that order, with `apt list --upgradable` in between if you want to see what would change. Moving to the next release is `do-release-upgrade` on Ubuntu, a different thing again. On the dnf side, `dnf check-update` and `dnf upgrade` are the matching pair.
skills: [apt-dnf]
