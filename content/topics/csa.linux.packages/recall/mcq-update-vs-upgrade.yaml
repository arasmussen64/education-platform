id: mcq-update-vs-upgrade
type: mcq
rev: 2
prompt: |
  What is the difference between `apt update` and `apt upgrade`?
choices:
  - "`update` installs the newer versions; `upgrade` moves the server to the next Ubuntu release"
  - "`update` refreshes the list of available versions; `upgrade` installs the newer ones"
  - "`update` installs the security fixes only; `upgrade` installs every newer version there is"
  - "`update` upgrades the one package you name; `upgrade` upgrades all the installed packages"
answer: 1
explanation: |
  `apt update` only downloads the package lists from the repositories, which is why it's fast and installs nothing, security fix or otherwise. `apt upgrade` uses those lists to install the newer versions of what's already installed. Run them in that order, with `apt list --upgradable` in between if you want to see what would change.

  Moving to the next release is `do-release-upgrade` on Ubuntu, a different thing again. Upgrading only the packages you name is `apt install --only-upgrade`. On the dnf side, `dnf check-update` and `dnf upgrade` are the matching pair.
skills: [apt-dnf]
