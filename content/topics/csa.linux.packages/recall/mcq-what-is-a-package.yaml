id: mcq-what-is-a-package
type: mcq
rev: 1
prompt: |
  You run `apt install nginx` and the output lists twelve packages to install, not one. Why?
choices:
  - "`apt` installs everything from the same repository together"
  - "nginx depends on other packages (libraries and tools it needs), and the package manager installs the dependencies too, in the right order"
  - "The twelve are older versions of nginx, kept for rollback"
  - "`apt` always installs the twelve most popular packages"
answer: 1
explanation: |
  A package names what it needs to run: shared libraries, a few tools, maybe a user to be created. The package manager reads those dependencies, finds them in the repositories, and installs them first, which is most of what makes `apt` more than a download tool. Removing nginx later leaves the dependencies; `apt autoremove` clears the ones nothing needs any more.
skills: [repositories, apt-dnf]
