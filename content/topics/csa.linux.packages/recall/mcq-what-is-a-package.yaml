id: mcq-what-is-a-package
type: mcq
rev: 2
prompt: |
  You run `apt install nginx` and the output lists twelve packages to install, not one. Why?
choices:
  - "nginx comes in twelve parts, one for each folder it installs into, and `apt` lists each part"
  - "The other eleven are older versions of nginx, which `apt` keeps so that you can roll back"
  - "nginx depends on other packages, such as libraries, and `apt` installs those along with it"
  - "`apt upgrade` runs first on every install, and the other eleven are updates that were waiting"
answer: 2
explanation: |
  A package names what it needs to run: shared libraries, a few tools, maybe a user to be created. The package manager reads those dependencies, finds them in the repositories, and installs them first, in the right order, which is most of what makes `apt` more than a download tool. Removing nginx later leaves the dependencies; `apt autoremove` clears the ones nothing needs any more.

  The eleven extra names are different packages, not pieces or older copies of nginx: `apt` keeps one version of a package installed, and a package's files can go into many folders. And `apt install` doesn't run an upgrade first: packages that are already installed stay as they are unless nginx needs a newer one.
skills: [repositories, apt-dnf]
