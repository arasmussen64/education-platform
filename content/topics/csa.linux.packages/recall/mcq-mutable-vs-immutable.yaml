id: mcq-mutable-vs-immutable
type: mcq
rev: 1
prompt: |
  What does it mean to treat servers as *immutable*?
choices:
  - "Once a server is built from an image it is never changed in place; to update it, you build a new image with the changes and replace the server with one made from it"
  - "The server's disk is read-only, so nothing can be written to it"
  - "Servers are never updated"
  - "Only root may change the server"
answer: 0
explanation: |
  Mutable servers are patched, tweaked and fixed in place, and over time each becomes unique: nobody is sure what's on it, and rebuilding it is a research project. Immutable servers push every change through the image: build, test, deploy, and if it's wrong, deploy the previous image. The disk isn't literally read-only (logs are written), and updates happen more often, not less; they just arrive as new servers.
skills: [immutable]
