id: mcq-mutable-vs-immutable
type: mcq
rev: 2
prompt: |
  What does it mean to treat servers as *immutable*?
choices:
  - "A server's disk is mounted read-only, so that no program and no person can write anything to it"
  - "Every server gets the same patches by hand, in the same order, so that they all stay identical"
  - "Security updates stop being applied to the service at all, since any change to it is a risk"
  - "A server is never changed in place: an update is a new image and new servers made from it"
answer: 3
explanation: |
  Mutable servers are patched, tweaked and fixed in place, and over time each becomes unique: nobody is sure what's on it, and rebuilding it is a research project. That happens even when everyone means to apply the same patches in the same order, because hands slip and servers miss a round. Immutable servers push every change through the image: build, test, deploy, and if it's wrong, deploy the previous image.

  The disk isn't literally read-only: logs and data are still written. And updates happen more often this way, not less; they just arrive as new servers that replace the old ones.
skills: [immutable]
