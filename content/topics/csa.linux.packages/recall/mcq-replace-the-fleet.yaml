id: mcq-replace-the-fleet
type: mcq
rev: 1
prompt: |
  You run forty identical web servers in the cloud behind a load balancer, and a security update is out. Which approach do experienced teams prefer, and why?
choices:
  - "SSH to each server and run `apt upgrade`, because it's the fastest"
  - "Build and test one new machine image with the update, then replace the servers from it a few at a time, because every server stays identical, the image is a tested artifact, and rollback is redeploying the old image"
  - "Upgrade one server and copy its disk to the others"
  - "Wait for the next release of the distribution"
answer: 1
explanation: |
  Forty servers patched by hand are forty chances for one to end up different, and no way back if the update misbehaves. A new image is built once, tested once, and rolled out gradually (an autoscaling group or deployment tool does the replacing), with the old image a known-good fallback. It's also the only approach that scales to four hundred servers, or to servers that are created and destroyed automatically.
skills: [immutable]
