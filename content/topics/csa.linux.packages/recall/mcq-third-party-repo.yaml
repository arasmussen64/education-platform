id: mcq-third-party-repo
type: mcq
rev: 1
prompt: |
  A tool's install guide says: add our repository to `sources.list.d` and import our signing key, then `apt install`. What are you agreeing to?
choices:
  - "Nothing beyond downloading one package"
  - "To trust that organisation with root on the server: their packages run install scripts as root, and every future update from them will too"
  - "To let them read your other packages' configuration"
  - "To pay for the software"
answer: 1
explanation: |
  Repositories are signed so that only the key holder can publish to them, which is good: it stops tampering in transit. But it also means whoever holds that key can ship you anything, and package installation runs their scripts as root, now and at every update. That's acceptable for a vendor you'd trust anyway, and a reason to prefer the distribution's own repositories or a container image when you wouldn't.
skills: [repositories]
