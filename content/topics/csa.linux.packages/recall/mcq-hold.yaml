id: mcq-hold
type: mcq
rev: 2
prompt: |
  Your database has been tested at one exact version, and the rest of the server must keep getting security updates. What do you do before the next `apt upgrade`?
choices:
  - "Run `apt install --only-upgrade postgresql`, so that this one package is left out of every upgrade"
  - "Take the `noble-updates` suite out of the sources, so that only security fixes can be installed"
  - "Run `apt-mark hold postgresql`, so that this one package stays put while everything else updates"
  - "Run `apt purge postgresql` before the upgrade, then install it again at the version you tested"
answer: 2
explanation: |
  A hold tells the package manager to leave that one package at its current version; `apt list --upgradable` still shows that a newer version exists, but `upgrade` skips it. The rest of the system keeps its security updates, which is the point. When you're ready to move the database, `apt-mark unhold` and upgrade it deliberately. On dnf systems the same thing is `dnf versionlock add postgresql`.

  `--only-upgrade` does the opposite of leaving a package out: it upgrades the packages you name and nothing else. Dropping `noble-updates` costs every package its bug fixes and still doesn't pin the database, because a security fix for PostgreSQL would change its version too. And `purge` deletes the database's configuration, after which a plain install brings whatever version is current, not the one you tested.
skills: [patching]
