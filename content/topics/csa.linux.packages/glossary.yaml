- term: package
  definition: "Software bundled ready to install: its files, its version number and the list of other packages it needs. Linux distributions, and languages such as Python, each have their own."
- term: package manager
  definition: "The tool that downloads packages from repositories, installs them with what they need and keeps track of what's installed, such as `apt` or `dnf`."
- term: security update
  definition: "A new version of a package that fixes a security flaw. Ubuntu publishes them in a suite of their own, such as `noble-security`, so they can be installed first."
- term: configuration drift
  definition: "Servers that were meant to be identical slowly becoming different, as each is patched and fixed by hand: one misses an update, another gets a tool nobody recorded."
- term: golden image
  definition: "The tested machine image, with the software and updates already in it, that every server of a fleet is made from."
- term: immutable server
  definition: "A server that is never changed after it starts. An update is a new image and new servers made from it, which replace the old ones."
