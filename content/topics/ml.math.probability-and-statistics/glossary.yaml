- term: median
  definition: The middle value of a list once it is sorted, or the mean of the two middle values when the count is even. A few huge values don't move it.
- term: outlier
  definition: A value far from the rest of its list, like one 50-minute delivery among 12-minute ones. It pulls the mean towards it and leaves the median alone.
- term: standard deviation
  definition: The typical distance between a list's values and their mean. Square each distance from the mean, average the squares, take the square root. Small means the values huddle near the mean.
- term: variance
  definition: The mean of the squared distances between a list's values and their mean. Its square root is the standard deviation.
- term: probability
  definition: A number from 0 (can't happen) to 1 (certain) saying how likely something is. For equally likely outcomes it is the favourable outcomes divided by all outcomes.
- term: independent events
  definition: Events where one happening tells you nothing about the other, like a coin flip and a die roll. The chance of both is the product of their chances.
- term: base rate
  definition: How common something is before any test is run, such as 4 scam emails in 100. It decides how much a positive test result is worth.
- term: false positive
  definition: A test saying "yes" about a case that is really a "no", such as an honest email flagged as a scam.
- term: Bayes' rule
  definition: The formula for turning "the chance of a positive result given the condition" into "the chance of the condition given a positive result". A table of 1,000 cases does the same job by counting.
