id: py.nested-data
kind: topic
status: ready
title: "Nested data"
summary: "Lists inside lists for grids, dictionaries inside lists for records, and how to read, loop over and build them."
prerequisites: [py.list-algorithms, py.dictionaries]
estimated_minutes: 45
rev: 1
objectives:
  - "Work with a list of lists as a grid: `grid[row][col]`, a loop over rows with a loop over cells inside, and building one."
  - "Work with a list of dictionaries as records: each dictionary is one thing with named fields; loop over them, read fields, find and filter."
  - "Choose a shape for data: a list of lists for a grid of same-kind values, a list of dictionaries for things with named fields."
