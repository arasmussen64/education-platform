prove:
  build: build-class-list
  debug: debug-nested
  explain:
    prompt: |
      A friend keeps students as two separate lists, `names` and `scores`, and keeps getting them out of step. Explain the list-of-dictionaries shape to them: what one record is and what it looks like, how to get the second student's score, how to loop over all the students and print each one, why `students[1]["score"]` reads from the outside in, and when a list of lists would be the better shape instead.
    rubric:
      - id: record
        required: true
        description: "Each student is a dictionary with named fields, like {\"name\": \"Bob\", \"score\": 78}, so a name and its score can't come apart; the list holds one dictionary per student."
      - id: access
        required: true
        description: "students[1] is the second dictionary, and [\"score\"] then reads one field of it: outer brackets first, then inner."
      - id: loop
        required: true
        description: "for student in students: gives one dictionary at a time, and student[\"name\"], student[\"score\"] read its fields."
      - id: shape
        required: true
        description: "A list of lists suits a grid of same-kind values reached by row and column; a list of dictionaries suits things with named fields."
    model_answer: |
      Keep each student's facts together in one dictionary: {"name": "Bob", "score": 78}. That's one record, with named fields, so the name and the score can never slip out of step. The class is a list of those dictionaries, one per student. To get the second student's score, work from the outside in: students[1] picks the second dictionary, and ["score"] reads that field of it. To print them all, loop over the list: for student in students, then student["name"] and student["score"] on each. A list of lists is the better shape when everything is the same kind of value and you reach it by position, like the cells of a grid: grid[row][col]. When the parts have names, use dictionaries; when they have positions, use lists.
review_pool:
  - review-predict-grid
  - review-mcq-field
  - review-mcq-shape-grid
  - review-code-column
  - mcq-grid-index
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: grids
    description: "Read, loop over and build a list of lists, as a grid of rows and columns"
  - id: records
    description: "Read, loop over, find and filter a list of dictionaries, as records with named fields"
  - id: shape
    description: "Choose between a list of lists and a list of dictionaries for a set of data"
