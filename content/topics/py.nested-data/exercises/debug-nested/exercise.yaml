id: debug-nested
stage: debug
rev: 2
title: "Records and a grid"
prompt: |
  This program works with a list of student records, each one a dictionary, and a grid stored as a list of rows. `names_of` gives the students' names, `best_name` the name of the top scorer, and `cell(grid, row, col)` the value at that row and column. It should print:

  ```
  ['Ada', 'Bob']
  Ada
  6
  ```

  Instead its first line isn't a list of names, and then it stops with a `KeyError`. It has three bugs, and fixing one shows the next. Run it, read the error, and check each function against its docstring.
hints:
  - "Compare the first line printed with `['Ada', 'Bob']`. What did `names_of` put in the list for each student?"
  - "In `names_of`, `student` is a whole record, a dictionary. `student[\"name\"]` is just the name."
  - "Read the `KeyError`: which key does it say is missing? Compare it, letter by letter, with the keys in `students`."
  - "With the rest fixed, `cell(grid, 1, 2)` stops with an `IndexError`. The grid is a list of rows, so the first index picks the row: `grid[row][col]`."
skills: [records, grids]
