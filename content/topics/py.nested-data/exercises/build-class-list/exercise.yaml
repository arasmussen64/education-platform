id: build-class-list
stage: build
rev: 1
title: "A class list and a grid"
prompt: |
  Starting from a blank editor, write four functions with docstrings:

  - `names_of(students)` returns a list of the names, in order. Each student is a dictionary with `"name"` and `"age"`.
  - `oldest(students)` returns the name of the student with the greatest age; if two tie, the one that comes first. The list has at least one student.
  - `average_age(students)` returns the average age as a number (not rounded).
  - `column(grid, index)` returns a list of the values in that column of a list of lists, top to bottom.

  Then `main()` prints, for the students Ada (36), Bob (41) and Cy (29), and the grid `[[1, 2, 3], [4, 5, 6]]`:

  ```
  Names: ['Ada', 'Bob', 'Cy']
  Oldest: Bob
  Average age: 35.33
  Column 1: [2, 5]
  ```

  The average is printed with two decimal places. Call `main()` at the bottom.
skills: [records, grids, shape]
