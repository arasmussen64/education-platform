title: "One column"
prompt: |
  Write a function `column(grid, index)` that returns a list of the values in one column of a list of lists, top to bottom. `column([[1, 2, 3], [4, 5, 6]], 1)` returns `[2, 5]`, and `column([], 0)` returns `[]`.
