id: example-grid-records
stage: worked_example
rev: 1
title: "A grid and some records"
prompt: |
  The two shapes side by side. Press **Run**. Then add a third row to the grid and a third student, and run again; nothing else needs to change.
steps:
  - label: "A grid: a list of lists"
    lines: "1-5"
    note: "Each inner list is a row. `grid[1][2]` reads outside in: row 1, then its cell 2, which is 6."
  - label: "Rows, then cells"
    lines: "6-11"
    note: "The first loop prints each row as a list. The second has a loop inside a loop, like drawing a grid of bricks: a row's cells on one line, then a line break."
  - label: "Records: a list of dictionaries"
    lines: "13-18"
    note: "Each dictionary is one student with named fields. The loop picks a dictionary; the keys pick its fields. The quotes inside the f-string are single so they can't be confused with the double quotes around the whole string (Python 3.12 and later would accept double quotes there too, but mixing them is easier to read)."
