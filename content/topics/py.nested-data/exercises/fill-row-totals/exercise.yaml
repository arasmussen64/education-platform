title: "Row totals"
prompt: |
  `row_totals` should return a list with the total of each row of a grid: `row_totals([[1, 2], [3, 4]])` returns `[3, 7]`. Replace each `...`: what the inner loop goes over, and what gets appended for each row.
hints:
