id: write-names-over
stage: write
rev: 1
title: "Who scored over the line?"
prompt: |
  Write a function `names_over(students, limit)` that takes a list of student records, each a dictionary with `"name"` and `"score"`, and returns a list of the names of the students whose score is **greater than** `limit`, in order. For `[{"name": "Ada", "score": 91}, {"name": "Bob", "score": 78}]` and a limit of 80, it returns `["Ada"]`.
hints:
  - "This is a filter over records: an empty list, a loop over the students, and an `append` when the test passes."
  - "The test reads a field: `student[\"score\"] > limit`. What you append is another field: `student[\"name\"]`."
skills: [records]
