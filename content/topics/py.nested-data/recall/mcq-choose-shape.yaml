id: mcq-choose-shape
type: mcq
rev: 1
prompt: |
  You need to store 30 cities, each with a name, a country and a population, so that each city's facts stay together. Which shape fits best?
choices:
  - 'One list of 90 strings, three per city, in order'
  - 'A list of 30 dictionaries, each with the keys `name`, `country` and `population`'
  - 'Three separate lists of 30: names, countries, populations'
  - 'One long string with commas between the facts'
answer: 1
explanation: |
  Each city is a thing with named parts, so a dictionary per city keeps its facts together, and a list holds the thirty of them. Parallel lists or one flat list rely on positions staying in step, which is exactly how facts get mixed up. A list of lists would suit a grid of same-kind values, like a table of numbers.
skills: [shape]
