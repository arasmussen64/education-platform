id: review-mcq-shape-grid
type: mcq
rev: 1
prompt: |
  You need to store a 10 by 10 multiplication table so that a program can read the number in any row and column. Which shape fits best?
choices:
  - 'A list of 10 lists, one per row, each holding 10 numbers'
  - 'A list of 100 dictionaries, each with the keys `row`, `column` and `value`'
  - 'One dictionary with 100 keys like `"3x7"`'
  - 'A list of 100 strings like `"3 x 7 = 21"`'
answer: 0
explanation: |
  The values are all the same kind and are reached by position, row then column, which is exactly `table[row][column]` on a list of lists. The other shapes work, but they make the simplest question, "what's at row 3, column 7?", harder to ask. Records with named fields are for things whose parts have names, not positions.
skills: [shape]
