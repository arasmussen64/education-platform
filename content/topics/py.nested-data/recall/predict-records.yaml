id: predict-records
type: predict_output
rev: 1
prompt: |
  What does this program print? Four lines.
code: |
  students = [
      {"name": "Ada", "score": 91},
      {"name": "Bob", "score": 78},
  ]
  for student in students:
      print(student["name"], student["score"])
  print(len(students))
  print(students[1]["name"])
expected_output: |
  Ada 91
  Bob 78
  2
  Bob
explanation: |
  The loop visits one dictionary at a time and reads two of its fields. `len` counts the records, not the fields. `students[1]` is the second dictionary and `["name"]` reads its name: outside in.
skills: [records]
