id: review-predict-grid
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines.
code: |
  grid = [[1, 2], [3, 4], [5, 6]]
  total = 0
  for row in grid:
      for cell in row:
          total += cell
  print(total)
  print(len(grid), len(grid[0]))
  print(grid[2][1])
expected_output: |
  21
  3 2
  6
explanation: |
  The nested loop visits every cell, adding 1 through 6: 21. `len(grid)` counts the rows, 3, and `len(grid[0])` the cells in the first row, 2. `grid[2][1]` is the third row's second cell, 6.
skills: [grids]
