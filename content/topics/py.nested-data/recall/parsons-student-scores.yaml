id: parsons-student-scores
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `3`. One line is a decoy that doesn't belong.
lines:
  - 'student = {"name": "Ada", "scores": [90, 80]}'
  - 'scores = student["scores"]'
  - 'scores.append(100)'
  - 'print(len(student["scores"]))'
distractors:
  - 'scores = student.scores'
explanation: |
  The record is a dictionary, so its fields are reached with square brackets: `student["scores"]`, not `student.scores`. That gives the list itself, not a copy, so appending to `scores` makes the record's list three long.
skills: [records, shape]
