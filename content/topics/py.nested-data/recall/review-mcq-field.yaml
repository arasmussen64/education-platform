id: review-mcq-field
type: mcq
rev: 1
prompt: |
  With `people = [{"name": "Ada", "age": 36}]`, which expression is Ada's age?
choices:
  - '`people["Ada"]["age"]`'
  - '`people[0]["age"]`'
  - '`people[0][1]`'
  - '`people.age`'
answer: 1
explanation: |
  `people` is a list, so its items are reached by position: `people[0]` is the first dictionary. That dictionary's fields are reached by key: `["age"]`. A list can't be indexed by a name, and a dictionary can't be indexed by a position.
skills: [records]
