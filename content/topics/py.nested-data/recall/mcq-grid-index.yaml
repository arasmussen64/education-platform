id: mcq-grid-index
type: mcq
rev: 1
prompt: |
  With `grid = [[1, 2, 3], [4, 5, 6]]`, what is `grid[1][0]`?
choices:
  - '`2`'
  - '`4`'
  - '`1`'
  - '`6`'
answer: 1
explanation: |
  Outside in: `grid[1]` is the second row, `[4, 5, 6]`, and `[0]` is its first cell, 4. `grid[0][1]` would be 2: first row, second cell.
skills: [grids]
