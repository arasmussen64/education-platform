# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
# IOPS and throughput are Module 1's words (its storage topic), so they
# aren't here.
- term: memory hierarchy
  definition: 'The places data can wait, from fastest and smallest to slowest and largest, each roughly a hundred times or more slower than the last: CPU caches, memory, a local disk, a network disk.'
- term: NVMe
  aliases: [Non-Volatile Memory Express]
  definition: How a computer talks to fast flash storage, over the processor's own connections with many queues at once. It says how a disk is reached, not where it is.
- term: local disk
  aliases: [ephemeral disk, instance store, temporary disk, Local SSD]
  definition: A disk inside the host a VM runs on. Fast and included in the price, kept through a reboot, lost when the VM stops, changes size or moves to another host.
- term: network-attached disk
  aliases: [network disk, EBS volume, managed disk, Persistent Disk]
  definition: A disk kept by the provider's storage service on other machines and reached over the network. It keeps its data whatever happens to the VM, and is capped in IOPS and throughput.
- term: provisioned IOPS
  definition: Operations a second bought for a network disk beyond what it includes. Paying for more lifts the disk's cap, but never above the VM's own allowance.
- term: queue depth
  definition: How many requests are in flight to a disk at once. Below a cap, more in flight gets more done; at a cap, each extra request only waits longer.
