prove:
  build: build-disk-tier
  debug: debug-slow-nights
  # A topic's page shows the explain prompt beside the debug from the
  # start, so it tells a story of its own (invoices lost in a resize): the
  # debug's story, orders spooled on the local disk, would give its third
  # fault away.
  explain:
    prompt: |
      A team kept the only copy of the invoices its customers upload on its VM's local disk, "because it's the fast one". Over the weekend the VM was stopped, given a bigger size and started again, and the invoices folder came back empty. A colleague now wants everything on network disks, and asks what that will cost and what the new disk will deliver. Explain, in your own words: how fast memory, a local disk and a network disk are, roughly, and what the difference means for a program; what a local disk is, why the invoices vanished, and what a local disk is still the right place for; how a network disk's allowance works: IOPS times block size until the throughput cap, the disk's allowance against the VM's, and what a deeper queue does at a cap; and one way the three clouds differ in any of this.
    rubric:
      - id: tiers
        required: true
        description: "Rough orders of magnitude: memory about 100 ns a read, a local NVMe disk tens of microseconds, a network disk about a millisecond (less on the fastest tiers); each step is a hundred times or more, so a program that waits on one read at a time is dominated by the slowest tier it uses."
      - id: disks
        required: true
        description: "A local disk (instance store, temporary disk, Local SSD) is inside the host: fast and included in the price, kept through a reboot, lost on a stop, a change of size or a move to another host, so the invoices went with the weekend's stop and resize; a network disk (EBS, managed disk, Persistent Disk) keeps its data through all of those but is slower and capped; local disks are right for caches, scratch space, temporary files and data that can be copied again, and the only copy of anything belongs on a network disk."
      - id: caps
        required: true
        description: "A network disk is provisioned for so many IOPS and so much throughput; throughput is IOPS times block size until the throughput cap binds, so small writes meet the IOPS cap and big ones the throughput cap; the VM has its own allowance for all its disks and you get the smaller of the two; at a cap a deeper queue doesn't raise the rate, it only makes each request wait longer (about queue depth divided by the rate)."
      - id: clouds-differ
        required: true
        description: "Any one correct difference between the clouds, for example: Azure quotes throughput in MB/s and AWS and Google in MiB/s; gp3 and Premium SSD v2 include 3,000 IOPS whatever the size while Google's Balanced Persistent Disk grows with the disk's size and the VM's; Azure keeps the temporary disk through a plain restart; Google can keep Local SSD through a live migration and offers keeping it through a stop as a preview; not every size has a local disk."
      - id: units
        required: false
        description: "GB and GiB, MB and MiB differ by about 7% and 5%; compare disks in the same unit, and give systemd a MiB figure in bytes, since it reads M as a million."
    model_answer: |
      Data is slower to reach the further it is from the CPU. A read from memory takes about 100 nanoseconds, a random read from a local NVMe disk tens of microseconds, and an operation on a network disk about a millisecond, a little less on the fastest tiers. Each step is a hundred times or more, so one network read costs as much time as ten thousand reads from memory, and a program that reads one thing at a time and waits for each is ruled by its slowest disk. That's why databases keep their busiest data in memory. A local disk, which AWS calls the instance store, Azure the temporary disk and Google Local SSD, is a disk inside the physical host the VM runs on. It's fast and included in the price, and it survives a reboot, but when the VM stops, the host goes back to the provider and the disk stays with it: AWS erases it, and the VM starts next time with an empty one. A change of size, which stops the VM or moves it to another host, or a host failure loses it the same way. The invoices were on that disk, so the weekend's resize took them with it. A local disk is still the right place for caches, scratch space and temporary files, and for data that can be copied again, never for the only copy of anything. A network disk, EBS, a managed disk or a Persistent Disk, keeps its data through stops, resizes and host failures, at the cost of speed and a cap. It's provisioned for so many operations a second and so many bytes a second, and throughput is IOPS times block size until the throughput cap takes over: an AWS gp3 volume includes 3,000 IOPS and 125 MiB a second, so 16 KiB writes reach the IOPS cap at about 47 MiB a second, and 256 KiB writes reach the throughput cap at 500 a second. The VM has an allowance of its own for all its disks, and you get the smaller: Azure's example VM allows 12,800 IOPS, so three disks of 5,000 deliver 12,800, not 15,000. At a cap, a deeper queue doesn't add speed; requests just wait longer in line, about the queue depth divided by the rate. One difference between the clouds: Azure quotes throughput in MB a second and AWS in MiB a second, so gp3's 125 is about 5% more than Premium SSD v2's 125.
