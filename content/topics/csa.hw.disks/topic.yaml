id: csa.hw.disks
kind: topic
status: ready
title: "Memory tiers and disks"
summary: "Where a server keeps what it's working on, from the CPU's caches to a disk across the network, and how fast each is; which disks survive a stop; and what a cloud disk and VM together will really deliver."
# The hypervisors topic teaches host, guest and VM, and the Module 1
# checkpoint stands behind it. The writer leaned on csa.linux.storage
# (IOPS, throughput, latency, queue depth, /dev/nvme names, the lab disks
# under /dev/lab/), csa.linux.services (units, drop-ins), csa.linux.cpu
# and csa.linux.memory (cgroups and their files) and csa.linux.shell.
prerequisites: [csa.hw.hypervisors]
# Counted: lesson and recap 15; the reading the lesson asks for 26 (main
# resource to the end of its capping examples 8, AWS's events table 3,
# Azure's temporary disk section 1, Google's persistence section 3, gp3 3,
# Azure's disk types table and Premium SSD v2 5, the latency page 3); 13
# quick questions at 1.5 minutes, 20; the worked example 25 (seven fio
# runs of five seconds and their reading); the fill-in 15; the write 30;
# the build 35; the debug 40; the explain 15. 221, rounded to 220.
estimated_minutes: 220
rev: 1
objectives:
  - "Place CPU cache, memory, a local NVMe disk and a network disk in order of speed, with rough numbers, and say what that means for a program that waits on each."
  - "Choose between a local ephemeral disk and a network-attached disk, from what each keeps through a reboot, a stop, a resize and a host failure on each cloud."
  - "Work out what a disk and a VM together will deliver: IOPS × block size until the throughput cap, the smaller of the disk's and the VM's allowance, and why a deeper queue doesn't beat a cap."
# Linked, never copied. Every page below was opened on 2026-11-11.
# Licences: Microsoft Learn's Azure pages are CC BY 4.0 (the LICENSE file of
# MicrosoftDocs/azure-compute-docs, read 2026-11-11); Google Cloud's pages
# are CC BY 4.0 (the Local SSD page's footer, read 2026-11-11); the AWS
# documentation is Amazon's copyright and is linked only; Colin Scott's
# latency page is MIT (the LICENSE of colin-scott/interactive_latencies).
#
# Facts the lesson and items use, with where and when they were read:
# - Azure capping examples: Standard_D8s_v3 12,800 uncached IOPS; three E30
#   disks (500 each) asked for 10,000 give 1,500; three P30 (5,000 each)
#   asked for 15,000 give 12,800. Main resource, ms.date 2026-09-09,
#   1,651 words; read 2026-11-11.
# - AWS instance store: persists on reboot; not on stop, hibernate,
#   terminate, change of instance type (the data doesn't transfer even if
#   the new type has instance store), automatic recovery; every block is
#   cryptographically erased on stop. instance-store-lifetime.html, read
#   2026-11-11. No additional charge; ideal for buffers, caches, scratch
#   data and data replicated across a fleet: InstanceStorage.html, read
#   2026-11-11.
# - AWS nvme list Model column, "Amazon Elastic Block Store" and "Amazon
#   EC2 NVMe Instance Storage": instance-block-device-mapping.html, read
#   2026-11-11. EBS on Nitro as NVMe, serial = volume ID:
#   ebs/latest/userguide/identify-nvme-ebs-device.html, read 2026-11-11.
# - Azure temporary disk: may be lost in a maintenance event, a redeploy or
#   a stop; kept through a standard restart; "Most VMs contain a temporary
#   disk"; three replicas of every managed disk. managed-disks-overview,
#   ms.date 2026-08-20, read 2026-11-11.
# - Google Local SSD: 375 GiB each; kept through a reboot and live
#   migration; lost on stop, suspend (by default), preemption, stop on host
#   maintenance; might be lost on a host error; opt-in preservation on stop
#   is in preview. disks/local-ssd, last updated 2026-11-10, read
#   2026-11-11.
# - AWS gp3: 3,000 IOPS and 125 MiB/s included, up to 80,000 and 2,000
#   MiB/s; "single-digit millisecond latency"; io2 Block Express under
#   500 µs average for 16 KiB; Outposts only 16,000 and 1,000.
#   ebs/latest/userguide/general-purpose.html, read 2026-11-11.
# - AWS SSD I/O size capped at 256 KiB; larger operations split:
#   ebs-io-characteristics.html, read 2026-11-11.
# - Azure Premium SSD v2: 3,000 IOPS and 125 MB/s free, to 80,000 IOPS;
#   Ultra Disk to 400,000 IOPS; both "submillisecond"; MB/s = 10^6 bytes a
#   second; P30 5,000 IOPS. disks-types, ms.date 2026-09-15, read
#   2026-11-11.
# - Google Balanced Persistent Disk: 3,000 IOPS and 140 MiB/s baseline per
#   instance, 6 IOPS a GiB, rising with the instance's vCPUs; throughput in
#   MiB/s. disks/performance, read 2026-11-11.
# - Latency orders of magnitude (L1 1 ns, memory 100 ns, SSD random read
#   16 µs): Colin Scott's page, worked out from trend formulas, slider to
