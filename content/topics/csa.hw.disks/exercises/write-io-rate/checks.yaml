# The checks for "Write io-rate": the script runs, refuses to run without
# its two arguments, and on each of three live services prints the right
# three lines. "Right" is the check's own reading of the same counters
# over the same stretch of time: it reads io.stat just before and just
# after the learner's script runs, so the services' real rates are the
# answer, not numbers written into the check. It runs the script over ten
# seconds: the kernel lets throttled writes through in small bursts, and
# over five seconds the script's reading and the check's differed by up to
# 2.5%, too close to the 4.9% between MB and MiB (tried on Docker Desktop,
# 2026-11-11); over ten, by 1.2% at most.
#
# The three services were chosen so that each answer is different: the
# database is held by its writes-a-second cap, the backup job (in a slice
# of its own, batch.slice) by its bytes-a-second cap, and the logger by
# neither. The wrong fixes: a folder path that only works in system.slice
# (wrong/system-slice-only.sh), one reading divided by the seconds
# (wrong/one-reading.sh), MB where MiB were asked for
# (wrong/megabytes.sh), "iops" whenever there is a cap at all
# (wrong/always-iops.sh), and reads counted instead of writes
# (wrong/reads-not-writes.sh).
checks:
  - id: runs
    description: "~/bin/io-rate is an executable script."
    command: test -x /home/learner/bin/io-rate
  - id: usage
    description: "Run with no arguments, it prints a usage line and exits with a status other than 0."
    command: |
      out=$(cd /home/learner && runuser -u learner -- /home/learner/bin/io-rate 2>&1)
      status=$?
      [ "$status" -ne 0 ] && printf '%s\n' "$out" | grep -qi 'usage'
  - id: database
    description: "For shop-db it prints its writes a second, its MiB a second, and that its writes-a-second cap is what holds it back."
    command: |
      unit=shop-db
      dev=$(lsblk -dno MAJ:MIN /dev/lab/data | tr -d ' ')
      folder=/sys/fs/cgroup$(systemctl show "$unit" -p ControlGroup --value)
      field() { grep "^$dev " "$folder/$1" | grep -o "$2=[0-9a-z]*" | cut -d= -f2; }
      w1=$(field io.stat wios); b1=$(field io.stat wbytes); t1=$(date +%s.%N)
      out=$(cd /home/learner && runuser -u learner -- /home/learner/bin/io-rate "$unit" 10 2>&1)
      w2=$(field io.stat wios); b2=$(field io.stat wbytes); t2=$(date +%s.%N)
      ic=$(field io.max wiops); bc=$(field io.max wbps)
      printf '%s\n' "$out" | awk -v w=$((w2 - w1)) -v b=$((b2 - b1)) -v t1="$t1" -v t2="$t2" \
          -v ic="${ic:-max}" -v bc="${bc:-max}" '
        function abs(x) { return x < 0 ? -x : x }
        /^writes a second: / {gw = $4; seen++}
        /^MiB a second: / {gm = $4; seen++}
        /^binding: / {gb = $2; seen++}
        END {
          s = t2 - t1; ws = w / s; ms = b / s / 1048576
          truth = "none"
          if (ic != "max" && ws >= 0.9 * ic) truth = "iops"
          else if (bc != "max" && b / s >= 0.9 * bc) truth = "throughput"
          ok = seen == 3 && gw ~ /^[0-9]+$/ && gm ~ /^[0-9]+\.[0-9]$/ \
            && abs(gw - ws) <= 0.08 * ws + 2 && abs(gm - ms) <= 0.015 * ms + 0.1 && gb == truth
          if (ok) print "right"
          else printf "printed %d of the three lines (%s, %s, %s); the check measured %.0f writes a second, %.2f MiB a second, binding: %s\n", seen, gw, gm, gb, ws, ms, truth
        }'
    expect:
      equals: right
  - id: backup
    description: "For shop-backup, which runs in batch.slice, it prints its writes a second, its MiB a second, and that its bytes-a-second cap is what holds it back."
    command: |
      unit=shop-backup
      dev=$(lsblk -dno MAJ:MIN /dev/lab/data | tr -d ' ')
      folder=/sys/fs/cgroup$(systemctl show "$unit" -p ControlGroup --value)
      field() { grep "^$dev " "$folder/$1" | grep -o "$2=[0-9a-z]*" | cut -d= -f2; }
      w1=$(field io.stat wios); b1=$(field io.stat wbytes); t1=$(date +%s.%N)
      out=$(cd /home/learner && runuser -u learner -- /home/learner/bin/io-rate "$unit" 10 2>&1)
      w2=$(field io.stat wios); b2=$(field io.stat wbytes); t2=$(date +%s.%N)
      ic=$(field io.max wiops); bc=$(field io.max wbps)
      printf '%s\n' "$out" | awk -v w=$((w2 - w1)) -v b=$((b2 - b1)) -v t1="$t1" -v t2="$t2" \
          -v ic="${ic:-max}" -v bc="${bc:-max}" '
        function abs(x) { return x < 0 ? -x : x }
        /^writes a second: / {gw = $4; seen++}
        /^MiB a second: / {gm = $4; seen++}
        /^binding: / {gb = $2; seen++}
        END {
          s = t2 - t1; ws = w / s; ms = b / s / 1048576
          truth = "none"
          if (ic != "max" && ws >= 0.9 * ic) truth = "iops"
          else if (bc != "max" && b / s >= 0.9 * bc) truth = "throughput"
          ok = seen == 3 && gw ~ /^[0-9]+$/ && gm ~ /^[0-9]+\.[0-9]$/ \
            && abs(gw - ws) <= 0.08 * ws + 2 && abs(gm - ms) <= 0.015 * ms + 0.1 && gb == truth
          if (ok) print "right"
          else printf "printed %d of the three lines (%s, %s, %s); the check measured %.0f writes a second, %.2f MiB a second, binding: %s\n", seen, gw, gm, gb, ws, ms, truth
        }'
    expect:
      equals: right
  - id: logger
    description: "For shop-logs, which writes far below both its caps, it prints its writes a second, its MiB a second, and that neither cap holds it back."
    command: |
      unit=shop-logs
      dev=$(lsblk -dno MAJ:MIN /dev/lab/data | tr -d ' ')
      folder=/sys/fs/cgroup$(systemctl show "$unit" -p ControlGroup --value)
      field() { grep "^$dev " "$folder/$1" | grep -o "$2=[0-9a-z]*" | cut -d= -f2; }
      w1=$(field io.stat wios); b1=$(field io.stat wbytes); t1=$(date +%s.%N)
      out=$(cd /home/learner && runuser -u learner -- /home/learner/bin/io-rate "$unit" 10 2>&1)
      w2=$(field io.stat wios); b2=$(field io.stat wbytes); t2=$(date +%s.%N)
      ic=$(field io.max wiops); bc=$(field io.max wbps)
      printf '%s\n' "$out" | awk -v w=$((w2 - w1)) -v b=$((b2 - b1)) -v t1="$t1" -v t2="$t2" \
          -v ic="${ic:-max}" -v bc="${bc:-max}" '
        function abs(x) { return x < 0 ? -x : x }
        /^writes a second: / {gw = $4; seen++}
        /^MiB a second: / {gm = $4; seen++}
        /^binding: / {gb = $2; seen++}
        END {
          s = t2 - t1; ws = w / s; ms = b / s / 1048576
          truth = "none"
          if (ic != "max" && ws >= 0.9 * ic) truth = "iops"
          else if (bc != "max" && b / s >= 0.9 * bc) truth = "throughput"
          ok = seen == 3 && gw ~ /^[0-9]+$/ && gm ~ /^[0-9]+\.[0-9]$/ \
            && abs(gw - ws) <= 0.08 * ws + 2 && abs(gm - ms) <= 0.015 * ms + 0.1 && gb == truth
          if (ok) print "right"
          else printf "printed %d of the three lines (%s, %s, %s); the check measured %.0f writes a second, %.2f MiB a second, binding: %s\n", seen, gw, gm, gb, ws, ms, truth
        }'
    expect:
      equals: right
