# The data disk's allowance. On a cloud, a network disk is provisioned for
# so many writes a second and so many bytes a second, and every program on
# the VM that writes to it shares them. On the lab machine the disk is a
# file on your computer, which would take far more, so this slice holds
# the shop's writes to it, all together, to what the disk is provisioned for.
[Slice]
IOWriteIOPSMax=/dev/lab/data 16
IOWriteBandwidthMax=/dev/lab/data 6291456
