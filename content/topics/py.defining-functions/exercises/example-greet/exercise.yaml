id: example-greet
stage: worked_example
rev: 1
title: "Define, then call"
prompt: |
  A small program in the shape every program from now on will have: a function that does one job, a `main` function with the program's steps, and one call at the bottom. Press **Run**. Then add a third `greet` call inside `main` and run again. Then delete the last line and see what happens.
steps:
  - label: "Define: the recipe"
    lines: "1-2"
    note: "`def greet(name):` stores the indented body under the name `greet`. Nothing prints yet. `name` is a parameter: a placeholder for whatever the caller passes in."
  - label: "main: the program's steps"
    lines: "5-7"
    note: "`main` is a function like any other. Its body calls `greet` twice, with a different argument each time. It's written above the call, like every other definition."
  - label: "The one call that starts everything"
    lines: "10"
    note: "This is the only line not inside a function, so it's the only line that runs on its own. Python has read both `def`s by now. Delete it and the program defines two functions and does nothing."
