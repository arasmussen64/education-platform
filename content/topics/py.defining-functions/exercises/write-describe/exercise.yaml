id: write-describe
stage: write
rev: 1
title: "Describe someone"
prompt: |
  Write a function `describe(name, age)` that prints one line like `Ada is 36 years old.` Then write `main()`, which calls `describe("Ada", 36)` and `describe("Bob", 7)`, and call `main()` at the bottom. Running the program should print:

  ```
  Ada is 36 years old.
  Bob is 7 years old.
  ```
hints:
  - "Start with `def describe(name, age):` and one `print` with an f-string in the body."
  - "`main` is a function too: `def main():` with the two calls indented under it."
  - "Nothing runs until the last line calls `main()`."
skills: [def-call, parameters, main-pattern]
