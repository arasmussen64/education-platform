id: fill-repeat
stage: fill_in
rev: 1
title: "Repeat a word"
prompt: |
  This program should define a function that prints a word a given number of times, then call it to print `hey` three times. Replace each `...`: the keyword that starts a definition, and the arguments of the call. Running it should print:

  ```
  hey
  hey
  hey
  ```
hints:
  - "A function definition starts with the keyword `def`."
  - "The call passes the word first and the number of times second, in the same order as the parameters: `repeat(\"hey\", 3)`."
skills: [def-call, parameters]
