id: build-banner
stage: build
rev: 1
title: "Banners"
prompt: |
  Starting from a blank editor, write a function `banner(text)` that prints a line of `=` signs as long as the text, then the text, then another line of `=` signs. Write `main()`, which prints a banner for `Menu` and one for `Prices`, and call `main()` at the bottom. Running the program should print:

  ```
  ====
  Menu
  ====
  ======
  Prices
  ======
  ```
skills: [def-call, parameters, main-pattern]
