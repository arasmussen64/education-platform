id: review-code-stars
stage: review_code
rev: 1
title: "Lines of stars"
prompt: |
  Write a function `stars(n)` that prints one line of `n` stars (`*`). Then write `main()`, which calls `stars(3)`, `stars(1)` and `stars(5)`, and call `main()` at the bottom. Running the program should print:

  ```
  ***
  *
  *****
  ```
skills: [def-call, parameters, main-pattern]
