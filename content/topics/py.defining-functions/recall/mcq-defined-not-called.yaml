id: mcq-defined-not-called
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  def shout(word):
      print(word + "!")

  shout
  ```
choices:
  - '`word!`'
  - 'Nothing'
  - '`shout!`'
  - 'An error: `shout` is missing an argument'
answer: 1
explanation: |
  `def` only stores the function. The last line names it without calling it: there are no parentheses and no argument, so the body never runs and nothing is printed. `shout("hi")` would print `hi!`.
skills: [def-call]
