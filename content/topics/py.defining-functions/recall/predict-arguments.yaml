id: predict-arguments
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines. Arguments fill the parameters in order, unless they're named.
code: |
  def show(first, second):
      print(first, "then", second)


  show(1, 2)
  show("x", "y")
  show(second="b", first="a")
expected_output: |
  1 then 2
  x then y
  a then b
explanation: |
  In the first two calls the arguments fill `first` and `second` in the order they're written. In the third, each argument names its parameter, so the order no longer matters: `first` is `"a"` and `second` is `"b"`.
skills: [parameters]
