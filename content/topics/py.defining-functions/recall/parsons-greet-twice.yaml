id: parsons-greet-twice
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `Hello, Ada!` and then `Hello, Bob!`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'def greet(name):'
  - '    print(f"Hello, {name}!")'
  - 'greet("Ada")'
  - 'greet("Bob")'
distractors:
  - 'def greet():'
explanation: |
  A function has to be defined before it's called, so `def` and its indented body come first. The calls then run in order: Ada, then Bob. `def greet():` takes no parameter, so `greet("Ada")` would be an error with it.
skills: [def-call, parameters]
