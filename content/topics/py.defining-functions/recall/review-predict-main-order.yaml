id: review-predict-main-order
type: predict_output
rev: 1
prompt: |
  What does this program print? Notice that `welcome` is defined below the function that uses it.
code: |
  def main():
      welcome()
      print("Done")


  def welcome():
      print("Welcome!")


  main()
expected_output: |
  Welcome!
  Done
explanation: |
  Nothing runs until the last line calls `main()`. By then Python has read both definitions, so `main` can call `welcome` even though `welcome` is written further down. The order of the defs doesn't matter; the call has to come after them.
skills: [main-pattern, def-call]
