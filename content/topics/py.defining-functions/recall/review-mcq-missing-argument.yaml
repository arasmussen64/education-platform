id: review-mcq-missing-argument
type: mcq
rev: 1
prompt: |
  What happens when this program runs?

  ```python
  def area(width, height):
      print(width * height)

  area(3)
  ```
choices:
  - 'It prints `3`'
  - 'It prints `9`'
  - 'A `TypeError`: `area` is missing an argument for `height`'
  - 'It prints nothing'
answer: 2
explanation: |
  `area` has two parameters and no default values, so a call must pass two arguments. With one, Python stops with `TypeError: area() missing 1 required positional argument: 'height'`. Give `height` a default, or pass both values.
skills: [parameters]
