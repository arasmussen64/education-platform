id: mcq-default-value
type: mcq
rev: 1
prompt: |
  What is the **second** line this program prints?

  ```python
  def greet(name, greeting="Hello"):
      print(f"{greeting}, {name}!")

  greet("Ada")
  greet("Bob", "Hi")
  ```
choices:
  - '`Hello, Bob!`'
  - '`Hi, Bob!`'
  - '`Bob, Hi!`'
  - 'An error: `greet` takes one argument'
answer: 1
explanation: |
  The first call leaves `greeting` out, so it gets its default, `"Hello"`. The second call gives two arguments, which fill `name` and `greeting` in order, so it prints `Hi, Bob!`. A default value is only used when the caller gives nothing for that parameter.
skills: [parameters]
