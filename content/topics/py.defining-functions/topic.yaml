id: py.defining-functions
kind: topic
status: ready
title: "Defining functions"
summary: "Write your own functions with def, give them parameters, and call them from main."
prerequisites: [py.m3.checkpoint]
estimated_minutes: 45
rev: 1
objectives:
  - "Define a function with `def`, a name, parentheses and an indented body, and call it by name with parentheses."
  - "Give a function parameters, pass arguments to it in order, and give a parameter a default value."
  - "Put a program's main part in `main()`, call it once at the bottom, and know why the order of definitions and calls matters."
