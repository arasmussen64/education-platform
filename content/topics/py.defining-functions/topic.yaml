prove:
  build: build-banner
  debug: debug-greetings
  explain:
    prompt: |
      A friend writes this, runs it, and nothing prints:

      ```python
      def hello():
          print("hi")
      ```

      They add a line with just `hello` at the bottom. Still nothing. In your own words: what's the difference between defining a function and calling it, what do the parentheses do in a call, and why do programs put their main part in a function called `main()` that's called once at the bottom?
    rubric:
      - id: define-vs-call
        required: true
        description: "def stores the instructions under a name; nothing in the body runs until the function is called."
      - id: parentheses
        required: true
        description: "hello() calls the function; hello on its own only names it, so nothing happens."
      - id: main-pattern
        required: true
        description: "Definitions go above and one call to main() at the bottom, so Python has read every def before anything runs; main() is where the program's steps live."
      - id: order
        required: false
        description: "A function must be defined before the line that calls it runs; the order of the defs themselves doesn't matter."
    model_answer: |
      def doesn't run anything. It stores the indented lines under the name hello, like writing down a recipe. To make the recipe happen you have to call the function, and the call is the name followed by parentheses: hello(). Writing hello on its own just refers to the function without running it, which is why nothing appeared. Programs put their steps inside a function called main and call main() once at the very bottom. By the time that call runs, Python has read every def in the file, so main can use any of them, in any order they were written. If the call came before a def, Python wouldn't know the name yet.
review_pool:
  - review-predict-main-order
  - review-mcq-missing-argument
  - review-code-stars
  - mcq-default-value
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: def-call
    description: "Define a function with `def` and an indented body, and call it by name with parentheses"
  - id: parameters
    description: "Give a function parameters, pass arguments in order, and use default values"
  - id: main-pattern
    description: "Put the program's steps in `main()`, called once at the bottom, after every definition"
