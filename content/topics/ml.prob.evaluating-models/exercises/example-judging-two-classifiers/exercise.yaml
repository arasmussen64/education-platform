id: example-judging-two-classifiers
stage: worked_example
rev: 1
title: "Judging two classifiers"
prompt: |
  This program scores two classifiers on 200 held-out examples: their confusion matrices and metrics, the always-no baseline, an interval on an accuracy, a threshold chosen honestly and dishonestly, and a paired bootstrap of the difference between them. Press **Run**, then read how each part works.
steps:
  - label: "The four counts, and the metrics from them"
    lines: "4-17"
    note: "`confusion` counts true positives (flagged and right), false positives (flagged but wrong), false negatives (missed) and true negatives (correctly left alone). `metrics` turns them into accuracy, precision (`tp / (tp + fp)`: of the flagged, how many were right), recall (`tp / (tp + fn)`: of the real ones, how many were found) and F1, their harmonic mean."
  - label: "Two models' scores on the same examples"
    lines: "20-26"
    note: "Two hundred labels, 30 percent positive, and each model's score for each example: a seeded stand-in for two real models, A a little sharper than B. A second set of 200 is the validation data. Each model's threshold turns scores into yes-or-no predictions."
  - label: "The report, and the baseline"
    lines: "28-33"
    note: "A: 61, 21, 13, 105 as true positives, false positives, false negatives, true negatives, giving 0.83  0.744 0.824 0.782 for accuracy, precision, recall and F1. B: 0.74  0.631 0.716 0.671. The baseline that says no to everyone scores 0.63 on accuracy, which is why accuracy alone is never the whole story on an unbalanced class."
  - label: "How sure is A's accuracy?"
    lines: "35-38"
    note: "The accuracy is the mean of 200 zeros and ones, so the last topic applies: standard error `sqrt(p(1 - p) / n)` = 0.027, interval 0.778 0.882. Four points either way, from 200 examples."
  - label: "A threshold chosen honestly, and not"
    lines: "40-44"
    note: "Forty-one thresholds tried. Chosen on the **validation** set, the best is 1.3, and it scores 0.85 on the test set. Chosen on the **test** set itself, the best is 1.2 and scores 0.86: the best of forty-one tries on those very examples, a number that flatters. That is what leakage looks like, and why choices go on validation data."
  - label: "Is A really better than B?"
    lines: "46-48"
    note: "Both models were scored on the same examples, so compare them **paired**: for each example, A's correctness minus B's. The mean difference is 0.09; bootstrapping it 2,000 times gives an interval of 0.015 0.165, which stays above zero, so even with the sampling noise A is better on this test set. Comparing two separate intervals would have thrown away the pairing and the noise the two models share."
