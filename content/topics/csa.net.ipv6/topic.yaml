skills:
  - id: v6-notation
    description: "128 bits in eight 16-bit groups of hex; the short form (leading zeros dropped, one `::` for the longest run of zero groups, the first if two tie, never for one group, lower case); expanding a short form; prefix lengths on nibble boundaries; `[address]:port` in URLs"
  - id: v6-address-types
    description: "Global unicast, link-local (`fe80::`, on every interface, with `%eth0` to use one), unique local (`fd`), multicast (`ff02::1`, `ff02::2`, solicited-node groups), loopback, unspecified and documentation; no broadcast; neighbour discovery in place of ARP; reading `ip -6 addr` and `ip -6 neigh`"
  - id: v6-plan
    description: "A /48 per site or a /56 for a small one, a /64 for every subnet; counting 2^(64 − p) /64s in a /p; plans whose hex digits mean region, zone and tier; each cloud's sizes (AWS's /56 per VPC and /64 subnets, Azure's exactly-/64 subnets, Google's /64 subnets, /96 per interface and a ULA /48 per network)"
  - id: slaac-dual-stack
    description: "Router advertisements and SLAAC (a /64 prefix or no address), EUI-64 and random interface identifiers, duplicate address detection, the default route via the router's link-local address; a router's side (IPv6 forwarding, radvd); dual stack on hosts: AAAA records, IPv6 preferred, Happy Eyeballs' 250 ms; one inet firewall table for both families"
  - id: v6-egress
    description: "Why IPv6 needs no NAT for egress and why NAT was never the security; a stateful filter's outbound-only (AWS's egress-only internet gateway, Google's default-deny ingress); Azure's translation of IPv6 through a NAT gateway or load-balancer outbound rules; NAT64 for IPv6-only to IPv4; which ICMPv6 a firewall must pass (Packet Too Big above all, and neighbour discovery on the link)"
