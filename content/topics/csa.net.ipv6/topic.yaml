prove:
  build: build-dual-stack-branch
  debug: debug-ipv6-half-works
  explain:
    prompt: |
      Your company is adding IPv6 to its offices and cloud networks. A colleague asks: "Do we need NAT gateways for IPv6? And how do machines get addresses without DHCP?" Explain, in your own words: how an IPv6 address is written, and why subnets are /64; how you'd lay out a plan from a /48; how a laptop configures itself, and where its default route points; what dual stack means for clients and for firewalls; why IPv6 egress needs no NAT, and what protects the machines instead; why ICMPv6 must get through a firewall; and how the three clouds differ on any two of these.
    rubric:
      - id: notation-and-64
        required: true
        description: "128 bits in eight groups of four hex digits; leading zeros dropped and one :: for the longest run of zero groups, in lower case; subnets are /64 because SLAAC joins the prefix to a 64-bit interface identifier, and a host ignores a prefix of any other length."
      - id: plan
        required: true
        description: "A /48 per site (65,536 /64 subnets), or a /56 for a small one; hex digits for region, zone and tier, on 4-bit boundaries so a person can read them off an address; planned for readability, not to save addresses."
      - id: slaac
        required: true
        description: "The host makes its link-local address, checks it with duplicate address detection, sends a router solicitation; the router's advertisement carries the prefix; the host builds its address from the prefix and an interface identifier (EUI-64 or a random one), checks it, and takes a default route to the router's link-local address; a prefix that isn't a /64 gives no address."
      - id: dual-stack
        required: true
        description: "Both families on every interface, and names with A and AAAA records; clients prefer IPv6 and fall back to IPv4 within about 250 ms (Happy Eyeballs), so broken IPv6 hides; one firewall table for both families (nftables' inet), or IPv6 is left unfiltered."
      - id: egress-no-nat
        required: true
        description: "Every host has a global address, so there's no shortage to hide; NAT's protection came from its state, and a stateful firewall that admits only replies gives the same without translating (AWS's egress-only internet gateway; Google's firewall, which denies incoming connections by default)."
      - id: icmpv6
        required: true
        description: "IPv6 routers never fragment, so Packet Too Big must reach the sender or big transfers hang (a path MTU black hole on IPv6 only); neighbour discovery is ICMPv6 on the link and must reach the router's input."
      - id: clouds-differ
        required: true
        description: "Any two, correctly: AWS assigns a /56 per VPC and /64 subnets, an egress-only gateway for IPv6 and a NAT gateway for IPv4 (and NAT64); Azure requires /64 subnets, has no IPv6-only VMs, translates IPv6 sent out through a NAT gateway or a load balancer's outbound rules, and its network security groups can't filter ICMPv6; Google gives each VM interface a /96, each network a ULA /48 from fd20::/20, external IPv6 addresses that are public, and NAT64 for IPv6-only VMs."
    model_answer: |
      An IPv6 address is 128 bits, written as eight groups of four hex digits separated by colons. To shorten one, each group drops its leading zeros, and the longest run of all-zero groups becomes ::, once, so 2001:0db8:0000:0000:0000:ff00:0042:8329 is 2001:db8::ff00:42:8329, in lower case. Every subnet is a /64: the last 64 bits are the host's interface identifier, and a host builds its own address only from a /64 prefix, so a /120 "to save addresses" just gives hosts no address at all. There's nothing to save anyway.

      For a plan I'd give each site a /48, which holds 65,536 /64 subnets, or a /56 for a small branch, and spend the fourth group's hex digits on meaning: one digit for the region, one for the zone, two for the tier, so 2001:db8:abcd:130a::/64 reads as region 1, zone 3, tier 0a. Fields on 4-bit boundaries can be read off an address and summarised cleanly.

      A laptop needs no DHCP. It makes a link-local fe80:: address itself, checks nobody has it with duplicate address detection, and sends a router solicitation. The router answers with a router advertisement carrying the prefix; the laptop joins it to an interface identifier, from its MAC address by EUI-64 or, more often now, a random one, checks that address too, and takes a default route to the router's link-local address, which survives any renumbering. If the router advertises anything but a /64, the laptop gets a default route and no address.

      Dual stack means both families on every interface and both A and AAAA records for names. Clients prefer IPv6 and, with Happy Eyeballs, try IPv4 250 ms later if IPv6 hasn't connected, so broken IPv6 costs a quarter of a second and nobody notices. Firewalls must cover both families: an nftables table of the ip family filters IPv4 only, so I'd use one inet table for both.

      IPv6 egress needs no NAT because every host has its own global address. What people liked about NAT, that nobody on the internet can open a connection in, came from its state table, and a stateful firewall that lets in only replies gives the same protection without rewriting anything. AWS sells exactly that as the egress-only internet gateway, and Google's firewall denies incoming connections by default. ICMPv6 must get through that firewall: IPv6 routers never fragment, so a sender only learns a path's MTU from Packet Too Big, and dropping it makes big IPv6 transfers hang while IPv4 works. Neighbour discovery is ICMPv6 too, and the router's input chain has to let it in.

      The clouds differ. AWS gives each VPC a /56 from its own pool, subnets are /64, IPv6 egress goes through the egress-only gateway and IPv4 through a NAT gateway, which also does NAT64. Azure makes every IPv6 subnet exactly a /64, has no IPv6-only VMs, and its network security groups can't filter ICMPv6; and on Azure, IPv6 sent out through a NAT gateway or a load balancer's outbound rules is translated, so the far end doesn't see the VM's own address. Google gives each VM interface a /96 and each network a unique local /48 from fd20::/20.
