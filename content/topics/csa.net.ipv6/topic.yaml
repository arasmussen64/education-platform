id: csa.net.ipv6
kind: topic
status: ready
title: IPv6
summary: "Read and write IPv6 addresses in their short form and tell the kinds apart on sight; plan a site's addresses from a /48, a /64 for every subnet; explain how a host configures itself from router advertisements, and run dual stack with one firewall for both families; and explain why IPv6 egress needs no NAT, what protects the machines instead, why ICMPv6 must get through, and where a cloud translates anyway."
# Module 3's topics gate on Checkpoint 1 through each other (the Module 3
# plan, docs/plans/cloud-module-3/MODULE-3-BRIEF.md, section 2): this one
# through IPv4 and CIDR, and Layers and packets before it. What it builds
# on, for the writer: csa.linux.net-tools (ip addr and ip route, an fe80::
# address already seen, nftables' inet table covering both families, ct
# state, NAT named, /etc/hosts); csa.net.layers (hex, ARP and the neighbour
# table, ICMP and its types, MTU, path MTU discovery and the black hole,
# Packet Too Big named, the network-lab onboarding); csa.net.cidr (prefix
# lengths and block sizes as powers of two, splitting, IPv4 block
# arithmetic, bash's $(( )) and printf, arrays and nested for loops in
# its write lab). This topic defines the DNS record and the AAAA record in
# a sentence each (the brief's 3.7), the egress-only gateway, and, because
# it can come before Routing on the suggested path, sysctl and
# /etc/sysctl.d in a few sentences of its own, as Routing defines them.
prerequisites: [csa.net.cidr]
estimated_minutes: 300
rev: 1
objectives:
  - "Read and write IPv6 addresses: eight groups of four hex digits, the short form's rules (leading zeros dropped, one `::` for the longest run of zero groups, lower case), and prefix lengths on nibble boundaries."
  - "Tell the kinds of address apart on sight (global, link-local, unique local, multicast, loopback, documentation), say what each is for, and explain how neighbour discovery replaces ARP and broadcast."
  - "Plan IPv6 addressing: a /48 per site and a /64 for every subnet, hex digits that mean region, zone and tier, the counts on sight, and each cloud's sizes."
  - "Explain how a host configures itself (router advertisements, SLAAC, duplicate address detection, a default route to the router's link-local address), and run dual stack: both families on every interface, clients preferring IPv6 and falling back fast, one firewall table for both."
  - "Explain why IPv6 egress needs no NAT and what protects the machines instead (a stateful firewall, AWS's egress-only internet gateway), where Azure translates anyway, and why ICMPv6, Packet Too Big above all, must not be blocked; and find and fix the faults that make IPv6 half work."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - RFC 4291 (February 2006): the address kinds, no broadcast, the
#   solicited-node group ff02::1:ff00:0/104 plus the low 24 bits; RFC 5952
#   (August 2010), section 4: leading zeros MUST be suppressed, :: used to
#   its maximum, never for one 16-bit 0 field, the longest run (the first
#   on a tie), lower case; section 6: [address]:port. RFC 4862 (September
#   2007) 5.5.3 (d): a prefix whose length plus the interface identifier's
#   isn't 128 bits "MUST be ignored"; 5.4: DAD on every unicast address
#   before it is assigned. RFC 4193 (October 2005): ULAs in fc00::/7, fd
#   for locally assigned, a 40-bit random Global ID. RFC 6177 (March 2011,
#   BCP 157): /48 no longer the only size for an end site; /56 common.
#   RFC 8200 (July 2017): only the source fragments; every link at least
#   1280. RFC 4890 (May 2007) 4.3.1: Destination Unreachable, Packet Too
#   Big, Time Exceeded code 0, Parameter Problem codes 1 and 2, Echo
#   Request and Reply must not be dropped in transit; 4.3.3: 133 to 137
#   never leave their link (hop limit 255). RFC 4864 (May 2007) 4.2: "IPv4
#   NAT was not developed as a security mechanism"; a stateful firewall
#   gives the protection. RFC 6724 (September 2012) 2.1: ::/0 precedence
#   40, ::ffff:0:0/96 35, fc00::/7 3. RFC 8305 (December 2017): Connection
#   Attempt Delay 250 ms, Resolution Delay 50 ms. RFC 9637 (August 2024):
#   3fff::/20 for documentation, beside 2001:db8::/32. RFC 8064 (2017) and
#   RFC 7217 (2014): stable random interface identifiers recommended over
#   EUI-64; RFC 8981 (2021): temporary addresses. None obsoleted (the RFC
#   Editor's records, read 2026-11-12). All at rfc-editor.org.
# - AWS: "IPv6 addresses are globally unique, and are therefore public by
#   default"; the egress-only internet gateway is "for use with IPv6
#   traffic only", stateful, no charge for the gateway itself, a route
#   ::/0 to it, no security group on it:
#   docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html.
#   An Amazon-provided IPv6 block is a /56 you can't choose; up to five
#   blocks of /44 to /60: .../vpc-cidr-blocks.html. IPv6 subnets /44 to /64
#   in steps of /4; the first four and the last address reserved; the
#   router also at fe80:ec2::1: .../subnet-sizing.html. NAT gateways do
#   NAT64 with DNS64 (64:ff9b::/96): .../nat-gateway-nat64-dns64.html.
# - Azure, "Overview of IPv6 for Azure Virtual Network" (ms.date
#   2024-10-16, updated 2026-07-27): customers define their own IPv6
#   space; subnets "must be exactly /64"; IPv6-only VMs not supported (each
#   NIC needs an IPv4 configuration); "ICMPv6 isn't currently supported in
#   Network Security Groups"; Azure Firewall doesn't support IPv6; the load
#   balancer does no NAT64; instance-level public IP "provides IPv6
#   Internet connectivity directly to individual VMs"; no charge for public
#   IPv6 addresses: learn.microsoft.com/en-us/azure/virtual-network/ip-services/ipv6-overview.
#   "What Is Azure NAT Gateway?" (2026-08-31): StandardV2 "supports both
#   IPv4 and IPv6 public IP addresses and prefixes for outbound
#   connectivity", NAT64 with 64:ff9b::/96 and a third-party DNS64; no
#   unsolicited inbound connections; not in Canada East, India South
#   Central, Sweden South, West India; IPv6 through load-balancer outbound
#   rules is disrupted when a StandardV2 gateway is added:
#   learn.microsoft.com/en-us/azure/nat-gateway/nat-overview. "Outbound
#   Rules for Azure Load Balancer" (2026-01-08): outbound rules "explicitly
#   define SNAT": learn.microsoft.com/en-us/azure/load-balancer/outbound-rules.
#   The narrowed claim (the brief's mcq-azure-ipv6): IPv6 out through a NAT
#   gateway or a load balancer's outbound rules is translated; nothing read
#   says an instance-level public IP is.
# - Google Cloud, "Subnets" (last updated 2026-10-26): an internal subnet
#   gets a /64 from the network's ULA /48, which comes from fd20::/20; an
#   interface gets a /96; the first and last /96 of a subnet are reserved:
#   docs.cloud.google.com/vpc/docs/subnets. "IP addresses": external IPv4
#   and IPv6 addresses are always public; internal ones can't be reached
#   from the internet: docs.cloud.google.com/vpc/docs/ip-addresses. Cloud
#   NAT translates IPv4 to IPv4 and IPv6 to IPv4, and nothing IPv6 to IPv6
#   (last updated 2026-11-10): docs.cloud.google.com/nat/docs/overview.
#   VPC firewall rules are stateful, with an implied deny ingress and allow
#   egress (last updated 2026-11-10): docs.cloud.google.com/firewall/docs/firewalls.
# - Captured on 2026-11-12 in this topic's labs (Ubuntu 24.04, radvd
#   2.19-1ubuntu1, iproute2 6.1.0, tcpdump 4.99.4, sipcalc 1.1.6, Docker
#   Desktop 29.8.2): radvd advertising a /56 logs "lan prefix length should
#   be: 64" and the hosts get a /56 on-link route and a default route but
#   no global address; radvd with IPv6 forwarding off logs "IPv6 forwarding
#   seems to be disabled, but continuing anyway"; a host's SLAAC address
#   "scope global dynamic mngtmpaddr" with valid_lft 86400sec and preferred
#   14400sec; its default route "via fe80::... proto ra ... expires
#   1795sec"; a host starting IPv6 sends a DAD neighbour solicitation from
#   ::, a router solicitation to ff02::2, gets r1's advertisement unicast,
#   and checks its global address; Packet Too Big from 2001:db8:ffff:1::1
#   with mtu=1400, remembered by ip route get for 599 s; getent ahosts
#   lists the IPv6 address first. Every predict_shell output was run in Git
#   Bash and in the base's bash with mawk, with the same result.
#
# Linked, never copied. Licences, each read on 2026-11-12: Beej's Guide to
# Network Concepts is CC BY-NC-ND 3.0 (its foreword's "Copyright and
# Distribution"); the APNIC Blog shows "© 2026 APNIC" and no licence; the
# SURFnet manual's last page says it is available under Creative Commons
# Naamsvermelding 3.0 Nederland (CC BY 3.0 NL); AWS's documentation is
# copyright Amazon Web Services; Microsoft's Azure documentation is CC BY
# 4.0 (MicrosoftDocs/azure-docs's LICENSE); Google Cloud's pages are CC BY
# 4.0 (each page's footer); Chris Grundemann's blog shows "Copyright ©
# 2007-2026 Chris Grundemann" and no licence; RFCs are under the IETF
# Trust's provisions. No video was found and confirmed (the designer's open
# question 4), so the topic has none.
