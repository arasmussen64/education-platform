# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: IPv6
  definition: Version 6 of the Internet Protocol, with 128-bit addresses written as eight groups of hex digits, like 2001:db8::1, enough to give every device its own global address.
- term: link-local address
  definition: An address every interface makes for itself, valid only on its own link. IPv6's start `fe80::`; IPv4's are in 169.254.0.0/16. Routers never forward them.
- term: unique local address
  aliases: [ULA]
  definition: IPv6's private address space, `fd` followed by 40 random bits, giving a site its own /48 that almost never clashes with another organisation's.
- term: neighbour discovery
  aliases: [neighbor discovery, NDP]
  definition: IPv6's replacement for ARP and more, five ICMPv6 messages kept on one link that find neighbours' MAC addresses, routers and the network's prefix.
- term: router advertisement
  definition: An ICMPv6 message in which a router says "I'm a router, here's the prefix", from which hosts build their addresses and take their default route.
- term: SLAAC
  aliases: [stateless address autoconfiguration]
  definition: How an IPv6 host gives itself an address with nobody's help, joining the prefix from a router advertisement to its own 64-bit interface identifier. It needs a /64.
- term: AAAA record
  definition: A DNS record that holds an IPv6 address, as an A record holds an IPv4 one. Dual-stack clients usually try it first.
- term: dual stack
  definition: Running IPv4 and IPv6 side by side, so every interface has an address of each family and every name has both an A and a AAAA record.
- term: Happy Eyeballs
  definition: A client trying IPv6 first and starting an IPv4 attempt 250 milliseconds later, keeping whichever connects first, so broken IPv6 costs a delay instead of a failure.
