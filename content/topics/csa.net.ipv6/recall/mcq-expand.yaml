id: mcq-expand
type: mcq
rev: 1
prompt: |
  What is `fd00:12::3:4` written out in full, all eight groups of four hex digits?
choices:
  - "`fd00:1200:0000:0000:0000:0000:3000:4000`"
  - "`fd00:0012:0000:0000:0000:0003:0004:0000`"
  - "`fd00:0012:0000:0000:0003:0004`"
  - "`fd00:0012:0000:0000:0000:0000:0003:0004`"
answer: 3
explanation: |
  Count the groups that are written: `fd00`, `12`, `3` and `4`, four of the eight. So `::` stands for the other four, all zeros, in the place where it stands: between `12` and `3`. Then put back each group's leading zeros: `12` is `0012`, `3` is `0003`. That gives `fd00:0012:0000:0000:0000:0000:0003:0004`.

  `fd00:1200:...:3000:4000` added the zeros on the wrong side of each group, which makes different numbers: only leading zeros are ever left out. `fd00:0012:0000:0000:0003:0004` has only six groups, because it read `::` as two zero groups; it stands for however many are missing. And `fd00:0012:0000:0000:0000:0003:0004:0000` moved one of the zero groups to the end, where nothing in the short form put it.
skills: [v6-notation]
