id: mcq-short-form
type: mcq
rev: 1
prompt: |
  What is the RFC 5952 short form of `2001:0db8:0000:0000:0000:ff00:0042:8329`?
choices:
  - "`2001:db8::ff:42:8329`"
  - "`2001:db8::ff00:42:8329`"
  - "`2001:db8::ff00:0042:8329`"
  - "`2001:db8:0:0:0:ff00:42:8329`"
answer: 1
explanation: |
  Three rules, in order. Drop each group's leading zeros: `0db8` is `db8`, `0042` is `42`, and a group of zeros is `0`. Replace the longest run of zero groups with `::`, once: here the three in a row after `db8`. Write the letters in lower case. That gives `2001:db8::ff00:42:8329`.

  `2001:db8::ff:42:8329` dropped zeros from the end of `ff00`, which changes the number: only leading zeros may go, so it is a different address. `2001:db8::ff00:0042:8329` kept the leading zeros of `0042`, and `2001:db8:0:0:0:ff00:42:8329` never used `::`: both are the right address, and both are written in ways RFC 5952 says not to, because two people writing one address differently is how a firewall rule or a search misses it.
skills: [v6-notation]
