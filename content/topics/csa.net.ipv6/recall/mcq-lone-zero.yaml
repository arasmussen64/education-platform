id: mcq-lone-zero
type: mcq
rev: 1
prompt: |
  Which of these is RFC 5952's short form of `2001:db8:0:1:0:0:0:1`?
choices:
  - "`2001:db8::1::1`"
  - "`2001:DB8:0:1::1`"
  - "`2001:db8:0:1::1`"
  - "`2001:db8::1:0:0:0:1`"
answer: 2
explanation: |
  The address has two runs of zero groups: a single one in the third place and three in a row near the end. `::` replaces the longest run, so the three go and the lone zero stays as `0`: `2001:db8:0:1::1`. (A single zero group is never written as `::`.)

  `2001:db8::1:0:0:0:1` is the same address, with `::` spent on the shorter run, so it isn't the short form. `2001:DB8:0:1::1` is the right shape in capitals, and RFC 5952 asks for lower case. `2001:db8::1::1` isn't an address at all: with two `::`, nobody can tell how many zeros each one stands for, which is why `::` may appear only once. When two runs are the same length, the first one gets the `::`.
skills: [v6-notation]
