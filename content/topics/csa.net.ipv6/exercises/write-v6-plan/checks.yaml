# The checks for "Write v6-plan": a script ShellCheck is quiet about, then
# the script's plans for sites that v6plan-truth (/usr/local/lib/lab-checks)
# makes at check time, with random counts, and works out with Python's
# ipaddress module, whose short form is RFC 5952's.
checks:
  - id: script
    description: "~/bin/v6-plan exists, starts with #!/bin/bash, is executable, does its own sums in bash rather than handing them to Python, and ShellCheck has nothing to say about it, with no warning switched off."
    command: |
      f=/home/learner/bin/v6-plan
      [ -f "$f" ] || { echo "there is no ~/bin/v6-plan"; exit 0; }
      [ -x "$f" ] || { echo "~/bin/v6-plan isn't executable"; exit 0; }
      [ "$(head -n 1 "$f")" = "#!/bin/bash" ] || { echo "the first line isn't #!/bin/bash"; exit 0; }
      # Python is in the lab for the checks; the script's sums are bash's.
      if grep -v '^[[:space:]]*#' "$f" | grep -i 'python' > /dev/null; then echo "the script calls Python: its sums must be bash's"; exit 0; fi
      if grep -i 'shellcheck *disable' "$f" > /dev/null; then echo "a ShellCheck warning is switched off"; exit 0; fi
      shellcheck --norc "$f" > /dev/null 2>&1 || { echo "ShellCheck has something to say: run shellcheck ~/bin/v6-plan"; exit 0; }
      echo script
    expect:
      equals: script
  - id: plans
    description: "For two sites the check makes, one with no zero group in its prefix and one unique local (fd...), and with random numbers of regions, zones and tiers (more than ten tiers in one), it prints every line of the plan, in order and in the short form."
    command: /usr/local/lib/lab-checks/v6plan-truth plans
    expect:
      equals: right
  - id: zero-groups
    description: "For two sites whose prefix has a zero group, the third in one and the second in the other, it prints every line of the plan in the short form, zero groups included."
    command: /usr/local/lib/lab-checks/v6plan-truth zero-groups
    expect:
      equals: right
