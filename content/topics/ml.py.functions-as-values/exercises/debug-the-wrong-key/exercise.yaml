id: debug-the-wrong-key
stage: debug
rev: 2
title: "Cheapest first"
prompt: |
  This program should list some products cheapest first, then name the most expensive:

  ```
  [('tea', 2.5), ('cake', 4.0), ('jam', 6.5)]
  jam
  ```

  Instead it lists them as cake, jam, tea, then names `tea`. It has two bugs. Run it, fix what you find, and run it again.
hints:
  - "`sorted` and `max` compare whatever the `key` function gives back for each product. For `(\"cake\", 4.0)`, what does each `key` give?"
  - "`p[0]` is a product's name and `p[1]` its price, so `key=lambda p: p[0]` puts the products in alphabetical order."
  - "With `key=lambda p: p`, `max` compares whole tuples, and tuples compare their first items first: the names. The most expensive needs the price."
skills: [key, lambda]
