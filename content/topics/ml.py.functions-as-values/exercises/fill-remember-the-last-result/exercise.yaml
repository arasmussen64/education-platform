id: fill-remember-the-last-result
stage: fill_in
rev: 1
title: "Remember the last result"
prompt: |
  `remember` is a decorator. Its wrapper should take any arguments, call the original function with them, keep the result in an attribute on itself (`wrapper.last`), and return that result. Replace each `...` so the program prints:

  ```
  None
  Hello, Ada
  Bye, Bob
  Bye, Bob
  ```

  The first line is `greet.last` before any call; the last line is `greet.last` after two. The program fails until every `...` is replaced, and the checks decorate a function of their own that takes three arguments.
hints:
  - "The wrapper can't know how many arguments the original takes, so it collects them all: `def wrapper(*args):`. To pass the same ones on, use the star again: `func(*args)`."
  - "`wrapper.last = result` stores the value on the wrapper function itself, where it stays after the call has finished."
  - "`remember` has to hand back the wrapper: `return wrapper`, with no parentheses, because you're returning the function, not calling it."
skills: [decorators, pass-functions]
