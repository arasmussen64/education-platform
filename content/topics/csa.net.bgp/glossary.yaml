# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: autonomous system
  definition: One organisation's network with one routing policy, such as an ISP, a cloud or a company, known by its AS number (ASN). BGP is how autonomous systems tell each other what they reach.
- term: eBGP
  definition: BGP between two routers of different autonomous systems, such as a company and its provider.
- term: iBGP
  definition: BGP between two routers of the same autonomous system, carrying what its border routers learned to its other routers. A route learned over iBGP is never passed to another iBGP neighbour.
- term: route map
  definition: "A BGP policy in FRR: numbered permit or deny entries, each matching some routes and setting things on them, applied to one neighbour in one direction. A route no entry permits is denied."
- term: route leak
  definition: A network passing routes on where it shouldn't, such as one provider's routes to another, which tells the second it can reach the first's customers through the leaker.
- term: prefix hijack
  definition: Announcing someone else's addresses, often as a more specific prefix that wins by longest-prefix match, so their traffic comes to you instead. Done by mistake, it's a leak.
- term: local preference
  definition: A BGP attribute, highest preferred, that an AS sets on routes it learns to choose its own way out. It's compared before AS path length and never leaves the AS.
- term: MED
  aliases: [multi-exit discriminator]
  definition: A number, lower preferred, that one network sends a neighbour to say which of its links to use. Compared only between paths from the same neighbouring network, and late in BGP's order.
