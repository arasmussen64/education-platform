id: bgp-summary-read
type: predict_shell
rev: 1
prompt: |
  `summary.txt` is `show bgp summary` on ISP A's router, captured in this topic's lab a few seconds after a boot, before the shop's router had any BGP configured. Each neighbour line starts with the neighbour's address; the columns are named in the line above them, and `State/PfxRcd` is the tenth. The command prints, for each neighbour line, the neighbour's address, its AS number and that tenth column. What is printed?
files:
  summary.txt: |
    IPv4 Unicast Summary (VRF default):
    BGP router identifier 192.0.2.2, local AS number 65010 vrf-id 0
    BGP table version 3
    RIB entries 5, using 960 bytes of memory
    Peers 2, using 1448 KiB of memory

    Neighbor        V         AS   MsgRcvd   MsgSent   TblVer  InQ OutQ  Up/Down State/PfxRcd   PfxSnt Desc
    192.0.2.1       4      65001         0         0        0    0    0    never       Active        0 the shop
    192.0.2.10      4      65030        15        17        0    0    0 00:00:10            2        3 transit

    Total number of neighbors 2
command: awk '$1 ~ /^[0-9]+\./ {print $1, $3, $10}' summary.txt
expected_output: |
  192.0.2.1 65001 Active
  192.0.2.10 65030 2
explanation: |
  `$1 ~ /^[0-9]+\./` keeps only the lines that start with digits and a dot: the neighbour lines. The tenth column holds a word for a session that isn't up and a number for one that is. ISP A's session with the transit network has been up for 10 seconds (`Up/Down`), and ISP A has accepted 2 prefixes from it. Its session with the shop, 192.0.2.1, is `Active` and has never been up (`never`): ISP A keeps trying to open the TCP connection to port 179 and failing, because nothing on the shop's router is listening for BGP yet. Once the shop configures its side, that column turns into a number too. The `Desc` column is a description the ISP gave each neighbour; it adds words at the end of the line and doesn't move the columns before it.
skills: [bgp-sessions]
