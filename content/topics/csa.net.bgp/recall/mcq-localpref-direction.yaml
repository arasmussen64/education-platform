id: mcq-localpref-direction
type: mcq
rev: 1
prompt: |
  The shop's router sets local preference 200 on the routes it learns from ISP A; ISP B's routes keep the default, 100. Which traffic changes?
choices:
  - "Traffic from the internet to the shop now arrives through ISP A"
  - "Both directions now use ISP A, since BGP keeps the paths symmetric"
  - "Traffic from the shop to the internet now leaves through ISP A"
  - "Neither, until ISP A agrees to the same local preference on its side"
answer: 2
explanation: |
  Local preference decides which of the shop's own routes wins, so it decides where the shop's traffic leaves. It never leaves the shop's AS: no other network sees it, so nobody else's choice changes. In the lab, after edge preferred ISP A, the office's traceroute went out through ISP A, while the cloud's looking glass still showed its best path to the shop through ISP B, chosen by AS path: replies came back the other way.

  How traffic arrives depends on the choices other networks make about the routes the shop announces, which is the next topic (AS-path prepending, MED, more specific prefixes, communities). BGP doesn't keep paths symmetric, and ISP A doesn't need to agree to anything.
skills: [local-preference]
