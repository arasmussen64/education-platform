frr version 8.4.4
frr defaults traditional
hostname ispa
log syslog informational
service integrated-vtysh-config
!
ip route 10.10.0.0/16 blackhole
!
router bgp 65010
 bgp router-id 192.0.2.2
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 192.0.2.1 remote-as 65001
 neighbor 192.0.2.1 description the shop
 neighbor 192.0.2.1 timers connect 5
 neighbor 192.0.2.10 remote-as 65030
 neighbor 192.0.2.10 description transit
 neighbor 192.0.2.10 timers connect 5
 !
 address-family ipv4 unicast
  network 10.10.0.0/16
  redistribute kernel route-map FROM-KERNEL
  neighbor 192.0.2.1 route-map FROM-SHOP in
  neighbor 192.0.2.1 route-map TO-SHOP out
  neighbor 192.0.2.10 route-map FROM-TRANSIT in
  neighbor 192.0.2.10 route-map TO-TRANSIT out
 exit-address-family
exit
!
ip prefix-list SHOP-PARTS seq 5 permit 198.51.100.0/24 ge 25
ip prefix-list NEW-CUSTOMERS seq 5 permit 10.11.0.0/16 le 32
!
route-map FROM-SHOP permit 10
exit
!
route-map TO-SHOP permit 10
 match ip address prefix-list SHOP-PARTS
 set ip next-hop peer-address
exit
!
route-map TO-SHOP permit 20
exit
!
route-map FROM-TRANSIT permit 10
exit
!
route-map TO-TRANSIT deny 10
 match ip address prefix-list SHOP-PARTS
exit
!
route-map TO-TRANSIT permit 20
exit
!
route-map FROM-KERNEL permit 10
 match ip address prefix-list SHOP-PARTS
exit
!
route-map FROM-KERNEL permit 20
 match ip address prefix-list NEW-CUSTOMERS
exit
!
