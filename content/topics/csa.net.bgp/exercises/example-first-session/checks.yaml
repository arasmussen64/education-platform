# The checks of "Your first BGP sessions": edge's two sessions, what each
# ISP accepted from it, what it accepts from them (including a route for part
# of the shop's addresses that an ISP offers at check time), the path it
# chooses and why, traffic both ways, whether the work is saved, and the far
# routers as they were. The same checks as the topic's build, without its
# failover, its kernel-route check and its new route from ISP A (here the
# export filter is the walkthrough's, not the learner's own). sessions-up
# waits for BGP after a boot; the rest read at once.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: sessions-up
    description: "edge has BGP sessions up with ISP A (192.0.2.2, AS 65010) and ISP B (192.0.2.6, AS 65020)."
    # Each session must be Established with the right AS number for 3
    # seconds, long enough for the first exchange of routes to finish. Up to
    # 40 tries a second apart, so it gets a minute and prints its own
    # sentence rather than running out of time.
    timeout: 60
    command: |
      . /usr/local/lib/netlab/checklib.sh
      peer() { frr edge 'show bgp summary json' | json "(lambda p: '%s %s %s' % (p.get('state'), p.get('remoteAs'), p.get('peerUptimeMsec', 0) >= 3000))(d.get('ipv4Unicast', {}).get('peers', {}).get('$1', {}))"; }
      both() { [ "$(peer 192.0.2.2)" = "Established 65010 True" ] && [ "$(peer 192.0.2.6)" = "Established 65020 True" ]; }
      wait_for 40 both && { echo up; exit 0; }
      for want in "192.0.2.2 65010 ISP A" "192.0.2.6 65020 ISP B"; do
        set -- $want
        got=$(peer "$1")
        case $got in
          "Established $2 "*) ;;
          *) echo "edge has no BGP session up with $3 ($1, AS $2): FRR says ${got%% *}"; exit 0 ;;
        esac
      done
      echo up
    expect:
      equals: up
  - id: announced-exactly
    description: "ISP A and ISP B each accept exactly one route from edge: the shop's 198.51.100.0/24."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      # What each ISP's router took from edge (after its own filters, which
      # take everything a customer sends).
      for isp in "ispa 192.0.2.1 A" "ispb 192.0.2.5 B"; do
        set -- $isp
        got=$(frr "$1" "show bgp ipv4 unicast neighbors $2 routes json" | json "sorted(d.get('routes', {}))")
        [ "$got" = '["198.51.100.0/24"]' ] || { echo "ISP $3 accepted $got from edge, not just the shop's 198.51.100.0/24"; exit 0; }
      done
      echo exactly
    expect:
      equals: exactly
  - id: own-space-refused
    description: "edge accepts no route for any part of the shop's 198.51.100.0/24 from either ISP, even one it hasn't been offered before, and sends traffic for the shop's own addresses onto the shop's network."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      # 1. No path in edge's BGP table for any part of 198.51.100.0/24 came
      #    from an ISP: the only one may be edge's own (peer "(unspec)").
      foreign=$(frr edge 'show bgp ipv4 unicast 198.51.100.0/24 longer-prefixes json' | json "sorted(p for p, paths in d.get('routes', {}).items() for x in paths if x.get('peerId') != '(unspec)')")
      [ "$foreign" = "[]" ] || { echo "edge took routes for part of the shop's own addresses from an ISP: $foreign"; exit 0; }
      # 2. The kernel sends the shop's website's traffic onto the shop's LAN.
      route=$(ip -n edge route get 198.51.100.200 2>&1 | head -n 1)
      case $route in
        "198.51.100.200 dev lan "*) ;;
        *) echo "edge sends traffic for 198.51.100.200 elsewhere than the shop's network: $route"; exit 0 ;;
      esac
      # 3. Each ISP offers edge, for a few seconds, a route for a part of the
      #    shop's lower half chosen at random (/26 to /32), as a slip would:
      #    a kernel route on the ISP's router pointing at edge, which its
      #    BGP hands to its customer. The check removes it again, even if it
      #    is stopped part way (the trap runs on the way out).
      offered=""
      trap 'for o in $offered; do ip -n "${o%%=*}" route del "${o#*=}" 2> /dev/null; done' EXIT
      advertised() { [ "$(frr "$isp" "show bgp ipv4 unicast neighbors $to advertised-routes json" | json "'$prefix' in d.get('advertisedRoutes', {})")" = True ]; }
      taken() { [ "$(bgp-best edge "$prefix")" != none ]; }
      offer() { # the ISP's machine, edge's address on that cable, the ISP's name
        isp=$1 to=$2
        len=$((26 + RANDOM % 7))
        size=$((1 << (32 - len)))
        prefix="198.51.100.$(((RANDOM % (128 / size)) * size))/$len"
        ip -n "$isp" route add "$prefix" via "$to" || { echo "the check couldn't offer a route from $3"; exit 0; }
        offered="$offered $isp=$prefix"
        wait_for 5 advertised || { echo "$3 never offered $prefix to edge, so the check couldn't test it"; exit 0; }
        if wait_for 4 taken; then
          echo "edge accepted $prefix from $3: a part of the shop's own 198.51.100.0/24"
          exit 0
        fi
        ip -n "$isp" route del "$prefix"
      }
      offer ispa 192.0.2.1 "ISP A"
      offer ispb 192.0.2.5 "ISP B"
      echo refused
    expect:
      equals: refused
  - id: cloud-reaches-shop
    description: "The cloud's web server reaches the shop's website, 198.51.100.200."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      shop() { [ "$(on web curl -s -m 2 http://198.51.100.200/)" = "the shop's website: you are 203.0.113.10" ]; }
      wait_for 3 shop || { echo "the cloud's web server doesn't reach the shop's website"; exit 0; }
      echo reached
    expect:
      equals: reached
  - id: exit-via-a
    description: "edge sends the shop's traffic to the internet through ISP A, chosen by local preference, and the office reaches the cloud's web server that way."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      # Two prefixes both ISPs offer: the cloud's, and ISP B's own customers'.
      for p in 203.0.113.0/24 10.20.0.0/16; do
        best=$(bgp-best edge "$p")
        case $best in
          "via 192.0.2.2, "*"chosen by Local Pref") ;;
          *) echo "edge's chosen path to $p isn't through ISP A by local preference: $best"; exit 0 ;;
        esac
      done
      best=$(bgp-best edge 10.10.0.0/16)
      case $best in
        "via 192.0.2.2, "*) ;;
        *) echo "edge's chosen path to ISP A's customers, 10.10.0.0/16, isn't through ISP A: $best"; exit 0 ;;
      esac
      hop=$(ip -n edge route get 203.0.113.10 2>&1 | awk '{for (i = 1; i < NF; i++) if ($i == "via") {print $(i + 1); exit}}')
      [ "$hop" = 192.0.2.2 ] || { echo "edge's kernel sends traffic for 203.0.113.10 via ${hop:-nothing}, not ISP A"; exit 0; }
      [ "$(on office curl -s -m 3 http://203.0.113.10/)" = "you are 198.51.100.10" ] || { echo "the office doesn't reach the cloud's web server"; exit 0; }
      echo "via ISP A"
    expect:
      equals: "via ISP A"
  - id: policy-kept
    description: "edge's eBGP sessions still require a policy before they accept or send anything."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      frr edge 'show running-config' | grep 'no bgp ebgp-requires-policy' > /dev/null && { echo "edge's eBGP sessions no longer require a policy"; exit 0; }
      echo kept
    expect:
      equals: kept
  - id: saved
    description: "edge's running FRR configuration is the one in its /etc/frr/frr.conf, so a restart gives the same routing."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      differs=$(frr_saved edge) || { echo "edge's running configuration isn't its file: $(echo "$differs" | grep '^[<>]' | head -n 2 | tr '\n' ' ')"; exit 0; }
      echo saved
    expect:
      equals: saved
  - id: far-side-untouched
    description: "The ISPs', the transit network's and the cloud's routers are as they were: their files, and the routing they run."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      sealed=$(intact) || { echo "$sealed"; exit 0; }
      # The sealed files can't show a change typed into a router's console.
      for r in ispa ispb transit cloud; do
        frr_saved "$r" > /dev/null || { echo "$r's routing was changed live"; exit 0; }
      done
      echo untouched
    expect:
      equals: untouched
