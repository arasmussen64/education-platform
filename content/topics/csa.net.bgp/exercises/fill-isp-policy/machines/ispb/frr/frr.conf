frr version 8.4.4
frr defaults traditional
hostname ispb
log syslog informational
service integrated-vtysh-config
!
ip route 10.20.0.0/16 blackhole
!
router bgp 65020
 bgp router-id 192.0.2.6
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 192.0.2.5 remote-as 65001
 neighbor 192.0.2.5 description the shop
 neighbor 192.0.2.5 timers connect 5
 neighbor 192.0.2.18 remote-as 65100
 neighbor 192.0.2.18 description the cloud
 neighbor 192.0.2.18 timers connect 5
 !
 address-family ipv4 unicast
  network 10.20.0.0/16
  redistribute kernel route-map SHOP-SLIPS
  neighbor 192.0.2.5 route-map FROM-SHOP in
  neighbor 192.0.2.5 route-map TO-SHOP out
  neighbor 192.0.2.18 route-map FROM-CLOUD in
  neighbor 192.0.2.18 route-map TO-CLOUD out
 exit-address-family
exit
!
ip prefix-list PARTIAL seq 5 permit 10.20.0.0/16
ip prefix-list PARTIAL seq 10 permit 203.0.113.0/24
ip prefix-list SHOP-PARTS seq 5 permit 198.51.100.0/24 ge 25
!
route-map SHOP-SLIPS permit 10
 match ip address prefix-list SHOP-PARTS
exit
!
route-map FROM-SHOP permit 10
exit
!
route-map TO-SHOP permit 10
 match ip address prefix-list PARTIAL
exit
!
route-map TO-SHOP permit 20
 match ip address prefix-list SHOP-PARTS
 set ip next-hop peer-address
exit
!
route-map FROM-CLOUD permit 10
exit
!
route-map TO-CLOUD deny 10
 match ip address prefix-list SHOP-PARTS
exit
!
route-map TO-CLOUD permit 20
exit
!
