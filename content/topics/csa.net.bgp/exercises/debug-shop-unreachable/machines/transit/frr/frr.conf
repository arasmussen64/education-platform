frr version 8.4.4
frr defaults traditional
hostname transit
log syslog informational
service integrated-vtysh-config
!
router bgp 65030
 bgp router-id 192.0.2.10
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 192.0.2.9 remote-as 65010
 neighbor 192.0.2.9 description ISP A
 neighbor 192.0.2.9 timers connect 5
 neighbor 192.0.2.14 remote-as 65100
 neighbor 192.0.2.14 description the cloud
 neighbor 192.0.2.14 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 192.0.2.9 route-map ALL in
  neighbor 192.0.2.9 route-map ALL out
  neighbor 192.0.2.14 route-map ALL in
  neighbor 192.0.2.14 route-map ALL out
 exit-address-family
exit
!
route-map ALL permit 10
exit
!
