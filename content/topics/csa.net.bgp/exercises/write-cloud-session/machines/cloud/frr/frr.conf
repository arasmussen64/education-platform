frr version 8.4.4
frr defaults traditional
hostname cloud
log syslog informational
service integrated-vtysh-config
!
ip route 10.200.0.0/16 blackhole
!
router bgp 65100
 bgp router-id 203.0.113.1
 bgp bestpath compare-routerid
 timers bgp 3 9
 neighbor 169.254.30.1 remote-as 65001
 neighbor 169.254.30.1 description the shop, over the VPN
 neighbor 169.254.30.1 timers connect 5
 neighbor 192.0.2.13 remote-as 65030
 neighbor 192.0.2.13 description transit
 neighbor 192.0.2.13 timers connect 5
 neighbor 192.0.2.17 remote-as 65020
 neighbor 192.0.2.17 description ISP B
 neighbor 192.0.2.17 timers connect 5
 !
 address-family ipv4 unicast
  network 10.200.0.0/16
  network 203.0.113.0/24
  redistribute kernel route-map CHECK-OFFERS
  neighbor 169.254.30.1 default-originate
  neighbor 169.254.30.1 route-map FROM-VPN in
  neighbor 169.254.30.1 route-map TO-VPN out
  neighbor 192.0.2.13 route-map ALL in
  neighbor 192.0.2.13 route-map TO-INTERNET out
  neighbor 192.0.2.17 route-map ALL in
  neighbor 192.0.2.17 route-map TO-INTERNET out
 exit-address-family
exit
!
ip prefix-list CLOUD-OWN seq 5 permit 203.0.113.0/24
ip prefix-list CLOUD-OWN seq 10 permit 10.200.0.0/16
ip prefix-list VPN-ONLY seq 5 permit 10.200.0.0/16
ip prefix-list VPN-ONLY seq 10 permit 10.240.0.0/12 le 32
!
route-map ALL permit 10
exit
!
route-map CHECK-OFFERS permit 10
 match ip address prefix-list VPN-ONLY
exit
!
route-map FROM-VPN permit 10
exit
!
route-map TO-VPN permit 10
 match ip address prefix-list CLOUD-OWN
exit
!
route-map TO-VPN permit 20
 match ip address prefix-list VPN-ONLY
exit
!
route-map TO-INTERNET deny 10
 match ip address prefix-list VPN-ONLY
exit
!
route-map TO-INTERNET permit 20
exit
!
