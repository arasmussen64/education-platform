skills:
  - id: bgp-sessions
    description: "Configure an eBGP neighbour in FRR (`router bgp ASN`, `neighbor ADDRESS remote-as ASN`, the timers); read `show bgp summary` (the state or the prefix count, `(Policy)`) and `show bgp neighbors` (its state and its last reset); what each state means, why a session doesn't come up (wrong AS number, wrong address, TCP 179 blocked, no route), and the keepalive and hold timers"
  - id: announce-and-filter
    description: "Announce your own prefix (`network` needs that exact prefix in the routing table) and nothing else, with a prefix list and a route map out; refuse your own space and everything inside it (`le 32`) coming in; RFC 8212 and `bgp ebgp-requires-policy`; maximum prefixes; route leaks and prefix hijacks"
  - id: best-path
    description: "Predict the winner among several paths to one prefix from `show bgp ipv4 unicast` (`>`, `LocPrf`, `Metric`, `Path`): weight (one router's own), local preference, a route the router originates, AS path length, origin, MED (only between paths from the same neighbouring AS), eBGP over iBGP, then tie-breaks; the kernel installs only the winner"
  - id: local-preference
    description: "Choose the way out for outbound traffic: local preference on the routes from the preferred neighbour, set in an inbound route map; confirm it in `show bgp`, with `ip route get` and with traceroute; it is shared with the AS's other routers over iBGP and changes nothing about how others reach you"
