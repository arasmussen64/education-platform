id: csa.net.bgp
kind: topic
status: ready
title: BGP sessions and policy
summary: "How networks tell each other where addresses are: BGP sessions between routers and how to read their state, announcing your own prefixes and filtering what you send and accept so you never leak routes or accept a hijack, the order in which a router picks one path among several, and choosing your way out with local preference, on a shop with two internet providers."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2
# and 5, topic 35) and its designer's brief (csa.net.bgp.md, with
# frr-labs-common.md). The first half of the spec's old BGP topic; the second,
# steering incoming traffic, route reflection, failure detection and the
# clouds' circuits, is csa.net.bgp-steering. Through csa.net.routing this
# builds on csa.net.cidr and csa.net.layers (the network labs' machines, on,
# netlab and services as name@machine) and csa.m1.checkpoint; for the
# writer: routing's longest-prefix match (a hijacked more-specific prefix
# wins by it), FRR, vtysh, show ip route, distance (eBGP 20, iBGP 200) and
# write memory, and its first definition of BGP as a routing protocol;
# CIDR's prefixes inside prefixes (le 32); Module 1's TCP, ports, ss and
# traceroute. This topic defines autonomous system, eBGP and iBGP, prefix
# list, route map and looking glass for the module (the plan's section 3.7).
prerequisites: [csa.net.routing]
# Worked out: the lesson about 22 minutes (2,800 words at 130 a minute),
# reading 47 (the main video 18, the Systems Approach's two sections 9,
# FRR's four sections 11, Cloudflare's 2019 account 9), 17 recall items at
# 1.5 each 26, then the worked example 35 (twelve steps), the fill-in 20,
# the write 25, the build 55, the debug 45 and the explain 20: 295. The plan
# gives 285; the walkthrough's two extra steps (the stolen half and the
# filter that refuses it) are the difference.
estimated_minutes: 295
rev: 1
objectives:
  - "Bring up eBGP sessions on a router (FRR), read `show bgp summary` and `show bgp neighbors`, and say why a session isn't working from its state and its last error."
  - "Announce your own prefix and nothing else, accept nothing inside your own space, and say why both filters are compulsory: route leaks, prefix hijacks and RFC 8212's rule that an eBGP session with no policy passes nothing."
  - "Predict which of several paths to one prefix BGP chooses, from a real `show bgp` table, by its decision order: weight, local preference, AS path length, origin, MED between paths from one neighbouring AS, eBGP over iBGP, and the tie-breaks."
  - "Choose the way out for outbound traffic with local preference, prove it in the kernel's forwarding table and with traceroute, and know that it changes nothing about how others reach you."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - BGP listens on TCP port 179; the session states Idle, Connect, Active,
#   OpenSent, OpenConfirm and Established (RFC 4271, January 2006):
#   https://www.rfc-editor.org/rfc/rfc4271
# - RFC 8212 (July 2017, Proposed Standard): routes from an EBGP peer "SHALL
#   NOT be considered eligible in the Decision Process" without an explicit
#   import policy, and "Routes SHALL NOT be added to an Adj-RIB-Out
#   associated with an EBGP peer if no explicit Export Policy has been
#   applied"; route leaks among the reasons: https://www.rfc-editor.org/rfc/rfc8212
# - Private AS numbers: 64512 - 65534 and 4200000000 - 4294967294 (RFC 6996,
#   July 2013): https://www.rfc-editor.org/rfc/rfc6996
# - FRR 8.4: bgp ebgp-requires-policy "is enabled by default for the
#   traditional configuration and turned off by default for datacenter
#   configuration", with "(Policy)" in show bgp summary; the route selection
#   order (weight, local preference, local route, AS path length, origin,
#   MED "Where routes with a MED were received from the same AS", external,
#   IGP cost, multi-path, already-selected external, router ID, cluster-list
#   length, peer address); compare-routerid skips the already-selected
#   check; the network import check "For versions 7.4 and beyond both
#   traditional and datacenter the network must exist"; maximum-prefix: "If
#   this number is exceeded, the BGP session will be destroyed":
#   https://docs.frrouting.org/en/stable-8.4/bgp.html
# - FRR 8.4's source: BGP_DEFAULT_HOLDTIME 180, BGP_DEFAULT_KEEPALIVE 60,
#   BGP_DEFAULT_CONNECT_RETRY 120, BGP_DEFAULT_LOCAL_PREF 100,
#   BGP_DEFAULT_EBGP_ROUTEADV 0, RMAP_DEFAULT_UPDATE_TIMER 5:
#   https://raw.githubusercontent.com/FRRouting/frr/stable/8.4/bgpd/bgpd.h
# - The 2019 leak: DQE Communications' BGP optimizer made more specific
#   routes, its customer Allegheny Technologies passed them to its other
#   provider, Verizon (AS701), which accepted and passed them on; prefix
#   limits, IRR filtering and RPKI would each have stopped it (Cloudflare,
#   2019-06-24): https://blog.cloudflare.com/how-verizon-and-a-bgp-optimizer-knocked-large-parts-of-the-internet-offline-today/
# - Facebook stopped announcing its routes, its DNS servers' prefixes among
#   them, on 2021-10-04 (Cloudflare, 2021-10-04):
#   https://blog.cloudflare.com/october-2021-facebook-outage/
# - AWS: a virtual private gateway's Amazon-side ASN is 64512 unless you
#   choose another, and can't be changed after it is created:
#   https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html ; a
#   customer gateway may use a private ASN (64,512-65,534 or
#   4,200,000,000-4,294,967,294): https://docs.aws.amazon.com/vpn/latest/s2svpn/cgw-options.html ;
#   "Dynamic routes advertised from a customer gateway device to a
#   Site-to-Site VPN connection on a virtual private gateway": 100, not
#   adjustable: https://docs.aws.amazon.com/vpn/latest/s2svpn/vpn-limits.html
# - Azure: VPN gateways have a default ASN of 65515 (it can be changed after
#   the gateway is created; 65515 and 65517 to 65520 are reserved); "Azure
#   VPN Gateway supports up to 4,000 prefixes. The BGP session is dropped if
#   the number of prefixes exceeds the limit."; keepalive 60 s and hold 180
#   s, fixed (ms.date 2026-06-04, updated 2026-09-15):
#   https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
# - Google Cloud: "Cloud Router requires you to use a private ASN" (64512 to
#   65534 or 4200000000 to 4294967294; 16550 with Partner Interconnect);
#   keepalive 20 s by default, 20 to 60 (last updated 2026-11-10):
#   https://docs.cloud.google.com/network-connectivity/docs/router/how-to/create-router-vpc-network ;
#   "If a BGP peer advertises more than 5,000 prefixes, Cloud Router resets
#   the BGP session" (last updated 2026-11-10):
#   https://docs.cloud.google.com/network-connectivity/docs/router/quotas
