prove:
  build: build-dual-homed
  debug: debug-shop-unreachable
  explain:
    prompt: |
      Your company is about to connect its data centre to two internet providers with BGP, and a colleague says: "Once BGP is on, the internet just finds us." Explain, in your own words: how two routers become BGP neighbours and what they tell each other; what your router should announce and what it should accept, and what goes wrong without each of those filters, with a real kind of incident; how a router chooses between several paths to the same network; how you would make your outgoing traffic use the cheaper provider, and what that does not change; and what happens to your traffic when one of the sessions drops.
    rubric:
      - id: sessions
        required: true
        description: "A session is a TCP connection on port 179 between two routers, each configured with the other's address and AS number; they exchange OPEN messages (a wrong AS number is refused), then keepalives, and a router drops the session and the routes it learned over it when the hold time passes without hearing from the other; eBGP joins two autonomous systems, iBGP two routers of one."
      - id: announce-filter
        required: true
        description: "Announce only your own prefixes (a network statement works only for a prefix in the routing table); never pass one provider's routes to the other, which is a route leak that makes you a path for other people's traffic; refuse your own prefix and anything inside it, because a more specific route, by mistake or a hijack, beats your own by longest prefix; RFC 8212, which FRR follows: an eBGP session with no policy passes nothing, and switching that off is the wrong fix; a maximum-prefix limit as a fuse."
      - id: best-path
        required: true
        description: "The decision order at least as far as MED: local preference (highest), AS path length (shortest), origin, MED (lowest, and only between paths from the same neighbouring AS); then eBGP over iBGP and the tie-breaks (FRR's weight comes first and stays on one router); the kernel installs only the chosen path."
      - id: exit
        required: true
        description: "Local preference, set by an inbound route map on the routes from the cheaper provider, makes them win, so outgoing traffic leaves that way, and it applies to every router in the AS; it changes nothing about how other networks reach you, which depends on their choices and needs other tools."
      - id: failure
        required: false
        description: "When a session drops (at once if the link goes down, after the hold time if the path dies silently), its routes are withdrawn and the next best path, through the other provider, takes over by itself; when it returns, the preferred path wins again."
    model_answer: |
      The internet doesn't find anyone: tens of thousands of networks, each an autonomous system with its own number, tell their neighbours which addresses they can reach, and BGP is how they say it. Two routers become neighbours by opening a TCP connection on port 179. Each is configured with the other's address and AS number, and they exchange OPEN messages; if the AS number in the OPEN isn't the one configured, the session is refused with "bad peer AS". Then they exchange routes, prefixes with their AS paths, and keepalives every few seconds. If one hears nothing for the hold time, 180 seconds by default, it drops the session and forgets the routes it learned over it. Between two companies that's eBGP; between routers of one company it's iBGP.

      What we announce and accept needs a filter each way. We should announce only our own prefix, and the network line only works if that exact prefix is in our routing table. If we passed one provider's routes to the other, we would be leaking: the second provider might send its traffic for the first one's customers through our small links, which is what happened in 2019 when a company passed one provider's routes to Verizon, which accepted them. Coming in, we should refuse our own prefix and anything inside it: if a provider sends a more specific route for half our addresses, by mistake or as a hijack, longest-prefix match makes it beat our own network, and our servers become unreachable from outside. FRR follows RFC 8212, so an eBGP session passes nothing at all until a route map allows it; turning that off is the wrong fix. A maximum-prefix limit is a fuse against a neighbour who suddenly sends a whole internet table.

      To choose between paths, BGP compares them one attribute at a time: highest local preference first, then the shortest AS path, then origin, then the lowest MED, but MED only between paths from the same neighbouring network, then a path learned over eBGP over one learned over iBGP, then tie-breaks. The kernel installs only the winner.

      To use the cheaper provider, I'd set local preference 200 on every route it sends us, in an inbound route map on that session. Its paths then beat the other provider's even when theirs are shorter, and because local preference travels inside our AS, every router of ours agrees. It changes nothing about how the internet reaches us, though: incoming traffic depends on other networks' choices about the routes we announce.

      If the cheaper provider's session drops, its routes are withdrawn, at once if the cable goes, or after the hold time if the path dies silently, and the other provider's paths are the best left, so traffic moves there by itself, and back when the session returns.
