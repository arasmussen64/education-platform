# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
  - id: grow-by-loop
    description: "Grow an amount period by period in a loop, with a table that starts at year 0"
  - id: grow-by-formula
    description: "The future-value formula `present * (1 + rate) ** periods`, and that it matches the loop"
  - id: doubling
    description: "Doubling time: the rule of 72, and its exact form with logarithms"
  - id: simple-vs-compound
    description: "Tell simple interest from compound interest, and work out each"
