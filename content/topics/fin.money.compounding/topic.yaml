prove:
  build: build-future-value
  debug: debug-savings-projector
  explain:
    prompt: |
      Two friends each save $5,000 a year at 7% a year, compounded once a year. Ana saves from 25 to 34 (ten deposits) and then stops, leaving the money in. Ben starts at 35 and saves every year until 64 (thirty deposits). Each deposit is made on a birthday and left to grow until 65. At 65, Ana has about $563,000 and Ben about $505,000, though Ben put in three times as much. In your own words: how can Ana end up with more? Use the rule of 72 and at least one number of your own to explain it; you can also say what would happen with simple interest.
    rubric:
      - id: compounding
        required: true
        description: "Compound interest pays interest on earlier interest, so growth is a power of the years: money left longer grows by far more, not just a little more."
      - id: ana-time
        required: true
        description: "Ana's deposits compound for 31 to 40 years, Ben's for 1 to 30: her money has more years of growth, and the last years add the most."
      - id: doubling
        required: true
        description: "Uses doubling: at 7% money doubles about every 72 / 7 ≈ 10 years, so after Ana stops at 35 her balance gets about three more doublings by 65, roughly 8 times, while each of Ben's deposits has at most 30 years to grow."
      - id: a-number
        required: true
        description: "Gives a correct number, such as Ana's balance at 35 (about $74,000) growing about 7.6 times (1.07 ** 30) by 65, or one deposit's growth over 40 years against 30."
      - id: simple-contrast
        required: false
        description: "Says that with simple interest Ben would end with more, since each dollar would earn the same amount a year however long it was in."
    model_answer: |
      With compound interest each year's interest is added to the balance and earns interest itself, so money grows by a power of the years: a dollar left 40 years at 7% becomes 1.07 ** 40, about $15, while a dollar left 30 years becomes about $7.60. So the years matter more than the amount. By the rule of 72, money at 7% doubles roughly every 72 / 7, about 10 years. Ana's ten deposits are all made by 35, and by then they've grown to about $74,000. That sum then compounds for another 30 years, three more doublings, multiplying by 1.07 ** 30, about 7.6, to around $563,000. Ben puts in $150,000, three times as much, but each of his deposits has at most 30 years to grow, and his last ones barely grow at all, so he ends with about $505,000. With simple interest it would be the other way round: each dollar would earn the same 7 cents a year however long it sat, and Ben's extra $100,000 of deposits would win. Compounding rewards time, which is why starting early beats saving more later.
