id: est-doubling-rate
type: estimate
rev: 1
prompt: |
  You want a sum to double in 9 years, compounded once a year. By the rule of 72, about what yearly rate does it need, in percent? Within 5%.
unit: "% a year"
answer: 8
tolerance: { percent: 5 }
given: { years: 9 }
working: 72 / years
mistakes:
  - id: simple-doubling
    value: 11.11
    working: 100 / years
    why: "That's the simple-interest rate that doubles money in 9 years. With compounding, a lower rate does it."
  - id: upside-down
    value: 0.125
    working: years / 72
    why: "That divides the wrong way round. The rule works both ways: years = 72 / rate, so rate = 72 / years."
explanation: |
  The rule of 72 works in both directions: years ≈ 72 / rate, and rate ≈ 72 / years. 72 / 9 = 8% a year. Check: 1.08 ** 9 is 1.999, a doubling.
skills: [doubling]
