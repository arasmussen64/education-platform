id: review-mcq-round-at-the-end
type: mcq
rev: 1
prompt: |
  Two programs grow $1,000 at 7% a year for 30 years. One rounds `balance` to the cent after every year's interest. The other keeps the float as it is and rounds only when it prints. The formula gives $7,612.26. What does the first program end with?
choices:
  - '$7,612.26, the same, because a cent each year is too small to matter'
  - '$7,612.25, a cent short, because each rounding feeds the next year'
  - '$7,605.00, several dollars short, because each rounding loses a cent'
  - '$7,612.26 at first, then drifting a cent further off every year after'
answer: 1
explanation: |
  Each rounding throws away up to half a cent, and the next year's interest is then worked out on the rounded number, so the small errors are carried forward. Over 30 years they add up to one cent here: $7,612.25 against $7,612.26. That's why this module keeps money as an unrounded float and rounds only for printing (`f"{balance:,.2f}"`). Real banks keep exact whole cents and have rules for when to round; for sums this short, a float rounded at the end is right to the cent. "Several dollars short" overstates it: each rounding can go up or down, and none is a full cent.
skills: [grow-by-loop]
