id: mcq-loop-equals-formula
type: mcq
rev: 1
prompt: |
  A loop runs `years` times, and each time it does `balance = balance * (1 + rate)`. Which single expression gives the same final balance from the starting one?
choices:
  - '`balance * (1 + rate * years)`'
  - '`balance * (1 + rate) * years`'
  - '`balance + (1 + rate) ** years`'
  - '`balance * (1 + rate) ** years`'
answer: 3
explanation: |
  Multiplying by `(1 + rate)` once a year for `years` years multiplies by it `years` times, which is a power: `(1 + rate) ** years`. `balance * (1 + rate * years)` is simple interest, the same `rate` of the original added each year. `balance * (1 + rate) * years` grows one year and then multiplies by the number of years, so 10 years would give ten times the money. `balance + (1 + rate) ** years` adds the growth factor to the balance instead of multiplying by it.
skills: [grow-by-formula]
