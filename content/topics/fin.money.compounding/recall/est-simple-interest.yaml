id: est-simple-interest
type: estimate
rev: 1
prompt: |
  An account pays simple interest: 3% a year on the original $800 only. What does it hold after 12 years? Exactly.
unit: dollars
answer: 1088
tolerance: { absolute: 0 }
given: { principal: 800, rate: 3, years: 12 }
working: principal + principal * rate / 100 * years
mistakes:
  - id: compounded
    value: 1140.61
    working: principal * (1 + rate / 100) ** years
    why: "That compounds the interest. Simple interest pays 3% of the original $800, $24, every year, and nothing on earlier interest."
  - id: interest-only
    value: 288
    working: principal * rate / 100 * years
    why: "That's the interest alone. The account holds the $800 as well."
explanation: |
  Simple interest is the same amount every year: 3% of $800 is $24, and 12 years of it is $288, so the account holds 800 + 288 = $1,088. Compounded once a year, the same 3% would give $1,140.61: the $52.61 difference is interest earned on interest.
skills: [simple-vs-compound]
amounts: made-up
