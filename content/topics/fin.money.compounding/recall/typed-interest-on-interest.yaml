id: typed-interest-on-interest
type: typed
rev: 1
prompt: |
  Name the kind of interest that is paid on the interest already earned as well as on the original amount. Two words.
kind: text
answers:
  - "compound interest"
  - "compounding"
mistakes:
  - id: simple
    answers: ["simple interest"]
    why: "Simple interest is paid on the original amount only, the same sum every year."
explanation: |
  Compound interest adds each period's interest to the balance, so the next period's interest is worked out on the bigger amount. Simple interest pays the rate on the principal, the original amount, and nothing on earlier interest.
skills: [simple-vs-compound]
