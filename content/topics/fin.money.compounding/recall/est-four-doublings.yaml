id: est-four-doublings
type: estimate
rev: 1
prompt: |
  $1,500 is left to grow at 8% a year, compounded once a year, for 36 years. About how much is it by then? Within 5%.
unit: dollars
answer: 23952.26
tolerance: { percent: 5 }
given: { present: 1500, rate: 8, years: 36 }
working: present * (1 + rate / 100) ** years
mistakes:
  - id: simple
    value: 5820
    working: present + present * rate / 100 * years
    why: "That's simple interest: $120 a year for 36 years. Compounding grows the balance, and the interest with it."
  - id: four-times
    value: 6000
    working: present * 4
    why: "The money doubles four times, which is 2 × 2 × 2 × 2 = 16 times the start, not 4 times."
explanation: |
  In your head: by the rule of 72, 8% doubles money every 72 / 8 = 9 years, and 36 years is 4 doublings: 1,500 → 3,000 → 6,000 → 12,000 → 24,000. The formula gives 1,500 × 1.08 ** 36 = $23,952.26. Doublings multiply, so four of them are 16 times, which is why long horizons matter so much.
skills: [doubling, grow-by-formula]
amounts: made-up
