id: review-predict-loop-and-formula
type: predict_output
rev: 1
prompt: |
  The same growth, by a loop and by the formula. What does the program print?
code: |
  balance = 1000
  for year in range(2):
      balance = balance * 1.5
  print(f"{balance:,.2f}")
  print(f"{1000 * 1.5 ** 2:,.2f}")
  print(f"{1000 * (1 + 0.5 * 2):,.2f}")
expected_output: |
  2,250.00
  2,250.00
  2,000.00
explanation: |
  `range(2)` runs the loop twice, so 1,000 is multiplied by 1.5 twice: 1,500, then 2,250. The formula says the same in one line, `1000 * 1.5 ** 2`. The third line is simple interest: 50% of the original $1,000 each year for 2 years adds $1,000, ending at 2,000. The $250 gap is the second year's interest on the first year's $500.
skills: [grow-by-loop, grow-by-formula]
