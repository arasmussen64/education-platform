id: predict-three-years
type: predict_output
rev: 1
prompt: |
  $200 grows at 10% a year for three years. What does the program print?
code: |
  balance = 200
  rate = 0.10
  for year in range(1, 4):
      balance = balance * (1 + rate)
      print(f"Year {year}: {balance:,.2f}")
expected_output: |
  Year 1: 220.00
  Year 2: 242.00
  Year 3: 266.20
explanation: |
  Each pass multiplies the whole balance by 1.10: 200 becomes 220, then 220 × 1.10 = 242, then 242 × 1.10 = 266.20. The interest grows each year, $20, then $22, then $24.20, because each year's 10% is taken of a bigger balance. Simple interest would have added $20 every year and ended at 260.00. The format `,.2f` prints two decimals, which is why 266.2 shows as `266.20`.
skills: [grow-by-loop]
