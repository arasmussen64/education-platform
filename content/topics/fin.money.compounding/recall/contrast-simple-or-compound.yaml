id: contrast-simple-or-compound
type: mcq
rev: 1
prompt: |
  You have $5,000 to leave untouched for 25 years. Offer A pays 8% a year as simple interest, on the $5,000 only. Offer B pays 6% a year, compounded once a year. Which offer ends with more?
choices:
  - 'Offer A, because 8% a year is a higher rate than 6% a year'
  - 'Offer B, though its rate is lower: it pays interest on interest'
  - 'Neither: over 25 years the two offers end with the same amount'
  - 'Offer A at first, and Offer B only once the rates are above 10%'
answer: 1
explanation: |
  Offer A adds 8% of $5,000, $400, every year: 5,000 + 400 × 25 = $15,000. Offer B multiplies the whole balance by 1.06 every year: 5,000 × 1.06 ** 25 = $21,459.35, about $6,500 more. A higher rate on the original amount loses to a lower rate on a growing balance once the years are long enough. In the first years Offer A is ahead (after 5 years it holds $7,000 against $6,691), which is why the comparison has to be made over the real horizon, whatever the rates.
skills: [simple-vs-compound]
