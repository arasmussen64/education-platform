id: est-rule-of-72
type: estimate
rev: 1
prompt: |
  Money grows at 6% a year, compounded once a year. Using the rule of 72, about how many years does it take to double? Within 5%.
unit: years
answer: 12
tolerance: { percent: 5 }
given: { rate: 6 }
working: 72 / rate
mistakes:
  - id: simple-doubling
    value: 16.67
    working: 100 / rate
    why: "That's how long simple interest takes to double money: 6% of the original each year, 100 / 6 years. Compounding is faster."
  - id: decimal-rate
    value: 1200
    working: 72 / (rate / 100)
    why: "The rule divides 72 by the rate in percent, 6, not by the decimal 0.06."
explanation: |
  72 / 6 = 12 years. The exact answer is `math.log(2) / math.log(1.06)`, 11.9 years, inside the 5%. The rule is close for rates from about 4% to 12%; it's a way to size a number in your head, and the log is the way to get it exactly.
skills: [doubling]
