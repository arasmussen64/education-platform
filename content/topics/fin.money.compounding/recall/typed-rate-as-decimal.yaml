id: typed-rate-as-decimal
type: typed
rev: 1
prompt: |
  A question says an account pays 4.5% a year. Type the number that this module's code holds in `rate` for it.
kind: text
answers:
  - "0.045"
  - ".045"
mistakes:
  - id: the-percent
    answers: ["4.5"]
    why: "That's the percent. The code holds the rate as a decimal, the percent divided by 100, so `1 + rate` is the growth factor 1.045."
  - id: one-place-off
    answers: ["0.45"]
    why: "That's 45%. 4.5% is 4.5 hundredths: 0.045."
explanation: |
  This module writes every rate as a decimal: the percent divided by 100. 4.5% is `0.045`, and a year's growth is multiplying by `1 + rate`, which is 1.045. Holding 4.5 instead would multiply the money by 5.5 a year.
skills: [grow-by-formula]
