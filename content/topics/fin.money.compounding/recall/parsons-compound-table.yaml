id: parsons-compound-table
type: parsons
rev: 1
prompt: |
  $500 is saved at 4% a year, compounded once a year. Put the lines in order so the program prints the balance at the end of each of 3 years, then the interest earned in all:

  ```
  Year 1: 520.00
  Year 2: 540.80
  Year 3: 562.43
  Interest earned: 62.43
  ```

  Two lines are decoys that don't belong.
lines:
  - 'balance = 500'
  - 'for year in range(1, 4):'
  - '    balance = balance * (1 + 0.04)'
  - '    print(f"Year {year}: {balance:,.2f}")'
  - 'print(f"Interest earned: {balance - 500:,.2f}")'
distractors:
  - '    balance = balance + 500 * 0.04'
  - 'for year in range(3):'
explanation: |
  The balance starts at 500, and each pass of the loop multiplies the whole balance by `1 + 0.04`, then prints it, so year 2's interest is 4% of $520, not of $500. After the loop, the interest earned is what the balance gained, `balance - 500`. The decoy `balance + 500 * 0.04` adds $20 every year, simple interest, and ends at 560.00. `range(3)` counts 0, 1, 2, so the rows would be labelled one year early.
skills: [grow-by-loop]
