id: est-compound-extra
type: estimate
rev: 1
prompt: |
  $10,000 is left for 20 years at 5% a year. How much more does it end with if the interest is compounded once a year than if it's simple interest on the $10,000? Within 2%.
unit: dollars
answer: 6532.98
tolerance: { percent: 2 }
given: { principal: 10000, rate: 5, years: 20 }
working: principal * (1 + rate / 100) ** years - (principal + principal * rate / 100 * years)
mistakes:
  - id: compound-total
    value: 26532.98
    working: principal * (1 + rate / 100) ** years
    why: "That's the compounded balance itself. The question asks how much more it is than the simple-interest balance, $20,000."
  - id: simple-interest
    value: 10000
    working: principal * rate / 100 * years
    why: "That's the simple interest earned, $500 a year for 20 years. Subtract the whole simple balance from the compounded one."
explanation: |
  Compounded: 10,000 × 1.05 ** 20 = $26,532.98. Simple: 10,000 + 500 × 20 = $20,000. The difference, $6,532.98, is interest earned on earlier interest. It's small in the first years (just $25 after two) and grows faster every year.
skills: [simple-vs-compound, grow-by-formula]
amounts: made-up
