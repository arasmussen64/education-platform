id: mcq-simple-or-compound
type: mcq
rev: 1
prompt: |
  An account holds $2,000 and pays 5% a year, compounded once a year. After the first year it holds $2,100. How much interest does it earn in the second year?
choices:
  - '$100.00'
  - '$110.25'
  - '$105.00'
  - '$205.00'
answer: 2
explanation: |
  Compound interest is worked out on the balance, which now includes the first year's $100: 5% of $2,100 is $105.00. The extra $5 is the interest on the first year's interest. $100.00 is 5% of the original $2,000, which is what simple interest would pay every year. $110.25 is the year after: 5% of $2,205. And $205.00 is the interest of both years together.
skills: [simple-vs-compound]
