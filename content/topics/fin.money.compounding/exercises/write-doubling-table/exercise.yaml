id: write-doubling-table
stage: write
rev: 1
title: "How good is the rule of 72?"
prompt: |
  Write two functions, each taking a yearly rate as a decimal (`0.06` for 6%):

  - `rule_of_72(rate)` returns the rule of 72's estimate of the years to double: 72 divided by the rate **in percent**.
  - `doubling_time(rate)` returns the exact years to double, `math.log(2) / math.log(1 + rate)`.

  Then, for each rate in `rates`, print the rate as a whole percent and both answers to one decimal place:

  ```
  2%: rule 36.0, exact 35.0
  6%: rule 12.0, exact 11.9
  10%: rule 7.2, exact 7.3
  24%: rule 3.0, exact 3.2
  ```

  Keep the two starting lines: the checks call your functions with other rates, and run your program with another list.
hints:
  - "The rate is a decimal, and the rule wants a percent: `rate * 100` turns `0.06` into `6`."
  - "The exact time solves `(1 + rate) ** n == 2` for `n`; a logarithm undoes the power, which is where `math.log(2) / math.log(1 + rate)` comes from."
  - "To print `6%`, format the percent with no decimals: `f\"{rate * 100:.0f}%\"`."
skills: [doubling]
