id: fill-growth-table
stage: fill_in
rev: 1
title: "A growth table"
prompt: |
  $3,000 is saved at 5% a year, compounded once a year, for 4 years. Replace each `...` so the program prints a row for every year, from the starting balance in year 0 to the end of year 4, with commas between thousands and two decimals:

  ```
  Year 0: 3,000.00
  Year 1: 3,150.00
  Year 2: 3,307.50
  Year 3: 3,472.88
  Year 4: 3,646.52
  ```

  All three blanks stand where a value or a format goes, so Python starts the program, prints the first row, then stops at the first blank it reaches with an error (a `TypeError` that mentions `ellipsis` for the first two, a `ValueError` about the format for the third). Keep the three starting lines: the checks run your program with other savings, rates and years.
hints:
  - "`range(1, stop)` stops just before `stop`. To count years 1 to `years`, what must `stop` be?"
  - "Growing by `rate` means multiplying the whole balance by one plus the rate. The rate is already a decimal, so don't divide it by 100."
  - "The format after the colon is the one in the year-0 line: a comma, then two decimal places."
skills: [grow-by-loop]
