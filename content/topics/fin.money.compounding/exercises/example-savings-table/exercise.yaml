id: example-savings-table
stage: worked_example
rev: 1
title: "$1,000 at 7%, three ways"
prompt: |
  This program grows $1,000 at 7% a year: first year by year in a loop, then in one line with the formula, then it asks how long the money takes to double. Press **Run**, then read how each part works.
steps:
  - label: "The rate is a decimal"
    lines: "3-4"
    note: "7% a year is `0.07` in code, the convention for this whole module. Growing by 7% is multiplying by `1 + rate`, which is `1.07`."
  - label: "Year 0 is the starting balance"
    lines: "5"
    note: "The table starts with what you put in, before any interest, so five years of growth make six rows. `,.2f` prints commas between thousands and two decimals: `1,000.00`."
  - label: "One year of compound interest"
    lines: "6-8"
    note: "Each pass multiplies the whole balance, earlier interest included, by `1.07`. That's what makes it compound: year 2's interest is 7% of $1,070, not of $1,000. The balance stays an unrounded float; only the `print` rounds it to the cent."
  - label: "The formula agrees"
    lines: "10-11"
    note: "Five passes of `* 1.07` are `1.07 ** 5`, so `1000 * (1 + rate) ** 5` is the same $1,402.55 in one line. The loop is how you check the formula; the formula is how you skip the loop."
  - label: "How long to double"
    lines: "12-13"
    note: "The rule of 72 divides 72 by the rate in percent: 72 / 7 is about 10.3 years. The exact answer solves `1.07 ** n == 2` with logarithms: `log(2) / log(1.07)`, 10.2 years. The rule is close for rates between about 4% and 12%."
