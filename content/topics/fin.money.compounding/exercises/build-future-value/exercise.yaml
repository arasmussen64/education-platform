id: build-future-value
stage: build
rev: 1
title: "Future value"
prompt: |
  Write a function `future_value(present, rate, periods)` that returns what an amount `present` grows to after `periods` periods at `rate` per period, a decimal (`0.035` for 3.5%), compounded once a period. Return the unrounded number.

  Then, using the three starting lines, print a table of the balance for $1,500 at 3.5% a year, from year 0 (the starting amount) to year 4, with commas between thousands and two decimals:

  ```
  Year 0: 1,500.00
  Year 1: 1,552.50
  Year 2: 1,606.84
  Year 3: 1,663.08
  Year 4: 1,721.28
  ```

  Keep the three starting lines: the checks call your function with other amounts, rates and periods, and run your program with other starting values. Later topics in this module use `future_value` by this name.
skills: [grow-by-formula, grow-by-loop]
