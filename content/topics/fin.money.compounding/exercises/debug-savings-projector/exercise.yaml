id: debug-savings-projector
stage: debug
rev: 1
title: "A savings projector"
prompt: |
  A friend wrote this projector for $2,400 saved at 4% a year, compounded once a year, for 5 years. It should print the balance in year 0 (the deposit) and at the end of each year after it:

  ```
  Year 0: 2,400.00
  Year 1: 2,496.00
  Year 2: 2,595.84
  Year 3: 2,699.67
  Year 4: 2,807.66
  Year 5: 2,919.97
  ```

  Instead it prints five rows, not six, and the money in its last row is well short of $2,919.97. It has two bugs. Run it, compare each row with the table above, fix what you find, and run it again. Keep the three starting lines: the checks also run it with other numbers.
hints:
  - "Fix one thing at a time and run it after each change."
skills: [grow-by-loop, simple-vs-compound]
