- term: principal
  definition: "The original amount saved or borrowed, before any interest. Simple interest is worked out on the principal alone."
- term: simple interest
  definition: "Interest paid on the principal only: the same amount every period, so the balance grows in a straight line."
- term: compound interest
  aliases: [compounding]
  definition: "Interest added to the balance each period, so the next period's interest is paid on earlier interest too. The balance is multiplied by `1 + rate` each period."
- term: future value
  definition: "What an amount grows to after some periods at a rate: `present * (1 + rate) ** periods` when interest compounds once a period."
- term: rule of 72
  definition: "A quick estimate of the years money takes to double: 72 divided by the yearly rate in percent. At 6%, about 12 years. Close for rates of about 4% to 12%."
- term: doubling time
  definition: "How long a steadily growing amount takes to double. Exactly `math.log(2) / math.log(1 + rate)` periods."
