id: debug-cinema
stage: debug
rev: 1
title: "Cinema tickets"
prompt: |
  This program sells cinema tickets. Children pay half the adult price. Typing `2` adult tickets, `3` child tickets and an adult price of `12.5` should print:

  ```
  Tickets: 5
  Total: $43.75
  ```

  It has three bugs. Run it, fix what you find, and run it again. Check every line of the output, not just whether it runs.
test_skills:
  test_counts_tickets: [py.strings-and-input/convert, py.values-and-types/plus-by-type]
  test_children_pay_half: [py.arithmetic/precedence]
  test_total_line: [py.programs-and-print/print-commas, py.strings-and-input/fstrings]
