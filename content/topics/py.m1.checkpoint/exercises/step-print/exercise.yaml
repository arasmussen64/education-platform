id: step-print
stage: fill_in
rev: 1
title: "Print the receipt"
prompt: |
  Now only the last part is missing. Replace each `...` so the program prints the receipt with every amount to two decimal places. Typing `18`, `4` and `20` should print:

  ```
  Subtotal: $22.00
  Tip (20%): $4.40
  Total: $26.40
  ```
hints:
  - 'Use an f-string for each line, with a name in curly braces where its value goes.'
  - '`:.2f` inside the braces shows two decimal places, like `{total:.2f}`.'
  - 'The `$` is ordinary text, so it goes right before the braces.'
