title: "Work out the numbers"
prompt: |
  Now the first and last parts are done, and the middle is missing. Replace each `...` to work out the subtotal, the tip and the total. Typing `18`, `4` and `20` should print:

  ```
  Subtotal: $22.00
  Tip (20%): $4.40
  Total: $26.40
  ```
hints:
  - 'The subtotal adds the meal and the drinks.'
  - 'A percentage of something is `something * percent / 100`. Here, the something is the subtotal.'
  - 'The total adds the tip to the subtotal.'
