id: example-shop-receipt
stage: worked_example
rev: 1
title: "A shop receipt"
prompt: |
  This program is like the checkpoint's build, in a different story: a shop receipt with a discount. Press **Run** and type a price, how many, and a discount (try `2.5`, `4` and `10`), then read how it's built.

  It's planned in three parts: read the inputs, work out the numbers, print the receipt. Most programs you'll write have this shape.
steps:
  - label: "Plan with comments"
    lines: "1"
    note: "A line starting with `#` is a **comment**: Python skips it. The comments on lines 1, 6 and 11 name the three parts before any code is written. That turns one big problem into three small ones."
  - label: "Read the inputs"
    lines: "2-4"
    note: "Ask for everything first, converting as you go: `float()` for amounts that may have decimals, `int()` for whole numbers like a count or a percentage. From here on, every name refers to a number."
  - label: "Work out the numbers"
    lines: "7-9"
    note: "One calculation per line, each with a name that says what it is. A percentage of something is `something * percent / 100`. Each line uses the names made above it."
  - label: "Print the receipt"
    lines: "12-14"
    note: "Only now does anything get printed. Each f-string puts values into the text. `:.2f` shows two decimal places, and `{discount_percent}` shows a whole number because it's an `int`."
