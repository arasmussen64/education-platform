id: build-electricity
stage: build
rev: 1
title: "Electricity bill"
prompt: |
  Starting from a blank editor, write a program for an electricity bill. It asks how many kWh (units of energy) were used and the price of one kWh (both may have decimals), then the tax percentage (a whole number). The energy costs the units times the price, and the tax is that percentage of the energy cost. Every amount has two decimal places. Typing `350`, `0.24` and `5` should print:

  ```
  Energy: $84.00
  Tax (5%): $4.20
  Total: $88.20
  ```

  The questions it asks can say anything you like.
test_skills:
  test_energy: [py.strings-and-input/input-text, py.strings-and-input/convert]
  test_tax: [py.arithmetic/precedence, py.arithmetic/operators]
  test_total: [py.arithmetic/operators]
  test_tax_percent: [py.strings-and-input/convert]
  test_two_decimals: [py.strings-and-input/fstrings]
  test_layout: [py.programs-and-print/print-text, py.programs-and-print/print-commas]
