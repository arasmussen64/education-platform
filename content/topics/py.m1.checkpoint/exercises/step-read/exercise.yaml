id: step-read
stage: fill_in
rev: 1
title: "Read the inputs"
prompt: |
  Here's the checkpoint's receipt program with its first part missing. Replace each `...` so it asks for the meal and drink prices (both may have decimals) and the tip percentage (a whole number). Typing `18`, `4` and `20` should print:

  ```
  Subtotal: $22.00
  Tip (20%): $4.40
  Total: $26.40
  ```
hints:
  - 'Each `...` gets one value from the user: `input()` asks, and a conversion turns the answer into a number.'
  - 'Prices may have decimals, so they need `float(input(...))`. The tip percentage is a whole number: `int(input(...))`.'
