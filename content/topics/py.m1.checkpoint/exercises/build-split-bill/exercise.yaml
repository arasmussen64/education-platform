id: build-split-bill
stage: build
rev: 1
title: "Splitting the bill"
prompt: |
  Starting from a blank editor, write a program that splits a restaurant bill. It asks for the bill (which may have decimals), how many people are paying, and the tip percentage (both whole numbers). The tip is that percentage of the bill, and everyone pays an equal share of the bill and tip together. Every amount has two decimal places. Typing `60`, `3` and `15` should print:

  ```
  Bill: $60.00
  Tip (15%): $9.00
  Each of 3 pays: $23.00
  ```

  The questions it asks can say anything you like.
test_skills:
  test_bill: [py.strings-and-input/input-text, py.strings-and-input/convert]
  test_tip: [py.arithmetic/precedence, py.arithmetic/operators]
  test_each_pays: [py.arithmetic/precedence, py.arithmetic/operators]
  test_whole_numbers: [py.strings-and-input/convert]
  test_two_decimals: [py.strings-and-input/fstrings]
  test_layout: [py.programs-and-print/print-text, py.programs-and-print/print-commas]
