id: build-receipt
stage: build
rev: 1
title: "Receipt calculator"
prompt: |
  Starting from a blank editor, write a program for a restaurant receipt. It asks for the price of the meal and of the drinks (both may have decimals), then the tip percentage (a whole number). The tip is that percentage of the subtotal. Every amount has two decimal places. Typing `18`, `4` and `20` should print:

  ```
  Subtotal: $22.00
  Tip (20%): $4.40
  Total: $26.40
  ```

  The questions it asks can say anything you like.
test_skills:
  test_subtotal: [py.strings-and-input/input-text, py.strings-and-input/convert]
  test_tip: [py.arithmetic/precedence, py.arithmetic/operators]
  test_total: [py.arithmetic/operators]
  test_tip_percent: [py.strings-and-input/convert]
  test_two_decimals: [py.strings-and-input/fstrings]
  test_layout: [py.programs-and-print/print-text, py.programs-and-print/print-commas]
