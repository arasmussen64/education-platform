id: parsons-an-evens-generator
type: parsons
rev: 1
prompt: |
  Put the lines in order to define a generator of even numbers below a limit, and print `[0, 2, 4, 6]`. One line is a decoy that doesn't belong.
lines:
  - 'def evens(limit):'
  - '    n = 0'
  - '    while n < limit:'
  - '        yield n'
  - '        n = n + 2'
  - 'print(list(evens(7)))'
distractors:
  - '        return n'
explanation: |
  `yield` hands out one value and pauses, so the loop can continue to the next even number on the next `next()`. With `return n` in place of `yield n`, `evens` wouldn't be a generator at all: it would hand back the number 0, and `list()` would fail, because a number can't be looped over. `list()` pulls every value through until the `while` ends.
skills: [generators]
