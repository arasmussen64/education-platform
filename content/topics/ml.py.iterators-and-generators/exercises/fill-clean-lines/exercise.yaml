id: fill-clean-lines
stage: fill_in
rev: 1
title: "Clean lines"
prompt: |
  A generator that yields the lines of some text, stripped of spaces, skipping blank ones. Replace each `...` so the program prints:

  ```
  ['alpha', 'beta', 'gamma']
  ```

  Until the `...` on line 8 is replaced, Python can't run the program at all, and shows a syntax error. The one on line 7 is different: left as it is, the program runs with no error, but `if ...:` counts as true every time, so the blank lines get through.
hints:
  - "Strip each line first, then test it: an empty string is false, so `if stripped:` skips blanks."
  - "A generator hands a value out with `yield`, not `return`."
skills: [generators]
