id: debug-generator-mistakes
stage: debug
rev: 2
title: "Four squares"
prompt: |
  This program should print the squares of 1 to 4, then their total and their largest:

  ```
  [1, 4, 9, 16]
  30
  16
  ```

  Instead it stops with `TypeError: 'int' object is not iterable`. It has two bugs, and the second shows only once the first is fixed. Run it, fix what you find, and run it again.
hints:
  - "The error says `values` is a plain number. Print `squares(4)` on its own: is it one value, or something you can loop over?"
  - "`return` ends the function with one value, the first time round the loop. A generator hands out its values one at a time with `yield` and carries on."
  - "Once the list prints, the total comes out as 0 and `max` stops with `ValueError: max() iterable argument is empty`. What's left in `values` after `list(values)` has read it?"
  - "A generator can be walked through only once. Turn it into a list once, `values = list(squares(4))`, and use that list three times."
skills: [generators, single-use]
