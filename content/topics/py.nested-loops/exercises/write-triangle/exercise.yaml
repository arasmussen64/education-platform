id: write-triangle
stage: write
rev: 1
title: "A triangle"
prompt: |
  Write a program that asks for a height and prints a triangle of stars: the first row has one star, the second two, and so on. Typing `3` should print:

  ```
  *
  **
  ***
  ```
hints:
  - "The outer loop counts the rows: `for row in range(1, n + 1):`."
  - "Row number `row` has `row` stars, so the inner loop is `for _ in range(row):`. The inner range depends on the outer variable."
  - "Print each star with `end=\"\"`, and end each row with a bare `print()`."
skills: [grids, end-param]
