id: example-grid
stage: worked_example
rev: 1
title: "A grid of bricks"
prompt: |
  This program prints a grid three rows tall and four bricks wide. Press **Run**. Then indent line 4 one more level, so it's inside the inner loop, and run again. Then put it back and remove its indentation entirely.
steps:
  - label: "The outer loop: one pass per row"
    lines: "1"
    note: "Three passes, so three rows. Everything indented under it happens three times."
  - label: "The inner loop: one pass per brick"
    lines: "2-3"
    note: "Four passes per row. `end=\"\"` means print the brick and nothing after it, so the four bricks share a line. Over the whole program, this line runs 3 × 4 = 12 times."
  - label: "Ending the row"
    lines: "4"
    note: "A bare `print()` prints just the line break. It's indented once, so it belongs to the outer loop and runs after each row's inner loop has finished: three times."
  - label: "After both loops"
    lines: "5"
    note: "Not indented, so it runs once, when all the rows are done."
