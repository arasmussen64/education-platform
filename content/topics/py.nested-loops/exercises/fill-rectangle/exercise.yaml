title: "A rectangle"
prompt: |
  This program should ask for a width and a height and print a rectangle of stars. Replace each `...`: how many times each loop runs, and the line that ends a row. Typing `4` and `2` should print:

  ```
  ****
  ****
  ```
hints:
  - "The outer loop runs once per row, so it runs `height` times. The inner loop prints the stars in a row: `width` times."
  - "After the inner loop, a bare `print()` ends the row. It's indented once, inside the outer loop only."
skills: [grids, end-param]
