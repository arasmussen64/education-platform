title: "A times table"
prompt: |
  This program asks for a size and prints a multiplication table: row 2, column 3 holds 2 × 3. The numbers in a row are separated by spaces (a space at the end of a row is fine). Typing `3` should print:

  ```
  1 2 3
  2 4 6
  3 6 9
  ```

  It has three bugs. Run it with `3` and compare the output with the example line by line: how many rows, what's in them, and how they're broken up.
skills: [grids, end-param, inner-outer]
