id: debug-table
stage: debug
rev: 2
title: "A times table"
prompt: |
  This program asks for a size and prints a multiplication table: row 2, column 3 holds 2 × 3. The numbers in a row are separated by spaces (a space at the end of a row is fine). Typing `3` should print:

  ```
  1 2 3
  2 4 6
  3 6 9
  ```

  Right now, typing `3` prints a column of six numbers. It has three bugs. Run it with `3`, compare the output with the example line by line, fix what you find, and run it again.
hints:
  - "Fix one thing at a time and run it after each change: the output changes shape as you go, and each run shows you the next problem."
  - "Trace the first pass of the outer loop. Where does each line break come from? A bare `print()` ends a row, so it belongs after the inner loop, inside the outer loop only."
  - "Row 2, column 3 holds 2 × 3, so each number is the row times the column. Which names does the multiplication use?"
  - "`range` stops before its stop value, so `range(1, n)` gives one row too few. A table of size `n` needs `range(1, n + 1)` in both loops."
skills: [grids, end-param, inner-outer]
