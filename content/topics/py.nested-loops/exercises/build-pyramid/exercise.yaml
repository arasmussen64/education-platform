id: build-pyramid
stage: build
rev: 1
title: "A pyramid"
prompt: |
  Starting from a blank editor, write a program that asks for a height and prints a right-aligned pyramid of `#`: the first row has one `#` at the right, the last row is full width. Typing `3` should print:

  ```
    #
   ##
  ###
  ```

  Each row is `height` characters wide: spaces first, then the `#`s. The last row has no spaces.
skills: [grids, end-param, inner-outer]
