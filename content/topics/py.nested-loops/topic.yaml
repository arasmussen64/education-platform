prove:
  build: build-pyramid
  debug: debug-table
  explain:
    prompt: |
      Explain this program to a friend who has only used one loop at a time:

      ```python
      for row in range(3):
          for col in range(2):
              print(row, col)
          print()
      ```

      In your own words: how many times does the inner `print` run and in what order do the pairs come out, which of the two variables changes fastest and why, and what does the last line do and why is it indented the way it is?
    rubric:
      - id: count-order
        required: true
        description: "Six lines: 0 0, 0 1, 1 0, 1 1, 2 0, 2 1."
      - id: inner-fastest
        required: true
        description: "col changes fastest, because the inner loop runs all the way through (both values) on every single pass of the outer loop."
      - id: blank-line
        required: true
        description: "print() with nothing in the brackets prints an empty line, once per outer pass, because it's inside the outer loop but after (not inside) the inner one."
      - id: indentation
        required: false
        description: "The indentation decides which loop a line belongs to."
    model_answer: |
      The outer loop gives row the values 0, 1 and 2. For each of those, the inner loop runs completely, giving col the values 0 and 1, so the inner print runs 2 times per outer pass, 6 times in all, and the pairs come out as 0 0, 0 1, then 1 0, 1 1, then 2 0, 2 1. col changes fastest because the whole inner loop happens before row moves on. The last line, print() with nothing in the brackets, prints an empty line. It's indented once, so it belongs to the outer loop but not the inner one: it runs after each row's two pairs, three times in all. Indented twice, it would run after every pair; not indented, it would run once at the end.
review_pool:
  - review-predict-nested
  - review-mcq-print-blank
  - review-code-rectangle
  - mcq-how-many
# What this topic teaches. Each question names the skills it tests, so a
