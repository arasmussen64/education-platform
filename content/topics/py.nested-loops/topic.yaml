id: py.nested-loops
kind: topic
status: ready
title: "Nested loops"
summary: "Put loops inside loops for grids and patterns."
prerequisites: [py.accumulator-patterns]
estimated_minutes: 40
rev: 1
objectives:
  - "Trace a loop inside a loop: the inner loop runs all the way through on every pass of the outer loop."
  - "Print several things on one line with `end=\"\"`, and end the line with a bare `print()`."
  - "Draw grids and patterns, rows and columns, using the loop variables to decide what goes where."
