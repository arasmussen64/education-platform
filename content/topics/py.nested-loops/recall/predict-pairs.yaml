id: predict-pairs
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: eight lines.
code: |
  for row in range(2):
      for col in range(3):
          print(row, col)
      print("--")
expected_output: |
  0 0
  0 1
  0 2
  --
  1 0
  1 1
  1 2
  --
explanation: |
  While `row` is 0, the inner loop gives `col` the values 0, 1 and 2, then the `--` line prints because it's inside the outer loop but after the inner one. Then `row` becomes 1 and the whole inner loop runs again. The inner variable changes fastest.
skills: [inner-outer]
