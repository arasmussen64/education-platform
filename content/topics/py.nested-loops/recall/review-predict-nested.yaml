id: review-predict-nested
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: three lines. The inner range depends on the outer variable.
code: |
  total = 0
  for i in range(1, 4):
      for j in range(i):
          total += 1
      print(i, total)
expected_output: |
  1 1
  2 3
  3 6
explanation: |
  When `i` is 1, the inner loop runs once, so `total` becomes 1. When `i` is 2 it runs twice more (3), and when `i` is 3, three times more (6). The print is inside the outer loop but after the inner one, so it runs once per value of `i`.
skills: [inner-outer, grids]
