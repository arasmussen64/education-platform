id: review-mcq-print-blank
type: mcq
rev: 1
prompt: |
  This program prints two rows of `###`:

  ```python
  for row in range(2):
      for col in range(3):
          print("#", end="")
      print()
  ```

  What would change if the last line were indented one more level, inside the inner loop?
choices:
  - 'Nothing: it would still print two rows of `###`'
  - 'Every `#` would be on its own line: six lines of one `#`'
  - 'The whole grid would print on one line'
  - 'Python would raise an `IndentationError`'
answer: 1
explanation: |
  The bare `print()` ends a line. Inside the inner loop it would run after every single `#`, so each one would be on its own line. Where it is now, once per outer pass, it ends each row. With no indentation at all, it would run once at the very end and the grid would be one line of six `#`.
skills: [end-param, grids]
