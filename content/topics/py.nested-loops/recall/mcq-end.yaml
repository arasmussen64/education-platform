id: mcq-end
type: mcq
rev: 1
prompt: |
  What does `print("#", end="")` do?
choices:
  - 'Prints `#` and then an empty line'
  - 'Prints nothing: the empty string replaces the `#`'
  - 'Prints `#` and stays on the same line, so the next print carries on after it'
  - 'Raises an error: `end` isn''t a Python word'
answer: 2
explanation: |
  Normally `print` finishes by printing a line break. `end=""` replaces that line break with nothing, so the output stays on the same line. To finish the line later, call `print()` with nothing in the brackets: it prints just the line break.
skills: [end-param]
