id: parsons-star-grid
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints two lines of three stars:

  ```
  ***
  ***
  ```
  Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'for row in range(2):'
  - '    for col in range(3):'
  - '        print("*", end="")'
  - '    print()'
distractors:
  - '        print("*")'
explanation: |
  The outer loop runs twice; inside it, the inner loop prints three stars on one line, because `end=""` stops `print` from starting a new line. The `print()` with four spaces belongs to the outer loop and runs once per row, ending the line. Without `end=""` each star would be on its own line.
skills: [inner-outer, end-param]
