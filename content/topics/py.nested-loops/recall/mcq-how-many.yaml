id: mcq-how-many
type: mcq
rev: 1
prompt: |
  How many lines does this program print?

  ```python
  for i in range(3):
      for j in range(4):
          print("x")
  ```
choices:
  - '7'
  - '12'
  - '3'
  - '4'
answer: 1
explanation: |
  The inner loop runs all the way through, 4 times, on each of the outer loop's 3 passes: 3 × 4 = 12 lines. Adding the two counts (7) is the common mistake; nested loops multiply.
skills: [inner-outer]
