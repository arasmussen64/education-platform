  - write-celsius
prove:
  build: build-pizza-party
  debug: debug-split-bill
  explain:
    prompt: |
      17 cookies are shared between 5 kids. A friend tries three lines:

      ```python
      print(17 / 5)
      print(17 // 5)
      print(17 % 5)
      ```

      In your own words: what does each line give, and which ones answer "how many cookies does each kid get, and how many are left over?"
    rubric:
      - id: divide
        required: true
        description: "17 / 5 is ordinary division and gives a float, 3.4."
      - id: floor
        required: true
        description: "17 // 5 gives the whole number of times 5 fits into 17, 3: each kid gets 3."
      - id: remainder
        required: true
        description: "17 % 5 gives what's left over, 2."
      - id: together
        required: false
        description: "Checks the answer: 3 each for 5 kids is 15, plus 2 left over makes 17."
    model_answer: |
      17 / 5 is ordinary division: 3.4, a float. Nobody can hand out 0.4 of a cookie, so for this question // is the better tool: 17 // 5 is 3, the number of whole times 5 fits into 17, so each kid gets 3 cookies. 17 % 5 is the remainder, 2: the cookies left after giving out 15. Together they answer the question: 3 each for 5 kids is 15, plus 2 left over makes 17.
review_pool:
  - review-predict-ops
  - review-mcq-precedence
  - review-time-split
# What this topic teaches. Each question names the skills it tests, so a
# missed question can come back as a different one on the same skill
# (ADR-0011).
skills:
