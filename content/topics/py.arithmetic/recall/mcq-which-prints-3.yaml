id: mcq-which-prints-3
type: mcq
rev: 1
prompt: |
  Which line prints `3`?
choices:
  - '`print(7 / 2)`'
  - '`print(7 % 2)`'
  - '`print(7 // 2)`'
  - '`print(7 ** 2)`'
answer: 2
explanation: |
  `7 // 2` is the whole number of times 2 fits into 7: `3`. The others give `3.5` (ordinary division, always a float), `1` (the remainder: 7 is 3 twos plus 1) and `49` (7 squared).
skills: [operators]
