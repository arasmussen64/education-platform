id: review-predict-ops
type: predict_output
rev: 1
prompt: |
  What will this program print?
code: |
  print(17 // 5)
  print(17 % 5)
  print(2 ** 4)
expected_output: |
  3
  2
  16
explanation: |
  5 fits into 17 three whole times (`17 // 5` is `3`), with `2` left over (`17 % 5`). `2 ** 4` is 2 × 2 × 2 × 2, which is `16`.
skills: [operators, div-mod]
