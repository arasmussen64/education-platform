id: parsons-hours-and-minutes
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `2 h 15 min`. One line is a decoy that doesn't belong.
lines:
  - 'total = 135'
  - 'hours = total // 60'
  - 'total = total - hours * 60'
  - 'print(hours, "h", total, "min")'
distractors:
  - 'hours = total / 60'
explanation: |
  `//` divides and drops the remainder, so 135 // 60 is 2 whole hours. Taking those hours off `total` leaves 15, and only then does the print show both. `/` would give 2.25, not whole hours.
skills: [div-mod, operators]
