id: mcq-divide-gives-float
type: mcq
rev: 1
prompt: |
  What does this line show?

  ```python
  print(6 / 3)
  ```
choices:
  - '`2`'
  - '`2.0`'
  - '`0.5`'
  - '`6 / 3`'
answer: 1
explanation: |
  `/` always gives a `float`, even when the numbers divide exactly, so the answer is `2.0`. To get the `int` `2`, use `6 // 3`. (And it isn't `6 / 3`: there are no quotes, so this is a calculation, not text.)
skills: [operators]
