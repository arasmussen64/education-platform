id: predict-precedence
type: predict_output
rev: 1
prompt: |
  What will this program print? Watch the order of the operations.
code: |
  print(2 + 3 * 4)
  print((2 + 3) * 4)
  print(10 - 4 / 2)
expected_output: |
  14
  20
  8.0
explanation: |
  Multiplication comes before addition, so `2 + 3 * 4` is `2 + 12`. Parentheses go first of all, so `(2 + 3) * 4` is `5 * 4`. In the last line, `4 / 2` happens first and gives the float `2.0`, so the answer is `8.0`, not `8`.
skills: [precedence]
