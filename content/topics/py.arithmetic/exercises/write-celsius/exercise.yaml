id: write-celsius
stage: write
rev: 1
title: "Celsius to Fahrenheit"
prompt: |
  The program starts with `celsius = 25`. Convert it to Fahrenheit with this formula, then print the result:

  > Fahrenheit = Celsius × 9 ÷ 5 + 32

  It should print `77.0`.
hints:
  - "In Python, × is `*` and ÷ is `/`."
  - "Multiplication and division happen before addition, so `celsius * 9 / 5 + 32` already works in the right order."
  - "Store the result under a name like `fahrenheit`, then print it."
skills: [precedence]
