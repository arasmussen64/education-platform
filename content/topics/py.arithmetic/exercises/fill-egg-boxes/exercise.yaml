id: fill-egg-boxes
stage: fill_in
rev: 1
title: "Egg boxes"
prompt: |
  14 eggs go into boxes of 6. Replace each `...` with an **operator**, so the program prints how many boxes are full and how many eggs are left over:

  ```
  2 full boxes and 2 spare eggs
  ```

  Until every `...` is replaced, Python can't run the program at all, and shows a syntax error.
hints:
  - "Which operator gives the number of whole times 6 fits into 14?"
  - "Which operator gives what's left over after dividing?"
skills: [div-mod]
