id: example-minutes-seconds
stage: worked_example
rev: 1
title: "Minutes and seconds"
prompt: |
  This program turns 135 seconds into minutes and seconds. Press **Run**, then read how each part works.
steps:
  - label: "Ordinary division gives a float"
    lines: "1-2"
    note: "`135 / 60` is `2.25` minutes. Division with `/` always gives a float, and it's exact, but 2.25 minutes isn't how people say times."
  - label: "Whole minutes"
    lines: "3"
    note: "`//` gives the whole number of times 60 fits into 135: `2`."
  - label: "What's left over"
    lines: "4"
    note: "`%` gives the remainder: 135 is 2 × 60 = 120, plus `15` left over."
  - label: "Print the pieces"
    lines: "5"
    note: "Commas print the pieces on one line, with spaces between them."
