id: build-pizza-party
stage: build
rev: 1
title: "Pizza party"
prompt: |
  Starting from a blank editor, write a program for a pizza party. Start with `slices = 23`, `people = 4` and `cost = 30`, one line each. Then print how many slices each person gets, how many are left over, and what each person pays:

  ```
  Slices each: 5
  Left over: 3
  Cost each: 7.5
  ```
skills: [div-mod, operators]
