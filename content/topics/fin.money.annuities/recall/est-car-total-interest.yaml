id: est-car-total-interest
type: estimate
rev: 1
prompt: |
  A $20,000 car loan is repaid in 48 monthly payments of $469.70. How much interest is paid over the whole loan? Within 2%.
unit: dollars
answer: 2545.6
tolerance: { percent: 2 }
given: { principal: 20000, months: 48, monthly: 469.70 }
working: monthly * months - principal
mistakes:
  - id: all-payments
    value: 22545.6
    working: monthly * months
    why: "That's everything paid. The interest is what's paid beyond the $20,000 borrowed."
  - id: one-payment
    value: 53.03
    working: monthly - principal / months
    why: "That's the interest in an average payment. Over the whole loan there are 48 of them."
explanation: |
  48 × $469.70 = $22,545.60 paid in all, so $2,545.60 of it is interest. A loan's total interest is always its payments added up minus what was borrowed.
skills: [amortization, payment]
amounts: made-up
