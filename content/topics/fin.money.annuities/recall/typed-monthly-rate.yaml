id: typed-monthly-rate
type: typed
rev: 1
prompt: |
  A loan charges 6% a year, with interest charged monthly. Type the monthly rate, as a decimal, that the payment formula uses.
kind: text
answers:
  - "0.005"
  - ".005"
mistakes:
  - id: yearly
    answers: ["0.06"]
    why: "That's the yearly rate. Interest charged monthly uses a twelfth of it each month: 0.06 / 12."
  - id: percent
    answers: ["0.5"]
    why: "That's the monthly rate in percent, 0.5%. As a decimal it's 0.005."
explanation: |
  A loan quoted at 6% a year with monthly payments charges 0.06 / 12 = 0.005, half a percent, each month, and the number of periods is the number of months. Using the yearly rate every month would charge twelve times the interest.
skills: [payment]
