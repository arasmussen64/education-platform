id: mcq-early-interest
type: mcq
rev: 1
prompt: |
  On a 30-year mortgage, about five sixths of the first monthly payment is interest, and only a sixth pays the loan down. Why?
choices:
  - 'The law makes lenders take all their interest in the first years of a loan'
  - 'Interest is charged on what is still owed, and early on that is nearly all'
  - "The payment formula loads the interest early to protect the lender's profit"
  - 'Early payments also cover the costs of setting up the loan, as interest'
answer: 1
explanation: |
  Each month the lender charges a month's interest on the balance, and the rest of the payment pays the loan down. At the start the balance is the whole loan, so the interest is at its largest: on $300,000 at 0.5% a month it's $1,500 of a $1,798.65 payment. As the balance falls, so does the interest, and more of the same payment goes to the loan. Nothing in the formula or the law front-loads it; the split is simply interest on what's owed. Setting-up costs are fees, charged separately.
skills: [amortization]
