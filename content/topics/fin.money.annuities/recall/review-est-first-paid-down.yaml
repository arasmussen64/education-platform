id: review-est-first-paid-down
type: estimate
rev: 1
prompt: |
  A $200,000 mortgage at 4.8% a year, charged monthly, has a monthly payment of $1,049.33. How much of the first payment pays the loan down? Within 1%.
unit: dollars
answer: 249.33
tolerance: { percent: 1 }
given: { principal: 200000, rate: 4.8, monthly: 1049.33 }
working: monthly - principal * rate / 100 / 12
mistakes:
  - id: the-interest
    value: 800
    working: principal * rate / 100 / 12
    why: "That's the part that pays interest: 0.4% of $200,000. The rest of the payment pays the loan down."
  - id: equal-shares
    value: 555.56
    working: principal / 360
    why: "That would be the loan split evenly over 360 months. Early on, interest takes most of each payment."
explanation: |
  The first month's interest is 200,000 × 0.048 / 12 = $800, so $1,049.33 − $800 = $249.33 pays the loan down, under a quarter of the payment. Thirty years later the last payment is almost all loan.
skills: [amortization]
amounts: made-up
