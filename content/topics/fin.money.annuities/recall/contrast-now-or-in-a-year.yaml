id: contrast-now-or-in-a-year
type: mcq
rev: 1
prompt: |
  Money earns 10% a year. Plan A pays you $1,000 today, in one year and in two years. Plan B pays $1,000 in one, two and three years, the way loan payments come. Which plan is worth more today, and by how much?
choices:
  - 'They are worth the same today, since both are three payments of $1,000'
  - "Plan B, by 10%, because its payments run a year longer than Plan A's"
  - 'Plan A, by exactly 10%, because each payment arrives a year earlier'
  - "Plan A, by $1,000, the payment today that Plan B doesn't make"
answer: 2
explanation: |
  Plan A is worth 1,000 + 1,000 / 1.1 + 1,000 / 1.21 = $2,735.54 today; Plan B is worth 1,000 / 1.1 + 1,000 / 1.21 + 1,000 / 1.331 = $2,486.85. Every payment of Plan A comes one year sooner, so each is worth 1.1 times its Plan B twin, and the whole plan is worth exactly 10% more: 2,486.85 × 1.1 = 2,735.54. The gap isn't $1,000, because Plan B's extra third payment is worth $751.31 today. Loan payments and this topic's formulas are Plan B's kind, with the first payment one period away; the lists in *Present and future value* start today.
skills: [annuity-value]
