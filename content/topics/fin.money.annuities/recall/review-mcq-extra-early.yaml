id: review-mcq-extra-early
type: mcq
rev: 1
prompt: |
  On a 30-year mortgage, you add $100 to each payment for the first year only, then go back to the normal payment. What does the extra $1,200 do?
choices:
  - 'Nothing until the last year, when the loan then ends a few days early'
  - 'It lowers the balance, so every later month charges a little less interest'
  - 'It all goes to interest first, so on a long loan it saves almost nothing'
  - 'It lowers the monthly payment for the rest of the loan, by about $100'
answer: 1
explanation: |
  Extra money goes straight to the balance, and every later month's interest is charged on that smaller balance. With the payment unchanged, more of each payment then goes to the loan, so the loan ends early, and the interest saved is far more than the $1,200 put in, because each dollar removed early would otherwise have been charged interest for decades. On a $300,000 loan at 6%, the loan ends three months early and about $5,700 less is paid in all, the extra $1,200 included. It doesn't lower the payment, which was fixed when the loan began, unless the lender recalculates it, and the interest for a month is only ever the interest on that month's balance.
skills: [amortization]
