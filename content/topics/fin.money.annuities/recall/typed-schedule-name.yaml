id: typed-schedule-name
type: typed
rev: 1
prompt: |
  A table lists each payment of a loan, how much of it was interest and how much paid the loan down, and the balance left after it. What is that table called? Two words.
kind: text
answers:
  - "amortization schedule"
  - "amortization table"
  - "amortisation schedule"
explanation: |
  An amortization schedule shows a loan being paid off, one row per payment: the interest on what was owed, the rest of the payment paying the loan down, and the balance after it. Its last balance is zero.
skills: [amortization]
