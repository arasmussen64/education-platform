id: est-first-month-interest
type: estimate
rev: 1
prompt: |
  A $250,000 mortgage charges 5.4% a year, with interest charged monthly. How much of the first monthly payment is interest? Exactly.
unit: dollars
answer: 1125
tolerance: { absolute: 0 }
given: { principal: 250000, rate: 5.4 }
working: principal * rate / 100 / 12
mistakes:
  - id: yearly
    value: 13500
    working: principal * rate / 100
    why: "That's a whole year's interest on $250,000. A monthly payment carries a month's: divide by 12."
  - id: percent-as-decimal
    value: 112500
    working: principal * rate / 12
    why: "That uses 5.4 as if it were a decimal. 5.4% is 0.054."
explanation: |
  The monthly rate is 0.054 / 12 = 0.0045, and the first month's interest is charged on the whole loan: 250,000 × 0.0045 = $1,125.00. Whatever the payment is, the rest of it pays the loan down.
skills: [amortization]
amounts: made-up
