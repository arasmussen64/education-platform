id: parsons-annuity-value
type: parsons
rev: 1
prompt: |
  Three payments of $100 come at the ends of the next three years, and money earns 5% a year. Put the lines in order so the function adds up what they're worth today, and the program prints:

  ```
  272.32
  ```

  Two lines are decoys that don't belong.
lines:
  - 'def annuity_value(payment, rate, periods):'
  - '    total = 0'
  - '    for t in range(1, periods + 1):'
  - '        total = total + payment / (1 + rate) ** t'
  - '    return total'
  - 'print(f"{annuity_value(100, 0.05, 3):,.2f}")'
distractors:
  - '        total = total + payment / (1 + rate) * t'
  - '    for t in range(periods):'
explanation: |
  Each payment is discounted by its own number of years: 100 / 1.05 + 100 / 1.05 ** 2 + 100 / 1.05 ** 3 = 95.24 + 90.70 + 86.38 = 272.32. The first payment is a year away, so `t` runs from 1 to `periods`. The decoy `range(periods)` starts at 0, which would treat the first payment as paid today. The other decoy divides once and multiplies by `t`, which isn't discounting.
skills: [annuity-value]
