- term: annuity
  definition: "A stream of equal payments at regular intervals, such as a loan's monthly payments or a pension. Here the first payment comes one period from now."
- term: mortgage
  definition: "A loan to buy a home, usually repaid in equal monthly payments over many years, with the home as security for the lender."
- term: amortization
  definition: "Paying a loan off in equal payments, each covering that period's interest on the balance, with the rest paying the loan down."
- term: amortization schedule
  aliases: [amortization table]
  definition: "A table of a loan's payments, one row each: the interest on what was owed, the part that paid the loan down, and the balance left. It ends at zero."
