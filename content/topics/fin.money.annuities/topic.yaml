  - py.lists
# The lesson (about 9 minutes), the reading (about 12), 12 practice quick
# questions at a minute and a half, the worked example, fill-in and write
# (about 20), and the build, debug and explain (about 25).
estimated_minutes: 85
rev: 1
objectives:
  - "Value a stream of equal payments, by loop and by formula."
  - "Work out a loan's payment from its principal, rate and number of payments, with the rate and periods matched to the payments."
  - "Build an amortization schedule and say why early payments are mostly interest."
  - "Say what paying a little extra early does to a long loan."
