id: example-mortgage
stage: worked_example
rev: 1
title: "A $300,000 mortgage"
prompt: |
  This program works out the monthly payment on a $300,000 mortgage at 6% a year over 30 years, then follows the first two payments: how much of each is interest and how much pays down the loan. Press **Run**, then read how each part works.
steps:
  - label: "Monthly rate, number of months"
    lines: "5-6"
    note: "The loan is paid monthly, so the yearly 6% becomes a monthly 0.5% (`0.06 / 12`, 0.005) and the 30 years become 360 months. Every sum after this works in months."
  - label: "The payment formula"
    lines: "7-8"
    note: "`principal * rate / (1 - (1 + rate) ** -months)` is the one payment that, made every month, pays the loan off exactly: the 360 payments, each discounted to today, add up to the $300,000 borrowed. `(1 + rate) ** -months` is one over `(1 + rate) ** months`."
  - label: "Interest first"
    lines: "11-12"
    note: "Each month the lender first charges a month's interest on what's still owed: 0.5% of $300,000 is $1,500.00."
  - label: "The rest pays down the loan"
    lines: "13-16"
    note: "Whatever is left of the payment after the interest reduces the balance: only $298.65 of the first $1,798.65. The next month's interest is on a slightly smaller balance, so a little more pays the loan down, and so on for 360 months."
  - label: "What the loan costs"
    lines: "18"
    note: "360 payments of the unrounded $1,798.6516... add up to $647,514.57, so the interest over the 30 years is $347,514.57, more than the amount borrowed."
