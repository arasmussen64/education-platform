id: write-months-to-repay
stage: write
rev: 1
title: "How long to pay it off?"
prompt: |
  You owe $10,000 at 6% a year, charged monthly. How many months does it take to pay off at $300, $350 or $400 a month?

  Write a function `months_to_repay(principal, rate, monthly)`, where `rate` is the monthly rate. Starting from the principal, each month add a month's interest to the balance and take off the payment, and count the months until nothing is owed. The last payment may be smaller than the others; it still counts as a month. Then print a line for each payment in `payments`:

  ```
  300 a month: 37 months
  350 a month: 31 months
  400 a month: 27 months
  ```

  Keep the three starting lines: the checks call your function and run your program with another loan.
hints:
  - "The monthly rate is the yearly rate divided by 12."
  - "A `while` loop fits: keep going while the balance is above 0. Inside it, `balance = balance + balance * rate - monthly`, and add 1 to a counter."
  - "Count the month in which the balance goes to 0 or below: that's the last, smaller payment."
skills: [amortization]
