id: debug-loan-schedule
stage: debug
rev: 1
title: "A loan schedule that never ends"
prompt: |
  A $4,800 loan at 12% a year is repaid in 6 equal monthly payments, with interest charged monthly. This program should print the payment, then each month's interest and the balance left after that month's payment, ending at zero:

  ```
  Payment: 828.23
  Month 1: interest 48.00, balance 4,019.77
  Month 2: interest 40.20, balance 3,231.73
  Month 3: interest 32.32, balance 2,435.82
  Month 4: interest 24.36, balance 1,631.94
  Month 5: interest 16.32, balance 820.03
  Month 6: interest 8.20, balance 0.00
  ```

  The payment line is right. But every month's interest comes out far too high, and after the sixth payment the loan still shows nearly $2,000 owing. It has two bugs. Run it, fix what you find, and run it again. Keep the three starting lines: the checks also run it with another loan. (A last balance that prints as `-0.00` is a float leftover just below zero, and the checks accept it.)
hints:
  - "Fix one thing at a time and run it after each change."
skills: [amortization, payment]
