id: fill-annuity-two-ways
stage: fill_in
rev: 1
title: "Equal payments, two ways"
prompt: |
  What are 24 monthly payments of $250 worth today, when money earns 1% a month? The first payment comes in one month, the last in 24. Replace each `...` so the program works it out with a loop and with the formula, and both agree:

  ```
  By loop: 5,310.85
  By formula: 5,310.85
  ```

  All three blanks stand where a value goes, so Python starts the program and then stops with a `TypeError` that mentions `ellipsis` at the first blank it reaches. Keep the three starting lines: the checks run your program with other payments.
hints:
  - "The first payment is one month away, so the loop's first `t` is 1, not 0."
  - "A payment `t` months away is divided by `(1 + rate)` once for each month: the power is `t`."
  - "In the formula, `(1 + rate) ** -months` is one over the growth over all the months: the power is `-months`."
skills: [annuity-value]
