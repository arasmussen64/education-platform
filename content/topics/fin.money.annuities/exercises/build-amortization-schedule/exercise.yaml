id: build-amortization-schedule
stage: build
rev: 1
title: "An amortization schedule"
prompt: |
  A $6,000 loan at 9% a year is repaid in 6 equal monthly payments, with interest charged monthly.

  Write a function `payment(principal, rate, periods)` that returns the equal payment that repays `principal` over `periods` periods at `rate` per period (a decimal), unrounded. Then, using the three starting lines, print the payment, one row per month (the month's interest, how much of the payment paid the loan down, and the balance left), and the totals:

  ```
  Payment: 1,026.41
  Month 1: interest 45.00, paid down 981.41, balance 5,018.59
  Month 2: interest 37.64, paid down 988.77, balance 4,029.81
  Month 3: interest 30.22, paid down 996.19, balance 3,033.62
  Month 4: interest 22.75, paid down 1,003.66, balance 2,029.96
  Month 5: interest 15.22, paid down 1,011.19, balance 1,018.77
  Month 6: interest 7.64, paid down 1,018.77, balance 0.00
  Total paid: 6,158.48
  Total interest: 158.48
  ```

  Work with unrounded numbers and round only when printing; that's why the interest column, rounded row by row, adds up to a cent less than the total. The last balance may print as `-0.00`, a float leftover a trillionth of a cent below zero, and the checks accept that. Keep the three starting lines: the checks call your function and run your program with another loan. Later topics in this module use `payment` by this name.
skills: [payment, amortization]
