- term: logarithm
  definition: The exponent a base must be raised to in order to give a number. The log base 2 of 8 is 3, because `2 ** 3` is 8. It undoes a power, and turns multiplying into adding.
- term: natural log
  aliases: [natural logarithm]
  definition: The logarithm whose base is the number e, about 2.718. Maths books write it `ln`; in Python it is `math.log`. It is the log machine learning uses.
- term: exponential growth
  definition: Growth by the same factor at every step, such as 20% a month, so the amount is `start * factor ** steps`. Growth by the same amount at every step is a straight line instead.
- term: half-life
  definition: The time it takes a shrinking amount to halve. After `t` units of time with a half-life of `h`, `start * 0.5 ** (t / h)` is left.
