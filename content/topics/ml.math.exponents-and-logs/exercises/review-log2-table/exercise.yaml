id: review-log2-table
stage: review_code
rev: 1
title: "A table of logs"
prompt: |
  Starting from `numbers = [1, 2, 4, 8, 16]`, print `math.log2` of each, one row per line, the number then its log:

  ```
  1 0.0
  2 1.0
  4 2.0
  8 3.0
  16 4.0
  ```

  Notice what happens to the log each time the number doubles. Keep the two starting lines: the checks run your program with other numbers too.
skills: [log-meaning, log-rules]
