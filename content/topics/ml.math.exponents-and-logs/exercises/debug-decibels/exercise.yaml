id: debug-decibels
stage: debug
rev: 2
title: "Decibels"
prompt: |
  Loudness in decibels is `10 * log10(power / reference)`, where the reference is the quietest sound a person can hear, 0.000000000001 watts (`1e-12`). This program should print the loudness of a 0.5 W sound:

  ```
  117.0 dB
  ```

  Instead it prints `-269.4 dB`. It has two bugs. Run it, fix what you find, and run it again. Check each line against the formula, not just whether it runs.
hints:
  - "Fix one thing at a time and run it after each change. Work out the formula by hand: 0.5 / 1e-12 is 500000000000, and its log base 10 is about 11.7."
  - "A sound louder than the reference has a ratio bigger than 1, and the log of that is positive. Which way round is the fraction in `ratio`?"
  - "`math.log` is the natural log, base e. Decibels use base 10: `math.log10`."
skills: [log-meaning, log-rules]
