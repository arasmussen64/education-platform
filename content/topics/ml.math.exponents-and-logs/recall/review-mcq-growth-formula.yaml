id: review-mcq-growth-formula
type: mcq
rev: 1
prompt: |
  A balance `p` grows by `r` percent every year. Which expression is the balance after `n` years?
choices:
  - '`p * (1 + r / 100) ** n`'
  - '`p + r / 100 * n`'
  - '`p * r / 100 ** n`'
  - '`(p + r / 100) ** n`'
answer: 0
explanation: |
  Growing by r percent means multiplying by `1 + r / 100`, and doing that n years running means multiplying by it n times: `(1 + r / 100) ** n`. `p + r / 100 * n` adds the same amount each year (simple interest, a straight line, not growth); `p * r / 100 ** n` and `(p + r / 100) ** n` raise the wrong thing to the power.
skills: [growth]
