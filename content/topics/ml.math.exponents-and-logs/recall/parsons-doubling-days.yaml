id: parsons-doubling-days
type: parsons
rev: 2
prompt: |
  A colony of bacteria doubles every day, starting from 1. Put the lines in order so the program counts the days until it passes 1000 and prints `10 1024`. One line is a decoy that doesn't belong.
lines:
  - 'days = 0'
  - 'while 2 ** days < 1000:'
  - '    days = days + 1'
  - 'print(days, 2 ** days)'
distractors:
  - 'while 2 * days < 1000:'
explanation: |
  Doubling is multiplying by 2, so a colony that starts from 1 holds `2 ** days` bacteria after that many days. The loop counts a day at a time for as long as that amount is under 1000: after 10 doublings it's `2 ** 10`, 1024. The decoy's `2 * days` adds 2 a day instead, which is growth by the same amount each day, not by the same factor: that would take 500 days.
skills: [growth]
