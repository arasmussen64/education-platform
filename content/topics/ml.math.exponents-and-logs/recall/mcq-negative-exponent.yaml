id: mcq-negative-exponent
type: mcq
rev: 1
prompt: |
  What does `print(10 ** -2)` show?
choices:
  - '`-100`'
  - '`0.1`'
  - '`-20`'
  - '`0.01`'
answer: 3
explanation: |
  A negative exponent means "one over": `10 ** -2` is `1 / 10 ** 2`, which is 1/100, `0.01`. It's small, not negative. (`10 ** -1` would be `0.1`.)
skills: [powers]
