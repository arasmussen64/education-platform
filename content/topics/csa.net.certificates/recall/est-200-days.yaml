id: est-200-days
type: estimate
rev: 1
prompt: |
  A public CA issued a site's certificate on 1 April 2026, with the longest lifetime the CA/Browser Forum's rules allowed on that day. The site's team plans the next one 30 days before it expires. How many days after the first was issued is that? Exactly.
unit: days after issue
answer: 170
tolerance: { absolute: 0 }
given: { before: 30 }
# 200 days, the limit from 15 March 2026, is the fact the learner knows.
working: 200 - before
mistakes:
  - id: old-limit
    value: 368
    working: 398 - before
    why: 398 days was the limit until 15 March 2026. A certificate issued on 1 April 2026 may last 200 days at most.
  - id: next-limit
    value: 70
    working: 100 - before
    why: 100 days is the limit from 15 March 2027. On 1 April 2026 it was 200.
explanation: |
  200 − 30 = 170. The CA/Browser Forum's Baseline Requirements (version 2.3.1) cap a public server certificate at 200 days if it's issued from 15 March 2026, 100 days from 15 March 2027 and 47 days from 15 March 2029; before 15 March 2026 the cap was 398 days. The dates are when a certificate is issued, so a 200-day certificate issued on 14 March 2027 still lasts its 200 days.
skills: [acme-and-rotation]
