# The terms this topic teaches (ADR-0026). Where another topic's lesson
# first uses one, the app shows its definition and links back here.
- term: subjectAltName
  aliases: [SAN]
  definition: The list of names a certificate is good for, which clients check against the name they asked for. The older common name (CN) is ignored.
- term: root CA
  definition: A certificate authority at the top of a chain, whose certificate signs itself. Nothing proves it but being already in the client's trust store.
- term: intermediate CA
  aliases: [intermediate certificate]
  definition: A certificate authority whose certificate a root signed, and which signs sites' certificates. A server must send it after its own certificate, or strict clients can't build the chain.
- term: trust store
  definition: The list of root certificates a system or browser trusts, shipped with it, to which a company adds its own private root on its managed machines.
- term: full chain
  definition: "A server's own certificate followed by the intermediates that signed it, in one file (certbot's `fullchain.pem`): what a server should send. Never the root."
- term: CSR
  aliases: [certificate signing request]
  definition: "A request for a certificate: the public key and the names wanted, signed with the matching private key to prove the requester holds it."
- term: ACME
  definition: The protocol a program such as certbot uses to get certificates without a person, by proving control of each name with a challenge (HTTP-01, DNS-01 or TLS-ALPN-01).
- term: mutual TLS
  aliases: [mTLS]
  definition: TLS in which the client also proves who it is, with a certificate of its own, after the server asks for one. For clients known in advance, such as partners' servers.
