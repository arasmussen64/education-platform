id: csa.net.certificates
kind: topic
status: ready
title: Certificates and mutual TLS
summary: "What a certificate says and how a client decides to trust one: the chain from a site's certificate through intermediates to a root, the names, dates and uses, and the verify failures by their codes; a certificate authority of your own with openssl; ACME and certbot, getting a certificate automatically and making every renewal reach the server, and why lifetimes are shrinking to 47 days; and mutual TLS, where the client proves who it is too, with the three clouds' managed certificates and load balancers side by side."
# Module 3's plan (docs/plans/cloud-module-3/MODULE-3-BRIEF.md, sections 2,
# 3.7 and 5, topic 32) and its designer's brief (csa.net.http-tls.md, the
# chain, ACME and mutual-TLS parts). Through csa.net.http-tls this builds
# on csa.net.dns (names, CAA, a signature, a hash, DNSSEC's chain of trust
# and trust anchor), csa.net.congestion and csa.net.transport (RTT, the
# handshake), the earlier Module 3 topics (machines, on, name@machine
# services, Unbound) and Module 1 (curl, openssl's s_client, systemctl,
# timers, journalctl, awk, grep, sed, SSH's key pair). csa.net.http-tls
# defined symmetric and public-key encryption, key exchange, forward
# secrecy, cipher suite, handshake, SNI, OCSP and stapling, nginx's files
# and directives, and named a certificate, root and intermediate CA and
# subjectAltName in one paragraph. This topic defines, for the module (the
# plan's 3.7): certificate (X.509), subject, issuer, subjectAltName, CA,
# root, intermediate, chain, trust store, validity, basic constraints, key
# usage and extended key usage, CSR, private CA, ACME and its account,
# order and challenges, Certificate Transparency, deploy hook, mutual TLS
# and client certificate.
prerequisites: [csa.net.http-tls]
# Worked out: the lesson about 25 minutes (3,000 words with its tables),
# the readings about 30 (Let's Encrypt's two pages 13, Google's mutual TLS
# overview to "Client validation modes" 8, certbot's two sections 5, nginx's
# directives 4), 14 recall items at 1.5 each 21, then the worked example
# 30, the fill-in 30, the write 35, the build 50, the debug 40 and the
# explain 20: about 280. The plan's 230 is kept (MODULE-3-BRIEF.md, topic
# 32), as its split of the designer's 332 minutes set it.
estimated_minutes: 280
rev: 1
objectives:
  - "Read a certificate (subject, issuer, subjectAltName, validity, basic constraints, key usage and extended key usage) and the chain a server sends; say how a client walks from a site's certificate through intermediates to a root in its trust store, why a server sends the intermediates and not the root, and name the common verify failures by their codes."
  - "Make a certificate authority of your own with openssl: a root, an intermediate limited to signing servers' certificates, a server certificate with the right names and use, a full chain, and a client certificate from a separate CA."
  - "Explain how ACME proves control of a name with its HTTP-01, DNS-01 and TLS-ALPN-01 challenges, get a certificate with certbot, and make it renew by itself and reach the server (the live/ names, a deploy hook, the timer); say why public certificates are shrinking from 398 days to 47 and when to renew."
  - "Require client certificates on one service and not on another, trusting a separate CA for clients, and say what `optional` lets in; say how the three clouds manage certificates for their load balancers and how their load balancers do mutual TLS."
# Facts the lesson and the items rely on, each read on 2026-11-12:
# - The CA/Browser Forum's Baseline Requirements, version 2.3.1 (dated
#   4 October 2026), section 1.2.2: the maximum validity of a subscriber
#   certificate is 200 days from 2026-03-15, 100 days from 2027-03-15 and
#   47 days from 2029-03-15:
#   raw.githubusercontent.com/cabforum/servercert/main/docs/BR.md. Ballot
#   SC-081v3 passed (25 issuers yes, 0 no, 5 abstaining; 4 consumers yes):
#   "Eventual reduction of maximum validity period from 398 days to 47
#   days", March 2026 to March 2029:
#   cabforum.org/2025/04/11/ballot-sc081v3-introduce-schedule-of-reducing-validity-and-data-reuse-periods/
# - Let's Encrypt today issues 90-day certificates; the tlsserver profile's
#   45 days from 2026-05-13 (opt-in), the classic profile's 64 days from
#   2027-02-10 and 45 days from 2028-02-16; renew with ARI, or at about
#   two-thirds of the lifetime: isrg.org/post/from-90-to-45/ ("Decreasing
#   Certificate Lifetimes to 45 Days", 2025-12-02). The shortlived profile,
#   160 hours, generally available since 2026-01-15:
#   letsencrypt.org/2026/01/15/6day-and-ip-general-availability.html.
# - Let's Encrypt's "How It Works" (updated 2025-08-02): the account key
#   pair, challenges checked from several network perspectives, the CSR
#   signed by its own key and the account key, Certificate Transparency
#   logs, revocation published in CRLs: letsencrypt.org/how-it-works/.
#   "Challenge Types" (updated 2026-02-12): HTTP-01 "can only be done on
#   port 80" and "cannot be used to issue wildcard certificates", follows
#   up to 10 redirects to ports 80 or 443; DNS-01 at
#   "_acme-challenge.<YOUR_DOMAIN>", wildcards, credentials on the server;
#   TLS-ALPN-01 "via TLS on port 443", "not suitable for most people",
#   "cannot be used to validate wildcard domains":
#   letsencrypt.org/docs/challenge-types/.
# - ACME is RFC 8555 (March 2019); ARI is RFC 9773 (June 2025), both
#   Proposed Standards: rfc-editor.org/rfc/rfc8555.json, rfc9773.json.
# - certbot: point the server at /etc/letsencrypt/live/$domain "rather
#   than copying"; a certificate is ready for renewal "when less than 1/3rd
#   of its lifetime remains" from certbot 4.0.0, a fixed 30 days before;
#   a deploy hook runs "once for each successfully issued certificate,
#   including on subsequent renewals"; renewal-hooks/deploy; certbot
#   reconfigure: eff-certbot.readthedocs.io/en/stable/using.html. Ubuntu
#   24.04's certbot 2.9.0: renew_before_expiry "30 days", a random sleep of
#   up to 60 * 8 seconds, certbot.timer at 00:00 and 12:00 with a
#   RandomizedDelaySec of 43200, the live/README's wording: read in the
#   labs' image.
# - nginx's ngx_http_ssl_module: ssl_verify_client on | off | optional |
#   optional_no_ca, optional "requests the client certificate and verifies
#   it if the certificate is present"; ssl_client_certificate's list "will
#   be sent to clients", ssl_trusted_certificate's not; ssl_verify_depth 1
#   by default; codes 495 and 496:
#   nginx.org/en/docs/http/ngx_http_ssl_module.html.
# - The clouds (the lesson's tables):
#   AWS Certificate Manager renews its certificates automatically when they
#   use DNS validation, and they're eligible when associated with a
#   service such as Elastic Load Balancing or CloudFront; imported
#   certificates and those issued through ACME aren't renewed by ACM:
#   docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html.
#   ALB mutual TLS: passthrough ("sends the entire client certificate chain
#   to the target, without verifying it", X-Amzn-Mtls-Clientcert) or verify
#   (a trust store of CA bundles; X-Amzn-Mtls-Clientcert-Serial-Number,
#   -Issuer, -Subject, -Validity, -Leaf); "Advertise CA subject name":
#   docs.aws.amazon.com/elasticloadbalancing/latest/application/mutual-authentication.html.
#   Azure App Service certificates: bought through Azure from GoDaddy,
#   kept in Key Vault, renewed automatically from 32 days before
#   expiration, "can't be issued for longer than 198 days"; App Service
#   managed certificates are free (ms.date 2026-10-15):
#   learn.microsoft.com/en-us/azure/app-service/configure-ssl-app-service-certificate.
#   Application Gateway mutual authentication: passthrough mode (asks, but
#   doesn't refuse a missing or invalid certificate) or strict mode (a
#   trusted client CA chain, root included, in an SSL profile); verify
#   client certificate DN off by default; OCSP revocation checks; Standard_v2
#   and WAF_v2 only (ms.date 2026-04-27):
#   learn.microsoft.com/en-us/azure/application-gateway/mutual-authentication-overview.
#   Google Certificate Manager: Google-managed certificates from "the
#   Public Certificate Authority and the Let's Encrypt CA", issued and
#   renewed automatically, with DNS or load balancer authorization:
#   docs.cloud.google.com/certificate-manager/docs/overview. Google's
#   Application Load Balancers' mutual TLS: a trust config of trust anchors
#   and intermediates, REJECT_INVALID or
#   ALLOW_INVALID_OR_MISSING_CLIENT_CERT, client certificates with
#   clientAuth: docs.cloud.google.com/load-balancing/docs/mtls.
# Tried in this topic's labs (step-ca 0.30.2, step-cli 0.31.0, certbot
# 2.9.0, nginx 1.24.0, OpenSSL 3.0.13, curl 8.5.0, faketime 0.9.10 on
# Ubuntu 24.04), 2026-11-12: step-ca's ACME certificates last 24 hours and
# a minute, have an empty subject, a critical subjectAltName and both
# server and client authentication; certbot trusts the lab's CA through
# Ubuntu's certifi, which reads /etc/ssl/certs/ca-certificates.crt, so no
# REQUESTS_CA_BUNDLE is needed; nginx refuses a client certificate whose
# extended key usage is serverAuth alone ("400 The SSL certificate error")
# and accepts one with none; faketime gives openssl a clock two days back,
# so a certificate can be made already expired; the verify codes 0, 10,
# 18, 19, 20 then 21, and 62, with curl's (60) messages for each.
# Every command output in the lesson, the labs and the recall items marked
# "captured" is real output of those labs; dates, serials and keys differ
# in a new run.
