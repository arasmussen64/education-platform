prove:
  build: build-shop-tls
  debug: debug-padlock-trouble
  explain:
    prompt: |
      A colleague says: "A certificate is a formality: we buy one a year, install it, and forget it." Explain, in your own words: what a certificate holds and how a client decides to trust a server's, with the ways that most often goes wrong in production and how each shows; why public certificates now last weeks rather than years, and how ACME proves that you control a name; what you must build so that certificates this short cause no outages; and when you'd make clients show certificates too, how the server decides which ones to accept, and the mistakes that leave mutual TLS open.
    rubric:
      - id: trust
        required: true
        description: "A certificate binds names (the subjectAltName, which clients check; not the CN) to a public key, with dates and permitted uses, signed by an issuer; the client walks from the site's certificate through the intermediates the server sends to a root it already has in its trust store, checking each signature, the name and the dates. Common failures: the intermediate not sent (openssl's 20 then 21; browsers may hide it), expired (10), a name not in the subjectAltName (62), a root the client doesn't trust (19, 18)."
      - id: why-short-and-acme
        required: true
        description: "Revocation doesn't reach clients reliably, so short lifetimes limit how long a stolen key is useful: the public maximum falls from 398 days to 200 (March 2026), 100 (March 2027) and 47 (March 2029). ACME has a client with an account key ask a CA for an order, prove control of each name with a challenge (HTTP-01 on port 80, DNS-01 with a TXT record and the only one for wildcards, TLS-ALPN-01 on 443), then send a CSR and get the certificate."
      - id: automation
        required: true
        description: "Renewal is automatic (a timer), early (about two-thirds of the way through, or when the CA says through ARI) and reaches the server: the server reads the client's current files (certbot's live/ names, never archive/ or a copy) and a deploy hook reloads it, since a renewal changes files and not the running process; the served certificate's expiry is monitored from outside."
      - id: mtls
        required: true
        description: "Mutual TLS for partner and service-to-service APIs: the server sends a CertificateRequest and the client answers with its certificate and a CertificateVerify signature; the server trusts a CA kept for clients alone, since a server CA's certificates often allow client use; `optional` (or a broad trust list) lets clients without a valid certificate in; client certificates need clientAuth."
      - id: clouds
        required: false
        description: "The clouds renew the certificates they manage for their load balancers (ACM when DNS-validated and in use, Azure's App Service certificates, Google-managed certificates) but not ones imported or got elsewhere; their load balancers verify client certificates against a trust store, or pass them through to the backends to check (AWS passthrough and verify, Azure passthrough and strict, Google's REJECT_INVALID and ALLOW_INVALID_OR_MISSING_CLIENT_CERT)."
    model_answer: |
      A certificate is anything but a formality: it's what lets a client tell your server from anyone else's. It holds a public key, the names it's good for in its subjectAltName (clients ignore the CN), its dates, what it may be used for, and a signature from its issuer. The client checks that signature, then the issuer's own certificate, an intermediate the server sends along, and so on up to a root it already holds in its trust store; the name it asked for must be in the list and the dates must be good. In production it goes wrong in a few ways: the server sends its certificate without the intermediate (openssl says 21, curl "unable to get local issuer certificate", and browsers often hide it because they've cached the intermediate), the certificate expires (10), the name isn't in it (62), or it comes from a root the client doesn't trust.

      Certificates are getting short because revocation doesn't reliably reach clients, so a stolen key works until the certificate expires. The longest a public certificate may last went from 398 days to 200 in March 2026, and goes to 100 in March 2027 and 47 in March 2029. ACME automates getting one: the client registers an account key, orders the names, and proves control of each with a challenge, a file served on port 80 (HTTP-01), a TXT record (DNS-01, the only way for a wildcard) or a special certificate on 443 (TLS-ALPN-01); then it sends a CSR and gets the certificate.

      So it has to be built in: a timer runs the ACME client, which renews about two-thirds of the way through each certificate's life, or when the CA says through ARI; the server reads the client's live files, not a copy or the archive; and a deploy hook reloads the server after every renewal, because a renewal changes files, not the running process. And something watches the expiry of the certificate actually served.

      I'd require client certificates for partners' and internal service-to-service APIs. The server asks for one in the handshake, the client sends it with a signature proving it holds the key, and the server accepts only certificates from the CA I name for clients. That CA should be one kept for clients alone, because our server CA's certificates are often good for client use too, and `optional` lets anyone without a certificate straight in. On the clouds, the managed certificates renew themselves only when the cloud manages them, and the load balancers check client certificates against a trust store I upload, or pass them through for the backend to check.
