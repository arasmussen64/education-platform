skills:
  - id: cert-chains
    description: "What a certificate holds (subject, issuer, subjectAltName, validity, serial, basic constraints, key usage and extended key usage) and how to read it with `openssl x509`; the chain from a site's certificate through intermediates to a root in a trust store, the full chain a server sends and why not the root; the verify codes (0, 10, 18, 19, 20 and 21, 62) and curl's (60); a CA of your own with openssl, a CSR"
  - id: acme-and-rotation
    description: "Why certificates are getting shorter (revocation's limits; 398, 200, 100 and 47 days); ACME's account key, order, challenges (HTTP-01, DNS-01, TLS-ALPN-01) and CSR, Certificate Transparency in a sentence; certbot's live/, archive/ and renewal files, its timer and renewal window, deploy hooks, and renewing at two-thirds or by ARI; the arithmetic of lifetimes and renewals; the clouds' managed certificates"
  - id: mutual-tls
    description: "Client certificates: the CertificateRequest and the client's Certificate and CertificateVerify; nginx's `ssl_client_certificate`, `ssl_trusted_certificate` and `ssl_verify_client` (`on` against `optional`), the answers a refused client gets, and a separate CA for clients; extended key usage clientAuth; where mutual TLS is used and how the three clouds' load balancers do it"
