# The checks of "The shop's certificates": every handshake is made from a
# machine on the lab's network, the office (a customer) or partner (the
# warehouse), against web's one address. The first check waits for nginx
# on web after a boot; the rest read at once, except the last, which
# renews both certificates as the timer would and watches nginx.
# A check that finds something wrong prints what it found and exits 0, so
# the checker shows that sentence rather than an exit status.
checks:
  - id: www-from-acme
    description: "www.shop.test, on port 443, serves a certificate the office trusts for that name, issued through the shop CA's ACME service: by its intermediate, for 24 hours."
    # It waits up to about 30 seconds for nginx after a boot (10 tries of
    # at most 3 seconds), so it gets 45 and prints its own sentence.
    timeout: 45
    command: |
      . /usr/local/lib/lab/certcheck.sh
      wait_for 10 web_up || { echo "nothing answers HTTPS for www.shop.test on web"; exit 0; }
      from_acme www.shop.test 443
    expect:
      equals: acme
  - id: api-from-acme
    description: "api.shop.test, on port 8443, serves a certificate the office trusts for that name, issued through the same ACME service."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      from_acme api.shop.test 8443
    expect:
      equals: acme
  - id: versions
    description: "Both sites accept TLS 1.2 and TLS 1.3 and refuse TLS 1.1, and no ssl_protocols line in nginx's files names a version older than TLS 1.2."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      for site in www.shop.test:443 api.shop.test:8443; do
        name=${site%:*} port=${site#*:}
        for v in 1.2 1.3; do
          got=$(hello "$name" "$port" "$v")
          [ "$got" = "TLSv$v" ] || { echo "a TLS $v handshake for $name on port $port is $got"; exit 0; }
        done
        got=$(hello "$name" "$port" 1.1)
        [ "$got" = refused ] || { echo "a TLS 1.1 handshake for $name on port $port is accepted ($got)"; exit 0; }
      done
      [ -n "$(file_versions)" ] || { echo "nginx's files have no ssl_protocols line, so nginx 1.24 allows its own default, TLS 1.0 to 1.3"; exit 0; }
      old=$(file_versions | grep -v -x -e TLSv1.2 -e TLSv1.3 | tr '\n' ' ')
      [ -z "$old" ] || { echo "an ssl_protocols line in nginx's files still names $old"; exit 0; }
      echo versions
    expect:
      equals: versions
  - id: h2
    description: "Both sites speak HTTP/2 to a client that offers it."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      got=$(on office curl -s -o /dev/null --max-time 5 -w '%{http_version}' https://www.shop.test/)
      [ "$got" = 2 ] || { echo "curl from the office speaks HTTP/$got to www.shop.test"; exit 0; }
      got=$(on partner curl -s -o /dev/null --max-time 5 --cert /etc/warehouse/warehouse.pem --key /etc/warehouse/warehouse.key -w '%{http_version}' https://api.shop.test:8443/)
      [ "$got" = 2 ] || { echo "curl from partner speaks HTTP/$got to api.shop.test"; exit 0; }
      echo h2
    expect:
      equals: h2
  - id: public-site-open
    description: "www.shop.test asks no one for a certificate: a client without one gets the shop's page."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      if handshake www.shop.test 443 -trace | grep 'CertificateRequest' > /dev/null; then
        echo "www.shop.test's handshake asks the client for a certificate (CertificateRequest)"
        exit 0
      fi
      on office curl -s --max-time 5 https://www.shop.test/ | grep 'The shop: www.shop.test' > /dev/null ||
        { echo "https://www.shop.test/ doesn't give a client without a certificate the shop's page from /srv/www/www"; exit 0; }
      echo open
    expect:
      equals: open
  - id: partner-in
    description: "The warehouse's sync, run on partner with the warehouse's certificate from the Shop Partners CA, gets the open orders from api.shop.test."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      on partner warehouse-sync
    expect:
      equals: synced 42 orders
  - id: partner-api-closed
    description: "api.shop.test answers no one without a certificate from the Shop Partners CA: not a client with none, not one with a certificate the shop's own CA issued, and not one with a certificate from any other CA. And the API's orders are served nowhere else: not over plain HTTP, and not on port 443."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      dir=$(mktemp -d)
      trap 'rm -rf "$dir"' EXIT
      # A certificate the shop's own CA issues to a server, which is good
      # for clients too, and one from a CA nobody here has heard of.
      /usr/local/lib/lab/sign-by-hand "intruder$RANDOM.shop.test" 1 "$dir/shop.pem" "$dir/shop.key"
      openssl ecparam -name prime256v1 -genkey -noout -out "$dir/other-ca.key"
      openssl req -x509 -new -key "$dir/other-ca.key" -subj "/CN=Someone Else's CA" -days 2 -out "$dir/other-ca.pem" 2> /dev/null
      openssl ecparam -name prime256v1 -genkey -noout -out "$dir/other.key"
      openssl req -new -key "$dir/other.key" -subj "/CN=warehouse.partners.test" -out "$dir/other.csr" 2> /dev/null
      printf '%s\n' 'extendedKeyUsage=clientAuth' > "$dir/other.ext"
      openssl x509 -req -in "$dir/other.csr" -CA "$dir/other-ca.pem" -CAkey "$dir/other-ca.key" -CAcreateserial -days 1 -extfile "$dir/other.ext" -out "$dir/other.pem" 2> /dev/null
      chmod -R a+rX "$dir"
      got=$(api_answer office)
      case $got in 4*) ;; *) echo "api.shop.test answers a client without a certificate with \"$got\""; exit 0 ;; esac
      got=$(api_answer office "$dir/shop.pem" "$dir/shop.key")
      case $got in 4*) ;; *) echo "api.shop.test answers a client whose certificate the shop's own CA issued (to a server) with \"$got\""; exit 0 ;; esac
      got=$(api_answer office "$dir/other.pem" "$dir/other.key")
      case $got in 4*) ;; *) echo "api.shop.test answers a client whose certificate comes from an unknown CA with \"$got\""; exit 0 ;; esac
      # The same orders by another way in: plain HTTP (port 80) or the
      # public site's port, for the API's name, with no certificate.
      for url in http://api.shop.test/orders https://api.shop.test/orders; do
        if on office curl -sk --max-time 5 "$url" | grep '^order 1001 ' > /dev/null; then
          echo "$url gives the API's orders to a client without a certificate"
          exit 0
        fi
      done
      echo closed
    expect:
      equals: closed
  - id: redirect
    description: "Plain HTTP serves ACME's challenge files for both names from where certbot leaves them, and answers every other request for www.shop.test with a permanent redirect (301) to the same path on HTTPS."
    command: |
      . /usr/local/lib/lab/certcheck.sh
      path="/check/$RANDOM?x=$RANDOM"
      answer=$(on office curl -sI --max-time 5 "http://www.shop.test$path" | tr -d '\r')
      status=$(echo "$answer" | head -n 1)
      loc=$(echo "$answer" | awk -F': ' 'tolower($1) == "location" {print $2}')
      case $status in
        "HTTP/1.1 301 "*) ;;
        *) echo "http://www.shop.test$path answers \"$status\", not a 301"; exit 0 ;;
      esac
      [ "$loc" = "https://www.shop.test$path" ] || { echo "http://www.shop.test$path redirects to \"$loc\", not https://www.shop.test$path"; exit 0; }
      # Each name's challenge folder is the webroot certbot recorded for it.
      for name in www.shop.test api.shop.test; do
        root=$(cat /etc/netns/web/letsencrypt/renewal/*.conf 2> /dev/null | awk -v n="$name" -F' = ' '$1 == n {print $2; exit}')
        [ -n "$root" ] || { echo "certbot has no webroot recorded for $name on web"; exit 0; }
        token="chk-$RANDOM$RANDOM"
        mkdir -p "$root/.well-known/acme-challenge"
        echo "$token" > "$root/.well-known/acme-challenge/$token"
        got=$(on office curl -s --max-time 5 "http://$name/.well-known/acme-challenge/$token")
        rm -f "$root/.well-known/acme-challenge/$token"
        [ "$got" = "$token" ] || { echo "a challenge file left in $root/.well-known/acme-challenge/ isn't served at http://$name/.well-known/acme-challenge/"; exit 0; }
      done
      echo redirect
    expect:
      equals: redirect
  - id: timer-on
    description: "certbot@web.timer is on now and at every boot."
    command: |
      [ "$(systemctl is-enabled certbot@web.timer 2> /dev/null)" = enabled ] || { echo "certbot@web.timer doesn't start at boot"; exit 0; }
      [ "$(systemctl is-active certbot@web.timer 2> /dev/null)" = active ] || { echo "certbot@web.timer isn't running"; exit 0; }
      echo running
    expect:
      equals: running
  - id: renewal-reaches-nginx
    description: "When certbot renews either site's certificate, as the timer does, nginx serves the new certificate within seconds, with nobody touching it."
    # Two renewals of about 3 seconds each, and up to 10 seconds' wait for
    # nginx after each.
    timeout: 60
    command: |
      . /usr/local/lib/lab/certcheck.sh
      for site in www.shop.test:443 api.shop.test:8443; do
        got=$(reaches_nginx "${site%:*}" "${site#*:}")
        [ "$got" = reaches ] || { echo "$got"; exit 0; }
      done
      echo reaches
    expect:
      equals: reaches
  - id: scenery
    description: "The network, the shop's certificate authority and every machine's trust in it, the Shop Partners CA, the warehouse's certificate and its sync, and the resolver are as the lab began."
    command: |
      . /usr/local/lib/netlab/checklib.sh
      intact
    expect:
      equals: intact
