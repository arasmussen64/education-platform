id: build-shop-tls
stage: build
runtime: lab
lab:
  init: systemd
  restart_trial: true
rev: 1
title: "The shop's certificates"
prompt: |
  The shop's web server, `web` (10.0.9.1), is to serve two sites with certificates that look after themselves, and you are setting it up. `netlab show` lists the machines:

  - `web` runs nginx, with its settings in its `/etc/nginx` as Ubuntu ships them: `nginx.conf`, and the default site, which answers plain HTTP on port 80 for any name from `/var/www/html`. certbot is installed on web (`on web certbot ...`, with its files in web's `/etc/letsencrypt`), and so is its timer, `certbot@web.timer`, switched off. `/etc/nginx/partners-ca.pem` is the certificate of the **Shop Partners CA**, the authority that signs the certificates the shop's partners present as clients.
  - `ca` (10.0.9.5) runs the shop's certificate authority, step-ca, whose ACME service is `https://ca.shop.test:9000/acme/acme/directory`. Every machine trusts its root.
  - `partner` (10.0.9.3) is the warehouse's server. It holds the warehouse's client certificate from the Shop Partners CA, and its nightly sync, `on partner warehouse-sync`, fetches the open orders from `https://api.shop.test:8443/orders` with it.
  - `resolver` (10.0.9.53) is the shop's name server: it gives `www.shop.test` and `api.shop.test` web's address and `ca.shop.test` ca's. `office` (10.0.9.2) is a customer's laptop.

  None of the CAs, the warehouse's certificate and sync, the resolver or the network is yours to change. The pages are ready: the shop's in `/srv/www/www`, the API's in `/srv/www/api`. Set web up so that:

  1. **`www.shop.test` serves HTTPS on port 443 with a certificate from the CA's ACME service**, got with certbot, which proves the name over plain HTTP (HTTP-01).
  2. **`api.shop.test` serves HTTPS on port 8443 with a certificate from the same ACME service.** Its own certificate or one certificate for both names: either is fine.
  3. **Both renew by themselves, and every renewal reaches nginx** without anyone touching it.
  4. **Plain HTTP on port 80 serves ACME's challenge files for both names**, and redirects every other request for `www.shop.test` (301) to the same path on HTTPS.
  5. **TLS 1.2 and 1.3 only, and HTTP/2**, for both sites. Nothing in nginx's files may name an older version.
  6. **The API admits only clients with a certificate from the Shop Partners CA.** No other certificate opens it, not even one from the shop's own CA, and a client with none is refused.
  7. **The public site asks no one for a certificate.**
  8. **It lasts:** your settings are in files, and they work after a reboot.

  On the lab's fast clock the CA's certificates last 24 hours (a public CA's last 200 days at most today), and certbot's timer runs every four hours. `on web nano FILE` edits a file, `on web nginx -t` checks nginx's files, and `sudo systemctl reload nginx@web` makes nginx read them again; `on web tail /var/log/nginx/error.log` shows what it complained about. `on web certbot certificates` lists certbot's certificates, and `on web certbot renew --force-renewal --no-random-sleep-on-renew` renews them now, as the timer does when they're due. From the office, `curl -v`, `curl -sI http://...` and `openssl s_client` (with `-servername`, `-showcerts`, `-tls1_2`) show what a customer gets; from partner, `warehouse-sync` and `curl --cert ... --key ...` what the warehouse gets. When everything above holds, run the checks.
skills: [acme-and-rotation, mutual-tls, cert-chains]
