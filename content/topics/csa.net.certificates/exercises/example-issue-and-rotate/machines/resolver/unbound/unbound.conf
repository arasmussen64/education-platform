# The shop's name server: Unbound, answering for shop.test from its own
# records (local data). The lab has no internet, so it answers nothing else.
server:
  interface: 0.0.0.0
  access-control: 10.0.9.0/24 allow
  access-control: 127.0.0.0/8 allow
  chroot: ""
  username: "unbound"
  pidfile: "/run/unbound.pid"
  use-syslog: no
  logfile: ""
  # .test is reserved, and Unbound would answer every name under it with
  # NXDOMAIN by itself; the shop's names are under it.
  local-zone: "test." nodefault
  local-zone: "shop.test." static
  local-data: "www.shop.test. 300 A 10.0.9.1"
  local-data: "api.shop.test. 300 A 10.0.9.1"
  local-data: "ca.shop.test. 300 A 10.0.9.5"
remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
