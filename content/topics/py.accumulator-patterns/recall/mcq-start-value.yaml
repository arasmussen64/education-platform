id: mcq-start-value
type: mcq
rev: 1
prompt: |
  A program adds up the numbers the user types. Where must the line `total = 0` go?
choices:
  - 'Inside the loop, right before `total += n`, so the total is fresh on each pass'
  - 'Before the loop, once, so each pass adds to what is already there'
  - 'After the loop, just before `print(total)`'
  - 'Nowhere: `total += n` creates `total` the first time it runs'
answer: 1
explanation: |
  An accumulator is set up **before** the loop, updated inside it, and used after it. Inside the loop, `total = 0` would wipe the total on every pass, leaving just the last number. After the loop, it would wipe it before printing. And `total += n` means `total = total + n`, which needs `total` to exist already: without the starting line, Python raises a `NameError`.
skills: [running-total]
