id: review-mcq-sentinel
type: mcq
rev: 1
prompt: |
  The user types `5`, `-2`, `7` and then `0`. What does this program print?

  ```python
  count = 0
  while True:
      n = int(input("Number? "))
      if n == 0:
          break
      if n < 0:
          continue
      count += 1
  print(count)
  ```
choices:
  - '`3`'
  - '`2`'
  - '`4`'
  - 'Nothing: it never stops'
answer: 1
explanation: |
  `5` is counted. `-2` hits `continue`, which skips `count += 1` and goes back to ask again. `7` is counted. `0` hits `break`, which leaves the loop, and `print(count)` shows `2`. The `0` is a signal to stop, not a value to count.
skills: [break-continue]
