id: mcq-break-vs-continue
type: mcq
rev: 1
prompt: |
  What does this program print?

  ```python
  for i in range(1, 6):
      if i == 3:
          continue
      print(i)
  ```
choices:
  - '`1 2` (on separate lines)'
  - '`1 2 3 4 5`'
  - '`1 2 4 5`'
  - '`4 5`'
answer: 2
explanation: |
  `continue` skips the rest of the current pass and moves on to the next value, so 3 is never printed but the loop carries on with 4 and 5. With `break` in its place, the loop would end at 3 and print only `1` and `2`.
skills: [break-continue]
