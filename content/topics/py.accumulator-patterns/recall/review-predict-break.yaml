id: review-predict-break
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints. Pay attention to when the `break` check happens.
code: |
  total = 0
  for n in range(1, 10):
      if total > 10:
          break
      total += n
      print(total)
  print("end", total)
expected_output: |
  1
  3
  6
  10
  15
  end 15
explanation: |
  Each pass first checks `total > 10`, then adds `n`. The total goes 1, 3, 6, 10 (not more than 10, so no break yet), then 15. On the next pass `15 > 10` is `True`, so `break` leaves the loop before anything else happens, and the last line prints `end 15`.
skills: [running-total, break-continue]
