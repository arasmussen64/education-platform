id: predict-odd-total
type: predict_output
rev: 1
prompt: |
  Trace this program and say what it prints: one line with two numbers.
code: |
  count = 0
  total = 0
  for n in range(1, 8):
      if n % 2 == 1:
          count += 1
          total += n
  print(count, total)
expected_output: |
  4 16
explanation: |
  `range(1, 8)` gives 1 to 7. `n % 2 == 1` is `True` for the odd ones, 1, 3, 5 and 7, so `count` ends at 4 and `total` at 1 + 3 + 5 + 7 = 16. Both accumulators start at 0 before the loop and are only printed after it.
skills: [running-total]
