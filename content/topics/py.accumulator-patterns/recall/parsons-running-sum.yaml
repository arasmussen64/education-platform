id: parsons-running-sum
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `1`, `3`, `6`, `10` and then `Sum: 10`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'total = 0'
  - 'for n in range(1, 5):'
  - '    total = total + n'
  - '    print(total)'
  - 'print("Sum:", total)'
distractors:
  - '    total = n'
explanation: |
  A running total starts at 0 before the loop and grows inside it. Printing inside the loop shows each step: 1, 3, 6, 10. The unindented `print` runs once, at the end. `total = n` would throw the running total away each time round.
skills: [running-total]
