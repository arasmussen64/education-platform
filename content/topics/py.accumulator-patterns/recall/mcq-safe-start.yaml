id: mcq-safe-start
type: mcq
rev: 1
prompt: |
  A program finds the largest of some whole numbers the user types, and they might all be negative. Which starting value for `largest` is safe?
choices:
  - '`largest = 0`'
  - '`largest = -1`'
  - 'The first number the user types'
  - '`largest = 100`'
answer: 2
explanation: |
  The best-so-far variable must start from something the real values can beat. If every number is negative, `0` and `-1` are bigger than all of them, so `if n > largest` is never `True` and the program prints a number nobody typed. `100` fails whenever all the numbers are smaller than it. Starting from the first real value (or from a value lower than anything possible) is safe for any input.
skills: [best-so-far]
