id: py.accumulator-patterns
kind: topic
status: ready
title: "Accumulator patterns"
summary: "Sum, count, find the max or min, and search; use break and continue."
prerequisites: [py.for-and-range]
estimated_minutes: 45
rev: 1
objectives:
  - "Keep a running total or a count: set a variable before the loop, update it inside, use it after."
  - "Find the largest or smallest value seen so far, starting from a safe value."
  - "Leave a loop early with `break`, skip to the next pass with `continue`, and loop with `while True` until the user gives a usable answer."
