id: example-total
stage: worked_example
rev: 1
title: "Numbers until zero"
prompt: |
  This program reads numbers until the user types `0`, then reports how many there were and their total. Press **Run** and type `4`, `6`, `0`. Then run it again and type `0` straight away.
steps:
  - label: "Before the loop: starting values"
    lines: "1-2"
    note: "Two accumulators, both starting at 0. They exist before the loop so that every pass can add to them."
  - label: "A loop that ends from inside"
    lines: "3-4"
    note: "`while True` would run forever, so something inside must end it. Each pass starts by asking for a number."
  - label: "The stopping signal"
    lines: "5-6"
    note: "When the user types 0, `break` leaves the loop at once. Lines 7 and 8 don't run for the 0, so it isn't counted or added."
  - label: "Inside the loop: update"
    lines: "7-8"
    note: "A real number gets here. `total` grows by the number, `count` by 1."
  - label: "After the loop: use the results"
    lines: "9"
    note: "Back at the left margin, so it runs once, after `break`. Typing 0 first prints `0 numbers, total 0`: the starting values, untouched."
