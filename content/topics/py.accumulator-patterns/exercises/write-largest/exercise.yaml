id: write-largest
stage: write
rev: 1
title: "The largest"
prompt: |
  Write a program that asks how many numbers there will be, then reads that many positive whole numbers, one per line, and prints the largest. Typing `3`, then `4`, `9`, `2`, should print:

  ```
  9
  ```
hints:
  - "A `for` loop over `range(how_many)` reads the numbers; each pass calls `int(input(...))` once."
  - "Keep the best so far in a variable that starts at 0 (every number is positive, so the first one will beat it)."
  - "Inside the loop: `if n > largest:` then `largest = n`. Print after the loop."
skills: [best-so-far]
