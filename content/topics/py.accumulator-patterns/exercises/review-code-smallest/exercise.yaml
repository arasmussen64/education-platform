id: review-code-smallest
stage: review_code
rev: 1
title: "The smallest"
prompt: |
  Write a program that reads positive whole numbers, one per line, until the user types `0`, then prints the smallest of them. Typing `3`, `8`, `2`, `0` should print:

  ```
  2
  ```
skills: [best-so-far, break-continue]
