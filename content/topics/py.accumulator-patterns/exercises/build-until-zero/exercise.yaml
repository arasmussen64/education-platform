id: build-until-zero
stage: build
rev: 1
title: "Until zero"
prompt: |
  Starting from a blank editor, write a program that reads positive whole numbers, one per line, until the user types `0`. Then it prints how many numbers were typed (not counting the `0`), their total, and the largest. Typing `4`, `9`, `2`, `0` should print:

  ```
  Count: 3
  Total: 15
  Largest: 9
  ```

  If the user types `0` straight away, all three are `0`.
skills: [running-total, best-so-far, break-continue]
