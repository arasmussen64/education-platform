id: debug-average
stage: debug
rev: 2
title: "The average"
prompt: |
  This program asks how many numbers there will be, reads that many whole numbers, and prints their average with one decimal place. Typing `3`, then `4`, `5`, `9`, should print:

  ```
  Average: 6.0
  ```

  and `2`, then `3`, `4`, should print `Average: 3.5`. Right now the first example prints `Average: 1.0`. It has three bugs. Trace it with two numbers before you run it, then fix what you find and run it again.
hints:
  - "Trace it with `2`, then `3`, `4`, in a table with a column for each name. How many numbers does it read, and what has it added up by the end?"
  - "`range` stops before its stop value, so `range(1, how_many)` runs one pass short. `range(how_many)` runs `how_many` times."
  - "A running total starts once, before the loop. Set inside the loop, it goes back to 0 on every pass, and if the loop never runs it's never made at all."
  - "`//` throws the decimals away (`7 // 2` is `3`). An average needs `/`."
skills: [running-total]
