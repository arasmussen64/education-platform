id: debug-average
stage: debug
rev: 1
title: "The average"
prompt: |
  This program asks how many numbers there will be, reads that many whole numbers, and prints their average with one decimal place. Typing `3`, then `4`, `5`, `9`, should print:

  ```
  Average: 6.0
  ```

  and `2`, then `3`, `4`, should print `Average: 3.5`. It has three bugs. Trace it with two numbers before you run it: how many times does the loop run, and what is `total` at the end?
skills: [running-total]
