id: fill-count-evens
stage: fill_in
rev: 1
title: "Count the evens"
prompt: |
  This program should ask for a whole number and print how many even numbers there are from 1 up to it. Replace each `...`: the count's starting value, and the condition that picks out an even number. Typing `10` should print:

  ```
  5
  ```
hints:
  - "A count starts at 0, before the loop."
  - "A number is even when dividing by 2 leaves no remainder: `i % 2 == 0`."
skills: [running-total]
