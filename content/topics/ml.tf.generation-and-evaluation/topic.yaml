# A planned outline for the Machine Learning Foundations track
# (docs/specs/ml-foundations.md). It becomes real content when written.
id: ml.tf.generation-and-evaluation
kind: topic
status: planned
title: Generating and judging text
summary: "Greedy decoding, temperature, top-k and nucleus sampling as choices over the same probabilities; why a small model repeats itself; held-out loss, bits per character and perplexity as the honest measure; comparing two models on the same held-out text; and what a model's samples can and can't tell you."
prerequisites:
- ml.tf.language-model
estimated_minutes: 50
rev: 1
objectives:
- "Implement greedy, temperature, top-k and nucleus decoding over one model's probabilities and say what each keeps and throws away."
- Explain why a model falls into repetition and what the decoding choice does about it.
- Compute perplexity from a held-out loss and say what it means in words.
- Compare two trained models on the same held-out text and defend the comparison.
