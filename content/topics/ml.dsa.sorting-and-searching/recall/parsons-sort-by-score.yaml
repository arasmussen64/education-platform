id: parsons-sort-by-score
type: parsons
rev: 1
prompt: |
  Put the lines in order to sort three records by their score and print the names in that order, `['bob', 'cy', 'ann']`. One line is a decoy that doesn't belong.
lines:
  - 'records = [("ann", 3), ("bob", 1), ("cy", 2)]'
  - 'by_score = sorted(records, key=lambda record: record[1])'
  - 'print([name for name, score in by_score])'
distractors:
  - 'by_score = sorted(records, key=lambda record: record[0])'
explanation: |
  `key=` names the value to sort by: `record[1]` is the score, so bob (1), cy (2), ann (3). The decoy sorts by `record[0]`, the name, which would print the names alphabetically. The key function is called once per record and the records themselves are left unchanged.
skills: [keys]
