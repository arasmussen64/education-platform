id: predict-a-binary-search
type: predict_output
rev: 1
prompt: |
  A binary search for 13 that prints every index it looks at. What does the program print?
code: |
  items = [2, 3, 5, 7, 11, 13, 17, 19]
  lo, hi = 0, len(items) - 1
  while lo <= hi:
      mid = (lo + hi) // 2
      print("looking at index", mid, "value", items[mid])
      if items[mid] == 13:
          break
      if items[mid] < 13:
          lo = mid + 1
      else:
          hi = mid - 1
expected_output: |
  looking at index 3 value 7
  looking at index 5 value 13
explanation: |
  Eight items: the middle index is `(0 + 7) // 2 = 3`, value 7, too small, so the search keeps indices 4 to 7. Their middle is `(4 + 7) // 2 = 5`, value 13: found in two looks. Each look halves what is left, which is why eight items need at most four looks (19 is found on the fourth: indices 3, 5, 6, 7) and a million need about twenty.
skills: [binary-search]
