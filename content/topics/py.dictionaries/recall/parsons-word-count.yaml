id: parsons-word-count
type: parsons
rev: 1
prompt: |
  Put the lines in order so the program prints `2`. Each line already has its indentation. One line is a decoy that doesn't belong.
lines:
  - 'counts = {}'
  - 'for word in ["a", "b", "a"]:'
  - '    counts[word] = counts.get(word, 0) + 1'
  - 'print(counts["a"])'
distractors:
  - '    counts[word] = counts[word] + 1'
explanation: |
  The dictionary starts empty. For each word, `get(word, 0)` gives the count so far, or 0 the first time, and 1 is added. `counts[word] + 1` would fail on the first word, because the key isn't there yet. After the loop, a has been counted twice.
skills: [counting, lookup-update]
