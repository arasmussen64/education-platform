id: mcq-key-error
type: mcq
rev: 1
prompt: |
  What happens here?

  ```python
  ages = {"Ada": 36}
  print(ages["Bob"])
  ```
choices:
  - 'It prints `None`'
  - 'It prints `0`'
  - 'It stops with `KeyError: ''Bob''`'
  - 'It prints `"Bob"`'
answer: 2
explanation: |
  Reading a key that isn't in the dictionary is an error, not a quiet `None`. To avoid it, check first (`if "Bob" in ages:`) or use `ages.get("Bob", 0)`, which gives the default you choose when the key is missing.
skills: [lookup-update]
