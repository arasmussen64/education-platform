id: review-predict-loop-dict
type: predict_output
rev: 1
prompt: |
  What does this program print? Four lines.
code: |
  scores = {"Ada": 91, "Bob": 78}
  for name in scores:
      print(name, scores[name])
  for name, score in scores.items():
      print(f"{name}: {score}")
expected_output: |
  Ada 91
  Bob 78
  Ada: 91
  Bob: 78
explanation: |
  Looping over a dictionary gives its keys, in the order they were added; `scores[name]` looks each value up. `items()` gives key and value together, so the second loop unpacks both at once. Two ways to the same pairs.
skills: [loop-dict]
