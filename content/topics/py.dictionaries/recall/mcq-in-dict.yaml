id: mcq-in-dict
type: mcq
rev: 1
prompt: |
  `ages` is a dictionary of names to ages. What does `"Ada" in ages` check?
choices:
  - 'Whether `"Ada"` is one of the keys'
  - 'Whether `"Ada"` is one of the values'
  - 'Whether `"Ada"` appears anywhere, as a key or a value'
  - 'The position of `"Ada"` in the dictionary'
answer: 0
explanation: |
  `in` on a dictionary looks at the keys, so it answers "is there an entry for Ada?". To ask about values, use `"Ada" in ages.values()`. Dictionaries have no positions; entries are found by key.
skills: [lookup-update]
