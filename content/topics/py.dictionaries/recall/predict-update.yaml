id: predict-update
type: predict_output
rev: 1
prompt: |
  What does this program print? Three lines. Python prints a dictionary with its braces, in the order the entries were added.
code: |
  stock = {"apples": 3, "pears": 0}
  stock["apples"] += 2
  stock["plums"] = 7
  del stock["pears"]
  print(stock)
  print(len(stock))
  print("pears" in stock)
expected_output: |
  {'apples': 5, 'plums': 7}
  2
  False
explanation: |
  `+= 2` changes the value under an existing key. Assigning to `"plums"`, a new key, adds an entry at the end. `del` removes the `"pears"` entry entirely, so `in` no longer finds that key and the dictionary has two entries.
skills: [lookup-update]
