id: review-mcq-get
type: mcq
rev: 1
prompt: |
  `counts` is a dictionary with no entry for `"x"`. What does `counts.get("x", 0)` give?
choices:
  - 'A `KeyError`'
  - '`0`'
  - '`None`'
  - '`"x"`'
answer: 1
explanation: |
  `get` looks the key up and, when it's missing, gives the default you pass instead of raising an error: here `0`. That's why `counts[ch] = counts.get(ch, 0) + 1` counts in one line: a new key starts from 0 + 1.
skills: [counting, lookup-update]
