id: build-letter-counts
stage: build
rev: 1
title: "Letter counts"
prompt: |
  Starting from a blank editor, write two functions with docstrings and a `main`:

  - `count_letters(text)` returns a dictionary of each character in the text to how many times it appears, leaving spaces out.
  - `most_common(counts)` takes such a dictionary and returns the key with the highest count. If two keys tie, return the one that comes first in the dictionary.
  - `main()` prints, for the text `banana bread`:

  ```
  Counts: {'b': 2, 'a': 4, 'n': 2, 'r': 1, 'e': 1, 'd': 1}
  Most common: a
  ```

  Call `main()` at the bottom.
skills: [counting, loop-dict, lookup-update]
