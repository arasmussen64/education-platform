id: write-word-lengths
stage: write
rev: 1
title: "Word lengths"
prompt: |
  Write a function `word_lengths(words)` that takes a list of words and returns a dictionary with each word as a key and its length as the value. `word_lengths(["hi", "hello"])` returns `{"hi": 2, "hello": 5}`, and `word_lengths([])` returns `{}`.
hints:
  - "Start with an empty dictionary, `{}`, and loop over the words."
  - "Each word becomes a key: `lengths[word] = len(word)`."
  - "Return the dictionary after the loop."
skills: [lookup-update, loop-dict]
