id: fill-count
stage: fill_in
rev: 1
title: "Count the letters"
prompt: |
  This program should count how many times each letter appears in a word, using a dictionary. Replace each `...`: what to do with a letter seen before, and what to do with one seen for the first time. Running it should print:

  ```
  {'b': 1, 'a': 3, 'n': 2}
  ```
hints:
  - "A letter that's already a key has a count to add to: `counts[ch] += 1`."
  - "A letter seen for the first time starts at 1: `counts[ch] = 1`."
skills: [counting, lookup-update]
