id: example-phonebook
stage: worked_example
rev: 1
title: "A phone book"
prompt: |
  One dictionary, and the things you do with dictionaries most: look up, add, change, check, loop. Press **Run**. Then add a third entry on line 1 and run again.
steps:
  - label: "Make it and look up by key"
    lines: "1-2"
    note: "Curly braces, and `key: value` pairs. `phone[\"Ada\"]` finds Ada's number by her name, not by a position."
  - label: "Add and change"
    lines: "3-4"
    note: "Assigning to a key that isn't there adds an entry; assigning to one that is replaces its value. Same syntax for both."
  - label: "How many, and is it there?"
    lines: "5-6"
    note: "`len` counts entries. `in` asks about the keys, so `\"Dee\" in phone` is `False`."
  - label: "Loop over the keys"
    lines: "7-8"
    note: "A `for` loop over a dictionary gives its keys, in the order they were added. Each value comes from a lookup."
