id: fill-low-stock
stage: fill_in
rev: 1
title: "Low stock"
prompt: |
  This program should go through a shop's stock, print every fruit with how many are left, and collect the names of the fruits that are running low (fewer than 5) in a list. Replace each `...`: what to loop over so that each turn gives a fruit **and** its count, which of the two to test, and which of the two to keep. Running it should print:

  ```
  apples: 3
  pears: 12
  plums: 0
  ['apples', 'plums']
  ```

  The program fails until every `...` is replaced: it stops with an error, or prints `Ellipsis` (Python's name for `...`) where a fruit's name should be.
hints:
  - "Looping over the dictionary itself gives only its keys. `stock.items()` gives each entry as a pair, the key and its value, and `for fruit, count in stock.items():` puts the two into `fruit` and `count`."
  - "The test is on the number: `count < 5`. The list collects the names: `low.append(fruit)`."
skills: [loop-dict]
