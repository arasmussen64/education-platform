id: review-code-count-words
stage: review_code
rev: 1
title: "Count the words"
prompt: |
  Write a function `word_counts(text)` that returns a dictionary of each word in the text to how many times it appears. Words are separated by spaces; `text.split()` gives them as a list. `word_counts("a b a")` returns `{"a": 2, "b": 1}`, and `word_counts("")` returns `{}`.
skills: [counting, lookup-update]
