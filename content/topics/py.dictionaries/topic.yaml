id: py.dictionaries
kind: topic
status: ready
title: "Dictionaries"
summary: "Look things up by name instead of position: create a dict, read and change it, loop over it, and count with it."
prerequisites: [py.lists]
estimated_minutes: 45
rev: 1
objectives:
  - "Make a dictionary of keys and values, look a value up by its key, add or change an entry, and check whether a key is there with `in`."
  - "Loop over a dictionary's keys, or over its keys and values together with `items()`."
  - "Count things with a dictionary: the first time a key is seen, start it at 1; after that, add 1."
