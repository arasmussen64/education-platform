id: debug-statistics-report
stage: debug
rev: 2
title: "A statistics report"
prompt: |
  This program should report the mean, the median and the standard deviation of `[15, 4, 42, 8, 23, 16]`, each to one decimal place:

  ```
  mean 18.0
  median 15.5
  spread 12.3
  ```

  Instead every line it prints is wrong. It has three bugs. Run it, fix what you find, and run it again, then run the checks, which also try other values. You're done when every check passes.
hints:
  - "Work out each statistic by hand for these six values and compare it with the line the program prints. Fix one at a time: the spread uses the mean, so it changes when the mean does."
  - "The mean is the total divided by how many values there are, `len(values)`."
  - "The median is the middle of the values in order. Sort the six values by hand: are `values[2]` and `values[3]` the middle two?"
  - "The standard deviation is the square root of the variance. `total / len(values)` is the variance: what's still missing?"
test_skills:
  test_mean: [ml.math.probability-and-statistics/center]
  test_median: [ml.math.probability-and-statistics/center]
  test_spread: [ml.math.probability-and-statistics/spread, ml.math.exponents-and-logs/powers]
  test_other_values: [ml.math.probability-and-statistics/center, ml.math.probability-and-statistics/spread]
