id: debug-slow-vms
stage: debug
runtime: lab
rev: 1
title: "Four slow VMs"
prompt: |
  Part 2 of the checkpoint. The shop runs VMs for four customers, and each has opened a ticket: their VM is slow. An on-call script saved what it could from each one at the moment its ticket came in, into `/srv/tickets/vm-a/` to `/srv/tickets/vm-d/`: the ticket in the customer's words with the VM's size, and the same set of command outputs and kernel files from every VM. `/srv/tickets/README.txt` says what each file is.

  **Four VMs, one cause each.** For each VM, write `~/diagnosis/vm-a.txt` and so on (`nano ~/diagnosis/vm-a.txt`): the cause, the one number that shows it, and the fix, each from the lists in the README. The lists are longer than what is wrong, and the README says which number goes with which cause and how exact it must be.

  The rules: answer from the evidence, not from what a ticket believes about its VM, and leave the evidence as it was saved.

  **Time yourself.** Four tickets like these should take about 40 minutes. Note the time when you open the lab's shell (`date`). Nothing stops you at 40 minutes: the target is yours to hold yourself to.

  When all four files are written, run the checks.
test_skills:
  vm-a-cause: [csa.hw.cores-memory/stolen-or-capped, csa.hw.cores-memory/burst-credits]
  vm-a-evidence: [csa.hw.cores-memory/stolen-or-capped, csa.hw.cores-memory/burst-credits]
  vm-a-fix: [csa.hw.cores-memory/stolen-or-capped, csa.hw.cores-memory/burst-credits]
  vm-b-cause: [csa.linux.cpu/throttling, csa.hw.cores-memory/stolen-or-capped]
  vm-b-evidence: [csa.linux.cpu/throttling, csa.hw.cores-memory/stolen-or-capped]
  vm-b-fix: [csa.linux.cpu/throttling, csa.hw.cores-memory/stolen-or-capped]
  vm-c-cause: [csa.linux.memory/swap-paging, csa.hw.cores-memory/stolen-or-capped]
  vm-c-evidence: [csa.linux.memory/swap-paging, csa.hw.cores-memory/stolen-or-capped]
  vm-c-fix: [csa.linux.memory/swap-paging, csa.hw.cores-memory/stolen-or-capped]
  vm-d-cause: [csa.linux.triage/first-minute, csa.hw.cores-memory/stolen-or-capped]
  vm-d-evidence: [csa.linux.triage/first-minute, csa.hw.cores-memory/stolen-or-capped]
  vm-d-fix: [csa.linux.triage/first-minute, csa.hw.cores-memory/stolen-or-capped]
  evidence-untouched: [csa.linux.shell/navigate]
