# The site's ordinary resolver (dnsmasq), the kind every network comes with:
# it answers for the site's own names and forwards everything else to the
# upstream server in upstream.conf. It has never heard of ad.clinic.test.
listen-address=127.0.0.1,10.0.9.1
bind-interfaces
no-resolv
host-record=intranet.clinic.internal,10.0.9.1
