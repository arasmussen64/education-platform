id: step-the-whole-sheet
stage: fill_in
runtime: lab
rev: 1
title: "Step 4 of the review: the whole sheet, from an outline"
prompt: |
  The checkpoint's build with nothing done for you, but an outline to work from: the five lines at the top of `~/sizing/answers.csv` are the method, one step each, as comments (lines that start with `#`, which the checks ignore). Below them, every row is empty, and so is the saving.

  Everything is where the build has it: `/srv/sizing/README.txt` (the sizing policy and how a month is costed), `/srv/sizing/prices.csv`, a `brief.txt` and a `metrics.csv` for each workload under `/srv/sizing/workloads/`, and `metric-summary FILE`. Follow the outline for each workload in turn, write its row, and end with the saving.

  Edit the sheet with `nano ~/sizing/answers.csv`. When these checks pass, try one of the checkpoint's fresh versions from a blank sheet, with no outline.
hints:
  - "Each workload is the same five steps. Start with the brief: it says which clouds it may use, whether what it runs is tied to x86, its licences, its hours and whether its peaks are short. Those decide which rows of prices.csv are even in the running."
  - "From metric-summary, the numbers that size a workload are the 95th percentile of CPU, the largest memory and, for a GPU job, the largest GPU memory. The average matters in one place only: whether a burstable size's baseline covers it."
  - "Cost every candidate the way its row will be costed: linux_hourly or windows_hourly, SQL Server Standard per vCPU on top where the brief has it (4 vCPUs at least), times the hours it runs. Then the cheapest is the answer."
  - "The saving: cost each workload's present machine the same way, add the five, and take away the total of your five rows."
