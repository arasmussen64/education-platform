id: build-stand-up-the-domain
stage: build
runtime: lab
lab:
  init: systemd
rev: 1
title: "Stand up the shop's domain"
prompt: |
  Part 3 of the checkpoint. The shop has no directory yet, and its Linux servers each keep their own list of who may log in. Two machines are ready: `dc1` (10.0.9.10), which has Samba's domain-controller software installed and nothing configured, and this server, `lab`. `on-dc COMMAND` runs a command on dc1, and dc1's service is `dc1.service` here on `lab` (`sudo systemctl ... dc1`). The site's ordinary resolver runs on `lab` (its settings are in `/etc/dnsmasq.d/`), answers for the site's own names (`intranet.shop.internal`) and forwards everything else to the internet's DNS.

  Stand up a small Active Directory domain and make `lab` its first member. There are no steps here, only what must be true when you finish:

  1. **The domain** is `ad.shop.test`, short name `SHOP`, with dc1 as its domain controller and its DNS server. Anything dc1 can't answer itself it forwards to the site's resolver, 10.0.9.1. The domain administrator's password is `Shop-Admin-1`. dc1's service is running, and starts again after a reboot.
  2. **dc1's address has a name:** asked for 10.0.9.10, the domain's DNS answers `dc1.ad.shop.test`.
  3. **The password rules for the whole domain:** at least 14 characters, and an account locks after 5 wrong passwords.
  4. **The people:** an organisational unit `Shop` holds two users, `dana` (password `Dana-Pass-12345`) and `erin` (`Erin-Pass-12345`), and a group `linux-admins`, in that unit too, with dana in it and nobody else.
  5. **A Group Policy object** called `Server baseline` is linked to the `Shop` unit.
  6. **`lab` finds the domain through the resolver it already uses,** which gets the domain's zone and its reverse zone from dc1: the domain's SRV records and the name of dc1's address both answer there, and the site's own names still resolve.
  7. **`lab` is joined to the domain,** and members of `linux-admins` can log in to it over SSH with their domain passwords, into a home directory made for them at their first login. Nobody else in the domain can log in to `lab`, by SSH or any other way: `lab` lets in the group, not a list of the people in it.
  8. **It all lasts:** every change is saved where the next boot reads it.

  The rules: nothing about dc1 is typed in by hand on `lab` (not into a hosts file, a record of the resolver's own, a Kerberos configuration or SSSD's settings), and dc1 stays as strict as it comes: it refuses passwords sent over unencrypted LDAP.

  **Time yourself.** A domain like this should be standing within 60 minutes. Note the time when you open the lab's shell (`date`). Nothing stops you at 60 minutes: the target is yours to hold yourself to.

  When all eight are true, run the checks.
test_skills:
  domain-answers: [csa.hw.windows-ad/dc-discovery, csa.hw.windows-ad/directory-structure]
  dc-forwards: [csa.hw.windows-ad/dc-discovery]
  people: [csa.hw.windows-ad/directory-structure]
  password-rules: [csa.hw.windows-ad/directory-structure]
  policy-linked: [csa.hw.domain-join/group-policy]
  finds-the-dc: [csa.hw.windows-ad/dc-discovery]
  found-through-dns: [csa.hw.windows-ad/dc-discovery]
  joined: [csa.hw.domain-join/domain-join]
  dana-logs-in: [csa.hw.domain-join/domain-join]
  group-permitted: [csa.hw.domain-join/domain-join]
  erin-kept-out: [csa.hw.domain-join/domain-join]
  dc-still-strict: [csa.hw.windows-ad/kerberos-tickets]
  fixes-last: [csa.hw.domain-join/domain-join, csa.linux.services/systemctl]
