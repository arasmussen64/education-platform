# The checks for "A sizing review, worked through".
# One check for each workload's fit and one for its price, so a failure
# points at one skill; each works out its own truth from /srv/sizing (the
# workload's metrics, the price table and the facts of its brief, written
# into the check) rather than holding an answer. The estimates and the
# saving are checked against the sizes the learner chose, so one wrong size
# fails its own checks and not the sums.
# Every sizing lab of this checkpoint has these checks, with its own
# workloads' facts.
# A check that finds something wrong prints what it found, which fails the
# comparison: it exits 0 so the checker shows that sentence.
checks:
  - id: sheet-complete
    description: "answers.csv has its header, one row for each of c1, c2, c3, each with a size from prices.csv and a monthly cost, and the saving line with a number."
    command: |
      lines=$(grep -v '^[[:space:]]*#' /home/learner/sizing/answers.csv | tr -d ' \r' | grep -v '^$')
      [ "$(echo "$lines" | head -n 1)" = "workload,instance,monthly_usd" ] || { echo "the first line is not the header workload,instance,monthly_usd"; exit 0; }
      for w in c1 c2 c3; do
        n=$(echo "$lines" | grep -c "^$w,")
        [ "$n" -eq 1 ] || { echo "answers.csv has $n rows for $w"; exit 0; }
        line=$(echo "$lines" | grep "^$w,")
        pick=$(echo "$line" | cut -d, -f2 | sed 's/^Standard_//')
        awk -F, -v i="$pick" 'NR > 1 && tolower($4) == tolower(i) {found = 1} END {exit !found}' /srv/sizing/prices.csv || { echo "$w: [$pick] is not a size in prices.csv"; exit 0; }
        echo "$line" | cut -d, -f3 | tr -d '$' | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "$w: its monthly_usd is not a number"; exit 0; }
      done
      echo "$lines" | grep '^saving,' | cut -d, -f3 | tr -d '$' | grep -Eq '^-?[0-9]+(\.[0-9]+)?$' || { echo "the saving line has no number"; exit 0; }
      echo complete
    expect:
      equals: "complete"
  - id: data-untouched
    description: "The evidence in /srv/sizing is as the review began: nothing changed, added or removed."
    command: |
      [ "$(cd /srv/sizing && find . -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" = "$(cat /usr/local/lib/lab/sizing.sha256)" ] && echo untouched || echo changed
    expect:
      equals: "untouched"
  - id: c1-fits
    description: "c1's size meets the sizing policy and c1's brief: enough vCPUs and memory for its week, on a cloud and an architecture its brief allows."
    command: |
      pick=$(grep -v '^[[:space:]]*#' /home/learner/sizing/answers.csv | tr -d ' \r' | awk -F, '$1 == "c1" {print $2; exit}' | sed 's/^Standard_//')
      m=/srv/sizing/workloads/c1/metrics.csv
      p95=$(tail -n +2 $m | cut -d, -f2 | sort -n | awk '{v[NR] = $1} END {k = NR * 95 / 100; if (k > int(k)) k = int(k) + 1; print v[k]}')
      avg=$(tail -n +2 $m | awk -F, '{t += $2} END {print t / NR}')
      peak=$(tail -n +2 $m | cut -d, -f3 | sort -n | tail -n 1)
      gpeak=0
      awk -F, -v w=c1 -v pick="$pick" -v cur=n4-standard-8 -v clouds=" gcp " -v arch=x86 -v win=0 -v sql=0 -v gpu=0 -v short=0 -v hours=730 \
        -v p95="$p95" -v avg="$avg" -v peak="$peak" -v gpeak="$gpeak" '
        function fits(r) {
          if (index(clouds, " " r[2] " ") == 0) return "is on a cloud the brief does not allow"
          if (arch != "any" && r[6] != arch) return (r[6] == "arm" ? "is an Arm size" : "is an x86 size")
          if (r[7] * 0.6 < p95 / 100 * vcpus[cur]) return "has too few vCPUs for the policy"
          if (r[8] * 0.8 < peak) return "has too little memory for the policy"
          if (gpu && r[11] == "") return "has no GPU"
          if (gpu && r[11] * 0.9 < gpeak) return "has too little GPU memory for the policy"
          if (r[12] != "" && (!short || avg / 100 * vcpus[cur] > r[12] / 100 * r[7])) return "is a burstable size the policy rules out for " w
          if (win && r[14] == "") return "has no Windows price"
          return ""
        }
        NR > 1 { vcpus[$4] = $7; if (tolower($4) == tolower(pick)) row = $0 }
        END {
          if (pick == "") { print w ": no size given"; exit }
          if (row == "") { print w ": " pick " is not a size in prices.csv"; exit }
          split(row, r, ","); why = fits(r)
          print (why == "" ? "fits" : w ": " r[4] " " why)
        }' /srv/sizing/prices.csv
    expect:
      equals: "fits"
  - id: c1-not-oversized
    description: "A month of c1's size costs at most 15% more than the cheapest size that meets the policy and c1's brief, for the hours it runs."
    command: |
      pick=$(grep -v '^[[:space:]]*#' /home/learner/sizing/answers.csv | tr -d ' \r' | awk -F, '$1 == "c1" {print $2; exit}' | sed 's/^Standard_//')
      m=/srv/sizing/workloads/c1/metrics.csv
      p95=$(tail -n +2 $m | cut -d, -f2 | sort -n | awk '{v[NR] = $1} END {k = NR * 95 / 100; if (k > int(k)) k = int(k) + 1; print v[k]}')
      avg=$(tail -n +2 $m | awk -F, '{t += $2} END {print t / NR}')
      peak=$(tail -n +2 $m | cut -d, -f3 | sort -n | tail -n 1)
      gpeak=0
      awk -F, -v w=c1 -v pick="$pick" -v cur=n4-standard-8 -v clouds=" gcp " -v arch=x86 -v win=0 -v sql=0 -v gpu=0 -v short=0 -v hours=730 \
        -v p95="$p95" -v avg="$avg" -v peak="$peak" -v gpeak="$gpeak" '
        function fits(r) {
          if (index(clouds, " " r[2] " ") == 0) return "is on a cloud the brief does not allow"
          if (arch != "any" && r[6] != arch) return (r[6] == "arm" ? "is an Arm size" : "is an x86 size")
          if (r[7] * 0.6 < p95 / 100 * vcpus[cur]) return "has too few vCPUs for the policy"
          if (r[8] * 0.8 < peak) return "has too little memory for the policy"
          if (gpu && r[11] == "") return "has no GPU"
          if (gpu && r[11] * 0.9 < gpeak) return "has too little GPU memory for the policy"
          if (r[12] != "" && (!short || avg / 100 * vcpus[cur] > r[12] / 100 * r[7])) return "is a burstable size the policy rules out for " w
          if (win && r[14] == "") return "has no Windows price"
          return ""
        }
        function cost(r,  p) {
          if (win && r[14] == "") return -1
          p = (win ? r[14] : r[13])
          if (sql) p += rate[r[2]] * (r[7] < 4 ? 4 : r[7])
          return p * hours
        }
        BEGIN { rate["aws"] = 0.12; rate["azure"] = 0.10; rate["gcp"] = 0.12; best = -1 }
        NR > 1 { vcpus[$4] = $7; rows[NR] = $0; if (tolower($4) == tolower(pick)) row = $0 }
        END {
          if (row == "") { print w ": [" pick "] is not a size in prices.csv"; exit }
          for (i in rows) {
            split(rows[i], r, ",")
            if (fits(r) == "") { c = cost(r); if (best < 0 || c < best) best = c }
          }
          split(row, r, ","); c = cost(r)
          if (c < 0) { print w ": " r[4] " has no price for the licences " w " needs"; exit }
          if (c <= best * 1.15) print "within 15%"
          else printf "%s: %s costs %.0f%% more a month than the cheapest size that meets the policy and the brief\n", w, r[4], (c / best - 1) * 100
        }' /srv/sizing/prices.csv
    expect:
      equals: "within 15%"
