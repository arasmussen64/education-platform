  - id: estimates-right
    description: "Every row's monthly_usd is within 15% of what a month of the size chosen costs, for the hours the workload runs, licences included."
    command: |
      cost() {
        awk -F, -v i="$1" -v win="$2" -v sql="$3" -v hours="$4" '
          BEGIN { rate["aws"] = 0.12; rate["azure"] = 0.10; rate["gcp"] = 0.12 }
          NR > 1 && tolower($4) == tolower(i) {
            if (win && $14 == "") exit
            c = (win ? $14 : $13); if (sql) c += rate[$2] * ($7 < 4 ? 4 : $7)
            printf "%.4f\n", c * hours; exit
          }' /srv/sizing/prices.csv
      }
      field() { grep -v '^[[:space:]]*#' /home/learner/sizing/answers.csv | tr -d ' \r$' | awk -F, -v w="$1" -v f="$2" '$1 == w {print $f; exit}'; }
      for spec in c1:0:0:730 c2:1:1:730 c3:0:0:90; do
        IFS=: read -r w win sql hours <<< "$spec"
        pick=$(field "$w" 2 | sed 's/^Standard_//'); said=$(field "$w" 3)
        real=$(cost "$pick" "$win" "$sql" "$hours")
        [ -n "$real" ] || { echo "$w: [$pick] is not a size in prices.csv with a price for its licences"; exit 0; }
        awk -v said="$said" -v t="$real" 'BEGIN {d = said - t; exit !(said ~ /^[0-9]+(\.[0-9]+)?$/ && d <= 0.15 * t && d >= -0.15 * t)}' \
          || { echo "$w: [$said] a month is not within 15% of what $pick costs for the hours $w runs, licences included"; exit 0; }
      done
      echo "all within 15%"
    expect:
      equals: "all within 15%"
  - id: saving-right
    description: "The saving is within 15% of what the workloads cost a month on the machines they run on now, minus what the sizes chosen cost."
    command: |
      cost() {
        awk -F, -v i="$1" -v win="$2" -v sql="$3" -v hours="$4" '
          BEGIN { rate["aws"] = 0.12; rate["azure"] = 0.10; rate["gcp"] = 0.12 }
          NR > 1 && tolower($4) == tolower(i) {
            if (win && $14 == "") exit
            c = (win ? $14 : $13); if (sql) c += rate[$2] * ($7 < 4 ? 4 : $7)
            printf "%.4f\n", c * hours; exit
          }' /srv/sizing/prices.csv
      }
      field() { grep -v '^[[:space:]]*#' /home/learner/sizing/answers.csv | tr -d ' \r$' | awk -F, -v w="$1" -v f="$2" '$1 == w {print $f; exit}'; }
      total=0
      for spec in c1:n4-standard-8:0:0:730 c2:r7i.2xlarge:1:1:730 c3:g5.xlarge:0:0:90; do
        IFS=: read -r w now win sql hours <<< "$spec"
        then=$(cost "$now" "$win" "$sql" "$hours")
        pick=$(field "$w" 2 | sed 's/^Standard_//')
        new=$(cost "$pick" "$win" "$sql" "$hours")
        [ -n "$new" ] || { echo "the saving can only be checked once every row names a size in prices.csv with a price for its licences"; exit 0; }
        total=$(awk -v t="$total" -v a="$then" -v b="$new" 'BEGIN {printf "%.4f", t + a - b}')
      done
      said=$(field saving 3)
      awk -v said="$said" -v t="$total" 'BEGIN {
        if (said !~ /^-?[0-9]+(\.[0-9]+)?$/) { print "the saving [" said "] is not a number"; exit }
        d = said - t; if (d < 0) d = -d; m = (t < 0 ? -t : t)
        if (d <= 0.15 * m) print "within 15%"; else print "the saving [" said "] is not within 15% of what the workloads cost now minus what the sizes chosen cost"
      }'
    expect:
      equals: "within 15%"
