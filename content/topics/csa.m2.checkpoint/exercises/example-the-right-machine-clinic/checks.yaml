      peak=$(tail -n +2 $m | cut -d, -f3 | sort -n | tail -n 1)
      gpeak=$(tail -n +2 $m | cut -d, -f5 | sort -n | tail -n 1)
      awk -F, -v w=c3 -v pick="$pick" -v cur=g5.xlarge -v clouds=" aws azure gcp " -v arch=x86 -v win=0 -v sql=0 -v gpu=1 -v short=0 -v hours=90 \
        -v p95="$p95" -v avg="$avg" -v peak="$peak" -v gpeak="$gpeak" '
        function fits(r) {
          if (index(clouds, " " r[2] " ") == 0) return "is on a cloud the brief does not allow"
