# plan is docs/plans/cloud-module-2/MODULE-2-BRIEF.md, section 5: three parts
# in three slots (prove.build, prove.debug and prove.more, ADR-0012 as
# amended 2026-11-11), each a lab proven locally and for free.
#
# Facts, each read on 2026-11-11, with where (the labs' README.txt files say
# the same to the learner):
# - Every price in part 1's prices.csv, on-demand, for Linux and with
#   Windows Server included: AWS's public price files for US East (N.
#   Virginia), Linux, Windows and Windows with SQL Server Standard
#   (https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ec2-ondemand-without-sec-sel/US%20East%20(N.%20Virginia)/Linux/index.json
#   and its Windows siblings, published 2026-11-10T17:38:52Z); the Azure
#   Retail Prices API, https://prices.azure.com/api/retail/prices, East US,
#   pay-as-you-go; Google Cloud's
#   https://cloud.google.com/products/compute/pricing/general-purpose and
#   .../accelerator-optimized, Iowa (us-central1). Each matched the
#   module's November fixture where both have a row.
# - Licence rates: SQL Server Standard $0.12 a vCPU-hour on AWS (each
#   "Windows with SQL Std" price is the Windows price plus 0.12 x the
#   vCPUs, 4 at least: m7i.large $0.6728 against $0.1928); $0.10 on Azure
#   (the "SQL Server Standard" licence meters: "1-4 vCPU VM" $0.40, 8 vCPUs
#   $0.80, 16 vCPUs $1.60); $0.12 a core on Google Cloud, "Instances with
#   fewer than 4 vCPUs will be charged for 4 vCPUs", and Windows Server
#   $0.046 a visible vCPU (https://cloud.google.com/compute/disks-image-pricing).
# - Sizes, memory and baselines: AWS's accelerated table (g4dn 16 GiB, g5
#   and g6 22 GiB, g6e 44 GiB a card,
#   https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html); AWS's
#   burstable concepts page (t3.medium 24 credits an hour, t3.large 36:
#   baselines 20% and 30%,
#   https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-credits-baseline-concepts.html);
#   Microsoft Learn's size pages for Bsv2 (B2ts_v2 20%, B2ls_v2 30%,
#   B2s_v2 40%, B4ls_v2 30%, B4s_v2 40%), Esv5, Dpsv6, NCasT4_v3 (16 GB T4,
#   28 GiB), NC_A100_v4 (80 GB, 220 GiB) and NVadsA10_v5 (24 GB, 440 GiB),
#   under https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/.
#   Azure's first B-series (B1s, B2s, B2ms) is End of Life and is left out
#   of the table; the burstable Azure rows are Bsv2.
# - samba-tool refuses a domain minimum password length above 14 ("Minimum
#   password length must be in the range of 0 to 14!"), tried in part 3's
