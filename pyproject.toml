[project]
name = "education-platform-tools"
version = "0.0.0"
description = "Python tooling for the learning platform: the shared test harness and, later, the content validator."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
# This is a set of tools, not a library to publish.
package = false

[tool.pytest.ini_options]
testpaths = ["harness/tests"]

[tool.ruff]
target-version = "py314"
# Scenario files are learner code and include deliberate mistakes.
extend-exclude = ["harness/scenarios", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
