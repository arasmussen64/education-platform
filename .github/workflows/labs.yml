# Proves every lab's contract in Docker (ADR-0018), on pull requests that
# touch the labs or the checker. It's the slowest check (a quarter of an
# hour for eighty labs on one machine), so the labs are split by topic
# across eight machines, each warming the layer its topics share once; and
# it doesn't run for a change to the web app, the docs, or a Python topic:
# every lab lives under a cloud topic (csa.*). The pristine container must
# not pass, the solution must, every known-wrong fix must not. The last job,
# "Labs", is the one check everything else waits for; it passes only when
# every share did.
#
# It also runs once a week on main, with nobody having changed anything.
# Every lab's image is built from ubuntu:24.04 and whatever packages apt
# serves that day, so a new base image or package can break a lab that no
# pull request touched; the learner would otherwise be the one to find out,
# mid-topic. The weekly run builds every image from nothing (a fresh machine
# has no cache), so it sees what a learner building today would get. When it
# fails, GitHub emails whoever last changed the schedule line below, and the
# run shows red under the Actions tab. Two things to know: scheduled runs
# are free on a public repository, and GitHub switches a schedule off after
# 60 days with no activity in the repository (it says so by email, and one
# click in the Actions tab switches it back on).
name: Labs

on:
  pull_request:
    paths:
      - "content/topics/csa.*/**"
      - "content/lab-bases/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/labs.yml"
  schedule:
    # Mondays at 04:23 UTC: an odd minute, because GitHub delays or drops
    # scheduled runs at busy times such as the top of the hour.
    - cron: "23 4 * * 1"
  # And by hand: the "Run workflow" button under the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  share:
    name: Labs (share ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Change the N in --shard below with this list.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      # setup-uv only publishes exact version tags (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Prove this share of the labs' contracts in Docker
        run: uv run python tools/labcheck.py test --all --jobs 4 --shard ${{ matrix.shard }}/8

  labs:
    name: Labs
    needs: share
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every share must have passed
        run: |
          echo "the shares finished with: ${{ needs.share.result }}"
          test "${{ needs.share.result }}" = "success"
