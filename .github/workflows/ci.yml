# Runs on every pull request. A pull request can only be merged with
# confidence when this passes. There is no second run on main after a merge:
# the pull request already ran on that very commit, and GitHub Actions
# minutes are limited on a private repository (ADR-0005: free tiers only).
# The labs, which take the longest, run from labs.yml only when they or the
# checker change.
name: CI

on:
  pull_request:

permissions:
  contents: read

# If new commits arrive, cancel the older run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  harness:
    name: Python harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv only publishes exact version tags (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest

  content:
    name: Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv only publishes exact version tags (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Check every topic, exercise and recall item
        run: uv run python tools/validate_content.py

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the Supabase CLI
        run: npm ci
      - name: Start a throwaway database with every migration applied
        run: npx supabase db start
      - name: Check the SQL
        run: npm run db:lint
      - name: Test
        run: npm run db:test

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Deno and the Supabase CLI
        run: npm ci
      - name: Type-check and test the AI proxy
        run: npm run fn:test
